<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fang-Labor</title>
<meta name="description" content="Testseite für Glühwürmchen: vier Varianten, wann sich ein Glühwürmchen fangen lässt, nebeneinander. 30-Sekunden-Nächte mit Messwerten zum Vergleich.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@500;600;700&display=swap">
<style>
:root{
  --night:#0b1226; --panel:rgba(12,19,40,.86); --line:rgba(255,207,107,.22); --ink:#eef1e6; --muted:#9aa6c2; --glow:#d8ff6a; --warm:#ffcf6b;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ui:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
button{font-family:var(--ui);cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;pointer-events:auto;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

#top{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;pointer-events:none}
#tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#tabs b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.tab{border:1px solid rgba(255,255,255,.2);background:transparent;border-radius:999px;padding:5px 11px;font-size:15px;font-weight:700}
.tab[aria-pressed="true"]{background:var(--warm);border-color:var(--warm);color:#23190a}
#desc{flex:1;min-width:260px;font-size:15px;line-height:1.4;color:#d7dccb}
#desc strong{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:21px;color:var(--warm);line-height:1.15}

#stats{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);min-width:230px;font-variant-numeric:tabular-nums}
#stats .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
#stats .clock{font-family:var(--serif);font-style:italic;font-weight:600;font-size:30px;line-height:1}
#snd{border:1px solid rgba(255,255,255,.2);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--muted)}
#stats .grid{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:15px}
#stats .grid span:nth-child(even){text-align:right;font-weight:700}
#stats .best{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
#stats .best div{display:flex;justify-content:space-between;gap:10px}

#floats{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;color:var(--glow);text-shadow:0 0 10px rgba(216,255,106,.6);white-space:nowrap;animation:fl 1.1s forwards;transform:translate(-50%,-50%)}
.fl.warm{color:var(--warm);text-shadow:0 0 12px rgba(255,207,107,.7);font-size:26px}
@keyframes fl{0%{opacity:0;margin-top:6px}15%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-30px}}

#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(22px,6vw,30px);color:var(--ink);text-shadow:0 0 18px rgba(0,0,0,.8);pointer-events:none;text-align:center;animation:breathe 2.4s ease-in-out infinite;width:min(90vw,520px)}
@keyframes breathe{50%{opacity:.55}}

#result{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,9,20,.5)}
#result .note{width:min(400px,100%);padding:20px 22px;background:rgba(16,24,46,.95)}
#result h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:30px;line-height:1.1;margin:0 0 10px;color:var(--warm);text-wrap:balance}
#result p{margin:0 0 14px;font-size:16px;line-height:1.45;color:#d7dccb}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:0;border-radius:999px;padding:11px 16px;font-size:17px;font-weight:700;background:var(--warm);color:#23190a}
.btn.alt{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.35)}

@media (max-width:560px){
  #top{left:10px;right:10px;gap:6px}
  .tab{font-size:14px;padding:5px 9px}
  #desc{min-width:0;flex-basis:100%;font-size:14px;padding:6px 10px}
  #desc strong{font-size:18px}
  #stats{position:static;flex-basis:100%;min-width:0;padding:6px 10px;display:flex;align-items:center;gap:10px}
  body.running #desc{display:none}
  #stats .head{margin:0;flex-direction:column;align-items:flex-start;gap:3px}
  #stats .clock{font-size:22px}
  #snd{font-size:11px;padding:2px 7px}
  #stats .grid{flex:1;grid-template-columns:repeat(4,1fr);gap:0 8px;font-size:12px;color:var(--muted)}
  #stats .grid span:nth-child(odd){grid-row:1}
  #stats .grid span:nth-child(even){grid-row:2;text-align:left;font-size:16px;color:var(--ink)}
  #stats .best{display:none}
}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.01s}#hint{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="floats"></div>
<div id="top">
  <div class="note" id="tabs"><b>Variante</b>
    <button class="tab" data-v="old" aria-pressed="false">Vorher</button>
    <button class="tab" data-v="worth" aria-pressed="false">A</button>
    <button class="tab" data-v="shy" aria-pressed="false">B</button>
    <button class="tab" data-v="pull" aria-pressed="false">C</button>
  </div>
  <div class="note" id="desc"></div>
  <div class="note" id="stats">
  <div class="head"><div class="clock" id="sClock">0:30</div><button id="snd" type="button">Klang: Glas</button></div>
  <div class="grid">
    <span>Fänge</span><span id="sCaught">0</span>
    <span>im Leuchten</span><span id="sLit">–</span>
    <span>Licht</span><span id="sLight">0</span>
    <span>längste Pause</span><span id="sGap">–</span>
  </div>
  <div class="best" id="sBest"></div>
  </div>
</div>
<div id="hint">Tippe oder klicke, und die Nacht beginnt</div>
<div id="result" hidden><div class="note">
  <h2 id="rTitle">Die Nacht ist um</h2>
  <p id="rText"></p>
  <div class="row"><button class="btn" id="rNext" type="button">Nächste Variante</button><button class="btn alt" id="rAgain" type="button">Noch eine Nacht</button></div>
</div></div>

<script>
'use strict';
/* ============================================================
   FANG-LABOR: Wann lässt sich ein Glühwürmchen fangen?
   Vier Regeln auf derselben Wiese, 30 Sekunden pro Nacht.
   Kulisse und Glühwürmchen stammen aus playground/gluehwuermchen.html.
   ============================================================ */
const $ = id => document.getElementById(id);
const cv = $('c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const lerp = (a,b,t) => a+(b-a)*t, clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const de = (x, d=1) => x.toFixed(d).replace('.', ',');

const VARIANTS = {
  old:   { tab:'Vorher', name:'Vorher', text:'Wie im Prototyp: Ein Glühwürmchen lässt sich nur fangen, solange es leuchtet. Dunkle fliegen durchs Glas hindurch.' },
  worth: { tab:'A', name:'A · Leuchten zählt', text:'Jedes Glühwürmchen lässt sich jederzeit fangen. Erwischst du eins, während es leuchtet, bringt es ×3 und klingt heller. Das Glas fasst nur 8, also lohnt es sich, die leuchtenden zu jagen.' },
  shy:   { tab:'B', name:'B · Scheu im Dunkeln', text:'Jedes lässt sich fangen, aber dunkle weichen dem Glas aus. Leuchtende werden träge und sind leichte Beute. Mit Schwung erwischst du auch dunkle.' },
  pull:  { tab:'C', name:'C · Lichtsog', text:'Jedes lässt sich fangen. Leuchtet eins in der Nähe des Glases auf, fliegt es von selbst hinein.' }
};
const ORDER = ['old','worth','shy','pull'];
let variant = 'old';
try { variant = localStorage.getItem('glow_labor_v') || 'old'; } catch(e){}
if(!VARIANTS[variant]) variant = 'old';
let best = {};
try { best = JSON.parse(localStorage.getItem('glow_labor_best') || '{}') || {}; } catch(e){}
let sound = 'glass';
try { sound = localStorage.getItem('glow_labor_snd') || 'glass'; } catch(e){}

// eine Wiese im mittleren Spiel: 16 Glühwürmchen, Glas für 8, Blinken wie im Prototyp
const ROUND = 30, CAP = 8, R = 34, LIT = .3;
let POP = 16;   // auf dem Handy weniger, sonst ist die Wiese dreimal so dicht
const SHY_R = R*2.6, SHY_V = 170, PULL_R = R*3.4, PULL_V = 260;

/* ---------- Klang ---------- */
let AC = null, master = null, cricketGain = null, noiseBuf = null;
function audio(){
  if(AC) return; try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value = .8;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  master.connect(comp).connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  // Grillen: gefiltertes Rauschen, rhythmisch moduliert
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 4600; f.Q.value = 18;
  const am = AC.createGain(); am.gain.value = 0;
  const lfo = AC.createOscillator(); lfo.frequency.value = 22; const lg = AC.createGain(); lg.gain.value = .5; lfo.connect(lg).connect(am.gain);
  const lfo2 = AC.createOscillator(); lfo2.frequency.value = .7; const lg2 = AC.createGain(); lg2.gain.value = .5; lfo2.connect(lg2).connect(am.gain);
  cricketGain = AC.createGain(); cricketGain.gain.value = .02;
  src.connect(f).connect(am).connect(cricketGain).connect(master); src.start(); lfo.start(); lfo2.start();
}
function tone(freq, vol, dur, type, delay){
  if(!AC) return; const t = AC.currentTime + (delay||0); const o = AC.createOscillator(); o.type = type||'sine'; o.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05);
}
function nz(dur, type, f, q, vol, attack, delay){
  const t = AC.currentTime + (delay||0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + (attack||.001)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl).connect(g).connect(master); s.start(t, Math.random()*1.5); s.stop(t + dur + .02);
}
// ein kleines Einmachglas: unharmonische Teiltöne, kurzer Nachklang, ein Klick beim Anschlag
function glass(f0, vol, len, dull){
  const t = AC.currentTime, out = AC.createGain(); out.gain.value = 1;
  if(dull){ const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; out.connect(lp).connect(master); } else out.connect(master);
  for(const [m, v, d] of [[1,1,1],[2.76,.45,.55],[5.4,.2,.3]]){
    const o = AC.createOscillator(); o.frequency.value = f0*m;
    const g = AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol*v, t+.003); g.gain.exponentialRampToValueAtTime(.0001, t+len*d);
    o.connect(g).connect(out); o.start(t); o.stop(t+len*d+.03);
  }
  if(!dull) nz(.006, 'highpass', 5200, .7, vol*.7);
}
const SCALE = [0,2,4,7,9,12,14,16,19,21];
let bellN = 0, lastBank = 0;
function sndCatch(lit, strong){
  if(!AC) return;
  if(sound==='bell'){ const n = SCALE[bellN++ % SCALE.length], f = 880*Math.pow(2,n/12); tone(f, strong?.09:.07, .5); tone(f*2, .02, .3); return; }
  const j = .93 + Math.random()*.14;
  if(strong){ glass(2350*j, .1, .8); tone(4700*j, .012, .6, 'sine', .04); tone(5600*j, .008, .5, 'sine', .08); }
  else if(variant==='worth') glass(1250*j, .07, .16, true);
  else glass(1900*j, .08, .45);
}
function sndBank(i){
  if(!AC) return;
  if(sound==='bell'){ tone(523*Math.pow(2,SCALE[i%6]/12), .04, .4, 'triangle'); return; }
  if(AC.currentTime - lastBank < .03) return; lastBank = AC.currentTime;
  nz(.09, 'bandpass', 700 + (i%8)*90, 2.5, .07, .02);
}
function sndLantern(){ if(!AC) return; nz(.5, 'lowpass', 500, .7, .12, .12); tone(196, .03, 1.2, 'sine', .05); }
function sndFull(){ if(!AC) return; if(sound==='bell'){ tone(330,.05,.25,'triangle'); tone(247,.05,.3,'triangle',.08); return; } glass(900, .06, .2, true); setTimeout(() => AC && glass(880, .05, .2, true), 90); }
function sndDawn(){ if(!AC) return; tone(392,.05,1.5,'sine'); tone(587,.035,1.8,'sine',.1); }

/* ---------- Glüh-Sprites ---------- */
function glowSprite(rgb){
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const grd = g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,'rgba(255,255,240,1)'); grd.addColorStop(.12,`rgba(${rgb},1)`); grd.addColorStop(.35,`rgba(${rgb},.35)`); grd.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle = grd; g.fillRect(0,0,64,64); return c;
}
const GLOW = { n: glowSprite('200,255,90'), w: glowSprite('255,200,110') };

/* ---------- Kulisse ---------- */
let scene = null;
function makeScene(){
  const rnd = (() => { let a = 12345; return () => { a = (a*1103515245+12345) & 0x7fffffff; return a/0x7fffffff; }; })();
  const stars = []; for(let i=0;i<Math.round(W*H/2600);i++) stars.push({ x:rnd()*W, y:rnd()*H*.55, s:rnd()*1.4+.3, tw:rnd()*6 });
  const hill = (base, amp, f, ph) => { const pts = []; for(let x=0;x<=W+20;x+=20) pts.push([x, H*base - Math.sin(x/W*f*6.28+ph)*H*amp - Math.sin(x/W*f*2.1*6.28+ph*2)*H*amp*.4]); return pts; };
  const trees = [], U = Math.min(H, Math.max(W, H*.75));   // im Hochformat bleiben die Bäume gedrungen
  const addTree = (x, h, w) => trees.push({x, h, w});
  addTree(W*.04, U*.52, U*.14); addTree(W*.13, U*.4, U*.1); addTree(W*.93, U*.5, U*.16); addTree(W*.84, U*.36, U*.09);
  const blades = []; for(let x=0;x<W;x+=4){ blades.push({ x: x + rnd()*4, h: 10 + rnd()*H*.06, ph: rnd()*6, lean:(rnd()-.5)*.4 }); }
  scene = { stars, far: hill(.62,.04,1.3,.5), near: hill(.72,.03,2.1,2.2), trees, blades, lantern: { x: W*(W<520?.18:.14), y: H*.8 } };
}
function resize(){ DPR = Math.min(2, window.devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; POP = clamp(Math.round(W*H/60000), 9, 16); makeScene(); }
addEventListener('resize', resize);

/* ---------- Zustand ---------- */
let flies = [], motes = [], round = null;
const ptr = { tx:-200, ty:-200, has:false, touch:false };
const jar = { x:-200, y:-200, n:0, val:0, inside:[] };

function newFly(x, y){
  return { x: x ?? Math.random()*W, y: y ?? H*(.86 + Math.random()*.06), a: Math.random()*6.283, sp: 34 + Math.random()*16,
    ph: Math.random(), T: 2.2 + Math.random()*1.4, fx:0, fy:0, caught:false, flyT:0 };
}
// Helligkeit 0..1 aus der Phase: kurzes Aufleuchten, dann dunkel
function bright(f){ const p = f.ph % 1, on = .38; return p < on ? Math.sin(p/on*Math.PI) : 0; }
const catchable = f => variant!=='old' || bright(f) > .45;

function newRound(){
  round = { t:0, started:false, over:false, caught:0, lit:0, light:0, gap:0, maxGap:0, banked:0, fullWarn:-9, bankT:0 };
  flies = []; for(let i=0;i<POP;i++) flies.push(newFly(Math.random()*W, H*(.3 + Math.random()*.55)));
  jar.n = 0; jar.val = 0; jar.inside = []; motes = [];
  $('result').hidden = true; $('hint').hidden = false; document.body.classList.remove('running');
  updateStats();
}
function startRound(){ if(!round.started && !round.over){ round.started = true; $('hint').hidden = true; document.body.classList.add('running'); } }

/* ---------- Update ---------- */
function update(dt){
  const live = round.started && !round.over;
  if(live) round.t += dt;
  const tx = ptr.tx, ty = ptr.ty - (ptr.touch ? 46 : 0);
  jar.x += (tx - jar.x) * Math.min(1, dt*18); jar.y += (ty - jar.y) * Math.min(1, dt*18);

  for(const f of flies){
    if(f.caught){ f.flyT += dt; continue; }
    f.ph = (f.ph + dt/f.T) % 1;
    f.a += (Math.random()-.5) * dt * 5;
    const lit = bright(f) > LIT;
    const sp = variant==='shy' && lit ? f.sp*.3 : f.sp;
    let vx = Math.cos(f.a)*sp, vy = Math.sin(f.a)*sp*.7;
    if(f.y < H*.24) vy += 30; if(f.y > H*.9) vy -= 40;
    if(f.x < 20) vx += 30; if(f.x > W-20) vx -= 30;
    // B: dunkle weichen aus. C: leuchtende zieht es ins Glas.
    let ex = 0, ey = 0;
    if(live && jar.n < CAP){
      const dx = f.x - jar.x, dy = f.y - jar.y, d = Math.hypot(dx, dy) || 1;
      if(variant==='shy' && !lit && d < SHY_R){ const s = 40 + SHY_V*(1 - d/SHY_R); ex = dx/d*s; ey = dy/d*s; }
      if(variant==='pull' && lit && d < PULL_R){ const s = 60 + PULL_V*(1 - d/PULL_R); ex = -dx/d*s; ey = -dy/d*s; }
    }
    const k = Math.min(1, dt*8); f.fx += (ex - f.fx)*k; f.fy += (ey - f.fy)*k;
    f.x = clamp(f.x + (vx + f.fx)*dt, 4, W-4); f.y = clamp(f.y + (vy + f.fy)*dt, H*.12, H*.95);
  }

  if(live){
    for(const f of flies){
      if(f.caught || Math.hypot(f.x - jar.x, f.y - jar.y) >= R || !catchable(f)) continue;
      if(jar.n >= CAP){ if(round.t - round.fullWarn > 1.5){ round.fullWarn = round.t; floatText(jar.x, jar.y - 50, 'Glas voll!', 'warm'); sndFull(); } continue; }
      catchFly(f);
    }
    const alive = flies.filter(f => !f.caught).length;
    for(let i=alive;i<POP;i++) flies.push(newFly());
    flies = flies.filter(f => !(f.caught && f.flyT > .35));
    // Laterne: Glas leeren
    const ln = scene.lantern, atLantern = Math.hypot(jar.x - ln.x, jar.y - (ln.y - 40)) < 62;
    if(jar.n > 0 && atLantern){
      round.bankT -= dt;
      if(round.bankT <= 0){
        round.bankT = .06; const v = jar.inside.pop().v; jar.val -= v; jar.n--; round.light += v; round.banked++;
        sndBank(round.banked); motes.push({ x:jar.x, y:jar.y, tx:ln.x, ty:ln.y-40, t:0, life:.4, c:'n', home:true });
        if(jar.n===0){ floatText(ln.x, ln.y-90, 'Laterne gefüllt', 'warm'); sndLantern(); }
      }
    }
    // Pause: Zeit ohne Fang, solange das Glas Platz hat und nicht an der Laterne steht
    if(jar.n < CAP && !atLantern){ round.gap += dt; round.maxGap = Math.max(round.maxGap, round.gap); }
    if(round.t >= ROUND){ round.t = ROUND; finish(); }
  }
  for(const m of motes){ m.t += dt; if(!m.home){ m.x += m.vx*dt; m.y += m.vy*dt; m.vx *= .96; m.vy *= .96; } }
  motes = motes.filter(m => m.t < m.life);
}
function catchFly(f){
  const lit = bright(f) > LIT, strong = variant==='worth' && lit, v = strong ? 3 : 1;
  f.caught = true; f.flyT = 0; f.cx = f.x; f.cy = f.y;
  jar.n++; jar.val += v; jar.inside.push({ ox:(Math.random()-.5)*.6, oy:(Math.random()-.5)*.7, ph:Math.random(), v, lit });
  round.caught++; if(lit) round.lit++; round.gap = 0;
  sndCatch(lit, strong);
  if(variant==='worth'){
    if(strong) floatText(f.x, f.y - 20, '×3', 'warm');
    if(strong) for(let i=0;i<10;i++){ const a = i/10*6.283; motes.push({ x:f.x, y:f.y, vx:Math.cos(a)*120, vy:Math.sin(a)*120, t:0, life:.45, c:'n' }); }
  }
}
function finish(){
  round.over = true;
  // was noch im Glas ist, zählt mit: im Labor geht es ums Fangen, nicht um den Heimweg
  round.light += jar.val;
  const prev = best[variant];
  if(!prev || round.caught > prev.caught){ best[variant] = { caught:round.caught, light:round.light }; try{ localStorage.setItem('glow_labor_best', JSON.stringify(best)); }catch(e){} }
  sndDawn();
  const V = VARIANTS[variant], share = round.caught ? Math.round(100*round.lit/round.caught) : 0;
  $('rTitle').textContent = `${V.name}: ${round.caught} gefangen`;
  $('rText').textContent = `${share} % davon im Leuchten, ✦ ${round.light} Licht, längste Pause ${de(round.maxGap)} s. Wie hat es sich angefühlt? Musstest du warten oder konntest du einfach loslegen?`;
  $('rNext').textContent = 'Weiter mit ' + VARIANTS[ORDER[(ORDER.indexOf(variant)+1) % ORDER.length]].tab;
  $('result').hidden = false; document.body.classList.remove('running'); updateStats();
}

/* ---------- Anzeige ---------- */
function updateStats(){
  const left = Math.max(0, ROUND - round.t);
  $('sClock').textContent = '0:' + String(Math.ceil(left)).padStart(2,'0');
  $('sCaught').textContent = round.caught;
  $('sLit').textContent = round.caught ? Math.round(100*round.lit/round.caught) + ' %' : '–';
  $('sLight').textContent = round.light + jar.val;
  $('sGap').textContent = round.started ? de(round.maxGap) + ' s' : '–';
  $('sBest').innerHTML = '<div><span>Bestwerte</span><span>Fänge · Licht</span></div>' + ORDER.map(v => `<div><span>${VARIANTS[v].name}</span><span>${best[v] ? best[v].caught + ' · ' + best[v].light : '–'}</span></div>`).join('');
  $('snd').textContent = 'Klang: ' + (sound==='bell' ? 'Glöckchen' : 'Glas');
}
function floatText(x, y, txt, cls){
  const f = $('floats'); if(f.children.length > 14) f.firstChild.remove();
  const d = document.createElement('div'); d.className = 'fl ' + (cls||''); d.textContent = txt; d.style.left = clamp(x, 80, W-80)+'px'; d.style.top = clamp(y, 60, H-30)+'px'; f.appendChild(d); setTimeout(() => d.remove(), 1100);
}

/* ---------- Render ---------- */
function skyColors(n){
  const K = [ [0, [38,44,92], [196,110,90]], [.15, [11,16,40], [26,34,70]], [.85, [10,15,38], [24,32,66]], [1, [44,52,100], [214,140,120]] ];
  let i = 0; while(i < K.length-2 && n > K[i+1][0]) i++;
  const a = K[i], b = K[i+1], t = clamp((n - a[0])/(b[0]-a[0]), 0, 1);
  return [ a[1].map((v,j)=>Math.round(lerp(v,b[1][j],t))), a[2].map((v,j)=>Math.round(lerp(v,b[2][j],t))) ];
}
function render(now){
  cx.setTransform(DPR,0,0,DPR,0,0);
  const n = .18 + .72*round.t/ROUND, t = now/1000;
  const [top, hor] = skyColors(n);
  const sky = cx.createLinearGradient(0,0,0,H*.72); sky.addColorStop(0, `rgb(${top})`); sky.addColorStop(1, `rgb(${hor})`);
  cx.fillStyle = sky; cx.fillRect(0,0,W,H);
  const starA = n < .15 ? n/.15 : n > .85 ? (1-n)/.15 : 1;
  cx.fillStyle = '#fffbe8';
  for(const s of scene.stars){ cx.globalAlpha = starA * (.5 + .5*Math.sin(t*1.3 + s.tw)); cx.fillRect(s.x, s.y, s.s, s.s); }
  cx.globalAlpha = 1;
  const mx = lerp(W*.15, W*.85, n), my = H*(.28 - .18*Math.sin(n*Math.PI));
  const mg = cx.createRadialGradient(mx,my,0,mx,my,60); mg.addColorStop(0,'rgba(255,250,220,.25)'); mg.addColorStop(1,'rgba(255,250,220,0)'); cx.fillStyle = mg; cx.fillRect(mx-60,my-60,120,120);
  cx.fillStyle = '#f6f0d6'; cx.beginPath(); cx.arc(mx,my,14,0,6.283); cx.fill();
  const drawHill = (pts, col) => { cx.fillStyle = col; cx.beginPath(); cx.moveTo(0,H); for(const [x,y] of pts) cx.lineTo(x,y); cx.lineTo(W,H); cx.closePath(); cx.fill(); };
  drawHill(scene.far, '#0e1730'); drawHill(scene.near, '#0a1124');
  cx.fillStyle = '#060b18';
  for(const tr of scene.trees){ const by = H*.8; cx.fillRect(tr.x - tr.w*.04, by - tr.h*.5, tr.w*.08, tr.h*.5);
    for(let k=0;k<4;k++){ const r = tr.w*(.5 - k*.08), yy = by - tr.h*(.45 + k*.17); cx.beginPath(); cx.ellipse(tr.x + Math.sin(k*2.1)*tr.w*.08, yy, r, r*.7, 0, 0, 6.283); cx.fill(); } }
  // Lichterkette zwischen den Bäumen
  const x0 = scene.trees[1].x, x1 = scene.trees[3].x, y0 = H*.8 - scene.trees[1].h*.75, y1 = H*.8 - scene.trees[3].h*.75, NB = 12;
  cx.strokeStyle = 'rgba(20,20,20,.9)'; cx.lineWidth = 1.2; cx.beginPath();
  for(let i=0;i<=40;i++){ const u=i/40, x=lerp(x0,x1,u), y=lerp(y0,y1,u) + Math.sin(u*Math.PI)*H*.07; i?cx.lineTo(x,y):cx.moveTo(x,y); } cx.stroke();
  cx.globalCompositeOperation = 'lighter';
  for(let i=0;i<NB;i++){ const u=(i+.5)/NB, x=lerp(x0,x1,u), y=lerp(y0,y1,u) + Math.sin(u*Math.PI)*H*.07 + 4; cx.globalAlpha = .7 + .25*Math.sin(t*2 + i); cx.drawImage(GLOW.w, x-12, y-12, 24, 24); }
  cx.globalAlpha = 1;
  // Laterne
  const ln = scene.lantern, lb = Math.min(1, .2 + Math.log10(1 + round.light)/2.2);
  const lg = cx.createRadialGradient(ln.x, ln.y-40, 0, ln.x, ln.y-40, 60 + 140*lb); lg.addColorStop(0, `rgba(255,200,110,${.25+.35*lb})`); lg.addColorStop(1,'rgba(255,200,110,0)'); cx.fillStyle = lg; cx.fillRect(ln.x-220, ln.y-260, 440, 440);
  cx.globalCompositeOperation = 'source-over';
  cx.fillStyle = '#05080f'; cx.fillRect(ln.x-3, ln.y-30, 6, H*.2 + 30);
  cx.fillStyle = '#10141c'; cx.fillRect(ln.x-17, ln.y-64, 34, 6); cx.fillRect(ln.x-14, ln.y-22, 28, 5);
  cx.fillStyle = `rgba(255,214,130,${.35+.6*lb})`; cx.fillRect(ln.x-13, ln.y-58, 26, 36);
  cx.strokeStyle = '#10141c'; cx.lineWidth = 2; cx.strokeRect(ln.x-13, ln.y-58, 26, 36);
  if(round.started && !round.over && jar.n >= CAP){ cx.strokeStyle = `rgba(255,207,107,${.4+.4*Math.sin(t*6)})`; cx.lineWidth = 2; cx.beginPath(); cx.arc(ln.x, ln.y-40, 62, 0, 6.283); cx.stroke(); }

  // Glühwürmchen
  cx.globalCompositeOperation = 'lighter';
  for(const f of flies){
    let x = f.x, y = f.y, b = bright(f);
    if(f.caught){ const u = Math.min(1, f.flyT/.35); x = lerp(f.cx, jar.x, u*u); y = lerp(f.cy, jar.y, u*u); b = 1 - u*.3; }
    const s = 22 * (.35 + b);
    if(b > .05){ cx.globalAlpha = Math.min(1, b + .1); cx.drawImage(GLOW.n, x - s, y - s, s*2, s*2); }
    else { cx.globalAlpha = .16; cx.drawImage(GLOW.n, x - 7, y - 7, 14, 14); }
    cx.globalAlpha = .55; cx.fillStyle = '#bfe86a'; cx.fillRect(x-1, y-1, 2, 2);
  }
  for(const m of motes){ const u = m.t/m.life; let x = m.x, y = m.y; if(m.home){ x = lerp(m.x, m.tx, u); y = lerp(m.y, m.ty, u) - Math.sin(u*Math.PI)*30; } cx.globalAlpha = 1-u*.6; const s = m.home ? 10 : 7; cx.drawImage(GLOW[m.c], x-s, y-s, s*2, s*2); }
  cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';

  // Gras im Vordergrund
  cx.strokeStyle = '#050a12'; cx.lineWidth = 2; cx.beginPath();
  for(const b of scene.blades){ const sw = Math.sin(t*1.2 + b.ph + b.x*.01)*4 + b.lean*b.h; cx.moveTo(b.x, H); cx.quadraticCurveTo(b.x + sw*.3, H - b.h*.5, b.x + sw, H - b.h); } cx.stroke();

  if(ptr.has) drawJar(jar.x, jar.y, t);
}
function drawJar(x, y, t){
  const w = R*1.25, h = R*1.6;
  cx.strokeStyle = 'rgba(255,255,255,.12)'; cx.setLineDash([3,6]); cx.lineWidth = 1; cx.beginPath(); cx.arc(x, y, R, 0, 6.283); cx.stroke(); cx.setLineDash([]);
  if(variant==='pull'){ cx.strokeStyle = 'rgba(216,255,106,.06)'; cx.beginPath(); cx.arc(x, y, PULL_R, 0, 6.283); cx.stroke(); }
  const fill = jar.n / CAP;
  if(jar.n){ cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = .25 + .5*fill; cx.drawImage(GLOW.n, x - w*1.4, y - h*1.1, w*2.8, h*2.2); cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over'; }
  cx.fillStyle = 'rgba(190,220,255,.08)'; cx.strokeStyle = 'rgba(220,235,255,.55)'; cx.lineWidth = 1.8;
  cx.beginPath(); if(cx.roundRect) cx.roundRect(x - w/2, y - h/2 + h*.12, w, h*.88, R*.3); else cx.rect(x - w/2, y - h/2 + h*.12, w, h*.88); cx.fill(); cx.stroke();
  cx.fillStyle = '#6b6f78'; cx.fillRect(x - w*.42, y - h/2, w*.84, h*.14);
  cx.globalCompositeOperation = 'lighter';
  for(const q of jar.inside){
    const b = .5 + .5*Math.sin(t*3 + q.ph*6), px = x + q.ox*w*.8, py = y + h*.08 + q.oy*h*.6, strong = q.v > 1, s = strong ? 11 : 8;
    cx.globalAlpha = strong ? .8 + .2*b : variant==='worth' ? .3 + .2*b : .6 + .4*b;
    cx.drawImage(strong ? GLOW.w : GLOW.n, px-s, py-s, s*2, s*2);
  }
  cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
}

/* ---------- Eingabe ---------- */
function setPtr(e){ ptr.tx = e.clientX; ptr.ty = e.clientY; ptr.touch = e.pointerType !== 'mouse'; if(!ptr.has){ jar.x = ptr.tx; jar.y = ptr.ty - (ptr.touch?46:0); ptr.has = true; } }
cv.addEventListener('pointermove', setPtr);
cv.addEventListener('pointerdown', e => { audio(); setPtr(e); startRound(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { audio(); setVariant(t.dataset.v); }));
$('rAgain').onclick = () => newRound();
$('rNext').onclick = () => setVariant(ORDER[(ORDER.indexOf(variant)+1) % ORDER.length]);
$('snd').onclick = () => { audio(); sound = sound==='bell' ? 'glass' : 'bell'; try{ localStorage.setItem('glow_labor_snd', sound); }catch(e){} updateStats(); sndCatch(true, variant==='worth'); };
function setVariant(v){
  variant = v; try{ localStorage.setItem('glow_labor_v', v); }catch(e){}
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', t.dataset.v===v));
  $('desc').innerHTML = `<strong>${VARIANTS[v].name}</strong>${VARIANTS[v].text}`;
  newRound();
}

/* ---------- Loop ---------- */
let lt = performance.now(), statT = 0;
function frame(now){
  const dt = Math.min(1/30, (now-lt)/1000) || 1/60; lt = now;
  update(dt); render(now);
  if((statT += dt) > .1){ statT = 0; updateStats(); }
  requestAnimationFrame(frame);
}
resize(); setVariant(variant);
requestAnimationFrame(frame);
window.LAB = { get round(){return round}, get flies(){return flies}, get variant(){return variant}, get scene(){return scene}, jar, ptr, update, setVariant, startRound, bright, catchable, CAP, R, ROUND };
</script>
</body>
</html>
