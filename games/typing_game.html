<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regatta - a typing race on the river</title>
<meta name="description" content="A typing game about speed and accuracy: every letter you type is a stroke of the oars. Race three crews down the river, catch a crab on every typo, and climb from Novice to Olympic.">
<meta name="theme-color" content="#0d2f31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --water:#0f3a3b; --water-deep:#0a2a2c; --bank:#08201f;
  --paper:#f2ead9; --paper-edge:#e2d7bf; --ink:#16302f; --ink-faint:rgba(22,48,47,.52);
  --rose:#d8475a; --rose-soft:rgba(216,71,90,.16); --ochre:#e0a63c; --corn:#86a8e8; --bone:#ece4d2;
  --on-water:#e9e2d0; --on-water-dim:rgba(233,226,208,.62);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--water-deep);color:var(--on-water);font-family:var(--serif);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 24px;min-height:100%;display:flex;flex-direction:column}
@media (min-width:641px){header{margin-bottom:10px}}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;height:58px;padding-top:14px}
.mark{font-style:italic;font-weight:600;font-size:28px;letter-spacing:.01em;color:var(--on-water)}
.mark i{color:var(--rose);font-style:normal}
.meta{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--on-water-dim)}
.bar{display:inline-block;width:44px;height:3px;background:rgba(233,226,208,.18);vertical-align:middle;margin-left:6px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rose)}
.meta .nx{font-size:14px;margin-left:6px}
.meta b{color:var(--on-water);font-weight:600}
.mute{background:none;border:0;color:var(--on-water-dim);font:inherit;cursor:pointer;padding:6px;border-radius:6px;line-height:0}
.mute:focus-visible{outline:2px solid var(--on-water)}
.mute svg{width:20px;height:20px}
#river{position:relative;height:clamp(150px,58vh,540px);margin:8px -16px 0;}
#river canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.card{position:relative;margin-top:14px;background:var(--paper);color:var(--ink);border-radius:4px;
  box-shadow:0 1px 0 var(--paper-edge) inset,0 18px 40px -18px rgba(0,0,0,.6);padding:22px 28px 18px;cursor:text}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink-faint);margin-bottom:8px;height:26px}
.cardhead{position:relative}
.cardhead .hint{font-style:italic;color:var(--ink);transition:opacity .12s;position:absolute;left:0;top:0;white-space:nowrap}
.cardhead .live{margin-left:auto;white-space:nowrap}
.cardhead .live{font-family:var(--mono);font-size:15px;color:var(--ink-faint)}
.cardhead .live b{font:600 19px var(--serif);margin-right:4px}
.cardhead .live em{font:600 19px var(--serif);font-style:normal;color:var(--ink)}
.cardhead .live .up{color:#1f6b4f}.cardhead .live .dn{color:var(--rose)}
.viewport.gone{opacity:0;transition:opacity .3s ease}
.viewport::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--lh) * .7);background:linear-gradient(rgba(242,234,217,0),var(--paper));pointer-events:none}
.viewport{transition:opacity .25s ease .1s;position:relative;overflow:hidden;height:calc(var(--lh) * 3);--lh:42px}
#text{font-family:var(--mono);font-size:25px;line-height:var(--lh);color:var(--ink-faint);transition:transform .28s cubic-bezier(.2,.7,.2,1);will-change:transform;word-break:normal}
#text .w{white-space:nowrap}
#text .c{position:relative}
#text .c.d{color:var(--ink)}
#text .c.e{color:var(--rose);text-decoration:underline 2px var(--rose);text-underline-offset:6px}
#text .c.cur::before{content:"";position:absolute;left:-1px;top:18%;height:64%;width:2px;background:var(--rose);border-radius:1px;animation:blink 1.05s steps(1) infinite}
#text.typing .c.cur::before{animation:none}
#text .c.cur.miss{color:#fff;animation:shake .18s ease-out}
#text .c.cur.miss::after{content:"";position:absolute;inset:6% -1px;background:var(--rose);border-radius:2px;z-index:-1}
#text .c{z-index:0}
@keyframes blink{50%{opacity:0}}
@keyframes shake{0%{transform:translateX(0)}30%{transform:translateX(-3px)}65%{transform:translateX(2px)}100%{transform:translateX(0)}}
.result{position:absolute;inset:0;padding:20px 28px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:center;
  background:var(--paper);border-radius:4px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.7,.2,1)}
.result:not(.on){transition:none}
.result.on{opacity:1;transform:none;pointer-events:auto}
.place{grid-row:1 / span 3;font-style:italic;font-weight:600;font-size:96px;line-height:.9;color:var(--ink);letter-spacing:-.02em}
.place sup{font-size:.36em;vertical-align:.95em;margin-left:2px}
.place.p1{color:var(--rose)}
.result .place{transform:scale(.7);opacity:0;transition:transform .5s cubic-bezier(.3,1.5,.5,1) .12s,opacity .25s ease .12s;transform-origin:30% 60%}
.result.on .place{transform:none;opacity:1}
.verdict{font-size:22px;font-style:italic;color:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:4px 22px;font-family:var(--mono);font-size:15px;color:var(--ink-faint)}
.nums b{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--ink);margin-right:4px}
.nums .pb{color:var(--rose);font-family:var(--serif);font-style:italic;font-size:16px;align-self:center}
.times{display:flex;flex-wrap:wrap;gap:2px 18px;font:15px var(--mono);color:var(--ink-faint)}
.times .me{color:var(--ink);font-weight:500}
.place{grid-row:1 / span 4 !important}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--ink-faint)}
.foot q{color:var(--ink);font-family:var(--mono);quotes:"\201C" "\201D"}
.btns{display:flex;gap:8px;align-items:center}
.tolog{font:500 16px var(--serif);background:none;border:1px solid var(--paper-edge);color:var(--ink);border-radius:3px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tolog:hover{border-color:var(--ink-faint)}
.tolog kbd{font:500 12px var(--mono);opacity:.5;margin-left:8px}
@media (max-width:640px){.tolog kbd{display:none}.tolog{padding:9px 11px;font-size:15px}}
.again{font:600 17px var(--serif);background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:11px 18px;cursor:pointer;white-space:nowrap;transition:transform .12s ease,background .2s}
.again:hover{background:#21433f}
.again:active{transform:scale(.97)}
.again kbd{font:500 12px var(--mono);opacity:.6;margin-left:8px}
.again:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;caret-color:transparent;pointer-events:none}
.div-note{color:var(--rose);font-style:italic}
/* the log */
.logbtn{display:flex;align-items:center;gap:6px;line-height:1;font:500 15px var(--serif);color:var(--on-water-dim)}
.logbtn:hover,.mute:hover{color:var(--on-water)}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(4,18,18,0);pointer-events:none;transition:background .3s ease}
.sheet.on{background:rgba(4,18,18,.62);pointer-events:auto}
.sheetin{width:100%;max-width:780px;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:6px;padding:22px 28px 20px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7);opacity:0;transform:translateY(24px) scale(.985);transition:opacity .25s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet.on .sheetin{opacity:1;transform:none}
.sheethead{display:flex;justify-content:space-between;align-items:baseline}
.sheethead h2{margin:0;font:italic 600 30px var(--serif)}
.close{background:none;border:0;font:300 34px/1 var(--serif);color:var(--ink-faint);cursor:pointer;padding:0 4px}
.close:hover{color:var(--ink)}
.close:focus-visible{outline:2px solid var(--rose);border-radius:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 8px}
.tile{border-top:1px solid var(--paper-edge);padding-top:8px}
.tile .k{font-size:13px;color:var(--ink-faint);font-style:italic}
.tile .v{font:600 30px var(--serif);line-height:1.15}
.tile .v small{font:400 13px var(--mono);color:var(--ink-faint);margin-left:4px}
.tile .d{font:13px var(--mono);color:var(--ink-faint)}
.tile .d.up{color:#1f6b4f}.tile .d.dn{color:var(--rose)}
.chart{position:relative;margin-top:8px}
#lSvg{display:block;width:100%;height:260px;overflow:visible}
#lSvg text{font:12px var(--mono);fill:rgba(22,48,47,.55)}
#lSvg .band text{font:italic 13px var(--serif);fill:rgba(22,48,47,.6)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font:13px/1.45 var(--mono);padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .12s}
.tip b{font:600 16px var(--serif)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--ink-faint);margin-top:6px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.k-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(22,48,47,.55)}
.k-win{width:8px;height:8px;border-radius:50%;background:var(--rose)}
.k-avg{width:18px;height:2.5px;background:var(--ink);border-radius:2px}
.k-best{width:18px;border-top:2px dashed rgba(216,71,90,.7)}
.lnote{font-style:italic;color:var(--ink-faint);margin:10px 0 0;font-size:15px}
@media (max-width:640px){
  .sheet{align-items:flex-end;padding:0}
  .sheetin{border-radius:10px 10px 0 0;padding:16px 16px 22px;max-height:92%}
  .sheethead h2{font-size:24px}
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px 14px;margin-top:10px}
  .tile .v{font-size:24px}
  #lSvg{height:200px}
  .logbtn span{display:none}
}
@media (prefers-reduced-motion:reduce){.sheet,.sheetin{transition:none}}
@media (max-width:640px){
  header{height:46px;padding-top:10px}
  .mark{font-size:23px}
  .meta{font-size:13px;gap:8px}
  #river{height:220px;margin-top:2px}
  .card{margin:10px -6px 0;padding:14px 16px 12px}
  .cardhead{font-size:12.5px;margin-bottom:6px}
  .viewport{--lh:30px}
  #text{font-size:18px}
  .result{padding:12px 16px;gap:2px 16px}
  .place{font-size:64px;grid-row:1 / span 2}
  .verdict{font-size:17px}
  .nums{font-size:12.5px;gap:2px 14px}
  .nums b{font-size:21px}
  .foot{grid-column:1 / -1;font-size:13px}
  .again{padding:10px 14px;font-size:16px}
  .again kbd{display:none}
  #best,.meta .dw{display:none}
  .times{display:none}
}
@media (max-width:640px){ .result .foot{margin-top:2px} }
@media (min-width:641px){ .result .foot{grid-column:2} }
@media (prefers-reduced-motion:reduce){
  #text,.result{transition:none}
  #text .c.cur.miss{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Regatta<i>.</i></div>
    <div class="meta"><span id="division"><b>Novice</b></span><span id="best"></span>
      <button class="mute logbtn" id="logbtn" aria-label="Your log" title="Your log (L after a race)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><circle cx="20" cy="6" r="1.2" fill="currentColor"/></svg><span>Log</span>
      </button>
      <button class="mute" id="mute" aria-label="Sound on" title="Sound (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="cross" d="M17 9l5 6M22 9l-5 6" style="display:none"/></svg>
      </button>
    </div>
  </header>
  <div id="river" aria-hidden="true"><canvas id="cv"></canvas></div>
  <section class="card" id="card" aria-label="Passage">
    <div class="cardhead"><span class="hint" id="hint">Type the passage. Each letter is a stroke.</span><span class="live" id="live"></span></div>
    <div class="viewport" id="vp"><div id="text" aria-live="off"></div></div>
    <div class="result" id="result" role="status" aria-live="polite">
      <div class="place" id="rPlace">1<sup>st</sup></div>
      <div class="verdict" id="rVerdict"></div>
      <div class="nums" id="rNums"></div>
      <div class="times" id="rTimes"></div>
      <div class="foot"><span id="rFoot"></span><span class="btns"><button class="tolog" id="tolog">Your log<kbd>L</kbd></button><button class="again" id="again">Row again<kbd>Enter</kbd></button></span></div>
    </div>
  </section>
</div>
<div class="sheet" id="log" role="dialog" aria-modal="true" aria-labelledby="logTitle" aria-hidden="true">
  <div class="sheetin">
    <div class="sheethead"><h2 id="logTitle">Your log</h2><button class="close" id="logClose" aria-label="Close log">&times;</button></div>
    <div class="tiles" id="lTiles"></div>
    <div class="chart" id="lChart"><svg id="lSvg" role="img" aria-label="Words per minute, race by race"></svg><div class="tip" id="lTip"></div></div>
    <div class="legend" id="lLegend"><span><i class="k-dot"></i>each race</span><span><i class="k-win"></i>a win</span><span><i class="k-avg"></i>10-race average</span><span><i class="k-best"></i>best so far</span></div>
    <p class="lnote" id="lNote"></p>
  </div>
</div>
<input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="Type the passage">

<script id="core">
// Regatta core: passages, rival crews, the race (a letter is a stroke, a wrong key is a crab), results, ladder and saves. No DOM.
const REGATTA = (() => {
  const PASSAGES = [
    "The river was still at six, and the mist lay on it like a sheet nobody had folded. Somewhere upstream a coach was shouting numbers through a megaphone.",
    "Rowing is the only sport in which you cross the finish line backwards and have to trust the people behind you to tell you where it is.",
    "She kept a jar of buttons on the windowsill, sorted by nothing at all, because she liked the sound they made when the jar was turned over.",
    "A good stroke begins long before the blade goes in. It begins in the legs, in the patience of the slide, in waiting for the boat to come to you.",
    "The baker on the corner opens at five, and by half past the queue is already round the post box. Nobody talks much before the first loaf.",
    "Every map is a little bit wrong. The trick is to know which parts, and to carry a pencil for the day you find out the hard way.",
    "He planted the tomatoes too close together again, as he did every spring, and every summer he swore he would give them more room next year.",
    "Quiet water is a mirror until the first boat goes through it. After that it remembers every crew for a minute or two, then forgets them all.",
    "The night train left on time, which surprised everyone on the platform, including the guard, who had to run the last few steps to catch it.",
    "If you want to learn a new language, read children's books in it first. They are short, they repeat themselves, and they always have a happy ending.",
    "The lighthouse keeper's log was mostly weather: wind from the west, rain at noon, a fishing boat late home and a long, ordinary, grateful night.",
    "On the morning of the race the boathouse smelled of varnish and wet rope. Eight pairs of hands lifted the shell, and it rose like it weighed nothing.",
    "Bees can recognise faces, count to four and tell one painter from another. They are also, by every account, very bad at forgiving a slammed door.",
    "Cast iron pans get better the more you use them. Wash them gently, dry them on the stove, and never let anyone talk you into soaking one overnight.",
    "The old clock in the hall ran seven minutes fast, and the whole family had quietly agreed to live seven minutes in the future rather than fix it.",
    "Swallows leave in September and come back in April, to the same barn and sometimes to the same nail under the same beam. Nobody told them where.",
    "Typing well is mostly not looking. Your fingers know where the letters live; the hard part is believing them when your eyes want to check.",
    "At the bend the river narrows, the current quickens, and the crews who stayed calm in the first half find out what that calm was worth.",
    "My grandmother wrote every recipe on a card and then ignored the card. A pinch meant whatever her hand said it meant on that particular day.",
    "There is a moment in any long climb when the top stops being a hope and becomes a fact, and the last hundred metres are the easiest of all.",
    "Snow fell all night and the town woke up quiet. The buses were late, the schools were shut, and every child in the street was outside by eight.",
    "A cox is the smallest person in the boat and the only one facing forward. It is a strange job, half navigator and half the voice of everyone's doubt.",
    "Good bread needs four things: flour, water, salt and time. The first three are cheap. The fourth is the one most recipes forget to mention.",
    "The museum kept a whale skeleton in the main hall, hung from the ceiling on steel wires, and children lay on the floor beneath it to look up.",
    "Some islands can only be reached at low tide. You walk across the sand with one eye on your watch, and the sea comes back exactly when it said.",
    "The best crews look slow from the bank. Nothing splashes, nobody rushes, and the boat simply keeps running between strokes as if pulled on a string.",
    "When the power went out we found candles in the kitchen drawer, played cards by the window and agreed it was the best evening in a month.",
    "A kettle on the stove, a dog asleep by the door and rain against the glass: some afternoons ask for nothing more than to be left exactly as they are.",
    "The finish is marked by a small hut, a judge with a flag and a bell that rings once for every crew. It sounds the same whether you won or lost.",
    "Paper boats float better than you would think. Fold them tight, crease every edge with a thumbnail, and launch them where the current is gentle.",
    "Long before clocks, sailors measured speed by throwing a log over the side on a knotted rope and counting the knots that ran out through their hands.",
    "The library was open late on Thursdays, and in winter it was the warmest room in the village, full of people pretending they had come for the books.",
  ];
  const CREWS = [
    {name:'Wren', col:'#e0a63c'}, {name:'Heron', col:'#86a8e8'}, {name:'Otter', col:'#ece4d2'},
    {name:'Grebe', col:'#9fcf9a'}, {name:'Swift', col:'#c9a0dc'}, {name:'Coot', col:'#f0c7a0'},
  ];
  const DIVISIONS = [[0,'Novice'],[25,'Club'],[40,'Senior'],[55,'Elite'],[75,'Olympic']];
  const PACE = [0.92, 1.0, 1.07];       // rivals relative to the player's rating: one to beat, one to match, one to chase
  const SURGE = 0.6;                    // rivals' position wobble, in characters of amplitude per stroke cycle (< 1 keeps them monotone)
  const START_RATING = 40;        // the average typist (Dhakal et al., CHI 2018: 136 million keystrokes)

  function rng(seed) { let s = (seed >>> 0) || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
  const division = r => { let d = DIVISIONS[0][1]; for (const [at, n] of DIVISIONS) if (r >= at) d = n; return d; };
  const norm = ch => ch === '’' || ch === '‘' ? "'" : ch === '“' || ch === '”' ? '"' : ch === ' ' ? ' ' : ch;

  // passage order: a seeded shuffle, unseen ones first
  function pickPassage(seed, seen) {
    const r = rng(seed), ids = PASSAGES.map((_, i) => i);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const fresh = ids.filter(i => !seen.includes(i));
    return (fresh.length ? fresh : ids.filter(i => i !== seen[seen.length - 1]))[0];
  }

  function newRace(seed, rating, seen = []) {
    const r = rng(seed ^ 0x5bd1e995), pid = pickPassage(seed, seen), text = PASSAGES[pid];
    const pool = CREWS.slice(); for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const rivals = PACE.map((k, i) => {
      const wpm = Math.max(10, rating * k * (0.97 + r() * 0.06));
      return {name: pool[i].name, col: pool[i].col, wpm, cps: wpm * 5 / 60, freq: 0.55 + r() * 0.25, phase: r() * 6.283};
    });
    return {seed, pid, text, rivals, typed: 0, keys: 0, errors: 0, start: null, finish: null, missAt: [], wordT: []};
  }

  // characters a rival has covered t ms after the start: a steady pace with a stroke surge that never runs backwards
  function rivalChars(rv, t) {
    if (t <= 0) return 0;
    const s = t / 1000, w = 6.2832 * rv.freq, amp = Math.min(SURGE, 0.9 * rv.cps / w);
    return rv.cps * s + amp * (Math.sin(w * s + rv.phase) - Math.sin(rv.phase));
  }
  function rivalFinish(rv, len) {   // ms at which a rival covers `len` characters
    let lo = 0, hi = 1000 * (len / rv.cps + 5);
    for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (rivalChars(rv, m) >= len) hi = m; else lo = m; }
    return hi;
  }

  // a key at time t (ms, any clock). Returns {ok, started, done, word}
  function key(race, ch, t) {
    if (race.finish !== null) return {ok: false, ignored: true};
    ch = norm(ch);
    const out = {ok: false, started: false, done: false};
    if (race.start === null) { race.start = t; out.started = true; race.wordStart = t; }
    race.keys++;
    const want = race.text[race.typed];
    if (ch === want) {
      race.typed++; out.ok = true;
      if (want === ' ' || race.typed === race.text.length) {

    const b = svg.getBoundingClientRect(), x = e.clientX - b.left;
    const i = Math.max(0, Math.min(n - 1, Math.round(n === 1 ? 0 : (x - L) / (W - L - Rr) * (n - 1)))), r = p.rows[i];
    hl.setAttribute('cx', X(i)); hl.setAttribute('cy', Y(r.wpm)); hl.setAttribute('opacity', 1);
    const date = r.t ? new Date(r.t).toLocaleDateString(undefined, {day: 'numeric', month: 'short'}) : '';
    const tip = $('lTip');
    tip.innerHTML = `<b>${Math.round(r.wpm)}</b> wpm · ${Math.floor(r.acc * 100)}%<br>${r.place ? ordinal(r.place) + ' place' : 'old Typing Game'}${date ? ' · ' + date : ''}`;
    tip.style.left = Math.max(70, Math.min(b.width - 70, X(i))) + 'px'; tip.style.top = Y(r.wpm) - 6 + 'px'; tip.style.opacity = 1;
  };
  svg.onpointerleave = () => { hl.setAttribute('opacity', 0); $('lTip').style.opacity = 0; };
}
addEventListener('resize', () => { if (logOpen) drawLog(); });

// ---------- the river ----------
// Everything on the water lives in metres along a 2000 m course; a camera follows the race and only translates it.
// Ground-fixed things (buoys every 12.5 m, reeds, distance boards, puddles) move 1:1 with the camera; the current's
// streaks drift a little on top of that; nothing is re-sampled per frame.
const COURSE = 2000;
const cv = $('cv'), cx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, rivalViews = [];
const puddles = [], splash = [], rings = [];
const cam = {m: -40, v: 0};
function resize() {
  const r = $('river').getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
}
addEventListener('resize', () => { resize(); if (race) scrollText(); });
const hash = (a, b) => { let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

function geom() {
  const phone = W < 640, tb = phone ? 40 : Math.round(Math.min(84, H * 0.17)), bb = phone ? 22 : Math.round(Math.min(46, H * 0.09));
  const laneH = (H - tb - bb) / 4;
  const names = phone ? 58 : 118, view = phone ? 260 : Math.min(460, 300 + W * 0.12);
  const scale = (W - names) / view, L = Math.min(laneH * 2.7, phone ? 100 : 180);
  return {phone, tb, bb, w0: tb, w1: H - bb, laneH, names, view, scale, L, lane: i => tb + laneH * (i + 0.5), X: m => names + (m - cam.m) * scale};
}

// The scenery is drawn from the ground's own grid: each kind of thing has a cell size in metres, and whether a cell holds
// one (and its size, shade, offset) comes from a hash of the cell index, so it is the same thing every frame and only slides.
const CROWD = ['#d8475a', '#e0a63c', '#86a8e8', '#ece4d2', '#9fcf9a', '#c9a0dc', '#f0c7a0', '#5b7fa8'];
function tree(x, y, r, k) {           // a canopy from above: shadow, three lobes, light from the upper left
  cx.fillStyle = 'rgba(0,0,0,.28)'; cx.beginPath(); cx.ellipse(x + r * 0.35, y + r * 0.4, r * 1.05, r * 0.9, 0, 0, 6.283); cx.fill();
  const lobes = [[0, 0, 1], [-0.55, 0.15, 0.72], [0.5, 0.25, 0.68]];
  cx.fillStyle = k > 0.5 ? '#1f4a35' : '#22503a';
  for (const [dx, dy, s] of lobes) { cx.beginPath(); cx.arc(x + dx * r, y + dy * r, r * s, 0, 6.283); cx.fill(); }
  cx.fillStyle = k > 0.5 ? '#2c6146' : '#33694a';
  for (const [dx, dy, s] of lobes) { cx.beginPath(); cx.arc(x + dx * r - r * s * 0.22, y + dy * r - r * s * 0.25, r * s * 0.62, 0, 6.283); cx.fill(); }
  cx.fillStyle = 'rgba(190,220,160,.16)'; cx.beginPath(); cx.arc(x - r * 0.35, y - r * 0.4, r * 0.32, 0, 6.283); cx.fill();
}
function roof(x, y, w, h, col) {      // a pitched roof from above, ridge along its length
  cx.fillStyle = 'rgba(0,0,0,.3)'; cx.fillRect(x + 3, y + 4, w, h);
  cx.fillStyle = col; cx.fillRect(x, y, w, h);
  cx.fillStyle = 'rgba(255,255,255,.12)'; cx.fillRect(x, y, w, h / 2);
  cx.fillStyle = 'rgba(0,0,0,.25)'; cx.fillRect(x, y + h / 2 - 0.5, w, 1);
}

function drawWater(t, g) {
  const m0 = cam.m - 30, m1 = cam.m + g.view + 30, cells = (size, fn) => { for (let c = Math.floor(m0 / size); c <= Math.ceil(m1 / size); c++) fn(c, c * size); };
  const S = g.scale;
  // water
  const grd = cx.createLinearGradient(0, g.w0, 0, g.w1); grd.addColorStop(0, '#0d3436'); grd.addColorStop(0.45, '#134243'); grd.addColorStop(1, '#0e3739');
  cx.fillStyle = grd; cx.fillRect(0, g.w0, W, g.w1 - g.w0);
  // tree reflections darken the water under the far bank
  cells(14, (c, m) => { const h = hash(c, 11); if (h > 0.55) return; const r = (g.phone ? 9 : 16) * (0.8 + h * 0.6);
    cx.fillStyle = 'rgba(2,20,18,.28)'; cx.beginPath(); cx.ellipse(g.X(m + h * 8), g.w0 + r * 0.25, r * 1.1, r * 0.6, 0, 0, 6.283); cx.fill(); });
  // current streaks drift downstream; sun glints stay put and twinkle
  const drift = reduce.matches ? 0 : t / 1000 * 1.2;
  cx.strokeStyle = 'rgba(233,226,208,.06)'; cx.lineWidth = 1;
  for (let row = 0; row < 10; row++) for (let c = Math.floor((m0 + drift) / 40) - 1; c <= Math.ceil((m1 + drift) / 40); c++) {
    const hs = hash(c + 1000, row); if (hs > 0.5) continue;
    const m = c * 40 + hash(c, row + 50) * 30 - drift, y = g.w0 + (row + 0.2 + hash(row, c) * 0.6) * (g.w1 - g.w0) / 10;
    const x = g.X(m); cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + (6 + hs * 24) * S, y); cx.stroke();
  }
  for (let row = 0; row < 14; row++) cells(5, (c, m) => {
    const h = hash(c + 77, row + 300); if (h > 0.07) return;
    const a = reduce.matches ? 0.35 : Math.max(0, Math.sin(t / 1000 * (1.2 + h * 20) + c * 1.7 + row)) * 0.55;
    if (a < 0.05) return;
    const y = g.w0 + (row + 0.5) * (g.w1 - g.w0) / 14;
    cx.fillStyle = `rgba(255,244,214,${a})`; cx.fillRect(g.X(m + h * 60), y, g.phone ? 4 : 6, 1.2);
  });

  // the far bank: meadow, trees, boathouses at the start, a crowd thickening toward the line, the towpath at the water
  const tb = g.tb, path = g.phone ? 6 : 10;
  const bg = cx.createLinearGradient(0, 0, 0, tb); bg.addColorStop(0, '#10291f'); bg.addColorStop(1, '#173a2a');
  cx.fillStyle = bg; cx.fillRect(0, 0, W, tb);
  cells(2, (c, m) => { const h = hash(c, 21); if (h > 0.5) return; cx.fillStyle = 'rgba(140,180,120,.08)'; cx.fillRect(g.X(m), (0.1 + hash(c, 22) * 0.6) * (tb - path), 2, 1); });
  cells(14, (c, m) => { if (m > -90 && m < 70 || m > COURSE - 70 && m < COURSE + 40) return; const h = hash(c, 5); if (h > 0.62) return;
    tree(g.X(m + hash(c, 6) * 8), (tb - path) * (0.25 + hash(c, 7) * 0.35), (g.phone ? 8 : 14) * (0.75 + h * 0.55), hash(c, 8)); });
  // boathouses behind the start, each with its club flag
  [[-82, 26, '#7a3d34', '#e0a63c'], [-50, 22, '#5d4a3a', '#86a8e8'], [-22, 30, '#7a3d34', '#d8475a'], [14, 24, '#4f5a52', '#ece4d2'], [44, 20, '#5d4a3a', '#9fcf9a']].forEach(([m, len, col, flag]) => {
    const x = g.X(m); if (x > W + 60 || x + len * S < -60) return;
    const h = (tb - path) * 0.58; roof(x, (tb - path) * 0.16, len * S, h, col);
    cx.fillStyle = flag; cx.fillRect(x + len * S * 0.5, (tb - path) * 0.16 - 1, g.phone ? 6 : 10, g.phone ? 3 : 5);
  });
  // the judges' hut at the line
  { const x = g.X(COURSE); if (x > -80 && x < W + 80) { roof(x - (g.phone ? 12 : 22), (tb - path) * 0.12, g.phone ? 24 : 44, (tb - path) * 0.62, '#ece4d2'); cx.fillStyle = '#d8475a'; cx.fillRect(x - 1, (tb - path) * 0.12, 2, (tb - path) * 0.62); } }
  // towpath and its stone edge
  cx.fillStyle = '#3c3a2c'; cx.fillRect(0, tb - path, W, path);
  cx.fillStyle = 'rgba(236,228,210,.18)'; cx.fillRect(0, tb - 1, W, 1);
  // the crowd: people on the towpath, more of them the nearer the finish
  cells(1.6, (c, m) => {
    const dens = m < 0 ? 0.22 : m < COURSE - 500 ? 0.05 : m < COURSE + 60 ? 0.12 + 0.8 * Math.min(1, (m - COURSE + 500) / 450) : 0.3;
    if (hash(c, 31) > dens) return;
    const x = g.X(m), y = tb - path * (0.3 + hash(c, 32) * 0.5), r = g.phone ? 1.6 : 2.4;
    cx.fillStyle = CROWD[Math.floor(hash(c, 33) * CROWD.length)]; cx.beginPath(); cx.arc(x, y + r * 0.6, r * 1.15, 0, 6.283); cx.fill();
    cx.fillStyle = hash(c, 34) > 0.5 ? '#2a1d16' : '#c8a27a'; cx.beginPath(); cx.arc(x, y - r * 0.2, r * 0.75, 0, 6.283); cx.fill();
  });
  // bunting along the last 250 m
  { const a = Math.max(m0, COURSE - 250), b = Math.min(m1, COURSE + 20);
    if (a < b) { const y0 = tb - path - (g.phone ? 4 : 7);
      cx.strokeStyle = 'rgba(236,228,210,.5)'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(g.X(a), y0); cx.lineTo(g.X(b), y0); cx.stroke();
      for (let k = Math.ceil(a / 3); k * 3 < b; k++) { const x = g.X(k * 3); cx.fillStyle = k % 2 ? '#d8475a' : '#ece4d2';
        cx.beginPath(); cx.moveTo(x - 3, y0); cx.lineTo(x + 3, y0); cx.lineTo(x, y0 + (g.phone ? 4 : 6)); cx.fill(); } } }

  // the near bank: reeds at the water, grass, a willow now and then, punts moored along it
  const bb = g.bb, y1 = g.w1;
  cx.fillStyle = '#132f24'; cx.fillRect(0, y1, W, bb);
  cells(60, (c, m) => { if (hash(c, 41) > 0.4) return; const x = g.X(m + hash(c, 42) * 30), len = 7 * S, w = g.phone ? 4 : 7;
    cx.fillStyle = 'rgba(0,0,0,.25)'; cx.beginPath(); cx.ellipse(x + len / 2 + 2, y1 - w * 0.6 + 2, len / 2, w / 2, 0, 0, 6.283); cx.fill();
    cx.fillStyle = '#6b4a2e'; cx.beginPath(); cx.ellipse(x + len / 2, y1 - w * 0.6, len / 2, w / 2, 0, 0, 6.283); cx.fill();
    cx.fillStyle = '#8a6440'; cx.fillRect(x + len * 0.2, y1 - w * 0.6 - 0.5, len * 0.6, 1); });
  cells(22, (c, m) => { if (m > COURSE - 70 && m < COURSE + 40) return; const h = hash(c, 51); if (h > 0.45) return;
    tree(g.X(m + hash(c, 52) * 10), y1 + bb * (0.75 + h * 0.3), (g.phone ? 11 : 20) * (0.8 + h * 0.4), hash(c, 53)); });
  cx.strokeStyle = 'rgba(130,175,115,.45)'; cx.lineWidth = 1.2;
  cells(1.5, (c, m) => { const h = hash(c, 9); if (h > 0.55) return; const x = g.X(m + h), len = (0.4 + h) * (g.phone ? 7 : 11);
    cx.beginPath(); cx.moveTo(x, y1 + 2); cx.lineTo(x + (h - 0.3) * 5, y1 + 2 - len); cx.stroke(); });

  // buoy lines: every 12.5 m, red over the last 250 m
  for (let i = 1; i < 4; i++) {
    const y = g.w0 + g.laneH * i;
    for (let k = Math.max(0, Math.floor(m0 / 12.5)); k * 12.5 <= Math.min(COURSE + 100, m1); k++) {
      const m = k * 12.5, late = m >= COURSE - 250 && m <= COURSE, x = g.X(m), r = g.phone ? 1.9 : 2.6;
      cx.fillStyle = 'rgba(0,0,0,.25)'; cx.beginPath(); cx.arc(x + 1, y + 1.5, r, 0, 6.283); cx.fill();
      cx.fillStyle = late ? '#e0566a' : '#e6dcc6'; cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(x - r * 0.3, y - r * 0.35, r * 0.35, 0, 6.283); cx.fill();
    }
  }
  // distance boards on the towpath every 250 m: metres still to row
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let m = 250; m < COURSE; m += 250) {
    const x = g.X(m); if (x < g.names - 40 || x > W + 40) continue;
    const togo = COURSE - m, last = togo === 250, bw = g.phone ? 30 : 46, bh = g.phone ? 14 : 20, by = tb - path - bh - (g.phone ? 2 : 4);
    cx.fillStyle = 'rgba(0,0,0,.35)'; cx.fillRect(x - bw / 2 + 2, by + 3, bw, bh);
    cx.fillStyle = last ? '#d8475a' : '#ece4d2'; cx.fillRect(x - bw / 2, by, bw, bh);
    cx.fillStyle = last ? '#fff' : '#16302f'; cx.font = `600 ${g.phone ? 10 : 13}px "IBM Plex Mono", monospace`;
    cx.fillText(String(togo), x, by + bh / 2 + 1);
    cx.fillStyle = 'rgba(236,228,210,.16)'; cx.fillRect(x - 0.5, g.w0, 1, g.w1 - g.w0);
  }
  cx.textAlign = 'left';
  // start pontoon and finish line
  const xs = g.X(0) - g.L - 4, xf = g.X(COURSE);
  if (xs > -40) { cx.fillStyle = '#5a4a36'; cx.fillRect(xs - (g.phone ? 8 : 12), g.w0, g.phone ? 6 : 9, g.w1 - g.w0); cx.fillStyle = 'rgba(255,255,255,.1)';
    for (let y = g.w0; y < g.w1; y += 5) cx.fillRect(xs - (g.phone ? 8 : 12), y, g.phone ? 6 : 9, 1); }
  if (xf < W + 20) {
    cx.fillStyle = 'rgba(236,228,210,.9)'; cx.fillRect(xf - 1, g.w0, 2.5, g.w1 - g.w0);
    cx.fillStyle = '#d8475a'; cx.beginPath(); cx.moveTo(xf + 1, g.w1 + 1); cx.lineTo(xf + (g.phone ? 14 : 22), g.w1 + bb * 0.35); cx.lineTo(xf + 1, g.w1 + bb * 0.7); cx.fill();
  }
}

function drawPuddles(now, g) {
  for (let i = puddles.length - 1; i >= 0; i--) {
    const p = puddles[i], age = (now - p.t) / 1000; if (age > 2.2) { puddles.splice(i, 1); continue; }
    const k = age / 2.2, r = reduce.matches ? 3 : 2 + Math.sqrt(k) * p.r;
    cx.strokeStyle = `rgba(233,226,208,${0.45 * (1 - k)})`; cx.lineWidth = 1.2;
    cx.beginPath(); cx.ellipse(g.X(p.m), p.y, r * 1.5, r * 0.7, 0, 0, 6.283); cx.stroke();
  }
}

// a coxless four, bow to the right. phase 0..1: .0 catch, .35 finish, then the recovery
function oarSweep(phase) { return phase < 0.35 ? -0.9 + (phase / 0.35) * 1.7 : 0.8 - ((phase - 0.35) / 0.65) * 1.7; }
function seats(g) { return [0.3, 0.45, 0.6, 0.75].map(f => g.L * f); }
function drawShell(bx, y, g, col, phase, wobble, mine, wake) {
  const L = g.L, w = Math.max(3.5, L * 0.07), stern = bx - L, oar = Math.min(L * 0.36, g.laneH * 0.4), sweep = oarSweep(phase);
  cx.save(); cx.translate(0, y);
  if (wobble) { cx.translate(bx - L / 2, 0); cx.rotate(wobble); cx.translate(-(bx - L / 2), 0); }
  if (wake > 0.02) {   // wake fanning back from the stern, longer the faster the shell runs
    const wl = L * (0.25 + wake * 0.8);
    cx.strokeStyle = `rgba(233,226,208,${0.12 + wake * 0.22})`; cx.lineWidth = 1.2;
    for (const sd of [-1, 1]) { cx.beginPath(); cx.moveTo(stern + L * 0.1, sd * w * 0.5); cx.lineTo(stern - wl, sd * (w + wl * 0.13)); cx.stroke(); }
  }
  if (mine) { cx.fillStyle = 'rgba(242,234,217,.06)'; cx.beginPath(); cx.ellipse(bx - L / 2, 0, L * 0.6, oar * 0.9, 0, 0, 6.283); cx.fill(); }
  seats(g).forEach((s, k) => {
    const sx = stern + s, side = k % 2 ? -1 : 1, ex = sx - Math.sin(sweep) * oar, ey = side * Math.cos(sweep) * oar;
    cx.strokeStyle = mine ? '#f2ead9' : 'rgba(242,234,217,.7)'; cx.lineWidth = g.phone ? 1.4 : 2;
    cx.beginPath(); cx.moveTo(sx, 0); cx.lineTo(ex, ey); cx.stroke();
    cx.fillStyle = col; cx.save(); cx.translate(ex, ey); cx.rotate(Math.atan2(ey, ex - sx));
    cx.beginPath(); cx.ellipse(-oar * 0.05, 0, oar * 0.13, w * 0.55, 0, 0, 6.283); cx.fill(); cx.restore();
  });
  // hull: a shadow on the water, the shell, a varnished deck stripe, the white bow ball
  const hull = (dx, dy) => { cx.beginPath(); cx.moveTo(bx + dx, dy); cx.quadraticCurveTo(bx - L * 0.5 + dx, -w + dy, stern + dx, dy); cx.quadraticCurveTo(bx - L * 0.5 + dx, w + dy, bx + dx, dy); };
  cx.fillStyle = 'rgba(0,0,0,.28)'; hull(2, 3); cx.fill();
  cx.fillStyle = mine ? '#fbf6ea' : '#d9d0bd'; hull(0, 0); cx.fill();
  cx.fillStyle = mine ? 'rgba(216,71,90,.55)' : 'rgba(120,90,60,.35)'; cx.fillRect(stern + L * 0.2, -0.75, L * 0.68, 1.5);
  cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(bx - 1, 0, Math.max(1.4, w * 0.3), 0, 6.283); cx.fill();
  // rowers from above: shoulders in club colour leaning with the stroke, a head in front of them
  const lean = (phase < 0.35 ? -1 : 1) * L * 0.015;
  seats(g).forEach((s, k) => {
    const sx = stern + s + lean;
    cx.fillStyle = col; cx.beginPath(); cx.ellipse(sx, 0, w * 0.62, w * 0.82, 0, 0, 6.283); cx.fill();
    cx.fillStyle = 'rgba(0,0,0,.18)'; cx.beginPath(); cx.ellipse(sx + w * 0.15, w * 0.2, w * 0.4, w * 0.55, 0, 0, 6.283); cx.fill();
    cx.fillStyle = k % 2 ? '#3a2a1e' : '#6b4a30'; cx.beginPath(); cx.arc(sx + w * 0.75, 0, w * 0.42, 0, 6.283); cx.fill();
  });
  cx.restore();
}
function strokePuddles(m, y, g, now) {   // the two outer blades leave a puddle each where they came out
  const oar = Math.min(g.L * 0.36, g.laneH * 0.4), s = seats(g), back = m - (g.L - s[0]) / g.scale - Math.sin(0.8) * oar / g.scale;
  for (const side of [1, -1]) puddles.push({m: back, y: y + side * Math.cos(0.8) * oar, t: now, r: 5 + g.L * 0.05});
}

function label(text, x, y, col, g, bold, size) {
  cx.font = `${bold ? 600 : 500} italic ${size || (g.phone ? 12 : 16)}px Fraunces, Georgia, serif`;
  cx.fillStyle = col; cx.textBaseline = 'middle'; cx.fillText(text, x, y);
}

let lastT = performance.now(), liveShown = '', liveAt = 0;
function bowMetres(ch, len) { return ch / len * COURSE; }
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const g = geom(), len = race.text.length, t = race.start === null ? 0 : now - race.start;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // the player's shell: a spring toward the share typed, so each stroke surges and glides
  const target = race.typed / len + (res ? 0.025 * (1 - Math.exp(-(now - finishedAt) / 1000 * 1.6)) : 0);
  if (reduce.matches) { boat.x = target; boat.v = 0; }
  else { const k = 90, c = 2 * Math.sqrt(k) * 0.82; boat.v += ((target - boat.x) * k - boat.v * c) * dt; boat.x += boat.v * dt; boat.x = Math.max(0, boat.x); }
  boat.phase += ((boat.strokes / 2.4) - boat.phase) * Math.min(1, dt * 14);
  crab = Math.max(0, crab - dt * 1.8);
  const me = boat.x * COURSE;

  // rivals
  const rv = race.rivals.map((r, i) => {
    const v = rivalViews[i]; let ch = R.rivalChars(r, t), done = ch >= len;
    if (done) { if (!v.done) { v.done = true; v.doneAt = now; sfx.bell(true); } ch = len + len * 0.025 * (1 - Math.exp(-(now - v.doneAt) / 1000 * 1.6)); }
    return {i, r, v, ch, done, m: bowMetres(ch, len)};
  });

  // camera: keep the player about a third in, leaning toward the leader, never before the start or past the finish
  const lead = Math.max(me, ...rv.map(x => x.m));
  let want = me - g.view * 0.45 + Math.min(g.view * 0.22, (lead - me) * 0.5);
  want = Math.max(-g.L / g.scale - 12, Math.min(COURSE + 60 - g.view, want));
  if (reduce.matches || race.start === null && boat.x === 0) { cam.m = want; cam.v = 0; }
  else { const k = 30, c = 2 * Math.sqrt(k); cam.v += ((want - cam.m) * k - cam.v * c) * dt; cam.m += cam.v * dt; }

  drawWater(now, g);
  cx.save(); cx.beginPath(); cx.rect(g.names, g.w0 - g.laneH * 0.3, W, g.w1 - g.w0 + g.laneH * 0.6); cx.clip();
  drawPuddles(now, g);
  const tags = [];
  for (const x of rv) {
    const y = g.lane(x.i), cyc = x.ch / 2.4, v = x.v;
    v.phase = race.start === null ? 0.5 + Math.sin(now / 900 + x.i) * 0.04 : (x.done ? Math.min(0.999, v.phase + dt * 0.4) : cyc % 1);
    drawShell(g.X(x.m), y, g, x.r.col, v.phase, 0, false, race.start === null ? 0 : x.done ? Math.max(0, 0.6 - (now - v.doneAt) / 2000) : 0.6);
    const c = Math.floor(cyc); if (!x.done && race.start !== null && c > v.lastCycle) { v.lastCycle = c; strokePuddles(x.m, y, g, now); }
    tags.push(x);
  }
  const y = g.lane(3), bx = g.X(me), lw = R.liveWpm(race, now);
  if (crab > 0) { cx.fillStyle = `rgba(216,71,90,${0.22 * crab * crab})`; cx.fillRect(g.names, y - g.laneH / 2, W, g.laneH);
    cx.fillStyle = `rgba(232,84,104,${crab})`; cx.fillRect(g.names, y - g.laneH / 2, W, 2); cx.fillRect(g.names, y + g.laneH / 2 - 2, W, 2); }
  const wob = reduce.matches ? 0 : crab * Math.sin(now / 24) * 0.16;
  const ph = race.start === null ? 0.5 + Math.sin(now / 900 + 7) * 0.04 : (crab > 0.25 ? 0.62 : boat.phase % 1);
  drawShell(bx, y, g, '#d8475a', ph, wob, true, race.start === null ? 0 : Math.min(1, Math.max(0, (lw || 0) / 90 + boat.v * 20)));
  for (let i = splash.length - 1; i >= 0; i--) {
    const sp = splash[i], a = (now - sp.t) / 550; if (a > 1) { splash.splice(i, 1); continue; }
    const e = 1 - (1 - a) * (1 - a);
    cx.fillStyle = `rgba(250,245,232,${0.95 * (1 - a)})`; cx.beginPath();
    cx.arc(bx - g.L * 0.45 + sp.dx * e * g.L * 0.35, y + sp.dy * e * g.L * 0.25, (g.phone ? 2.6 : 3.6) * (1 - a * 0.5), 0, 6.283); cx.fill();
  }
  for (let i = rings.length - 1; i >= 0; i--) {   // the line: rings of light spreading from your bow
    const a = (now - rings[i].t) / 900; if (a > 1) { rings.splice(i, 1); continue; } if (a < 0) continue;
    const e = 1 - Math.pow(1 - a, 3); cx.strokeStyle = `rgba(250,245,232,${0.8 * (1 - a)})`; cx.lineWidth = 2;
    cx.beginPath(); cx.ellipse(g.X(COURSE), y, 8 + e * g.L * 0.9, 4 + e * g.laneH * 0.45, 0, 0, 6.283); cx.stroke();
  }
  if (res && !reduce.matches) {   // the place lands on the water beside you
    const a = Math.min(1, (now - finishedAt) / 450), e = 1 - Math.pow(1 - a, 3), sc = 1.5 - 0.5 * e;
    cx.save(); cx.globalAlpha = e; cx.translate(bx - g.L * 1.25, y); cx.scale(sc, sc);
    cx.font = `600 italic ${g.phone ? 22 : 34}px Fraunces, Georgia, serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = res.place === 1 ? '#e8566a' : '#f2ead9'; cx.fillText(ordinal(res.place), 0, 0); cx.restore();
  }
  const pc = Math.floor(boat.phase);
  if (race.start !== null && !res && pc > (boat.lastCycle || 0)) { boat.lastCycle = pc; strokePuddles(me, y, g, now); }
  if (race.start === null) boat.lastCycle = 0;
  cx.restore();

  // the name column, with an arrow and the distance for any crew off screen
  cx.fillStyle = 'rgba(9,36,36,.92)'; cx.fillRect(0, g.w0, g.names, g.w1 - g.w0);
  for (const x of tags) {
    const yy = g.lane(x.i), placeAge = x.done && res ? now - x.v.doneAt : -1;
    label(placeAge >= 0 ? ordinal(placeOf(x.i)) : x.r.name, 12, yy, x.r.col, g, false, g.phone ? 11 : 15);
    const bxr = g.X(x.m), gap = Math.round(x.m - me);
    if (bxr - g.L > W - 4 && !x.done) offscreen(W - 8, yy, `${x.r.name.slice(0, g.phone ? 5 : 12)} ${gap} m ahead ▸`, 'right', g);
    else if (bxr < g.names + 4) offscreen(g.names + 8, yy, `◂ ${-gap} m back`, 'left', g);
  }
  label(res ? ordinal(placeOf(-1)) : 'You', 12, y, '#f2ead9', g, true, g.phone ? 12 : 16);

  // the card's live line: the nearest crew in seconds, and your pace once it means something
  let lt = '';
  if (lw !== null && !res && race.typed > 8) {
    const gaps = race.rivals.map(r => ({n: r.name, s: (t - R.rivalFinish(r, race.typed)) / 1000})).sort((a, b) => Math.abs(a.s) - Math.abs(b.s));
    const n = gaps[0], up = n.s < 0;
    lt = `<b class="${up ? 'up' : 'dn'}">${up ? '▲' : '▼'} ${Math.abs(n.s).toFixed(1)} s</b> ${up ? 'ahead of' : 'behind'} ${n.n} · <em>${Math.round(lw)}</em> wpm`;
  }
  if (lt !== liveShown && (now - liveAt > 250 || !lt)) { liveShown = lt; liveAt = now; $('live').innerHTML = lt; $('hint').style.opacity = lt || res ? 0 : 1; }
  requestAnimationFrame(frame);
}
function offscreen(x, y, text, align, g) {
  cx.font = `500 ${g.phone ? 10 : 12}px "IBM Plex Mono", monospace`; cx.textAlign = align; cx.textBaseline = 'middle';
  cx.fillStyle = 'rgba(236,228,210,.7)'; cx.fillText(text, x, y); cx.textAlign = 'left';
}
const ordinal = p => p + ['', 'st', 'nd', 'rd', 'th'][p];
function placeOf(i) {
  const ms = i < 0 ? race.finish : res.times[i].ms;
  return 1 + res.times.filter((x, j) => j !== i && x.ms < ms).length + (i >= 0 && race.finish < ms ? 1 : 0);
}

// ---------- go ----------
resize(); newRace();
if (document.fonts) document.fonts.ready.then(() => scrollText());
requestAnimationFrame(t => { lastT = t; frame(t); });
focusKb();
window.__regatta = {get race() { return race; }, get res() { return res; }, type, newRace, get save() { return save; }};
})();
</script>
