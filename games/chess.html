<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEE7D7">
<title>Chess - Play Against the Computer, Five Opponents | GPT Games</title>
<link rel="canonical" href="https://www.gptgames.dev/games/chess.html">
<meta name="description" content="Chess on a printed-page board: play five computer opponents from beginner to merciless, or a friend. Hints, takebacks, move review and an evaluation bar, free in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEE7D7; --paper-hi:#F7F2E7; --sheet:#F8F4EA;
  --sq-l:#F6F1E5; --sq-d:#AB9F84;
  --ink:#1E1D1A; --ink2:#4F4A40; --ink3:#7E776A; --rule:#CFC6B2;
  --red:#B3362B; --hl:rgba(247,203,62,.62);
  --bs:min(calc(100vw - 10px), calc(100dvh - 290px), 640px);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.35 var(--serif);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- frame of the page ---------- */
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;flex:none}
.mark{display:flex;align-items:center;gap:7px;font-size:23px;font-weight:500;font-style:italic;letter-spacing:-.01em;margin-right:auto}
.mark svg{width:25px;height:25px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 17px;border-radius:999px;border:1.5px solid var(--ink);font-size:16px;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s,transform .12s,opacity .2s}
.pill.solid{background:var(--ink);color:var(--paper-hi)}
.pill:active{transform:scale(.96)}
.pill[disabled]{opacity:.38;pointer-events:none}
.pill.gone{visibility:hidden}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:background-color .15s,transform .12s,opacity .2s}
.round:active{transform:scale(.92);background:rgba(30,29,26,.08)}
.round[disabled]{opacity:.3;pointer-events:none}
header .round.menu-d{display:none}

main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:max(0px,calc((100dvh - var(--bs) - 380px) / 6)) 0 0}
.left{display:flex;flex-direction:column;align-items:center;flex:1;min-height:0}
.who{width:calc(var(--bs) + 4px);display:flex;align-items:center;gap:11px;padding:7px 2px;min-height:58px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ink);transition:box-shadow .3s}
.av svg{width:31px;height:31px}
.av.light{background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--ink)}
.who .info{min-width:0;flex:1}.who .sub{overflow:hidden;text-overflow:ellipsis}.who .blurb{overflow:hidden;text-overflow:ellipsis}.caps{flex:none}
.nm{font-size:18px;font-weight:600;line-height:1.15;white-space:nowrap}
.sub{font-size:14px;color:var(--ink2);display:flex;gap:7px;align-items:center;white-space:nowrap;margin-top:1px}
.pips{display:inline-flex;gap:3px}.pips i{width:6px;height:6px;border-radius:50%;background:var(--ink)}.pips i.o{background:none;box-shadow:inset 0 0 0 1px var(--ink3)}
.thinking{display:none;font-style:italic}
.who.busy .blurb{display:none}.who.busy .thinking{display:inline}
.thinking b{display:inline-block;font-weight:400;animation:dot 1.2s infinite both}
.thinking b:nth-child(2){animation-delay:.2s}.thinking b:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.caps{margin-left:auto;display:flex;align-items:center;min-height:24px}
.caps svg{width:23px;height:23px;margin-right:-8px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.caps svg.new{transform:scale(0)}
.caps b{font-weight:600;font-size:15px;color:var(--ink2);margin-left:13px;font-variant-numeric:tabular-nums}

/* ---------- board ---------- */
.stage{display:flex;align-items:stretch;gap:0;position:relative}
.evalbar{display:none}
.frame{border:1.5px solid var(--ink);padding:1.5px;background:var(--sq-l);position:relative}
.board{width:var(--bs);height:var(--bs);position:relative;touch-action:none;cursor:pointer}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .18s}
.sq.l.last::before{opacity:1;background:rgba(247,203,62,.55)}.sq.d.last::before{opacity:1;background:rgba(247,203,62,.7)}
.sq.sel::before{opacity:1;background:rgba(30,29,26,.16)}
.sq.over::before{opacity:1;background:rgba(30,29,26,.12)}
.sq.check::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(179,54,43,.85) 0,rgba(179,54,43,.45) 38%,rgba(179,54,43,0) 70%)}
.cc{position:absolute;font-size:max(12px,calc(var(--bs)/36));font-weight:600;line-height:1;pointer-events:none}
.sq.l .cc{color:#8D8573}.sq.d .cc{color:var(--sq-l)}
.cc.r{left:5%;top:5%}.cc.f{right:6%;bottom:5%}
.dots{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center;animation:pop .16s ease-out both}
.dot::after{content:"";width:29%;height:29%;border-radius:50%;background:rgba(30,29,26,.42)}
.dot.cap::after{width:92%;height:92%;background:none;box-shadow:inset 0 0 0 calc(var(--bs)/110 + 1px) rgba(30,29,26,.42)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .22s cubic-bezier(.25,.8,.25,1),opacity .22s;will-change:transform}
.pc .pi{width:100%;height:100%;transition:transform .16s cubic-bezier(.3,1.4,.5,1),filter .16s;transform-origin:50% 88%}
.pc svg{width:100%;height:100%;display:block}
.pc.lift .pi{transform:scale(1.07) translateY(-3%);filter:drop-shadow(0 5px 3px rgba(40,30,15,.22))}
.pc.drag{transition:none;z-index:5}
.pc.drag .pi{transform:scale(1.3) translateY(-14%);filter:drop-shadow(0 10px 6px rgba(40,30,15,.25))}
.pc{z-index:1}.pc.gone{opacity:0;z-index:0;transition:opacity .22s .08s}
.pc.gone .pi{transform:scale(.55) rotate(-25deg);transition:transform .3s cubic-bezier(.5,0,.6,1) .05s}
.pc.gone .pi{transform:scale(.6)}
.pc.born .pi{animation:born .26s cubic-bezier(.3,1.5,.5,1) both}
@keyframes born{from{transform:scale(.5);opacity:0}}
.pc.mated{z-index:3}
.pc.target{opacity:.4;transition:opacity .12s}
.board.swap .pieces,.board.swap .squares{animation:swap .32s ease-out}
@keyframes swap{from{opacity:0}}
.pc.mated .pi{transform-origin:30% 92%;animation:topple .9s cubic-bezier(.5,0,.3,1) .1s both}
@keyframes topple{0%{transform:none}22%{transform:rotate(8deg)}62%{transform:translate(9%,4%) rotate(-64deg) scale(.86)}78%{transform:translate(9%,4%) rotate(-54deg) scale(.86)}90%{transform:translate(9%,4%) rotate(-59deg) scale(.86)}100%{transform:translate(9%,4%) rotate(-58deg) scale(.86)}}
.pc.shake .pi{animation:shake .3s}
.pc.invite .pi{animation:invite .62s cubic-bezier(.3,0,.3,1) both}
@keyframes invite{0%,100%{transform:none}40%{transform:translateY(-12%) scale(1.06)}}
.pc.mated .pi svg{filter:none}
@keyframes shake{20%{transform:translateX(-6%)}50%{transform:translateX(5%)}80%{transform:translateX(-2%)}}
.ink{position:absolute;inset:0;pointer-events:none;overflow:visible}
.ink .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .42s cubic-bezier(.4,0,.2,1) forwards}
.ink .head{opacity:0;animation:fadein .12s .34s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
/* whose move: a red pencil ring on that player's avatar and a word beside it */
.who.turn .av{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--red)}
.who.turn .av.light{box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 2px var(--paper),0 0 0 4px var(--red)}
.yourmove{margin-left:12px;font-size:16px;font-style:italic;color:var(--red);font-weight:500;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .2s,transform .25s cubic-bezier(.3,1.3,.5,1)}
.who.turn .yourmove{opacity:1;transform:none}

.reviewing{position:absolute;left:50%;bottom:10px;transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.3,1.3,.5,1);z-index:8;
  background:var(--ink);color:var(--paper-hi);height:38px;font-size:15px;box-shadow:0 6px 18px -6px rgba(0,0,0,.4)}
.reviewing.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* promotion */
.promo{position:absolute;inset:0;z-index:9;background:none;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .15s}
.promo.on{opacity:1;pointer-events:auto}
.promo .col{position:absolute;width:12.5%;display:flex;flex-direction:column;background:var(--sheet);box-shadow:0 0 0 2px var(--ink),0 12px 30px -8px rgba(0,0,0,.4),0 0 0 9999px rgba(246,241,229,.5)}
.promo button{width:100%;aspect-ratio:1;display:block;transition:background-color .12s;transform:scale(.6);opacity:0}
.promo.on button{transform:none;opacity:1;transition:transform .2s cubic-bezier(.3,1.5,.5,1),opacity .15s}
.promo.on button:nth-child(2){transition-delay:.02s}.promo.on button:nth-child(3){transition-delay:.04s}.promo.on button:nth-child(4){transition-delay:.06s}
.promo button:hover{background:rgba(30,29,26,.08)}
.promo svg{width:100%;height:100%}

/* result card */
/* the result never covers the final position: a sheet from the bottom on phone, the side column on desktop */
.result{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;pointer-events:none}
.result.on{pointer-events:auto}.result.instant,.result.instant .card{transition:none!important}.result.instant,.result.instant .card{transition:none}
.card{width:min(86%,340px);background:var(--sheet);border:2px solid var(--ink);padding:20px 20px 18px;text-align:center;box-shadow:0 22px 50px -18px rgba(40,30,15,.5);
  transform:scale(.9);opacity:0;transition:transform .38s cubic-bezier(.2,1.3,.4,1),opacity .16s}
.result.on .card{transform:none;opacity:1}
body>.result .card{width:100%;max-width:460px;border-width:2px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);opacity:1;transition:transform .42s cubic-bezier(.2,1.1,.35,1);box-shadow:0 -14px 40px -20px rgba(40,30,15,.45)}
body>.result.on .card{transform:none}
body>.result .score{font-size:44px}
.score{font-size:54px;font-weight:500;line-height:1;letter-spacing:.02em;font-variant-numeric:lining-nums}
.verdict{font-size:22px;font-weight:600;margin-top:10px}
.why{font-size:16px;font-style:italic;color:var(--ink2);margin-top:3px}
.record{font-size:14px;color:var(--ink3);margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.record b{color:var(--ink);font-weight:600}
.card .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.card .acts .row{display:flex;gap:8px}.card .acts .row .pill{flex:1}
.card .x{position:absolute;right:8px;top:8px}

/* ---------- score sheet / strip ---------- */
.side{display:contents}
.sheetbox{display:none}
/* phone: the score sheet fills what the board leaves, set as a paragraph like a book's game score */
.strip{width:calc(var(--bs) + 4px);flex:1;min-height:46px;margin-top:2px;border-top:1px solid var(--rule);display:flex;align-items:flex-start;gap:10px;padding-top:8px}
.strip .moves{flex:1;align-self:stretch;overflow-y:auto;white-space:normal;line-height:1.85;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px);mask-image:linear-gradient(180deg,transparent 0,#000 18px);padding:0 2px 6px}
.strip .moves .n:first-child{margin-left:0}
.strip .moves::-webkit-scrollbar{display:none}
.strip .ev small{font-size:10.5px;letter-spacing:.1em;color:var(--ink3);margin-right:4px;font-weight:600}
.strip .ev{padding:4px 0 0 10px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:38px;text-align:right}
.moves{font-size:17px;font-variant-numeric:tabular-nums}
.moves .n{font-weight:700;margin-left:9px;margin-right:3px}
.moves .n:first-child{margin-left:0}
.moves .m{padding:1px 4px;border-radius:2px;cursor:pointer;transition:background-color .15s}
.moves .m.cur{background:var(--hl);font-weight:600}
.moves .res{font-weight:700;margin-left:10px}
.moves .empty{font-style:italic;color:var(--ink3)}
.toolbar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
#newBtn.quiet{background:none;color:var(--ink)}
.toolbar .pill{flex:1;height:46px;padding:0 10px;font-size:17px}
.deskbar{display:none}

/* ---------- sheets (new game, menu) ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(30,29,26,0);display:flex;align-items:flex-end;justify-content:center;pointer-events:none;transition:background-color .25s}
.scrim.on{background:rgba(64,48,26,.3);pointer-events:auto}
.panel{width:100%;max-width:460px;max-height:92dvh;overflow:auto;background:var(--sheet);border-top:2px solid var(--ink);padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.25,1)}
.scrim.on .panel{transform:none}
.panel h2{font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel h3{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
.opps{display:flex;flex-direction:column}
.opp{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:6px;text-align:left;transition:background-color .15s}
.opp+.opp{border-top:1px solid var(--rule)}
.opp .info{flex:1;min-width:0}
.opp .sub{white-space:normal}.opp .rec{font-size:13px;padding-right:2px;color:var(--ink3);text-align:right;line-height:1.25;font-variant-numeric:tabular-nums}
.opp .rec .won{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.opp .tick{width:16px;height:16px;stroke:var(--red);stroke-width:2.4}
.opp .chk{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--ink3);display:grid;place-items:center}
.opp.on .chk{background:var(--ink);box-shadow:none}
.opp .chk svg{width:14px;height:14px;stroke:var(--paper-hi);stroke-width:3;opacity:0}.opp.on .chk svg{opacity:1}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:500;transition:background-color .15s,color .15s}
.seg button svg{width:24px;height:24px}
.seg button.on{background:var(--ink);color:var(--paper-hi)}
.panel .go{width:100%;height:50px;margin-top:16px;font-size:18px}
.menu-list{display:flex;flex-direction:column}
.menu-list button{display:flex;align-items:center;gap:12px;height:50px;font-size:17px;text-align:left;border-bottom:1px solid var(--rule)}
.menu-list button:last-child{border-bottom:0}
.menu-list .state{margin-left:auto;font-size:15px;color:var(--ink3)}
.menu-list .sw{margin-left:auto;width:40px;height:24px;border-radius:12px;background:var(--rule);position:relative;transition:background-color .2s}
.menu-list .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--sheet);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.menu-list .on .sw{background:var(--ink)}.menu-list .on .sw::after{transform:translateX(16px)}
.menu-list .danger{color:var(--red)}
.credit{font-size:12.5px;color:var(--ink3);margin-top:12px;line-height:1.4}
.credit a{color:inherit}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--paper-hi);padding:8px 16px;border-radius:999px;font-size:15px;z-index:30;transition:transform .3s cubic-bezier(.3,1.3,.5,1),opacity .2s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ---------- wide screens: book spread ---------- */
@media (min-width:900px) and (min-height:560px), (min-width:600px) and (max-height:559px) and (orientation:landscape){
  .stage{padding:0}
  main{justify-content:center}
  .deskbar .pill{height:44px;padding:0 20px}
  :root{--bs:min(760px, calc(100dvh - 140px), calc(100vw - 470px))}
  .sheetbox{position:relative}
  .sheetbox .moves{flex:0 1 auto}.sheetbox .nav{margin-top:auto}
  .sheetbox .result{position:absolute;inset:0;align-items:center;background:var(--paper);opacity:0;transition:opacity .25s}
  .sheetbox .result.on{opacity:1}
  .sheetbox .card{width:100%;transform:translateY(18px);border-width:2px}
  header{width:min(1100px,100%);margin:0 auto;padding:16px 24px 10px}
  header .round.menu-d{display:grid}
  .mark{font-size:28px}.mark svg{width:30px;height:30px}
  main{flex-direction:row;align-items:center;gap:40px;padding:0 24px 24px}
  .left{display:flex;flex-direction:column;gap:12px;flex:none;align-items:stretch}
  .deskbar{padding-left:28px}
  .stage{gap:16px}
  .evalbar{display:block;width:12px;position:relative;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--ink)}
  .evalbar .fill{position:absolute;left:0;right:0;top:0;background:var(--ink);height:50%;transition:height .6s cubic-bezier(.3,.8,.3,1)}
  .evalbar .lbl{position:absolute;right:10px;transform:translateY(-50%);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;top:50%;transition:top .6s cubic-bezier(.3,.8,.3,1);color:var(--ink2)}
  .evalbar .tick0{position:absolute;left:-3px;right:-3px;top:50%;height:1px;background:var(--ink3)}
  .stage.noeval .evalbar{visibility:hidden}
  .evalbar .lbl small{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--ink3);text-align:right}
  .deskbar{display:flex;gap:8px}
  .deskbar .sp{flex:1}
  .side{position:relative;display:flex;flex-direction:column;width:300px;height:calc(var(--bs) + 8px)}
  .who{width:auto;padding:0}
  .side .who:first-child{padding-bottom:12px}
  .side .who:last-child{padding-top:12px}
  .sheetbox{display:flex;flex-direction:column;flex:1;min-height:0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
  .sheetbox .moves{flex:1;overflow:auto;padding:12px 2px;line-height:2;white-space:normal;font-size:19px}
  .side .nm{font-size:20px}.side .sub{font-size:15px}.side .av{width:46px;height:46px}.side .av svg{width:36px;height:36px}
  .sheetbox .moves .n{margin-left:7px}
  .nav{display:flex;border-top:1px solid var(--rule)}
  .nav .round{flex:1;border-radius:4px;height:40px}
  .strip,.toolbar{display:none}
  .left .who{display:none}
  .scrim{align-items:center}
  .panel{border:2px solid var(--ink);transform:translateY(20px) scale(.98);opacity:0;transition:transform .3s cubic-bezier(.2,1.2,.4,1),opacity .2s;padding:20px 22px 22px}
  .scrim.on .panel{opacity:1}
}
@media (max-width:899px) and (orientation:portrait), (max-width:599px), (max-width:899px) and (min-height:560px){ .side .who{display:none} }
@media (max-height:559px) and (orientation:landscape) and (min-width:600px){
  :root{--bs:min(calc(100dvh - 124px), calc(100vw - 400px))}
  header{padding:8px 16px 4px}.mark{font-size:22px}
  main{gap:22px;padding:0 16px 8px}.side{width:min(300px,40vw)}
  .deskbar .pill{height:38px;padding:0 14px}.side .who:first-child{padding-bottom:6px}.side .who:last-child{padding-top:6px}
  .side .av{width:38px;height:38px}.side .av svg{width:30px;height:30px}.sheetbox .moves{font-size:17px;padding:6px 2px}
}
@media (max-height:700px) and (max-width:899px){ .who{min-height:48px;padding:3px 2px} .av{width:34px;height:34px} .av svg{width:27px;height:27px} }

// ---------- geometry ----------
const boardEl = $('board');

// ---------- squares ----------
const sqEls = new Array(128);

}

// ---------- pieces: kept as elements and moved, never redrawn in place ----------
let pieceEls = [];   // {el, pc, sq}
function placeEl(p) { const [x, y] = sqXY(p.sq); p.el.style.transform = `translate(${x * 100}%,${y * 100}%)`; }
function makeEl(pc, sq, born) {

}

// Brings the piece elements to position P. `mv` = {from, to} when exactly one move separates them (either direction).
function syncPieces(P, mv, instant) {
  const targets = [];
  for (let sq = 0; sq < 120; sq++) { if (sq & 0x88) { sq += 7; continue; } if (P.b[sq]) targets.push({ pc: P.b[sq], sq }); }
  let old = pieceEls.slice();

    const oi = old.findIndex(o => o.sq === mv.from), ti = targets.findIndex(t => t.sq === mv.to);
    if (oi >= 0 && ti >= 0) {
      const o = take(old, oi), t = take(targets, ti);
      o.sq = t.sq;
      if (o.pc !== t.pc) { // promotion (or its takeback): change the drawing once the glide has landed
        o.pc = t.pc;
        const el = o.el, pc = t.pc;
        later(ms(170), () => { el.querySelector('.pi').innerHTML = pieceSvg(pc); el.classList.remove('born'); void el.offsetWidth; el.classList.add('born'); });
      }
      next.push(o);
    }
  }

    const t = targets[i], oi = old.findIndex(o => o.sq === t.sq && o.pc === t.pc);

    const t = targets[i];

  }
  old.forEach(o => dropEl(o, !instant));
  targets.forEach(t => next.push(makeEl(t.pc, t.sq, !instant)));

    else placeEl(p);

}
function elAt(sq) { return pieceEls.find(p => p.sq === sq); }

// ---------- what is shown ----------
function shownPly() { return view === null ? G.sans.length : view; }
function shownPos() { return view === null ? live : C.replay(G.start, G.sans.slice(0, view)); }
function lastMoveOf(ply) {

  return { from: C.mFrom(m), to: C.mTo(m), m, before: p };
}
function isHumanTurn() {

}

function render(o = {}) {
  const P = shownPos(), ply = shownPly();
  if (o.jump) { buildSquares(); syncPieces(P, null, true); }
  else syncPieces(P, o.mv || null, false);
  const lm = lastMoveOf(ply);
  sqEls.forEach((el, sq) => {
    if (!el) return;
    el.classList.toggle('last', !!lm && (sq === lm.from || sq === lm.to));
    el.classList.toggle('sel', sq === sel);
    el.classList.toggle('check', P.inCheck() && sq === P.kings[P.turn] && !(G.result && view === null));
  });
  drawDots();
  drawInk();
  $('newBtn').classList.add('quiet');
  invite();
  if (G.result && view === null) {
    const mk = pieceEls.find(p => p.sq === P.kings[P.turn]);
    if (G.result.reason === 'checkmate' && mk) mk.el.classList.add('mated');
  }
  drawPlayers();
  drawMoves();
  drawEval();
  $('backLive').classList.toggle('on', view !== null);
  const canUndo = G.sans.length > 0 && view === null && !(G.you !== -1 && G.sans.length === 1 && G.you === 1);
  ['undoD', 'undoM'].forEach(id => { $(id).disabled = !canUndo; });
  ['hintD', 'hintM'].forEach(id => { $(id).disabled = !isHumanTurn(); });
  ['prevD', 'prevM', 'first'].forEach(id => { $(id).disabled = ply === 0; });
  ['nextD', 'nextM', 'last'].forEach(id => { $(id).disabled = view === null; });
}

function drawDots() {
  let h = '';
  if (sel >= 0 && settings.dots) {
    const P = live;
    for (const m of P.legal()) {
      if (C.mFrom(m) !== sel) continue;
      const to = C.mTo(m), [x, y] = sqXY(to);
      if (h.indexOf(`data-t="${to}"`) >= 0) continue;
      h += `<div class="dot${C.mFlags(m) & C.F_CAP ? ' cap' : ''}" data-t="${to}" style="left:${x * 12.5}%;top:${y * 12.5}%"></div>`;
    }
  }
  $('dots').innerHTML = h;
}

// the annotator's red pencil: hint arrows and the ring around a mated king
function drawInk() {
  const ink = $('ink');
  let h = '';
  if (hint && view === null) {
    const [x1, y1] = sqXY(hint.from), [x2, y2] = sqXY(hint.to);
    const ax = x1 + .5, ay = y1 + .5, bx = x2 + .5, by = y2 + .5;
    const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const sx = ax + ux * .3, sy = ay + uy * .3, ex = bx - ux * .38, ey = by - uy * .38;
    const len = Math.hypot(ex - sx, ey - sy);
    const hx = bx - ux * .1, hy = by - uy * .1, w = .22, back = .36;
    const p1 = [hx - ux * back + uy * w, hy - uy * back - ux * w], p2 = [hx - ux * back - uy * w, hy - uy * back + ux * w];
    h += `<path class="draw" style="--len:${len.toFixed(3)}" d="M${sx} ${sy}L${ex} ${ey}" stroke="${RED}" stroke-width=".13" stroke-linecap="round" fill="none"/>`;
    h += `<path class="head" d="M${hx} ${hy}L${p1[0]} ${p1[1]}L${p2[0]} ${p2[1]}Z" fill="${RED}" stroke="${RED}" stroke-width=".04" stroke-linejoin="round"/>`;
  }
  if (G.result && G.result.reason === 'checkmate' && view === null) {
    const [x, y] = sqXY(live.kings[live.turn]);
    h += `<ellipse class="draw" pathLength="1" style="--len:1.08;animation-delay:${reduced ? 0 : 1.05}s;animation-duration:.5s" cx="${x + .5}" cy="${y + .52}" rx=".56" ry=".5" transform="rotate(-14 ${x + .5} ${y + .52})" stroke="${RED}" stroke-width=".085" stroke-linecap="round" fill="none"/>`;
  }

const PIPS = l => '<span class="pips">' + [1, 2, 3, 4, 5].map(i => `<i${i > l ? ' class="o"' : ''}></i>`).join('') + '</span>';

const AV = [0, C.P, C.N, C.B, C.R, C.Q];
function material(P) {
  // captured pieces per side, from the start position's counts

  for (let sq = 0; sq < 120; sq++) { if (sq & 0x88) { sq += 7; continue; } const pc = P.b[sq]; if (pc) { const c = pc >> 3, t = pc & 7; have[c][t] = (have[c][t] || 0) + 1; } }
  const val = { 1: 1, 2: 3, 3: 3, 4: 5, 5: 9 }, lost = [[], []], score = [0, 0];
  for (const c of [0, 1]) for (const t of [5, 4, 3, 2, 1]) {
    const n = Math.max(0, start[t] - (have[c][t] || 0));

    score[c] += (have[c][t] || 0) * val[t];

}
let lastCaps = ['', ''];
function playerRow(side, P, mat) {
  // side: 0 white, 1 black
  const isYou = G.you === side, friend = G.you === -1, L = C.LEVELS[G.level - 1];
  let av, nm, sub;
  if (friend) { av = avatar(side ? C.K | C.BLACK : C.K, false); nm = side ? 'Black' : 'White'; sub = ''; }
  else if (isYou) { av = avatar(side ? C.K | C.BLACK : C.K, false); nm = 'You'; sub = `<div class="sub">playing ${side ? 'Black' : 'White'}</div>`; }
  else { av = avatar(AV[G.level], true); nm = L.name; sub = `<div class="sub">${PIPS(G.level)}<span class="blurb">${L.blurb}</span><span class="thinking">Thinking<b>.</b><b>.</b><b>.</b></span></div>`; }
  // pieces this side has taken = the other side's losses

  const caps = taken.map(t => pieceSvg(t | (side ? 0 : C.BLACK))).join('') + (diff > 0 ? `<b>+${diff}</b>` : '');
  const busy = !isYou && !friend && thinking;
  const word = friend ? 'To move' : 'Your move';
  const turn = !G.result && P.turn === side && (isYou || friend);
  const ring = !G.result && P.turn === side;
  return { html: `${av}<div class="info"><div class="nm">${nm}</div>${sub}</div><div class="caps">${caps}</div>${isYou || friend ? `<div class="yourmove">${word}</div>` : ''}`, busy, caps, turn, ring };
}
function drawPlayers() {
  const P = shownPos(), mat = material(P);

  for (const [ids, side] of [[['topM', 'topD'], topSide], [['botM', 'botD'], topSide ^ 1]]) {
    const r = playerRow(side, P, mat);
    for (const id of ids) {
      const el = $(id);
      const prev = el.dataset.caps || '';
      if (el.dataset.html !== r.html) { el.innerHTML = r.html; el.dataset.html = r.html; }
      el.classList.toggle('busy', r.busy);
      el.classList.toggle('turn', r.ring && view === null);
      // a newly captured piece pops into the tray
      if (prev && r.caps !== prev) {
        const svgs = el.querySelectorAll('.caps svg'), prevN = (prev.match(/<svg/g) || []).length;
        if (svgs.length > prevN) { const s = svgs[svgs.length - 1]; s.classList.add('new'); requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove('new'))); }
      }
      el.dataset.caps = r.caps;
    }

}

function drawMoves() {
  const p0 = new C.Position(G.start);
  let num = p0.full, ply = p0.turn, h = '';
  const cur = shownPly();
  if (!G.sans.length) h = `<span class="empty">${G.you === 1 && G.level ? 'The ' + C.LEVELS[G.level - 1].name + ' has White.' : 'White to move.'}</span>`;
  G.sans.forEach((s, i) => {
    if (ply % 2 === 0) h += `<span class="n">${num}.</span>`;
    else if (i === 0) h += `<span class="n">${num}…</span>`;
    h += `<span class="m${i + 1 === cur ? ' cur' : ''}" data-ply="${i + 1}">${s.replace(/-/g, '‑')}</span> `;
    if (ply % 2 === 1) num++;
    ply++;
  });
  if (G.result) h += `<span class="res">${G.result.result.replace('1/2-1/2', '½–½').replace('-', '–')}</span>`;
  for (const id of ['stripMoves', 'sheetMoves']) {
    const el = $(id);
    el.innerHTML = h;
    const c = el.querySelector('.m.cur');
    if (c) {
      const top = c.offsetTop - el.clientHeight / 2;
      el.scrollTo({ top: view === null ? el.scrollHeight : top, behavior: reduced ? 'auto' : 'smooth' });
    }
  }
}

function fmtEval(e) {
  if (!e) return '';
  if (e.mate) return (e.mate > 0 ? '+' : '−') + 'M' + Math.abs(e.mate);
  const v = e.score / 100;
  return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
}
function evalVisible() {
  // against the two gentlest opponents the evaluation would give the game away; it shows in review and after the game
  if (!settings.evalbar) return false;

}
function drawEval() {
  const bar = $('evalbar'), on = evalVisible();
  $('stage').classList.toggle('noeval', !on);
  const e = view === null ? evalScore : reviewEval;
  let w = 0.5;
  if (e) w = e.mate ? (e.mate > 0 ? 1 : 0) : 1 / (1 + Math.exp(-e.score / 260));
  // top of the bar is the far side of the board
  const blackFrac = flipped ? w : 1 - w;
  bar.querySelector('.fill').style.height = (blackFrac * 100).toFixed(1) + '%';
  bar.querySelector('.fill').style.background = flipped ? PAPER : INK;
  bar.style.background = flipped ? INK : '';
  const lbl = bar.querySelector('.lbl');
  lbl.innerHTML = e ? '<small>EVAL</small>' + fmtEval(e) : '';
  lbl.style.top = Math.min(96, Math.max(4, blackFrac * 100)).toFixed(1) + '%';
  $('stripEv').innerHTML = on && e ? '<small>EVAL</small>' + fmtEval(e) : '';
}

// ---------- moving ----------
function commit(m, how) {
  const from = C.mFrom(m), to = C.mTo(m), fl = C.mFlags(m);
  const san = live.san(m);
  live.make(m);
  G.sans.push(san);
  sel = -1; hint = null; evalScore = null;
  persist();
  render({ mv: { from, to } });
  if (how === 'drag') { const p = elAt(to); if (p) { p.el.style.transition = 'transform .09s ease-out'; later(120, () => { p.el.style.transition = ''; }); } }
  const land = how === 'drag' ? 0 : ms(150);
  const check = live.inCheck();
  later(land, () => (check ? sfx.check : fl & C.F_CASTLE ? sfx.castle : fl & C.F_CAP ? sfx.capture : sfx.move)());
  afterMove();
}

function afterMove() {
  if (!G) return;
  const st = live.status();
  if (st.over) { finish(st); return; }
  requestEval();
  if (G.you !== -1 && live.turn !== G.you) askOpponent();
  render({ mv: null, keep: true });
}

function askOpponent() {
  thinking = true;
  const t0 = clock, tk = token;
  drawPlayers();
  opponent.ask({ kind: 'move', fen: G.start, sans: G.sans.slice(), level: G.level, seed: (G.seed + G.sans.length * 7919) | 0 }, r => {
    if (tk !== token) return;
    const wait = Math.max(0, 550 - (clock - t0));
    later(ms(wait), () => {
      if (tk !== token) return;
      thinking = false;
      const m = live.parseSan(r.san) || live.parseSan(r.uci);
      if (!m) { drawPlayers(); return; }
      commit(m, 'engine');
    });
  });
}

function requestEval() {
  if (!settings.evalbar) return;
  const tk = token, n = G.sans.length;
  analyst.ask({ kind: 'eval', fen: G.start, sans: G.sans.slice(), nodes: 120000, time: 700 }, r => {
    if (tk !== token || n !== G.sans.length) return;
    evalScore = { score: r.score, mate: r.mate };
    drawEval();
  });
}

function askHint() {
  if (!isHumanTurn()) return;
  const tk = token, n = G.sans.length;
  ['hintD', 'hintM'].forEach(id => $(id).classList.add('busy'));
  analyst.ask({ kind: 'hint', fen: G.start, sans: G.sans.slice(), nodes: 400000, time: 1500 }, r => {
    ['hintD', 'hintM'].forEach(id => $(id).classList.remove('busy'));
    if (tk !== token || n !== G.sans.length || !r.uci) return;
    const m = live.parseSan(r.uci);
    hint = { from: C.mFrom(m), to: C.mTo(m) };
    evalScore = { score: r.score, mate: r.mate };
    sel = -1;
    render({ keep: true });
  });
}

function finish(st) {
  G.result = st;
  thinking = false;
  opponent.cancel();
  if (!G.recorded && G.level) {
    const s = stats[G.level] || (stats[G.level] = { w: 0, d: 0, l: 0 });
    if (st.winner === -1) s.d++; else if (st.winner === G.you) s.w++; else s.l++;
    G.recorded = true;
  }
  persist();
  render({ keep: true });
  const youWon = G.you === -1 ? null : st.winner === G.you;
  later(ms(st.reason === 'checkmate' ? 380 : 200), () => (st.winner === -1 ? sfx.draw : youWon === false ? sfx.lose : sfx.win)());
  later(ms(st.reason === 'checkmate' ? 2100 : 600), () => { if (G.result === st) showResult(); });
}

function takeBack() {
  if (!G.sans.length || view !== null) return;
  opponent.cancel(); analyst.cancel(); token++;
  thinking = false;
  let n = 1;
  if (G.you !== -1) {
    // back to the last position where it was your move
    n = live.turn === G.you ? 2 : 1;
    if (n > G.sans.length) n = G.sans.length;
  }
  hideResult();
  G.result = null;
  for (let i = 0; i < n; i++) {
    const lm = lastMoveOf(G.sans.length);
    G.sans.pop();
    live = C.replay(G.start, G.sans);
    sel = -1; hint = null; evalScore = null;
    if (i === n - 1) render({ mv: { from: lm.to, to: lm.from } });
    else render({ mv: { from: lm.to, to: lm.from } });
  }
  sfx.move();
  persist();
  afterMove();
}

function resign() {
  if (!G || G.result || G.you === -1 || !G.sans.length) return;
  token++; opponent.cancel();
  finish({ over: true, result: G.you ? '1-0' : '0-1', reason: 'resign', winner: G.you ^ 1 });
}

// ---------- review ----------
function goTo(ply) {
  if (!G) return;
  ply = Math.max(0, Math.min(G.sans.length, ply));
  const cur = shownPly();
  if (ply === cur && !(ply === G.sans.length && view !== null)) return;
  let mv = null;
  if (ply === cur + 1) { const lm = lastMoveOf(ply); mv = { from: lm.from, to: lm.to }; }
  else if (ply === cur - 1) { const lm = lastMoveOf(cur); mv = { from: lm.to, to: lm.from }; }
  view = ply === G.sans.length ? null : ply;
  sel = -1;
  if (view === null) hideResultQuiet();
  reviewEval = null;
  render({ mv });
  if (mv) sfx.move();
  if (view !== null && settings.evalbar) {
    const v = view;
    analyst.ask({ kind: 'eval', fen: G.start, sans: G.sans.slice(0, v), nodes: 100000, time: 600 }, r => { if (view === v) { reviewEval = { score: r.score, mate: r.mate }; drawEval(); } });
  } else if (view === null) requestEval();
}

// a first-time player is shown which pieces can move: one slow wave of lifts, a second a few seconds later, then
// stillness. Never a loop: pieces that keep moving on their own read as a shaking board.
let inviting = !saved.v && !saved.game, inviteWaves = 0;
function invite() {
  if (!inviting || inviteWaves) return;
  wave();
}
function wave() {
  if (!inviting || !G || G.sans.length || !isHumanTurn()) { stopInvite(); return; }
  inviteWaves++;
  const movable = new Set(live.legal().map(C.mFrom));
  let k = 0;
  pieceEls.forEach(p => {
    p.el.classList.remove('invite');
    if (!movable.has(p.sq)) return;
    void p.el.offsetWidth;
    p.el.querySelector('.pi').style.animationDelay = (0.8 + (k++) * 0.08) + 's';
    p.el.classList.add('invite');
  });
  if (inviteWaves < 2) later(7000, wave);
  else later(3000, stopInvite);
}
function stopInvite() { if (!inviting) return; inviting = false; pieceEls.forEach(p => p.el.classList.remove('invite')); }

// ---------- input ----------
let drag = null; // {sq, p, x0, y0, moved}
function legalFrom(sq) { return live.legal().filter(m => C.mFrom(m) === sq); }
function select(sq) {
  if (sel >= 0) { const p = elAt(sel); if (p) p.el.classList.remove('lift'); }
  sel = sq;
  if (sq >= 0) { const p = elAt(sq); if (p) p.el.classList.add('lift'); }
  sqEls.forEach((el, s) => el && el.classList.toggle('sel', s === sel));
  drawDots();
}
function ownPiece(sq) {
  const pc = live.b[sq];
  return pc && (pc >> 3) === live.turn;
}
function tryMove(from, to, how) {
  const cands = legalFrom(from).filter(m => C.mTo(m) === to);
  if (!cands.length) return false;
  if (C.mFlags(cands[0]) & C.F_PROMO) { askPromotion(from, to, cands, how); return true; }
  const p = elAt(from); if (p) p.el.classList.remove('lift');
  commit(cands[0], how);
  return true;
}

boardEl.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  audio(); stopInvite();
  if (view !== null) { goTo(G.sans.length); return; }
  if (!isHumanTurn() || $('promo').classList.contains('on')) return;
  const sq = pointSq(e);
  if (sq < 0) return;
  if (sel >= 0 && sq !== sel && !ownPiece(sq)) {
    if (!tryMove(sel, sq, 'tap')) { flashIllegal(sel, sq); select(-1); }
    return;
  }
  if (ownPiece(sq)) {
    const wasSel = sel === sq;
    if (!legalFrom(sq).length) { const p = elAt(sq); if (p) shakeEl(p); flashKingIfPinned(sq); sfx.bad(); select(-1); return; }
    select(sq);
    const p = elAt(sq);
    drag = { sq, p, x0: e.clientX, y0: e.clientY, moved: false, wasSel, touch: e.pointerType !== 'mouse' };
    boardEl.setPointerCapture(e.pointerId);
    e.preventDefault();
  } else select(-1);
});
let overSq = -1;
boardEl.addEventListener('pointermove', e => {
  if (!drag) return;
  // a finger wanders a few pixels during a tap; only a clear slide turns the tap into a drag
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < (drag.touch ? 12 : 5)) return;
  drag.moved = true;
  const r = boardEl.getBoundingClientRect(), s = r.width / 8;
  const x = (e.clientX - r.left) / s - .5, y = (e.clientY - r.top) / s - .5;
  drag.p.el.classList.add('drag');
  drag.p.el.style.transform = `translate(${x * 100}%,${y * 100}%)`;
  const sq = pointSq(e);
  if (sq !== overSq) {
    if (overSq >= 0 && sqEls[overSq]) sqEls[overSq].classList.remove('over');
    overSq = sq;
    if (sq >= 0 && sq !== drag.sq && sqEls[sq]) sqEls[sq].classList.add('over');
    pieceEls.forEach(p => p.el.classList.toggle('target', p.sq === sq && p !== drag.p && legalFrom(drag.sq).some(m => C.mTo(m) === sq)));
  }
});
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  if (overSq >= 0 && sqEls[overSq]) sqEls[overSq].classList.remove('over');
  overSq = -1;
  d.p.el.classList.remove('drag');
  pieceEls.forEach(p => p.el.classList.remove('target'));
  if (!d.moved) { if (d.wasSel) select(-1); return; }
  const sq = cancel ? -1 : pointSq(e);
  if (sq >= 0 && sq !== d.sq && tryMove(d.sq, sq, 'drag')) return;
  placeEl(d.p); // eased back home
  if (sq >= 0 && sq !== d.sq) flashIllegal(d.sq, sq);
}
boardEl.addEventListener('pointerup', e => endDrag(e, false));
boardEl.addEventListener('pointercancel', e => endDrag(e, true));

function shakeEl(p) { p.el.classList.remove('shake'); void p.el.offsetWidth; p.el.classList.add('shake'); later(320, () => p.el.classList.remove('shake')); }
// a move that is not allowed: if it would leave the king in check, show the king that is in danger
function flashIllegal(from, to) {
  const pc = live.b[from];
  const all = live.gen([]).filter(m => C.mFrom(m) === from && C.mTo(m) === to);
  if (all.length) { flashKing(); sfx.bad(); }
}
function flashKingIfPinned(sq) {
  if (live.gen([]).some(m => C.mFrom(m) === sq)) flashKing();
}
function flashKing() {
  const k = live.kings[live.turn], el = sqEls[k];
  if (!el) return;
  el.classList.add('check');
  later(ms(650), () => { if (!(live.inCheck() && view === null)) el.classList.remove('check'); });
}

// promotion picker: the four pieces drop down the file from the promotion square
function askPromotion(from, to, cands, how) {
  const box = $('promo'), [x, y] = sqXY(to), side = live.turn, down = y === 0;
  const order = [C.Q, C.N, C.R, C.B];
  let h = `<div class="col" style="left:${x * 12.5}%;${down ? 'top:0' : 'bottom:0'}">`;
  for (const t of (down ? order : order.slice().reverse())) h += `<button data-t="${t}" aria-label="${NAMES[t]}">${pieceSvg(t | (side << 3))}</button>`;
  h += '</div>';
  box.innerHTML = h;
  const p = elAt(from);
  if (p && how === 'drag') { p.sq = from; placeEl(p); }
  requestAnimationFrame(() => box.classList.add('on'));
  box.onclick = e => {
    const b = e.target.closest('button');
    box.classList.remove('on');
    if (!b) { select(-1); return; }
    const m = cands.find(c => C.mPromo(c) === +b.dataset.t);
    if (p) p.el.classList.remove('lift');
    commit(m, 'tap');
  };
}

// ---------- result card ----------
function showResult() {
  const st = G.result; if (!st) return;
  resultShown = true;
  const L = G.level ? C.LEVELS[G.level - 1] : null;
  const score = st.result === '1/2-1/2' ? '½–½' : st.result.replace('-', '–');
  const youWon = G.you !== -1 && st.winner === G.you, youLost = G.you !== -1 && st.winner === (G.you ^ 1);
  const colour = st.winner === 0 ? 'White' : 'Black';
  let verdict, why;
  const reasons = { stalemate: 'Stalemate: no legal move, but no check.', material: 'Neither side has enough pieces left to mate.', fifty: 'Fifty moves without a capture or a pawn move.', repetition: 'The same position came up three times.' };
  if (st.winner === -1) { verdict = 'A draw'; why = reasons[st.reason]; }
  else if (G.you === -1) { verdict = colour + ' wins'; why = st.reason === 'checkmate' ? 'Checkmate.' : (st.winner ? 'White' : 'Black') + ' resigned.'; }
  else if (youWon) { verdict = 'You win'; why = `Checkmate. The ${L.name} is beaten.`; }
  else { verdict = st.reason === 'resign' ? 'You resigned' : 'Checkmated'; why = st.reason === 'resign' ? `The ${L.name} takes this one.` : `The ${L.name} wins this one.`; }
  let rec = '';
  if (L) { const s = stats[G.level] || { w: 0, d: 0, l: 0 }; rec = `<div class="record">Your record: <b>${s.w}</b> won · <b>${s.d}</b> drawn · <b>${s.l}</b> lost</div>`; }
  let acts = '';
  if (G.level && youWon && G.level < 5) acts = `<button class="pill solid" data-a="next">Next: the ${C.LEVELS[G.level].name}</button><div class="row"><button class="pill" data-a="again">Rematch</button><button class="pill" data-a="review">Review</button></div>`;
  else if (G.level && youLost) acts = `<button class="pill solid" data-a="again">Try again</button><div class="row">${G.level > 1 ? '<button class="pill" data-a="easier">Easier opponent</button>' : ''}<button class="pill" data-a="review">Review</button></div>`;
  else acts = `<button class="pill solid" data-a="again">${G.level ? 'Rematch' : 'Play again'}</button><div class="row"><button class="pill" data-a="review">Review</button><button class="pill" data-a="new">New game</button></div>`;
  placeResult();
  $('result').innerHTML = `<div class="card" role="dialog" aria-label="${verdict}"><div class="score">${score}</div><div class="verdict">${verdict}</div><div class="why">${why}</div>${rec}<div class="acts">${acts}</div></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => $('result').classList.add('on')));
}
const wideMQ = matchMedia('(min-width:900px) and (min-height:560px), (min-width:600px) and (max-height:559px) and (orientation:landscape)');
function placeResult() { const want = wideMQ.matches ? document.querySelector('.sheetbox') : document.body; if ($('result').parentNode !== want) want.appendChild($('result')); }
function hideResult() { resultShown = false; $('result').classList.remove('on'); }
function hideResultQuiet() { if (resultShown) hideResult(); }
$('result').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]');
  if (!b) return;
  const a = b.dataset.a;
  const R = $('result'); R.classList.add('instant'); hideResult(); void R.offsetWidth; R.classList.remove('instant');
  const side = G.you === 0 ? 'b' : 'w'; // a rematch swaps colours
  if (a === 'review') { goTo(G.sans.length - 1); return; }
  if (a === 'new') { openNew(); return; }
  if (a === 'next') { prefs.level = G.level + 1; persist(); newGame(prefs.level, G.you ? 'b' : 'w'); return; }
  if (a === 'easier') { prefs.level = G.level - 1; persist(); newGame(prefs.level, G.you ? 'b' : 'w'); return; }
  if (a === 'again') newGame(G.level, G.level ? side : 'w');
});
$('result').addEventListener('pointerdown', e => e.stopPropagation());

// ---------- sheets ----------
const scrim = $('scrim'), panel = $('panel');
function openSheet(html, wire) { panel.innerHTML = html; wire(panel); scrim.classList.add('on'); const f = panel.querySelector('button'); if (f) f.focus({ preventScroll: true }); }
function closeSheet() { scrim.classList.remove('on'); }
scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
const X = '<button class="round" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
const TICK = '<svg class="i tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

function openNew() {
  let level = prefs.level, side = prefs.side;
  const draw = () => {
    let h = `<h2>New game ${X}</h2><h3>Opponent</h3><div class="opps">`;
    C.LEVELS.forEach(L => {
      const s = stats[L.id];
      const words = s ? [s.w && s.w + (s.w > 1 ? ' wins' : ' win'), s.d && s.d + (s.d > 1 ? ' draws' : ' draw'), s.l && s.l + (s.l > 1 ? ' losses' : ' loss')].filter(Boolean).join(' · ') : '';
      const rec = (s && s.w ? `<div class="won">${TICK}beaten</div>` : '') + words;
      h += `<button class="opp${level === L.id ? ' on' : ''}" data-l="${L.id}">${avatar(AV[L.id], true)}<div class="info"><div class="nm">${L.name}</div><div class="sub">${PIPS(L.id)}${L.blurb}</div></div><div class="rec">${rec}</div><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></button>`;
    });
    h += `<button class="opp${level === 0 ? ' on' : ''}" data-l="0">${avatar(C.K, false)}<div class="info"><div class="nm">A friend</div><div class="sub">Pass the device, take turns</div></div><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></button></div>`;
    if (level) h += `<h3>You play</h3><div class="seg">` + [['w', 'White', C.K], ['r', 'Random', 0], ['b', 'Black', C.K | C.BLACK]].map(([k, n, pc]) => `<button data-s="${k}" class="${side === k ? 'on' : ''}">${pc ? pieceSvg(pc) : ''}${n}</button>`).join('') + '</div>';
    h += `<button class="pill solid go" data-go>Play</button>`;
    openSheet(h, p => {
      p.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { level = +b.dataset.l; draw(); });
      p.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { side = b.dataset.s; draw(); });
      p.querySelector('[data-close]').onclick = closeSheet;
      p.querySelector('[data-go]').onclick = () => { prefs = { level, side }; closeSheet(); newGame(level, side); };
    });
  };
  draw();
}

function openMenu() {
  const draw = () => {
    const sw = (k, label) => `<button data-k="${k}" class="${settings[k] ? 'on' : ''}">${label}<span class="sw"></span></button>`;
    let h = `<h2>Game ${X}</h2><div class="menu-list">`;
    h += `<button data-a="flip">Flip the board<span class="state">F</span></button>`;
    h += sw('dots', 'Show legal moves') + sw('evalbar', 'Evaluation') + sw('sound', 'Sound');
    h += `<button data-a="pgn">Copy the game (PGN)</button>`;
    if (G.you !== -1 && !G.result && G.sans.length) h += `<button data-a="resign" class="danger">Resign</button>`;
    h += `</div><p class="credit">Pieces by Colin M. L. Burnett (BSD licence). A <a href="https://www.gptgames.dev/" target="_blank" rel="noopener">gptgames.dev</a> game.</p>`;
    openSheet(h, p => {
      p.querySelector('[data-close]').onclick = closeSheet;
      p.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
        settings[b.dataset.k] = !settings[b.dataset.k]; persist(); draw();
        if (b.dataset.k === 'evalbar' && settings.evalbar) requestEval();
        render({ keep: true });
      });
      p.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        const a = b.dataset.a;
        if (a === 'flip') { closeSheet(); flip(); }
        if (a === 'pgn') { copyPgn(); closeSheet(); }
        if (a === 'resign') { closeSheet(); resign(); }
      });
    });
  };
  draw();
}

function flip() { flipped = !flipped; buildSquares(); pieceEls.forEach(placeEl); render({ keep: true }); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function copyPgn() {
  const d = new Date(), L = G.level ? C.LEVELS[G.level - 1].name + ' (computer)' : 'Black';
  const tags = { Event: 'Casual game', Site: 'gptgames.dev', Date: `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`,
    White: G.you === 0 ? 'You' : G.you === 1 ? L : 'White', Black: G.you === 1 ? 'You' : G.you === 0 ? L : 'Black' };
  const text = C.pgn(G.start, G.sans, G.result ? G.result.result : '*', tags);
  const done = () => toast('Game copied');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy'); }
  ta.remove();
}

// ---------- buttons and keys ----------
$('newBtn').onclick = openNew;
$('menuD').onclick = openMenu; $('menuM').onclick = openMenu;
$('hintD').onclick = askHint; $('hintM').onclick = askHint;
$('undoD').onclick = takeBack; $('undoM').onclick = takeBack;
$('flipD').onclick = flip;
$('prevD').onclick = $('prevM').onclick = () => goTo(shownPly() - 1);
$('nextD').onclick = $('nextM').onclick = () => goTo(shownPly() + 1);
$('first').onclick = () => goTo(0);
$('last').onclick = () => goTo(G.sans.length);
$('backLive').onclick = e => { e.stopPropagation(); goTo(G.sans.length); };
$('backLive').addEventListener('pointerdown', e => e.stopPropagation());
for (const id of ['stripMoves', 'sheetMoves']) $(id).addEventListener('click', e => { const m = e.target.closest('.m'); if (m) goTo(+m.dataset.ply); });
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (scrim.classList.contains('on')) { if (e.key === 'Escape') closeSheet(); return; }
  const k = e.key;
  if (k === 'ArrowLeft') { goTo(shownPly() - 1); e.preventDefault(); }
  else if (k === 'ArrowRight') { goTo(shownPly() + 1); e.preventDefault(); }
  else if (k === 'Home') goTo(0);
  else if (k === 'End') goTo(G.sans.length);
  else if (k === 'f' || k === 'F') flip();
  else if (k === 'h' || k === 'H') askHint();
  else if (k === 'u' || k === 'U' || k === 'Backspace') takeBack();
  else if (k === 'n' || k === 'N') openNew();
  else if (k === 'Escape') { select(-1); hideResultQuiet(); }
});
addEventListener('resize', () => drawMoves());

// ---------- start ----------
$('mark').innerHTML = pieceSvg(C.N, INK, RED) + 'Chess';
if (restore()) {
  render({ jump: true });
  if (G.result) { later(300, showResult); }
  else afterMove();
} else newGame(prefs.level, prefs.side);
function debugLoad(sans, level, you) {
  // set up a game from a list of moves (for scripted checks of the page)
  opponent.cancel(); analyst.cancel(); token++;
  G = { start: C.START, sans: sans.slice(), level: level === undefined ? G.level : level, you: you === undefined ? G.you : you, result: null, recorded: false, seed: 1 };
  live = C.replay(G.start, G.sans); view = null; sel = -1; hint = null; evalScore = null; thinking = false; flipped = G.you === 1;
  hideResult(); render({ jump: true }); afterMove();
}
window.__chess = { load: debugLoad, get G() { return G; }, get live() { return live; }, goTo, newGame, takeBack, finish, commit, C, settings, stats, opponent, analyst, get thinking() { return thinking; } };
})();

</script>
