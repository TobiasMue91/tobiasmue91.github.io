<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>QIX – Cut the Dark, Reveal the Painting</title>
<meta name="description" content="QIX, the arcade classic remade: slide along the edge, cut into the dark and close the line to claim territory. Every claim reveals a painted landscape. Dodge the Qix and the Sparx. Keyboard and touch.">
<meta name="theme-color" content="#0b0919">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0919;--paper:#f3e9d2;--gold:#ffc857;--ember:#ff5a3c;--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
body{color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 40%,#1b1545 0,#0b0919 62%);z-index:-1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px 2px;min-height:46px}
#name{font:italic 400 clamp(17px,4.6vw,22px)/1 var(--serif);color:var(--paper);transition:opacity .5s var(--ease),transform .5s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#name.out{opacity:0;transform:translateY(-4px)}
.lab{font:700 13px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(243,233,210,.82)}
#tools{display:flex;align-items:center;gap:2px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--paper)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.9)}
#snd[aria-pressed=true] .on,#snd:not([aria-pressed=true]) .off{display:none}
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:0 6px}
#wrap{position:relative;border-radius:4px;box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--ink),0 22px 60px rgba(0,0,0,.65);will-change:transform}
canvas{display:block;border-radius:2px}
#hint{position:absolute;left:50%;bottom:22%;transform:translate(-50%,8px);max-width:calc(100% - 24px);padding:9px 16px;border-radius:99px;background:rgba(11,9,25,.84);border:1px solid rgba(255,200,87,.5);font:600 15px/1.25 var(--sans);color:var(--paper);text-align:center;opacity:0;transition:opacity .35s var(--ease),transform .35s var(--ease);pointer-events:none}
#hint.on{opacity:1;transform:translate(-50%,0)}
body.t #top,body.t #hud{opacity:0;transition:opacity .45s var(--ease)}#top,#hud{transition:opacity .45s var(--ease)}
#hint{width:max-content}#hint b{color:var(--gold)}
#thumb{position:absolute;left:50%;bottom:11%;width:46px;height:46px;margin-left:-23px;border-radius:50%;border:2px solid var(--gold);background:rgba(255,200,87,.2);opacity:0;pointer-events:none}
#thumb.on{animation:slide 2.4s var(--ease) infinite}
@keyframes slide{0%{opacity:0;transform:translateX(-60px) scale(.8)}18%{opacity:1;transform:translateX(-60px) scale(1)}70%{opacity:1;transform:translateX(60px) scale(1)}100%{opacity:0;transform:translateX(60px) scale(.9)}}
#hud{flex:none;display:flex;align-items:flex-end;gap:14px;padding:6px 16px 12px;min-height:84px}
#pc{min-width:116px}
#pcv{font:600 clamp(52px,15vw,72px)/.9 var(--serif);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
#pcv small{font-size:.42em;margin-left:2px;opacity:.75;font-weight:600;letter-spacing:0}
#bar{position:relative;flex:1;height:12px;border-radius:5px;background:rgba(243,233,210,.16);margin-bottom:8px}
#fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px;background:linear-gradient(90deg,#f3e9d2,#ffe9ad)}
#goal{position:absolute;top:-8px;width:4px;height:28px;margin-left:-1px;background:var(--gold);border-radius:2px}
#goal::after{content:"75";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:700 14px var(--sans);color:var(--gold)}
#side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#pips{display:flex;gap:9px;padding:2px 3px}
#pips i{width:19px;height:19px;background:var(--gold);transform:rotate(45deg) scale(1);transition:transform .35s var(--ease),background .35s,opacity .35s}
#pips i.x{background:transparent;box-shadow:inset 0 0 0 2px rgba(243,233,210,.4);transform:rotate(45deg) scale(.82)}
#score{font:700 24px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.04em}
#score.bump{animation:bump .3s var(--ease)}
@keyframes bump{40%{transform:scale(1.14)}}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s;z-index:5}
.ov.on{opacity:1;visibility:visible;transition:opacity .45s var(--ease)}
#title{background:radial-gradient(75% 60% at 50% 45%,rgba(11,9,25,.42),rgba(11,9,25,.78))}
#wm{font:700 clamp(96px,30vw,190px)/.8 var(--serif);letter-spacing:.06em;margin-right:-.06em;color:var(--paper);text-shadow:0 0 40px rgba(255,200,87,.25)}
#tag{font:italic 400 clamp(18px,4.8vw,24px)/1.3 var(--serif);color:var(--paper);max-width:21em}
.btn{min-height:56px;padding:0 38px;border-radius:99px;background:var(--gold);color:#241a05;font:700 17px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 8px 28px rgba(255,200,87,.3);transition:transform .2s var(--ease),box-shadow .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
#meta{font:600 13px/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(243,233,210,.78)}
#cred{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(243,233,210,.5)}
#card{justify-content:flex-end;padding:0 14px max(18px,env(safe-area-inset-bottom));pointer-events:none}
#card>*{pointer-events:auto}
#cardbox{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,460px);padding:20px 22px 22px;border-radius:22px;background:rgba(11,9,25,.9);border:1px solid rgba(243,233,210,.22);box-shadow:0 20px 60px rgba(0,0,0,.55);transform:translateY(18px);transition:transform .5s var(--ease)}
#card.on #cardbox{transform:none}
#card.over{justify-content:center;background:rgba(11,9,25,.78);pointer-events:auto}
.cap{font:700 12px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
#ct{font:600 clamp(36px,10vw,56px)/1 var(--serif)}
#cl{font:600 17px/1.55 var(--sans);color:rgba(243,233,210,.92)}
#cl b{color:var(--gold);font-weight:700}
#pause{background:rgba(11,9,25,.72)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}#thumb.on{animation:none;opacity:.8}}
@media (max-height:520px){#wm{font-size:80px}#hud{min-height:70px}}
</style>
</head>
<body>
<div id="top"><div id="name"></div><div id="tools"><span class="lab" id="lvl"></span><button class="ib" id="snd" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24"><path class="on" d="M4 9v6h4l5 4V5L8 9H4zM17 8.5a5 5 0 010 7M19.5 6a8.5 8.5 0 010 12"/><path class="off" d="M4 9v6h4l5 4V5L8 9H4zM17 9l5 6M22 9l-5 6"/></svg></button><button class="ib" id="pz" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></div></div>
<div id="stage"><div id="wrap"><canvas id="c" aria-label="Playfield"></canvas><div id="thumb"></div><div id="hint" role="status"></div></div></div>
<div id="hud"><div id="pc"><div class="lab">Claimed</div><div id="pcv">0<small>%</small></div></div><div id="bar"><div id="fill"></div><div id="goal"></div></div><div id="side"><div id="pips" aria-label="Lives"></div><div id="score">0</div></div></div>
<div class="ov on" id="title"><div id="wm">QIX</div><div id="tag">Cut the dark. Reveal the painting.</div><button class="btn" id="play">Play</button><div id="meta"></div><div id="cred">gptgames.dev</div></div>
<div class="ov" id="card"><div id="cardbox"><div class="cap" id="cc"></div><div id="ct"></div><div id="cl"></div><button class="btn" id="cb">Next</button></div></div>
<div class="ov" id="pause"><div id="ptitle" class="cap">Paused</div><button class="btn" id="resume">Resume</button></div>

<script id="core">
// DOM-free rules of QIX. The page only draws what this returns (see test/qix.mjs).
const QIX = (() => {
  'use strict';
  const SHAPES = { portrait: { w: 54, h: 96 }, square: { w: 80, h: 80 }, wide: { w: 112, h: 72 } };
  const TARGET = 0.75;
  const SUB = 1 / 120;            // simulation step
  const PLAYER_SPEED = 30;        // cells per second
  const STALL = 0.6;              // seconds standing still on a stake before the fuse lights
  const FUSE_SPEED = 26;          // cells per second along the stake
  const TURN_BUFFER = 0.18;       // a turn asked for this early is kept until the corner arrives
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];   // 0 up, 1 right, 2 down, 3 left

  function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  function levelSpec(n) {
    const k = n - 1;
    return {
      level: n,
      qix: n >= 9 ? 3 : n >= 4 ? 2 : 1,
      qixSpeed: Math.min(30, 14 + 1.5 * k),
      qixLen: n >= 4 ? 7 : 9,
      attract: Math.min(1, 0.3 + 0.08 * k),
      sparx: n >= 10 ? 4 : n >= 5 ? 3 : 2,
      sparxSpeed: Math.min(24, 11 + 1.2 * k),
      chase: Math.min(0.85, 0.3 + 0.06 * k),
      target: TARGET,
    };
  }

  function create(shape, seed) {
    const sh = SHAPES[shape] || SHAPES.square;
    const g = { shape, w: sh.w, h: sh.h, seed: seed >>> 0, level: 0, lives: 3, score: 0, phase: 'play', events: [], t: 0 };
    g.n = g.w * g.h;
    g.cells = new Uint8Array(g.n);
    g.mark = new Uint8Array(g.n);
    g.lab = new Int32Array(g.n);
    g.queue = new Int32Array(g.n);
    g.ring = 2 * g.w + 2 * g.h - 4;
    g.inner = (g.w - 2) * (g.h - 2);
    startLevel(g, 1);
    return g;
  }

  function startLevel(g, n) {
    g.level = n; g.spec = levelSpec(n);
    g.rand = rng(g.seed * 31 + n * 7919);
    g.cells.fill(0);
    for (let x = 0; x < g.w; x++) { g.cells[x] = 1; g.cells[(g.h - 1) * g.w + x] = 1; }
    for (let y = 0; y < g.h; y++) { g.cells[y * g.w] = 1; g.cells[y * g.w + g.w - 1] = 1; }
    g.claimed = g.ring;
    g.phase = 'play'; g.t = 0; g.cut = 0;
    const start = (g.h - 1) * g.w + (g.w >> 1);
    g.p = { i: start, prev: start, want: -1, wantAt: -9, cur: -1, acc: 0, drawing: false, origin: start, trail: [], idle: 0, fuse: 0, shield: 1.6 };
    g.qixes = [];
    for (let k = 0; k < g.spec.qix; k++) {
      const a = g.rand() * 6.283;
      g.qixes.push({
        x: g.w / 2 + (k ? (k % 2 ? 1 : -1) * g.w * 0.2 : 0), y: g.h * 0.4 + (k ? g.h * 0.1 * k : 0),
        phi: a, th: g.rand() * 3.14, om: (g.rand() < 0.5 ? -1 : 1) * (2 + g.rand() * 2.4), omT: 0.5 + g.rand() * 0.9,
        wphi: 0, wphiT: 0, len: g.spec.qixLen, nominal: g.spec.qixLen, surge: 0,
      });
    }
    g.sparx = [];
    for (let k = 0; k < g.spec.sparx; k++) {
      const i = k % 2 ? 0 * g.w + (g.w >> 1) + 1 : (g.w >> 1);
      g.sparx.push({ i, prev: i + (k % 2 ? -1 : 1), acc: 0, sleep: 1.4 + 0.5 * k, off: 0, dirSign: k % 2 ? 1 : -1 });
    }
    // two sparx start on the top edge, walking apart
    for (let k = 0; k < g.sparx.length; k++) { const s = g.sparx[k]; s.i = (g.w >> 1) + (k % 2 ? 1 : 0); s.prev = k % 2 ? s.i - 1 : s.i + 1; if (k >= 2) { s.i = (g.w >> 1) + 3 * (k - 1); s.prev = s.i - 1; } }
    g.events.push({ type: 'level', level: n });
  }

  const px = (g, i) => i % g.w, py = (g, i) => (i / g.w) | 0;
  const idx = (g, x, y) => y * g.w + x;

  // a claimed cell is on the rim when any of its eight neighbours is not claimed
  function isRim(g, i, cells) {
    cells = cells || g.cells;
    if (cells[i] !== 1) return false;
    const x = i % g.w, y = (i / g.w) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= g.w || ny >= g.h) continue;
      if (cells[ny * g.w + nx] !== 1) return true;
    }
    return false;
  }

  // what moving from the player's cell in direction d would do
  function probe(g, d, rimOnly) {
    const p = g.p, x = px(g, p.i) + DX[d], y = py(g, p.i) + DY[d];
    if (x < 0 || y < 0 || x >= g.w || y >= g.h) return null;
    const q = idx(g, x, y), c = g.cells[q];
    if (p.drawing) {
      const back = p.trail.length >= 2 ? p.trail[p.trail.length - 2] : p.origin;
      if (q === back && (c === 2 || c === 1)) { if (c === 2 || p.trail.length === 1) return { kind: 'retract', q }; }
      if (c === 1) return { kind: 'close', q };
      if (c === 0) return { kind: 'extend', q };
      return null;
    }
    if (c === 1 && isRim(g, q)) return { kind: 'rim', q };
    if (c === 0 && !rimOnly) return { kind: 'start', q };
    return null;
  }

  function chooseMove(g) {
    const p = g.p;
    if (p.want < 0) return null;
    const m = probe(g, p.want, false);
    if (m) return { d: p.want, m };
    if (p.cur >= 0 && g.t - p.wantAt < TURN_BUFFER) {
      const c = probe(g, p.cur, true);
      if (c && (c.kind === 'rim' || c.kind === 'extend')) return { d: p.cur, m: c };
    }
    return null;
  }

  function setDir(g, d) { if (g.p.want !== d) { g.p.want = d; g.p.wantAt = g.t; } }

  function applyMove(g, d, m) {
    const p = g.p;
    p.prev = p.i; p.cur = d; p.idle = 0;
    if (m.kind === 'rim') { p.i = m.q; return; }
    if (m.kind === 'start') { p.drawing = true; p.origin = p.i; p.trail = [m.q]; g.cells[m.q] = 2; p.i = m.q; p.fuse = 0; g.events.push({ type: 'start' }); return; }
    if (m.kind === 'extend') { p.trail.push(m.q); g.cells[m.q] = 2; p.i = m.q; return; }
    if (m.kind === 'retract') {
      const h = p.trail.pop(); g.cells[h] = 0;
      if (!p.trail.length) { p.drawing = false; p.i = p.origin; p.fuse = 0; g.events.push({ type: 'abort' }); }
      else p.i = p.trail[p.trail.length - 1];
      return;
    }
    if (m.kind === 'close') { p.i = m.q; capture(g); }
  }

  function qixSamples(q, fn) {
    const c = Math.cos(q.th), s = Math.sin(q.th);
    for (let t = 0; ; t += 0.5) { const u = Math.min(t, q.len); fn(q.x + c * u, q.y + s * u); if (u) fn(q.x - c * u, q.y - s * u); if (t >= q.len) break; }
  }

  // close a stake: seal the trail, then claim every pocket the Qix are not in
  function capture(g) {
    const p = g.p, w = g.w, h = g.h, cells = g.cells, mark = g.mark, lab = g.lab, queue = g.queue;
    mark.fill(0);
    for (const q of g.qixes) qixSamples(q, (x, y) => { const cx = Math.floor(x), cy = Math.floor(y); if (cx >= 0 && cy >= 0 && cx < w && cy < h) mark[cy * w + cx] = 1; });
    const trail = p.trail;
    for (const c of trail) cells[c] = 1;
    lab.fill(0);
    let nl = 0; const claimedCells = [];
    const regions = [];
    for (let s = 0; s < g.n; s++) {
      if (cells[s] !== 0 || lab[s]) continue;
      nl++; let qh = 0, qt = 0, keep = false;
      queue[qt++] = s; lab[s] = nl;
      while (qh < qt) {
        const c = queue[qh++]; if (mark[c]) keep = true;
        const x = c % w, y = (c / w) | 0;
        if (x > 0 && cells[c - 1] === 0 && !lab[c - 1]) { lab[c - 1] = nl; queue[qt++] = c - 1; }
        if (x < w - 1 && cells[c + 1] === 0 && !lab[c + 1]) { lab[c + 1] = nl; queue[qt++] = c + 1; }
        if (y > 0 && cells[c - w] === 0 && !lab[c - w]) { lab[c - w] = nl; queue[qt++] = c - w; }
        if (y < h - 1 && cells[c + w] === 0 && !lab[c + w]) { lab[c + w] = nl; queue[qt++] = c + w; }
      }
      if (!keep) regions.push(Array.from(queue.subarray(0, qt)));
    }
    for (const r of regions) for (const c of r) { cells[c] = 1; claimedCells.push(c); }
    // reveal order: distance from the stake, through the newly claimed cells
    const all = trail.concat(claimedCells), dist = new Map();
    let frontier = trail.slice(); for (const c of trail) dist.set(c, 0);
    let d = 0;
    const isNew = new Set(claimedCells);
    while (frontier.length) {
      d++; const next = [];
      for (const c of frontier) {
        const x = c % w, y = (c / w) | 0;
        for (let k = 0; k < 4; k++) {
          const nx = x + DX[k], ny = y + DY[k]; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const n = ny * w + nx; if (isNew.has(n) && !dist.has(n)) { dist.set(n, d); next.push(n); }
        }
      }
      frontier = next;
    }
    const dists = all.map(c => dist.get(c) || 0);
    g.claimed += all.length;
    const k = all.length;
    const mult = 1 + Math.floor(8 * k / g.inner * 2) / 2;
    const pts = Math.round(k * mult / 10) * 10;
    g.score += pts; g.cut++;
    p.drawing = false; p.trail = []; p.fuse = 0; p.origin = p.i;
    g.events.push({ type: 'capture', cells: all, dist: dists, n: k, pct: k / g.inner, mult, pts, trail: trail.length });
    // anyone left standing on a wall that is no longer a wall
    if (!isRim(g, p.i)) { const n = nearestRim(g, p.i); if (n >= 0) p.i = n; }
    p.prev = p.i;
    for (const s of g.sparx) {
      if (s.off || !isRim(g, s.i)) { if (!s.off) { g.score += 500; s.off = 4.5; g.events.push({ type: 'eaten', x: px(g, s.i), y: py(g, s.i), pts: 500 }); } }
    }
    if (pct(g) >= g.spec.target - 1e-9) clearLevel(g);
  }

  function nearestRim(g, from) {
    const seen = new Set([from]); let fr = [from];
    while (fr.length) {
      const nx = [];
      for (const c of fr) {
        if (isRim(g, c)) return c;
        const x = c % g.w, y = (c / g.w) | 0;
        for (let k = 0; k < 4; k++) { const a = x + DX[k], b = y + DY[k]; if (a < 0 || b < 0 || a >= g.w || b >= g.h) continue; const n = b * g.w + a; if (!seen.has(n) && g.cells[n] === 1) { seen.add(n); nx.push(n); } }
      }
      fr = nx;
    }
    return -1;
  }

  const pct = g => (g.claimed - g.ring) / g.inner;

  function clearLevel(g) {
    const reached = pct(g);
    const rest = []; for (let i = 0; i < g.n; i++) if (g.cells[i] === 0) rest.push(i);
    const bonus = Math.round((reached - g.spec.target) * 100) * 200 + g.lives * 1000 + 1000;
    g.score += bonus;
    for (const i of rest) g.cells[i] = 1;
    g.claimed = g.n; g.phase = 'clear';
    g.events.push({ type: 'clear', pct: reached, bonus, rest, level: g.level });
  }

  function die(g, cause) {
    const p = g.p;
    if ((cause === 'sparx' && p.shield > 0) || g.phase !== 'play') return;
    const trail = p.trail.slice();
    for (const c of trail) g.cells[c] = 0;
