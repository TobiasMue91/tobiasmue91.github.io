<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simon Says</title>
<meta name="description" content="A memory game where you have to follow the sequence of commands and repeat it back! Four lit pads, four tones, one sequence that only ever gets longer.">
<meta name="theme-color" content="#08090c">
<style>
:root{--ink:#f4f6fb;--dim:#aab0c2;--g:#22ff88;--r:#ff3250;--y:#ffd500;--b:#2f94ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#08090c;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
.room{position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,#171a23,transparent 70%)}
.amb{position:absolute;inset:0;opacity:0;transition:opacity .45s ease-out;background:radial-gradient(circle at 50% 50%,var(--c,#33f08a),transparent 52vmin);mix-blend-mode:screen}
.amb.on{opacity:.3;transition:opacity .05s ease-out}
.best,.snd{position:absolute;top:max(14px,env(safe-area-inset-top));font-size:14px;font-weight:700;color:var(--dim);letter-spacing:.08em}
.best{left:max(18px,env(safe-area-inset-left));line-height:1;opacity:0;transition:opacity .3s}
.best.has.show{opacity:1}
.best b{display:block;font-size:30px;color:var(--ink);font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.snd{right:max(10px,env(safe-area-inset-right));width:48px;height:48px;border:0;background:none;color:var(--dim);display:grid;place-items:center;border-radius:50%;cursor:pointer}
.snd:hover{color:var(--ink)} .snd:focus-visible,.hub:focus-visible,.mode button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.snd svg{width:24px;height:24px}
.col{transform:translateY(max(0px,calc((100dvh - 700px) * .05)));display:flex;flex-direction:column;align-items:center;position:relative}
.stage{position:relative;--s:min(92vw,calc(100dvh - 150px),760px);width:var(--s);height:var(--s);margin-top:-8px}
@supports not (height:100dvh){.stage{--s:min(92vw,calc(100vh - 150px),760px)}}
#board{width:100%;height:100%;display:block;filter:drop-shadow(0 28px 36px rgba(0,0,0,.7));touch-action:none;cursor:pointer;overflow:visible}
#board.locked{cursor:default}
#board.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.lit,.glow{opacity:0;transition:opacity .28s ease-out}
.on .lit{opacity:1;transition:opacity .035s ease-out}
.on .glow{opacity:.95;transition:opacity .035s ease-out}
.hubtxt{pointer-events:none;font-weight:800;text-anchor:middle;fill:var(--ink)}
#num{transition:transform .22s cubic-bezier(.2,.9,.3,1.4);transform-box:fill-box;transform-origin:center}
#num.pop{transform:scale(1.14)}
.tick{fill:none;stroke-width:9;stroke-linecap:round;stroke:rgba(255,255,255,.16);transition:stroke .12s}
.tick.next{stroke:rgba(255,255,255,.75);animation:nx 1s ease-in-out infinite}
@keyframes nx{50%{stroke:rgba(255,255,255,.35)}}
#turn{fill:none;stroke:#fff;stroke-width:2;opacity:0;transition:opacity .25s}
#turn.on{opacity:.5;animation:turn 1.1s ease-in-out infinite}
@keyframes turn{50%{opacity:.12}}
#hubtint{opacity:0;transition:opacity .3s ease-out}
.on-any #hubtint{opacity:.16;transition:opacity .035s}
.hub{position:absolute;left:50%;top:50%;width:33%;height:33%;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;cursor:pointer}
.hub[disabled]{cursor:default}
#play{transition:opacity .2s}
.breath{animation:breath 1.9s ease-in-out infinite}
@keyframes breath{50%{opacity:.55}}
.foot{height:48px;margin-top:12px;display:flex;align-items:center}
.mode{display:flex;background:#12141b;border:1.5px solid #2d3140;border-radius:99px;padding:3px;transition:opacity .25s}
.mode button{border:0;background:none;color:#aab0c2;font:700 15px/1 inherit;font-family:inherit;padding:0 18px;height:40px;border-radius:99px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:background .15s,color .15s}
.mode button[aria-pressed=true]{background:#2a2f3e;color:#fff}
.mode i{font-style:normal;font-size:13px;color:#ffd500}
.mode[hidden]{display:flex;visibility:hidden;opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.logo-gap{}
@media (prefers-reduced-motion:reduce){.tick.next,#turn.on{animation:none}#board.shake{animation:none}#num{transition:none}.breath{animation:none}.amb,.lit,.glow{transition-duration:.01s}}
</style>
</head>
<body>
<script src="../logo.js"></script>
<div class="room"></div><div class="amb" id="amb"></div>
<div class="best" id="best">BEST<b id="bestn">0</b></div>
<button class="snd" id="snd" aria-label="Sound on" aria-pressed="true"></button>
<main class="col"><div class="stage" id="stage">
<svg id="board" viewBox="0 0 400 400" role="group" aria-label="Four pads: green top left, red top right, yellow bottom left, blue bottom right">
<defs>
<radialGradient id="bz" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#3a3f4d"/><stop offset=".5" stop-color="#1b1e27"/><stop offset="1" stop-color="#0c0d12"/></radialGradient>
<radialGradient id="well" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#050608"/><stop offset="1" stop-color="#0b0c10"/></radialGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".35" stop-color="#fff" stop-opacity=".03"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
<radialGradient id="hubg" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#262a35"/><stop offset="1" stop-color="#0d0f14"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<circle cx="200" cy="200" r="198" fill="url(#bz)"/>
<circle cx="200" cy="200" r="196" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
<circle cx="200" cy="200" r="191.5" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="3"/>
<circle cx="200" cy="200" r="190" fill="url(#well)" stroke="#000" stroke-opacity=".7" stroke-width="2"/>
<g id="pads"></g>
<circle cx="200" cy="200" r="66" fill="url(#hubg)" stroke="#3a3f4d" stroke-width="2"/>
<circle id="hubtint" cx="200" cy="200" r="64" fill="#fff"/>
<circle id="turn" cx="200" cy="200" r="60"/>
<g id="ticks"></g>
<g id="hubfx">
<path id="play" d="M188 178 L224 200 L188 222 Z" fill="#f4f6fb" stroke="#f4f6fb" stroke-width="8" stroke-linejoin="round"/>
<text id="num" class="hubtxt" x="200" y="216" font-size="50">0</text>
<text id="lab" class="hubtxt" x="200" y="238" font-size="14" letter-spacing="1.2" style="fill:#c9cddb"></text>
</g>
</svg>
<button class="hub" id="hub" aria-label="Start"></button>
</div>
<div class="foot"><div class="mode" id="mode" role="group" aria-label="Mode"><button data-m="free" aria-pressed="true">Free play</button><button data-m="daily" aria-pressed="false">Daily<i id="streak"></i></button></div></div></main>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script id="core">
var SIMON = (function () {
  'use strict';
  var PADS = 4;
  // Simon's four original pitches (Hz), green, red, yellow, blue
  var TONES = [209, 252, 310, 415];

  function hash(a, b) {                       // two ints -> uint32, so a pad depends only on (seed, index)
    var h = (a ^ 0x9e3779b9) >>> 0;
    h = Math.imul(h ^ (b + 0x7f4a7c15), 0x85ebca6b) >>> 0;
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0; h ^= h >>> 16;
    return h >>> 0;
  }
  function seedOf(text) {                     // any string -> uint32
    var h = 2166136261;
    for (var i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619) >>> 0;
    return h >>> 0;
  }
  // The sequence is prefix-stable: sequence(seed, 5) is the first five of sequence(seed, 50).
  // The one fairness rule: never the same pad four times running (it would read as a glitch, not a pattern).
  function sequence(seed, n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var p = hash(seed, i) % PADS;
      var k = out.length;
      if (k >= 3 && out[k - 1] === p && out[k - 2] === p && out[k - 3] === p) p = (p + 1 + hash(seed, i + 4096) % (PADS - 1)) % PADS;
      out.push(p);
    }
    return out;
  }
  // Playback tempo for a sequence of length n, in ms. It tightens as the sequence grows, like the toy.
  function tempo(n) {
    var on = Math.max(170, Math.round(480 - 17 * (n - 1)));
    var gap = Math.max(80, Math.round(on * 0.42));
    return { on: on, gap: gap };
  }
  function schedule(n) {                      // when each step of a length-n playback lights and darkens
    var t = tempo(n), at = 0, out = [];
    for (var i = 0; i < n; i++) { out.push({ i: i, on: at, off: at + t.on }); at += t.on + t.gap; }
    return out;
  }

  // ----- the game: a plain state machine; the page only animates what it returns -----
  function start(seed) { return { seed: seed >>> 0, len: 1, pos: 0, phase: 'show', score: 0 }; }
  function expected(s) { return sequence(s.seed, s.len)[s.pos]; }
  // 'show' ends when the page has played the sequence
  function shown(s) { return s.phase === 'show' ? { seed: s.seed, len: s.len, pos: 0, phase: 'echo', score: s.score } : s; }
  // press: returns { state, result: 'ok' | 'round' | 'wrong' | 'ignored', want }
  function press(s, pad) {
    if (s.phase !== 'echo') return { state: s, result: 'ignored' };
    var want = expected(s);
    if (pad !== want) return { state: { seed: s.seed, len: s.len, pos: s.pos, phase: 'over', score: s.score }, result: 'wrong', want: want };
    if (s.pos + 1 === s.len) return { state: { seed: s.seed, len: s.len + 1, pos: 0, phase: 'show', score: s.len }, result: 'round', want: want };
    return { state: { seed: s.seed, len: s.len, pos: s.pos + 1, phase: 'echo', score: s.score }, result: 'ok', want: want };
  }

  // ----- saves: trust nothing -----
  function int(v) { v = Math.floor(Number(v)); return isFinite(v) && v > 0 ? Math.min(v, 9999) : 0; }
  function sanitize(raw) {
    var o = { best: 0, days: {} };
    if (!raw || typeof raw !== 'object') return o;
    o.best = int(raw.best);
    var d = raw.days && typeof raw.days === 'object' ? raw.days : {};
    Object.keys(d).filter(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); }).sort().slice(-60).forEach(function (k) {
      var v = int(d[k]); if (v) o.days[k] = v;
    });
    return o;
  }
  function record(save, score, day) {         // day = 'YYYY-MM-DD' for the daily, null for free play
    var o = sanitize(save), s = int(score), isBest = false;
    if (day) { if (s > (o.days[day] || 0)) { o.days[day] = s; isBest = true; } }
    else if (s > o.best) { o.best = s; isBest = true; }
    return { save: sanitize(o), isBest: isBest };
  }
  function dayOf(date) {                      // local calendar day
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return date.getFullYear() + '-' + p(date.getMonth() + 1) + '-' + p(date.getDate());
  }
  function streak(save, today) {              // consecutive days played, ending today or yesterday
    var o = sanitize(save), n = 0, d = new Date(today + 'T12:00:00');
    if (!o.days[dayOf(d)]) d.setDate(d.getDate() - 1);
    while (o.days[dayOf(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  return { PADS: PADS, TONES: TONES, hash: hash, seedOf: seedOf, sequence: sequence, tempo: tempo, schedule: schedule,
    start: start, expected: expected, shown: shown, press: press, sanitize: sanitize, record: record, dayOf: dayOf, streak: streak };
})();

</script>
<script>
(function () {
  'use strict';
  var KEY = 'simon_says_v2';
  var COL = [['#0b6e37', '#22ff88'], ['#9c1a2d', '#ff3250'], ['#a07600', '#ffd500'], ['#16479f', '#2f94ff']];
  var ANGLE = [[180, 270], [270, 360], [90, 180], [0, 90]];   // green TL, red TR, yellow BL, blue BR
  var NAME = ['green', 'red', 'yellow', 'blue'];
  var KEYS = { q: 0, w: 1, a: 2, s: 3, 1: 0, 2: 1, 3: 2, 4: 3 };
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), hub = $('hub'), num = $('num'), lab = $('lab'), play = $('play'), ticksG = $('ticks');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)');

  // ---------- storage ----------
  var save = core(load());
  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function core(raw) { return SIMON.sanitize(raw); }
  var prefs = { daily: false, mute: false };
  try { var p = JSON.parse(localStorage.getItem(KEY + '_prefs')); if (p) { prefs.daily = !!p.daily; prefs.mute = !!p.mute; } } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); localStorage.setItem(KEY + '_prefs', JSON.stringify(prefs)); } catch (e) {} }
  // the old page kept one number, 'simonBest' (rounds completed, scored the same way); carry it over once
  try {
    var old = parseInt(localStorage.getItem('simonBest'), 10);
    if (old > save.best) { save = SIMON.record(save, old, null).save; persist(); }
  } catch (e) {}

  // ---------- drawing ----------
  var NS = 'http://www.w3.org/2000/svg';
  function pt(r, a) { a = a * Math.PI / 180; return (200 + r * Math.cos(a)).toFixed(2) + ' ' + (200 + r * Math.sin(a)).toFixed(2); }
  function sector(a0, a1, r0, r1, gap) {
    var ga = gap / r1 * 57.3, gi = gap / r0 * 57.3;
    return 'M' + pt(r1, a0 + ga) + 'A' + r1 + ' ' + r1 + ' 0 0 1 ' + pt(r1, a1 - ga) + 'L' + pt(r0, a1 - gi) + 'A' + r0 + ' ' + r0 + ' 0 0 0 ' + pt(r0, a0 + gi) + 'Z';
  }
  var padEls = [];
  COL.forEach(function (c, i) {
    var d = sector(ANGLE[i][0], ANGLE[i][1], 93, 177, 9), g = document.createElementNS(NS, 'g');
    var st = ' stroke-width="10" stroke-linejoin="round"';
    g.innerHTML = '<path class="glow" d="' + d + '" fill="' + c[1] + '" stroke="' + c[1] + '" stroke-width="12" stroke-linejoin="round" filter="url(#blur)"/>' +
      '<path d="' + d + '" fill="' + c[0] + '" stroke="' + c[0] + '"' + st + '/>' +
      '<path class="lit" d="' + d + '" fill="' + c[1] + '" stroke="' + c[1] + '"' + st + '/>' +
      '<path d="' + d + '" fill="url(#gloss)"/>' +
      '';
    $('pads').appendChild(g); padEls.push(g);
  });

  var N_SEG = 24;
  function drawTicks(len) {
    var n = Math.min(len, N_SEG), gap = n > 12 ? 2.5 : 4.5, h = '';
    if (len === 0) { ticksG.innerHTML = ''; ticksG.n = 0; return; }
    for (var i = 0; i < n; i++) {
      var a0 = -90 + i * 360 / n + gap, a1 = -90 + (i + 1) * 360 / n - gap;
      h += '<path class="tick" d="M' + pt(77.5, a0) + 'A77.5 77.5 0 0 1 ' + pt(77.5, a1) + '"/>';
    }
    ticksG.innerHTML = h; ticksG.n = n; markNext(0, len);
  }
  function markNext(pos, len) {
    var n = ticksG.n, k = Math.min(n - 1, Math.floor(pos * n / len));
    for (var i = 0; i < n; i++) ticksG.children[i].classList.toggle('next', mode === 'echo' && i === k && !ticksG.children[i].style.stroke);
  }
  function fillTick(pos, len, pad, bad) {         // the step just answered
    var n = ticksG.n, k = Math.min(n - 1, Math.floor(pos * n / len)), el = ticksG.children[k];
    if (el) { if (!bad) el.style.stroke = COL[pad][1]; el.classList.remove('next'); }
    if (!bad) markNext(pos + 1, len);
  }

  // ---------- audio ----------
  var ac = null, master = null;
  function audio() {
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC(); master = ac.createGain(); master.gain.value = 0.5;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      master.connect(lp); lp.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function voice(freq, type, vol) {
    if (prefs.mute || !audio()) return null;
    var t = ac.currentTime, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sawtooth'; o.frequency.value = freq;
    o2.type = 'sine'; o2.frequency.value = freq / 2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    o.connect(g); o2.connect(g); g.connect(master); o.start(t); o2.start(t);
    return { stop: function () {
      var u = ac.currentTime; g.gain.cancelScheduledValues(u); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), u);
      g.gain.exponentialRampToValueAtTime(0.0001, u + 0.07); o.stop(u + 0.09); o2.stop(u + 0.09);
    } };
  }
  function buzz() {
    if (prefs.mute || !audio()) return;
    var t = ac.currentTime, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 96; o2.frequency.value = 101;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.02); g.gain.setValueAtTime(0.32, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    o.connect(g); o2.connect(g); g.connect(master); o.start(t); o2.start(t); o.stop(t + 0.8); o2.stop(t + 0.8);
  }
  function buzzHaptic(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ---------- lights ----------
  var amb = $('amb'), voices = [];
  function lightOn(i) {
    padEls[i].classList.add('on'); $('hubtint').setAttribute('fill', COL[i][1]); board.classList.add('on-any');
    amb.style.setProperty('--c', COL[i][1]); amb.classList.add('on');
    if (voices[i]) voices[i].stop();
    voices[i] = voice(SIMON.TONES[i] * 1.0, 'sawtooth', 0.2);
  }
  function lightOff(i) {
    padEls[i].classList.remove('on');
    if (!document.querySelector('#pads .on')) { amb.classList.remove('on'); board.classList.remove('on-any'); }
    if (voices[i]) { voices[i].stop(); voices[i] = null; }
  }
  function allOff() { for (var i = 0; i < 4; i++) lightOff(i); }

  // ---------- game ----------
  var timers = [], S = null, mode = 'idle', pressed = {}, today = SIMON.dayOf(new Date());
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function say(t) { $('live').textContent = t; }

  function setHub(state) {
    var n = state.num, lbl = state.label;
    play.style.opacity = state.play ? 1 : 0; play.classList.toggle('breath', !!state.play);
    num.textContent = n == null ? '' : n; num.setAttribute('font-size', n > 99 ? 38 : 50);
    lab.textContent = lbl; $('turn').classList.toggle('on', mode === 'echo'); lab.style.fill = state.accent ? '#ffd500' : '#c9cddb';
    hub.disabled = !state.tap; hub.setAttribute('aria-label', state.tap ? state.aria : state.label);
    board.classList.toggle('locked', mode !== 'echo');
  }
  function refreshChrome() {
    var idle = mode === 'idle' || mode === 'over';
    $('mode').hidden = !idle;
    Array.prototype.forEach.call($('mode').children, function (b) { b.setAttribute('aria-pressed', String((b.dataset.m === 'daily') === prefs.daily)); });
    var st = SIMON.streak(save, today);
    $('streak').textContent = st > 0 ? st + '\u00a0' + (st > 1 ? 'days' : 'day') : '';
    var b = prefs.daily ? (save.days[today] || 0) : save.best;
    $('bestn').textContent = b; $('best').classList.toggle('has', b > 0); $('best').classList.toggle('show', idle);
    $('best').firstChild.nodeValue = prefs.daily ? 'TODAY' : 'BEST';
  }
  function idleHub() {
    mode = 'idle';
    setHub({ play: true, num: null, label: prefs.daily ? 'DAILY' : '', tap: true, aria: 'Start a game' });
    drawTicks(0); refreshChrome();
  }

  function startGame() {
    audio(); clearTimers(); allOff();
    var seed = prefs.daily ? SIMON.seedOf('simon-' + today) : (seedParam() || (Math.random() * 4294967296) >>> 0);
    S = SIMON.start(seed); mode = 'show';
    refreshChrome(); round();
  }
  function seedParam() {
    var m = /[?&]seed=([^&]+)/.exec(location.search); return m ? SIMON.seedOf(decodeURIComponent(m[1])) : 0;
  }
  function round() {
    clearTimers(); allOff(); mode = 'show'; pressed = {};
    drawTicks(S.len);
    setHub({ num: S.len, label: 'WATCH', tap: false });
    refreshChrome(); say('Watch. Sequence of ' + S.len);
    var seq = SIMON.sequence(S.seed, S.len), sch = SIMON.schedule(S.len);
    sch.forEach(function (e) {
      later(function () { lightOn(seq[e.i]); }, 700 + e.on);
      later(function () { lightOff(seq[e.i]); }, 700 + e.off);
    });
    later(function () {
      S = SIMON.shown(S); mode = 'echo';
      setHub({ num: S.len, label: 'YOUR TURN', tap: false }); board.classList.remove('locked'); markNext(0, S.len);
      say('Your turn');
    }, 700 + sch[sch.length - 1].off + 120);
  }

  function padAt(ev) {
    var r = board.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * 400 - 200, y = (ev.clientY - r.top) / r.height * 400 - 200;
    var d = Math.sqrt(x * x + y * y);
    if (d < 74 || d > 205) return -1;
    return (x < 0 ? 0 : 1) + (y < 0 ? 0 : 2);   // 0 green TL, 1 red TR, 2 yellow BL, 3 blue BR
  }
  function down(i, id) {
    if (mode !== 'echo' || pressed[id] != null) return;
    pressed[id] = i;
    lightOn(i); buzzHaptic(10);                              // light, tone and buzz in the frame of the press
    var r = SIMON.press(S, i), pos = S.pos, len = S.len;
    if (r.result === 'ignored') return;
    S = r.state;
    if (r.result === 'wrong') return fail(i, r.want, pos, len);
    fillTick(pos, len, i, false);
    if (r.result === 'round') {
      mode = 'between'; board.classList.add('locked');
      num.classList.add('pop'); later(function () { num.classList.remove('pop'); }, 220);
      later(round, 900);
    }
  }
  function up(id) {
    var i = pressed[id]; if (i == null) return;
    delete pressed[id];
    later(function () { lightOff(i); }, 110);
  }
  function fail(i, want, pos, len) {
    mode = 'over'; clearTimers(); board.classList.add('locked');
    fillTick(pos, len, i, true);
    lightOff(i); buzz(); buzzHaptic([70, 40, 160]);
    amb.style.setProperty('--c', '#ff1f3d'); amb.classList.add('on'); later(function () { amb.classList.remove('on'); }, 260);
    if (!reduce.matches) { board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake'); }
    // show what it should have been
    for (var k = 0; k < 3; k++) { (function (k) { later(function () { lightOn(want); }, 360 + k * 300); later(function () { lightOff(want); }, 360 + k * 300 + 160); })(k); }
    var score = S.score, rec = SIMON.record(save, score, prefs.daily ? today : null);
    if (score > 0) { save = rec.save; persist(); }
    later(function () {
      mode = 'over';
      setHub({ num: score, label: rec.isBest && score > 0 ? 'NEW BEST' : '\u25b6 AGAIN', accent: rec.isBest && score > 0, play: false, tap: true, aria: 'Play again. You scored ' + score });
      refreshChrome(); say('Game over. Score ' + score + (rec.isBest && score > 0 ? '. New best.' : ''));
    }, 1350);
  }

  // ---------- input ----------
  board.addEventListener('pointerdown', function (ev) {
    if (ev.button > 0) return;
    var i = padAt(ev); if (i < 0) return;
    ev.preventDefault();
    try { board.setPointerCapture(ev.pointerId); } catch (e) {}
    down(i, 'p' + ev.pointerId);
  });
  function release(ev) { up('p' + ev.pointerId); }
  board.addEventListener('pointerup', release); board.addEventListener('pointercancel', release); board.addEventListener('lostpointercapture', release);
  hub.addEventListener('click', function () { if (mode === 'idle' || mode === 'over') startGame(); });
  $('mode').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (!b) return; prefs.daily = b.dataset.m === 'daily'; persist(); idleHub(); });
  $('snd').addEventListener('click', function () { prefs.mute = !prefs.mute; persist(); drawSnd(); if (prefs.mute) allOff(); });
  var kd = {};
  addEventListener('keydown', function (ev) {
    if (ev.repeat || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var k = ev.key.toLowerCase();
    if (k in KEYS) { ev.preventDefault(); kd[k] = true; down(KEYS[k], 'k' + k); }
  });
  addEventListener('keyup', function (ev) { var k = ev.key.toLowerCase(); if (kd[k]) { delete kd[k]; up('k' + k); } });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { allOff(); if (mode === 'show') { clearTimers(); mode = 'resume'; } }
    else if (mode === 'resume') round();
  });
  function drawSnd() {
    var b = $('snd'); b.setAttribute('aria-pressed', String(!prefs.mute)); b.setAttribute('aria-label', prefs.mute ? 'Sound off' : 'Sound on');
    b.innerHTML = prefs.mute
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
  }
  drawSnd(); idleHub();
  window.__simon = { get state() { return { S: S, mode: mode }; }, save: function () { return save; } };
  // attract: one slow pass round the pads so a new player sees the board is alive
  if (!save.best && !Object.keys(save.days).length) [0, 1, 3, 2].forEach(function (p, k) { later(function () { if (mode === 'idle') padEls[p].classList.add('on'); }, 500 + k * 260); later(function () { padEls[p].classList.remove('on'); }, 500 + k * 260 + 200); });
})();
</script>
</body>
</html>
