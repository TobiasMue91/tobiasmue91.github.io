<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Flappy Bird – Fugue, Tap Through the Pipes of a Pipe Organ</title>
<meta name="description" content="Fugue, a Flappy Bird game set among the pipes of a cathedral organ: tap to flap a small bird through the gaps. Every gap you thread sounds a note, so the course is a tune and a good run is a canon. Daily course, shareable seeds, one tap, no sign-up.">
<meta name="theme-color" content="#120d24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,800&display=swap" rel="stylesheet">
<style>
:root{--cream:#fdf1d8;--ink:#1a1030;--ember:#ff9a4d;--brass:#d7a45a;--ui:'Fraunces',Georgia,'Times New Roman',serif;--floor:80px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#120d24;overscroll-behavior:none}
body{font-family:var(--ui);color:var(--cream);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}

#score{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 2.6vh);transform:translateX(-50%);font-weight:900;font-size:min(19vw,10.5vh,92px);line-height:1;
  font-variant-numeric:lining-nums tabular-nums;font-variation-settings:'opsz' 144;color:var(--cream);-webkit-text-stroke:.12em #1a0f30;paint-order:stroke fill;text-shadow:0 .035em 0 #0b0618;
  opacity:0;pointer-events:none;transition:opacity .25s ease;will-change:transform}
body[data-phase=play] #score.on,body[data-phase=dying] #score.on{opacity:1}
#score.bump{animation:bump .26s cubic-bezier(.2,.9,.3,1.5)}
@keyframes bump{from{transform:translateX(-50%) scale(1.22)}to{transform:translateX(-50%) scale(1)}}

#word{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 9vh);text-align:center;pointer-events:none;transition:opacity .3s ease,transform .5s cubic-bezier(.3,.7,.2,1)}
#word h1{font-weight:900;font-style:italic;font-size:min(27vw,15vh,150px);line-height:.9;letter-spacing:-.02em;font-variation-settings:'opsz' 144;text-shadow:0 4px 0 rgba(18,8,40,.5),0 0 40px rgba(255,154,77,.3)}
#word.gone{opacity:0;transform:translateY(-22px);transition:opacity .14s ease,transform .3s ease}

#dock{position:fixed;left:0;right:0;bottom:calc(var(--floor) + 22px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .22s ease,transform .3s ease}
body[data-phase=ready] #dock{opacity:1;transform:none}
#bestline{font-size:14px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;min-height:1em;color:var(--cream);text-shadow:0 1px 0 rgba(10,4,24,.8);opacity:.9}
.chips{display:flex;gap:2px;padding:3px;border-radius:99px;background:rgba(18,10,36,.72);border:1px solid rgba(253,241,216,.22);pointer-events:auto}
.chips[hidden]{display:none}
.chips button{position:relative;white-space:nowrap;font:600 13px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--cream);padding:12px 18px;border-radius:99px;opacity:.92;min-height:44px}
.chips button[aria-pressed=true]{background:var(--cream);color:var(--ink);opacity:1}
.chips button.fresh::after{content:'';position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 2px rgba(18,10,36,.9)}
.chips button[aria-pressed=true].fresh::after{box-shadow:0 0 0 2px var(--cream)}

#snd{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:max(10px,env(safe-area-inset-right));width:46px;height:46px;border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s ease;background:rgba(18,10,36,.6);border:1px solid rgba(253,241,216,.2)}
body[data-phase=ready] #snd,body[data-phase=over] #snd{opacity:1;pointer-events:auto}
#snd svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#snd .off{display:none}#snd[aria-pressed=true] .on{display:none}#snd[aria-pressed=true] .off{display:block}

#card{position:fixed;left:50%;top:46%;width:min(88vw,calc(340px + 7vh));padding:34px 22px 20px;border-radius:22px;text-align:center;background:linear-gradient(#fbefd6,#f3e1bd);color:var(--ink);
  box-shadow:0 0 0 2px #1a1030,0 0 0 4px var(--brass),0 0 0 5.5px #1a1030,0 34px 60px rgba(8,2,20,.6);
  transform:translate(-50%,-38%) scale(.94);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .5s cubic-bezier(.2,1.25,.4,1)}
#card.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#plate{position:absolute;left:50%;top:-15px;transform:translateX(-50%);padding:8px 18px;border-radius:8px;white-space:nowrap;background:linear-gradient(#e9bd72,#b9812f);color:#2b1608;font:700 11px/1 var(--ui);letter-spacing:.3em;text-transform:uppercase;box-shadow:0 0 0 2px #1a1030,inset 0 1px 0 rgba(255,255,255,.55)}
#num{font-variant-numeric:lining-nums tabular-nums;font-weight:900;font-size:112px;line-height:1;margin-top:2px;font-variation-settings:'opsz' 144}
#sub{display:flex;justify-content:center;align-items:center;height:34px;font-size:17px;font-weight:700;margin-top:2px}
#sub i{transform:scale(.4) rotate(-8deg);opacity:0;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .15s ease;font-style:normal;font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;padding:8px 16px;border-radius:99px;background:#1a1030;color:#ffcf8a}
#staffbox{height:0}
#staffbox:not(:empty){height:92px;margin:0 0 2px}
.staff{width:100%;height:92px;display:block;overflow:visible}
.staff line{stroke:rgba(26,16,48,.35);stroke-width:1.1}
.staff .led{stroke:rgba(26,16,48,.6)}
.staff .nt{opacity:0;transform-box:fill-box;animation:ntin .35s cubic-bezier(.2,1.3,.4,1) forwards}
.staff .miss{fill:rgba(217,60,28,.28);stroke:#d23c1c;stroke-width:2.6;stroke-dasharray:3.2 2.6;opacity:0;animation:ntin .4s ease forwards}
.staff .nt ellipse{fill:#1a1030}.staff .nt line{stroke:#1a1030;stroke-width:2.2}
@keyframes ntin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#sub.in i{transform:rotate(-3deg);opacity:1}
#go{display:block;width:100%;margin-top:16px;padding:17px;border-radius:14px;background:#1a1030;color:var(--cream);font:800 21px var(--ui);font-style:italic;box-shadow:0 4px 0 #6d4b1c;transition:transform .08s ease,box-shadow .08s ease}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #6d4b1c}
#share{display:block;margin:14px auto 0;font:700 12px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#1a1030;border:1.5px solid rgba(26,16,48,.4);border-radius:99px;padding:12px 16px;min-height:44px}

#pause{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,5,24,.55);opacity:0;pointer-events:none;transition:opacity .2s ease;font-style:italic;font-weight:800;font-size:28px;letter-spacing:.01em}
#pause.on{opacity:1}
#curtain{position:fixed;inset:0;background:#0f0a20;opacity:0;pointer-events:none;transition:opacity .22s ease}
#curtain.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important}#card{transition:opacity .2s ease}#word,#dock{transition:opacity .2s ease}}
@media (max-height:520px){#word{top:3vh}#word h1{font-size:min(20vh,110px)}#card{padding:26px 20px 14px;width:min(70vw,380px)}#num{font-size:60px}#staffbox:not(:empty),.staff{height:60px}#sub{height:26px;margin-top:0}#go{margin-top:8px;padding:12px;font-size:19px}#share{margin-top:8px;min-height:40px;padding:9px 14px}#dock{bottom:calc(var(--floor) + 10px)}}
</style>
</head>
<body data-phase="ready">
<canvas id="c" role="img" aria-label="A small bird flying between the pipes of a cathedral organ"></canvas>
<div id="score" aria-live="off">0</div>
<div id="word"><h1>Fugue</h1></div>
<div id="dock">
  <div id="bestline"></div>
  <div class="chips" id="modes" role="group" aria-label="Course">
    <button id="m-free" aria-pressed="true">Free</button><button id="m-daily" aria-pressed="false">Daily · today</button>
  </div>
</div>
<button id="snd" aria-label="Sound" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><g class="on"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g><g class="off"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></g></svg>
</button>
<div id="card" role="dialog" aria-label="Run over" aria-hidden="true">
  <div id="plate">Free flight</div><div id="num">0</div><div id="staffbox"></div><div id="sub"></div>
  <button id="go">Fly again</button>
  <button id="share">Challenge a friend</button>
</div>
<div id="pause">Tap to continue</div>
<div id="curtain"></div>
<script id="core">
/* Fugue core: no DOM, no audio, no clock. Everything the player is promised lives here:
   the physics, the pipes' geometry, the course a seed deals, the score, the tune a course plays and what a save may hold.
   Units are "world units": the play area is 640 high, the floor's top is at y = 560, y grows downward. */
const FUGUE = (() => {
  const STEP = 1 / 120;                  // the physics always runs at 120 Hz, whatever the display does
  const K = {
    G: 1250, FLAP: -385, VMAX: 640,      // gravity, the flap's speed (up), terminal fall speed
    SPEED: 140,                          // how fast the hall goes by
    FIRST: 330, SPACING: 190,            // where pipe 0 stands, and the distance between pipes
    GAP: 150, W_MIN: 50, W_STEP: 4.6, COLLAR_EXTRA: 8, COLLAR_H: 16,   // low, long pipes are wider than high, short ones
    R: 13,                               // the bird's hitbox is smaller than the bird you see
    FLOOR: 560, CEIL: -8, START_Y: 300,
    ROWS: 8, ROW_TOP: 125, ROW_BOT: 435, // gap centres sit on 8 rows, row 7 highest
  };
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16];   // semitones of the 8 rows: a pentatonic run, C D E G A C D E
  const TONIC_ROW = 5, PHRASE = 8;             // every 8th gap lands on the tonic
  const BASE_HZ = 261.6256;                    // C4
  const pipeW = r => K.W_MIN + (K.ROWS - 1 - r) * K.W_STEP;
  const W_MAX = pipeW(0) + K.COLLAR_EXTRA;       // the widest a collar ever is
  const rowY = r => K.ROW_BOT - r * (K.ROW_BOT - K.ROW_TOP) / (K.ROWS - 1);
  const freq = (row, semis = 0) => BASE_HZ * Math.pow(2, (SCALE[row] + semis) / 12);

  // ---- seeds ----------------------------------------------------------------------------------------------
  const hashSeed = str => {              // cyrb-style string hash -> 32 bit
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h1 ^ h2) >>> 0;
  };
  const mulberry = a => () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const cleanSeed = s => String(s == null ? '' : s).replace(/[^\w.\-]/g, '').slice(0, 24);
  const randomSeed = (r = Math.random) => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += a[Math.floor(r() * a.length)]; return s; };
  const dateKey = d => { const p = n => String(n).padStart(2, '0'); return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()); };
  const dailySeed = key => 'day-' + key;

  // ---- the course: one row per pipe, dealt in order so a seed is the same course however it is asked ------
  // steps up are at most 3 rows (133 u) and down at most 4 (177 u), never more than the bird can do in the 0.9 s between two pipes
  const UP_MAX = 3, DOWN_MAX = 4;
  function makeCourse(seed, first = K.FIRST) {
    const rnd = mulberry(hashSeed(cleanSeed(seed) || 'x')), rows = [];
    const pick = (row) => {
      const mag = (() => { const r = rnd(); return r < .07 ? 0 : r < .41 ? 1 : r < .73 ? 2 : r < .92 ? 3 : 4; })();
      if (!mag) return row;
      const pullUp = .5 + .13 * (3.5 - row) / 3.5;          // wander, but come back to the middle
      const up = rnd() < pullUp;
      const mUp = Math.min(mag, UP_MAX);
      let next = row + (up ? mUp : -mag);
      if (next < 0 || next >= K.ROWS) next = row + (up ? -mag : mUp);   // bounce off the ends instead of piling up there
      return Math.max(0, Math.min(K.ROWS - 1, next));
    };
    const gen = i => {
      if (i === 0) return 3;                                // the first gap is where the bird already is
      let r = pick(rows[i - 1]);
      if ((i + 1) % PHRASE === 0) r = TONIC_ROW;            // a phrase ends on the tonic ...
      else if ((i + 2) % PHRASE === 0) r = Math.max(2, r);  // ... and the gap before it must be a leap the bird can make
      return r;
    };
    return { seed, first, row(i) { while (rows.length <= i) rows.push(gen(rows.length)); return rows[i]; } };
  }

  const pipeAt = (course, i) => {
    const row = course.row(i), cy = rowY(row);
    return { i, cx: course.first + i * K.SPACING, row, cy, w: pipeW(row), top: cy - K.GAP / 2, bot: cy + K.GAP / 2 };
  };

  // ---- the run -------------------------------------------------------------------------------------------
  function create(seed, first = K.FIRST) {
    const s = {
      seed: cleanSeed(seed), course: makeCourse(seed, Math.max(K.FIRST, first)),
      t: 0, acc: 0, x: 0, y: K.START_Y, vy: 0, px: 0, py: K.START_Y,
      score: 0, alive: true, cause: null, settled: false, pending: false, flaps: 0, lastFlapT: -1,
    };
    return s;
  }
  const flap = s => { if (!s.alive) return false; s.pending = true; return true; };

  // circle against the two rectangles a pipe is made of, and the collar it wears at its open end
  const rects = p => {
    const hw = p.w / 2, cw = hw + K.COLLAR_EXTRA / 2;
    return [
      [p.cx - hw, -1e5, p.cx + hw, p.top], [p.cx - cw, p.top - K.COLLAR_H, p.cx + cw, p.top],
      [p.cx - hw, p.bot, p.cx + hw, 1e5], [p.cx - cw, p.bot, p.cx + cw, p.bot + K.COLLAR_H],
    ];
  };
  const hitsRect = (x, y, r, b) => {
    const dx = x - Math.max(b[0], Math.min(x, b[2])), dy = y - Math.max(b[1], Math.min(y, b[3]));
    return dx * dx + dy * dy < r * r;
  };
  const collides = (course, x, y) => {
    const i0 = Math.max(0, Math.floor((x - course.first) / K.SPACING) - 1);
    for (let i = i0; i <= i0 + 2; i++) {
      const p = pipeAt(course, i);
      if (Math.abs(p.cx - x) > W_MAX / 2 + K.R + 1) continue;
      for (const b of rects(p)) if (hitsRect(x, y, K.R, b)) return true;
    }
    return false;
  };

  function step(s, ev) {
    s.px = s.x; s.py = s.y;
    if (s.alive) {
      if (s.pending) { s.vy = K.FLAP; s.pending = false; s.flaps++; s.lastFlapT = s.t; ev.push({ type: 'flap' }); }
      s.vy = Math.min(K.VMAX, s.vy + K.G * STEP);
      s.y += s.vy * STEP; s.x += K.SPEED * STEP; s.t += STEP;
      if (s.y < K.CEIL) { s.y = K.CEIL; if (s.vy < 0) s.vy = 0; }
      // a gap is threaded, and sounds, only once the bird is clear of the pair, so a bird that has scored can no longer hit that pipe
      const n = s.score, p = pipeAt(s.course, n);
      let dead = null;
      if (s.y + K.R >= K.FLOOR) { s.y = K.FLOOR - K.R; dead = 'floor'; }
      else if (collides(s.course, s.x, s.y)) dead = 'pipe';
      if (dead) { s.alive = false; s.cause = dead; ev.push({ type: 'die', cause: dead, x: s.x, y: s.y, vy: s.vy }); return; }
      if (s.x >= p.cx + (p.w + K.COLLAR_EXTRA) / 2 + K.R) { s.score++; ev.push({ type: 'pass', n, row: p.row, score: s.score }); }
    } else if (!s.settled) {
      s.pending = false;
      s.vy = Math.min(K.VMAX, s.vy + K.G * STEP); s.y += s.vy * STEP; s.t += STEP;
      if (s.y + K.R >= K.FLOOR) { s.y = K.FLOOR - K.R; s.vy = 0; s.settled = true; ev.push({ type: 'settle' }); }
    }
  }
  // advance by dt seconds of the display's time; returns what happened, in order
  function advance(s, dt) {
    const ev = [];
    s.acc += Math.max(0, Math.min(dt, .25));
    while (s.acc >= STEP - 1e-12) { s.acc -= STEP; step(s, ev); }
    return ev;
  }
  // where to draw: between the last two physics steps
  const view = s => { const a = Math.max(0, Math.min(1, s.acc / STEP)); return { x: s.px + (s.x - s.px) * a, y: s.py + (s.y - s.py) * a }; };

  // ---- the tune ------------------------------------------------------------------------------------------
  // the melody is the course: the pipe you pass sounds its row. At 8, 16 and 24 gaps another voice comes in, repeating the
  // melody two, four and six pipes late (a canon) in octaves of its own.
  const VOICES = [
    { from: 0, delay: 0, semis: 0, gain: 1 },
    { from: 8, delay: 2, semis: -12, gain: .62 },
    { from: 16, delay: 4, semis: 12, gain: .34 },
    { from: 24, delay: 6, semis: -24, gain: .5 },
  ];
  // the notes to sound as pipe n (0-based) is passed: [{row, semis, gain, voice}]
  function chord(course, n) {
    const out = [];
    VOICES.forEach((v, k) => { if (n >= v.from && n - v.delay >= 0) out.push({ voice: k, row: course.row(n - v.delay), semis: v.semis, gain: v.gain }); });
    return out;
  }

  // ---- what is kept --------------------------------------------------------------------------------------
  const num = (v, max = 99999) => { v = Number(v); return Number.isFinite(v) ? Math.max(0, Math.min(max, Math.floor(v))) : 0; };
  function sanitize(raw, today) {
    let o = raw;
    if (typeof raw === 'string') { try { o = JSON.parse(raw); } catch (e) { o = null; } }
    if (!o || typeof o !== 'object') o = {};
    const d = o.daily && typeof o.daily === 'object' ? o.daily : {};
    const key = typeof d.key === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d.key) ? d.key : '';
    return {
      v: 1, best: num(o.best), runs: num(o.runs, 1e7),
      daily: { key: key === today ? key : (key || ''), best: key ? num(d.best) : 0, played: key === today },
      sound: o.sound !== false, mode: o.mode === 'daily' ? 'daily' : 'free',
    };
  }
  // file a finished run: returns the new save and whether it beat the best of its kind
  function record(save, mode, today, score) {
    const s = sanitize(save, today); score = num(score); s.runs++;
    let isBest = false;
    if (mode === 'daily') {
      if (s.daily.key !== today) s.daily = { key: today, best: 0, played: true };
      s.daily.played = true;
      if (score > s.daily.best) { s.daily.best = score; isBest = score > 0; }
    } else if (mode === 'free' && score > s.best) { s.best = score; isBest = true; }
    return { save: s, isBest };
  }
  const bestFor = (save, mode, today) => mode === 'daily' ? (save.daily.key === today ? save.daily.best : 0) : save.best;

  return { STEP, K, BASE_HZ, W_MAX, pipeW, SCALE, TONIC_ROW, PHRASE, VOICES, UP_MAX, DOWN_MAX, rowY, freq, hashSeed, mulberry, cleanSeed, randomSeed, dateKey, dailySeed,
    makeCourse, pipeAt, create, flap, advance, view, rects, hitsRect, collides, chord, sanitize, record, bestFor };
})();
</script>
<script id="audio">
/* Sound: an organ voice, a hall to sing in, a wing and a thud. Nothing starts until a first tap (browsers insist). */
const Sound = (() => {
  let ac = null, out = null, wet = null, organ = null, noiseBuf = null, on = true, live = 0;
  const init = () => {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ac = new AC({ latencyHint: 'interactive' }); } catch (e) { ac = null; return null; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .25;
    out = ac.createGain(); out.gain.value = on ? .9 : 0; out.connect(comp); comp.connect(ac.destination);
    // the hall: two seconds and a half of decaying noise, darker as it fades
    const len = Math.floor(ac.sampleRate * 2.6), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c); let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len, k = .12 + .6 * t;                  // low-pass closes as the tail dies
        lp += (Math.random() * 2 - 1 - lp) * (1 - k);
        d[i] = lp * Math.pow(1 - t, 2.4) * (i < 400 ? i / 400 : 1);
      }
    }
    const conv = ac.createConvolver(); conv.buffer = ir;
    wet = ac.createGain(); wet.gain.value = .5; wet.connect(conv); conv.connect(out);
    // flute + principal + octave: a few harmonics, strongest on the odd ones, like a stopped-and-open mix

    ctx.fillStyle = '#1a0f26'; ctx.beginPath(); ctx.arc(9.6, -5.2, 2.5, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(10.3, -6.1, .9, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// a quaver, born where a gap was cleared, that flies to the score digit: a note becomes a point
function note(x, y, u) {
  const s = V.s, pop = u < .15 ? .55 + .65 * (u / .15) : 1.2 - .75 * Math.min(1, (u - .15) / .85), a = u < .8 ? 1 : 1 - (u - .8) / .2;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s * 1.9 * pop, s * 1.9 * pop); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(255,190,90,.8)'; ctx.shadowBlur = 10 * s;
  ctx.strokeStyle = 'rgba(44,16,48,.85)'; ctx.fillStyle = '#ffd37a'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.ellipse(0, 0, 6.2, 4.6, -.4, 0, 7); ctx.stroke(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.moveTo(5.4, -1); ctx.lineTo(5.4, -20); ctx.bezierCurveTo(6, -14, 13.5, -13.5, 11.5, -5); ctx.bezierCurveTo(10, -10, 8, -10.5, 5.4, -11);
  ctx.stroke(); ctx.lineWidth = 2.6; ctx.strokeStyle = '#ffd37a'; ctx.beginPath(); ctx.moveTo(5.4, -2); ctx.lineTo(5.4, -19); ctx.stroke();
  ctx.restore();

  for (const f of list) {
    const a = Math.max(0, Math.min(1, f.life / f.ttl)); ctx.save(); ctx.translate(f.x + Math.sin(f.rot * 1.3) * 6 * V.s, f.y); ctx.rotate(f.rot); ctx.globalAlpha = Math.min(1, a * 2);
    ctx.fillStyle = f.c; ctx.beginPath(); ctx.ellipse(0, 0, 7 * V.s * f.k, 2.6 * V.s * f.k, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}

// scene: everything the frame needs, already eased by the game
function draw(sc) {
  const { W, H, dpr, s } = V;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save(); if (sc.shake) { ctx.translate(W / 2 + sc.shake.x, H / 2 + sc.shake.y); ctx.scale(1.045, 1.045); ctx.translate(-W / 2, -H / 2); }
  ctx.drawImage(V.back, 0, 0, W, H);
  arcade(sc.cam, .12, 300, 'rgba(30,16,54,.92)', 22, 430, sc.winA);
  pillars(sc.cam, .32, 520, 'rgba(26,14,48,.5)', 150);
  dust(sc.cam, sc.t);
  const course = sc.course, v = sc.view;
  if (course) {
    const lo = Math.max(0, Math.floor((v.x - course.first - V.bx / s - 90) / K.SPACING));
    for (let i = lo; ; i++) {
      const p = FUGUE.pipeAt(course, i), x = V.bx + (p.cx - v.x) * s;
      if (x > W + 100) break;
      pipe(x, p, sc.bloom(i));
    }
  }
  // depth: beyond the next couple of pairs the hall closes in, so a wide screen shows what a phone shows
  { const x0 = V.bx + 330 * s, w = 270 * s;
    if (x0 < W) for (let x = Math.floor(x0); x < W; x += 8) { const a = Math.min(.94, .94 * (x - x0) / w); if (a > 0) { ctx.globalAlpha = a; ctx.drawImage(V.back, x * V.dpr, 0, 8 * V.dpr, cv.height, x, 0, 8, H); } }
    ctx.globalAlpha = 1; }
  floor(sc.cam);
  feathers(sc.feathers);
  for (const n of sc.notes) {
    const e = n.u * n.u * (3 - 2 * n.u), x0 = V.bx + (n.wx - v.x) * s, y0 = sy(n.wy);
    if (n.idle) note(x0, y0 - 90 * s * (1 - (1 - n.u) * (1 - n.u)), n.u);          // on the title it only rises
    else note(x0 + (V.scoreX - x0) * e, y0 + (V.scoreY - y0) * e - Math.sin(Math.PI * n.u) * 46 * s, n.u);
  }
  if (sc.ready > .01) {
    for (const o of [0, .5]) {
      const u = ((sc.t * .8 + o) % 1), e = 1 - (1 - u) * (1 - u);
      ctx.strokeStyle = `rgba(253,241,216,${.9 * (1 - u) * sc.ready})`; ctx.lineWidth = 2.8; ctx.beginPath(); ctx.arc(V.bx, sy(sc.bird.y), (22 + 40 * e) * s, 0, 7); ctx.stroke();
    }
  }
  bird(V.bx + (sc.bird.dx || 0) * s, sy(sc.bird.y), sc.bird.ang, sc.bird.wing, sc.bird.dead, sc.bird.sq);
  ctx.restore();
  if (sc.dim > .01) { ctx.fillStyle = `rgba(10,5,24,${.62 * sc.dim})`; ctx.fillRect(0, 0, W, H); }
  if (sc.flash > .01) { ctx.fillStyle = `rgba(255,236,200,${.75 * sc.flash * sc.flash * sc.flash})`; ctx.fillRect(0, 0, W, H); }
}

<script id="game">
/* The game around the core: phases, input, the card, everything that is eased. Phases:
   ready -> play -> dying -> over -> (curtain) -> ready.   `paused` lays over play. */
(() => {
  const $ = id => document.getElementById(id);
  const el = { score: $('score'), word: $('word'), modes: $('modes'), mFree: $('m-free'), mDaily: $('m-daily'), best: $('bestline'), snd: $('snd'),
    staff: $('staffbox'), card: $('card'), plate: $('plate'), num: $('num'), sub: $('sub'), go: $('go'), share: $('share'), pause: $('pause'), curtain: $('curtain') };
  const KEY = 'fugue.v1';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const ease = { out: t => 1 - (1 - t) * (1 - t), out3: t => 1 - Math.pow(1 - t, 3), io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2 };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---- what is kept -----------------------------------------------------------------------------------------
  const today = FUGUE.dateKey(new Date());
  const dayLabel = key => { const m = key.split('-'); return Number(m[2]) + ' ' + MONTHS[Number(m[1]) - 1]; };
  let save = FUGUE.sanitize(null, today);
  try { save = FUGUE.sanitize(localStorage.getItem(KEY), today); } catch (e) { /* private window: play without keeping */ }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } };

  // ---- which course ------------------------------------------------------------------------------------------
  const urlSeed = FUGUE.cleanSeed(new URLSearchParams(location.search).get('seed'));
  let mode = urlSeed ? 'seed' : save.mode;
  const courseSeed = () => mode === 'seed' ? urlSeed : mode === 'daily' ? FUGUE.dailySeed(today) : FUGUE.randomSeed();
  const modeLabel = () => mode === 'daily' ? 'Daily · ' + dayLabel(today) : mode === 'seed' ? 'Shared course' : 'Free flight';

  // ---- state -------------------------------------------------------------------------------------------------
  let phase = 'ready', phaseT = 0, t = 0, run = null, camBase = 0, hold = 0, timeScale = 1, resumeT = 1, paused = false, titleUp = true;
  let idleNote = 1.4, flash = 0, shakeT = 0, dim = 0, winA = 0, readyA = 1, settledAt = -1, busy = false;
  const bird = { y: FUGUE.K.START_Y, ang: 0, wing: 0, wingT: 9, spin: 0, dead: false, dx: 0, dxv: 0, dyT: 9, sq: 0 };
  const bloomAt = new Map(); let feathers = [], notes = [];

  const newRun = () => {
    const lead = Math.max(FUGUE.K.FIRST, Math.min(V.right + 60, 640));   // on a wide screen the first pair waits in the haze
    run = FUGUE.create(courseSeed(), lead);
    bird.y = FUGUE.K.START_Y; bird.ang = 0; bird.dead = false; bird.spin = 0; bird.wingT = 9; bird.dx = 0; bird.dxv = 0; bird.dyT = 9; bird.sq = 0;
    bloomAt.clear(); feathers = []; notes = []; camBase = 0; settledAt = -1;
    el.score.textContent = '0'; el.score.classList.remove('on');
  };

  const setPhase = p => { phase = p; phaseT = 0; document.body.dataset.phase = p; };
  const bestNow = () => FUGUE.bestFor(save, mode, today);

  // ---- ui ----------------------------------------------------------------------------------------------------
  const paintModes = () => {
    el.mFree.setAttribute('aria-pressed', mode === 'free'); el.mDaily.setAttribute('aria-pressed', mode === 'daily');
    el.mDaily.firstChild.nodeValue = 'Daily · ' + dayLabel(today);
    el.mDaily.classList.toggle('fresh', !save.daily.played);
    el.modes.hidden = mode === 'seed';
    const b = bestNow(); el.best.textContent = b ? 'Best ' + b : '';
  };
  const paintSound = () => { el.snd.setAttribute('aria-pressed', !Sound.on); };
  Sound.set(save.sound); paintSound();

  const setMode = m => {
    if (mode === m || phase !== 'ready') return;
    mode = m; save.mode = m; persist(); paintModes(); newRun();
  };
  el.mFree.addEventListener('click', () => setMode('free'));
  el.mDaily.addEventListener('click', () => setMode('daily'));
  el.snd.addEventListener('click', () => { Sound.wake(); Sound.set(!Sound.on); save.sound = Sound.on; persist(); paintSound(); });

  let countRaf = 0;
  const countUp = (to) => {
    cancelAnimationFrame(countRaf);
    if (reduce.matches || to < 3) { el.num.textContent = to; return; }
    const t0 = performance.now(), dur = Math.min(900, 55 * to + 200);
    const tick = now => { const u = clamp((now - t0) / dur, 0, 1); el.num.textContent = Math.round(to * ease.out3(u)); if (u < 1) countRaf = requestAnimationFrame(tick); };
    el.num.textContent = '0'; countRaf = requestAnimationFrame(tick);
  };

  const STEPS = [0, 1, 2, 4, 5, 7, 8, 9];       // the rows as steps of the C major scale above middle C
  const staff = () => {
    const n = run.score, from = Math.max(0, n - 11), cnt = n - from, W = 260, H = 92, gap = 10, bottom = 66, sp = Math.min(30, (W - 44) / (cnt + 1)), x0 = (W - cnt * sp) / 2;
    const X = i => x0 + i * sp - sp / 4, Y = row => bottom - (STEPS[row] - 2) * gap / 2;
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true" class="staff">';
    for (let i = 0; i < 5; i++) s += '<line x1="4" x2="' + (W - 4) + '" y1="' + (bottom - i * gap) + '" y2="' + (bottom - i * gap) + '"/>';
    for (let i = 0; i < cnt; i++) {
      const row = run.course.row(from + i), step = STEPS[row], y = Y(row), x = X(i);
      if (step <= 0) s += '<line class="led" x1="' + (x - 10) + '" x2="' + (x + 10) + '" y1="' + (bottom + gap) + '" y2="' + (bottom + gap) + '"/>';
      s += '<g class="nt" style="animation-delay:' + (i * 90 + 250) + 'ms"><ellipse cx="' + x + '" cy="' + y + '" rx="7.2" ry="5.4" transform="rotate(-20 ' + x + ' ' + y + ')"/><line x1="' + (x + 6.4) + '" x2="' + (x + 6.4) + '" y1="' + y + '" y2="' + (y - 27) + '"/></g>';
    }
    const frow = run.course.row(n), gx = X(cnt), gy = Y(frow);   // the gap that ended the run
    s += '<ellipse class="miss" style="animation-delay:' + (cnt * 90 + 450) + 'ms" cx="' + gx + '" cy="' + gy + '" rx="8.6" ry="6.4" transform="rotate(-20 ' + gx + ' ' + gy + ')"/>';
    return s + '</svg>';
  };
  const showCard = () => {
    const r = FUGUE.record(save, mode, today, run.score); save = r.save; persist();
    el.plate.textContent = modeLabel(); el.staff.innerHTML = run.score > 0 ? staff() : '';
    const b = FUGUE.bestFor(save, mode, today);
    el.sub.classList.remove('in');
    const stamp = run.score * 90 + 700;
    if (r.isBest) { el.sub.innerHTML = '<i>New best</i>'; setTimeout(() => { el.sub.classList.add('in'); if (r.isBest) Sound.chime(); }, reduce.matches ? 0 : Math.min(stamp, 1800)); }
    else { el.sub.textContent = b ? 'Best ' + b : ''; el.sub.classList.add('in'); }
    el.card.classList.add('show'); el.card.setAttribute('aria-hidden', 'false');
    countUp(run.score); const tuneRows = []; for (let i = Math.max(0, run.score - 11); i < run.score; i++) tuneRows.push(run.course.row(i)); if (tuneRows.length) Sound.tune(tuneRows);
    paintModes();
  };

  const retry = () => {
    if (busy || phase !== 'over' || phaseT < .45) return;
    busy = true; el.card.classList.remove('show'); el.card.setAttribute('aria-hidden', 'true'); el.curtain.classList.add('on');
    let done = false;
    const go = () => {                                   // the world is reset while the curtain is fully down
      if (done) return; done = true; el.curtain.removeEventListener('transitionend', go);
      newRun(); setPhase('ready'); readyA = 0; dim = 0; el.curtain.classList.remove('on'); busy = false; paintModes();
    };
    el.curtain.addEventListener('transitionend', go); setTimeout(go, 450);
  };

  el.go.addEventListener('click', e => { e.stopPropagation(); retry(); });
  el.share.addEventListener('click', async e => {
    e.stopPropagation();
    const url = location.origin + location.pathname + '?seed=' + encodeURIComponent(run.seed);
    const text = 'I threaded ' + run.score + ' gap' + (run.score === 1 ? '' : 's') + ' in Fugue. Can you beat it on the same pipes?';
    const label = el.share.textContent;
    try {
      if (navigator.share) await navigator.share({ title: 'Fugue', text, url });
      else { await navigator.clipboard.writeText(text + ' ' + url); el.share.textContent = 'Link copied'; setTimeout(() => { el.share.textContent = label; }, 1600); }
    } catch (err) { /* cancelled */ }
  });

  // ---- actions -----------------------------------------------------------------------------------------------
  const burst = (n, x, y, spread, up) => {
    const count = reduce.matches ? Math.ceil(n / 3) : n;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * 6.283, sp = (170 + Math.random() * 260) * spread;
      feathers.push({ x, y, vx: Math.cos(a) * sp - 70 * spread, vy: Math.sin(a) * sp - up, rot: Math.random() * 6.283, vr: (Math.random() - .5) * 11, life: 1.1, ttl: 1.1,
        c: Math.random() < .3 ? '#fff3cf' : (Math.random() < .5 ? '#ffc233' : '#e0711a'), k: 1 + Math.random() * .7 });
    }
  };
  const birdXY = () => ({ x: V.bx, y: V.H - (640 - bird.y) * V.s });

  const start = () => {
    if (phase !== 'ready' || busy) return;
    run.y = run.py = bird.y; camBase = camBase; titleUp = false;
    setPhase('play'); FUGUE.flap(run); bird.wingT = 0; Sound.flap();
  };
  const act = () => {
    Sound.wake();
    if (paused) { paused = false; resumeT = 0; el.pause.classList.remove('on'); return; }
    if (phase === 'ready') start();
    else if (phase === 'play') { if (FUGUE.flap(run)) { bird.wingT = 0; Sound.flap(); if (!reduce.matches) burst(1, birdXY().x - 10 * V.s, birdXY().y + 6 * V.s, .5, 0); } }
    else if (phase === 'over') retry();
  };
  addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button')) return; e.preventDefault(); act(); });
  addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.tagName === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return;
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) { e.preventDefault(); act(); }
  });
  const pauseNow = () => { if (phase === 'play' && !paused) { paused = true; el.pause.classList.add('on'); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseNow(); });
  addEventListener('blur', pauseNow);
  addEventListener('resize', () => { layout(); });
  addEventListener('orientationchange', () => setTimeout(layout, 120));

  const NOTE_T = .85;
  const bump = () => { el.score.classList.remove('bump'); void el.score.offsetWidth; el.score.classList.add('bump'); };
  const onEvents = ev => {
    for (const e of ev) {
      if (e.type === 'pass') {
        el.score.textContent = e.score; el.score.classList.add('on'); if (reduce.matches) bump();
        bloomAt.set(e.n, t); if (!reduce.matches) notes.push({ wx: run.x - 30, wy: run.y - 40, t0: t }); Sound.gap(FUGUE.chord(run.course, e.n));
      } else if (e.type === 'die') {
        setPhase('dying'); hold = reduce.matches ? 0 : .09; flash = reduce.matches ? 0 : .6; shakeT = reduce.matches ? 0 : 1; bird.dead = true;
        bird.spin = e.cause === 'pipe' ? 7 : 3.5; bird.dxv = e.cause === 'pipe' ? -150 : -40; bird.dyT = e.cause === 'pipe' ? 0 : 9; bird.sq = 1; Sound.die(); try { navigator.vibrate && navigator.vibrate(28); } catch (x) { /* ignore */ }
        const p = birdXY(); burst(10, p.x, p.y, 1, 120);
      } else if (e.type === 'settle') settledAt = t;
    }
  };

  // ---- the frame -----------------------------------------------------------------------------------------------
  let last = performance.now() / 1000;
  const frame = nowMs => {
    const now = nowMs / 1000; let dt = clamp(now - last, 0, .05); last = now; t += dt; phaseT += dt;
    const rm = reduce.matches;

    // time: hit-stop and the ease back in after a pause
    let sim = dt;
    if (hold > 0) { hold -= dt; sim = 0; }
    if (paused) sim = 0;
    if (resumeT < 1) { resumeT = Math.min(1, resumeT + dt / .45); sim *= ease.out(resumeT); }
    if (phase === 'play' || phase === 'dying') onEvents(FUGUE.advance(run, sim));

    // the world's camera, and the hall's reveal
    const v = phase === 'ready' ? { x: 0, y: bird.y } : FUGUE.view(run);
    if (phase === 'ready') { camBase += 14 * dt; idleNote -= dt; if (idleNote <= 0 && !rm && !busy) { idleNote = 2.6; notes.push({ wx: 0, wy: bird.y - 22, t0: t, idle: true }); } }
    const cam = camBase + v.x;
    winA += ((phase === 'ready' && titleUp ? .3 : .62) - winA) * (1 - Math.exp(-3 * dt));
    readyA += ((phase === 'ready' ? 1 : 0) - readyA) * (1 - Math.exp(-14 * dt));
    dim += ((phase === 'over' || (phase === 'dying' && phaseT > .5) ? 1 : 0) - dim) * (1 - Math.exp(-6 * dt));

    // the bird's pose
    bird.wingT += dt; bird.sq = Math.max(0, bird.sq - dt / .3);
    if (phase === 'ready') {
      bird.y = FUGUE.K.START_Y + (rm ? 0 : 6 * Math.sin(t * 2.6)); bird.ang += (-.05 - bird.ang) * (1 - Math.exp(-10 * dt));
      bird.wing = rm ? .2 : .1 + .4 * Math.sin(t * 9);
    } else if (phase === 'play') {
      bird.y = v.y; const tgt = clamp(run.vy / 560, -.5, 1.2); bird.ang += (tgt - bird.ang) * (1 - Math.exp(-14 * dt));
      bird.wing = bird.wingT < .3 ? -.95 + 1.55 * ease.out3(bird.wingT / .3) : .6 + .25 * clamp((bird.wingT - .3) * 2, 0, 1);
    } else {
      bird.dyT += sim; bird.y = v.y - 36 * Math.sin(Math.PI * Math.min(1, bird.dyT / .5)); bird.wing = .8; bird.dx += bird.dxv * sim; bird.dxv *= Math.exp(-3.2 * sim);
      if (!run.settled) { bird.spin *= Math.exp(-1.2 * dt); bird.ang += bird.spin * dt; }
      else bird.ang += ((Math.round((bird.ang - 2.85) / 6.283) * 6.283 + 2.85) - bird.ang) * (1 - Math.exp(-10 * dt));
    }
    if (phase === 'dying' && settledAt >= 0 && t - settledAt > .38) { setPhase('over'); showCard(); }
    else if (phase === 'dying' && phaseT > 3) { setPhase('over'); showCard(); }

    // flash, shake, feathers
    flash = Math.max(0, flash - dt / .28); shakeT = Math.max(0, shakeT - dt / .4);
    const sh = shakeT > 0 ? { x: Math.sin(t * 90) * 7 * shakeT * shakeT, y: Math.cos(t * 77) * 5 * shakeT * shakeT } : null;
    for (const f of feathers) { f.life -= dt; f.vy += 330 * dt; f.vx *= Math.exp(-1.1 * dt); f.vy *= Math.exp(-.6 * dt); f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; }
    feathers = feathers.filter(f => f.life > 0); { const keep = notes.filter(n => t - n.t0 < NOTE_T); if (notes.some(n => !n.idle && t - n.t0 >= NOTE_T)) bump(); notes = keep; }

    draw({ cam, view: v, t, course: phase === 'ready' ? null : run.course, winA, feathers, notes: notes.map(n => ({ wx: n.wx, wy: n.wy, u: (t - n.t0) / NOTE_T, idle: n.idle })), ready: readyA, dim, flash, shake: sh,
      bird: { y: bird.y, ang: bird.ang, wing: bird.wing, dead: bird.dead, dx: bird.dx, sq: bird.sq * bird.sq },
      bloom: i => { const b = bloomAt.get(i); if (b === undefined) return 0; const u = (t - b) / .6; return u >= 1 ? 0 : (1 - u) * (1 - u); } });

    el.word.classList.toggle('gone', !(phase === 'ready' && titleUp));
    requestAnimationFrame(frame);
  };

  // ---- go --------------------------------------------------------------------------------------------------------
  layout(); paintModes(); newRun(); setPhase('ready');
  document.fonts && document.fonts.ready.then(() => document.body.classList.add('fonts'));
  requestAnimationFrame(frame);
  // a handle for the tests that film the page
  window.__fugue = { get run() { return run; }, get phase() { return phase; }, get mode() { return mode; }, get save() { return save; } };
})();
</script>
