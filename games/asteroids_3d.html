<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060812">
<title>Shatter Field – 3D Asteroids</title>
<meta name="description" content="First-person 3D asteroids. Sit in a gun turret at the heart of a rock field, turn to find what's coming, and shatter it before it reaches you. Every rock splits, every night is a seed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#060812;--ink:#f1ece0;--dim:#b7b4c8;--bolt:#3ff0c8;--bolt-hi:#d6fff4;--warn:#ff6a48;--gold:#ffd08a;--plate:rgba(8,8,18,.82);
  --font:Oxanium,Bahnschrift,"DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none;text-transform:uppercase;letter-spacing:.12em;transition:opacity .35s}
.hud.off{opacity:0}
.hud:before{content:"";position:absolute;left:0;right:0;top:0;height:170px;background:linear-gradient(#050610cc,#05061000)}
.tl{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top))}
.tr{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.score{font-size:clamp(40px,10vw,56px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.lab{font-size:15px;font-weight:700;color:var(--dim);margin-top:5px}
.chain{display:flex;align-items:center;gap:10px;margin-top:9px;height:26px;opacity:0;transition:opacity .25s}
.chain.on{opacity:1}
.chain b{font-size:26px;font-weight:800;color:var(--gold);min-width:2ch;display:inline-block;transform-origin:left center}
.chain b.pop{animation:pop .22s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(1.5)}to{transform:scale(1)}}
.seg{display:flex;gap:4px}.seg i{display:block;width:20px;height:10px;background:var(--gold);transform:skewX(-24deg);box-shadow:0 0 8px #ffb06666;transition:opacity .12s}
.seg i.o{opacity:.18;box-shadow:none}
.hull{display:flex;gap:7px}.hull i{display:block;width:48px;height:18px;background:var(--bolt);transform:skewX(-24deg);box-shadow:0 0 12px #3ff0c877;transition:background .2s,box-shadow .2s,transform .2s}
.hull i.off{background:#ffffff1f;box-shadow:none}
.hull.hit i:not(.off){animation:blink .5s steps(2) 3}
@keyframes blink{50%{background:var(--warn);box-shadow:0 0 12px #ff6a4888}}
.icons{display:flex;gap:8px;pointer-events:auto}
.ic{width:46px;height:46px;border-radius:50%;border:2px solid #ffffff33;background:#0a0c1acc;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font-family:inherit}
.ic:active{transform:scale(.92)}.ic svg{width:20px;height:20px;fill:currentColor}
.ic:focus-visible,.btn:focus-visible,.fire:focus-visible{outline:3px solid var(--bolt-hi);outline-offset:3px}
.fire{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(46px,calc(env(safe-area-inset-bottom) + 28px));width:112px;height:112px;border-radius:50%;border:3px solid var(--bolt-hi);background:radial-gradient(circle at 50% 40%,#7ff7dcb0,#2fcfa966);color:#eafff9;font:800 21px var(--font);letter-spacing:.18em;display:none;place-items:center;box-shadow:0 0 26px #3ff0c855;backdrop-filter:blur(2px);touch-action:none;cursor:pointer;padding:0 0 0 .18em;transition:transform .08s,box-shadow .08s,background .08s}
.fire.show{display:grid}
.fire.down{color:#04281f;transform:scale(.93);box-shadow:0 0 54px #3ff0c8,inset 0 0 28px #fff9;background:radial-gradient(circle,#e6fff8,#58f1d0)}
.fire.hint{animation:hint 1.1s ease-in-out infinite}
@keyframes hint{50%{box-shadow:0 0 64px #3ff0c8}}
.hintline{position:fixed;left:0;right:0;bottom:max(176px,calc(env(safe-area-inset-bottom) + 160px));text-align:center;font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-shadow:0 2px 12px #000;opacity:0;transition:opacity .5s;pointer-events:none}
.hintline.on{opacity:1}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .45s;background:radial-gradient(ellipse at center,#060812aa 0%,#060812e6 85%)}
.screen.on{opacity:1;pointer-events:auto}
.screen.light{background:radial-gradient(ellipse at center,#06081200 0%,#06081299 100%)}
.kicker{font-size:14px;font-weight:700;letter-spacing:.42em;color:var(--dim);text-transform:uppercase;margin-bottom:10px;padding-left:.42em}
h1{margin:0;font-weight:800;font-size:clamp(46px,13vw,104px);line-height:.92;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(#fff6e8,#e0b08a);-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:.06em}
.tag{font-size:clamp(14px,3.6vw,18px);color:var(--dim);max-width:30ch;line-height:1.45;margin:18px 0 30px;font-weight:500;letter-spacing:.04em}
.btns{display:flex;flex-direction:column;gap:12px;width:min(300px,100%)}
.btn{font:800 20px var(--font);letter-spacing:.2em;text-transform:uppercase;padding:17px 20px 17px calc(20px + .2em);border-radius:4px;border:2px solid var(--bolt-hi);cursor:pointer;background:var(--bolt);color:#04281f;transform:skewX(-8deg);transition:transform .1s,box-shadow .1s;box-shadow:0 0 26px #3ff0c855;touch-action:manipulation}
.btn span{display:block;transform:skewX(8deg)}
.btn:active{transform:skewX(-8deg) scale(.97)}
.btn.alt{background:#0a0c1acc;color:var(--ink);border-color:#ffffff40;box-shadow:none}
.btn small{display:block;font-size:12px;font-weight:500;letter-spacing:.16em;opacity:.8;margin-top:3px}
.best{margin-top:26px;font-size:14px;letter-spacing:.2em;color:var(--dim);font-weight:700;min-height:20px;text-transform:uppercase}
.big{font-size:clamp(54px,14vw,96px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.rows{display:flex;gap:30px;margin:22px 0 28px;justify-content:center}
.rows div{min-width:84px}.rows b{display:block;font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}.rows span{font-size:13px;letter-spacing:.2em;color:var(--dim);font-weight:700}
.tip{max-width:30ch;margin-top:18px;font-size:18px;line-height:1.4;color:var(--ink);font-weight:500;letter-spacing:.03em;text-transform:none}
.new{color:var(--gold);font-weight:800;letter-spacing:.3em;font-size:14px;margin-top:12px;min-height:18px}
.banner{position:fixed;left:0;right:0;top:15%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;text-transform:uppercase}
.banner.on{opacity:1;transform:none}
.banner b{display:block;font-size:clamp(30px,8vw,58px);letter-spacing:.3em;font-weight:800;padding-left:.3em;text-shadow:0 2px 24px #000}
.banner span{display:block;margin-top:10px;font-size:15px;letter-spacing:.26em;font-weight:700;color:var(--gold)}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#ff6a4800 35%,#ff6a48dd 100%);opacity:0}
@media (prefers-reduced-motion:reduce){.chain b.pop,.fire.hint,.hull.hit i{animation:none}.banner,.screen{transition:opacity .2s;transform:none}}
@media (max-height:520px){.tag{margin:10px 0 16px}.btns{flex-direction:row;width:auto}.best{margin-top:14px}.rows{margin:10px 0 16px}.hintline{display:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Asteroid field, first-person view"></canvas>
<div class="flash" id="flash"></div>
<div class="hud off" id="hud">
  <div class="tl"><div class="score" id="score">0</div><div class="lab" id="field">Field 1</div>
    <div class="chain" id="chain"><b id="mult">×1</b><span class="seg" id="seg"><i></i><i></i><i></i><i></i><i></i></span></div></div>
  <div class="tr"><div class="hull" id="hull"><i></i><i></i><i></i></div>
    <div class="icons"><button class="ic" id="mute" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path id="mutep" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <button class="ic" id="pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button></div></div>
</div>
<div class="hintline" id="hintline">Drag to turn · Hold to fire</div>
<button class="fire" id="fire" aria-label="Fire">FIRE</button>
<div class="banner" id="banner" aria-live="polite"><b id="bt"></b><span id="bs"></span></div>

<div class="screen on" id="title">
  <div class="kicker">3D Asteroids</div>
  <h1>Shatter<br>Field</h1>
  <p class="tag">You're in the turret. The rocks are coming from every side. Break them before they break you.</p>
  <div class="btns"><button class="btn" id="play"><span>Play</span></button><button class="btn alt" id="daily"><span>Tonight's field<small id="dailysub">same rocks for everyone</small></span></button></div>
  <div class="best" id="best"></div>
</div>
<div class="screen" id="over">
  <div class="kicker">Hull breached</div>
  <div class="big" id="os">0</div>
  <div class="new" id="onew"></div>
  <div class="tip" id="otip"></div>
  <div class="rows"><div><b id="of">1</b><span>Field</span></div><div><b id="ok">0</b><span>Rocks</span></div><div><b id="oc">0</b><span>Best chain</span></div></div>
  <div class="btns"><button class="btn" id="again"><span>Again</span></button><button class="btn alt" id="share"><span>Share this night</span></button><button class="btn alt" id="menu"><span>Menu</span></button></div>
</div>
<div class="screen light" id="paused">
  <div class="kicker">Paused</div>
  <div class="btns"><button class="btn" id="resume"><span>Resume</span></button><button class="btn alt" id="quit"><span>Quit run</span></button></div>
</div>
<script id="core">
// DOM-free rules of Shatter Field. The page only draws what this returns.
const FIELD = (() => {
  const SIZE = { 3: { r: 5.6, pts: 20 }, 2: { r: 3.1, pts: 50 }, 1: { r: 1.7, pts: 100 } };
  const SHIP_R = 1.1, BOLT_R = 0.35, BOLT_SPEED = 150, BOLT_LIFE = 1.15, COOLDOWN = 0.17;
  const SPAWN_MIN = 44, SPAWN_MAX = 74, WRAP_R = 110, MAX_HULL = 3;
  const CHAIN_WINDOW = 1.6, INVULN = 1.6, CLEAR_PAUSE = 2.4, PITCH_MAX = 1.45;
  const ASSIST = 0.075; // radians: widest nudge toward a rock when assist is on

  function rng(seed) {
    let s = seed | 0;
    return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];

  // yaw turns about the vertical axis, pitch lifts the nose; no roll, so "up" is always up
  function basis(aim) {
    const cy = Math.cos(aim.yaw), sy = Math.sin(aim.yaw), cp = Math.cos(aim.pitch), sp = Math.sin(aim.pitch);
    const f = [cp * sy, sp, cp * cy], r = [cy, 0, -sy];
    return { f, r, u: cross(f, r) };
  }
  // world -> camera space (x right, y up, z forward)
  function toCam(b, p) { return [dot(p, b.r), dot(p, b.u), dot(p, b.f)]; }

  function speedFor(field) { return Math.min(5 + field * 0.8, 15); }
  function countFor(field) { return Math.min(3 + field, 12); }

  function randDir(r) { const z = r() * 2 - 1, a = r() * Math.PI * 2, q = Math.sqrt(1 - z * z); return [q * Math.cos(a), z, q * Math.sin(a)]; }

  function newRock(S, size, p, v) {
    return { id: S.nextId++, size, r: SIZE[size].r, p, v, seed: (S.rng() * 1e9) | 0, rx: S.rng() * 6.28, ry: S.rng() * 6.28, wx: (S.rng() - .5) * 0.9, wy: (S.rng() - .5) * 0.9, born: S.t };
  }

  function spawnField(S) {
    const r = S.frng = rng(S.seed * 7919 + S.field * 104729);
    const n = countFor(S.field), sp = speedFor(S.field);
    S.rocks.length = 0;
    const b = basis(S.aim);
    for (let i = 0; i < n; i++) {
      let dir = randDir(r);
      // the first field opens in front of a new player: nothing to find, just something to shoot
      if (S.field === 1 || i === 0) {
        const q = norm(add(b.f, randDir(r), S.field === 1 ? 0.5 + i * 0.4 : 0.7));
        dir = q;
      }
      const dist = SPAWN_MIN + r() * (SPAWN_MAX - SPAWN_MIN) - (S.field === 1 ? 4 : 0);
      const p = [dir[0] * dist, dir[1] * dist, dir[2] * dist];
      const aimAt = scaled(randDir(r), r() * 9);
      const v = scaled(norm(sub(aimAt, p)), sp * (0.8 + r() * 0.4));
      S.rocks.push(newRock(S, 3, p, v));
    }
  }
  function scaled(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }

  function newGame(seed, opt = {}) {
    const S = {
      seed: seed | 0, daily: !!opt.daily, t: 0, field: 1, hull: MAX_HULL, score: 0, chain: 0, chainT: 0, hitless: true,
      rocks: [], bolts: [], aim: { yaw: 0, pitch: 0 }, cool: 0, gun: 0, invuln: 0, phase: 'play', phaseT: 0,
      nextId: 1, rng: rng(seed * 31 + 7), assist: opt.assist === undefined ? 1 : opt.assist, events: [], kills: 0, shots: 0, hits: 0, bestChain: 0,
    };
    spawnField(S);
    return S;
  }

  function multiplier(chain) { return Math.min(1 + Math.floor(chain / 3), 5); }

  function turn(S, dyaw, dpitch) {
    S.aim.yaw += dyaw; S.aim.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, S.aim.pitch + dpitch));
    const TAU = Math.PI * 2; S.aim.yaw = ((S.aim.yaw % TAU) + TAU) % TAU; if (S.aim.yaw > Math.PI) S.aim.yaw -= TAU;
  }

  // closest approach of a straight-moving rock to the ship: {t, d} with t seconds from now (t>0 only if approaching)
  function approach(rock) {
    const vv = dot(rock.v, rock.v);
    if (vv < 1e-9) return { t: Infinity, d: len(rock.p) };
    const t = -dot(rock.p, rock.v) / vv;
    if (t <= 0) return { t: Infinity, d: len(rock.p) };
    return { t, d: len(add(rock.p, rock.v, t)) };
  }
  // the rocks that will strike the ship if nothing changes, soonest first
  function threats(S, horizon = 8) {
    const out = [];
    for (const k of S.rocks) { const a = approach(k); if (a.t < horizon && a.d < k.r + SHIP_R) out.push({ id: k.id, t: a.t - (k.r) / Math.max(len(k.v), 1e-6), rock: k }); }
    return out.sort((a, b) => a.t - b.t);
  }

  function fire(S) {
    const b = basis(S.aim);
    const side = S.gun ? 1 : -1; S.gun ^= 1;
    const gun = add(add(add([0, 0, 0], b.f, 1.6), b.r, side * 0.17), b.u, -1.15);
    let target = add([0, 0, 0], b.f, 70);
    // assist: if a rock sits within a few degrees of the sight, lead it
    if (S.assist > 0) {
      let best = null, bestA = 1e9;
      for (const k of S.rocks) {
        const d = len(k.p); if (d > 130) continue;
        const lead = add(k.p, k.v, d / BOLT_SPEED);
        const ang = Math.acos(Math.max(-1, Math.min(1, dot(norm(lead), b.f))));
        const tol = ASSIST * S.assist + Math.atan2(k.r, d) * 0.6;
        if (ang < tol && ang < bestA) { bestA = ang; best = { lead, k }; }
      }
      if (best) { // never move the aim point further than the cone allows
        const want = norm(best.lead), got = norm(add(b.f, want, 1)); // halfway
        const dist = len(best.lead);
        target = scaled(got, dist);
      }
    }
    const dir = norm(sub(target, gun));
    S.bolts.push({ p: gun, v: scaled(dir, BOLT_SPEED), age: 0 });
    S.shots++;
    S.events.push({ type: 'fire', side });
  }

  // does the segment p0->p1 touch a sphere?
  function segHit(p0, p1, c, r) {
    const d = sub(p1, p0), f = sub(p0, c);
    const a = dot(d, d); if (a < 1e-12) return len(f) <= r ? 0 : -1;
    let t = -dot(f, d) / a; t = Math.max(0, Math.min(1, t));
    const q = add(f, d, t);
    return dot(q, q) <= r * r ? t : -1;
  }

  function breakRock(S, k, boltDir) {
    S.rocks.splice(S.rocks.indexOf(k), 1);
    const mult = multiplier(S.chain);
    const pts = SIZE[k.size].pts * mult;
    S.score += pts; S.kills++;
    const ev = { type: k.size > 1 ? 'split' : 'crumble', size: k.size, p: k.p.slice(), v: k.v.slice(), r: k.r, pts, mult, id: k.id, seed: k.seed };
    if (k.size > 1) {
      const sp = len(k.v) || 1, ax = norm(cross(boltDir || norm(k.v), randDir(S.rng))), ax2 = cross(norm(k.v), ax);
      const kick = 3.5 + S.rng() * 2.5, ang = S.rng() * 6.28;
      const dirv = add(scaled(ax, Math.cos(ang)), ax2, Math.sin(ang));
      const dv = scaled(norm(dirv), kick);
      const off = scaled(norm(dirv), k.r * 0.45);
      const a = newRock(S, k.size - 1, add(k.p, off), add(k.v, dv));
      const c = newRock(S, k.size - 1, sub(k.p, off), sub(k.v, dv));
      S.rocks.push(a, c); ev.children = [a.id, c.id];
    }
    S.events.push(ev);
  }

  function step(S, dt, input = {}) {
    S.events.length = 0;
    S.t += dt;
    if (S.phase === 'over') return S;
    if (S.chain > 0) { S.chainT -= dt; if (S.chainT <= 0) S.chain = 0; }
    if (S.phase === 'clear') {
      S.phaseT -= dt;
      moveBolts(S, dt);
      if (S.phaseT <= 0) { S.field++; S.phase = 'play'; spawnField(S); S.hitless = true; S.events.push({ type: 'field', field: S.field }); }
      return S;
    }
    S.cool = Math.max(0, S.cool - dt);
    S.invuln = Math.max(0, S.invuln - dt);
    if (input.fire) { let guard = 0; while (S.cool <= 0 && guard++ < 4) { fire(S); S.cool += COOLDOWN; } if (S.cool < 0) S.cool = 0; }
    // rocks
    for (const k of S.rocks.slice()) {
      const before = dot(k.p, k.v);
      k.p = add(k.p, k.v, dt); k.rx += k.wx * dt; k.ry += k.wy * dt;
      const d = len(k.p);
      if (before < 0 && dot(k.p, k.v) >= 0 && d < 9 + k.r && d > k.r + SHIP_R) S.events.push({ type: 'pass', id: k.id, size: k.size, d });
      if (d < k.r + SHIP_R && S.invuln <= 0) { hurt(S, k); continue; }
      if (d > WRAP_R && dot(k.p, k.v) > 0) { // leaves the shell: comes round again from the far side
        const sp = len(k.v), back = norm(k.p);
        const q = scaled(back, -(SPAWN_MAX + 12));
        const aimAt = scaled(randDir(S.rng), S.rng() * 8);
        k.p = q; k.v = scaled(norm(sub(aimAt, q)), sp);
        S.events.push({ type: 'wrap', id: k.id });
      }
    }
    if (S.phase === 'over') return S;
    moveBolts(S, dt);
    if (S.rocks.length === 0 && S.phase === 'play') {
      const bonus = S.hitless ? 250 * S.field : 0;
      S.score += bonus;
      const healed = S.hull < MAX_HULL; if (healed) S.hull++;
      S.phase = 'clear'; S.phaseT = CLEAR_PAUSE;
      S.events.push({ type: 'clear', field: S.field, bonus, healed });
    }
    return S;
  }

  function hurt(S, k) {
    S.rocks.splice(S.rocks.indexOf(k), 1);
    S.hull--; S.invuln = INVULN; S.chain = 0; S.hitless = false;
    S.events.push({ type: 'hull', size: k.size, p: k.p.slice(), hull: S.hull, from: norm(k.p) });
    if (S.hull <= 0) { S.phase = 'over'; S.events.push({ type: 'over', field: S.field, score: S.score }); }
  }

  function moveBolts(S, dt) {
    for (const bo of S.bolts.slice()) {
      const p1 = add(bo.p, bo.v, dt);
      let hitK = null, hitT = 2;
      for (const k of S.rocks) { // rocks move first, so test against where they are now
