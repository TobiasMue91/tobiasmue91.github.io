:root{--bg:#0b0408;--gold:#ffd98a;--gold2:#e0a93f;--cream:#fff1dc;--dim:#cfb0b5;--panel:#1b0a10;--line:#4a1d2c;--crim:#e5233f;
  --disp:"Horde Display",Georgia,"Times New Roman",serif;--text:"Horde Text",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cream);font-family:var(--text);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* top strip: wave and its bar, settings */
.top{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  display:flex;gap:14px;align-items:center;pointer-events:none;z-index:3}
.wave{flex:1;min-width:0}
.wave .l{display:flex;align-items:baseline;gap:8px}
.wave small{font:600 14px/1 var(--text);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.wave b{font:700 38px/1 var(--disp);margin-right:auto;display:inline-block;transform-origin:left bottom}
.wave em{font:700 18px/1 var(--text);font-style:normal;color:var(--cream)}
.bar{margin-top:7px;height:10px;background:rgba(255,255,255,.14);border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px #0008}
.bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:5px}
.boss .bar i{background:linear-gradient(90deg,#c4301c,#ff6a4a)}
.gear{margin-left:auto;pointer-events:auto;width:46px;height:46px;border-radius:50%;background:#3a1522;border:1.5px solid #ffd98a88;display:grid;place-items:center;flex:none}
.gear:active{transform:scale(.94)}
.mend{position:fixed;left:16px;z-index:3;display:inline-flex;gap:8px;align-items:center;height:44px;padding:0 16px 0 12px;border-radius:99px;
  background:linear-gradient(#ffeaa8,#eab34c);color:#3a1604;font:700 16px/1 var(--text);box-shadow:0 2px 0 #8a5a12,0 0 22px #ffb84c88;
  animation:mendbob 2.2s ease-in-out infinite}
.mend[hidden]{display:none}
@keyframes mendbob{50%{transform:translateY(-3px)}}

/* the shop: the bank, then the cards */
.shop{position:fixed;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(#1b0a10,#0f060a);border-top:2px solid #ffd98a55;box-shadow:0 -12px 30px #0009;
  padding:0 max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.bank{display:flex;align-items:baseline;justify-content:center;gap:12px;padding:9px 0 9px}
.bank b{display:inline-flex;gap:9px;align-items:center;font:700 38px/1 var(--disp);color:var(--gold);text-shadow:0 2px 0 #0008;transform-origin:center}
.bank svg{width:28px;height:28px;flex:none}
.bank small{font:700 18px/1 var(--text);color:#ffe9b8;white-space:nowrap;min-width:0}
.tray{display:flex;gap:10px;margin:0 calc(-1 * max(10px,env(safe-area-inset-left)));padding:0 max(10px,env(safe-area-inset-left));overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scroll-padding:0 12px;scrollbar-width:none;
  max-height:0;opacity:0;transition:max-height .5s cubic-bezier(.2,.8,.2,1),opacity .4s,padding .5s;padding-top:0;padding-bottom:0;overscroll-behavior-x:contain}
.tray::-webkit-scrollbar{display:none}
.shop.open .tray{max-height:200px;opacity:1;padding-top:16px;padding-bottom:4px}
.dots{display:flex;justify-content:center;gap:7px;height:0;overflow:hidden;opacity:0;transition:height .4s,opacity .4s}
.shop.open .dots{height:16px;opacity:1;padding-top:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:#4a1d2c;transition:background .2s,transform .2s}
.dots i.on{background:#8a5a68}.dots i.ready{background:var(--gold);box-shadow:0 0 8px #ffb84c}.dots i.view{transform:scale(1.35)}
.card{position:relative;flex:0 0 min(44vw,176px);scroll-snap-align:start;border-radius:16px;background:#2a0f18;border:2px solid var(--line);padding:12px 12px 12px;display:flex;flex-direction:column;gap:8px;color:var(--dim);
  text-align:left;touch-action:pan-x;transition:transform .12s,box-shadow .2s,background .2s,border-color .2s;touch-action:manipulation}
.card .head{display:flex;align-items:center;gap:7px}
.card svg.ic{width:34px;height:34px;flex:none;opacity:.85}
.card .t{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.card .t b{font:700 18px/1 var(--disp);color:var(--cream);white-space:nowrap}
.card .t span{font:600 15px/1 var(--text);white-space:nowrap;color:#ead6da}
.card .t u{text-decoration:none;opacity:.8}.card .t s{text-decoration:none;color:var(--gold)}
.card .lv{position:absolute;right:9px;top:9px;font:700 14px/1 var(--text);color:var(--dim);background:#0006;border-radius:99px;padding:4px 8px;transition:transform .2s}
.card .buy{display:flex;flex-direction:column;gap:6px}
.card .price{display:flex;align-items:center;justify-content:flex-start;gap:8px;height:30px;border-radius:99px;font:700 25px/1 var(--text);color:var(--cream);padding-left:2px}
.card .price svg{width:20px;height:20px;color:var(--gold);flex:none}
.card .meter{height:8px;border-radius:4px;background:#0c0509;box-shadow:inset 0 1px 2px #000a;overflow:hidden}
.card .meter b{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#c98f2e,#ffd98a);border-radius:4px}
.card.near{border-color:#b98a3c;box-shadow:0 0 14px #ffb84c33}
.card.near .meter b{background:linear-gradient(90deg,#ffd98a,#fff1c8)}
.card.ready{background:linear-gradient(#5a2230,#38141f);border-color:var(--gold);box-shadow:0 0 0 1px #ffd98a44,0 0 22px #ffb84c66;color:#f3d9c4}
.card.ready .price{height:42px;justify-content:center;background:linear-gradient(#ffeaa8,#eab34c);color:#3a1604;box-shadow:0 2px 0 #8a5a12}
.card.ready .price svg{color:#3a1604}
.card.ready .meter{display:none}
.card.ready svg.ic{opacity:1}
.card:active{transform:scale(.96)}
.card.bump{animation:bump .32s cubic-bezier(.2,.9,.3,1.4)}
.card.bump .lv{transform:scale(1.35)}
@keyframes bump{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.card.reveal{animation:reveal .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes reveal{0%{transform:translateY(24px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.card[hidden]{display:none}
.card.locked{background:#190a10;border:2px dashed #5a2a3a;color:#8a6a74;align-items:center;justify-content:center;min-height:118px}
.card.locked::after{content:"?";font:700 44px/1 var(--disp);color:#6a3a4a;position:absolute}
.card.locked .t b,.card.locked .t span,.card.locked .buy,.card.locked .lv{visibility:hidden}
.card.locked svg.ic{opacity:0}
.card.locked .t{min-height:34px}
.card.max .price{color:var(--gold)}

/* banners and toasts */
.banner{position:fixed;left:0;right:0;top:calc(max(12px,env(safe-area-inset-top)) + 84px);z-index:4;text-align:center;pointer-events:none;opacity:0}
.banner b{display:block;font:700 54px/1 var(--disp);letter-spacing:-.01em;text-shadow:0 3px 0 #1d0a10,0 0 30px #ffb84c66;color:var(--gold)}
.banner span{display:block;margin-top:8px;font:700 19px/1.2 var(--text);color:var(--cream);text-shadow:0 2px 0 #1d0a10;padding:0 24px}
.banner.show{animation:banner 2.3s cubic-bezier(.2,.8,.2,1) forwards}
.banner.boss b{color:#ff8a5a}
.banner.hb b{color:#fff1dc}
@keyframes banner{0%{opacity:0;transform:translateY(14px) scale(.92)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.toast{position:fixed;left:50%;top:90px;z-index:4;transform:translate(-50%,-10px);padding:10px 18px;border-radius:99px;background:#2a0f18ee;border:1.5px solid #ffd98a77;font:700 16px/1.2 var(--text);color:var(--cream);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{position:fixed;left:50%;z-index:2;transform:translateX(-50%);font:700 26px/1 var(--disp);color:var(--gold);text-shadow:0 2px 0 #1d0a10;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.hint.show{opacity:1;animation:hintbob 1.2s ease-in-out infinite}
@keyframes hintbob{50%{margin-top:6px}}

/* veil, sheets */
.veil,.sheet{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:20px;transition:opacity .45s}
.veil{align-items:end;padding-bottom:max(7vh,36px)}
.veil{background:linear-gradient(#0b040800 30%,#0b0408f6 62%),radial-gradient(ellipse at 50% 38%,#0b040833,#0b0408f2 70%)}
.sheet{background:#0b0408d9;align-items:end}
.veil[hidden],.sheet[hidden]{display:none}
.veil.out,.sheet.out{opacity:0;pointer-events:none}
.veil .in{text-align:center;max-width:420px}
.veil h1{margin:0;font:700 clamp(38px,12.4vw,56px)/1 var(--disp);white-space:nowrap;color:var(--cream);text-shadow:0 3px 0 #1d0a10,0 0 40px #e5233f88;letter-spacing:-.015em}
.veil p{margin:14px 0 0;font:700 20px/1.3 var(--text);color:var(--dim)}
.away{margin:22px auto 0;padding:14px 18px;border-radius:18px;background:#2a0f18;border:1.5px solid #ffd98a55}
.away small{display:block;font:600 16px/1.25 var(--text);color:#e6cfd3}
.away b{display:inline-flex;gap:9px;align-items:center;margin-top:6px;font:700 44px/1 var(--disp);color:var(--gold)}
.away b svg{width:30px;height:30px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:200px;height:58px;margin-top:26px;padding:0 30px;border-radius:99px;
  background:linear-gradient(#ffeaa8,#eab34c);color:#3a1604;font:700 24px/1 var(--text);box-shadow:0 3px 0 #8a5a12,0 0 30px #ffb84c66}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a12}
.panel:focus{outline:none}.panel{width:100%;max-width:460px;margin:0 auto;border-radius:24px 24px 0 0;background:linear-gradient(#2a0f18,#1b0a10);border:2px solid #4a1d2c;border-bottom:0;
  padding:22px 20px max(22px,env(safe-area-inset-bottom));transform:translateY(0);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.out .panel{transform:translateY(40px)}
.panel h2{margin:0 0 4px;font:700 32px/1.05 var(--disp);color:var(--gold)}
.panel p{margin:10px 0 0;font:600 18px/1.4 var(--text);color:var(--cream)}
.panel .sub{color:var(--dim)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;border-top:1px solid #4a1d2c;font:700 19px/1.1 var(--text)}
.row:first-of-type{margin-top:14px}
.sw{width:64px;height:36px;border-radius:99px;background:#0c0509;border:1.5px solid #6a2c3e;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:27px;height:27px;border-radius:50%;background:#cfb0b5;transition:transform .2s cubic-bezier(.2,.8,.2,1.2),background .2s}
.sw[aria-checked=true]{background:#8d5f1e}.sw[aria-checked=true]::after{transform:translateX(28px);background:var(--gold)}
.hold{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;height:58px;border-radius:99px;margin-top:16px;
  background:#170810;border:2px solid #ffd98a88;font:700 21px/1 var(--text);color:var(--cream)}
.hold i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#a06a1e,#e0a93f)}
.hold span{position:relative}
.hold.danger{border-color:#e5233f99}.hold.danger i{background:linear-gradient(90deg,#8c1a2c,#e5233f)}
.ghost{display:flex;align-items:center;justify-content:center;width:100%;height:54px;margin:12px 0 0;border-radius:99px;border:1.5px solid #6a2c3e;font:700 19px/1 var(--text);color:var(--cream);background:#ffffff0a}
.ghost:active{background:#ffffff18}
.link{display:flex;align-items:center;justify-content:center;min-height:48px;color:var(--gold);text-decoration:none;font:700 17px/1 var(--text)}
.mendrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 0}
.mendrow figure{margin:0;text-align:center}
.mendrow canvas{display:block;width:128px;height:128px}
.mendrow figcaption{font:700 18px/1.1 var(--text);color:var(--dim)}
.mendrow figure.to figcaption{color:var(--gold)}
.mendrow .arr{font:700 34px/1 var(--disp);color:var(--gold);margin-top:-22px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.lowhp .top .wave em{color:#ff8a98}

@media (min-width:860px){
  .top{padding:24px 28px 0 30px}.wave{flex:none;width:420px}
  .wave b{font-size:46px}.wave small{font-size:15px}.wave em{font-size:19px}
  .mend{left:30px}
  .shop{padding:12px 28px 14px 30px;display:flex;align-items:center;gap:26px}
  .bank{display:block;text-align:left;padding:0;min-width:300px}
  .bank b{font-size:60px;gap:12px}.bank svg{width:40px;height:40px}.bank small{display:block;font-size:18px;margin-top:8px}
  .tray{flex:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:0;padding:0;overflow:visible;max-height:0;transition:max-height .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
  .shop.open .tray{max-height:220px;padding-top:16px;padding-bottom:0}
  .dots{display:none}
  .card{flex:none;padding:12px 12px 10px;touch-action:manipulation}
  .card .lv{top:-11px;right:10px;background:#5a2536;border:1.5px solid #8a3a52;color:var(--cream)}
  .card .t b{font-size:21px}.card .t span{font-size:16px}.card .price{font-size:24px;height:28px}.card.ready .price{height:38px}
  .card.locked{min-height:0}
  .panel{border-radius:24px;border-bottom:2px solid #4a1d2c;margin-bottom:6vh}
  .sheet{align-items:center}.panel{margin:0 auto}
  .veil{padding-bottom:12vh}.veil h1{font-size:76px}
}
@media (max-width:380px){.wave b{font-size:34px}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .mend{animation:none}
}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<header class="top" id="top">
  <div class="wave" id="waveBox"><div class="l"><small id="wlabel">Wave</small><b id="wnum">1</b><em id="wleft"></em></div><div class="bar"><i id="wbar"></i></div></div>
  <button class="gear" id="gear" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd98a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2l1.3 2.3 2.6-.7.8 2.6 2.6.8-.7 2.6 2.3 1.3-2.3 1.3.7 2.6-2.6.8-.8 2.6-2.6-.7L12 20.8l-1.3-2.3-2.6.7-.8-2.6-2.6-.8.7-2.6L3.2 12l2.3-1.3-.7-2.6 2.6-.8.8-2.6 2.6.7z"/></svg></button>
</header>
<button class="mend" id="mend" hidden><svg width="22" height="22" viewBox="-1.3 -1.2 2.6 2.4"><path d="M0,-.32 C-.12,-1.02 -1.22,-1 -1.12,-.12 C-1.04,.5 -.4,.78 0,1.08 C.4,.78 1.04,.5 1.12,-.12 C1.22,-1 .12,-1.02 0,-.32Z" fill="#3a1604"/><path d="M-.3,-.5 L-.1,-.1 L-.35,.3" fill="none" stroke="#ffeaa8" stroke-width=".14" stroke-linecap="round"/></svg><span id="mendtxt">Mend</span></button>
<div class="hint" id="hint">Tap to beat</div>
<div class="banner" id="banner"><b></b><span></span></div>
<div class="toast" id="toast" role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>
<section class="shop" id="shop" aria-label="Upgrades">
  <div class="bank"><b><svg viewBox="-1.3 -1.2 2.6 2.4"><path d="M0,-.32 C-.12,-1.02 -1.22,-1 -1.12,-.12 C-1.04,.5 -.4,.78 0,1.08 C.4,.78 1.04,.5 1.12,-.12 C1.22,-1 .12,-1.02 0,-.32Z" fill="#ffd98a"/></svg><span id="love">0</span></b><small id="rate"></small></div>
  <div class="tray" id="tray"></div>
  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</section>
<div class="veil" id="veil" role="dialog" aria-labelledby="vh1"><div class="in">
  <h1 id="vh1">Emoji Horde</h1><p id="vsub">Keep your heart beating.</p>
  <div class="away" id="away" hidden><small id="awaysub">While you were away</small><b><svg viewBox="-1.3 -1.2 2.6 2.4"><path d="M0,-.32 C-.12,-1.02 -1.22,-1 -1.12,-.12 C-1.04,.5 -.4,.78 0,1.08 C.4,.78 1.04,.5 1.12,-.12 C1.22,-1 .12,-1.02 0,-.32Z" fill="#ffd98a"/></svg><span id="awayn">0</span></b></div>
  <button class="cta" id="vgo">Begin</button>
</div></div>
<div class="sheet out" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script id="core">
// Emoji Horde: the rules, with no DOM. The page only draws what this returns and plays what it announces.
// World units: the heart is at (0,0), +y is down the screen. One unit is about a thumb-width tenth of the field.
const HordeCore = (() => {
  const T = {
    heartR: 1.1,        // enemies stop when their edge touches this
    spawnMin: 6.8, spawnMax: 22,   // how far from the heart a face may start
    pulseTime: 0.3,     // seconds for a pulse to reach its full reach
    squeezeCd: 0.42,    // seconds between taps
    squeezeFrac: 0.7,   // a squeeze is this much of a beat's damage and reach
    cupidR: 2.1, cupidHit: 0.45, cupidSpin: 1.7,
    knock: 6.0, knockDecay: 7,
    offlineMax: 8 * 3600, offlineShare: 0.4,
    mendWave: 25,
  };

  // ------------------------------------------------------------------ upgrades
  // v(L) is what the card shows; cost(L) is paid in love
  const UP = {
    thump:     { name: 'Thump',     v: L => Math.pow(1.2, L),                          cost: L => Math.ceil(6 * Math.pow(1.27, L)),   fmt: v => num(v) },
    tempo:     { name: 'Tempo',     v: L => 50 + 130 * (1 - Math.pow(0.955, L)),       cost: L => Math.ceil(20 * Math.pow(1.3, L)),  fmt: v => fmt(Math.round(v)) },
    reach:     { name: 'Reach',     v: L => 2.6 + 5.2 * (1 - Math.pow(0.94, L)),       cost: L => Math.ceil(15 * Math.pow(1.3, L)),  fmt: v => v.toFixed(1) },
    courage:   { name: 'Courage',   v: L => 20 * Math.pow(1.14, L),                    cost: L => Math.ceil(12 * Math.pow(1.26, L)), fmt: v => fmt(Math.round(v)) },
    cupids:    { name: 'Cupids',    v: L => L,                                          cost: L => Math.ceil(60 * Math.pow(1.9, L)),   fmt: v => String(v), max: 12 },
    warmth:    { name: 'Warmth',    v: L => Math.pow(1.12, L),                          cost: L => Math.ceil(40 * Math.pow(1.38, L)), fmt: v => '×' + num(v) },
  };
  const ORDER = ['thump', 'tempo', 'reach', 'courage', 'cupids', 'warmth'];

  function num(v) { return v < 10 ? (Math.round(v * 10) / 10).toString() : fmt(Math.round(v)); }

  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  function fmt(n) {
    if (!isFinite(n)) return '\u221e';
    if (n < 0) return '-' + fmt(-n);
    if (n < 1000) return n < 10 && n % 1 ? (Math.floor(n * 10) / 10).toString() : String(Math.floor(n));
    let i = Math.min(SUF.length - 1, Math.floor(Math.log10(n) / 3 + 1e-9)), v = n / Math.pow(10, 3 * i);
    if (v >= 1000 && i < SUF.length - 1) { v /= 1000; i++; } else if (v < 1 && i > 0) { v *= 1000; i--; }
    if (v >= 1000) { const e = Math.floor(Math.log10(n)); return (n / Math.pow(10, e)).toFixed(2) + 'e' + e; }
    const d = v < 10 ? 2 : v < 100 ? 1 : 0, k = Math.pow(10, d);
    let s = (Math.floor(v * k) / k).toFixed(d); if (d) s = s.replace(/\.?0+$/, '');
    return s + SUF[i];
  }

  // ------------------------------------------------------------------ rng
  function rand(s) { // mulberry32 on s.seed
    let t = (s.seed = (s.seed + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ------------------------------------------------------------------ species
  const KINDS = {
    grump: { hp: 1,    speed: 1.2,  r: 0.62,  bite: 1,   bounty: 1,    mass: 1 },
    fret:  { hp: 0.5,  speed: 2.4,  r: 0.46,  bite: 0.6, bounty: 0.6,  mass: 0.8 },
    sulk:  { hp: 6,    speed: 0.65, r: 0.95, bite: 3,   bounty: 4.5,  mass: 3.2 },
    snark: { hp: 1.6,  speed: 1.0,  r: 0.6,  bite: 0,   bounty: 2.6,  mass: 1, ranged: true },
    boss:  { hp: 28,   speed: 0.7,  r: 1.6, bite: 4,   bounty: 28,   mass: 9 },
  };
  const hpScale = w => 3 * Math.pow(1.22, w - 1);
  const biteScale = w => Math.pow(1.11, w - 1);
  const bountyScale = w => Math.pow(1.14, w - 1);

  function waveSpec(w, tutorial) {
    const boss = w % 10 === 0;
    if (tutorial) return { w, boss: false, count: 3, podSize: 1, gap: 2.6, mix: { grump: 1 }, speedMul: 0.9, hpMul: 0.3, near: 6.6 };
    const count = Math.min(64, Math.floor(4 + 1.5 * w));
    const mix = { grump: 1 };
    if (w >= 3) mix.fret = 0.28;
    if (w >= 6) mix.sulk = 0.12;
    if (w >= 9) mix.snark = 0.16;
    return { w, boss, count: boss ? Math.floor(count / 2) : count, podSize: w < 3 ? 2 : Math.min(6, 3 + Math.floor(w / 8)), gap: Math.max(1.8, 3.4 - w * 0.03), mix, speedMul: 1 };
  }

  // ------------------------------------------------------------------ state
  function newGame(seed) {
    const s = {
      v: 1, seed: (seed == null ? 1 : seed) | 0, t: 0,
      love: 0, wave: 1, best: 1, top: 1, seams: 0, mends: 0, kills: 0,
      up: { thump: 0, tempo: 0, reach: 0, courage: 0, cupids: 0, warmth: 0 },
      seen: {}, auto: false, taps: 0,
      hp: 0, hurt: 0, beatIn: 0, beats: 0, sqCd: 0, orbit: 0,
      enemies: [], drops: [], barbs: [], pulses: [], q: [], waveT: 0, waveTotal: 0, waveDone: 0, gap: 0, nid: 1,
      view: { hw: 5.2, hh: 7 }, pause: 0, rate: 0, acc: 0, accT: 0, ev: [], breaks: 0, started: false,
    };
    s.hp = stats(s).maxHp;
    return s;
  }

  const seamMult = seams => 1 + 0.4 * seams;

  function stats(s) {
    const u = s.up, sm = seamMult(s.seams);
    const dmg = UP.thump.v(u.thump) * sm;
    const bpm = UP.tempo.v(u.tempo);
    return {
      dmg, bpm, interval: 60 / bpm,
      reach: UP.reach.v(u.reach),
      maxHp: UP.courage.v(u.courage),
      regen: Math.min(0.06, 0.005 * u.courage),
      cupids: u.cupids, cupidDmg: dmg * 0.55,
      greed: UP.warmth.v(u.warmth) * sm,
    };
  }

  // the page tells the core how far the edge of the screen is, so crowds start just off it and take as long to arrive on a wide screen as on a phone
  function setView(s, hw, hh) { s.view = { hw: clampNum(hw, 2, 40, 5.2), hh: clampNum(hh, 2, 40, 7) }; }
  // how far out a face starts in the direction a: just past the edge of the screen, so nobody walks for ten seconds in the dark
  function spawnDist(s, a) {
    const c = Math.abs(Math.cos(a)), n = Math.abs(Math.sin(a));
    const d = Math.min(c > 1e-6 ? s.view.hw / c : 1e9, n > 1e-6 ? s.view.hh / n : 1e9) + 1.4;
    return Math.min(T.spawnMax, Math.max(T.spawnMin, d));
  }
  const left = s => s.q.length + s.enemies.length;
  // what a card shows for a level, with the seams counted
  const valueAt = (s, id, L) => { const v = UP[id].v(L); return (id === 'thump' || id === 'warmth') ? v * seamMult(s.seams) : v; };
  const showVal = (s, id, L) => UP[id].fmt(valueAt(s, id, L));
  const boss = s => { for (const e of s.enemies) if (e.kind === 'boss') return e; return null; };
  const levelOf = (s, id) => s.up[id];
  const costOf = (s, id) => UP[id].cost(s.up[id]);
  const maxed = (s, id) => UP[id].max != null && s.up[id] >= UP[id].max;
  function canBuy(s, id) { return !maxed(s, id) && s.love >= costOf(s, id); }

  function buy(s, id) {
    if (!canBuy(s, id)) return false;
    const before = stats(s).maxHp;
    s.love -= costOf(s, id); s.up[id]++;
    if (id === 'courage') s.hp += stats(s).maxHp - before;
    s.ev.push({ t: 'buy', id, level: s.up[id] });
    return true;
  }

  // a card shows up once the player has held half its price, and then stays
  function reveal(s) {
    // in order: the next card shows once its turn has come and half its price is held
    for (const id of ORDER) { if (s.seen[id]) continue; if (s.love >= costOf(s, id) * 0.5) { s.seen[id] = true; s.ev.push({ t: 'reveal', id }); } else break; }
  }

  // ------------------------------------------------------------------ waves
  function startWave(s) {
    const spec = waveSpec(s.wave, !s.auto && s.wave === 1);
    s.q = []; s.waveT = 0; s.waveDone = 0;
    const gapT = spec.gap;
    let at = spec.near ? 1.0 : 0.6, last = rand(s) * 6.283, left = spec.count;
    const kinds = Object.keys(spec.mix), tot = kinds.reduce((a, k) => a + spec.mix[k], 0);
    const pick = () => { let r = rand(s) * tot; for (const k of kinds) { r -= spec.mix[k]; if (r <= 0) return k; } return kinds[0]; };
    while (left > 0) {
      const n = Math.min(left, spec.podSize + (spec.podSize > 1 && rand(s) < 0.4 ? 1 : 0));
      let a = spec.near ? -2.3 + rand(s) * 1.5 : last + 1.4 + rand(s) * 3.4; last = a;
      for (let i = 0; i < n; i++) {
        const k = pick(), aa = a + (rand(s) - 0.5) * 0.5;
        s.q.push({ at: at + i * 0.12, kind: k, a: aa, d: spec.near ? spec.near + rand(s) * 0.4 : spawnDist(s, aa) + rand(s) * 1.2 });
      }
      left -= n; at += gapT;
    }
    if (spec.boss) { const ba = rand(s) * 6.283; s.q.push({ at: 1.2, kind: 'boss', a: ba, d: spawnDist(s, ba) + 1.2 }); }
    s.q.sort((a, b) => a.at - b.at);
    s.waveTotal = s.q.length; s.spec = spec;
    s.ev.push({ t: 'wave', w: s.wave, boss: spec.boss, total: s.waveTotal });
  }

  function spawn(s, kind, a, d, extra) {
    const K = KINDS[kind], w = s.wave, sp = s.spec || waveSpec(w);
    const hp = K.hp * hpScale(w) * (sp.hpMul || 1);
    const e = {
      id: s.nid++, kind, x: Math.cos(a) * d, y: Math.sin(a) * d, hp, max: hp, r: K.r,
      speed: K.speed * (sp.speedMul || 1) * (0.9 + 0.2 * rand(s)), bite: K.bite * biteScale(w), mass: K.mass,
      kx: 0, ky: 0, stun: 0, flash: 0, hurt: 0, age: 0, bt: 0.6, ph: rand(s) * 6.283, shot: 1.2 + rand(s), clung: false, cup: 0, summon: 4,
    };
    s.enemies.push(e);
    if (kind === 'boss') s.ev.push({ t: 'bossSpawn', x: e.x, y: e.y });
    return e;
  }

  // ------------------------------------------------------------------ the beat
  function pulse(s, scale, squeeze) {
    const st = stats(s), R = st.reach * scale;
    s.pulses.push({ r: 0.2, R, dmg: st.dmg * scale, sp: R / T.pulseTime, hit: new Set(), squeeze, n: 0 });
    s.ev.push({ t: 'pulse', R, squeeze });
  }
  function beat(s) {
    s.beats++; s.beatIn += stats(s).interval;

  function squeeze(s) {

  function hurtHeart(s, dmg, x, y, kind) {

  // ------------------------------------------------------------------ step

    for (let j = s.barbs.length - 1; j >= 0; j--) {
      const b = s.barbs[j]; b.x += b.vx * dt; b.y += b.vy * dt;
      if (Math.hypot(b.x, b.y) <= T.heartR) { hurtHeart(s, b.dmg, b.x, b.y, 'barb'); s.barbs.splice(j, 1); }
    }
    // sweep the dead
    if (E.length) s.enemies = E.filter(e => !e.dead);

    // healing
    if (s.hurt <= 0 && st.regen > 0) s.hp = Math.min(st.maxHp, s.hp + st.maxHp * st.regen * dt);
    if (s.hp > st.maxHp) s.hp = st.maxHp;

      s.waveTotal = 0; s.gap = 1.1;

  function heartbreak(s) {

})();

<script id="art">
// Emoji Horde, drawing. One heart, round bad moods; everything is vector so it looks the same on every phone.
// Every function takes a 2D context and pixel sizes; nothing here knows about the rules.
const INK = '#1d0a10', GOLD = '#ffd98a', GOLD2 = '#e0a93f';

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();

}

function heartPath(c, R) {
  c.beginPath();
  c.moveTo(0, -0.32 * R);
  c.bezierCurveTo(-0.12 * R, -1.02 * R, -1.22 * R, -1.0 * R, -1.12 * R, -0.12 * R);
  c.bezierCurveTo(-1.04 * R, 0.5 * R, -0.4 * R, 0.78 * R, 0, 1.08 * R);
  c.bezierCurveTo(0.4 * R, 0.78 * R, 1.04 * R, 0.5 * R, 1.12 * R, -0.12 * R);
  c.bezierCurveTo(1.22 * R, -1.0 * R, 0.12 * R, -1.02 * R, 0, -0.32 * R);
  c.closePath();

// Gold seams for the heart: one vein per mend, in heart units, always the same for the same number.
function seamPaths(n) {
  const out = []; let x = 7;
  const rnd = () => ((x = (Math.imul(x, 1664525) + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < Math.min(n, 14); i++) {

// o.hp 0..1 is the blood level (the heart is its own health bar), o.seams gold veins, o.scaleX/scaleY the beat,
// o.crack 0..1 is glass breaking across it
function drawHeart(c, x, y, R, o = {}) {
  const sx = o.sx || 1, sy = o.sy || 1, seams = o.seams || [];

  g.addColorStop(0, '#ff6f82'); g.addColorStop(0.45, '#e5233f'); g.addColorStop(1, '#8c0c24');

  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(-0.78 * R, -0.24 * R, R * 0.06, R * 0.045, -0.9, 0, 7); c.fill();

// every species has its own body; all of them look at the heart (o.look = angle to it)
const SPECIES = {
  grump: { a: '#f7dc4a', b: '#e2a512', ink: '#3a1a08', sx: 1, sy: 1 },
  fret:  { a: '#ffb560', b: '#e8651c', ink: '#3b1604', sx: .95, sy: 1.05 },
  sulk:  { a: '#8fa8ee', b: '#4559c8', ink: '#101a4a', sx: 1.12, sy: .94 },
  snark: { a: '#cba2f4', b: '#8250c8', ink: '#25104a', sx: 1, sy: 1 },
  boss:  { a: '#ff8250', b: '#c4301c', ink: '#3a0a06', sx: 1, sy: 1 },

function body(c, kind, r) {
  c.beginPath();
  if (kind === 'snark') { c.save(); c.rotate(0.2); c.roundRect(-r * .92, -r * .92, r * 1.84, r * 1.84, r * .62); c.restore(); }

// o.hit 0..1 flash, o.look the angle to the heart, o.t a clock for the weather, o.v a face variant, o.bite 0..1 lunge

  g.addColorStop(0, sp.a); g.addColorStop(1, sp.b);
  body(c, kind, r); c.fillStyle = g; c.fill();
  c.lineWidth = r * 0.17; c.strokeStyle = INK; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.ellipse(-r * 0.45, -r * 0.62, r * 0.24, r * 0.1, -0.7, 0, 7); c.fill();
  c.strokeStyle = sp.ink; c.fillStyle = sp.ink; c.lineCap = 'round'; c.lineJoin = 'round';
  const lw = r * 0.15; c.lineWidth = lw;

    if (p.kind === 'flash') { g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = `rgba(255,214,140,${k * .85})`; g.beginPath(); g.arc(px, py, p.size * unit * (.5 + (1 - k) * .9), 0, 7); g.fill(); g.restore(); }
    else if (p.kind === 'ring') { g.strokeStyle = `rgba(255,236,190,${k})`; g.lineWidth = 3 * k + 1; g.beginPath(); g.arc(px, py, (p.size + (1 - k) * 2.2) * unit, 0, 7); g.stroke(); }
    else if (p.kind === 'shard') { g.globalAlpha = Math.min(1, k * 1.6); g.fillStyle = p.col; g.beginPath(); g.arc(px, py, p.size * unit, 0, 7); g.fill(); g.lineWidth = 1.5; g.strokeStyle = INK; g.stroke(); g.globalAlpha = 1; }
    else { g.fillStyle = p.col; g.globalAlpha = Math.min(1, k * 2); g.beginPath(); g.arc(px, py, p.size * unit * (.5 + k * .5), 0, 7); g.fill(); g.globalAlpha = 1; }
  }

  // the heart
  const hpT = clamp(S.hp / st.maxHp, 0, 1);
  const t = V.beatT, bump = (c0, wd, a) => a * Math.exp(-Math.pow((t - c0) / wd, 2));
  let beat = 1 + bump(.07, .05, .18) + bump(.30, .05, .08);
  if (S.auto && mode === 'play' && S.pause <= 0 && S.beatIn < .12 && t > .4) beat -= .03 * (1 - S.beatIn / .12);
  const sx = beat * (1 + .14 * V.sq), sy = beat * (1 - .12 * V.sq);
  if (V.seamN !== S.seams) { V.seams = seamPaths(S.seams); V.seamN = S.seams; }
  let hs = 1; if (V.mendT >= 0) hs += .18 * Math.exp(-V.mendT * 5) * Math.cos(V.mendT * 18);
  drawHeart(g, cx, cy, R * hs, { sx: sx * (mode === 'title' && !started ? 1 + .02 * Math.sin(V.t * 2) : 1), sy, glow: clamp(1 - t * 2.5, 0, 1), hp: V.hpShown, seams: V.seams, phase: V.t * 4, crack: V.crack });
  for (const e of order) if (e.y >= 0.3) drawEnemy(e);
  if (hud.hint) { const q = (V.t * 1.3) % 1; g.strokeStyle = `rgba(255,217,138,${.85 * (1 - q)})`; g.lineWidth = 4 * (1 - q) + 1; g.beginPath(); g.arc(cx, cy, R * (1.25 + q * .9), 0, 7); g.stroke(); }
  if (V.ringT >= 0) { const q = V.ringT / .5; if (q < 1) { g.strokeStyle = `rgba(255,217,138,${1 - q})`; g.lineWidth = 5 * (1 - q) + 1; g.beginPath(); g.arc(cx, cy, R * (1.2 + q * 1.6), 0, 7); g.stroke(); } }

  // the tally of love above the heart (hidden while a banner is up, so they never overprint)
  g.textAlign = 'center'; g.lineJoin = 'round';
  for (const p of V.pops) {
    if (V.t < V.bannerUntil && p.tally) continue;
    const q = p.t / p.life, a = q < .15 ? q / .15 : 1 - Math.max(0, (q - .55) / .45);
    const sz = unit * (0.95 * p.size) * (q < .15 ? 0.7 + q * 2 : 1);
    g.save(); g.globalAlpha = clamp(a, 0, 1); g.font = `700 ${sz}px "Horde Display",Georgia,serif`; g.lineWidth = sz * .24; g.strokeStyle = INK;
    const px = w2x(p.x), py = w2y(p.y) - ease(q) * unit * 1.2; g.strokeText(p.text, px, py); g.fillStyle = p.col; g.fillText(p.text, px, py); g.restore();
  }
  g.restore();

  // a marker for a boss still off the screen, so it never arrives unannounced
  const bo = C.boss(S);
  if (bo) {
    const bx = w2x(bo.x), by = w2y(bo.y), r = bo.r * unit;
    if (bx < -r || bx > w + r || by < fieldTop - r || by > fieldBot + r) {
      const ang = Math.atan2(by - cy, bx - cx), ex = clamp(bx, 34, w - 34), ey = clamp(by, fieldTop + 34, fieldBot - 40), pulse = 0.88 + 0.12 * Math.sin(V.t * 9);
      g.save(); g.translate(ex, ey); g.rotate(ang); g.scale(pulse * 1.15, pulse * 1.15); g.globalAlpha = 1; g.fillStyle = '#ff6a4a'; g.strokeStyle = INK; g.lineWidth = 4; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(30, 0); g.lineTo(-16, -26); g.lineTo(-16, 26); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = INK; g.font = '700 26px "Horde Display",Georgia,serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.rotate(-ang); g.fillText('!', -2, 2); g.restore();
    }
  }

  // light and weather over the world
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(overlayCv, 0, 0); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const low = clamp(1 - hpT / .35, 0, 1) * (S.hp > 0 ? 1 : 0), hurt = Math.max(V.hurt * .5, low * (.35 + .25 * Math.sin(V.t * 7)));
  if (hurt > 0.02 && (!reduce || low > 0)) { const rg = g.createRadialGradient(cx, cy, Math.min(w, h) * .3, cx, cy, Math.max(w, h) * .75); rg.addColorStop(0, 'rgba(229,35,63,0)'); rg.addColorStop(1, `rgba(229,35,63,${Math.min(.55, hurt * .8)})`); g.fillStyle = rg; g.fillRect(0, 0, w, h); }
  if (V.warn > 0.01) { const wg = g.createRadialGradient(cx, cy, Math.min(w, h) * .25, cx, cy, Math.max(w, h) * .7); wg.addColorStop(0, 'rgba(255,90,50,0)'); wg.addColorStop(1, `rgba(255,90,50,${.55 * V.warn * (.6 + .4 * Math.sin(V.t * 14))})`); g.fillStyle = wg; g.fillRect(0, 0, w, h); }
  if (V.flashW > 0.01) { g.fillStyle = `rgba(255,255,255,${V.flashW * (reduce ? .25 : .55)})`; g.fillRect(0, 0, w, h); }
  if (V.flashG > 0.01) { g.fillStyle = `rgba(255,217,138,${V.flashG * (reduce ? .2 : .5)})`; g.fillRect(0, 0, w, h); }
}

// ------------------------------------------------------------------ per-frame visuals and HUD
function updateVisuals(dt) {
  V.t += dt; V.beatT += dt;
  // squeeze spring: pushed in, rebounds, settles
  V.sqv += (-170 * V.sq - 15 * V.sqv) * dt; V.sq += V.sqv * dt; V.sq = clamp(V.sq, -.5, 1.2);
  V.shake = Math.max(0, V.shake - dt * 2.4); V.flashW = Math.max(0, V.flashW - dt * 2.2); V.flashG = Math.max(0, V.flashG - dt * 1.6);
  V.hurt = Math.max(0, V.hurt - dt * 2.2); V.warn = Math.max(0, V.warn - dt * .5); V.loveBump = Math.max(0, V.loveBump - dt * 6);
  if (V.ringT >= 0) { V.ringT += dt; if (V.ringT > .5) V.ringT = -1; }
  if (V.mendT >= 0) { V.mendT += dt; if (V.mendT > 1.4) V.mendT = -1; }
  if (V.breakT >= 0) { V.breakT += dt; V.crack = V.breakT < 2.2 ? 1 : Math.max(0, 1 - (V.breakT - 2.2) / .6); if (V.breakT > 3) { V.breakT = -1; V.crack = 0; } }
  for (const gh of V.ghosts) gh.t += dt; V.ghosts = V.ghosts.filter(x => x.t < .7);
  for (const d of V.dying) d.t += dt; V.dying = V.dying.filter(x => x.t < .2);
  for (let i = V.parts.length - 1; i >= 0; i--) { const p = V.parts[i]; p.life -= dt; if (p.life <= 0) { V.parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-3 * dt); p.vy *= Math.exp(-3 * dt); }
  for (let i = V.pops.length - 1; i >= 0; i--) { V.pops[i].t += dt; if (V.pops[i].t > V.pops[i].life) V.pops.splice(i, 1); }
  // one number above the heart: it grows while love keeps landing, then floats away
  V.popT += dt;
  if (V.popAcc > 0 && V.popT > .12) {
    const last = V.pops[V.pops.length - 1];
    if (last && last.tally && last.t < .6) { last.sum += V.popAcc; last.text = '+' + C.fmt(last.sum); last.t = Math.min(last.t, .2); }
    else { floatText('+' + C.fmt(V.popAcc), 0, -R / unit * 1.55, GOLD, 1, 1.0); const n = V.pops[V.pops.length - 1]; n.tally = true; n.sum = V.popAcc; }
    V.popAcc = 0; V.popN = 0; V.popT = 0;
  }
  // the blood drains fast and refills slowly
  const hpT = clamp(S.hp / C.stats(S).maxHp, 0, 1); V.hpShown += (hpT - V.hpShown) * (1 - Math.exp(-dt * (hpT > V.hpShown ? 2.6 : 10)));
}

const hud = {};
function updateHud(dt) {
  // the counter runs up to the real number instead of jumping
  V.loveShown += (S.love - V.loveShown) * (1 - Math.exp(-dt * 9)); if (Math.abs(S.love - V.loveShown) < 0.6) V.loveShown = S.love;
  const lt = C.fmt(Math.floor(V.loveShown)); if (hud.love !== lt) { $('love').textContent = lt; hud.love = lt; }
  $('love').parentNode.style.transform = V.loveBump > 0 ? `scale(${1 + V.loveBump * .06})` : '';
  V.rate += (S.rate - V.rate) * (1 - Math.exp(-dt * 2)); const rt = V.rate >= 1 ? '+' + C.fmt(Math.round(V.rate)) + ' a second' : ''; if (hud.rate !== rt) { $('rate').textContent = rt; hud.rate = rt; }
  const left = C.left(S); if (hud.left !== left) { $('wleft').textContent = S.waveTotal ? left + ' left' : ''; hud.left = left; }
  if (hud.wave !== S.wave) { $('wnum').textContent = S.wave; hud.wave = S.wave; }
  const boss = C.boss(S); let target = S.waveTotal ? S.waveDone / S.waveTotal : 1; if (S.spec && S.spec.boss && boss) target = 1 - boss.hp / boss.max;
  V.wbar += (target - V.wbar) * (1 - Math.exp(-dt * 8)); const bq = Math.round(V.wbar * 400) / 400; if (hud.bar !== bq) { $('wbar').style.transform = `scaleX(${bq})`; hud.bar = bq; }
  for (const id of ORDER) updateCard(id);
  updateDots();
  const gain = C.mendGain(S), mo = $('mend'), showMend = gain > 0 && mode !== 'title';
  if (showMend === mo.hidden) mo.hidden = !showMend;
  if (gain > 0 && hud.gain !== gain) { $('mendtxt').textContent = `Mend · +${gain} seam${gain > 1 ? 's' : ''}`; hud.gain = gain; }
  document.body.classList.toggle('lowhp', S.hp / C.stats(S).maxHp < .35 && S.auto);
  // the first prompt: one tap makes the heart beat
  const wantHint = mode === 'play' && !S.auto && S.taps === 0 && S.t > 0.3;
  if (hud.hint !== wantHint) { $('hint').classList.toggle('show', wantHint); hud.hint = wantHint; }
  const shop = $('shop'); if (!shop.classList.contains('open') && Object.values(S.seen).some(Boolean)) shop.classList.add('open');
}

// ------------------------------------------------------------------ the loop
let last = 0, acc = 0, frozen = false;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts;
  if (!frozen) tick(dt, ts);
}
function tick(dt, ts) {
  layout();
  if (mode === 'play') {
    let slow = 1; if (V.hitstop > 0) { V.hitstop -= dt; slow = 0.15; }
    acc += dt * slow; let n = 0;
    while (acc >= STEP && n < 6) { C.step(S, STEP); drain(); acc -= STEP; n++; }
    if (n >= 6) acc = 0;
    if (ts - lastSave > 5000) { lastSave = ts; save(); }
  }
  updateVisuals(dt); updateHud(dt); render();
}

// ------------------------------------------------------------------ away and return
function away(secs) {
  awaySecs = secs;
  return Math.floor(S.rate * Math.min(secs, T.offlineMax) * T.offlineShare);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); }
  else if (hiddenAt && started && mode !== 'title') {
    const secs = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; acc = 0;
    if (secs > 60) { const gain = away(secs); openVeil(true, secs, gain); }
  }
});
addEventListener('pagehide', save);

// ------------------------------------------------------------------ start
function boot() {
  const o = load();
  if (o) {
    S = C.fromSave(o.state); if (o.prefs && typeof o.prefs === 'object') { prefs.sound = o.prefs.sound !== false; prefs.haptics = o.prefs.haptics !== false; }
    if (Object.values(S.seen).some(Boolean)) $('shop').classList.add('open');
    V.loveShown = S.love; V.hpShown = 1;
    const secs = o.savedAt && isFinite(o.savedAt) ? Math.max(0, (Date.now() - o.savedAt) / 1000) : 0;
    const gain = secs > 60 ? away(secs) : 0;
    layout(); openVeil(true, secs, gain);
  } else {
    // the page this one replaced was a roguelike with stages: whoever got somewhere there keeps a gold seam for each world they opened
    let old = null; try { old = C.fromLegacy(JSON.parse(localStorage.getItem('emojiHorde'))); } catch (e) { }
    layout();
    if (old) {
      S.seams = old.seams; S.kills = old.kills; V.seamN = -1; save();
      openVeil(true, 0, 0);
      $('vh1').textContent = 'Welcome back';
      $('vsub').textContent = old.seams ? `Your old nights left ${old.seams} gold seam${old.seams > 1 ? 's' : ''} on this heart.` : 'This heart remembers you.';
      $('vgo').textContent = 'Begin';
    } else openVeil(false);
  }
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load('700 20px "Horde Display"'), document.fonts.load('600 16px "Horde Text"')]).catch(() => { }) : Promise.resolve()).then(boot);

// a handle for the tests that drive the page (and a way to film it: time can be advanced by hand)
window.__horde = { get S() { return S; }, C, V, handle, drain, get mode() { return mode; }, squeeze, buyCard, save, load, freeze(on) { frozen = !!on; }, advance(secs) { let n = Math.round(secs / STEP); const d = secs / Math.max(1, n); while (n-- > 0) tick(d, performance.now()); } };
})();
</script>
