<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1a1f">
<title>FreeCell</title>
<meta name="description" content="FreeCell with every deal winnable, a daily deal, tap-to-move, unlimited undo and a hint that knows the way out. The classic numbered deals, set on a dark card-room table.">
<style>
:root{
  --table:#0b1a1f; --table2:#12303a; --ivory:#f4ebd7; --ivory2:#e6dac0; --ink:#16222a; --red:#c9321f; --brass:#e0a93f; --brass2:#f5d78b;

  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--table);color:var(--ivory);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(120% 90% at 50% 20%,var(--table2) 0%,var(--table) 62%,#07120f 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0;height:44px;font-family:var(--serif);color:var(--muted)}
header .no{font-size:18px;letter-spacing:.04em;color:var(--ivory);font-style:italic;font-variant-numeric:lining-nums tabular-nums}
header .no b{font-style:normal;font-weight:400;color:var(--brass);letter-spacing:.14em;font-size:11px;text-transform:uppercase;margin-right:8px;font-family:var(--sans)}
header .stat{font-size:16px;color:#b9c9cd;font-variant-numeric:lining-nums tabular-nums;letter-spacing:.04em}
header .stat i{font-style:normal;color:var(--ivory)}
#stage{position:relative;flex:1;min-height:0}
.slot{position:absolute;width:var(--w);height:var(--h);border-radius:calc(var(--w)*.11);transition:box-shadow .25s var(--ease),background .25s var(--ease),transform .25s var(--ease)}
.slot.cell{background:rgba(0,0,0,.3);box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07)}
.slot.col{box-shadow:inset 0 0 0 1px rgba(244,235,215,.08)}
.slot.fnd{background:rgba(224,169,63,.07);box-shadow:inset 0 0 0 1.5px rgba(224,169,63,.55)}
.tray{position:absolute;border-radius:14px;background:linear-gradient(180deg,rgba(224,169,63,.13),rgba(224,169,63,.04));box-shadow:0 0 0 1px rgba(224,169,63,.3)}
.tray i{position:absolute;left:0;right:0;bottom:calc(100% + 3px);text-align:center;font:600 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(224,169,63,.7)}
.slot.fnd svg{position:absolute;left:50%;top:50%;width:46%;height:auto;transform:translate(-50%,-50%);fill:var(--brass);opacity:.4}
.slot.fnd.red svg{opacity:.4}
.slot.glow{box-shadow:0 0 0 2px var(--brass),0 0 22px rgba(224,169,63,.55);background:rgba(224,169,63,.12)}
.slot.pulse{animation:pulse .7s var(--ease)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,215,139,.9)}100%{box-shadow:0 0 0 22px rgba(245,215,139,0)}}
.card{position:absolute;left:0;top:0;width:var(--w);height:var(--h);border-radius:calc(var(--w)*.11);background:linear-gradient(165deg,#fbf4e2,var(--ivory) 45%,var(--ivory2));
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 0 0 1px rgba(22,34,42,.28),0 1px 3px rgba(0,0,0,.55);color:var(--ink);will-change:transform;
  transition:transform .34s var(--ease),box-shadow .2s var(--ease);touch-action:none;cursor:pointer;font-family:var(--serif)}
.card.red{color:var(--red)}
.card::after{content:'';position:absolute;inset:calc(var(--w)*.035);border-radius:calc(var(--w)*.08);box-shadow:inset 0 0 0 1px rgba(22,34,42,.07);pointer-events:none}
.card .ix{position:absolute;left:calc(var(--w)*.09);top:calc(var(--w)*.04);display:flex;align-items:center;gap:calc(var(--w)*.03);line-height:1;font-size:calc(var(--w)*.34);font-weight:700;font-variant-numeric:lining-nums;letter-spacing:-.04em;pointer-events:none}
.card .ix svg{width:calc(var(--w)*.25);height:calc(var(--w)*.25);fill:currentColor}
.card .big{position:absolute;right:calc(var(--w)*.1);bottom:calc(var(--w)*.1);width:calc(var(--w)*.5);height:calc(var(--w)*.5);fill:currentColor;pointer-events:none}
.card .face{position:absolute;left:calc(var(--w)*.12);bottom:calc(var(--w)*.04);font-size:calc(var(--w)*.62);line-height:1;font-style:italic;opacity:.16;pointer-events:none;font-weight:700}
.card.home{box-shadow:0 0 0 2px var(--brass),0 1px 3px rgba(0,0,0,.55)}
.card.moving{transition:none}
.card.lift{box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 0 0 1px rgba(22,34,42,.28),0 14px 24px rgba(0,0,0,.55);z-index:900}
.card.sel{box-shadow:0 0 0 2.5px var(--brass),0 8px 20px rgba(0,0,0,.5),0 0 18px rgba(224,169,63,.6)}
.card.fly{z-index:800}
.card.shake{animation:shake .32s var(--ease)}
@keyframes shake{0%,100%{translate:0}20%{translate:-5px}45%{translate:5px}70%{translate:-3px}}
.card.hintc{animation:hint .9s ease-in-out 2}
@keyframes hint{50%{box-shadow:0 0 0 3px var(--brass2),0 0 24px rgba(245,215,139,.8)}}
.card.dealing{opacity:0}
nav{flex:none;display:flex;justify-content:center;gap:10px;padding:8px 16px 12px}
nav button{flex:1;max-width:170px;height:52px;border-radius:14px;border:1px solid rgba(244,235,215,.14);background:rgba(244,235,215,.05);color:var(--ivory);font:600 13px var(--sans);letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s var(--ease),background .2s;touch-action:manipulation}
#bHint{background:var(--brass);border-color:var(--brass);color:#1b1405}
nav button:active{transform:scale(.95);background:rgba(244,235,215,.12)}
nav button:disabled{opacity:.35}
nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,-8px);padding:8px 16px;border-radius:99px;background:rgba(7,18,15,.86);border:1px solid rgba(224,169,63,.4);font:italic 15px var(--serif);color:var(--brass2);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:2000;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#veil{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(3,10,9,.62);z-index:3000;opacity:0;transition:opacity .3s}
#veil.on{display:flex}#veil.show{opacity:1}
.sheet{width:min(460px,100%);max-height:92%;overflow:auto;background:linear-gradient(180deg,#14303a,#0e232b);border:1px solid rgba(224,169,63,.28);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .4s var(--ease);touch-action:pan-y}
#veil.show .sheet{transform:none}
@media(min-width:620px){#veil{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid rgba(224,169,63,.28)}}
.sheet h2{margin:0 0 4px;font:italic 400 30px var(--serif);color:var(--ivory)}
.sheet .sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;margin:0 0 10px;border-radius:14px;border:1px solid rgba(244,235,215,.16);background:rgba(244,235,215,.06);color:var(--ivory);font:600 15px var(--sans);cursor:pointer;text-align:left;transition:transform .15s var(--ease),background .2s;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--brass);border-color:var(--brass);color:#1b1405}
.btn small{display:block;font-weight:400;opacity:.75;font-size:12.5px;margin-top:2px}
.btn .r{font:italic 400 20px var(--serif)}
.row{display:flex;gap:10px}.row .btn{margin-bottom:10px}
.nums{display:flex;gap:18px;margin:6px 0 18px}
.nums div{flex:1}.nums b{display:block;font:italic 400 34px var(--serif);color:var(--brass2);font-variant-numeric:lining-nums tabular-nums}.nums span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.deal-in{display:flex;gap:8px;margin:4px 0 10px}.deal-in input{flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:1px solid rgba(244,235,215,.2);background:rgba(0,0,0,.25);color:var(--ivory);font:italic 20px var(--serif);user-select:text;-webkit-user-select:text;touch-action:manipulation}
.deal-in .btn{width:auto;margin:0}
.msg{min-height:18px;font-size:12.5px;color:var(--brass2);margin:0 0 10px}
#cv{position:fixed;inset:0;pointer-events:none;z-index:2500}
@media(prefers-reduced-motion:reduce){.card,.slot,#toast,.sheet,#veil{transition-duration:.01s!important}.card.hintc,.slot.pulse{animation:none}.card.hintc{box-shadow:0 0 0 3px var(--brass2)}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="s2" viewBox="0 0 100 100"><path d="M50 94C46 90 6 62 6 32 6 15 18 5 31 5c9 0 16 5 19 13 3-8 10-13 19-13 13 0 25 10 25 27 0 30-40 58-44 62z"/></symbol>
  <symbol id="s3" viewBox="0 0 100 100"><path d="M50 3C46 12 8 38 8 62c0 14 10 22 21 22 8 0 14-3 18-9-1 9-4 15-11 20h28c-7-5-10-11-11-20 4 6 10 9 18 9 11 0 21-8 21-22C92 38 54 12 50 3z"/></symbol>
</svg>
<div id="app">
  <header><span class="no" id="no"></span><span class="stat" id="stat"></span></header>
  <div id="stage"><div id="toast"></div></div>
  <nav>
    <button id="bMenu" aria-label="Deals and stats"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12h6M12 9v6"/></svg><span>New</span></button>
    <button id="bUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span></button>
    <button id="bHint" aria-label="Hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.500 1 2.500h6c0-1 .2-1.700 1-2.500A6 6 0 0 0 12 3z"/></svg><span>Hint</span></button>
  </nav>
</div>
<div id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<canvas id="cv"></canvas>
<script id="core">
// ---- FreeCell core: DOM-free. Cards are 0..51: rank = c >> 2 (0 = ace .. 12 = king), suit = c & 3 (clubs, diamonds, hearts, spades).
const FC = (() => {
  const SUITS = 'CDHS', RANKS = 'A23456789TJQK';
  const rank = c => c >> 2, suit = c => c & 3, red = c => (c & 3) === 1 || (c & 3) === 2;
  const name = c => RANKS[c >> 2] + SUITS[c & 3];
  const UNSOLVABLE = 11982;                      // the one Microsoft deal that cannot be won
  const MAXDEAL = 32000;

  // The numbered deals of the old Microsoft game: same LCG, same shuffle, so deal #1 is the deal everyone knows.
  function deal(n) {
    let seed = n >>> 0;
    const deck = Array.from({length: 52}, (_, i) => i), cols = Array.from({length: 8}, () => []);
    let left = 52;
    for (let i = 0; i < 52; i++) {
      seed = (Math.imul(seed, 214013) + 2531011) >>> 0;
      const j = ((seed >>> 16) & 0x7fff) % left;
      cols[i % 8].push(deck[j]);
      deck[j] = deck[--left];
    }
    return {cells: [-1, -1, -1, -1], found: [0, 0, 0, 0], cols};
  }
  const clone = s => ({cells: s.cells.slice(), found: s.found.slice(), cols: s.cols.map(c => c.slice())});
  const won = s => s.found[0] + s.found[1] + s.found[2] + s.found[3] === 52;
  const freeCells = s => s.cells.filter(c => c < 0).length;
  const emptyCols = s => s.cols.filter(c => !c.length).length;
  const fits = (onto, c) => rank(onto) === rank(c) + 1 && red(onto) !== red(c);

  // How many cards one move may carry: (free cells + 1) * 2^(empty columns), not counting the column it lands in.
  const capacity = (s, toEmpty) => (freeCells(s) + 1) * (1 << (emptyCols(s) - (toEmpty ? 1 : 0)));
  // Start index of the run of correctly stacked cards at the bottom of column i.
  function runStart(col) {
    let k = col.length - 1;
    while (k > 0 && fits(col[k - 1], col[k])) k--;
    return k;
  }
  const canHome = (s, c) => s.found[suit(c)] === rank(c);

  // A card is safe to send home on its own when nothing still on the table could need to sit on it.
  function safe(s, c) {
    if (!canHome(s, c)) return false;
    const r = rank(c);
    if (r <= 1) return true;
    const o = red(c) ? [0, 3] : [1, 2];
    return Math.min(s.found[o[0]], s.found[o[1]]) >= r;
  }

  // A move: {from: {t:'col'|'cell', i}, n, to: {t:'col'|'cell'|'found', i}}. Returns the new state or null if illegal.
  function apply(s, m) {
    const f = m.from, t = m.to, n = m.n || 1;
    let cards;
    if (f.t === 'cell') { if (n !== 1 || s.cells[f.i] < 0) return null; cards = [s.cells[f.i]]; }
    else {
      const col = s.cols[f.i];
      if (!col || n < 1 || n > col.length) return null;
      cards = col.slice(col.length - n);
      for (let k = 1; k < n; k++) if (!fits(cards[k - 1], cards[k])) return null;
    }
    const top = cards[0];
    if (t.t === 'found') { if (n !== 1 || !canHome(s, top) || t.i !== suit(top)) return null; }
    else if (t.t === 'cell') { if (n !== 1 || f.t === 'cell' || s.cells[t.i] >= 0) return null; }
    else {
      if (f.t === 'col' && f.i === t.i) return null;
      const dst = s.cols[t.i];
      if (!dst) return null;
      if (dst.length ? !fits(dst[dst.length - 1], top) : false) return null;
      if (n > capacity(s, !dst.length)) return null;
    }
    const r = clone(s);
    if (f.t === 'cell') r.cells[f.i] = -1; else r.cols[f.i].length -= n;
    if (t.t === 'found') r.found[t.i]++; else if (t.t === 'cell') r.cells[t.i] = top; else r.cols[t.i].push(...cards);
    return r;
  }

  // Everything that can legally be done from here, one card or a whole run (the page's tap and the hint use the longest run).
  function moves(s) {
    const out = [];
    const srcs = [];
    for (let i = 0; i < 8; i++) {
      const col = s.cols[i];
      if (!col.length) continue;
      const rs = runStart(col);
      for (let k = rs; k < col.length; k++) srcs.push({from: {t: 'col', i}, n: col.length - k});
    }
    for (let i = 0; i < 4; i++) if (s.cells[i] >= 0) srcs.push({from: {t: 'cell', i}, n: 1});
    const firstCell = s.cells.indexOf(-1);
    for (const sc of srcs) {
      const top = sc.from.t === 'cell' ? s.cells[sc.from.i] : s.cols[sc.from.i][s.cols[sc.from.i].length - sc.n];
      if (sc.n === 1 && canHome(s, top)) out.push({...sc, to: {t: 'found', i: suit(top)}});
      let emptyDone = false;
      for (let j = 0; j < 8; j++) {
        if (sc.from.t === 'col' && sc.from.i === j) continue;
        const dst = s.cols[j];
        if (dst.length) { if (fits(dst[dst.length - 1], top) && sc.n <= capacity(s, false)) out.push({...sc, to: {t: 'col', i: j}}); }
        else if (!emptyDone && sc.n <= capacity(s, true) && !(sc.from.t === 'col' && sc.n === s.cols[sc.from.i].length)) { out.push({...sc, to: {t: 'col', i: j}}); emptyDone = true; }
      }
      if (sc.n === 1 && sc.from.t === 'col' && firstCell >= 0) out.push({...sc, to: {t: 'cell', i: firstCell}});
    }
    return out;
  }

  // After a move the table sends every safe card home by itself; returns the chain of those moves.
  function autoChain(s) {
    const chain = [];
    let cur = s, again = true;
    while (again) {
      again = false;
      for (let i = 0; i < 12 && !again; i++) {
        const c = i < 4 ? cur.cells[i] : cur.cols[i - 4][cur.cols[i - 4].length - 1];
        if (c === undefined || c < 0 || !safe(cur, c)) continue;
        const m = {from: i < 4 ? {t: 'cell', i} : {t: 'col', i: i - 4}, n: 1, to: {t: 'found', i: suit(c)}};
        cur = apply(cur, m); chain.push(m); again = true;
      }
    }
    return {state: cur, chain};
  }

  // What a tap on a card should do. src = {t:'col', i, k} (k = index in the column) or {t:'cell', i}.
  // Returns {kind:'none'} | {kind:'go', move} | {kind:'choose', moves} (the page lets the player pick the target).
  function tap(s, src) {
    let from, n;
    if (src.t === 'cell') { from = src; n = 1; }
    else {
      const col = s.cols[src.i];
      n = col.length - src.k;
      if (src.k < runStart(col)) return {kind: 'none'};
      from = {t: 'col', i: src.i};
    }
    const mine = moves(s).filter(m => m.from.t === from.t && m.from.i === from.i && m.n === n);
    const home = mine.find(m => m.to.t === 'found');
    if (home) return {kind: 'go', move: home};
    const stacks = mine.filter(m => m.to.t === 'col' && s.cols[m.to.i].length);
    const empties = mine.filter(m => m.to.t === 'col' && !s.cols[m.to.i].length);
    const cell = mine.find(m => m.to.t === 'cell');
    if (stacks.length === 1) return {kind: 'go', move: stacks[0]};
    if (stacks.length > 1) return {kind: 'choose', moves: stacks.concat(cell ? [cell] : [])};
    if (empties.length && cell) return {kind: 'choose', moves: empties.concat([cell])};
    if (empties.length) return {kind: 'go', move: empties[0]};
    if (cell) return {kind: 'choose', moves: [cell]};   // parking in a cell is never an accident: the cell lights up and waits for a second tap
    return {kind: 'none'};
  }

  // ---- the solver: best-first over single-card moves, safe cards sent home for free. Used for hints.
  const key = s => s.cols.map(c => String.fromCharCode(...c)).sort().join('|') + '#' + s.cells.slice().sort().join(',') + '#' + s.found.join('');
  function heur(s) {
    let h = (52 - (s.found[0] + s.found[1] + s.found[2] + s.found[3])) * 3;
    for (let su = 0; su < 4; su++) {
      if (s.found[su] > 12) continue;
      const want = s.found[su] * 4 + su;
      if (s.cells.includes(want)) { h += 1; continue; }
      for (const col of s.cols) {
        const at = col.indexOf(want);
        if (at >= 0) { h += (col.length - 1 - at) * 2; break; }
      }
    }
    for (const col of s.cols) for (let k = 1; k < col.length; k++) if (rank(col[k]) > rank(col[k - 1])) h += 1; // a bigger card on a smaller one must move
    h += (4 - freeCells(s)) * 0.8 - emptyCols(s) * 1.2;
    return h;
  }
  function solve(start, budget = 150000) {
    const heap = [], seen = new Map();
    const push = n => { heap.push(n); let i = heap.length - 1; while (i) { const p = (i - 1) >> 1; if (heap[p].f <= heap[i].f) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { let l = 2 * i + 1, r = l + 1, m = i; if (l < heap.length && heap[l].f < heap[m].f) m = l; if (r < heap.length && heap[r].f < heap[m].f) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
    const a0 = autoChain(start);
    push({s: a0.state, g: 0, f: heur(a0.state), path: a0.chain, parent: null});
    seen.set(key(a0.state), 0);
    let nodes = 0;
    while (heap.length && nodes < budget) {
      const n = pop(); nodes++;
      if (won(n.s)) return flat(n);
      for (const m of moves(n.s)) {
        if (m.n > 1) continue;
        const ns = apply(n.s, m);
        const ac = autoChain(ns);
        const k = key(ac.state), g = n.g + 1;
        if (seen.has(k) && seen.get(k) <= g) continue;
        seen.set(k, g);
        push({s: ac.state, g, f: g * 0.35 + heur(ac.state), path: [m, ...ac.chain], parent: n});
      }
    }
    return null;
  }
  function flat(n) { const out = []; for (; n; n = n.parent) out.unshift(...n.path); return out; }

// ---- small things
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1900); }
addEventListener('keydown', e => {
  if ($('#veil').classList.contains('on')) { if (e.key === 'Escape') closeSheet(); return; }
  if (((e.ctrlKey || e.metaKey) && e.key === 'z') || e.key === 'u') { e.preventDefault(); undo(); }
  else if (e.key === 'h') hint();
  else if (e.key === 'n') openMenu();
});
$('#bUndo').onclick = undo; $('#bHint').onclick = hint; $('#bMenu').onclick = () => openMenu();

// ---- sheets
let sheetFocus = null;
function openSheet(html) {
  const v = $('#veil'); $('#sheet').innerHTML = html; v.classList.add('on'); sheetFocus = document.activeElement;
  requestAnimationFrame(() => { v.classList.add('show'); const b = $('#sheet').querySelector('.btn.main') || $('#sheet button'); b && b.focus({preventScroll: true}); });
}
function closeSheet(now) {
  const v = $('#veil'); v.classList.remove('show'); if (now) v.classList.remove('on'); else setTimeout(() => { if (!v.classList.contains('show')) v.classList.remove('on'); }, 320);
}
$('#veil').addEventListener('pointerdown', e => { if (e.target.id === 'veil' && !(G && G.won && !G.shown)) closeSheet(); });
function stats() {
  const pct = store.played ? Math.round(100 * store.won / store.played) : 0;
  return `<div class="nums"><div><b>${store.won}</b><span>Won${store.played ? ' · ' + pct + '%' : ''}</span></div><div><b>${store.streak}</b><span>Daily streak</span></div><div><b>${store.best ? fmt(store.best) : '–'}</b><span>Best time</span></div></div>`;
}
function openMenu() {
  const tn = todayNo(), done = store.doneDays[dayKey()];
  openSheet(`<h2>Deals</h2><p class="sub">Every deal can be won.</p>${stats()}
    <button class="btn main" data-a="daily"><span>Today’s deal<small>${done ? 'Cleared in ' + fmt(done) : 'Same cards for everyone today'}</small></span><span class="r">No.&#8201;${tn}${done ? ' ✓' : ''}</span></button>
    <button class="btn" data-a="random"><span>Random deal<small>A new one you haven’t met</small></span></button>
    <button class="btn" data-a="again"><span>Start this deal again<small>No. ${G.n}</small></span></button>
    <div class="deal-in"><input id="dn" inputmode="numeric" placeholder="Deal 1–32000" aria-label="Deal number"><button class="btn" data-a="go">Play</button></div>
    <p class="msg" id="msg"></p>
    <button class="btn" data-a="sound"><span>Sound</span><span class="r">${store.sound ? 'On' : 'Off'}</span></button>
    <button class="btn" data-a="close">Back to the table</button>`);
}
$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'daily') startGame(todayNo(), true);
  else if (a === 'random') startGame(randomDeal(), false);
  else if (a === 'again') startGame(G.n, G.daily);
  else if (a === 'close') closeSheet();
  else if (a === 'sound') { store.sound = !store.sound; save(); openMenu(); }
  else if (a === 'go') { const n = parseInt($('#dn').value, 10); if (n === FC.UNSOLVABLE) $('#msg').textContent = 'No. 11982 is the one deal that cannot be won — it’s not offered here.'; else if (!FC.validDeal(n)) $('#msg').textContent = 'Pick a number from 1 to 32000.'; else startGame(n, n === todayNo() && false); }
  else if (a === 'next') startGame(randomDeal(), false);
});
$('#sheet').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'dn') { e.preventDefault(); $('#sheet [data-a=go]').click(); } });
function randomDeal() { let n; do { n = 1 + Math.floor(Math.random() * FC.MAXDEAL); } while (!FC.validDeal(n) || n === G.n); return n; }

// ---- winning
function win() {
  G.shown = false;
  store.played = (store.played || 0) + 0; // counted at the first move below
  const t = Math.round(G.el);
  store.won++; if (!store.best || t < store.best) store.best = t;
  let newBest = t === store.best && store.won > 1;
  if (G.daily && !store.doneDays[dayKey()]) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    store.streak = store.lastDaily === dayKey(y) ? store.streak + 1 : 1; store.longest = Math.max(store.longest || 0, store.streak);
    store.lastDaily = dayKey(); store.doneDays[dayKey()] = t;
    const keys = Object.keys(store.doneDays).sort(); while (keys.length > 40) delete store.doneDays[keys.shift()];
  }
  store.cur = null; save(); sfx.win();
  const show = () => { G.shown = true; openSheet(`<h2>Cleared.</h2><p class="sub">${G.daily ? 'Today’s deal, ' : 'Deal '}No.&#8201;${G.n}</p>
    <div class="nums"><div><b>${fmt(t)}</b><span>Time${newBest ? ' · best' : ''}</span></div><div><b>${G.mv.length}</b><span>Moves</span></div><div><b>${store.streak}</b><span>Daily streak</span></div></div>
    <button class="btn main" data-a="next"><span>Next deal</span><span class="r">→</span></button>
    <button class="btn" data-a="again"><span>Play this deal again</span></button>
    ${G.daily ? '<p class="sub" style="margin:6px 0 0">Come back tomorrow for the next daily deal.</p>' : '<button class="btn" data-a="daily"><span>Today’s deal</span><span class="r">No.&#8201;' + todayNo() + '</span></button>'}`); };
  if (reduce.matches) show(); else cascade(show);
}
// count a game as played at its first move
const _doMove = doMove;
doMove = function (m, s) { const first = !G.mv.length; const r = _doMove(m, s); if (r && first) { store.played++; save(); } return r; };

// ---- the cascade: every card thrown off its foundation, leaving trails
const cv = $('#cv'), cx = cv.getContext('2d');
function cvClear() { cx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; cancelAnimationFrame(cvRaf); }
let cvRaf = 0;
function suitPath(su) {
  const p = new Path2D();
  if (su === 0) { p.arc(50, 27, 20, 0, 7); p.moveTo(46, 60); p.arc(26, 60, 20, 0, 7); p.moveTo(94, 60); p.arc(74, 60, 20, 0, 7); p.moveTo(44, 55); p.lineTo(56, 55); p.lineTo(63, 95); p.lineTo(37, 95); }
  else p.addPath(new Path2D(document.querySelector('#s' + su + ' path').getAttribute('d')));
  return p;
}
function cascade(done) {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cv.style.display = 'block';
  const dpr = devicePixelRatio, sr = stage.getBoundingClientRect();
  const paths = [0, 1, 2, 3].map(suitPath);
  const w = L.w, h = L.h, parts = [];
  let i = 0, start = performance.now(), finished = false, skipAt = 0;
  const order = []; for (let r = 12; r >= 0; r--) for (let su = 0; su < 4; su++) order.push(r * 4 + su);
  const cards = order.map((c, k) => ({c, at: k * 105, x: sr.left + colX(4 + FC.suit(c)), y: sr.top + L.topY, vx: (Math.random() < .5 ? -1 : 1) * (2.2 + Math.random() * 4.5), vy: -(4 + Math.random() * 5), live: false, bounces: 0}));
  function draw(p) {
    cx.save(); cx.translate(p.x * dpr, p.y * dpr); cx.scale(dpr, dpr);
    cx.fillStyle = '#f4ebd7'; cx.strokeStyle = 'rgba(22,34,42,.45)'; cx.lineWidth = 1; rr(cx, 0, 0, w, h, w * .11); cx.fill(); cx.stroke();
    const su = FC.suit(p.c), r = FC.rank(p.c); cx.fillStyle = FC.red(p.c) ? '#c9321f' : '#16222a';
    cx.font = `700 ${w * .34}px "Bodoni 72","Bodoni MT",Didot,Georgia,serif`; cx.textBaseline = 'top'; cx.fillText(r === 9 ? '10' : FC.RANKS[r], w * .09, w * .06);
    cx.save(); cx.translate(w * .5, h * .42); cx.scale(w * .0048, w * .0048); cx.fill(paths[su]); cx.restore();
    cx.restore();
  }
  function frame(now) {
    const t = now - start;
    for (const p of cards) {
      if (!p.live && t >= p.at) { p.live = true; els[p.c].style.visibility = 'hidden'; }
      if (!p.live || p.off) continue;
      draw(p);
      p.x += p.vx; p.vy += 0.28; p.y += p.vy;
      const floor = innerHeight - h;
      if (p.y > floor) { p.y = floor; p.vy *= -0.82; p.bounces++; }
      if (p.x < -w || p.x > innerWidth) p.off = true;
    }
    if (!finished && (cards.every(p => p.off) || t > 7500 || skipAt)) { finished = true; setTimeout(() => { cvClear(); stage.querySelectorAll('.card').forEach(e => e.style.visibility = ''); done(); }, 250); }
    if (!finished) cvRaf = requestAnimationFrame(frame);
  }
  cv.style.pointerEvents = 'auto';
  cv.onpointerdown = () => { skipAt = 1; cv.style.pointerEvents = 'none'; };
  cvRaf = requestAnimationFrame(frame);
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ---- boot
function relayout() { layout(); buildSlots(); if (G) render(true); if (cv.style.display === 'block') { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; } }
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(relayout, 60); });
layout(); buildSlots(); buildCards();
const q = new URLSearchParams(location.search), qn = parseInt(q.get('deal'), 10);
if (FC.validDeal(qn)) startGame(qn, false);
else if (store.cur && store.cur.mv && FC.validDeal(store.cur.n)) { try { resume(store.cur); } catch (e) { startGame(todayNo(), true); } }
else startGame(todayNo(), true);
window.__fc = {get G() { return G; }, FC, doMove, undo, hint, startGame, store};

</script>
