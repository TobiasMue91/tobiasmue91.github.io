<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>We Asked 100 - Family Feud Online</title>
<meta name="description" content="We asked 100 strangers. Say what they said. A survey game for you against the Hendersons, or two teams on one phone, with a fresh board every day and new questions written by an AI.">
<meta name="theme-color" content="#0c1844">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230c1844'/><text x='50' y='72' font-size='58' font-weight='900' text-anchor='middle' fill='%23ffc83d' font-family='Impact,sans-serif'>100</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#050a1f;--navy:#0c1844;--gold:#ffc83d;--gold2:#ff9f1c;--cream:#fff3d0;--red:#ec2b3c;--a:#ff3d9a;--b:#2fd4ff;--tx:#eef2ff;--dim:#9fb0e8;--team:var(--a);
 --head:'Oswald','Arial Narrow','Haettenschweiler',Impact,sans-serif;--body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% 0%,#1a3585 0%,var(--navy) 50%,var(--ink) 100%) fixed;color:var(--tx);font-family:var(--body);overflow:hidden;-webkit-text-size-adjust:100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;box-shadow:inset 0 0 100px 0 color-mix(in srgb,var(--team) 34%,transparent);transition:box-shadow .45s ease}
body.on-title::after{box-shadow:inset 0 0 100px 0 #ff9f1c22}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;z-index:1;display:grid}
#game{display:block}
.app{height:100%;width:100%;max-width:1240px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));position:relative;display:grid;gap:8px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto}
/* plates */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px}
.team{--c:var(--a);display:flex;align-items:center;gap:6px;border-radius:12px;padding:5px 8px;background:#0a1233;border:2px solid color-mix(in srgb,var(--c) 38%,#0a1233);min-width:0;transition:background .35s,border-color .35s,box-shadow .35s,opacity .35s,transform .35s}
.team.b{--c:var(--b);flex-direction:row-reverse;text-align:right}
.team .crest{width:26px;height:30px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 45%,#0a1233);color:#0a1233;font:700 16px/1 var(--head);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);transition:background .35s}
.team .t{min-width:0;flex:1}
.team b{display:block;font:700 12px/1.15 var(--head);letter-spacing:.02em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#9fb0e8);white-space:nowrap}
.team .n{display:block;font:700 30px/1 var(--head);font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--c) 55%,#fff)}
.team small{display:block;font:700 10px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--c);height:10px;margin-top:2px}
.team.on{background:color-mix(in srgb,var(--c) 20%,#0a1233);border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent),0 0 28px color-mix(in srgb,var(--c) 55%,transparent)}
.team.on .crest{background:var(--c)}
.team.on b,.team.on .n{color:#fff}
.team.on .n{text-shadow:0 0 14px var(--c)}
.pot{border:2px solid var(--gold);border-radius:12px;padding:4px 12px;text-align:center;background:#0a1233;display:flex;flex-direction:column;justify-content:center;min-width:92px}
.pot b{font:700 9px/1 var(--head);letter-spacing:.16em;color:var(--gold);white-space:nowrap}
.pot span{font:700 28px/1.05 var(--head);color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 14px #ffc83d88}
.pot.bump span{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.22)}}
/* question */
.q{text-align:center;position:relative;padding:0 38px}
.q small{font:700 12px/1.3 var(--head);letter-spacing:.18em;color:var(--gold);text-transform:uppercase;display:block;min-height:16px}
.q h1{font:600 clamp(19px,5.2vw,30px)/1.12 var(--body);margin-top:2px;text-wrap:balance}
.chip{display:inline-block;background:var(--gold);color:#2b1700;border-radius:5px;padding:1px 6px;margin-left:6px;letter-spacing:.1em}
.ib{position:absolute;top:-2px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--dim);background:#0a123388;border:1px solid #25356f}
.ib:hover{color:#fff}.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.l{left:0}.ib.r{right:0}
.strikes{display:flex;justify-content:center;gap:10px;margin-top:6px}
.strikes i{width:54px;height:38px;border-radius:50%/60%;background:transparent;border:2px solid #4a2a4a;display:grid;place-items:center;font:700 26px/1 var(--head);color:transparent;font-style:normal;transition:background .12s,color .12s,box-shadow .12s}
.strikes i.x{position:relative;z-index:13;background:radial-gradient(#ff6a76,var(--red) 70%);border-color:#ffc0c6;color:#fff;box-shadow:0 0 22px 4px #ec2b3ccc;animation:lamp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes lamp{0%{transform:scale(.4)}100%{transform:scale(1)}}
/* board */
.board{position:relative;border-radius:16px;margin:8px 8px 4px;padding:14px;background:#050a1f;border:3px solid #2b3a78;box-shadow:inset 0 0 0 3px #050a1f,inset 0 0 0 5px #3a4a8f;min-height:0;align-self:start;max-height:calc(100% - 12px);display:flex;flex-direction:column}
.board.shake{animation:shake .5s}
@keyframes shake{15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(4px)}}
.bulb{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:#8a6a1a;animation:chase 1.2s steps(1) infinite}
.board.cheer .bulb{animation-duration:.25s}
.board.still .bulb{animation:none}.board.still .bulb.l{background:var(--gold);box-shadow:0 0 6px 2px #ffc83dcc}
@keyframes chase{0%,50%{background:var(--gold);box-shadow:0 0 6px 2px #ffc83dcc}50.01%,100%{background:#8a6a1a;box-shadow:none}}
.slots{display:grid;gap:7px;grid-template-rows:repeat(var(--n),minmax(26px,64px));flex:0 1 auto;min-height:0}
.slot{position:relative;perspective:700px;min-height:0}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
.slot.open .inner{transform:rotateX(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--head);font-weight:700;text-transform:uppercase}
.front{background:linear-gradient(#2a3a8c 0,#16225f 8%,#0b1445 50%,#0a1236 100%);border:2px solid #07102e;box-shadow:inset 0 2px 0 #5d73d0,inset 0 -3px 6px #000c,0 2px 0 #3a4a9a;justify-content:center}
.front::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;background:#050a22;box-shadow:1px 0 0 #2a3a8c;opacity:.7}
.front i{position:relative;z-index:1;height:76%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:radial-gradient(#23358a,#0b1445);border:2px solid #5b73c9;color:#9db0ff;font:700 clamp(15px,3.6vh,24px)/1 var(--head);font-style:normal}
.back{transform:rotateX(180deg);background:linear-gradient(#fffbe9,#ffe9a4);color:#14204a;border:2px solid #fff;box-shadow:0 0 0 2px #ffc83d,0 0 26px #ffc83daa}
.back u{text-decoration:none;font-size:clamp(14px,3.2vh,20px);color:#b0770a;width:1.2em;text-align:center;flex:none}
.back em{font-style:normal;flex:1;min-width:0;font-size:clamp(16px,3.8vh,24px);letter-spacing:.02em;white-space:nowrap;line-height:1.1}
.back b{flex:none;min-width:2.3em;text-align:center;font:700 clamp(17px,3.8vh,26px)/1.2 var(--head);background:#14204a;color:var(--gold);padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.slot.sweep .back{background:linear-gradient(#cfd5ea,#aab3d4);box-shadow:0 0 0 2px #6b78b0;color:#2a3566}
.slot.sweep .back b{background:#2a3566;color:#cfd5ea}.slot.sweep .back u{color:#4a5690}
.slot.nudge{animation:nudge .5s}
@keyframes nudge{30%{transform:scale(1.04)}}
/* call-outs */
.callrow.busy .cue{opacity:0}.callrow{position:relative;z-index:13;height:42px;margin:2px 0 -4px}
.call{position:absolute;left:50%;top:0;height:100%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;white-space:nowrap;padding:0 16px;border-radius:10px;background:var(--cc,#0a1233);color:var(--ct,#fff);border:2px solid #fff;box-shadow:0 0 22px color-mix(in srgb,var(--cc,#ffc83d) 65%,transparent);max-width:100%;font:700 clamp(17px,4.6vw,24px)/1 var(--head);letter-spacing:.04em;text-transform:uppercase}
.call small{font:600 clamp(12px,3.2vw,15px)/1.1 var(--body);letter-spacing:0;text-transform:none;opacity:.88;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
.call.show{animation:callin var(--ms,1000ms) cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes callin{0%{opacity:0;transform:translate(-50%,-12px)}12%{opacity:1;transform:translate(-50%,0)}88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}
.bigx{position:fixed;inset:0;z-index:12;background:radial-gradient(#050a1f99,#050a1fcc);display:grid;place-items:center;pointer-events:none;opacity:0}
.bigx div{text-align:center}
.bigx span{display:block;font:700 min(78vw,52vh,520px)/.8 var(--head);color:var(--red);-webkit-text-stroke:6px #fff;paint-order:stroke fill;text-shadow:0 0 60px #ec2b3c}
.bigx small{display:inline-block;margin-top:14px;font:700 26px/1.2 var(--head);letter-spacing:.04em;text-transform:uppercase;background:#050a1fdd;padding:5px 14px;border-radius:99px;max-width:86vw}
.bigx.show{animation:xin var(--ms,1000ms) cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes xin{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
/* input */
.cue{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 clamp(13px,3.7vw,16px)/1.2 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--team);transition:color .35s;padding:0 4px}
.guess{display:flex;gap:8px}
.guess input{flex:1;min-width:0;height:54px;border-radius:12px;border:3px solid var(--team);background:#050a1f;color:#fff;font:600 21px var(--body);padding:0 14px;box-shadow:0 0 20px color-mix(in srgb,var(--team) 45%,transparent);outline:0;transition:border-color .35s,box-shadow .35s,opacity .2s}
.guess input::placeholder{color:#6f80c0}
.guess input.no{animation:shake .4s}
.guess.wait input{opacity:.55}
.go{height:54px;padding:0 24px;border-radius:12px;background:linear-gradient(#ffd96b,var(--gold2));color:#2b1700;font:700 19px var(--head);letter-spacing:.08em;box-shadow:0 4px 0 #a45f00;transition:transform .06s,box-shadow .06s,filter .2s;white-space:nowrap}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #a45f00}
.go:disabled{filter:grayscale(.7) brightness(.7)}
.next{width:100%;height:58px;font-size:22px}
/* title */
.title{place-items:center;overflow:auto;padding:12px 0}
.tin{width:min(600px,100%);padding:0 14px;display:grid;gap:16px;text-align:center}
.tboard{margin:0 8px;padding:20px 16px 16px;display:grid;gap:6px;justify-items:center;align-self:auto}
.tboard .we{font:700 15px/1 var(--head);letter-spacing:.5em;color:var(--gold);margin-right:-.5em}
.tboard .h{font:700 clamp(104px,30vw,176px)/.82 var(--head);color:var(--cream);text-shadow:0 0 14px #ffc83d88;margin:8px 0 2px}
.tboard .st{font:700 clamp(15px,4vw,18px)/1 var(--head);letter-spacing:.3em;color:var(--cream);margin-right:-.3em;opacity:.9}
.tboard .rule{height:2px;width:60%;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:8px 0 6px}
.tq{font:600 17px/1.2 var(--body);color:var(--tx);margin-bottom:2px}
.tboard .slots{width:100%;--n:4;grid-template-rows:repeat(4,44px);gap:6px;flex:none}.tboard{display:grid}
.menu{display:grid;gap:12px}
.big{height:64px;border-radius:14px;background:linear-gradient(#ffd96b,var(--gold2));color:#2b1700;font:700 24px/1 var(--head);letter-spacing:.08em;box-shadow:0 5px 0 #a45f00;white-space:nowrap;transition:transform .06s,box-shadow .06s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #a45f00}
.big small{display:block;font:600 14px/1.2 var(--body);letter-spacing:0;margin-top:3px;opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two button{min-height:62px;border-radius:14px;border:2px solid #3a4a8f;background:#0a1233;color:#fff;font:700 17px/1.15 var(--head);letter-spacing:.06em;white-space:nowrap;padding:6px 8px;transition:border-color .2s,background .2s}
.two button:hover{border-color:#7f95e8}
.two button small{display:block;font:600 13px/1.2 var(--body);color:var(--dim);letter-spacing:0;margin-top:2px;white-space:normal}
.two button:disabled{opacity:.55;cursor:default}
.tfoot{display:flex;justify-content:center;gap:14px;align-items:center;font:600 14px var(--body);color:var(--dim);min-height:24px}
.tfoot button{color:var(--dim);text-decoration:underline;font:inherit}
.fresh{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--head);letter-spacing:.14em;color:var(--b);text-transform:uppercase}
.fresh::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--b);box-shadow:0 0 8px var(--b)}
/* end */
.end{place-items:center;background:#050a1fcc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;padding:16px;overflow:auto}
.card{width:min(460px,100%);border-radius:20px;background:#0a1233;border:3px solid var(--gold);box-shadow:0 0 0 3px #050a1f,0 0 50px #ffc83d55;padding:22px 18px;text-align:center;display:grid;gap:14px;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{opacity:0;transform:scale(.85) translateY(20px)}}
.card h2{font:700 clamp(40px,12vw,64px)/.95 var(--head);color:var(--cream);text-shadow:0 0 18px #ffc83d88;text-transform:uppercase}
.card h2.lose{color:#cfd5ea;text-shadow:none}
.card p{font:600 16px/1.3 var(--body);color:var(--dim)}
.fin{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.fin .team{display:block;text-align:center;padding:10px 6px;opacity:1}
.fin .team .crest{margin:0 auto 4px}.fin .team b{margin-bottom:2px}.fin .team .n{font-size:44px}
.fin .team.win{background:color-mix(in srgb,var(--c) 20%,#0a1233);border-color:var(--c);box-shadow:0 0 24px color-mix(in srgb,var(--c) 55%,transparent)}
.fin em{font:700 14px var(--head);color:var(--dim);font-style:normal;letter-spacing:.1em}
.stamp{justify-self:center;border:3px solid var(--gold);color:var(--gold);padding:5px 14px;border-radius:8px;font:700 20px/1 var(--head);letter-spacing:.14em;transform:rotate(-4deg);animation:stamp .5s .9s both cubic-bezier(.3,1.8,.5,1)}
@keyframes stamp{0%{opacity:0;transform:rotate(-4deg) scale(2.4)}100%{opacity:1;transform:rotate(-4deg) scale(1)}}
.stats{display:flex;justify-content:center;gap:18px;font:700 13px var(--head);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.stats span b{display:block;font-size:24px;color:var(--gold);letter-spacing:0}
.card .menu{margin-top:2px}
.card .two button,.one button{min-height:54px}
.one button{width:100%;border-radius:14px;border:2px solid #3a4a8f;background:#0a1233;color:#fff;font:700 17px/1.15 var(--head);letter-spacing:.06em}
@media(max-height:620px){.q small{display:none}.strikes{margin-top:3px}.strikes i{height:28px;width:44px;font-size:20px}.slots{grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--r),minmax(34px,48px))}.back em{white-space:normal;font-size:13px}.board{padding:10px;margin:4px 4px 2px}.app{gap:5px;padding-top:5px}.team .n{font-size:24px}.pot span{font-size:22px}.guess input,.go{height:46px}.team small{display:none}}
@media(min-width:900px){
 #game .app{grid-template-columns:200px minmax(0,1fr) 200px;grid-template-rows:auto auto minmax(0,1fr) auto auto;column-gap:22px;row-gap:10px;padding:18px 24px}
 #game .score{display:contents}
 #game .team{min-height:330px;grid-row:2/5;align-self:center;flex-direction:column;justify-content:center;text-align:center;padding:22px 10px;gap:6px}
 #game .team.b{flex-direction:column;text-align:center}#game .team.a{grid-column:1}#game .team.b{grid-column:3}
 #game .team .crest{width:64px;height:72px;font-size:38px}#game .team b{font-size:18px}#game .team .n{font-size:68px}#game .team small{font-size:12px;height:12px;margin-top:6px}
 #game .pot{grid-column:2;grid-row:1;flex-direction:row;gap:10px;align-items:baseline;justify-self:center;padding:3px 18px}#game .pot span{font-size:30px}#game .pot b{font-size:12px}
 #game #nextB{grid-column:2;grid-row:5}
 #game .q,#game .board,#game .guess{grid-column:2}
 #game .q h1{font-size:36px}#game .q small{font-size:14px}#game .strikes i{width:66px;height:46px;font-size:32px}
 #game .slots{grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--r),minmax(40px,104px));gap:12px 16px}
 #game .board{padding:22px;margin:12px 8px 6px;align-self:center}
 #game .guess input,#game .go{height:62px;font-size:24px}#game .go{font-size:22px}
 #game .back em{font-size:clamp(18px,3vw,28px)}
 #game .ib.l{left:0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.bulb{animation:none!important}}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle,transparent 25%,var(--fc,#ec2b3c) 140%);opacity:0}
.flash.show{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.board.tense .bulb{animation-duration:2.6s}
.wait .go{background:#14205a;color:#5f72b8;box-shadow:0 4px 0 #0a1233}
.slot.sweep .back{background:#111a4e;color:#8fa0e0;border:2px solid #2c3f93;box-shadow:none}
.slot.sweep .back b{background:#0a1233;color:#7f93e6}.slot.sweep .back u{color:#5367b8}
.n.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
.next{height:54px;display:grid;place-content:center;line-height:1}.next small{font:600 13px/1 var(--body);letter-spacing:0;opacity:.8;display:block;margin-top:3px}
.hist{display:none;list-style:none;padding:0;margin-top:10px;font:700 13px/1.6 var(--head);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.hist li b{color:#fff}.hist li.w{color:var(--c)}
.rounds{display:flex;justify-content:center;gap:8px}
.rounds span{flex:1;max-width:96px;padding:6px 4px;border-radius:9px;background:#0f1a4a;border:2px solid #25356f;font:700 12px/1.2 var(--head);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.rounds span b{display:block;font-size:20px;letter-spacing:0;color:#fff}.rounds span{font-size:11px}
.rounds span.a{border-color:var(--a)}.rounds span.a b{color:var(--a)}.rounds span.b{border-color:var(--b)}.rounds span.b b{color:var(--b)}
.pill{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:99px;border:1px solid #25356f;background:#0a123388;color:var(--dim);font:600 14px var(--body);text-decoration:none!important}
.pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:25;pointer-events:none;animation:fall linear forwards}

/* ---------- core: survey bank, answer matching, the rules of a match, the Hendersons ---------- */
const FEUD = (() => {
    const ROUNDS = 4, MULT = [1, 1, 2, 3], STRIKES = 3;

    /* ----- seeded randomness ----- */
    const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
    const mulberry = a => () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

    /* ----- reading a typed answer ----- */
    const STOP = new Set(['a', 'an', 'the', 'my', 'your', 'his', 'her', 'their', 'our', 'some', 'its', 'i', 'to']);
    const stem = w => {
        if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
        if (w.length > 4 && /(ches|shes|sses|xes|zes|oes)$/.test(w)) return w.slice(0, -2);
        if (w.length > 3 && w.endsWith('s') && !/(ss|us|is)$/.test(w)) return w.slice(0, -1);

    const lev = (a, b) => {
        if (a === b) return 0;
        const m = a.length, n = b.length; let prev = Array.from({length: n + 1}, (_, j) => j), prev2 = prev;
        for (let i = 1; i <= m; i++) {
            const cur = [i];
            for (let j = 1; j <= n; j++) {
                cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], prev2[j - 2] + 1);
            }
            prev2 = prev; prev = cur;

        const pt = tokens(phrase);
        if (!pt.length || !guessTok.length) return 0;
        const g = guessTok.join(''), p = pt.join('');
        if (g === p) return 1;

    }

    // "Question@Name|pct|alias,alias;Name|pct|..." the way the bank is written
    function parse(line) {
        const [q, rest] = line.split('@');
        return {q, a: rest.split(';').map(x => { const [name, pct, also] = x.split('|'); return {name, pct: +pct, also: (also || '').split(',').filter(Boolean)}; })};

    function clean(s) {

    c.style.setProperty('--ms', ms + 'ms'); c.style.setProperty('--cc', bg || '#0a1233'); c.style.setProperty('--ct', fg || '#fff');
    c.innerHTML = esc(text) + (sub ? `<small>${esc(sub)}</small>` : '');
    c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
    const row = c.parentNode; row.classList.add('busy'); clearTimeout(row._t); row._t = setTimeout(() => row.classList.remove('busy'), ms);
    return wait(ms);
}
function bigX(text, soft, ms = 1000) {
    const x = $('#bigx');
    x.querySelector('small').textContent = text ? '“' + text + '”' : '';
    x.querySelector('small').hidden = !text;
    x.style.setProperty('--ms', ms + 'ms');
    x.classList.remove('show'); void x.offsetWidth; x.classList.add('show');
    return wait(ms);
}
function wash(t) { const f = $('#flash'); f.style.setProperty('--fc', t === 0 ? '#ff3d9a' : '#2fd4ff'); f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); }
const cheer = () => { bd.classList.add('cheer'); setTimeout(() => bd.classList.remove('cheer'), 900); };
const teamColor = t => COLOR[t];

async function runEvents(ev, said, mine) {
    for (const e of ev) {
        if (mine !== token) return;
        if (e.t === 'reveal') {
            if (S.mode === 'solo' && e.team === 1) say(`${S.names[1]}: ${F.board(S)[e.idx].name}`, '', 1100, teamColor(1), '#12051a');
            const el = slotEl(e.idx); el.classList.add('open'); Snd.flip(); setTimeout(() => Snd.ding(e.idx), 120); cheer();
            const pot = $('#pot'); pot.classList.remove('bump'); void pot.offsetWidth; pot.classList.add('bump');
            const from = shown.pot; shown.pot = from + e.pts; tween($('#pot span'), from, shown.pot, 450);
            await wait(750);
        } else if (e.t === 'strike') {
            drawStrikes(); Snd.buzz(); buzz([60, 40, 120]);
            bd.classList.toggle('tense', e.n === 2 && S.phase === 'play');
            if (!RM.matches) { bd.classList.remove('shake'); void bd.offsetWidth; bd.classList.add('shake'); const f = $('#flash'); f.style.setProperty('--fc', '#ec2b3c'); f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); }
            say('✕ ' + said, '', 1300, '#ec2b3c', '#fff');
            await bigX('', false, 1300);
        } else if (e.t === 'miss') {
            Snd.tick(); await say(`✕ ${said}`, '', 1200, '#0a1233', '#fff');
        } else if (e.t === 'retry') {
            await say('Neither one!', 'Go again', 1100);
        } else if (e.t === 'control') {
            Snd.blip();
            await say(e.top ? `Top answer! ${who(e.team)} ${vb(e.team, 'take')} control` : `${who(e.team)} ${vb(e.team, 'take')} control`, '', 1300, teamColor(e.team), '#12051a');
        } else if (e.t === 'steal') {
            Snd.blip(); drawStrikes();
            bd.classList.remove('tense');
            await say(`Steal! ${who(e.team)}: one guess`, '', 1500, teamColor(e.team), '#12051a');
        } else if (e.t === 'stolen') {
            wash(e.team); await wait(300); await say(`Stolen! ${who(e.team)} ${vb(e.team, 'take')} ${S.bank}`, '', 1500, teamColor(e.team), '#12051a');
        } else if (e.t === 'held') {
            await wait(300); await say(`Steal failed · ${who(e.team)} ${vb(e.team, 'keep')} ${S.bank}`, '', 1500, teamColor(e.team), '#12051a');
        } else if (e.t === 'clear') {
            Snd.win(); cheer(); await say('Board cleared!', '', 1000, '#ffc83d', '#2b1700');
        } else if (e.t === 'sweep') {
            $('#cue').textContent = e.idxs.length ? 'The rest of the board' : '';
            for (const i of e.idxs) { if (mine !== token) return; const el = slotEl(i); el.classList.add('sweep', 'open'); Snd.flip(); await wait(380); }
            if (e.idxs.length) await wait(500);
        } else if (e.t === 'award') {
            const t = e.team, k = t ? '#tB' : '#tA';
            const from = shown.s[t]; bd.classList.remove('tense'); wash(t); cheer();
            Snd.tick();
            await Promise.all([say(`${who(t)} ${vb(t, 'score')} ${e.pts}`, '', 1300, teamColor(t), '#12051a'), tween($('#pot span'), shown.pot, 0, 900), tween($(k + ' .n'), from, from + e.pts, 900)]);
            shown.pot = 0; shown.s[t] = from + e.pts;
            const nn = $(k + ' .n'); nn.classList.remove('bump'); void nn.offsetWidth; nn.classList.add('bump');
            await wait(400);
        }
    }
}

/* ---------- turns ---------- */
function setWait(on) { $('#form').classList.toggle('wait', on); }
async function nextTurn() {
    const mine = token;
    setTeam(); drawCue(); drawStrikes();
    if (S.phase === 'roundEnd') return endRound();
    if (S.mode === 'solo' && S.turn === 1) {
        busy = true; setWait(true);
        await wait(1100 + Math.random() * 700);
        if (mine !== token) return;
        return play({bot: true});
    }
    busy = false; setWait(false);
}
async function play(guess) {
    const mine = token, team = S.turn;
    const r = F.act(S, team, guess);
    const refused = r.ev.length === 1 && r.ev[0].t === 'refused';
    if (refused) { const i = $('#inp'); i.classList.remove('no'); void i.offsetWidth; i.classList.add('no'); return; }
    busy = true;
    if (r.ev.length === 1 && r.ev[0].t === 'repeat') {
        const el = slotEl(r.ev[0].idx); el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge');
        Snd.tick(); await say('Already up!', 'Try another answer', 900); busy = false; setWait(false); return;
    }
    S = r.s; D.game = S; save();
    // the board changes in the same frame the player sent the guess
    await runEvents(r.ev, r.said, mine);
    if (mine !== token) return;
    nextTurn();
}
async function endRound() {
    const last = S.r >= F.ROUNDS - 1;
    drawCue(); $('#cue').textContent = S.phase === 'roundEnd' ? `${who(S.winner)} ${vb(S.winner, 'win')} the round` : '';
    $('#form').hidden = true; const b = $('#nextB'); b.hidden = false; const nm = F.mult(S.r + 1); b.innerHTML = last ? `SEE THE RESULT<small>${esc(who(S.winner))} took ${(S.hist[S.hist.length - 1] || [0, 0])[1]} this round</small>` : `NEXT: ROUND ${S.r + 2}${nm > 1 ? ' · ×' + nm : ''}<small>${esc(who(S.winner))} took ${(S.hist[S.hist.length - 1] || [0, 0])[1]} this round</small>`; drawHist();
    document.documentElement.style.setProperty('--team', COLOR[S.winner]);
    busy = true; setTeam(); b.focus({preventScroll: true});
}
$('#nextB').onclick = async () => {
    if (S.phase !== 'roundEnd') return;
    Snd.init(); Snd.blip();
    $('#nextB').hidden = true; $('#form').hidden = false;
    S = F.next(S); D.game = S; save();
    if (S.phase === 'final') return final();
    beginRound();
};
async function beginRound() {
    const mine = ++token;
    shown.pot = 0; buildBoard(); drawAll();
    $('#form').hidden = false; $('#nextB').hidden = true;
    busy = true; setWait(true);
    const m = F.mult(S.r);
    await say(m > 1 ? `Round ${S.r + 1} · every answer ×${m}` : `Round ${S.r + 1}`, '', 1100, '#0a1233', '#ffc83d');
    if (mine !== token) return;
    nextTurn();
    if (!busy) focusInput();
}
function focusInput() { try { $('#inp').focus({preventScroll: true}); } catch (e) {} }
$('#form').onsubmit = e => {
    e.preventDefault();
    const i = $('#inp'), v = i.value.trim();
    Snd.init();
    if (!v || !S) return;
    if (busy) { i.classList.remove('no'); void i.offsetWidth; i.classList.add('no'); return; }
    i.value = ''; play({text: v});
};
$('#inp').addEventListener('input', () => { if (busy) { /* typing ahead is allowed */ } });

/* ---------- the end ---------- */
function final() {
    const res = F.result(S), solo = S.mode === 'solo';
    const you = S.scores[0], them = S.scores[1];
    D.game = null;
    let line = '';
    if (solo) {
        D.played++; if (res === 0) D.wins++; else if (res === 1) D.losses++;
        if (you > D.best) { D.best = you; line = 'A new best game'; }
        if (S.daily) {
            if (!D.daily || D.daily.day !== S.daily) {
                D.streak = D.lastDay === dayBefore(S.daily) ? D.streak + 1 : 1; D.lastDay = S.daily;
                D.daily = {day: S.daily, score: you, opp: them};
            }
        }
    }
    save(); drawTitle();
    const rec = S.hist.map(([w, p], i) => `<span class="${TEAM[w]}">R${i + 1}${F.mult(i) > 1 ? ' ×' + F.mult(i) : ''}<b>+${p}</b>${esc(who(w))}</span>`).join('');
    const head = res === 'tie' ? 'It’s a tie' : solo ? (res === 0 ? 'You win' : 'Hendersons win') : S.names[res] + ' wins';
    const lose = solo && res === 1;
    $('#card').innerHTML = `<h2 class="${lose ? 'lose' : ''}">${esc(head)}</h2>
     <div class="fin">${[0, 1].map(t => `<div class="team ${TEAM[t]} ${res === t ? 'win' : ''}"><i class="crest">${esc(S.names[t][0].toUpperCase())}</i><b>${esc(S.names[t])}</b><span class="n">${S.scores[t]}</span></div>`).join('<em>VS</em>').replace('<em>VS</em>', '<em>VS</em>')}</div>
     <div class="rounds">${rec}</div>
     ${solo ? `<div class="stats">${line ? '' : `<span><b>${D.best}</b>best</span>`}<span><b>${D.wins}–${D.losses}</b>lifetime W–L</span>${S.daily ? `<span><b>${D.streak}</b>day streak</span>` : ''}</div>` : ''}
     ${line ? `<div class="stamp">NEW BEST GAME</div>` : ''}
     <div class="menu">${S.daily ? '<button class="big" id="bShare">COPY RESULT</button>' : '<button class="big" id="bAgain">PLAY AGAIN</button>'}<div class="${S.daily ? 'two' : 'one'}"><button id="bHome">MENU</button>${S.daily ? '<button id="bAgain2">PLAY ANOTHER</button>' : ''}</div></div>`;
    $('#end').hidden = false;
    lose ? Snd.lose() : Snd.win();
    document.querySelectorAll('#card .fin .n').forEach((n, t) => { const v = S.scores[t]; n.textContent = 0; tween(n, 0, v, 1100); });
    if (!lose && !RM.matches) confetti();
    const again = () => { $('#end').hidden = true; start(S.mode); };
    const home = () => { $('#end').hidden = true; showTitle(); };
    $('#bHome').onclick = home;
    if ($('#bAgain')) $('#bAgain').onclick = again;
    if ($('#bAgain2')) $('#bAgain2').onclick = () => { $('#end').hidden = true; start('solo'); };
    if ($('#bShare')) $('#bShare').onclick = async e => {
        const txt = `We Asked 100 — ${S.daily}\nMe ${you} · Hendersons ${them}\nhttps://gptgames.dev/games/family_feud.html`;
        try { await navigator.clipboard.writeText(txt); e.target.textContent = 'COPIED'; } catch (x) { e.target.textContent = 'COULD NOT COPY'; }
        setTimeout(() => { if (e.target) e.target.textContent = 'COPY RESULT'; }, 1600);
    };
}

function confetti() {
    const cols = ['#ffc83d', '#ff3d9a', '#2fd4ff', '#fff3d0'];
    for (let i = 0; i < 44; i++) {
        const c = document.createElement('i'); c.className = 'conf';
        c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % 4];
        c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's'; c.style.animationDelay = Math.random() * .5 + 's';
        document.body.appendChild(c); setTimeout(() => c.remove(), 4500);
    }
}

/* ---------- starting, resuming, leaving ---------- */
function pickBoard() {
    const out = [];
    if (fresh && fresh.length) { out.push(...fresh.slice(0, F.ROUNDS)); }
    fresh = null; freshState = 'idle';
    if (out.length < F.ROUNDS) {
        const bank = F.bank, seen = new Set(D.seen);
        let pool = bank.map((_, i) => i).filter(i => !seen.has(i));
        if (pool.length < F.ROUNDS * 2) { D.seen = []; pool = bank.map((_, i) => i); }
        pool.sort(() => Math.random() - .5);
        const used = new Set(out.map(s => s.q));
        for (const i of pool) { if (out.length >= F.ROUNDS) break; if (used.has(bank[i].q)) continue; out.push(bank[i]); D.seen.push(i); }
        D.seen = D.seen.slice(-30);
    }
    return out;
}
function start(mode, daily, first) {
    Snd.init();
    let surveys, seed;
    if (daily) { surveys = F.dailyBoard(F.bank, daily); seed = 'day:' + daily; }
    else { surveys = pickBoard(); seed = String(Math.random()); if (first) surveys = [first, ...surveys.filter(s => s.q !== first.q)].slice(0, F.ROUNDS); }
    S = F.begin({mode, surveys, seed, daily: daily || null});
    D.game = S; save();
    showGame(); beginRound();
    if (!daily) fetchFresh();
}
function showGame() {
    stopTeaser(); $('#title').hidden = true; $('#game').hidden = false; document.body.classList.remove('on-title');
    bulbObs.observe(bd); drawSound(); layout();
}
function showTitle() {
    token++; busy = false;
    bulbObs.disconnect(); $('#game').hidden = true; $('#title').hidden = false; document.body.classList.add('on-title');
    document.documentElement.style.setProperty('--team', 'var(--a)');
    drawTitle(); startTeaser(); fetchFresh();
}
function resume() {
    S = D.game; S.hist = S.hist || []; Snd.init(); showGame();
    const mine = ++token;
    buildBoard(); drawAll();
    // a round half played comes back as it was: the revealed answers are up and the pot is what it was
    S.rev.forEach(i => slotEl(i).classList.add('open'));
    if (S.phase === 'roundEnd') { F.board(S).forEach((_, i) => { if (!S.rev.includes(i)) slotEl(i).classList.add('sweep', 'open'); }); $('#pot span').textContent = 0; shown.pot = 0; $('#tA .n').textContent = shown.s[0] = S.scores[0]; $('#tB .n').textContent = shown.s[1] = S.scores[1]; return endRound(); }
    nextTurn();
    if (!busy) focusInput();
}
$('#bSolo').onclick = () => start('solo');
$('#bDuo').onclick = () => start('duo');
$('#bDaily').onclick = () => start('solo', today());
$('#bResume').onclick = resume;
$('#bBack').onclick = showTitle;
$('#bSnd').onclick = toggleSound;
$('#tsound').onclick = toggleSound;

/* the phone's keyboard: keep the game inside what is left of the screen */
function layout() {
    const vv = window.visualViewport, app = $('#app');
    if (vv && vv.height < innerHeight - 80) { $('#game').style.height = vv.height + 'px'; $('#game').style.top = vv.offsetTop + 'px'; }
    else { $('#game').style.height = ''; $('#game').style.top = ''; }
    requestAnimationFrame(fit);
}
if (window.visualViewport) { visualViewport.addEventListener('resize', layout); visualViewport.addEventListener('scroll', layout); }
addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#title').hidden && !teaser) startTeaser(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(fit));

/* ---------- boards shared as links by the page this one replaced: ?combinationId=... ---------- */
let shared = null;
async function loadShared(id) {
    try {
        const {db} = await import('../firebase.js');
        const fs = await import('https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js');
        const snap = await fs.getDoc(fs.doc(db, 'combinations', id));
        if (!snap.exists()) return;
        const d = snap.data();
        shared = F.clean({q: d.question, a: (d.answers || []).map(x => ({name: String(x.answer), pct: +x.value}))});
        if (!shared) return;
        const b = $('#bShared'); b.hidden = false; b.querySelector('small').textContent = shared.q;
        b.onclick = () => { history.replaceState(null, '', location.pathname); b.hidden = true; start('solo', null, shared); };
    } catch (e) {}
}
const cid = new URLSearchParams(location.search).get('combinationId');
if (cid && /^\d{6,40}$/.test(cid)) loadShared(cid);

/* ---------- go ---------- */
bulbObs.observe($('#tb'));
if (D.game && D.game.v === 1 && D.game.rounds && D.game.phase === 'final') D.game = null;
drawTitle(); startTeaser(); fetchFresh();
window.__feud = {get S() { return S; }, resume, start};
})();

</script>
