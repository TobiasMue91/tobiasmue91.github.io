<script>
"use strict";
/* ============================================================
   Everywhere — one rulebook, every maze.
   Engine: seeded generation, exact simulation, cycle detection.
   ============================================================ */

/* ---------- seeded rng ---------- */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
const rnd=(r,n)=>Math.floor(r()*n);
const pick=(r,a)=>a[rnd(r,a.length)];

/* ---------- directions: 0=E 1=S 2=W 3=N (screen y grows down) ---------- */
const DX=[1,0,-1,0], DY=[0,1,0,-1];

/* ---------- a board ----------
   w,h              grid size
   open             Set of "x,y,d" meaning: from (x,y) you may step in direction d
   sx,sy,sd         start cell and heading
   gx,gy            goal cell
   cells            Set of "x,y" of floor cells that exist
------------------------------------------------------------ */
const key=(x,y)=>x+","+y;
const ekey=(x,y,d)=>x+","+y+","+d;

function Board(w,h){
  return {w,h,open:new Set(),cells:new Set(),sx:0,sy:0,sd:0,gx:0,gy:0};
}
function link(b,x,y,d){
  const nx=x+DX[d], ny=y+DY[d];
  b.open.add(ekey(x,y,d)); b.open.add(ekey(nx,ny,(d+2)%4));
  b.cells.add(key(x,y)); b.cells.add(key(nx,ny));
}
function canGo(b,x,y,d){ return b.open.has(ekey(x,y,d)); }

/* ---------- generators ---------- */

/* a straight corridor */
function genStraight(seed){
  const r=mulberry32(seed), n=4+rnd(r,9);
  const b=Board(n+1,1);
  b.cells.add(key(0,0));
  for(let x=0;x<n;x++) link(b,x,0,0);
  b.sx=0;b.sy=0;b.sd=0;b.gx=n;b.gy=0;
  return b;
}

/* corridors that bend, always the same way (clockwise) */
function genSpiralBend(seed){ return genCorridor(seed,true); }
/* corridors that bend either way */
function genWinding(seed){ return genCorridor(seed,false); }

function genCorridor(seed,sameWay){
  const r=mulberry32(seed);
  for(let attempt=0;attempt<60;attempt++){
    const b=Board(0,0);
    const occ=new Set(); let x=0,y=0,d=0;
    occ.add(key(0,0)); b.cells.add(key(0,0));
    const segs=3+rnd(r,4); let ok=true;
    for(let s=0;s<segs && ok;s++){
      const L=2+rnd(r,3);
      for(let i=0;i<L;i++){
        const nx=x+DX[d], ny=y+DY[d];
        /* keep the corridor one cell wide: no diagonal touching of earlier cells */
        if(occ.has(key(nx,ny))||touches(occ,nx,ny,x,y)){ ok=false; break; }
        link(b,x,y,d); occ.add(key(nx,ny)); x=nx; y=ny;
      }
      if(!ok) break;
      d=sameWay ? (d+1)%4 : (d+(r()<0.5?1:3))%4;
    }
    if(!ok||occ.size<6) continue;
    b.sx=0;b.sy=0;b.sd=0;b.gx=x;b.gy=y;
    normalise(b);
    return b;
  }
  return genStraight(seed);
}
/* would placing (nx,ny) sit next to an existing cell other than the one we came from? */
function touches(occ,nx,ny,px,py){
  for(let k=0;k<4;k++){
    const ax=nx+DX[k], ay=ny+DY[k];
    if(ax===px&&ay===py) continue;
    if(occ.has(key(ax,ay))) return true;
  }
  return false;
}

/* a perfect maze: exactly one route between any two cells */
function genMaze(seed,w,h){
  const r=mulberry32(seed);
  const b=Board(w,h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) b.cells.add(key(x,y));
  const seen=new Set([key(0,0)]), stack=[[0,0]];
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const nb=[];
    for(let d=0;d<4;d++){
      const nx=x+DX[d], ny=y+DY[d];
      if(nx<0||ny<0||nx>=w||ny>=h||seen.has(key(nx,ny))) continue;
      nb.push(d);
    }
    if(!nb.length){ stack.pop(); continue; }
    const d=pick(r,nb), nx=x+DX[d], ny=y+DY[d];
    link(b,x,y,d); seen.add(key(nx,ny)); stack.push([nx,ny]);
  }
  b.sx=0;b.sy=0;b.sd=0;
  b.gx=w-1;b.gy=h-1;
  return b;
}

/* a maze with loops: knock extra walls through, so wall-following can orbit */
function genBraid(seed,w,h,extra){
  const r=mulberry32(seed^0x9e37);
  const b=genMaze(seed,w,h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++)
    for(const d of [0,1]){
      const nx=x+DX[d], ny=y+DY[d];
      if(nx>=w||ny>=h) continue;
      if(!canGo(b,x,y,d) && r()<extra) link(b,x,y,d);
    }
  b.gx=w>>1; b.gy=h>>1;
  if(b.gx===0&&b.gy===0){ b.gx=w-1; b.gy=h-1; }
  return b;
}

/* the gauntlet: every family at once, every size, the goal at any corner.
   A rulebook that quietly assumed 7x7 mazes with the goal bottom-right dies here. */
function genGauntlet(seed){
  const r=mulberry32((seed*2654435761)>>>0), roll=r();
  if(roll<0.12) return genStraight(seed);
  if(roll<0.26) return genSpiralBend(seed);
  if(roll<0.42) return genWinding(seed);
  const n=3+Math.floor(r()*13), m=3+Math.floor(r()*13);
  const b=(roll<0.80)?genMaze(seed,n,m):genBraid(seed,n,m,0.03+r()*0.12);
  const corners=[[0,0],[n-1,0],[0,m-1],[n-1,m-1]];
  let c=corners[Math.floor(r()*4)];
  if(c[0]===b.sx&&c[1]===b.sy) c=[n-1,m-1];
  b.gx=c[0]; b.gy=c[1];
  return b;
}

/* shift a board so every coordinate is >= 0 and set w/h */
function normalise(b){
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  for(const c of b.cells){
    const [x,y]=c.split(",").map(Number);
    if(x<mnx)mnx=x; if(y<mny)mny=y; if(x>mxx)mxx=x; if(y>mxy)mxy=y;
  }
  const cells=new Set(), open=new Set();
  for(const c of b.cells){
    const [x,y]=c.split(",").map(Number);
    cells.add(key(x-mnx,y-mny));
  }
  for(const e of b.open){
    const [x,y,d]=e.split(",").map(Number);
    open.add(ekey(x-mnx,y-mny,d));
  }
  b.cells=cells; b.open=open;
  b.sx-=mnx; b.sy-=mny; b.gx-=mnx; b.gy-=mny;
  b.w=mxx-mnx+1; b.h=mxy-mny+1;
}

/* ---------- the instruction set ---------- */
/* conditions */
const C = {
  ALWAYS:      {id:"ALWAYS",      text:"always",                test:(s,b)=>true},
  WALL_AHEAD:  {id:"WALL_AHEAD",  text:"wall ahead",       test:(s,b)=>!canGo(b,s.x,s.y,s.d)},
  PATH_AHEAD:  {id:"PATH_AHEAD",  text:"open ahead", test:(s,b)=>canGo(b,s.x,s.y,s.d)},
  WALL_RIGHT:  {id:"WALL_RIGHT",  text:"wall right", test:(s,b)=>!canGo(b,s.x,s.y,(s.d+1)%4)},
  PATH_RIGHT:  {id:"PATH_RIGHT",  text:"open right",     test:(s,b)=>canGo(b,s.x,s.y,(s.d+1)%4)},
  WALL_LEFT:   {id:"WALL_LEFT",   text:"wall left",  test:(s,b)=>!canGo(b,s.x,s.y,(s.d+3)%4)},
  PATH_LEFT:   {id:"PATH_LEFT",   text:"open left",      test:(s,b)=>canGo(b,s.x,s.y,(s.d+3)%4)},
  CHALK_HERE:  {id:"CHALK_HERE",  text:"chalk here",  test:(s,b)=>s.marks.has(key(s.x,s.y))},
  CLEAN_HERE:  {id:"CLEAN_HERE",  text:"no chalk here",    test:(s,b)=>!s.marks.has(key(s.x,s.y))},
  CHALK_AHEAD: {id:"CHALK_AHEAD", text:"chalk ahead",
                test:(s,b)=>canGo(b,s.x,s.y,s.d)&&s.marks.has(key(s.x+DX[s.d],s.y+DY[s.d]))},
  CLEAN_AHEAD: {id:"CLEAN_AHEAD", text:"no chalk ahead",
                test:(s,b)=>canGo(b,s.x,s.y,s.d)&&!s.marks.has(key(s.x+DX[s.d],s.y+DY[s.d]))},
};
/* actions */
const A = {
  STEP:  {id:"STEP",  text:"step forward"},
  LEFT:  {id:"LEFT",  text:"turn left"},
  RIGHT: {id:"RIGHT", text:"turn right"},
  CHALK: {id:"CHALK", text:"chalk this tile"},
};

/* ---------- the machine ----------
   The rulebook is read top to bottom, one line per tick. A line whose
   condition holds fires; a line whose condition fails is skipped. After the
   last line it starts again at the first. Order matters, because a turn on
   line 1 changes what line 2 is looking at.
------------------------------------------------------------ */
const MAX_TICKS=4000;

function newState(b){
  return {x:b.sx,y:b.sy,d:b.sd,ip:0,marks:new Set(),ticks:0,steps:0,
          done:false,result:null,fired:-1};
}

/* one tick = read one line */
function tick(st,b,prog){
  if(st.done) return;
  if(!prog.length){ st.done=true; st.result="empty"; return; }
  const rule=prog[st.ip];
  st.fired=-1;
  if(C[rule.when].test(st,b)){
    st.fired=st.ip;
    const a=rule.then;
    if(a==="STEP"){
      if(!canGo(b,st.x,st.y,st.d)){ st.done=true; st.result="crash"; return; }
      st.x+=DX[st.d]; st.y+=DY[st.d]; st.steps++;
      if(st.x===b.gx&&st.y===b.gy){ st.done=true; st.result="win"; return; }
    } else if(a==="LEFT")  st.d=(st.d+3)%4;
    else if(a==="RIGHT")   st.d=(st.d+1)%4;
    else if(a==="CHALK")   st.marks.add(key(st.x,st.y));
  }
  st.ip=(st.ip+1)%prog.length;
  st.ticks++;
  if(st.ticks>=MAX_TICKS){ st.done=true; st.result="timeout"; }
}

/* Run headless. When the rulebook cannot chalk, the machine has finitely many
   states, so a repeated state proves the robot loops forever — we can say so
   rather than reporting a timeout. */
function runProgram(b,prog,wantPath){
  const st=newState(b);
  const canChalk=prog.some(r=>r.then==="CHALK");
  const seen=canChalk?null:new Set();
  const path=wantPath?[[st.x,st.y]]:null;
  while(!st.done){
    if(seen){
      const k=st.x+","+st.y+","+st.d+","+st.ip;
      if(seen.has(k)){ st.done=true; st.result="cycle"; break; }
      seen.add(k);
    }
    const px=st.x, py=st.y;
    tick(st,b,prog);
    if(wantPath&&(st.x!==px||st.y!==py)) path.push([st.x,st.y]);
  }
  return {result:st.result,ticks:st.ticks,steps:st.steps,
          x:st.x,y:st.y,d:st.d,path,marks:st.marks};
}

/* ============================================================
   Drawing
   ============================================================ */
const DPR=()=>Math.min(2.5,window.devicePixelRatio||1);

function fitCanvas(cv){
  const r=cv.getBoundingClientRect(), k=DPR();
  const w=Math.max(1,Math.round(r.width*k)), h=Math.max(1,Math.round(r.height*k));
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return cv.getContext("2d");
}

/* geometry for a board inside a box */
function layout(b,W,H,pad,padBottom){
  const pb=padBottom===undefined?pad:padBottom;
  const cs=Math.max(4,Math.min((W-pad*2)/b.w,(H-pad-pb)/b.h));
  return {cs,ox:(W-cs*b.w)/2,oy:pad+(H-pad-pb-cs*b.h)/2};
}

function drawBoard(ctx,b,g,opt){
  const {cs,ox,oy}=g;
  const st=opt.state, path=opt.path, small=cs<16;
  ctx.save();
  /* floor */
  ctx.fillStyle=opt.dim?"#0c1219":"#131c27";
  for(const c of b.cells){
    const [x,y]=c.split(",").map(Number);
    ctx.fillRect(ox+x*cs,oy+y*cs,cs+.5,cs+.5);
  }
  /* chalk */
  if(st&&st.marks&&st.marks.size){
    ctx.fillStyle="rgba(160,130,255,.30)";
    for(const c of st.marks){
      const [x,y]=c.split(",").map(Number);
      ctx.fillRect(ox+x*cs+.5,oy+y*cs+.5,cs-1,cs-1);
    }
  }
  /* the route walked */
  if(path&&path.length>1){
    ctx.strokeStyle=opt.fail?"rgba(255,107,107,.55)":"rgba(92,200,255,.45)";
    ctx.lineWidth=Math.max(1.2,cs*0.11); ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    for(let i=0;i<path.length;i++){
      const X=ox+path[i][0]*cs+cs/2, Y=oy+path[i][1]*cs+cs/2;
      i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
    }
    ctx.stroke();
  }
  /* walls */
  ctx.strokeStyle=opt.dim?"#33475e":"#6f8db0";
  ctx.lineWidth=Math.max(1.2,Math.min(4,cs*0.13));
  ctx.lineCap="square";
  ctx.beginPath();
  for(const c of b.cells){
    const [x,y]=c.split(",").map(Number);
    const X=ox+x*cs, Y=oy+y*cs;
    if(!canGo(b,x,y,3)){ ctx.moveTo(X,Y); ctx.lineTo(X+cs,Y); }
    if(!canGo(b,x,y,1)){ ctx.moveTo(X,Y+cs); ctx.lineTo(X+cs,Y+cs); }
    if(!canGo(b,x,y,2)){ ctx.moveTo(X,Y); ctx.lineTo(X,Y+cs); }
    if(!canGo(b,x,y,0)){ ctx.moveTo(X+cs,Y); ctx.lineTo(X+cs,Y+cs); }
  }
  ctx.stroke();
  /* goal */
  const GX=ox+b.gx*cs+cs/2, GY=oy+b.gy*cs+cs/2;
  const pulse=small?1:(0.86+0.14*Math.sin(Date.now()/380));
  ctx.fillStyle=opt.dim?"#2c6b55":"rgba(61,220,151,"+(0.85*pulse).toFixed(3)+")";
  const gr=cs*0.30*pulse;
  ctx.beginPath(); ctx.arc(GX,GY,gr,0,7); ctx.fill();
  if(!small){
    ctx.strokeStyle="rgba(61,220,151,.35)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(GX,GY,cs*0.42,0,7); ctx.stroke();
  }
  /* robot */
  if(st){
    const RX=ox+st.x*cs+cs/2, RY=oy+st.y*cs+cs/2, a=st.d*Math.PI/2;
    ctx.save(); ctx.translate(RX,RY); ctx.rotate(a);
    const s=cs*0.30;
    ctx.fillStyle=opt.fail?"#ff6b6b":"#5cc8ff";
    ctx.beginPath();
    ctx.moveTo(s*1.15,0); ctx.lineTo(-s*0.8,s*0.85);
    ctx.lineTo(-s*0.35,0); ctx.lineTo(-s*0.8,-s*0.85);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ============================================================

/* ============================================================
   Game
   ============================================================ */
const $=s=>document.querySelector(s);
const SAVE="everywhere.v1";

const G={
  stage:0, prog:[], results:[], sel:0, showing:null,
  anim:null, playing:false, tested:false, best:0, seedBase:0
};

function stage(){ return STAGES[G.stage]; }
function trialBoards(){
  const s=stage(), out=[];
  for(let i=0;i<s.trial;i++) out.push(s.gen(1000+G.stage*7919+i));
  return out;
}
let BOARDS=[];

/* ---------- persistence ---------- */
function save(){
  try{ localStorage.setItem(SAVE,JSON.stringify({stage:G.stage,prog:G.prog})); }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE)||"null");
    if(d&&typeof d.stage==="number"&&Array.isArray(d.prog)){
      G.stage=Math.min(d.stage,STAGES.length-1); G.prog=d.prog;
      return true;
    }
  }catch(e){}
  return false;
}

/* ---------- rulebook editor ---------- */
function renderRules(){
  const s=stage(), host=$("#rules");
  host.innerHTML="";
  G.prog.forEach((r,i)=>{
    const row=document.createElement("div");
    row.className="rule"; row.draggable=true; row.dataset.i=i;
    const when=document.createElement("select"); when.className="when";
    for(const c of s.conds){
      const o=document.createElement("option");
      o.value=c; o.textContent=(c==="ALWAYS"?"":"when ")+C[c].text;
      if(c===r.when) o.selected=true; when.appendChild(o);
    }
    when.onchange=()=>{ G.prog[i].when=when.value; changed(); };
    const then=document.createElement("select"); then.className="then";
    for(const a of s.acts){
      const o=document.createElement("option");
      o.value=a; o.textContent=A[a].text;
      if(a===r.then) o.selected=true; then.appendChild(o);
    }
    then.onchange=()=>{ G.prog[i].then=then.value; changed(); };
    const num=document.createElement("div"); num.className="num"; num.textContent=i+1;
    const arr=document.createElement("span"); arr.className="arrow"; arr.textContent="→";
    const del=document.createElement("button");
    del.className="del"; del.textContent="×"; del.title="remove this line";
    del.onclick=()=>{ G.prog.splice(i,1); changed(); };
    row.append(num,when,arr,then,del);
    row.addEventListener("dragstart",e=>{ G.dragFrom=i; row.classList.add("drag"); });
    row.addEventListener("dragend",()=>row.classList.remove("drag"));
    row.addEventListener("dragover",e=>e.preventDefault());
    row.addEventListener("drop",e=>{
      e.preventDefault();
      const from=G.dragFrom;
      if(from==null||from===i) return;
      const m=G.prog.splice(from,1)[0]; G.prog.splice(i,0,m); changed();
    });
    host.appendChild(row);
  });
  const add=document.createElement("button");
  add.id="addRule"; add.textContent="+ add a line";
  if(G.prog.length>=s.slots) add.disabled=true;
  add.onclick=()=>{
    if(G.prog.length>=s.slots) return;
    G.prog.push({when:s.conds[0],then:s.acts[0]}); changed();
  };
  host.appendChild(add);
  const note=document.createElement("div");
  note.className="loopnote";
  note.textContent=G.prog.length
    ? "↺ then back to line 1, for ever"
    : "an empty rulebook does nothing at all";
  host.appendChild(note);
}

function changed(){
  stopAnim(); stopSweep(); $("#run").disabled=false;
  G.tested=false;
  renderRules(); save(); paintThumbsIdle(); setVerdict("");
  $("#score").innerHTML='Press <b style="font-size:12.5px">Run</b> to test all '+stage().trial;
  $("#barGood").style.width="0%";
  $("#barBad").style.width="0%";
  $("#bar").classList.remove("tested");
  $("#why").innerHTML="";
  drawMain();
}

/* ---------- verdicts ---------- */
const WHY={
  win:"reached the goal",
  crash:"walked into a wall",
  cycle:"loops for ever — it can never reach the goal",
  timeout:"still wandering after 4,000 ticks",
  stuck:"no line ever fires",
  empty:"the rulebook is empty"
};
function setVerdict(html,kind){
  const v=$("#verdict");
  v.innerHTML=html; v.className=kind||"";
  v.style.display=html?"block":"none";
}

/* ---------- testing ---------- */
function testAll(){
  BOARDS=BOARDS.length?BOARDS:trialBoards();
  G.results=BOARDS.map(b=>runProgram(b,G.prog,false));
  G.tested=true;
  const pass=G.results.filter(r=>r.result==="win").length;
  G.best=Math.max(G.best,pass);
  return pass;
}
/* how the failures failed — the most useful thing the proving ground can say */
function breakdown(){
  const n={};
  for(const r of G.results) if(r.result!=="win") n[r.result]=(n[r.result]||0)+1;
  const label={crash:"walk into a wall",cycle:"loop for ever",timeout:"never arrive",
               stuck:"freeze",empty:"do nothing"};
  const parts=Object.keys(n).sort((a,b)=>n[b]-n[a]).map(k=>n[k]+" "+label[k]);
  return parts.length?parts.join(" · "):"";
}
function firstFailIndex(){
  for(let i=0;i<G.results.length;i++) if(G.results[i].result!=="win") return i;
  return -1;
}

/* ---------- the proving ground ---------- */
let THUMBS=[], sweepRAF=0;

function thumbCount(){
  return Math.min(BOARDS.length, window.innerWidth<=860?36:48);
}
function buildThumbs(){
  const host=$("#thumbs");
  host.innerHTML=""; THUMBS=[];
  BOARDS=BOARDS.length?BOARDS:trialBoards();
  const n=thumbCount();
  for(let i=0;i<n;i++){
    const idx=Math.floor(i*BOARDS.length/n);     /* spread across the whole set */
    const d=document.createElement("div");
    d.className="thumb"; d.title="maze "+(idx+1);
    const cv=document.createElement("canvas");
    d.appendChild(cv); host.appendChild(d);
    d.onclick=()=>showBoard(idx);
    THUMBS.push({el:d,cv,idx,shown:false});
  }
}
function paintThumb(t,withResult){
  const b=BOARDS[t.idx];
  const res=(withResult&&G.tested)?G.results[t.idx]:null;
  t.el.classList.toggle("pass",!!res&&res.result==="win");
  t.el.classList.toggle("fail",!!res&&res.result!=="win");
  t.el.classList.toggle("sel",t.idx===G.showing);
  const ctx=fitCanvas(t.cv);
  ctx.clearRect(0,0,t.cv.width,t.cv.height);
  const g=layout(b,t.cv.width,t.cv.height,2*DPR());
  drawBoard(ctx,b,g,{dim:!res,fail:res&&res.result!=="win",
    path:res?runProgram(b,G.prog,true).path:null});
}
function paintThumbsIdle(){
  buildThumbs();
  requestAnimationFrame(()=>{
    for(const t of THUMBS){ t.shown=G.tested; paintThumb(t,G.tested); }
  });
}
function stopSweep(){ if(sweepRAF) cancelAnimationFrame(sweepRAF); sweepRAF=0; }

/* Watching the rulebook meet every maze is the whole idea, so a run is shown
   rather than resolved: the proving ground fills in maze by maze, the count
   climbs, and only when it is done does it hand you the one that beat you. */
function sweep(done){
  const tot=G.results.length;
  const dur=Math.min(1150,450+tot*1.5);
  const t0=performance.now();
  stopSweep();
  $("#run").disabled=true;
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur);
    const upto=Math.max(1,Math.round(k*tot));
    let pass=0;
    for(let i=0;i<upto;i++) if(G.results[i].result==="win") pass++;
    $("#score").innerHTML=k<1
      ? "<b>"+pass+"</b> / "+upto+" tested…"
      : "<b>"+pass+"</b> / "+tot+" mazes solved";
    $("#barGood").style.width=(100*pass/tot).toFixed(2)+"%";
    $("#barBad").style.width=(100*(upto-pass)/tot).toFixed(2)+"%";
    for(const t of THUMBS){
      const vis=t.idx<upto;
      if(vis!==t.shown){ t.shown=vis; paintThumb(t,vis); }
    }
    if(k<1){ sweepRAF=requestAnimationFrame(step); return; }
    sweepRAF=0; $("#run").disabled=false;
    $("#why").innerHTML=breakdown();
    done(pass);
  };
  sweepRAF=requestAnimationFrame(step);
}

/* ---------- the big board ---------- */
function showBoard(i){
  G.showing=i;
  stopAnim();
  for(const t of THUMBS) t.el.classList.toggle("sel",t.idx===i);
  const hit=THUMBS.find(t=>t.idx===i);
  if(hit&&hit.el.scrollIntoView) hit.el.scrollIntoView({block:"nearest",inline:"nearest"});
  playOn(BOARDS[i]);
}

let animState=null, animBoard=null, animRAF=0, animAcc=0, animLast=0;
function stopAnim(){
  if(animRAF) cancelAnimationFrame(animRAF);
  animRAF=0; G.playing=false;
}
function playOn(b){
  animBoard=b; animState=newState(b); animAcc=0; animLast=performance.now();
  G.playing=true;
  const res=runProgram(b,G.prog,true);
  /* never run the animation longer than about six seconds, however long the
     robot flailed for; a cycling rule is already proven, watching it twice is
     enough to see why */
  const cap=Math.min(res.ticks,res.result==="cycle"?Math.max(60,res.ticks):res.ticks);
  const speed=Math.max(40,Math.min(700,Math.ceil(cap/5.5)));
  loop(speed,res,cap);
}
function loop(speed,res,cap){
  const f=now=>{
    const dt=Math.min(100,now-animLast); animLast=now;
    animAcc+=dt*speed/1000;
    let guard=0;
    while(animAcc>=1&&!animState.done&&animState.ticks<cap&&guard++<900){ tick(animState,animBoard,G.prog); animAcc-=1; }
    if(!animState.done&&animState.ticks>=cap){ animState.done=true; animState.result=res.result; }
    drawMain();
    highlight(animState.done?-1:animState.ip);
    if(animState.done){
      G.playing=false;
      finishVerdict(res);
      return;
    }
    animRAF=requestAnimationFrame(f);
  };
  animRAF=requestAnimationFrame(f);
}
function highlight(ip){
  document.querySelectorAll(".rule").forEach((el,i)=>{
    el.classList.toggle("active",i===ip);
  });
}
function finishVerdict(res){
  const b=animBoard, ok=res.result==="win";
  const which=G.showing!=null?("Maze "+(G.showing+1)+": "):"";
  if(!G.tested){ setVerdict("<b>"+(ok?"Solved":"Failed")+"</b> — "+WHY[res.result],ok?"good":"bad"); return; }
  const pass=G.results.filter(r=>r.result==="win").length, tot=G.results.length;
  if(pass===tot){
    setVerdict("<b>All "+tot+"</b> — your rule holds everywhere","good");
  } else {
    setVerdict(which+"<b>"+WHY[res.result]+"</b>. "+pass+" of "+tot+" mazes solved.",ok?"":"bad");
  }
}

function drawMain(){
  const cv=$("#board"); const ctx=fitCanvas(cv);
  ctx.clearRect(0,0,cv.width,cv.height);
  const b=animBoard||BOARDS[0];
  if(!b) return;
  /* leave room for the verdict so it never sits on top of the goal */
  const vis=$("#verdict").style.display!=="none"&&$("#verdict").innerHTML;
  const vh=vis?($("#verdict").offsetHeight+18):18;
  const g=layout(b,cv.width,cv.height,18*DPR(),vh*DPR());
  const st=animState;
  const path=st?traceSoFar():null;
  drawBoard(ctx,b,g,{state:st,path,fail:st&&st.done&&st.result!=="win"});
}
/* the route the robot has actually walked so far, for the trail */
let traceCache=null;
function traceSoFar(){
  if(!animState) return null;
  const s=newState(animBoard), out=[[s.x,s.y]];
  for(let i=0;i<animState.ticks&&!s.done;i++){
    const px=s.x,py=s.y; tick(s,animBoard,G.prog);
    if(s.x!==px||s.y!==py) out.push([s.x,s.y]);
  }
  return out;
}

/* ---------- run ---------- */
function onRun(){
  if(!G.prog.length){ setVerdict("<b>Your rulebook is empty</b> — add a line","bad"); return; }
  if(sweepRAF) return;                      /* already running */
  stopAnim();
  testAll();
  const tot=G.results.length;
  $("#why").innerHTML="";
  $("#bar").classList.add("tested");
  for(const t of THUMBS){ t.shown=false; paintThumb(t,false); }
  setVerdict("<b>Testing</b> your rulebook on all "+tot+" mazes…");
  sweep(pass=>{
    if(pass===tot){
      setVerdict("<b>All "+tot+"</b> — your rule holds everywhere","good");
      setTimeout(stageCleared,520);
      return;
    }
    showBoard(firstFailIndex());
  });
}

/* ---------- stage flow ---------- */
function pips(){
  const p=$("#pips"); p.innerHTML="";
  STAGES.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="pip"+(i<G.stage?" done":(i===G.stage?" cur":""));
    d.title=s.name; p.appendChild(d);
  });
}
function stageCleared(){
  const s=stage(), last=G.stage>=STAGES.length-1;
  const lines=G.prog.map(r=>"<li>"+(r.when==="ALWAYS"?"":"when ")+"<b>"+C[r.when].text+"</b> → "+A[r.then].text+"</li>").join("");
  card(
    "<h2>"+(last?"Everywhere":"It holds")+"</h2>"+
    '<p class="sub">'+s.name+" — "+s.trial+" of "+s.trial+"</p>"+
    "<p>Your rulebook, in "+G.prog.length+" line"+(G.prog.length>1?"s":"")+", solved every one:</p>"+
    "<ul>"+lines+"</ul>"+
    (last
      ? "<p>That is the whole ladder. You never solved a maze here — you wrote something that solves all of them, and the difference is the entire point.</p>"+
        '<div class="new">'+
        "<b>What you found.</b> Of the 614,656 rulebooks three lines long, exactly <b>twelve</b> solve every maze — "+
        "six ways of saying keep your right hand on the wall, six of saying the left. It is a rule people have "+
        "walked out of mazes with for centuries, and you derived it from your own failures."+
        "</div>"+
        "<p>One last measured thing, because it surprised the person who built this. Knocking loops through the "+
        "walls does <b>not</b> beat wall-following: with the goal in a corner it still solved 200 of 200 at every "+
        "loop density tried. Move the goal to the middle and the same rule fell to 57 of 200. Wall-following does "+
        "not fail because a maze has loops. It fails when the goal is not on the wall you are holding — and no "+
        "rulebook of this kind, chalk and all, was found that fixes it. That one is still open.</p>"+
        '<p style="font-size:13px;color:var(--faint)">Everywhere · a game from '+
        '<a href="https://www.gptgames.dev/" style="color:var(--accent);text-decoration:none">gptgames.dev</a></p>' 
      : "<p>"+STAGES[G.stage+1].blurb+"</p>"+
        '<div class="new">'+STAGES[G.stage+1].newbits+"</div>"),
    last?"Play again from the start":"Take on "+(last?"":STAGES[G.stage+1].name),
    ()=>{
      if(last){ G.stage=0; G.prog=[]; }
      else { G.stage++; }
      BOARDS=[]; G.tested=false; G.showing=null; G.results=[];
      startStage();
    }
  );
}
function startStage(){
  const s=stage();
  G.hintAt=0;
  /* a stage can take conditions away; drop any line it can no longer express
     rather than leaving a select showing something the robot cannot sense */
  G.prog=G.prog.filter(r=>s.conds.includes(r.when)&&s.acts.includes(r.then)).slice(0,s.slots);
  BOARDS=trialBoards();
  G.showing=0; animBoard=BOARDS[0]; animState=newState(BOARDS[0]);
  G.tested=false; G.results=[];
  $("#stageName").innerHTML="<em>"+s.name+"</em>";
  $("#brief").innerHTML="<b>"+s.name+"</b> — "+s.brief+" &nbsp;·&nbsp; up to "+s.slots+" lines";
  $("#score").innerHTML='Press <b style="font-size:12.5px">Run</b> to test all '+s.trial;
  $("#barGood").style.width="0%";
  $("#barBad").style.width="0%";
  $("#bar").classList.remove("tested");
  $("#why").innerHTML="";
  pips(); renderRules(); paintThumbsIdle(); setVerdict(""); drawMain(); save();
}

/* ---------- overlay ---------- */
function card(html,btn,fn,ghost,gfn,dismissible){
  const c=$("#card");
  c.innerHTML=html;
  G.canDismiss=!!dismissible;
  const b=document.createElement("button");
  b.className="go"; b.textContent=btn;
  b.onclick=()=>{ $("#ov").classList.add("hide"); fn&&fn(); };
  c.appendChild(b);
  if(ghost){
    const g=document.createElement("button");
    g.className="ghost"; g.textContent=ghost;
    g.onclick=()=>{ $("#ov").classList.add("hide"); gfn&&gfn(); };
    c.appendChild(g);
  }
  $("#ov").classList.remove("hide");
}
function closeCard(){ $("#ov").classList.add("hide"); G.canDismiss=false; }
function intro(){
  const s=STAGES[0];
  card(
    "<h2>"+s.title+"</h2>"+
    '<p class="sub">Everywhere · stage one of '+STAGES.length+"</p>"+
    "<p>"+s.blurb+"</p>"+
    '<div class="new">'+s.newbits+"</div>"+
    "<p>Build the rulebook on the left, press <b>Run</b>, and watch what happens to the ones you did not think about.</p>",
    "Begin", ()=>{ startStage(); }
  );
}
function howto(){
  card(
    "<h2>How it works</h2>"+
    '<p class="sub">the whole machine, in six lines</p>'+
    "<ul>"+
    "<li>Each tick the robot reads <b>one line</b> of your rulebook, from the top down.</li>"+
    "<li>If the line's condition holds, it does the action. If not, it is skipped.</li>"+
    "<li>After the last line it starts again at the first, for ever.</li>"+
    "<li><b>Order matters:</b> a turn on line 1 changes what line 2 is looking at.</li>"+
    "<li>Stepping into a wall <b>kills the run</b>. So does going round for ever.</li>"+
    "<li>You win a stage when one rulebook solves <b>every maze</b> in the proving ground.</li>"+
    "</ul>"+
    "<p>Click any maze in the proving ground to watch your rule run on it. Drag a line to move it.</p>",
    "Back to it", null, null, null, true
  );
}

/* ---------- boot ---------- */
function boot(){
  $("#run").onclick=onRun;
  $("#step").onclick=()=>{
    if(!G.prog.length) return;
    stopAnim();
    if(!animState||animState.done){ animState=newState(animBoard); }
    tick(animState,animBoard,G.prog);
    highlight(animState.done?-1:animState.ip);
    drawMain();
    if(animState.done) setVerdict("<b>"+WHY[animState.result]+"</b>",animState.result==="win"?"good":"bad");
  };
  $("#howBtn").onclick=howto;
  $("#stuckBtn").onclick=()=>{
    const s=stage(), h=s.hints||[];
    G.hintAt=Math.min((G.hintAt||0),h.length-1);
    const shown=h.slice(0,G.hintAt+1).map(t=>"<li>"+t+"</li>").join("");
    const more=G.hintAt<h.length-1;
    card("<h2>"+s.name+"</h2>"+'<p class="sub">a nudge, not the answer — unless you keep asking</p>'+
         "<ul>"+shown+"</ul>",
         more?"Tell me a bit more":"Back to it",
         ()=>{ if(more){ G.hintAt++; $("#stuckBtn").click(); } },
         more?"Back to it":null, null, true);
  };
  $("#resetBtn").onclick=()=>{
    card("<h2>Start over?</h2><p>This clears your progress and your rulebook.</p>",
      "Yes, from the top",()=>{
        try{localStorage.removeItem(SAVE);}catch(e){}
        G.stage=0; G.prog=[]; BOARDS=[]; startStage();
      },"Keep playing");
  };
  window.addEventListener("resize",()=>{ drawMain(); paintThumbsIdle(); });
  $("#ov").addEventListener("click",e=>{ if(e.target===$("#ov")&&G.canDismiss) closeCard(); });
  document.addEventListener("keydown",e=>{
    const open=!$("#ov").classList.contains("hide");
    if(e.key==="Escape"&&open&&G.canDismiss){ e.preventDefault(); closeCard(); return; }
    if(e.key==="Enter"&&!e.repeat&&!open){ e.preventDefault(); onRun(); }
  });
  const had=load();
  if(had&&G.prog.length){ startStage(); }
  else { G.prog=[]; startStage(); intro(); }
  (function spin(){ if(!G.playing) drawMain(); requestAnimationFrame(spin); })();
}
boot();
</script>
</body>
</html>
