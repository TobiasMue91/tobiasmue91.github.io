            }, {f: 'overtime', t: 'eternity'},
            // Destruction
            {f: 'shock', t: 'explode'}, {f: 'explode', t: 'meteor'}, {f: 'meteor', t: 'nuke'}, {
                f: 'nuke',
                t: 'bigbang'
            },
            // Scaling
            {f: 'more', t: 'lucky'}, {f: 'lucky', t: 'pmult'}, {f: 'more', t: 'triple'}, {
                f: 'triple',
                t: 'quad'
            }, {f: 'more', t: 'respawn'}, {f: 'respawn', t: 'infinity'}, {f: 'quad', t: 'infinity'},
            // Chaos
            {f: 'shufflesk', t: 'wild'}, {f: 'wild', t: 'quantum'}, {f: 'quantum', t: 'magnet'}, {
                f: 'magnet',
                t: 'rift'
            },
            // Cross-branch to singularity
            {f: 'rift', t: 'singularity'}, {f: 'bigbang', t: 'singularity'}, {
                f: 'infinity',
                t: 'singularity'
            }, {f: 'eternity', t: 'singularity'}, {f: 'hyper', t: 'singularity'}, {f: 'omni', t: 'singularity'}
        ];
        const BRANCH_LABELS = {
            perception: {x: 420, y: 130, name: "PERCEPTION"}, speed: {x: 980, y: 130, name: "SPEED"},
            time: {x: 130, y: 390, name: "TIME"}, destruction: {x: 1270, y: 390, name: "DESTRUCTION"},
            scaling: {x: 300, y: 950, name: "SCALING"}, chaos: {x: 1100, y: 950, name: "CHAOS"}
        };

        let treePan = {x: 0, y: 0}, treeZoom = 0.6, treeDrag = null, prevVisible = new Set(), activePopup = null;

        function isNodeVisible(id) {
            if (id === 'core') return true;
            if (!SK[id]) return false;
            const s = SK[id];
            if (!s.req) return true; // root of branch
            return Object.keys(s.req).some(k => skLv(k) > 0);
        }

        function nodeState(id) {
            if (id === 'core') return 'core';
            if (!isNodeVisible(id)) return 'hidden';
            const lv = skLv(id), s = SK[id];
            if (lv >= s.max) return 'maxed';
            if (lv > 0) {
                // Can afford next level? Add affordable class via extra logic in render
                return 'allocated';
            }
            if (canUnlock(id)) {
                const cost = skCost(id, lv);
                return S.np >= cost ? 'affordable' : 'available';
            }
            return 'locked';
        }

        function openSkills() {
            hideAll();
            prevVisible = new Set(Object.keys(TREE_POS).filter(isNodeVisible));
            renderTree();
        }

        function renderTree() {
            const el = $('#skillModal');
            el.hidden = false;
            const modal = el.querySelector('.modal');
            const betweenRounds = R && (R.phase === 'won' || R.phase === 'lost');
            const contBtn = betweenRounds ? `<button class="game-btn primary" onclick="hideModal('skillModal');startRound()" style="padding:8px 18px;font-size:.8rem">▶ ${R.phase === 'won' ? 'Round' : 'Retry'} ${S.round} →</button>` : '';

            // Build SVG edges
            let svgEdges = '';
            TREE_EDGES.forEach(e => {
                const fp = TREE_POS[e.f], tp = TREE_POS[e.t];
                if (!fp || !tp) return;
                const fVis = isNodeVisible(e.f) || e.f === 'core', tVis = isNodeVisible(e.t);
                if (!fVis && !tVis) return;
                const fState = nodeState(e.f), tState = nodeState(e.t);
                const bright = (fState === 'allocated' || fState === 'maxed' || fState === 'core') && (tState === 'allocated' || tState === 'maxed');
                const active = fVis && tVis && tState !== 'hidden';
                const isNew = tVis && !prevVisible.has(e.t);
                const cls = isNew ? 'reveal' : (bright ? 'bright' : (active ? 'active' : ''));
                const bc = SK[e.t] ? BRANCHES[SK[e.t].b].color : '#a78bfa';
                svgEdges += `<line class="tree-edge ${cls}" x1="${fp.x}" y1="${fp.y}" x2="${tp.x}" y2="${tp.y}" stroke="${bc}" style="--ec:${bc}"/>`;
            });

            // Build nodes
            let nodes = '';
            // Branch labels
            Object.entries(BRANCH_LABELS).forEach(([b, lb]) => {
                nodes += `<div class="branch-label" style="left:${lb.x}px;top:${lb.y}px;--nc:${BRANCHES[b].color}">${lb.name}</div>`;
            });
            // Core
            const cp = TREE_POS.core;
            nodes += `<div class="tree-node core" style="left:${cp.x}px;top:${cp.y}px"><span>🧠</span><div class="nd-name">Neural Core</div></div>`;
            // Skill nodes
            Object.entries(SK).forEach(([id, s]) => {
                const p = TREE_POS[id];
                if (!p) return;
                const st = nodeState(id), lv = skLv(id), bc = BRANCHES[s.b].color;
                const isNew = isNodeVisible(id) && !prevVisible.has(id);
                const cls = `tree-node ${st}${isNew ? ' reveal-anim' : ''}`;
                const lvBadge = lv > 0 ? `<div class="nd-lvl" style="background:${st === 'maxed' ? '#fbbf24' : bc}">${lv}</div>` : '';
                nodes += `<div class="${cls}" style="left:${p.x}px;top:${p.y}px;--nc:${bc}" data-sk="${id}" onclick="showNodePopup(event,'${id}')">
            <span>${s.icon}</span>${lvBadge}<div class="nd-name">${s.name}</div>
        </div>`;
            });

            modal.innerHTML = `
        <div class="tree-hud">
            <div style="display:flex;gap:8px;align-items:center">
                <button class="close-x" onclick="closeSkillsAndResume()" style="position:static">✕</button>
                <span style="font-weight:800;font-size:.9rem">🌳 Skill Tree</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
                ${contBtn}
                <div class="np-pill">⬡ ${S.np.toLocaleString()}</div>
                <div class="tree-zoom">
                    <button onclick="treeZoomBy(-.1)">−</button>
                    <button onclick="treeZoomBy(.1)">+</button>
                </div>
            </div>
        </div>
        <div class="tree-viewport" id="treeVP">
            <div class="tree-world" id="treeWorld">
                <svg class="tree-svg" viewBox="0 0 1400 1050">${svgEdges}</svg>
                ${nodes}
            </div>
        </div>`;

            applyTreeTransform();
            initTreePan();
            // Update prevVisible
            prevVisible = new Set(Object.keys(TREE_POS).filter(isNodeVisible));
            if (R) updateHUD();
        }

        function applyTreeTransform() {
            const w = $('#treeWorld');
            if (!w) return;
            w.style.transform = `translate(${treePan.x}px,${treePan.y}px) scale(${treeZoom})`;
        }

        window.treeZoomBy = function (d) {
            treeZoom = Math.max(.3, Math.min(1.2, treeZoom + d));
            applyTreeTransform()
        };

        function zoomAtPoint(delta, cx, cy) {
            const vp = $('#treeVP');
            if (!vp) return;
            const rect = vp.getBoundingClientRect();
            const px = cx - rect.left, py = cy - rect.top;
            // World point under cursor
            const wx = (px - treePan.x) / treeZoom, wy = (py - treePan.y) / treeZoom;
            const oldZ = treeZoom;
            treeZoom = Math.max(.3, Math.min(1.2, treeZoom + delta));
            // Adjust pan so same world point stays under cursor
            treePan.x = px - wx * treeZoom;
            treePan.y = py - wy * treeZoom;
            applyTreeTransform();
        }

        function initTreePan() {
            const vp = $('#treeVP');
            if (!vp) return;
            // Center the tree initially
            const vr = vp.getBoundingClientRect();
            treePan.x = (vr.width - 1400 * treeZoom) / 2;
            treePan.y = (vr.height - 1050 * treeZoom) / 2;
            applyTreeTransform();

            let drag = null;
            vp.onmousedown = e => {
                if (e.target === vp || e.target.closest('.tree-world') && !e.target.closest('.tree-node') && !e.target.closest('.nd-popup')) {
                    drag = {x: e.clientX - treePan.x, y: e.clientY - treePan.y};
                    activePopup?.remove();
                    activePopup = null
                }
            };
            vp.onmousemove = e => {
                if (drag) {
                    treePan.x = e.clientX - drag.x;
                    treePan.y = e.clientY - drag.y;
                    applyTreeTransform()
                }
            };
            vp.onmouseup = () => {
                drag = null
            };
            vp.onmouseleave = () => {
                drag = null
            };

            // Touch: 1-finger pan, 2-finger pinch-to-zoom at midpoint
            let touchDrag = null, lastPinchDist = 0;
            vp.ontouchstart = e => {
                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    touchDrag = {x: t.clientX - treePan.x, y: t.clientY - treePan.y};
                } else if (e.touches.length === 2) {
                    touchDrag = null;
                    lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                }
            };
            vp.ontouchmove = e => {
                if (e.touches.length === 1 && touchDrag) {
                    const t = e.touches[0];
                    treePan.x = t.clientX - touchDrag.x;
                    treePan.y = t.clientY - touchDrag.y;
                    applyTreeTransform();
                    e.preventDefault();
                } else if (e.touches.length === 2) {
                    e.preventDefault();
                    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    const delta = (dist - lastPinchDist) * 0.003;
                    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    zoomAtPoint(delta, mx, my);
                    lastPinchDist = dist;
                }
            };
            vp.ontouchend = e => {
                if (e.touches.length < 2) lastPinchDist = 0;
                if (e.touches.length === 0) touchDrag = null
            };

            // Wheel zoom centered on cursor
            vp.onwheel = e => {
                e.preventDefault();
                zoomAtPoint(e.deltaY > 0 ? -.06 : .06, e.clientX, e.clientY)
            };
        }

        window.showNodePopup = function (e, id) {
            e.stopPropagation();
            activePopup?.remove();
            const s = SK[id], st = nodeState(id);
            if (st === 'hidden') return;
            const lv = skLv(id), maxed = lv >= s.max, can = canUnlock(id);
            const cost = maxed ? 0 : skCost(id, lv);
            const bc = BRANCHES[s.b].color;
            const descText = lv > 0 ? s.desc(lv) : s.desc(1);
            const nextText = !maxed && lv > 0 && lv < s.max ? `<div class="pp-next">Next: ${s.desc(lv + 1)}</div>` : '';
            let reqText = '';
            if (s.req && !can) reqText = `<div class="pp-req">🔒 Requires: ${Object.entries(s.req).map(([k, v]) => `${SK[k].name} Lv${v}`).join(', ')}</div>`;

            const affordable = can && S.np >= cost;
            let btnHtml = '';
            if (maxed) btnHtml = `<button class="upgrade-btn maxed" disabled>✓ MAX</button>`;
            else if (!can) btnHtml = `<button class="upgrade-btn" disabled>🔒 Locked</button>`;
            else btnHtml = `<button class="upgrade-btn" ${!affordable ? 'disabled' : ''} onclick="doUpgrade('${id}')">⬡ ${cost.toLocaleString()}</button>`;

            const popup = document.createElement('div');
            popup.className = 'nd-popup';
            popup.style.setProperty('--nc', bc);
            popup.innerHTML = `
        <div class="pp-head"><div class="pp-icon">${s.icon}</div><div><div class="pp-name">${s.name}</div><div class="pp-lvl">Lv ${lv}${s.max < 99 ? ' / ' + s.max : ''} · ${BRANCHES[s.b].name}</div></div></div>
        <div class="pp-desc">${descText}</div>
        ${nextText}${reqText}${btnHtml}`;

            // Position near the node
            const p = TREE_POS[id];
            popup.style.left = (p.x + 40) + 'px';
            popup.style.top = (p.y - 30) + 'px';
            $('#treeWorld').appendChild(popup);
            activePopup = popup;

            // Close on click outside
            const closeHandler = ev => {
                if (!popup.contains(ev.target) && !ev.target.closest(`[data-sk="${id}"]`)) {
                    popup.remove();
                    activePopup = null;
                    document.removeEventListener('mousedown', closeHandler)
                }
            };
            setTimeout(() => document.addEventListener('mousedown', closeHandler), 50);
        };

        window.doUpgrade = function (id) {
            const s = SK[id], lv = skLv(id);
            if (lv >= s.max || !canUnlock(id)) return;
            const cost = skCost(id, lv);
            if (S.np < cost) return;
            S.np -= cost;
            S.skills[id] = (lv || 0) + 1;
            saveState();
            snd('upgrade');
            toast(`${s.name} → Lv ${S.skills[id]}`, "⬆️");

            // Particle burst on the node
            burstAt($(`[data-sk="${id}"]`), BRANCHES[s.b].color, 16);

            // Re-render tree (this will detect newly visible nodes and animate them)
            renderTree();

            // Re-open the popup for the same skill so the player can chain upgrades
            const nodeEl = $(`[data-sk="${id}"]`);
            if (nodeEl) {
                const fakeEvent = {
                    stopPropagation: () => {
                    }
                };
                showNodePopup(fakeEvent, id);
            }
        };

        window.closeSkillsAndResume = function () {
            activePopup?.remove();
            activePopup = null;
            hideModal('skillModal');
            if (R && R.phase === 'paused') resumeRound();
            updateHUD();
        };

        /* ════════════════════ SAVE MANAGEMENT ════════════════════ */
        window.resetSave = function () {
            if (!confirm('Reset ALL progress? This cannot be undone.')) return;
            localStorage.removeItem(SAVE_KEY);
            S = JSON.parse(JSON.stringify(defaultState));
            R = null;
            clearInterval(timerInt);
            clearInterval(shuffleInt);
            clearInterval(sixthInt);
            hideAll();
            showWelcome();
        };

        /* ════════════════════ EVENTS ════════════════════ */
        function showWelcome() {
            const el = $('#welcomeModal');
            el.hidden = false;
            if (S.round > 1) {
                el.querySelector('h2').textContent = 'Welcome Back';
                el.querySelector('.game-btn.primary').textContent = `Continue Round ${S.round} →`;
            }
        }

        $('#startBtn').addEventListener('click', startRound);
        $('#nextRoundBtn').addEventListener('click', startRound);
        $('#skillBtn').addEventListener('click', () => {
            if (R && R.phase === 'playing') pauseRound();
            openSkills()
        });
        $('#hintBtn').addEventListener('click', usePeek);
        $('#bombBtn').addEventListener('click', useBomb);
        $('#pauseBtn').addEventListener('click', pauseRound);
        $('#soundBtn').addEventListener('click', () => {
            S.sound = !S.sound;
            saveState();
            $('#soundBtn').textContent = S.sound ? '🔊' : '🔇';
            toast(S.sound ? 'Sound on' : 'Sound off', S.sound ? '🔊' : '🔇')
        });
        $('#soundBtn').textContent = S.sound ? '🔊' : '🔇';

// Expose for onclick in modals
        window.startRound = startRound;
        window.openSkills = openSkills;
        window.resumeRound = resumeRound;

        document.addEventListener('keydown', e => {
            if (e.repeat) return;
            const k = e.key.toLowerCase();
            const anyModal = $$('.modal-bg').find(m => !m.hidden);
            if (k === 'p' && !$('#pauseModal').hidden) {
                e.preventDefault();
                resumeRound()
            } else if (k === 'p' && !anyModal && R?.phase === 'playing') {
                e.preventDefault();
                pauseRound()
            }
            if (k === 's') {
                e.preventDefault();
                if (R && R.phase === 'playing') pauseRound();
                openSkills()
            }
            if (k === 'h' && !anyModal) {
                e.preventDefault();
                usePeek()
            }
            if (k === 'b' && !anyModal) {
                e.preventDefault();
                useBomb()
            }
            if (e.key === 'Escape' && !$('#skillModal').hidden) {
                closeSkillsAndResume()
            } else if (e.key === 'Escape' && R?.phase === 'playing') {
                pauseRound()
            }
            // 1-9 hotkeys for active abilities during gameplay
            if (!anyModal && R?.phase === 'playing') {
                const n = parseInt(e.key);
                if (n >= 1 && n <= 9) {
                    e.preventDefault();
                    const actions = [usePeek, useBomb]; // 1=peek, 2=bomb, more can be added
                    if (actions[n - 1]) actions[n - 1]();
                }
            }
            // In skill tree: 1-6 to switch branches
            if (!$('#skillModal').hidden) {
                const n = parseInt(e.key);
                if (n >= 1 && n <= 6) {
                    e.preventDefault();
                    // no-op for now, tree is visual not tabbed
                }
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && R?.phase === 'playing') pauseRound()
        });
        addEventListener('resize', () => {
            if (R && R.cardEls.length > 0) {/* re-layout */
                const lay = getLayout(R.deck.length);
                $('#board').style.gridTemplateColumns = `repeat(${lay.cols},var(--cw))`;
                $('#board').style.setProperty('--cw', lay.sz + 'px');
                $('#board').style.setProperty('--ch', Math.round(lay.sz * 1.28) + 'px');
                $('#board').style.setProperty('--cr', Math.max(3, Math.round(lay.sz * .15)) + 'px');
                $('#board').style.setProperty('--gap', lay.gap + 'px')
            }
        });

// Init
        updateHUD();
        showWelcome();

    })();
</script>
<script src="../logo.js"></script>
</body>
</html>
