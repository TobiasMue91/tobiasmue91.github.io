<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fling</title>
<meta name="description" content="Fling a flock of paper birds from a slingshot at towers of wood, stone and ice, and pop every toad hiding inside. Twenty handmade levels, bird powers, powder kegs and three stars each.">
<meta name="theme-color" content="#fdf0d3">
<style>
:root{--ink:#2b1d38;--cream:#fff6e3;--paper:#fffaf0;--pers:#ff6a3d;--pers2:#d94a24;--font:"Arial Rounded MT Bold","Nunito","Varela Round",ui-rounded,"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fdf0d3;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--pers);outline-offset:3px}
/* paper tags: ink cut, cream face, hard shadow */
.chip{background:var(--ink);padding:3px;clip-path:polygon(0 9px,9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px));font-weight:900}
.chip>.in{width:100%;height:100%;background:var(--paper);display:flex;align-items:center;gap:10px;padding:0 13px;clip-path:polygon(0 7px,7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px))}
.sh{filter:drop-shadow(4px 5px 0 rgba(43,29,56,.35))}
#bar{zoom:var(--z,1);position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 14px);pointer-events:none;transition:opacity .3s}
#bar>*{pointer-events:auto}
body.over #bar{opacity:0;pointer-events:none}
#menu{flex:none;width:54px;height:54px;transform:rotate(-2deg);transition:transform .12s}
#menu:active{transform:rotate(-2deg) scale(.92)}
#menu .in{justify-content:center;padding:0}
#menu i{display:block;width:24px;height:4px;border-radius:2px;background:var(--ink);box-shadow:0 -8px 0 var(--ink),0 8px 0 var(--ink)}
#lvl{height:54px;transform:rotate(1.2deg)}
#lvl b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
#pips{display:flex;gap:7px;padding-top:4px}
#pips i{width:27px;height:27px;border-radius:50%;background:#b7e84a;border:2.5px solid #1d3a16;position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#pips i::before,#pips i::after{content:"";position:absolute;top:-5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #1d3a16}
#pips i::before{left:-3px}#pips i::after{right:-3px}
#pips i.dead{background:transparent;border-style:dashed;opacity:.45;transform:scale(.8)}
#pips i.dead::before,#pips i.dead::after{display:none}
#score{height:54px;font-size:26px;font-variant-numeric:tabular-nums;line-height:1;transform:rotate(-1deg)}
#score.bump #scoreNum{animation:bump .25s ease-out}
@keyframes bump{0%{transform:scale(1.25)}100%{transform:scale(1)}}
#stars,.st{display:flex;gap:1px}
#stars s,.st s{display:block;width:24px;height:24px;background:#cfc29f;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);transition:background .2s,transform .3s cubic-bezier(.3,1.7,.5,1)}
#stars s.on,.st s.on{background:#ffb81c;transform:scale(1.15)}
@media(max-width:520px){#bar{gap:6px}#menu{width:48px;height:48px}#lvl,#score{height:48px}#lvl .in{gap:8px;padding:0 9px}#lvl b{font-size:29px}#pips{gap:7px}#pips i{width:23px;height:23px}#score{font-size:25px}#score .in{gap:5px;padding:0 9px}#stars s{width:19px;height:19px}}
/* result card */
#res{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;visibility:hidden;background:rgba(43,29,56,0);transition:background .3s,visibility 0s .3s}
#res.on{visibility:visible;pointer-events:auto;background:rgba(43,29,56,.35);transition:background .3s}
#res .card{zoom:var(--z,1);width:min(86vw/var(--z,1),380px);transform:translateY(-120%) rotate(-3deg);transition:transform .55s cubic-bezier(.2,1.25,.4,1)}
#res.on .card{transform:translateY(0) rotate(-1deg)}
#res .card>.in{flex-direction:column;align-items:center;justify-content:center;padding:22px 22px 24px;gap:6px;text-align:center}
#rTitle{font-size:clamp(30px,8vw,40px);line-height:1}
#rSub{font-size:16px;opacity:.75;min-height:1.2em}
#rStars{display:flex;gap:6px;margin:10px 0 2px}
#rStars s{display:block;width:62px;height:62px;background:#e0d5bb;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);transform:scale(.85)}
#rStars s:nth-child(2){margin-top:-12px}
#rStars s.on{background:#ffb81c;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(2.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#rScore{font-size:44px;font-variant-numeric:tabular-nums;line-height:1.05}
#rBest{font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;min-height:1.2em}
.btns{display:flex;gap:12px;margin-top:12px;align-items:center}
.btn{height:58px;padding:3px;font-size:20px;display:flex;align-items:stretch;color:var(--ink);transition:transform .1s}
.btn .in{height:auto;flex:1;justify-content:center;font-size:26px}
.btn:active{transform:scale(.93)}
.btn.go{flex:1;min-width:150px}
.btn.go .in{background:var(--pers);color:#fff;padding:0 26px;font-size:24px}
.btn.sq{width:58px}
.btn.sq .in{padding:0}

#res.lost #rStars,#res.lost #rBest{display:none}
#res.lost #rScore{font-size:26px;opacity:.7}
#res.lost #rSub{font-size:20px;opacity:.85}
#res.lost #rRetry{flex:1;min-width:170px;width:auto}
#res.lost #rRetry .in{background:var(--pers);color:#fff;font-size:24px;padding:0 24px}
#res.lost #rRetry .in::after{content:"Try again";margin-left:10px;font-size:22px}
#res.lost #rMap{order:-1}
#res.won #rSub{display:none}
#res.won #rToad{display:none!important}
/* map */
#map{zoom:var(--z,1);position:fixed;inset:0;background:rgba(253,240,211,.96);visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s;overflow:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 14px) 16px 28px;-webkit-overflow-scrolling:touch}
#map.on{visibility:visible;opacity:1;transition:opacity .25s}
#map header{display:flex;align-items:center;justify-content:space-between;max-width:620px;margin:0 auto 6px;gap:10px}
#map h2{margin:0;font-size:32px;transform:rotate(-1.5deg)}
#map header .r{display:flex;align-items:center;gap:12px}
#mapTotal{font-size:18px;font-variant-numeric:tabular-nums}
#snd{width:48px;height:48px}#snd .in{justify-content:center;padding:0;font-size:22px}
#snd.off .in{opacity:.5}
#snd svg{width:24px;height:24px}
#mapClose{width:48px;height:48px}#mapClose .in{justify-content:center;padding:0;font-size:26px;line-height:1}
#mapGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 12px;max-width:620px;margin:0 auto}
#mapGrid h3{grid-column:1/-1;margin:14px 0 0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
#mapGrid h3::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.25;border-radius:2px}
.tag{aspect-ratio:1/1.05;background:var(--ink);padding:3px;clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));display:block;position:relative;transition:transform .1s}
.tag{filter:none}
.tag:active:not(:disabled){transform:scale(.94)}
.tag>*{position:relative}
.tag::before{content:"";position:absolute;inset:3px;background:var(--paper);clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))}
.tag b{display:block;font-size:28px;margin-top:12%}
.tag .st{justify-content:center;margin-top:6px}
.tag .st s{width:17px;height:17px}
.tag.cur::before{background:#ffe2c9}
.tag.lock{opacity:.4}
.tag.lock b{opacity:.5}
.tag:disabled{cursor:default}
@media(max-width:420px){#mapGrid{gap:12px 9px}.tag b{font-size:24px}.tag .st s{width:14px;height:14px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}#res .card{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Fling game board"></canvas>
<div id="bar">
  <button class="chip sh" id="menu" aria-label="Levels"><span class="in"><i></i></span></button>
  <div class="chip sh" id="lvl"><span class="in"><b id="lvlName">1</b><span id="pips"></span></span></div>
  <div class="chip sh" id="score"><span class="in"><span id="stars"><s></s><s></s><s></s></span><span id="scoreNum">0</span></span></div>
</div>
<div id="res"><div class="chip sh card"><div class="in">
  <canvas id="rToad" width="120" height="100" style="display:none;margin-bottom:-4px"></canvas><div id="rTitle">Cleared!</div><div id="rSub"></div>
  <div id="rStars"><s></s><s></s><s></s></div>
  <div id="rScore">0</div><div id="rBest"></div>
  <div class="btns">
    <button class="chip sh btn sq" id="rMap" aria-label="Levels"><span class="in">&#9776;</span></button>
    <button class="chip sh btn sq" id="rRetry" aria-label="Retry"><span class="in">&#8635;</span></button>
    <button class="chip sh btn go" id="rNext"><span class="in">Next &#9654;</span></button>
  </div>
</div></div></div>
<div id="map">
  <header><h2>Fling</h2><div class="r"><span id="mapTotal"></span>
    <button class="chip sh" id="snd" aria-label="Sound"><span class="in"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1d38" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#2b1d38"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></span></button>
    <button class="chip sh" id="mapClose" aria-label="Close"><span class="in">&times;</span></button></div></header>
  <div id="mapGrid"></div>
</div>
<script id="core">
// ---- FL: the rules of Fling. No DOM, no clock, no randomness: a throw is a pure function of the level and the pull. ----
const FL = (() => {
  const G = 12, DT = 1 / 120, ITER = 10, SLING = { x: 4.2, y: 2.55 }, MAXPULL = 2.4, MINPULL = .35, POWER = 8.6;
  const MAT = {
    wood:  { dens: .7,  fric: .6,  thr: 1.7, scale: 7,  pts: 500 },
    stone: { dens: 2.2, fric: .7,  thr: 5.5, scale: 16, pts: 800 },
    ice:   { dens: .55, fric: .1,  thr: .9,  scale: 2.6, pts: 300 },
    keg:   { dens: .9,  fric: .5,  thr: 1.6, scale: 3,  pts: 800 },
    toad:  { dens: .8,  fric: .6,  thr: 1.2, scale: 3.4, pts: 5000 },
    bird:  { dens: 2.4, fric: .6,  thr: 1e9, scale: 1,  pts: 0 }
  };
  const BIRDS = {
    finch:   { r: .45, dens: 2.4 },
    swift:   { r: .4,  dens: 2.2 },
    triplet: { r: .38, dens: 2.4 },
    bomb:    { r: .52, dens: 3.0 }
  };
  const BONUS = 10000;

  // ---------- bodies ----------
  function mk(w, o) {
    const b = Object.assign({ id: ++w.nid, k: 'block', mat: 'wood', x: 0, y: 0, a: 0, vx: 0, vy: 0, w: 0, hw: 0, hh: 0, r: 0, circle: false, static: false, awake: true, sleepT: 0, dmg: 0, flash: 0, age: 0, touched: false, fuse: -1, rest: 0 }, o);
    const m = MAT[b.mat];
    if (b.circle) { b.mass = Math.PI * b.r * b.r * (o.dens || m.dens); b.inertia = .5 * b.mass * b.r * b.r; b.br = b.r; }
    else { b.mass = 4 * b.hw * b.hh * m.dens; b.inertia = b.mass * (4 * b.hw * b.hw + 4 * b.hh * b.hh) / 12; b.br = Math.hypot(b.hw, b.hh); }
    if (b.static) { b.im = 0; b.ii = 0; } else { b.im = 1 / b.mass; b.ii = 1 / b.inertia; }
    w.bodies.push(b);
    return b;
  }
  function addItem(w, it) {
    const [k, a, b, c, d, e] = it;
    if (k === 'toad') return mk(w, { k: 'toad', mat: 'toad', circle: true, x: a, y: b + (c || .5), r: c || .5 });
    if (k === 'keg') return mk(w, { k: 'keg', mat: 'keg', x: a, y: b + .5, hw: .5, hh: .5 });
    // [mat, x, bottom, w, h, angle]
    return mk(w, { k: 'block', mat: k, x: a, y: b + d / 2, hw: c / 2, hh: d / 2, a: e || 0 });
  }

  // ---------- levels ----------
  // items: ['wood'|'stone'|'ice', cx, bottom, w, h] | ['toad', cx, bottom, r] | ['keg', cx, bottom]
  const T = .5; // plank thickness
  const post = (m, x, y, h) => [m, x, y, T, h];
  const beam = (m, x, y, w) => [m, x, y, w, T];
  // levels are authored with the first structure near x = 15; LEAD pulls everything toward the sling so a portrait phone sees it
  const LEAD = 2.5;
  function level(world, birds, items, par, width) { items = items.map(it => [it[0], it[1] - LEAD, ...it.slice(2)]); return { world, birds, items, par, width: width || Math.ceil(Math.max(20, ...items.map(it => it[1])) + 9) }; }
  const LEVELS = [];

  function createWorld(spec) {
    const w = { spec, t: 0, nid: 0, bodies: [], arb: new Map(), queue: spec.birds.slice(), active: [], over: null, score: 0, quiet: 0, clearedAt: -1, bonusBirds: 0, shots: 0, ev: [], width: spec.width, toads: 0, launchedAt: -1 };
    mk(w, { k: 'ground', mat: 'stone', static: true, x: spec.width / 2, y: -2, hw: spec.width / 2 + 40, hh: 2 });
    for (const it of spec.items) addItem(w, it);
    w.toads = w.bodies.filter(b => b.k === 'toad').length;
    return w;
  }

  // ---------- collision ----------
  function poly(b) {
    const c = Math.cos(b.a), s = Math.sin(b.a), hw = b.hw, hh = b.hh;
    const loc = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]], nl = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    return { v: loc.map(p => [b.x + c * p[0] - s * p[1], b.y + s * p[0] + c * p[1]]), n: nl.map(p => [c * p[0] - s * p[1], s * p[0] + c * p[1]]) };
  }
  function maxSep(A, B) {
    let best = -1e9, bi = 0;
    for (let i = 0; i < 4; i++) {
      const n = A.n[i], v = A.v[i]; let mn = 1e9;
      for (let j = 0; j < 4; j++) { const d = n[0] * (B.v[j][0] - v[0]) + n[1] * (B.v[j][1] - v[1]); if (d < mn) mn = d; }
      if (mn > best) { best = mn; bi = i; }
    }
    return [best, bi];
  }
  const MARGIN = .02;
  function boxBox(a, b) {
    if (Math.hypot(a.x - b.x, a.y - b.y) > a.br + b.br) return null;
    const A = poly(a), B = poly(b), [sa, ia] = maxSep(A, B); if (sa > MARGIN) return null;
    const [sb, ib] = maxSep(B, A); if (sb > MARGIN) return null;
    let R, I, ri, flip;
    if (sb > .95 * sa + .005) { R = B; I = A; ri = ib; flip = true; } else { R = A; I = B; ri = ia; flip = false; }
    const rn = R.n[ri];
    let ii = 0, md = 1e9;
    for (let i = 0; i < 4; i++) { const d = rn[0] * I.n[i][0] + rn[1] * I.n[i][1]; if (d < md) { md = d; ii = i; } }
    let p1 = I.v[ii], p2 = I.v[(ii + 1) % 4];
    const r1 = R.v[ri], r2 = R.v[(ri + 1) % 4];
    let tx = r2[0] - r1[0], ty = r2[1] - r1[1]; const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
    // clip to side planes
    let pts = [p1, p2];
    pts = clip(pts, tx, ty, tx * r1[0] + ty * r1[1]); if (pts.length < 2) return null;
    pts = clip(pts, -tx, -ty, -(tx * r2[0] + ty * r2[1])); if (pts.length < 2) return null;
    const out = [];
    for (const p of pts) {
      const sep = rn[0] * (p[0] - r1[0]) + rn[1] * (p[1] - r1[1]);
      if (sep <= MARGIN) out.push({ x: p[0], y: p[1], nx: flip ? -rn[0] : rn[0], ny: flip ? -rn[1] : rn[1], sep });
    }
    return out.length ? out : null;
  }
  function clip(pts, nx, ny, off) { // keep points with dot(n,p) >= off
    const [p, q] = pts, dp = nx * p[0] + ny * p[1] - off, dq = nx * q[0] + ny * q[1] - off;
    const out = []; if (dp >= 0) out.push(p); if (dq >= 0) out.push(q);
    if (dp * dq < 0) { const t = dp / (dp - dq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
    return out;
  }
  function circleBox(c, b) { // normal from box to circle
    if (Math.hypot(c.x - b.x, c.y - b.y) > c.br + b.br) return null;
    const co = Math.cos(b.a), si = Math.sin(b.a), dx = c.x - b.x, dy = c.y - b.y;
    const lx = co * dx + si * dy, ly = -si * dx + co * dy;
    const cx = Math.max(-b.hw, Math.min(b.hw, lx)), cy = Math.max(-b.hh, Math.min(b.hh, ly));
    let nx, ny, sep;
    if (cx === lx && cy === ly) { // centre inside the box: push out along the shallowest axis
      const px = b.hw - Math.abs(lx), py = b.hh - Math.abs(ly);
      if (px < py) { nx = lx < 0 ? -1 : 1; ny = 0; sep = -px - c.r; } else { nx = 0; ny = ly < 0 ? -1 : 1; sep = -py - c.r; }
    } else {
      const ddx = lx - cx, ddy = ly - cy, d = Math.hypot(ddx, ddy); if (d > c.r + MARGIN) return null;
      nx = ddx / d; ny = ddy / d; sep = d - c.r;
    }
    const wx = co * nx - si * ny, wy = si * nx + co * ny; // normal in world, box -> circle
    const px = b.x + co * cx - si * cy, py = b.y + si * cx + co * cy;
    return [{ x: px, y: py, nx: wx, ny: wy, sep }];
  }
  function circleCircle(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), s = d - a.r - b.r; if (s > MARGIN) return null;
    const nx = d > 1e-9 ? dx / d : 0, ny = d > 1e-9 ? dy / d : 1;
    return [{ x: a.x + nx * (a.r + s / 2), y: a.y + ny * (a.r + s / 2), nx, ny, sep: s }];
  }
  function collide(a, b) { // contacts with normal from a to b
    if (!a.circle && !b.circle) return boxBox(a, b);
    if (a.circle && b.circle) return circleCircle(a, b);
    if (a.circle) { const cs = circleBox(a, b); return cs && cs.map(c => ({ x: c.x, y: c.y, nx: -c.nx, ny: -c.ny, sep: c.sep })); }
    return circleBox(b, a);
  }

  // ---------- step ----------
  function wake(b) { if (!b.static) { b.awake = true; b.sleepT = 0; } }
  function emit(w, e) { w.ev.push(e); }
  function wakeNeighbours(w, b) { for (const ar of w.arb.values()) { if (ar.a === b) wake(ar.b); else if (ar.b === b) wake(ar.a); } }

  function explode(w, x, y, R, S, D, src) {
    emit(w, { t: 'boom', x, y, r: R });
    for (const b of w.bodies) {
      if (b === src || b.static || b.dead) continue;
      const d = Math.hypot(b.x - x, b.y - y) - (b.circle ? b.r : Math.min(b.hw, b.hh) * .6);
      if (d > R) continue;
      const f = 1 - Math.max(0, d) / R, dd = Math.hypot(b.x - x, b.y - y) || 1;
      wake(b); b.touched = true;
      b.vx += (b.x - x) / dd * S * f * b.im * (b.k === 'bird' ? .15 : 1) * .5;
      b.vy += ((b.y - y) / dd * .8 + .45) * S * f * b.im * (b.k === 'bird' ? .15 : 1) * .5;
      b.w = (b.w || 0) + ((b.x - x) > 0 ? -1 : 1) * 3 * f;
      if (b.k !== 'bird') hurt(w, b, D * f * f);
    }
  }
  function hurt(w, b, amt) {
    if (b.dead || b.static || amt <= 0) return;
    b.dmg += amt; b.flash = .12;
    if (b.dmg >= 1) destroy(w, b);
  }
  function destroy(w, b) {

    band(TF, pouch, bw + .02, '#7a3b33');
    slingFork(true);
    // bodies
    for (const b of w.bodies) {
      if (b.static) continue; const [x, y, a] = lerpA(b, alpha);
      if (b.k === 'bird') { const ang = b.touched ? a : Math.atan2(b.vy, b.vx); drawBird(b.kind, b.r, x, y, ang, 2, b.touched ? 0 : Math.max(0, 1 - b.age / .22)); if (!b.used && b.kind !== 'finch' && !b.touched && phase === 'flight') {
        if ((tips[b.kind] || 0) <= 3 && b.age < 2.4) { ctx.save(); ctx.textAlign = 'center'; ctx.font = `900 ${Math.max(22, ppm * .75)}px ${FONT}`; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2b1d38'; ctx.fillStyle = '#fff6e3'; const ty = sy(y) - b.r * ppm * 2.2 - Math.sin(time * 9) * 4; ctx.strokeText('TAP!', sx(x), ty); ctx.fillText('TAP!', sx(x), ty); ctx.restore(); } const k = (time * 2.2) % 1; ctx.strokeStyle = 'rgba(255,246,227,' + (1 - k) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx(x), sy(y), (b.r * 1.6 + k * .9) * ppm, 0, 7); ctx.stroke(); } }
      else if (b.k === 'toad') drawToad(b, x, y);
      else drawBlock(b, x, y, a);
    }
    // aim preview
    if (aim && aim.len > FL.MINPULL) { if (lastPull) dots(lastPull[0], lastPull[1], .28, 9); dots(aim.px, aim.py, 1, 6); }
    else if (hintPull) {
      dots(hintPull[0], hintPull[1], .9 * hintAl, 6);
      ctx.globalAlpha = hintAl; const X = sx(SL.x + hintPull[0] + .1), Y = sy(SL.y + hintPull[1] - .15);
      ctx.fillStyle = 'rgba(255,246,227,.55)'; ctx.strokeStyle = '#2b1d38'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(X, Y, .5 * ppm, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = 'rgba(255,106,61,.7)'; ctx.beginPath(); ctx.arc(X, Y, .24 * ppm, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    } else if (lastPull && phase === 'aim' && canAim() && !RM) dots(lastPull[0], lastPull[1], .3, 9);
    // particles
    for (const p of parts) {
      const k = p.t / p.life;
      if (p.k === 's') { ctx.save(); ctx.globalAlpha = Math.min(1, (1 - k) * 2.5); ctx.translate(sx(p.x), sy(p.y)); ctx.rotate(-p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2 * ppm, -p.h / 2 * ppm, p.w * ppm, p.h * ppm); ctx.strokeStyle = 'rgba(43,29,56,.5)'; ctx.lineWidth = 1; ctx.strokeRect(-p.w / 2 * ppm, -p.h / 2 * ppm, p.w * ppm, p.h * ppm); ctx.restore(); }
      else if (p.k === 'p') { ctx.globalAlpha = (1 - k) * .9; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.w * ppm * (.6 + k), 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
      else { ctx.globalAlpha = 1 - k; ctx.strokeStyle = p.c; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.w * ppm * (.3 + .7 * Math.sqrt(k)), 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    }
    // popups
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const p of pops) {
      const k = p.t / 1.3, up = 1 - Math.pow(1 - Math.min(1, p.t / .5), 3), s = (p.big ? 30 : 22) * Math.min(1.5, ppm / 40 + .5) * (p.t < .15 ? .6 + p.t / .15 * .5 : 1.1 - Math.min(.1, p.t * .1));
      ctx.globalAlpha = k > .7 ? 1 - (k - .7) / .3 : 1; ctx.font = `900 ${s}px ${FONT}`;
      const X = sx(p.x), Y = sy(p.y) - up * ppm * 1.2, tw = ctx.measureText(p.text).width + s * .7, th = s * 1.3;
      ctx.save(); ctx.translate(X, Y); ctx.rotate(p.big ? -.05 : .04);
      ctx.fillStyle = 'rgba(43,29,56,.35)'; ART.rr(ctx, -tw / 2 + 3, -th / 2 + 4, tw, th, th * .3); ctx.fill();
      ctx.fillStyle = p.big ? '#ffd34d' : '#fff6e3'; ctx.strokeStyle = '#2b1d38'; ctx.lineWidth = 3; ART.rr(ctx, -tw / 2, -th / 2, tw, th, th * .3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2b1d38'; ctx.fillText(p.text, 0, 1); ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ART.drawForeground(ctx, v, wi); ART.drawGrain(ctx, W, H);
    if (flashA > .01 && !RM) { ctx.fillStyle = 'rgba(255,246,227,' + flashA + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- loop ----------
  let last = performance.now(), frozen = false;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (w && !frozen) { update(dt); render(acc / FIXED); }
    requestAnimationFrame(frame);
  }

  // ---------- start ----------
  function firstOpen() {
    let i = 0; for (; i < LV.length; i++) if (!starsOf(i)) break;
    if (i >= LV.length) { try { i = +localStorage.getItem(KEY + '.last') || 0; } catch (e) { i = 0; } }
    return i;
  }
  const qs = new URLSearchParams(location.search), qi = parseInt(qs.get('level'), 10);
  resize();
  startLevel(qi > 0 ? Math.min(LV.length, qi) - 1 : firstOpen());
  window.FLING = { freeze: v => { frozen = v; }, get cam() { return camX; }, get home() { return home; }, screenOf: (x, y) => [sx(x), sy(y)], startLevel, get w() { return w; }, get phase() { return phase; }, step: dt => { update(dt); render(0); }, shot: (px, py) => { aim = null; const b = FL.launch(w, px, py); if (b) { lastPull = [px, py]; setPhase('flight'); } }, tap: () => FL.tapBird(w), openMap, setCam: x => { camX = x; } };
  requestAnimationFrame(frame);
})();
