<title>Stack Tower – Tap to Build the Sky-High Slab Tower</title>
<meta name="description" content="Stack Tower: a slab slides across the top of your tower, tap to drop it. Whatever overhangs is sliced off, so the tower narrows until you miss. Land dead centre to keep it wide, chain perfects into a rising melody, and climb from dawn through dusk to the stars.">

<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#7f9fd8;overscroll-behavior:none}

@keyframes pulse{50%{opacity:.65}}
#over{bottom:calc(max(env(safe-area-inset-bottom),0px) + 5vh);text-align:center;opacity:0;pointer-events:none;transition:opacity .06s ease;color:#fff6e4;text-shadow:0 3px 0 rgba(10,16,40,.45),0 0 22px rgba(10,16,40,.5)}
#over.show{opacity:1;transition:opacity .3s ease}
#over .big{font-weight:900;font-size:min(46vw,25vh,250px);line-height:.85;font-variant-numeric:tabular-nums}
#over .rec{font-weight:900;font-size:30px;letter-spacing:.16em;margin:6px 0 20px}

<script id="core">
// Stack Tower rules, DOM-free. One slab slides across the tower along x, then z, alternating. drop() cuts
// whatever overhangs, snaps a near-perfect landing, and widens the slab back after a run of perfects.
var STACK = (function () {
  var BASE = 10;        // width and depth of the first slab, in world units; every slab is 1 unit thick
  var RANGE = 7.5;      // how far either side of the tower's centre line the slab swings
  var TOL = 0.35;       // a drop this close to dead centre is perfect and snaps
  var GROW_AT = 4;      // perfects in a row before a perfect gives width back
  var GROW = 0.5;       // how much width a perfect gives back
  var MIN = 0.25;       // a sliver thinner than this is a miss

  function speedFor(n) { return Math.min(19, 5.2 + 0.2 * n); }

  // Position of a slab that has travelled p units along its path: a triangle wave, -RANGE..RANGE.
  // Written in p so any number of short steps equals one long one.
  function tri(p) {
    var P = 4 * RANGE, m = ((p % P) + P) % P;
    return m < 2 * RANGE ? m - RANGE : 3 * RANGE - m;
  }
  function top(s) { return s.layers[s.layers.length - 1]; }

  function arm(s) {
    s.axis = s.n % 2;                          // 0 slides along x, 1 along z
    s.p = (s.n % 4 < 2) ? 0 : 2 * RANGE;       // enters from alternate sides
    s.speed = speedFor(s.n);
  }
  function create() {
    var s = { layers: [{ cx: 0, cz: 0, w: BASE, d: BASE }], n: 0, combo: 0, perfects: 0, over: false, axis: 0, p: 0, speed: 0 };
    arm(s);
    return s;
  }
  function offset(s) { return tri(s.p); }
  // The sliding slab: where it is now, and how big.
  function block(s) {
    var t = top(s), o = tri(s.p);
    return s.axis === 0 ? { cx: t.cx + o, cz: t.cz, w: t.w, d: t.d } : { cx: t.cx, cz: t.cz + o, w: t.w, d: t.d };
  }
  function advance(s, dt) { if (!s.over && dt > 0) s.p += s.speed * dt; }

  // Drop the slab where it is. Returns what happened:
  //   miss    {piece}                       nothing overlapped (or a sliver): the game is over
  //   perfect {layer, combo, grown}         snapped to the tower below, maybe a little wider
  //   cut     {layer, piece}                the overhang became `piece`, which falls
  function drop(s) {
    if (s.over) return null;
    var t = top(s), off = tri(s.p), x = s.axis === 0;
    var size = x ? t.w : t.d, centre = x ? t.cx : t.cz;
    var ov = size - Math.abs(off);
    var b = block(s), ev;
    if (ov < MIN) {
      s.over = true;
      return { type: 'miss', piece: b, n: s.n };
    }
    var layer, size2, c2;
    if (Math.abs(off) <= TOL) {
      s.combo++; s.perfects++;
      var grown = s.combo >= GROW_AT ? Math.min(BASE - size, GROW) : 0;
      size2 = size + grown; c2 = centre;
      ev = { type: 'perfect', combo: s.combo, grown: grown };
    } else {
      s.combo = 0;
      size2 = ov; c2 = centre + off / 2;
      var sgn = off > 0 ? 1 : -1;
      var pc = centre + sgn * (size / 2 + Math.abs(off) / 2);
      ev = { type: 'cut', combo: 0, grown: 0,
             piece: x ? { cx: pc, cz: t.cz, w: Math.abs(off), d: t.d } : { cx: t.cx, cz: pc, w: t.w, d: Math.abs(off) } };
    }
    layer = x ? { cx: c2, cz: t.cz, w: size2, d: t.d } : { cx: t.cx, cz: c2, w: t.w, d: size2 };
    s.layers.push(layer);
    s.n++;
    arm(s);
    ev.layer = layer; ev.n = s.n; ev.axis = x ? 0 : 1; ev.off = off;
    return ev;
  }
  return { BASE: BASE, RANGE: RANGE, TOL: TOL, GROW_AT: GROW_AT, GROW: GROW, MIN: MIN,
           speedFor: speedFor, tri: tri, create: create, offset: offset, block: block, advance: advance, drop: drop };
})();
</script>

<script>
(function () {
  'use strict';
  var cv = document.getElementById('c'), x = cv.getContext('2d');
  var elScore = document.getElementById('score'), elTitle = document.getElementById('title'), elHint = document.getElementById('hint');
  var elFinal = document.getElementById('finalNum'), elOver = document.getElementById('over'), elRec = document.getElementById('rec'), elBest = document.getElementById('best');
  var elPop = document.getElementById('pop'), elSnd = document.getElementById('snd'), elLive = document.getElementById('live');
  var root = document.documentElement;
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- save -------------------------------------------------------------------------------
  var KEY = 'stack_tower_v2';
  var save = { best: 0, sound: true };
  try { var sv = JSON.parse(localStorage.getItem(KEY)); if (sv) { save.best = sv.best | 0; save.sound = sv.sound !== false; } } catch (e) {}
  // the old page kept its best (floors placed, counted the same way) under this key
  try { var old = parseInt(localStorage.getItem('stackHighScore'), 10); if (old > save.best) save.best = old; } catch (e) {}
  function store() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  // ---- projection: true isometric, one world unit = S px ----------------------------------
  var A = 0.7071, B = 0.4082, C = 0.8165;     // x/z across, x+z down, y up
  var W = 0, H = 0, S = 20, dpr = 1;
  var cam = { x: 0, z: 0, y: 0.5, zoom: 1, anchor: 0.7, sky: 0 };
  var px = 0, py = 0;
  function P(wx, wy, wz) {
    var k = S * cam.zoom;
    px = W / 2 + ((wx - cam.x) - (wz - cam.z)) * A * k;
    py = H * cam.anchor + ((wx - cam.x) + (wz - cam.z)) * B * k - (wy - cam.y) * C * k + kick * C * k * 0.5;
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    S = Math.min(W / 25, H / 30);
  }
  window.addEventListener('resize', resize); resize();

  // ---- colour -----------------------------------------------------------------------------
  // The tower's colour is tied to the sky it climbs through, so a slab always stands out from it:
  // warm coral against the pale dawn, amber on the blue day, teal on the violet dusk, rose, then gold on night.
  var HS = [[0, 8, 66, 60], [12, 38, 74, 58], [26, 170, 52, 52], [40, 332, 62, 64], [58, 44, 74, 66], [80, 200, 58, 68], [110, 8, 66, 60]];
  function slabColour(i) {
    i = i % 110;
    for (var k = 0; k < HS.length - 1; k++) {
      var a = HS[k], b = HS[k + 1];
      if (i <= b[0]) {
        var t = (i - a[0]) / (b[0] - a[0]), dh = b[1] - a[1];
        if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
        return [(a[1] + dh * t + 360) % 360, (a[2] + (b[2] - a[2]) * t) * (1 - 0.32 * Math.sin(Math.PI * t)), a[3] + (b[3] - a[3]) * t];
      }
    }
    return HS[0].slice(1);
  }
  var SKY = [[0, [140, 178, 236], [255, 206, 156]], [10, [64, 148, 228], [190, 228, 252]], [25, [100, 70, 164], [255, 140, 96]],
             [45, [22, 24, 70], [100, 64, 146]], [70, [4, 5, 14], [24, 18, 60]]];
  function skyAt(h) {
    for (var i = 0; i < SKY.length - 1; i++) {
      var a = SKY[i], b = SKY[i + 1];
      if (h <= b[0]) {
        var t = Math.max(0, (h - a[0]) / (b[0] - a[0])), o = [[], []];
        for (var k = 0; k < 2; k++) for (var j = 0; j < 3; j++) o[k][j] = a[k + 1][j] + (b[k + 1][j] - a[k + 1][j]) * t;
        return o;
      }
    }
    return [SKY[4][1].slice(), SKY[4][2].slice()];
  }
  function smooth(a, b, v) { var t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); }
  function rgb(a) { return 'rgb(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ')'; }
  function hsl(h, s, l) { return 'hsl(' + Math.round(h) + ',' + Math.round(s) + '%,' + Math.round(l) + '%)'; }

  // ---- state ------------------------------------------------------------------------------
  var game = STACK.create();
  var mode = 'ready';                // ready (first slab sliding, nothing placed) | play | over
  var hueShift = 0;
  var layerFx = [];                  // per layer: {dip, vel, flash}
  var pieces = [], rings = [], ghost = null, ghostA = 0;
  var countFrom = -1, kick = 0, freeze = 0, restartAt = -9, overAt = 0, lockUntil = 0, newBest = false, bestShown = save.best;
  var last = 0, time = 0;
  layerFx.push({ dip: 0, vel: 0, flash: 0 });

  // stars and clouds, fixed per page load
  var seed = 1234567;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var stars = [], clouds = [];
  for (var i = 0; i < 150; i++) stars.push({ x: rnd(), y: rnd() * 0.88, s: rnd(), p: rnd() * 6.28 });
  for (i = 0; i < 12; i++) clouds.push({ a: 2 + rnd() * 36, x: rnd(), d: i % 3, v: 0.4 + rnd() * 0.8 });

  // soft cloud sprites, drawn once: a few overlapping puffs with feathered edges, in a white and a dusk-peach set
  var cloudSprites = [[], []];
  (function () {
    var puffs = [[[0, 0, 56], [-38, 6, 38], [40, 8, 42], [-8, -12, 34], [18, -8, 28]], [[0, 0, 60], [-46, 8, 36], [50, 6, 34], [-16, -10, 30]], [[0, 0, 46], [-30, 6, 32], [34, 4, 30], [6, -14, 26], [-52, 10, 22]]];
    for (var t = 0; t < 2; t++) for (var k = 0; k < 3; k++) {
      var cvs = document.createElement('canvas'); cvs.width = 360; cvs.height = 160;
      var g = cvs.getContext('2d'), rgbT = t ? '255,206,190' : '255,255,255';
      puffs[k].forEach(function (p) {
        var cx = 180 + p[0] * 1.4, cy = 88 + p[1] * 1.2, r = p[2] * 1.5, gr = g.createRadialGradient(cx, cy, r * 0.15, cx, cy, r);
        gr.addColorStop(0, 'rgba(' + rgbT + ',.95)'); gr.addColorStop(0.6, 'rgba(' + rgbT + ',.5)'); gr.addColorStop(1, 'rgba(' + rgbT + ',0)');
        g.save(); g.translate(cx, cy); g.scale(1, 0.42); g.translate(-cx, -cy); g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.fill(); g.restore();
      });
      cloudSprites[t].push(cvs);
    }
  })();

  // ---- audio ------------------------------------------------------------------------------
  var ac = null, master = null;
  function audio() {
    if (!save.sound) return null;
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination); } catch (e) { return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, t0, dur, type, g, f2) {
    var o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    v.gain.setValueAtTime(0.0001, t0); v.gain.exponentialRampToValueAtTime(g, t0 + 0.006); v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(v); v.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  var noiseBuf = null;
  function noise(t0, dur, g, hp) {
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    var s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    v.gain.setValueAtTime(g, t0); v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(v); v.connect(master); s.start(t0); s.stop(t0 + dur);
  }
  // The tower is the instrument: each perfect in a row is the next note of a pentatonic scale, climbing.
  var PENT = [0, 2, 4, 7, 9];
  function noteFor(k) { var o = Math.floor(k / 5), s = PENT[k % 5]; return 261.63 * Math.pow(2, (s + 12 * Math.min(o, 3)) / 12); }
  function sfxPerfect(combo) {
    if (!audio()) return; var t = ac.currentTime, f = noteFor(combo - 1);
    tone(f, t, 0.9, 'sine', 0.34); tone(f * 2, t, 0.5, 'triangle', 0.1); tone(f * 3.01, t, 0.25, 'sine', 0.05);
    tone(140, t, 0.09, 'sine', 0.22, 70);
  }
  function sfxCut(ratio) {
    if (!audio()) return; var t = ac.currentTime;
    tone(170, t, 0.13, 'sine', 0.42, 62); noise(t, 0.05 + ratio * 0.05, 0.09 + ratio * 0.12, 1800);
  }
  function sfxMiss() {
    if (!audio()) return; var t = ac.currentTime;
    tone(210, t, 0.7, 'sawtooth', 0.12, 38); tone(120, t, 0.5, 'sine', 0.3, 34); noise(t + 0.02, 0.35, 0.12, 300);
  }
  function sfxBest() {
    if (!audio()) return; var t = ac.currentTime + 0.35;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, t + i * 0.09, 0.7, 'sine', 0.26); tone(f * 2, t + i * 0.09, 0.3, 'triangle', 0.06); });
  }
  function buzz(ms) { if (!RM && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

  // ---- game flow --------------------------------------------------------------------------
  function setScore(n) { elScore.textContent = n; }
  function popup(text, wx, wy, wz) {
    var ex = W / 2, ey = elScore.getBoundingClientRect().bottom + 26;
    elPop.textContent = text;
    elPop.style.left = ex + 'px'; elPop.style.top = ey + 'px';
    elPop.getAnimations && elPop.getAnimations().forEach(function (a) { a.cancel(); });
    var dy = RM ? 0 : -18;
    elPop.animate([{ transform: 'translate(-50%,-50%) translateY(0) scale(' + (RM ? 1 : 0.8) + ')', opacity: 0 },
                   { transform: 'translate(-50%,-50%) translateY(' + dy * 0.2 + 'px) scale(1)', opacity: 1, offset: 0.12 },
                   { transform: 'translate(-50%,-50%) translateY(' + dy * 0.6 + 'px) scale(1)', opacity: 1, offset: 0.6 },
                   { transform: 'translate(-50%,-50%) translateY(' + dy + 'px) scale(1)', opacity: 0 }],
                  { duration: RM ? 700 : 850, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
  }
  function onDrop() {
    var b = STACK.block(game), t0 = game.layers[game.layers.length - 1];
    var ev = STACK.drop(game);
    if (!ev) return;
    var yTop = game.n;                                   // y of the bottom of the slab just placed is n-1+... see below
    if (ev.type === 'miss') {
      pieces.push(makePiece(ev.piece, ev.n + 1, game.axis, 0, ev.n + 1, true));
      sfxMiss(); buzz(40); if (!RM) { kick = 0.9; freeze = 0.09; }
      mode = 'over'; overAt = time; lockUntil = time + 0.9;
      newBest = game.n > save.best;
      if (newBest) { save.best = game.n; store(); sfxBest(); }
      cam.anchor = cam.anchor;                           // eased in update()
      setTimeout(showOver, 520);
      return;
    }
    var L = ev.layer, i = ev.n;                          // the new layer sits at y = i (its top at i + 1)
    layerFx[i] = { dip: RM ? 0 : 1, vel: 0, flash: ev.type === 'perfect' && !RM ? 1 : 0 };
    if (ev.type === 'cut') {
      var sz = ev.axis === 0 ? t0.w : t0.d, ratio = Math.min(1, Math.abs(ev.off) / sz);
      pieces.push(makePiece(ev.piece, i, ev.axis, ev.off > 0 ? 1 : -1, i, false));
      sfxCut(ratio); buzz(14); if (!RM) kick = 0.25 + 0.4 * ratio;
    } else {
      sfxPerfect(ev.combo); buzz(8); if (!RM) kick = 0.12;
      if (!RM) rings.push({ cx: L.cx, cz: L.cz, w: L.w, d: L.d, y: i + 1, t: 0 });
      popup(ev.combo > 1 ? 'PERFECT ×' + ev.combo : 'PERFECT', L.cx, i + 2, L.cz);
    }
    if (mode === 'ready') { mode = 'play'; elBest.textContent = ''; elTitle.classList.add('gone'); elHint.classList.add('gone'); elScore.classList.remove('hide'); }
    setScore(game.n);
    if (!RM) { elScore.classList.remove('bump'); void elScore.offsetWidth; elScore.classList.add('bump'); }
    if (bestShown > 0 && game.n === bestShown + 1) { popup('NEW BEST', L.cx, i + 3.4, L.cz); }
  }
