<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Escape the Maze — a 3D hedge labyrinth to escape before sunset</title>
<meta name="description" content="Walk a randomly generated 3D hedge maze in first person and find the gate before the sun goes down. A red thread marks where you have been, a map fills in as you look around, and every maze has a shareable seed.">
<link rel="canonical" href="https://www.gptgames.dev/games/escape_the_maze.html">
<meta name="theme-color" content="#151833">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151833'/%3E%3Ccircle cx='16' cy='17' r='6' fill='%23ffd27a'/%3E%3Cpath d='M4 22h7v-6h4v6h2v-9h4v9h7v6H4z' fill='%231f4a33'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --night: #151833;
  --hedge: #10241a;
  --hedge-2: #183526;
  --parch: #efe2c4;
  --parch-2: #e2d0a8;
  --ink: #3f2c1d;
  --ink-soft: #7a5f45;
  --thread: #c8263a;
  --gold: #ffd27a;
  --serif: 'Cormorant Garamond', 'Garamond', 'Georgia', serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--parch); font-family: var(--serif); overflow: hidden; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr; }
#view { position: relative; overflow: hidden; touch-action: none; min-height: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(8,10,24,.55) 100%); }

/* HUD */
.hud { position: absolute; top: calc(10px + var(--safe-t)); display: flex; align-items: center; gap: 10px; pointer-events: none; }
#hudL { left: 12px; }
#hudR { right: 12px; }
.iconbtn { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(239,226,196,.28);
  background: rgba(16,20,40,.45); display: grid; place-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: transform .15s ease, background .15s ease; }
.iconbtn:active { transform: scale(.92); background: rgba(16,20,40,.7); }
.iconbtn svg { width: 20px; height: 20px; }
#mazeName { font-size: 19px; font-style: italic; font-weight: 600; letter-spacing: .02em; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
#sunArc { position: absolute; left: 50%; top: calc(6px + var(--safe-t)); transform: translateX(-50%); width: 176px; height: 66px; pointer-events: none; overflow: visible; filter: drop-shadow(0 1px 3px rgba(0,0,0,.75)); transition: opacity .4s ease; }

/* map */
#mapWrap { position: absolute; left: 14px; top: calc(66px + var(--safe-t)); width: 196px; height: 196px; border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(63,44,29,.4); overflow: hidden; transition: opacity .4s ease, transform .4s ease; }
#map { width: 100%; height: 100%; display: block; }

/* pad */
#pad { position: absolute; right: 16px; bottom: calc(16px + var(--safe-b)); display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: 64px 64px; gap: 10px;
  transition: opacity .4s ease; }
.pb { width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--parch);
  box-shadow: inset 0 -3px 0 var(--parch-2), 0 6px 16px rgba(0,0,0,.35); display: grid; place-items: center; color: var(--ink);
  transition: transform .09s ease, box-shadow .09s ease, background .09s ease; touch-action: none; }
.pb svg { width: 28px; height: 28px; }
.pb.down, .pb:active { transform: translateY(2px) scale(.95); box-shadow: inset 0 -1px 0 var(--parch-2), 0 2px 6px rgba(0,0,0,.35); background: #f7edd6; }
#bF { grid-column: 2; grid-row: 1; }
#bL { grid-column: 1; grid-row: 2; }
#bB { grid-column: 2; grid-row: 2; width: 50px; height: 50px; justify-self: center; align-self: center; }
#bB svg { width: 22px; height: 22px; }
#bR { grid-column: 3; grid-row: 2; }
.no-touch #pad { display: none; }

#arcLabel { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%); font-size: 16px; padding: 2px 12px; border-radius: 999px; background: rgba(16,20,40,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); font-style: italic; letter-spacing: .08em; color: rgba(239,226,196,.9);
  text-shadow: 0 1px 4px rgba(0,0,0,.8); opacity: 0; transition: opacity .8s ease; pointer-events: none; }
#arcLabel.on { opacity: 1; }
#bearing { position: absolute; top: calc(84px + var(--safe-t)); left: 0; width: 30px; height: 30px; margin-left: -15px; pointer-events: none; opacity: 0; transition: opacity .4s ease, transform .25s ease-out;
  filter: drop-shadow(0 0 2px rgba(10,8,20,.95)) drop-shadow(0 0 7px rgba(255,224,150,.85)); }
#bearing svg { width: 100%; height: 100%; fill: #fff3d2; stroke: #3a2610; stroke-width: 1.6; stroke-linejoin: round; }
@media (max-aspect-ratio: 4/5) { #bearing { top: calc(80px + var(--safe-t)); } }
#hint { position: absolute; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translate(-50%, 0); padding: 9px 16px; border-radius: 999px;
  background: rgba(16,20,40,.66); font-size: 18px; font-style: italic; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .5s ease, transform .5s ease;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#hint.on { opacity: 1; }
#hint { text-align: center; white-space: normal; line-height: 1.25; border-radius: 18px; }
#hint small { font-size: 15px; opacity: .85; }
#hint kbd { font-family: var(--serif); font-style: normal; font-weight: 700; border: 1px solid rgba(239,226,196,.4); border-radius: 5px; padding: 0 5px; margin: 0 2px; }

/* portrait phones: view on top, map + pad as a garden-bench panel below */
@media (max-aspect-ratio: 4/5) {
  #title { background: linear-gradient(180deg, rgba(14,16,38,.72) 0%, rgba(14,16,38,.1) 34%, rgba(11,25,18,0) 44%, rgba(11,25,18,.92) 60%, #0b1912 70%); }
  #app { grid-template-rows: minmax(0, 1fr) auto; }
  #panel { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 14px 14px calc(14px + var(--safe-b));
    background: linear-gradient(#0f2219, #0b1912); border-top: 1px solid rgba(255,210,122,.18); }
  #mapWrap { position: relative; left: auto; top: auto; width: 100%; height: min(46vw, 32vh); border-radius: 12px; }
  #pad { position: relative; right: auto; bottom: auto; grid-template-columns: repeat(3, 56px); grid-template-rows: 56px 56px; gap: 6px; }
  .pb { width: 56px; height: 56px; }
  #bB { width: 46px; height: 46px; }
  #hint { bottom: 18px; font-size: 17px; }
  .no-touch #panel { grid-template-columns: 1fr; }
}
@media (min-aspect-ratio: 4/5) { #panel { display: contents; } }
@media (max-height: 460px) and (min-aspect-ratio: 4/5) { #mapWrap { width: 140px; height: 140px; } }

/* overlays */
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .6s ease; z-index: 5; }
.overlay.on { opacity: 1; pointer-events: auto; }
#pause { background: rgba(10,12,28,.42); }
#results { background: radial-gradient(120% 90% at 50% 40%, rgba(255,214,140,.12), rgba(40,22,10,.35)); }
#title { background: linear-gradient(180deg, rgba(14,16,38,.72) 0%, rgba(14,16,38,.15) 46%, rgba(14,16,38,.0) 62%, rgba(14,16,38,.6) 100%); align-content: space-between; padding-top: calc(9vh + var(--safe-t)); padding-bottom: calc(7vh + var(--safe-b)); }
.tblock { text-align: center; transform: translateY(8px); transition: transform 1s cubic-bezier(.2,.8,.2,1); }
.overlay.on .tblock { transform: none; }
.kicker { font-size: 15px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); font-weight: 600; opacity: .9; }
h1 { font-size: clamp(54px, 11vw, 112px); line-height: .9; margin: 10px 0 0; font-weight: 600; font-style: italic; letter-spacing: -.01em; text-shadow: 0 4px 30px rgba(0,0,0,.55); }
.sub { margin: 14px auto 0; font-size: clamp(18px, 2.3vw, 22px); font-style: italic; max-width: 26em; color: rgba(239,226,196,.86); text-shadow: 0 1px 10px rgba(0,0,0,.7); }
.menu { display: grid; gap: 12px; justify-items: center; width: min(360px, 100%); }
.btn { width: 100%; min-height: 56px; border-radius: 999px; border: none; font-size: 22px; font-weight: 700; letter-spacing: .01em; padding: 10px 22px;
  background: var(--parch); color: var(--ink); box-shadow: inset 0 -3px 0 var(--parch-2), 0 10px 26px rgba(0,0,0,.4); transition: transform .12s ease, box-shadow .12s ease; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--parch-2), 0 4px 10px rgba(0,0,0,.4); }
.btn small { display: block; font-size: 15px; font-weight: 600; font-style: italic; color: var(--ink-soft); margin-top: -2px; }
.btn.ghost { background: rgba(16,20,40,.5); color: var(--parch); box-shadow: inset 0 0 0 1px rgba(239,226,196,.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.btn.ghost small { color: rgba(239,226,196,.7); }
.btn:focus-visible, .iconbtn:focus-visible, .pb:focus-visible, .link:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.links { display: flex; gap: 22px; margin-top: 4px; }
.link { background: none; border: none; font-size: 17px; font-style: italic; color: rgba(239,226,196,.82); padding: 8px 4px; text-decoration: underline; text-decoration-color: rgba(239,226,196,.3); text-underline-offset: 4px; }

.card { width: min(420px, 100%); max-height: 100%; overflow: auto; background: var(--parch); color: var(--ink); border-radius: 18px; padding: 22px 22px 18px;
  box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 0 0 1px rgba(63,44,29,.25), inset 0 0 60px rgba(160,120,60,.18);
  transform: translateY(14px) scale(.98); transition: transform .6s cubic-bezier(.2,.8,.2,1); text-align: center; }
.overlay.on .card { transform: none; }
@media (min-aspect-ratio: 1/1) and (max-height: 820px) {
  #results .card { width: min(780px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 26px; align-items: center; text-align: left; }
  #results .card > * { grid-column: 2; }
  #results #resMap { grid-column: 1; grid-row: 1 / span 6; margin: 0; }
  #results .legend { grid-column: 1; grid-row: 7; margin: 8px 0 0; text-align: center; }
  #results .suns { justify-content: flex-start; }
  #results .menu { justify-items: stretch; }
  #results .links { justify-content: flex-start; }
}
.sens { display: flex; align-items: center; gap: 12px; font-size: 17px; font-style: italic; color: var(--ink); }
.sens input { accent-color: #6b4a2b; width: 150px; }
.card h2 { margin: 0; font-size: 38px; font-style: italic; font-weight: 600; line-height: 1; }
.card .when { font-size: 15px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.suns { display: flex; justify-content: center; gap: 10px; margin: 10px 0 6px; }
.suns svg { width: 34px; height: 34px; transform: scale(.4); opacity: 0; transition: transform .5s cubic-bezier(.3,1.6,.5,1), opacity .3s ease; }
.suns svg.in { transform: none; opacity: 1; }
#resMap { width: 100%; aspect-ratio: 1; border-radius: 10px; display: block; margin: 8px 0 10px; box-shadow: inset 0 0 0 1px rgba(63,44,29,.3); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
.stat b { display: block; font-size: 36px; font-weight: 700; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.stat span { font-size: 18px; font-style: italic; color: #4e3826; }
.legend { font-size: 17px; font-style: italic; color: #5c4430; margin: -4px 0 12px; }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin: 0 4px 0 10px; border-radius: 2px; }
.card .btn { background: var(--ink); color: var(--parch); box-shadow: inset 0 -3px 0 #24180f, 0 8px 18px rgba(63,44,29,.3); }
.card .btn small { color: rgba(239,226,196,.7); }
.card .link { color: var(--ink); text-decoration-color: rgba(63,44,29,.35); }
.card .links { justify-content: center; flex-wrap: wrap; gap: 6px 18px; }
#toast { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translate(-50%, -8px); background: var(--parch); color: var(--ink); padding: 8px 16px; border-radius: 999px;
  font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .3s ease, transform .3s ease; pointer-events: none; z-index: 9; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#fade { position: absolute; inset: 0; background: radial-gradient(90% 80% at 50% 30%, #fff1c9 0%, #ffd58c 55%, #e9a35a 100%); opacity: 0; pointer-events: none; z-index: 4; }
#nogl { display: none; position: absolute; inset: 0; place-items: center; text-align: center; padding: 30px; font-size: 20px; font-style: italic; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="gl"></canvas>
    <div id="vignette"></div>
    <canvas id="fx"></canvas>
    <div class="hud" id="hudL">
      <button class="iconbtn" id="menuBtn" aria-label="Pause"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 5v10M13 5v10"/></svg></button>
      <span id="mazeName">Maze 1</span>
    </div>
    <svg id="sunArc" viewBox="0 0 132 50" aria-hidden="true">
      <defs><radialGradient id="sg"><stop offset="0" stop-color="#fff2c8"/><stop offset=".5" stop-color="#ffc05e"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/></radialGradient>
        <radialGradient id="arcBack"><stop offset="0" stop-color="#10142a" stop-opacity=".45"/><stop offset="1" stop-color="#10142a" stop-opacity="0"/></radialGradient>
        <clipPath id="sky"><rect x="-10" y="-20" width="152" height="61"/></clipPath></defs>
      <path d="M10 40 A56 30 0 0 1 122 40" fill="none" stroke="rgba(239,226,196,.28)" stroke-width="2.5" stroke-linecap="round"/>
      <path id="sunLeft" d="M10 40 A56 30 0 0 1 122 40" fill="none" stroke="#ffcf7a" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="2" y1="41" x2="130" y2="41" stroke="#efe2c4" stroke-width="2" stroke-linecap="round"/>
      <g id="moon" style="opacity:0"><path d="M66 9a8 8 0 1 0 7 11.5A6.5 6.5 0 0 1 66 9z" fill="#dfe4ff"/></g>
      <g clip-path="url(#sky)"><g id="sunDot"><circle r="13" fill="url(#sg)"/><circle r="6" fill="#fff4d6" stroke="#e99a3a" stroke-width="1.5"/></g></g>
    </svg>
    <div id="arcLabel">daylight left</div>
    <div id="bearing" aria-hidden="true"><svg viewBox="0 0 24 24"><path id="bearPath" d="M12 3 L18 12 L12 21 L6 12 Z"/></svg></div>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="fade"></div>

    <div class="overlay" id="title">
      <div class="tblock">
        <div class="kicker">A labyrinth at dusk</div>
        <h1>Escape<br>the Maze</h1>
        <p class="sub">Find the gate in the hedges before the sun goes down.</p>
      </div>
      <div class="menu">
        <button class="btn" id="playBtn">Enter the maze<small id="playSub">Maze 1</small></button>
        <button class="btn ghost" id="dailyBtn">Today’s maze<small id="dailySub"></small></button>
        <div class="links"><button class="link" id="soundBtn">Sound on</button></div>
      </div>
    </div>

    <div class="overlay" id="pause">
      <div class="card">
        <div class="when" id="pauseWhen">Paused</div>
        <h2 id="pauseName">Maze 1</h2>
        <div class="menu" style="margin:18px auto 4px">
          <button class="btn" id="resumeBtn">Keep walking</button>
          <label id="sensWrap" class="sens">Mouse speed <input id="sens" type="range" min="0.4" max="2.2" step="0.05" value="1"></label>
          <div class="links"><button class="link" id="restartBtn">Start this maze again</button><button class="link" id="soundBtn2">Sound on</button><button class="link" id="moveBtn">Moving freely</button><button class="link" id="leaveBtn">Leave</button></div>
        </div>
      </div>
    </div>

    <div class="overlay" id="results">
      <div class="card">
        <div class="when" id="resWhen">Maze 1</div>
        <h2 id="resTitle">Out by sunset</h2>
        <div class="suns" id="suns"></div>
        <canvas id="resMap" width="600" height="600"></canvas>
        <div class="legend"><i style="background:var(--thread)"></i>your thread<i style="background:#c99a2e"></i>the shortest way</div>
        <div class="stats">
          <div class="stat"><b id="resTime">0:00</b><span id="resTimeSub">time</span></div>
          <div class="stat"><b id="resSteps">0</b><span id="resStepsSub">steps</span></div>
        </div>
        <div class="menu" style="margin:0 auto">
          <button class="btn" id="nextBtn">Next maze<small id="nextSub"></small></button>
          <div class="links"><button class="link" id="againBtn">Walk it again</button><button class="link" id="shareBtn">Share this maze</button><button class="link" id="homeBtn">Title</button></div>
        </div>
      </div>
    </div>
    <div id="nogl">This maze needs WebGL, which this browser has switched off.</div>
  </div>
  <div id="panel">
    <div id="mapWrap"><canvas id="map"></canvas></div>
    <div id="pad">
      <button class="pb" id="bF" aria-label="Walk forward"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 23V6M7 12l7-7 7 7"/></svg></button>
      <button class="pb" id="bL" aria-label="Turn left"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 22v-6a6 6 0 0 0-6-6H6"/><path d="M11 5 6 10l5 5"/></svg></button>
      <button class="pb" id="bB" aria-label="Turn around"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 14a7.5 7.5 0 1 1-2.2-5.3"/><path d="M20.5 3.5v5.5H15"/></svg></button>
      <button class="pb" id="bR" aria-label="Turn right"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 22v-6a6 6 0 0 1 6-6h9"/><path d="M17 5l5 5-5 5"/></svg></button>
    </div>
  </div>
</div>

<script id="core">
// DOM-free maze core. Directions: 0 N (-y), 1 E (+x), 2 S (+y), 3 W (-x). walls[i] bit d set = wall on side d.
var MAZE = (function () {
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  function hash(str) { var h = 2166136261 >>> 0; str = String(str); for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function rng(seed) { var a = (typeof seed === 'number' ? seed : hash(seed)) >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function inside(m, x, y) { return x >= 0 && y >= 0 && x < m.w && y < m.h; }
  function open(m, x, y, d) { return !(m.walls[y * m.w + x] & (1 << d)); }
  function carve(m, x, y, d) { m.walls[y * m.w + x] &= ~(1 << d); var nx = x + DX[d], ny = y + DY[d]; if (inside(m, nx, ny)) m.walls[ny * m.w + nx] &= ~(1 << ((d + 2) & 3)); }
  function degree(m, x, y) { var n = 0; for (var d = 0; d < 4; d++) if (open(m, x, y, d) && inside(m, x + DX[d], y + DY[d])) n++; return n; }
  function bfs(m, sx, sy) {
    var dist = new Int32Array(m.w * m.h).fill(-1), q = [sx + sy * m.w]; dist[q[0]] = 0;
    for (var qi = 0; qi < q.length; qi++) { var c = q[qi], x = c % m.w, y = (c / m.w) | 0;
      for (var d = 0; d < 4; d++) { var nx = x + DX[d], ny = y + DY[d]; if (!inside(m, nx, ny) || !open(m, x, y, d)) continue; var ni = ny * m.w + nx; if (dist[ni] < 0) { dist[ni] = dist[c] + 1; q.push(ni); } } }
    return dist;
  }
  // w,h cells; braid = share of dead ends turned into loops. Start on the south edge facing north, exit on the
  // perimeter cell farthest (by path) from the start, opening outward.
  function generate(w, h, seed, braid) {
    var r = rng(seed), m = { w: w, h: h, seed: String(seed), walls: new Uint8Array(w * h).fill(15) };
    var sx = Math.floor(w / 2), sy = h - 1, seen = new Uint8Array(w * h), stack = [[sx, sy]]; seen[sy * w + sx] = 1;
