<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kemari — Keep the Ball in the Air</title>
<meta name="description" content="Kemari: keep the ball bouncing with one finger. Tap the deerskin ball before it touches the sand; where you touch it steers it. Every 25 kicks the season turns, so a long rally lasts a whole year.">
<meta name="theme-color" content="#f2e9d8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23f6efe0' stroke='%23221d19' stroke-width='5'/><path d='M8 52q42 22 84 0' fill='none' stroke='%23b8946a' stroke-width='12'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ox:0px;--ink:#221d19;--ink2:#5a4d44;--shu:#c8402a;--paper:#f2e9d8;--ease:cubic-bezier(.2,.8,.2,1);--back:cubic-bezier(.3,1.5,.5,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:#e7dcc8;color:var(--ink);font-family:'Shippori Mincho B1',Georgia,serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:2px solid var(--shu);outline-offset:3px}
#court{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fade{transition:opacity .45s var(--ease),transform .55s var(--ease)}
.gone{opacity:0;pointer-events:none!important}
.hud{position:fixed;left:calc(var(--ox) + max(20px,2.4vw,env(safe-area-inset-left)));top:max(16px,3vh,env(safe-area-inset-top));pointer-events:none}
.count{font-weight:800;font-size:clamp(48px,8.6vh,96px);line-height:.9;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums;display:flex;align-items:center;gap:22px}
.count b{font-weight:800;display:inline-block;transform-origin:30% 80%}
.stamp{font-size:clamp(12px,1.7vh,15px);font-weight:800;color:#fbf3e4;background:var(--shu);padding:5px 7px 4px;border-radius:3px;letter-spacing:.12em;line-height:1;text-transform:uppercase;opacity:0;transform:scale(1.8) rotate(-10deg)}
.stamp.on{opacity:1;transform:rotate(-4deg);transition:opacity .12s,transform .32s var(--back)}
.season{margin-top:6px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);font-weight:700;min-height:1.3em}
.ticks{display:flex;gap:3px;margin-top:10px;height:18px;align-items:center}
.ticks i{width:6px;height:17px;border-radius:2px;background:rgba(34,29,25,.3);transition:background .18s,transform .3s var(--back)}
.ticks i:nth-child(5n){height:21px}
.ticks i.on{background:var(--shu);transform:scaleY(1.12)}
.ticks.sweep i{background:rgba(34,29,25,.3);transform:none;transition:background .3s calc(var(--k)*18ms),transform .3s}
.btns{position:fixed;top:max(14px,2.4vh,env(safe-area-inset-top));right:calc(var(--ox) + max(14px,env(safe-area-inset-right)));display:flex;gap:8px}
.btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(246,239,226,.9);box-shadow:0 1px 0 rgba(34,29,25,.15);transition:transform .15s,opacity .4s}
.btn:active{transform:scale(.9)}
.btn svg{width:22px;height:22px}
.btn .off{display:none}.btn[aria-pressed=false] .on{display:none}.btn[aria-pressed=false] .off{display:block}
.title{position:fixed;left:calc(var(--ox) + max(20px,3.2vw,env(safe-area-inset-left)));top:max(22px,6vh,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-start;max-width:min(62vw,520px);pointer-events:none}
.title.gone{transform:translateY(-14px);transition-duration:.18s,.3s}
.hud{transition-delay:.12s}.hud.gone{transition-duration:.2s;transition-delay:0s}
.title.res:not(.gone){transition-delay:.22s}
.seal{display:inline-block;margin-bottom:12px;font-size:clamp(17px,2.4vh,22px);font-weight:800;color:#fbf3e4;background:var(--shu);padding:5px 7px;border-radius:3px;line-height:1;letter-spacing:.1em}
.title h1{font-weight:800;font-size:min(11vh,16vw,112px);line-height:.9;letter-spacing:-.01em;display:flex;align-items:center;gap:16px;font-variant-numeric:lining-nums}
.title h1 .stamp{font-size:clamp(13px,1.9vh,17px)}
.title.res h1{font-size:min(15vh,24vw,150px)}
#tt{display:inline-block;transform-origin:20% 80%}
.title p{margin-top:12px;font-size:min(2.8vh,4.4vw,24px);font-weight:500;color:var(--ink2);max-width:19ch;line-height:1.4}
.foot{position:fixed;left:var(--ox);right:var(--ox);bottom:max(18px,2.5vh,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.foot.gone{transform:translateY(10px)}
.year{width:min(420px,86vw)}
.yl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700}
.yl b{font-size:20px;font-weight:800}.yl span{font-size:13px;color:var(--ink2);letter-spacing:.04em}
.ys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ys i{display:block;height:7px;border-radius:3px;background:rgba(34,29,25,.15);position:relative;overflow:hidden}
.ys i::before,.ys i::after{content:'';position:absolute;inset:0;transform-origin:left;transition:transform .9s var(--ease)}
.ys i::before{background:rgba(34,29,25,.35);transform:scaleX(var(--b,0))}
.ys i::after{background:var(--shu);transform:scaleX(var(--f,0))}
.ys span{display:block;margin-top:7px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.veil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(closest-side,rgba(242,233,216,.86),rgba(242,233,216,.3))}
.veil h2{font-weight:800;font-size:clamp(40px,7vh,64px);letter-spacing:-.01em}
.go{min-width:200px;height:56px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:18px;letter-spacing:.06em;transition:transform .12s}
.go:active{transform:scale(.96)}
.veil small{font-size:13px;color:var(--ink2);letter-spacing:.06em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:520px){.foot{bottom:6px}.yl{margin-bottom:4px}.yl b{font-size:15px}.ys span{display:none}.year{width:min(300px,60vw)}}
@media (prefers-reduced-motion:reduce){.fade,.ticks i,.ys i::before,.ys i::after,.stamp.on{transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="court" role="img" aria-label="A kemari court: tap the ball to kick it up"></canvas>
<div class="hud fade gone" id="hud" aria-hidden="true">
  <div class="count"><b id="count">0</b><span class="stamp" id="stamp">New best</span></div>
  <div class="season" id="sname">Spring</div>
  <div class="ticks fade" id="ticks"></div>
</div>
<div class="title fade" id="title">
  <span class="seal" lang="ja">蹴鞠</span>
  <h1><span id="tt">Kemari</span><span class="stamp" id="tstamp">New best</span></h1>
  <p id="tp">Keep the ball off the sand for a whole year.</p>
</div>
<div class="foot fade" id="foot">
  <div class="year">
    <div class="yl"><b id="bestv">Tap the ball</b><span id="yearv"></span></div>
    <div class="ys" id="ys"><div><i></i><span>Spring</span></div><div><i></i><span>Summer</span></div><div><i></i><span>Autumn</span></div><div><i></i><span>Winter</span></div></div>
  </div>
</div>
<div class="btns">
  <button class="btn fade gone" id="pauseb" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#221d19"><rect x="6" y="5" width="3.6" height="14" rx="1.4"/><rect x="14.4" y="5" width="3.6" height="14" rx="1.4"/></svg></button>
  <button class="btn" id="sndb" aria-label="Sound" aria-pressed="true"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="#221d19" stroke-width="1.9" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="#221d19"/><path d="M15.5 9a4 4 0 010 6M18.3 6.5a7.5 7.5 0 010 11"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="#221d19" stroke-width="1.9" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="#221d19"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
</div>
<div class="veil fade gone" id="veil" role="dialog" aria-label="Paused">
  <h2>Paused</h2>
  <button class="go" id="resume">Resume</button>
  <small>The ball waits in the air.</small>
</div>
<div class="sr" aria-live="polite" id="live"></div>
<script id="core">
// Kemari's rules. No DOM: test/ball_bouncing.mjs runs this block in Node.
// Units: the ground is y = 0 and the top of the court is y = 1; x = 0 is the middle of the court, which
// reaches hw to either side. Time in seconds. The page only draws what this returns.
var Core = (function () {
  'use strict';
  var T = {
    r: 0.075,            // ball radius
    step: 1 / 240,       // fixed physics step
    reach: 1.45,         // a tap this many radii from the ball's centre (mouse) still touches it
    reachTouch: 1.75,    // a thumb is fatter and covers what it aims at
    below: 0.3,          // the reach is centred this many radii under the ball: a thumb comes from below
    clean: 0.24,         // a touch within this share of the radius of the middle is a clean kick
    reachUp: 0.72,       // a ball can be kicked once it is falling and below this share of its peak: you kick a falling ball
    minLift: 0.16,       // even a kick taken high gives at least this much climb
    apex0: 0.6, apex1: 0.46,       // where kicks peak: first kick, and after ~150 kicks
    period0: 1.5, period1: 0.6,   // the time from a kick back down to kicking height, first and late
    tempoK: 110,         // kicks over which the tempo moves most of the way from 0 to 1
    cleanLift: 0.035,    // a clean kick climbs this much higher
    steer: 1.15,         // sideways speed of a kick from the very edge, in court half-widths per second
    keep: 0.25,          // share of the old sideways speed a kick keeps
    wallBounce: 0.55,
    wind: [0, 0, 0.16, 0.26], // gust strength per season, in court half-widths per second squared
    perSeason: 25,
    restitution: 0.42, roll: 2.6, air: 0.02
  };
  var SEASONS = ['spring', 'summer', 'autumn', 'winter'];

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rng(seed) { var s = (seed >>> 0) || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

  // how far into the climb toward full tempo a rally of k kicks is, 0..1
  function tempo(k) { return 1 - Math.exp(-k / T.tempoK); }
  function apex(k) { return T.apex0 + (T.apex1 - T.apex0) * tempo(k); }
  // gravity that makes a kick from kicking height (about two radii up) to the apex and back take period(k)
  function gravity(k) {
    var p = T.period0 + (T.period1 - T.period0) * tempo(k), h = apex(k) - 2 * T.r;
    return 8 * h / (p * p);
  }
  function season(k) { return Math.floor(k / T.perSeason) % 4; }
  function year(k) { return Math.floor(k / (T.perSeason * 4)) + 1; }
  // the court half-width the sideways numbers are scaled by: very wide screens do not get faster balls
  function span(s) { return clamp(s.hw, 0.3, 0.85); }

  function create(o) {
    o = o || {};
    var hw = Math.max(o.hw || 0.6, T.r * 2.5);
    return {
      hw: hw, seed: (o.seed >>> 0) || 1, t: 0, acc: 0,
      x: clamp(o.x == null ? 0 : o.x, -hw + T.r, hw - T.r), y: T.r, vx: 0, vy: 0,
      ang: 0, spin: 0,
      phase: 'ready',     // ready (resting, waiting for the first kick), air, down (met the sand), rest
      kicks: 0, streak: 0, lastKick: -1, wind: 0, windPh: [0, 0],
      grounded: true
    };
  }
  function resize(s, hw) {
    s.hw = Math.max(hw, T.r * 2.5);
    s.x = clamp(s.x, -s.hw + T.r, s.hw - T.r);
  }
  function windAt(s, t) {
    var a = T.wind[season(s.kicks)];
    if (!a || s.phase !== 'air') return 0;
    var r = rng(s.seed + 977 * year(s.kicks) + 31 * season(s.kicks));
    var p1 = r() * 6.283, p2 = r() * 6.283, sg = r() < 0.5 ? -1 : 1;
    // a slow swell that sometimes changes side, with a quicker flutter on top
    return a * span(s) * (0.65 * Math.sin(t * 0.33 + p1) * sg + 0.35 * Math.sin(t * 0.87 + p2));
  }

  // where a tap would touch the ball: null if it misses, else the offset across the ball (-1 left .. 1 right)
  function touch(s, px, py, isTouch) {
    var reach = (isTouch ? T.reachTouch : T.reach) * T.r;
    var dx = px - s.x, dy = py - (s.y - T.below * T.r);
    if (dx * dx + dy * dy > reach * reach) return null;
    return clamp(dx / T.r, -1, 1);
  }
  function kickTop(s) { return T.r + (apex(s.kicks) - T.r) * T.reachUp; }
  function kickable(s) {
    if (s.phase === 'ready' || s.phase === 'rest') return true;
    if (s.phase !== 'air') return false;
    return s.vy < 0 && s.y <= kickTop(s);
  }

  // kick the ball, touched at offset u across it (-1 its left edge .. 1 its right edge).
  // Returns the events, or [] if the ball cannot be kicked now.
  function kick(s, u, opt) {
    opt = opt || {};
    if (!opt.fresh && !kickable(s)) return [{ type: 'early' }];
    var ev = [], start = !!opt.fresh || s.phase !== 'air';
    if (start && !opt.demo) { s.kicks = 0; s.streak = 0; s.t = 0; s.vx *= 0.3; }
    u = clamp(u, -1, 1);
    var clean = Math.abs(u) <= T.clean;
    if (!opt.demo) { s.kicks++; s.streak = clean ? s.streak + 1 : 0; }
    var k = s.kicks, g = gravity(k);
    var top = apex(k) + (clean ? T.cleanLift : 0);
    if (opt.demo) top = 2 * T.r + 0.42;
    var climb = Math.max(top - s.y, T.minLift);
    if (s.y + climb + T.r > 0.98) climb = Math.max(0.02, 0.98 - T.r - s.y);
    s.vy = Math.sqrt(2 * g * climb);
    // touch the left of the ball and it goes right; a clean kick goes straight up and calms the drift
    var side = clean ? 0 : -(u - Math.sign(u) * T.clean) / (1 - T.clean);
    s.vx = s.vx * (clean ? 0.1 : T.keep) + side * T.steer * span(s) * (opt.demo ? 0.3 : 1);
    s.spin = s.spin * 0.3 - u * 9 - s.vx * 2;
    s.phase = 'air'; s.grounded = false; s.lastKick = s.t;
    ev.push({ type: 'kick', u: u, clean: clean, kicks: s.kicks, streak: s.streak, x: s.x, y: s.y, start: start, demo: !!opt.demo });
    if (!opt.demo && k > 1 && k % T.perSeason === 0) ev.push({ type: 'season', season: season(k), year: year(k), kicks: k });
    return ev;
  }

  function sub(s, h, ev) {
    var g = s.phase === 'air' ? gravity(s.kicks) : gravity(Math.max(0, s.kicks - 1));
    if (s.phase === 'ready' || s.phase === 'rest') return;
    s.wind = windAt(s, s.t);
    s.vx += s.wind * h;
    s.vy -= g * h;
    s.x += s.vx * h; s.y += s.vy * h;
    s.ang += s.spin * h;
    s.spin *= Math.exp(-0.4 * h);
    var L = -s.hw + T.r, R = s.hw - T.r;
    if (s.x < L || s.x > R) {
      var right = s.x > R;
      s.x = right ? R : L;
      if (right ? s.vx > 0 : s.vx < 0) {
        ev.push({ type: 'wall', side: right ? 1 : -1, v: Math.abs(s.vx), x: s.x, y: s.y });
        s.vx = -s.vx * T.wallBounce; s.spin = -s.spin * 0.6;
      }
    }
    if (s.y <= T.r) {
      s.y = T.r;
      if (s.phase === 'air') {
        s.phase = 'down';
        ev.push({ type: 'drop', kicks: s.kicks, x: s.x, v: -s.vy });
      }
      if (s.vy < 0) {
        var v = -s.vy * T.restitution;
        if (v > 0.12) { ev.push({ type: 'bounce', v: v, x: s.x }); s.vy = v; }
        else { s.vy = 0; s.grounded = true; }
      }
    }
    if (s.phase === 'down' && s.grounded) {
      // rolling resistance: a round thing on flat ground must come to rest
      var dv = T.roll * h;
      s.vx = Math.abs(s.vx) <= dv ? 0 : s.vx - Math.sign(s.vx) * dv;
      s.spin = -s.vx / T.r;
      if (s.vx === 0) { s.phase = 'rest'; s.spin = 0; ev.push({ type: 'rest', x: s.x }); }
    }
  }

  // advance by dt seconds of real time in fixed steps; the same taps at the same times give the same rally
  function step(s, dt) {
    var ev = [];
    s.acc += Math.min(Math.max(dt, 0), 0.25);
    while (s.acc >= T.step) { s.acc -= T.step; s.t += T.step; sub(s, T.step, ev); }
    return ev;
  }

  // a tap at court point (px, py): kicks if it touches the ball. Returns events ('miss' if it touched nothing).
  function tap(s, px, py, isTouch) {
    var u = touch(s, px, py, isTouch);
    if (u === null) return [{ type: 'miss', x: px, y: py }];
    return kick(s, u);
  }

  // where the ball will meet the sand if nobody touches it (for the shadow's lead and for bots)
  function landing(s) {
    if (s.phase !== 'air') return { x: s.x, t: 0 };
    var c = JSON.parse(JSON.stringify(s)), e = [], t = 0;
    while (c.phase === 'air' && t < 5) { sub(c, T.step * 4, e); t += T.step * 4; }
    return { x: c.x, t: t };
  }

  // the record kept between visits: nothing in it is trusted
  function clean(rec) {
    var o = { best: 0, plays: 0, kicks: 0, muted: false, taught: 0, legacy: 0 };
    if (!rec || typeof rec !== 'object') return o;
    // a number past what anyone could reach is a lie, not a record: it is dropped, not capped
    var n = function (v, max) { v = Math.floor(Number(v)); return isFinite(v) && v > 0 && v <= max ? v : 0; };
    o.best = n(rec.best, 100000); o.plays = n(rec.plays, 1e7); o.kicks = n(rec.kicks, 1e9);
    o.taught = n(rec.taught, 99); o.legacy = n(rec.legacy, 1e7);
    o.muted = rec.muted === true;
    return o;
  }
  // the page this one replaced kept one number, a 3D paddle score with combo and power-up bonuses. It is not a
  // count of kicks, so it does not become a best here; it is kept, and its player is not treated as new.
  function migrate(rec, old) {
    rec = clean(rec);
    var v = Math.floor(Number(old));
    if (isFinite(v) && v > 0) { rec.legacy = Math.min(v, 1e7); rec.plays = Math.max(rec.plays, 1); }
    return rec;
  }
  function finish(rec, kicks) {
    rec = clean(rec);
    kicks = Math.max(0, Math.floor(kicks) || 0);
    var best = kicks > rec.best;
    rec.plays++; rec.kicks += kicks;
    if (best) rec.best = kicks;
    return { rec: rec, best: best };
  }

  return {
    TUNE: T, SEASONS: SEASONS, create: create, resize: resize, step: step, tap: tap, touch: touch, kick: kick,
    kickable: kickable, kickTop: kickTop, landing: landing, gravity: gravity, apex: apex, tempo: tempo, season: season, year: year,
    windAt: windAt, span: span, clean: clean, finish: finish, migrate: migrate, rng: rng
  };
})();
</script>
<script>
(function () {
'use strict';
var T = Core.TUNE;
var $ = function (id) { return document.getElementById(id); };
var cv = $('court'), main = cv.getContext('2d'), ctx = main;
var RM = matchMedia('(prefers-reduced-motion: reduce)');
var KEY = 'kemari';

// ---------- record ----------
var store = null;
try { store = window.localStorage; } catch (e) { store = null; }
function readRec() {
  var raw = null;
  try { raw = JSON.parse(store.getItem(KEY)); } catch (e) { raw = null; }
  var rec = Core.clean(raw);
  if (!raw) rec = migrate(rec);
  return rec;
}
function migrate(rec) {
  var old = null; try { old = store.getItem('resonance3d_best'); } catch (e) { old = null; }
  if (old == null) return rec;
  rec = Core.migrate(rec, old); saveRec2(rec); return rec;
}
function saveRec2(r) { try { store.setItem(KEY, JSON.stringify(r)); } catch (e) { /* blocked */ } }
function saveRec() { try { store.setItem(KEY, JSON.stringify(rec)); } catch (e) { /* storage blocked: play on */ } }
var rec = readRec();

// ---------- palette and seasons ----------
var SEAS = [
  {sky: ['#f5ebe1', '#f1d9cc'], sun: '#e98a6c', hill: '#c1b8b4', hill2: '#a59b97', sand: '#e7d7b7', fol: ['#df93a8', '#f4c3cf', '#fde6ec'], name: 'Spring'},
  {sky: ['#f4ead2', '#f0d3a6'], sun: '#e88a52', hill: '#aeb39c', hill2: '#7f8b70', sand: '#e3cfa5', fol: ['#4f7340', '#7d9e5a', '#a8c27c'], name: 'Summer'},
  {sky: ['#f0e4d0', '#ead0ad'], sun: '#de7a4c', hill: '#b8ab9b', hill2: '#93836f', sand: '#e1cba5', fol: ['#b2361e', '#d9652b', '#efa53d'], name: 'Autumn'},
  {sky: ['#dfe6ec', '#cdd8e0'], sun: '#f7f3ea', hill: '#aab6c1', hill2: '#8c99a6', sand: '#e3d5ba', fol: ['#ffffff', '#ffffff', '#ffffff'], name: 'Winter'}];
function rng(seed) { return Core.rng(seed); }

// ---------- paper grain ----------
