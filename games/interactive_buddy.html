<script id="core">
// Interactive Buddy - the rules. DOM-free: the page only draws and plays what this returns.
// Units: metres, seconds, y up. A buddy is 13 verlet particles joined by stick and angle constraints.
const BuddyCore = (() => {
'use strict';

const DT = 1 / 120, G = 11, ITER = 10, CEIL = 100, VMAX = 42;
const NAMES = ['head', 'shL', 'shR', 'hpL', 'hpR', 'elL', 'elR', 'haL', 'haR', 'knL', 'knR', 'ftL', 'ftR'];
const [HEAD, SHL, SHR, HPL, HPR, ELL, ELR, HAL, HAR, KNL, KNR, FTL, FTR] = NAMES.map((_, i) => i);
const IDX = {}; NAMES.forEach((n, i) => IDX[n] = i);
// collision radius = half the limb's drawn width, so a limb lying down rests on the floor it is drawn on
const RAD = [.30, .10, .10, .13, .13, .09, .09, .09, .09, .125, .125, .11, .11];

const POSE0 = [
    [0, .94], [-.25, .46], [.25, .46], [-.16, 0], [.16, 0],

    [-.2, -.30], [.2, -.30], [-.22, -.60], [.22, -.60]];

const STICKS = [
    [SHL, SHR], [HPL, HPR], [SHL, HPL], [SHR, HPR], [SHL, HPR], [SHR, HPL],
    [SHL, ELL], [ELL, HAL], [SHR, ELR], [ELR, HAR],
    [HPL, KNL], [KNL, FTL], [HPR, KNR], [KNR, FTR]].map(([a, b]) => ({a, b, len: dist(POSE0[a], POSE0[b])}));

    hinge(SHL, HPL, KNL, 1.75), hinge(SHR, HPR, KNR, 1.75)];

const TOOLS = [
    {id: 'glove', name: 'Glove', price: 0, base: 1, k: 1.0, hint: 'tap'},
    {id: 'mallet', name: 'Mallet', price: 150, base: 2, k: 1.15},
    {id: 'crackers', name: 'Crackers', price: 420, base: 1, k: 1.35},
    {id: 'bomb', name: 'Bomb', price: 950, base: 4, k: 1.5},
    {id: 'torch', name: 'Torch', price: 1700, base: 12, k: 1.5},
    {id: 'anvil', name: 'Anvil', price: 2800, base: 6, k: 1.6},
    {id: 'rocket', name: 'Rocket', price: 4600, base: 15, k: 1.0},
    {id: 'pad', name: 'Pad', price: 6800, base: 0, k: 1.5},
    {id: 'tesla', name: 'Tesla', price: 9800, base: 30, k: 1.4},
    {id: 'button', name: 'Big Red', price: 14000, base: 60, k: 1.8},
];
const TOOL = {}; TOOLS.forEach(t => TOOL[t.id] = t);
const SKINS = [
    {id: 'dummy', name: 'Test Dummy', price: 0},
    {id: 'sack', name: 'Burlap Sack', price: 900},
    {id: 'cardboard', name: 'Cardboard', price: 2200},
    {id: 'bubblegum', name: 'Bubblegum', price: 4500},
    {id: 'chrome', name: 'Chrome', price: 9000},
    {id: 'night', name: 'Night Shift', price: 16000},
];
const SKIN = {}; SKINS.forEach(s => SKIN[s.id] = s);

const THROW_MAX = 20, CHAIN_WINDOW = 2.4, CHAIN_MAX = 9, PAY_K = .1;
const FATIGUE_DECAY = 3, FATIGUE_K = .45;

// ---------------------------------------------------------------- random, save
function rng(seed) {
    let s = seed >>> 0;

function sanitize(raw) {

    if (raw.seen && typeof raw.seen === 'object') for (const k of Object.keys(s.seen)) s.seen[k] = raw.seen[k] ? 1 : 0;
    s.tool = (typeof raw.tool === 'string' && s.tools[raw.tool]) ? raw.tool : 'glove'; s.mute = raw.mute ? 1 : 0; s.vol = Math.round(num(raw.vol, 0, 1, .6) * 100) / 100;
    if (raw.stats && typeof raw.stats === 'object') for (const k of Object.keys(s.stats)) s.stats[k] = Math.floor(num(raw.stats[k], 0, 1e12, 0));

// ---------------------------------------------------------------- the world
function create(opt = {}) {
    const w = {
        t: 0, acc: 0, w: opt.width || 4, dropY: opt.dropY || 9, seed: opt.seed || 1,
        P: [], objs: [], events: [], sched: [], scorch: [],
        grab: null, cash: 0, best: 0, tools: {glove: 1}, skins: {dummy: 1}, skin: 'dummy', stats: {hits: 0, throws: 0, earned: 0},

function spawn(w, settled) {
    w.P.length = 0;

function burn(w, dt) {

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let rnd = Math.random;

// ---------------------------------------------------------------- save
const KEY = 'gptgames.interactive_buddy.v2';
function readSave() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    try { return migrateOld(); } catch (e) { return null; }
}
// The first version of this page kept its progress under another key, with sixteen items and eight skins.
// Cash carries over as it is; the new tools and skins are opened in proportion to how many the old ones were,
// so a player who had everything has everything, and one who had a few starts with the first few.
function migrateOld() {
    const raw = localStorage.getItem('gptgames_interactive_buddy_v2'); if (!raw) return null;
    const o = JSON.parse(raw); if (!o || typeof o !== 'object') return null;
    const share = (ids, have) => { let n = 0; for (const id of ids) if (have && have[id] === true) n++; return n / ids.length; };
    const oldTools = ['icecream', 'bowling', 'bouncy', 'baby', 'knife', 'pistol', 'shotgun', 'grenade', 'mine', 'molotov', 'fireball', 'vortex', 'radio', 'orb'];
    const oldSkins = ['mint', 'pirate', 'goth', 'strawberry', 'sunny', 'robot'];
    const s = C.newSave();
    s.cash = Math.floor(Math.max(0, +o.cash || 0));
    const nt = Math.round(share(oldTools, o.unlocked) * (C.TOOLS.length - 1)), ns = Math.round(share(oldSkins, o.ownedSkins) * (C.SKINS.length - 1));
    C.TOOLS.slice(1, 1 + nt).forEach(t => s.tools[t.id] = 1); C.SKINS.slice(1, 1 + ns).forEach(k => s.skins[k.id] = 1);
    if (o.stats && typeof o.stats === 'object') { s.stats.hits = Math.max(0, Math.floor(+o.stats.punches || 0)); }
    s.seen = {tap: 1, drag: 1};
    return s;
}

const world = C.create({save: readSave(), seed: (Date.now() >>> 0) || 1, width: 3.1});
let saveDirty = false, lastSave = 0;
function save(force) {
    saveDirty = true;
    const now = performance.now();
    if (!force && now - lastSave < 1500) return;
    lastSave = now; saveDirty = false;
    try { localStorage.setItem(KEY, JSON.stringify(C.exportSave(world))); } catch (e) {}
}
addEventListener('pagehide', () => save(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(true); Snd.suspend(); } else Snd.resume(); });
let tool = world.tool && world.tools[world.tool] ? world.tool : 'glove';

// ---------------------------------------------------------------- sound: all synthesised
const Snd = (() => {
    let ac = null, master = null, noiseBuf = null, muted = !!world.mute;
    function init() {
        if (ac) return;
        try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
        master = ac.createGain(); master.gain.value = gainOf(world.vol);
        // the top end is rolled off for good: bright little tones are what tires the ear first
        const soft = ac.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 3800; soft.Q.value = .6;
        const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; master.connect(soft); soft.connect(comp); comp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const gainOf = v => Math.pow(clamp(+v || 0, 0, 1), 2) * 1.1;
    const ok = () => ac && !muted && ac.state !== 'closed';
    function tone(f0, f1, dur, type = 'sine', vol = .3, delay = 0, atk = .003) {
        if (!ok()) return; const t = ac.currentTime + delay, o = ac.createOscillator(), v = ac.createGain();
        o.type = type; o.frequency.setValueAtTime(Math.max(20, f0), t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
        v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vol, t + atk); v.gain.exponentialRampToValueAtTime(.0008, t + dur);
        o.connect(v); v.connect(master); o.start(t); o.stop(t + dur + .02);
    }
    function noise(dur, f0, f1, type = 'lowpass', q = 1, vol = .3, delay = 0) {
        if (!ok()) return; const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
        s.buffer = noiseBuf; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(Math.max(20, f0), t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
        v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.0008, t + dur);
        s.connect(f); f.connect(v); v.connect(master); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
    }
    const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 12, 14, 16, 19];
    const api = {
        init, resume() { if (ac && ac.state === 'suspended') ac.resume(); }, suspend() { if (ac && ac.state === 'running') ac.suspend(); },
        get muted() { return muted; }, set muted(v) { muted = v; },
        setVolume(v) { if (master) master.gain.value = gainOf(v); },
        knock(kn) { const b = 175 - Math.min(kn, 9) * 7 + (rnd() - .5) * 18; tone(b * 1.7, b * .8, .1, 'sine', .55); tone(b * 3.2, b * 1.6, .05, 'triangle', .16); noise(.05, 2000, 400, 'bandpass', 1, .3); },
        bonk(kn) { const b = 110 - Math.min(kn, 8) * 4; tone(b * 2, b * .6, .16, 'sine', .6); noise(.09, 900, 150, 'lowpass', 1, .4); },
        thud(e) { const v = clamp(e / 4000, .12, 1); tone(100, 42, .2, 'sine', .5 * v); noise(.14, 600, 110, 'lowpass', .7, .5 * v); },
        coin(i) { const n = SCALE[Math.min(SCALE.length - 1, i)], f = 392 * Math.pow(2, n / 12); tone(f, f * .995, .26, 'sine', .22); tone(f * 2, f * 2, .1, 'sine', .04); },
        whoosh(v = 1) { noise(.2, 500, 2800, 'bandpass', 1.1, .22 * v); },
        boom() { noise(.8, 3200, 55, 'lowpass', .8, .95); tone(72, 26, .8, 'sine', .95); noise(.06, 7000, 1500, 'highpass', .7, .5); },
        pop() { noise(.05, 2600, 900, 'bandpass', 1.6, .55); tone(520, 180, .035, 'triangle', .14); },
        squeak() { tone(520, 820, .12, 'triangle', .3); tone(1040, 1300, .06, 'sine', .05, .02); },
        crunch() { noise(.14, 1400, 200, 'bandpass', 1.4, .6); tone(130, 60, .2, 'sine', .6); },
        fuse() { noise(1.6, 2800, 4800, 'bandpass', 5, .09); },
        ignite() { noise(.35, 300, 2200, 'bandpass', .8, .3); },
        crackle() { noise(.025, 3500 + rnd() * 2500, 800, 'bandpass', 3, .18); },
        zap() { tone(120, 90, .85, 'sawtooth', .24); noise(.85, 3400, 1500, 'bandpass', .9, .2); for (let i = 0; i < 18; i++) noise(.02, 3200, 1000, 'bandpass', 2, .18, i * .045); },
        boing() { tone(200, 560, .13, 'sine', .5); tone(560, 240, .3, 'sine', .45, .12); },
        buy() { tone(440, 440, .1, 'triangle', .22); tone(660, 660, .22, 'triangle', .2, .08); tone(880, 880, .4, 'sine', .16, .16); },
        deny() { tone(150, 105, .14, 'triangle', .16); },
        pick() { tone(330, 400, .06, 'sine', .18); },
        whistle() { tone(1100, 330, .55, 'sine', .14); },
        thump() { tone(70, 30, .4, 'sine', .9); noise(.3, 500, 70, 'lowpass', .8, .7); },
        rocket() { noise(1.4, 500, 1900, 'lowpass', .6, .5); tone(58, 95, 1.4, 'sawtooth', .2); },
        strap() { tone(300, 240, .06, 'square', .12); tone(220, 180, .08, 'square', .1, .07); },
        click() { tone(900, 400, .03, 'triangle', .22); noise(.02, 2500, 1200, 'bandpass', 1, .2); },
        quake() { noise(1.1, 900, 40, 'lowpass', .7, 1); tone(55, 22, 1.1, 'sine', 1); noise(.1, 7000, 800, 'highpass', .7, .5); tone(300, 900, .5, 'sawtooth', .08); },
        record() { for (let i = 0; i < 6; i++) { const f = 392 * Math.pow(2, SCALE[i + 1] / 12); tone(f, f, .3, 'triangle', .2, i * .075); } tone(784, 784, .6, 'sine', .14, .5); },
        grab() { tone(300, 360, .06, 'sine', .14); },
        pwip() { tone(260, 620, .09, 'sine', .3); tone(620, 380, .12, 'sine', .22, .08); },
        tick(k) { tone(700 + k * 400, 600 + k * 350, .04, 'triangle', .22); },
        sizzle() { noise(.18, 4000, 6000, 'bandpass', 4, .1); },
    };
    return api;
})();
Snd.muted = !!world.mute;
const buzz = ms => { if (!Snd.muted && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) { try { navigator.vibrate(ms); } catch (e) {} } };

// ---------------------------------------------------------------- layout
const V = {lift: 0, floorBase: 600, w: 0, h: 0, dpr: 1, S: 100, floorY: 600, X0: 0, worldW: 3.5, cam: 0, rackH: 126, t: 0, portrait: true};
function layout() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    V.w = innerWidth; V.h = innerHeight; V.dpr = dpr;
    cv.width = Math.round(V.w * dpr); cv.height = Math.round(V.h * dpr);
    V.portrait = V.w < 700 || V.w < V.h * .9;
    const rack = $('#rack'); V.rackH = rack.offsetHeight;
    document.documentElement.style.setProperty('--rackH', (V.portrait ? 126 : 170) + 'px');
    V.rackH = V.portrait ? 126 : 170;
    const floorBand = V.portrait ? 34 : 38;
    V.floorBase = V.h - V.rackH - floorBand; V.floorY = V.floorBase - (V.lift || 0);
    V.S = V.portrait ? V.w / 3.1 : clamp((V.floorBase) / 3.4, 70, 190);
    V.worldW = V.portrait ? 3.1 : Math.min(8.4, V.w / V.S);
    V.X0 = V.portrait ? 0 : Math.max(0, (V.w - V.worldW * V.S) / 2);
    C.setWidth(world, V.worldW);
}
addEventListener('resize', layout);

// ---------------------------------------------------------------- effects
const fx = [], floaters = [], coins = [];
let shake = 0, flash = 0, flashCol = '255,255,255', freeze = 0, deform = null, lastHit = -9, dizzyUntil = 0;
let shown = world.cash, coinIdx = 0, peakShown = 0;
const sx = x => V.X0 + x * V.S, sy = y => V.floorY - (y - V.cam) * V.S;
const wx = px => (px - V.X0) / V.S, wy = py => (V.floorY - py) / V.S + V.cam;

function spark(x, y, n, speed, life = .5, kind = 'star') { for (let i = 0; i < n; i++) { const a = rnd() * TAU, s = speed * (.4 + rnd() * .8); fx.push({k: kind, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 1, t: 0, life: life * (.6 + rnd() * .6), r: .05 + rnd() * .05, rot: rnd() * TAU, vr: (rnd() - .5) * 14}); } }
function puff(x, y, n, spread, size = .16, up = .6, smoke = false) { for (let i = 0; i < n; i++) fx.push({k: 'puff', smoke, x: x + (rnd() - .5) * spread, y: y + (rnd() - .5) * spread * .4, vx: (rnd() - .5) * spread * 2, vy: up * (.4 + rnd()), t: 0, life: .55 + rnd() * .3, r: size * (.7 + rnd() * .6)}); }
function ring(x, y, R, life = .45, col = '#efe8d4', lw = 6) { fx.push({k: 'ring', x, y, R, t: 0, life, col, lw}); }
function burst(x, y, size, rot) { fx.push({k: 'burst', x, y, size, rot, t: 0, life: .26}); }
function stuff(x, y, n, cols) { for (let i = 0; i < n; i++) { const a = rnd() * TAU, s = 2 + rnd() * 5; fx.push({k: 'chip', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 3, t: 0, life: 1 + rnd() * .6, r: .05 + rnd() * .06, rot: rnd() * TAU, vr: (rnd() - .5) * 16, col: cols[(rnd() * cols.length) | 0]}); } }
function floater(text, x, y, o = {}) {
    // merge a stream of small pays from one source into one number
    if (o.key) { const f = floaters.find(f => f.key === o.key && f.t < .4); if (f) { f.sum += o.value || 0; f.text = '+$' + f.sum; f.t = Math.min(f.t, .12); f.x = x; f.y = y; return; } }
    floaters.push({text, sub: o.sub || '', x, y, t: 0, life: o.life || 1.15, size: o.size || 34, col: o.col || A.YEL, key: o.key, sum: o.value || 0, vx: o.vx || 0});
}
function spawnCoins(cash, x, y) {
    const n = clamp(Math.round(cash / 14), 1, 8), per = Math.floor(cash / n), rest = cash - per * n;
    for (let i = 0; i < n; i++) coins.push({x: sx(x), y: sy(y), t: -i * .05, life: .62 + rnd() * .12, v: per + (i === n - 1 ? rest : 0), ox: (rnd() - .5) * 90, oy: -40 - rnd() * 60, i: coinIdx++});
}

// ---------------------------------------------------------------- the HUD
const cashEl = $('#cash'), chipEl = $('#chip'), rackEl = $('#rackScroll');
let digitEls = [];
function ensureDigits(n) {
    while (digitEls.length < n) {
        const d = document.createElement('span'); d.className = 'd';
        const strip = document.createElement('div'); strip.innerHTML = '0123456789'.split('').map(c => '<span>' + c + '</span>').join(''); d.appendChild(strip);
        cashEl.insertBefore(d, cashEl.children[1]); digitEls.unshift(strip);
    }
}
let lastDigits = '';
function setCash(v) {
    let s = String(Math.max(0, Math.floor(v))).padStart(Math.max(5, digitEls.length), '0'); if (s === lastDigits) return; lastDigits = s; ensureDigits(s.length);
    for (let i = 0; i < digitEls.length; i++) { const ch = s[s.length - 1 - (digitEls.length - 1 - i)]; digitEls[i].style.transform = 'translateY(' + (-(+ch) * 34) + 'px)'; }
    cashEl.setAttribute('aria-label', 'Cash: $' + Math.floor(v));
}
let chipLast = '', chipPop = 0;
function updateChip() {
    const live = world.chainT > 0 && world.chain > 0, m = C.multOf(live ? world.chain : 1), txt = '×' + (Number.isInteger(m) ? m : m.toFixed(1));
    if (txt !== chipLast) { chipLast = txt; chipEl.children[1].textContent = txt; if (live && m > 1) { chipEl.classList.add('pop'); setTimeout(() => chipEl.classList.remove('pop'), 130); } }
    chipEl.classList.toggle('live', live);
    chipEl.querySelector('i').style.width = (live ? clamp(world.chainT / C.CHAIN_WINDOW, 0, 1) * 100 : 0) + '%';
}
function renderRack() {
    const order = C.TOOLS, nextIdx = order.findIndex(t => !world.tools[t.id]);
    const html = [], kfmt = v => v >= 1000 ? '$' + (v / 1000).toFixed(v % 1000 ? 1 : 0).replace('.0', '') + 'k' : '$' + v;
    order.forEach((t, i) => {
        const owned = !!world.tools[t.id], isNext = i === nextIdx, isFar = nextIdx >= 0 && i === nextIdx + 1;
        if (!owned && !isNext) return;
        if (owned) html.push('<button class="slot' + (t.id === tool ? ' sel' : '') + '" data-id="' + t.id + '" aria-label="' + t.name + '">' + A.ICONS[t.id] + '<span class="nm">' + t.name + '</span></button>');
        else if (isNext) html.push('<button class="slot next" data-id="' + t.id + '" aria-label="Buy ' + t.name + ' for $' + t.price + '">' + A.ICONS[t.id] + '<span class="tag"><i></i><b>' + kfmt(t.price) + '</b></span></button>');
        else html.push('<div class="slot far" aria-hidden="true">' + A.ICONS[t.id] + '<span class="nm">???</span></div>');
    });
    rackEl.innerHTML = html.join('');
}
function updateRack() {
    const nxt = $('.slot.next', rackEl); if (!nxt) return; const t = C.TOOL[nxt.dataset.id], p = clamp(world.cash / t.price, 0, 1);
    nxt.querySelector('i').style.width = (p * 100) + '%'; nxt.classList.toggle('can', world.cash >= t.price);
    $('#skinDot').classList.toggle('on', C.SKINS.some(s => !world.skins[s.id] && world.cash >= s.price));
}
rackEl.addEventListener('click', e => {
    const b = e.target.closest('.slot'); if (!b || !b.dataset.id) return; Snd.init(); Snd.resume();
    const id = b.dataset.id;
    if (world.tools[id]) { selectTool(id); return; }
    const r = C.buy(world, id);
    if (r.ok) { Snd.buy(); buzz([14, 30, 14]); flickTag(b); spendCoins(b); tool = id; world.tool = id; renderRack(); const el = $('.slot[data-id="' + id + '"]', rackEl); if (el) { el.classList.add('fresh'); const nt = document.createElement('span'); nt.className = 'newtag'; nt.textContent = 'NEW'; el.appendChild(nt); setTimeout(() => nt.remove(), 2600); cashEl.classList.remove('spend'); void cashEl.offsetWidth; cashEl.classList.add('spend'); el.scrollIntoView({inline: 'nearest', block: 'nearest', behavior: reduce ? 'auto' : 'smooth'}); } setCash(world.cash); shown = world.cash; save(true); sparkAtSlot(id); }
    else { Snd.deny(); b.classList.remove('deny'); void b.offsetWidth; b.classList.add('deny'); }
});
function flickTag(b) {
    const tag = b.querySelector('.tag'); if (!tag) return; const r = tag.getBoundingClientRect(), c = tag.cloneNode(true); c.className = 'tag flick'; c.style.cssText = 'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;position:fixed';
    document.body.appendChild(c); setTimeout(() => c.remove(), 700);
}
function spendCoins(b) {
    const r = b.getBoundingClientRect(), t = cashEl.getBoundingClientRect();
    for (let i = 0; i < 7; i++) coins.push({x: t.left + 30 + rnd() * 60, y: t.top + t.height / 2, t: -i * .045, life: .55, v: 0, ox: (rnd() - .5) * 60, oy: 50 + rnd() * 60, i: 0, tx: r.left + r.width / 2, ty: r.top + 30, silent: true});
}
function sparkAtSlot(id) {
    const el = $('.slot[data-id="' + id + '"]', rackEl); hintTool = id; if (!el) return; const r = el.getBoundingClientRect(), x = wx(r.left + r.width / 2), y = wy(r.top - 6);
    floaters.push({text: C.TOOL[id].name.toUpperCase() + '!', sub: '', x: world.w / 2, y: wy(V.h * .3), t: 0, life: 1.5, size: 46, col: A.YEL, vx: 0});
    for (let i = 0; i < 26; i++) { const a = Math.PI * (.1 + .8 * rnd()), sp = 4 + rnd() * 7; fx.push({k: 'star', x: x + (rnd() - .5) * .5, y, vx: Math.cos(a) * sp * (rnd() < .5 ? -1 : 1) * .6, vy: Math.sin(a) * sp, t: 0, life: .9 + rnd() * .5, r: .06 + rnd() * .06, rot: rnd() * TAU, vr: (rnd() - .5) * 14}); } }
function selectTool(id) { if (tool !== id) Snd.pick(); tool = id; world.tool = id; for (const b of rackEl.querySelectorAll('.slot')) b.classList.toggle('sel', b.dataset.id === id); const el = $('.slot[data-id="' + id + '"]', rackEl); if (el) el.scrollIntoView({inline: 'nearest', block: 'nearest', behavior: reduce ? 'auto' : 'smooth'}); save(); }

// ---------------------------------------------------------------- the wardrobe
const sheet = $('#sheet');
function openSheet() { Snd.init(); Snd.resume(); renderCards(); sheet.classList.add('open'); sheet.setAttribute('aria-hidden', 'false'); $('#sheetX').focus({preventScroll: true}); }

function renderCards() {
    const el = $('#cards'); el.innerHTML = '';
    for (const s of C.SKINS) {
        const owned = !!world.skins[s.id], worn = world.skin === s.id, can = !owned && world.cash >= s.price;
        const b = document.createElement('button'); b.className = 'card' + (worn ? ' worn' : '') + (owned ? '' : ' lock') + (can ? ' can' : ''); b.dataset.id = s.id; b.setAttribute('aria-label', s.name);
        b.innerHTML = '<canvas width="192" height="200"></canvas><span class="nm">' + s.name + '</span><span class="st">' + (worn ? 'Wearing' : owned ? 'Wear' : '$' + s.price.toLocaleString()) + '</span>';
        el.appendChild(b); previewSkin(b.querySelector('canvas'), s.id);

    $('#vol').value = Math.round((world.vol === undefined ? .6 : world.vol) * 100); $('#vol').style.setProperty('--p', $('#vol').value + '%'); $('#sndLabel').textContent = Snd.muted ? 'Sound off' : 'Sound on'; $('#btnSound').setAttribute('aria-pressed', String(!Snd.muted)); $('#waves').style.display = Snd.muted ? 'none' : '';
}

    const pts = C.POSE0.map(([x, y]) => ({x, y})); p.save(); p.translate(canvas.width / 2, canvas.height - 10); p.scale(s * .66, -s * .66); p.translate(0, .72 + .1);
