<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bubble Break — a bubble wrap incremental</title>
<meta name="description" content="An incremental game about popping bubble wrap on your coffee break. Press, then swipe; hold the thick ones, grab the gold, chase sugar rushes and zip whole rows open. Quit your job for calluses, move from the office desk to the warehouse, the factory and a city wrapped for moving day, and end by popping the world, and everything after it.">
<meta name="theme-color" content="#7a4f2a">
<link rel="canonical" href="https://gptgames.dev/games/bubble_break.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="gptgames.dev">
<meta property="og:url" content="https://gptgames.dev/games/bubble_break.html">
<meta property="og:title" content="Bubble Break — a bubble wrap incremental">
<meta property="og:description" content="Pop bubble wrap on your coffee break, quit for calluses, and work your way up to popping the whole world.">
<meta property="og:image" content="https://gptgames.dev/screenshots/screenshot_344.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Bubbles&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --ink:#231b14; --paper:#fbf7ee; --receipt:#f7f5ef; --note:#ffe27a; --note-2:#ffd95a; --note-edge:#e2bf45;
  --tape:#18181a; --tape-text:#f3f2ec; --red:#c8321f; --blue:#245f86; --gold:#c9920f; --muted:#6d6153;
  --display:"Rubik Bubbles","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --ui:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#7a4f2a;color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--ui);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Dymo label tape: the button of this desk */
.tape{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;background:var(--tape);color:var(--tape-text);
  padding:.62em 1.1em .58em;font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;
  text-shadow:0 -1px 0 rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.18);box-shadow:0 2px 3px rgba(0,0,0,.35);
  clip-path:polygon(0 8%,3% 0,97% 0,100% 8%,100% 92%,97% 100%,3% 100%,0 92%);transition:transform .08s}
.tape:active{transform:translateY(1px)}
.tape.red{background:#8e1b12}
.tape.ghost{background:transparent;color:var(--ink);text-shadow:none;box-shadow:inset 0 0 0 2px var(--ink)}
.tape[disabled]{opacity:.45;cursor:default}
.tape small{letter-spacing:.06em;font-size:.78em;opacity:.8;text-transform:none}

.note{background:linear-gradient(180deg,var(--note) 0%,var(--note-2) 100%);box-shadow:0 1px 1px rgba(0,0,0,.12),0 6px 10px -4px rgba(0,0,0,.35);position:relative}
.note:after{content:"";position:absolute;right:0;bottom:0;width:14px;height:14px;background:linear-gradient(135deg,var(--note-edge) 0 50%,transparent 50%);box-shadow:-1px -1px 2px rgba(0,0,0,.12)}
.hand{font-family:var(--hand);font-weight:700}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}
#hud .note{padding:6px 12px 8px;min-width:128px}
#hud .l{justify-self:start;transform:rotate(-1.6deg)}
#hud .r{justify-self:end;transform:rotate(1.3deg);text-align:right}
#hud .lbl{font-family:var(--hand);font-size:19px;line-height:1;color:#5b4a1c}
#hud .val{font-family:var(--mono);font-weight:600;font-size:23px;line-height:1.15}
#hud .sub{font-size:13px;color:#5b4a1c;font-weight:600}
#mug{width:96px;height:96px;justify-self:center;display:block;margin-top:-4px}
#combo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:1;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.35)}
#combo:before{content:"";position:absolute;inset:-26px -60px;background:radial-gradient(closest-side,rgba(35,27,20,.3),rgba(35,27,20,0));z-index:-1}
#combo .n{font-family:var(--display);font-size:clamp(40px,8vw,72px);line-height:.95;-webkit-text-stroke:2px rgba(35,27,20,.55)}
#combo .lb{font-family:var(--hand);font-size:clamp(20px,3.4vw,28px);line-height:1;margin-top:2px;color:#fff6de;-webkit-text-stroke:.6px rgba(35,27,20,.5)}
#combo .mul{font-family:var(--mono);font-weight:600;font-size:18px;margin-top:4px;padding:1px 9px;background:rgba(35,27,20,.55);border-radius:12px}
#combo .mul.max{background:#c9920f;color:#1d1a12;text-shadow:none}
#combo .bar{width:clamp(90px,16vw,150px);height:5px;margin-top:6px;background:rgba(35,27,20,.35);border-radius:3px;overflow:hidden}
#combo .bar i{display:block;height:100%;background:#fff6de;transform-origin:left}
#combo.frz .bar i{background:#ff8fc4}
#combo.bump .n{animation:cbump .18s ease-out}
#combo.broke{transition:opacity .7s .15s}
#combo.broke .n{animation:cbreak .6s ease-in forwards}
@keyframes cbump{0%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes cbreak{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(34px) rotate(-6deg);opacity:.2}}
#frenzy{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translateX(-50%) rotate(-1.5deg);z-index:2;pointer-events:none;background:#ff5fa8;color:#fff;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;padding:5px 12px 6px;box-shadow:0 3px 8px rgba(0,0,0,.3);text-align:center}
#frenzy .bar{height:3px;background:rgba(255,255,255,.35);margin-top:4px}
#frenzy .bar i{display:block;height:100%;background:#fff;transform-origin:left}
#hud .ord{display:flex;gap:4px;margin-top:3px;align-items:center;font-size:12px;color:#5b4a1c;font-weight:700;letter-spacing:.04em}
#hud .ord b{display:inline-block;width:11px;height:11px;border:1.6px solid #5b4a1c;border-radius:2px;position:relative}
#hud .ord b.ok{background:#5b4a1c}
#hud .ord b.ok:after{content:"";position:absolute;left:2.5px;top:-.5px;width:3px;height:6px;border:solid #ffe27a;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
#floats{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:600;font-size:17px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 1px #000;white-space:nowrap;animation:fl 1.1s ease-out forwards}
.fl.gold{color:#ffd76a;font-size:20px}
.fl.big{font-family:var(--display);font-size:30px}
.fl.warn{color:#ffb2a4}
@keyframes fl{0%{opacity:0;margin-top:6px}12%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-44px}}
#hud .rbox{justify-self:end;display:flex;gap:8px;align-items:flex-start}
#bPause{pointer-events:auto;padding:.5em .65em;font-size:14px;margin-top:4px}
#mug{pointer-events:auto;cursor:pointer}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%) rotate(-.6deg);padding:8px 14px 9px;font-size:16px;max-width:min(560px,calc(100% - 32px));text-align:center;pointer-events:none;z-index:2}

/* ---------- Overlays ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(34,22,12,.42);z-index:5;overflow:auto}
.screen > *{margin-block:auto;flex-shrink:0}
.card{background:var(--paper);width:min(460px,100%);padding:24px 22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.45);position:relative}
.card.note{background:linear-gradient(180deg,var(--note) 0%,var(--note-2) 100%)}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(48px,13vw,78px);line-height:.9;margin:4px 0 10px;color:#fdfdfb;-webkit-text-stroke:2px #2a4f66;text-shadow:3px 5px 0 rgba(42,79,102,.35);letter-spacing:.01em}
.card p{font-size:17px;line-height:1.45;margin:0 0 10px}
.card .small{font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.row .tape{flex:1 1 150px}
.kicker{font-family:var(--hand);font-size:22px;color:#5b4a1c;margin:0}

/* title: a sticky note with the menu, over a sheet you can pop */
#sTitle{background:linear-gradient(90deg,rgba(34,22,12,.5),rgba(34,22,12,.08) 70%);justify-content:flex-start;padding-left:max(16px,6vw);pointer-events:none}
#sTitle .card{pointer-events:auto;width:min(400px,100%)}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.menu .tape{width:100%}
.menu .pair{display:flex;gap:10px}.menu .pair .tape{flex:1}
.tpop{font-family:var(--hand);font-size:18px;color:#5b4a1c;margin:12px 0 0}
@media (max-width:560px){#sTitle{justify-content:center;padding-left:16px;align-items:flex-end;background:linear-gradient(0deg,rgba(34,22,12,.55),rgba(34,22,12,0) 70%)}}
/* options */
.opts{display:grid;gap:12px;margin:4px 0 0}
.opts h3{margin:10px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.opt{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:16px}
.opt output{font-family:var(--mono);font-size:14px;text-align:right;color:var(--muted)}
.opt input[type=range]{width:100%;accent-color:#231b14;height:24px}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px}
.optrow .tape{min-width:112px;font-size:14px;padding:.5em .9em}
.tape.off{background:transparent;color:var(--muted);text-shadow:none;box-shadow:inset 0 0 0 2px var(--muted)}
#saveBox{width:100%;height:84px;font-family:var(--mono);font-size:12px;border:1.5px solid var(--muted);background:#fff;padding:6px;resize:vertical;user-select:text;-webkit-user-select:text}
#sSet .card,#sRec .card{max-height:calc(100dvh - 32px);overflow:auto}
/* records */
.rtabs{display:flex;gap:6px;margin-bottom:12px}
.rtabs .tab{border:0;background:rgba(0,0,0,.08);padding:7px 12px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.rtabs .tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.stats{font-family:var(--mono);font-size:14.5px;display:grid;gap:3px}
.stats div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted rgba(0,0,0,.15);padding:2px 0;font-variant-numeric:tabular-nums}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px 8px}
.st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:12.5px;line-height:1.2}
.st .dot{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#ffe9a8 60%,#f0c24b 100%);box-shadow:0 0 0 3px #fff,0 2px 5px 3px rgba(0,0,0,.18);color:#5b3a10;transform:rotate(var(--r,0deg))}
.st .dot svg{width:30px;height:30px}
.st b{font-size:13px}
.st.lock .dot{background:rgba(0,0,0,.07);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14);color:rgba(0,0,0,.25)}
.st.lock{color:var(--muted)}
.st.lock b{color:var(--muted)}
/* orders, on a clipboard */
.orders{margin-top:10px;font-family:var(--ui);font-size:14.5px}
.orders .oh{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.orders .o{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:2px 0}
.orders .o i{width:14px;height:14px;border:1.6px solid currentColor;border-radius:2px;position:relative}
.orders .o.ok i{background:currentColor}
.orders .o.ok i:after{content:"";position:absolute;left:3.5px;top:0;width:3.5px;height:7.5px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.orders .o.ok span{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.7}
.orders .o em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--muted)}

/* the receipt after a break */
.receipt{background:var(--receipt);width:min(360px,100%);padding:20px 22px 26px;font-family:var(--mono);font-size:14.5px;box-shadow:0 20px 40px rgba(0,0,0,.45);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 10px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 10px repeat-x}
.receipt h2{font-family:var(--ui);font-size:22px;margin:0 0 2px;text-align:center;letter-spacing:.04em}
.receipt .meta{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase}
.receipt .ln{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-variant-numeric:tabular-nums}
.receipt .ln.rec span:last-child:after{content:" ★";color:var(--red)}
.receipt .sep{border-top:1px dashed #9a9080;margin:8px 0}
.receipt .tot{font-size:18px;font-weight:600}
.receipt .row{margin-top:14px}
.receipt .tape{font-size:14px}
.gate{margin-top:10px;font-family:var(--ui);font-size:14px;color:var(--muted)}
.bar{height:6px;background:rgba(0,0,0,.1);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transform-origin:left}

/* ---------- Trees ---------- */
#trees{position:fixed;inset:0;display:flex;flex-direction:column;background:#1b2e24;z-index:4}
#trees[data-tab="career"]{background:#1a2638}
#trees header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;position:relative;z-index:2}
#trees .tabs{display:flex;gap:6px}
#trees .tab{background:rgba(255,255,255,.14);color:#fff;border:0;padding:8px 12px;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
#trees .tab[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
#trees .menu-b{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);margin-right:6px}
#trees .wallet{margin-left:auto;display:flex;gap:10px;align-items:center}
@media (max-width:560px){#trees .tabs{order:1}#bTreePlay{order:2;margin-left:auto;padding:.5em .8em;font-size:14px}#trees .wallet{order:3;margin-left:0;width:100%}#trees .coin{font-size:14px;padding:4px 8px}}
#trees .tabnote{position:relative;z-index:2;margin:-2px 16px 8px;font-size:14px;color:rgba(255,255,255,.72)}
#trees .coin{background:var(--paper);padding:6px 10px;font-family:var(--mono);font-weight:600;font-size:16px;white-space:nowrap}
#treeArea{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#treeBg{position:absolute;inset:0;width:100%;height:100%}
#treeNodes{position:absolute;left:0;top:0;transform-origin:0 0}
.tn{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:0;padding:0;color:#f3efe2;
  background:radial-gradient(circle at 33% 29%,rgba(255,255,255,.85) 0 3.5%,rgba(255,255,255,.16) 6.5%,rgba(255,255,255,0) 12%),
             radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 0 60%,rgba(255,255,255,.2) 85%,rgba(255,255,255,.5) 100%);
  box-shadow:4px 6px 9px rgba(0,0,0,.32),inset -6px -8px 12px rgba(0,0,0,.16),inset 0 0 0 1px rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .2s}
.tn .icw{display:flex}
.tn .ico{width:32px;height:32px;opacity:.72;transition:opacity .2s}
.tn.has .ico{opacity:1}
.tn .ring{position:absolute;left:-9px;top:-9px;width:92px;height:92px;pointer-events:none;overflow:visible}
.ring .rt{fill:none;stroke:rgba(243,239,226,.2);stroke-width:3}
.ring .rf{fill:none;stroke:rgba(247,243,232,.92);stroke-width:3}
.tn .cost{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);font:600 12px/1.45 var(--mono);white-space:nowrap;padding:0 7px;border-radius:9px;background:rgba(8,16,12,.55);color:#f3efe2}
.tn.can{box-shadow:0 0 0 2px #f0c24b,0 0 8px rgba(240,194,75,.18),4px 6px 9px rgba(0,0,0,.32),inset -6px -8px 12px rgba(0,0,0,.16)}
.tn.can .cost{background:#f0c24b;color:#1d1a12}
.tn.max{background:radial-gradient(circle at 45% 40%,#f7f2e6 0 55%,#e7ddc6 100%);color:#23312a;box-shadow:2px 3px 5px rgba(0,0,0,.35),inset 0 0 0 2px #d2a944}
.tn.max .ico{opacity:.9}
.tn.ghost{background:none;box-shadow:none;border:1.5px dashed rgba(243,239,226,.28)}
.tn.ghost .ico{width:20px;height:20px;opacity:.35}
.tn.blocked{opacity:.32;filter:grayscale(1)}
.tn.finale:not(.ghost){box-shadow:0 0 0 2px #8cc8ff,0 0 20px rgba(140,200,255,.35),4px 6px 9px rgba(0,0,0,.32)}
.tn.sel{transform:scale(1.1)}
.tn:hover{transform:scale(1.05)}
.tn.popnow{animation:tnpop .38s ease-out}
@keyframes tnpop{0%{transform:scale(1)}25%{transform:scale(.84)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
#panel{position:relative;z-index:2;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ic nm buy" "ic ds buy";gap:3px 14px;align-items:center;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--paper);box-shadow:0 -6px 16px rgba(0,0,0,.3);min-height:96px}
#panel .pic{grid-area:ic;display:flex;color:var(--ink)}
#panel .pico{width:40px;height:40px}
#panel .nm{grid-area:nm;font-size:21px;font-weight:700}
#panel .nm small{font-size:14px;color:var(--muted);margin-left:8px;font-weight:600}
#panel .ds{grid-area:ds;font-size:16px;line-height:1.35}
#panel .buy{grid-area:buy}
#panel .hint{grid-column:1/-1;font-size:16px;color:var(--muted)}
#quitBox{position:relative;z-index:2;margin:0 16px 10px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#quitBox .txt{flex:1 1 220px;font-size:15px;line-height:1.35}
#quitBox .orders{flex:1 1 100%;margin-top:0;padding-top:8px;border-top:1px dashed rgba(91,74,28,.35)}
#quitBox .txt:empty{display:none}
#quitBox{cursor:pointer}
#quitBox .fold{font-weight:600;font-size:14px}
#quitBox .fold b{display:inline-block;margin-left:4px;opacity:.6}
#quitBox.folded{padding-top:7px;padding-bottom:7px}
#quitBox .txt:empty ~ .orders{border-top:0;padding-top:0}
@media (max-width:560px){
  #hud{gap:6px;padding-left:10px;padding-right:10px}
  #hud .note{min-width:0;padding:5px 8px 6px}
  #hud .lbl{font-size:16px}
  #hud .val{font-size:17px}
  #hud .sub{font-size:11px}
  #mug{width:72px;height:72px}
  #frenzy{top:calc(env(safe-area-inset-top,0px) + 84px);font-size:13px}
  #hud .ord span{display:none}
  #hud .rbox{gap:6px}
  #hud .rbox .note{min-width:74px}
  #bPause{padding:.45em .55em}
  .opt{grid-template-columns:92px 1fr 40px}
  #panel{grid-template-columns:auto 1fr;grid-template-areas:"ic nm" "ds ds" "buy buy";min-height:128px;align-content:start}
  #panel .pico{width:30px;height:30px}
  .tape{font-size:15px}
  #trees .tab{padding:7px 9px;font-size:13px}
}

<script id="core">
/* ============================================================
   BUBBLE BREAK – core. No DOM: the page and test/bubble_break.mjs both run this.

   Sheet geometry, in bubble pitches: cell (i,j) sits at
     x = i + 0.5 + 0.5*(j odd),  y = j*SQ + 0.5
   so odd rows are shifted half a bubble right (a hex packing). Which cells are
   still intact is a bitset, one Uint32 word per 32 cells of a row, so a press that
   covers a hundred thousand cells clears whole words at a time. Special bubbles
   (thick, gold, espresso, bang, giant, flat, sugar, zipper) are listed per row and
   masked out of the bitset sweeps; they are few, and each gets its own rules.
   ============================================================ */
const BB = (() => {
'use strict';
const VERSION = 1;
const SQ = 0.8660254037844386;

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PC16 = new Uint8Array(65536); for(let i = 1; i < 65536; i++) PC16[i] = PC16[i >> 1] + (i & 1);
function popcnt(x){ return PC16[x & 0xFFFF] + PC16[x >>> 16]; }
// bits lo..hi (inclusive, 0..31) of one word
function wordMask(lo, hi){ return hi - lo === 31 ? 0xFFFFFFFF : (((1 << (hi - lo + 1)) - 1) << lo) >>> 0; }

const T = { NORMAL:0, FLAT:1, THICK:2, GOLD:3, ESPRESSO:4, BANG:5, GIANT:6, SUGAR:7, ZIP:8 };

/* ---------- Stages: the same verbs at four scales ----------
   size[]  cells per sheet for each level of "Bigger delivery"
   reach   radius of the player's tool, in pitches (a thumb covers one bubble)
   budget  multiplier on the swipe budget
   value   Plopps per normal bubble before multipliers
   cost    multiplier on every break-tree price
   gate    Plopps in a job before quitting pays out; gain = calluses at the gate */
const STAGES = [
  { id:'desk',    size:[54, 80, 120, 176, 250, 340, 450],                               reach:.42, budget:1,    value:1,   cost:1,    bang:2.3, machine:'pin',    gate:3e5,   gain:3 },
  { id:'ship',    size:[600, 1000, 1600, 2600, 4200, 6800, 11000],                      reach:1.7, budget:14,   value:6,   cost:120,  bang:5,   machine:'roller', gate:3e8,   gain:24 },
  { id:'factory', size:[16000, 30000, 55000, 100000, 180000, 320000, 560000],           reach:10,  budget:400,  value:40,  cost:4e5,  bang:18,  machine:'press',  gate:1.2e13, gain:220 },
  { id:'city',    size:[1.2e6, 2.2e6, 4e6, 7e6, 1.2e7, 2e7, 3.2e7],                    reach:34,  budget:6000, value:250, cost:2e10, bang:55,  machine:'convoy', gate:1.5e17, gain:1800 },
];

/* ---------- Break tree: bought with Plopps, reset when you quit ----------
   x,y: position on the tree screen, x across from the root in node spacings, y up in rows.
   Both trees are mirror images about the root: three branches, the outer two the same shape. */
const RUN = [
  { id:'break',     x:0, y:0,      max:1,  base:0,     g:1,    parent:null },
  { id:'cup',       x:-2.6, y:1,   max:5,  base:35,    g:2.2,  parent:'break' },
  { id:'thumb',     x:0, y:1,      max:4,  base:150,   g:4,    parent:'break' },
  { id:'premium',   x:2.6, y:1,    max:25, base:50,    g:2.05, parent:'break' },
  { id:'espresso',  x:-3.9, y:2,   max:3,  base:500,   g:3,    parent:'cup' },
  { id:'rhythm',    x:-2.6, y:2,   max:4,  base:900,   g:2.8,  parent:'cup', fork:'A' },
  { id:'thorough',  x:-1.3, y:2,   max:4,  base:900,   g:2.8,  parent:'cup', fork:'A' },
  { id:'strength',  x:0, y:2,      max:6,  base:250,   g:3.2,  parent:'thumb' },
  { id:'delivery',  x:1.3, y:2,    max:6,  base:300,   g:2.7,  parent:'premium' },
  { id:'gold',      x:2.6, y:2,    max:4,  base:600,   g:3,    parent:'premium' },
  { id:'machine',   x:3.9, y:2,    max:4,  base:3000,  g:3.3,  parent:'premium' },
  { id:'qc',        x:-4.55, y:3,  max:3,  base:1500,  g:2.8,  parent:'espresso' },
  { id:'sprint',    x:-3.25, y:3,  max:3,  base:2000,  g:3,    parent:'espresso' },
  { id:'bang',      x:-0.65, y:3,  max:3,  base:2500,  g:3.2,  parent:'strength', fork:'B' },
  { id:'wave',      x:0.65, y:3,   max:4,  base:2500,  g:3.2,  parent:'strength', fork:'B' },
  { id:'giant',     x:3.25, y:3,   max:3,  base:5000,  g:3.5,  parent:'machine' },
  { id:'shift',     x:4.55, y:3,   max:3,  base:20000, g:3.5,  parent:'machine' },
  { id:'sugar',     x:-3.9, y:4,   max:3,  base:6000,  g:3.4,  parent:'sprint' },
  { id:'stamina',   x:0, y:4,      max:3,  base:3500,  g:3,    parent:'strength' },
  { id:'zipper',    x:3.9, y:4,    max:3,  base:6000,  g:3.4,  parent:'giant' },
  { id:'sweettooth',x:-3.9, y:5,   max:3,  base:30000, g:3.6,  parent:'sugar' },
  { id:'iron',      x:0, y:5,      max:1,  base:60000, g:1,    parent:'stamina' },
  { id:'crosszip',  x:3.9, y:5,    max:1,  base:60000, g:1,    parent:'zipper' },
];

/* ---------- Career tree: bought with calluses, kept forever ---------- */
const CAREER = [
  { id:'cv',         x:0, y:0,      max:1, cost:[0] },
  { id:'callus',     x:-2.6, y:1,   max:5, cost:[2, 5, 12, 30, 75],          parent:'cv' },
  { id:'memory',     x:0, y:1,      max:3, cost:[1, 4, 12],                  parent:'cv' },
  { id:'coffee',     x:2.6, y:1,    max:2, cost:[3, 10],                     parent:'cv' },
  { id:'intern',     x:-3.25, y:2,  max:1, cost:[4],                         parent:'callus' },
  { id:'flexible',   x:-1.95, y:2,  max:1, cost:[8],                         parent:'callus' },
  { id:'ship',       x:0, y:2,      max:1, cost:[16],                        parent:'memory', stage:1 },
  { id:'savings',    x:1.95, y:2,   max:3, cost:[3, 12, 40],                 parent:'coffee' },
  { id:'nose',       x:3.25, y:2,   max:2, cost:[5, 16],                     parent:'coffee' },
  { id:'pinsub',     x:-3.25, y:3,  max:1, cost:[6],                         parent:'intern' },
  { id:'overtime',   x:-1.3, y:3,   max:2, cost:[30, 90],                    parent:'ship' },
  { id:'factory',    x:0, y:3,      max:1, cost:[180],                       parent:'ship', stage:2 },
  { id:'twohands',   x:1.3, y:3,    max:1, cost:[70],                        parent:'ship' },
  { id:'supplier',   x:3.25, y:3,   max:2, cost:[20, 70],                    parent:'nose' },
  { id:'headhunter', x:-3.25, y:4,  max:2, cost:[150, 900],                  parent:'pinsub' },
  { id:'hydraulic',  x:-1.3, y:4,   max:2, cost:[300, 1200],                 parent:'factory' },
  { id:'city',       x:0, y:4,      max:1, cost:[3000],                       parent:'factory', stage:3 },
  { id:'nightshift', x:1.3, y:4,    max:3, cost:[250, 900, 3500],            parent:'factory' },
  { id:'sweets',     x:3.25, y:4,   max:2, cost:[200, 1500],                 parent:'supplier' },
  { id:'lasso',      x:-0.65, y:5,  max:1, cost:[6000],                      parent:'city' },
  { id:'domino',     x:0.65, y:5,   max:2, cost:[8000, 30000],               parent:'city' },
  { id:'world',      x:0, y:6,      max:1, cost:[120000],                     parent:'city', finale:true },
];
const byId = (list) => Object.fromEntries(list.map(n => [n.id, n]));
const RUN_BY = byId(RUN), CAREER_BY = byId(CAREER);

/* ---------- Orders: three goals per job, each one pays more calluses when you quit ----------
   n[] is the target at the desk, the warehouse, the factory and the city; `need` is the
   break-tree node (or, with car:true, the career node) the goal is about. */
const ORDERS = [
  { id:'combo',  n:[40, 250, 5000, 150000] },
  { id:'sheets', n:[4, 4, 3, 2] },
  { id:'earn',   n:[.04, .03, .02, .02], gate:true },
  { id:'clean',  n:[1, 0, 0, 0] },       // from the warehouse on a palm always catches a flat one
  { id:'gold',   n:[4, 6, 8, 10],        need:'gold' },
  { id:'bonus',  n:[5, 6, 7, 8],         need:'espresso' },
  { id:'giant',  n:[1, 2, 2, 3],         need:'giant' },
  { id:'frenzy', n:[2, 2, 3, 3],         need:'sugar' },
  { id:'zip',    n:[3, 4, 5, 6],         need:'zipper' },
  { id:'loop',   n:[0, 0, 0, 2e6],       need:'lasso', car:true },
];
const ORDERS_BY = byId(ORDERS);

/* ---------- Stickers: one for each thing worth remembering; each adds 1 % to everything ---------- */
const STICKERS = [
  { id:'first',     t: S => S.lifePops >= 1 },
  { id:'pop1k',     t: S => S.lifePops >= 1e3 },
  { id:'pop1m',     t: S => S.lifePops >= 1e6 },
  { id:'pop1b',     t: S => S.lifePops >= 1e9 },
  { id:'pop1t',     t: S => S.lifePops >= 1e12 },
  { id:'pop1qa',    t: S => S.lifePops >= 1e15 },
  { id:'combo100',  t: S => S.best.combo >= 100 },
  { id:'combo10k',  t: S => S.best.combo >= 1e4 },
  { id:'combo1m',   t: S => S.best.combo >= 1e6 },
  { id:'sheet1',    t: S => S.stats.sheets >= 1 },
  { id:'sheets100', t: S => S.stats.sheets >= 100 },
  { id:'sheets1k',  t: S => S.stats.sheets >= 1000 },
  { id:'clean',     t: S => S.stats.clean >= 1 },
  { id:'gold1',     t: S => S.stats.golds >= 1 },
  { id:'gold250',   t: S => S.stats.golds >= 250 },
  { id:'giant1',    t: S => S.stats.giants >= 1 },
  { id:'giant50',   t: S => S.stats.giants >= 50 },
  { id:'frenzy1',   t: S => S.stats.frenzies >= 1 },
  { id:'frenzy50',  t: S => S.stats.frenzies >= 50 },
  { id:'zip1',      t: S => S.stats.zips >= 1 },
  { id:'zip200',    t: S => S.stats.zips >= 200 },
  { id:'pfft',      t: S => S.stats.flats >= 25 },
  { id:'long',      t: S => S.stats.longest >= 60 },
  { id:'orders',    t: S => S.stats.allOrders >= 1 },
  { id:'quit1',     t: S => S.quits >= 1 },
  { id:'quit10',    t: S => S.quits >= 10 },
  { id:'ship',      t: S => S.unlocked >= 1 },
  { id:'factory',   t: S => S.unlocked >= 2 },
  { id:'city',      t: S => S.unlocked >= 3 },
  { id:'loop',      t: S => S.stats.loop >= 1e6 },
  { id:'domino',    t: S => S.stats.domino >= 12 },
  { id:'world',     t: S => S.finale.act >= 1 },
  { id:'end',       t: S => S.finale.done },
];

/* ---------- State ---------- */
function newStats(){ return { sheets:0, clean:0, golds:0, giants:0, frenzies:0, zips:0, flats:0, longest:0, allOrders:0, loop:0, domino:0 }; }
function newState(){
  const S = { v:VERSION, stage:0, unlocked:0, plopps:0, cycleEarned:0, lastCycleEarned:0, lifeEarned:0, lifePops:0,
           runs:0, cycleRuns:0, lv:{ break:1 }, cl:{ cv:1 }, calluses:0, callusesEarned:0, quits:0,
           forks:{}, best:{ run:0, combo:0, sheets:0 }, playTime:0, autoBuy:true, finale:{ done:false, pops:0, act:0 },
           stats:newStats(), stickers:{}, orders:null, jobSeed:1 };
  S.orders = newOrders(S);
  return S;
}
function load(json){
  const S = newState(); if(!json) return S;
  try {
    const o = typeof json === 'string' ? JSON.parse(json) : json; if(!o || o.v !== VERSION) return S;
    Object.assign(S, o); S.lv.break = 1; S.cl.cv = 1;
    // saves from the first version: fields that came later, and the world, which now lies past the city
    S.stats = Object.assign(newStats(), o.stats || {}); S.stickers = o.stickers || {}; S.finale = Object.assign({ done:false, pops:0, act:0 }, o.finale || {});
    if(S.cl.world && !S.cl.city){ S.cl.city = 1; S.unlocked = Math.max(S.unlocked, 3); }
    if(!Array.isArray(o.orders)) S.orders = newOrders(S);
  } catch(e) { }
  return S;
}
const lv = (S, id) => S.lv[id] || 0;
const cl = (S, id) => S.cl[id] || 0;
const stickerCount = S => STICKERS.reduce((a, s) => a + (S.stickers[s.id] ? 1 : 0), 0);

/* ---------- Derived numbers ---------- */
function derive(S){
  const st = STAGES[S.stage];
  const L = id => lv(S, id), C = id => cl(S, id);
  const callusRate = .10 + .02*C('callus');
  const nightshift = Math.pow(2, C('nightshift'));
  // the coffee fund pays extra for the first break of every job after the first
  const fund = S.cycleRuns === 0 && S.quits > 0 ? 1 + C('savings') : 1;
  const stickers = 1 + .01*stickerCount(S);
  const value = st.value * Math.pow(1.3, L('premium')) * (1 + callusRate*S.callusesEarned) * nightshift * fund * stickers;
  const budgetLv = [0, 6, 10, 16, 25, 40, 60][L('strength')];
  const sizeIdx = Math.min(st.size.length-1, L('delivery'));
  const size = st.size[sizeIdx];
  return {
    stage: S.stage, st,
    time: 20 + 3*L('cup') + 5*C('coffee'),
    reach: st.reach * [1, 1.55, 2.1, 2.8, 3.6][L('thumb')],
    value,
    budget: budgetLv * st.budget * (L('iron') ? 1.5 : 1),
    refill: [.4, .3, .22, .15][L('stamina')],
    size,
    comboCap: 1 + L('rhythm'),            // extra multiplier on top of x1
    comboWin: .8 + .1*L('rhythm'),
    clearMul: .5 * (1 + 1.5*L('thorough')),
    clearTime: .5*L('thorough') + .75*C('overtime'),
    gold: .015*L('gold') * (1 + .5*C('nose')), goldCap: Math.round(4*L('gold') * (1 + .5*C('nose'))),
    espresso: .012*L('espresso'), espressoCap: 3*L('espresso'),
    bang: .012*L('bang'), bangCap: 8*L('bang'), bangR: st.bang * (1 + .25*L('bang')),
    wave: L('wave') ? 1 + .35*L('wave') : 0,
    flat: [.05, .035, .02, .008][L('qc')],
    thick: .04,
    holdTime: [.28, .2, .14, .09][L('qc')],
    sprint: 1 + .5*L('sprint'),
    giants: L('giant') + C('supplier'),
    // sugar bubbles: how many a sheet holds on average grows slowly with the sheet
    sugar: L('sugar') ? .3*L('sugar')*(1 + Math.log10(Math.max(1, size/500))/2) : 0,
    frenzyT: 4 + 1.5*L('sweettooth') + C('sweets'), frenzyMul: 3 + L('sweettooth') + C('sweets'), frenzyMax: 12,
    zip: .01*L('zipper'), zipCap: L('zipper') ? 2*L('zipper') + S.stage : 0, cross: L('crosszip') > 0,
    iron: L('iron') > 0,
    lasso: C('lasso') > 0, domino: [0, 1.4, 1.8][C('domino')],

}

/* ---------- Economy ---------- */
function runCost(S, n){ return Math.round(n.base * Math.pow(n.g, lv(S, n.id)) * STAGES[S.stage].cost); }
function runVisible(S, n){ return !n.parent || lv(S, n.parent) > 0 || lv(S, n.id) > 0; }
function forkBlocked(S, n){
  if(!n.fork || cl(S, 'flexible')) return false;
  return RUN.some(o => o.fork === n.fork && o.id !== n.id && lv(S, o.id) > 0);
}
function canBuyRun(S, n){ return n.max > lv(S, n.id) && runVisible(S, n) && !forkBlocked(S, n) && S.plopps >= runCost(S, n); }
function buyRun(S, id){ const n = RUN_BY[id]; if(!n || !canBuyRun(S, n)) return false; S.plopps -= runCost(S, n); S.lv[id] = lv(S, id) + 1; return true; }
// the intern: after a break, buy the cheapest things you can afford (never picks a fork you have not chosen yourself)
function autoBuy(S, choose){
  let bought = 0;
  for(let guard = 0; guard < 400; guard++){
    let best = null, bc = Infinity;
    for(const n of RUN){
      if(n.fork && !cl(S, 'flexible') && !RUN.some(o => o.fork === n.fork && lv(S, o.id) > 0) && !(choose && choose(n))) continue;
      if(!canBuyRun(S, n)) continue;
      const c = runCost(S, n); if(c < bc){ bc = c; best = n; }
    }
    if(!best) break; buyRun(S, best.id); bought++;
  }
  return bought;
}
function careerCost(S, n){ const l = cl(S, n.id); return l < n.max ? n.cost[l] : Infinity; }
function careerVisible(S, n){ return !n.parent || cl(S, n.parent) > 0 || cl(S, n.id) > 0; }
function canBuyCareer(S, n){ return cl(S, n.id) < n.max && careerVisible(S, n) && S.calluses >= careerCost(S, n); }
function buyCareer(S, id){
  const n = CAREER_BY[id]; if(!n || !canBuyCareer(S, n)) return false;
  S.calluses -= careerCost(S, n); S.cl[id] = cl(S, id) + 1;
  if(n.stage) S.unlocked = Math.max(S.unlocked, n.stage);
  if(id === 'headhunter') topUpOrders(S);
  freshCycleStage(S);
  return true;
}
// a job that has not started yet moves straight to the newest workplace and gets its start bonuses
function freshCycleStage(S){
  if(S.cycleRuns === 0 && S.cycleEarned === 0){
    const moved = S.stage !== S.unlocked; S.stage = S.unlocked;
    if(S.quits) startBonuses(S);
    if(moved) S.orders = newOrders(S);
  }
}
function orderBonus(S){ return .25 + .1*cl(S, 'headhunter'); }
function ordersDone(S){ return (S.orders || []).filter(o => o.done).length; }
function quitGain(S){ const st = STAGES[S.stage]; if(S.cycleEarned < st.gate) return 0; return Math.floor(st.gain * Math.cbrt(S.cycleEarned / st.gate) * (1 + orderBonus(S)*ordersDone(S))); }
function quitProgress(S){ return Math.min(1, S.cycleEarned / STAGES[S.stage].gate); }
function quit(S){
  const g = quitGain(S); if(g <= 0) return 0;
  if(S.orders && S.orders.length && S.orders.every(o => o.done)) S.stats.allOrders++;
  S.calluses += g; S.callusesEarned += g; S.quits++;
  S.lastCycleEarned = S.cycleEarned;
  S.plopps = 0;
  S.cycleEarned = 0; S.cycleRuns = 0; S.forks = {};
  S.lv = { break:1 };
  S.stage = S.unlocked;
  startBonuses(S);
  S.orders = newOrders(S);
  checkStickers(S);
  return g;
}
// what a new job starts with; also applied when you buy one of these before your first break in the job
function startBonuses(S){
  const m = cl(S, 'memory'); if(m){ S.lv.thumb = Math.max(lv(S, 'thumb'), 1); S.lv.strength = Math.max(lv(S, 'strength'), m); }
  if(cl(S, 'pinsub')){ S.lv.delivery = Math.max(lv(S, 'delivery'), 1); S.lv.machine = Math.max(lv(S, 'machine'), 1); }
  if(cl(S, 'sweets') >= 2){ S.lv.sugar = Math.max(lv(S, 'sugar'), 1); }
}

/* ---------- Orders ---------- */
function orderTarget(S, o){ const k = Math.min(S.stage, o.n.length - 1); return o.gate ? niceRound(o.n[k]*STAGES[S.stage].gate) : o.n[k]; }
function niceRound(x){ const e = Math.pow(10, Math.floor(Math.log10(x))); return Math.round(x/e)*e; }
function newOrders(S){
  const n = 3 + (cl(S, 'headhunter') ? 1 : 0);
  // the very first job teaches: a combo, a few sheets, gold
  if(S.quits === 0 && S.stage === 0) return ['sheets', 'combo', 'gold'].concat(n > 3 ? ['clean'] : []).map(id => ({ id, n: orderTarget(S, ORDERS_BY[id]), best:0, done:false }));
  const rnd = mulberry((S.jobSeed = (S.jobSeed || 1) + 1)*2654435761);
  const pool = ORDERS.filter(o => o.n[Math.min(S.stage, o.n.length - 1)] > 0 && (!o.car || cl(S, o.need)));
  const out = [];
  while(out.length < n && pool.length){ const o = pool.splice((rnd()*pool.length)|0, 1)[0]; out.push({ id:o.id, n: orderTarget(S, o), best:0, done:false }); }
  return out;
}
function topUpOrders(S){
  const want = 3 + (cl(S, 'headhunter') ? 1 : 0); if(!S.orders || S.orders.length >= want) return;
  const have = new Set(S.orders.map(o => o.id)), o = ORDERS.find(o => !have.has(o.id) && o.n[Math.min(S.stage, o.n.length - 1)] > 0 && (!o.car || cl(S, o.need)));
  if(o) S.orders.push({ id:o.id, n: orderTarget(S, o), best:0, done:false });
}
function orderValue(id, run){
  switch(id){
    case 'combo': return run.maxCombo; case 'sheets': return run.sheets; case 'earn': return run.earned; case 'clean': return run.cleanSheets;
    case 'gold': return run.golds; case 'bonus': return run.bonusT; case 'giant': return run.giants; case 'frenzy': return run.frenzies;
    case 'zip': return run.zipsDone; case 'loop': return run.bestLoop;
  }
  return 0;
}
// returns the indices of orders that this call completed
function checkOrders(S, run){
  const done = [];
  (S.orders || []).forEach((o, k) => { if(o.done) return; const v = orderValue(o.id, run); if(v > o.best) o.best = v; if(o.best >= o.n){ o.done = true; done.push(k); } });
  return done;
}
function checkStickers(S){
  const got = [];
  for(const s of STICKERS) if(!S.stickers[s.id] && s.t(S)){ S.stickers[s.id] = 1; got.push(s.id); }
  return got;
}

/* ---------- Sheet ---------- */
function makeSheet(P, aspect, rnd){
  const n = P.size;
  // aspect = width/height = cols/(rows*SQ), and cols*rows = n
  let rows = Math.max(3, Math.round(Math.sqrt(n / (aspect * SQ))));
  let cols = Math.max(3, Math.round(n / rows));
  const words = (cols + 31) >>> 5, N = cols*rows;
  const bits = new Uint32Array(rows*words), smask = new Uint32Array(rows*words);
  const last = wordMask(0, (cols - 1) & 31);
  for(let j = 0; j < rows; j++){ const b = j*words; bits.fill(0xFFFFFFFF, b, b + words - 1); bits[b + words - 1] = last; }
  const sh = { cols, rows, words, bits, smask, N, left:N, spI:[], spT:[], spG:[], giants:[], flats:0, id: (rnd()*1e9)|0 };
  const special = new Map();
  const isFree = idx => !special.has(idx);
  // giants first: a centre and its six neighbours
  for(let k = 0; k < P.giants; k++){
    for(let tries = 0; tries < 40; tries++){
      const i = 1 + ((rnd()*(cols-2))|0), j = 1 + ((rnd()*(rows-2))|0);
      const cells = [[i,j], ...neighbours(i, j)].filter(([a,b]) => a >= 0 && b >= 0 && a < cols && b < rows);
      if(cells.length < 7 || !cells.every(([a,b]) => isFree(b*cols + a))) continue;
      const g = sh.giants.length;
      sh.giants.push({ i, j, x: cx(i,j), y: cy(j), hits:0, need: 3 + P.stage, cells: cells.map(([a,b]) => b*cols + a), alive:true });
      for(const [a,b] of cells) special.set(b*cols + a, [T.GIANT, g]);
      break;
    }
  }
  // specials are things you go and get, so their count is capped however big the sheet grows
  const place = (k, t) => { for(let c = 0, tries = 0; c < k && tries < k*6 + 6; tries++){ const idx = (rnd()*N)|0; if(!isFree(idx)) continue; special.set(idx, [t, -1]); c++; } };
  const count = (p, cap) => Math.min(Math.round(p*N), cap);
  place(count(P.flat, 60), T.FLAT); place(count(P.thick, 40), T.THICK); place(count(P.gold, P.goldCap), T.GOLD); place(count(P.espresso, P.espressoCap), T.ESPRESSO); place(count(P.bang, P.bangCap), T.BANG);
  if(P.sugar) place(Math.floor(P.sugar + rnd()), T.SUGAR);
  if(P.zip) place(count(P.zip, P.zipCap), T.ZIP);
  for(let j = 0; j < rows; j++){ sh.spI.push([]); sh.spT.push([]); sh.spG.push([]); }
  const keys = [...special.keys()].sort((a,b) => a-b);
  for(const idx of keys){ const [t,g] = special.get(idx), j = (idx/cols)|0, i = idx - j*cols; sh.spI[j].push(i); sh.spT[j].push(t); sh.spG[j].push(g); sh.smask[j*words + (i>>>5)] |= (1 << (i & 31)) >>> 0; if(t === T.FLAT) sh.flats++; }
  for(let j = 0; j < rows; j++){ sh.spI[j] = Int32Array.from(sh.spI[j]); sh.spT[j] = Uint8Array.from(sh.spT[j]); sh.spG[j] = Int16Array.from(sh.spG[j]); }
  sh.left = N - sh.flats;
  sh.W = cols + .5; sh.H = (rows-1)*SQ + 1;
  return sh;
}
const cx = (i, j) => i + .5 + .5*(j & 1);
const cy = j => j*SQ + .5;
function neighbours(i, j){ const o = j & 1; return [[i-1,j],[i+1,j],[i-1+o,j-1],[i+o,j-1],[i-1+o,j+1],[i+o,j+1]]; }
function isIntact(sh, i, j){ return (sh.bits[j*sh.words + (i>>>5)] >>> (i & 31)) & 1; }
function clearBit(sh, i, j){ sh.bits[j*sh.words + (i>>>5)] &= ~(1 << (i & 31)); }
function lowerBound(a, x){ let lo = 0, hi = a.length; while(lo < hi){ const m = (lo + hi) >> 1; if(a[m] < x) lo = m + 1; else hi = m; } return lo; }
function specialAt(sh, i, j){ const a = sh.spI[j], k = lowerBound(a, i); return k < a.length && a[k] === i ? k : -1; }
function intactCount(sh){ let c = 0; for(let k = 0; k < sh.bits.length; k++) c += popcnt(sh.bits[k] & ~sh.smask[k]); return c; }

/* ---------- Run ---------- */
function startRun(S, opts){
  opts = opts || {};
  freshCycleStage(S);
  if(!S.orders) S.orders = newOrders(S);
  const P = derive(S), rnd = mulberry(opts.seed != null ? opts.seed : (Math.random()*2**31)|0);
  const run = { S, P, rnd, aspect: opts.aspect || 1.5, t:0, time:P.time, bonusT:0, earned:0, pops:0, playerPops:0, machinePops:0,
    combo:0, maxCombo:0, lastPop:-9, sheets:0, slide:0, over:false, down:false, x:0, y:0, moved:0, still:0, hold:0,
    budget:P.budget, aid:0, pending:[], machines:[], machineT:1.5, flats:0, golds:0, giants:0, espressos:0, bangs:0, best:null,
    frenzy:0, frenzies:0, zips:[], zipsDone:0, cleanSheets:0, sheetFlat:false, path:[], pathLen:[], bestLoop:0, loops:0, domino:0,
    orderT:0, ev: newEvents() };
  run.sheet = makeSheet(P, run.aspect, rnd);
  S.runs++; S.cycleRuns++;

}
function newEvents(){ return { spans:[], specials:[], flats:[], rings:[], giantHits:[], sheet:false, cleared:false, playerPops:0, machinePops:0, chainPops:0, value:0, budgetOut:false, time:[], loops:[], orders:[], frenzy:false }; }
function takeEvents(run){ const e = run.ev; run.ev = newEvents(); return e; }

function comboMul(run){ return 1 + Math.min(run.P.comboCap, Math.floor(run.combo/5)*.1); }
function valueNow(run){ return run.P.value * (run.time <= 5 ? run.P.sprint : 1) * (run.frenzy > 0 ? run.P.frenzyMul : 1); }
// bonus time fills a jar that holds three quarters of the base break: each second in it makes the next worth less
function addTime(run, raw){ const cap = run.P.time * .75, g = raw * Math.max(0, 1 - run.bonusT/cap); run.bonusT += g; run.time += g; return g; }
function earn(run, v){ run.earned += v; run.ev.value += v; }

// pop cells of row j between i0 and i1 for `who`; returns how much budget it used
// who: 'player', 'loop' (the inside of a lasso: a player's pop that pays triple), 'machine',
// 'chain' (bangs, waves, shockwaves) or 'zip'
function popSpan(run, j, i0, i1, budget, who){
  const sh = run.sheet;
  if(j < 0 || j >= sh.rows) return 0;
  if(i0 < 0) i0 = 0; if(i1 >= sh.cols) i1 = sh.cols - 1; if(i0 > i1 || budget <= 0) return 0;
  let used = 0, gained = 0;
  const player = who === 'player' || who === 'loop', loopMul = who === 'loop' ? 3 : 1;
  // special bubbles in the span, each by its own rule
  const spI = sh.spI[j];
  if(spI.length){
    for(let k = lowerBound(spI, i0); k < spI.length && spI[k] <= i1 && used < budget; k++){
      const i = spI[k]; if(!isIntact(sh, i, j)) continue;
      const t = sh.spT[j][k], x = cx(i, j), y = cy(j);
      if(t === T.FLAT){
        // pressed on purpose it spoils the combo; swiped over it only costs a little strength
        clearBit(sh, i, j);
        if(player && run.swiping){ used++; run.ev.flats.push(x, y, 2); }
        else { run.ev.flats.push(x, y, player ? 1 : 0); if(player){ run.combo = 0; run.flats++; run.sheetFlat = true; } }
        continue;
      }
      if(t === T.THICK && player) continue;                         // needs a held press
      if((t === T.GOLD || t === T.ESPRESSO || t === T.SUGAR || t === T.ZIP) && who === 'machine') continue;   // too good for the machine
      if(t === T.GIANT){ if(player) hitGiant(run, sh.spG[j][k]); continue; }
      clearBit(sh, i, j); sh.left--; used++;
      let v = valueNow(run);
      if(t === T.THICK) v *= 5;
      if(t === T.GOLD){ v *= 20; run.golds++; }
      if(t === T.ESPRESSO){ v *= 3; run.espressos++; run.ev.time.push(x, y, addTime(run, .6)); }
      if(t === T.BANG){ v *= 3; run.bangs++; run.pending.push({ at: run.t + .08, x, y, r: run.P.bangR, who:'chain', ring:true, gen:0 }); }
      if(t === T.SUGAR){ v *= 5; run.frenzies++; run.frenzy = Math.min(run.P.frenzyMax, Math.max(0, run.frenzy) + run.P.frenzyT); run.ev.frenzy = true; }
      if(t === T.ZIP){ v *= 3; startZip(run, i, j); }
      if(player){ run.combo++; run.lastPop = run.t; v *= comboMul(run)*loopMul; run.playerPops++; }
      else if(who === 'machine') run.machinePops++;

    }
  }
  // ordinary bubbles, a word at a time
  const words = sh.words, base = j*words;
  let n = 0;
  for(let w = i0 >>> 5, wEnd = i1 >>> 5; w <= wEnd && used < budget; w++){
    const lo = w === (i0 >>> 5) ? i0 & 31 : 0, hi = w === wEnd ? i1 & 31 : 31;
    let m = sh.bits[base + w] & ~sh.smask[base + w] & wordMask(lo, hi);
    if(!m) continue;
    let c = m === -1 || m === 0xFFFFFFFF ? 32 : popcnt(m);
    if(c > budget - used){ let need = budget - used, keep = 0; while(need-- > 0){ const low = m & -m; keep |= low; m ^= low; } m = keep >>> 0; c = popcnt(m); }
    sh.bits[base + w] &= ~m; used += c; n += c;
  }
  if(n){
    sh.left -= n;
    let v = n * valueNow(run);
    if(player){ run.combo += n; run.lastPop = run.t; v *= comboMul(run)*loopMul; run.playerPops += n; run.ev.playerPops += n; }
    else if(who === 'machine'){ run.machinePops += n; run.ev.machinePops += n; }
    else { run.ev.chainPops += n; if(who === 'zip') v *= 2; }
    gained += v;
  }
  if(used){ run.ev.spans.push(j, i0, i1); run.pops += used; run.maxCombo = Math.max(run.maxCombo, run.combo); }

}
function popCircle(run, x, y, R, budget, who){
  const sh = run.sheet;
  const j0 = Math.max(0, Math.ceil((y - R - .5)/SQ)), j1 = Math.min(sh.rows - 1, Math.floor((y + R - .5)/SQ));

  for(let j = j0; j <= j1 && used < budget; j++){
    const dy = cy(j) - y; if(dy*dy > R*R) continue;
    const w = Math.sqrt(R*R - dy*dy), off = .5 + .5*(j & 1);
    used += popSpan(run, j, Math.ceil(x - w - off), Math.floor(x + w - off), budget - used, who);
  }
  return used;
}
function popRect(run, x0, y0, x1, y1, who){
  const sh = run.sheet, j0 = Math.max(0, Math.ceil((y0 - .5)/SQ)), j1 = Math.min(sh.rows-1, Math.floor((y1 - .5)/SQ));
  let used = 0;
  for(let j = j0; j <= j1; j++){ const off = .5 + .5*(j & 1); used += popSpan(run, j, Math.ceil(x0 - off), Math.floor(x1 - off), Infinity, who); }
  return used;
}
// every bubble whose centre lies inside the polygon (flat x,y pairs), row by row
function popPolygon(run, poly, who){
  const sh = run.sheet, n = poly.length/2;
  let y0 = Infinity, y1 = -Infinity; for(let k = 1; k < poly.length; k += 2){ y0 = Math.min(y0, poly[k]); y1 = Math.max(y1, poly[k]); }
  const j0 = Math.max(0, Math.ceil((y0 - .5)/SQ)), j1 = Math.min(sh.rows - 1, Math.floor((y1 - .5)/SQ));
  let used = 0; const xs = [];
  for(let j = j0; j <= j1; j++){
    const y = cy(j); xs.length = 0;
    for(let a = 0, b = n - 1; a < n; b = a++){
      const ya = poly[2*a + 1], yb = poly[2*b + 1];
      if((ya <= y) !== (yb <= y)) xs.push(poly[2*a] + (y - ya)*(poly[2*b] - poly[2*a])/(yb - ya));
    }
    xs.sort((p, q) => p - q);
    const off = .5 + .5*(j & 1);
    for(let k = 0; k + 1 < xs.length; k += 2) used += popSpan(run, j, Math.ceil(xs[k] - off), Math.floor(xs[k+1] - off), Infinity, who);

}
function hitGiant(run, g){
  const gi = run.sheet.giants[g]; if(!gi || !gi.alive || gi.lastAid === run.aid) return;
  gi.lastAid = run.aid; gi.hits++;
  run.ev.giantHits.push(g, gi.hits, gi.need);
  if(gi.hits < gi.need) return;
  gi.alive = false; run.giants++;
  const sh = run.sheet;
  for(const idx of gi.cells){ const j = (idx / sh.cols)|0, i = idx - j*sh.cols; if(isIntact(sh, i, j)){ clearBit(sh, i, j); sh.left--; } }
  run.ev.spans.push(gi.j-1, gi.i-1, gi.i+1, gi.j, gi.i-1, gi.i+1, gi.j+1, gi.i-1, gi.i+1);
  const v = 150 * valueNow(run) * comboMul(run); earn(run, v); run.pops += 7; run.playerPops += 7;
  run.ev.specials.push(gi.x, gi.y, T.GIANT);
  run.pending.push({ at: run.t + .1, x: gi.x, y: gi.y, r: 3.2 * (run.P.stage ? run.P.st.bang/2.3 : 1), who:'chain', ring:true, gen:0 });
}
// giants are hit by the tool touching any of their cells
function touchGiants(run, x, y, R){
  const sh = run.sheet;
  for(let g = 0; g < sh.giants.length; g++){ const gi = sh.giants[g]; if(gi.alive && Math.hypot(gi.x - x, gi.y - y) < R + 1.45) hitGiant(run, g); }
}
function toolPoints(run, x, y){
  const pts = [[x, y]];
  if(run.P.twoHands){ const sh = run.sheet; pts.push([sh.W - x, sh.H - y]); }
  return pts;

  master = AC.createGain();
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = .002;

// sliders are linear to the eye; the ear wants them squared

  const v = S.ui.vol; S.ui.sound = v.master > 0 && v.sfx > 0;

  mainOut.gain.setTargetAtTime(v.master*v.master, t, .03);

const LEAD = .03;
