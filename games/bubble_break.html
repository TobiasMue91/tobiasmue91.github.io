<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bubble Break — a bubble wrap incremental</title>
<meta name="description" content="An incremental game about popping bubble wrap on your coffee break. Press, then swipe; hold the thick ones, grab the gold, feed the giant bubble to your thumb. Quit your job for calluses, move from the office desk to the shipping warehouse and the factory floor, and end by wrapping the whole world and popping it. English and German.">
<meta name="theme-color" content="#7a4f2a">
<link rel="canonical" href="https://gptgames.dev/games/bubble_break.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="gptgames.dev">
<meta property="og:url" content="https://gptgames.dev/games/bubble_break.html">
<meta property="og:title" content="Bubble Break — a bubble wrap incremental">
<meta property="og:description" content="Pop bubble wrap on your coffee break, quit for calluses, and work your way up to popping the whole world.">
<meta property="og:image" content="https://gptgames.dev/screenshots/screenshot_344.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Bubbles&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --ink:#231b14; --paper:#fbf7ee; --receipt:#f7f5ef; --note:#ffe27a; --note-2:#ffd95a; --note-edge:#e2bf45;
  --tape:#18181a; --tape-text:#f3f2ec; --red:#c8321f; --blue:#245f86; --gold:#c9920f; --muted:#6d6153;
  --display:"Rubik Bubbles","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --ui:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#7a4f2a;color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--ui);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Dymo label tape: the button of this desk */
.tape{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;background:var(--tape);color:var(--tape-text);
  padding:.62em 1.1em .58em;font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;
  text-shadow:0 -1px 0 rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.18);box-shadow:0 2px 3px rgba(0,0,0,.35);
  clip-path:polygon(0 8%,3% 0,97% 0,100% 8%,100% 92%,97% 100%,3% 100%,0 92%);transition:transform .08s}
.tape:active{transform:translateY(1px)}
.tape.red{background:#8e1b12}
.tape.ghost{background:transparent;color:var(--ink);text-shadow:none;box-shadow:inset 0 0 0 2px var(--ink)}
.tape[disabled]{opacity:.45;cursor:default}
.tape small{letter-spacing:.06em;font-size:.78em;opacity:.8;text-transform:none}

.note{background:linear-gradient(180deg,var(--note) 0%,var(--note-2) 100%);box-shadow:0 1px 1px rgba(0,0,0,.12),0 6px 10px -4px rgba(0,0,0,.35);position:relative}
.note:after{content:"";position:absolute;right:0;bottom:0;width:14px;height:14px;background:linear-gradient(135deg,var(--note-edge) 0 50%,transparent 50%);box-shadow:-1px -1px 2px rgba(0,0,0,.12)}
.hand{font-family:var(--hand);font-weight:700}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}
#hud .note{padding:6px 12px 8px;min-width:128px}
#hud .l{justify-self:start;transform:rotate(-1.6deg)}
#hud .r{justify-self:end;transform:rotate(1.3deg);text-align:right}
#hud .lbl{font-family:var(--hand);font-size:19px;line-height:1;color:#5b4a1c}
#hud .val{font-family:var(--mono);font-weight:600;font-size:23px;line-height:1.15}
#hud .sub{font-size:13px;color:#5b4a1c;font-weight:600}
#mug{position:relative;width:86px;height:86px;justify-self:center}
#mug .cup{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#3a2212 0 52%,#4b2d16 53% 58%,#ece6dc 59% 70%,#fdfbf6 71% 82%,#d9d2c6 83% 100%);box-shadow:5px 7px 10px rgba(0,0,0,.35)}
#mug .handle{position:absolute;right:-4px;top:32px;width:20px;height:22px;border-radius:0 12px 12px 0;border:7px solid #f4efe6;border-left:0;box-shadow:4px 4px 6px rgba(0,0,0,.25)}
#mug svg{position:absolute;inset:0;transform:rotate(-90deg)}
#mug .ring{fill:none;stroke:rgba(255,255,255,.18);stroke-width:5}
#mug .left{fill:none;stroke:#e9c38f;stroke-width:5;stroke-linecap:round;transition:stroke .3s}
#mug .secs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:22px;color:#f5e6cf;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#mug.sprint .left{stroke:#ff8a5c}
#combo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(34px,7vw,64px);color:#fff;-webkit-text-stroke:2px rgba(35,27,20,.55);text-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .3s;z-index:1}
#floats{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:600;font-size:17px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 1px #000;white-space:nowrap;animation:fl 1.1s ease-out forwards}
.fl.gold{color:#ffd76a;font-size:20px}
.fl.big{font-family:var(--display);font-size:30px}
.fl.warn{color:#ffb2a4}
@keyframes fl{0%{opacity:0;margin-top:6px}12%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-44px}}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%) rotate(-.6deg);padding:8px 14px 9px;font-size:16px;max-width:min(560px,calc(100% - 32px));text-align:center;pointer-events:none;z-index:2}

/* ---------- Overlays ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(34,22,12,.42);z-index:5;overflow:auto}
.card{background:var(--paper);width:min(460px,100%);padding:24px 22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.45);position:relative}
.card.note{background:linear-gradient(180deg,var(--note) 0%,var(--note-2) 100%)}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(48px,13vw,78px);line-height:.9;margin:4px 0 10px;color:#fdfdfb;-webkit-text-stroke:2px #2a4f66;text-shadow:3px 5px 0 rgba(42,79,102,.35);letter-spacing:.01em}
.card p{font-size:17px;line-height:1.45;margin:0 0 10px}
.card .small{font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.row .tape{flex:1 1 150px}
.kicker{font-family:var(--hand);font-size:22px;color:#5b4a1c;margin:0}

/* the receipt after a break */
.receipt{background:var(--receipt);width:min(360px,100%);padding:20px 22px 26px;font-family:var(--mono);font-size:14.5px;box-shadow:0 20px 40px rgba(0,0,0,.45);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 10px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 10px repeat-x}
.receipt h2{font-family:var(--ui);font-size:22px;margin:0 0 2px;text-align:center;letter-spacing:.04em}
.receipt .meta{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase}
.receipt .ln{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-variant-numeric:tabular-nums}
.receipt .ln.rec span:last-child:after{content:" ★";color:var(--red)}
.receipt .sep{border-top:1px dashed #9a9080;margin:8px 0}
.receipt .tot{font-size:18px;font-weight:600}
.receipt .row{margin-top:14px}
.receipt .tape{font-size:14px}
.gate{margin-top:10px;font-family:var(--ui);font-size:14px;color:var(--muted)}
.bar{height:6px;background:rgba(0,0,0,.1);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transform-origin:left}

/* ---------- Trees ---------- */
#trees{position:fixed;inset:0;display:flex;flex-direction:column;background:#6f4524;z-index:4}
#trees header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;position:relative;z-index:2}
#trees .tabs{display:flex;gap:6px}
#trees .tab{background:rgba(255,255,255,.14);color:#fff;border:0;padding:8px 12px;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
#trees .tab[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
#trees .wallet{margin-left:auto;display:flex;gap:10px;align-items:center}
#trees .coin{background:var(--paper);padding:6px 10px;font-family:var(--mono);font-weight:600;font-size:16px;white-space:nowrap}
#treeArea{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#treeBg{position:absolute;inset:0;width:100%;height:100%}
#treeNodes{position:absolute;left:0;top:0;transform-origin:0 0}
.tn{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:1px solid rgba(255,255,255,.7);padding:0;
  background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.98) 0 5%,rgba(255,255,255,.4) 6% 12%,rgba(255,255,255,0) 13%),
             radial-gradient(circle at 50% 50%,rgba(235,245,250,.10) 0 58%,rgba(255,255,255,.38) 84%,rgba(255,255,255,.75) 100%);
  box-shadow:5px 8px 10px rgba(0,0,0,.28),inset -7px -9px 14px rgba(40,70,100,.22),inset 3px 4px 8px rgba(255,255,255,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,box-shadow .2s}
.tn .ic{font-size:30px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.tn .pips{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:0;font-family:var(--mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);white-space:nowrap}
.tn .cost{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap;background:var(--paper);padding:1px 6px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tn.can{box-shadow:0 0 0 4px rgba(255,226,122,.9),0 0 26px rgba(255,226,122,.55),5px 8px 10px rgba(0,0,0,.28),inset -7px -9px 14px rgba(40,70,100,.22)}
.tn.can .cost{background:var(--note)}
.tn.max{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.3) 0 70%,rgba(255,255,255,.55) 100%);box-shadow:2px 3px 4px rgba(0,0,0,.2),inset 0 0 0 2px rgba(255,255,255,.35);border-color:rgba(255,255,255,.5)}
.tn.max:before{content:"";position:absolute;inset:8px;border-radius:50%;background:
  linear-gradient(28deg,transparent 46%,rgba(255,255,255,.7) 48%,transparent 50%),linear-gradient(118deg,transparent 46%,rgba(255,255,255,.6) 48%,transparent 50%),linear-gradient(160deg,transparent 47%,rgba(80,50,20,.25) 49%,transparent 51%)}
.tn.ghost{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.45);box-shadow:none}
.tn.ghost .ic{font-family:var(--display);font-size:26px;color:rgba(255,255,255,.7)}
.tn.blocked{opacity:.55}
.tn.blocked:after{content:"";position:absolute;inset:14px;background:linear-gradient(45deg,transparent 46%,var(--red) 47% 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--red) 47% 53%,transparent 54%)}
.tn.finale{border:2px solid #ffd76a}
.tn.sel{transform:scale(1.13)}
.tn:hover{transform:scale(1.06)}
.tn.popnow{animation:tnpop .38s ease-out}
@keyframes tnpop{0%{transform:scale(1)}25%{transform:scale(.82)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
#panel{position:relative;z-index:2;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ic nm buy" "ic ds buy";gap:3px 14px;align-items:center;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--paper);box-shadow:0 -6px 16px rgba(0,0,0,.3);min-height:96px}
#panel .pic{grid-area:ic;font-size:40px}
#panel .nm{grid-area:nm;font-size:21px;font-weight:700}
#panel .nm small{font-size:14px;color:var(--muted);margin-left:8px;font-weight:600}
#panel .ds{grid-area:ds;font-size:16px;line-height:1.35}
#panel .buy{grid-area:buy}
#panel .hint{grid-column:1/-1;font-size:16px;color:var(--muted)}
#quitBox{position:relative;z-index:2;margin:0 16px 10px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#quitBox .txt{flex:1 1 220px;font-size:15px;line-height:1.35}
@media (max-width:560px){
  #hud{gap:6px;padding-left:10px;padding-right:10px}
  #hud .note{min-width:0;padding:5px 8px 6px}
  #hud .lbl{font-size:16px}
  #hud .val{font-size:17px}
  #hud .sub{font-size:11px}
  #mug{width:64px;height:64px}
  #mug .secs{font-size:17px}
  #mug .handle{top:22px;width:15px;height:17px;border-width:5px}
  #panel{grid-template-columns:auto 1fr;grid-template-areas:"ic nm" "ds ds" "buy buy"}
  #panel .pic{font-size:30px}
  .tape{font-size:15px}
  #trees .tab{padding:7px 9px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.01s}.tn.popnow{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="combo"></div>
<div id="floats"></div>

<div id="hud" hidden>
  <div class="note l"><div class="lbl" data-t="hud.plopps"></div><div class="val" id="hPlopps">0</div><div class="sub" id="hPps"></div></div>
  <div id="mug"><div class="cup"></div><div class="handle"></div>
    <svg viewBox="0 0 86 86"><circle class="ring" cx="43" cy="43" r="36"/><circle class="left" id="hRing" cx="43" cy="43" r="36" stroke-dasharray="226.2" stroke-dashoffset="0"/></svg>
    <div class="secs" id="hSecs">20</div></div>
  <div class="note r"><div class="lbl" data-t="hud.combo"></div><div class="val" id="hCombo">×1</div><div class="sub" id="hSheets"></div></div>
</div>
<div id="hint" class="note" hidden></div>

<!-- title -->
<div class="screen" id="sTitle">
  <div class="card note" style="transform:rotate(-1deg)">
    <p class="kicker" data-t="title.kicker"></p>
    <h1 class="logo">Bubble Break</h1>
    <p data-t="title.text"></p>
    <p class="small" data-t="title.help"></p>
    <div class="row"><button class="tape" id="bPlay"></button><button class="tape ghost" id="bTree" data-t="btn.tree"></button></div>
    <div class="row" style="margin-top:8px"><button class="tape ghost" id="bSettings" data-t="btn.settings"></button></div>
  </div>
</div>

<!-- receipt -->
<div class="screen" id="sSum" hidden>
  <div class="receipt" id="receipt"></div>
</div>

<!-- trees -->
<div id="trees" hidden>
  <header>
    <div class="tabs"><button class="tab" id="tabRun" aria-pressed="true"></button><button class="tab" id="tabCareer" aria-pressed="false"></button></div>
    <div class="wallet"><span class="coin" id="wPlopps"></span><span class="coin" id="wCallus" hidden></span></div>
    <button class="tape" id="bTreePlay"></button>
  </header>
  <div class="note" id="quitBox" hidden><div class="txt" id="quitTxt"></div><button class="tape red" id="bQuit"></button></div>
  <div id="treeArea"><canvas id="treeBg"></canvas><div id="treeNodes"></div></div>
  <div id="panel"></div>
</div>

<!-- quit confirm -->
<div class="screen" id="sQuit" hidden>
  <div class="card"><h2 style="margin:0 0 10px;font-size:26px" data-t="quit.title"></h2><p id="quitBody"></p>
    <div class="row"><button class="tape red" id="bQuitYes"></button><button class="tape ghost" id="bQuitNo" data-t="btn.stay"></button></div></div>
</div>

<!-- stage intro -->
<div class="screen" id="sStage" hidden>
  <div class="card note" style="transform:rotate(.8deg)"><p class="kicker" id="stageKicker"></p><h2 class="logo" style="font-size:clamp(36px,9vw,54px)" id="stageName"></h2><p id="stageText"></p>
    <div class="row"><button class="tape" id="bStageGo"></button></div></div>
</div>

<!-- settings -->
<div class="screen" id="sSet" hidden>
  <div class="card"><h2 style="margin:0 0 12px;font-size:26px" data-t="set.title"></h2>
    <div class="row" style="margin-top:0"><button class="tape ghost" id="bSound"></button><button class="tape ghost" id="bLang"></button></div>
    <div class="row"><button class="tape ghost" id="bIntern" hidden></button></div>
    <div class="row"><button class="tape ghost" id="bReset" data-t="set.reset"></button></div>
    <p class="small" id="resetMsg" hidden></p>
    <div class="row"><button class="tape" id="bSetClose" data-t="btn.close"></button></div></div>
</div>

<!-- finale -->
<div class="screen" id="sEnd" hidden style="background:rgba(4,8,20,.55)">
  <div class="card note" style="transform:rotate(-.6deg)"><p class="kicker" data-t="end.kicker"></p><h2 class="logo" style="font-size:clamp(34px,8vw,52px)" data-t="end.title"></h2><div id="endStats"></div>
    <div class="row"><button class="tape" id="bEndGo" data-t="end.go"></button></div></div>
</div>

<script id="core">
/* ============================================================
   BUBBLE BREAK – core. No DOM: the page and test/bubble_break.mjs both run this.

   Sheet geometry, in bubble pitches: cell (i,j) sits at
     x = i + 0.5 + 0.5*(j odd),  y = j*SQ + 0.5
   so odd rows are shifted half a bubble right (a hex packing). Which cells are
   still intact is a bitset, one Uint32 word per 32 cells of a row, so a press that
   covers a hundred thousand cells clears whole words at a time. Special bubbles
   (thick, gold, espresso, bang, giant, flat) are listed per row and masked out of
   the bitset sweeps; they are few, and each gets its own rules.
   ============================================================ */
const BB = (() => {
'use strict';
const VERSION = 1;
const SQ = 0.8660254037844386;

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function popcnt(x){ x = x - ((x >>> 1) & 0x55555555); x = (x & 0x33333333) + ((x >>> 2) & 0x33333333); return Math.imul((x + (x >>> 4)) & 0x0F0F0F0F, 0x01010101) >>> 24; }
// bits lo..hi (inclusive, 0..31) of one word
function wordMask(lo, hi){ return hi - lo === 31 ? 0xFFFFFFFF : (((1 << (hi - lo + 1)) - 1) << lo) >>> 0; }

const T = { NORMAL:0, FLAT:1, THICK:2, GOLD:3, ESPRESSO:4, BANG:5, GIANT:6 };

/* ---------- Stages: the same verbs at three scales ----------
   size[]  cells per sheet for each level of "Bigger delivery"
   reach   radius of the player's tool, in pitches (a thumb covers one bubble)
   budget  multiplier on the swipe budget
   value   Plopps per normal bubble before multipliers
   cost    multiplier on every run-tree price
   gate    Plopps in a cycle before quitting pays out; gain = calluses at the gate */
const STAGES = [
  { id:'desk',    size:[54, 80, 120, 176, 250, 340, 450],                            reach:.42, budget:1,   value:1,  cost:1,     bang:2.3, machine:'pin',    gate:1.5e5,   gain:3 },
  { id:'ship',    size:[600, 1000, 1600, 2600, 4200, 6800, 11000],                   reach:1.7, budget:14,  value:6,  cost:120,   bang:5,   machine:'roller', gate:1.5e8,   gain:24 },
  { id:'factory', size:[16000, 30000, 55000, 100000, 180000, 320000, 560000],        reach:10,  budget:400, value:40, cost:4e5,   bang:18,  machine:'press',  gate:5e12,  gain:220 },
];

/* ---------- Run tree: bought with Plopps, reset when you quit ----------
   q,r: position on the hex grid of the tree screen (r grows downward) */
const RUN = [
  { id:'break',    q:5, r:7, max:1,  base:0,   g:1,   icon:'☕' },
  { id:'cup',      q:3, r:6, max:5,  base:60,  g:2.2, icon:'🫖', parent:'break' },
  { id:'thumb',    q:5, r:6, max:4,  base:150,  g:4, icon:'👍', parent:'break' },
  { id:'premium',  q:7, r:6, max:25, base:80,  g:2.05, icon:'💎', parent:'break' },
  { id:'espresso', q:1, r:5, max:3,  base:500, g:3, icon:'☕', parent:'cup' },

/* ---------- Career tree: bought with calluses, kept forever ---------- */
const CAREER = [
  { id:'cv',        q:5, r:6, max:1, cost:[0],                icon:'📄' },
  { id:'callus',    q:4, r:5, max:5, cost:[2, 5, 12, 30, 75],  icon:'🫱', parent:'cv' },

  { id:'world',     q:6, r:1, max:1, cost:[1500],             icon:'🌍', parent:'factory', finale:true },

const byId = (list) => Object.fromEntries(list.map(n => [n.id, n]));
const RUN_BY = byId(RUN), CAREER_BY = byId(CAREER);

/* ---------- State ---------- */
function newState(){
  return { v:VERSION, stage:0, unlocked:0, plopps:0, cycleEarned:0, lastCycleEarned:0, lifeEarned:0, lifePops:0,
           runs:0, cycleRuns:0, lv:{ break:1 }, cl:{ cv:1 }, calluses:0, callusesEarned:0, quits:0,
           forks:{}, best:{ run:0, combo:0, sheets:0 }, playTime:0, autoBuy:true, finale:{ done:false, pops:0 } };
}
function load(json){
  const S = newState(); if(!json) return S;
  try { const o = typeof json === 'string' ? JSON.parse(json) : json; if(!o || o.v !== VERSION) return S; Object.assign(S, o); S.lv.break = 1; S.cl.cv = 1; } catch(e) { }
  return S;
}
const lv = (S, id) => S.lv[id] || 0;
const cl = (S, id) => S.cl[id] || 0;

/* ---------- Derived numbers ---------- */
function derive(S){
  const st = STAGES[S.stage];
  const L = id => lv(S, id), C = id => cl(S, id);
  const callusRate = .10 + .02*C('callus');
  const nightshift = Math.pow(2, C('nightshift'));
  // the coffee fund pays extra for the first break of every job after the first
  const fund = S.cycleRuns === 0 && S.quits > 0 ? 1 + C('savings') : 1;
  const value = st.value * Math.pow(1.3, L('premium')) * (1 + callusRate*S.callusesEarned) * nightshift * fund;
  const budgetLv = [0, 6, 10, 16, 25, 40, 60][L('strength')];
  const sizeIdx = Math.min(st.size.length-1, L('delivery'));
  return {
    stage: S.stage, st,
    time: 20 + 3*L('cup') + 5*C('coffee'),
    reach: st.reach * [1, 1.55, 2.1, 2.8, 3.6][L('thumb')],
    value,
    budget: budgetLv * st.budget,
    refill: [.4, .3, .22, .15][L('stamina')],
    size: st.size[sizeIdx],
    comboCap: 1 + L('rhythm'),            // extra multiplier on top of x1
    comboWin: .5 + .1*L('rhythm'),
    clearMul: .5 * (1 + 1.5*L('thorough')),
    clearTime: .5*L('thorough') + .75*C('overtime'),
    gold: .015*L('gold') * (1 + .5*C('nose')), goldCap: Math.round(4*L('gold') * (1 + .5*C('nose'))),
    espresso: .012*L('espresso'), espressoCap: 3*L('espresso'),
    bang: .012*L('bang'), bangCap: 8*L('bang'), bangR: st.bang * (1 + .25*L('bang')),
    wave: L('wave') ? 1 + .35*L('wave') : 0,
    flat: [.05, .035, .02, .008][L('qc')],
    thick: .04,
    holdTime: [.28, .2, .14, .09][L('qc')],
    sprint: 1 + .5*L('sprint'),
    giants: L('giant') + C('supplier'),
    machine: L('machine'), shift: L('shift'), hydraulic: C('hydraulic'),
    twoHands: C('twohands') > 0,
    callusMul: 1 + callusRate*S.callusesEarned
  };
}

/* ---------- Economy ---------- */
function runCost(S, n){ return Math.round(n.base * Math.pow(n.g, lv(S, n.id)) * STAGES[S.stage].cost); }
function runVisible(S, n){ return !n.parent || lv(S, n.parent) > 0; }
function forkBlocked(S, n){
  if(!n.fork || cl(S, 'flexible')) return false;
  return RUN.some(o => o.fork === n.fork && o.id !== n.id && lv(S, o.id) > 0);
}
function canBuyRun(S, n){ return n.max > lv(S, n.id) && runVisible(S, n) && !forkBlocked(S, n) && S.plopps >= runCost(S, n); }
function buyRun(S, id){ const n = RUN_BY[id]; if(!n || !canBuyRun(S, n)) return false; S.plopps -= runCost(S, n); S.lv[id] = lv(S, id) + 1; return true; }
// the intern: after a break, buy the cheapest things you can afford (never picks a fork you have not chosen yourself)
function autoBuy(S, choose){
  let bought = 0;
  for(let guard = 0; guard < 400; guard++){
    let best = null, bc = Infinity;
    for(const n of RUN){
      if(n.fork && !cl(S, 'flexible') && !RUN.some(o => o.fork === n.fork && lv(S, o.id) > 0) && !(choose && choose(n))) continue;
      if(!canBuyRun(S, n)) continue;
      const c = runCost(S, n); if(c < bc){ bc = c; best = n; }
    }
    if(!best) break; buyRun(S, best.id); bought++;
  }
  return bought;
}
function careerCost(S, n){ const l = cl(S, n.id); return l < n.max ? n.cost[l] : Infinity; }
function careerVisible(S, n){ return !n.parent || cl(S, n.parent) > 0; }
function canBuyCareer(S, n){ return cl(S, n.id) < n.max && careerVisible(S, n) && S.calluses >= careerCost(S, n); }
function buyCareer(S, id){
  const n = CAREER_BY[id]; if(!n || !canBuyCareer(S, n)) return false;
  S.calluses -= careerCost(S, n); S.cl[id] = cl(S, id) + 1;
  if(n.stage) S.unlocked = Math.max(S.unlocked, n.stage);
  freshCycleStage(S);
  return true;
}
// a job that has not started yet moves straight to the newest workplace and gets its start bonuses
function freshCycleStage(S){ if(S.cycleRuns === 0 && S.cycleEarned === 0){ S.stage = S.unlocked; if(S.quits) startBonuses(S); } }
function quitGain(S){ const st = STAGES[S.stage]; if(S.cycleEarned < st.gate) return 0; return Math.floor(st.gain * Math.cbrt(S.cycleEarned / st.gate)); }
function quitProgress(S){ return Math.min(1, S.cycleEarned / STAGES[S.stage].gate); }
function quit(S){
  const g = quitGain(S); if(g <= 0) return 0;
  S.calluses += g; S.callusesEarned += g; S.quits++;
  S.lastCycleEarned = S.cycleEarned;
  S.plopps = 0;
  S.cycleEarned = 0; S.cycleRuns = 0; S.forks = {};
  S.lv = { break:1 };
  startBonuses(S);
  S.stage = S.unlocked;
  return g;
}
// what a new job starts with; also applied when you buy one of these before your first break in the job
function startBonuses(S){
  const m = cl(S, 'memory'); if(m){ S.lv.thumb = Math.max(lv(S, 'thumb'), 1); S.lv.strength = Math.max(lv(S, 'strength'), m); }
  if(cl(S, 'pinsub')){ S.lv.delivery = Math.max(lv(S, 'delivery'), 1); S.lv.machine = Math.max(lv(S, 'machine'), 1); }
}

/* ---------- Sheet ---------- */
function makeSheet(P, aspect, rnd){
  const n = P.size;
  // aspect = width/height = cols/(rows*SQ), and cols*rows = n
  let rows = Math.max(3, Math.round(Math.sqrt(n / (aspect * SQ))));
  let cols = Math.max(3, Math.round(n / rows));
  const words = (cols + 31) >>> 5, N = cols*rows;
  const bits = new Uint32Array(rows*words), smask = new Uint32Array(rows*words);
  for(let j = 0; j < rows; j++) for(let w = 0; w < words; w++){ const lo = w*32, hi = Math.min(cols, lo + 32) - 1; bits[j*words + w] = wordMask(0, hi - lo); }
  const sh = { cols, rows, words, bits, smask, N, left:N, spI:[], spT:[], spG:[], giants:[], flats:0, id: (rnd()*1e9)|0 };
  const special = new Map();
  const isFree = idx => !special.has(idx);
  // giants first: a centre and its six neighbours
  for(let k = 0; k < P.giants; k++){
    for(let tries = 0; tries < 40; tries++){
      const i = 1 + ((rnd()*(cols-2))|0), j = 1 + ((rnd()*(rows-2))|0);
      const cells = [[i,j], ...neighbours(i, j)].filter(([a,b]) => a >= 0 && b >= 0 && a < cols && b < rows);
      if(cells.length < 7 || !cells.every(([a,b]) => isFree(b*cols + a))) continue;
      const g = sh.giants.length;
      sh.giants.push({ i, j, x: cx(i,j), y: cy(j), hits:0, need: 3 + P.stage, cells: cells.map(([a,b]) => b*cols + a), alive:true });
      for(const [a,b] of cells) special.set(b*cols + a, [T.GIANT, g]);
      break;
    }
  }
  // the rest, with a cap so a sheet of half a million bubbles does not grow a hundred thousand specials
  // specials are things you go and get, so their count is capped however big the sheet grows
  const place = (p, t, cap) => { const k = Math.min(Math.round(p*N), cap); for(let c = 0, tries = 0; c < k && tries < k*6; tries++){ const idx = (rnd()*N)|0; if(!isFree(idx)) continue; special.set(idx, [t, -1]); c++; } };
  place(P.flat, T.FLAT, 60); place(P.thick, T.THICK, 40); place(P.gold, T.GOLD, P.goldCap); place(P.espresso, T.ESPRESSO, P.espressoCap); place(P.bang, T.BANG, P.bangCap);
  for(let j = 0; j < rows; j++){ sh.spI.push([]); sh.spT.push([]); sh.spG.push([]); }
  const keys = [...special.keys()].sort((a,b) => a-b);
  for(const idx of keys){ const [t,g] = special.get(idx), j = (idx/cols)|0, i = idx - j*cols; sh.spI[j].push(i); sh.spT[j].push(t); sh.spG[j].push(g); sh.smask[j*words + (i>>>5)] |= (1 << (i & 31)) >>> 0; if(t === T.FLAT) sh.flats++; }
  for(let j = 0; j < rows; j++){ sh.spI[j] = Int32Array.from(sh.spI[j]); sh.spT[j] = Uint8Array.from(sh.spT[j]); sh.spG[j] = Int16Array.from(sh.spG[j]); }
  sh.left = N - sh.flats;
  sh.W = cols + .5; sh.H = (rows-1)*SQ + 1;
  return sh;
}
const cx = (i, j) => i + .5 + .5*(j & 1);
const cy = j => j*SQ + .5;
function neighbours(i, j){ const o = j & 1; return [[i-1,j],[i+1,j],[i-1+o,j-1],[i+o,j-1],[i-1+o,j+1],[i+o,j+1]]; }
function isIntact(sh, i, j){ return (sh.bits[j*sh.words + (i>>>5)] >>> (i & 31)) & 1; }
function clearBit(sh, i, j){ sh.bits[j*sh.words + (i>>>5)] &= ~(1 << (i & 31)); }
function lowerBound(a, x){ let lo = 0, hi = a.length; while(lo < hi){ const m = (lo + hi) >> 1; if(a[m] < x) lo = m + 1; else hi = m; } return lo; }
function specialAt(sh, i, j){ const a = sh.spI[j], k = lowerBound(a, i); return k < a.length && a[k] === i ? k : -1; }
function intactCount(sh){ let c = 0; for(let k = 0; k < sh.bits.length; k++) c += popcnt(sh.bits[k] & ~sh.smask[k]); return c; }

/* ---------- Run ---------- */
function startRun(S, opts){
  opts = opts || {};
  freshCycleStage(S);
  const P = derive(S), rnd = mulberry(opts.seed != null ? opts.seed : (Math.random()*2**31)|0);
  const run = { S, P, rnd, aspect: opts.aspect || 1.5, t:0, time:P.time, bonusT:0, earned:0, pops:0, playerPops:0, machinePops:0,
    combo:0, maxCombo:0, lastPop:-9, sheets:0, slide:0, over:false, down:false, x:0, y:0, moved:0, still:0, hold:0,
    budget:P.budget, aid:0, pending:[], machines:[], machineT:1.5, flats:0, golds:0, giants:0, espressos:0, bangs:0, best:null,
    ev: newEvents() };
  run.sheet = makeSheet(P, run.aspect, rnd);
  S.runs++; S.cycleRuns++;
  return run;
}
function newEvents(){ return { spans:[], specials:[], flats:[], rings:[], giantHits:[], sheet:false, cleared:false, playerPops:0, machinePops:0, chainPops:0, value:0, budgetOut:false, time:[] }; }
function takeEvents(run){ const e = run.ev; run.ev = newEvents(); return e; }

function comboMul(run){ return 1 + Math.min(run.P.comboCap, Math.floor(run.combo/5)*.1); }
function valueNow(run){ return run.P.value * (run.time <= 5 ? run.P.sprint : 1); }
// bonus time fills a jar that holds three quarters of the base break: each second in it makes the next worth less
function addTime(run, raw){ const cap = run.P.time * .75, g = raw * Math.max(0, 1 - run.bonusT/cap); run.bonusT += g; run.time += g; return g; }
function earn(run, v){ run.earned += v; run.ev.value += v; }

// pop cells of row j between i0 and i1 for `who`; returns how much budget it used
function popSpan(run, j, i0, i1, budget, who){
  const sh = run.sheet;
  if(j < 0 || j >= sh.rows) return 0;
  if(i0 < 0) i0 = 0; if(i1 >= sh.cols) i1 = sh.cols - 1; if(i0 > i1 || budget <= 0) return 0;
  let used = 0, gained = 0;
  const player = who === 'player';
  // special bubbles in the span, each by its own rule
  const spI = sh.spI[j];
  if(spI.length){
    for(let k = lowerBound(spI, i0); k < spI.length && spI[k] <= i1 && used < budget; k++){
      const i = spI[k]; if(!isIntact(sh, i, j)) continue;
      const t = sh.spT[j][k], x = cx(i, j), y = cy(j);
      if(t === T.FLAT){
        // pressed on purpose it spoils the combo; swiped over it only costs a little strength
        clearBit(sh, i, j);
        if(player && run.swiping){ used++; run.ev.flats.push(x, y, 2); }
        else { run.ev.flats.push(x, y, player ? 1 : 0); if(player){ run.combo = 0; run.flats++; } }
        continue;
      }
      if(t === T.THICK && player) continue;                         // needs a held press
      if((t === T.GOLD || t === T.ESPRESSO) && who === 'machine') continue;   // too good for the machine
      if(t === T.GIANT){ if(player) hitGiant(run, sh.spG[j][k]); continue; }
      clearBit(sh, i, j); sh.left--; used++;
      let v = valueNow(run);
      if(t === T.THICK) v *= 5;
      if(t === T.GOLD){ v *= 20; run.golds++; }
      if(t === T.ESPRESSO){ v *= 3; run.espressos++; run.ev.time.push(x, y, addTime(run, .6)); }
      if(t === T.BANG){ v *= 3; run.bangs++; run.pending.push({ at: run.t + .08, x, y, r: run.P.bangR, who:'chain', ring:true }); }
      if(player){ run.combo++; run.lastPop = run.t; v *= comboMul(run); run.playerPops++; }
      else if(who === 'machine') run.machinePops++;
      gained += v; run.ev.specials.push(x, y, t);
    }
  }
  // ordinary bubbles, a word at a time
  const words = sh.words, base = j*words;
  let n = 0;
  for(let w = i0 >>> 5, wEnd = i1 >>> 5; w <= wEnd && used < budget; w++){
    const lo = w === (i0 >>> 5) ? i0 & 31 : 0, hi = w === wEnd ? i1 & 31 : 31;
    let m = sh.bits[base + w] & ~sh.smask[base + w] & wordMask(lo, hi);
    if(!m) continue;
    let c = popcnt(m);
    if(c > budget - used){ let need = budget - used, keep = 0; while(need-- > 0){ const low = m & -m; keep |= low; m ^= low; } m = keep >>> 0; c = popcnt(m); }
    sh.bits[base + w] &= ~m; used += c; n += c;
  }
  if(n){
    sh.left -= n;
    let v = n * valueNow(run);
    if(player){ run.combo += n; run.lastPop = run.t; v *= comboMul(run); run.playerPops += n; run.ev.playerPops += n; }
    else if(who === 'machine'){ run.machinePops += n; run.ev.machinePops += n; }
    else run.ev.chainPops += n;
    gained += v;
  }
  if(used){ run.ev.spans.push(j, i0, i1); run.pops += used; run.maxCombo = Math.max(run.maxCombo, run.combo); }
  if(gained) earn(run, gained);
  return used;
}
function popCircle(run, x, y, R, budget, who){
  const sh = run.sheet;
  const j0 = Math.max(0, Math.ceil((y - R - .5)/SQ)), j1 = Math.min(sh.rows - 1, Math.floor((y + R - .5)/SQ));
  let used = 0;
  for(let j = j0; j <= j1 && used < budget; j++){
    const dy = cy(j) - y; if(dy*dy > R*R) continue;
    const w = Math.sqrt(R*R - dy*dy), off = .5 + .5*(j & 1);
    used += popSpan(run, j, Math.ceil(x - w - off), Math.floor(x + w - off), budget - used, who);
  }
  return used;
}
function popRect(run, x0, y0, x1, y1, who){
  const sh = run.sheet, j0 = Math.max(0, Math.ceil((y0 - .5)/SQ)), j1 = Math.min(sh.rows-1, Math.floor((y1 - .5)/SQ));
  let used = 0;
  for(let j = j0; j <= j1; j++){ const off = .5 + .5*(j & 1); used += popSpan(run, j, Math.ceil(x0 - off), Math.floor(x1 - off), Infinity, who); }
  return used;
}
function hitGiant(run, g){
  const gi = run.sheet.giants[g]; if(!gi || !gi.alive || gi.lastAid === run.aid) return;
  gi.lastAid = run.aid; gi.hits++;
  run.ev.giantHits.push(g, gi.hits, gi.need);
  if(gi.hits < gi.need) return;
  gi.alive = false; run.giants++;
  const sh = run.sheet;
  for(const idx of gi.cells){ const j = (idx / sh.cols)|0, i = idx - j*sh.cols; if(isIntact(sh, i, j)){ clearBit(sh, i, j); sh.left--; } }
  run.ev.spans.push(gi.j-1, gi.i-1, gi.i+1, gi.j, gi.i-1, gi.i+1, gi.j+1, gi.i-1, gi.i+1);
  const v = 150 * valueNow(run) * comboMul(run); earn(run, v); run.pops += 7; run.playerPops += 7;
  run.ev.specials.push(gi.x, gi.y, T.GIANT);
  run.pending.push({ at: run.t + .1, x: gi.x, y: gi.y, r: 3.2 * (run.P.stage ? run.P.st.bang/2.3 : 1), who:'chain', ring:true });
}
// giants are hit by the tool touching any of their cells
function touchGiants(run, x, y, R){
  const sh = run.sheet;
  for(let g = 0; g < sh.giants.length; g++){ const gi = sh.giants[g]; if(gi.alive && Math.hypot(gi.x - x, gi.y - y) < R + 1.45) hitGiant(run, g); }
}
function toolPoints(run, x, y){
  const pts = [[x, y]];
  if(run.P.twoHands){ const sh = run.sheet; pts.push([sh.W - x, sh.H - y]); }
  return pts;
}

/* ---------- The three things a hand does ---------- */
function press(run, x, y){
  if(run.over) return;
  run.down = true; run.x = x; run.y = y; run.aid++; run.hold = 0; run.still = 0;
  if(run.slide > 0) return;
  const R = run.P.reach;
  for(const [px, py] of toolPoints(run, x, y)){
    touchGiants(run, px, py, R);
    popCircle(run, px, py, R, Infinity, 'player');
    if(run.P.wave) run.pending.push({ at: run.t + .09, x: px, y: py, r: R * run.P.wave + .6, who:'chain', ring:true });
  }
}
function drag(run, x, y){
  if(run.over) return;

const tr = (k, v) => { let s = STR[lang][k] ?? STR.en[k] ?? k; if(typeof s === 'string' && v) for(const [a,b] of Object.entries(v)) s = s.split('{'+a+'}').join(b); return s; };
const LOC = () => lang === 'de' ? 'de-DE' : 'en-US';
function fmt(n){
  if(!isFinite(n)) return '∞'; n = Math.floor(n); if(n < 1e4) return n.toLocaleString(LOC());
  const e = Math.floor(Math.log10(n)/3), U = STR[lang].units;
  if(e < U.length){ const v = n / Math.pow(1000, e); return v.toLocaleString(LOC(), { maximumFractionDigits: v < 10 ? 2 : v < 100 ? 1 : 0 }) + (lang === 'de' ? ' ' : '') + U[e]; }
  const ex = Math.floor(Math.log10(n)); return (n/Math.pow(10, ex)).toLocaleString(LOC(), {maximumFractionDigits:2}) + 'e' + ex;
}
const mul = x => (Math.round(x*100)/100).toLocaleString(LOC());
const sec = x => (Math.round(x*100)/100).toLocaleString(LOC()) + ' s';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const artDe = m => m === 'Walze' || m === 'Hydraulikpresse' ? 'eine' : 'ein';
function perPress(P){ const R = P.reach; return R < .6 ? 1 : Math.max(1, Math.round(Math.PI*R*R/SQ)).toLocaleString(LOC()); }
function perSheet(p, n, capN){ return Math.min(Math.round(p*n), capN); }
function fmtDur(s){ const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h} h ${m} min` : `${m} min`; }
function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = tr(el.dataset.t));
  $('tabRun').textContent = tr('tab.run'); $('tabCareer').textContent = tr('tab.career');
}

/* ================= sound ================= */
let AC = null, master = null, noise = null, crackleT = 0;
function audio(){
  if(AC) { if(AC.state === 'suspended') AC.resume(); return; }
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value = S.ui.sound ? .9 : 0;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = .002;
  master.connect(comp).connect(AC.destination);
  noise = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noise.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
}
function nz(t, dur, type, f, q, vol, attack){
  const s = AC.createBufferSource(); s.buffer = noise; s.playbackRate.value = .8 + Math.random()*.4;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + (attack || .0008)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl).connect(g).connect(master); s.start(t, Math.random()*.8); s.stop(t + dur + .03);
}
function osc(t, f0, f1, dur, vol, type){
  const o = AC.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .02);
}
const SND = {
  // one dry pop: a click, the body of the bubble ringing, a little thump
  pop(delay, size, kind){
    if(!AC || !S.ui.sound) return; const t = AC.currentTime + (delay || 0);
    const big = kind === 'thick' ? .75 : 1;
    nz(t, .006, 'highpass', 2600, .7, .85);
    nz(t, .04 + Math.random()*.025, 'bandpass', (900 + Math.random()*1000) * big * (size || 1), 3.2, .5);
    osc(t, (kind === 'thick' ? 150 : 220) + Math.random()*30, 70, .045, .16);
  },
  pops(n, pitch){ if(!AC || !S.ui.sound || n <= 0) return; const k = Math.min(n, 5); for(let i = 0; i < k; i++) SND.pop(i ? Math.random()*.03 : 0, pitch); if(n > 5) SND.crackle(n); },
  // many at once: a crackle whose loudness follows the count, and a boom for the truly absurd
  crackle(n){
    if(!AC || !S.ui.sound) return; const t = AC.currentTime; if(t - crackleT < .05) return; crackleT = t;
    const lg = Math.log10(n), grains = Math.min(26, 4 + lg*5);
    for(let i = 0; i < grains; i++) nz(t + Math.random()*.12, .01 + Math.random()*.015, 'bandpass', 1200 + Math.random()*3500, 2, .12 + .05*lg);
    if(n > 3000) osc(t, 90, 38, .35, Math.min(.45, .08*lg));
  },
  pfft(){ if(!AC || !S.ui.sound) return; nz(AC.currentTime, .24, 'lowpass', 850, .7, .3, .025); },
  glint(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; nz(t + .01, .18, 'highpass', 7000, 1, .12, .004); nz(t + .05, .12, 'bandpass', 9000, 8, .08); },
  clink(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; osc(t + .02, 2480, 2440, .18, .05); osc(t + .02, 3710, 3690, .12, .03); },
  bang(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; nz(t, .09, 'lowpass', 1800, .8, .9); osc(t, 160, 45, .22, .4); for(let i = 0; i < 8; i++) nz(t + .02 + Math.random()*.15, .01, 'bandpass', 2000 + Math.random()*3000, 2, .15); },
  giantHit(k){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; osc(t, 120 + 25*k, 80, .16, .3, 'sine'); nz(t, .05, 'lowpass', 500, 1, .25); },
  giant(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; nz(t, .012, 'highpass', 1500, .7, 1); nz(t, .5, 'lowpass', 900, .7, .7, .004); osc(t, 110, 32, .6, .6); for(let i = 0; i < 14; i++) nz(t + .05 + Math.random()*.4, .012, 'bandpass', 1500 + Math.random()*3500, 2, .18); },
  creak(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 170 + Math.random()*70; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 850; f.Q.value = 6; const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.04, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .07); o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + .09); },
  crinkle(v){ if(!AC || !S.ui.sound) return; nz(AC.currentTime, .004 + Math.random()*.004, 'highpass', 3500 + Math.random()*3000, 1, .04 + .07*v); },
  sheet(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; const s = AC.createBufferSource(); s.buffer = noise; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3500, t + .35); const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.22, t + .08); g.gain.exponentialRampToValueAtTime(.0001, t + .45); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + .5); for(let i = 0; i < 10; i++) nz(t + Math.random()*.4, .005, 'highpass', 4000, 1, .08); },
  thud(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; nz(t, .25, 'highpass', 900, .6, .12, .08); osc(t + .26, 95, 40, .3, .55); nz(t + .26, .15, 'lowpass', 600, .8, .5); },
  roll(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; nz(t, .8, 'lowpass', 300, 1.5, .18, .1); },
  slurp(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; const s = AC.createBufferSource(); s.buffer = noise; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 5; f.frequency.setValueAtTime(500, t); f.frequency.linearRampToValueAtTime(1400, t + .35); const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.25, t + .05); g.gain.linearRampToValueAtTime(.18, t + .3); g.gain.exponentialRampToValueAtTime(.0001, t + .42); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + .45); osc(t + .55, 1900, 1850, .12, .05); osc(t + .55, 2950, 2900, .08, .03); },
  crumple(){ if(!AC || !S.ui.sound) return; const t = AC.currentTime; for(let i = 0; i < 30; i++) nz(t + Math.random()*.5, .01 + Math.random()*.02, 'bandpass', 1500 + Math.random()*4000, 1.5, .15); osc(t + .7, 70, 40, .25, .5); nz(t + .7, .1, 'lowpass', 400, 1, .4); },
};
function setSound(on){ S.ui.sound = on; if(master) master.gain.value = on ? .9 : 0; }

/* ================= layout ================= */
let L = { x:0, y:0, w:0, h:0 };   // where the sheet may go, in CSS px
function layout(){
  const top = W < 560 ? 92 : 112, side = 16, bottom = 16;
  L = { x: side, y: top + 0, w: W - side*2, h: H - top - bottom };
}

/* ================= scenes ================= */
let scene = null, sceneStage = -1;
function paintScene(stage){
  scene = document.createElement('canvas'); scene.width = Math.ceil(W*DPR); scene.height = Math.ceil(H*DPR);
  const g = scene.getContext('2d'); g.scale(DPR, DPR); sceneStage = stage;
  const rnd = BB.mulberry(1234 + stage);
  if(stage === 0){
    g.fillStyle = '#a8703d'; g.fillRect(0, 0, W, H);
    const plank = Math.max(150, Math.min(220, H/4.5));
    for(let py = -20; py < H; py += plank){
      const tone = .9 + rnd()*.2;
      g.fillStyle = `rgba(${150*tone|0},${98*tone|0},${52*tone|0},.55)`; g.fillRect(0, py, W, plank);
      for(let k = 0; k < 60; k++){
        const y0 = py + rnd()*plank, amp = 2 + rnd()*6, fr = .002 + rnd()*.006, ph = rnd()*6;
        g.strokeStyle = rnd() < .7 ? `rgba(70,40,15,${.05 + rnd()*.12})` : `rgba(235,190,130,${.05 + rnd()*.08})`;
        g.lineWidth = .6 + rnd()*1.6; g.beginPath();
        for(let x = 0; x <= W + 12; x += 12){ const y = y0 + Math.sin(x*fr + ph)*amp + Math.sin(x*fr*3.1 + ph)*amp*.3; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
      }
      if(rnd() < .55){ const kx = rnd()*W, ky = py + plank*(.3 + rnd()*.4); for(let r = 14; r > 2; r -= 2.5){ g.strokeStyle = 'rgba(60,32,10,.13)'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(kx, ky, r*2.2, r*.8, 0, 0, 6.283); g.stroke(); } }
      g.fillStyle = 'rgba(40,20,5,.45)'; g.fillRect(0, py + plank - 1.5, W, 1.5); g.fillStyle = 'rgba(255,220,170,.12)'; g.fillRect(0, py + plank, W, 1);

  } else if(stage === 1){
    g.fillStyle = '#b8b3a8'; g.fillRect(0, 0, W, H);
    for(let i = 0; i < W*H/40; i++){ g.fillStyle = rnd() < .5 ? 'rgba(90,85,75,.10)' : 'rgba(255,255,250,.12)'; g.fillRect(rnd()*W, rnd()*H, 1.3, 1.3); }
    // cardboard boxes peeking in from the edges
    const box = (x, y, w, h, a) => { g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(-w/2 + 8, -h/2 + 10, w, h); g.fillStyle = '#b98a55'; g.fillRect(-w/2, -h/2, w, h);
      for(let k = 0; k < 40; k++){ g.strokeStyle = `rgba(120,80,40,${.08 + rnd()*.08})`; g.beginPath(); const yy = -h/2 + rnd()*h; g.moveTo(-w/2, yy); g.lineTo(w/2, yy + (rnd()-.5)*4); g.stroke(); }
      g.fillStyle = 'rgba(210,175,120,.75)'; g.fillRect(-w/2, -14, w, 28); g.strokeStyle = 'rgba(120,80,40,.5)'; g.lineWidth = 2; g.strokeRect(-w/2, -h/2, w, h);

}

/* ================= bubble sprites ================= */
// all sprites are drawn for a bubble of radius r (CSS px) into a canvas of 2.9r, lit from the top left
const sprCache = new Map();
function spr(key, r, draw){
  const k = key + '|' + r.toFixed(2); let c = sprCache.get(k); if(c) return c;
  const s = Math.max(2, Math.ceil(r*2.9)); c = document.createElement('canvas'); c.width = c.height = Math.ceil(s*DPR);

    const j0 = Math.max(0, Math.floor(((lat0 - rho)/Math.PI + .5)*MH)), j1 = Math.min(MH - 1, Math.ceil(((lat0 + rho)/Math.PI + .5)*MH));
    for(let j = j0; j <= j1; j++){
      const lat = ((j + .5)/MH - .5)*Math.PI, den = Math.cos(lat)*cl0; let dl;
      if(den < 1e-9) dl = Math.PI; else { const c = (cr - Math.sin(lat)*sl0)/den; if(c > 1) continue; dl = c < -1 ? Math.PI : Math.acos(c); }
      const i0 = Math.floor((lon0 - dl)/(2*Math.PI)*MW), i1 = Math.ceil((lon0 + dl)/(2*Math.PI)*MW);
      for(let i = i0; i <= i1; i++){ const ii = ((i % MW) + MW) % MW, k = j*MW + ii; if(!popped[k]){ popped[k] = 1; got += rowW[j]; } }
    }
    f.done += got; return got/f.total*WORLD;
  };
  f.hit = (px, py) => {
    const geo = f.toGeo(px, py); if(!geo) return 0;
    const n = f.popCap(geo[0], geo[1], f.reach());
    if(n > 0){ SND.crackle(n); rings.push({ x: px, y: py, r0: 4, r1: f.reach()*f.R*1.1, t: 0, life: .35, a: .8, w: 3 }); puff(px, py, 6, 6); }
    return n;
  };
  f.press = (px, py) => { f.last = [px, py]; if(f.hit(px, py) > 0) SND.giant(); };
  f.drag = (px, py, down) => { if(!down || !f.last){ f.last = down ? [px, py] : null; return; } const [lx, ly] = f.last, d = Math.hypot(px - lx, py - ly), step = Math.max(4, f.reach()*f.R*.4), n = Math.ceil(d/step); for(let k = 1; k <= n; k++) f.hit(lx + (px - lx)*k/n, ly + (py - ly)*k/n); f.last = [px, py]; };
  f.release = () => { f.last = null; };
  f.step = (dt, t) => {
    f.rot += dt*.22; if(f.flash > 0) f.flash = Math.max(0, f.flash - dt*.6);
    f.tilt = .62*Math.sin(t*.21); if(Math.abs(f.tilt - f.pixTilt) > .015) f.retilt();
    if(!f.ended && f.frac() > .985){ f.ended = true; f.endT = t; for(let j = 0; j < f.MH; j++) for(let i = 0; i < f.MW; i++) popped[j*f.MW + i] = 1; f.done = f.total; f.flash = 1; SND.giant(); setTimeout(() => SND.giant(), 180); shake = 1; }
    if(f.ended && t - f.endT > 2.2 && mode === 'finale') finishFinale();
    if(f.counter) f.counter.innerHTML = `<div class="hand" style="font-size:19px;color:#5b4a1c">${tr('finale.pct', { p: (Math.floor(f.frac()*1000)/10).toLocaleString(LOC()) })}</div><div style="font-family:var(--mono);font-weight:600;font-size:22px">${fmtLong(f.frac()*WORLD)}</div>`;
  };
  f.render = (t) => {
    cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.drawImage(f.stars, 0, 0, W, H);
    const n = 2*f.Rr, d = f.img.data, P = f.pix, K = 36, rot = f.rot, MW = f.MW, MH = f.MH;
    d.fill(0);
    for(let k = 0; k < P.length; k += 5){
      const idx = P[k], lat = P[k+1], lon = P[k+2] + rot, lam = P[k+3], z = P[k+4];
      const v = Math.min(MH - 1, Math.floor((lat/Math.PI + .5)*MH)), u = ((Math.floor((lon/(2*Math.PI))*MW) % MW) + MW) % MW, mk = (v*MW + u)*3;
      let r = map[mk], g = map[mk+1], b = map[mk+2];
      const light = .28 + .72*lam;
      r *= light; g *= light; b *= light;
      if(!popped[v*MW + u]){
        // a bubble of the wrap at this point: its distance from the nearest bubble centre shapes rim and highlight
        const a = lon*K*Math.cos(lat), bb = lat*K, row = Math.round(bb/SQ), off = (row & 1)*.5, col = Math.round(a - off), dx = a - col - off, dy = bb - row*SQ, dd = Math.sqrt(dx*dx + dy*dy)/.47;
        const rim = dd > .7 ? Math.min(1, (dd - .7)/.3) : 0, hs = Math.exp(-((dx + .15)*(dx + .15) + (dy - .15)*(dy - .15))/.006)*lam;
        const w = 30 + 70*rim*rim + 200*hs; r = r*.82 + w; g = g*.82 + w; b = b*.82 + w + 8;
      } else { const c = ((u*7 + v*13) % 5)*3; r += c; g += c; b += c; }
      // limb darkening, then the light from the finale's flash
      const limb = .55 + .45*Math.sqrt(z), fl = f.flash*180;
      d[idx*4] = Math.min(255, r*limb + fl); d[idx*4 + 1] = Math.min(255, g*limb + fl); d[idx*4 + 2] = Math.min(255, b*limb + fl); d[idx*4 + 3] = 255;
    }
    f.g.putImageData(f.img, 0, 0);
    const sx = shake ? (Math.random() - .5)*shake*10 : 0, sy = shake ? (Math.random() - .5)*shake*10 : 0;
    cx.save(); cx.translate(sx, sy);
    const at = cx.createRadialGradient(f.cx, f.cy, f.R*.95, f.cx, f.cy, f.R*1.18); at.addColorStop(0, 'rgba(120,180,255,.35)'); at.addColorStop(1, 'rgba(120,180,255,0)'); cx.fillStyle = at; cx.beginPath(); cx.arc(f.cx, f.cy, f.R*1.18, 0, 6.283); cx.fill();
    cx.imageSmoothingEnabled = true; cx.drawImage(f.cv, f.cx - f.R, f.cy - f.R, f.R*2, f.R*2);
    drawFx(cx);
    if(ptr.x > -500 && !f.ended){ const rr = f.reach()*f.R; cx.strokeStyle = ptr.down ? '#ffd76a' : 'rgba(255,215,106,.6)'; cx.lineWidth = 3; cx.setLineDash([8, 6]); cx.beginPath(); cx.arc(ptr.x, ptr.y, rr, 0, 6.283); cx.stroke(); cx.setLineDash([]); }
    cx.restore();
  };
  f.resize();
  return f;
}
function startFinale(){
  audio(); finale = makeFinale(); mode = 'finale'; show(null); $('hud').hidden = true;
  const c = document.createElement('div'); c.className = 'note'; c.id = 'finCounter';
  c.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%) rotate(-1deg);padding:8px 16px 10px;z-index:2;text-align:center;font-variant-numeric:tabular-nums;pointer-events:none';
  document.body.appendChild(c); finale.counter = c;
  c.innerHTML = '';
  const h = $('hint'); h.textContent = tr('finale.hint'); h.hidden = false;
}
function finishFinale(){
  mode = 'ended'; S.finale.done = true; S.finale.pops = WORLD; S.lifePops += WORLD; save();
  const c = $('finCounter'); if(c) c.remove(); $('hint').hidden = true;
  $('endStats').innerHTML = `<p>${tr('end.stats', { pops: fmtLong(S.lifePops), time: fmtDur(S.playTime), quits: S.quits })}</p>`;
  applyStatic(); show('sEnd');
}
$('bEndGo').onclick = () => { finale = null; mode = 'trees'; layout(); paintScene(S.stage); previewSheet(); openTrees('run'); };

/* ================= input ================= */
cv.addEventListener('pointerdown', e => {
  audio(); ptr.x = e.clientX; ptr.y = e.clientY; ptr.down = true;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(mode === 'run' && run && !run.over){ const [x, y] = toSheet(ptr.x, ptr.y); BB.press(run, x, y); }
  else if(mode === 'finale' && finale) finale.press(ptr.x, ptr.y);
});
cv.addEventListener('pointermove', e => {
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for(const ev of evs){
    const px = ev.clientX, py = ev.clientY, d = Math.hypot(px - ptr.x, py - ptr.y); ptr.x = px; ptr.y = py;
    if(mode === 'run' && run && !run.over){ const [x, y] = toSheet(px, py); BB.drag(run, x, y); if(ptr.down && d > 2 && Math.random() < Math.min(1, d/40)) SND.crinkle(Math.min(1, d/40)); }
    else if(mode === 'finale' && finale) finale.drag(px, py, ptr.down);
  }
});
const up = () => { ptr.down = false; if(run) BB.release(run); if(finale) finale.release(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', e => { if(e.pointerType === 'mouse'){ ptr.x = -999; up(); } });
addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){ if(mode === 'end' || mode === 'title'){ if(document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); startRun(); } }
});
document.addEventListener('visibilitychange', () => { if(document.hidden && run && mode === 'run') { ptr.down = false; BB.release(run); } });

/* ================= loop ================= */
let lt = performance.now(), holdCreak = 0;
function frame(now){
  const dt = Math.min(.05, (now - lt)/1000) || 1/60; lt = now; const t = now/1000;
  if(mode === 'run' && run){
    if(!document.hidden) BB.step(run, dt);
    if(run.down && run.hold > .03 && (holdCreak -= dt) < 0){ holdCreak = .09; SND.creak(); }
    const ev = BB.takeEvents(run); handleEvents(ev, t);
    hud();
    if(run.over) endRun();
  }
  if((mode === 'finale' || mode === 'ended') && finale) finale.step(dt, t);
  stepFx(dt);
  if((mode === 'finale' || mode === 'ended') && finale) finale.render(t); else render(t);
  requestAnimationFrame(frame);
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.ceil(W*DPR); cv.height = Math.ceil(H*DPR);
  sprCache.clear(); layout(); paintScene(S.stage);
  if(view){ const sh = view.sh; view = makeView(sh); oldView = null; }
  if(mode === 'trees'){ fitTree(); drawTree(); }
  if(finale) finale.resize();
}
addEventListener('resize', resize);

/* ================= boot ================= */
applyStatic(); refreshTitle();
W = innerWidth; H = innerHeight; resize(); previewSheet();
show('sTitle');
requestAnimationFrame(frame);
window.BBUI = { get S(){ return S; }, get run(){ return run; }, get view(){ return view; }, get mode(){ return mode; }, get finale(){ return finale; }, startRun, openTrees, startFinale, toSheet, save };

</script>
