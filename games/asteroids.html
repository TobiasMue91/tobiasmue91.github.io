<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23020507'/><path d='M50 14L76 84L50 68L24 84Z' fill='none' stroke='%23b0ecff' stroke-width='7' stroke-linejoin='round'/></svg>">
<title>Asteroids: Afterglow — the vector arcade classic, remade as a roguelite</title>
<link rel="canonical" href="https://www.gptgames.dev/games/asteroids.html">
<meta name="description" content="Drift, turn and shoot rocks apart on a glowing vector display. Draft an upgrade after every wave, outlast a boss every fifth, unlock new hulls. Plays on desktop, gamepad and phone.">
<meta name="theme-color" content="#020507">
<style>
:root{--beam:#d6f0ff;--hot:#b0ecff;--ember:#ff7c30;--gold:#ffcc62;--bg:#020507;--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--beam);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.vt{display:inline-block;vertical-align:middle;overflow:visible}
.vt path{fill:none;stroke:currentColor;stroke-width:1.7px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.vt{filter:drop-shadow(0 0 2px rgba(176,236,255,.55)) drop-shadow(0 0 9px rgba(176,236,255,.25))}
.vt.dim{opacity:.5}.vt.soft{opacity:.78}
.vt.gold{color:var(--gold);filter:drop-shadow(0 0 2px rgba(255,204,98,.6)) drop-shadow(0 0 9px rgba(255,204,98,.3))}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px calc(24px + var(--sab));
  opacity:0;pointer-events:none;transition:opacity .35s ease}
.screen.on{opacity:1;pointer-events:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:1px dashed rgba(214,240,255,.55);outline-offset:4px}
.btn{position:relative;padding:14px 34px;border:1px solid rgba(214,240,255,.5);border-radius:2px;background:rgba(176,236,255,.04);
  box-shadow:0 0 14px rgba(176,236,255,.12),inset 0 0 14px rgba(176,236,255,.06);transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .15s,box-shadow .15s}
.btn:hover,.btn:focus-visible{background:rgba(176,236,255,.1);box-shadow:0 0 22px rgba(176,236,255,.25),inset 0 0 18px rgba(176,236,255,.1)}
.btn:active{transform:scale(.96)}
.btn.small{padding:10px 20px;border-color:rgba(214,240,255,.25)}
/* title */
#title{gap:0;background:radial-gradient(ellipse at 50% 45%,rgba(2,5,7,.15),rgba(2,5,7,.55) 70%)}
#title .logo{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:34px}
#logo1 .vt path{stroke-width:2.6px}
#logo1{animation:warm 1.4s ease-out both}
#logo2{letter-spacing:0;animation:warm 1.4s .35s ease-out both}
@keyframes warm{0%{opacity:0;filter:brightness(3) blur(3px)}35%{opacity:1}100%{opacity:1;filter:none}}
#hulls{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;justify-content:center}
.hull{width:220px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid rgba(214,240,255,.14);background:rgba(2,6,9,.55);
  border-radius:2px;transition:border-color .2s,background .2s,transform .2s cubic-bezier(.3,1.6,.5,1);animation:rise .6s calc(.5s + var(--d,0s)) cubic-bezier(.2,1,.3,1) both}
.hull:nth-child(2){--d:.07s}.hull:nth-child(3){--d:.14s}
.hull:hover{border-color:rgba(214,240,255,.35)}
.hull.sel{border-color:rgba(214,240,255,.75);background:rgba(176,236,255,.07);box-shadow:0 0 18px rgba(176,236,255,.14)}
.hull.locked{opacity:.6;border-style:dashed;background:rgba(2,6,9,.3)}
.hull.locked .g{opacity:.35}
.hull.shake{animation:shake .32s ease}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hull .g{height:50px;display:flex;align-items:center}
.hull .b{text-align:center;line-height:1.2;min-height:22px}
.hull .stats{display:flex;flex-direction:column;gap:4px;margin-top:4px;min-height:42px}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;width:120px}
.bars{display:flex;gap:2px}.bars i{width:8px;height:4px;background:rgba(214,240,255,.14)}.bars i.on{background:rgba(214,240,255,.8);box-shadow:0 0 4px rgba(176,236,255,.6)}
#launch{animation:rise .6s .75s cubic-bezier(.2,1,.3,1) both}
#record{margin-top:20px;min-height:12px}
#keys{position:absolute;bottom:calc(22px + var(--sab));left:0;right:0;text-align:center}
#credit{position:absolute;top:16px;right:18px;text-decoration:none;color:inherit;opacity:.8}
/* draft */
#draft{background:linear-gradient(180deg,rgba(2,5,7,0),rgba(2,5,7,.55) 30%,rgba(2,5,7,.55) 70%,rgba(2,5,7,0));gap:12px}
#cards{display:flex;gap:14px;margin-top:10px;perspective:800px}
.card{position:relative;width:230px;min-height:280px;padding:26px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;
  border:1px solid rgba(214,240,255,.3);background:rgba(2,7,10,.86);border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 10px 40px rgba(0,0,0,.6);
  opacity:0;transform:translateY(60px) rotateX(18deg);transition:border-color .15s,background .15s,box-shadow .15s}
#draft.on .card{animation:deal .55s calc(var(--i)*.08s + .1s) cubic-bezier(.2,1.35,.4,1) forwards}
@keyframes deal{to{opacity:1;transform:none}}
.card:hover,.card:focus-visible{border-color:rgba(214,240,255,.85);background:rgba(10,24,32,.92);box-shadow:0 0 26px rgba(176,236,255,.2),0 10px 40px rgba(0,0,0,.6)}
.card:focus-visible{outline:none}
.card.r2{border-color:rgba(214,240,255,.5)}
.card.r3{border-color:rgba(255,204,98,.6)}
.card.r3:hover,.card.r3:focus-visible{border-color:rgba(255,204,98,1);box-shadow:0 0 30px rgba(255,204,98,.25)}
.card .key{position:absolute;top:9px;left:11px}
.card .rar{position:absolute;top:10px;right:11px}
.card .icon{width:60px;height:60px;margin:8px 0 4px}
.card .icon path{stroke-width:2px}
.card .txt{display:flex;flex-direction:column;align-items:center;gap:10px}
.card .d{text-align:center;line-height:1.1}
.card.picked{animation:none!important;opacity:1;border-color:var(--gold);box-shadow:0 0 30px rgba(255,204,98,.4);transition:none}
@keyframes fly{0%{opacity:1;transform:none}25%{opacity:1;transform:scale(1.06)}100%{opacity:.15;transform:translate(var(--tx),var(--ty)) scale(.06)}}
#draft.picking #dhead,#draft.picking #dtitle{opacity:0;transition:opacity .2s}
.card.gone{animation:none!important;transition:opacity .25s,transform .3s;opacity:0!important;transform:translateY(30px)!important}
/* pause / over */
#pause{background:rgba(2,5,7,.74)}#over{background:radial-gradient(ellipse at 50% 50%,rgba(2,5,7,.92) 30%,rgba(2,5,7,.75))}
#pause .col,#over .col{display:flex;flex-direction:column;align-items:center;gap:14px}
#ostats{display:grid;grid-template-columns:repeat(6,auto);gap:22px;margin:6px 0 4px}
#ostats .row{display:flex;flex-direction:column;align-items:center;gap:8px}
#over .unl{display:flex;align-items:center;gap:12px;color:var(--gold)}
#over .unl .vt{color:var(--gold)}
#over .acts{display:flex;gap:12px;margin-top:10px;align-items:center}
#over #otitle{animation:none}
#over.on .col>*{animation:rise .5s cubic-bezier(.2,1,.3,1) both}
#over.on .col>*:nth-child(2){animation-delay:.08s}#over.on .col>*:nth-child(3){animation-delay:.16s}#over.on .col>*:nth-child(4){animation-delay:.24s}#over.on .col>*:nth-child(5){animation-delay:.32s}#over.on .col>*:nth-child(6){animation-delay:.4s}#over.on .col>*:nth-child(7){animation-delay:.48s}
/* in-game corner buttons */
#hudbtns{position:fixed;bottom:6px;right:8px;display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .3s}
#hudbtns.on{opacity:.55;pointer-events:auto}
#hudbtns button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#hudbtns button:hover{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  #hulls{gap:8px;flex-wrap:nowrap}.hull{width:calc((100vw - 52px) / 3);max-width:124px;padding:12px 6px 10px}.st{width:auto;flex-direction:column;gap:3px}.bars i{width:5px}
  #cards{flex-direction:column;gap:8px;width:100%;max-width:360px}
  .card{width:100%;min-height:0;flex-direction:row;padding:14px 14px 14px 46px;text-align:left;gap:12px}
  .card .icon{width:40px;height:40px;margin:0;flex:none}.card .d{text-align:left}.card .txt{align-items:flex-start;gap:6px}.card .rar{top:8px}.card .key{top:50%;transform:translateY(-50%);left:16px}
  .card .n{display:block}.card>span.n,.card>span.d{flex:none}
    #ostats{grid-template-columns:repeat(3,auto);gap:16px 26px}
}
#hudbtns.touch #muteBtn{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Asteroids: Afterglow playfield"></canvas>
<h1 class="sr">Asteroids: Afterglow</h1>

<section id="title" class="screen" aria-label="Title">
  <div class="logo"><div id="logo1"></div><div id="logo2"></div></div>
  <div id="hulls" role="group" aria-label="Choose a hull"></div>
  <button id="launch" class="btn" aria-label="Launch"></button>
  <div id="record"></div>
  <div id="keys" aria-hidden="true"></div>
  <a id="credit" href="https://www.gptgames.dev/" aria-label="gptgames.dev"></a>
</section>

<section id="draft" class="screen" aria-label="Choose an upgrade">
  <div id="dhead"></div>
  <div id="dtitle"></div>
  <div id="cards"></div>
</section>

<section id="pause" class="screen" aria-label="Paused">
  <div class="col">
    <div id="ptitle"></div>
    <button id="resume" class="btn" aria-label="Resume"></button>
    <button id="soundBtn" class="btn small" aria-label="Sound"></button>
    <button id="restart" class="btn small" aria-label="Restart run"></button>
    <button id="quit" class="btn small" aria-label="Quit to title"></button>
  </div>
</section>

<section id="over" class="screen" aria-label="Run over">
  <div class="col">
    <div id="otitle"></div>
    <div id="oscore"></div>
    <div id="obest"></div>
    <div id="ostats" role="text"></div>
    <div id="obuild"></div>
    <div id="ounlock"></div>
    <div class="acts"><button id="again" class="btn" aria-label="Again"></button><button id="tohulls" class="btn small" aria-label="Hulls"></button></div>
  </div>
</section>

<div id="hudbtns"><button id="pauseBtn" aria-label="Pause"></button><button id="muteBtn" aria-label="Sound"></button></div>

<script id="core">
/* Asteroids: Afterglow - the rules, with no DOM. A run is a seeded state that step() advances.
   World units: the field is s.w x s.h; the renderer chooses how many pixels a unit is. */
const AfterCore = (() => {
    const TAU = Math.PI * 2;
    const rngOf = seed => {
        let a = seed >>> 0;
        return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    };
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

    const ROCK = {3: {r: 54, pts: 20}, 2: {r: 29, pts: 50}, 1: {r: 15, pts: 100}};
    const SHIP_R = 18;               // drawing radius (nose to centre)
    const SECTORS = ['KESSLER FIELD', 'THE SCATTER', 'GLASS REEF', 'EMBER BELT', 'THE DEEP'];
    const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
    const ANOMALIES = {
        well: {name: 'GRAVITY WELL', hint: 'SPACE BENDS TOWARD THE CORE'},
        swarm: {name: 'SWARM', hint: 'A CLOUD OF SMALL ROCKS'},
        comets: {name: 'COMET SHOWER', hint: 'FAST ROCKS CROSS THE FIELD'},
        blackout: {name: 'BLACKOUT', hint: 'ONLY YOUR LAMP LIGHTS THE FIELD'}
    };

    const HULLS = {
        drifter: {name: 'DRIFTER', blurb: 'THE BALANCED HULL', lives: 3, turn: 4.7, thrust: 560, fire: 6.2, size: 1, shield: 0, pierce: 0, unlock: null},
        wasp: {name: 'WASP', blurb: 'QUICK, SHARP, FRAGILE', lives: 2, turn: 6.4, thrust: 700, fire: 8.2, size: .82, shield: 0, pierce: 0, unlock: {bestWave: 5, text: 'REACH WAVE 5'}},
        bastion: {name: 'BASTION', blurb: 'TWO SHIELDS, PIERCING SHELLS', lives: 2, turn: 3.9, thrust: 470, fire: 4.6, size: 1.15, shield: 2, pierce: 1, unlock: {bossKills: 1, text: 'DESTROY A BOSS'}}
    };

    // r = rarity (1 common, 2 rare, 3 exotic), max = stacks
    const UPGRADES = [
        {id: 'twin', name: 'TWIN CANNONS', desc: 'WING GUNS FIRE BESIDE THE NOSE', r: 1, max: 2},
        {id: 'spread', name: 'SCATTER CHOKE', desc: 'EVERY OTHER VOLLEY FANS OUT', r: 2, max: 1},
        {id: 'rapid', name: 'CYCLER', desc: 'FIRE RATE +20%', r: 1, max: 3},
        {id: 'range', name: 'LONG BARREL', desc: 'SHOTS FLY 35% FARTHER', r: 1, max: 2},
        {id: 'pierce', name: 'AP ROUNDS', desc: 'SHOTS PUNCH THROUGH A ROCK', r: 2, max: 2},
        {id: 'frag', name: 'FRAGMENTER', desc: 'ROCKS BREAK INTO THREE', r: 2, max: 1},
        {id: 'aegis', name: 'AEGIS CELL', desc: '+1 SHIELD, ONE REFILLS EACH WAVE', r: 1, max: 3},
        {id: 'nova', name: "DEAD MAN'S NOVA", desc: 'A HIT BLASTS NEARBY ROCKS', r: 2, max: 1},
        {id: 'salvage', name: 'SALVAGE RIG', desc: 'ALL SCORE +25%', r: 1, max: 3},
        {id: 'burner', name: 'AFTERBURNER', desc: 'THRUST +30%, TURN +20%', r: 1, max: 2},
        {id: 'phase', name: 'PHASE DRIVE', desc: 'JUMP RECHARGES FAST, LANDS HOT', r: 2, max: 1},
        {id: 'fuse', name: 'LONG FUSE', desc: 'COMBO LASTS 50% LONGER', r: 1, max: 2},
        {id: 'seeker', name: 'SEEKER ROUNDS', desc: 'SHOTS BEND TOWARD ROCKS', r: 3, max: 1},
        {id: 'heavy', name: 'OVERCHARGE', desc: 'EVERY 6TH SHOT IS A BLAST', r: 3, max: 1},
        {id: 'rear', name: 'TAIL GUN', desc: 'ONE SHOT FIRES BACKWARD', r: 1, max: 1},
        {id: 'graze', name: 'CLOSE CALL', desc: 'GRAZES PAY 3X AND FEED COMBO', r: 2, max: 1},
        {id: 'life', name: 'SPARE HULL', desc: '+1 SHIP', r: 3, max: 9},
        {id: 'bounty', name: 'BOUNTY', desc: 'CASH IN: 2500 PER SECTOR', r: 1, max: 1e9, filler: true}
    ];
    const UP = Object.fromEntries(UPGRADES.map(u => [u.id, u]));

    const COMBO_STEP = 4, COMBO_MAX = 8, COMBO_WINDOW = 1.7;
    const EXTRA_LIFE = 10000, MAX_LIVES = 6;
    const HYPER_CD = 7.5, INTRO = 1.7, CLEAR = 1.3;

    function create(o = {}) {
        const hull = HULLS[o.hull] ? o.hull : 'drifter', H = HULLS[hull];
        const s = {
            seed: o.seed >>> 0 || 1, rnd: null, w: o.w || 1000, h: o.h || 720, t: 0, hull, mods: {},
            ship: null, rocks: [], shots: [], eshots: [], saucers: [], boss: null, well: null,
            score: 0, lives: H.lives, shield: H.shield, maxShield: H.shield, wave: 0, phase: 'intro', phaseT: 0,
            chain: 0, comboT: 0, kills: 0, grazes: 0, maxMult: 1, nextLife: EXTRA_LIFE, anomaly: null,
            saucerT: 0, cometT: 0, waveRocks: 1, shotCount: 0, offer: null, bossKilled: 0, draftsTaken: [], nid: 1,
            fireCd: 0, hyperCd: 0, startLives: H.lives
        };
        s.rnd = rngOf(s.seed);
        s.ship = newShip(s);
        nextWave(s, o.wave || 1);
        return s;
    }
    const newShip = s => ({x: s.w / 2, y: s.h / 2, vx: 0, vy: 0, a: -Math.PI / 2, alive: true, inv: 2, dead: 0, thrust: 0, hyper: 0, size: HULLS[s.hull].size});
    const lvl = (s, id) => s.mods[id] || 0;
    const sectorOf = wave => Math.floor((wave - 1) / 5) + 1;
    const localOf = wave => (wave - 1) % 5 + 1;
    const isBossWave = wave => localOf(wave) === 5;
    const sectorName = sec => SECTORS[(sec - 1) % SECTORS.length];
    const mult = s => Math.min(COMBO_MAX, 1 + Math.floor(s.chain / COMBO_STEP));
    const comboWindow = s => COMBO_WINDOW * (1 + .5 * lvl(s, 'fuse'));
    const hullOf = s => HULLS[s.hull];
    const fireRate = s => hullOf(s).fire * (1 + .2 * lvl(s, 'rapid'));
    const turnRate = s => hullOf(s).turn * (1 + .2 * lvl(s, 'burner'));
    const thrustPow = s => hullOf(s).thrust * (1 + .3 * lvl(s, 'burner'));
    const hyperCd = s => HYPER_CD * (lvl(s, 'phase') ? .55 : 1);
    const shipHitR = s => SHIP_R * .62 * s.ship.size;

    function resize(s, w, h) {
        const fx = w / s.w, fy = h / s.h;
        const all = [s.ship, ...s.rocks, ...s.shots, ...s.eshots, ...s.saucers];
        if (s.well) all.push(s.well);
        if (s.boss) for (const p of bossParts(s)) all.push(p);
        for (const o of all) { o.x *= fx; o.y *= fy; }
        s.w = w; s.h = h;
    }

    function speedScale(s) { return Math.min(2.4, 1 + .07 * (s.wave - 1)); }

    function spawnRock(s, size, x, y, vx, vy, kind) {
        const r = s.rnd;
        const rock = {id: s.nid++, size, r: ROCK[size].r * (kind === 'crystal' ? .92 : 1), x, y, vx, vy, a: r() * TAU, va: (r() - .5) * (4 - size) * .9,
            shape: (r() * 1e9) | 0, kind: kind || 'rock', born: s.t, hp: rockHp(s, size, kind), maxHp: 1};
        rock.maxHp = rock.hp;
        s.rocks.push(rock);
        return rock;
    }
    function rockHp(s, size, kind) {
        if (kind === 'comet' || kind === 'crystal') return 1;
        const sec = sectorOf(s.wave);
        return 1 + (size === 3 ? Math.min(3, Math.floor((sec - 1) / 1.5)) : size === 2 ? Math.min(2, Math.floor((sec - 1) / 3)) : 0);
    }
    function edgePoint(s) {
        const r = s.rnd, sx = s.ship.x, sy = s.ship.y;
        for (let i = 0; i < 30; i++) {
            const e = r() * 4 | 0, x = e === 0 ? 0 : e === 1 ? s.w : r() * s.w, y = e === 2 ? 0 : e === 3 ? s.h : r() * s.h;
            const dx = Math.abs(x - sx), dy = Math.abs(y - sy);
            if (Math.hypot(Math.min(dx, s.w - dx), Math.min(dy, s.h - dy)) > 230) return [x, y];
        }
        return [0, 0];
    }
    function rockKind(s) {
        const sec = sectorOf(s.wave), r = s.rnd();
        const theme = (sec - 1) % 5;
        if (theme === 2 && r < .45) return 'crystal';
        if (theme === 3 && r < .3) return 'volatile';
        if (sec > 5 && r < .2) return ['crystal', 'volatile'][s.rnd() * 2 | 0];
        return 'rock';
    }

    function nextWave(s, n) {
        s.wave = n; s.phase = 'intro'; s.phaseT = 0; s.shots.length = 0; s.eshots.length = 0;
        s.anomaly = null; s.well = null; s.boss = null;
        const sec = sectorOf(n), loc = localOf(n), r = s.rnd, sp = speedScale(s);
        if (sec >= 2 && loc >= 2 && loc <= 4 && r() < .55) {
            const keys = Object.keys(ANOMALIES);
            s.anomaly = keys[(r() * keys.length) | 0];
        }
        if (n === 3 && sec === 1) s.anomaly = null;
        let count = Math.min(16, 3 + loc + (sec - 1) * 2);
        if (isBossWave(n)) { spawnBoss(s); count = 2; }
        if (s.anomaly === 'swarm') {
            for (let i = 0; i < count * 3; i++) { const [x, y] = edgePoint(s), a = r() * TAU, v = (55 + r() * 60) * sp; spawnRock(s, r() < .4 ? 2 : 1, x, y, Math.cos(a) * v, Math.sin(a) * v, rockKind(s)); }
        } else {
            for (let i = 0; i < count; i++) { const [x, y] = edgePoint(s), a = r() * TAU, v = (28 + r() * 42) * sp; spawnRock(s, 3, x, y, Math.cos(a) * v, Math.sin(a) * v, rockKind(s)); }
        }
        if (s.anomaly === 'well') s.well = {x: s.w * (.3 + r() * .4), y: s.h * (.3 + r() * .4), m: 1};
        s.waveRocks = Math.max(1, totalMass(s));
        s.saucerT = 9 + r() * 8 - Math.min(6, sec);
        s.cometT = 2;
        // shields refill one per wave
        if (s.shield < s.maxShield) s.shield++;
        return s;
    }
    const totalMass = s => s.rocks.reduce((m, k) => m + (k.size === 3 ? 7 : k.size === 2 ? 3 : 1), 0);
    function fieldFill(s) { return s.boss ? 1 : totalMass(s) / s.waveRocks; }

    // ----------------------------------------------------------------- bosses
    function spawnBoss(s) {
        const sec = sectorOf(s.wave);
        if (sec % 2 === 1) {
            const n = 4, tur = [];
            for (let i = 0; i < n; i++) tur.push({ang: i / n * TAU + TAU / 8, hp: 5 + sec, max: 5 + sec, cd: 2 + i * .85, tele: 0});
            s.boss = {kind: 'dread', name: 'DREADNOUGHT', x: s.w / 2, y: -120, ty: s.h * .3, vx: 22, vy: 0, a: 0, va: .18, r: 74,
                turrets: tur, core: {hp: 16 + 5 * sec, max: 16 + 5 * sec, open: false}, cd: 3, eject: 7, entering: 2.2, hit: 0, sec};
        } else {
            const segs = [], N = 14, hp = 3 + sec;
            for (let i = 0; i < N; i++) segs.push({x: -40 - i * 26, y: s.h * .35, hp, max: hp, hit: 0});
            s.boss = {kind: 'serpent', name: 'VOID SERPENT', chains: [{segs, dir: 0, speed: 125 + sec * 8, wig: 0, cd: 2.2, tele: 0}], spacing: 26, sec, total: N, entering: 3.4};
        }
    }
    function bossParts(s) {
        const b = s.boss; if (!b) return [];
        if (b.kind === 'dread') return [b];
        const out = []; for (const c of b.chains) for (const g of c.segs) out.push(g); return out;
    }
    function turretPos(b, t) { const a = b.a + t.ang; return [b.x + Math.cos(a) * b.r * .78, b.y + Math.sin(a) * b.r * .78]; }

    // ----------------------------------------------------------------- helpers
    function wrap(s, o, m) {
        m = m || 0;
        if (o.x < -m) o.x += s.w + 2 * m; else if (o.x > s.w + m) o.x -= s.w + 2 * m;
        if (o.y < -m) o.y += s.h + 2 * m; else if (o.y > s.h + m) o.y -= s.h + 2 * m;
    }
    function wd(s, ax, ay, bx, by) {   // shortest wrapped delta b - a
        let dx = bx - ax, dy = by - ay;
        if (dx > s.w / 2) dx -= s.w; else if (dx < -s.w / 2) dx += s.w;
        if (dy > s.h / 2) dy -= s.h; else if (dy < -s.h / 2) dy += s.h;

    }
    const dist = (s, a, b) => { const [dx, dy] = wd(s, a.x, a.y, b.x, b.y); return Math.hypot(dx, dy); };

    function addScore(s, base, ev, x, y, noMult) {
        const m = noMult ? 1 : mult(s);
        const pts = Math.round(base * m * (1 + .25 * lvl(s, 'salvage')));
        s.score += pts;
        while (s.score >= s.nextLife) { s.lifeN = (s.lifeN || 0) + 1; s.nextLife += EXTRA_LIFE * Math.pow(2, Math.min(s.lifeN, 12)); if (s.lives < MAX_LIVES) { s.lives++; ev.push({t: 'life'}); } }
        if (x !== undefined) ev.push({t: 'score', x, y, pts, m});
        return pts;
    }
    function bumpCombo(s, ev, n = 1) {
        const before = mult(s);
        s.chain += n; s.comboT = comboWindow(s);
        const m = mult(s);
        if (m > s.maxMult) s.maxMult = m;
        if (m > before) ev.push({t: 'combo', m});
    }

    // ----------------------------------------------------------------- rocks
    function breakRock(s, k, ev, hx, hy, by) {
        const i = s.rocks.indexOf(k); if (i < 0) return;
        s.rocks.splice(i, 1);
        bumpCombo(s, ev);
        s.kills++;
        const pts = addScore(s, ROCK[k.size].pts, ev, k.x, k.y);
        ev.push({t: 'split', x: k.x, y: k.y, size: k.size, r: k.r, vx: k.vx, vy: k.vy, hx: hx || 0, hy: hy || 0, kind: k.kind, shape: k.shape, a: k.a, pts, by});
        if (k.size > 1 && k.kind !== 'comet') {
            const n = k.kind === 'crystal' ? 3 : (lvl(s, 'frag') ? 3 : 2), sp = speedScale(s), r = s.rnd;
            const base = Math.atan2(hy || r() - .5, hx || r() - .5);
            for (let j = 0; j < n; j++) {
                const a = base + (j - (n - 1) / 2) * (TAU / (n + 1.6)) + Math.PI / 2 * (j % 2 ? 1 : -1) * .5 + (r() - .5) * .4;
                const v = (40 + r() * 50) * sp * (k.kind === 'crystal' ? 1.35 : 1) * (k.size === 3 ? 1 : 1.25);
                const child = spawnRock(s, k.size - 1, k.x, k.y, k.vx * .6 + Math.cos(a) * v + (hx || 0) * 40, k.vy * .6 + Math.sin(a) * v + (hy || 0) * 40, k.kind === 'volatile' ? 'rock' : k.kind);
                child.x += Math.cos(a) * k.r * .35; child.y += Math.sin(a) * k.r * .35;
            }
        }
        if (k.kind === 'volatile') blast(s, k.x, k.y, 110, ev, 'volatile');
    }
    function blast(s, x, y, R, ev, why) {
        ev.push({t: 'blast', x, y, R, why});
        const p = {x, y};
        const hit = s.rocks.filter(k => dist(s, p, k) < R + k.r * .6);
        for (const k of hit) { const [dx, dy] = wd(s, x, y, k.x, k.y), d = Math.hypot(dx, dy) || 1; if (k.hp > 1 && why !== 'nova') { k.hp--; k.vx += dx / d * 30; k.vy += dy / d * 30; ev.push({t: 'chip', x: k.x - dx / d * k.r, y: k.y - dy / d * k.r, id: k.id, hp: k.hp, vx: dx / d, vy: dy / d}); } else breakRock(s, k, ev, dx / d, dy / d, why); }
        for (const u of s.saucers.slice()) if (dist(s, p, u) < R + u.r) killSaucer(s, u, ev);
        for (let i = s.eshots.length - 1; i >= 0; i--) if (dist(s, p, s.eshots[i]) < R) s.eshots.splice(i, 1);
    }

    // ----------------------------------------------------------------- ship
    function fire(s, ev) {
        const sh = s.ship, a = sh.a, r = SHIP_R * sh.size;
        const longb = 1 + .35 * lvl(s, 'range');
        const sp = 760 * (1 + .12 * lvl(s, 'range')), life = .78 * longb * (s.hull === 'wasp' ? 1.05 : 1);
        const pierce = hullOf(s).pierce + lvl(s, 'pierce');
        s.shotCount++;
        const heavy = lvl(s, 'heavy') && s.shotCount % 6 === 0;
        const muzzles = [];
        const tw = lvl(s, 'twin');
        if (tw !== 1) muzzles.push([r * 1.05, 0, 0]);
        if (tw >= 1) { muzzles.push([r * .2, -r * .82, 0]); muzzles.push([r * .2, r * .82, 0]); }
        if (lvl(s, 'spread') && s.shotCount % 2) { muzzles.push([r * .8, -r * .3, -.2]); muzzles.push([r * .8, r * .3, .2]); }
        if (lvl(s, 'rear')) muzzles.push([-r * .8, 0, Math.PI]);
        const c = Math.cos(a), sn = Math.sin(a);
        for (const [mx, my, da] of muzzles) {
            const x = sh.x + mx * c - my * sn, y = sh.y + mx * sn + my * c, aa = a + da;
            s.shots.push({x, y, px: x, py: y, vx: sh.vx * .9 + Math.cos(aa) * sp, vy: sh.vy * .9 + Math.sin(aa) * sp, life, pierce, heavy: heavy && da === 0, hitIds: []});
        }
        ev.push({t: 'shot', n: muzzles.length, heavy});
    }
    function hyper(s, ev) {
        const sh = s.ship, r = s.rnd;
        let best = null, bestD = -1;
        for (let i = 0; i < 28; i++) {
            const p = {x: 40 + r() * (s.w - 80), y: 40 + r() * (s.h - 80)};
            let d = 1e9;
            for (const k of s.rocks) d = Math.min(d, dist(s, p, k) - k.r);
            for (const e of s.eshots) d = Math.min(d, dist(s, p, e) - 20);
            for (const u of s.saucers) d = Math.min(d, dist(s, p, u) - u.r - 30);
            for (const q of bossParts(s)) d = Math.min(d, dist(s, p, q) - (q.r || 16) - 30);
            if (d > bestD) { bestD = d; best = p; }
        }
        ev.push({t: 'hyperOut', x: sh.x, y: sh.y, a: sh.a});
        sh.x = best.x; sh.y = best.y; sh.vx *= .25; sh.vy *= .25; sh.inv = Math.max(sh.inv, .7); sh.hyper = .35;
        s.hyperCd = hyperCd(s);
        ev.push({t: 'hyperIn', x: sh.x, y: sh.y, a: sh.a, clear: bestD});
        if (lvl(s, 'phase')) blast(s, sh.x, sh.y, 95, ev, 'phase');
    }
    function hurtShip(s, ev, cause) {
        const sh = s.ship;
        if (!sh.alive || sh.inv > 0) return false;
        if (lvl(s, 'nova')) blast(s, sh.x, sh.y, 150, ev, 'nova');
        if (s.shield > 0) {
            s.shield--; sh.inv = 1.4;
            ev.push({t: 'shield', x: sh.x, y: sh.y, left: s.shield});
            return true;
        }
        sh.alive = false; sh.dead = 0; s.lives--; s.chain = 0; s.comboT = 0;
        ev.push({t: 'death', x: sh.x, y: sh.y, a: sh.a, vx: sh.vx, vy: sh.vy, cause, lives: s.lives});
        if (s.lives <= 0) { s.phase = 'over'; s.phaseT = 0; ev.push({t: 'over'}); }
        return true;
    }

    // ----------------------------------------------------------------- saucers
    function spawnSaucer(s, ev) {
        const r = s.rnd, sec = sectorOf(s.wave);
        const small = s.wave >= 4 && r() < Math.min(.75, .2 + .1 * s.wave);
        const left = r() < .5, y = s.h * (.15 + r() * .7);
        const sp = (small ? 120 : 85) * (1 + .04 * sec);
        s.saucers.push({id: s.nid++, x: left ? -30 : s.w + 30, y, vx: left ? sp : -sp, vy: 0, r: small ? 12 : 20, small, cd: 1.6, tele: 0, aim: 0, zig: 1.2 + r(), born: s.t});
        ev.push({t: 'saucer', small});
    }
    function killSaucer(s, u, ev) {
        const i = s.saucers.indexOf(u); if (i < 0) return;
        s.saucers.splice(i, 1);
        bumpCombo(s, ev, 2);
        addScore(s, u.small ? 1000 : 200, ev, u.x, u.y);
        ev.push({t: 'saucerDown', x: u.x, y: u.y, small: u.small, vx: u.vx, vy: u.vy});
    }
    function aimAt(s, x, y, speed, err) {
        const sh = s.ship;
        const [dx, dy] = wd(s, x, y, sh.x, sh.y);
        const tt = Math.hypot(dx, dy) / speed;
        const ax = dx + sh.vx * tt * .7, ay = dy + sh.vy * tt * .7;
        return Math.atan2(ay, ax) + (s.rnd() - .5) * err;
    }
    function enemyShot(s, x, y, a, sp, ev, src) {
        s.eshots.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.7, grazed: false, src});
        ev.push({t: 'eshot', x, y, src});
    }

    // ----------------------------------------------------------------- draft
    function makeOffer(s) {
        const r = s.rnd, after = isBossWave(s.wave);
        const pool = UPGRADES.filter(u => !u.filler && lvl(s, u.id) < u.max && !(u.id === 'life' && s.lives >= MAX_LIVES - 1));
        const weight = u => u.r === 1 ? 6 : u.r === 2 ? 3 : (after ? 3 : 1.1);
        const pickOne = list => { let tot = list.reduce((a, u) => a + weight(u), 0), x = r() * tot; for (const u of list) { x -= weight(u); if (x <= 0) return u; } return list[list.length - 1]; };
        const out = [];
        let left = pool.slice();
        if (after) { const rare = left.filter(u => u.r >= 2); if (rare.length) { const u = pickOne(rare); out.push(u.id); left = left.filter(x => x !== u); } }
        while (out.length < 3 && left.length) { const u = pickOne(left); out.push(u.id); left = left.filter(x => x !== u); }
        if (out.length < 3) out.push('bounty');
        s.offer = out;
        return out;
    }
    function choose(s, id) {
        if (s.phase !== 'draft' || !s.offer || !s.offer.includes(id)) return false;
        s.mods[id] = lvl(s, id) + 1;
        s.draftsTaken.push(id);
        if (id === 'aegis') { s.maxShield++; s.shield++; }
        if (id === 'bounty') addScore(s, 2500 * sectorOf(s.wave), [], undefined, undefined, true);
        if (id === 'life') s.lives = Math.min(MAX_LIVES, s.lives + 1);
        s.offer = null;
        nextWave(s, s.wave + 1);
        return true;
    }

    // ----------------------------------------------------------------- step
    const NOIN = {turn: 0, thrust: 0, aim: null, fire: false, hyper: false};
    function step(s, dt, inp) {
        inp = inp || NOIN;
        const ev = [];
        s.t += dt; s.phaseT += dt;
        if (s.demo) { for (const k of s.rocks) { k.x += k.vx * dt; k.y += k.vy * dt; k.a += k.va * dt; wrap(s, k, k.r * .5); } return ev; }
        const sh = s.ship;

        if (s.phase === 'intro' && s.phaseT >= INTRO) { s.phase = 'play'; s.phaseT = 0; ev.push({t: 'go'}); if (s.boss) ev.push({t: 'boss', name: s.boss.name}); }
        const live = s.phase === 'play' || s.phase === 'intro' || s.phase === 'clear';

        // --- ship
        if (sh.alive && s.phase !== 'over') {
            if (s.phase === 'draft') {   // hands off while choosing: the ship settles toward the middle
                const [dx, dy] = wd(s, sh.x, sh.y, s.w / 2, s.h / 2);
                sh.vx += dx * 2.2 * dt; sh.vy += dy * 2.2 * dt;
            }
            else if (inp.aim !== null && inp.aim !== undefined) {
                const d = angDiff(sh.a, inp.aim), mx = turnRate(s) * 1.25 * dt;
                sh.a += clamp(d, -mx, mx);
            } else sh.a += clamp(inp.turn || 0, -1, 1) * turnRate(s) * dt;
            const th = s.phase === 'draft' ? 0 : clamp(inp.thrust || 0, 0, 1);
            sh.thrust = th;
            if (th > 0) { sh.vx += Math.cos(sh.a) * thrustPow(s) * th * dt; sh.vy += Math.sin(sh.a) * thrustPow(s) * th * dt; }
            const drag = Math.exp(-dt * (s.phase === 'draft' ? 2.4 : th > 0 ? .25 : .55));
            sh.vx *= drag; sh.vy *= drag;
            const v = Math.hypot(sh.vx, sh.vy), vmax = 520 * (1 + .1 * lvl(s, 'burner'));
            if (v > vmax) { sh.vx *= vmax / v; sh.vy *= vmax / v; }
            sh.x += sh.vx * dt; sh.y += sh.vy * dt; wrap(s, sh);
            sh.inv = Math.max(0, sh.inv - dt); sh.hyper = Math.max(0, sh.hyper - dt);
            s.fireCd -= dt;
            if (inp.fire && s.fireCd <= 0 && s.phase !== 'draft' && s.shots.length < 40) { fire(s, ev); s.fireCd = 1 / fireRate(s); }
            if (inp.hyper && s.hyperCd <= 0 && s.phase !== 'draft') hyper(s, ev);
        } else if (!sh.alive && s.phase !== 'over') {
            sh.dead += dt;
            if (sh.dead > 1.5) {
                const c = {x: s.w / 2, y: s.h / 2};
                const clear = s.rocks.every(k => dist(s, c, k) > k.r + 110) && s.eshots.every(e => dist(s, c, e) > 120) && bossParts(s).every(p => dist(s, c, p) > (p.r || 16) + 110);
                if (clear || sh.dead > 4.5) { Object.assign(sh, newShip(s), {inv: 2.6}); ev.push({t: 'respawn'}); }
            }
        }
        s.hyperCd = Math.max(0, s.hyperCd - dt);
        if (s.comboT > 0) { s.comboT -= dt; if (s.comboT <= 0) { s.chain = 0; s.comboT = 0; ev.push({t: 'comboEnd'}); } }

        // --- gravity well
        const pull = (o, k) => {
            if (!s.well) return;
            const [dx, dy] = wd(s, o.x, o.y, s.well.x, s.well.y), d2 = dx * dx + dy * dy + 900, d = Math.sqrt(d2);
            const a = Math.min(900, 2.4e6 / d2) * k;
            o.vx += dx / d * a * dt; o.vy += dy / d * a * dt;
        };

        // --- rocks
        for (const k of s.rocks) {
            pull(k, .25);
            k.x += k.vx * dt; k.y += k.vy * dt; k.a += k.va * dt;
            if (k.kind === 'comet') { if (k.x < -80 || k.x > s.w + 80 || k.y < -80 || k.y > s.h + 80) k.gone = true; }
            else wrap(s, k, k.r * .5);
            const v = Math.hypot(k.vx, k.vy), vm = 260;
            if (v > vm) { k.vx *= vm / v; k.vy *= vm / v; }
        }
        s.rocks = s.rocks.filter(k => !k.gone);
        if (s.anomaly === 'comets' && s.phase === 'play') {
            s.cometT -= dt;
            if (s.cometT <= 0) {
                s.cometT = 2.4 + s.rnd() * 2;
                const left = s.rnd() < .5, y = s.rnd() * s.h, a = (left ? 0 : Math.PI) + (s.rnd() - .5) * .6;
                const c = spawnRock(s, 1, left ? -40 : s.w + 40, y, Math.cos(a) * 330, Math.sin(a) * 330, 'comet');
                c.r = 11; ev.push({t: 'comet'});
            }
        }

        // --- shots
        for (let i = s.shots.length - 1; i >= 0; i--) {
            const b = s.shots[i];
            if (!b) continue;
            b.px = b.x; b.py = b.y;
            pull(b, 1.2);
            if (lvl(s, 'seeker') && s.rocks.length) {
                let best = null, bd = 210;
                for (const k of s.rocks) { const d = dist(s, b, k); if (d < bd && !b.hitIds.includes(k.id)) { bd = d; best = k; } }
                if (best) {
                    const [dx, dy] = wd(s, b.x, b.y, best.x, best.y), sp = Math.hypot(b.vx, b.vy), want = Math.atan2(dy, dx), cur = Math.atan2(b.vy, b.vx);
                    const na = cur + clamp(angDiff(cur, want), -2.2 * dt, 2.2 * dt);
                    b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
                }
            }
            b.x += b.vx * dt; b.y += b.vy * dt; wrap(s, b);
            b.life -= dt;
            if (b.life <= 0) { s.shots.splice(i, 1); continue; }
            let used = false;
            for (const k of s.rocks) {
                if (b.hitIds.includes(k.id)) continue;
                if (dist(s, b, k) < k.r * .92 + (b.heavy ? 6 : 2)) {
                    const sp = Math.hypot(b.vx, b.vy) || 1;
                    b.hitIds.push(k.id);
                    if (b.heavy) { blast(s, b.x, b.y, 80, ev, 'heavy'); used = true; break; }
                    if (k.hp > 1) { k.hp--; k.vx += b.vx / sp * 14; k.vy += b.vy / sp * 14; ev.push({t: 'chip', x: b.x, y: b.y, id: k.id, hp: k.hp, vx: b.vx / sp, vy: b.vy / sp}); used = true; break; }

                    if (b.pierce > 0) { b.pierce--; } else used = true;
                    break;
                }
            }
            if (!used) for (const u of s.saucers) if (dist(s, b, u) < u.r + 3) { killSaucer(s, u, ev); used = true; break; }
            if (!used && s.boss) used = shotVsBoss(s, b, ev);
            if (used) s.shots.splice(i, 1);
        }

        // --- saucers
        if (s.phase === 'play' && s.wave >= 2 && !s.boss) {
            s.saucerT -= dt;
            if (s.saucerT <= 0 && s.saucers.length < (s.wave > 8 ? 2 : 1) + (s.wave > 20 ? 1 : 0)) { spawnSaucer(s, ev); s.saucerT = Math.max(7, 19 - sectorOf(s.wave) * 2) + s.rnd() * 8; }
        }
        for (let i = s.saucers.length - 1; i >= 0; i--) {
            const u = s.saucers[i];
            u.zig -= dt;
            if (u.zig <= 0) { u.zig = 1 + s.rnd() * 1.6; u.vy = (s.rnd() - .5) * Math.abs(u.vx) * 1.4; }
            u.x += u.vx * dt; u.y += u.vy * dt;
            if (u.y < 0) u.y += s.h; else if (u.y > s.h) u.y -= s.h;
            if ((u.vx > 0 && u.x > s.w + 40) || (u.vx < 0 && u.x < -40)) { s.saucers.splice(i, 1); continue; }
            if (u.tele > 0) {
                u.tele -= dt;
                if (u.tele <= 0) { enemyShot(s, u.x, u.y, u.aim, 300, ev, 'saucer'); u.cd = u.small ? 1.25 : 1.7; }
            } else if (sh.alive && u.x > 0 && u.x < s.w) {
                u.cd -= dt;
                if (u.cd <= 0) { u.tele = .5; u.aim = u.small ? aimAt(s, u.x, u.y, 300, Math.max(.05, .5 - s.wave * .03)) : s.rnd() * TAU; ev.push({t: 'tele', x: u.x, y: u.y}); }
            }
            // saucers crash into rocks (classic)
            for (const k of s.rocks) if (dist(s, u, k) < u.r + k.r * .8) { breakRockNoScore(s, k, ev); destroySaucerNoScore(s, u, ev); break; }
        }

        // --- enemy shots
        for (let i = s.eshots.length - 1; i >= 0; i--) {
            const e = s.eshots[i];
            if (!e) continue;
            e.x += e.vx * dt; e.y += e.vy * dt; wrap(s, e); e.life -= dt;
            if (e.life <= 0) { s.eshots.splice(i, 1); continue; }
            if (e.src === 'saucer') {
                const k = s.rocks.find(k => dist(s, e, k) < k.r * .9);
                if (k) { breakRockNoScore(s, k, ev); s.eshots.splice(i, 1); continue; }
            }
            if (sh.alive) {
                const d = dist(s, e, sh), hr = shipHitR(s) + 3;
                if (d < hr) { s.eshots.splice(i, 1); hurtShip(s, ev, 'shot'); continue; }
                const gr = hr + 22 * (lvl(s, 'graze') ? 1.5 : 1);
                if (!e.grazed && d < gr && sh.inv <= 0) {
                    e.grazed = true; s.grazes++;

    gx.setTransform(1, 0, 0, 1, 0, 0);
    if (RM.matches) gx.clearRect(0, 0, glowC.width, glowC.height);
    else { gx.globalCompositeOperation = 'destination-out'; gx.fillStyle = `rgba(0,0,0,${1 - Math.exp(-rdt * 30)})`; gx.fillRect(0, 0, glowC.width, glowC.height); gx.globalCompositeOperation = 'source-over'; }
    gx.setTransform(D, 0, 0, D, 0, 0);
    gx.save(); gx.beginPath(); gx.rect(F.x, F.y, F.w, F.h); gx.clip(); gx.translate(sx, sy);
    gx.globalCompositeOperation = 'lighter';
    drawWell(gx, s, t);
    drawRockGlow(gx, s, t);
    if (mode === 'play') { drawShots(gx, s); drawEnemies(gx, s, t); }
    else drawEnemies(gx, s, t);
    drawParts(gx, mode === 'play' && paused ? 0 : dt);
    drawPops(gx, paused ? 0 : dt);
    gx.restore();
    gx.globalCompositeOperation = 'source-over';

    // bloom: two cheap downsamples of the glow layer, added back
    b1x.clearRect(0, 0, b1.width, b1.height); b1x.drawImage(glowC, 0, 0, b1.width, b1.height);
    b2x.clearRect(0, 0, b2.width, b2.height); b2x.drawImage(b1, 0, 0, b2.width, b2.height);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    const breathe = 1 + beatPulse * .12;
    ctx.globalAlpha = .7 * breathe; ctx.drawImage(b2, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = .55 * breathe; ctx.drawImage(b1, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1; ctx.drawImage(glowC, 0, 0);
    if (mode === 'play') {   // the ship: never smeared by phosphor, always the hottest line
        ctx.setTransform(D, 0, 0, D, 0, 0); ctx.save(); ctx.beginPath(); ctx.rect(F.x, F.y, F.w, F.h); ctx.clip(); ctx.translate(sx, sy);
        drawShip(ctx, s, t); ctx.restore(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    if (flash > 0) { ctx.fillStyle = `rgba(${HOT},${flash * .12})`; ctx.fillRect(0, 0, cv.width, cv.height); }
    ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(ovC, 0, 0);
    ctx.setTransform(D, 0, 0, D, 0, 0);
    if (mode === 'play') { drawHUD(ctx, s, t, paused ? 0 : rdt); drawControls(ctx, s, t, rdt); ctx.globalAlpha = 1; }
}

/* ------------------------------------------------------------------ screens */
const $ = id => document.getElementById(id);
const screens = ['title', 'draft', 'pause', 'over'];
function showScreen(id) {
    for (const s of screens) { const el = $(s); const on = s === id; el.classList.toggle('on', on); el.setAttribute('aria-hidden', on ? 'false' : 'true'); if ('inert' in el) el.inert = !on; }
    $('hudbtns').classList.toggle('on', id === null && mode === 'play');
}
function setLabel(el, text, size, cls) { el.innerHTML = svgText(text, size, cls); el.setAttribute('aria-label', el.getAttribute('aria-label') || text); }
function vt(el, text, size, cls) { el.innerHTML = svgText(text, size, cls); el.setAttribute('aria-label', text); el.setAttribute('role', el.getAttribute('role') || 'text'); }

function hullGlyph(id, size) {
    const H = C.HULLS[id], r = size * .32 * H.size, c = size / 2;
    const p = SHIP.map(q => [c + q[1] * r * -1, c - q[0] * r]);
    let d = 'M' + p.map(q => q.map(v => v.toFixed(1)).join(' ')).join('L') + 'Z';
    if (id === 'wasp') d += `M${c - r * .76} ${c + r * .5}L${c - r * 1.1} ${c + r * .95}M${c + r * .76} ${c + r * .5}L${c + r * 1.1} ${c + r * .95}`;
    if (id === 'bastion') d += `M${c} ${c - r * 1.15}L${c} ${c - r * 1.45}M${c - r * 1.5} ${c - r * .3}A${r * 1.6} ${r * 1.6} 0 0 1 ${c + r * 1.5} ${c - r * .3}`;
    return `<svg class="vt" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><path d="${d}"/></svg>`;
}
const UPICON = {
    twin: 'M10 30L10 8M30 30L30 8M14 30L20 14L26 30', spread: 'M20 30L20 8M20 30L8 12M20 30L32 12', rapid: 'M12 8L12 32M20 8L20 32M28 8L28 32', range: 'M6 20L34 20M28 14L34 20L28 26',
    pierce: 'M6 20L34 20M18 10A10 10 0 0 1 18 30', frag: 'M20 6L30 16L26 30L14 30L10 16Z M20 6L20 20L26 30M20 20L10 16', aegis: 'M8 26A14 14 0 0 1 32 26M12 28A9 9 0 0 1 28 28M20 32L20 30',
    nova: 'M20 20m-6 0a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M20 4L20 10M20 30L20 36M4 20L10 20M30 20L36 20', salvage: 'M10 30L30 30L26 14L14 14ZM16 14L20 8L24 14', burner: 'M14 10L26 10L20 22ZM16 24L20 34L24 24',
    phase: 'M8 28L16 12L22 24L32 8M28 8L32 8L32 12', fuse: 'M8 30L14 24L18 26L24 18L30 12M30 12L32 8', seeker: 'M6 30Q14 8 34 12M28 8L34 12L30 18', heavy: 'M20 20m-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0M20 20m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0',
    rear: 'M20 6L20 34M14 28L20 34L26 28M14 12L20 6L26 12', graze: 'M6 20A14 14 0 0 1 34 20M20 20m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M30 8L36 4', life: 'M20 6L30 32L20 26L10 32Z', bounty: 'M20 6L34 20L20 34L6 20ZM20 13L27 20L20 27L13 20Z'
};
const upSvg = id => `<svg class="vt icon" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="${UPICON[id] || UPICON.bounty}"/></svg>`;

function buildTitle() {
    vt($('logo1'), 'ASTEROIDS', W < 640 ? 34 : 84);
    vt($('logo2'), 'AFTERGLOW', W < 640 ? 13 : 18, 'gold');
    const box = $('hulls'); box.innerHTML = '';
    for (const id of Object.keys(C.HULLS)) {
        const H = C.HULLS[id], ok = C.unlocked(meta, id), b = document.createElement('button');
        b.className = 'hull' + (prefs.hull === id ? ' sel' : '') + (ok ? '' : ' locked');
        b.setAttribute('aria-pressed', prefs.hull === id ? 'true' : 'false');
        b.setAttribute('aria-label', H.name + (ok ? ' - ' + H.blurb : ' - locked: ' + H.unlock.text));
        b.innerHTML = `<span class="g">${hullGlyph(id, W < 640 ? 46 : 58)}</span><span class="n">${svgText(H.name, W < 640 ? 13 : 16)}</span><span class="b">${ok ? wrapText(H.blurb, W < 640 ? 7 : 9, W < 640 ? 12 : 24) : svgText('LOCKED', W < 640 ? 7 : 9, 'dim') + '<br>' + wrapText(H.unlock.text, W < 640 ? 7 : 9, W < 640 ? 12 : 24, 'dim')}</span>` +
            `<span class="stats">${ok ? stat('HULL', H.lives + H.shield, 4) + stat('TURN', H.turn, 6.4) + stat('GUNS', H.fire, 8.2) : ''}</span>`;
        b.onclick = () => { AU.ensure(); if (!ok) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); AU.ding(); return; } prefs.hull = id; savePrefs(); AU.hover(); buildTitle(); $('launch').focus(); };
        box.appendChild(b);
    }
    setLabel($('launch'), 'LAUNCH', W < 640 ? 18 : 22);
    const rec = $('record');
    rec.innerHTML = meta.runs ? svgText('BEST ' + meta.best + ' · WAVE ' + meta.bestWave + (meta.bossKills ? ' · BOSSES ' + meta.bossKills : ''), 9, 'dim') : '';
    rec.setAttribute('aria-label', meta.runs ? `Best ${meta.best}, wave ${meta.bestWave}` : '');
    $('keys').innerHTML = touchUI ? '' : svgText('ARROWS TURN · UP THRUST · SPACE FIRE · SHIFT JUMP · P PAUSE · M SOUND', 10, 'dim');
    $('credit').innerHTML = svgText('GPTGAMES.DEV', 7, 'dim');
}
function stat(label, v, max) {
    let bars = ''; const n = 6, on = Math.round(v / max * n);
    for (let i = 0; i < n; i++) bars += `<i class="${i < on ? 'on' : ''}"></i>`;
    return `<span class="st">${svgText(label, W < 640 ? 6 : 8, 'dim')}<span class="bars">${bars}</span></span>`;
}
function launch() { if (mode !== 'title') return; startRun(); }

let draftLock = false;
function openDraft(offer) {
    const s = game, box = $('cards'); box.innerHTML = ''; draftLock = false; $('draft').classList.remove('picking');
    vt($('dhead'), 'WAVE ' + s.wave + ' CLEAR', 10, 'dim');
    vt($('dtitle'), C.isBossWave(s.wave) ? 'SALVAGE THE WRECK' : 'CHOOSE ONE', W < 640 ? 18 : 24);
    offer.forEach((id, i) => {
        const u = C.UP[id], lv = C.lvl(s, id), b = document.createElement('button');
        b.className = 'card r' + u.r; b.style.setProperty('--i', i);
        b.setAttribute('aria-label', `${u.name}: ${u.desc}` + (lv ? `, level ${lv + 1}` : ''));
        const pips = '◆'.repeat(u.r);
        b.innerHTML = `<span class="key">${svgText('' + (i + 1), 9, 'dim')}</span><span class="rar">${svgText(u.r === 3 ? 'EXOTIC' : u.r === 2 ? 'RARE' : 'COMMON', W < 640 ? 7 : 8, u.r === 3 ? 'gold' : 'dim')}</span>${upSvg(id)}` +
            `<span class="txt"><span class="n">${svgText(u.name + (lv && u.max < 99 ? ' ' + C.ROMAN[lv] : ''), W < 640 ? 10 : 15)}</span><span class="d">${wrapText(id === 'bounty' ? 'CASH IN ' + Math.round(2500 * (1 + .25 * C.lvl(s, 'salvage')) * C.sectorOf(s.wave)) : u.desc, W < 640 ? 7 : 10, W < 640 ? 30 : 17)}</span></span>`;
        b.dataset.pips = pips;
        b.onpointerenter = () => AU.hover();
        b.onclick = () => pickCard(b, id);
        box.appendChild(b);
    });
    showScreen('draft');
    setTimeout(() => { const f = box.querySelector('.card'); if (f && !touchUI) f.focus({preventScroll: true}); }, 380);
}
function wrapText(str, size, max, cls) {
    const words = str.split(' '), lines = []; let cur = '';
    for (const w of words) { if (cur && (cur + ' ' + w).trim().length > (max || 18)) { lines.push(cur.trim()); cur = w; } else cur += ' ' + w; }
    if (cur.trim()) lines.push(cur.trim());
    return lines.map(l => svgText(l, size, cls || 'soft')).join('<br>');
}
function pickCard(b, id) {
    if (draftLock || game.phase !== 'draft') return;
    draftLock = true;
    AU.pick();
    const r = b.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    b.classList.add('picked'); $('draft').classList.add('picking');
    for (const o of document.querySelectorAll('#cards .card')) if (o !== b) o.classList.add('gone');
    // the card is drawn into the ship along a curve; the wave starts when it lands, on game time
    const dur = RM.matches ? .05 : .55;
    let el = 0, prev = performance.now();
    const land = () => {
        rings.push({x: game.ship.x, y: game.ship.y, r0: 70, r1: 8, t: 0, max: .35, rgb: GOLD, a: .9});
        AU.combo(4);
        C.choose(game, id); showScreen(null); waveBanner(.3);
    };
    const step = now => {
        if (!paused) el += Math.min(.05, (now - prev) / 1000);
        prev = now;
        const f = clamp(el / dur, 0, 1), e = f * f * (3 - 2 * f), [sx, sy] = W2S(game.ship.x, game.ship.y);
        const mx = (x0 + sx) / 2, my = Math.min(y0, sy) - 80, q = 1 - e;
        const x = q * q * x0 + 2 * q * e * mx + e * e * sx, y = q * q * y0 + 2 * q * e * my + e * e * sy;
        b.style.transform = `translate(${x - x0}px,${y - y0}px) scale(${lerp(1, .05, e * e)}) rotate(${e * 8}deg)`;
        b.style.opacity = String(1 - e * e * .85);
        if (f >= 1) land(); else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}
function setPaused(p) {
    if (mode !== 'play' || game.phase === 'over') return;
    paused = p;
    if (p) { keys.clear(); TOUCH.stick = null; TOUCH.fire.clear(); AU.thrust(0); AU.saucer(null); setLabel($('soundBtn'), AU.muted ? 'SOUND OFF' : 'SOUND ON', 12); showScreen('pause'); setTimeout(() => $('resume').focus({preventScroll: true}), 50); }
    else showScreen(game.phase === 'draft' ? 'draft' : null);
    lastT = 0;
}
function toggleMute() { AU.ensure(); AU.setMuted(!AU.muted); prefs.muted = AU.muted; savePrefs(); setLabel($('soundBtn'), AU.muted ? 'SOUND OFF' : 'SOUND ON', 12); drawHudBtns(); }
function gameOver() {
    const s = game;
    const res = C.settle(meta, s);
    const newBest = res.meta.newBest; delete res.meta.newBest;
    meta = res.meta; store.set('nd_meta', meta); try { localStorage.setItem('nd_best', String(meta.best)); } catch (e) { }
    savePrefs();
    setTimeout(() => {
        if (game !== s) return;
        mode = 'over';
        vt($('otitle'), 'RUN OVER', W < 640 ? 26 : 40);
        countUp($('oscore'), s.score, W < 640 ? 34 : 64);
        $('obest').innerHTML = newBest && s.score > 0 ? svgText('NEW BEST', W < 640 ? 12 : 16, 'gold') : svgText('BEST ' + meta.best, W < 640 ? 10 : 12, 'dim');
        const mins = Math.floor(s.t / 60), secs = Math.floor(s.t % 60);
        const rows = [['WAVE', s.wave], ['TIME', mins + ':' + String(secs).padStart(2, '0')], ['BEST COMBO', '×' + s.maxMult], ['ROCKS', s.kills], ['GRAZES', s.grazes], ['BOSSES', s.bossKilled]].filter(r => r[1] !== 0 && r[1] !== '×1');
        $('ostats').innerHTML = rows.map(([k, v]) => `<div class="row">${svgText(k, W < 640 ? 8 : 12, 'dim')}${svgText('' + v, W < 640 ? 12 : 18)}</div>`).join('');
        $('ostats').style.gridTemplateColumns = `repeat(${W < 640 ? (rows.length === 4 ? 2 : Math.min(3, rows.length)) : rows.length}, auto)`;
        $('ostats').setAttribute('aria-label', rows.map(r => r.join(' ')).join(', '));
        const build = s.draftsTaken.map(id => C.UP[id].name);
        $('obuild').innerHTML = build.length ? wrapText(C.HULLS[s.hull].name + ' · ' + [...new Set(build)].slice(0, 6).join(' · '), W < 640 ? 8 : 11, W < 640 ? 34 : 60, 'soft') : '';
        $('ounlock').innerHTML = res.fresh.map(h => `<div class="unl">${hullGlyph(h, 40)}${svgText(C.HULLS[h].name + ' UNLOCKED', W < 640 ? 11 : 14, 'gold')}</div>`).join('');
        setLabel($('again'), 'AGAIN', 18); setLabel($('tohulls'), 'HULLS', 12);
        showScreen('over');
        setTimeout(() => $('again').focus({preventScroll: true}), 60);
    }, 1900);
}
function countUp(el, v, size) {
    el.setAttribute('aria-label', '' + v);
    const t0 = performance.now(), dur = RM.matches ? 0 : 900;
    const step = now => { const f = dur ? clamp((now - t0) / dur, 0, 1) : 1; el.innerHTML = svgText('' + Math.round(v * easeOut(f)), size); if (f < 1 && mode === 'over') requestAnimationFrame(step); };
    requestAnimationFrame(step);
}
function toTitle() { mode = 'title'; paused = false; game = null; layout(); newDemo(); buildTitle(); showScreen('title'); bgKey = ''; setTimeout(() => $('launch').focus({preventScroll: true}), 30); }
function drawHudBtns() {
    $('pauseBtn').innerHTML = `<svg class="vt" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4L7 16M13 4L13 16"/></svg>`;
    $('muteBtn').innerHTML = `<svg class="vt" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8L6 8L10 4L10 16L6 12L3 12Z${AU.muted ? 'M13 7L18 13M18 7L13 13' : 'M13 7Q16 10 13 13M15 5Q20 10 15 15'}"/></svg>`;
    $('muteBtn').setAttribute('aria-label', AU.muted ? 'Sound off' : 'Sound on');
}

$('launch').onclick = launch;
$('resume').onclick = () => setPaused(false);
$('soundBtn').onclick = toggleMute;
$('restart').onclick = () => { paused = false; startRun(); };
$('quit').onclick = toTitle;
$('again').onclick = startRun;
$('tohulls').onclick = toTitle;
$('pauseBtn').onclick = () => setPaused(true);
$('muteBtn').onclick = toggleMute;
setLabel($('resume'), 'RESUME', 16); setLabel($('restart'), 'RESTART RUN', 12); setLabel($('quit'), 'QUIT TO TITLE', 12); vt($('ptitle'), 'PAUSED', 28);

addEventListener('resize', () => { layout(); if (mode === 'title') buildTitle(); });
document.fonts && document.fonts.ready;
layout(); newDemo(); buildTitle(); drawHudBtns(); showScreen('title');
requestAnimationFrame(frame);
window.__ag = {get game() { return game; }, get mode() { return mode; }, C, start: startRun, pick: id => { const b = [...document.querySelectorAll('#cards .card')].find(x => x.getAttribute('aria-label').startsWith(C.UP[id].name)); if (b) b.click(); }};
</script>
