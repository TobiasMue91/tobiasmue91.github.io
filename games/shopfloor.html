<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopfloor — a factory that only gets one screen</title>
<meta name="description" content="A factory-building puzzle on a floor that never grows. Machines face the way you point them, belts jam when you mix lines, and every metre of routing is a metre you cannot put a machine in. Six orders, a build budget, and a layout that keeps turning out to be the wrong one.">
<meta name="theme-color" content="#141619">
<style>
:root{
  --ink:#e8e6e1; --dim:#9b9891; --faint:#67655f;
  --bg:#141619; --panel:#1c1f23; --panel2:#242830; --line:#31363e;
  --hi:#f0b429; --good:#5fb98b; --bad:#d9614c; --cool:#6fa8c4;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding-block:14px 40px;padding-left:12px;padding-right:12px}
h1{margin:0;font-size:21px;letter-spacing:.14em;font-weight:600;color:var(--hi)}
h2{margin:22px 0 6px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--hi);font-weight:600}
.sub{color:var(--dim);font-size:13px}
.tag{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:9px}
.btn:hover:not(:disabled){border-color:var(--hi)}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{border-color:var(--hi);color:var(--hi)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{border-color:var(--hi);color:var(--hi);background:var(--panel2)}

#board{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);touch-action:none;margin:8px 0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 9px;
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:84px;position:relative}
.tool.on{border-color:var(--hi);background:var(--panel2)}
.tool:disabled{opacity:.38}
.tool b{font-size:13px;font-weight:600;padding-right:30px}
.tool span{font-size:10.5px;color:var(--faint);white-space:nowrap}
.tool i{position:absolute;top:4px;right:6px;font-style:normal;font-size:9.5px;color:var(--faint);
  font-variant-numeric:tabular-nums}
.tool.on i{color:var(--hi)}
.big{font-variant-numeric:tabular-nums;font-size:20px;color:var(--hi)}
.meter{height:6px;background:#111316;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex:1;min-width:90px}
.meter i{display:block;height:100%;background:var(--good);transition:width .25s}
.order{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin:8px 0}
.req{display:flex;gap:9px;align-items:center;margin-top:5px}
.req .nm{min-width:8.5em;font-size:13px}
.req .ct{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:7.5em;text-align:right}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:5px}
.mono{font-family:var(--mono);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--panel2);
  border:1px solid var(--hi);color:var(--ink);padding:10px 16px;border-radius:10px;z-index:9;
  box-shadow:0 6px 24px #0008;max-width:92vw;text-align:center}
table.ref{border-collapse:collapse;font-size:13px;margin-top:4px}
table.ref td{padding:3px 12px 3px 0;color:var(--dim)}
table.ref td:first-child{color:var(--ink)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;background:var(--panel2);color:var(--dim)}
@media (max-width:600px){
  .tool{min-width:0;padding:5px 7px} .tool span,.tool i{display:none}
  h1{font-size:18px} .req .nm{min-width:6.5em}
}

<body>
<div class="wrap"><div id="app"></div></div>
<script src="../logo.js"></script>
<script>
/* ==================================================================== the floor
   A fixed grid. Column 0 is the ore wall, column W-1 is the dispatch bay, and
   everything in between is the only room you are ever going to get. */
const W=16, H=9;
const BUILD_X0=1, BUILD_X1=W-3;   // 2x2 machines must fit inside the working columns
const BELT_SPEED=2.4;             // cells per second
const SLOT=0.30;                  // minimum spacing between items along a lane
const FEED_TOTAL=12;              // ore/second for the whole wall, split between open ports
/* What one lane can actually carry, measured rather than derived: items must stay SLOT
   apart, and a little is lost handing off between cells. It is the other half of the feed
   rule — the wall offers 12, and no single belt can bring in more than this. */
const LANE_RATE=5.4;
const BUF=4;                      // how much of one input a machine will hold
const OUTBUF=2;                   // finished items a machine will hold before it stalls

const ITEMS={
  ore:   {name:'ore',    col:'#8a7f72'},
  ingot: {name:'ingot',  col:'#d99a4e'},
  plate: {name:'plate',  col:'#6fa8c4'},
  rod:   {name:'rod',    col:'#b6b2a6'},
  gear:  {name:'gear',   col:'#c8794f'},
  engine:{name:'engine', col:'#7fd0a0'},
};
/* Deliberately awkward cycle times. A press is slower than the roller feeding it and
   a bench slower again, so the ratios are something you work out rather than guess. */
const MACHINES={
  furnace:{name:'Furnace', into:{ore:1},        out:'ingot', time:1.0, cost:40, col:'#5a4536'},
  roller: {name:'Roller',  into:{ingot:1},      out:'plate', time:0.8, cost:45, col:'#36505a'},
  lathe:  {name:'Lathe',   into:{ingot:1},      out:'rod',   time:0.6, cost:45, col:'#4a4a44'},
  press:  {name:'Press',   into:{plate:2},      out:'gear',  time:1.2, cost:55, col:'#5a3a2e'},
  bench:  {name:'Bench',   into:{gear:1,rod:1}, out:'engine',time:2.0, cost:70, col:'#2f5040'},
};
const PARTS={
  belt: {name:'Belt',  cost:2,  blurb:'drag to lay'},
  cross:{name:'Cross', cost:10, blurb:'two lanes, no mixing'},
  split:{name:'Split', cost:14, blurb:'one in, three out'},
};
const DIRS={E:[1,0],W:[-1,0],N:[0,-1],S:[0,1]};
const OPP={E:'W',W:'E',N:'S',S:'N'};
const LEFT={E:'N',N:'W',W:'S',S:'E'};
const RIGHT={E:'S',S:'W',W:'N',N:'E'};
const TURN={E:'S',S:'W',W:'N',N:'E'};
</script>
<script>
/* ==================================================================== state */
function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const key=(x,y)=>y*W+x;
const inGrid=(x,y)=>x>=0&&y>=0&&x<W&&y<H;

function blankFloor(seed){
  const r=mulberry32(hashSeed(seed));
  const F={seed, grid:new Map(), machines:[], blocked:new Set(),
           ship:{}, t:0, orderIx:0, done:false, cash:180, spent:0,
           paused:true, speed:1, splits:[], dirty:true, undo:[]};
  // Pillars. Never in the first working column, so the feed wall is always reachable.
  const n=4+Math.floor(r()*5);
  let guard=0;
  while(F.blocked.size<n&&guard++<500){
    const x=2+Math.floor(r()*(W-4)), y=Math.floor(r()*H);
    F.blocked.add(key(x,y));
  }
  return F;
}

const cellAt=(F,x,y)=>inGrid(x,y)?F.grid.get(key(x,y)):undefined;
function machineAt(F,x,y){
  for(const m of F.machines) if(x>=m.x&&x<m.x+2&&y>=m.y&&y<m.y+2) return m;
  return null;
}
function occupied(F,x,y){
  if(!inGrid(x,y)) return true;
  return F.blocked.has(key(x,y))||!!F.grid.get(key(x,y))||!!machineAt(F,x,y);
}

/* --- machine geometry. A machine faces a direction. The two cells on its front edge
   are where finished work leaves; everything else is an input face. That single rule
   is what makes rotation matter and what makes a wrong layout visibly wrong. */
function frontCells(m){
  const d=DIRS[m.dir];
  if(d[0]===1)  return [[m.x+1,m.y],[m.x+1,m.y+1]];
  if(d[0]===-1) return [[m.x,m.y],[m.x,m.y+1]];
  if(d[1]===1)  return [[m.x,m.y+1],[m.x+1,m.y+1]];
  return [[m.x,m.y],[m.x+1,m.y]];
}
const isFrontCell=(m,x,y)=>frontCells(m).some(c=>c[0]===x&&c[1]===y);

/* --- building */
function canPlaceMachine(F,x,y){
  if(x<BUILD_X0||x>BUILD_X1||y<0||y>H-2) return false;
  for(let dx=0;dx<2;dx++)for(let dy=0;dy<2;dy++) if(occupied(F,x+dx,y+dy)) return false;
  return true;
}
function addMachine(F,x,y,type,dir){
  if(!canPlaceMachine(F,x,y)) return false;
  if(F.cash<MACHINES[type].cost) return false;
  F.cash-=MACHINES[type].cost; F.spent+=MACHINES[type].cost;
  F.machines.push({x,y,type,dir:dir||'E',in:{},out:[],prog:0,idle:0,made:0,run:0});
  F.dirty=true; return true;
}
function newCell(x,y,kind,dir){
  const c={x,y,kind,dir,lanes:{}};
  if(kind==='cross') for(const d in DIRS) c.lanes[d]=[];
  else { c.lanes[dir]=[]; if(kind==='split') c.rr=0; }
  return c;
}
function canBuildPart(F,x,y){
  return x>0&&x<W-1&&y>=0&&y<H&&!F.blocked.has(key(x,y))&&!machineAt(F,x,y);
}
function addPart(F,x,y,kind,dir){
  if(!canBuildPart(F,x,y)) return false;
  const old=F.grid.get(key(x,y));
  if(old){
    // Re-pointing or upgrading something already there costs only the difference.
    const diff=PARTS[kind].cost-PARTS[old.kind].cost;
    if(old.kind===kind&&(kind==='cross'||old.dir===dir)) return true;
    if(diff>0){ if(F.cash<diff) return false; F.cash-=diff; F.spent+=diff }
    else F.cash-=diff;
    if(old.kind===kind&&kind!=='cross'){                 // just a turn: keep the cargo
      const items=old.lanes[old.dir]; old.dir=dir; old.lanes={}; old.lanes[dir]=items;
      F.dirty=true; return true;
    }
    F.grid.set(key(x,y),newCell(x,y,kind,dir)); F.dirty=true; return true;
  }
  if(F.cash<PARTS[kind].cost) return false;
  F.cash-=PARTS[kind].cost; F.spent+=PARTS[kind].cost;
  F.grid.set(key(x,y),newCell(x,y,kind,dir)); F.dirty=true; return true;
}
function removeAt(F,x,y){
  const m=machineAt(F,x,y);
  if(m){ F.cash+=MACHINES[m.type].cost; F.machines.splice(F.machines.indexOf(m),1); F.dirty=true; return true }
  const c=F.grid.get(key(x,y));
  if(c){ F.cash+=PARTS[c.kind].cost; F.grid.delete(key(x,y)); F.dirty=true; return true }
  return false;
}
/* Full refunds on purpose: the budget is there to cap how much factory exists at once,
   not to punish you for finding out that your first idea was wrong. */

/* --- undo. Cells and machines are plain objects, so a round trip is enough. */
function snapshot(F){
  return JSON.stringify({g:[...F.grid],m:F.machines,cash:F.cash,spent:F.spent});
}
// Record a build step only if it actually changed the floor. An undo button that
// sometimes does nothing is worse than no undo button.
function pushUndo(F,before){
  const b=before===undefined?snapshot(F):before;
  if(before!==undefined&&b===snapshot(F)) return;
  F.undo.push(b); if(F.undo.length>60) F.undo.shift();
}
function popUndo(F){
  const s=F.undo.pop(); if(!s) return false;
  const o=JSON.parse(s);
  F.grid=new Map(o.g); F.machines=o.m; F.cash=o.cash; F.spent=o.spent; F.dirty=true;
  return true;
}
</script>
<script>
/* ==================================================================== the simulation

   Items occupy a position 0..1 along a lane and cannot overtake or overlap, so a full
   line stops the machine behind it. Nothing in here looks downstream on the player's
   behalf: if you put an ingot on a line that ends at a press, it sits at the press
   door for ever and the line behind it stops. That jam is the puzzle. */

function lanesOf(c){ return Object.keys(c.lanes) }
function headroom(arr){ return !arr.length||arr[arr.length-1].p>=SLOT }

/* Can this cell take an item arriving travelling in direction td? Returns the lane key. */
function laneFor(c,td){
  if(c.kind==='cross') return td;               // a cross only ever carries straight through
  if(td===OPP[c.dir]) return null;              // head-on into a belt is refused
  return c.dir;
}
function acceptInto(F,c,item,td){
  const k=laneFor(c,td); if(k===null||!c.lanes[k]) return false;
  if(!headroom(c.lanes[k])) return false;
  c.lanes[k].push({t:item,p:0}); return true;
}
function feedMachine(F,m,item){
  const spec=MACHINES[m.type];
  if(!spec.into[item]) return false;
  if((m.in[item]||0)>=BUF) return false;
  m.in[item]=(m.in[item]||0)+1; return true;
}
/* Hand an item from (x,y) to whatever is one step away in direction td. */
function deliver(F,x,y,item,td){
  const d=DIRS[td], nx=x+d[0], ny=y+d[1];
  if(nx>=W-1&&ny>=0&&ny<H){ F.ship[item]=(F.ship[item]||0)+1; return true }
  if(!inGrid(nx,ny)||nx<=0) return false;
  if(F.blocked.has(key(nx,ny))) return false;
  const m=machineAt(F,nx,ny);
  if(m) return isFrontCell(m,nx,ny)?false:feedMachine(F,m,item);
  const c=F.grid.get(key(nx,ny));
  if(c) return acceptInto(F,c,item,td);
  return false;
}
function exitDirs(c,laneKey){
  if(c.kind!=='split') return [laneKey];
  const o=[c.dir,LEFT[c.dir],RIGHT[c.dir]];
  return [o[c.rr%3],o[(c.rr+1)%3],o[(c.rr+2)%3]];   // round robin, so a split really balances
}
function stepTransport(F,dt){
  for(const c of F.grid.values()){
    for(const k of lanesOf(c)){
      const arr=c.lanes[k]; if(!arr.length) continue;
      for(let i=0;i<arr.length;i++){
        const it=arr[i];
        let limit=1.0;
        if(i>0) limit=Math.min(limit,arr[i-1].p-SLOT);
        it.p=Math.min(limit,it.p+BELT_SPEED*dt);
        if(i===0&&it.p>=1.0-1e-6){
          let gone=false;
          const outs=exitDirs(c,k);
          for(let e=0;e<outs.length;e++){
            if(deliver(F,c.x,c.y,it.t,outs[e])){
              if(c.kind==='split') c.rr=(c.rr+e+1)%3;   // start at the next one next time
              arr.shift(); i--; gone=true; break;
            }
          }
          if(!gone){ it.p=1.0; it.wait=(it.wait||0)+dt } else continue;
        } else if(i===0) it.wait=0;
      }
    }
  }
}
function stepMachines(F,dt){
  for(const m of F.machines){
    const spec=MACHINES[m.type];
    if(m.out.length){                                  // push finished work out the front
      const fronts=frontCells(m);
      for(let i=0;i<fronts.length&&m.out.length;i++){
        const f=fronts[(m.pushIx=(m.pushIx||0))%2]; m.pushIx++;
        if(deliver(F,f[0],f[1],m.out[0],m.dir)) m.out.shift();
      }
    }
    if(m.out.length>=OUTBUF){ m.idle+=dt; m.why='backed'; continue }
    if(m.prog<=0){
      const ready=Object.entries(spec.into).every(([k,n])=>(m.in[k]||0)>=n);
      if(!ready){ m.idle+=dt; m.why='starved'; continue }
      for(const [k,n] of Object.entries(spec.into)) m.in[k]-=n;
      m.prog=spec.time;
    }
    m.why=''; m.run+=dt; m.prog-=dt;
    if(m.prog<=0){ m.out.push(spec.out); m.prog=0; m.made++ }
  }
}
/* The wall delivers a fixed amount of ore however many ports you open, so a second
   port splits the supply rather than doubling it. Ports that lead nowhere still take
   their share — which is why a dead-end line is drawn in red. */
function stepFeed(F,dt){
  const ports=[];
  for(let y=0;y<H;y++){
    const c=cellAt(F,1,y);
    if(c&&c.kind!=='cross'&&c.dir!=='W'&&reachOf(F,c).live) ports.push(c);
  }
  F.ports=ports.length;
  if(!ports.length) return;
  const gap=ports.length/FEED_TOTAL;
  for(const b of ports){
    b.feedT=(b.feedT||0)+dt;
    while(b.feedT>gap){ b.feedT-=gap; if(!acceptInto(F,b,'ore',b.dir)){ b.feedT=0; break } }
  }
}
/* --- reachability, for diagnostics and for deciding which feed ports count.
   Rebuilt only when the layout changes. */
function rebuildReach(F){
  F.reach=new Map();
  for(const c of F.grid.values()){
    const seen=new Set(); let live=false, sinks=new Set();
    let front=[c];
    while(front.length){
      const cur=front.pop();
      if(seen.has(key(cur.x,cur.y))) continue;
      seen.add(key(cur.x,cur.y));
      for(const k of lanesOf(cur)) for(const td of (cur.kind==='split'?[cur.dir,LEFT[cur.dir],RIGHT[cur.dir]]:[k])){
        const d=DIRS[td], nx=cur.x+d[0], ny=cur.y+d[1];
        if(nx>=W-1&&ny>=0&&ny<H){ live=true; sinks.add('dispatch'); continue }
        if(!inGrid(nx,ny)||nx<=0||F.blocked.has(key(nx,ny))) continue;
        const m=machineAt(F,nx,ny);
        if(m){ if(!isFrontCell(m,nx,ny)){ live=true; sinks.add(m.type) } continue }
        const n=F.grid.get(key(nx,ny));
        if(n&&laneFor(n,td)!==null) front.push(n);
      }
    }
    F.reach.set(key(c.x,c.y),{live,sinks});
  }
  F.dirty=false;
}
function reachOf(F,c){
  if(F.dirty) rebuildReach(F);
  return F.reach.get(key(c.x,c.y))||{live:false,sinks:new Set()};
}
/* A line backing up behind a busy machine is normal and needs no warning. A jam is
   something else: an item sitting at a door that will never open for it, because nothing
   it can reach has a use for it. Flag only the cell where that is true — upstream cells
   are just queueing behind it, and lighting those up too would bury the actual fault. */
function couldEverTake(F,x,y,item,td){
  const d=DIRS[td], nx=x+d[0], ny=y+d[1];
  if(nx>=W-1&&ny>=0&&ny<H) return true;
  if(!inGrid(nx,ny)||nx<=0||F.blocked.has(key(nx,ny))) return false;
  const m=machineAt(F,nx,ny);
  if(m) return !isFrontCell(m,nx,ny)&&!!MACHINES[m.type].into[item];
  const c=F.grid.get(key(nx,ny));
  return !!(c&&laneFor(c,td)!==null);
}
function jammedLane(F,c,k){
  const it=c.lanes[k][0];
  if(!it||it.p<1-1e-6||(it.wait||0)<1.2) return false;
  return !exitDirs(c,k).some(td=>couldEverTake(F,c.x,c.y,it.t,td));
}
function isJammed(F,c){ return lanesOf(c).some(k=>jammedLane(F,c,k)) }

function step(F,dt){
  if(F.done||F.paused) return;
  if(F.dirty) rebuildReach(F);
  F.t+=dt; stepFeed(F,dt); stepMachines(F,dt); stepTransport(F,dt);
}
</script>
<script>
/* ==================================================================== the shift
   Orders ask for a bill of goods, not a single item. Once two lines have to run at
   once the floor stops being a corridor and starts being a plan. */
const ORDERS=[
  {reqs:{ingot:40}, unlock:['furnace'], pay:90,
   note:'Ore comes in on the left wall. Smelt it, walk it to the bay on the right.'},
  {reqs:{plate:70}, unlock:['roller'], pay:110,
   note:'A roller is faster than a furnace. One furnace will not keep it fed for long.'},
  {reqs:{gear:60}, unlock:['press'], pay:130,
   note:'Two plates per gear, and the press is slower than the roller. Do the arithmetic before you build.'},
  {reqs:{rod:60,plate:50}, unlock:['lathe'], pay:150,
   note:'Two different things at once, off one ore wall. The bay takes whatever reaches it.'},
  {reqs:{engine:30}, unlock:['bench'], pay:180,
   note:'A bench wants a gear and a rod together. Two chains, one floor, and neither may starve.'},
  {reqs:{engine:40,gear:40}, unlock:[], pay:200,
   note:'Engines and loose gears, from the same presses. The last floor you will build on.'},
];
function unlockedBy(ix){
  const set=new Set();
  for(let i=0;i<=Math.min(ix,ORDERS.length-1);i++) ORDERS[i].unlock.forEach(u=>set.add(u));
  return set;
}
function order(F){ return ORDERS[Math.min(F.orderIx,ORDERS.length-1)] }
function orderFilled(F){
  const o=order(F);
  return Object.entries(o.reqs).every(([k,n])=>(F.ship[k]||0)>=n);
}
function advance(F){
  if(F.done||!orderFilled(F)) return null;
  const o=order(F);
  F.cash+=o.pay; F.orderIx++; F.splits.push(F.t); F.ship={};
  if(F.orderIx>=ORDERS.length) F.done=true;
  return o;
}
function sampleRates(F){
  F._hist=F._hist||[];
  F._hist.push({t:F.t,s:Object.assign({},F.ship)});
  while(F._hist.length>2&&F.t-F._hist[0].t>8) F._hist.shift();
  const a=F._hist[0], dt=F.t-a.t;
  F._rate=F._rate||{};
  if(dt>1){ const r={}; for(const k in F.ship) r[k]=((F.ship[k]||0)-(a.s[k]||0))/dt; F._rate=r }
}
function resetRates(F){ F._hist=[]; F._rate={} }
</script>
<script>
/* ==================================================================== drawing */
let cv,ctx,CELL=34;
function fitCanvas(){
  const avail=Math.min(cv.parentElement.clientWidth,976);
  CELL=Math.max(20,Math.floor((avail-2)/W));
  const w=CELL*W,h=CELL*H,dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fam(){ return getComputedStyle(document.body).fontFamily }
function chev(cx,cy,td,s,col,lw){
  const d=DIRS[td];
  ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(cx-d[1]*s-d[0]*s*0.7, cy-d[0]*s-d[1]*s*0.7);
  ctx.lineTo(cx+d[0]*s*0.7, cy+d[1]*s*0.7);
  ctx.lineTo(cx+d[1]*s-d[0]*s*0.7, cy+d[0]*s-d[1]*s*0.7);
  ctx.stroke();
}
function draw(F,hover){
  const w=CELL*W,h=CELL*H;
  if(F.dirty) rebuildReach(F);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#1a1d21'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#20262c'; ctx.fillRect(0,0,CELL,h); ctx.fillRect(w-CELL,0,CELL,h);
  const wide=CELL>=30;
  for(const [cx,txt] of [[CELL/2,wide?'ORE  FEED':'ORE'],[w-CELL/2,wide?'DISPATCH':'OUT']]){
    ctx.save(); ctx.fillStyle='#6f7681'; ctx.font='600 '+(wide?10:9)+'px '+fam();
    ctx.translate(cx,h/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center';
    ctx.fillText(txt,0,3); ctx.restore();
  }
  ctx.strokeStyle='#23272d'; ctx.lineWidth=1;
  for(let x=1;x<W;x++){ctx.beginPath();ctx.moveTo(x*CELL+.5,0);ctx.lineTo(x*CELL+.5,h);ctx.stroke()}
  for(let y=1;y<H;y++){ctx.beginPath();ctx.moveTo(0,y*CELL+.5);ctx.lineTo(w,y*CELL+.5);ctx.stroke()}
  // pillars
  for(const k of F.blocked){ const x=k%W,y=(k-x)/W,px=x*CELL,py=y*CELL;
    ctx.fillStyle='#0d0f12'; rr(px+2,py+2,CELL-4,CELL-4,4); ctx.fill();
    ctx.save(); ctx.beginPath(); rr(px+2,py+2,CELL-4,CELL-4,4); ctx.clip();
    ctx.strokeStyle='#454b55'; ctx.lineWidth=2;
    for(let o=-CELL;o<CELL*2;o+=7){ctx.beginPath();ctx.moveTo(px+o,py);ctx.lineTo(px+o+CELL,py+CELL);ctx.stroke()}
    ctx.restore();
    ctx.strokeStyle='#555c66'; ctx.lineWidth=1; rr(px+2,py+2,CELL-4,CELL-4,4); ctx.stroke() }
  // transport
  for(const c of F.grid.values()){
    const px=c.x*CELL, py=c.y*CELL, cx=px+CELL/2, cy=py+CELL/2;
    const dead=!reachOf(F,c).live;
    const jam=isJammed(F,c);
    ctx.fillStyle=dead?'#2e2325':(jam?'#332a24':'#272c33');
    rr(px+2,py+2,CELL-4,CELL-4,3); ctx.fill();
    if(dead||jam){ ctx.strokeStyle=dead?'#6d3a33':'#7a5a2c'; ctx.lineWidth=1;
      rr(px+2.5,py+2.5,CELL-5,CELL-5,3); ctx.stroke() }
    const col=dead?'#8d4c42':(jam?'#b98a3e':'#59626f'), s=CELL*0.18;
    if(c.kind==='cross'){
      for(const td of ['E','S']){ const d=DIRS[td];
        ctx.strokeStyle='#454d58'; ctx.lineWidth=CELL*0.30; ctx.lineCap='butt';
        ctx.beginPath(); ctx.moveTo(cx-d[0]*CELL*0.5,cy-d[1]*CELL*0.5);
        ctx.lineTo(cx+d[0]*CELL*0.5,cy+d[1]*CELL*0.5); ctx.stroke(); }
      ctx.fillStyle='#272c33'; ctx.beginPath(); ctx.arc(cx,cy,CELL*0.13,0,7); ctx.fill();
    } else if(c.kind==='split'){
      ctx.fillStyle='#2f3946'; rr(px+3,py+3,CELL-6,CELL-6,CELL*0.3); ctx.fill();
      for(const td of [c.dir,LEFT[c.dir],RIGHT[c.dir]]){ const d=DIRS[td];
        chev(cx+d[0]*CELL*0.26,cy+d[1]*CELL*0.26,td,s*0.8,col,1.8) }
      chev(cx-DIRS[c.dir][0]*CELL*0.3,cy-DIRS[c.dir][1]*CELL*0.3,c.dir,s*0.8,'#3c4450',1.8);
    } else {
      for(const o of [-0.26,0.10]){ const d=DIRS[c.dir];
        chev(cx+d[0]*CELL*o,cy+d[1]*CELL*o,c.dir,s,col,2) }
    }
  }
  // machines
  for(const m of F.machines){
    const spec=MACHINES[m.type],px=m.x*CELL,py=m.y*CELL,S=CELL*2,d=DIRS[m.dir];
    ctx.fillStyle=spec.col; rr(px+2,py+2,S-4,S-4,6); ctx.fill();
    ctx.strokeStyle='#00000099'; ctx.lineWidth=1.5; ctx.stroke();
    const bh=Math.max(13,Math.round(CELL*0.40));
    ctx.fillStyle='#0e1013cc'; rr(px+3,py+S-3-bh,S-6,bh,3); ctx.fill();
    ctx.fillStyle='#d8d5cf'; ctx.font='600 '+Math.max(8,Math.round(bh*0.68))+'px '+fam();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(spec.name,px+S/2,py+S-3-bh/2+0.5); ctx.textBaseline='alphabetic';
    // the front face, drawn as a mouth so which way it points is never a guess
    ctx.save(); ctx.beginPath(); rr(px+2,py+2,S-4,S-4,6); ctx.clip();
    const fx=px+S/2+d[0]*(S/2-CELL*0.18), fy=py+S/2+d[1]*(S/2-CELL*0.18);
    ctx.fillStyle='#00000055';
    ctx.fillRect(fx-(d[0]?CELL*0.20:S/2),fy-(d[1]?CELL*0.20:S/2),
                 d[0]?CELL*0.40:S, d[1]?CELL*0.40:S);
    for(const off of [-0.26,0.26]){
      chev(fx-d[1]*S*off, fy-d[0]*S*off, m.dir, CELL*0.16, '#e8e6e199', 2);
    }
    ctx.restore();
    if(m.prog>0){ ctx.fillStyle='#f0b42977'; ctx.fillRect(px+5,py+5,(S-10)*(1-m.prog/spec.time),4) }
    // input buffers, as little pips down the side
    let pip=0;
    for(const k in MACHINES[m.type].into){ const n=m.in[k]||0;
      for(let i=0;i<n;i++){ ctx.fillStyle=ITEMS[k].col;
        ctx.beginPath(); ctx.arc(px+7+pip*6, py+9+i*5.5, 2.1,0,7); ctx.fill() }
      pip++; }
    if(m.why==='backed'){ ctx.fillStyle='#d9614c'; ctx.beginPath(); ctx.arc(px+S-10,py+10,3.4,0,7); ctx.fill() }
    else if(m.why==='starved'){ ctx.fillStyle='#f0b429'; ctx.beginPath(); ctx.arc(px+S-10,py+10,3.4,0,7); ctx.fill() }
  }
  // items
  for(const c of F.grid.values()){
    for(const k of lanesOf(c)){
      const d=DIRS[k];
      for(const it of c.lanes[k]){
        const cx=(c.x+0.5-d[0]*0.5+d[0]*it.p)*CELL, cy=(c.y+0.5-d[1]*0.5+d[1]*it.p)*CELL;
        ctx.fillStyle=ITEMS[it.t].col;
        ctx.beginPath(); ctx.arc(cx,cy,Math.max(2.4,CELL*0.125),0,7); ctx.fill();
      }
    }
  }
  // ghost
  if(hover&&hover.ok!==undefined){
    ctx.globalAlpha=.55; ctx.fillStyle=hover.ok?'#f0b429':'#d9614c';
    const S=hover.size*CELL;
    rr(hover.x*CELL+2,hover.y*CELL+2,S-4,S-4,hover.size===2?6:3); ctx.fill();
    ctx.globalAlpha=1;
    if(hover.dir){ const d=DIRS[hover.dir], cx=hover.x*CELL+S/2, cy=hover.y*CELL+S/2;
      chev(cx+d[0]*S*0.22,cy+d[1]*S*0.22,hover.dir,S*0.16,'#141619',2.5) }
  }
}
</script>
<script>
/* ==================================================================== the page */
const app=document.getElementById('app');
let F=null, tool='belt', dir='E', hover=null, raf=null, lastT=0, drag=null, acc=0;
const seedFromUrl=()=>{const m=location.search.match(/[?&]seed=([^&]+)/);return m?decodeURIComponent(m[1]):null};
const newSeed=()=>Math.random().toString(36).slice(2,7);
const fmt=t=>{const s=Math.floor(t);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[<>&"]/g,'');

function title(){
  stop();
  app.innerHTML=`
    <h1>SHOPFLOOR</h1>
    <div class="tag" style="margin-top:4px">a factory that only gets one screen</div>
    <p style="max-width:40em">Ore arrives on the left wall. Finished work has to reach the bay on
    the right. Between them is a floor that <em>never gets any bigger</em> — and the belts feeding
    your machines take up exactly as much room as the machines do.</p>
    <h2>The rules</h2>
    <p style="max-width:40em;color:var(--dim)"><b style="color:var(--ink)">Machines face one way.</b>
    Finished work leaves through the front — the face with the arrows on it. Every other side is an
    input. Point a machine at a wall and it will fill up and stop.</p>
    <p style="max-width:40em;color:var(--dim)"><b style="color:var(--ink)">Set two machines flush and
    they feed each other</b>, with no belt between them at all — a front face pressed against another
    machine's side hands work straight over. Push one up against the dispatch bay and it ships without
    a belt too. On a floor this size that is usually the difference between a layout that fits and one
    that nearly fits.</p>
    <p style="max-width:40em;color:var(--dim)"><b style="color:var(--ink)">Belts do not sort.</b>
    A machine takes only what its recipe asks for. Put the wrong thing on a line and it parks at the
    door and stops everything behind it. Keeping lines pure is most of the game.</p>
    <p style="max-width:40em;color:var(--dim)"><b style="color:var(--ink)">The wall gives 12 ore a
    second between all of them</b> — open a second port and it halves the first. But one belt only
    carries about five things a second, so it takes three ports to bring in everything the wall has,
    and past that you are just splitting the same ore more ways.</p>
    <p style="max-width:40em;color:var(--dim)">Everything costs budget, belts included, and filling an
    order pays. Clearing something refunds it in full — so the budget is not there to punish a bad
    guess, it is there to stop you owning more factory than the floor is worth. When the next order
    wants something else, the cheapest material you have is the factory you already built.</p>
    <h2>Reference</h2>
    <table class="ref" id="ref"></table>
    <p class="sub" style="margin-top:14px">Time only runs while the factory is running. Build for as
    long as you like — <kbd>space</kbd> starts and stops the clock, and the clock is your score.</p>
    <div class="row" style="margin-top:14px">
      <button class="btn go" id="start">Clock on</button>
      <span class="sub">floor <input id="seed" value="${esc(seedFromUrl()||newSeed())}"
        style="width:6em;background:var(--panel);border:1px solid var(--line);color:var(--dim);
        border-radius:6px;padding:5px 7px;font:inherit;font-size:13px"></span>
    </div>`;
  let rows='';
  for(const k in MACHINES){ const s=MACHINES[k];
    const into=Object.entries(s.into).map(([i,n])=>(n>1?n+'× ':'')+i).join(' + ');
    rows+=`<tr><td>${s.name}</td><td class="mono">${into} → ${s.out}</td>
      <td class="mono">${(1/s.time).toFixed(2)}/s</td><td class="mono">¤${s.cost}</td></tr>`; }
  for(const k in PARTS) rows+=`<tr><td>${PARTS[k].name}</td><td class="sub">${PARTS[k].blurb}</td>
      <td class="mono">${k==='belt'?'~'+LANE_RATE+'/s':''}</td><td class="mono">¤${PARTS[k].cost}</td></tr>`;
  document.getElementById('ref').innerHTML=rows;
  document.getElementById('start').onclick=()=>{
    F=blankFloor(document.getElementById('seed').value.trim()||newSeed());
    tool='belt'; dir='E'; play();
  };
}

function play(){
  app.innerHTML=`
    <div class="row" style="justify-content:space-between">
      <h1>SHOPFLOOR</h1>
      <div class="row">
        <span class="tag">budget</span><span class="big" id="cash">0</span>
        <span class="tag">shift</span><span class="big" id="clock">0:00</span>
      </div>
    </div>
    <div class="order" id="orderbox"></div>
    <canvas id="board"></canvas>
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div class="tools" id="tools"></div>
      <div class="row" style="gap:5px">
        <button class="btn sm" id="rot" title="R">Rotate ⟳</button>
        <button class="btn sm" id="undo" title="Ctrl+Z">Undo</button>
        <button class="btn sm go" id="run">Run</button>
        <button class="btn sm" id="spd">1×</button>
        <button class="btn sm" id="giveup">Restart</button>
      </div>
    </div>
    <div class="sub" id="hint" style="margin-top:9px;min-height:2.6em"></div>`;
  cv=document.getElementById('board'); ctx=cv.getContext('2d');
  fitCanvas(); window.addEventListener('resize',onResize);
  window.addEventListener('keydown',onKey);
  bindBoard(); renderTools(); renderOrder();
  document.getElementById('rot').onclick=()=>{dir=TURN[dir];rotateOrGhost();};
  document.getElementById('undo').onclick=()=>{popUndo(F);draw(F,hover)};
  document.getElementById('run').onclick=togglePause;
  document.getElementById('spd').onclick=cycleSpeed;
  document.getElementById('giveup').onclick=()=>{history.replaceState(null,'',location.pathname);title()};
  lastT=performance.now(); loop();
}
function onResize(){ if(cv){fitCanvas(); if(F) draw(F,hover)} }
function stop(){ if(raf)cancelAnimationFrame(raf); raf=null;
  window.removeEventListener('resize',onResize); window.removeEventListener('keydown',onKey) }

function togglePause(){
  if(F.done) return;
  F.paused=!F.paused; if(!F.paused) resetRates(F);
}
// derived every frame rather than set in the handler, so the button can never disagree
// with whether the clock is actually running
function syncControls(){
  const b=document.getElementById('run'); if(!b) return;
  const want=F.done?'Done':F.paused?'Run':'Hold';
  if(b.textContent!==want){ b.textContent=want; b.classList.toggle('go',F.paused&&!F.done) }
  b.disabled=F.done;
  const sp=document.getElementById('spd'); if(sp) sp.textContent=F.speed+'×';
}
function cycleSpeed(){ F.speed=F.speed===1?2:F.speed===2?4:1 }
function rotateOrGhost(){
  // if the pointer is over something of the tool's own kind, turn that instead of the ghost
  if(hover){
    const m=machineAt(F,hover.x,hover.y);
    if(m&&tool===m.type&&m.dir!==dir){ const b=snapshot(F); m.dir=dir; F.dirty=true; pushUndo(F,b) }
  }
  draw(F,hover);
}
function onKey(e){
  if(e.target.tagName==='INPUT') return;
  if(e.key===' '){ e.preventDefault(); togglePause(); return }
  if(e.key==='r'||e.key==='R'){ dir=TURN[dir]; rotateOrGhost(); return }
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); popUndo(F); draw(F,hover); return }
  const kinds=['belt','cross','split',...Object.keys(MACHINES)].filter(t=>PARTS[t]||unlockedBy(F.orderIx).has(t));
  const n=parseInt(e.key,10);
  if(n>=1&&n<=kinds.length){ tool=kinds[n-1]; renderTools(); }
  if(e.key==='x'||e.key==='X'){ tool='del'; renderTools() }
}

function renderTools(){
  const el=document.getElementById('tools'); if(!el) return;
  const have=unlockedBy(F.orderIx); let html='', n=0;
  for(const k in PARTS){ n++;
    html+=`<button class="tool ${tool===k?'on':''}" data-t="${k}"><i>¤${PARTS[k].cost}</i>
      <b>${PARTS[k].name}</b><span>${PARTS[k].blurb}</span></button>`; }
  for(const k in MACHINES){
    if(!have.has(k)) continue; n++;
    const s=MACHINES[k];
    const into=Object.entries(s.into).map(([i,q])=>(q>1?q+'× ':'')+i).join(' + ');
    html+=`<button class="tool ${tool===k?'on':''}" data-t="${k}" ${F.cash<s.cost?'disabled':''}>
      <i>¤${s.cost}</i><b>${s.name}</b><span>${into} → ${s.out}</span></button>`; }
  html+=`<button class="tool ${tool==='del'?'on':''}" data-t="del"><b>Clear</b><span>drag to strip, full refund</span></button>`;
  el.innerHTML=html; el.dataset.sig=toolSig();
  el.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.t;renderTools()});
}
// The toolbar greys out what you cannot afford, so it has to be rebuilt whenever that
// changes — otherwise a machine stays greyed out after the order that paid for it.
function toolSig(){
  return F.orderIx+'|'+tool+'|'+Object.keys(MACHINES).map(k=>F.cash>=MACHINES[k].cost?1:0).join('');
}
function syncTools(){
  const el=document.getElementById('tools');
  if(el&&el.dataset.sig!==toolSig()) renderTools();
}
/* What is coming is worth knowing while you still have the floor open. The whole premise
   is that the next order makes this layout wrong, and that is a better problem when you can
   see it arriving than when it ambushes you. */
function nextLine(F){
  const n=ORDERS[F.orderIx+1];
  if(!n) return 'Last order of the shift.';
  return 'Next up: '+Object.entries(n.reqs).map(([k,q])=>q+' '+k+'s').join(' + ')+'.';
}
function renderOrder(){
  const el=document.getElementById('orderbox'); if(!el) return;
  if(F.done){
    let prev=0,rows='';
    ORDERS.forEach((o,i)=>{ const at=F.splits[i]; if(at===undefined) return;
      rows+=`<div class="row" style="justify-content:space-between;max-width:24em">
        <span class="sub">${Object.entries(o.reqs).map(([k,n])=>n+' '+k+'s').join(' + ')}</span>
        <span class="sub mono">+${fmt(at-prev)}</span></div>`; prev=at; });
    el.innerHTML=`<b style="color:var(--good)">Every order filled.</b>
      <div class="big" style="margin:4px 0">${fmt(F.t)}</div>${rows}
      <div class="sub" style="margin-top:6px">¤${Math.round(F.spent)} of factory built · floor ${esc(F.seed)}</div>
      <div class="row" style="margin-top:10px">
        <button class="btn go" id="again">Another floor</button>
        <button class="btn" id="same">This floor again</button>
        <button class="btn" id="copy">Copy the link</button></div>`;
    const g=document.getElementById('again'); if(g&&!g._w){ g._w=1;
      g.onclick=()=>{history.replaceState(null,'',location.pathname);title()};
      document.getElementById('same').onclick=()=>{F=blankFloor(F.seed);tool='belt';renderTools()};
      document.getElementById('copy').onclick=e=>{
        const u=location.origin+location.pathname+'?seed='+encodeURIComponent(F.seed);
        navigator.clipboard&&navigator.clipboard.writeText(u); e.target.textContent='Copied'; };
    }
    return;
  }
  const o=order(F);
  let reqs='';
  for(const k in o.reqs){
    const got=F.ship[k]||0, r=(F._rate&&F._rate[k])||0;
    const need=o.reqs[k], left=Math.max(0,need-got);
    const eta=r>0.02&&left?' · '+fmt(left/r)+' left':'';
    reqs+=`<div class="req">
      <span class="nm"><span class="dot" style="background:${ITEMS[k].col}"></span>${k}s</span>
      <span class="meter"><i style="width:${Math.round(Math.min(1,got/need)*100)}%"></i></span>
      <span class="ct">${got}/${need} · ${r.toFixed(2)}/s${eta}</span></div>`;
  }
  el.innerHTML=`
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <div><span class="tag">order ${F.orderIx+1} of ${ORDERS.length}</span></div>
      <span class="sub">pays ¤${o.pay}${F.paused?' · <b style="color:var(--hi)">clock stopped</b>':''}</span>
    </div>${reqs}
    <div class="sub" style="margin-top:7px">${o.note}</div>
    <div class="sub" style="margin-top:5px;color:var(--faint)">${nextLine(F)}</div>`;
}
/* The status line names the one thing most worth fixing. A factory game that leaves you
   staring at a still machine with no idea why is not a puzzle, it is a guessing game. */
function renderHint(){
  const el=document.getElementById('hint'); if(!el) return;
  if(F.done){ el.textContent=''; return }
  let dead=0,jam=0,starved=[],backed=[],walled=[];
  for(const c of F.grid.values()){
    if(!reachOf(F,c).live) dead++;
    else if(isJammed(F,c)) jam++;
  }
  for(const m of F.machines){
    const fronts=frontCells(m);
    const canOut=fronts.some(f=>{const d=DIRS[m.dir],nx=f[0]+d[0],ny=f[1]+d[1];
      if(nx>=W-1) return true;
      const c=cellAt(F,nx,ny); if(c) return laneFor(c,m.dir)!==null;
      const mm=machineAt(F,nx,ny); return !!(mm&&!isFrontCell(mm,nx,ny)&&MACHINES[mm.type].into[MACHINES[m.type].out]);
    });
    if(!canOut) walled.push(m); else if(m.why==='backed') backed.push(m);
    else if(m.why==='starved') starved.push(m);
  }
  const nm=a=>a.map(m=>MACHINES[m.type].name.toLowerCase())
               .filter((v,i,s)=>s.indexOf(v)===i).join(' and ');
  let d=[];
  if(!F.grid.size&&!F.machines.length)
    d.push('Start at the ore wall: pick <b>Belt</b> and drag a line from column 1 towards the bay.');
  if(walled.length) d.push(`<b style="color:var(--bad)">${walled.length}</b> machine${walled.length>1?'s':''} facing nothing — the ${nm(walled)} has no belt in front of its arrows.`);
  if(dead) d.push(`<b style="color:var(--bad)">${dead}</b> belt${dead>1?'s':''} leading nowhere.`);
  if(jam) d.push(`<b style="color:var(--hi)">${jam}</b> jammed — something is sitting at a door that will not take it.`);
  if(backed.length) d.push(`<b style="color:var(--bad)">${backed.length}</b> backed up (${nm(backed)}): nowhere to put the work.`);
  if(starved.length) d.push(`<b style="color:var(--hi)">${starved.length}</b> waiting for parts (${nm(starved)}).`);
  if(!d.length&&F.paused&&(F.grid.size||F.machines.length)) d.push('Nothing obviously wrong. <kbd>space</kbd> to start the clock.');
  if(!d.length){
    const inflow=Math.min(FEED_TOTAL,(F.ports||0)*LANE_RATE);
    d.push(`Running clean — ${F.ports||0} feed port${F.ports===1?'':'s'} open, bringing in about `+
      `<b style="color:var(--hi)">${inflow.toFixed(1)}</b> of the wall's ${FEED_TOTAL} ore a second.`);
  }
  el.innerHTML=d.slice(0,3).join(' ');
}
function toast(msg){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3400);
}

/* ---- input ---- */
function cellFromEvent(e){
  const r=cv.getBoundingClientRect();
  return [Math.floor((e.clientX-r.left)/CELL),Math.floor((e.clientY-r.top)/CELL)];
}
function isPart(t){ return !!PARTS[t] }
function applyAt(x,y,td){
  if(tool==='del'){ removeAt(F,x,y); return }
  if(isPart(tool)){ if(!addPart(F,x,y,tool,td||dir)) flash(x,y); return }
  if(!addMachine(F,x,y,tool,dir)) flash(x,y);
  renderTools();
}
let flashT=0;
function flash(x,y){
  if(F.cash<(PARTS[tool]?PARTS[tool].cost:MACHINES[tool].cost)&&performance.now()-flashT>1200){
    flashT=performance.now(); toast('Not enough budget. Clear something, or fill the order.');
  }
}
function bindBoard(){
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId);
    const [x,y]=cellFromEvent(e);
    const before=snapshot(F);                 // committed on release, and only if it changed
    const del=e.button===2||e.shiftKey;
    if(del||tool==='del'){ drag={mode:'del',last:[x,y],before}; removeAt(F,x,y) }
    else if(isPart(tool)) drag={mode:'part',path:[[x,y]],before};
    else { applyAt(x,y); drag={mode:'once',before} }
    draw(F,hover);
  });
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointermove',e=>{
    const [x,y]=cellFromEvent(e);
    if(drag&&drag.mode==='del'){
      if(drag.last[0]!==x||drag.last[1]!==y){ removeAt(F,x,y); drag.last=[x,y] }
      hover=hoverFor(x,y); draw(F,hover); return;
    }
    if(drag&&drag.mode==='part'){
      const last=drag.path[drag.path.length-1];
      if(last[0]!==x||last[1]!==y){
        if(Math.abs(x-last[0])+Math.abs(y-last[1])===1){
          const dx=x-last[0],dy=y-last[1];
          const td=dx===1?'E':dx===-1?'W':dy===1?'S':'N';
          // Everything you drag through becomes a belt pointing the way you dragged; the
          // piece you actually picked only lands on the square you started from.
          if(drag.path.length===1) applyAt(last[0],last[1],td);
          else addPart(F,last[0],last[1],'belt',td);
          drag.path.push([x,y]); drag.td=td;
        } else drag.path=[[x,y]];
      }
      hover=hoverFor(x,y); draw(F,hover); return;
    }
    hover=hoverFor(x,y); draw(F,hover);
  });
  const up=()=>{
    if(drag&&drag.mode==='part'){
      if(drag.path.length===1) applyAt(drag.path[0][0],drag.path[0][1],dir);
      else { const [x,y]=drag.path[drag.path.length-1];
             if(!cellAt(F,x,y)) addPart(F,x,y,'belt',drag.td) }
      renderTools();
    }
    if(drag) pushUndo(F,drag.before);
    drag=null; draw(F,hover);
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{hover=null;if(F)draw(F,hover)});
}
function hoverFor(x,y){
  if(!inGrid(x,y)) return null;
  if(tool==='del') return {x,y,size:1,ok:!!(cellAt(F,x,y)||machineAt(F,x,y))};
  if(isPart(tool)){
    const old=cellAt(F,x,y);                       // replacing something only costs the difference
    const price=PARTS[tool].cost-(old?PARTS[old.kind].cost:0);
    return {x,y,size:1,dir:tool==='cross'?null:dir,ok:canBuildPart(F,x,y)&&F.cash>=price};
  }
  return {x,y,size:2,dir,ok:canPlaceMachine(F,x,y)&&F.cash>=MACHINES[tool].cost};
}

/* ---- loop ---- */
function loop(){
  raf=requestAnimationFrame(loop);
  const now=performance.now();
  const real=Math.min(0.1,(now-lastT)/1000); lastT=now;
  if(!F.done&&!F.paused){
    acc+=real*F.speed;
    while(acc>0){ const dt=Math.min(1/60,acc); acc-=dt; step(F,dt) }   // fixed steps, so 4x is not 4x sloppier
    sampleRates(F);
    const fin=advance(F);
    if(fin){
      resetRates(F); renderTools();
      if(F.done){ toast('Every order filled — '+fmt(F.t)+' on the clock.'); }
      else toast('Order filled, ¤'+fin.pay+' banked. Next: '+
        Object.entries(order(F).reqs).map(([k,n])=>n+' '+k+'s').join(' + ')+'.');
    }
  } else acc=0;
  const c=document.getElementById('clock'); if(c) c.textContent=fmt(F.t);
  const $=document.getElementById('cash'); if($) $.textContent='¤'+Math.round(F.cash);
  renderOrder(); renderHint(); syncTools(); syncControls(); draw(F,hover);
}

window.__sf={get F(){return F},set F(v){F=v},blankFloor,addPart,addMachine,removeAt,step,order,
  ORDERS,advance,orderFilled,MACHINES,PARTS,ITEMS,W,H,cellAt,machineAt,canPlaceMachine,
  frontCells,isFrontCell,DIRS,key,rebuildReach,reachOf,unlockedBy,isJammed,FEED_TOTAL,LANE_RATE,
  boot:s=>{F=blankFloor(s);play()}};
title();
</script>
