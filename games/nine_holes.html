<script>
"use strict";
/* ============================================================================
   Nine Holes — procedural minigolf.

   The generator proposes holes and a judge rejects most of them. A hole is only
   played if (a) a hole-in-one exists at all, (b) aiming straight at the cup does
   not ace it across more than two power settings, and (c) no more than four
   distinct aiming lines ace it. Roughly half of candidates survive; the median
   hole is accepted on the second try.

   The cup's capture speed is the constant that makes that filter work. A
   forgiving cup swallows anything, so on an open hole every power drops and the
   judge throws it out as a barn door — which quietly bans open holes and leaves
   a game of nothing but blind doglegs. Measured over 2,400 candidates: at
   capture 9 only 3% of accepted holes let you see the cup; at capture 4 it is
   31%, matching the share the generator actually produces, and barn-door
   rejections fall from 27% to 4%.
   ========================================================================== */

/* ---------- constants (cells and cells/second) ---------- */
const FAIR=0, WALL=1, SAND=2, WATER=3;
const SLOPE_N=4, SLOPE_E=5, SLOPE_S=6, SLOPE_W=7;
const SLOPE_VEC={4:[0,-1],5:[1,0],6:[0,1],7:[-1,0]};
const SLOPE_ACC   = 15.0;   // must exceed FRICT_FAIR or a ball would rest on a slope
const BUMPER_R    = 0.62;
const BUMPER_REST = 1.10;   // bumpers give energy back, so they carry the ball
const BALL_R      = 0.36;
const FRICT_FAIR  = 9.0;
const FRICT_SAND  = 34.0;
const STOP_SPEED  = 0.35;
const CUP_R       = 0.42;
const CUP_CAPTURE = 4.0;    // verified: see header
const RESTITUTION = 0.72;
const MAX_POWER   = 32.0;
const DT          = 1/120;
const HOLES       = 9;

/* ---------- seeded rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ---------- course ---------- */
class Course{
  constructor(w,h,cells,tee,cup){this.w=w;this.h=h;this.cells=cells;this.tee=tee;this.cup=cup}
  at(cx,cy){ if(cx<0||cy<0||cx>=this.w||cy>=this.h) return WALL; return this.cells[cy][cx]; }
  /* disc-vs-tile overlap */
  solid(x,y){
    const x0=Math.floor(x-BALL_R), x1=Math.floor(x+BALL_R);
    const y0=Math.floor(y-BALL_R), y1=Math.floor(y+BALL_R);
    for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
      if(this.at(cx,cy)===WALL){
        const nx=Math.max(cx,Math.min(x,cx+1)), ny=Math.max(cy,Math.min(y,cy+1));
        const dx=nx-x, dy=ny-y;
        if(dx*dx+dy*dy < BALL_R*BALL_R) return true;
      }
    }
    return false;
  }
  terrain(x,y){ const t=this.at(Math.floor(x),Math.floor(y)); return t===WALL?FAIR:t; }
  /* nearest overlapping bumper, or null */
  bumper(x,y){
    if(!this.bumps) return null;
    for(const b of this.bumps){
      const dx=x-b.x, dy=y-b.y, rr=BUMPER_R+BALL_R;
      if(dx*dx+dy*dy < rr*rr) return b;
    }
    return null;
  }
  blocksSight(x,y){
    if(this.solid(x,y)) return true;
    if(!this.bumps) return false;
    for(const b of this.bumps){
      const dx=x-b.x, dy=y-b.y;
      if(dx*dx+dy*dy < BUMPER_R*BUMPER_R) return true;
    }
    return false;
  }
  clearLine(a,b){
    const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*8)+1;
    for(let k=0;k<=n;k++){
      const x=a[0]+(b[0]-a[0])*k/n, y=a[1]+(b[1]-a[1])*k/n;
      if(this.blocksSight(x,y)) return false;
      if(this.terrain(x,y)===WATER) return false;
    }
    return true;
  }
}

/* ---------- the one integrator ----------
   Both the judge and the live game run this, so a hole the judge calls aceable
   plays exactly the way it was judged. Returns '' while rolling, or one of
   'stop' / 'water' / 'holed'. `ev` collects things worth a sound or a puff. */
function advance(b, c, ev){
  const terr=c.terrain(b.x,b.y);
  if(terr===WATER) return 'water';
  const slope=SLOPE_VEC[terr];
  if(slope){ b.vx+=slope[0]*SLOPE_ACC*DT; b.vy+=slope[1]*SLOPE_ACC*DT; }

  let sp=Math.hypot(b.vx,b.vy);
  if(sp>0){
    const f = terr===SAND?FRICT_SAND:FRICT_FAIR;
    if(terr===SAND && ev) ev.sand=true;
    const ns=Math.max(0,sp-f*DT);
    b.vx=b.vx/sp*ns; b.vy=b.vy/sp*ns; sp=ns;
  }
  if(sp<STOP_SPEED){
    /* a slope keeps the ball rolling unless it is wedged against something */
    if(!slope) return 'stop';
    if(c.solid(b.x+slope[0]*0.45, b.y+slope[1]*0.45)) return 'stop';
  }

  const nx=b.x+b.vx*DT;
  if(c.solid(nx,b.y)){ b.vx=-b.vx*RESTITUTION; if(ev) ev.bounce=Math.max(ev.bounce||0,Math.abs(b.vx)); }
  else b.x=nx;
  const ny=b.y+b.vy*DT;
  if(c.solid(b.x,ny)){ b.vy=-b.vy*RESTITUTION; if(ev) ev.bounce=Math.max(ev.bounce||0,Math.abs(b.vy)); }
  else b.y=ny;

  const bump=c.bumper(b.x,b.y);
  if(bump){
    let nxv=b.x-bump.x, nyv=b.y-bump.y;
    let d=Math.hypot(nxv,nyv) || 1e-6;
    nxv/=d; nyv/=d;
    const pen=(BUMPER_R+BALL_R)-d;
    b.x+=nxv*pen; b.y+=nyv*pen;                 // separate first, so it cannot stick
    const dot=b.vx*nxv+b.vy*nyv;
    if(dot<0){
      b.vx=(b.vx-2*dot*nxv)*BUMPER_REST;
      b.vy=(b.vy-2*dot*nyv)*BUMPER_REST;
      if(ev) ev.bump=true;
    }
  }

  const dx=b.x-c.cup[0], dy=b.y-c.cup[1];
  if(dx*dx+dy*dy<CUP_R*CUP_R){
    if(Math.hypot(b.vx,b.vy)<CUP_CAPTURE) return 'holed';
    if(ev) ev.lip=true;
  }
  return '';
}

/* ---------- headless simulation, used by the judge ---------- */
function simulate(c, px, py, ang, power){
  const b={x:px, y:py, vx:Math.cos(ang)*power, vy:Math.sin(ang)*power};
  for(let t=0; t<10; t+=DT){
    const r=advance(b,c,null);
    if(r==='holed') return {x:b.x,y:b.y,holed:true,water:false};
    if(r==='water') return {x:b.x,y:b.y,holed:false,water:true};
    if(r==='stop') break;
  }
  if(c.terrain(b.x,b.y)===WATER) return {x:b.x,y:b.y,holed:false,water:true};
  return {x:b.x,y:b.y,holed:false,water:false};
}

/* ---------- generator ---------- */
function carve(cells,w,h,x,y,rad){
  const r2=rad*rad;
  for(let cy=Math.floor(y-rad)-1;cy<=Math.floor(y+rad)+1;cy++)
    for(let cx=Math.floor(x-rad)-1;cx<=Math.floor(x+rad)+1;cx++){
      /* never carve the outermost ring: every hole keeps a rail all the way round */
      if(cx<1||cy<1||cx>=w-1||cy>=h-1) continue;
      const dx=cx+0.5-x, dy=cy+0.5-y;
      if(dx*dx+dy*dy<=r2) cells[cy][cx]=FAIR;
    }
}

/* shape: 0 straight, 1 gentle, 2 dogleg, 3 double dogleg
   `portrait` runs the hole bottom-to-top instead of left-to-right. */
function buildCourse(rnd, difficulty, portrait){
  const W = portrait?16:26, H = portrait?26:16;
  const cells=[]; for(let y=0;y<H;y++){ cells.push(new Array(W).fill(WALL)); }

  const weights = [[34,34,26,6],[24,32,32,12],[14,28,38,20]][difficulty];
  let roll=rnd()*100, shape=0, acc=0;
  for(let i=0;i<4;i++){ acc+=weights[i]; if(roll<acc){shape=i;break} shape=i; }
  const segs=[1,1,2,3][shape], bend=[0,.30,.85,1][shape];

  /* major axis = length of the hole, minor axis = how far it wanders */
  const major = portrait?H:W, minor = portrait?W:H;
  let a = 2.6;                               // along major
  let b = minor*0.3 + rnd()*minor*0.4;       // along minor
  const pts=[[a,b]];
  for(let i=0;i<segs;i++){
    const na = a + (major-5.0-a)/(segs-i) * (0.85+rnd()*0.30);
    let nb = b + (rnd()*2-1)*bend*minor*0.42;
    nb = Math.min(minor-3.0, Math.max(3.0, nb));
    pts.push([na,nb]); a=na; b=nb;
  }
  const toXY = p => portrait ? [p[1], H-p[0]] : [p[0], p[1]];
  const tee = toXY(pts[0]);
  const cup = toXY([Math.min(major-3.0, pts[pts.length-1][0]), pts[pts.length-1][1]]);

  for(let i=0;i<pts.length-1;i++){
    const A=toXY(pts[i]), B=toXY(pts[i+1]);
    const rad=(1.9-difficulty*0.24)+rnd()*1.05;   // corridors tighten as the round goes on
    const n=Math.ceil(Math.hypot(B[0]-A[0],B[1]-A[1])*4)+1;
    for(let k=0;k<=n;k++) carve(cells,W,H, A[0]+(B[0]-A[0])*k/n, A[1]+(B[1]-A[1])*k/n, rad);
  }
  carve(cells,W,H,cup[0],cup[1],2.2);            // always a fair apron round the cup

  let c_bumps=[];
  const fair=[];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(cells[y][x]===FAIR) fair.push([x,y]);
  if(!fair.length) return null;
  const far=(x,y,dt,dc)=> Math.hypot(x+0.5-tee[0],y+0.5-tee[1])>dt &&
                          Math.hypot(x+0.5-cup[0],y+0.5-cup[1])>dc;

  const nIsl = 1 + difficulty + Math.floor(rnd()*(2+difficulty));
  for(let i=0;i<nIsl;i++){
    const [x,y]=fair[Math.floor(rnd()*fair.length)];
    if(!far(x,y,3.5,2.8)) continue;
    const bw=1+Math.floor(rnd()*3), bh=1+Math.floor(rnd()*3);
    for(let dy=0;dy<bh;dy++) for(let dx=0;dx<bw;dx++){
      if(y+dy<H && x+dx<W && far(x+dx,y+dy,3.0,2.4)) cells[y+dy][x+dx]=WALL;
    }
  }
  /* slopes: a patch that pushes the ball sideways, so a straight corridor stops
     being a straight shot. Placed across the hole rather than along it. */
  c_bumps = [];
  const nSlope = difficulty===0 ? (rnd()<0.25?1:0) : (rnd()<0.80?1+Math.floor(rnd()*difficulty):0);
  for(let i=0;i<nSlope;i++){
    const [x,y]=fair[Math.floor(rnd()*fair.length)];
    if(!far(x,y,4.5,3.2)) continue;
    const dir=[SLOPE_N,SLOPE_E,SLOPE_S,SLOPE_W][Math.floor(rnd()*4)];
    const bw=2+Math.floor(rnd()*3), bh=2+Math.floor(rnd()*3);
    for(let dy=0;dy<bh;dy++) for(let dx=0;dx<bw;dx++){
      if(y+dy<H && x+dx<W && cells[y+dy][x+dx]===FAIR && far(x+dx,y+dy,4.0,2.8))
        cells[y+dy][x+dx]=dir;
    }
  }
  /* bumpers: round and lively, they give energy back and open up carom lines */
  const nBump = difficulty===0 ? (rnd()<0.3?1:0) : 1+Math.floor(rnd()*(difficulty+1.2));
  for(let i=0;i<nBump;i++){
    const [x,y]=fair[Math.floor(rnd()*fair.length)];
    if(!far(x,y,4.0,3.0)) continue;
    if(cells[y][x]!==FAIR) continue;
    c_bumps.push({x:x+0.5, y:y+0.5});
  }

  for(const [kind,maxN] of [[SAND,1+difficulty],[WATER,difficulty]]){
    const n=Math.floor(rnd()*(maxN+1));
    for(let i=0;i<n;i++){
      const [x,y]=fair[Math.floor(rnd()*fair.length)];
      if(!far(x,y,4.0,3.0)) continue;
      const bw=1+Math.floor(rnd()*4), bh=1+Math.floor(rnd()*3);
      for(let dy=0;dy<bh;dy++) for(let dx=0;dx<bw;dx++){
        if(y+dy<H && x+dx<W && cells[y+dy][x+dx]===FAIR && far(x+dx,y+dy,3.5,2.6))
          cells[y+dy][x+dx]=kind;
      }
    }
  }
  if(cells[Math.floor(tee[1])][Math.floor(tee[0])]!==FAIR) return null;
  if(cells[Math.floor(cup[1])][Math.floor(cup[0])]!==FAIR) return null;

  /* Obstacles and hazards can wall off little pockets of green the ball can never
     reach. They are not playable, they are noise — and a pocket a cell across also
     collects the whole of the edge shading and renders as a black blob. Flood from
     the tee and turn anything unreachable back into rail. If the cup itself is cut
     off, the hole is not a hole. */
  const seen=new Array(W*H).fill(false);
  const stack=[[Math.floor(tee[0]),Math.floor(tee[1])]];
  seen[stack[0][1]*W+stack[0][0]]=true;
  while(stack.length){
    const [px,py]=stack.pop();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=px+dx, ny=py+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      const k=ny*W+nx;
      if(seen[k] || cells[ny][nx]===WALL) continue;
      seen[k]=true; stack.push([nx,ny]);
    }
  }
  if(!seen[Math.floor(cup[1])*W+Math.floor(cup[0])]) return null;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++)
    if(cells[y][x]!==WALL && !seen[y*W+x]) cells[y][x]=WALL;
  const c=new Course(W,H,cells,tee,cup);
  c.shape=shape; c.bumps=c_bumps;
  /* a bumper sitting on the tee or in the cup would be unplayable */
  c.bumps=c.bumps.filter(b=>Math.hypot(b.x-tee[0],b.y-tee[1])>2.4 &&
                            Math.hypot(b.x-cup[0],b.y-cup[1])>2.0);
  return c;
}

/* ---------- the judge ---------- */
const JUDGE_ANGLES=128, JUDGE_POWERS=[8,11,14,17,20,23,26,29,32];
const MAX_ACE_LINES=4, MAX_STRAIGHT_WINDOW=2;

function teeSweep(c){
  const hits=[];
  for(let i=0;i<JUDGE_ANGLES;i++){
    const a=2*Math.PI*i/JUDGE_ANGLES;
    for(const p of JUDGE_POWERS) if(simulate(c,c.tee[0],c.tee[1],a,p).holed) hits.push(i);
  }
  return hits;
}
function straightWindow(c){
  const a=Math.atan2(c.cup[1]-c.tee[1], c.cup[0]-c.tee[0]);
  let n=0;
  for(let p=6;p<34;p++) if(simulate(c,c.tee[0],c.tee[1],a,p).holed) n++;
  return n;
}
function aceLines(hits){
  if(!hits.length) return 0;
  const a=[...new Set(hits)].sort((x,y)=>x-y);
  let g=1;
  for(let i=1;i<a.length;i++) if(a[i]-a[i-1]>2) g++;
  if(a.length>1 && (a[0]+JUDGE_ANGLES-a[a.length-1])<=2 && g>1) g--;
  return g;
}
/* The coarse sweep only proves an ace exists somewhere near an angle. Measured over
   234 accepted holes, 10% had a widest ace window under one degree — true in
   principle, impossible in practice, which would make the game's promise hollow.
   So refine around each cluster and demand a window a person can actually hit. */
const MIN_ACE_WINDOW_DEG = 1.25;
function aceWindowDeg(c, hits){
  const step=0.25*Math.PI/180, sorted=[...new Set(hits)].sort((a,b)=>a-b);
  const reps=[]; let run=[sorted[0]];
  for(let i=1;i<sorted.length;i++){
    if(sorted[i]-sorted[i-1]<=2) run.push(sorted[i]);
    else { reps.push(run[Math.floor(run.length/2)]); run=[sorted[i]] }
  }
  reps.push(run[Math.floor(run.length/2)]);
  let best=0;
  for(const idx of reps){
    const a0=2*Math.PI*idx/JUDGE_ANGLES;
    let cur=0;
    for(let a=a0-2*Math.PI/180; a<=a0+2*Math.PI/180; a+=step){
      let hit=false;
      for(const pw of JUDGE_POWERS) if(simulate(c,c.tee[0],c.tee[1],a,pw).holed){hit=true;break}
      if(hit){ cur+=0.25; if(cur>best) best=cur } else cur=0;
    }
  }
  return best;
}
function judge(c){
  const hits=teeSweep(c);
  if(!hits.length) return null;
  if(straightWindow(c)>MAX_STRAIGHT_WINDOW) return null;
  const lines=aceLines(hits);
  if(lines>MAX_ACE_LINES) return null;
  const win=aceWindowDeg(c,hits);
  if(win<MIN_ACE_WINDOW_DEG) return null;
  c.aceLines=lines; c.aceShots=hits.length; c.aceWindow=win;
  return c;
}
function makeHole(rnd, difficulty, portrait){
  for(let k=0;k<80;k++){
    const c=buildCourse(rnd,difficulty,portrait);
    if(!c) continue;
    if(judge(c)) return c;
  }
  /* Should not happen — acceptance is ~48% — but never hand back nothing. */
  for(let k=0;k<200;k++){
    const c=buildCourse(rnd,0,portrait);
    if(c && teeSweep(c).length){ c.aceLines=9; c.aceShots=1; return c; }
  }
  return null;
}
/* Par used to be a guess from the hole's shape. Since every hole is aceable by
   construction, the optimum is always 1, so par cannot come from the optimum —
   it has to come from how a reasonable player actually fares. This plays the
   hole several times with a player who sweeps for the shot that ends nearest
   the cup and then misses it, and takes the median. The error was picked by
   measurement, not taste: swept over 90 holes, 1.5 degrees gives 59% par 2 and
   32% par 3 with mean par rising 2.43 / 2.50 / 2.67 across the three difficulty
   tiers. Wider errors pile up par 4s and 5s, which is not minigolf; narrower
   ones make every hole a par 2 and difficulty stops showing at all. */
function parFor(c){
  const trials=[], SWEEP=48, POWS=[9,13,17,21,25,29];
  for(let t=0;t<5;t++){
    let x=c.tee[0], y=c.tee[1], strokes=0, rest=[x,y];
    while(strokes<9){
      let best=null;
      for(let i=0;i<SWEEP;i++){
        const a=2*Math.PI*i/SWEEP;
        for(const pw of POWS){
          const r=simulate(c,x,y,a,pw);
          if(r.water) continue;
          const d=r.holed?-1:Math.hypot(r.x-c.cup[0],r.y-c.cup[1]);
          if(!best||d<best.d) best={a,pw,d};
        }
      }
      if(!best) break;
      /* execution error: about 3 degrees of aim and a tenth of the weight.
         Deterministic per (trial, stroke) so a hole's par never changes. */
      const h=(t*7919+strokes*104729)%10007;
      const jitter=((h%1000)/1000-0.5)*1.5*Math.PI/180;
      const pwErr=1+((Math.floor(h/1000)%1000)/1000-0.5)*0.14;
      const r=simulate(c,x,y,best.a+jitter,best.pw*pwErr);
      strokes++;
      if(r.holed){ trials.push(strokes); break }
      if(r.water){ strokes++; x=rest[0]; y=rest[1] } else { x=r.x; y=r.y; rest=[x,y] }
      if(strokes>=9){ trials.push(9); break }
    }
    if(trials.length<=t) trials.push(9);
  }
  trials.sort((a,b)=>a-b);
  return Math.max(2, Math.min(4, trials[Math.floor(trials.length/2)]));
}

/* ============================ audio ============================ */
let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)() }catch(e){} } return actx }
function blip(freq,dur,type,gain,slideTo){
  const a=ac(); if(!a) return;
  if(a.state==='suspended') a.resume();
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,a.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(gain||0.16, a.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0008, a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function noise(dur,gain,filt){
  const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filt||1400;
  const g=a.createGain(); g.gain.value=gain||0.12;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const snd={
  putt:p=>blip(190+p*7,0.09,'triangle',0.10+p*0.004),
  bounce:v=>noise(0.05,Math.min(0.14,0.02+v*0.006),900+v*40),
  sand:()=>noise(0.16,0.07,700),
  water:()=>{blip(500,0.22,'sine',0.10,150); noise(0.22,0.07,500)},
  cup:()=>{blip(520,0.10,'sine',0.13); setTimeout(()=>blip(780,0.22,'sine',0.13),80)},
  ace:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.30,'triangle',0.14),i*95))},
  card:()=>blip(330,0.12,'sine',0.09,440)
};

const G={

function isPortrait(){ return stage.clientHeight > stage.clientWidth*1.08 }

/* Building a round is a second of work, so it happens behind a card rather than
   a frozen screen. The three tiers vary how much furniture a hole gets; the order
   you actually play them in comes from the measured par, so the round ramps because
   the holes were measured, not because a tier said they should. */
function newRound(seed){
  G.seed = seed;
  G.rnd = mulberry32(hashStr(seed));
  G.portrait = isPortrait();
  G.holes=[]; G.pars=[]; G.scores=[]; G.idx=0; G.course=null;
  try{ G.best = JSON.parse(localStorage.getItem('nineholes.best')||'null') }catch(e){ G.best=null }
  try{ history.replaceState(null,'', location.pathname+'?seed='+encodeURIComponent(seed)) }catch(e){}

  G.building=true;
  const panelEl = panel('<h2>Building the course</h2>'+
    '<p>Nine holes, each one checked for a hole-in-one before it is let through.</p>'+
    '<div id="bar" style="height:6px;background:#24331f;border-radius:99px;overflow:hidden">'+
    '<div id="fill" style="height:100%;width:0;background:var(--accent);transition:width .2s"></div></div>');
  const built=[];
  let i=0;
  const tick=()=>{
    if(i<HOLES){
      const diff = i<3?0 : i<6?1 : 2;
      const c = makeHole(G.rnd, diff, G.portrait);
      built.push({c, par:parFor(c)});
      i++;
      const f=panelEl.querySelector('#fill'); if(f) f.style.width=Math.round(100*i/HOLES)+'%';
      requestAnimationFrame(()=>setTimeout(tick,0));
      return;
    }
    built.sort((a,b)=>a.par-b.par);        // gentlest first, by measurement
    G.holes=built.map(b=>b.c); G.pars=built.map(b=>b.par);
    G.building=false; closePanel(); loadHole(0);
  };
  requestAnimationFrame(()=>setTimeout(tick,0));
}

function loadHole(i){

  G.rest=[G.ball.x,G.ball.y];
  G.strokes=0; G.moving=false; G.holed=false; G.trail=[]; G.parts=[]; G.kb=null; G.bgKey=null;

/* ---------- view transform ---------- */
function layout(){
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const w=stage.clientWidth, h=stage.clientHeight;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const c=G.course; if(!c) return;
  if(!c.bbox){                       /* playable extent, so the hole fills the screen */
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(let y=0;y<c.h;y++) for(let x=0;x<c.w;x++) if(c.cells[y][x]!==WALL){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
    c.bbox=[x0-1.15, y0-1.15, x1+2.15, y1+2.15];
  }
  const [bx0,by0,bx1,by1]=c.bbox;
  const bw=bx1-bx0, bh=by1-by0, pad=14;
  const s=Math.min((w-pad*2)/bw, (h-pad*2)/bh);
  G.view={ s, ox:(w-bw*s)/2 - bx0*s, oy:(h-bh*s)/2 - by0*s, w, h };
}
const vx = x => G.view.ox + x*G.view.s;
const vy = y => G.view.oy + y*G.view.s;
const ux = px => (px-G.view.ox)/G.view.s;
const uy = py => (py-G.view.oy)/G.view.s;

/* ---------- input ---------- */
function pointerPos(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return [t.clientX-r.left, t.clientY-r.top];
}
function down(e){
  if(G.moving||G.holed||document.querySelector('.panel')) return;
  const [px,py]=pointerPos(e);
  const bx=vx(G.ball.x), by=vy(G.ball.y);
  if(Math.hypot(px-bx,py-by) > Math.max(46, G.view.s*2.4)) return;
  G.aiming=true; G.kb=null; G.aimFrom=[bx,by]; G.aimTo=[px,py];
  ac(); e.preventDefault();
}
function move(e){
  if(!G.aiming) return;
  G.aimTo=pointerPos(e); e.preventDefault();
}
function up(e){
  if(!G.aiming) return;
  G.aiming=false;
  const dx=G.aimFrom[0]-G.aimTo[0], dy=G.aimFrom[1]-G.aimTo[1];
  const len=Math.hypot(dx,dy);
  if(len<10){ return; }
  const maxDrag=Math.min(170, Math.min(G.view.w,G.view.h)*0.42);
  const power=Math.min(1, len/maxDrag)*MAX_POWER;
  if(power<3) return;
  const ang=Math.atan2(dy,dx);
  G.ball.vx=Math.cos(ang)*power; G.ball.vy=Math.sin(ang)*power;
  G.moving=true; G.strokes++; G.rollT=0; G.trail=[];
  snd.putt(power/MAX_POWER*10);
  updateHUD(); hideTip(); e.preventDefault();
}
cv.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up,{passive:false});

/* Fine aim. The ace window is a couple of degrees wide, which a drag can just about
   hit and a keyboard can hit reliably; arrows also make the game playable one-handed. */
function kbStart(){
  if(G.kb) return;
  G.kb={ang: Math.atan2(G.course.cup[1]-G.ball.y, G.course.cup[0]-G.ball.x), pow:16};
}
window.addEventListener('keydown',e=>{
  if(G.moving||G.holed||document.querySelector('.panel')) return;
  const fine=e.shiftKey?0.1:0.6;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    kbStart(); G.kb.ang += (e.key==='ArrowLeft'?-1:1)*fine*Math.PI/180; e.preventDefault();
  } else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    kbStart(); G.kb.pow=Math.max(4,Math.min(MAX_POWER, G.kb.pow+(e.key==='ArrowUp'?1:-1)*(e.shiftKey?0.25:1)));
    e.preventDefault();
  } else if(e.key===' '||e.key==='Enter'){
    if(!G.kb) return;
    ac();
    G.ball.vx=Math.cos(G.kb.ang)*G.kb.pow; G.ball.vy=Math.sin(G.kb.ang)*G.kb.pow;
    G.moving=true; G.strokes++; G.rollT=0; G.trail=[]; snd.putt(G.kb.pow/MAX_POWER*10);
    G.kb=null; updateHUD(); hideTip(); e.preventDefault();
  } else if(e.key==='r'||e.key==='R'){ if(!G.holed) loadHole(G.idx); }
});

/* ---------- physics step (the live game runs the same integrator) ---------- */
function step(){
  const ev={};
  const r=advance(G.ball, G.course, ev);
  if(ev.bounce) onBounce(ev.bounce);
  if(ev.bump){ snd.bounce(6); G.shake=Math.min(6,3); for(let i=0;i<5;i++) puff(G.ball.x,G.ball.y,'#ffd75e') }
  if(ev.sand && Math.random()<0.10) puff(G.ball.x,G.ball.y,'#d9c489');
  if(r==='holed'){ sink(); return }
  if(r==='water'){ splash(); return }

}
function onBounce(v){ if(v>1.2){ snd.bounce(v); G.shake=Math.min(5,v*0.22) } }
function settle(){
  if(!G.moving) return;
  G.moving=false; G.rest=[G.ball.x,G.ball.y];
  if(G.course.terrain(G.ball.x,G.ball.y)===WATER) splash();
}
function splash(){
  snd.water();
  for(let i=0;i<14;i++) puff(G.ball.x,G.ball.y,'#7fc0ea');
  G.strokes++;                                  // penalty stroke
  G.ball.x=G.rest[0]; G.ball.y=G.rest[1]; G.ball.vx=0; G.ball.vy=0;

}
function sink(){
  G.holed=true; G.moving=false;
  const s=G.strokes;
  G.scores[G.idx]=s;
  if(s===1){ snd.ace(); for(let i=0;i<40;i++) puff(G.course.cup[0],G.course.cup[1],['#ffd75e','#7fe08a','#fff'][i%3],2.2) }

}

/* ---------- particles ---------- */
function puff(x,y,col,spd){
  G.parts.push({x,y,vx:(Math.random()*2-1)*(spd||1.2),vy:(Math.random()*2-1)*(spd||1.2),
                life:1,col});

/* ---------- region outlines ----------
   Terrain lives on a grid, but a grid-shaped bunker looks like a spreadsheet. Rather
   than smoothing a bitmap — which was tried, and gave soft mushy edges and a bake of
   nearly two seconds — the cell region is traced to a polygon and the polygon is
   smoothed. Edges come out crisp and curved, clipping is exact, and it costs almost
   nothing because no large buffers are involved.

   Tracing walks the boundary between filled and empty cells, emitting each edge with
   the filled side on its left. The loops that fall out are closed, and island holes
   come back wound the opposite way to the outer boundary, which is what Path2D wants
   for even-odd filling and what the outward offset below needs to get its sign right. */
function traceRegion(c, pred){
  const key=(x,y)=>x+','+y;
  const out=new Map();                       // start vertex -> list of end vertices
  const add=(ax,ay,bx,by)=>{
    const k=key(ax,ay);
    if(!out.has(k)) out.set(k,[]);
    out.get(k).push([bx,by]);
  };
  const on=(x,y)=> x>=0&&y>=0&&x<c.w&&y<c.h&&pred(c.cells[y][x]);
  for(let y=0;y<c.h;y++) for(let x=0;x<c.w;x++){
    if(!on(x,y)) continue;
    if(!on(x,y-1)) add(x,y,x+1,y);           // top,    walking right
    if(!on(x+1,y)) add(x+1,y,x+1,y+1);       // right,  walking down
    if(!on(x,y+1)) add(x+1,y+1,x,y+1);       // bottom, walking left
    if(!on(x-1,y)) add(x,y+1,x,y);           // left,   walking up
  }
  const loops=[];
  for(const [k,list] of out){
    while(list.length){
      const startPt=k.split(',').map(Number);
      let cur=list.pop();
      const loop=[startPt];
      let guard=0;
      while(guard++ < 40000){
        loop.push(cur);
        const nk=key(cur[0],cur[1]);
        const nxt=out.get(nk);
        if(!nxt || !nxt.length) break;
        cur = nxt.length===1 ? nxt.pop()
            : nxt.splice(nxt.length-1,1)[0];
        if(cur[0]===startPt[0] && cur[1]===startPt[1]) break;
      }
      if(loop.length>3) loops.push(loop);
    }
  }
  return loops;
}

/* Move every vertex out along the average of its two edge normals. The traced
   winding puts the filled side on the left, so "outward" is the left of travel. */
function offsetLoop(loop, d){
  const n=loop.length, out=[];
  for(let i=0;i<n;i++){
    const p=loop[i], a=loop[(i-1+n)%n], b=loop[(i+1)%n];
    let n1x=(p[1]-a[1]), n1y=-(p[0]-a[0]);
    let n2x=(b[1]-p[1]), n2y=-(b[0]-p[0]);
    const l1=Math.hypot(n1x,n1y)||1, l2=Math.hypot(n2x,n2y)||1;
    n1x/=l1; n1y/=l1; n2x/=l2; n2y/=l2;
    let nx=n1x+n2x, ny=n1y+n2y;
    const l=Math.hypot(nx,ny);
    if(l<1e-6){ out.push([p[0],p[1]]); continue }
    nx/=l; ny/=l;
    const miter=Math.min(2.2, 1/Math.max(0.35,(nx*n1x+ny*n1y)));
    out.push([p[0]+nx*d*miter, p[1]+ny*d*miter]);
  }
  return out;
}

/* Chaikin corner cutting: each pass replaces a corner with two points a quarter and
   three quarters along, which converges on a quadratic B-spline. Two passes is
   enough to lose the staircase without losing the shape. */
function chaikin(loop, passes){
  let pts=loop;
  for(let k=0;k<passes;k++){
    const n=pts.length, out=[];
    for(let i=0;i<n;i++){
      const p=pts[i], q=pts[(i+1)%n];
      out.push([p[0]*0.75+q[0]*0.25, p[1]*0.75+q[1]*0.25]);
      out.push([p[0]*0.25+q[0]*0.75, p[1]*0.25+q[1]*0.75]);
    }
    pts=out;
  }
  return pts;
}

/* ---------- rendering ----------
   The scene splits in two. Everything that cannot move — the surround and its
   planting, the table, felt, sand, water, slopes, rails and their occlusion — is
   baked once into an offscreen canvas whenever the hole or the viewport changes.
   Only the ball, its shadow and trail, the water surface, the flag and the particles
   are drawn per frame. That is what makes the detail affordable. */

function hex(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)] }
function mix(a,b,t){ const A=hex(a),B=hex(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')' }
function rnd2(x,y,k){ const n=Math.sin(x*127.1+y*311.7+(k||0)*74.7)*43758.5453; return n-Math.floor(n) }

let GRAIN=null;
function grain(){
  if(GRAIN) return GRAIN;
  const k=document.createElement('canvas'); k.width=k.height=64;
  const g=k.getContext('2d'), im=g.createImageData(64,64);
  for(let i=0;i<64*64;i++){
    im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]= Math.random()>0.5?255:0;
    im.data[i*4+3]= Math.random()<0.14 ? 14 : 0;
  }
  g.putImageData(im,0,0); GRAIN=k; return k;
}

let GRAIN_LINES=null, GRAIN_LINES_KEY=0;
function woodGrain(s){
  const period=Math.max(4, Math.round(s*0.68));
  if(GRAIN_LINES && GRAIN_LINES_KEY===period) return GRAIN_LINES;
  const k=document.createElement('canvas');
  k.width=Math.max(6,Math.round(s*3)); k.height=period;
  const g=k.getContext('2d');
  g.fillStyle='rgba(0,0,0,.13)'; g.fillRect(0,0,k.width,Math.max(1,period*0.10));
  g.fillStyle='rgba(255,222,182,.07)'; g.fillRect(0,period*0.5,k.width,Math.max(1,period*0.08));
  for(let i=0;i<14;i++){
    g.fillStyle='rgba(0,0,0,.05)';
    g.fillRect(Math.random()*k.width,Math.random()*period,Math.max(1,s*0.3),Math.max(1,period*0.05));
  }
  GRAIN_LINES=g.canvas.getContext?k:k; GRAIN_LINES_KEY=period;
  return k;
}
const WALL_LIFT = 0.28;   // in cells: how far the rail tops sit above their footprint
const RAIL_W    = 0.86;   // in cells: the rail's width outside the green

function buildStatic(){
  const c=G.course, v=G.view, s=v.s;
  const cv2=document.createElement('canvas');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv2.width=Math.round(v.w*dpr); cv2.height=Math.round(v.h*dpr);
  const g=cv2.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  const X=x=>v.ox+x*s, Y=y=>v.oy+y*s;
  const R=mulberry32(hashStr(G.seed+'#'+G.idx));

  /* cell region -> smoothed screen-space Path2D. `grow` pushes the outline outward
     before smoothing: corner cutting eats into convex corners, and for a hazard the
     painted region must never be smaller than the real one, or a ball could be
     penalised on a cell that did not look like a hazard. */
  const area=(loop)=>{
    let a=0;
    for(let i=0;i<loop.length;i++){
      const p1=loop[i], p2=loop[(i+1)%loop.length];
      a += p1[0]*p2[1]-p2[0]*p1[1];
    }
    return a/2;
  };
  const pathOf=(pred, grow, passes)=>{
    const loops=traceRegion(c,pred);
    if(!loops.length) return null;
    const p=new Path2D();
    /* The biggest loop is the region's outline; anything wound the other way is an
       island inside it. Offsetting outward shrinks an island rather than growing it,
       which left a ring of rail with a lawn-coloured hole punched through the middle
       of every obstacle wider than twice the rail. Islands are simply dropped here:
       even-odd against the play path then fills them solid, which is what a block of
       timber in the middle of a green should look like. */
    let outerSign=0, biggest=0;
    if(grow) for(const loop of loops){
      const a=area(loop);
      if(Math.abs(a)>biggest){ biggest=Math.abs(a); outerSign=Math.sign(a) }
    }
    for(let loop of loops){
      if(grow){
        if(Math.sign(area(loop))!==outerSign) continue;
        const before=area(loop), moved=offsetLoop(loop, grow), after=area(moved);
        if(Math.sign(after)!==Math.sign(before) || Math.abs(after)<Math.abs(before)*0.12) continue;
        loop=moved;
      }
      loop=chaikin(loop, passes==null?2:passes);
      p.moveTo(X(loop[0][0]), Y(loop[0][1]));
      for(let i=1;i<loop.length;i++) p.lineTo(X(loop[i][0]), Y(loop[i][1]));
      p.closePath();
    }
    return p;
  };
  const has=(t)=>{ for(let y=0;y<c.h;y++) for(let x=0;x<c.w;x++) if(c.cells[y][x]===t) return true; return false };

  /* ---- 1. the ground the course stands on ---- */
  const bg=g.createLinearGradient(0,0,v.w*0.4,v.h);
  bg.addColorStop(0,'#1b2a1c'); bg.addColorStop(0.55,'#16211a'); bg.addColorStop(1,'#101a14');
  g.fillStyle=bg; g.fillRect(0,0,v.w,v.h);

  const [bx0,by0,bx1,by1]=c.bbox;
  const rx=X(bx0), ry=Y(by0), rw=(bx1-bx0)*s, rh=(by1-by0)*s, rr=Math.min(22,s*1.1);
  const roundPath=(ctx2,x,y,w2,h2,r)=>{ ctx2.beginPath();
    if(ctx2.roundRect) ctx2.roundRect(x,y,w2,h2,r); else ctx2.rect(x,y,w2,h2) };

  const clear=(px,py,p2)=> px<rx-p2||px>rx+rw+p2||py<ry-p2||py>ry+rh+p2;
  const bush=(px,py,r0)=>{
    for(let i=0;i<5;i++){
      const a=i/5*6.283+R()*0.7, d=r0*0.55*(0.4+R()*0.8);
      const cx2=px+Math.cos(a)*d, cy2=py+Math.sin(a)*d, rr2=r0*(0.5+R()*0.45);
      g.beginPath(); g.arc(cx2,cy2+r0*0.14,rr2,0,7); g.fillStyle='rgba(0,0,0,.22)'; g.fill();
      g.beginPath(); g.arc(cx2,cy2,rr2,0,7); g.fillStyle=mix('#1d3b25','#2f5c35',R()*0.9); g.fill();
      g.beginPath(); g.arc(cx2-rr2*0.28,cy2-rr2*0.3,rr2*0.42,0,7);
      g.fillStyle='rgba(150,205,150,.10)'; g.fill();
    }
  };
  const stone=(px,py,r0)=>{
    g.beginPath();
    for(let i=0;i<7;i++){ const a=i/7*6.283, d=r0*(0.75+rnd2(px,py,i)*0.5);
      const fx=px+Math.cos(a)*d, fy=py+Math.sin(a)*d*0.8;
      i?g.lineTo(fx,fy):g.moveTo(fx,fy) }
    g.closePath();
    g.save(); g.translate(0,r0*0.2); g.fillStyle='rgba(0,0,0,.25)'; g.fill(); g.restore();
    g.fillStyle=mix('#3a423c','#5a6157',R()); g.fill();
  };
  const tuft=(px,py,r0)=>{
    g.strokeStyle='rgba(120,170,115,.30)'; g.lineWidth=Math.max(1,r0*0.16); g.lineCap='round';
    for(let i=0;i<4;i++){
      const a=-1.57+(R()-0.5)*1.5;
      g.beginPath(); g.moveTo(px,py);
      g.quadraticCurveTo(px+Math.cos(a)*r0*0.5, py+Math.sin(a)*r0*0.8,
                         px+Math.cos(a)*r0, py+Math.sin(a)*r0*1.25);
      g.stroke();
    }
  };
  const density=Math.round((v.w*v.h)/26000);
  for(let i=0;i<density;i++){
    const px=R()*v.w, py=R()*v.h;
    if(!clear(px,py,s*0.5)) continue;
    const roll=R();
    if(roll<0.46) bush(px,py,s*(0.5+R()*0.7));
    else if(roll<0.72) tuft(px,py,s*(0.35+R()*0.4));
    else if(roll<0.88) stone(px,py,s*(0.2+R()*0.3));
    else { g.beginPath(); g.arc(px,py,s*0.07,0,7); g.fillStyle='rgba(120,150,115,.14)'; g.fill() }
  }

  /* ---- 2. the table ---- */
  g.save();
  g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=s*1.5; g.shadowOffsetY=s*0.55;
  roundPath(g,rx,ry,rw,rh,rr); g.fillStyle='#20452a'; g.fill();
  g.restore();

  g.save();
  roundPath(g,rx,ry,rw,rh,rr); g.clip();

  const lawn=g.createLinearGradient(rx,ry,rx+rw*0.5,ry+rh);
  lawn.addColorStop(0,'#274f31'); lawn.addColorStop(1,'#1d3f26');
  g.fillStyle=lawn; g.fillRect(rx,ry,rw,rh);
  for(let i=0;i<Math.ceil(rh/(s*1.6));i++){
    if(i&1) continue;
    g.fillStyle='rgba(255,255,255,.020)'; g.fillRect(rx, ry+i*s*1.6, rw, s*1.6);
  }

  /* ---- 3. the green ---- */
  const playPath=pathOf(t=>t!==WALL, 0, 2);
  g.save();
  g.clip(playPath);

  const base=g.createLinearGradient(rx,ry,rx+rw*0.6,ry+rh);
  base.addColorStop(0,'#48a063'); base.addColorStop(1,'#3a8a4f');
  g.fillStyle=base; g.fillRect(rx-s,ry-s,rw+2*s,rh+2*s);

  const band=s*1.9;                       // mown stripes, continuous across the green
  if(G.portrait){
    for(let x=Math.floor((rx-s)/band)*band; x<rx+rw+s; x+=band*2){
      g.fillStyle='rgba(255,255,255,.055)'; g.fillRect(x,ry-s,band,rh+2*s);
    }
  } else {
    for(let y=Math.floor((ry-s)/band)*band; y<ry+rh+s; y+=band*2){
      g.fillStyle='rgba(255,255,255,.055)'; g.fillRect(rx-s,y,rw+2*s,band);
    }
  }

  /* slopes: one tilted plane per direction, shaded across the whole patch */
  for(const dir of [SLOPE_N,SLOPE_E,SLOPE_S,SLOPE_W]){
    if(!has(dir)) continue;
    const d=SLOPE_VEC[dir], sp=pathOf(t=>t===dir, 0.10, 2);
    if(!sp) continue;
    g.save(); g.clip(sp);
    /* almost the colour of the green: a ramp is still grass. The shading and the
       chevrons say which way it falls; a different hue made it look like a pane of
       glass lying on the course. */
    g.fillStyle='#3d9560'; g.fillRect(rx-s,ry-s,rw+2*s,rh+2*s);
    const lg=g.createLinearGradient(
      d[0]>0?rx:(d[0]<0?rx+rw:rx+rw/2), d[1]>0?ry:(d[1]<0?ry+rh:ry+rh/2),
      d[0]>0?rx+rw:(d[0]<0?rx:rx+rw/2), d[1]>0?ry+rh:(d[1]<0?ry:ry+rh/2));
    lg.addColorStop(0,'rgba(255,255,255,.24)');
    lg.addColorStop(0.5,'rgba(255,255,255,.01)');
    lg.addColorStop(1,'rgba(0,0,0,.30)');
    g.fillStyle=lg; g.fillRect(rx-s,ry-s,rw+2*s,rh+2*s);
    /* a shallow dish rather than a framed rectangle: soft and wide, so the ramp is
       unmistakable without looking like something laid on the grass */
    g.strokeStyle='rgba(0,0,0,.065)';
    for(let i=6;i>=1;i--){ g.lineWidth=i*0.13*s; g.stroke(sp) }
    g.restore();
  }

  /* sand: grown outward before smoothing, stippled, with a raked lip */
  const sandP = has(SAND) ? pathOf(t=>t===SAND, 0.14, 2) : null;
  if(sandP){
    g.save(); g.clip(sandP);
    const sg=g.createLinearGradient(rx,ry,rx,ry+rh);
    sg.addColorStop(0,'#e2ce97'); sg.addColorStop(1,'#c8b076');
    g.fillStyle=sg; g.fillRect(rx-s,ry-s,rw+2*s,rh+2*s);
    for(let i=0;i<3000;i++){
      const px=rx+rnd2(i,1,11)*rw, py=ry+rnd2(i,2,12)*rh;
      g.fillStyle=(i&1)?'rgba(255,255,255,.20)':'rgba(120,95,50,.18)';
      g.fillRect(px,py,Math.max(1,s*0.05),Math.max(1,s*0.05));
    }
    g.strokeStyle='rgba(92,70,34,.30)';
    for(let i=5;i>=1;i--){ g.lineWidth=i*0.11*s; g.stroke(sandP) }
    g.restore();
  }

  /* water: deep in the middle, a pale shelf at the edge */
  const waterP = has(WATER) ? pathOf(t=>t===WATER, 0.14, 2) : null;
  if(waterP){
    g.save(); g.clip(waterP);
    const wg=g.createLinearGradient(rx,ry,rx,ry+rh);
    wg.addColorStop(0,'#3079ab'); wg.addColorStop(1,'#1c4a76');
    g.fillStyle=wg; g.fillRect(rx-s,ry-s,rw+2*s,rh+2*s);
    g.strokeStyle='rgba(178,224,245,.13)';
    for(let i=5;i>=1;i--){ g.lineWidth=i*0.13*s; g.stroke(waterP) }
    g.restore();
    G._waterPath=waterP;
  } else G._waterPath=null;

  /* chevrons on the slopes */
  for(let y=0;y<c.h;y++) for(let x=0;x<c.w;x++){
    const d=SLOPE_VEC[c.cells[y][x]]; if(!d) continue;
    g.save(); g.translate(X(x)+s/2, Y(y)+s/2); g.rotate(Math.atan2(d[1],d[0]));
    g.lineWidth=Math.max(1.4,s*0.07); g.lineCap='round'; g.lineJoin='round';
    for(const off of [-s*0.18, s*0.08]){
      g.beginPath(); g.moveTo(off-s*0.09,-s*0.16); g.lineTo(off+s*0.09,0); g.lineTo(off-s*0.09,s*0.16);
      g.strokeStyle='rgba(0,0,0,.26)'; g.stroke();
      g.beginPath(); g.moveTo(off-s*0.09,-s*0.16-1); g.lineTo(off+s*0.09,-1); g.lineTo(off-s*0.09,s*0.16-1);
      g.strokeStyle='rgba(205,255,225,.46)'; g.stroke();
    }
    g.restore();
  }

  /* grain, and the green darkening where it meets the rail */
  g.save(); g.globalAlpha=0.5;
  g.fillStyle=g.createPattern(grain(),'repeat'); g.fillRect(0,0,v.w,v.h);
  g.restore();
  g.strokeStyle='rgba(0,0,0,.075)';
  for(let i=7;i>=1;i--){ g.lineWidth=i*0.14*s; g.stroke(playPath) }

  g.restore();   // end green clip

  /* ---- 4. planting on the rough inside the table ---- */
  for(let i=0;i<Math.round(density*1.2);i++){
    const px=rx+R()*rw, py=ry+R()*rh;
    const cx3=Math.floor((px-v.ox)/s), cy3=Math.floor((py-v.oy)/s);
    let near=false;
    for(let dy=-2;dy<=2 && !near;dy++) for(let dx=-2;dx<=2;dx++)
      if(c.at(cx3+dx,cy3+dy)!==WALL){ near=true; break }
    if(near) continue;
    const roll=R();
    if(roll<0.5) tuft(px,py,s*(0.3+R()*0.35));
    else if(roll<0.8) bush(px,py,s*(0.30+R()*0.34));
    else stone(px,py,s*(0.14+R()*0.16));
  }

  /* ---- 5. the rail ----
     A band lying strictly outside the green: the play outline, and the same outline
     pushed out by the rail's width, filled even-odd. It is drawn after the green so
     the raised top overhangs it slightly, which is what sells the height. */
  const lift=s*WALL_LIFT;
  /* The band is the play outline STROKED at twice the rail width and clipped to the
     region outside the green, not the outline offset outward. Offsetting a polygon
     by hand self-intersects wherever a concave inlet is narrower than twice the
     offset, and the inverted loop it leaves punches a hole clean through the rail —
     which is what was drawing a dark blob on about one hole in three. A stroke has
     no such failure mode. Islands are filled separately so an obstacle is solid.
     The clip is set inside the translate, so the raised top may overhang the green
     along the near edge — which is what sells the height — but not the far one. */
  const islands=new Path2D();
  {
    const loops=traceRegion(c,t=>t!==WALL);
    let outerSign=0, biggest=0;
    for(const lp of loops){ const a=area(lp); if(Math.abs(a)>biggest){ biggest=Math.abs(a); outerSign=Math.sign(a) } }
    for(const lp of loops){
      if(Math.sign(area(lp))===outerSign) continue;
      const sm=chaikin(lp,2);
      islands.moveTo(X(sm[0][0]),Y(sm[0][1]));
      for(let i=1;i<sm.length;i++) islands.lineTo(X(sm[i][0]),Y(sm[i][1]));
      islands.closePath();
    }
  }
  const outside=new Path2D();
  outside.rect(rx-s*2,ry-s*2,rw+s*4,rh+s*4);
  outside.addPath(playPath);
  const fillBand=(dy,style)=>{
    g.save();
    g.translate(0,dy);
    g.clip(outside,'evenodd');
    g.strokeStyle=style; g.fillStyle=style;
    g.lineWidth=RAIL_W*2*s; g.lineJoin='round'; g.lineCap='round';
    g.stroke(playPath);
    g.fill(islands);
    g.restore();
  };
  for(let i=Math.round(lift);i>=0;i--) fillBand(-i,'#3a2619');       // the extruded side
  const bev=Math.max(1,s*0.09);
  fillBand(-lift-bev,'rgba(214,168,120,.6)');                        // lit upper rim
  fillBand(-lift+bev,'rgba(22,13,7,.6)');                            // shaded lower rim
  const wood=g.createLinearGradient(0,ry-lift,0,ry+rh);
  wood.addColorStop(0,'#8a6242'); wood.addColorStop(0.5,'#6d4a30'); wood.addColorStop(1,'#54391f');
  fillBand(-lift,wood);
  /* Sawn grain, painted as the stroke's own pattern rather than through a mask.
     Masking it needed a full-viewport scratch canvas per hole, which cost 750ms; a
     pattern strokes in for nothing. */
  fillBand(-lift, g.createPattern(woodGrain(s),'repeat'));
  fillBand(-lift, g.createPattern(grain(),'repeat'));

  /* ---- 6. bumpers ---- */
  if(c.bumps) for(const bp of c.bumps){
    const bx2=X(bp.x), by2=Y(bp.y), r2=BUMPER_R*s;
    g.save();
    g.beginPath(); g.ellipse(bx2+s*0.07, by2+s*0.16, r2*1.02, r2*0.72, 0,0,7);
    g.fillStyle='rgba(0,0,0,.38)'; if('filter' in g) g.filter='blur(2px)'; g.fill(); g.restore();
    const rg=g.createRadialGradient(bx2-r2*0.35,by2-r2*0.42,r2*0.1, bx2,by2,r2);
    rg.addColorStop(0,'#fffdf6'); rg.addColorStop(0.55,'#e6dfcd'); rg.addColorStop(1,'#a89f8a');
    g.beginPath(); g.arc(bx2,by2,r2,0,7); g.fillStyle=rg; g.fill();
    const rg2=g.createRadialGradient(bx2-r2*0.25,by2-r2*0.3,r2*0.05, bx2,by2,r2*0.66);
    rg2.addColorStop(0,'#f4705c'); rg2.addColorStop(1,'#b8301f');
    g.beginPath(); g.arc(bx2,by2,r2*0.64,0,7); g.fillStyle=rg2; g.fill();
    g.beginPath(); g.ellipse(bx2-r2*0.22,by2-r2*0.3,r2*0.24,r2*0.16,-0.6,0,7);
    g.fillStyle='rgba(255,255,255,.7)'; g.fill();
  }

  /* ---- 7. the cup ---- */
  const cx=X(c.cup[0]), cy=Y(c.cup[1]), cr=CUP_R*s;
  const lipG=g.createRadialGradient(cx,cy,cr*0.6, cx,cy,cr*1.7);
  lipG.addColorStop(0,'rgba(0,0,0,.5)'); lipG.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=lipG; g.beginPath(); g.arc(cx,cy,cr*1.7,0,7); g.fill();
  g.beginPath(); g.arc(cx,cy,cr,0,7); g.fillStyle='#0a0f08'; g.fill();
  const inner=g.createLinearGradient(cx,cy-cr,cx,cy+cr);
  inner.addColorStop(0,'rgba(255,255,255,.16)'); inner.addColorStop(0.45,'rgba(255,255,255,0)');
  g.fillStyle=inner; g.beginPath(); g.arc(cx,cy,cr,0,7); g.fill();
  g.strokeStyle='rgba(230,245,225,.22)'; g.lineWidth=Math.max(1,s*0.05);
  g.beginPath(); g.arc(cx,cy,cr*0.97,Math.PI*0.9,Math.PI*2.1); g.stroke();

  /* ---- 8. key light ---- */
  const key=g.createLinearGradient(rx,ry,rx+rw*0.7,ry+rh);
  key.addColorStop(0,'rgba(255,240,190,.10)'); key.addColorStop(0.5,'rgba(255,255,255,0)');
  key.addColorStop(1,'rgba(0,10,20,.18)');
  g.fillStyle=key; g.fillRect(rx,ry,rw,rh);

  g.restore();   // end table clip

  /* baked, not per frame: a full-screen gradient fill every frame cost more than
     everything else in the loop put together */
  const vg=g.createRadialGradient(v.w*0.5,v.h*0.45,Math.min(v.w,v.h)*0.35,
                                  v.w*0.5,v.h*0.5,Math.max(v.w,v.h)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.45)');
  g.fillStyle=vg; g.fillRect(0,0,v.w,v.h);

  G.bg=cv2;
}

/* ---------- the ball's surface ----------
   A smooth white circle gives the eye nothing to hold on to, so a putt reads as a
   sliding dot rather than a rolling ball. These are dimples and a maker's mark on a
   sphere, rotated by how far the ball has actually rolled: the contact point drags
   the surface, so travelling d turns the ball d/r radians about the axis lying in
   the ground plane at right angles to the direction of travel. */
const BALL_PTS=(()=>{
  const pts=[], n=27, golden=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){
    const z=1-(2*i+1)/n, r=Math.sqrt(Math.max(0,1-z*z)), a=i*golden;
    pts.push({p:[Math.cos(a)*r, Math.sin(a)*r, z], mark: i===4||i===17});
  }
  return pts;
})();
function spinReset(){ G.spin=[1,0,0, 0,1,0, 0,0,1] }
function spinBy(dx,dy){
  const d=Math.hypot(dx,dy);
  if(d<1e-5) return;
  const th=d/BALL_R;                       // rolling without slipping
  const ax=-dy/d, ay=dx/d;                 // axis: left of the direction of travel
  const ct=Math.cos(th), st=Math.sin(th), ic=1-ct;
  /* Rodrigues, for an axis with no z component */
  const Rm=[ct+ax*ax*ic,  ax*ay*ic,     ay*st,
            ax*ay*ic,     ct+ay*ay*ic, -ax*st,
           -ay*st,        ax*st,        ct];
  const A=G.spin, out=new Array(9);
  for(let r=0;r<3;r++) for(let col=0;col<3;col++){
    out[r*3+col]=Rm[r*3]*A[col]+Rm[r*3+1]*A[3+col]+Rm[r*3+2]*A[6+col];
  }
  G.spin=out;
}

/* ================= per frame ================= */
function draw(){
  const c=G.course, v=G.view, s=v.s;
  const key=[G.idx,v.s,v.ox,v.oy,v.w,v.h].join(',');
  if(!G.bg || G.bgKey!==key){ buildStatic(); G.bgKey=key; }

  ctx.clearRect(0,0,v.w,v.h);
  ctx.save();
  if(G.shake>0.05){
    ctx.translate((Math.random()*2-1)*G.shake,(Math.random()*2-1)*G.shake);
    G.shake*=0.86;
  }
  ctx.drawImage(G.bg,0,0,v.w,v.h);

  const [bx0,by0,bx1,by1]=c.bbox;
  const rx=vx(bx0), ry=vy(by0), rw=(bx1-bx0)*s, rh=(by1-by0)*s, rr=Math.min(22,s*1.1);
  ctx.save();
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(rx,ry,rw,rh,rr); else ctx.rect(rx,ry,rw,rh);
  ctx.clip();

  /* water, alive: ripples clipped to the pond's own smoothed outline */
  const tm=performance.now()/1000;
  if(G._waterPath){
    ctx.save(); ctx.clip(G._waterPath);
    for(let k=0;k<9;k++){
      const ph=tm*0.75+k*1.7;
      ctx.fillStyle='rgba(228,246,255,'+(0.035+0.035*Math.sin(ph)).toFixed(3)+')';
      ctx.fillRect(vx(0)-s, vy(0)+k*s*0.62+Math.sin(ph)*s*0.09, c.w*s+2*s, s*0.11);
    }
    ctx.restore();
  }

  /* trail */
  if(G.trail.length>1){
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=Math.max(1.5,s*0.16);
    ctx.beginPath(); ctx.moveTo(vx(G.trail[0][0]),vy(G.trail[0][1]));
    for(const q of G.trail) ctx.lineTo(vx(q[0]),vy(q[1]));
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=Math.max(1,s*0.06);
    ctx.stroke();
  }

  /* the flag, breathing */
  const cx=vx(c.cup[0]), cy=vy(c.cup[1]);
  if(!G.holed){
    const ph=tm*1.7, poleH=s*2.1;
    ctx.save();
    ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=Math.max(1.4,s*0.07);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+s*0.5,cy+s*0.16); ctx.stroke();  // pole shadow
    const pg=ctx.createLinearGradient(cx-s*0.05,0,cx+s*0.05,0);
    pg.addColorStop(0,'#cfd4c8'); pg.addColorStop(0.5,'#ffffff'); pg.addColorStop(1,'#9aa294');
    ctx.strokeStyle=pg; ctx.lineWidth=Math.max(1.6,s*0.075);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy-poleH); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx,cy-poleH);
    ctx.quadraticCurveTo(cx+s*0.62, cy-poleH+s*0.10+Math.sin(ph)*s*0.10,
                         cx+s*1.02, cy-poleH+s*0.30+Math.sin(ph+0.9)*s*0.12);
    ctx.quadraticCurveTo(cx+s*0.5, cy-poleH+s*0.42+Math.sin(ph+0.5)*s*0.06, cx,cy-poleH+s*0.60);
    ctx.closePath();
    const fg=ctx.createLinearGradient(cx,0,cx+s,0);
    fg.addColorStop(0,'#f0604c'); fg.addColorStop(1,'#c8321f');
    ctx.fillStyle=fg; ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.moveTo(cx,cy-poleH); ctx.lineTo(cx+s*0.7,cy-poleH+s*0.16);
    ctx.lineTo(cx+s*0.1,cy-poleH+s*0.2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* aim overlays */
  const drawAim=(ang,t)=>{
    const bx=vx(G.ball.x), by=vy(G.ball.y);
    ctx.save();
    ctx.setLineDash([Math.max(3,s*0.2),Math.max(4,s*0.22)]);
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=Math.max(1.6,s*0.075); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,by);
    ctx.lineTo(bx+Math.cos(ang)*t*s*7, by+Math.sin(ang)*t*s*7); ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(bx,by,s*0.95,-Math.PI/2,-Math.PI/2+t*Math.PI*2);
    ctx.strokeStyle=t>0.92?'#e2513f':'#ffd75e'; ctx.lineWidth=Math.max(3,s*0.17);
    ctx.lineCap='round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(bx,by,s*0.95,0,7);
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=Math.max(2,s*0.17); ctx.stroke();
  };
  if(G.kb && !G.moving && !G.holed) drawAim(G.kb.ang, G.kb.pow/MAX_POWER);
  if(G.aiming){
    const dx=G.aimFrom[0]-G.aimTo[0], dy=G.aimFrom[1]-G.aimTo[1];
    const maxDrag=Math.min(170, Math.min(v.w,v.h)*0.42);
    drawAim(Math.atan2(dy,dx), Math.min(1,Math.hypot(dx,dy)/maxDrag));
  }

  /* the ball */
  if(!G.holed){
    const bx=vx(G.ball.x), by=vy(G.ball.y), r=BALL_R*s;
    const sh=ctx.createRadialGradient(bx+s*0.10,by+s*0.15,r*0.2, bx+s*0.10,by+s*0.15,r*1.5);
    sh.addColorStop(0,'rgba(0,0,0,.45)'); sh.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(bx+s*0.10,by+s*0.15,r*1.5,0,7); ctx.fill();
    const bgr=ctx.createRadialGradient(bx-r*0.38,by-r*0.44,r*0.08, bx,by,r*1.08);
    bgr.addColorStop(0,'#ffffff'); bgr.addColorStop(0.62,'#eef0e6'); bgr.addColorStop(1,'#b9bfae');
    ctx.beginPath(); ctx.arc(bx,by,r,0,7); ctx.fillStyle=bgr; ctx.fill();

    /* the surface, so the roll is visible */
    const M=G.spin||[1,0,0,0,1,0,0,0,1];
    ctx.save(); ctx.beginPath(); ctx.arc(bx,by,r*0.995,0,7); ctx.clip();
    for(const d of BALL_PTS){
      const p=d.p;
      const qx=M[0]*p[0]+M[1]*p[1]+M[2]*p[2];
      const qy=M[3]*p[0]+M[4]*p[1]+M[5]*p[2];
      const qz=M[6]*p[0]+M[7]*p[1]+M[8]*p[2];
      if(qz<-0.05) continue;                      // the far side of the ball
      const px=bx+qx*r*0.9, py=by+qy*r*0.9;
      const fore=Math.max(0,qz);                  // foreshortening near the rim
      const lit=0.55+0.45*(-qx*0.6-qy*0.6);       // same key light as the body
      if(d.mark){
        ctx.beginPath();
        ctx.ellipse(px,py,r*0.165*(0.35+0.65*fore),r*0.165,Math.atan2(qy,qx),0,7);
        ctx.fillStyle='rgba('+Math.round(198*lit)+','+Math.round(62*lit)+','+Math.round(50*lit)+','+(0.5+0.4*fore).toFixed(2)+')';
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.ellipse(px,py,r*0.115*(0.3+0.7*fore),r*0.115,Math.atan2(qy,qx),0,7);
        ctx.fillStyle='rgba(122,130,114,'+(0.13+0.17*fore).toFixed(2)+')';
        ctx.fill();
        /* a lit lower lip, so a dimple reads as a dent rather than a dot */
        ctx.beginPath();
        ctx.ellipse(px+r*0.03,py+r*0.035,r*0.09*(0.3+0.7*fore),r*0.09,Math.atan2(qy,qx),0,7);
        ctx.fillStyle='rgba(255,255,255,'+(0.10+0.12*fore).toFixed(2)+')';
        ctx.fill();
      }
    }
    ctx.restore();

    ctx.beginPath(); ctx.ellipse(bx-r*0.3,by-r*0.34,r*0.3,r*0.2,-0.6,0,7);
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fill();
    const rim=ctx.createRadialGradient(bx-r*0.3,by-r*0.35,r*0.3, bx,by,r);
    rim.addColorStop(0,'rgba(0,0,0,0)'); rim.addColorStop(1,'rgba(40,48,36,.32)');
    ctx.beginPath(); ctx.arc(bx,by,r,0,7); ctx.fillStyle=rim; ctx.fill();
  }

  /* particles */
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    const w2=s*0.17*Math.max(0.4,p.life);
    ctx.fillRect(vx(p.x)-w2/2, vy(p.y)-w2/2, w2, w2);
  }
  ctx.globalAlpha=1;
  ctx.restore();   /* end table clip */

  ctx.restore();
}

/* ---------- loop ---------- */
function frame(t){
  if(!G.tPrev) G.tPrev=t;
  let dt=Math.min(0.05,(t-G.tPrev)/1000); G.tPrev=t;
  if(G.course){
    if(G.moving){
      G.spinFrom=G.spinFrom||[G.ball.x,G.ball.y];
      G.acc+=dt;
      let guard=0;
      while(G.acc>=DT && G.moving && guard++<600){ step(); G.acc-=DT; }
      /* slopes can in principle keep a ball rolling for ever; call it at rest */
      G.rollT=(G.rollT||0)+dt;
      if(G.moving && G.rollT>14){ G.ball.vx=0; G.ball.vy=0; settle(); }
      spinBy(G.ball.x-G.spinFrom[0], G.ball.y-G.spinFrom[1]);
      G.spinFrom=[G.ball.x,G.ball.y];
      if(G.moving && G.trail.length<400 &&
         (!G.trail.length || Math.hypot(G.ball.x-G.trail[G.trail.length-1][0], G.ball.y-G.trail[G.trail.length-1][1])>0.25))
        G.trail.push([G.ball.x,G.ball.y]);
    } else { G.acc=0; G.spinFrom=null }
    for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; p.life-=dt*1.5 }
    G.parts=G.parts.filter(p=>p.life>0);
    draw();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- panels ---------- */
function panel(html){
  closePanel();
  const d=document.createElement('div'); d.className='panel';
  d.innerHTML='<div class="card">'+html+'</div>';
  stage.appendChild(d); return d;
}
function closePanel(){ const p=document.querySelector('.panel'); if(p) p.remove() }

function scoreName(s,par){
  const d=s-par;
  if(s===1) return 'Hole in one';
  if(d<=-2) return 'Eagle'; if(d===-1) return 'Birdie';
  if(d===0) return 'Par'; if(d===1) return 'Bogey';
  if(d===2) return 'Double bogey';
  return '+'+d;
}
function showHoleCard(){
  snd.card();
  const s=G.scores[G.idx], par=G.pars[G.idx];
  const p=panel(
    '<h2>'+scoreName(s,par)+'</h2>'+
    '<p>Hole '+(G.idx+1)+' &middot; <b>'+s+'</b> stroke'+(s===1?'':'s')+' against par '+par+'.</p>'+
    '<button id="next">Next hole</button>');
  p.querySelector('#next').onclick=()=>{ closePanel(); loadHole(G.idx+1) };
}
function showScorecard(){
  snd.card();
  let tot=0, par=0, rows='';
  for(let i=0;i<HOLES;i++){
    tot+=G.scores[i]; par+=G.pars[i];
    const d=G.scores[i]-G.pars[i];
    rows+='<td class="'+(d<0?'u':d>0?'o':'e')+'">'+G.scores[i]+'</td>';
  }
  let head=''; for(let i=0;i<HOLES;i++) head+='<th>'+(i+1)+'</th>';
  let pars=''; for(let i=0;i<HOLES;i++) pars+='<td class="n">'+G.pars[i]+'</td>';
  const d=tot-par;
  const line = d===0?'level par':(d>0?d+' over par':(-d)+' under par');
  let bestMsg='';
  const prev=G.best;
  if(prev==null || tot<prev){
    try{ localStorage.setItem('nineholes.best', String(tot)) }catch(e){}
    bestMsg = prev==null ? '' : '<p><b>New best round.</b> Your previous best was '+prev+'.</p>';
    G.best=tot;
  } else {
    bestMsg='<p>Your best round is '+prev+'.</p>';
  }
  const aces=G.scores.filter(s=>s===1).length;
  const p=panel(
    '<h2>'+tot+' strokes &middot; '+line+'</h2>'+
    '<table><tr><th>Hole</th>'+head+'<th>Tot</th></tr>'+
    '<tr><td class="n">Par</td>'+pars+'<td class="n">'+par+'</td></tr>'+
    '<tr><td class="n">You</td>'+rows+'<td><b>'+tot+'</b></td></tr></table>'+
    (aces?'<p><b>'+aces+' hole'+(aces>1?'s':'')+' in one.</b></p>':'')+
    bestMsg+
    '<p>Every hole in this round could be aced. Share the seed and see who does better.</p>'+
    '<div class="seedrow"><input id="sd" value="'+G.seed+'" readonly title="Click to copy"></div>'+
    '<p style="font-size:12px;margin:8px 0 12px">Click the seed to copy it.</p>'+
    '<button id="again">New round</button>'+
    '<button class="alt" id="same">Replay this round</button>');
  p.querySelector('#again').onclick=()=>{ closePanel(); newRound(randomSeed()) };
  p.querySelector('#same').onclick=()=>{ closePanel(); newRound(G.seed) };
  p.querySelector('#sd').onclick=e=>{ e.target.select(); try{document.execCommand('copy')}catch(_){} };
}
function showMenu(){
  const p=panel(
    '<h1>Nine Holes</h1>'+
    '<p>Drag back from the ball and let go, or aim with the arrow keys and hit with space — hold shift for fine aim. The cup only takes the ball if it arrives slowly: hit it hard and it rides the lip and stays out.</p>'+
    '<p>Every hole is checked before you see it: <b>a hole-in-one is always possible</b>, but never by simply pointing at the cup. Slopes push the ball, bumpers throw it back, sand kills it and water costs a stroke.</p>'+
    '<p>Par is measured by playing each hole rather than guessed, and the nine are ordered gentlest first.</p>'+
    '<div class="seedrow"><input id="sd" value="'+G.seed+'"></div>'+
    '<button id="go">Play this seed</button>'+
    '<button class="alt" id="rnd">Random round</button>');
  p.querySelector('#go').onclick=()=>{ const s=p.querySelector('#sd').value.trim()||randomSeed(); closePanel(); newRound(s) };
  p.querySelector('#rnd').onclick=()=>{ closePanel(); newRound(randomSeed()) };
}
function randomSeed(){
  const w=['ash','bay','clay','dune','elm','fern','gale','holt','iron','kiln','larch','moss','nettle','oak','pike','quarry','reed','slate','thorn','vale','wren','yarrow'];
  const r=Math.random;
  return w[Math.floor(r()*w.length)]+'-'+w[Math.floor(r()*w.length)]+'-'+(100+Math.floor(r()*900));
}

el('btnmenu').onclick=showMenu;
el('btnretry').onclick=()=>{ if(G.holed) return; closePanel(); loadHole(G.idx) };

window.addEventListener('resize',()=>{
  const wasPortrait=G.portrait;
  layout();
  if(!G.building && isPortrait()!==wasPortrait && G.idx===0 && G.strokes===0 && !G.holed) newRound(G.seed);
});

/* ---------- boot ---------- */
window.G=G;                       /* handy from the console, and for screenshot tests */
(function(){
  const q=new URLSearchParams(location.search);
  const seed=q.get('seed')||randomSeed();
  newRound(seed);
})();
</script>
