<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a050d">
<title>Death by AI</title>
<meta name="description" content="Seven deadly predicaments, one plan each. Write your way out and an AI narrator decides who lives, in a theatre that has never once been on your side.">
<style>
:root{
  --pit:#10060a; --velvet:#7d1426; --velvet2:#3a0813; --bone:#f4e9d0; --bone2:#e3d1a8; --ink:#1b0f10; --gold:#eab444; --lime:#fff3c6; --blood:#c0262f; --dim:#b79c80;
  --serif:"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
  --type:"American Typewriter","Courier Prime","Courier New",ui-monospace,monospace;
  --ry:120px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--pit);color:var(--bone);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;position:relative;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
textarea{user-select:text;-webkit-user-select:text}

/* the house */
.back{position:fixed;inset:0;background:radial-gradient(55% 45% at 50% 40%,rgba(255,226,150,.30),transparent 72%),linear-gradient(#2d0b14,#12070b 72%)}
.floor{position:fixed;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#41210f,#1a0c06);border-top:3px solid #6a3b22}
.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.35) 118px 120px)}
.hatch{position:absolute;left:50%;top:26%;width:clamp(140px,24vw,230px);height:34%;transform:translateX(-50%);z-index:1;perspective:420px}
.hatch .well{position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 30%,#2a0508,#050102);border:3px solid #0a0304;box-shadow:inset 0 0 18px #000}
.hatch .leaf{position:absolute;inset:0;transform-origin:50% 0;background:repeating-linear-gradient(-45deg,#e8b53a 0 9px,#1b0f10 9px 18px);border:3px solid #0a0304;transition:transform .55s cubic-bezier(.5,0,.2,1);box-shadow:0 6px 14px rgba(0,0,0,.6)}
.hatch .leaf:after{content:"";position:absolute;inset:7px;background:#3b1d10}
.open .hatch .leaf{transform:rotateX(-96deg)}
.foot{position:fixed;left:0;right:0;bottom:calc(30% - 7px);display:flex;justify-content:space-around;pointer-events:none;padding:0 12vw}
.foot i{width:clamp(18px,3vw,30px);height:10px;border-radius:14px 14px 0 0;background:var(--lime);box-shadow:0 -12px 30px 10px rgba(255,208,110,.5)}
.drape{position:fixed;top:0;bottom:0;width:clamp(18px,8vw,170px);z-index:1;pointer-events:none;background:repeating-linear-gradient(90deg,#2a050d 0 6px,#8c172b 6px 22px,#4a0a17 22px 34px)}
.drape.l{left:0;box-shadow:14px 0 34px rgba(0,0,0,.7);border-radius:0 0 40% 0/0 0 12% 0}
.drape.r{right:0;box-shadow:-14px 0 34px rgba(0,0,0,.7);border-radius:0 0 0 40%/0 0 12% 0}
.valance{position:fixed;top:0;left:0;right:0;height:30px;z-index:2;background:repeating-linear-gradient(90deg,#2a050d 0 8px,#962033 8px 30px,#4a0a17 30px 44px);box-shadow:0 8px 22px rgba(0,0,0,.65);border-bottom:3px solid var(--gold)}
.blood{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(75% 65% at 50% 50%,transparent 35%,rgba(150,10,22,.75));transition:opacity .35s}
.blood.on{opacity:1}

/* header */
.top{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 38px) clamp(34px,12vw,190px) 0;width:100%;max-width:880px;margin:0 auto;min-height:calc(env(safe-area-inset-top) + 92px)}
.clock{display:flex;align-items:baseline;gap:6px;color:var(--gold);transition:opacity .3s;min-width:78px}
.clock b{font-size:clamp(44px,11vw,60px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--lime);text-shadow:0 0 18px rgba(255,200,90,.7)}
.clock small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:700}
.clock.off{opacity:0}
.clock.hot b{color:#ff8a7a;text-shadow:0 0 18px rgba(255,60,50,.8);animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{transform:scale(1.12)}}
.tix{display:flex;gap:5px;align-items:center}
.tix i{width:clamp(24px,6vw,30px);height:clamp(34px,8vw,42px);border-radius:3px;display:grid;place-items:center;font:700 13px var(--serif);color:var(--dim);box-shadow:inset 0 0 0 1.5px rgba(183,156,128,.45);font-style:normal;transition:background-color .3s,box-shadow .3s,transform .3s}
.tix i.up{background:var(--gold);color:var(--ink);box-shadow:none}
.tix i.dead{background:var(--blood);color:var(--bone);box-shadow:none}
.tix i.now{color:var(--ink);background:var(--lime);box-shadow:0 0 0 2px var(--gold),0 0 18px var(--gold);transform:translateY(-3px)}
.mute{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;margin-right:-8px}
.mute svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* the playbill */
main{position:relative;z-index:3;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:52px clamp(26px,12vw,190px) 6px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.bill{width:100%;max-width:600px;margin:auto 0;display:flex;flex-direction:column;justify-content:center;flex:none;background:var(--bone);color:var(--ink);border-radius:999px 999px 6px 6px/var(--ry) var(--ry) 6px 6px;padding:calc(var(--ry) * .74 + 10px) clamp(20px,5vw,38px) 20px;text-align:center;position:relative;
  box-shadow:inset 0 0 0 5px var(--bone),inset 0 0 0 7px var(--ink),0 0 0 3px var(--gold),0 26px 56px rgba(0,0,0,.7);transition:opacity .22s,transform .5s cubic-bezier(.4,0,.6,1)}
.bill.swap #bc{opacity:0}
#bc{transition:opacity .18s;margin:auto 0;width:100%}
.bill:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.35),transparent 60%),radial-gradient(120% 90% at 50% 120%,rgba(120,70,30,.16),transparent 60%)}
.bulbs{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.bulbs b{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--lime) 38%,var(--gold) 88%);box-shadow:0 0 10px 3px rgba(255,205,100,.85);transition:background .25s,box-shadow .25s}
.bulbs b.out{background:radial-gradient(circle at 35% 30%,#4a3a34,#1b100e 80%);box-shadow:0 0 0 2px #6a4f3a,inset 0 1px 2px #000}
.bulbs.chase b{animation:chase 1.2s linear infinite}
.bulbs.fast b{animation-duration:.45s}
@keyframes flick{0%,100%{opacity:1}30%{opacity:.25}60%{opacity:.9}80%{opacity:.4}}
.bulbs.panic b:not(.out){animation:flick .22s steps(1) infinite}
@keyframes chase{0%,45%{opacity:1}55%,100%{opacity:.35}}
.pic{position:absolute;left:50%;top:calc(var(--ry) * -.36);transform:translateX(-50%);width:clamp(100px,25vw,126px);aspect-ratio:1;border-radius:50%;z-index:2;overflow:hidden;
  background:repeating-conic-gradient(from 0deg,#2a0a10 0 7deg,#5a1220 7deg 14deg);box-shadow:0 0 0 4px var(--gold),0 0 0 7px var(--ink),0 12px 24px rgba(0,0,0,.6)}
.pic:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.55))}
.pic svg{position:absolute;inset:12%;width:76%;height:76%;fill:var(--bone);stroke:var(--bone);stroke-linecap:round;stroke-linejoin:round;z-index:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}
.pic .eyes{fill:var(--ink);stroke:none}
.pic.pop svg{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.kick{display:block;font-size:13px;letter-spacing:.28em;color:#a31a24;margin-bottom:8px;font-weight:700;text-transform:uppercase}
.bill h2{font-size:clamp(25px,6.2vw,38px);line-height:1.02;letter-spacing:.015em;margin:0 0 4px;font-weight:800;text-transform:uppercase;text-wrap:balance}
.bill p{font-size:clamp(17px,4.2vw,20px);line-height:1.34;margin:10px 0 0;font-style:italic;text-wrap:pretty}
.bill p.said{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-style:normal;font-family:var(--type);font-size:clamp(15px,3.8vw,17px);color:#5a4036;margin-top:4px}
.bill p.nar{min-height:5.4em}
.lab{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#4a2e24;margin-top:14px;font-weight:700}
.worked{font-size:17px;font-style:italic;color:#33231c;margin-top:6px}
.props{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0 0}
.stub{font:700 13px/1.15 var(--serif);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--bone2);border:0;padding:0 16px 0 18px;min-height:44px;position:relative;transition:transform .15s,background-color .15s;
  filter:drop-shadow(0 2px 0 rgba(60,30,20,.45));
  -webkit-mask:radial-gradient(circle 6px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 6px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.stub:before{content:"+";font-size:15px;margin-right:6px;color:#a31a24}
.stub:hover{transform:translateY(-2px);background:#ecdcb4}.stub:active{transform:translateY(1px) scale(.97)}
.stub.used{opacity:.45}
.tip{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#4f362b;font-weight:700;margin-top:10px;min-height:1.2em}
.hint{color:#b79c80}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px;align-items:center}
.btn{min-height:50px;min-width:190px;padding:0 24px;border:0;border-radius:4px;font:800 14px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.main{background:var(--blood);color:var(--bone);box-shadow:0 4px 0 #6d1219}
.btn.main:active{box-shadow:0 1px 0 #6d1219}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #8c5f12}
.btn.gold:active{box-shadow:0 1px 0 #8c5f12}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.bill .btn:focus-visible,.dock .btn:focus-visible,.stub:focus-visible,.mute:focus-visible,textarea:focus-visible{outline:3px solid #2a7fff;outline-offset:3px}
.stats{margin-top:14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6b4a3d;font-weight:700}
.grid{display:flex;justify-content:center;gap:5px;margin-top:12px}
.grid i{width:24px;height:32px;border-radius:3px;box-shadow:inset 0 0 0 1.5px rgba(27,15,16,.35);display:grid;place-items:center;font:700 12px var(--serif);font-style:normal;color:#7a5a4b}
.grid i.up{background:var(--gold);color:var(--ink);box-shadow:none}.grid i.dead{background:var(--blood);color:var(--bone);box-shadow:none}
.stampslot{height:68px;display:flex;justify-content:center;align-items:center;margin:12px 0 6px}

.stamp{display:inline-block;transform:rotate(-6deg);padding:8px 16px 6px;font:800 clamp(26px,7vw,36px)/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;
  animation:stamp .38s cubic-bezier(.2,1.6,.4,1) both}
.stamp.live{background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px var(--ink) inset,0 6px 14px rgba(0,0,0,.4)}
.stamp.dead{color:var(--blood);box-shadow:0 0 0 4px var(--blood) inset;background:rgba(244,233,208,.9)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.6);opacity:0}}

/* the slip */
.dock{position:relative;z-index:4;padding:8px clamp(26px,12vw,190px) calc(env(safe-area-inset-bottom) + 14px);min-height:calc(env(safe-area-inset-bottom) + 114px)}
.slip{max-width:600px;margin:0 auto;display:flex;align-items:stretch;filter:drop-shadow(0 8px 14px rgba(0,0,0,.65));transition:opacity .25s}
.slip[hidden]{display:none}
.slip textarea{flex:1;min-width:0;resize:none;height:92px;background:var(--bone);color:var(--ink);border:0;border-radius:4px 0 0 4px;padding:10px 12px;font:18px/1.4 var(--type);outline:0;
  background-image:repeating-linear-gradient(transparent 0 24px,rgba(120,80,60,.3) 24px 25px);background-position:0 10px;user-select:text}
.slip textarea::placeholder{color:#7d6252}
.slip textarea:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.go{width:100px;border:0;border-radius:0 4px 4px 0;background:var(--blood);color:var(--bone);font:800 14px/1.1 var(--serif);letter-spacing:.14em;text-transform:uppercase;border-left:2px dashed rgba(255,255,255,.6);transition:filter .15s}
.go:active{filter:brightness(.85)}.go:disabled{cursor:default;font-size:22px;letter-spacing:.2em;animation:blink 1s steps(2) infinite}@keyframes blink{50%{background:#8f1b24}}
.after{max-width:600px;margin:0 auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.after[hidden]{display:none}
.after .btn{flex:1 1 40%;min-width:0;min-height:46px}.after .btn.main,.after .btn.gold{flex:1 1 100%}
.btn.line{background:rgba(244,233,208,.1);color:var(--bone);box-shadow:inset 0 0 0 2px var(--bone)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);transform:translate(-50%,10px);background:var(--ink);color:var(--bone);padding:10px 16px;border-radius:4px;font-size:14px;letter-spacing:.1em;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 0 0 2px var(--gold)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.petal{position:fixed;top:-20px;width:10px;height:14px;border-radius:50% 0 50% 50%;background:var(--blood);z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg) translateX(40px)}}
.shake{animation:shake .45s cubic-bezier(.3,.7,.4,1)}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(2px,-1px)}}
.figure{position:absolute;left:50%;top:6%;width:26%;transform:translateX(-50%);z-index:2;fill:var(--bone)}
.pic{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.pic.doom{transform:translateX(-50%) scale(1.12);transform-origin:50% 25%}
.trap{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#6a1626,#26060c 75%);perspective:200px}
.trap:before{content:"";position:absolute;left:0;right:0;top:56%;bottom:0;background:#47220f;border-top:2px solid #6d3b20}
.trap .hole{position:absolute;left:18%;width:64%;top:56%;height:34%;background:#000;box-shadow:inset 0 0 10px #000}
.trap .leaf{position:absolute;left:18%;width:64%;top:56%;height:34%;transform-origin:50% 0;background:repeating-linear-gradient(-45deg,#e8b53a 0 6px,#1b0f10 6px 12px);border:2px solid #0a0304;transition:transform .5s cubic-bezier(.5,0,.3,1) .1s}
.trap.go .leaf{transform:rotateX(-100deg)}
.trap .figure{position:absolute;left:33%;top:6%;width:34%;transform:none;fill:var(--bone)}
.trap.go .figure{animation:drop .8s cubic-bezier(.6,0,1,.7) .45s both}
@keyframes drop{0%{transform:translateY(0)}20%{transform:translateY(0) rotate(0)}100%{transform:translateY(190%) rotate(26deg)}}
.curtain{position:fixed;top:0;bottom:0;width:50.5%;z-index:8;pointer-events:none;background:repeating-linear-gradient(90deg,#2a050d 0 7px,#a11c32 7px 26px,#52091a 26px 40px);transition:transform .5s cubic-bezier(.5,0,.3,1);box-shadow:0 0 40px rgba(0,0,0,.8)}
.curtain.l{left:0;transform:translateX(-100%);border-right:3px solid var(--gold)}
.curtain.r{right:0;transform:translateX(100%);border-left:3px solid var(--gold)}
.shut .curtain{transform:none;transition-duration:.38s;transition-timing-function:cubic-bezier(.6,0,.9,.6)}
.hot-v{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(80% 70% at 50% 50%,transparent 55%,rgba(170,10,20,.55))}
.hot-v.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:1}}
@media (max-width:560px){.slip textarea{font-size:16px;height:88px;padding:9px 10px}.go{width:80px;font-size:13px;letter-spacing:.1em}.kick{font-size:12px}.bill{padding-left:18px;padding-right:18px}.bill p{font-size:18px}.stub{min-height:40px;padding:0 12px 0 14px;font-size:11px}.props{gap:6px}:root{--ry:104px}.clock small{display:none}.clock{min-width:56px}.tix{gap:4px}.top{min-height:calc(env(safe-area-inset-top) + 84px);padding-top:calc(env(safe-area-inset-top) + 36px)}.kick{letter-spacing:.2em;font-size:11px}.btn{min-width:170px}}
@media (min-width:900px){.bill h2{font-size:42px}.bill p{font-size:22px}.lab{font-size:13px}}
@media (max-height:700px){.bill p{margin-top:6px}.props{margin-top:8px}.pic{width:90px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.fly{position:fixed;z-index:9;pointer-events:none;background:var(--bone2);color:var(--ink);font:700 13px var(--serif);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.5);white-space:nowrap}
.tight .stampslot{height:46px;margin:6px 0 2px}.tight .stamp{font-size:24px;padding:6px 12px 4px}.tight .bill p{font-size:17px;margin-top:6px}.tight .bill h2{font-size:27px}.tight .lab{margin-top:8px}.tight .props{margin-top:8px}.tight .bill{padding-bottom:12px}.tight .kick{margin-bottom:4px}.tight .tip{margin-top:6px}.tight .btns{margin-top:12px}
@media (min-width:600px){.after{flex-wrap:nowrap}.after .btn{flex:1 1 0}.after .btn.main,.after .btn.gold{flex:1.7 1 0}}
</style>
</head>
<body class="shut">
<div class="back"></div>
<div class="floor"><div class="hatch"><div class="well"></div><div class="leaf"></div></div></div>
<div class="foot"><i></i><i></i><i></i><i></i><i></i></div>
<div class="drape l"></div><div class="drape r"></div><div class="valance"></div>
<div class="blood" id="blood"></div><div class="hot-v" id="hotv"></div>
<div class="curtain l"></div><div class="curtain r"></div>
<header class="top">
  <div class="clock off" id="clock" role="timer" aria-label="Time left"><b id="secs">45</b><small>sec</small></div>
  <div style="display:flex;align-items:center;gap:6px"><div class="tix" id="tix" aria-label="Acts"></div><button class="mute" id="mute" aria-label="Sound"><svg viewBox="0 0 24 24" id="muteIc"></svg></button></div>
</header>
<main><section class="bill" id="bill" aria-live="polite"><div class="bulbs chase" id="bulbs" aria-hidden="true"></div><div class="pic" id="pic" aria-hidden="true"></div><div id="bc"></div></section></main>
<div class="dock">
  <form class="slip" id="slip" hidden autocomplete="off"><textarea id="plan" maxlength="240" rows="3" placeholder="Your plan, in your own words…" aria-label="Your plan" enterkeyhint="go" autocapitalize="sentences"></textarea><button class="go" id="go" type="submit">Risk it</button></form>
  <div class="after" id="after" hidden></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script id="core">
const Core = (() => {
'use strict';
const ACTS = 7, BULBS = 12, MAXPLAN = 240;
const ICONS = ['fin', 'swarm', 'wave', 'weight', 'gear', 'horns', 'flame', 'ghost', 'snow', 'bolt', 'jaws', 'meteor', 'skull', 'twister', 'eye'];

/* ---------- words ---------- */
// a plan is read as lowercase words: "don't" becomes "dont", everything else that is not a letter or digit is a space
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[‘’`]/g, "'").replace(/'/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const rx = list => new RegExp('(?:^| )(?:' + list.join('|') + ')');
const E = (any, die) => ({any, die});

/* ---------- the repertoire ----------
   tier 1: one thing has to be right. tier 2: the same, but there are traps lying about. tier 3: two things at once.
   need.any: stems (a stem matches the start of a word). need.win: what happens when it is done.
   need.miss: what happens when it is not. fatal: things that kill whatever else the plan says.
   ex: one plan that works, shown when you fall, and the one the tests hold the judge to. */
const S = [
{id: 'shark', tier: 1, icon: 'fin', title: 'The Shark in the Shallow End',
 text: 'A shark has found you in the hotel pool. Its fin is cutting straight toward you, and the ladder is on the far side.',
 props: ['Pool noodle', 'Inflatable flamingo', 'Club sandwich'],
 needs: [{any: ['ladder', 'climb', 'get out', 'out of the (pool|water)', 'edge', 'flamingo', 'noodle', 'nose', 'gill', 'eyes?'],

    planEl.value = (cur && !/\s$/.test(cur) ? cur + ' ' : cur) + pre + w + ' '; grow();
    planEl.focus({preventScroll: true}); planEl.setSelectionRange(planEl.value.length, planEl.value.length);
    SV.seen = true; save(); const t = document.querySelector('.tip'); if (t) t.textContent = '';
  });
  startClock(Core.fuse(i));
  if (matchMedia('(pointer:fine)').matches) planEl.focus({preventScroll: true});
}

function flyChip(b) {
  if (RM.matches) return;
  const a = b.getBoundingClientRect(), t = planEl.getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'fly'; f.textContent = b.textContent; f.style.left = a.left + 'px'; f.style.top = a.top + 'px'; f.style.width = a.width + 'px'; document.body.appendChild(f);
  const dx = t.left + 16 - a.left, dy = t.top + 14 - a.top;
  const an = f.animate([{transform: 'none', opacity: 1}, {transform: `translate(${dx}px,${dy}px) scale(.55)`, opacity: .15}], {duration: 330, easing: 'cubic-bezier(.5,0,.2,1)'});
  an.onfinish = () => f.remove();
}
/* the bulbs are the clock */
function startClock(sec) {
  stopClock();
  clock = {t0: performance.now(), total: sec * 1000, lit: bulbs.length, hid: null, raf: 0, beat: 0};
  $('#clock').classList.remove('off', 'hot'); $('#secs').textContent = sec;
  const frame = now => {
    if (!clock) return;
    const c = clock;
    if (document.hidden) { c.raf = requestAnimationFrame(frame); return; }
    const rem = Math.max(0, c.total - (now - c.t0)), secs = Math.ceil(rem / 1000);
    if ($('#secs').textContent != secs) { $('#secs').textContent = secs; if (secs <= 10 && secs > 0) Snd.beat(); }
    bulbsEl.classList.toggle('panic', secs <= 5);
    $('#clock').classList.toggle('hot', secs <= 10); $('#hotv').classList.toggle('on', secs <= 10);
    const lit = Math.ceil(bulbs.length * rem / c.total);
    if (lit !== c.lit) { c.lit = lit; setLit(lit); if (lit % 2 === 0) Snd.tick(); }
    if (rem <= 0) { clock = null; submitPlan(true); return; }
    c.raf = requestAnimationFrame(frame);
  };
  clock.raf = requestAnimationFrame(frame);
}
function stopClock(hide = true) { if (clock) cancelAnimationFrame(clock.raf); clock = null; if (hide) $('#clock').classList.add('off'); $('#clock').classList.remove('hot'); $('#hotv').classList.remove('on'); }
document.addEventListener('visibilitychange', () => { if (!clock) return; if (document.hidden) clock.hid = performance.now(); else if (clock.hid) { clock.t0 += performance.now() - clock.hid; clock.hid = null; } });

const grow = () => { planEl.style.height = 'auto'; planEl.style.height = Math.max(88, Math.min(planEl.scrollHeight, 152)) + 'px'; };
planEl.addEventListener('input', grow);
$('#slip').onsubmit = e => { e.preventDefault(); submitPlan(false); };
planEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitPlan(false); } });

async function askNarrator(sc, plan) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await fetch(AI_URL, {method: 'POST', headers: {'Content-Type': 'application/json'}, signal: ctl.signal,
      body: JSON.stringify({model: 'gpt-4o-mini', temperature: .8, max_tokens: 260, messages: Core.prompt(sc, plan), response_format: {type: 'json_object'}})});
    if (!res.ok) return null;
    const j = await res.json();
    return j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content || null;
  } catch (e) { return null; } finally { clearTimeout(to); }
}

async function submitPlan(timeout) {
  if (busy || phase !== 'act') return;
  const plan = planEl.value.trim();
  if (!timeout && !plan) { planEl.focus(); $('#slip').classList.remove('shake'); void $('#slip').offsetWidth; $('#slip').classList.add('shake'); return; }
  busy = true; phase = 'judging'; stopClock(false); drawTix();
  planEl.disabled = true; $('#go').disabled = true; $('#go').textContent = '\u2026'; planEl.blur();
  Snd.init(); Snd.submit();
  bulbsEl.className = 'bulbs chase fast'; setLit(99);
  const sc = Core.scene(ST);
  bc.querySelector('.tip') && (bc.querySelector('.tip').textContent = 'The narrator considers…');
  const tip = bc.querySelector('.tip'); if (tip) tip.textContent = 'The narrator considers…';
  setTimeout(Snd.drum, 250);
  const [raw] = await Promise.all([plan ? askNarrator(sc, plan) : null, wait(RM.matches ? 300 : 1900)]);
  const v = Core.resolve(sc, plan, raw);
  const r = Core.submit(ST, plan, v);
  showVerdict(sc, plan, v, r, timeout && !plan);
}

async function showVerdict(sc, plan, v, r, froze) {
  phase = 'verdict'; dock(''); bulbsEl.className = 'bulbs'; $('#clock').classList.add('off');
  const last = ST.over && ST.won;
  const yourPlan = plan ? `<div class="lab">Your plan</div><p class="said">“${esc(plan)}”</p>` : '';
  if (v.survives) {
    drawTix();
    await swap(`<span class="kick">Act ${Core.ROMAN[ST.results.length - 1]} of VII</span><h2>${esc(sc.title)}</h2><div class="stampslot"><span class="stamp live">Survived</span></div>${yourPlan}<p class="nar" id="nar"></p>`, sc.icon, false);
    Snd.stamp(); Snd.live(); flashBulbs();
    typeInto($('#nar'), v.narration, () => setAfter(true, last));
  } else {
    drawTix();
    await swap(`<span class="kick">Cause of death</span><div class="stampslot"><span class="stamp dead">Dead</span></div><h2>${esc(v.epitaph || sc.epi)}</h2>${yourPlan}<p class="nar" id="nar"></p><div class="lab">What would have worked</div><div class="worked">“${esc(sc.ex)}”</div>`, null);
    Snd.stamp(); Snd.dead();
    $('#blood').classList.add('on');
    const main = $('main');
    if (!RM.matches) { main.classList.remove('shake'); void main.offsetWidth; main.classList.add('shake'); }
    setTimeout(() => {
      pic.innerHTML = '<div class="trap" id="trap"><div class="hole"></div><div class="leaf"></div>' + FIG + '</div>'; pic.classList.add('doom'); pic.classList.remove('pop');
      requestAnimationFrame(() => requestAnimationFrame(() => { $('#trap').classList.add('go'); Snd.hatch(); }));
      setTimeout(() => $('#blood').classList.remove('on'), 900);
    }, RM.matches ? 0 : 380);
    record();
    typeInto($('#nar'), v.narration, () => setAfter(false));
  }
}
function flashBulbs() { if (RM.matches) return; bulbsEl.className = 'bulbs chase fast'; setTimeout(() => { if (phase === 'verdict') bulbsEl.className = 'bulbs'; }, 1400); }

function setAfter(alive, last) {
  const a = $('#after');
  if (alive) {
    a.innerHTML = `<button class="btn gold" id="n-next">${last ? 'Take a bow' : 'Next act'}</button>`;
    dock('after'); const b = $('#n-next'); b.onclick = () => last ? showOvation() : (ST.i < Core.ACTS && beginAct()); b.focus({preventScroll: true});
  } else {
    a.innerHTML = '<button class="btn main" id="n-again">Take another bow</button><button class="btn line" id="n-share">Share</button><button class="btn line" id="n-title">Curtain</button>';
    dock('after');
    $('#n-again').onclick = () => startShow(null);
    $('#n-share').onclick = () => shareText();
    $('#n-title').onclick = () => showTitle();
    $('#n-again').focus({preventScroll: true});
  }
}
let recorded = false;
function record() { Core.record(SV, ST, today()); save(); }

async function showOvation() {
  phase = 'end'; dock('');
  record();
  bulbsEl.className = 'bulbs chase fast'; Snd.ovation();
  await curtain(() => swap(`<span class="kick">Standing ovation</span><h2>All seven. Alive.</h2><p>The narrator has nothing left to say, which has never happened before. The house is on its feet.</p>${gridHTML(ST)}<div class="stats">Best ${SV.best}/${Core.ACTS} · Streak ${Core.streakNow(SV, today())} · Ovations ${SV.ovations}</div>`, 'mask', true, true));
  petals();
  const a = $('#after');
  a.innerHTML = '<button class="btn gold" id="o-again">Another show</button><button class="btn line" id="o-share">Share</button><button class="btn line" id="o-title">Curtain</button>';
  dock('after'); $('#o-again').onclick = () => startShow(null); $('#o-share').onclick = () => shareText(); $('#o-title').onclick = () => showTitle();
  $('#o-again').focus({preventScroll: true});
}
function petals() {
  if (RM.matches) return;
  for (let i = 0; i < 36; i++) { const p = document.createElement('i'); p.className = 'petal'; p.style.left = Math.random() * 100 + 'vw'; p.style.animationDuration = 2.6 + Math.random() * 2.6 + 's'; p.style.animationDelay = Math.random() * 1.6 + 's'; document.body.appendChild(p); setTimeout(() => p.remove(), 8000); }
}

async function shareText(daily) {
  const label = daily ? new Date(daily.day + 'T12:00:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}) : (ST && ST.daily ? new Date(ST.daily + 'T12:00:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}) : 'free run');
  const st = daily ? {results: daily.grid.map(x => ({survives: !!x})), won: daily.won} : ST;
  const text = Core.share(st, label, 'https://gptgames.dev/games/death_by_ai.html');
  try { if (navigator.share) { await navigator.share({text}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied. Dare someone.'); } catch (e) { toast('Could not copy'); }
}

addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { if (typing && e.target === document.body) { e.preventDefault(); finishTyping(); } } });

// keep the slip above the phone's keyboard
if (window.visualViewport) { const fit = () => { document.body.style.height = visualViewport.height + 'px'; scrollTo(0, 0); }; visualViewport.addEventListener('resize', fit); fit(); }

// test hook for the filmstrips
window.__dba = {get st() { return ST; }, startShow, showTitle, submitPlan, planEl, Core};
document.fonts && document.fonts.ready.then(probe);
showTitle(true);
})();
</script>
