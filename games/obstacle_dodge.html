<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>point &amp; line</title>
<meta name="description" content="point &amp; line - a one-finger dodge game printed like a risograph. You are a pink registration mark: slip between Bauhaus squares, circles, triangles and lines, and see how long you last.">
<meta name="theme-color" content="#F0E9D8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0E9D8;--ink:#1B1A17;--red:#E04A26;--yel:#F0A400;--blue:#2A50A8;--pink:#E8168B;--mix:#3B2236;--soft:#5E574C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:Jost,Futura,"Century Gothic","Avenir Next",sans-serif;overflow:hidden;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
body{background-image:var(--grain)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.printed{-webkit-mask-image:var(--speck);mask-image:var(--speck)}
.num{font-variant-numeric:tabular-nums}
/* the slug: seconds survived and the colour bar of stages */
.slug.quiet .time{opacity:0}
.slug .time{transition:opacity .3s ease,color .2s ease}
.slug{position:fixed;display:flex;align-items:flex-end;gap:20px;pointer-events:none;opacity:1;transition:opacity .4s ease}
.time{transition:color .2s ease;font-weight:500;line-height:.8;letter-spacing:-.035em;white-space:nowrap;min-width:2.6ch}
.time.hot{color:var(--pink);transition:none}
.time small{font-size:.5em;font-weight:400;letter-spacing:0}
.bar{display:flex;gap:7px;position:relative;flex:1;height:14px;margin-bottom:.12em}
.bar span{position:relative;overflow:hidden;transform-origin:50% 100%}
.bar span.beat{animation:beat .6s cubic-bezier(.2,.8,.2,1)}
@keyframes beat{0%{transform:scaleY(1)}25%{transform:scaleY(2.1)}100%{transform:scaleY(1)}}
.bar span::before{content:'';position:absolute;inset:0;background:var(--c);opacity:.2}
.bar span.ink::before{opacity:.3}
.bar span.mix::before{opacity:.34;background:linear-gradient(90deg,var(--red),var(--blue),var(--yel),var(--ink))}
.bar span i{position:absolute;inset:0;background:var(--c);opacity:.92;transform-origin:left;transform:scaleX(var(--f,0))}
.bar .tick{position:absolute;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:var(--pink);box-shadow:0 0 0 2px var(--paper);display:none}
.bar .tick.on{display:block}
/* the thumb pad below the perforation, phones only */
.pad{position:fixed;left:0;right:0;bottom:0;display:none;pointer-events:none}
.perf{position:absolute;left:0;right:0;top:0;height:0;border-top:3px dotted rgba(27,26,23,.42)}
.ring{position:fixed;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px solid var(--pink);opacity:0;pointer-events:none;transition:opacity .12s ease}
.ring.on{opacity:.5}
.ghost{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px solid var(--pink);opacity:0;transition:opacity .4s ease}
.ghost.on{opacity:.45}
.drag{position:absolute;left:0;right:0;text-align:center;font-size:18px;font-weight:500;letter-spacing:.06em;color:var(--ink);opacity:0;transition:opacity .4s ease}
.drag.on{opacity:1}
/* overlays sit exactly on the trim */
.over{position:fixed;display:flex;flex-direction:column;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.over.on{opacity:1;visibility:visible;transition:opacity .35s ease,visibility 0s}
.over .act{pointer-events:auto}
.wm{font-weight:500;letter-spacing:-.045em;line-height:.86;color:var(--ink)}
.wm b{color:var(--red);font-weight:500}
.hint{font-size:17px;letter-spacing:.04em;color:var(--soft);margin-top:18px}
.hint .k{display:inline-block;border:1.5px solid currentColor;border-radius:5px;padding:0 7px;margin:0 2px;font-size:16px;line-height:24px;vertical-align:1px}
#title{justify-content:center;padding:0 7%}
#poster{justify-content:flex-start;align-items:flex-start;padding:5%}
#poster .label{background:var(--paper);padding:5% 6% 6%;display:flex;flex-direction:column;max-width:100%;border:1px solid rgba(27,26,23,.22);box-shadow:3px 4px 0 rgba(27,26,23,.08);transform:rotate(-1.2deg);transform-origin:0 0}
#poster .colo{display:block;font-size:.72em;letter-spacing:.12em;color:var(--soft);margin-top:6px;text-transform:uppercase}
#poster .big{font-weight:500;letter-spacing:-.05em;line-height:.8;transform:translateY(14px);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#poster.on .big{transform:none}
#poster .big small{font-size:.42em;letter-spacing:-.01em;font-weight:400}
#poster .meta{font-size:calc(19px * var(--u,1));margin-top:18px;color:var(--ink);letter-spacing:.02em}
#poster .meta b{color:var(--pink);font-weight:700;font-size:1.35em;letter-spacing:-.01em}
.btns{display:flex;gap:12px;margin-top:22px}
.btn{font:inherit;font-size:calc(18px * var(--u,1));font-weight:500;letter-spacing:.02em;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:calc(12px * var(--u,1)) calc(26px * var(--u,1));min-height:52px;cursor:pointer;border-radius:0;transition:transform .12s ease,background-color .12s ease,color .12s ease}
.btn.main{background:var(--ink);color:var(--paper)}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.mute:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
@media (hover:hover){.btn:hover{background:var(--pink);border-color:var(--pink);color:var(--paper)}}
#pause{justify-content:center;align-items:center;text-align:center}
#pause .wm{font-size:64px}
.mute{position:fixed;width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.mute.on{opacity:1;visibility:visible;transition:opacity .3s ease,visibility 0s}
.mute svg{width:20px;height:20px}
.mute .x{display:none}.mute.off .x{display:block}.mute.off .w{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="The press sheet you play on"></canvas>
<div class="pad" id="pad"><div class="perf"></div><div class="ghost" id="ghost"></div><p class="drag" id="drag">drag here</p></div>
<div class="ring" id="ring"></div>
<div class="slug" id="slug">
 <div class="time num printed" id="time">0<small>.0</small></div>
 <div class="bar" id="bar" aria-hidden="true">
  <span style="--c:var(--red)"><i></i></span><span style="--c:var(--blue)"><i></i></span><span style="--c:var(--yel)"><i></i></span><span class="ink" style="--c:var(--ink)"><i></i></span><span class="mix" style="--c:var(--mix)"><i></i></span>
  <b class="tick" id="tick"></b>
 </div>
</div>
<div class="over on" id="title">
 <h1 class="wm printed" id="wm">point<br><b>&amp;</b> line</h1>
 <p class="hint" id="hint"></p>
</div>
<div class="over" id="poster" aria-live="polite">
 <div class="label">
 <div class="big num printed" id="pTime">0<small>.0</small></div>
 <p class="meta" id="pMeta"></p>
 <div class="btns"><button class="btn main act" id="again">again</button><button class="btn act" id="share">share</button></div>
 </div>
</div>
<div class="over" id="pause"><div class="wm printed">paused</div><p class="hint" id="pHint">touch to go on</p></div>
<button class="mute" id="mute" aria-label="Sound on or off"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3.2L11 4v12l-4.8-3.5H3z" fill="#1B1A17"/><path class="w" d="M13.6 6.6q2.6 3.4 0 6.8" stroke="#1B1A17" stroke-width="1.7" fill="none" stroke-linecap="round"/><path class="x" d="M13.5 7.5l4 5m0-5l-4 5" stroke="#1B1A17" stroke-width="1.7" stroke-linecap="round"/></svg></button>
<p class="sr" id="live" aria-live="polite"></p>
<script id="core">
// point & line - the rules. No DOM: the page draws what this decides, and test/obstacle_dodge.mjs plays it.
var PointCore = (function () {
    'use strict';
    var R_HIT = 5.5;        // the point's body; the printed mark is larger, the ink in its centre is what counts
    var GRAZE = 13;         // a pass this close to a shape's edge, without touching, is a graze
    var MAXV = 1100;        // the point's top speed, units/s: a mouse can fling it, collisions are still swept
    var BLEED = 34;         // the strip outside the trim where shapes wait, units
    var FIXED = 1 / 240;    // the rules run at a fixed step whatever the frame rate
    var BAR = 13;           // thickness of a swept line
    // one swatch per stage: the ink that joins at its start
    var STAGES = [
        {t: 0, ink: 'red'},
        {t: 10, ink: 'blue'},
        {t: 20, ink: 'yel'},
        {t: 30, ink: 'ink'},
        {t: 45, ink: 'mix'}
    ];
    var END = 60;           // where the colour bar ends; play goes on getting harder after it

    function rnd(s) {
        var t = s.rs = (s.rs + 0x6D2B79F5) | 0;
        t = Math.imul(t ^ (t >>> 15), 1 | t);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    function range(s, a, b) { return a + (b - a) * rnd(s); }

    function stageAt(t) { var i = 0; while (i + 1 < STAGES.length && t >= STAGES[i + 1].t) i++; return i; }
    // how long a shape sits in the bleed before it may cross: never less than half a second
    function warnAt(t) { return Math.max(0.55, 1.0 - t / 120); }
    function aimAt(t) { return Math.max(0.7, 1.15 - t / 130); }
    // the busier the clock, the busier the sheet; a bigger sheet holds proportionally more
    function pace(s) { return (1 + s.t / 38) * Math.pow(s.W * s.H / (400 * 640), 0.7); }

    function create(opt) {
        opt = opt || {};
        var W = opt.W || 400, H = opt.H || 640;
        var s = {
            W: W, H: H, seed: (opt.seed >>> 0) || 1, rs: (opt.seed >>> 0) || 1,
            t: 0, acc: 0, alive: true, px: W / 2, py: H * 0.62, tx: W / 2, ty: H * 0.62,
            ents: [], nextId: 1, grazes: 0, stage: 0, chain: 0, lastGraze: -9,
            due: {square: 0.5, circle: STAGES[1].t + 0.4, triangle: STAGES[2].t + 0.4, line: STAGES[3].t + 0.6},
            first: {square: true}, death: null,
            ghost: !!opt.ghost   // a ghost run records every hit and plays on: for tests that need to see a whole run
        };
        return s;
    }

    // ---------------------------------------------------------------- geometry, shared with the page
    function poly(e) {
        var c = Math.cos(e.ang), n = Math.sin(e.ang), pts, i, out = [];
        if (e.kind === 'square') { var h = e.size / 2; pts = [[-h, -h], [h, -h], [h, h], [-h, h]]; }
        else pts = [[e.size, 0], [-e.size * 0.6, -e.size * 0.62], [-e.size * 0.6, e.size * 0.62]];
        for (i = 0; i < pts.length; i++) out.push([e.x + pts[i][0] * c - pts[i][1] * n, e.y + pts[i][0] * n + pts[i][1] * c]);
        return out;
    }
    // a line is two bars either side of its gap; [x, y, w, h]
    function bars(e, s) {
        var out = [], g0 = e.gap - e.gw / 2, g1 = e.gap + e.gw / 2, len = e.horiz ? s.W : s.H, ext = BLEED + 4;
        if (e.horiz) { out.push([-ext, e.y - BAR / 2, g0 + ext, BAR]); out.push([g1, e.y - BAR / 2, len + ext - g1, BAR]); }
        else { out.push([e.x - BAR / 2, -ext, BAR, g0 + ext]); out.push([e.x - BAR / 2, g1, BAR, len + ext - g1]); }
        return out;
    }
    function segDist(px, py, ax, ay, bx, by) {
        var dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy, u = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
        u = u < 0 ? 0 : u > 1 ? 1 : u;
        var x = ax + dx * u - px, y = ay + dy * u - py;
        return Math.sqrt(x * x + y * y);
    }
    function rectDist(px, py, r) {
        var dx = Math.max(r[0] - px, 0, px - (r[0] + r[2])), dy = Math.max(r[1] - py, 0, py - (r[1] + r[3]));
        return Math.sqrt(dx * dx + dy * dy);
    }
    // distance from a point to the shape's ink; 0 inside it
    function dist(e, px, py, s) {
        if (e.kind === 'circle') return Math.max(0, Math.hypot(px - e.x, py - e.y) - e.r);
        if (e.kind === 'line') { var b = bars(e, s); return Math.min(rectDist(px, py, b[0]), rectDist(px, py, b[1])); }
        var p = poly(e), inside = true, d = 1e9, i, j, cr, sign = 0;
        for (i = 0; i < p.length; i++) {
            j = (i + 1) % p.length;
            cr = (p[j][0] - p[i][0]) * (py - p[i][1]) - (p[j][1] - p[i][1]) * (px - p[i][0]);
            if (cr !== 0) { if (sign === 0) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) inside = false; }
            d = Math.min(d, segDist(px, py, p[i][0], p[i][1], p[j][0], p[j][1]));
        }
        return inside ? 0 : d;
    }
    // how far a shape reaches from its centre, for placing it in the bleed and letting it go
    function reach(e) {
        if (e.kind === 'circle') return e.r;
        if (e.kind === 'square') return e.size * 0.7072;
        if (e.kind === 'triangle') return e.size;
        return BAR / 2;
    }
    function inTrim(e, s) {
        var r = reach(e);
        return e.x + r > 0 && e.x - r < s.W && e.y + r > 0 && e.y - r < s.H;
    }
    function hazardous(e) { return e.phase !== 'wait'; }

    // ---------------------------------------------------------------- spawning
    // edges: 0 top, 1 right, 2 bottom, 3 left; the inward normal of each
    var NORM = [[0, 1], [-1, 0], [0, -1], [1, 0]];
    function onEdge(s, edge, u, r) {
        // a point on the edge, pushed out so the shape's inner side just touches the dieline
        if (edge === 0) return [u * s.W, -r];
        if (edge === 1) return [s.W + r, u * s.H];
        if (edge === 2) return [u * s.W, s.H + r];
        return [-r, u * s.H];
    }
    function add(s, e, ev) {
        e.id = s.nextId++; e.born = s.t; e.warn = warnAt(s.t); e.phase = 'wait';
        s.ents.push(e);
        ev.push({type: 'wait', kind: e.kind, id: e.id, t: s.t});
        return e;
    }
    function spawnSquare(s, ev) {
        var edge = Math.floor(rnd(s) * 4), size = range(s, 36, 62), u = range(s, 0.12, 0.88);
        var e = {kind: 'square', size: size, ang: range(s, -0.5, 0.5), edge: edge};
        var p = onEdge(s, edge, u, size * 0.7072); e.x = p[0]; e.y = p[1];
        var a = Math.atan2(NORM[edge][1], NORM[edge][0]) + range(s, -0.42, 0.42);
        var v = Math.min(260, range(s, 95, 150) * (1 + s.t / 70));
        e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v;
        return add(s, e, ev);
    }
    function spawnCircle(s, ev) {
        var edge = Math.floor(rnd(s) * 4), r = range(s, 14, 28), u = range(s, 0.15, 0.85);
        var e = {kind: 'circle', r: r, edge: edge, bounces: 2 + Math.floor(rnd(s) * 3), inside: false, ang: 0};
        var p = onEdge(s, edge, u, r); e.x = p[0]; e.y = p[1];
        var a = Math.atan2(NORM[edge][1], NORM[edge][0]) + range(s, -0.75, 0.75);
        var v = Math.min(250, range(s, 115, 165) * (1 + s.t / 90));
        e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v;
        return add(s, e, ev);
    }
    function spawnTriangle(s, ev) {
        var edge = Math.floor(rnd(s) * 4), u = range(s, 0.15, 0.85), size = 26;
        var e = {kind: 'triangle', size: size, edge: edge, vx: 0, vy: 0};
        var p = onEdge(s, edge, u, size); e.x = p[0]; e.y = p[1];
        e.ang = Math.atan2(NORM[edge][1], NORM[edge][0]);
        e.fromX = e.x; e.fromY = e.y;
        e.toX = e.x + NORM[edge][0] * (size + 34); e.toY = e.y + NORM[edge][1] * (size + 34);
        e.aim = aimAt(s.t);
        return add(s, e, ev);
    }
    function spawnLine(s, ev) {
        var edge = Math.floor(rnd(s) * 4), horiz = edge === 0 || edge === 2, len = horiz ? s.W : s.H;
        var gw = Math.max(54, 84 - (s.t - STAGES[3].t) * 0.6), gap = range(s, gw / 2 + 24, len - gw / 2 - 24);
        var e = {kind: 'line', horiz: horiz, gw: gw, gap: gap, edge: edge, ang: 0};
        var v = Math.min(200, range(s, 105, 135) * (1 + (s.t - STAGES[3].t) / 80));
        if (horiz) { e.x = s.W / 2; e.y = edge === 0 ? -BAR / 2 : s.H + BAR / 2; e.vx = 0; e.vy = edge === 0 ? v : -v; }
        else { e.y = s.H / 2; e.x = edge === 3 ? -BAR / 2 : s.W + BAR / 2; e.vy = 0; e.vx = edge === 3 ? v : -v; }
        return add(s, e, ev);
    }
    function count(s, kind) { var n = 0; for (var i = 0; i < s.ents.length; i++) if (s.ents[i].kind === kind) n++; return n; }
    function direct(s, ev) {
        var k = pace(s), st = s.stage;
        if (s.t >= s.due.square) {
            spawnSquare(s, ev);
            var gapSq = s.first.square ? 0.9 : 1.15 / k * (st >= 3 ? 1.45 : st >= 1 ? 1.3 : 1);
            s.first.square = false;
            s.due.square = s.t + gapSq * range(s, 0.75, 1.25);
        }
        if (st >= 1 && s.t >= s.due.circle) {
            if (count(s, 'circle') < 2 + st) spawnCircle(s, ev);
            s.due.circle = s.t + 2.5 / k * range(s, 0.75, 1.25);
        }
        if (st >= 2 && s.t >= s.due.triangle) {
            spawnTriangle(s, ev);
            // one at a time until the last stage: spaced by a triangle's whole life, never by when the last
            // one left - that depends on where it aimed, and the seed alone must decide what comes
            var life = warnAt(s.t) + 0.45 + aimAt(s.t) + 0.24 + 1.0;
            s.due.triangle = s.t + Math.max(st >= 4 ? 0 : life, 3.4 / k * range(s, 0.8, 1.2));
        }
        if (st >= 3 && s.t >= s.due.line) {
            if (count(s, 'line') < (st >= 4 ? 2 : 1)) spawnLine(s, ev);
            s.due.line = s.t + 5.8 / Math.sqrt(k) * range(s, 0.85, 1.15);
        }
    }

    // ---------------------------------------------------------------- one fixed step
    function moveShape(s, e, dt, ev) {
        var age = s.t - e.born;
        if (e.phase === 'wait') {
            if (age < e.warn) return;
            e.phase = e.kind === 'triangle' ? 'glide' : 'live';
            ev.push({type: 'enter', kind: e.kind, id: e.id, t: s.t});
        }
        if (e.kind === 'triangle') {
            var a0 = age - e.warn;
            if (e.phase === 'glide') {
                var u = Math.min(1, a0 / 0.45), q = 1 - Math.pow(1 - u, 3);
                e.x = e.fromX + (e.toX - e.fromX) * q; e.y = e.fromY + (e.toY - e.fromY) * q;
                if (u >= 1) { e.phase = 'aim'; e.t1 = s.t; ev.push({type: 'aim', kind: e.kind, id: e.id, t: s.t}); }
                return;
            }
            if (e.phase === 'aim') {
                var want = Math.atan2(s.py - e.y, s.px - e.x), d = want - e.ang;
                while (d > Math.PI) d -= 2 * Math.PI;
                while (d < -Math.PI) d += 2 * Math.PI;
                var turn = 4.2 * dt;
                e.ang += d > turn ? turn : d < -turn ? -turn : d;
                if (s.t - e.t1 >= e.aim) { e.phase = 'lock'; e.t2 = s.t; ev.push({type: 'lock', kind: e.kind, id: e.id, t: s.t}); }
                return;
            }
            if (e.phase === 'lock') {
                if (s.t - e.t2 >= 0.24) {
                    e.phase = 'dart'; e.vx = Math.cos(e.ang) * 560; e.vy = Math.sin(e.ang) * 560;
                    ev.push({type: 'dart', kind: e.kind, id: e.id, t: s.t});
                }
                return;
            }
        }
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (e.kind === 'circle') {
            if (!e.inside) {
                if (e.x - e.r >= 0 && e.x + e.r <= s.W && e.y - e.r >= 0 && e.y + e.r <= s.H) e.inside = true;
            } else if (e.bounces > 0) {
                var hit = false;
                if (e.x - e.r < 0 && e.vx < 0) { e.vx = -e.vx; e.x = e.r; hit = true; }
                if (e.x + e.r > s.W && e.vx > 0) { e.vx = -e.vx; e.x = s.W - e.r; hit = true; }
                if (e.y - e.r < 0 && e.vy < 0) { e.vy = -e.vy; e.y = e.r; hit = true; }
                if (e.y + e.r > s.H && e.vy > 0) { e.vy = -e.vy; e.y = s.H - e.r; hit = true; }
                if (hit) { e.bounces--; ev.push({type: 'bounce', kind: 'circle', id: e.id, t: s.t, x: e.x, y: e.y}); }
            }
        }
    }

            for (var i = 0; i < ev.length; i++) handle(ev[i]);
            if (!passedBest && save.best > 0 && game.t > save.best) { passedBest = true; sfx.best(); }
        }
        var now = game.t;
        drawSheet(game, {trail: state === 'poster' ? null : trail, trailNow: now, trailLife: 1.6, still: state === 'poster',
            runLine: state === 'poster' ? runLine : null, runUpTo: rm ? 1e9 : runLine.length * Math.min(1, (performance.now() - posterAt) / 900)});
        // near misses ripple out of the mark
        for (var r = ripples.length - 1; r >= 0; r--) {
            var q = ripples[r], u = (performance.now() - q.at) / 420;
            if (u >= 1) { ripples.splice(r, 1); continue; }
            var e = 1 - Math.pow(1 - u, 3);
            g.save(); g.strokeStyle = C.pink; g.globalAlpha = (1 - u) * .9; g.lineWidth = 3 * (1 - u) + .8;
            g.beginPath(); g.arc(q.x, q.y, 18 + e * 26, 0, 7); g.stroke(); g.restore();
        }
        if (state === 'dying' || state === 'poster') {
            // the pink drum slips off register: the mark doubles, and the run stops being live
            var since = performance.now() - deathAt, k = rm ? 1 : Math.max(0, Math.min(1, (since - 90) / 260)), ke = 1 - Math.pow(1 - k, 3);
            var wash = state === 'poster' ? 0.45 * (1 - (rm ? 1 : Math.min(1, (performance.now() - posterAt) / 500))) : 0.45 * ke;
            g.save(); g.fillStyle = 'rgba(240,233,216,' + wash + ')'; g.fillRect(-L.x / L.s, -L.y / L.s, L.vw / L.s, L.vh / L.s); g.restore(); crops();
            var killer = game.ents.filter(function (q) { return game.death && q.id === game.death.id; })[0];
            proofRing(game.death ? game.death.x : game.px, game.death ? game.death.y : game.py, rm ? 1 : Math.min(1, since / 380));
            if (killer && state === 'dying') { ctx = g; pathOf(killer, game)(); g.save(); g.globalAlpha = .95; g.fillStyle = C[INK_OF[killer.kind]]; g.fill(); g.restore(); }
            mark(game.px, game.py, 1, .28);
            mark(game.px, game.py, 1, 1, [10 * ke, -7 * ke]);
            if (state === 'dying' && performance.now() - deathAt > (rm ? 300 : 750)) { setState('poster'); placeTick(); }
        } else {
            var gp = reduced.matches ? 0 : Math.max(0, 1 - (performance.now() - grazeAt) / 260);
            if (gp > 0) mark(game.px, game.py, 1 + 0.2 * gp, .55 * gp, [4 * gp, -3 * gp]);
            var vl = trail.length > 3 ? trail[trail.length - 4] : null, vx = 0, vy = 0;
            if (vl && game.t > vl[2]) { vx = (game.px - vl[0]) / (game.t - vl[2]); vy = (game.py - vl[1]) / (game.t - vl[2]); }
            mark(game.px, game.py, 1 + 0.32 * gp * gp, 1, null, null, reduced.matches ? null : [vx, vy]);
            cv.style.transform = gp > 0.55 ? 'translate(' + (Math.random() * 4 - 2).toFixed(1) + 'px,' + (Math.random() * 4 - 2).toFixed(1) + 'px)' : '';
        }
        if (state === 'resuming') {
            var ru = Math.min(1, (performance.now() - resumeAt) / 700);
            g.save(); g.strokeStyle = C.pink; g.lineWidth = 2.5; g.beginPath(); g.arc(game.px, game.py, 30, -Math.PI / 2, -Math.PI / 2 + ru * Math.PI * 2); g.stroke(); g.restore();
        }
        slugUpdate(game.t);
    }
    function handle(ev) {
        switch (ev.type) {
            case 'wait':
                if (ev.kind === 'square') sfx.square();
                else if (ev.kind === 'circle') sfx.circle();
                else if (ev.kind === 'line') droneTo(0, undefined, .08); // black is silence
                break;
            case 'enter': if (ev.kind === 'line') droneTo(.05, game.stage, 1.2); break;
            case 'bounce': sfx.bounce(); break;
            case 'aim': sfx.aim(); break;
            case 'lock': sfx.lock(); break;
            case 'dart': sfx.dart(); break;
            case 'graze':
                sfx.graze(ev.chain); grazeAt = performance.now();
                if (!reduced.matches) ripples.push({x: ev.x, y: ev.y, at: grazeAt});
                var tm = $('time'); tm.classList.add('hot'); clearTimeout(tm._h); tm._h = setTimeout(function () { tm.classList.remove('hot'); }, 220);
                break;
            case 'stage':
                sfx.stage(ev.stage); droneTo(.05, ev.stage);
                var sw = spans[ev.stage]; sw.classList.remove('beat'); void sw.offsetWidth; sw.classList.add('beat');
                wobbleAt = performance.now(); wobbleAmp = 3.2;
                var inkVoice = [null, sfx.circle, sfx.dart, null, sfx.square][ev.stage];   // black arrives in silence
                if (inkVoice) inkVoice();
                break;
            case 'hit': die(ev); break;
        }
    }

    // ------------------------------------------------------------ boot
    function hint() {
        var touch = matchMedia('(pointer: coarse)').matches;
        $('hint').innerHTML = touch ? '' : (save.best ? 'best ' + save.best.toFixed(1) + ' · ' : '') + 'move the mouse, or <span class="k">←</span><span class="k">→</span>';
        if (touch && save.best) $('hint').textContent = 'best ' + save.best.toFixed(1);
        $('pHint').textContent = touch ? 'touch to go on' : 'click or press a key to go on';
    }
    // read-only window onto the run, for test/obstacle_dodge.mjs's page checks
    window.__pointline = {game: function () { return game; }, state: function () { return state; }, layout: function () { return L; }};
    flexBar(); setMute(save.mute); hint(); setState('title');
    addEventListener('resize', function () { layout(); placeTick(); });
    var go = function () { layout(); placeTick(); requestAnimationFrame(frame); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go, go); else go();
})();
</script>
