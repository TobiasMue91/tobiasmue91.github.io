<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backgammon</title>
<meta name="description" content="Play Backgammon online for free: a lacquered travelling board with a computer opponent at three strengths, two-player mode, hits, the bar, bearing off, gammons and matches to 1, 3 or 5 points.">
<meta name="theme-color" content="#120c09">
<style>
:root{
  --case:#1c120d; --case2:#2f1d13; --felt:#0d1a33; --felt2:#13264a;
  --brass:#d9b25f; --brass-hi:#ffe3a0; --brass-lo:#7d6330;
  --bone:#f1e6c8; --ink:#f4ead2; --dim:#a69a7e;
  --verm:#d4472d; --verm-hi:#ff8a6a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--case);color:var(--ink);font-family:var(--serif);overscroll-behavior:none}
body{background:radial-gradient(120% 90% at 50% 40%,#2b1b12 0%,#140c08 70%,#0b0705 100%);}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* header */
.hud{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;max-width:1100px;width:100%;margin:0 auto}
.ib{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--brass);background:linear-gradient(#3a2618,#22150d);box-shadow:inset 0 0 0 1px rgba(217,178,95,.45),0 2px 4px rgba(0,0,0,.5);transition:transform .12s,opacity .2s,color .2s}
.ib:active{transform:scale(.92)}
.ib[disabled]{opacity:.3;cursor:default}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:5px 12px 5px 8px;border-radius:26px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(217,178,95,.18);transition:box-shadow .3s,background .3s}
.chip.on{background:linear-gradient(rgba(217,178,95,.3),rgba(217,178,95,.14));box-shadow:inset 0 0 0 1.5px var(--brass),0 0 14px rgba(217,178,95,.3)}.chip:not(.on){opacity:.7}
.chip .dot{flex:none;width:24px;height:24px;border-radius:50%}
.chip .dot.w{background:radial-gradient(circle at 36% 30%,#fffbe9 0 18%,#efe3c2 50%,#cdbb90);box-shadow:0 1.5px 0 #8c7a52}
.chip .dot.b{background:radial-gradient(circle at 36% 30%,#ff9a7c 0 14%,#d4472d 52%,#a42f19);box-shadow:0 1.5px 0 #6b1b0d}
.chip .t{min-width:0;line-height:1.1}
.chip .n{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .p{display:block;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip .p i{font-style:normal;font-size:11px;letter-spacing:.1em;color:var(--dim);margin-left:4px}
.chip .sc small{font-size:13px;color:var(--ink);font-weight:400;margin-left:2px}.chip .sc{margin-left:auto;font-size:22px;font-variant-numeric:tabular-nums;color:var(--brass-hi);font-weight:700}

/* stage */
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#board{position:relative;flex:none}
#bsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#layer{position:absolute;inset:0;pointer-events:none}
.ck{position:absolute;left:0;top:0;width:var(--d);height:var(--d);will-change:transform;transition:transform var(--mv,.36s) cubic-bezier(.3,.75,.25,1)}
.nt .ck,.nt .die{transition:none!important}
.ck .disc{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--d)*.4);font-weight:700;transition:box-shadow .2s,transform .2s}
.ck .disc::before,.ck .disc::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.ck .disc::before{inset:9%;box-shadow:inset 0 0 0 calc(var(--d)*.03) var(--g1)}
.ck .disc::after{inset:27%;box-shadow:inset 0 0 0 calc(var(--d)*.03) var(--g2),0 0 0 calc(var(--d)*.025) var(--g3)}
.ck.w .disc{--rim:rgba(40,25,10,.75);--g1:rgba(110,90,50,.35);--g2:rgba(110,90,50,.28);--g3:rgba(255,255,255,.5);color:#6b5a33;background:radial-gradient(circle at 36% 30%,#fffdf0 0,#f4ebcf 30%,#e3d4a9 70%,#c9b685);box-shadow:0 0 0 1.5px var(--rim),0 calc(var(--d)*.07) 0 #8c7a52,0 calc(var(--d)*.12) calc(var(--d)*.16) rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.5)}
.ck.b .disc{--rim:rgba(30,6,2,.7);--g1:rgba(60,10,0,.4);--g2:rgba(60,10,0,.3);--g3:rgba(255,160,130,.4);color:#ffd9cc;background:radial-gradient(circle at 36% 30%,#ff9a7c 0,#e0553a 28%,#c93d24 68%,#9f2b17);box-shadow:0 0 0 1.5px var(--rim),0 calc(var(--d)*.07) 0 #6b1b0d,0 calc(var(--d)*.12) calc(var(--d)*.16) rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,200,180,.35)}
.ck.top .disc span{position:relative;z-index:2}
.ck.can .disc{box-shadow:0 0 0 2px #1a0f05,0 0 0 calc(var(--d)*.11) #ffc94d,0 0 calc(var(--d)*.3) calc(var(--d)*.05) rgba(255,190,60,.7),0 calc(var(--d)*.07) 0 var(--edge);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px #1a0f05,0 0 0 calc(var(--d)*.08) #ffc94d,0 0 calc(var(--d)*.25) calc(var(--d)*.04) rgba(255,190,60,.6),0 calc(var(--d)*.07) 0 var(--edge)}50%{box-shadow:0 0 0 2px #1a0f05,0 0 0 calc(var(--d)*.1) #ffe9a8,0 0 calc(var(--d)*.4) calc(var(--d)*.1) rgba(255,205,90,.9),0 calc(var(--d)*.07) 0 var(--edge)}}
.ck.w{--edge:#8c7a52}.ck.b{--edge:#6b1b0d}
.dimglow .ck.can:not(.sel) .disc{animation:none;box-shadow:0 0 0 1.5px var(--rim),0 calc(var(--d)*.07) 0 var(--edge),0 calc(var(--d)*.12) calc(var(--d)*.16) rgba(0,0,0,.55)}
.ck.sel .disc{animation:none;transform:scale(1.14);box-shadow:0 0 0 calc(var(--d)*.07) var(--brass-hi),0 0 calc(var(--d)*.4) calc(var(--d)*.12) rgba(255,210,110,.8),0 calc(var(--d)*.22) calc(var(--d)*.3) rgba(0,0,0,.6)}
.ck.drag{transition:none}
.ck.drag .disc{transform:scale(1.22)}
.ck.off .disc{border-radius:22%/50%;box-shadow:0 1px 2px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.3)}
.ck.off .disc::before,.ck.off .disc::after{display:none}
.ck.shake .disc{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mk{position:absolute;left:0;top:0;width:var(--d);height:var(--d);border-radius:50%;pointer-events:none;display:grid;place-items:center;font-size:calc(var(--d)*.42);font-weight:700;color:#2a1a08;border:calc(var(--d)*.06) solid #fff3c4;background:radial-gradient(circle at 40% 35%,#ffe08a,#e0a935);animation:mk 1.3s ease-in-out infinite;box-shadow:0 0 calc(var(--d)*.3) rgba(255,210,110,.55)}
.mk.hit::after{content:attr(data-n);position:absolute;right:-26%;top:-22%;padding:0 .4em;border-radius:99px;background:#b8301a;color:#fff;border:2px solid #fff;font-size:.62em;line-height:1.5}.mk.hit{width:calc(var(--d)*1.32);height:calc(var(--d)*1.32);margin:calc(var(--d)*-.16) 0 0 calc(var(--d)*-.16);color:transparent;border-color:#fff;background:rgba(214,50,28,.28);box-shadow:0 0 calc(var(--d)*.3) rgba(255,90,60,.7)}
.mk.tray{color:#ffe9a8;border-radius:calc(var(--d)*.18);width:auto;height:auto;margin:0;background:rgba(255,201,77,.28);border-color:#ffc94d;color:#ffe9a8}
@keyframes mk{0%,100%{opacity:.75}50%{opacity:1}}

.burst{position:absolute;left:0;top:0;width:var(--d);height:var(--d);border-radius:50%;pointer-events:none;border:3px solid var(--verm-hi);animation:burst .55s ease-out forwards}
@keyframes burst{from{opacity:.95;transform:var(--t) scale(.6)}to{opacity:0;transform:var(--t) scale(2.6)}}
.die{position:absolute;left:0;top:0;width:var(--dd);height:var(--dd);transition:transform .5s cubic-bezier(.3,.8,.25,1),opacity .3s;pointer-events:none}
.die .face{position:absolute;inset:0;border-radius:18%;rotate:var(--rot,0deg);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%;box-shadow:0 calc(var(--dd)*.06) 0 var(--e),0 calc(var(--dd)*.14) calc(var(--dd)*.2) rgba(0,0,0,.55)}
.die.w .face{--e:#9a875c;--pip:#2b1d12;background:linear-gradient(145deg,#fffbea,#e9dcb8);box-shadow:inset 0 2px 1px rgba(255,255,255,.9),inset 0 -3px 4px rgba(120,95,40,.35),0 calc(var(--dd)*.06) 0 #9a875c,0 calc(var(--dd)*.14) calc(var(--dd)*.2) rgba(0,0,0,.55)}
.die.b .face{--e:#7a2415;--pip:#fff1e6;background:linear-gradient(145deg,#ee6a4d,#b83420);box-shadow:inset 0 2px 1px rgba(255,200,180,.7),inset 0 -3px 4px rgba(80,10,0,.4),0 calc(var(--dd)*.06) 0 #7a2415,0 calc(var(--dd)*.14) calc(var(--dd)*.2) rgba(0,0,0,.55)}
.die .face b{width:70%;height:70%;margin:auto;border-radius:50%;background:var(--pip);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.die.used{opacity:.3}
.die.used .face{transform:scale(.86)}
.die.ghost .face{background:rgba(255,230,160,.08);box-shadow:inset 0 0 0 2px var(--brass),0 0 18px rgba(217,178,95,.4);animation:mk 1.1s ease-in-out infinite}
.die.ghost .face b{display:none}
.die.ghost .face::after{content:"";grid-area:2/2;margin:auto;width:60%;height:60%;border-radius:50%;background:var(--brass);opacity:.5}

/* footer */
.foot{flex:none;height:30px;display:grid;place-items:center;text-align:center;padding:0 16px;font-size:clamp(15px,2.2vw,17px);letter-spacing:.04em;color:var(--brass-hi);letter-spacing:.01em}
#status{transition:opacity .2s}

/* sheets */
.sheet{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(10,6,4,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
.sheet.show{opacity:1;pointer-events:auto}
.card{width:min(380px,100%);padding:26px 22px 22px;border-radius:20px;text-align:center;background:linear-gradient(#1b2b50,#0e1a33);box-shadow:inset 0 0 0 1.5px var(--brass),inset 0 0 0 5px #0e1a33,inset 0 0 0 6px rgba(217,178,95,.4),0 24px 60px rgba(0,0,0,.7);transform:translateY(14px) scale(.97);transition:transform .4s cubic-bezier(.3,.8,.25,1)}
.sheet.show .card{transform:none}
.card h1{font-size:44px;font-weight:400;font-style:italic;letter-spacing:.01em;line-height:1;color:var(--bone);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.card h2{font-size:30px;font-weight:400;font-style:italic;color:var(--bone);line-height:1.1}
.card .sub{margin-top:6px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
.pair{display:flex;justify-content:center;gap:10px;margin:16px 0 6px}
.pair i{width:30px;height:30px;border-radius:50%}
.btn{display:block;width:100%;min-height:52px;margin-top:12px;border-radius:14px;font-size:19px;letter-spacing:.02em;color:var(--ink);background:linear-gradient(#2c4272,#1c2d52);box-shadow:inset 0 0 0 1.5px rgba(217,178,95,.55),0 3px 0 #0a1226,0 6px 10px rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px rgba(217,178,95,.55),0 1px 0 #0a1226}
.btn.pri{color:#2a1a08;font-weight:700;background:linear-gradient(#f0cd82,#c9a04c);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 0 #7d6330,0 6px 12px rgba(0,0,0,.45)}
.btn.pri:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 0 #7d6330}
.seg{display:flex;margin-top:14px;border-radius:12px;padding:3px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(217,178,95,.25)}
.seg button{flex:1;min-height:42px;border-radius:9px;font-size:16px;color:var(--dim);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--brass);color:#2a1a08;font-weight:700}
.lab{margin-top:16px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.rec{margin-top:14px;font-size:14px;color:var(--dim);font-style:italic}
.big{font-size:56px;font-variant-numeric:tabular-nums;color:var(--brass-hi);line-height:1;margin:10px 0 2px}
.sheet.corner{place-items:end center;background:linear-gradient(transparent 30%,rgba(10,6,4,.7))}
.toast{position:absolute;left:50%;top:50%;translate:-50% -50%;padding:10px 20px;border-radius:30px;background:rgba(10,6,4,.85);box-shadow:inset 0 0 0 1.5px var(--brass);font-style:italic;font-size:19px;color:var(--brass-hi);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (max-width:520px){.chip .p i{display:inline!important;margin-left:3px}.hud{gap:6px;padding:8px}.chip{gap:6px;padding:5px 9px 5px 6px}.chip .n{font-size:10px;letter-spacing:.08em}.chip .sc{font-size:20px}.chip .dot{width:20px;height:20px}.ib{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){
  .ck.can .disc,.mk,.die.ghost .face{animation:none}
  .ck{--mv:.01s!important}
  .card,.sheet{transition-duration:.01s}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <button class="ib" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="chip" id="cB"><i class="dot b"></i><span class="t"><span class="n">Computer</span><span class="p"><b id="pB">167</b><i>pips</i></span></span><span class="sc"><b id="sB">0</b><small class="tg"></small></span></div>
    <div class="chip" id="cW"><i class="dot w"></i><span class="t"><span class="n">You</span><span class="p"><b id="pW">167</b><i>pips</i></span></span><span class="sc"><b id="sW">0</b><small class="tg"></small></span></div>
    <button class="ib" id="bUndo" aria-label="Undo move" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  </header>
  <div class="foot"><div id="status" aria-live="polite"></div></div>
  <main id="stage"><div id="board"><svg id="bsvg" role="img" aria-label="Backgammon board"></svg><div id="layer"></div><div class="toast" id="toast"></div></div></main>
</div>

<div class="sheet" id="shTitle"><div class="card">
  <div class="pair"><i style="background:radial-gradient(circle at 36% 30%,#fffbe9,#e3d4a9 70%);box-shadow:0 2px 0 #8c7a52"></i><i style="background:radial-gradient(circle at 36% 30%,#ff9a7c,#c93d24 70%);box-shadow:0 2px 0 #6b1b0d"></i></div>
  <h1>Backgammon</h1><div class="sub">Two dice. Fifteen checkers.</div>
  <button class="btn pri" id="bResume" hidden style="margin-top:20px">Resume match</button>
  <div class="lab" style="margin-top:20px">First to</div>
  <div class="seg" id="segTarget" role="group" aria-label="Match length"><button data-v="1">1 point</button><button data-v="3">3 points</button><button data-v="5">5 points</button></div>
  <div class="lab">Computer</div>
  <div class="seg" id="segLevel" role="group" aria-label="Computer strength"><button data-v="easy">Easy</button><button data-v="medium">Medium</button><button data-v="hard">Hard</button></div>
  <button class="btn pri" id="bCpu" style="margin-top:18px">Play the computer</button>
  <button class="btn" id="bTwo" style="min-height:44px;font-size:16px;background:none;box-shadow:inset 0 0 0 1.5px rgba(217,178,95,.4)">Two players, one device</button>
  <div class="rec" id="rec"></div>
</div></div>

<div class="sheet" id="shMenu"><div class="card">
  <h2>Paused</h2>
  <button class="btn pri" id="mBack">Back to the board</button>
  <button class="btn" id="mSound">Sound on</button>
  <button class="btn" id="mNew">New match</button>
</div></div>

<div class="sheet corner" id="shOver"><div class="card">
  <div class="sub" id="oKind"></div>
  <h2 id="oTitle"></h2>
  <div class="big" id="oScore"></div>
  <div class="rec" id="oNote"></div>
  <button class="btn pri" id="oNext">Next game</button>
  <button class="btn" id="oMenu">Menu</button>
</div></div>

<script id="core">
/* Backgammon core: board, dice, legal moves, scoring, computer players. DOM-free; test/backgammon.mjs runs this block.
   White (+1, the player's ivory) moves 24 -> 1 and bears off from 1..6; Black (-1, vermilion) moves 1 -> 24 and bears off from 19..24.
   A move is {from: 'bar' | 1..24, to: 1..24 | 'off', die}. */
const Core = (() => {
  const W = 1, B = -1;
  const ix = c => (c === W ? 0 : 1);
  const rng = s => { s.rng = (s.rng + 0x6D2B79F5) >>> 0; let t = s.rng; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const rollDie = s => 1 + Math.floor(rng(s) * 6);

  function startPts() {
    const p = new Array(25).fill(0);
    p[24] = 2; p[13] = 5; p[8] = 3; p[6] = 5;
    p[1] = -2; p[12] = -5; p[17] = -3; p[19] = -5;
    return p;
  }
  function newGame(opts = {}) {
    const seed = (opts.seed == null ? Math.floor(Math.random() * 2 ** 31) : opts.seed) >>> 0;
    return {
      pts: startPts(), bar: [0, 0], off: [0, 0], turn: W, dice: [], left: [], phase: 'open', hist: [],
      rng: seed, aiRng: (seed ^ 0x9E3779B9) >>> 0, seed,
      score: opts.score ? opts.score.slice() : [0, 0], target: opts.target || 3, game: opts.game || 1, result: null,
    };
  }
  const clone = s => ({...s, pts: s.pts.slice(), bar: s.bar.slice(), off: s.off.slice(), left: s.left.slice(), dice: s.dice.slice(), hist: s.hist.slice(), score: s.score.slice(), result: s.result});

  const own = (s, c, p) => (s.pts[p] * c > 0 ? Math.abs(s.pts[p]) : 0);
  function allHome(s, c) {
    if (s.bar[ix(c)]) return false;
    if (c === W) { for (let p = 7; p <= 24; p++) if (s.pts[p] > 0) return false; }
    else { for (let p = 1; p <= 18; p++) if (s.pts[p] < 0) return false; }
    return true;
  }
  const dist = (c, p) => (c === W ? p : 25 - p);           // pips from point p to off, for colour c

  function single(s, c, die) {
    const out = [];
    if (s.bar[ix(c)] > 0) {
      const to = c === W ? 25 - die : die;
      if (s.pts[to] * c >= -1) out.push({from: 'bar', to, die});
      return out;
    }
    const home = allHome(s, c);
    for (let p = 1; p <= 24; p++) {
      if (!(s.pts[p] * c > 0)) continue;
      const to = p - c * die;
      if (to >= 1 && to <= 24) { if (s.pts[to] * c >= -1) out.push({from: p, to, die}); continue; }
      if (!home) continue;
      if (die === dist(c, p)) out.push({from: p, to: 'off', die});
      else if (die > dist(c, p)) {
        let further = false;
        for (let q = 1; q <= 24; q++) if (s.pts[q] * c > 0 && dist(c, q) > dist(c, p)) { further = true; break; }
        if (!further) out.push({from: p, to: 'off', die});
      }
    }
    return out;
  }

  function doMove(s, m) {
    const c = s.turn, rec = {c, from: m.from, to: m.to, die: m.die, hit: false};
    if (m.from === 'bar') s.bar[ix(c)]--; else s.pts[m.from] -= c;
    if (m.to === 'off') s.off[ix(c)]++;
    else { if (s.pts[m.to] * c === -1) { s.pts[m.to] = 0; s.bar[ix(-c)]++; rec.hit = true; } s.pts[m.to] += c; }
    s.left.splice(s.left.indexOf(m.die), 1);
    return rec;
  }
  function undoMove(s, r) {
    const c = r.c;
    if (r.to === 'off') s.off[ix(c)]--; else { s.pts[r.to] -= c; if (r.hit) { s.bar[ix(-c)]--; s.pts[r.to] = -c; } }
    if (r.from === 'bar') s.bar[ix(c)]++; else s.pts[r.from] += c;
    s.left.push(r.die);
  }
  const key = s => s.pts.join(',') + '|' + s.bar + '|' + s.off + '|' + s.left.slice().sort().join('') + '|' + s.turn;

  $('oKind').textContent = r.kind === 'single' ? 'Game ' + S.game : r.kind === 'gammon' ? 'Gammon' : 'Backgammon';
  $('oTitle').textContent = mw ? (you ? (mw === W ? 'You win the match' : 'The computer wins the match') : (mw === W ? 'Ivory wins the match' : 'Vermilion wins the match')) : name + (you && r.winner === W ? ' win' : ' wins') + (r.mult > 1 ? ' ×' + r.mult : '');
  $('oScore').textContent = S.score[0] + ' – ' + S.score[1];
  $('oNote').textContent = mw ? 'First to ' + S.target + ' point' + (S.target > 1 ? 's' : '') : 'First to ' + S.target + ' point' + (S.target > 1 ? 's' : '');
  $('oNext').textContent = mw ? 'Play again' : 'Next game';
  store.save = null; if (mw) { } else store.save = Core.save(S);
  persist(); show('shOver');
}
$('oNext').onclick = () => {
  hide('shOver');
  const mw = Core.matchWinner(S);
  if (mw) startMatch(cfg); else { S = Core.newGame({seed: nextSeed(), score: S.score, target: S.target, game: S.game + 1}); begin(); }
};
$('oMenu').onclick = () => { hide('shOver'); openTitle(); };

// ---------- sheets and setup ----------
const show = id => $(id).classList.add('show'), hide = id => $(id).classList.remove('show');
function toggleMenu() {
  if ($('shTitle').classList.contains('show') || $('shOver').classList.contains('show')) return;
  $('shMenu').classList.toggle('show'); $('mSound').textContent = store.sound ? 'Sound on' : 'Sound off';
}
$('bMenu').onclick = toggleMenu; $('mBack').onclick = toggleMenu;
$('mSound').onclick = () => { $('mSound').textContent = Snd.toggle() ? 'Sound on' : 'Sound off'; };
$('mNew').onclick = () => { hide('shMenu'); openTitle(); };
function seg(id, key, get, set) {
  const el = $(id); el.querySelectorAll('button').forEach(b => { b.onclick = () => { set(b.dataset.v); paint(); }; });
  function paint() { el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(get())))); }
  paint(); return paint;
}
const urlSeed = (() => { const m = /[?&]seed=(\d+)/.exec(location.search); return m ? +m[1] : null; })();
let seedN = 0;
const nextSeed = () => urlSeed != null ? urlSeed + (seedN++) : undefined;
function openTitle() {
  runId++; busy = false; sel = null;
  const rec = store.record; $('rec').textContent = rec.w + rec.l ? 'Against the computer: ' + rec.w + ' won, ' + rec.l + ' lost' : '';
  const sv = store.save && Core.load(store.save); $('bResume').hidden = !sv || sv.phase === 'over';
  show('shTitle');
}
function startMatch(c) {
  cfg = Object.assign({}, c); store.cfg = Object.assign({}, c); store.save = null;
  S = Core.newGame({seed: nextSeed(), target: +c.target}); begin();
}
function begin() {
  hide('shTitle'); hide('shMenu'); hide('shOver');
  while (diceEls.length) diceEls.pop().remove();
  busy = false; sel = null; resetStacks(); fit(); persist();
  run(++runId);
}
const pick = {mode: 'cpu', level: store.cfg.level, target: store.cfg.target};
const p1 = seg('segLevel', 'level', () => pick.level, v => { pick.level = v; }), p2 = seg('segTarget', 'target', () => pick.target, v => { pick.target = +v; });
$('bCpu').onclick = () => { Snd.init(); startMatch({mode: 'cpu', level: pick.level, target: pick.target}); };
$('bTwo').onclick = () => { Snd.init(); startMatch({mode: '2p', level: pick.level, target: pick.target}); };
$('bResume').onclick = () => {
  Snd.init(); const s = Core.load(store.save); if (!s) return;
  cfg = Object.assign({}, store.cfg); S = s; hide('shTitle'); resetStacks(); fit(); run(++runId);
};
function save() { try { store.save = S.phase === 'over' ? null : Core.save(S); store.cfg = cfg; persist(); } catch (e) {} }

new ResizeObserver(() => fit()).observe($('stage'));
window.addEventListener('pagehide', save);
window.BG = {get S() { return S; }, Core, get L() { return L; }, set S(v) { S = v; }, begin: () => { resetStacks(); fit(); }, setDice, select, show, hide, say, get cfg() { return cfg; }, set cfg(v) { cfg = v; }, refresh, resetStacks, fit, toast, get stk() { return stk; }, get busy() { return busy; }, tumble, diceEls: () => diceEls, get sel() { return sel; }, set diceOwner(v) { diceOwner = v; }};

// first paint: a dimmed board behind the title sheet
S = Core.newGame({seed: 7}); S.phase = 'roll'; resetStacks(); fit(); hud();
if (/[?&]mock/.test(location.search)) {} else openTitle();
})();
</script>
