<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Skyline — Stack Glass Towers, Build a City Incremental</title>
<meta name="description" content="Skyline is a one-tap stacking incremental: drop glass floors, chain perfects, weather storms and catch supply blimps as the sky turns to night. Every tower stays in your city and pays rent; spend it on four branches of plans, hire a crane, then found new districts for blueprints and the architect's office. Free, no install.">
<link rel="canonical" href="https://www.gptgames.dev/games/skyline.html">
<meta name="theme-color" content="#2a2450">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Text:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff4e4; --ink:#1d1838; --amber:#f0b27a; --window:#ffd27a; --rose:#e58a73;
  --panel:rgba(26,22,52,.86); --line:rgba(255,244,228,.16);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2450;color:var(--cream);
  font-family:'Big Shoulders Text',system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--window);outline-offset:3px}
.ui{position:fixed;inset:0;pointer-events:none}
.ui > *{pointer-events:auto}
.hide{opacity:0!important;pointer-events:none!important}
.fade{transition:opacity .28s ease, transform .45s cubic-bezier(.2,.9,.25,1)}
.fade:not(.hide){transition-delay:.22s}

/* ---------- city screen ---------- */
#title{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 28px);text-align:center;pointer-events:none}
#title h1{margin:0;font:900 clamp(46px,12vw,92px)/.82 'Big Shoulders Display',Impact,sans-serif;letter-spacing:.06em;
  color:var(--cream);text-shadow:0 2px 0 rgba(120,50,70,.35),0 10px 30px rgba(60,20,60,.35)}
#title p{margin:10px 0 0;font:700 15px/1 'Big Shoulders Text',sans-serif;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,244,228,.78)}
#title p b{color:var(--cream);font-weight:800}
#cta{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;
  font:800 17px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;
  background:var(--cream);color:var(--ink);padding:12px 18px 11px;border-radius:999px;
  box-shadow:0 8px 24px rgba(30,15,50,.35)}
#cta::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--cream);
  transform:translateX(-50%) rotate(45deg);border-radius:2px}
#cta span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px 8px;font:800 18px/1 'Big Shoulders Text',sans-serif;letter-spacing:.06em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#cash{position:absolute;right:14px;top:calc(var(--safe-t) + 14px);font-variant-numeric:tabular-nums}
#cash i{font-style:normal;color:var(--window)}
#rent{display:block;font:700 11px/1 'Big Shoulders Text',sans-serif;letter-spacing:.14em;color:rgba(255,244,228,.6);
  position:absolute;right:16px;top:calc(var(--safe-t) + 56px);text-transform:uppercase}
.round{position:absolute;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.round svg{width:22px;height:22px;stroke:var(--cream);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sound,#pausebtn{left:14px;top:calc(var(--safe-t) + 12px)}
#permitsbtn{position:absolute;left:50%;bottom:calc(var(--safe-b) + 22px);transform:translateX(-50%);
  font:800 17px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;
  padding:14px 22px 13px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#permitsbtn svg{width:20px;height:20px;stroke:var(--window);fill:none;stroke-width:2}
#permitsbtn em{font-style:normal;background:var(--window);color:var(--ink);border-radius:999px;font-size:13px;
  padding:4px 7px 3px;letter-spacing:.04em}

/* ---------- build HUD ---------- */
#floor{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 18px);text-align:center;pointer-events:none;
  font:900 clamp(72px,20vw,112px)/.8 'Big Shoulders Display',Impact,sans-serif;color:var(--cream);
  font-variant-numeric:tabular-nums;text-shadow:0 4px 24px rgba(30,15,50,.35)}
#floor.bump{animation:bump .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1.14)}100%{transform:scale(1)}}
#chain{position:absolute;left:50%;top:calc(var(--safe-t) + 18px + clamp(72px,20vw,112px)*.8 + 12px);transform:translateX(-50%);
  pointer-events:none;font:800 15px/1 'Big Shoulders Text',sans-serif;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink);background:var(--cream);border-radius:999px;padding:7px 12px 6px 14px;opacity:0;white-space:nowrap}
#chain.on{animation:chain 1.1s ease-out forwards}
#chain.grow{background:var(--window)}
@keyframes chain{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.9)}12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.06)}
  24%{transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-4px)}}
#earn{position:absolute;right:14px;top:calc(var(--safe-t) + 14px);font-variant-numeric:tabular-nums}
#earn i{font-style:normal;color:var(--window)}

/* ---------- cards & sheets ---------- */
.card{position:absolute;left:50%;bottom:calc(var(--safe-b) + 20px);width:min(420px,calc(100% - 28px));
  transform:translate(-50%,0);background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:20px 20px 18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(20,10,40,.45)}
.card.hide{transform:translate(-50%,40px)}
#result .big{display:flex;align-items:baseline;gap:10px}
#result .big b{font:900 76px/.8 'Big Shoulders Display',Impact,sans-serif;font-variant-numeric:tabular-nums}
#result .big span{font:800 20px/1 'Big Shoulders Text',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,244,228,.75)}
#bestv{margin-left:auto;align-self:center;font:700 13px/1 'Big Shoulders Text',sans-serif;letter-spacing:.16em;text-transform:uppercase;font-style:normal;color:rgba(255,244,228,.65)}
#record{margin-left:auto;align-self:center;font:800 12px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink);background:var(--window);border-radius:999px;padding:6px 10px 5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{border-top:1px solid var(--line);padding-top:9px}
.stats small{display:block;font:700 12px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,244,228,.6)}
.stats b{display:block;margin-top:6px;font:800 26px/1 'Big Shoulders Display',sans-serif;font-variant-numeric:tabular-nums}
.stats b.gold{color:var(--window)}
.rrent{margin:-6px 0 14px;font:700 13px/1.2 'Big Shoulders Text',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,244,228,.66)}
.rrent b{color:var(--window)}
.row{display:flex;gap:10px}
.btn{flex:1;height:54px;border-radius:16px;font:800 18px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;
  background:var(--cream);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{flex:0 0 54px;background:rgba(255,244,228,.1);color:var(--cream);display:grid;place-items:center}
.btn.ghost.wide{flex:0 0 84px}
.btn.ghost.plans{flex:0 0 112px;display:flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost.plans em{font-style:normal;background:var(--window);color:var(--ink);border-radius:999px;font-size:13px;padding:4px 7px 3px;letter-spacing:.02em}
@media (max-width:400px){.btn{letter-spacing:.1em;font-size:16px}.btn.ghost.wide{flex-basis:70px}.btn.ghost.plans{flex-basis:100px}}
.btn.ghost svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#sheetback{position:absolute;inset:0;background:rgba(14,10,30,.35)}
#permits{bottom:0;border-radius:24px 24px 0 0;padding-bottom:calc(var(--safe-b) + 22px);max-height:86vh;overflow:auto;width:min(460px,100%)}
#permits.card{bottom:0}
#permits header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
#permits h2{margin:0;font:900 34px/1 'Big Shoulders Display',sans-serif;letter-spacing:.06em;text-transform:uppercase}
#permits header span{font:800 18px/1 'Big Shoulders Text',sans-serif;font-variant-numeric:tabular-nums}
#permits header span i{font-style:normal;color:var(--window)}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,244,228,.28);margin:-8px auto 12px}
.perm button{position:relative;overflow:hidden}
.perm button i{position:absolute;left:0;bottom:0;height:4px;background:var(--window);border-radius:0 2px 2px 0;transition:width .4s ease}
.perm{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.perm svg{width:44px;height:44px}
.perm h3{margin:0;font:800 18px/1.1 'Big Shoulders Text',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.perm p{margin:3px 0 6px;font:500 14px/1.25 'Big Shoulders Text',sans-serif;color:rgba(255,244,228,.72)}
.pips{display:flex;gap:4px}.pips i{width:14px;height:4px;border-radius:2px;background:rgba(255,244,228,.34)}.pips i.on{background:var(--window)}
.perm button{min-width:84px;height:44px;border-radius:12px;background:var(--cream);color:var(--ink);
  font:800 17px/1 'Big Shoulders Text',sans-serif;letter-spacing:.06em;font-variant-numeric:tabular-nums;transition:transform .12s}
.perm button:active{transform:scale(.95)}
.perm button:disabled{background:rgba(255,244,228,.12);color:rgba(255,244,228,.45);cursor:default}
.perm.flash{animation:flash .5s ease-out}
@keyframes flash{0%{background:rgba(255,210,122,.25)}100%{background:transparent}}

#toast{position:absolute;left:50%;top:calc(var(--safe-t) + 150px);transform:translateX(-50%);white-space:nowrap;
  font:800 16px/1 'Big Shoulders Text',sans-serif;letter-spacing:.12em;text-transform:uppercase}
#toast.hide{transform:translate(-50%,-10px)}
#toast i{font-style:normal;color:var(--window)}

#pause{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,10,30,.45);text-align:center}
#pause b{display:block;font:900 54px/1 'Big Shoulders Display',sans-serif;letter-spacing:.08em}
#pause small{font:700 14px/1 'Big Shoulders Text',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,244,228,.7)}
#pause .row{margin-top:22px;justify-content:center}
#pause .btn{flex:0 0 auto;padding:0 26px}

/* ---------- loadout, build extras, plans ---------- */
#loadout{position:absolute;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;white-space:nowrap;width:max-content;max-width:calc(100% - 24px)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button,.tog{font:800 12px/1 'Big Shoulders Text',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:9px 9px 8px;border-radius:999px;color:rgba(255,244,228,.7);transition:background .2s,color .2s}
.seg button.on{background:var(--cream);color:var(--ink)}
.tog{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tog.on{background:var(--window);color:var(--ink);border-color:var(--window)}
#hudr{position:absolute;right:14px;top:calc(var(--safe-t) + 16px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
#struts{display:flex;gap:5px}
#struts i{position:relative;width:14px;height:22px;transition:opacity .3s,transform .3s;filter:drop-shadow(0 2px 4px rgba(20,10,40,.4))}
#struts i::before{content:'';position:absolute;inset:0;background:var(--cream);clip-path:polygon(0 0,100% 0,100% 18%,64% 18%,64% 82%,100% 82%,100% 100%,0 100%,0 82%,36% 82%,36% 18%,0 18%)}
#struts i.gone{opacity:.18;transform:scaleY(.6)}
#rush{background:var(--window);color:var(--ink);border-radius:999px;padding:7px 12px 6px;font:800 14px/1 'Big Shoulders Text',sans-serif;letter-spacing:.14em;text-transform:uppercase;position:relative;overflow:hidden}
#rush i{position:absolute;left:0;bottom:0;height:3px;background:var(--ink);opacity:.5}
#stormchip{position:absolute;left:50%;top:calc(var(--safe-t) + 18px + clamp(72px,20vw,112px)*.8 + 52px);transform:translateX(-50%);
  font-size:14px;letter-spacing:.18em;text-transform:uppercase;padding:8px 12px 7px;gap:7px;overflow:hidden;pointer-events:none}
#stormchip svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:2;stroke-linecap:round}
#stormchip i{position:absolute;left:0;bottom:0;height:5px;background:#9fb8ff}
#vaultbtn,#cranebtn{position:absolute;bottom:calc(var(--safe-b) + 20px);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#vaultbtn{left:16px}#cranebtn{right:16px;bottom:calc(var(--safe-b) + 70px)}
#vaultbtn svg{position:absolute;inset:4px;width:56px;height:56px;transform:rotate(-90deg)}
#vaultbtn .track{fill:none;stroke:rgba(255,244,228,.16);stroke-width:4}
#vaultbtn .fill{fill:none;stroke:var(--window);stroke-width:4;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray .3s ease}
#vaultbtn span,#cranebtn span{font:800 11px/1 'Big Shoulders Text',sans-serif;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
#vaultbtn.full{background:var(--window);color:var(--ink);animation:ready 1s ease-in-out infinite}
#vaultbtn.full .track,#vaultbtn.full .fill{stroke:var(--ink)}
@keyframes ready{50%{transform:scale(1.07)}}
#cranebtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cranebtn{flex-direction:column;align-content:center;gap:3px;display:flex;justify-content:center;align-items:center}
#cranebtn.on{background:var(--window);color:var(--ink)}
.tabs{display:flex;gap:4px}
.tabs button{font:900 22px/1 'Big Shoulders Display',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,244,228,.42);padding:4px 8px 6px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tabs button.on{color:var(--cream);border-color:var(--window)}
#pwallet{font:800 18px/1 'Big Shoulders Text',sans-serif;font-variant-numeric:tabular-nums}
#pwallet i{font-style:normal;color:var(--window)}
.branch{margin:10px 0 2px;display:flex;align-items:baseline;gap:10px}
.branch b{font:800 13px/1 'Big Shoulders Text',sans-serif;letter-spacing:.24em;text-transform:uppercase}
.branch span{font:500 13px/1 'Big Shoulders Text',sans-serif;color:rgba(255,244,228,.55)}
.perm.locked{opacity:.42}
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 0;background:rgba(255,244,228,.06);border-radius:12px;padding:3px}
.subtabs button{position:relative;font:800 13px/1 'Big Shoulders Text',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:10px 2px 9px;border-radius:9px;color:rgba(255,244,228,.6)}
.subtabs button.on{background:var(--cream);color:var(--ink)}
.subtabs em{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--window)}
.perm.owned{grid-template-columns:44px 1fr auto;padding:8px 0;opacity:.75}
.perm.owned > span:first-child{display:grid;place-items:center;width:44px;color:var(--window);font:800 18px/1 sans-serif}
.perm.owned h3{font-size:15px}
.perm > div{min-width:0}
.perm h3,.perm p{overflow-wrap:anywhere}
.perm .lv{font:800 12px/1 'Big Shoulders Text',sans-serif;letter-spacing:.14em;color:var(--window)}
.tab.hide{display:none}
.bp{display:flex;align-items:center;gap:14px;padding:14px 0 6px}
.bp b{font:900 44px/.9 'Big Shoulders Display',sans-serif;color:#9fd0ff}
.bp p{margin:0;font:500 14px/1.3 'Big Shoulders Text',sans-serif;color:rgba(255,244,228,.72)}
.found{width:100%;margin:8px 0 6px}
.found:disabled{background:rgba(255,244,228,.12);color:rgba(255,244,228,.5)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ach div{border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;opacity:.45}
.ach div.got{opacity:1;border-color:rgba(255,210,122,.5)}
.ach b{display:block;font:800 15px/1.1 'Big Shoulders Text',sans-serif;letter-spacing:.05em;text-transform:uppercase}
.ach small{display:block;margin-top:3px;font:500 13px/1.2 'Big Shoulders Text',sans-serif;color:rgba(255,244,228,.7)}
.ach em{font-style:normal;color:#9fd0ff;font:700 12px/1 'Big Shoulders Text',sans-serif;letter-spacing:.1em}
.lifestats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.lifestats div{border-top:1px solid var(--line);padding-top:8px}
.lifestats small{display:block;font:700 11px/1 'Big Shoulders Text',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,244,228,.6)}
.lifestats b{display:block;margin-top:5px;font:800 22px/1 'Big Shoulders Display',sans-serif}
@media (max-width:520px){#title{top:calc(var(--safe-t) + 66px)}#title p{font-size:16px;letter-spacing:.14em}#toast{top:calc(var(--safe-t) + 190px)}}
@media (prefers-reduced-motion:reduce){
  #floor.bump,#cta span{animation:none}
  .fade{transition:opacity .2s}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Skyline game"></canvas>

<div class="ui" id="ui">
  <div id="title" class="fade"><h1>SKYLINE</h1><p id="sub"></p></div>
  <div id="cta" class="fade hide"><span>Tap to build</span></div>
  <div id="cash" class="chip fade" aria-live="polite"><i>$</i><span id="cashv">0</span></div>
  <div id="rent" class="fade"></div>
  <button id="sound" class="round fade" aria-label="Sound on"></button>
  <div id="loadout" class="fade hide"></div>
  <button id="permitsbtn" class="fade"><svg viewBox="0 0 24 24"><path d="M3 21h18M6 21V9h12v12M9 9V5h6v4"/><path d="M10 13h4M10 17h4"/></svg>Plans<em id="permitbadge" class="hide">!</em></button>

  <div id="floor" class="fade hide">0</div>
  <div id="chain"></div>
  <div id="earn" class="chip fade hide"><i>+$</i><span id="earnv">0</span></div>
  <button id="pausebtn" class="round fade hide" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
  <div id="hudr" class="fade hide"><div id="struts" aria-label="Safety struts"></div><div id="rush" class="hide"><b>Rush ×3</b><i></i></div></div>
  <div id="stormchip" class="chip fade hide"><svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 10-3-3M3 12h16a3 3 0 11-3 3M3 16h8"/></svg><span>Storm coming</span><i></i></div>
  <button id="vaultbtn" class="fade hide" aria-label="Cash the vault"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" class="track"/><circle cx="22" cy="22" r="19" class="fill" pathLength="100"/></svg><span>Vault</span></button>
  <button id="cranebtn" class="fade hide" aria-label="Crane"><svg viewBox="0 0 24 24"><path d="M5 21V4h2M5 4h15l-4 4M7 4l5 4M16 4v5M16 9v3"/><path d="M14.5 12h3l-1.5 2z"/><path d="M3 21h6"/></svg><span>Crane</span></button>

  <div id="toast" class="chip fade hide"></div>

  <div id="result" class="card fade hide" role="dialog" aria-label="Tower finished">
    <div class="big"><b id="rfloors">0</b><span id="rlabel">floors</span><em id="record" class="hide">New record</em><em id="bestv" class="hide"></em></div>
    <div class="stats">
      <div><small>Perfect drops</small><b id="rperf">0</b></div>
      <div><small>Longest chain</small><b id="rchain">0</b></div>
      <div><small>Earned</small><b class="gold" id="rearn">$0</b></div>
    </div>
    <p id="rrent" class="rrent"></p>
    <div class="row">
      <button class="btn ghost wide" id="tocity">City</button>
      <button class="btn ghost plans" id="toplans">Plans<em id="plancount" class="hide"></em></button>
      <button class="btn" id="again">Build next</button>
    </div>
  </div>

    {id: 'window',    base: 1, k: 1.6, max: 8},
    {id: 'surge',     base: 1, k: 1.7, max: 10},
    {id: 'mason',     base: 2, k: 1.8, max: 6},
    {id: 'weather',   base: 2, k: 1.7, max: 8},
    {id: 'night',     base: 1, k: 1.6, max: 8},
    {id: 'servos',    base: 2, k: 1.9, max: 6},
    {id: 'zoning',    base: 1, k: 1.7, max: 8},
    {id: 'harmonics', base: 2, k: 1.7, max: 10},
    {id: 'cranes',    base: 1, k: 1.5, max: 6},

    heavy:    {pay: 0.7, wide: 1.2, drift: 0.8, req: 'heavy'},
    light:    {pay: 1.8, wide: 1.0, drift: 1.45, req: 'light'},

    {id: 'floors_50',  reward: 3,  test: st => st.bestEver >= 50},
    {id: 'floors_100', reward: 8,  test: st => st.bestEver >= 100},
    {id: 'floors_150', reward: 20, test: st => st.bestEver >= 150},
    {id: 'chain_10',   reward: 2,  test: st => st.bestChain >= 10},
    {id: 'chain_25',   reward: 6,  test: st => st.bestChain >= 25},
    {id: 'chain_50',   reward: 20, test: st => st.bestChain >= 50},
    {id: 'perfect_500', reward: 10, test: st => st.perfects >= 500},
    {id: 'golden_1',   reward: 2,  test: st => st.goldens >= 1},
    {id: 'rush_1',     reward: 2,  test: st => st.rushes >= 1},
    {id: 'storm_10',   reward: 3,  test: st => st.bestStormFloors >= 10},
    {id: 'storm_100',  reward: 10, test: st => st.stormFloors >= 100},
    {id: 'towers_10',  reward: 4,  test: st => st.mostTowers >= 10},
    {id: 'district_1', reward: 2,  test: st => st.districts >= 1},
    {id: 'district_5', reward: 15, test: st => st.districts >= 5},
    {id: 'rich_10k',   reward: 5,  test: st => st.lifetime >= 1e4},
    {id: 'rich_1m',    reward: 15, test: st => st.lifetime >= 1e6},

  const archLevels = a => clampLevels(ARCH, a);

      vault: L.vault > 0,

      base: 2 * (1 + 0.15 * L.value),
      height: 0.03 * (1 + 0.15 * L.altitude),
      perfMult: 3 + 0.4 * L.perfect + 0.25 * A.surge,
      chainK: 0.4 * (1 + 0.08 * L.momentum),
      clean: 0.3 * L.clean,

      streak: 0, bestStreak: 0, perfects: 0, cuts: 0, aligns: 0, earned: 0, struts: p.struts, vault: 0,
      golden: false, goldens: 0, stormFloors: 0, over: false};

        }
        s.over = true;
        return {kind: 'miss', floor: n, piece: m, value: 0, streak: 0};

  function cashVault(s, ctx = {}) {

    const n = s.floors.length;
    const v = 8 * floorValue(s, n, 'perfect', s.streak, 1, false, !!ctx.rush);
    s.vault = 0; s.earned += v;
    return v;
  }

  // the crane: how far off it aims (as a fraction of the slab), and how often it drops
  function craneError(up, arch) {
    const L = levels(up), A = archLevels(arch);
    return Math.max(0.085 - 0.006 * A.servos, 0.22 * Math.pow(0.95, L.servo));
  }
  const craneRhythm = arch => Math.max(0.85, 1.15 - 0.05 * archLevels(arch).cranes);

  const towerFloors = t => Math.max(0, (t.f || t.floors || t).length - 1);
  function rentPerHour(towers, up, arch) {
    const L = levels(up), A = archLevels(arch);

    for (const t of towers) f += towerFloors(t);

    const d = Math.floor((Math.sqrt(8 * i + 1) - 1) / 2);
    const k = i - d * (d + 1) / 2;
    return {a: k, b: d - k, diag: d};
  }
  function plotPos(i) {
    const p = plot(i);
    return {x: p.a * SPACING, z: p.b * SPACING, diag: p.diag};
  }
  return {BASE, SLAB, PLINTH, RANGE, GROW, SPACING, GRID, GOLDEN_CHANCE, GOLDEN_MULT, RUSH_MULT, RUSH_DUR, STORM_BUILD,
    PRESTIGE_MIN, VAULT_FILL, UPGRADES, ARCH, TYPES, ACHIEVEMENTS, levels, archLevels, cost, archCost, unlocked,
    typeOpen, params, speedAt, axisOf, offset, newRun, mover, storm, step, drop, cashVault, floorValue, chainMult,
    craneError, craneRhythm, towerFloors, rentPerHour, rentCapHours, offlineRent, blueprints, newAchievements,
    plot, plotPos};
})();

</script>

const STATS0 = () => ({bestEver: 0, bestChain: 0, perfects: 0, goldens: 0, rushes: 0, stormFloors: 0, bestStormFloors: 0,

/* ---------------- audio ---------------- */
const Sound = {
  ac: null, out: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = this.ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      this.out = this.ac.createGain(); this.out.gain.value = 0.55;
      this.out.connect(comp); comp.connect(this.ac.destination);
      const len = this.ac.sampleRate;
      this.noiseBuf = this.ac.createBuffer(1, len, len);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  ok() { return this.ac && !save.muted; },
  tone(f, dur, {type = 'sine', gain = .2, at = 0, slide = 0, attack = .004} = {}) {
    const t = this.ac.currentTime + at, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .05);
  },
  noise(dur, freq, {gain = .2, at = 0, q = 1, type = 'lowpass', to = 0} = {}) {
    const t = this.ac.currentTime + at, s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  },
  note(step) { // C major pentatonic, climbing
    const sc = [0, 2, 4, 7, 9];
    const semis = 12 * Math.floor(step / 5) + sc[step % 5];
    return 523.25 * Math.pow(2, semis / 12);
  },
  perfect(streak) {
    if (!this.ok()) return;
    const f = this.note(Math.min(streak - 1, 14));
    this.tone(f, .9, {gain: .22});
    this.tone(f * 2, .5, {gain: .07, type: 'triangle'});
    this.tone(f * 4.07, .18, {gain: .05});
    this.noise(.05, 6000, {gain: .05, type: 'highpass'});
  },
  cut() {
    if (!this.ok()) return;
    this.tone(150, .18, {gain: .32, slide: 55});
    this.noise(.14, 1100, {gain: .26});
    this.noise(.35, 2400, {gain: .06, at: .06, type: 'bandpass', q: .8, to: 500});
  },
  place() { if (this.ok()) this.tone(330, .12, {gain: .05, type: 'triangle'}); },
  grow() {
    if (!this.ok()) return;
    [0, 4, 7, 12].forEach((s, i) => this.tone(1046.5 * Math.pow(2, s / 12), .35, {gain: .07, at: .05 + i * .055}));
  },
  miss() {
    if (!this.ok()) return;
    this.tone(220, .7, {gain: .22, slide: 60, type: 'triangle'});
    this.noise(.8, 2600, {gain: .12, to: 200, type: 'bandpass', q: .7});
  },
  tick() { if (this.ok()) this.tone(1400, .04, {gain: .05}); },
  align() { if (!this.ok()) return; this.tone(660, .16, {gain: .1, type: 'triangle'}); this.noise(.05, 3000, {gain: .05, type: 'highpass'}); },
  strut() { if (!this.ok()) return; this.tone(90, .35, {gain: .3, slide: 50}); this.tone(1200, .25, {gain: .08, type: 'square', slide: 400}); this.noise(.3, 1800, {gain: .2}); },
  golden() { if (!this.ok()) return; [0, 7, 12, 16, 19].forEach((s, i) => this.tone(784 * Math.pow(2, s / 12), .5, {gain: .08, at: i * .045})); },
  vault() { if (!this.ok()) return; [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => this.tone(523 * Math.pow(2, s / 12), .4, {gain: .09, at: i * .05, type: 'triangle'})); },
  horn() { if (!this.ok()) return; this.tone(196, .6, {gain: .14, type: 'sawtooth', attack: .05}); this.tone(247, .6, {gain: .1, type: 'sawtooth', attack: .05, at: .02}); },
  thunder() { if (!this.ok()) return; this.noise(1.6, 400, {gain: .35, to: 60}); },
  wind: null,
  setWind(w) {
    if (!this.ac) return;
    if (!this.wind) {
      const src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
      src.buffer = this.noiseBuf; src.loop = true; f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = .6; g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(this.out); src.start();

    }
    const v = save.muted ? 0 : Math.min(.22, w * .14);
    this.wind.g.gain.setTargetAtTime(v, this.ac.currentTime, .3);
    this.wind.f.frequency.setTargetAtTime(380 + 500 * Math.min(w, 2) + 120 * Math.sin(perfNow * .0013), this.ac.currentTime, .2);
  },
  coin(i) { if (this.ok()) this.tone(1568 + i * 40, .09, {gain: .04, type: 'triangle'}); },
  buy() { if (!this.ok()) return; this.tone(784, .2, {gain: .12}); this.tone(1175, .3, {gain: .1, at: .08}); },
};

/* ---------------- state ---------------- */

let mode = 'city'; // city | intro | build | fall | result | permits ; paused is a flag over build
let paused = false;
let run = null, runPlot = null, runSeed = 0;
let modeT = 0, firstRun = false;
const cam = {x: 0, y: 0, z: 0, s: 1, ay: .62};
const camT = {x: 0, y: 0, z: 0, s: 1, ay: .62};
let tween = null; // {from, t, dur, arc}
let shake = 0;
const debris = [], rings = [], floats = [], sparks = [];
let settle = []; // per-floor settle offsets for the active tower
let moverIn = 0;  // 0..1 fade/drop-in of the new slab
let boardRing = 0; // eased board size
let hazeAmt = 0;  // neighbours fade into the air while you build
let cashShown = 0;
let lastResult = null;
let lastBuilt = -1, lastFade = 1; // the tower just finished stays out of the haze until the next build
let demo = null; // bot driver for screenshots
let rushT = 0;                    // seconds of Rush Hour left
let blimp = null, blimpClock = 60; // the supply blimp and the build time until the next one
let craneAim = null, craneWait = 0, autoNext = -1;
let lightning = 0;
let demolish = null;              // towers of the district being left, fading out
const owned = id => (save.up[id] || 0) > 0;
const craneOn = () => save.crane && owned('crane');

/* ---------------- layout ---------------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  aimCamera(true);
}
const buildScale = () => Math.min(W, H * 0.66) * (W < 560 ? 0.40 : 0.46) / ((C.BASE * 2) * ISO_C);

function towerTop(floorsLen) { return C.PLINTH + (floorsLen - 1) * C.SLAB; }
function boardDiags() { return C.plot(save.towers.length).diag + 1; }

function aimCamera(snap) {
  if (mode === 'city') {
    // fit the board and its towers
    const D = demolish ? demolish.ring : boardDiags(), ext = D * C.SPACING;
    let maxH = 60;
    (demolish ? demolish.towers.map(d => d.t) : save.towers).forEach(t => { maxH = Math.max(maxH, towerTop(t.f.length) + (t.f.length > 61 ? 200 : 50)); });
    const half = C.SPACING / 2;
    const xs = [-half, ext - half];
    const widthW = (ext) * 2 * ISO_C, depthH = ext * 2 * ISO_S + 40;
    const narrow = W < 560, availW = W * (narrow ? .92 : .9), availH = H - (narrow ? 230 : 210);
    const s = Math.min(availW / widthW, availH / (depthH + maxH * 0.85), 1.4);
    camT.s = s;
    camT.x = (xs[0] + xs[1]) / 2; camT.z = camT.x;
    camT.y = maxH * 0.42;
    camT.ay = 0.5 + (narrow ? 95 : 50) / H;
  } else if (mode === 'intro' || mode === 'build' || mode === 'fall') {
    const top = towerTop(run.floors.length);
    camT.s = buildScale();
    camT.x = runPlot.x; camT.z = runPlot.z;
    camT.y = top + 30;
    camT.ay = 0.56;
  } else if (mode === 'result') {
    const top = towerTop(run.floors.length);
    camT.x = runPlot.x; camT.z = runPlot.z;
    const card = Math.min(300, 250 + Math.max(0, 560 - W) * 0), room = H - card - 90;
    camT.s = Math.min(buildScale(), room / (top + 230));
    camT.y = top * 0.5 + 30;
    camT.ay = (90 + room * .5) / H;
  }
  if (snap) { Object.assign(cam, camT); tween = null; }
}
function flyTo(dur, arc = 0) {
  if (reduced.matches) { dur = Math.min(dur, .3); arc = 0; }
  tween = {from: {...cam}, t: 0, dur, arc};
}
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ---------------- projection & drawing ---------------- */
let px = 0, py = 0;
function P(x, y, z) {
  px = W * 0.5 + ((x - cam.x) - (z - cam.z)) * ISO_C * cam.s;
  py = H * cam.ay + ((x - cam.x) + (z - cam.z)) * ISO_S * cam.s - (y - cam.y) * cam.s;
}
function quad(x1, y1, z1, x2, y2, z2, x3, y3, z3, x4, y4, z4) {
  ctx.beginPath();
  P(x1, y1, z1); ctx.moveTo(px, py); P(x2, y2, z2); ctx.lineTo(px, py);
  P(x3, y3, z3); ctx.lineTo(px, py); P(x4, y4, z4); ctx.lineTo(px, py); ctx.closePath();
}

const drawFloor3 = (...a) => drawFloor(...a);
// one glass floor; X,Z its world centre, f its footprint, n floor index (colour), seed for windows
function drawFloor(X, Z, f, n, y0, h, seed, alpha = 1, hz = 0, outline = false, tint = 0) {
  const p = pal(n, hz, tint), hw = f.w / 2, hd = f.d / 2;
  const x0 = X - hw, x1 = X + hw, z0 = Z - hd, z1 = Z + hd, y1 = y0 + h;
  const px1 = cam.s * f.w; // detail level
  if (alpha < 1) ctx.globalAlpha = alpha;
  // left face (+z)
  ctx.fillStyle = p.L; quad(x0, y1, z1, x1, y1, z1, x1, y0, z1, x0, y0, z1); ctx.fill();
  // right face (+x)
  ctx.fillStyle = p.R; quad(x1, y1, z1, x1, y1, z0, x1, y0, z0, x1, y0, z1); ctx.fill();
  if (hz < .3) { // sky reflected in the glass: a diagonal streak running up the whole tower
    const R = 260, k = .55;
    let c = ((X - Z) * .3 + y0 * k) % R; if (c < 0) c += R;
    for (const off of [-R, 0, R]) {
      const a = Math.max(x0, X - hw + c + off - 34), b = Math.min(x1, X - hw + c + off - 34 + 26);
      if (b > a) { ctx.fillStyle = p.SL; quad(a, y1, z1, b, y1, z1, b, y0, z1, a, y0, z1); ctx.fill(); }
      const a2 = Math.max(z0, Z - hd + c + off - 80), b2 = Math.min(z1, Z - hd + c + off - 80 + 18);
      if (b2 > a2) { ctx.fillStyle = p.SR; quad(x1, y1, b2, x1, y1, a2, x1, y0, a2, x1, y0, b2); ctx.fill(); }
    }
  }
  const band = Math.min(3.2, h * .25);
  if (cam.s * h > 3 && hz < .3) {
    // spandrel band at the floor line
    ctx.fillStyle = p.BL; quad(x0, y0 + band, z1, x1, y0 + band, z1, x1, y0, z1, x0, y0, z1); ctx.fill();
    ctx.fillStyle = p.BR; quad(x1, y0 + band, z1, x1, y0 + band, z0, x1, y0, z0, x1, y0, z1); ctx.fill();
  }
  // windows: a grid fixed to the floor itself (its tower plus the origin it was set with), so nothing on a
  // placed floor ever moves; which rooms are lit depends only on the floor and the room, never on zoom or haze
  const G = C.GRID, gox = X - f.x + (f.ox || 0), goz = Z - f.z + (f.oz || 0);
  const ix0 = Math.floor((x0 - gox) / G), ix1 = Math.ceil((x1 - gox) / G) - 1;
  const iz0 = Math.floor((z0 - goz) / G), iz1 = Math.ceil((z1 - goz) / G) - 1;
  const litN = smooth(22, 40, n), detail = px1 > 34 && cam.s * h > 5;
  if (litN > .02 && p.night > .02 && hz < .5) {
    const inset = detail ? .8 : 0, top = detail ? y1 - 1.5 : y0 + h * .8, bot = detail ? y0 + band + .8 : y0 + h * .25;
    ctx.fillStyle = rgb(WIN, .92 * p.night);
    for (let i = ix0; i <= ix1; i++) if (hash(seed, n * 131 + i, 1) < .5 * litN + .05) {
      const a = Math.max(x0, gox + i * G) + inset, b = Math.min(x1, gox + (i + 1) * G) - inset;
      if (b - a > 1.5) { quad(a, top, z1, b, top, z1, b, bot, z1, a, bot, z1); ctx.fill(); }
    }
    ctx.fillStyle = rgb(mix(WIN, SHADE, .3), .85 * p.night);
    for (let i = iz0; i <= iz1; i++) if (hash(seed, n * 131 + i, 2) < .42 * litN + .03) {
      const a = Math.max(z0, goz + i * G) + inset, b = Math.min(z1, goz + (i + 1) * G) - inset;
      if (b - a > 1.5) { quad(x1, top, b, x1, top, a, x1, bot, a, x1, bot, b); ctx.fill(); }
    }
  }
  if (detail && hz < .3) { // mullions on the same grid
    ctx.lineWidth = Math.max(1, cam.s * .7);
    ctx.strokeStyle = p.M; ctx.beginPath();
    for (let i = ix0 + 1; i <= ix1; i++) { const x = gox + i * G; if (x <= x0 + .01 || x >= x1 - .01) continue; P(x, y1, z1); ctx.moveTo(px, py); P(x, y0 + band, z1); ctx.lineTo(px, py); }
    ctx.stroke();
    ctx.strokeStyle = p.MR; ctx.beginPath();
    for (let i = iz0 + 1; i <= iz1; i++) { const z = goz + i * G; if (z <= z0 + .01 || z >= z1 - .01) continue; P(x1, y1, z); ctx.moveTo(px, py); P(x1, y0 + band, z); ctx.lineTo(px, py); }
    ctx.stroke();
  }
  // top
  ctx.fillStyle = p.T; quad(x0, y1, z0, x1, y1, z0, x1, y1, z1, x0, y1, z1); ctx.fill();
  if (px1 > 20 && hz < .5) { // lit front edges
    ctx.strokeStyle = p.edge; ctx.lineWidth = Math.max(1, cam.s * .6);
    ctx.beginPath(); P(x0, y1, z1); ctx.moveTo(px, py); P(x1, y1, z1); ctx.lineTo(px, py); P(x1, y1, z0); ctx.lineTo(px, py); ctx.stroke();
  }
  if (outline) { // the slab in hand gets a crisp white edge
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1.5, cam.s * 1.4); ctx.lineJoin = 'round';
    ctx.beginPath();
    P(x0, y1, z0); ctx.moveTo(px, py); P(x1, y1, z0); ctx.lineTo(px, py); P(x1, y0, z0); ctx.lineTo(px, py);
    P(x1, y0, z1); ctx.lineTo(px, py); P(x0, y0, z1); ctx.lineTo(px, py); P(x0, y1, z1); ctx.lineTo(px, py); ctx.closePath();
    ctx.stroke();
  }
  if (alpha < 1) ctx.globalAlpha = 1;
}

function drawPlinth(X, Z, f, hz = 0) {
  const STONE_L = hz ? rgb(mix(hex('#e7cfae'), hazeCol, hz)) : '#e7cfae', STONE_R = hz ? rgb(mix(hex('#a98a72'), hazeCol, hz)) : '#a98a72',
    STONE_T = hz ? rgb(mix(hex('#f3e2c8'), hazeCol, hz)) : '#f3e2c8', LOBBY = hz ? rgb(mix(hex('#3a2c4a'), hazeCol, hz)) : '#3a2c4a';
  const hw = f.w / 2 + 6, hd = f.d / 2 + 6, y1 = C.PLINTH;
  const x0 = X - hw, x1 = X + hw, z0 = Z - hd, z1 = Z + hd;
  ctx.fillStyle = STONE_L; quad(x0, y1, z1, x1, y1, z1, x1, 0, z1, x0, 0, z1); ctx.fill();
  ctx.fillStyle = STONE_R; quad(x1, y1, z1, x1, y1, z0, x1, 0, z0, x1, 0, z1); ctx.fill();
  if (cam.s * hw > 14) { // lobby glazing and a door
    ctx.fillStyle = LOBBY;
    quad(x0 + 8, y1 - 6, z1, x1 - 8, y1 - 6, z1, x1 - 8, 0, z1, x0 + 8, 0, z1); ctx.fill();
    quad(x1, y1 - 6, z1 - 8, x1, y1 - 6, z0 + 8, x1, 0, z0 + 8, x1, 0, z1 - 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,214,140,.55)';
    quad(X - 9, y1 - 9, z1, X + 9, y1 - 9, z1, X + 9, 0, z1, X - 9, 0, z1); ctx.fill();
  }
  ctx.fillStyle = STONE_T; quad(x0, y1, z0, x1, y1, z0, x1, y1, z1, x0, y1, z1); ctx.fill();
}

function shadowOf(X, Z, f, hgt) { // a soft shadow cast to the lower right on the board
  const len = Math.min(hgt * 0.5, 220), hw = f.w / 2 + 6, hd = f.d / 2 + 6;
  ctx.fillStyle = 'rgba(30,18,50,.22)';
  ctx.beginPath();
  P(X - hw, .5, Z + hd); ctx.moveTo(px, py);
  P(X + hw, .5, Z - hd); ctx.lineTo(px, py);
  P(X + hw + len, .5, Z - hd + len * .15); ctx.lineTo(px, py);
  P(X - hw + len, .5, Z + hd + len * .15); ctx.lineTo(px, py);
  ctx.closePath(); ctx.fill();
}

function drawTower(X, Z, floors, seed, opts = {}) {
  const top = floors.length;
  const hz = opts.hz || 0, tint = tintOf(seed);
  shadowOf(X, Z, floors[0], towerTop(top));
  drawPlinth(X, Z, floors[0], hz);
  // cull floors off screen
  const yScreenTop = cam.y + (H * cam.ay + 200) / cam.s, yScreenBot = cam.y - (H * (1 - cam.ay) + 200) / cam.s;
  for (let n = 1; n < top; n++) {
    const y0 = C.PLINTH + (n - 1) * C.SLAB + (opts.settle ? (opts.settle[n] || 0) : 0);
    if (y0 + C.SLAB < yScreenBot - 300 || y0 > yScreenTop + 300) continue;
    const f = floors[n];
    drawFloor(X + f.x, Z + f.z, f, n, y0, C.SLAB, seed, 1, hz, false, f.g ? 4 : tint);
  }
  if (opts.roof && top > 1 && opts.roof > .01) drawRoof(X, Z, floors[top - 1], towerTop(top), top - 1, seed, hz, opts.roof === true ? 1 : opts.roof);
}

// a roof that says how far the tower got: water tank, plant room, stepped crown, spire with a beacon
function box3(x, z, w, d, y0, h, L, R, T) {
  const x0 = x - w / 2, x1 = x + w / 2, z0 = z - d / 2, z1 = z + d / 2, y1 = y0 + h;
  ctx.fillStyle = L; quad(x0, y1, z1, x1, y1, z1, x1, y0, z1, x0, y0, z1); ctx.fill();
  ctx.fillStyle = R; quad(x1, y1, z1, x1, y1, z0, x1, y0, z0, x1, y0, z1); ctx.fill();
  ctx.fillStyle = T; quad(x0, y1, z0, x1, y1, z0, x1, y1, z1, x0, y1, z1); ctx.fill();
}
const ROOF = ['#d9cbbd', '#8f7f86', '#efe4d6', '#6b4f4a', '#4a3536', '#8a6a5c'].map(hex);
function drawRoof(X, Z, f, y, floors, seed, hz, g = 1) {
  const box = (x, z, w, d, y0, h, L, R, T) => box3(x, z, w, d, y + (y0 - y) * g, h * g, L, R, T);

        const n = run.floors.length, m = C.mover(run);
        const drop = (1 - moverIn) * 18;
        drawFloor(runPlot.x + m.x, runPlot.z + m.z, m, n, towerTop(n) + drop, C.SLAB, runSeed, mode === 'intro' ? 0 : Math.min(1, moverIn * 1.5), 0, true, m.golden ? 4 : tintOf(runSeed));
        if (m.golden && !reduced.matches) goldGlint(runPlot.x + m.x, runPlot.z + m.z, m, towerTop(n) + drop + C.SLAB);
        if (craneOn() && mode === 'build') drawCable(runPlot.x + m.x, runPlot.z + m.z, towerTop(n) + drop + C.SLAB);
      }
      drawRings(dt);
      drawSparks(dt);
      front.forEach(drawDebris);
      debrisDrawn = true;
    }
  }
  if (!debrisDrawn) debris.forEach(drawDebris);
  if (demolish) { // the old district sinks into the board and fades
    demolish.t += dt / (reduced.matches ? .3 : 1.2);
    const e = Math.min(1, demolish.t);
    ctx.globalAlpha = 1 - e;
    for (const d of demolish.towers) { if (!d.t._u) d.t._u = unpack(d.t); ctx.save(); ctx.translate(0, e * e * 60 * cam.s); drawTower(d.q.x, d.q.z, d.t._u, d.t.s, {roof: true}); ctx.restore(); }
    ctx.globalAlpha = 1;
    if (e >= 1) { demolish = null; boardRingTarget = boardDiags(); aimCamera(false); flyTo(1.1); }
  }
  drawStorm(dt);
  drawBlimp(dt);
  drawFloats(dt);
  if (mode === 'city') { // the next lot: a gold chevron bobbing above it, never hidden by towers
    const q = C.plotPos(save.towers.length), b = reduced.matches ? 0 : Math.sin(perfNow * .004) * 5;
    P(q.x, 6, q.z);
    const x = px, y = py - 26 + b, k = Math.max(7, Math.min(13, cam.s * 30));
    ctx.fillStyle = 'rgba(30,18,50,.35)'; ctx.beginPath(); ctx.ellipse(x, py + 2, k * .9, k * .35, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd27a'; ctx.strokeStyle = '#2a1f4a'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x - k, y - k * 1.1); ctx.lineTo(x + k, y - k * 1.1); ctx.lineTo(x, y); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  cityCoins(dt);
  drawHint();
  ctx.restore();
  // CTA over the next plot
  if (mode === 'city') {
    const q = C.plotPos(save.towers.length);
    P(q.x, 40, q.z);
    const el = $('cta');
    el.style.left = px.toFixed(1) + 'px'; el.style.top = Math.max(150, py - 40).toFixed(1) + 'px';
  }
}

/* ---------------- boot ---------------- */
load();
trees = [];
boardRing = boardRingTarget = boardDiags();
const away = Date.now() - (save.seen || Date.now());
const owed = C.offlineRent(save.towers, save.up, save.arch, away);
cashShown = save.money;
if (owed > 0 && away > 60000) {
  save.money += owed;
  setTimeout(() => toast(`Rent while you were away <i>+$${fmt(owed)}</i>`), 700);
}
persist();
resize();
setMode('city');
Object.assign(cam, camT);
function rebuildTrees() { trees = treesList().filter(t => !nearBuilt(t)); }
function nearBuilt(t) { return false; }
rebuildTrees();
document.fonts && document.fonts.ready.then(() => { floorPal.length = 0; });
requestAnimationFrame(t => { last = t; frame(t); });

// hooks for tests and screenshots
window.SKY = {
  get mode() { return mode; }, get run() { return run; }, get save() { return save; }, C,
  primary, startBuild, doDrop, toCity, setMode, cashVault, foundDistrict, buy, catchBlimp,
  get blimp() { return blimp; }, set blimpClock(v) { blimpClock = v; },
  setDemo(fn) { demo = fn; },
  reload() { load(); boardRing = boardRingTarget = boardDiags(); rebuildTrees(); cashShown = save.money; setMode('city'); Object.assign(cam, camT); },
};
})();
</script>
