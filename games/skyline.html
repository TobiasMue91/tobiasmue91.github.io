<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Skyline — Stack a Glass Tower, Build a City</title>
<meta name="description" content="Skyline is a one-tap stacking game: drop glass floors, slice the overhang, chain perfect drops to grow the slab back, and build higher until the sky turns to night. Every tower stays in your city and pays rent. Free, no install.">
<link rel="canonical" href="https://www.gptgames.dev/games/skyline.html">
<meta name="theme-color" content="#2a2450">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Text:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff4e4; --ink:#1d1838; --amber:#f0b27a; --window:#ffd27a; --rose:#e58a73;
  --panel:rgba(26,22,52,.86); --line:rgba(255,244,228,.16);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2450;color:var(--cream);
  font-family:'Big Shoulders Text',system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--window);outline-offset:3px}
.ui{position:fixed;inset:0;pointer-events:none}
.ui > *{pointer-events:auto}
.hide{opacity:0!important;pointer-events:none!important}
.fade{transition:opacity .28s ease, transform .45s cubic-bezier(.2,.9,.25,1)}
.fade:not(.hide){transition-delay:.22s}

/* ---------- city screen ---------- */
#title{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 28px);text-align:center;pointer-events:none}
#title h1{margin:0;font:900 clamp(46px,12vw,92px)/.82 'Big Shoulders Display',Impact,sans-serif;letter-spacing:.06em;
  color:var(--cream);text-shadow:0 2px 0 rgba(120,50,70,.35),0 10px 30px rgba(60,20,60,.35)}
#title p{margin:10px 0 0;font:700 15px/1 'Big Shoulders Text',sans-serif;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,244,228,.78)}
#title p b{color:var(--cream);font-weight:800}
#cta{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;
  font:800 17px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;
  background:var(--cream);color:var(--ink);padding:12px 18px 11px;border-radius:999px;
  box-shadow:0 8px 24px rgba(30,15,50,.35)}
#cta::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--cream);
  transform:translateX(-50%) rotate(45deg);border-radius:2px}
#cta span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px 8px;font:800 18px/1 'Big Shoulders Text',sans-serif;letter-spacing:.06em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#cash{position:absolute;right:14px;top:calc(var(--safe-t) + 14px);font-variant-numeric:tabular-nums}
#cash i{font-style:normal;color:var(--window)}
#rent{display:block;font:700 11px/1 'Big Shoulders Text',sans-serif;letter-spacing:.14em;color:rgba(255,244,228,.6);
  position:absolute;right:16px;top:calc(var(--safe-t) + 56px);text-transform:uppercase}
.round{position:absolute;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.round svg{width:22px;height:22px;stroke:var(--cream);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sound,#pausebtn{left:14px;top:calc(var(--safe-t) + 12px)}
#permitsbtn{position:absolute;left:50%;bottom:calc(var(--safe-b) + 22px);transform:translateX(-50%);
  font:800 17px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;
  padding:14px 22px 13px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#permitsbtn svg{width:20px;height:20px;stroke:var(--window);fill:none;stroke-width:2}
#permitsbtn em{font-style:normal;background:var(--window);color:var(--ink);border-radius:999px;font-size:13px;
  padding:4px 7px 3px;letter-spacing:.04em}

/* ---------- build HUD ---------- */
#floor{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 18px);text-align:center;pointer-events:none;
  font:900 clamp(72px,20vw,112px)/.8 'Big Shoulders Display',Impact,sans-serif;color:var(--cream);
  font-variant-numeric:tabular-nums;text-shadow:0 4px 24px rgba(30,15,50,.35)}
#floor.bump{animation:bump .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1.14)}100%{transform:scale(1)}}
#chain{position:absolute;left:50%;top:calc(var(--safe-t) + 18px + clamp(72px,20vw,112px)*.8 + 12px);transform:translateX(-50%);
  pointer-events:none;font:800 15px/1 'Big Shoulders Text',sans-serif;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink);background:var(--cream);border-radius:999px;padding:7px 12px 6px 14px;opacity:0;white-space:nowrap}
#chain.on{animation:chain 1.1s ease-out forwards}
#chain.grow{background:var(--window)}
@keyframes chain{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.9)}12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.06)}
  24%{transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-4px)}}
#earn{position:absolute;right:14px;top:calc(var(--safe-t) + 14px);font-variant-numeric:tabular-nums}
#earn i{font-style:normal;color:var(--window)}

/* ---------- cards & sheets ---------- */
.card{position:absolute;left:50%;bottom:calc(var(--safe-b) + 20px);width:min(420px,calc(100% - 28px));
  transform:translate(-50%,0);background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:20px 20px 18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(20,10,40,.45)}
.card.hide{transform:translate(-50%,40px)}
#result .big{display:flex;align-items:baseline;gap:10px}
#result .big b{font:900 76px/.8 'Big Shoulders Display',Impact,sans-serif;font-variant-numeric:tabular-nums}
#result .big span{font:800 20px/1 'Big Shoulders Text',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,244,228,.75)}
#record{margin-left:auto;align-self:center;font:800 12px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink);background:var(--window);border-radius:999px;padding:6px 10px 5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{border-top:1px solid var(--line);padding-top:9px}
.stats small{display:block;font:700 12px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,244,228,.6)}
.stats b{display:block;margin-top:6px;font:800 26px/1 'Big Shoulders Display',sans-serif;font-variant-numeric:tabular-nums}
.stats b.gold{color:var(--window)}
.row{display:flex;gap:10px}
.btn{flex:1;height:54px;border-radius:16px;font:800 18px/1 'Big Shoulders Text',sans-serif;letter-spacing:.18em;text-transform:uppercase;
  background:var(--cream);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{flex:0 0 54px;background:rgba(255,244,228,.1);color:var(--cream);display:grid;place-items:center}
.btn.ghost.wide{flex:0 0 96px}
.btn.ghost svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#sheetback{position:absolute;inset:0;background:rgba(14,10,30,.35)}
#permits{bottom:0;border-radius:24px 24px 0 0;padding-bottom:calc(var(--safe-b) + 16px);max-height:82vh;overflow:auto}
#permits.card{bottom:0}
#permits header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
#permits h2{margin:0;font:900 34px/1 'Big Shoulders Display',sans-serif;letter-spacing:.06em;text-transform:uppercase}
#permits header span{font:800 18px/1 'Big Shoulders Text',sans-serif;font-variant-numeric:tabular-nums}
#permits header span i{font-style:normal;color:var(--window)}
.perm{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.perm svg{width:44px;height:44px}
.perm h3{margin:0;font:800 18px/1.1 'Big Shoulders Text',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.perm p{margin:3px 0 6px;font:500 14px/1.25 'Big Shoulders Text',sans-serif;color:rgba(255,244,228,.72)}
.pips{display:flex;gap:4px}.pips i{width:14px;height:4px;border-radius:2px;background:rgba(255,244,228,.18)}.pips i.on{background:var(--window)}
.perm button{min-width:84px;height:44px;border-radius:12px;background:var(--cream);color:var(--ink);
  font:800 17px/1 'Big Shoulders Text',sans-serif;letter-spacing:.06em;font-variant-numeric:tabular-nums;transition:transform .12s}
.perm button:active{transform:scale(.95)}
.perm button:disabled{background:rgba(255,244,228,.12);color:rgba(255,244,228,.45);cursor:default}
.perm.flash{animation:flash .5s ease-out}
@keyframes flash{0%{background:rgba(255,210,122,.25)}100%{background:transparent}}

#toast{position:absolute;left:50%;top:calc(var(--safe-t) + 150px);transform:translateX(-50%);white-space:nowrap;
  font:800 16px/1 'Big Shoulders Text',sans-serif;letter-spacing:.12em;text-transform:uppercase}
#toast.hide{transform:translate(-50%,-10px)}
#toast i{font-style:normal;color:var(--window)}

#pause{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,10,30,.45);text-align:center}
#pause b{display:block;font:900 54px/1 'Big Shoulders Display',sans-serif;letter-spacing:.08em}
#pause small{font:700 14px/1 'Big Shoulders Text',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,244,228,.7)}
#pause .row{margin-top:22px;justify-content:center}
#pause .btn{flex:0 0 auto;padding:0 26px}

@media (max-width:520px){#title{top:calc(var(--safe-t) + 66px)}#toast{top:calc(var(--safe-t) + 190px)}}
@media (prefers-reduced-motion:reduce){
  #floor.bump,#cta span{animation:none}
  .fade{transition:opacity .2s}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Skyline game"></canvas>

<div class="ui" id="ui">
  <div id="title" class="fade"><h1>SKYLINE</h1><p id="sub"></p></div>
  <div id="cta" class="fade hide"><span>Tap to build</span></div>
  <div id="cash" class="chip fade" aria-live="polite"><i>$</i><span id="cashv">0</span></div>
  <div id="rent" class="fade"></div>
  <button id="sound" class="round fade" aria-label="Sound on"></button>
  <button id="permitsbtn" class="fade"><svg viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6"/></svg>Permits<em id="permitbadge" class="hide">!</em></button>

  <div id="floor" class="fade hide">0</div>
  <div id="chain"></div>
  <div id="earn" class="chip fade hide"><i>+$</i><span id="earnv">0</span></div>
  <button id="pausebtn" class="round fade hide" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>

  <div id="toast" class="chip fade hide"></div>

  <div id="result" class="card fade hide" role="dialog" aria-label="Tower finished">
    <div class="big"><b id="rfloors">0</b><span id="rlabel">floors</span><em id="record" class="hide">New record</em></div>
    <div class="stats">
      <div><small>Perfect drops</small><b id="rperf">0</b></div>
      <div><small>Longest chain</small><b id="rchain">0</b></div>
      <div><small>Earned</small><b class="gold" id="rearn">$0</b></div>
    </div>
    <div class="row">
      <button class="btn ghost wide" id="tocity">City</button>
      <button class="btn" id="again">Build next</button>
    </div>
  </div>

  <div id="sheetback" class="fade hide"></div>
  <div id="permits" class="card fade hide" role="dialog" aria-label="Permits">
    <header><h2>Permits</h2><span><i>$</i><span id="pcash">0</span></span></header>
    <div id="permlist"></div>
  </div>

  <div id="pause" class="fade hide"><div><b>Paused</b><small>Tap to carry on</small>
    <div class="row"><button class="btn ghost" id="quit" aria-label="Leave this tower"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10h4v11M10 21V4h5v17M16 21v-8h3v8"/></svg></button><button class="btn" id="resume">Resume</button></div></div></div>
</div>

<script id="core">
/* SkyCore - the rules of Skyline, free of the DOM. test/skyline.mjs runs this script on its own. */
const SkyCore = (() => {
  'use strict';
  const BASE = 100;      // side of an unbuilt slab, world units
  const SLAB = 14;       // height of one floor
  const PLINTH = 24;     // height of the stone base (floor 0)
  const RANGE = 150;     // a moving slab swings this far either side of the floor below
  const GROW = 5;        // a perfect drop on a long chain grows the slab back by this much
  const SPACING = 240;   // plot pitch on the city board
  const RENT_CAP_H = 12; // hours of rent that pile up while away

  const UPGRADES = [
    {id: 'foundation', max: 5, base: 120, k: 2.0},
    {id: 'laser',      max: 4, base: 180, k: 2.3},
    {id: 'damper',     max: 5, base: 150, k: 2.1},
    {id: 'rebar',      max: 3, base: 450, k: 2.8},
    {id: 'leasing',    max: 6, base: 200, k: 1.9},
  ];

  function levels(up) {
    const out = {};
    for (const u of UPGRADES) out[u.id] = Math.max(0, Math.min(u.max, Math.floor((up && up[u.id]) || 0)));
    return out;
  }
  function cost(id, lvl) {
    const u = UPGRADES.find(x => x.id === id);
    if (!u || lvl >= u.max) return Infinity;
    return Math.round(u.base * Math.pow(u.k, lvl) / 10) * 10;
  }
  function params(up) {
    const L = levels(up);
    return {
      size: BASE * (1 + 0.06 * L.foundation),
      tol: 2.2 * (1 + 0.2 * L.laser),
      speedMul: 1 - 0.05 * L.damper,
      regrowAt: 6 - L.rebar,
      rent: 1 + 0.5 * L.leasing,
    };
  }
  // units per second a slab moves on floor n
  const speedAt = (n, p) => Math.min(105 + n * 3.4, 300) * p.speedMul;
  // floors alternate the axis they slide along: odd floors along x, even along z
  const axisOf = n => (n % 2 ? 'x' : 'z');
  const dimOf = ax => (ax === 'x' ? 'w' : 'd');
  // a triangle wave: starts at -RANGE, sweeps to +RANGE and back
  function offset(phase) {
    const u = ((phase % (4 * RANGE)) + 4 * RANGE) % (4 * RANGE);
    return u < 2 * RANGE ? -RANGE + u : 3 * RANGE - u;
  }

  function newRun(up) {
    const p = params(up);
    return {p, floors: [{x: 0, z: 0, w: p.size, d: p.size}], phase: 0, streak: 0, bestStreak: 0,
      perfects: 0, cuts: 0, earned: 0, over: false};
  }
  function mover(s) {
    const n = s.floors.length, top = s.floors[n - 1], ax = axisOf(n), off = offset(s.phase);
    const m = {x: top.x, z: top.z, w: top.w, d: top.d, axis: ax, off};
    m[ax] += off;
    return m;
  }
  function step(s, dt) {
    if (!s.over) s.phase += speedAt(s.floors.length, s.p) * dt;
  }
  const floorValue = (n, streak) => Math.round((4 + n * 0.3) * (1 + 0.25 * Math.min(streak, 12)));

  function drop(s) {
    if (s.over) return null;
    const n = s.floors.length, top = s.floors[n - 1], ax = axisOf(n), dim = dimOf(ax);
    const m = mover(s), off = m.off, a = Math.abs(off);
    let kind, placed, debris = null, grew = 0;
    if (a <= s.p.tol) {
      kind = 'perfect';
      placed = {x: top.x, z: top.z, w: top.w, d: top.d};
      s.streak++; s.perfects++;
      if (s.streak >= s.p.regrowAt && top[dim] < s.p.size - 1e-9) {
        grew = Math.min(GROW, s.p.size - top[dim]);
        placed[dim] += grew;
      }
    } else {
      const overlap = top[dim] - a;
      s.streak = 0;
      if (overlap <= 0) {
        s.over = true;
        return {kind: 'miss', floor: n, piece: m, value: 0, streak: 0};
      }
      kind = 'cut'; s.cuts++;
      placed = {x: top.x, z: top.z, w: top.w, d: top.d};
      placed[dim] = overlap;
      placed[ax] = top[ax] + off / 2;
      debris = {x: m.x, z: m.z, w: m.w, d: m.d};
      debris[dim] = a;
      debris[ax] = placed[ax] + Math.sign(off) * (overlap + a) / 2;
    }
    s.bestStreak = Math.max(s.bestStreak, s.streak);
    const value = floorValue(n, kind === 'perfect' ? s.streak : 0);
    s.earned += value;
    s.floors.push(placed);
    s.phase = 0;
    return {kind, floor: n, placed, debris, grew, value, streak: s.streak, off};
  }

  const towerFloors = t => Math.max(0, (t.f || t.floors || t).length - 1);
  function rentPerHour(towers, up) {
    let f = 0;
    for (const t of towers) f += towerFloors(t);
    return f * 2 * params(up).rent;
  }
  function offlineRent(towers, up, ms) {
    const h = Math.min(Math.max(ms, 0) / 3.6e6, RENT_CAP_H);
    return Math.floor(rentPerHour(towers, up) * h);
  }
  // plots fill the board diagonal by diagonal, so every new tower stands in front of every older one
  function plot(i) {
    const d = Math.floor((Math.sqrt(8 * i + 1) - 1) / 2);
    const k = i - d * (d + 1) / 2;
    return {a: k, b: d - k, diag: d};
  }
  function plotPos(i) {
    const p = plot(i);
    return {x: p.a * SPACING, z: p.b * SPACING, diag: p.diag};
  }
  return {BASE, SLAB, PLINTH, RANGE, GROW, SPACING, RENT_CAP_H, UPGRADES, levels, cost, params, speedAt, axisOf,
    offset, newRun, mover, step, drop, floorValue, towerFloors, rentPerHour, offlineRent, plot, plotPos};
})();
if (typeof module !== 'undefined') module.exports = SkyCore;
</script>

<script>
'use strict';
(() => {
const C = SkyCore;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const ISO_C = Math.cos(Math.PI / 6), ISO_S = 0.5;
const SAVE_KEY = 'skyline.v2';

/* ---------------- colour ---------------- */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgb = (c, a = 1) => a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function ramp(stops, v) {
  if (v <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
    const [a, ca] = stops[i - 1], [b, cb] = stops[i];
    return mix(ca, cb, smooth(0, 1, (v - a) / (b - a)));
  }
  return stops[stops.length - 1][1];
}
// glass reflects the hour its floor was built in
const GLASS = [[0, '#f2b874'], [12, '#ec8f6a'], [26, '#c9628a'], [40, '#7d55a8'], [56, '#33438f'], [100, '#1c2766']].map(([n, h]) => [n, hex(h)]);
const SKY_TOP = [[0, '#86a6d4'], [28, '#463478'], [58, '#0a0e2a']].map(([n, h]) => [n, hex(h)]);
const SKY_MID = [[0, '#f4c79a'], [28, '#c06488'], [58, '#1f1f52']].map(([n, h]) => [n, hex(h)]);
const SKY_LOW = [[0, '#f6a477'], [28, '#f39274'], [58, '#3e3170']].map(([n, h]) => [n, hex(h)]);
const WARM = hex('#ffe6c4'), SHADE = hex('#2a1f4a'), WIN = hex('#ffd27a'), WHITE = [255, 255, 255];
const floorPal = [];
const hazePal = new Map();
let hazeCol = [200, 150, 160], hazeKey = 0;
// each tower gets its own glass: clear, bronze, teal or silver, laid over the colour of its hour
const TINTS = [null, hex('#d99a5b'), hex('#7fb7c4'), hex('#c9c3dc')];
const tintOf = seed => seed % 4;
function pal(n, hz = 0, tint = 0) {
  const hb = hz > 0.02 ? Math.round(hz * 20) : 0;
  const key = (n * 4 + tint) * 32 + hb + (hb ? hazeKey * 100000 : 0);
  let v = hb ? hazePal.get(key) : floorPal[key];
  if (!v) {
    v = makePal(n, hb / 20, tint);
    if (hb) { if (hazePal.size > 6000) hazePal.clear(); hazePal.set(key, v); } else floorPal[key] = v;
  }
  return v;
}
function makePal(n, hz, tint) {

/* ---------------- hashing ---------------- */
function hash(a, b = 0, c = 0) {
  let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);

/* ---------------- audio ---------------- */
const Sound = {
  ac: null, out: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = this.ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      this.out = this.ac.createGain(); this.out.gain.value = 0.55;
      this.out.connect(comp); comp.connect(this.ac.destination);
      const len = this.ac.sampleRate;
      this.noiseBuf = this.ac.createBuffer(1, len, len);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  ok() { return this.ac && !save.muted; },
  tone(f, dur, {type = 'sine', gain = .2, at = 0, slide = 0, attack = .004} = {}) {
    const t = this.ac.currentTime + at, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .05);
  },
  noise(dur, freq, {gain = .2, at = 0, q = 1, type = 'lowpass', to = 0} = {}) {
    const t = this.ac.currentTime + at, s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  },
  note(step) { // C major pentatonic, climbing
    const sc = [0, 2, 4, 7, 9];
    const semis = 12 * Math.floor(step / 5) + sc[step % 5];
    return 523.25 * Math.pow(2, semis / 12);
  },
  perfect(streak) {
    if (!this.ok()) return;
    const f = this.note(Math.min(streak - 1, 14));
    this.tone(f, .9, {gain: .22});
    this.tone(f * 2, .5, {gain: .07, type: 'triangle'});
    this.tone(f * 4.07, .18, {gain: .05});
    this.noise(.05, 6000, {gain: .05, type: 'highpass'});
  },
  cut() {
    if (!this.ok()) return;
    this.tone(150, .18, {gain: .32, slide: 55});
    this.noise(.14, 1100, {gain: .26});
    this.noise(.35, 2400, {gain: .06, at: .06, type: 'bandpass', q: .8, to: 500});
  },
  place() { if (this.ok()) this.tone(330, .12, {gain: .05, type: 'triangle'}); },
  grow() {
    if (!this.ok()) return;
    [0, 4, 7, 12].forEach((s, i) => this.tone(1046.5 * Math.pow(2, s / 12), .35, {gain: .07, at: .05 + i * .055}));
  },
  miss() {
    if (!this.ok()) return;
    this.tone(220, .7, {gain: .22, slide: 60, type: 'triangle'});
    this.noise(.8, 2600, {gain: .12, to: 200, type: 'bandpass', q: .7});
  },
  tick() { if (this.ok()) this.tone(1400, .04, {gain: .05}); },
  coin(i) { if (this.ok()) this.tone(1568 + i * 40, .09, {gain: .04, type: 'triangle'}); },
  buy() { if (!this.ok()) return; this.tone(784, .2, {gain: .12}); this.tone(1175, .3, {gain: .1, at: .08}); },
};

/* ---------------- state ---------------- */
let W = 0, H = 0, DPR = 1;
let mode = 'city'; // city | intro | build | fall | result | permits ; paused is a flag over build
let paused = false;
let run = null, runPlot = null, runSeed = 0;
let modeT = 0, firstRun = false;
const cam = {x: 0, y: 0, z: 0, s: 1, ay: .62};
const camT = {x: 0, y: 0, z: 0, s: 1, ay: .62};
let tween = null; // {from, t, dur, arc}
let shake = 0;
const debris = [], rings = [], floats = [], sparks = [];
let settle = []; // per-floor settle offsets for the active tower
let moverIn = 0;  // 0..1 fade/drop-in of the new slab
let boardRing = 0; // eased board size
let hazeAmt = 0;  // neighbours fade into the air while you build
let cashShown = 0;

/* ---------------- layout ---------------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  aimCamera(true);
}
const buildScale = () => Math.min(W, H * 0.66) * (W < 560 ? 0.40 : 0.46) / ((C.BASE * 2) * ISO_C);

function towerTop(floorsLen) { return C.PLINTH + (floorsLen - 1) * C.SLAB; }
function boardDiags() { return C.plot(save.towers.length).diag + 1; }

function aimCamera(snap) {
  if (mode === 'city' || mode === 'permits') {
    // fit the board and its towers
    const D = boardDiags(), ext = D * C.SPACING;
    let maxH = 60;
    save.towers.forEach(t => { maxH = Math.max(maxH, towerTop(t.f.length) + (t.f.length > 61 ? 200 : 50)); });
    const half = C.SPACING / 2;
    const xs = [-half, ext - half];
    const widthW = (ext) * 2 * ISO_C, depthH = ext * 2 * ISO_S + 40;
    const narrow = W < 560, availW = W * (narrow ? .92 : .9), availH = H - (narrow ? 230 : 210);
    const s = Math.min(availW / widthW, availH / (depthH + maxH * 0.85), 1.4);
    camT.s = s;
    camT.x = (xs[0] + xs[1]) / 2; camT.z = camT.x;
    camT.y = maxH * 0.42;
    camT.ay = 0.5 + (narrow ? 95 : 50) / H;
  } else if (mode === 'intro' || mode === 'build' || mode === 'fall') {
    const top = towerTop(run.floors.length);
    camT.s = buildScale();
    camT.x = runPlot.x; camT.z = runPlot.z;
    camT.y = top + 30;
    camT.ay = 0.6;
  } else if (mode === 'result') {
    const top = towerTop(run.floors.length);
    camT.x = runPlot.x; camT.z = runPlot.z;
    const card = Math.min(300, 250 + Math.max(0, 560 - W) * 0), room = H - card - 90;
    camT.s = Math.min(buildScale(), room / (top + 230));
    camT.y = top * 0.5 + 30;
    camT.ay = (90 + room * .5) / H;
  }
  if (snap) { Object.assign(cam, camT); tween = null; }
}
function flyTo(dur, arc = 0) {
  if (reduced.matches) { dur = Math.min(dur, .3); arc = 0; }
  tween = {from: {...cam}, t: 0, dur, arc};
}
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ---------------- projection & drawing ---------------- */
let px = 0, py = 0;
function P(x, y, z) {
  px = W * 0.5 + ((x - cam.x) - (z - cam.z)) * ISO_C * cam.s;
  py = H * cam.ay + ((x - cam.x) + (z - cam.z)) * ISO_S * cam.s - (y - cam.y) * cam.s;
}
function quad(x1, y1, z1, x2, y2, z2, x3, y3, z3, x4, y4, z4) {
  ctx.beginPath();
  P(x1, y1, z1); ctx.moveTo(px, py); P(x2, y2, z2); ctx.lineTo(px, py);
  P(x3, y3, z3); ctx.lineTo(px, py); P(x4, y4, z4); ctx.lineTo(px, py); ctx.closePath();

const drawFloor3 = (...a) => drawFloor(...a);
// one glass floor; X,Z its world centre, f its footprint, n floor index (colour), seed for windows
function drawFloor(X, Z, f, n, y0, h, seed, alpha = 1, hz = 0, outline = false, tint = 0) {
  const p = pal(n, hz, tint), hw = f.w / 2, hd = f.d / 2;
  const x0 = X - hw, x1 = X + hw, z0 = Z - hd, z1 = Z + hd, y1 = y0 + h;
  const px1 = cam.s * f.w; // detail level
  if (alpha < 1) ctx.globalAlpha = alpha;
  // left face (+z)
  ctx.fillStyle = p.L; quad(x0, y1, z1, x1, y1, z1, x1, y0, z1, x0, y0, z1); ctx.fill();
  // right face (+x)
  ctx.fillStyle = p.R; quad(x1, y1, z1, x1, y1, z0, x1, y0, z0, x1, y0, z1); ctx.fill();
  if (hz < .3) { // sky reflected in the glass: a diagonal streak running up the whole tower
    const R = 260, k = .55;
    let c = ((X - Z) * .3 + y0 * k) % R; if (c < 0) c += R;
    for (const off of [-R, 0, R]) {
      const a = Math.max(x0, X - hw + c + off - 34), b = Math.min(x1, X - hw + c + off - 34 + 26);
      if (b > a) { ctx.fillStyle = p.SL; quad(a, y1, z1, b, y1, z1, b, y0, z1, a, y0, z1); ctx.fill(); }
      const a2 = Math.max(z0, Z - hd + c + off - 80), b2 = Math.min(z1, Z - hd + c + off - 80 + 18);
      if (b2 > a2) { ctx.fillStyle = p.SR; quad(x1, y1, b2, x1, y1, a2, x1, y0, a2, x1, y0, b2); ctx.fill(); }
    }
  }
  const band = Math.min(3.2, h * .25);
  if (cam.s * h > 3 && hz < .3) {
    // spandrel band at the floor line
    ctx.fillStyle = p.BL; quad(x0, y0 + band, z1, x1, y0 + band, z1, x1, y0, z1, x0, y0, z1); ctx.fill();
    ctx.fillStyle = p.BR; quad(x1, y0 + band, z1, x1, y0 + band, z0, x1, y0, z0, x1, y0, z1); ctx.fill();
  }
  if (px1 > 34 && cam.s * h > 5 && hz < .3) {
    // mullions on a world grid, so a cut floor keeps lining up with the one below
    const G = 12.5, night = p.night;
    ctx.lineWidth = Math.max(1, cam.s * .7);
    const gx0 = Math.ceil((x0 + .01) / G), gx1 = Math.floor((x1 - .01) / G);
    const gz0 = Math.ceil((z0 + .01) / G), gz1 = Math.floor((z1 - .01) / G);
    if (night > 0.02) {
      ctx.fillStyle = rgb(WIN, 0.92 * night);
      for (let i = gx0 - 1; i <= gx1; i++) if (hash(seed, n * 131 + i, 1) < 0.5 * night + .05) {
        const a = Math.max(x0, i * G), b = Math.min(x1, (i + 1) * G);
        if (b - a > 2) { quad(a + .8, y1 - 1.5, z1, b - .8, y1 - 1.5, z1, b - .8, y0 + band + .8, z1, a + .8, y0 + band + .8, z1); ctx.fill(); }
      }
      ctx.fillStyle = rgb(mix(WIN, SHADE, .3), 0.85 * night);
      for (let i = gz0 - 1; i <= gz1; i++) if (hash(seed, n * 131 + i, 2) < 0.42 * night + .03) {
        const a = Math.max(z0, i * G), b = Math.min(z1, (i + 1) * G);
        if (b - a > 2) { quad(x1, y1 - 1.5, b - .8, x1, y1 - 1.5, a + .8, x1, y0 + band + .8, a + .8, x1, y0 + band + .8, b - .8); ctx.fill(); }
      }
    }
    ctx.strokeStyle = p.M; ctx.beginPath();
    for (let i = gx0; i <= gx1; i++) { P(i * G, y1, z1); ctx.moveTo(px, py); P(i * G, y0 + band, z1); ctx.lineTo(px, py); }
    ctx.stroke();
    ctx.strokeStyle = p.MR; ctx.beginPath();
    for (let i = gz0; i <= gz1; i++) { P(x1, y1, i * G); ctx.moveTo(px, py); P(x1, y0 + band, i * G); ctx.lineTo(px, py); }
    ctx.stroke();
  }
  else if (p.night > .08 && hz < .5) { // too small for windows: a lit strip says someone is home
    // lit rooms in runs along the floor, picked by a hash so they stay put
    const G = 25, gx0 = Math.floor(x0 / G), gx1 = Math.floor(x1 / G), gz0 = Math.floor(z0 / G), gz1 = Math.floor(z1 / G);
    ctx.fillStyle = rgb(WIN, .95 * p.night);
    for (let i = gx0; i <= gx1; i++) if (hash(seed, n * 57 + i, 5) < .6) {
      const a = Math.max(x0, i * G), b = Math.min(x1, (i + 1) * G);
      if (b - a > 3) { quad(a, y0 + h * .8, z1, b, y0 + h * .8, z1, b, y0 + h * .25, z1, a, y0 + h * .25, z1); ctx.fill(); }
    }
    ctx.fillStyle = rgb(mix(WIN, SHADE, .3), .8 * p.night);
    for (let i = gz0; i <= gz1; i++) if (hash(seed, n * 57 + i, 6) < .5) {
      const a = Math.max(z0, i * G), b = Math.min(z1, (i + 1) * G);
      if (b - a > 3) { quad(x1, y0 + h * .8, b, x1, y0 + h * .8, a, x1, y0 + h * .25, a, x1, y0 + h * .25, b); ctx.fill(); }
    }
  }

  ctx.fillStyle = p.T; quad(x0, y1, z0, x1, y1, z0, x1, y1, z1, x0, y1, z1); ctx.fill();
  if (px1 > 20 && hz < .5) { // lit front edges
    ctx.strokeStyle = p.edge; ctx.lineWidth = Math.max(1, cam.s * .6);
    ctx.beginPath(); P(x0, y1, z1); ctx.moveTo(px, py); P(x1, y1, z1); ctx.lineTo(px, py); P(x1, y1, z0); ctx.lineTo(px, py); ctx.stroke();

    ctx.beginPath();

    P(x1, y0, z1); ctx.lineTo(px, py); P(x0, y0, z1); ctx.lineTo(px, py); P(x0, y1, z1); ctx.lineTo(px, py); ctx.closePath();
    ctx.stroke();
  }

}

function drawPlinth(X, Z, f, hz = 0) {
  const STONE_L = hz ? rgb(mix(hex('#e7cfae'), hazeCol, hz)) : '#e7cfae', STONE_R = hz ? rgb(mix(hex('#a98a72'), hazeCol, hz)) : '#a98a72',
    STONE_T = hz ? rgb(mix(hex('#f3e2c8'), hazeCol, hz)) : '#f3e2c8', LOBBY = hz ? rgb(mix(hex('#3a2c4a'), hazeCol, hz)) : '#3a2c4a';

  ctx.fillStyle = STONE_R; quad(x1, y1, z1, x1, y1, z0, x1, 0, z0, x1, 0, z1); ctx.fill();

    quad(x1, y1 - 6, z1 - 8, x1, y1 - 6, z0 + 8, x1, 0, z0 + 8, x1, 0, z1 - 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,214,140,.55)';

function shadowOf(X, Z, f, hgt) { // a soft shadow cast to the lower right on the board
  const len = Math.min(hgt * 0.5, 220), hw = f.w / 2 + 6, hd = f.d / 2 + 6;
  ctx.fillStyle = 'rgba(30,18,50,.22)';
  ctx.beginPath();

  P(X + hw, .5, Z - hd); ctx.lineTo(px, py);
  P(X + hw + len, .5, Z - hd + len * .15); ctx.lineTo(px, py);

function drawTower(X, Z, floors, seed, opts = {}) {
  const top = floors.length;
  const hz = opts.hz || 0, tint = tintOf(seed);

    if (y0 + C.SLAB < yScreenBot - 300 || y0 > yScreenTop + 300) continue;
    const f = floors[n];
    drawFloor(X + f.x, Z + f.z, f, n, y0, C.SLAB, seed, 1, hz, false, tint);
  }

// a roof that says how far the tower got: water tank, plant room, stepped crown, spire with a beacon
function box3(x, z, w, d, y0, h, L, R, T) {
  const x0 = x - w / 2, x1 = x + w / 2, z0 = z - d / 2, z1 = z + d / 2, y1 = y0 + h;
  ctx.fillStyle = L; quad(x0, y1, z1, x1, y1, z1, x1, y0, z1, x0, y0, z1); ctx.fill();
  ctx.fillStyle = R; quad(x1, y1, z1, x1, y1, z0, x1, y0, z0, x1, y0, z1); ctx.fill();
  ctx.fillStyle = T; quad(x0, y1, z0, x1, y1, z0, x1, y1, z1, x0, y1, z1); ctx.fill();

    const chip = $('chain');
    chip.textContent = r.grew ? 'Perfect · grows' : (r.streak > 1 ? `Perfect ×${r.streak}` : 'Perfect');
    chip.classList.toggle('grow', !!r.grew);
    chip.style.fontSize = Math.min(15 + r.streak * 1.5, 26) + 'px';
    chip.style.animationDuration = Math.min(1.1 + r.streak * .12, 1.9) + 's';
    chip.classList.remove('on'); void chip.offsetWidth; chip.classList.add('on');
    if (r.grew) { Sound.grow(); addSparks(runPlot.x + r.placed.x, runPlot.z + r.placed.z, r.placed, y + C.SLAB); }
  } else {
    spawnDebris(runPlot.x, runPlot.z, r.debris, y, n, r.off, m.axis, false);
    Sound.cut();
    if (!reduced.matches) shake = 2.5;
  }
  floatText(String(r.value), runPlot.x + r.placed.x, runPlot.z + r.placed.z, y + C.SLAB, r.kind === 'perfect');
  const fl = $('floor'); fl.textContent = String(n); fl.classList.remove('bump'); void fl.offsetWidth; fl.classList.add('bump');
  $('earnv').textContent = run.earned.toLocaleString('en-US');
  moverIn = 0;
  aimCamera(false);
}

function endRun() {
  const floors = run.floors.length - 1;
  const record = floors > save.best && save.runs > 0;
  save.best = Math.max(save.best, floors);
  save.runs++;
  save.money += run.earned;
  save.towers.push(packTower(run.floors));
  save.towers[save.towers.length - 1].s = runSeed; lastBuilt = save.towers.length - 1; lastFade = 0;
  persist();
  lastResult = {floors, perfects: run.perfects, chain: run.bestStreak, earned: run.earned, record};
  $('rfloors').textContent = String(floors);
  $('rlabel').textContent = floors === 1 ? 'floor' : 'floors';
  $('rperf').textContent = String(run.perfects);
  $('rchain').textContent = String(run.bestStreak);
  $('rearn').textContent = '$0';
  $('record').classList.toggle('hide', !record);
  countUp = {t: 0, to: run.earned};
  cashShown = save.money - run.earned;
  setMode('result');
}
let countUp = null;
let boardRingTarget = 1;

function toCity() {
  run = null;
  boardRingTarget = boardDiags();
  setMode('city');
}

function primary() {
  if (paused) { resume(); return; }
  if (mode === 'city') startBuild();
  else if (mode === 'build') doDrop();
  else if (mode === 'result' && modeT > 1.2) startBuild();
}
function pause() { if (mode !== 'build' || paused) return; paused = true; $('pause').classList.remove('hide'); }
function resume() { paused = false; $('pause').classList.add('hide'); Sound.init(); }

/* ---------------- city UI ---------------- */
const fmt = v => Math.floor(v).toLocaleString('en-US');
function refreshCity() {
  const t = save.towers.length;
  const rph = C.rentPerHour(save.towers, save.up);
  $('sub').innerHTML = t ? `<b>${t}</b> tower${t > 1 ? 's' : ''} · best <b>${save.best}</b> · rent <b>$${fmt(rph)}</b>/h` : 'Stack it. Build a city.';
  const can = C.UPGRADES.some(u => C.cost(u.id, save.up[u.id]) <= save.money);
  $('permitbadge').classList.toggle('hide', !can);
  renderSound();
  if (mode === 'permits') renderPermits();
}
const ICONS = {
  foundation: '<path d="M6 32h32M10 32V20h24v12" stroke="#ffd27a"/><path d="M4 38h36" stroke="#fff4e4"/><path d="M6 12l-3 3 3 3M38 12l3 3-3 3M3 15h38" stroke="#fff4e4"/>',
  laser: '<path d="M8 30h28v6H8z" stroke="#fff4e4"/><circle cx="22" cy="33" r="1.5" fill="#ffd27a"/><path d="M22 26V8M16 14l6-6 6 6" stroke="#ffd27a"/>',
  damper: '<path d="M22 4v10M10 14h24" stroke="#fff4e4"/><path d="M14 14q8 16 16 0" stroke="#ffd27a"/><path d="M16 30h12v8H16z" stroke="#fff4e4"/>',
  rebar: '<path d="M8 36L36 8M12 38L38 12M6 32L32 6" stroke="#fff4e4"/><path d="M14 20l10 10M20 14l10 10" stroke="#ffd27a"/>',
  leasing: '<path d="M8 38V12l14-6 14 6v26" stroke="#fff4e4"/><path d="M14 18h4M26 18h4M14 26h4M26 26h4" stroke="#ffd27a"/><path d="M19 38v-6h6v6" stroke="#fff4e4"/>',
};
const PERM_TEXT = {
  foundation: ['Wider lot', L => `Every tower starts ${Math.round(6 * (L + 1))}% wider`],
  laser: ['Laser level', L => `Perfect window +${20 * (L + 1)}%`],
  damper: ['Tuned damper', L => `Slabs swing ${5 * (L + 1)}% slower`],
  rebar: ['Rebar', L => `Slabs grow back after ${Math.max(3, 5 - L)} perfects in a row`],
  leasing: ['Leasing office', L => `Rent ×${(1 + .5 * (L + 1)).toFixed(1)}`],
};
function renderPermits() {
  $('pcash').textContent = fmt(save.money);
  const list = $('permlist');
  if (!list.childElementCount) {
    list.innerHTML = C.UPGRADES.map(u => `<div class="perm" data-id="${u.id}"><svg viewBox="0 0 44 44" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[u.id]}</svg>
      <div><h3>${PERM_TEXT[u.id][0]}</h3><p></p><div class="pips">${'<i></i>'.repeat(u.max)}</div></div><button></button></div>`).join('');
    list.querySelectorAll('.perm button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); buy(b.parentElement.dataset.id); }));
  }
  for (const u of C.UPGRADES) {
    const row = list.querySelector(`[data-id="${u.id}"]`), L = save.up[u.id], c = C.cost(u.id, L);
    row.querySelector('p').textContent = L >= u.max ? 'Fully permitted' : PERM_TEXT[u.id][1](L);
    row.querySelectorAll('.pips i').forEach((p, i) => p.classList.toggle('on', i < L));
    const b = row.querySelector('button');
    b.textContent = L >= u.max ? 'Max' : '$' + fmt(c);
    b.disabled = !(c <= save.money);
  }
}
function buy(id) {
  const L = save.up[id], c = C.cost(id, L);
  if (!(c <= save.money)) return;
  save.money -= c; save.up[id] = L + 1; cashShown = save.money;
  persist(); Sound.buy();
  const row = document.querySelector(`.perm[data-id="${id}"]`);
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  refreshCity();
}
function renderSound() {
  $('sound').innerHTML = save.muted
    ? '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
  $('sound').setAttribute('aria-label', save.muted ? 'Sound off' : 'Sound on');
}
function toast(html, ms = 3200) {
  const t = $('toast'); t.innerHTML = html; t.classList.remove('hide');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hide'), ms);
}

/* ---------------- input ---------------- */
window.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  if (e.target.closest('button, .card, #sheetback')) return;
  Sound.init();
  primary();
}, {passive: true});
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON' && mode !== 'build') return;
    e.preventDefault(); Sound.init(); primary();
  } else if (e.code === 'Escape' || e.code === 'KeyP') {
    if (mode === 'permits') setMode('city');
    else if (paused) resume(); else pause();
  }
});
$('sound').addEventListener('click', () => { save.muted = !save.muted; persist(); Sound.init(); renderSound(); Sound.tick(); });
$('permitsbtn').addEventListener('click', () => { Sound.init(); Sound.tick(); setMode('permits'); });
$('sheetback').addEventListener('click', () => { Sound.tick(); setMode('city'); });
$('again').addEventListener('click', () => startBuild());
$('tocity').addEventListener('click', () => { Sound.tick(); toCity(); });
$('pausebtn').addEventListener('click', e => { e.stopPropagation(); pause(); });
$('resume').addEventListener('click', e => { e.stopPropagation(); resume(); });
$('quit').addEventListener('click', e => { e.stopPropagation(); paused = false; $('pause').classList.add('hide'); setMode('fall'); run.over = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); persist(); } });
window.addEventListener('resize', resize);

/* ---------------- loop ---------------- */
let perfNow = 0, last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  perfNow = now;
  let dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (demo) demo(dt);
  tick(dt);
  render(dt);
}
function tick(dt) {
  modeT += dt;
  const live = !paused;
  if (live && mode === 'intro' && !tween) setMode('build');
  if (live && mode === 'build') { C.step(run, dt); moverIn = Math.min(1, moverIn + dt / .16); }
  if (live && mode === 'fall' && modeT > 1.1) endRun();
  if (mode === 'result' && modeT > (reduced.matches ? .2 : .95) && $('result').classList.contains('hide')) { $('result').classList.remove('hide'); countUp && (countUp.t = 0); }
  if (mode === 'city' || mode === 'permits') {
    const rph = C.rentPerHour(save.towers, save.up);
    if (rph) { save.money += rph / 3600 * dt; if ((perfNow | 0) % 5000 < 20) persist(); }
  }
  if (live) {
    if (mode === 'build') aimCamera(false);
    if (tween) {
      tween.t += dt;
      const u = Math.min(1, tween.t / tween.dur), e = easeIO(u);
      for (const key of ['x', 'y', 'z', 'ay']) cam[key] = tween.from[key] + (camT[key] - tween.from[key]) * e;
      // zoom in log space so it feels even, and lift out a little in the middle of a long move
      cam.s = Math.exp(Math.log(tween.from.s) + (Math.log(camT.s) - Math.log(tween.from.s)) * e) * (1 - tween.arc * Math.sin(Math.PI * e));
      if (u >= 1) tween = null;
    } else {
      const k = 1 - Math.exp(-dt * 5.5);
      for (const key of ['x', 'y', 'z', 's', 'ay']) cam[key] += (camT[key] - cam[key]) * k;
    }
    for (let n = 0; n < settle.length; n++) if (settle[n]) { settle[n] *= Math.exp(-dt * 14); if (Math.abs(settle[n]) < .05) settle[n] = 0; }
    updateDebris(dt);
    cloudDrift += dt * 6;
    const hzT = (mode === 'intro' || mode === 'build' || mode === 'fall') ? .86 : mode === 'result' ? .55 : 0;
    hazeAmt += (hzT - hazeAmt) * (1 - Math.exp(-dt * 4));
    if (mode !== 'result' && mode !== 'city' && mode !== 'permits') lastFade += (1 - lastFade) * (1 - Math.exp(-dt * 3));
    boardRing += (boardRingTarget - boardRing) * (1 - Math.exp(-dt * 3));
    if (Math.abs(boardRing - boardRingTarget) < .002) boardRing = boardRingTarget;
  }
  shake *= Math.exp(-dt * 12);
  // cash display
  const target = save.money;
  if (countUp && !$('result').classList.contains('hide')) {
    countUp.t += dt;
    const e = clamp((countUp.t - .3) / .9, 0, 1), v = Math.round(countUp.to * (1 - Math.pow(1 - e, 3)));
    if (v !== countUp.v) { if ((countUp.n = (countUp.n || 0) + 1) % 3 === 0) Sound.coin(countUp.n % 7); countUp.v = v; }
    $('rearn').textContent = '$' + fmt(v);
    cashShown = target - countUp.to + v;
    if (e >= 1) countUp = null;
  } else if (countUp) cashShown = target - countUp.to; // held until the card counts it in
  else cashShown += (target - cashShown) * (1 - Math.exp(-dt * 8));
  const txt = fmt(Math.abs(target - cashShown) < 1 ? target : cashShown);
  if ($('cashv').textContent !== txt) $('cashv').textContent = txt;
}

function render(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const hr = skyHr += (skyHour() - skyHr) * (1 - Math.exp(-Math.min(dt, .05) * 3)); // the sky never jumps between screens
  hazeCol = mix(mix(ramp(SKY_TOP, hr), ramp(SKY_MID, hr), .3), SHADE, .12); hazeKey = Math.round(hr / 3) & 127;
  drawSky(hr);
  ctx.save();
  if (shake > .05) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawBoard();
  // everything standing on the board, back to front by the line it stands on
  const items = [];
  save.towers.forEach((t, i) => { const q = C.plotPos(i); items.push({d: q.x + q.z, k: 1, q, t, i}); });
  for (const tr of trees) items.push({d: tr.x + tr.z, k: 0, tr});
  if (run) items.push({d: runPlot.x + runPlot.z + .5, k: 2});
  items.sort((a, b) => a.d - b.d);
  const behind = [], front = [];
  if (run) for (const d of debris) (d.X + d.Z < runPlot.x + runPlot.z ? behind : front).push(d);
  let debrisDrawn = false;
  for (const it of items) {
    if (it.k === 0) drawTree(it.tr);
    else if (it.k === 1) {
      if (!it.t._u) it.t._u = unpack(it.t);
      if (mode === 'result' && it.i === lastBuilt) continue; // still drawn as the live tower
      drawTower(it.q.x, it.q.z, it.t._u, it.t.s, {hz: it.i === lastBuilt ? hazeAmt * lastFade : hazeAmt, roof: true});
    } else {
      behind.forEach(drawDebris);
      drawTower(runPlot.x, runPlot.z, run.floors, runSeed, {settle, roof: mode === 'result' ? (reduced.matches ? 1 : 1 - Math.pow(1 - clamp((modeT - .25) / .7, 0, 1), 3)) : 0});
      if (mode === 'build' || mode === 'intro') {
        const n = run.floors.length, m = C.mover(run);
        const drop = (1 - moverIn) * 18;
        drawFloor(runPlot.x + m.x, runPlot.z + m.z, m, n, towerTop(n) + drop, C.SLAB, runSeed, mode === 'intro' ? 0 : Math.min(1, moverIn * 1.5), 0, true, tintOf(runSeed));
      }
      drawRings(dt);
      drawSparks(dt);
      front.forEach(drawDebris);
      debrisDrawn = true;
    }
  }
  if (!debrisDrawn) debris.forEach(drawDebris);
  drawFloats(dt);
  cityCoins(dt);
  drawHint();
  ctx.restore();
  // CTA over the next plot
  if (mode === 'city') {
    const q = C.plotPos(save.towers.length);
    P(q.x, 40, q.z);
    const el = $('cta');
    el.style.left = px.toFixed(1) + 'px'; el.style.top = Math.max(150, py - 6).toFixed(1) + 'px';
  }
}

/* ---------------- boot ---------------- */
load();
trees = [];
boardRing = boardRingTarget = boardDiags();
const away = Date.now() - (save.seen || Date.now());
const owed = C.offlineRent(save.towers, save.up, away);
cashShown = save.money;
if (owed > 0 && away > 60000) {
  save.money += owed;
  setTimeout(() => toast(`Rent while you were away <i>+$${fmt(owed)}</i>`), 700);
}
persist();
resize();
setMode('city');
Object.assign(cam, camT);
function rebuildTrees() { trees = treesList().filter(t => !nearBuilt(t)); }
function nearBuilt(t) { return false; }
rebuildTrees();
document.fonts && document.fonts.ready.then(() => { floorPal.length = 0; });
requestAnimationFrame(t => { last = t; frame(t); });

// hooks for tests and screenshots
window.SKY = {
  get mode() { return mode; }, get run() { return run; }, get save() { return save; }, C,
  primary, startBuild, doDrop, toCity, setMode,
  setDemo(fn) { demo = fn; },
  reload() { load(); boardRing = boardRingTarget = boardDiags(); rebuildTrees(); cashShown = save.money; setMode('city'); Object.assign(cam, camT); },
};
})();
</script>
