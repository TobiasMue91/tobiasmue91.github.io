<style>

:root{--paper:#efe6cf;--paper-hi:#f8f1de;--paper-lo:#e2d7bd;--ink:#1c1813;--ink2:#5b4e3d;--red:#a8281b;--max:46px}

.modes button.on{color:var(--ink)}

.key:active,.key.down{transform:translateY(1.5px);background:var(--paper-lo)}
.key.hit{background:var(--ink);color:var(--paper);box-shadow:none}

  <div class="top">

  <div class="plate" id="plate"><div class="cut"><div class="art" id="art"></div></div></div>
  <div class="word" id="word" aria-hidden="true"></div>

  <div class="sr" id="sr" aria-live="assertive"></div>
</main>

  }

    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 180; const lp = ctx.createBiquadFilter(); lp.frequency.value = 900;

<script>
// The page: one sheet, two kinds of round (today's sheet and the endless docket), each kept in

  // ---- the save ----

  let today = LW.dayNumber(new Date());
  let mode = save.mode === 'endless' ? 'endless' : 'daily';
  function dailyRound() { if (!save.daily || save.daily.no !== today && (LW.isOver(save.daily) || !save.daily.guesses.length)) save.daily = LW.daily(today); return save.daily; }
  function endlessRound() { if (!save.endless) save.endless = Object.assign(LW.endless(1, Math.random, []), { seen: [] }); return save.endless; }

  // ---- the plate and its motion ----

  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    tweens = tweens.filter(tw => {
      if (now < tw.t0) return true;
      if (tw.from === null) tw.from = P[tw.key];
      const u = tw.dur ? Math.min(1, (now - tw.t0) / tw.dur) : 1;
      P[tw.key] = tw.from + (tw.to - tw.from) * tw.fn(u);

  function settle(params) { const cut = P.cut; tweens = []; swayAmp = 0; Object.assign(P, { sway: 0 }, params, { cut }); if (nodes) Plate.set(nodes, P); }

  // what each mark does to the plate, and how
  function advance(m) {
    const d = reduce.matches ? 0 : 1;

    if (m === 2) { tween('noose', 1, 420 * d, 0, ease.inOut); tween('hat', 1, 820 * d, 120 * d, ease.lin); }
    if (m === 3) tween('bound', 1, 320 * d, 0, ease.out);
    if (m === 4) tween('hood', 1, 520 * d, 0, ease.out);
    if (m === 5) { tween('taut', 1, 320 * d); tween('lever', .5, 420 * d, 0, ease.back); }

      tween('taut', 1, 0); tween('lever', 1, 140 * d, 0, ease.in);
      tween('trap', 1, 120 * d, 110 * d, ease.in);

  }
  function pardonPlate() {
    const d = reduce.matches ? 0 : 1;
    tween('hood', 0, 420 * d, 0, ease.inOut);
    tween('noose', 0, 420 * d, 260 * d, ease.inOut);
    tween('rope', 0, 380 * d, 620 * d, ease.in);
    tween('bound', 0, 260 * d, 200 * d);
    tween('taut', 0, 300 * d); tween('lever', 0, 400 * d, 200 * d);
    later(() => { P.hat = 0; P.hatBack = 1; tween('hatBack', 0, 520 * d, 0, ease.back); }, 520);
  }
  const FINAL_PARDON = { rope: 0, noose: 0, hat: 0, bound: 0, hood: 0, taut: 0, lever: 0, trap: 0, drop: 0 };

  // ---- timers that belong to the round on screen ----

  const later = (fn, ms) => { const id = setTimeout(() => { timers = timers.filter(x => x !== id); fn(); }, reduce.matches ? Math.min(ms, 60) : ms); timers.push(id); };
  const cancelTimers = () => { timers.forEach(clearTimeout); timers = []; };

  const keyEls = {};
  for (const row of ROWS) {
    const r = document.createElement('div'); r.className = 'r';
    for (const L of row) { const b = document.createElement('button'); b.className = 'key' + (L === 'Q' ? ' q' : ''); b.type = 'button'; b.textContent = L; b.dataset.l = L; b.setAttribute('aria-label', L); r.appendChild(b); keyEls[L] = b; }

  }

  function fitWord(n) {
    const W = els.word.clientWidth || els.sheet.clientWidth - 32;
    const max = parseFloat(getComputedStyle(els.word).getPropertyValue('--max')) || 46;
    const gap = Math.max(6, Math.min(12, W * .03));
    const sw = Math.min(max, (W - gap * (n - 1)) / n);
    els.word.style.setProperty('--sw', sw.toFixed(1) + 'px'); els.word.style.setProperty('--gap', gap.toFixed(1) + 'px'); els.word.style.height = (sw * 1.3).toFixed(1) + 'px';
  }
  // a long name is set smaller rather than cut short
  function fitName() { const h = els.name; h.style.fontSize = ''; let f = parseFloat(getComputedStyle(h).fontSize); while (h.scrollWidth > h.clientWidth + 1 && f > 14) { f -= 1; h.style.fontSize = f + 'px'; } }
  function drawRound(s) {
    cancelTimers();
    els.no.textContent = s.mode === 'daily' ? `Nº ${s.no} · Tyburn, ${dateline()}` : `Case ${s.no} · Tyburn Assizes`;
    els.name.textContent = s.name; fitName();
    els.cat.textContent = LW.CAT[s.cat].label;
    els.crime.innerHTML = s.crime ? `<span>Condemned at the Old Bailey </span>for ${s.crime}<span>, and to be hanged this day, unless his last word be found</span>.` : '';
    els.word.innerHTML = [...s.word].map(() => '<div class="sort"><span></span></div>').join('');
    fitWord(s.word.length);
    const shown = LW.shown(s), lost = LW.isLost(s);
    [...els.word.children].forEach((d, i) => { const sp = d.firstChild; sp.textContent = shown[i] || (lost ? s.word[i] : ''); if (!shown[i] && lost) d.classList.add('missed'); });
    const m = LW.missesOf(s);

    if (LW.isWon(s)) settle(Object.assign({}, FINAL_PARDON, { marks: m })); else if (lost) settle(Plate.STAGES[6]); else settle(Plate.STAGES[Math.min(6, m)]);

  }

  function dateline() {
    const d = new Date(), n = d.getDate(), th = n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th';

  }
  // ---- the verdict ----
  const nth = n => ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'][n] || String(n);
  const Nth = n => { const w = nth(n); return w[0].toUpperCase() + w.slice(1); };
  function countdown() {
    const now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const s = Math.max(0, Math.round((next - now) / 1000)), h = s / 3600 | 0, m = (s % 3600) / 60 | 0, ss = s % 60;
    return `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  }
  let clock = 0;
  function showVerdict(instant) {
    const s = current(), won = LW.isWon(s), m = LW.missesOf(s), st = save.stats;
    const said = s.word[0] + s.word.slice(1).toLowerCase(), first = s.name.split(' ')[0];
    let html = `<p class="v-big ${won ? '' : 'red'}">${won ? 'Pardoned' : 'Hanged'}</p>`;
    html += `<p class="v-title">“${said},” said ${first}, ${won ? (m ? `and walked free with ${nth(m)} mark${m > 1 ? 's' : ''} against him.` : 'and walked free without a mark against him.') : 'and the trap fell.'}</p>`;
    if (s.mode === 'daily') {
      const streak = LW.liveStreak(save, today);
      html += `<p class="v-stats"><span>Pardoned <b>${st.won}</b> of <b>${st.played}</b></span><span>In a row <b>${streak}</b></span><span>Best run <b>${st.bestStreak}</b></span></p>`;
      html += `<div class="v-btns"><button class="btn primary" data-act="share">Share</button><button class="btn" data-act="endless">Endless</button></div>`;
      html += `<p class="v-foot">Nº ${s.no + 1} goes to press in <span id="clock">${countdown()}</span></p>`;
    } else {
      const pardoned = s.no - (won ? 0 : 1);
      html += `<p class="v-stats"><span>Pardoned this docket <b>${pardoned}</b></span><span>Best docket <b>${Math.max(st.bestRun, pardoned)}</b></span></p>`;
      html += `<div class="v-btns">${won ? '<button class="btn primary" data-act="next">Next case</button>' : '<button class="btn primary" data-act="again">New docket</button>'}${save.daily && !LW.isOver(dailyRound()) ? '<button class="btn" data-act="daily">Today’s sheet</button>' : ''}</div>`;
      html += `<p class="v-foot">${won ? 'The docket goes on, and the words grow harder.' : 'Every docket starts from case one.'}</p>`;
    }
    els.verdict.innerHTML = html;
    els.deck.classList.add('done'); els.deck.classList.toggle('still', !!instant);
    els.keys.setAttribute('aria-hidden', 'true'); [...els.keys.querySelectorAll('button')].forEach(b => b.tabIndex = -1);

    if (s.mode === 'daily') clock = setInterval(() => { const c = $('clock'); if (c) c.textContent = countdown(); rollover(); }, 1000);
    if (!instant) setTimeout(() => { const b = els.verdict.querySelector('.primary'); if (b && !matchMedia('(hover:none)').matches) b.focus({ preventScroll: true }); }, 450);
  }
  function hideVerdict() { clearInterval(clock); els.deck.classList.remove('done', 'still'); els.keys.removeAttribute('aria-hidden'); [...els.keys.querySelectorAll('button')].forEach(b => b.tabIndex = 0); }

  // ---- a guess ----
  function press(L) {
    const s = current();
    if (LW.isOver(s)) return;

    if (res.kind === 'again') { k.classList.remove('nope'); void k.offsetWidth; k.classList.add('nope'); Sound.tick(); return; }

    if (res.kind === 'hit') {

      k.classList.add('miss'); k.setAttribute('aria-label', L + ', not in the word');

      chip(k, m, () => { if (current() !== s) return; advance(m); if (m < 6) Sound.creak(); if (!reduce.matches) { els.plate.classList.remove('shake'); void els.plate.offsetWidth; els.plate.classList.add('shake'); } tween('marks', m, 120, 0, ease.out); const t = nodes && nodes.ticks[m - 1]; if (t && t.animate && !reduce.matches) t.animate([{ transform: 'scale(1.6)', transformOrigin: 'center', transformBox: 'fill-box' }, { transform: 'none', transformOrigin: 'center', transformBox: 'fill-box' }], { duration: 260, easing: 'ease-out' }); Sound.clack(0); });

  }
  function chip(key, m, done) {

    const c = document.createElement('div'); c.className = 'chip'; document.body.appendChild(c);

    const mx = (x0 + x1) / 2 + (x1 > x0 ? -1 : 1) * 40, my = Math.min(y0, y1) - 30;

    c.animate(frames, opt).onfinish = () => { c.remove(); done(); };
  }
  function count(n, slot) {
    const c = document.createElement('span'); c.className = 'count'; c.textContent = '×' + n;
    const r = slot.getBoundingClientRect(), w = els.word.getBoundingClientRect();
    c.style.left = (r.left - w.left + r.width / 2) + 'px';
    els.word.appendChild(c); setTimeout(() => c.remove(), 1100);
  }
  function finish(won, delay) {

      later(() => { const slots = [...els.word.children]; let j = 0; [...s.word].forEach((c, i) => { const sp = slots[i].firstChild; if (!sp.textContent) { const jj = j++; later(() => { slots[i].classList.add("missed"); sp.textContent = c; sp.classList.add("press"); }, jj * 70); } }); }, 760);

  // ---- input ----
  // a key acts the moment it is pressed, not when the finger lifts
  els.keys.addEventListener('pointerdown', e => { const b = e.target.closest('.key'); if (b && e.button === 0) { e.preventDefault(); press(b.dataset.l); } });

    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter' && els.deck.classList.contains('done')) { const b = document.activeElement && document.activeElement.closest && document.activeElement.closest('.v-btns .btn') || els.verdict.querySelector('.primary'); if (b) { e.preventDefault(); b.click(); } return; }
    if (/^[a-z]$/i.test(e.key)) {
      const L = e.key.toUpperCase(), k = keyEls[L];
      if (!els.deck.classList.contains('done')) { k.classList.add('down'); setTimeout(() => k.classList.remove('down'), 120); }
      press(L);
    }
  });
  els.verdict.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'share') share(b);
    if (act === 'endless') switchMode('endless');
    if (act === 'daily') switchMode('daily');
    if (act === 'next') { const e2 = save.endless, seen = (e2.seen || []).concat(e2.word).slice(-120); save.endless = Object.assign(LW.endless(e2.no + 1, Math.random, seen), { seen }); persist(); drawRound(save.endless); }
    if (act === 'again') { const seen = (save.endless.seen || []).concat(save.endless.word).slice(-120); save.endless = Object.assign(LW.endless(1, Math.random, seen), { seen }); persist(); drawRound(save.endless); }
  });
  async function share(b) {
    const text = LW.shareText(save.daily);
    try {
      if (navigator.share && matchMedia('(hover:none)').matches) { await navigator.share({ text }); return; }
      await navigator.clipboard.writeText(text); b.textContent = 'Copied';
    } catch (e) { b.textContent = 'Copy failed'; }
    setTimeout(() => { b.textContent = 'Share'; }, 1800);
  }
  function switchMode(m) { if (m === mode) return; mode = m; save.mode = m; const s = current(); persist(); drawRound(s); }
  els.tabs.forEach(t => t.addEventListener('click', () => switchMode(t.dataset.mode)));
  function setSound(on) { Sound.on = on; store.set(SOUND_KEY, on ? 'on' : 'off'); els.snd.classList.toggle('off', !on); els.snd.setAttribute('aria-pressed', on); els.snd.textContent = on ? 'Sound on' : 'Sound off'; }
  els.snd.addEventListener('click', () => { setSound(!Sound.on); if (Sound.on) { Sound.unlock(); Sound.clack(2); } });
  setSound(Sound.on);
  // a new sheet goes to press at midnight
  function rollover() {
    const n = LW.dayNumber(new Date()); if (n === today) return;
    today = n;
    if (mode === 'daily' && (!save.daily || LW.isOver(save.daily) || !save.daily.guesses.length)) { save.daily = LW.daily(today); persist(); drawRound(save.daily); }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rollover(); });
  addEventListener('resize', () => { fitWord(current().word.length); fitName(); });

  // Testing hook: ?stage=n shows a sheet n marks in, for screenshots of the plate.
  const q = new URLSearchParams(location.search);
  if (q.has('stage')) {
    const n = Math.max(0, Math.min(6, +q.get('stage'))), s = LW.round('COLANDER', 'kitchen', 'Ned Blackwood', { mode: 'daily', no: 1, crime: 'stealing a silver spoon' });
    LW.guess(s, 'C'); LW.guess(s, 'O'); LW.guess(s, 'A'); LW.guess(s, 'N'); LW.guess(s, 'E');
    for (const L of 'STIBMU'.slice(0, n)) LW.guess(s, L);
    mode = 'daily'; save = LW.fresh(); Object.assign(save.stats, { played: 6, won: 5, streak: 0, bestStreak: 4, lastNo: 0 }); save.daily = s; today = 1; store.set = () => { };
    LW.record(save, s);
  }
  drawRound(current());
  persist();
})();
</script>
