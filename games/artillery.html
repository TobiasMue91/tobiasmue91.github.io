<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Artillery</title>
<meta name="description" content="Artillery is a turn-based tank duel on destructible hills. Pull back the sling to set angle and power, read the wind, and be first to win 3 rounds. Play the computer or a friend on one screen.">
<meta name="theme-color" content="#2a1a5e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1030;--paper:#fff3dc;--a:#ff5a3c;--a2:#a02a14;--b:#3fd0ff;--b2:#1b7ea3;--gold:#ffc857;--u:min(1vw,1.7vh)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1d1030;overflow:hidden;color:var(--paper);font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.st{font-family:"Saira Stencil One",Impact,"Arial Black",sans-serif;font-weight:400}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none;transition:opacity .3s}
.hud.off{opacity:0}
.chip{justify-self:start;display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding:7px 10px 8px;border-radius:12px;background:rgba(29,16,48,.74);border:2px solid transparent;transition:background .25s,border-color .25s,transform .25s;transform-origin:top left}
.chip.r{justify-self:end;align-items:flex-end;transform-origin:top right}
.chip .nm{font:700 clamp(15px,calc(var(--u)*2.2),21px)/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase}
.chip.l .nm{color:var(--a)}.chip.r .nm{color:var(--b)}
.chip.on.l{background:var(--a);border-color:var(--paper)}.chip.on.r{background:var(--b);border-color:var(--paper)}
.chip.on .nm{color:var(--ink)}
.chip.on{transform:scale(1.04)}
.pips{display:flex;gap:7px}
.pip{width:15px;height:15px;border-radius:50%;border:3px solid rgba(255,243,220,.55);background:rgba(0,0,0,.4);transition:background .3s,transform .3s}
.chip.on .pip{border-color:rgba(29,16,48,.6);background:rgba(29,16,48,.28)}
.pip.f,.chip.on .pip.f{background:var(--gold);border-color:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.pip.pop{transform:scale(1.7)}
.ro{display:flex;gap:10px;font-size:clamp(22px,calc(var(--u)*3.3),30px);line-height:1;min-height:1em;color:var(--paper)}
.ro i{font-style:normal;color:var(--gold)}.chip.on .ro,.chip.on .ro i{color:var(--ink)}
.chip .ro{display:none}
.wind{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 14px 9px;border-radius:12px;background:rgba(29,16,48,.74);min-width:108px}
.wind small{font:700 13px/1 "Barlow Condensed";letter-spacing:.3em;opacity:.8}
.gauge{position:relative;width:96px;height:12px;border-radius:6px;background:rgba(255,243,220,.2);overflow:hidden}
.gauge b{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--gold);transition:width .5s cubic-bezier(.2,.9,.3,1.2),left .5s cubic-bezier(.2,.9,.3,1.2)}
.gauge i{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--paper)}
.wind .wv{font-size:clamp(32px,calc(var(--u)*4.6),44px);line-height:1;display:flex;gap:8px;align-items:center}#windArrows{color:var(--gold);letter-spacing:-.05em;font-size:.8em}
.hint{position:fixed;left:0;right:0;top:19%;text-align:center;text-transform:uppercase;font-size:clamp(22px,6vw,34px);letter-spacing:.1em;text-shadow:0 3px 0 var(--ink),0 0 18px rgba(29,16,48,.9);pointer-events:none;opacity:0;transition:opacity .4s}
.hint.on{opacity:1}
.corner{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:0;background:rgba(29,16,48,.6);color:var(--paper);display:grid;place-items:center;cursor:pointer;opacity:.8;transition:opacity .2s,transform .15s;padding:0}
.corner:hover{opacity:1}.corner:active{transform:scale(.92)}.corner svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#menuBtn{left:max(10px,env(safe-area-inset-left))}#muteBtn{right:max(10px,env(safe-area-inset-right))}
.banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transform:scale(.8)}
.banner.show{animation:ban 1.9s cubic-bezier(.2,.9,.3,1) forwards}
.banner h2{display:inline-block;padding:10px 22px 8px;border-radius:16px;background:rgba(29,16,48,.82);margin:0;font-size:clamp(34px,10vw,76px);line-height:1;letter-spacing:.03em;text-shadow:0 5px 0 var(--ink),0 0 30px rgba(29,16,48,.8)}
.banner p{margin:10px 0 0;font:700 clamp(16px,4vw,24px)/1 "Barlow Condensed";letter-spacing:.24em;text-transform:uppercase;text-shadow:0 2px 0 var(--ink)}
@keyframes ban{0%{opacity:0;transform:scale(.7)}14%{opacity:1;transform:scale(1.06)}22%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(24px,7vw,40px);text-shadow:0 4px 0 var(--ink);pointer-events:none;opacity:0}
.toast.show{animation:toast 1s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,20px);padding:20px;text-align:center;background:linear-gradient(rgba(29,16,48,.15),rgba(29,16,48,.72));opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.screen.on{opacity:1;visibility:visible}
.screen h1{margin:0;font-size:clamp(48px,14vw,124px);line-height:.95;letter-spacing:.02em;text-shadow:0 6px 0 var(--ink),0 0 40px rgba(255,120,80,.35);color:var(--paper)}
.screen h1 em{font-style:normal;color:var(--a)}
.screen .sub{font:700 clamp(15px,3.6vw,22px)/1.2 "Barlow Condensed";letter-spacing:.18em;text-transform:uppercase;opacity:.92;text-shadow:0 2px 0 var(--ink)}
.btns{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);margin-top:10px}
.btn{border:0;border-radius:16px;padding:16px 18px 14px;font:400 clamp(22px,5.4vw,30px)/1 "Saira Stencil One",Impact,sans-serif;letter-spacing:.06em;cursor:pointer;color:var(--ink);background:var(--a);box-shadow:0 6px 0 var(--a2);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--a2)}
.btn.b{background:var(--b);box-shadow:0 6px 0 var(--b2)}.btn.b:active{box-shadow:0 2px 0 var(--b2)}
.btn.g{background:rgba(255,243,220,.14);color:var(--paper);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.corner:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.rec{font:700 clamp(14px,3.4vw,18px)/1.3 "Barlow Condensed";letter-spacing:.16em;text-transform:uppercase;opacity:.9;text-shadow:0 2px 0 var(--ink)}
.big{font-size:clamp(40px,12vw,92px);line-height:1;text-shadow:0 5px 0 var(--ink)}
.score{display:flex;gap:18px;align-items:center;font-size:clamp(34px,10vw,64px);text-shadow:0 4px 0 var(--ink)}
.score .x{opacity:.6}
.screen.t{justify-content:space-between;padding:clamp(40px,12vh,110px) 20px clamp(24px,7vh,70px)}.screen.t .hd{display:flex;flex-direction:column;gap:14px;align-items:center}.screen.t .ft{display:flex;flex-direction:column;align-items:center;gap:14px}
.screen.t{background:linear-gradient(rgba(29,16,48,.1),rgba(29,16,48,0) 40%,rgba(29,16,48,.55))}
#over{background:rgba(29,16,48,.45)}.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px 24px;border-radius:24px;background:rgba(29,16,48,.94);border:3px solid rgba(255,243,220,.85);box-shadow:0 14px 0 rgba(0,0,0,.25);width:min(420px,92vw)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.banner.show{animation:none;opacity:1;transform:none}}
</style>

<body>
<canvas id="c" aria-label="Artillery battlefield"></canvas>
<div class="hud off" id="hud">
  <div class="chip l on" id="chip0"><span class="nm">Ember</span><div class="pips" id="pips0"></div><div class="ro st"><span id="ang0">54°</span><i id="pow0">72</i></div></div>
  <div class="wind" aria-label="Wind"><div class="wv st"><span id="windArrows"></span><span id="windNum">0</span></div><small>WIND</small></div>
  <div class="chip r" id="chip1"><span class="nm" id="nm1">Tide</span><div class="pips" id="pips1"></div><div class="ro st"><span id="ang1">54°</span><i id="pow1">72</i></div></div>
</div>
<div class="hint st" id="hint">Pull back &middot; let go</div>
<div class="banner" id="banner"><h2 class="st" id="banH"></h2><p id="banP"></p></div>
<div class="toast st" id="toast"></div>
<button class="corner" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<button class="corner" id="muteBtn" aria-label="Sound"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>

<div class="screen on t" id="title">
  <div class="hd"><h1 class="st">ARTILLERY</h1>
  <div class="sub">Two tanks &middot; one hill &middot; the wind decides</div></div>
  <div class="ft"><div class="btns">
    <button class="btn" id="goCpu">Vs Computer</button>
    <button class="btn b" id="goTwo">Two Players</button>
    <button class="btn g" id="goResume" hidden>Resume</button>
  </div>
  <div class="rec" id="rec"></div></div>
</div>
<div class="screen" id="over">
 <div class="card">
  <div class="sub" id="overSub"></div>
  <div class="big st" id="overH"></div>
  <div class="score st"><span id="s0"></span><span class="x">:</span><span id="s1"></span></div>
  <div class="rec" id="overRec"></div>
  <div class="btns"><button class="btn" id="again">Rematch</button><button class="btn g" id="home">Menu</button></div>
 </div>
</div>
<script id="core">
/* Artillery core: terrain, shells, craters, damage, wind, matches and the computer. No DOM. */
const Core = (() => {
  const W = 3000, G = 450, VMAX = 1150, WIND_ACC = 50, DT = 1 / 120;
  const TANK_R = 62, PIVOT = 74, MUZZLE = 116, BLAST = 90, DMG = 62, HP = 100, WINS = 3;
  const GROUND_MIN = 120, GROUND_MAX = 560;

  function rng(seed) {
    let a = seed >>> 0;
    const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    f.state = () => a; f.set = s => { a = s >>> 0; };
    return f;
  }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const mix = (a, b, t) => a + (b - a) * t;

  // ---- terrain: one height per column, so a crater can only lower the ground
  function heightAt(h, x) {
    if (x <= 0) return h[0]; if (x >= W) return h[W];
    const i = Math.floor(x), t = x - i; return h[i] * (1 - t) + h[i + 1] * t;
  }
  function makeTerrain(r) {
    const h = new Float32Array(W + 1);
    const waves = [[r() * 6.28, mix(.0022, .0036, r()), mix(60, 110, r())], [r() * 6.28, mix(.005, .008, r()), mix(28, 50, r())], [r() * 6.28, mix(.013, .02, r()), mix(8, 16, r())]];
    const mid = mix(230, 280, r());
    const bc = W / 2 + mix(-160, 160, r()), bh = mix(110, 230, r()), bw = mix(260, 420, r());
    for (let i = 0; i <= W; i++) {
      let v = mid; for (const [p, f, a] of waves) v += Math.sin(i * f + p) * a;
      v += bh * Math.exp(-Math.pow((i - bc) / bw, 2));
      h[i] = clamp(v, GROUND_MIN, GROUND_MAX);
    }
    return h;
  }
  function flatten(h, cx, half, soft) {
    const level = (heightAt(h, cx - half) + heightAt(h, cx + half) + heightAt(h, cx)) / 3;
    for (let i = Math.max(0, Math.floor(cx - half - soft)); i <= Math.min(W, Math.ceil(cx + half + soft)); i++) {
      const d = Math.abs(i - cx); if (d <= half) h[i] = level;
      else { const t = (d - half) / soft; const s = t * t * (3 - 2 * t); h[i] = mix(level, h[i], s); }
    }
  }
  function perch(w, t) { // a tank rests on the mean of the ground under its tracks
    t.y = (heightAt(w.h, t.x - 48) + heightAt(w.h, t.x) + heightAt(w.h, t.x + 48)) / 3;
  }

  function makeWorld(seed) {
    const r = rng(seed), h = makeTerrain(r);
    const x0 = Math.round(mix(500, 700, r())), x1 = Math.round(W - mix(500, 700, r()));
    flatten(h, x0, 80, 110); flatten(h, x1, 80, 110);
    const w = { seed, h, r, wind: mix(-.6, .6, r()), tanks: [] };
    [[x0, 1], [x1, -1]].forEach(([x, dir], i) => {
      const t = { side: i, x, y: 0, hp: HP, angle: dir > 0 ? 52 : 128, power: 62 };
      w.tanks.push(t); perch(w, t);
    });
    return w;
  }
  const center = t => ({ x: t.x, y: t.y + 44 });
  const aimVector = (angle, power) => { const a = angle * Math.PI / 180, v = power / 100 * VMAX; return { x: Math.cos(a) * v, y: Math.sin(a) * v }; };
  const muzzleOf = (t, angle) => { const a = angle * Math.PI / 180; return { x: t.x + Math.cos(a) * MUZZLE, y: t.y + PIVOT + Math.sin(a) * MUZZLE }; };

  // ---- a shell's whole flight, as fixed steps that are the same at any frame rate
  function flight(w, from, angle, power) {
    const shooter = w.tanks[from], m = muzzleOf(shooter, angle), v = aimVector(angle, power);
    let x = m.x, y = m.y, vx = v.x, vy = v.y;
    const path = [x, y], ax = w.wind * WIND_ACC;
    let end = null;
    for (let n = 1; n < 120 * 25 && !end; n++) {
      const px = x, py = y;
      vx += ax * DT; vy -= G * DT; x += vx * DT; y += vy * DT;
      path.push(x, y);
      for (const t of w.tanks) {
        if (t.hp <= 0) continue;
        if (t === shooter && n < 30) continue;
        const c = center(t);
        if (segDist(px, py, x, y, c.x, c.y) <= TANK_R) { end = { x, y, kind: 'tank', tank: t.side }; break; }
      }
      if (end) break;
      if (y <= heightAt(w.h, x)) {
        let lo = 0, hi = 1; // walk back to the surface
        for (let k = 0; k < 12; k++) { const m2 = (lo + hi) / 2; const sx = mix(px, x, m2), sy = mix(py, y, m2); if (sy <= heightAt(w.h, sx)) hi = m2; else lo = m2; }
        const ex = mix(px, x, hi); end = { x: ex, y: heightAt(w.h, ex), kind: 'ground' };
        path[path.length - 2] = end.x; path[path.length - 1] = end.y;
      } else if (x < -300 || x > W + 300) end = { x, y, kind: 'out' };
    }
    if (!end) end = { x, y, kind: 'out' };
    return { path, end, steps: path.length / 2 - 1 };
  }
  function segDist(ax, ay, bx, by, px, py) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0;
    return Math.hypot(ax + dx * t - px, ay + dy * t - py);
  }

  // ---- what the blast does: lowers the ground, hurts what is near, drops tanks onto the new ground
  function explode(w, x, y) {
    const out = { x, y, hits: [], settled: [] };
    if (x >= -BLAST && x <= W + BLAST) {
      for (let i = Math.max(0, Math.ceil(x - BLAST)); i <= Math.min(W, Math.floor(x + BLAST)); i++) {
        const dip = Math.sqrt(BLAST * BLAST - (i - x) * (i - x));
        w.h[i] = Math.max(GROUND_MIN - 60, Math.min(w.h[i], y - dip * 0.82));
      }
    }
    for (const t of w.tanks) {
      if (t.hp <= 0) continue;
      const c = center(t), d = Math.hypot(c.x - x, c.y - y), reach = BLAST + TANK_R;
      if (d < reach) {
        const dmg = Math.max(1, Math.round(DMG * (1 - Math.max(0, d - TANK_R * .5) / (reach - TANK_R * .5))));
        const before = t.hp; t.hp = Math.max(0, t.hp - dmg);
        out.hits.push({ tank: t.side, dmg: before - t.hp, hp: t.hp });
      }
      const from = t.y; perch(w, t); if (Math.abs(from - t.y) > .01) out.settled.push({ tank: t.side, from, to: t.y });
    }
    return out;
  }

  // ---- a match: first to three rounds, shooter alternates, wind drifts a little each shot
  function newMatch(seed, mode) {
    const m = { seed, mode: mode || 'cpu', round: 0, score: [0, 0], turn: 0, over: false, winner: -1, shots: 0, roundWinner: -2, firstOf: 0 };
    startRound(m); return m;
  }
  function startRound(m) {
    m.world = makeWorld((m.seed * 7919 + m.round * 104729) >>> 0);
    m.turn = m.firstOf = m.round % 2; m.roundWinner = -2; m.shots = 0; m.roundDone = false;
    return m;
  }
  function shoot(m, angle, power) {
    if (m.over || m.roundDone) throw new Error('no shot to take');
    const w = m.world, me = w.tanks[m.turn];
    angle = clamp(angle, 2, 178); power = clamp(power, 6, 100);
    me.angle = angle; me.power = power;
    const f = flight(w, m.turn, angle, power);
    const blast = f.end.kind === 'out' ? { x: f.end.x, y: f.end.y, hits: [], settled: [], none: true } : explode(w, f.end.x, f.end.y);
    m.shots++;
    const dead = w.tanks.filter(t => t.hp <= 0).map(t => t.side);
    const res = { shooter: m.turn, angle, power, flight: f, blast, windBefore: w.wind, outcome: 'next' };
    w.wind = clamp(w.wind + (w.r() - .5) * .8, -1, 1);
    res.windAfter = w.wind;
    if (dead.length) {
      m.roundDone = true;
      if (dead.length === 2) { m.roundWinner = -1; res.outcome = 'draw'; }
      else { m.roundWinner = 1 - dead[0]; m.score[m.roundWinner]++; res.outcome = 'round'; if (m.score[m.roundWinner] >= WINS) { m.over = true; m.winner = m.roundWinner; res.outcome = 'match'; } }
    } else m.turn = 1 - m.turn;
    return res;
  }
  function nextRound(m) { if (m.over) return m; m.round++; return startRound(m); }

  // ---- the computer: solves the throw exactly, then misses like a person who is walking a shot in
  function landing(w, from, angle, power) { const f = flight(w, from, angle, power); return f.end; }
  function solve(w, from, targetX) {
    const me = w.tanks[from], dir = targetX > me.x ? 1 : -1;
    let best = null;
    for (let a = 28; a <= 72; a += 4) {
      const ang = dir > 0 ? a : 180 - a;
      let lo = 8, hi = 100;
      for (let k = 0; k < 14; k++) { // landing distance grows with power on these arcs
        const mid = (lo + hi) / 2, e = landing(w, from, ang, mid);
        if ((e.x - targetX) * dir < 0) lo = mid; else hi = mid;
      }
      const p = (lo + hi) / 2, e = landing(w, from, ang, p), err = Math.hypot(e.x - targetX, 0) + (e.kind === 'tank' ? -50 : 0);
      if (!best || err < best.err) best = { angle: ang, power: p, err };
      else if (Math.abs(err - best.err) < 6 && w.r() < .4) best = { angle: ang, power: p, err };
    }
    return best;
  }
  function gauss(r) { return (r() + r() + r() + r() - 2) * 1.7; }
  function aiShot(m, memory) {
    const w = m.world, me = w.tanks[m.turn], foe = w.tanks[1 - m.turn];
    const n = memory.shots || 0, s = solve(w, m.turn, foe.x);
    const sig = .2 * Math.pow(.55, n);
    memory.shots = n + 1;
    return { angle: clamp(s.angle + gauss(w.r) * sig * 14, 4, 176), power: clamp(s.power * (1 + gauss(w.r) * sig), 8, 100) };
  }

  return { W, G, VMAX, WIND_ACC, DT, TANK_R, PIVOT, MUZZLE, BLAST, DMG, HP, WINS, GROUND_MIN, rng, heightAt, makeWorld, center, aimVector, muzzleOf, flight, explode, newMatch, startRound, shoot, nextRound, solve, aiShot, perch };
})();
</script>
<script>
(() => {
'use strict';
const C = Core, $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL = [{ main: '#ff5a3c', dark: '#b8341c', light: '#ff9a7c' }, { main: '#3fd0ff', dark: '#1b8db5', light: '#a4ecff' }];
const INK = '#1d1030', PAPER = '#fff3dc', GOLD = '#ffc857';
const NAMES = ['Ember', 'Tide'];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, mix = (a, b, t) => a + (b - a) * t;

// ---------- storage (v2); the first launch adopts whatever the old page kept

// ---------- layout
let vw, vh, DPR, s, X0, Y0, lift = 0, liftT = 0, bg = null, V = 1150, cam = { x: C.W / 2, t: C.W / 2 };
function layout() {
  DPR = Math.min(2, devicePixelRatio || 1); vw = innerWidth; vh = innerHeight;
  cv.width = Math.round(vw * DPR); cv.height = Math.round(vh * DPR);
  V = vw >= 900 ? 2300 : vw >= 600 ? 1700 : 1150; s = vw / V;
  Y0 = vh * .68 + 250 * s; X0 = vw / 2 - cam.x * s;
  buildBackdrop();
}
const SX = x => X0 + x * s, SY = y => Y0 - y * s + lift;

// ---------- the sky never changes, so paint it once
function buildBackdrop() {
  const BW = Math.round(vw * 1.4), H = Math.round(vh * 1.7), cvb = document.createElement('canvas');
  cvb.width = Math.round(BW * DPR); cvb.height = Math.round(H * DPR);
  const x = cvb.getContext('2d'); x.scale(DPR, DPR);
  const base = H - vh * .34; // screen line of the ground, measured in this tall image
  let gr = x.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#1f1450'); gr.addColorStop(.3, '#4d2a7a'); gr.addColorStop(.52, '#a8457a'); gr.addColorStop(.7, '#f0735a'); gr.addColorStop(.86, '#ffb775'); gr.addColorStop(1, '#ffd39a');
  x.fillStyle = gr; x.fillRect(0, 0, BW, H);
  x.fillStyle = PAPER;
  for (let i = 0; i < 70; i++) { x.globalAlpha = .2 + .6 * ((i * 37) % 9) / 9; const r = ((i * 53) % 10) / 10 > .85 ? 2.2 : 1.4; x.fillRect(((i * 977) % 1000) / 1000 * BW, ((i * 613) % 1000) / 1000 * base * .55, r, r); }
  x.globalAlpha = 1;
  const sx = BW * .5, sy = base - Math.min(vh * .17, 150), sr = Math.min(vw, vh) * .09;
  gr = x.createRadialGradient(sx, sy, sr * .4, sx, sy, vh * .55);
  gr.addColorStop(0, 'rgba(255,225,160,.55)'); gr.addColorStop(1, 'rgba(255,150,100,0)'); x.fillStyle = gr; x.fillRect(0, 0, BW, H);
  x.fillStyle = '#fff0c8'; x.beginPath(); x.arc(sx, sy, sr, 0, 7); x.fill();
  // thin cloud bars crossing the sun
  x.fillStyle = 'rgba(140,50,110,.55)';
  for (let k = 0; k < 4; k++) { const cy = sy - sr * .1 + k * sr * .38; x.fillRect(sx - sr * 1.6 + k * 20, cy, sr * 3.2 - k * 40, 3 + k); }
  [['#7a3a86', .34, 11, 3.1, .2], ['#552b77', .22, 17, 5.3, .5], ['#3a1f5c', .13, 23, 8.1, .9]].forEach(([col, hh, fr, ph, par]) => {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= BW + 8; px += 8) {
      const t = px / BW * Math.PI * 2 * 1.4;
      const yy = base - vh * (.05 + hh * .5) - Math.sin(t * fr / 6 + ph) * vh * hh * .22 - Math.sin(t * fr / 2.3 + ph * 2) * vh * hh * .09 - Math.abs(Math.sin(t * fr / 9 + ph)) * vh * hh * .15;
      x.lineTo(px, yy);
    }
    x.lineTo(BW, H); x.fill();

}

// ---------- the world as drawn: heights ease toward the core's, so craters sink instead of popping
let M = null, shown = null, scorch = null, glow = null, tview = [{}, {}];
function camSnap() { state = 'aim'; ptn = M.turn; cam.t = camTarget(); cam.x = cam.t; X0 = vw / 2 - cam.x * s; }
function worldShow() {
  shown = Float32Array.from(M.world.h); scorch = new Float32Array(C.W + 1); glow = new Float32Array(C.W + 1);
  tview = M.world.tanks.map(t => ({ y: t.y, hp: t.hp, tilt: 0, wob: 0, dead: false }));
}
const colAt = (arr, x) => { const i = clamp(Math.round(x), 0, C.W); return arr[i]; };
function slopeAt(x) { const a = colAt(shown, x - 34), b = colAt(shown, x + 34); return clamp(Math.atan2(b - a, 68), -.55, .55); }

// ---------- effects
const parts = [], floats = []; let shake = 0, flash = 0, hitstop = 0;
function burst(x, y, n, o) {
  if (RM) n = Math.ceil(n / 4);
  for (let i = 0; i < n; i++) {
    const a = (o.up ? -Math.PI / 2 + (Math.random() - .5) * (o.spread || 2.4) : Math.random() * 6.28), v = mix(o.v0, o.v1, Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: -Math.sin(a) * v * (o.up ? -1 : 1), life: 0, max: mix(o.l0, o.l1, Math.random()), r: mix(o.r0, o.r1, Math.random()), col: o.col[i % o.col.length], grav: o.grav, kind: o.kind || 'dot', drag: o.drag || 0 });
  }
  if (parts.length > 500) parts.splice(0, parts.length - 500);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt; if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy -= p.grav * dt; if (p.drag) { const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; }
    p.vx += wind() * 22 * dt * (p.kind === 'smoke' ? 1 : .2); p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.life += dt; if (f.life > f.max) floats.splice(i, 1); }
  shake = Math.max(0, shake - dt * 28); flash = Math.max(0, flash - dt * 3.2);
  for (let i = 0; i <= C.W; i++) if (glow[i] > 0) glow[i] = Math.max(0, glow[i] - dt * .45);
}
const wind = () => M ? M.world.wind : 0;

// ---------- sound: everything is synthesised
let AC = null, master = null, windG = null;
function audio() {
  if (AC || save.mute) return AC;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .7; master.connect(AC.destination);
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AC._noise = buf;
    const n = AC.createBufferSource(); n.buffer = buf; n.loop = true; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = .6;
    windG = AC.createGain(); windG.gain.value = 0; n.connect(f); f.connect(windG); windG.connect(master); n.start();
  } catch (e) { AC = null; }
  return AC;
}
const nowT = () => AC.currentTime;
function tone(type, f0, f1, dur, vol, delay) {
  if (!AC || save.mute) return; const t = nowT() + (delay || 0), o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, f0, f1, delay) {
  if (!AC || save.mute) return; const t = nowT() + (delay || 0), n = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();
  n.buffer = AC._noise; f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0008, t + dur); n.connect(f); f.connect(gn); gn.connect(master); n.start(t, Math.random()); n.stop(t + dur + .05);
}
const sfx = {
  twang(p) { tone('triangle', 180 + p * 3, 70, .28, .35); tone('sawtooth', 520, 90, .12, .12); },
  launch() { noise(.35, .5, 1800, 120); tone('square', 140, 50, .25, .25); },
  whistle(d) { tone('sine', 1500, 420, d, .07, .15); },
  boom(sz) { noise(.9 * sz, .9, 2400, 60); tone('sine', 110, 28, .7 * sz, .8); },
  thud() { noise(.25, .5, 800, 90); tone('sine', 90, 40, .25, .5); },
  tick() { tone('square', 880, 880, .04, .05); },
  pip() { tone('triangle', 660, 990, .12, .18); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, .35, .22, i * .11)); },
  lose() { [392, 330, 262].forEach((f, i) => tone('triangle', f, f * .98, .4, .2, i * .15)); },
  stretch(p) { tone('sine', 140 + p * 4.5, 140 + p * 4.5, .05, .04); }

// ---------- state
let mode = 'title', state = 'title', paused = false, cpu = true;
let aim = { a: 52, p: 62 }, shot = null, ft = 0, fast = false, stateT = 0, think = null, cpuMem = [{}, {}];
let lastMark = [null, null], snap = null, ptn = 0;

function startMatch(vsCpu, seed) {
  cpu = vsCpu; M = C.newMatch(seed, vsCpu ? 'cpu' : 'two'); cpuMem = [{}, {}];
  lastMark = [null, null]; parts.length = floats.length = 0;
  $('nm1').textContent = vsCpu ? 'Tide · CPU' : 'Tide';
  worldShow(); camSnap(); beginTurn(true); setScreen(null); $('hud').classList.remove('off'); drawPips(true);
}
function today() { return Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5); }
function seedParam() { const m = /[?&]seed=(\d+)/.exec(location.search); return m ? +m[1] : null; }
function newSeed(first) { const p = seedParam(); if (first && p != null) return p; return first && cpu ? today() : (Math.random() * 1e9) | 0; }

function beginTurn(first) {
  ptn = M.turn; const t = M.world.tanks[ptn]; aim = { a: t.angle, p: t.power }; shot = null; snap = null;
  state = 'aim'; stateT = 0; setChips(); showReadout();
  const human = !(cpu && M.turn === 1);
  if (!human) { state = 'think'; think = { t: 0, to: C.aiShot(M, cpuMem[1]), from: { a: aim.a, p: aim.p } }; }
  if (!cpu && !first) toast(NAMES[M.turn].toUpperCase(), COL[M.turn].main);
  $('hint').classList.toggle('on', human && !save.seen && M.score[0] + M.score[1] === 0 && M.shots === 0);
}
function setChips() {

}
function showReadout() {
  for (let i = 0; i < 2; i++) {
    const t = M.world.tanks[i], a = i === ptn ? aim.a : t.angle, p = i === ptn ? aim.p : t.power;
    $('ang' + i).textContent = Math.round(a) + '°'; $('pow' + i).textContent = Math.round(p);
  }
}
function drawPips(pop) {
  for (let i = 0; i < 2; i++) {
    const el = $('pips' + i); if (el.children.length !== C.WINS) { el.innerHTML = ''; for (let k = 0; k < C.WINS; k++) el.appendChild(Object.assign(document.createElement('i'), { className: 'pip' })); }
    [...el.children].forEach((p, k) => { const f = k < M.score[i]; if (f && !p.classList.contains('f') && pop) { p.classList.add('pop'); setTimeout(() => p.classList.remove('pop'), 350); } p.classList.toggle('f', f); });
  }
}
function setWindUI(v) {
  const n = Math.round(Math.abs(v) * 10), k = n === 0 ? 0 : Math.min(3, Math.ceil(n / 3.4));
  $('windNum').textContent = n === 0 ? 'CALM' : n; $('windArrows').textContent = n === 0 ? '' : (v < 0 ? '◀' : '▶').repeat(k);
}
let toastT = 0;
function toast(txt, col) { const e = $('toast'); e.textContent = txt; e.style.color = col || PAPER; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show'); }

// ---------- aiming: pull the shell back, let go
const maxPull = () => clamp(vw * .2, 70, 140);
const pivotPx = t => ({ x: SX(t.x), y: SY(tview[t.side].y + C.PIVOT) });
let drag = null;
function setAim(a, p) { aim.a = clamp(a, 2, 178); aim.p = clamp(p, 0, 100); const t = M.world.tanks[ptn]; t.angle = aim.a; t.power = Math.max(6, aim.p); showReadout(); }
cv.addEventListener('pointerdown', e => {
  audio(); if (AC && AC.state === 'suspended') AC.resume();
  if (state === 'fly') { fast = true; return; }
  if (state !== 'aim' || paused) return;
  const t = M.world.tanks[ptn], pv = pivotPx(t);
  const len = aim.p / 100 * maxPull(), kx = pv.x - Math.cos(aim.a * RAD) * len, ky = pv.y + Math.sin(aim.a * RAD) * len;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, kx, ky, moved: false, pv };
  cv.setPointerCapture(e.pointerId); cv.classList.add('drag');
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0; if (!drag.moved && Math.hypot(dx, dy) < 5) return; if (!drag.moved) $('hint').classList.remove('on'); drag.moved = true;
  const fx = drag.pv.x - (drag.kx + dx), fy = (drag.ky + dy) - drag.pv.y; // fire vector, y up
  const len = Math.hypot(fx, fy); let a = Math.atan2(Math.max(fy, 0), fx) / RAD;
  if (fy < 0) a = fx >= 0 ? 2 : 178;
  const pw = clamp(len / maxPull(), 0, 1) * 100, prev = aim.p;
  setAim(a, pw); if (Math.abs(pw - prev) > 0) sfx.stretch(pw);
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return; const d = drag; drag = null; cv.classList.remove('drag');
  if (d.moved && !cancel && aim.p >= 12 && state === 'aim') fire();
  else if (d.moved) { const t = M.world.tanks[ptn]; snap = { t: 0, a0: aim.a, p0: aim.p }; setAim(t.angle, Math.max(6, t.power)); }
}
cv.addEventListener('pointerup', e => endDrag(e, false));
cv.addEventListener('pointercancel', e => endDrag(e, true));
addEventListener('keydown', e => {
  if (e.key === 'Escape') { openMenu(); return; }
  if (state !== 'aim' || paused) return;
  const k = e.shiftKey ? 5 : 1; let used = true;
  if (e.key === 'ArrowLeft') setAim(aim.a + k, aim.p); else if (e.key === 'ArrowRight') setAim(aim.a - k, aim.p);
  else if (e.key === 'ArrowUp') setAim(aim.a, aim.p + k); else if (e.key === 'ArrowDown') setAim(aim.a, aim.p - k);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); audio(); fire(); } else used = false;
  if (used) e.preventDefault();
});

// ---------- a shot, start to finish
function fire() {
  if (state !== 'aim' && state !== 'think') return;
  const who = ptn; setAim(aim.a, Math.max(6, aim.p));
  shot = C.shoot(M, aim.a, Math.max(6, aim.p)); ft = 0; fast = false; state = 'fly'; stateT = 0;
  const m = C.muzzleOf(M.world.tanks[who], shot.angle);
  sfx.twang(aim.p); sfx.launch(); sfx.whistle(Math.min(3.2, shot.flight.steps * C.DT * .9));
  burst(m.x, m.y, 14, { v0: 80, v1: 260, l0: .25, l1: .6, r0: 3, r1: 8, col: ['#fff3dc', '#ffc857', '#ff9a5c'], grav: -40, kind: 'smoke', drag: 3 });
  snap = { t: 0, a0: aim.a, p0: aim.p, fired: true }; shake = Math.max(shake, RM ? 0 : 5);
  $('hint').classList.remove('on'); if (!save.seen) { save.seen = true; store(); }
  showReadout(); setChips();
}
function impact() {
  const r = shot.blast, e = shot.flight.end, who = shot.shooter;
  if (r.none) { floats.push({ x: clamp(e.x, 40, C.W - 40), y: 260, txt: 'WIDE', col: PAPER, life: 0, max: 1.2, vy: 40 }); state = 'after'; stateT = 0; return; }
  const big = r.hits.some(h => M.world.tanks[h.tank].hp <= 0);
  sfx.boom(big ? 1.5 : 1); if (r.hits.length) setTimeout(() => sfx.thud(), 60);
  burst(r.x, r.y, 26, { up: true, v0: 120, v1: 520, l0: .5, l1: 1.3, r0: 3, r1: 7, col: ['#5b2c4a', '#7a3a5a', '#8c4a4a', '#3d1f3a'], grav: 760, spread: 2.9 });
  burst(r.x, r.y, 22, { v0: 100, v1: 480, l0: .15, l1: .5, r0: 2.5, r1: 5, col: ['#fff3dc', '#ffc857', '#ff7a3c'], grav: 200, drag: 2 });
  burst(r.x, r.y, 12, { up: true, v0: 40, v1: 160, l0: .9, l1: 1.8, r0: 14, r1: 28, col: ['rgba(60,35,70,.55)'], grav: -60, kind: 'smoke', drag: 1.2, spread: 2.2 });
  parts.push({ x: r.x, y: r.y, vx: 0, vy: 0, life: 0, max: .38, r: C.BLAST * 1.7, col: '#fff3dc', grav: 0, kind: 'ring' });
  parts.push({ x: r.x, y: r.y, vx: 0, vy: 0, life: 0, max: .45, r: C.BLAST * (big ? 2 : 1.35), col: '#ffb347', grav: 0, kind: 'fire' });
  burst(r.x, r.y, 9, { up: true, v0: 160, v1: 460, l0: .7, l1: 1.4, r0: 9, r1: 17, col: ['#6a3a4a', '#4a2a3a', '#8a5a4a'], grav: 820, spread: 3.1 });
  for (let i = Math.max(0, Math.floor(r.x - C.BLAST * 1.4)); i <= Math.min(C.W, Math.ceil(r.x + C.BLAST * 1.4)); i++) { const t = 1 - Math.abs(i - r.x) / (C.BLAST * 1.4); scorch[i] = Math.max(scorch[i], Math.min(.95, t * 1.1)); glow[i] = Math.max(glow[i], t); }
  shake = RM ? 0 : (big ? 34 : 18 + r.hits.length * 8); flash = RM ? 0 : (big ? .55 : .22); hitstop = RM ? 0 : (r.hits.length ? .09 : .04);
  lastMark[who] = { x: r.x, y: r.y };
  for (const h of r.hits) {
    const t = M.world.tanks[h.tank]; floats.push({ x: t.x, y: t.y + 290, txt: '−' + h.dmg, pop: true, col: h.tank === who ? GOLD : COL[h.tank].light, life: 0, max: 1.15, vy: 50, big: true });
    if (h.hp <= 0) { tview[h.tank].dead = true; burst(t.x, t.y + 30, 40, { v0: 120, v1: 640, l0: .5, l1: 1.4, r0: 4, r1: 10, col: [COL[h.tank].main, COL[h.tank].dark, '#ffc857', '#2a1a3a'], grav: 640 }); burst(t.x, t.y + 40, 14, { up: true, v0: 40, v1: 220, l0: 1, l1: 2.4, r0: 16, r1: 34, col: ['rgba(40,25,50,.6)'], grav: -80, kind: 'smoke', drag: 1 }); }
    else tview[h.tank].wob = 1;
  }
  state = 'after'; stateT = 0;
}
function afterShot() {
  const o = shot.outcome; setWindUI(shot.windAfter);
  if (o === 'next') { beginTurn(false); return; }
  state = 'roundEnd'; stateT = 0; setChips();
  const w = M.roundWinner;
  if (w === -1) banner('DOUBLE KNOCKOUT', 'Round replayed', PAPER);
  else { banner(NAMES[w].toUpperCase() + ' TAKES IT', M.over ? 'Match point' : 'Round ' + (M.round + 1), COL[w].main); drawPips(true); sfx.pip(); }
}
function nextRound() {
  if (M.over) { finish(); return; }
  if (M.roundWinner === -1) M.round--; // a draw is replayed on a fresh hill
  C.nextRound(M); worldShow(); camSnap(); lastMark = [null, null]; setWindUI(M.world.wind); drawPips(); beginTurn(true);
}
function finish() {
  state = 'over'; const w = M.winner, you = cpu ? w === 0 : null;
  if (cpu) { save.played++; if (you) { save.w++; save.streak++; save.best = Math.max(save.best, save.streak); } else { save.l++; save.streak = 0; } store(); }
  (you === false ? sfx.lose : sfx.win)();
  $('overSub').textContent = 'Final score';
  $('overH').textContent = cpu ? (you ? 'YOU WIN' : 'TIDE WINS') : NAMES[w].toUpperCase() + ' WINS';
  $('overH').style.color = PAPER; $('overH').style.textShadow = `0 5px 0 ${COL[w].main}`; $('s0').textContent = M.score[0]; $('s1').textContent = M.score[1];
  $('overRec').textContent = cpu ? recLine() : ''; setScreen('over'); $('hud').classList.add('off');
}
const recLine = () => `All time: ${save.w} won · ${save.l} lost · streak ${save.streak}${save.best > 2 ? ' · best ' + save.best : ''}`;

// ---------- menus
function openMenu() {

  $('goResume').hidden = false; $('rec').textContent = save.played ? recLine() : 'Pull back, let go. Wind pushes the shell.'; setScreen('title'); $('hud').classList.add('off');
}
$('menuBtn').onclick = () => { audio(); openMenu(); };
$('goResume').onclick = () => { paused = false; mode = 'play'; setScreen(null); $('hud').classList.remove('off'); };
$('goCpu').onclick = () => { audio(); mode = 'play'; paused = false; cpu = true; const first = save.day !== today(); save.day = today(); store(); startMatch(true, first ? newSeed(true) : newSeed(false)); setWindUI(M.world.wind); };
$('goTwo').onclick = () => { audio(); mode = 'play'; paused = false; startMatch(false, newSeed(false)); setWindUI(M.world.wind); };

  } else if (state === 'roundEnd') {
    if (stateT > 2.2) nextRound();
  }
  if (windG && AC && !save.mute) windG.gain.setTargetAtTime(Math.abs(wind()) * .05, AC.currentTime, .3);
}

document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && state === 'aim') {/* aiming has no clock to lose */} });
layout(); muteUI(); titleRec();
M = C.newMatch(seedParam() || today(), 'cpu'); worldShow(); state = 'idle'; setWindUI(M.world.wind); drawPips();
requestAnimationFrame(frame);
window.__art = { get M() { return M; }, get state() { return state; }, startMatch, aimTo: (a, p) => setAim(a, p), fire, setScreen, get save() { return save; } };
})();
