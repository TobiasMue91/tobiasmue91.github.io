<body>
<canvas id="c" aria-label="Flyway: the marsh. Click or tap a bird to shoot."></canvas>
<div id="ui"></div>
<button id="pause" aria-label="Pause"><svg viewBox="0 0 22 22"><rect x="5" y="4" width="4" height="14" fill="currentColor"/><rect x="13" y="4" width="4" height="14" fill="currentColor"/></svg></button>
<button id="snd" class="link">Sound on</button>
<a id="credit" href="https://www.gptgames.dev/">gptgames.dev</a>
<div class="sr" aria-live="polite" id="sr"></div>
<script id="core">
// Flyway's rules: a DOM-free, fixed-step hunt. Everything here runs in game time, in plate units
// (a mallard is 72 long), and is checked by test/duck_hunt.mjs. The page only paints it.
const Core = (function () {
    'use strict';
    const STEP = 1 / 120;
    function mulberry(a) {
        return function () {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    function hashStr(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h >>> 0;
    }
    // speed in units/s, turn in rad/s, jink = seconds between new headings, r = body radius for the hit test
    const SPECIES = {
        mallard: {name: 'Mallard', pts: 100, speed: 150, len: 72, turn: 2.2, jink: [0.9, 1.8], r: 23},
        teal: {name: 'Teal', pts: 150, speed: 195, len: 56, turn: 3.4, jink: [0.5, 1.1], r: 18},
        pintail: {name: 'Pintail', pts: 200, speed: 215, len: 84, turn: 1.6, jink: [1.4, 2.6], r: 22},
        wood: {name: 'Wood duck', pts: 250, speed: 170, len: 66, turn: 4.4, jink: [0.35, 0.8], r: 20},
        goose: {name: 'Canada goose', pts: 1000, speed: 118, len: 124, turn: 1.5, jink: [1.1, 2.0], r: 38, hp: 3}
    };
    const NEW_AT = {0: 'mallard', 1: 'teal', 2: 'pintail', 4: 'wood'};
    const STOPS = [
        {name: 'Lake of the Woods', where: 'Minnesota', time: 'dawn', shore: 'woods'},
        {name: 'Upper Mississippi', where: 'Minnesota', time: 'morning', shore: 'bluffs'},
        {name: 'Horicon Marsh', where: 'Wisconsin', time: 'noon', shore: 'flat'},
        {name: 'Illinois River', where: 'Illinois', time: 'afternoon', shore: 'woods'},
        {name: 'Reelfoot Lake', where: 'Tennessee', time: 'dusk', shore: 'cypress'},
        {name: 'White River', where: 'Arkansas', time: 'dawn', shore: 'hills'},
        {name: 'The Delta', where: 'Mississippi', time: 'morning', shore: 'flat'},
        {name: 'Atchafalaya Basin', where: 'Louisiana', time: 'afternoon', shore: 'cypress'},
        {name: 'Gulf Coast', where: 'Louisiana', time: 'dusk', shore: 'flat'}
    ];
    const FLUSHES = 5, PER = 2, SHELLS = 3, GANDER_SHELLS = 6, R = 30, R_CHOKE = 44;
    const INTRO = 3.2, GAP = 0.8, RUSTLE = 0.6, OUT_OF_SHELLS = 0.45;

    const stopInfo = i => Object.assign({lap: Math.floor(i / 9)}, STOPS[i % STOPS.length]);
    const roster = i => Object.keys(NEW_AT).filter(k => +k <= i).map(k => NEW_AT[k]);
    const newSpecies = i => NEW_AT[i] || null;
    const quota = i => [5, 6, 6, 7, 7, 7, 8, 8, 9][Math.min(i, 8)];
    const speedMul = i => Math.min(2.4, 0.86 + 0.075 * i);
    const flushTime = i => Math.max(4.4, 7.5 - 0.35 * i);
    const hasGander = i => (i + 1) % 3 === 0;
    const ptsMul = i => 1 + 0.25 * i;
    const pts = (base, i) => Math.round(base * ptsMul(i) / 10) * 10;
    const roman = n => {
        const t = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
        let s = '';
        for (const [v, r] of t) while (n >= v) { s += r; n -= v; }
        return s;
    };

    // Which birds come in which flush, and which wear a band. Depends only on the season seed and the
    // stop, so a daily flight hands everyone the same birds.
    function planStop(seed, i) {
        const rnd = mulberry(seed ^ Math.imul(i + 1, 0x9E3779B1));
        const kinds = roster(i);
        const fresh = newSpecies(i);
        const pick = () => {
            // the newest species shows up often on its own stop, so it is met, not just listed
            if (fresh && fresh !== 'mallard' && rnd() < 0.35) return fresh;
            return kinds[Math.floor(rnd() * kinds.length)];
        };
        const flushes = [];
        let bands = 0;
        for (let f = 0; f < FLUSHES; f++) {
            const birds = [];
            for (let b = 0; b < PER; b++) {
                const band = !(i === 0 && f < 2) && bands < 2 && rnd() < 0.11;
                if (band) bands++;
                birds.push({kind: pick(), band, seed: Math.floor(rnd() * 2147483647)});
            }
            flushes.push(birds);
        }
        if (hasGander(i)) flushes.push([{kind: 'goose', band: false, seed: Math.floor(rnd() * 2147483647), gander: true}]);
        return flushes;
    }

    function Game(opts) {
        const seed = opts.seed >>> 0;
        const g = {
            seed, daily: !!opts.daily, w: opts.w, h: opts.h, hz: opts.hz,
            stop: 0, score: 0, phase: 'intro', t: 0, pt: 0, events: [], birds: [], shells: 0, maxShells: SHELLS,
            flush: 0, plan: null, tally: [], perk: {shell: false, calm: 0, choke: 0}, freeze: 0, acc: 0,
            flushT: 0, emptyT: 0, nextId: 1, summary: null, shots: 0, kills: 0, stopsCleared: 0,
            log: {shots: 0, kills: 0, doubles: 0, escapes: 0, byKind: {}}
        };
        const emit = e => g.events.push(e);

        function startStop() {
            g.plan = planStop(seed, g.stop);
            g.tally = [];
            g.flush = -1;
            g.perk = {shell: false, calm: 0, choke: 0};
            g.stopScore = 0;
            g.bonus = {clean: 0, doubles: 0, perfect: 0, gander: 0};
            g.birds = [];
            g.shells = 0;
            setPhase('intro');
            emit({type: 'stop', stop: g.stop});
        }
        function setPhase(p) { g.phase = p; g.pt = 0; }

        function beginFlush() {
            g.flush++;
            const list = g.plan[g.flush];
            const gander = list[0].gander;
            g.maxShells = gander ? GANDER_SHELLS : SHELLS + (g.perk.shell ? 1 : 0);
            g.shells = g.maxShells;
            g.flushT = 0; g.emptyT = 0;
            g.gander = !!gander;
            g.birds = [];
            const used = [];
            list.forEach((spec, k) => {
                const r = mulberry(spec.seed);
                let x;
                for (let n = 0; n < 12; n++) {
                    x = g.w * (0.14 + 0.72 * r());
                    if (used.every(u => Math.abs(u - x) > g.w * 0.22)) break;
                }
                used.push(x);
                const sp = SPECIES[spec.kind];
                g.birds.push({
                    id: g.nextId++, kind: spec.kind, band: spec.band, gander: !!spec.gander, rnd: r,
                    x, y: g.h * 0.98, vx: 0, vy: 0, th: -Math.PI / 2, tht: -Math.PI / 2, flap: r() * 6,
                    state: 'wait', delay: k * (0.15 + 0.3 * r()), t: 0, jinkT: 0, hp: sp.hp || 1, boost: 0,
                    riseTo: Math.min(g.hz - 90, Math.max(g.hz * 0.2, g.hz - 100 - 160 * r())), ground: 0, spin: 0, rot: 0, outcome: null
                });
            });
            g.calmNow = g.perk.calm > 0; g.chokeNow = g.perk.choke > 0;
            if (g.perk.calm > 0) g.perk.calm--;
            if (g.perk.choke > 0) g.perk.choke--;
            setPhase('rustle');
            emit({type: 'rustle', xs: g.birds.map(b => b.x), shells: g.shells, gander: g.gander});
        }

        function speedOf(b) {
            const sp = SPECIES[b.kind];
            return sp.speed * speedMul(g.stop) * (g.calmNow ? 0.68 : 1) * (b.boost > 0 ? 1.35 : 1);
        }
        const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

        function steer(b, dt) {
            const sp = SPECIES[b.kind];
            const m = sp.len * 0.6, top = g.h * 0.05 + m * 0.5, low = g.hz - Math.max(m * 0.6, g.hz * 0.22); // keep clear of the dark treeline
            b.jinkT -= dt;
            if (b.jinkT <= 0) {
                b.jinkT = sp.jink[0] + (sp.jink[1] - sp.jink[0]) * b.rnd();
                const right = b.x < g.w * 0.3 ? true : b.x > g.w * 0.7 ? false : b.rnd() < 0.5;
                b.tht = (right ? 0 : Math.PI) + (b.rnd() - 0.5) * (right ? 1 : -1) * 1.5;
            }
            // walls push the wanted heading inward; they never teleport the bird
            if (b.x < m && Math.cos(b.tht) < 0.3) b.tht = (b.rnd() - 0.5) * 0.9;
            if (b.x > g.w - m && Math.cos(b.tht) > -0.3) b.tht = Math.PI + (b.rnd() - 0.5) * 0.9;
            if (b.y < top && Math.sin(b.tht) < 0.2) b.tht = Math.cos(b.th) >= 0 ? 0.55 : Math.PI - 0.55;
            if (b.y > low && Math.sin(b.tht) > -0.2) b.tht = Math.cos(b.th) >= 0 ? -0.55 : -Math.PI + 0.55;
            // past a wall the bird banks hard; a slow-turning pintail would otherwise overshoot it
            const out = b.x < m * 0.6 || b.x > g.w - m * 0.6 || b.y < top * 0.6;
            const d = angDiff(b.th, b.tht), turn = sp.turn * (b.boost > 0 ? 1.6 : 1) * (out ? 3 : 1) * dt;
            b.th += Math.max(-turn, Math.min(turn, d));
        }

        function step(dt) {
            g.t += dt; g.pt += dt;
            if (g.phase === 'intro') { if (g.pt >= INTRO) beginGap(); return; }
            if (g.phase === 'gap') { if (g.pt >= GAP) { if (g.flush + 1 >= g.plan.length) endStop(); else beginFlush(); } return; }
            if (g.phase === 'tally' || g.phase === 'over') return;
            if (g.freeze > 0) { g.freeze -= dt; return; }
            if (g.phase === 'rustle' && g.pt >= RUSTLE) { setPhase('flush'); emit({type: 'flush'}); }
            if (g.phase === 'flush') {
                g.flushT += dt;
                const limit = g.gander ? flushTime(g.stop) + 4 : flushTime(g.stop);
                const flying = g.birds.filter(b => b.state === 'rise' || b.state === 'fly');
                if (flying.length && g.shells === 0) g.emptyT += dt;
                if (flying.length && (g.flushT >= limit || g.emptyT >= OUT_OF_SHELLS)) {
                    flying.forEach(b => { b.state = 'escape'; b.tht = -Math.PI / 2 + (b.rnd() - 0.5) * 0.8; });
                    emit({type: 'escaping', why: g.shells === 0 ? 'shells' : 'time'});
                }
            }
            for (const b of g.birds) moveBird(b, dt);
            if (g.phase === 'flush' && g.birds.every(b => b.state === 'down' || b.state === 'gone')) endFlush();
        }

        function moveBird(b, dt) {
            const sp = SPECIES[b.kind];
            b.t += dt;
            if (b.boost > 0) b.boost -= dt;
            if (b.state === 'wait') {
                if (g.phase !== 'flush') return;
                b.delay -= dt;
                if (b.delay <= 0) {
                    b.state = 'rise';
                    b.th = -Math.PI / 2 + (b.rnd() - 0.5) * 0.7;
                    emit({type: 'rise', id: b.id, kind: b.kind, x: b.x});
                }
                return;
            }
            if (b.state === 'down' || b.state === 'gone') return;
            if (b.state === 'fall') {
                b.vy += 900 * dt;
                b.vx *= Math.exp(-1.5 * dt);
                b.x += b.vx * dt; b.y += b.vy * dt;
                b.rot += b.spin * dt;
                b.x = Math.max(sp.len * 0.3, Math.min(g.w - sp.len * 0.3, b.x));
                if (b.y >= b.ground) { b.y = b.ground; b.state = 'down'; emit({type: 'splash', id: b.id, x: b.x, y: b.y, kind: b.kind}); }
                b.flap += dt * 3;
                return;
            }
            const s = speedOf(b);
            if (b.state === 'rise') {

            const len = Math.min(118, Core.SPECIES[k].len * 1.35);
            g.save(); g.scale(4 / 3, 4 / 3); drawBird(g, k, 74, 52, len, {face: 1, flap: 1.1, ground: STAMP}); g.restore();
        });
    }
    function introCard(stop) {
        const s = Core.stopInfo(stop);
        const el = show('<div class="k">Stop ' + Core.roman(stop + 1) + (game.daily ? ' · today’s flight' : '') + '</div><div class="n">' + s.name + '</div>' +
            '<div class="t">' + s.where + ' · ' + TIMES[s.time].label + '</div>' + rosterHTML(stop) +
            '<div class="q">Take ' + Core.quota(stop) + ' <span>of 10</span></div>', 'card');
        paintRoster(el);
        el.onclick = () => game && game.skip();
        say('Stop ' + (stop + 1) + ', ' + s.name + '. Take ' + Core.quota(stop) + ' of 10.');
    }
    function tallyCanvas(list, quota) {
        const c = document.createElement('canvas'); c.className = 'tallyc'; c.width = 520; c.height = 68;
        const g = c.getContext('2d'); g.scale(2, 2);
        for (let i = 0; i < 10; i++) glyph(g, 13 + i * 26, 18, 19, list[i] || '');
        list.forEach((v, i) => { if (v === 'miss') { g.strokeStyle = RED; g.lineWidth = 1.6; g.beginPath(); g.moveTo(13 + i * 26 - 8, 25); g.lineTo(13 + i * 26 + 8, 10); g.stroke(); } });
        const qx = 13 + (quota - 0.5) * 26;
        g.strokeStyle = RED; g.lineWidth = 1.5; g.beginPath(); g.moveTo(qx, 4); g.lineTo(qx, 30); g.stroke();
        return c;
    }
    function resultCard(sum) {
        const s = Core.stopInfo(sum.stop), b = sum.bonus;
        const lines = [];
        if (b.doubles) lines.push(['Doubles', '×' + b.doubles]);
        if (b.clean) lines.push(['Clean flushes', '+' + fmt(b.clean)]);
        if (b.gander) lines.push(['The goose', '+' + fmt(b.gander)]);
        if (b.perfect) lines.push(['All ten', '+' + fmt(b.perfect)]);
        lines.push(['Stop ' + Core.roman(sum.stop + 1), fmt(sum.stopScore)]);
        const linesHTML = '<div class="lines">' + lines.map((l, i) => '<div' + (i === lines.length - 1 ? ' class="tot"' : '') + '><span>' + l[0] + '</span><span>' + l[1] + '</span></div>').join('') + '</div>';
        if (sum.passed) {
            const nx = Core.stopInfo(sum.stop + 1);
            const el = show('<div class="k">Stop ' + Core.roman(sum.stop + 1) + '</div><div class="n">' + sum.hits + ' of 10 taken</div><div class="t">' + s.name + ' · ' + sum.quota + ' were needed</div><div id="tl"></div>' + linesHTML +
                (sum.perfect ? '<div class="seal">all<br>ten</div>' : '') +
                '<button class="btn primary" id="on">Fly on south<small>Stop ' + Core.roman(sum.stop + 2) + ' · ' + nx.name + '</small></button>', 'card');
            el.querySelector('#tl').appendChild(tallyCanvas(game.tally, sum.quota));
            el.querySelector('#on').onclick = () => { Snd.init(); game.next(); };
            say(sum.hits + ' of 10 taken. Stop score ' + sum.stopScore + '.');
        } else {
            game.next();
        }
    }
    function overCard(sum) {
        const daily = game.daily, d = today();
        let best = false;
        if (daily) {
            if (!store.daily || store.daily.date !== d) store.daily = {date: d, best: 0};
            if (game.score > store.daily.best) { store.daily.best = game.score; best = game.score > 0; }
        }
        if (game.score > store.best) { store.best = game.score; best = !daily ? game.score > 0 : best; }
        store.bestStop = Math.max(store.bestStop, game.stopsCleared);
        save();
        const reached = Core.stopInfo(sum.stop);
        const el = show('<div class="k">The season closes</div><div class="n">' + sum.hits + ' taken, ' + sum.quota + ' needed</div>' +
            '<div class="t">' + reached.name + ', Stop ' + Core.roman(sum.stop + 1) + '</div><div id="tl"></div>' +
            '<div class="lines"><div class="tot"><span>Season score</span><span>' + fmt(game.score) + '</span></div><div><span>Stops flown</span><span>' + game.stopsCleared + '</span></div>' +
            '<div><span>' + (daily ? 'Today’s best' : 'Best season') + '</span><span>' + fmt(daily ? store.daily.best : store.best) + '</span></div></div>' +
            (best ? '<div class="seal">new<br>best</div>' : '') +
            '<div class="row2"><button class="btn primary" id="again">' + (daily ? 'Fly it again' : 'Again') + '</button><button class="btn" id="home">Title</button></div>', 'card');
        el.querySelector('#tl').appendChild(tallyCanvas(game.tally, sum.quota));
        el.querySelector('#again').onclick = () => start(daily);
        el.querySelector('#home').onclick = () => titleScreen();
        say('The season closes. Score ' + game.score + '.');
    }
    function pauseCard() {
        paused = true;
        const el = show('<div class="k">Paused</div><div class="n">' + fmt(game.score) + '</div><div class="t">Stop ' + Core.roman(game.stop + 1) + ' · ' + Core.stopInfo(game.stop).name + '</div>' +
            '<button class="btn primary" id="res">Resume</button><div class="row2"><button class="btn" id="snd2">' + (store.mute ? 'Sound off' : 'Sound on') + '</button><button class="btn" id="quit">Leave</button></div>', 'card');
        el.querySelector('#res').onclick = resume;
        el.querySelector('#snd2').onclick = e => { toggleMute(); e.currentTarget.textContent = store.mute ? 'Sound off' : 'Sound on'; };
        el.querySelector('#quit').onclick = () => titleScreen();
        el.querySelector('#res').focus({preventScroll: true});
    }
    function resume() {
        if (!paused) return;
        paused = false;
        show(null);
        if (game.phase === 'intro') introCard(game.stop);
        if (game.phase === 'tally' && game.summary) resultCard(game.summary);
    }
    function toggleMute() { store.mute = !store.mute; save(); Snd.init(); Snd.setMute(store.mute); }

    // ---------- game events -> paint and sound ----------
    function handle(events) {
        for (const e of events) {
            switch (e.type) {
                case 'stop':
                    setTime(e.stop); makeReeds(); introCard(e.stop); tallyT = [];
                    break;
                case 'rustle':
                    if (ui.firstElementChild) show(null);
                    for (const x of e.xs) rustles.push({x, t: clock});
                    reloadT = clock; Snd.reload();
                    setTimeout(() => Snd.whistle(e.xs.length), 0);
                    break;
                case 'rise':
                    if (e.kind === 'goose') Snd.honk(); else if (Math.random() < 0.7) Snd.quack(e.kind);
                    rustles.push({x: e.x, t: clock});
                    break;
                case 'shot': {
                    Snd.shot();
                    kick = 1;
                    const pel = [];
                    for (let i = 0; i < 16; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * e.r; pel.push([Math.cos(a) * r, Math.sin(a) * r]); }
                    fx.bursts.push({x: e.x, y: e.y, r: e.r, t: clock, pel, hit: e.kills.length + e.grazes.length > 0});
                    fx.ejects.push({i: e.shells, t: clock});
                    for (const k of e.kills) {
                        fx.stars.push({x: k.x, y: k.y, t: clock, r: Core.SPECIES[k.kind].len * 0.55});
                        const n = k.kind === 'goose' ? 16 : 10;
                        for (let i = 0; i < n; i++) {
                            const a = Math.random() * 6.283, sp = 40 + Math.random() * 110;
                            fx.feathers.push({x: k.x, y: k.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, rot: Math.random() * 6, ph: Math.random() * 6, t: clock,
                                life: 1.6 + Math.random() * 1.2, s: 0.7 + Math.random() * 0.6, dark: Math.random() < 0.35});
                        }
                        fx.pops.push({x: k.x, y: k.y - 58, text: '+' + fmt(k.pts), t: clock, big: e.double || k.gander});
                        tallyT.push(clock);
                        if (k.kind !== 'goose' && Math.random() < 0.5) setTimeout(() => Snd.quack(k.kind), 60);
                    }
                    for (const gz of e.grazes) {
                        flash.set(gz.id, clock);
                        for (let i = 0; i < 5; i++) { const a = Math.random() * 6.283; fx.feathers.push({x: gz.x, y: gz.y, vx: Math.cos(a) * 70, vy: Math.sin(a) * 70, rot: 0, ph: Math.random() * 6, t: clock, life: 1.4, s: 0.9, dark: true}); }
                        fx.pops.push({x: gz.x, y: gz.y - 40, text: gz.hp === 1 ? 'one more' : 'hit', t: clock, small: true});
                        Snd.honk();
                    }
                    if (e.double) { fx.seals.push({text: 'Double', t: clock}); }
                    break;
                }
                case 'dry': Snd.dry(); fx.bursts.push({x: e.x, y: e.y, r: 10, t: clock, pel: [], dry: true}); break;
                case 'splash': fx.splashes.push({x: e.x, y: e.y, t: clock, big: e.kind === 'goose'}); Snd.splash(); break;
                case 'escaped': if (!e.gander) tallyT.push(clock); break;
                case 'escaping': if (e.why === 'time') Snd.whistle(1); break;
                // after the last flush the result card lists it; a seal would only hide behind the card
                case 'clean': if (game.flush + 1 < game.plan.length) fx.seals.push({text: 'Clean flush', sub: '+' + fmt(e.pts), t: clock + 0.15}); break;
                case 'perk': {
                    const name = {shell: 'A fourth shell', calm: 'Calm air', choke: 'Open choke'}[e.perk];
                    const sub = {shell: 'for the rest of this stop', calm: 'the next two flushes fly slower', choke: 'a wider pattern, two flushes'}[e.perk];
                    fx.seals.push({text: name, sub, t: clock + 0.1, band: true});
                    Snd.tink();
                    break;
                }
                case 'tally':
                    Snd.thud();
                    setTimeout(() => { if (game && game.phase === 'tally' && !paused) resultCard(e.summary); }, 0);
                    break;
                case 'over': overCard(game.summary); break;
            }
        }
    }

    // ---------- input ----------
    function toUnits(cx, cy) { return {x: (cx - L.px) / L.u, y: (cy - L.py) / L.u}; }
    function inPlate(cx, cy) { return cx >= L.px && cx <= L.px + L.pw && cy >= L.py && cy <= L.py + L.ph; }
    cv.addEventListener('pointerdown', e => {
        Snd.init();
        if (mode !== 'play' || paused || !game) return;
        e.preventDefault();
        if (game.phase === 'intro') { game.skip(); return; }
        if (game.phase === 'tally' || game.phase === 'over') return;
        if (!inPlate(e.clientX, e.clientY)) return;
        const p = toUnits(e.clientX, e.clientY);
        game.shoot(p.x, p.y);
        handle(game.drain());
    });
    cv.addEventListener('pointermove', e => { mouse = e.pointerType === 'mouse' ? {x: e.clientX, y: e.clientY} : null; });
    cv.addEventListener('pointerleave', () => { mouse = null; });
    function sndLabel() {
        $('snd').innerHTML = '<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/>' +
            (store.mute ? '<path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.5"/>' : '<path d="M11 5.5q2 2.5 0 5M12.8 4q3.4 4 0 8" stroke="currentColor" stroke-width="1.3" fill="none"/>') +
            '</svg>' + (store.mute ? 'Sound off' : 'Sound on');
        $('snd').setAttribute('aria-pressed', String(!store.mute));
    }
    $('snd').addEventListener('click', () => { toggleMute(); sndLabel(); });
    $('pause').addEventListener('click', () => { if (mode === 'play' && !paused) pauseCard(); else if (paused) resume(); });
    window.addEventListener('keydown', e => {
        if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
        if (mode !== 'play' || !game) return;
        if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { e.preventDefault(); if (paused) resume(); else pauseCard(); return; }
        if ((e.key === ' ' || e.key === 'Enter') && !paused) {
            if (game.phase === 'intro') { e.preventDefault(); game.skip(); return; }
            const btn = ui.querySelector('.card:not(.out) .btn.primary');
            if (btn && document.activeElement === document.body) { e.preventDefault(); btn.click(); }
        }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused && game && game.phase !== 'over') pauseCard(); });
    let rt = 0;
    window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
            layout();
            if (game) game.resize(L.wu, L.hu, L.hzu);
            renderStatic(timeKey, game ? game.stop + 1 : 1, shoreKey);
            makeReeds();
            const card = ui.firstElementChild;
            if (card) paintRoster(card);
        }, 80);
    });

    // ---------- the frame ----------
    function update(dt) {
        clock += dt;
        kick *= Math.exp(-dt * 18);
        if (mode === 'play' && game && !paused) {
            game.advance(dt);
            handle(game.drain());
        }
        for (const f of fx.feathers) {
            const fdt = dt;
            f.vx *= Math.exp(-2.4 * fdt); f.vy += (26 - f.vy) * (1 - Math.exp(-2.2 * fdt));
            f.x += (f.vx + Math.sin((clock - f.t) * 3 + f.ph) * 22) * fdt; f.y += f.vy * fdt;
        }
        const alive = (a, life) => a.filter(o => clock - o.t < (o.life || life));
        fx.feathers = alive(fx.feathers, 2.5); fx.bursts = alive(fx.bursts, 0.6); fx.pops = alive(fx.pops, 0.85); fx.stars = alive(fx.stars, 0.3);
        fx.splashes = alive(fx.splashes, 1.4); fx.seals = alive(fx.seals, 1.5); fx.ejects = alive(fx.ejects, 0.6);
        for (let i = rustles.length - 1; i >= 0; i--) if (clock - rustles[i].t > 1) rustles.splice(i, 1);
    }

    function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (STATIC) ctx.drawImage(STATIC, 0, 0, W, H);
        const {px, py, pw, ph, u} = L;
        const ky = reduce.matches ? 0 : kick * 3;
        ctx.save();
        ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
        if (ky > 0.05 && STATIC) ctx.drawImage(STATIC, px * dpr, py * dpr, pw * dpr, ph * dpr, px, py + ky, pw, ph);
        ctx.translate(px, py + ky); ctx.scale(u, u);
        const hu = L.hu;
        ctx.fillStyle = INK;
        // glints on the water under the sun come and go in place
        if (!reduce.matches) {
            const sunX = TIMES[timeKey].sun[0] * L.wu, water = hu - L.hzu;
            ctx.fillStyle = STAMP;
            for (let i = 0; i < 22; i++) {
                const a = Math.sin(clock * (0.9 + hash(i * 5) * 0.8) + hash(i * 3) * 6.28);
                if (a <= 0.2) continue;
                const gy = L.hzu + 4 + hash(i * 7 + 1) * water * 0.55, gx = sunX + (hash(i * 11 + 2) - 0.5) * (30 + (gy - L.hzu) * 1.2);
                ctx.globalAlpha = (a - 0.2) * 1.1; ctx.fillRect(gx, gy, 6 + hash(i * 13) * 16, 1.6);
            }
            ctx.globalAlpha = 1; ctx.fillStyle = INK;
        }
        for (const rd of REEDS) if (!rd.front) drawReed(ctx, rd, clock, hu);
        // splash rings on the water
        for (const s of fx.splashes) {
            const a = (clock - s.t) / 1.4;
            ctx.strokeStyle = INK;
            for (let k = 0; k < 3; k++) {
                const q = ease(a * 1.2 - k * 0.15);
                if (q <= 0) continue;
                ctx.globalAlpha = (1 - a) * 0.9; ctx.lineWidth = 1.4 / u * (1 - q * 0.5);
                ctx.beginPath(); ctx.ellipse(s.x, s.y, (8 + q * (s.big ? 70 : 46)), (2 + q * (s.big ? 12 : 8)), 0, 0, 7); ctx.stroke();
            }
            if (a < 0.4) {
                ctx.fillStyle = INK;
                for (let k = 0; k < 7; k++) { const q = a / 0.4, dx = (k - 3) * 6 * q, dy = -Math.sin(q * Math.PI) * (14 + (k % 3) * 8); ctx.globalAlpha = 1 - q; ctx.beginPath(); ctx.arc(s.x + dx, s.y + dy, 1.4, 0, 7); ctx.fill(); }
            }
            ctx.globalAlpha = 1;
        }
        if (mode === 'title') drawTitleBirds();
        if (game) {
            for (const b of game.birds) {
                if (b.state === 'wait' || b.state === 'gone' || b.state === 'down') continue;
                const sp = Core.SPECIES[b.kind];
                const fl = false;
                let tilt, face = b.vx >= 0 ? 1 : -1;
                if (b.state === 'fall') tilt = b.rot;
                else tilt = Math.max(b.state === 'rise' ? -0.6 : -0.85, Math.min(0.6, Math.atan2(b.vy, Math.abs(b.vx) + 1) * 0.55));
                drawBird(ctx, b.kind, b.x, b.y, sp.len, {face, tilt, flap: b.flap, fold: b.state === 'fall', flash: fl, band: b.band && b.state !== 'fall',
                    glint: Math.sin(clock * 6 + b.id) > 0.6});
            }
        }
        ctx.fillStyle = INK;
        for (const rd of REEDS) if (rd.front) drawReed(ctx, rd, clock, hu);
        // feathers rock as they drift down
        for (const f of fx.feathers) {
            const a = (clock - f.t) / f.life, al = a > 0.7 ? 1 - (a - 0.7) / 0.3 : 1;
            ctx.save(); ctx.globalAlpha = al; ctx.translate(f.x, f.y); ctx.rotate(f.rot + Math.sin((clock - f.t) * 3.2 + f.ph) * 0.7); ctx.scale(f.s, f.s);
            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(-2, -3.6, 7, -0.6); ctx.quadraticCurveTo(-1, 3.4, -8, 0); ctx.closePath();
            ctx.fillStyle = f.dark ? INK2 : STAMP; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 0.8 / u; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-10, 0.6); ctx.lineTo(6, -0.4); ctx.stroke();
            ctx.restore();
        }
        // the shot: a spray of pellets and a ring the size of the pattern
        // a hit: engraved strokes radiating from the bird, quick as the shot
        for (const s of fx.stars) {
            const a = (clock - s.t) / 0.3, q = ease(a);
            ctx.globalAlpha = 1 - a;
            ctx.beginPath();
            for (let i = 0; i < 14; i++) { const an = i / 14 * 6.283 + 0.2, r0 = s.r * (0.6 + 0.5 * q), r1 = s.r * (0.9 + 0.7 * q) * (i % 2 ? 0.8 : 1); ctx.moveTo(s.x + Math.cos(an) * r0, s.y + Math.sin(an) * r0); ctx.lineTo(s.x + Math.cos(an) * r1, s.y + Math.sin(an) * r1); }
            ctx.strokeStyle = PAPER; ctx.lineWidth = 6 / u; ctx.stroke();
            ctx.strokeStyle = RED; ctx.lineWidth = 2.6 / u; ctx.stroke(); ctx.globalAlpha = 1;
        }
        for (const s of fx.bursts) {
            const a = (clock - s.t) / 0.6;
            // a paper flash where the shot went, so even a miss in the hatching shows
            if (a < 0.4 && !s.hit) { const q = a / 0.4; ctx.globalAlpha = (1 - q) * 0.92; ctx.fillStyle = STAMP; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (s.dry ? 0.6 : 0.45 + 0.6 * ease(q)), 0, 7); ctx.fill(); }
            ctx.globalAlpha = 1 - ease(a);
            ctx.strokeStyle = INK; ctx.lineWidth = (s.dry ? 1.4 : 2.2) / u;
            const rr = s.dry ? s.r * (0.5 + a) : s.r * (0.55 + 0.45 * ease(a * 3));
            ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, 7); ctx.stroke();
            ctx.fillStyle = INK;
            const sp = 0.7 + 0.3 * ease(a * 3);
            for (const p of s.pel) { ctx.beginPath(); ctx.arc(s.x + p[0] * sp, s.y + p[1] * sp, 2.8, 0, 7); ctx.fill(); }
            if (!s.dry && a < 0.5) { ctx.strokeStyle = PAPER; ctx.lineWidth = 3 / u; ctx.globalAlpha = (1 - a * 2) * 0.9; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.3 * (1 + a * 2), 0, 7); ctx.stroke(); }
            ctx.globalAlpha = 1;
        }
        // points, in the cartridge red
        for (const p of fx.pops) {
            const a = (clock - p.t) / 0.85;
            ctx.globalAlpha = a > 0.65 ? 1 - (a - 0.65) / 0.35 : 1;
            const size = p.big ? 30 : p.small ? 17 : 24;
            ctx.font = 'italic ' + (p.small ? 400 : 700) + ' ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const y = p.y - 34 * ease(a * 2.2);
            ctx.lineWidth = 4 / u; ctx.strokeStyle = PAPER; ctx.lineJoin = 'round'; ctx.strokeText(p.text, p.x, y);
            ctx.fillStyle = p.small ? INK : RED; ctx.fillText(p.text, p.x, y);
            ctx.globalAlpha = 1;
        }
        ctx.restore();
        // seals: a word pressed into the sky, in screen pixels
        for (const s of fx.seals) {
            const a = (clock - s.t) / 1.5;
            if (a < 0) continue;
            const sc = reduce.matches ? 1 : (a < 0.2 ? 1.25 - 0.25 * back(a / 0.2) : 1);
            ctx.save(); ctx.globalAlpha = a > 0.75 ? 1 - (a - 0.75) / 0.25 : Math.min(1, a / 0.08);
            ctx.translate(px + pw / 2, py + L.hz * 0.2); ctx.rotate(-0.04); ctx.scale(sc, sc);
            const fs = L.phone ? 26 : 34;
            ctx.font = 'italic 700 ' + fs + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 6; ctx.strokeStyle = PAPER; ctx.lineJoin = 'round'; ctx.strokeText(s.text, 0, 0);
            ctx.fillStyle = s.band ? INK : RED; ctx.fillText(s.text, 0, 0);
            if (s.sub) { ctx.font = 'italic 400 ' + Math.round(fs * 0.55) + 'px ' + FONT; ctx.lineWidth = 4; ctx.strokeText(s.sub, 0, fs * 0.85); ctx.fillStyle = INK; ctx.fillText(s.sub, 0, fs * 0.85); }
            ctx.restore();
        }
        // the flush timer: a rule that closes in from both ends
        if (game && (game.phase === 'flush' || game.phase === 'rustle')) {
            // the birds ride the two ends of the rule inward; when they meet, the flush flies off
            const left = game.flushLeft(), half = (pw / 2 - 26) * left, late = left < 0.28;
            const th = L.phone ? 6 : 8, ty2 = py + 6;
            ctx.fillStyle = PAPER; ctx.fillRect(px + pw / 2 - half - 3, ty2 - 3, half * 2 + 6, th + 6);
            ctx.fillStyle = late ? RED : INK;
            if (late && !reduce.matches) ctx.globalAlpha = 0.65 + 0.35 * Math.sin(clock * 16);
            ctx.fillRect(px + pw / 2 - half, ty2, half * 2, th);
            ctx.globalAlpha = 1;
            const gs = L.phone ? 20 : 26;
            if (half > 4) {
                ctx.save(); ctx.translate(px + pw / 2 - half - gs * 0.55, ty2 + th / 2 + 1); ctx.scale(-1, 1); glyph(ctx, 0, 0, gs, 'hit'); ctx.restore();
                glyph(ctx, px + pw / 2 + half + gs * 0.55, ty2 + th / 2 + 1, gs, 'hit');
            }
        }
        $('pause').style.visibility = game && (game.phase === 'tally' || game.phase === 'over') && !paused ? 'hidden' : 'visible';
        drawMargins();
        drawHints();
        if (mouse && mode === 'play' && game && !paused && inPlate(mouse.x, mouse.y) && game.phase !== 'tally' && game.phase !== 'over') drawReticle();
    }

    // the first flush of a player's first season names the two things nobody can guess: the shells and the timer
    function drawHints() {
        if (!game || game.stop !== 0 || game.flush !== 0 || store.seasons > 1) return;
        if (game.phase !== 'rustle' && game.phase !== 'flush') return;
        const a = Math.min(1, game.flushT * 3) * (game.flushT > 3.5 ? Math.max(0, 1 - (game.flushT - 3.5) * 2) : 1);
        if (a <= 0) return;
        ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = RED; ctx.font = 'italic 700 ' + (L.phone ? 14 : 17) + 'px ' + FONT;
        ctx.textBaseline = 'top'; ctx.lineWidth = 4; ctx.strokeStyle = PAPER; ctx.lineJoin = 'round';
        // set on a slip of paper so the hatching cannot eat the letters
        const label = (txt, x, y, align) => {
            const w = ctx.measureText(txt).width, hgt = L.phone ? 20 : 24, x0 = align === 'center' ? x - w / 2 : x - w;
            ctx.fillStyle = STAMP; ctx.fillRect(x0 - 8, y, w + 16, hgt);
            ctx.strokeStyle = RED; ctx.lineWidth = 1; ctx.strokeRect(x0 - 8 + 0.5, y + 0.5, w + 15, hgt - 1);
            ctx.fillStyle = RED; ctx.textAlign = align; ctx.fillText(txt, x, y + 3);
        };
        label('when the two ducks meet, the birds are gone', L.px + L.pw / 2, L.py + 20, 'center');
        label('three shells a flush \u2193', L.px + L.pw - 8, L.py + L.ph - (L.phone ? 28 : 32), 'right');
        ctx.restore();
    }

    function drawTitleBirds() {
        // the stamp's subject: a drake mallard and a pintail, held in the engraving
        const t = clock;
        let big = L.phone ? 1.9 : 2.3, cx, cy;
        if (L.phone) { cx = L.wu * 0.52; cy = L.hzu * 0.24; }
        else {
            // the pair takes the sky to the right of the lettering, however narrow it gets
            const tb = ui.firstElementChild && ui.firstElementChild.getBoundingClientRect();
            const left = tb && tb.width ? (tb.right - L.px) / L.u + 12 : L.wu * 0.5;
            big = Math.max(0.9, Math.min(big, (L.wu * 0.97 - left) / 1.85 / 72));
            cx = L.wu * 0.97 - 0.68 * 72 * big; cy = L.hzu * 0.42;
        }
        const bob = reduce.matches ? 0 : 1;
        drawBird(ctx, 'mallard', cx, cy + Math.sin(t * 1.6) * 4 * bob, 72 * big, {face: 1, tilt: -0.12, flap: reduce.matches ? 1.2 : t * 5.5});
        drawBird(ctx, 'pintail', cx - 72 * big * 0.62, cy + 72 * big * 0.42 + Math.sin(t * 1.6 + 1.3) * 4 * bob, 84 * big * 0.72, {face: 1, tilt: -0.08, flap: reduce.matches ? 0.4 : t * 5.5 + 2.1});
    }

    function drawMargins() {
        const {px, py, pw, ph, top, bot, sx, sy, sw} = L;
        const ml = px - 4, mr = px + pw + 4;
        const fs = topFont();
        ctx.fillStyle = INK; ctx.textBaseline = 'middle';
        const ty = sy + top / 2 + 1;
        ctx.font = '700 ' + fs + 'px ' + FONT; ctx.textAlign = 'left';
        if ('letterSpacing' in ctx) ctx.letterSpacing = L.phone ? '0.05em' : '0.12em';
        if (mode === 'title' || !game) {
            ctx.fillText('MIGRATORY WATERFOWL', ml, ty);
            ctx.textAlign = 'right'; ctx.fillText('SEASON OF ' + new Date().getFullYear(), mr, ty);
        } else {
            const s = Core.stopInfo(game.stop);
            const label = (L.phone ? '' : 'STOP ') + Core.roman(game.stop + 1) + '  ·  ' + s.name.toUpperCase();
            const room = mr - cartW() - 48 - ml;
            let f = fs;
            while (f > 9 && ctx.measureText(label).width > room) { f--; ctx.font = '700 ' + f + 'px ' + FONT; }
            ctx.fillText(label, ml, ty);
        }
        if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
        if (mode === 'play' && game) {
            // the denomination: your score, in a cartouche
            const cw = cartW(), ch = Math.min(top - 12, 34), cx = mr - cw, cy = ty - ch / 2;
            ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.strokeRect(cx, cy, cw, ch); ctx.lineWidth = 0.6; ctx.strokeRect(cx + 3, cy + 3, cw - 6, ch - 6);
            ctx.font = '700 ' + Math.max(11, Math.round(ch * 0.34)) + 'px ' + FONT; ctx.textAlign = 'left';
            if ('letterSpacing' in ctx) ctx.letterSpacing = '0.14em';
            ctx.fillText('SCORE', cx + 10, ty + 1);
            if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
            ctx.font = '700 ' + Math.round(ch * 0.6) + 'px ' + FONT; ctx.textAlign = 'right';
            ctx.fillText(fmt(game.score), mr - 10, ty + 1);
            // bottom margin: the tally, the quota, the perks, the shells
            const by = py + ph + 4 + bot * 0.36;
            const n = game.maxShells || 3, sh = L.phone ? (n > 4 ? 26 : 36) : Math.min(56, bot * 0.7), gapS = sh * 0.6;
            const shellsW = (n - 1) * gapS + sh * 0.6;
            const ts = L.phone ? Math.min(25, (pw - shellsW - 18) / 10 / 1.12) : Math.min(36, bot * 0.42, (pw * 0.6) / 10 / 1.3), stepX = ts * (L.phone ? 1.12 : 1.3);
            const x0 = ml + ts * 0.55;
            for (let i = 0; i < 10; i++) {
                const v = game.tally[i] || '';
                const at = tallyT[i], age = at == null ? 9 : clock - at;
                const pop = v === 'hit' && age < 0.3 && !reduce.matches ? 1 + 0.45 * (1 - ease(age / 0.3)) : 1;
                glyph(ctx, x0 + i * stepX, by, ts, v, pop);
                if (v === 'miss') {
                    const q = Math.min(1, age / 0.25);
                    ctx.strokeStyle = RED; ctx.lineWidth = 1.8; ctx.beginPath();
                    ctx.moveTo(x0 + i * stepX - ts * 0.42, by + ts * 0.3);
                    ctx.lineTo(x0 + i * stepX - ts * 0.42 + ts * 0.84 * q, by + ts * 0.3 - ts * 0.66 * q); ctx.stroke();
                }
            }
            const q = Core.quota(game.stop), qx = x0 + (q - 0.5) * stepX;
            const met = game.tally.filter(v => v === 'hit').length >= q;
            ctx.strokeStyle = met ? INK : RED; ctx.fillStyle = met ? INK : RED; ctx.lineWidth = 1.8;
            const sr = L.phone ? Math.max(9, ts * 0.42) : Math.min(12, ts * 0.36), sy2 = by + ts * 0.45 + sr;
            ctx.beginPath(); ctx.moveTo(qx, by - ts * 0.62); ctx.lineTo(qx, sy2 - sr); ctx.stroke();
            // the quota, in a small seal
            ctx.beginPath(); ctx.arc(qx, sy2, sr, 0, 7); ctx.fill();
            ctx.strokeStyle = STAMP; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(qx, sy2, sr - 2.2, 0, 7); ctx.stroke();
            ctx.fillStyle = STAMP; ctx.font = '700 ' + Math.round(sr * 1.15) + 'px ' + FONT; ctx.textAlign = 'center';
            ctx.fillText(met ? '✓' : String(q), qx, sy2 + 1);
            if (!L.phone) { ctx.fillStyle = met ? INK : RED; ctx.font = 'italic ' + Math.round(sr * 1.25) + 'px ' + FONT; ctx.textAlign = 'right'; ctx.fillText(met ? 'quota met' : 'need', qx - sr - 5, sy2 + 1); }
            // shells
            const shells = game.phase === 'flush' || game.phase === 'rustle' ? game.shells : 0;
            for (let i = 0; i < n; i++) {
                const x = mr - sh * 0.25 - (n - 1 - i) * gapS, live = i < shells;
                const age = clock - reloadT - i * 0.07, slide = live && age < 0.25 && !reduce.matches ? (1 - ease(age / 0.25)) * 14 : 0;
                const last = live && shells === 1 && game.phase === 'flush' && !reduce.matches;
                if (last) { ctx.save(); ctx.translate(x, by + sh / 2); const k = 1 + 0.07 * Math.sin(clock * 9); ctx.scale(k, k); drawShell(ctx, 0, 0, sh, true, 1); ctx.restore(); }
                else drawShell(ctx, x, by + sh / 2 + slide, sh, live, live && age < 0 ? 0 : 1);
            }
            for (const e of fx.ejects) {
                const a = (clock - e.t) / 0.6, x = mr - sh * 0.25 - (n - 1 - e.i) * gapS;
                if (reduce.matches) continue;
                ctx.save(); ctx.translate(x - 40 * ease(a), by + sh / 2 - 22 * Math.sin(a * Math.PI * 0.9));
                ctx.rotate(-a * 5); drawShell(ctx, 0, sh / 2, sh, true, 1 - a); ctx.restore();
            }
            // perks between
            const perks = [];
            if (game.phase === 'tally' || game.phase === 'over') perks.length = 0;
            else {
                if (game.perk.shell) perks.push('fourth shell');
                if (game.calmNow) perks.push('calm air · slower birds');
                if (game.chokeNow) perks.push('open choke · wider shot');
            }
            if (perks.length) {
                ctx.fillStyle = INK; ctx.font = 'italic 700 ' + (L.phone ? 14 : 17) + 'px ' + FONT;
                if (L.phone) {
                    // the margin is full on a phone: the plate's top corner, under the timer
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.lineWidth = 4; ctx.strokeStyle = PAPER; ctx.lineJoin = 'round';
                    perks.forEach((p, i) => { const yy = py + 22 + i * 18; ctx.strokeText(p, px + 10, yy); ctx.fillText(p, px + 10, yy); });
                } else {
                    // beside the shells, since that is what they change
                    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                    const rx = mr - sh * 0.25 - (n - 1) * gapS - sh * 0.5 - 14;
                    perks.forEach((p, i) => ctx.fillText(p, rx, by + sh * 0.3 + (i - (perks.length - 1) / 2) * 21));
                }
                ctx.textBaseline = 'middle';
            }
        } else {
            ctx.font = 'italic ' + (L.phone ? 13 : 15) + 'px ' + FONT; ctx.textAlign = 'center';
        }
    }

    function drawReticle() {
        const r = game.patternR() * L.u * (1 + kick * 0.35), x = mouse.x, y = mouse.y - kick * 6;
        ctx.save();
        ctx.strokeStyle = PAPER; ctx.lineWidth = 3.5; ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
        ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
        ctx.beginPath();
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.moveTo(x + dx * r * 0.55, y + dy * r * 0.55); ctx.lineTo(x + dx * r * 1.25, y + dy * r * 1.25); }
        ctx.stroke();
        ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill();
        ctx.restore();
    }

    let last = performance.now();
    function loop(now) {
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
        update(dt); draw();
        requestAnimationFrame(loop);
    }

    // test hooks (?debug): drive the page from a script without guessing at the canvas
    window.__flyway = {get game() { return game; }, get L() { return L; }, start, titleScreen, store, units: toUnits, setTime};

    layout();
    renderStatic('dawn', 1);
    makeReeds();
    titleScreen();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); const c = ui.firstElementChild; if (c) paintRoster(c); });
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
