<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070c1a">
<title>WORD RAIN — a typing incremental</title>
<meta name="description" content="A typing incremental. Words fall like rain over a sleeping town; type them before they land and the lamp pays you in lumen. Spend it in the workshop on a constellation of upgrades, hire a lamplighter, a night watch, a scholar and a choir to type beside you, then greet the dawn to start again with stars. Freeze the storm, blast a cluster, call down thunder, and open new districts.">
<style>
:root{--ink:#070c1a;--word:#dbe8ff;--soft:#9db2de;--lamp:#ffbf47;--ice:#bff3ff;--bad:#ff6b5e;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--word);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .4s ease}
#app.playing #hud,#app.paused #hud{opacity:1}
#score{font-size:42px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 2px 0 #050914}
#multrow{display:flex;align-items:center;gap:9px;margin-top:7px;height:34px;font-weight:700;color:#eaf1ff;font-size:28px;transition:opacity .25s ease}
#multrow.off{opacity:.55}
#multrow.hot #mult{background:#eaf1ff;color:#0a1020;border-radius:8px;padding:0 9px;min-width:0;box-shadow:0 0 18px rgba(234,241,255,.45)}
#mult{display:inline-block;min-width:1.7em;transform-origin:0 60%}
#mult.pop{animation:pop .32s cubic-bezier(.2,1.6,.4,1)}
#mult.break{animation:brk .3s ease-out;color:var(--bad)}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes brk{0%{transform:translateX(0)}25%{transform:translateX(-5px)}60%{transform:translateX(4px)}100%{transform:translateX(0)}}
.bar{width:110px;height:8px;border-radius:4px;background:#27335a;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:#eaf1ff}
#right{position:relative;text-align:right;color:#cfdcfa;font-weight:600;font-size:19px;letter-spacing:.02em;pointer-events:auto}
#wavename{display:block;line-height:1.2;text-shadow:0 2px 0 #050914}
#right .bar{margin:8px 0 0 auto;width:130px;height:7px}
#right .bar i{background:#8fb3ff}
#right .bar.ice{position:absolute;right:0;top:100%;margin-top:6px;opacity:0;transition:opacity .25s}
#right .bar.ice.on{opacity:1}
#right .bar.ice i{background:var(--ice)}
#btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid #2b3a6b;background:rgba(10,16,38,.7);color:#c4d4f7;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s,transform .12s}
.ib:hover{background:#18244a}.ib:active{transform:scale(.92)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#banner b{display:block;font-size:clamp(40px,7vw,76px);font-weight:700;letter-spacing:.02em;color:#fff;text-shadow:0 0 30px rgba(143,179,255,.55),0 3px 0 #050914}
#banner span{display:block;margin-top:2px;font-size:clamp(17px,2.4vw,24px);font-style:italic;color:var(--soft);letter-spacing:.14em;text-transform:uppercase}
#banner.go{animation:ban 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ban{0%{opacity:0;transform:translateY(14px) scale(.96)}16%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(70% 60% at 50% 45%,rgba(5,9,20,.9),rgba(5,9,20,.55));opacity:0}
.screen.show{display:flex;animation:fade .45s ease forwards}
@keyframes fade{to{opacity:1}}
h1{margin:0;font-size:clamp(56px,13vw,132px);font-weight:700;line-height:.95;letter-spacing:.01em;color:var(--word);text-shadow:0 4px 0 #050914,0 0 40px rgba(143,179,255,.35)}
h1 em{font-style:italic;color:var(--lamp);text-shadow:0 0 28px rgba(255,191,71,.65),0 4px 0 #050914}
.tag{margin:16px 0 30px;font-size:clamp(17px,2.4vw,23px);font-style:italic;color:var(--soft)}
.btn{font:700 19px/1 var(--serif);letter-spacing:.04em;border-radius:999px;padding:16px 38px;border:2px solid var(--lamp);background:var(--lamp);color:#1a1100;cursor:pointer;min-width:220px;transition:transform .12s,box-shadow .2s,background .2s;box-shadow:0 0 0 rgba(255,191,71,0)}
.btn:hover{box-shadow:0 0 28px rgba(255,191,71,.5)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--lamp);margin-top:12px;padding:13px 30px;font-size:16px}
.btn.ghost:hover{background:rgba(255,191,71,.12)}
.btn:focus-visible,.ib:focus-visible{outline:3px solid #fff;outline-offset:3px}
.best{margin-top:22px;font-size:16px;color:var(--soft);min-height:1.3em;font-variant-numeric:tabular-nums}
#over h2,#pause h2{margin:0;font-size:clamp(34px,6vw,56px);font-weight:700;color:#fff;text-shadow:0 3px 0 #050914}
#final{font-size:clamp(54px,11vw,96px);font-weight:700;color:var(--lamp);line-height:1;margin:14px 0 4px;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,191,71,.45)}
#newbest{color:var(--ice);font-style:italic;font-size:19px;min-height:1.4em;letter-spacing:.08em}
#verdict{margin-top:14px;color:var(--word);font-style:italic;font-size:18px}
#stats{display:flex;gap:30px;margin:18px 0 28px;color:var(--soft)}
#stats div b{display:block;font-size:26px;color:var(--word);font-variant-numeric:tabular-nums}
#stats div span{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
#kb{display:none;flex:none;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#050914;border-top:1px solid #1b2850}
#app.touch #kb{display:block;transition:opacity .3s}
#app.ended #kb{opacity:.28;pointer-events:none}
#kb .row{display:flex;justify-content:center;gap:5px;margin-bottom:5px}
#kb .row:last-child{margin-bottom:0}
.k{flex:1;max-width:44px;height:clamp(42px,7vh,54px);border-radius:8px;border:0;background:#141f40;box-shadow:inset 0 -2px 0 #0a1126;color:#d9e6ff;font:600 19px/1 var(--sans);display:grid;place-items:center;padding:0;touch-action:none;transition:background .14s,box-shadow .14s,color .14s}
.k.wide{flex:1.5;max-width:66px}
.k.down{background:#2b3d7a;transform:translateY(1px)}
.k.on{background:var(--lamp);color:#1a1200;box-shadow:0 0 14px rgba(255,191,71,.6)}
.k.bad{background:#7a2b2b;animation:brk .3s}
.k svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn.small{min-width:0;padding:11px 22px;font-size:16px}
.btn.gold{background:linear-gradient(#ffe69a,#ffc247);border-color:#ffe69a;color:#2a1a00;margin-top:12px;display:none}
.btn.gold.show{display:inline-block}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.link{background:none;border:0;color:var(--soft);font:italic 15px var(--serif);text-decoration:underline;cursor:pointer;padding:10px;margin-top:6px}
.link.sure{color:var(--bad)}
#shopdot{display:none;width:9px;height:9px;border-radius:50%;background:var(--lamp);margin-left:10px;box-shadow:0 0 10px var(--lamp);vertical-align:middle}
#shopdot.on{display:inline-block}
#final{font-size:clamp(46px,9vw,84px)}
#shop{justify-content:flex-start;padding:0;background:radial-gradient(90% 60% at 50% 0,rgba(22,34,80,.96),rgba(5,9,20,.98));align-items:stretch;text-align:left}
#shophead{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid #1d2a4d;background:rgba(5,9,20,.8)}
#shophead .hb{display:flex;flex-direction:column;min-width:0}
#shophead .hb.mid{align-items:center}
#shophead .hb.end{align-items:flex-end}
#shophead .big{white-space:nowrap;display:inline-flex;align-items:center;gap:.25em;font-size:clamp(26px,5.4vw,38px);font-weight:700;color:var(--lamp);font-variant-numeric:tabular-nums;line-height:1.05;text-shadow:0 0 18px rgba(255,191,71,.35)}
#shophead .big.star{color:#fff1c0;font-size:clamp(20px,4vw,28px)}
#shophead .sub{font-size:13px;color:var(--soft);font-style:italic}
#shopscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:12px 12px 90px;text-align:center}
#shopopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:4px 0 8px}
#districts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font:600 14px var(--serif);color:var(--soft);border:1px solid #2b3a6b;background:rgba(10,16,38,.7);border-radius:999px;padding:8px 14px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip.on{background:#ffbf47;color:#1a1100;border-color:#ffbf47}
.chip.lock{opacity:.5;cursor:default}
#startrow{display:flex;align-items:center;gap:10px;color:var(--word);font-size:15px}
.ib.sm{width:34px;height:34px;font-size:20px;line-height:1}
#shophint{margin:2px 0 4px;color:var(--soft);font-style:italic;font-size:15px}
#tree{width:100%;max-width:600px;height:auto;display:block;margin:0 auto;touch-action:pan-y}
#tree .node{cursor:pointer}
#tree .node circle.bg{fill:#0a1126;stroke-width:2.4;transition:fill .2s}
#tree .node.locked{opacity:.4;cursor:default}
#tree .node.can circle.bg{fill:#1b2550;animation:glow 2.2s ease-in-out infinite}
#tree .node.max circle.bg{fill:#2a2310}
#tree .node text{fill:#dbe8ff;font-family:var(--serif);text-anchor:middle;pointer-events:none}
#tree .node .lv{font-size:17px;font-weight:700}
#tree .node .nm{font-size:11px;fill:#9db2de}
#tree .node .nm,#tree .node .co{paint-order:stroke;stroke:#0a1126;stroke-width:5px;stroke-linejoin:round}
#tree .node:focus-visible circle.bg{stroke:#fff}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 9px currentColor)}}
#tree .head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#tree .edge{stroke:#2b3a6b;stroke-width:1.6;fill:none}
#tree .edge.x{stroke-dasharray:3 5;opacity:.45}
#tree .edge.on{stroke:#6f86c8}

#sunbar,#sunbar2{height:7px;border-radius:4px;background:#27335a;overflow:hidden;margin:6px 0}
#sunbar i,#sunbar2 i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#ff9a5a,#ffe69a)}
#sunbar2 i{background:#8fb3ff}
#suntext{font-size:14px;color:var(--soft);font-style:italic;min-height:2.4em}
#shopbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(5,9,20,0),rgba(5,9,20,.96) 40%);z-index:2}
#shopbar .btn{min-width:200px;padding:14px 30px}
#shopscroll{padding-bottom:110px!important}
#sheet{z-index:3}
.chip{padding:7px 12px!important;font-size:13px!important}
#shop{display:none}
#shop.show{display:flex}
#shopscroll{padding-bottom:12px!important}
#shopbar{position:static!important;flex:none;background:#050914!important;border-top:1px solid #1d2a4d;padding:10px 16px calc(10px + env(safe-area-inset-bottom))!important}
#sun{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(90deg,#10183a,#2a1c2e);border-top:1px solid #3a3157}
#sun .sunmain{flex:1;min-width:0}
#suntext{font-size:14px;color:#e8dcc4;font-style:italic;line-height:1.3}
#sun .bars{display:flex;gap:12px;margin-top:6px}
#sun .bar2{flex:1;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
#sun .bb{flex:1;height:6px;border-radius:3px;background:#27335a;overflow:hidden}
#sun .bb i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#ff9a5a,#ffe69a)}
#sun .bar2:last-child .bb i{background:#8fb3ff}
#sun .btn.gold.show{display:inline-block;margin-top:0;white-space:nowrap}
#shopscroll+x{display:none}
.sunic{display:inline-block;width:.78em;height:.78em;border-radius:50%;vertical-align:-.06em;margin-right:.18em;background:radial-gradient(circle,#fffbe0 30%,#ffd27a 62%);box-shadow:0 0 0 .14em rgba(255,210,122,.3),0 0 .55em rgba(255,190,90,.9)}
.ico{width:.85em;height:.85em;vertical-align:-.08em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
#tree .node .pr{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:3 6;opacity:0;animation:spin 8s linear infinite}
#tree .node.pick .pr{opacity:.8}
@keyframes spin{to{stroke-dashoffset:-90}}
#tree .node .ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tree .node .co{font-size:11px;fill:#6f7fa8}
#tree .node.can .co{fill:#9be8a0}
#tree .node.max .co{fill:#ffd98a}
#tease{margin-top:6px;color:var(--ice);font-style:italic;font-size:16px;min-height:1.3em}
#app.nokb #kb{display:none}
#dawnstats{font-size:19px!important;text-shadow:0 1px 8px rgba(20,8,24,.7)}
#dawnstats b{color:#fff0b0!important;font-size:1.12em}
#dawnstats .dim{font-size:15px;color:#f3e2c4;opacity:.9}
#shopbar{display:flex!important;flex-direction:column;align-items:stretch!important;gap:8px!important;padding:8px 14px calc(8px + env(safe-area-inset-bottom))!important}
#shopbar .acts{display:flex;align-items:center;justify-content:center;gap:12px}
#shopbar .acts .btn{min-width:0;margin:0;height:48px;padding:0 26px;font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
#sun{border-radius:12px;border:1px solid #3a3157}
@media(min-width:820px){#shopbar{flex-direction:row-reverse;align-items:center!important;gap:18px!important}#sun{flex:1;order:-1}#shopbar .acts{flex:none}}
#districts{flex-wrap:nowrap!important;overflow-x:auto;max-width:100%;scrollbar-width:none}
#districts::-webkit-scrollbar{display:none}
.chip{white-space:nowrap}
#tree .node .nm,#tree .node .co{font-size:12px!important}
#toshop{position:relative}
#toshop[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;right:-8px;top:-8px;min-width:24px;height:24px;border-radius:12px;background:#fff;color:#1a1100;font:700 14px/24px var(--serif);text-align:center;box-shadow:0 0 12px rgba(255,255,255,.6)}
#toshop.attn{animation:pulseb 2s ease-in-out infinite}
@keyframes pulseb{0%,100%{box-shadow:0 0 0 rgba(255,191,71,0)}50%{box-shadow:0 0 26px rgba(255,191,71,.65)}}
#tease div{margin-top:2px}
#sheet p{font-size:15px}
#sheet h3{font-size:21px}
.k{height:clamp(38px,6.2vh,48px)!important}
.link.corner{position:absolute;left:12px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:12px;opacity:.55;margin:0}
#districts{justify-content:safe center!important}
.nextline{display:block;margin:0 auto 6px;background:rgba(255,191,71,.12);border:1px solid rgba(255,191,71,.5);color:#ffe9b8;font:600 15px var(--serif);border-radius:999px;padding:8px 18px;cursor:pointer;max-width:92%}
.nextline:empty{display:none}
#receipt{width:min(420px,88vw);margin:10px auto 2px;text-align:left}
#receipt .rr{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin:5px 0;font-size:15px;color:var(--soft)}
#receipt .rr i{display:block;height:7px;border-radius:4px;background:var(--lamp);transform-origin:0 50%}
#receipt .rr.town i{background:#a6f0c6}#receipt .rr.storm i{background:#8fb3ff}
#receipt .rr b{color:var(--word);font-variant-numeric:tabular-nums}
#sun .bar2 b{color:#fff0c0;font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}
#pocket{margin-top:3px;font-size:13px;color:#b9caf0;font-style:italic;text-shadow:0 2px 0 #050914;white-space:nowrap}
#chip{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:linear-gradient(#ffe69a,#ffc247);color:#2a1a00;border:0;border-radius:999px;padding:9px 16px;font:700 15px var(--serif);cursor:pointer;box-shadow:0 0 22px rgba(255,191,71,.6);transition:opacity .3s,transform .3s;z-index:2;white-space:nowrap}
#chip.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;animation:pulseb 1.8s ease-in-out infinite}
@media(max-width:520px){#chip{top:auto;bottom:10px;transform:translate(-50%,14px)}#chip.on{transform:translate(-50%,0)}}
#sheet{position:absolute;left:0;right:0;bottom:0;padding:16px 18px calc(16px + env(safe-area-inset-bottom));background:rgba(8,13,32,.97);border-top:2px solid var(--lamp);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);text-align:left;z-index:3}
#sheet.open{transform:none}
#sheet .x{position:absolute;right:10px;top:6px;background:none;border:0;color:var(--soft);font-size:28px;cursor:pointer;padding:6px 12px}
#sheetBranch{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
#sheet h3{margin:2px 0 6px;font-size:24px;color:#fff}
#sheet p{margin:3px 0;font-size:16px;color:var(--word)}
#sheetNext{color:var(--lamp)!important}
#sheetReq{color:var(--bad)!important;font-style:italic}
#sheet .row{display:flex;gap:10px;margin-top:12px}
#sheet .row .btn{white-space:nowrap;padding:11px 16px}
#dawn{background:linear-gradient(#0a1126 0%,#2a2250 48%,#d98b5a 100%)!important;overflow:hidden}
#dawn>*{position:relative;z-index:1}
#dawn .btn.ghost{color:#fff6dc;border-color:#fff6dc;background:rgba(20,10,30,.3)}
#dawn h2{font-size:clamp(40px,8vw,72px);margin:0;color:#fff6dc;text-shadow:0 0 30px rgba(255,214,140,.6),0 3px 0 rgba(5,9,20,.4)}
#dawnsky{position:absolute!important;left:50%;bottom:-12%;width:min(90vw,720px);aspect-ratio:1;transform:translate(-50%,40%);border-radius:50%;background:radial-gradient(circle,#fff6d0 0,#ffd27a 22%,rgba(255,170,90,.55) 38%,rgba(255,140,80,0) 62%);z-index:0!important;animation:rise 3.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{transform:translate(-50%,6%)}}
#dawnstats{display:flex;flex-direction:column;gap:6px;margin:14px 0 18px;font-size:17px;color:#fff6dc}
#dawnstats b{color:#ffe69a;font-variant-numeric:tabular-nums}
#awayAmt{font-size:clamp(44px,9vw,80px);font-weight:700;color:var(--lamp);margin:10px 0 4px;text-shadow:0 0 30px rgba(255,191,71,.45)}
#toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:rgba(8,13,32,.92);border:1px solid #3a4a85;color:var(--word);padding:10px 18px;border-radius:999px;font-style:italic;font-size:16px;transition:opacity .3s,transform .3s;max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){#sheet{left:auto;right:0;top:92px;bottom:96px;width:340px;border-radius:16px 0 0 16px;border:2px solid var(--lamp);border-right:0;transform:translateX(105%);overflow:auto}#sheet.open{transform:none}}
@media(prefers-reduced-motion:reduce){#chip.on{animation:none}#toshop.attn{animation:none}#tree .node.can circle.bg{animation:none}#banner.go{animation:banr 2.2s linear both}@keyframes banr{0%{opacity:0}12%,75%{opacity:1}100%{opacity:0}}#mult.pop,#mult.break,.k.bad{animation:none}.screen.show{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="c"></canvas>

<script id="core">
/* Word Rain core: no DOM, no clock, no Math.random. A seed deals the same storm to everyone.
   Field coordinates: x 0..1 across, y 0..1 from the top of the sky (spawn) to the rooftops (ground). */
const WR = (() => {
  const WORDS = `
ant bat cap den dew dye eel fir fog gap hum ink ivy jam key kit lid map mud nap oak owl pan pea rug sea sky tin urn van wet yak zip web tea sun rim pie oar nut
arch bark bell cave dawn dusk echo fern gale hail iron jade kite leaf moon nest oval pond quay reed silk tide urge vine wind yarn zero roof lamp mist moth cork
amber beach cloud dream flame globe haven ivory jelly knoll lemon marsh night ocean pearl quilt river shore tulip umber valve whale yacht zesty brook cabin drift fable grove
autumn bridge candle garden harbor island jacket kettle meadow narrow orchid pebble quiver ribbon saddle timber velvet window yellow zephyr anchor basket copper dinner engine forest glider hollow indigo jungle
balcony blanket chimney cobweb dolphin evening fiddler gateway harvest iceberg journey kitchen lantern mailbox nursery orchard pelican quarter rainbow shelter thicket umpire village whisper younger zealous
umbrella backyard campfire doorbell eclipse fireside gazebo hilltop innkeeper? jasmine kingdom lakeside moonbeam noodles outdoors pathway quietly rooftop sunrise treetop upstairs volcano waterfall yearbook zeppelin
afternoon blackbird butterfly candlelit doorsteps evergreen farmhouse hailstorm lamplight moonlight overheard pinecones riverbank sleepyhead snowflake windmills
airplane blossoms cinnamon dewdrops eiderdown fireflies gardener horizon inkwell jigsaw? kangaroo lighthouse mushroom nightfall overcoat paperboy quicksand raindrop starlight twilight umbrellas vineyard wanderer yesterday
`.replace(/\?/g, '');
  const POWER = {
    frost: 'frost chill sleet icicle winter glacier blizzard',
    blast: 'spark flash blaze fuse burst cinder flare',
    thunder: 'thunder tempest cyclone tornado hurricane',
    gild: 'gilt ducat nugget sovereign treasure bullion',
    charm: 'charm mend mercy hearth blessing',
  };
  const TIERS = [[1, 'Drizzle'], [3, 'Shower'], [5, 'Downpour'], [7, 'Squall'], [10, 'Storm'], [13, 'Cloudburst'], [17, 'Monsoon']];
  const BASE_HP = 1, FREEZE = 4, BLAST_R = 0.42;
  const HOUSE_X = [.09, .25, .4, .6, .75, .91], MAX_LAMPS = HOUSE_X.length;

  /* Where the town grows. Each night pays lumen; lumen buys these; Dawn resets them for stars. */
  const UPG = [
    // your hands
    { id: 'wick', branch: 'lamp', max: 12, ext: 3, base: 150, grow: 1.5, req: [] },
    { id: 'bell', branch: 'lamp', max: 6, ext: 2, base: 1500, grow: 1.8, req: [['wick', 2]] },
    { id: 'rhythm', branch: 'lamp', max: 5, ext: 0, base: 1500, grow: 1.9, req: [['wick', 2]] },
    { id: 'steady', branch: 'lamp', max: 3, ext: 0, base: 4000, grow: 3, req: [['wick', 3]] },
    { id: 'crescendo', branch: 'lamp', max: 5, ext: 2, base: 8000, grow: 2.1, req: [['rhythm', 1]] },
    // the houses
    { id: 'gauge', branch: 'houses', max: 8, ext: 0, base: 300, grow: 1.6, req: [] },
    { id: 'roofs', branch: 'houses', max: 4, ext: 0, base: 900, grow: 2.2, req: [['gauge', 1]] },
    { id: 'mend', branch: 'houses', max: 3, ext: 0, base: 2500, grow: 2.5, req: [['roofs', 1]] },
    { id: 'gutters', branch: 'houses', max: 1, ext: 0, base: 9000, grow: 1, req: [['roofs', 2]] },
    // the storm
    { id: 'frostL', branch: 'storm', max: 6, ext: 0, base: 400, grow: 1.7, req: [] },
    { id: 'blastL', branch: 'storm', max: 6, ext: 0, base: 600, grow: 1.7, req: [['frostL', 1]] },
    { id: 'sense', branch: 'storm', max: 3, ext: 0, base: 2500, grow: 2.4, req: [['blastL', 2]] },
    { id: 'thunderL', branch: 'storm', max: 2, ext: 0, base: 12000, grow: 3, req: [['sense', 1]] },
    { id: 'gild', branch: 'storm', max: 5, ext: 1, base: 6000, grow: 2.2, req: [['blastL', 3]] },
    { id: 'charm', branch: 'storm', max: 1, ext: 0, base: 20000, grow: 1, req: [['mend', 1], ['gild', 1]] },
    // the town helps
    { id: 'lamplighter', branch: 'town', max: 10, ext: 0, base: 800, grow: 1.55, req: [['wick', 1]] },
    { id: 'ledger', branch: 'town', max: 6, ext: 0, base: 6000, grow: 2, req: [['lamplighter', 1]] },
    { id: 'watch', branch: 'town', max: 10, ext: 0, base: 5000, grow: 1.6, req: [['lamplighter', 2]] },
    { id: 'nightshift', branch: 'town', max: 5, ext: 2, base: 30000, grow: 2.2, req: [['watch', 1]] },
    { id: 'scholar', branch: 'town', max: 10, ext: 0, base: 25000, grow: 1.65, req: [['watch', 2]] },
    { id: 'choir', branch: 'town', max: 8, ext: 0, base: 80000, grow: 1.75, req: [['scholar', 2]] },
  ];
  const UPG_BY = {}; for (const u of UPG) UPG_BY[u.id] = u;
  const DISTRICTS = [
    { id: 'lane', name: 'Lamplight Lane', need: 0, sway: 0, burst: 1, fall: 1, count: 1, lumen: 1 },
    { id: 'harbour', name: 'Harbour Row', need: 1, sway: .035, burst: 1, fall: 1, count: 1, lumen: 1.4 },
    { id: 'mill', name: 'Mill Hill', need: 3, sway: .02, burst: 2, fall: .95, count: 1.25, lumen: 1.9 },
  ];
  const COST_SCALE = 1;
  const cost = (id, lvl) => Math.round(UPG_BY[id].base * COST_SCALE * Math.pow(UPG_BY[id].grow, lvl));
  // every Dawn raises the ceiling of most levers a little, so a town that has built everything still has somewhere to go
  const maxOf = (id, dawns = 0) => UPG_BY[id].max + UPG_BY[id].ext * Math.max(0, dawns | 0);
  const levelOf = (L, id, dawns = 0) => Math.max(0, Math.min((L && L[id]) | 0, maxOf(id, dawns)));
  const unlocked = (L, id, dawns = 0) => UPG_BY[id].req.every(([r, n]) => levelOf(L, r, dawns) >= n);
  const canBuy = (L, lumen, id, dawns = 0) => !!UPG_BY[id] && levelOf(L, id, dawns) < maxOf(id, dawns) && unlocked(L, id, dawns) && lumen >= cost(id, levelOf(L, id, dawns));

  const waveFactor = w => 1 + 0.12 * (w - 1);
  const multOf = (combo, step = 20, cap = 8) => Math.min(cap, 1 + Math.floor(combo / step));
  /* Dawn: when an era has earned enough lumen and the storm has been met deep enough, the town may greet the day.
     It gives up the era's upgrades for stars, which make every later night pay and last longer. */
  const dawnNeed = d => 5e6 * Math.pow(3.5, d);
  const dawnWave = d => 16 + 3 * d;
  const dawnReady = (eraLumen, eraBestWave, d) => eraLumen >= dawnNeed(d) && eraBestWave >= dawnWave(d);
  const starsFor = eraLumen => Math.floor(Math.sqrt(Math.max(0, eraLumen) / 50000));

  function mods(L = {}, stars = 0, district = 0, dawns = 0) {
    const l = id => levelOf(L, id, dawns), D = DISTRICTS[district] || DISTRICTS[0];
    const helpers = [];
    if (l('lamplighter')) helpers.push({ kind: 'lamplighter', cps: .8 + .5 * l('lamplighter'), voices: 1, maxLen: 4 + Math.floor(l('lamplighter') / 3) });
    if (l('watch')) helpers.push({ kind: 'watch', cps: .6 + .45 * l('watch'), voices: 1 });
    if (l('scholar')) helpers.push({ kind: 'scholar', cps: .8 + .5 * l('scholar'), voices: 1, minLen: 6 });
    if (l('choir')) helpers.push({ kind: 'choir', cps: .8, voices: l('choir') });
    return {
      lumen: (1 + .15 * l('wick')) * (1 + .25 * stars) * D.lumen,
      bell: .05 * l('bell'), mercy: l('steady'), comboStep: 20 - 2 * l('rhythm'), comboCap: 8 + 3 * l('crescendo'),
      roofHp: BASE_HP + l('roofs'), fall: (1 + .10 * l('gauge')) * Math.min(1.5, 1 + .01 * stars) * D.fall,
      heal: 1 + l('mend'), gutters: l('gutters') > 0, charm: l('charm') > 0,
      freeze: FREEZE + .8 * l('frostL'), blastR: BLAST_R * (1 + .15 * l('blastL')),
      thunder: l('thunderL'), extra: l('sense'), gild: l('gild'),
      yield: .5 + .08 * l('ledger'), helpers, offlineHours: 2 + l('nightshift'),
      burst: D.burst, sway: D.sway, count: D.count, district,
    };
  }
  const DEFAULT = mods();

  const bank = {};
  for (const w of new Set(WORDS.split(/\s+/).filter(Boolean))) (bank[w.length] = bank[w.length] || []).push(w);
  const power = {};
  for (const k in POWER) power[k] = POWER[k].split(' ');

  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const hashSeed = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

  function spec(w, m = DEFAULT) {
    const thunder = m.thunder >= 2 ? w >= 3 : m.thunder === 1 ? w >= 3 && w % 2 === 1 : w >= 4 && w % 3 === 1;
    const count = Math.round(Math.min(60, 6 + 2 * w) * m.count);
    const s = {
      wave: w,
      count,
      gap: Math.max(0.1, 2.0 * Math.pow(0.86, w - 1)),
      fall: Math.max(0.5, 8.0 * Math.pow(0.93, w - 1)) * m.fall,
      lo: Math.min(5, 3 + Math.floor((w - 1) / 3)),
      hi: Math.min(9, 3 + Math.ceil((w + 1) / 2)),
      frost: w >= 2 ? 1 + m.extra : 0, blast: w >= 3 ? 1 + m.extra : 0, thunder: thunder ? 1 : 0,
      gild: m.gild > 0 && w >= 2 ? Math.min(3, 1 + Math.floor((m.gild - 1) / 2)) : 0, charm: m.charm && w >= 4 ? 1 : 0,
    };
    // never more than 40 % of a wave is special, so the plain words still carry it: the extra frost and blast go first
    const cap = Math.floor(count * .4);
    while (s.frost + s.blast + s.thunder + s.gild + s.charm > cap) { if (s.frost > 1 && s.frost >= s.blast) s.frost--; else if (s.blast > 1) s.blast--; else if (s.gild > 1) s.gild--; else break; }
    return s;
  }
  const tierName = w => { let n = TIERS[0][1]; for (const [from, name] of TIERS) if (w >= from) n = name; return n; };
  const tierIndex = w => { let n = 0; TIERS.forEach(([from], i) => { if (w >= from) n = i; }); return n; };

  function create(opts = {}) {
    const seed = opts.seed == null ? 1 : opts.seed, rand = rng(seed), luck = rng((seed ^ 0x51ed270b) >>> 0);
    const m = opts.mods || DEFAULT;
    const cfg = { charW: opts.charW || 0.03, aspect: opts.aspect || 1.6, intro: !!opts.intro };
    const g = {
      cfg, m, t: 0, words: [], nextId: 1, target: null, score: 0, combo: 0, best: 0, over: false,
      houses: HOUSE_X.map(x => ({ x, hp: m.roofHp, max: m.roofHp })), lamps: MAX_LAMPS,
      wave: Math.max(1, opts.startWave || 1) - 1, spec: null, spawned: 0, spawnIn: 0, burst: 0, debt: 0, rest: 1.2, freeze: 0, plan: [],
      stats: { keys: 0, errors: 0, kills: 0, chars: 0, lost: 0, power: 0, helped: 0, forgiven: 0, src: { typed: 0, helpers: 0, storm: 0 } }, hs: [],
    };
    let hid = 1;
    for (const h of m.helpers) for (let i = 0; i < h.voices; i++) g.hs.push({ id: hid++, kind: h.kind, cps: h.cps, maxLen: h.maxLen || 99, minLen: h.minLen || 0, acc: 0, tgt: null, wait: 0 });
    const ev = [];
    const unit = () => waveFactor(g.wave) * m.lumen;
    const countLamps = () => { g.lamps = g.houses.filter(h => h.hp > 0).length; };

    function heal(n) {
      const done = [];
      for (let k = 0; k < n; k++) {
        const hurt = g.houses.map((h, i) => ({ h, i })).filter(o => o.h.hp < o.h.max).sort((a, b) => a.h.hp / a.h.max - b.h.hp / b.h.max)[0];
        if (!hurt) break; hurt.h.hp++; done.push(hurt.i);
      }
      countLamps(); return done;
    }

    function startWave(n) {
      g.wave = n; g.spec = spec(n, m); g.spawned = 0; g.spawnIn = 0.9; g.burst = 0; g.debt = 0;
      const s = g.spec, c = s.count, kinds = [];
      for (const k of ['frost', 'blast', 'thunder', 'gild', 'charm']) for (let i = 0; i < s[k]; i++) kinds.push(k);
      for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
      const p = []; kinds.forEach((k, i) => { let idx = Math.min(c - 2, Math.floor(c * (i + .6) / (kinds.length + .2))); while (p[idx]) idx = (idx + 1) % (c - 1); p[idx] = k; });
      g.plan = p;
      ev.push({ t: 'wave', n, name: tierName(n) });
    }

    function pickWord(kind, s) {
      const live = g.words;
      const used = new Set(live.map(w => w.text[0]));
      const have = new Set(live.map(w => w.text));
      let pool;
      if (kind !== 'word') pool = power[kind].filter(w => w.length <= s.hi + 3);
      else { const len = s.lo + Math.floor(rand() * (s.hi - s.lo + 1)); pool = bank[len] || []; }
      let ok = pool.filter(w => !used.has(w[0]) && !have.has(w));
      if (!ok.length) ok = Object.values(bank).flat().filter(w => w.length >= s.lo && w.length <= s.hi && !used.has(w[0]) && !have.has(w));
      if (!ok.length) ok = Object.values(bank).flat().filter(w => !used.has(w[0]));
      return ok[Math.floor(rand() * ok.length)];
    }

    function place(len, kind) {
      const half = (len * cfg.charW) / 2 + 0.025 + (kind === 'word' ? 0 : 0.03) + m.sway;
      let best = 0.5, bestGap = -1;
      for (let i = 0; i < 10; i++) {
        const x = half + rand() * Math.max(0, 1 - 2 * half);
        let gap = 9;
        for (const w of g.words) {
          if (Math.abs(w.y - 0) > 0.16) continue;
          const wh = (w.text.length * cfg.charW) / 2 + 0.05;
          gap = Math.min(gap, Math.abs(w.x0 - x) - wh - half);
        }
        if (gap > bestGap) { bestGap = gap; best = x; }
        if (gap > 0.02) break;
      }
      return best;
    }

    function spawn(overshoot) {
      const s = g.spec, idx = g.spawned++;
      const kind = g.plan[idx] || 'word';
      let text = pickWord(kind, s);
      if (!text) { g.spawned--; return false; } // every first letter is on the sky: wait for room
      if (cfg.intro && g.wave === 1 && idx === 0) text = 'rain';
      const v = 1 / s.fall, x0 = place(text.length, kind);
      const w = { id: g.nextId++, text, kind, x: x0, x0, y: -0.03 + v * overshoot, v, typed: 0, hp: 0, owner: 0, slips: 0 };
      g.words.push(w);
      ev.push({ t: 'spawn', id: w.id });
    }

    function drop(w) { // a word leaves the sky; whoever was typing it lets go
      g.words.splice(g.words.indexOf(w), 1);
      if (g.target === w) g.target = null;
      for (const h of g.hs) if (h.tgt === w) { h.tgt = null; h.acc = 0; h.wait = .35; }
    }

    function kill(w, why) {
      drop(w); g.stats.kills++;
      ev.push({ t: 'kill', id: w.id, x: w.x, y: w.y, text: w.text, kind: w.kind, why });
    }

    function finish(w) {
      const mult = multOf(g.combo, m.comboStep, m.comboCap), u = unit();
      let pts = w.text.length * 5 * mult * u, lucky = false;
      if (w.kind === 'gild') pts += w.text.length * (30 + 10 * m.gild) * u;
      if (w.kind === 'word' && m.bell && luck() < m.bell) { pts *= 2; lucky = true; }
      g.score += pts; g.stats.src.typed += pts;
      kill(w, 'typed');
      Object.assign(ev[ev.length - 1], { pts: Math.round(pts), lucky });
      if (w.kind === 'frost') { g.freeze = Math.min(g.freeze + m.freeze, m.freeze + 2); g.stats.power++; ev.push({ t: 'freeze', secs: g.freeze }); }
      else if (w.kind === 'blast') {
        g.stats.power++;
        const hit = g.words.filter(o => Math.hypot((o.x - w.x) * cfg.aspect, o.y - w.y) < m.blastR);
        for (const o of hit) { const q = o.text.length * 10 * u; g.score += q; g.stats.src.storm += q; kill(o, 'blast'); }
        ev.push({ t: 'blast', x: w.x, y: w.y, ids: hit.map(o => o.id), r: m.blastR });
      } else if (w.kind === 'thunder') {
        g.stats.power++;
        const hit = g.words.slice();
        for (const o of hit) { const q = o.text.length * 10 * u; g.score += q; g.stats.src.storm += q; kill(o, 'thunder'); }
        ev.push({ t: 'thunder', ids: hit.map(o => o.id) });
      } else if (w.kind === 'charm') { g.stats.power++; ev.push({ t: 'charm', houses: heal(1) }); }
      else if (w.kind === 'gild') g.stats.power++;
    }

    g.key = (ch) => {
      ev.length = 0;
      if (g.over) return ev.slice();
      ch = String(ch).toLowerCase();
      if (!/^[a-z]$/.test(ch)) return ev.slice();
      g.stats.keys++;
      let w = g.target;
      if (!w) {
        w = g.words.filter(o => o.text[0] === ch).sort((a, b) => b.y - a.y)[0];
        if (w) {
          g.target = w; ev.push({ t: 'lock', id: w.id });
          if (w.owner) { const h = g.hs.find(o => o.id === w.owner); if (h) { h.tgt = null; h.acc = 0; h.wait = .35; } w.owner = 0; w.hp = 0; ev.push({ t: 'yield', id: w.id }); }
        }
      }
      if (w && w.text[w.typed] === ch) {
        w.typed++; g.stats.chars++; g.combo++;
        if (g.combo > g.best) g.best = g.combo;
        { const q = 10 * multOf(g.combo, m.comboStep, m.comboCap) * unit(); g.score += q; g.stats.src.typed += q; }
        ev.push({ t: 'type', id: w.id, i: w.typed, combo: g.combo, mult: multOf(g.combo, m.comboStep, m.comboCap), step: m.comboStep });
        if (w.typed === w.text.length) finish(w);
      } else {
        g.stats.errors++;
        if (w && w.slips < m.mercy) { w.slips++; g.stats.forgiven++; ev.push({ t: 'forgive', id: w.id, key: ch }); }
        else { g.combo = 0; ev.push({ t: 'miss', id: w ? w.id : 0, key: ch }); }
      }
      return ev.slice();
    };

    g.release = () => {
