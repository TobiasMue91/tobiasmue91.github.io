<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070c1a">
<title>WORD RAIN</title>
<meta name="description" content="WORD RAIN - A typing defence game. Words fall like rain over a sleeping town; type them before they land and keep the windows lit. Freeze the storm, blast a cluster, call down thunder. How long can you last?">
<style>
:root{--ink:#070c1a;--word:#dbe8ff;--soft:#9db2de;--lamp:#ffbf47;--ice:#bff3ff;--bad:#ff6b5e;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--word);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .4s ease}
#app.playing #hud,#app.paused #hud{opacity:1}
#score{font-size:42px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 2px 0 #050914}
#multrow{display:flex;align-items:center;gap:9px;margin-top:7px;height:34px;font-weight:700;color:#eaf1ff;font-size:28px;transition:opacity .25s ease}
#multrow.off{opacity:.55}
#multrow.hot #mult{background:#eaf1ff;color:#0a1020;border-radius:8px;padding:0 9px;min-width:0;box-shadow:0 0 18px rgba(234,241,255,.45)}
#mult{display:inline-block;min-width:1.7em;transform-origin:0 60%}
#mult.pop{animation:pop .32s cubic-bezier(.2,1.6,.4,1)}
#mult.break{animation:brk .3s ease-out;color:var(--bad)}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes brk{0%{transform:translateX(0)}25%{transform:translateX(-5px)}60%{transform:translateX(4px)}100%{transform:translateX(0)}}
.bar{width:110px;height:8px;border-radius:4px;background:#27335a;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:#eaf1ff}
#right{position:relative;text-align:right;color:#cfdcfa;font-weight:600;font-size:19px;letter-spacing:.02em;pointer-events:auto}
#wavename{display:block;line-height:1.2;text-shadow:0 2px 0 #050914}
#right .bar{margin:8px 0 0 auto;width:130px;height:7px}
#right .bar i{background:#8fb3ff}
#right .bar.ice{position:absolute;right:0;top:100%;margin-top:6px;opacity:0;transition:opacity .25s}
#right .bar.ice.on{opacity:1}
#right .bar.ice i{background:var(--ice)}
#btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid #2b3a6b;background:rgba(10,16,38,.7);color:#c4d4f7;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s,transform .12s}
.ib:hover{background:#18244a}.ib:active{transform:scale(.92)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#banner b{display:block;font-size:clamp(40px,7vw,76px);font-weight:700;letter-spacing:.02em;color:#fff;text-shadow:0 0 30px rgba(143,179,255,.55),0 3px 0 #050914}
#banner span{display:block;margin-top:2px;font-size:clamp(17px,2.4vw,24px);font-style:italic;color:var(--soft);letter-spacing:.14em;text-transform:uppercase}
#banner.go{animation:ban 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ban{0%{opacity:0;transform:translateY(14px) scale(.96)}16%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(70% 60% at 50% 45%,rgba(5,9,20,.9),rgba(5,9,20,.55));opacity:0}
.screen.show{display:flex;animation:fade .45s ease forwards}
@keyframes fade{to{opacity:1}}
h1{margin:0;font-size:clamp(56px,13vw,132px);font-weight:700;line-height:.95;letter-spacing:.01em;color:var(--word);text-shadow:0 4px 0 #050914,0 0 40px rgba(143,179,255,.35)}
h1 em{font-style:italic;color:var(--lamp);text-shadow:0 0 28px rgba(255,191,71,.65),0 4px 0 #050914}
.tag{margin:16px 0 30px;font-size:clamp(17px,2.4vw,23px);font-style:italic;color:var(--soft)}
.btn{font:700 19px/1 var(--serif);letter-spacing:.04em;border-radius:999px;padding:16px 38px;border:2px solid var(--lamp);background:var(--lamp);color:#1a1100;cursor:pointer;min-width:220px;transition:transform .12s,box-shadow .2s,background .2s;box-shadow:0 0 0 rgba(255,191,71,0)}
.btn:hover{box-shadow:0 0 28px rgba(255,191,71,.5)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--lamp);margin-top:12px;padding:13px 30px;font-size:16px}
.btn.ghost:hover{background:rgba(255,191,71,.12)}
.btn:focus-visible,.ib:focus-visible{outline:3px solid #fff;outline-offset:3px}
.best{margin-top:22px;font-size:16px;color:var(--soft);min-height:1.3em;font-variant-numeric:tabular-nums}
#over h2,#pause h2{margin:0;font-size:clamp(34px,6vw,56px);font-weight:700;color:#fff;text-shadow:0 3px 0 #050914}
#final{font-size:clamp(54px,11vw,96px);font-weight:700;color:var(--lamp);line-height:1;margin:14px 0 4px;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,191,71,.45)}
#newbest{color:var(--ice);font-style:italic;font-size:19px;min-height:1.4em;letter-spacing:.08em}
#verdict{margin-top:14px;color:var(--word);font-style:italic;font-size:18px}
#stats{display:flex;gap:30px;margin:18px 0 28px;color:var(--soft)}
#stats div b{display:block;font-size:26px;color:var(--word);font-variant-numeric:tabular-nums}
#stats div span{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
#kb{display:none;flex:none;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#050914;border-top:1px solid #1b2850}
#app.touch #kb{display:block;transition:opacity .3s}
#app.ended #kb{opacity:.28;pointer-events:none}
#kb .row{display:flex;justify-content:center;gap:5px;margin-bottom:5px}
#kb .row:last-child{margin-bottom:0}
.k{flex:1;max-width:44px;height:clamp(42px,7vh,54px);border-radius:8px;border:0;background:#141f40;box-shadow:inset 0 -2px 0 #0a1126;color:#d9e6ff;font:600 19px/1 var(--sans);display:grid;place-items:center;padding:0;touch-action:none;transition:background .14s,box-shadow .14s,color .14s}
.k.wide{flex:1.5;max-width:66px}
.k.down{background:#2b3d7a;transform:translateY(1px)}
.k.on{background:var(--lamp);color:#1a1200;box-shadow:0 0 14px rgba(255,191,71,.6)}
.k.bad{background:#7a2b2b;animation:brk .3s}
.k svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){#banner.go{animation:banr 2.2s linear both}@keyframes banr{0%{opacity:0}12%,75%{opacity:1}100%{opacity:0}}#mult.pop,#mult.break,.k.bad{animation:none}.screen.show{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
   <div><div id="score">0</div><div id="multrow" class="off"><span id="mult">×1</span><span class="bar"><i id="multbar"></i></span></div></div>
   <div id="right"><span id="wavename"></span><div class="bar"><i id="wavebar"></i></div><div class="bar ice" id="icebar"><i id="icefill"></i></div>
    <div id="btns"><button class="ib" id="mute" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wv" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button><button class="ib" id="pausebtn" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button></div></div>
  </div>
  <div id="banner"><b></b><span></span></div>
  <div class="screen" id="title" style="padding-bottom:20vh"><h1><em>Word</em><br>Rain</h1><p class="tag">Type the rain before it lands.</p><button class="btn" id="play">Play</button><button class="btn ghost" id="daily">Tonight's storm</button><div class="best" id="bestline"></div></div>
  <div class="screen" id="over"><h2 id="overhead">The lamps went out</h2><div id="final">0</div><div id="newbest"></div><div id="verdict"></div><div id="stats"><div><b id="sw">0</b><span>Wave</span></div><div><b id="swpm">0</b><span>Words/min</span></div><div><b id="sacc">0%</b><span>Accuracy</span></div></div><button class="btn" id="again">Again</button><button class="btn ghost" id="home">Title</button></div>
  <div class="screen" id="pause"><h2>Rain, held</h2><p class="tag">The storm waits for you.</p><button class="btn" id="resume">Continue</button></div>
 </div>
 <div id="kb" aria-hidden="true"></div>
</div>
<script id="core">
/* Word Rain core: no DOM, no clock, no Math.random. A seed deals the same storm to everyone.
   Field coordinates: x 0..1 across, y 0..1 from the top of the sky (spawn) to the rooftops (ground). */
const WR = (() => {
  const WORDS = `
ant bat cap den dew dye eel fir fog gap hum ink ivy jam key kit lid map mud nap oak owl pan pea rug sea sky tin urn van wet yak zip web tea sun rim pie oar nut
arch bark bell cave dawn dusk echo fern gale hail iron jade kite leaf moon nest oval pond quay reed silk tide urge vine wind yarn zero roof lamp mist moth cork
amber beach cloud dream flame globe haven ivory jelly knoll lemon marsh night ocean pearl quilt river shore tulip umber valve whale yacht zesty brook cabin drift fable grove
autumn bridge candle garden harbor island jacket kettle meadow narrow orchid pebble quiver ribbon saddle timber velvet window yellow zephyr anchor basket copper dinner engine forest glider hollow indigo jungle
balcony blanket chimney cobweb dolphin evening fiddler gateway harvest iceberg journey kitchen lantern mailbox nursery orchard pelican quarter rainbow shelter thicket umpire village whisper younger zealous
umbrella backyard campfire doorbell eclipse fireside gazebo hilltop innkeeper? jasmine kingdom lakeside moonbeam noodles outdoors pathway quietly rooftop sunrise treetop upstairs volcano waterfall yearbook zeppelin
afternoon blackbird butterfly candlelit doorsteps evergreen farmhouse hailstorm lamplight moonlight overheard pinecones riverbank sleepyhead snowflake windmills
airplane blossoms cinnamon dewdrops eiderdown fireflies gardener horizon inkwell jigsaw? kangaroo lighthouse mushroom nightfall overcoat paperboy quicksand raindrop starlight twilight umbrellas vineyard wanderer yesterday
`.replace(/\?/g, '');
  const POWER = {
    frost: 'frost chill sleet icicle winter glacier blizzard',
    blast: 'spark flash blaze fuse burst cinder flare',
    thunder: 'thunder tempest cyclone tornado hurricane',
  };
  const TIERS = [[1, 'Drizzle'], [3, 'Shower'], [5, 'Downpour'], [7, 'Squall'], [10, 'Storm'], [13, 'Cloudburst'], [17, 'Monsoon']];
  const MAX_LAMPS = 6, FREEZE = 4, BLAST_R = 0.42;

  const bank = {};
  for (const w of new Set(WORDS.split(/\s+/).filter(Boolean))) (bank[w.length] = bank[w.length] || []).push(w);
  const power = {};
  for (const k in POWER) power[k] = POWER[k].split(' ');

  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const hashSeed = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

  function spec(w) {
    return {
      wave: w,
      count: Math.min(30, 6 + 2 * w),
      gap: Math.max(0.7, 3.0 - 0.14 * (w - 1)),
      fall: Math.max(5.5, 12.5 - 0.55 * (w - 1)),
      lo: Math.min(5, 3 + Math.floor((w - 1) / 3)),
      hi: Math.min(9, 3 + Math.ceil((w + 1) / 2)),
      frost: w >= 2, blast: w >= 3, thunder: w >= 4 && w % 3 === 1,
    };
  }
  const tierName = w => { let n = TIERS[0][1]; for (const [from, name] of TIERS) if (w >= from) n = name; return n; };
  const tierIndex = w => { let n = 0; TIERS.forEach(([from], i) => { if (w >= from) n = i; }); return n; };
  const multOf = combo => Math.min(8, 1 + Math.floor(combo / 20));

  function create(opts = {}) {
    const rand = rng(opts.seed == null ? 1 : opts.seed);
    const cfg = { charW: opts.charW || 0.03, aspect: opts.aspect || 1.6, intro: !!opts.intro, lamps: opts.lamps || MAX_LAMPS };
    const g = {
      cfg, t: 0, words: [], nextId: 1, target: null, score: 0, combo: 0, best: 0, lamps: cfg.lamps, over: false,
      wave: 0, spec: null, spawned: 0, spawnIn: 0, burst: 0, debt: 0, rest: 1.2, freeze: 0, plan: [],
      stats: { keys: 0, errors: 0, kills: 0, chars: 0, lost: 0, power: 0 },
    };
    const ev = [];

    function startWave(n) {
      g.wave = n; g.spec = spec(n); g.spawned = 0; g.spawnIn = 0.9; g.burst = 0; g.debt = 0;
      const c = g.spec.count, p = [];
      if (g.spec.frost) p[Math.floor(c * 0.45)] = 'frost';
      if (g.spec.blast) p[Math.floor(c * 0.7)] = 'blast';
      if (g.spec.thunder) p[c - 2] = 'thunder';
      g.plan = p;
      ev.push({ t: 'wave', n, name: tierName(n) });
    }

    function pickWord(kind, s) {
      const live = g.words;
      const used = new Set(live.map(w => w.text[0]));
      const have = new Set(live.map(w => w.text));
      let pool;
      if (kind !== 'word') pool = power[kind].filter(w => w.length <= s.hi + 2);
      else { const len = s.lo + Math.floor(rand() * (s.hi - s.lo + 1)); pool = bank[len] || []; }
      let ok = pool.filter(w => !used.has(w[0]) && !have.has(w));
      if (!ok.length) ok = Object.values(bank).flat().filter(w => w.length >= s.lo && w.length <= s.hi && !used.has(w[0]) && !have.has(w));
      if (!ok.length) ok = Object.values(bank).flat().filter(w => !used.has(w[0]));
      return ok[Math.floor(rand() * ok.length)];
    }

    function place(len, kind) {
      const half = (len * cfg.charW) / 2 + 0.025 + (kind === 'word' ? 0 : 0.03);
      let best = 0.5, bestGap = -1;
      for (let i = 0; i < 10; i++) {
        const x = half + rand() * Math.max(0, 1 - 2 * half);
        let gap = 9;
        for (const w of g.words) {
          if (Math.abs(w.y - 0) > 0.16) continue;
          const wh = (w.text.length * cfg.charW) / 2 + 0.05;
          gap = Math.min(gap, Math.abs(w.x - x) - wh - half);
        }
        if (gap > bestGap) { bestGap = gap; best = x; }
        if (gap > 0.02) break;
      }
      return best;
    }

    function spawn(overshoot) {
      const s = g.spec, idx = g.spawned++;
      const kind = g.plan[idx] || 'word';
      let text = pickWord(kind, s);
      if (cfg.intro && g.wave === 1 && idx === 0) text = 'rain';
      const v = 1 / s.fall;
      const w = { id: g.nextId++, text, kind, x: place(text.length, kind), y: -0.03 + v * overshoot, v, typed: 0 };
      g.words.push(w);
      ev.push({ t: 'spawn', id: w.id });
    }

    function award(pts) { g.score += pts; }

    function kill(w, why) {
      g.words.splice(g.words.indexOf(w), 1);
      if (g.target === w) g.target = null;
      g.stats.kills++;
      ev.push({ t: 'kill', id: w.id, x: w.x, y: w.y, text: w.text, kind: w.kind, why });
    }

    function finish(w) {
      const mult = multOf(g.combo), pts = w.text.length * 5 * mult;
      award(pts);
      kill(w, 'typed');
      ev[ev.length - 1].pts = pts;
      if (w.kind === 'frost') { g.freeze = Math.min(g.freeze + FREEZE, 6); g.stats.power++; ev.push({ t: 'freeze', secs: g.freeze }); }
      else if (w.kind === 'blast') {
        g.stats.power++;
        const hit = g.words.filter(o => Math.hypot((o.x - w.x) * cfg.aspect, o.y - w.y) < BLAST_R);
        for (const o of hit) { award(o.text.length * 10); kill(o, 'blast'); }
        ev.push({ t: 'blast', x: w.x, y: w.y, ids: hit.map(o => o.id), r: BLAST_R });
      } else if (w.kind === 'thunder') {
        g.stats.power++;
        const hit = g.words.slice();
        for (const o of hit) { award(o.text.length * 10); kill(o, 'thunder'); }
        ev.push({ t: 'thunder', ids: hit.map(o => o.id) });
      }
    }

    g.key = (ch) => {
      ev.length = 0;
      if (g.over) return ev.slice();
      ch = String(ch).toLowerCase();
      if (!/^[a-z]$/.test(ch)) return ev.slice();
      g.stats.keys++;
      let w = g.target;
      if (!w) {
        w = g.words.filter(o => o.text[0] === ch).sort((a, b) => b.y - a.y)[0];
        if (w) { g.target = w; ev.push({ t: 'lock', id: w.id }); }
      }
      if (w && w.text[w.typed] === ch) {
        w.typed++; g.stats.chars++; g.combo++;
        if (g.combo > g.best) g.best = g.combo;
        award(10 * multOf(g.combo));
        ev.push({ t: 'type', id: w.id, i: w.typed, combo: g.combo, mult: multOf(g.combo) });
        if (w.typed === w.text.length) finish(w);
      } else {
        g.stats.errors++; g.combo = 0;
        ev.push({ t: 'miss', id: w ? w.id : 0, key: ch });
      }
      return ev.slice();
    };

    g.release = () => {
      ev.length = 0;
      if (g.target) { g.target.typed = 0; ev.push({ t: 'release', id: g.target.id }); g.target = null; }
      return ev.slice();
    };

    g.step = (dt) => {
      ev.length = 0;
      if (g.over) return ev.slice();
      g.t += dt;
      const frozen = g.freeze > 0;
      if (frozen) g.freeze = Math.max(0, g.freeze - dt);
      const move = frozen ? 0 : dt;
      for (const w of g.words.slice()) {
        w.y += w.v * move;
        if (w.y >= 1) {
          g.words.splice(g.words.indexOf(w), 1);
          if (g.target === w) g.target = null;
          g.lamps--; g.combo = 0; g.stats.lost++;
          ev.push({ t: 'lost', id: w.id, x: w.x, text: w.text, lamps: g.lamps });
          if (g.lamps <= 0) { g.over = true; ev.push({ t: 'over' }); return ev.slice(); }
        }
      }
      if (!g.spec) {
        g.rest -= dt;
        if (g.rest <= 0) startWave(1);
      } else if (g.spawned < g.spec.count) {
        if (!frozen) {
          g.spawnIn -= dt;
          while (g.spawnIn <= 0 && g.spawned < g.spec.count) {
            spawn(-g.spawnIn);
            let gap = g.spec.gap * (0.8 + 0.4 * rand());
            // from wave 3 some words arrive in a burst of three, paid for by a longer lull: same rain, more weather
            if (g.burst > 0) { g.burst--; g.debt += gap * 0.72; gap *= 0.28; }
            else if (g.debt > 0) { gap += g.debt; g.debt = 0; }
            else if (g.wave >= 3 && g.spawned < g.spec.count - 3 && rand() < Math.min(0.3, 0.04 * g.wave)) { g.burst = 2; g.debt = 0; gap *= 0.28; g.debt += gap * 2.5; }
            g.spawnIn += gap;
          }
        }
      } else if (!g.words.length) {
        if (g.rest === undefined || g.rest <= 0) g.rest = 2.4;
        else g.rest -= dt;
        if (g.rest <= 0) {
          const heal = g.lamps < cfg.lamps;
          if (heal) g.lamps++;
          ev.push({ t: 'clear', n: g.wave, heal });
          g.rest = 0;
          startWave(g.wave + 1);
        }
      }
      return ev.slice();
    };
    return g;
  }

  return { create, spec, rng, hashSeed, tierName, tierIndex, multOf, bank, power, MAX_LAMPS, FREEZE, BLAST_R };
})();
</script>
<script id="page">
(() => {
'use strict';
const $ = id => document.getElementById(id);
const app = $('app'), stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif';
const HOUSES = [.09, .25, .4, .6, .75, .91];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------- saved data ---------- */
const KEY = 'wordRain.v2';
let save = { bestWpm: 0, migrated: false, best: 0, bestWave: 0, daily: { date: '', best: 0 }, mute: false, seen: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
// the old page kept its progress under 'wordrain_save': carry the fastest typing over, and skip the lesson for anyone who played it
if (!save.migrated) {
  try {
    const old = JSON.parse(localStorage.getItem('wordrain_save') || 'null');
