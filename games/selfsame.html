/* ------------------------------------------------------------------ audio */
var AC = null, MASTER = null;
function ac() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    MASTER = AC.createGain(); MASTER.gain.value = .5; MASTER.connect(AC.destination);

}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (!SAVE.snd || !ac()) return;

  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol == null ? .18 : vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);

}
function noise(dur, vol, hz, q) {

  var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var s = AC.createBufferSource(); s.buffer = b;
  var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hz || 900; f.Q.value = q || 1.2;
  var g = AC.createGain(); g.gain.value = vol == null ? .12 : vol;

}

function rr(g, x, y, w, h, r) {

  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);

}
function layout() {
  var L = G.L, pad = 10;

  var bottom = (hint && +hint.style.opacity !== 0 && hint.innerHTML) ? hint.offsetHeight + 16 : 8;
  TS = Math.floor(Math.min((VW - pad * 2) / L.w, (VH - pad * 2 - bottom) / L.h));
  TS = Math.max(15, Math.min(TS, 132));
  OX = Math.round((VW - TS * L.w) / 2);

function wallTile(x, y) {

function drawExit(x, y, open, tm) {

function drawDoor(x, y, c, open) {

  var gl = g.createRadialGradient(cx, cy + bob, 0, cx, cy + bob, r * 2.6);
  gl.addColorStop(0, 'rgba(191,233,255,.55)'); gl.addColorStop(1, 'rgba(191,233,255,0)');
  g.fillStyle = gl; g.fillRect(cx - r * 2.6, cy + bob - r * 2.6, r * 5.2, r * 5.2);
  var b = g.createRadialGradient(cx - r * .3, cy + bob - r * .35, r * .1, cx, cy + bob, r);
  b.addColorStop(0, '#ffffff'); b.addColorStop(.5, '#bfe9ff'); b.addColorStop(1, '#4d9ad0');
  g.fillStyle = b; g.beginPath(); g.arc(cx, cy + bob, r, 0, 6.2832); g.fill();
  g.restore();
}

function drawBody(cx, cy, player, n, stuck) {
  var t = TS, w = t * .3, h = t * .34, col = player ? AMBER : ECHO;
  g.save();
  g.globalAlpha = player ? 1 : .72;
  g.fillStyle = 'rgba(0,0,0,.42)';
  g.beginPath(); g.ellipse(cx, cy + h * .96, w * .95, w * .34, 0, 0, 6.2832); g.fill();
  if (player) {
    var gl = g.createRadialGradient(cx, cy, 0, cx, cy, t * .95);
    gl.addColorStop(0, 'rgba(255,180,84,.26)'); gl.addColorStop(1, 'rgba(255,180,84,0)');
    g.fillStyle = gl; g.fillRect(cx - t, cy - t, t * 2, t * 2);
  }
  var gr = g.createLinearGradient(0, cy - h, 0, cy + h);
  gr.addColorStop(0, player ? '#ffd08a' : '#9df0fb');
  gr.addColorStop(1, player ? '#d0821f' : '#2b93a8');
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(cx - w, cy + h);
  g.quadraticCurveTo(cx - w * .96, cy - h * .16, cx - w * .44, cy - h * .5);
  g.quadraticCurveTo(cx, cy - h * .92, cx + w * .44, cy - h * .5);
  g.quadraticCurveTo(cx + w * .96, cy - h * .16, cx + w, cy + h);
  g.quadraticCurveTo(cx, cy + h * .74, cx - w, cy + h);
  g.closePath(); g.fill();
  g.strokeStyle = player ? 'rgba(255,232,190,.75)' : 'rgba(190,245,255,.6)';
  g.lineWidth = Math.max(1, t * .028); g.stroke();
  g.fillStyle = player ? '#fff2d8' : '#e2fbff';
  g.beginPath(); g.arc(cx, cy - h * .52, w * .42, 0, 6.2832); g.fill();
  if (!player && n != null) {
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(9,14,26,.9)';
    g.beginPath(); g.arc(cx + w * .82, cy + h * .62, t * .13, 0, 6.2832); g.fill();
    g.strokeStyle = ECHO; g.lineWidth = 1.1; g.stroke();
    g.fillStyle = ECHO; g.font = '600 ' + Math.max(8, t * .19) + 'px "Space Grotesk",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(n), cx + w * .82, cy + h * .66);
  }
  if (stuck) {
    g.globalAlpha = 1; g.strokeStyle = 'rgba(255,90,110,.85)'; g.lineWidth = Math.max(1.4, t * .05);
    g.beginPath(); g.arc(cx, cy, t * .42, 0, 6.2832); g.stroke();
  }
  g.restore();
}

function drawArrow(cx, cy, dx, dy, col, alpha) {
  var t = TS, s = t * .2, ox = dx * t * .46, oy = dy * t * .46;
  g.save(); g.globalAlpha = alpha; g.translate(cx + ox, cy + oy);
  g.rotate(Math.atan2(dy, dx));
  g.fillStyle = col;
  g.beginPath(); g.moveTo(s * .55, 0); g.lineTo(-s * .4, s * .52); g.lineTo(-s * .12, 0); g.lineTo(-s * .4, -s * .52);
  g.closePath(); g.fill(); g.restore();
}

/* ---------------------------------------------------------------- compose */
function render(tm) {
  var L = G.L; if (!L) return;
  g.clearRect(0, 0, VW, VH);
  var A = G.animFrom, B = G.animTo, p = ease(Math.min(1, G.anim));
  var S = B || G.st;
  var gt = SS.gates(L, S), x, y, i;

  /* the room, carved out of one slab of stone */
  g.save();
  g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = TS * .55; g.shadowOffsetY = TS * .12;
  g.fillStyle = '#191e33';
  rr(g, px(0) - 2, py(0) - 2, TS * L.w + 4, TS * L.h + 4, TS * .16); g.fill();
  g.restore();
  g.save(); g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1;
  rr(g, px(0) - 1.5, py(0) - 1.5, TS * L.w + 3, TS * L.h + 3, TS * .16); g.stroke(); g.restore();
  for (y = 0; y < L.h; y++) for (x = 0; x < L.w; x++)
    if (SS.at(L, x, y).t === 'wall') wallTile(x, y);
  for (y = 0; y < L.h; y++) for (x = 0; x < L.w; x++)
    if (SS.at(L, x, y).t !== 'wall') floorTile(x, y);

  for (y = 0; y < L.h; y++) for (x = 0; x < L.w; x++) {
    var cc = SS.at(L, x, y);
    if (x === L.spawn.x && y === L.spawn.y) drawGate(x, y, tm);
    if (cc.t === 'exit') drawExit(x, y, SS.exitOpen(L, S), tm);
    else if (cc.t === 'plate') drawPlate(x, y, cc, SS.bodyAt(S, x, y) >= 0 || SS.boxAt(S, x, y) >= 0 ? (cc.crate ? SS.boxAt(S, x, y) >= 0 : true) : false);
    else if (cc.t === 'door') drawDoor(x, y, cc, SS.openCell(L, cc, gt));
    else if (cc.t === 'lever') drawLever(x, y, S.levers[cc.id], cc.ch);
    else if (cc.t === 'socket') drawSocket(x, y, S.socks[cc.id] >= 0);
  }

  /* echo routes on demand */
  if (G.peek && G.run) {
    var recs = G.run.recs;
    for (i = 0; i < recs.length - 1; i++) {
      var path = echoPath(i), j;
      g.save(); g.strokeStyle = ECHO; g.globalAlpha = .5; g.lineWidth = Math.max(1.6, TS * .06);
      g.setLineDash([TS * .16, TS * .14]); g.lineJoin = 'round';
      g.beginPath();
      for (j = 0; j < path.length; j++) {
        var qx = px(path[j].x) + TS / 2 + (i - (recs.length - 2) / 2) * TS * .07;
        var qy = py(path[j].y) + TS / 2 + (i - (recs.length - 2) / 2) * TS * .07;
        if (j === 0) g.moveTo(qx, qy); else g.lineTo(qx, qy);
      }
      g.stroke(); g.setLineDash([]); g.restore();
    }
  }

  /* crates and orbs */
  for (i = 0; i < S.boxes.length; i++) {
    var bx = A ? lerp(A.boxes[i].x, B.boxes[i].x, p) : S.boxes[i].x;
    var by = A ? lerp(A.boxes[i].y, B.boxes[i].y, p) : S.boxes[i].y;
    var under = SS.at(L, S.boxes[i].x, S.boxes[i].y);
    drawCrate(px(bx) + TS / 2, py(by) + TS / 2, under.t === 'plate' ? CH[under.ch] : null);
  }
  for (i = 0; i < S.orbs.length; i++) {
    var o = S.orbs[i];
    if (o.h >= 0) continue;
    var ox2 = A ? lerp(A.orbs[i].x, o.x, p) : o.x, oy2 = A ? lerp(A.orbs[i].y, o.y, p) : o.y;
    drawOrb(px(ox2) + TS / 2, py(oy2) + TS / 2, tm, o.s >= 0);
  }

  /* bodies, oldest first so the player sits on top */
  var stack = {};
  for (i = 0; i < S.bodies.length; i++) {
    var b = S.bodies[i];
    var bxp = A && A.bodies[i] ? lerp(A.bodies[i].x, b.x, p) : b.x;
    var byp = A && A.bodies[i] ? lerp(A.bodies[i].y, b.y, p) : b.y;
    var k = Math.round(bxp) + ',' + Math.round(byp);
    var n = stack[k] = (stack[k] || 0) + 1;
    var off = Math.min(n - 1, 3) * TS * .085;      /* a fan, not a conga line */
    var cx = px(bxp) + TS / 2 + off, cy = py(byp) + TS / 2 - off;
    var isP = i === S.bodies.length - 1;
    var shut = !SS.openCell(L, SS.at(L, b.x, b.y), gt);
    drawBody(cx, cy, isP, isP ? null : i + 1, shut);
    if (b.c >= 0) drawOrb(cx, cy - TS * .5, tm, true);
    if (isP && G.anim >= 1 && canUse(L, S)) drawUseTag(cx, cy, tm);
    /* what an echo does next */
    if (!isP && G.run && G.anim >= 1) {
      var rec = G.run.recs[i], t = G.cur.length;
      if (rec && t < rec.length) {
        var d = SS.DIR[rec[t].a];
        if (d) drawArrow(cx, cy, d[0], d[1], ECHO, .78);
        else if (rec[t].a === 'a') {
          g.save(); g.globalAlpha = .8; g.fillStyle = ECHO;
          g.beginPath(); g.arc(cx, cy - TS * .52, TS * .07, 0, 6.2832); g.fill(); g.restore();
        }
      }
    }
  }
}

/* True exactly when pressing use would do something — the same test the
   simulation makes, so the prompt can never promise what the turn refuses. */
function canUse(L, st) {
  var b = st.bodies[st.bodies.length - 1], cell = SS.at(L, b.x, b.y);
  if (cell.t === 'lever') return true;
  if (b.c >= 0) {
    if (cell.t === 'socket') return st.socks[cell.id] < 0;
    return SS.looseOrbAt(st, b.x, b.y) < 0 && SS.boxAt(st, b.x, b.y) < 0;
  }
  if (cell.t === 'socket') return st.socks[cell.id] >= 0;
  return SS.looseOrbAt(st, b.x, b.y) >= 0;
}

function drawUseTag(cx, cy, tm) {
  var t = TS, w = t * .3, h = t * .24, x = cx - t * .46, y = cy - t * .52;
  var pulse = .72 + Math.sin(tm / 320) * .28;
  g.save();
  g.globalAlpha = pulse;
  g.fillStyle = 'rgba(16,12,4,.9)';
  rr(g, x, y, w, h, h * .3); g.fill();
  g.strokeStyle = AMBER; g.lineWidth = Math.max(1, t * .022);
  rr(g, x, y, w, h, h * .3); g.stroke();
  g.fillStyle = AMBER;
  g.font = '700 ' + Math.max(7, t * .155) + 'px "Space Grotesk",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(TOUCH ? '\u2295' : 'E', x + w / 2, y + h / 2 + t * .008);
  g.restore();
}

function echoPath(i) {
  var L = G.L, out = [], st = SS.newState(L, i + 1), t, k;
  var recs = G.run.recs;
  out.push({ x: L.spawn.x, y: L.spawn.y });
  for (t = 0; t < L.T; t++) {
    var acts = [];
    for (k = 0; k <= i; k++) acts.push(recs[k][t].a);
    SS.tick(L, st, acts);
    out.push({ x: st.bodies[i].x, y: st.bodies[i].y });
  }
  return out;
}

/* -------------------------------------------------------------- the game */
var G = {
  idx: 0, L: null, loops: [], cur: '', run: null, st: null,
  anim: 1, animFrom: null, animTo: null, dur: 120,
  queue: [], peek: false, busy: 0, proj: null, over: 0, watch: 0
};
var $ = function (id) { return document.getElementById(id); };
var hintT = 0;

function refresh() {
  G.run = SS.play(G.L, G.loops.concat([G.cur]));
  var h = G.run.hist;
  G.st = h[Math.min(G.cur.length, h.length - 1)];
  G.proj = project();
}

function project() {
  var L = G.L, T = L.T, n = G.cur.length, res = { on: {}, para: -1 }, ch, t, k;
  for (ch = 1; ch <= 4; ch++) if (L.chSrc[ch].length) res.on[ch] = new Array(T).fill(0);
  for (t = 0; t < n && t < G.run.hist.length; t++) {
    var gt = SS.gates(L, G.run.hist[t]);
    for (ch in res.on) res.on[ch][t] = gt[ch];
  }
  var st = SS.clone(G.st), recs = G.run.recs;
  for (t = n; t < T; t++) {
    var gt2 = SS.gates(L, st);
    for (ch in res.on) res.on[ch][t] = gt2[ch];
    var acts = [];
    for (k = 0; k < recs.length - 1; k++) acts.push(recs[k][t].a);
    acts.push('w');
    var r = SS.tick(L, st, acts);
    for (k = 0; k < recs.length - 1; k++)
      if (r[k].m !== recs[k][t].m || r[k].o !== recs[k][t].o) { if (res.para < 0) res.para = t; }
    if (res.para >= 0) break;
  }
  return res;
}

function loadRoom(i, keep) {
  G.idx = Math.max(0, Math.min(ROOMS.length - 1, i));
  G.L = SS.parse(ROOMS[G.idx]);
  G.loops = []; G.cur = ''; G.queue = []; G.over = 0; G.watch = 0;
  G.anim = 1; G.animFrom = null; G.animTo = null;
  vis = {};
  refresh();
  layout();
  $('rname').textContent = ROOMS[G.idx].n;
  $('rsub').textContent = 'room ' + (G.idx + 1) + ' of ' + ROOMS.length;
  $('hint').innerHTML = ROOMS[G.idx].hint || '';
  $('hint').style.opacity = ROOMS[G.idx].hint ? 1 : 0;
  clearTimeout(hintT);
  /* on a small screen the hint costs board, so it steps aside after a read */
  if (ROOMS[G.idx].hint && (document.body.classList.contains('touch') || window.innerWidth < 560 || window.innerHeight < 620))
    hintT = setTimeout(function () { $('hint').style.opacity = 0; layout(); }, 9000);
  buildLanes();
  hud();
  if (!keep) { try { history.replaceState(null, '', '?r=' + (G.idx + 1)); } catch (e) {} }
}

function hud() {
  var par = ROOMS[G.idx].par, tight = window.innerWidth <= 430;
  $('cLoop').textContent = tight ? (G.loops.length + 1) + '/' + par : (G.loops.length + 1);
  $('cLoopLbl').textContent = tight ? 'loop/par' : 'loop';
  $('cTurn').textContent = G.cur.length + '/' + G.L.T;
  $('cPar').textContent = par;
  $('chPar').classList.toggle('warn', G.loops.length + 1 > par);
  $('pAct').classList.toggle('lit', canUse(G.L, G.st));
  paintLanes();
}

/* -------------------------------------------------------------- timeline */
function buildLanes() {
  var L = G.L, box = $('lanes'), html = '', ch, t;
  html += '<div class="tl ruler"><div class="tl-name"></div><div class="tl-track" id="lnR">';
  for (t = 0; t < L.T; t++) html += '<div class="tl-cell' + (t % 5 === 0 ? ' mark' : '') + '">'
    + (t % 5 === 0 ? '<i>' + t + '</i>' : '') + '</div>';
  html += '</div></div>';
  for (ch = 1; ch <= 4; ch++) {
    if (!L.chSrc[ch].length) continue;
    html += '<div class="tl"><div class="tl-name" style="color:' + CH[ch] + '">ch ' + ch + '</div>'
      + '<div class="tl-track" id="ln' + ch + '">';
    for (t = 0; t < L.T; t++) html += '<div class="tl-cell"></div>';
    html += '</div></div>';
  }
  box.innerHTML = html;
}
function paintLanes() {
  var L = G.L, n = G.cur.length, p = G.proj, ch, t;
  var rl = $('lnR'); if (!rl) return;
  for (t = 0; t < L.T; t++) {
    var c = rl.children[t];
    c.className = 'tl-cell' + (t % 5 === 0 ? ' mark' : '') + (t === n ? ' now' : '') + (t < n ? ' past' : '');
    if (p.para >= 0 && t === p.para) c.title = 'a paradox waits here if you stand still';
    c.style.background = (p.para >= 0 && t === p.para) ? 'rgba(255,90,110,.85)' : '';
  }
  for (ch in p.on) {
    var tr = $('ln' + ch); if (!tr) continue;
    for (t = 0; t < L.T; t++) {
      var cell = tr.children[t], on = p.on[ch][t];
      cell.className = 'tl-cell' + (t === n ? ' now' : '');
      cell.style.background = on ? (t < n ? CH[ch] : CHDIM[ch]) : (t < n ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.06)');
    }
  }
}

/* ----------------------------------------------------------------- flashes */
var flashT = 0;
function flash(msg, good) {
  var f = $('flash');
  f.innerHTML = msg; f.classList.toggle('good', !!good); f.classList.add('show');
  clearTimeout(flashT); flashT = setTimeout(function () { f.classList.remove('show'); }, good ? 1500 : 2400);
}

/* ------------------------------------------------------------------ turns */
function step(a) {
  if (G.over || G.busy) return;
  if (G.cur.length >= G.L.T) return;
  var before = G.st;
  var beforeGates = SS.gates(G.L, before);
  G.cur += a;
  refresh();
  if (G.st.para) {
    var e = G.st.para;
    G.cur = G.cur.slice(0, -1);
    refresh();
    SFX.para();
    var why = e.want.o !== e.got.o
      ? 'Echo ' + (e.echo + 1) + ' cannot reach what it once reached here.'
      : 'Echo ' + (e.echo + 1) + ' has to step there. It always did.';
    flash('&#9888; Paradox — ' + why);
    shake();
    return;
  }
  var res = G.run.recs[G.run.recs.length - 1][G.cur.length - 1];
  G.animFrom = before; G.animTo = G.st; G.anim = 0;
  G.dur = G.queue.length > 1 ? 68 : 118;
  /* sound: report what actually happened */
  if (res.o) SFX[res.o.charAt(0) === 'L' ? 'lever' : res.o.charAt(0) === 'P' ? 'grab'
    : res.o.charAt(0) === 'I' ? 'slot' : res.o.charAt(0) === 'T' ? 'grab' : 'drop']();
  else if (a === 'a') SFX.bump();
  else if (a === 'w') SFX.step();
  else if (!res.m) SFX.bump();
  else {
    var moved = false;
    for (var i = 0; i < before.boxes.length; i++)
      if (before.boxes[i].x !== G.st.boxes[i].x || before.boxes[i].y !== G.st.boxes[i].y) moved = true;
    moved ? SFX.shove() : SFX.step();
  }
  var ng = SS.gates(G.L, G.st);
  for (var ch = 1; ch <= 4; ch++) if (ng[ch] !== beforeGates[ch]) SFX.door(ng[ch]);
  hud();
  if (G.st.won) {
    G.over = 1;
    setTimeout(win, 380);
  } else if (G.cur.length >= G.L.T) {
    G.busy = 1;
    setTimeout(function () { G.busy = 0; endHour(true); }, 300);
  }
}

function endHour(auto) {
  if (G.over) return;
  if (!G.cur.length) { flash('Nothing to remember yet.'); return; }
  G.loops.push(G.cur); G.cur = '';
  G.queue = [];
  refresh();
  G.animFrom = null; G.animTo = null; G.anim = 1;
  vis = {};
  SFX.rewind(); setTimeout(SFX.echo, 260);
  flash(auto ? 'The hour ran out. Echo ' + G.loops.length + ' is walking it again.'
             : 'Echo ' + G.loops.length + ' will repeat that hour, exactly.', true);
  hud();
}

function undo() {
  if (G.over) return;
  if (G.cur.length) G.cur = G.cur.slice(0, -1);
  else if (G.loops.length) { G.cur = G.loops.pop(); }
  else return;
  G.queue = [];
  refresh();
  G.animFrom = null; G.animTo = null; G.anim = 1; vis = {};
  tone(320, .07, 'triangle', .06, 240);
  hud();
}

function restart() {
  if (G.over) return;
  G.loops = []; G.cur = ''; G.queue = []; refresh();
  G.animFrom = null; G.animTo = null; G.anim = 1; vis = {};
  tone(240, .18, 'triangle', .07, 160); hud();
}

var shakeT = 0;
function shake() {
  var s = $('stage'); shakeT = 1;
  (function tickShake() {
    if (shakeT <= 0) { s.style.transform = ''; return; }
    shakeT -= .09;
    s.style.transform = 'translate(' + (Math.random() - .5) * 9 * shakeT + 'px,' + (Math.random() - .5) * 9 * shakeT + 'px)';
    requestAnimationFrame(tickShake);
  })();
}

/* -------------------------------------------------------------- finishing */
function win() {
  var loops = G.loops.length + 1, par = ROOMS[G.idx].par, turns = G.st.t;
  if (!G.watch) {
    var b = SAVE.best[G.idx];
    if (!b || loops < b.loops || (loops === b.loops && turns < b.turns)) SAVE.best[G.idx] = { loops: loops, turns: turns };
    store();
  }
  SFX.win();
  var perfect = loops <= par;
  $('wTitle').textContent = G.watch ? 'That is one way out' : perfect ? 'Out, at par' : 'Out';
  $('wSub').innerHTML = G.watch
    ? 'A shared solution for <b>' + ROOMS[G.idx].n + '</b>, in <b>' + loops + '</b> hour' + (loops > 1 ? 's' : '') + '. Now try it yourself.'
    : perfect
    ? 'You spent <b>' + loops + '</b> hour' + (loops > 1 ? 's' : '') + ' — the fewest this room allows.'
    : 'You spent <b>' + loops + '</b> hours. It can be done in <b>' + par + '</b>.';
  $('wShare').textContent = 'copy a link to this solution';
  $('wShare').style.display = G.watch ? 'none' : '';
  $('wStats').innerHTML =
    stat(loops, 'hours spent', perfect) + stat(par, 'par') + stat(turns, 'turns');
  $('wNext').style.display = (G.idx < ROOMS.length - 1 && !G.watch) ? '' : 'none';
  show('won');
}
function stat(v, l, hot) {
  return '<div style="display:block;text-align:center"><div style="font-size:26px;font-weight:600;color:'
    + (hot ? 'var(--amber)' : 'var(--text)') + '">' + v +
    '</div><div style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)">' + l + '</div></div>';
}

/* ---------------------------------------------------------------- panels */
function show(id) {
  ['title', 'rooms', 'help', 'won'].forEach(function (k) { $(k).classList.toggle('show', k === id); });
  if (id === 'rooms') paintRooms();
}
function hideAll() { ['title', 'rooms', 'help', 'won'].forEach(function (k) { $(k).classList.remove('show'); }); }
function anyPanel() { return ['title', 'rooms', 'help', 'won'].some(function (k) { return $(k).classList.contains('show'); }); }

var ACTS_NAME = ['', 'The Hour', 'Machinery', 'Interference', 'Clockwork'];
function paintRooms() {
  var html = '', act = 0, done = 0;
  for (var i = 0; i < ROOMS.length; i++) {
    if (ROOMS[i].act !== act) { act = ROOMS[i].act; html += '<div class="act">' + ACTS_NAME[act] + '</div><div class="grid">'; }
    var b = SAVE.best[i], lk = !unlocked(i);
    if (b) done++;
    var cls = 'room' + (lk ? ' lock' : '') + (b ? (b.loops <= ROOMS[i].par ? ' perfect' : ' done') : '');
    html += '<button class="' + cls + '" data-i="' + i + '"' + (lk ? ' disabled' : '') + '>'
      + '<b>' + (i + 1) + '</b><span>' + (b ? b.loops + ' hr' : (lk ? 'locked' : 'par ' + ROOMS[i].par)) + '</span>'
      + (b && b.loops <= ROOMS[i].par ? '<i>&#9733;</i>' : '') + '</button>';
    if (i === ROOMS.length - 1 || ROOMS[i + 1].act !== act) html += '</div>';
  }
  $('roomList').innerHTML = html;
  $('roomsSub').innerHTML = done + ' of ' + ROOMS.length + ' rooms out, ' +
    Object.keys(SAVE.best).filter(function (k) { return SAVE.best[k].loops <= ROOMS[k].par; }).length + ' at par.';
  Array.prototype.forEach.call($('roomList').querySelectorAll('.room'), function (el) {
    el.addEventListener('click', function () {
      var i = +el.dataset.i; if (!unlocked(i)) return;
      hideAll(); loadRoom(i);
    });
  });
}

var HELP = '<h2>How to play</h2>'
  + '<p>Every room gives you a fixed number of turns — one <b>hour</b>. Spend them, and time snaps back to the '
  + 'start: the room resets, and the you who just walked it stays behind as an <b>echo</b>, repeating every '
  + 'single turn of that hour, forever. Then you get another hour, with that echo in it.</p>'
  + '<h3>Keys</h3>'
  + '<p><span class="kbd">&#8592;&#8593;&#8595;&#8594;</span> or <span class="kbd">WASD</span> step &mdash; one turn each. '
  + '<span class="kbd">Space</span> wait a turn. <span class="kbd">E</span> use what you are standing on: pick up an orb, '
  + 'put one down, throw a lever.</p>'
  + '<p><span class="kbd">R</span> end the hour now (the echo simply stands still for the rest of it). '
  + '<span class="kbd">Z</span> undo a turn, and keep undoing back through whole hours. '
  + '<span class="kbd">Shift</span>+<span class="kbd">R</span> start the room over. '
  + 'Hold <span class="kbd">Tab</span> to see every echo\'s route.</p>'
  + '<h3>The room</h3><div class="leg" id="legend"></div>'
  + '<h3>Rules worth knowing</h3><ul>'
  + '<li>An echo never changes. If something stops it doing what it did, that is a <b>paradox</b> and the turn is refused.</li>'
  + '<li>Two of you cannot share a tile — except on the violet <b>gate</b>, where every hour begins.</li>'
  + '<li>If you both want the same tile, the older one wins. The past has already happened.</li>'
  + '<li>A shutter that closes on you holds you there until it opens again.</li>'
  + '<li>The bars under the room show each channel: solid where it has already been powered this hour, '
  + 'faint where it will be if you stand still.</li></ul>'
  + '<div class="btnrow"><button class="btn pri" id="hClose">Back to it</button></div>';

function legendIcon(fn) {
  var c = document.createElement('canvas'); c.width = c.height = 52;
  var gg = c.getContext('2d'), sv = [g, TS, OX, OY, vis];
  g = gg; TS = 52; OX = 0; OY = 0; vis = {};
  gg.setTransform(1, 0, 0, 1, 0, 0);
  fn();
  g = sv[0]; TS = sv[1]; OX = sv[2]; OY = sv[3]; vis = sv[4];
  return c;
}
function buildLegend() {
  var box = $('legend'); if (!box) return;
  var items = [
    ['You', function () { drawBody(26, 26, true, null, false); }],
    ['An echo of you', function () { drawBody(26, 26, false, 1, false); }],
    ['The gate — hours begin here', function () { var s = G.L; G.L = { spawn: { x: 0, y: 0 } }; drawGate(0, 0, 0); G.L = s; }],
    ['The way out', function () { var s = G.L; G.L = {}; drawExit(0, 0, true, 0); G.L = s; }],
    ['Plate — powers while pressed', function () { drawPlate(0, 0, { ch: 1, crate: false }, true); }],
    ['Crate plate — needs a crate', function () { drawPlate(0, 0, { ch: 2, crate: true }, false); }],
    ['Shutter — open while powered', function () { drawDoor(0, 0, { ch: 1, inv: false }, false); }],
    ['Iris — shut while powered', function () { drawDoor(0, 0, { ch: 3, inv: true }, true); }],
    ['Lever — stays where you leave it', function () { drawLever(0, 0, true, 4); }],
    ['Crate', function () { drawCrate(26, 26); }],
    ['Orb', function () { drawOrb(26, 26, 0, false); }],
    ['Socket — feed it an orb', function () { drawSocket(0, 0, false); }]
  ];
  box.innerHTML = '';
  items.forEach(function (it) {
    var d = document.createElement('div');
    d.appendChild(legendIcon(it[1]));
    var s = document.createElement('span'); s.textContent = it[0];
    d.appendChild(s); box.appendChild(d);
  });
}

/* ---------------------------------------------------------------- sharing */
function solutionLink() {
  var plan = G.loops.concat([G.cur]).join('.');
  return location.origin + location.pathname + '?r=' + (G.idx + 1) + '&p=' + plan;
}
function copyLink() {
  var url = solutionLink(), el = $('wShare');
  function done(ok) { el.textContent = ok ? 'link copied' : url; }
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(url).then(function () { done(1); }, function () { done(0); });
  else done(0);
}

/* Replays a shared plan at reading speed. Any key takes the room back. */
function watch(plan) {
  G.watch = 1;
  hideAll();
  flash('Watching a shared solution — ' + plan.length + ' hour' + (plan.length > 1 ? 's' : '') + '. Press any key to take over.', true);
  var k = 0, t = 0;
  (function next() {
    if (G.watch !== 1) return;
    if (k >= plan.length) return;
    if (t >= plan[k].length) {
      if (k < plan.length - 1 && !G.over) endHour(false);
      k++; t = 0; setTimeout(next, 700); return;
    }
    G.queue.push(plan[k].charAt(t)); t++;
    setTimeout(next, 190);
  })();
}

/* ------------------------------------------------------------------ input */
var KEYS = {
  ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r',
  KeyW: 'u', KeyS: 'd', KeyA: 'l', KeyD: 'r',
  Numpad8: 'u', Numpad2: 'd', Numpad4: 'l', Numpad6: 'r',
  Space: 'w', Period: 'w', Numpad5: 'w',
  KeyE: 'a', Enter: 'a', KeyF: 'a', NumpadEnter: 'a'
};
function push(a) {
  if (anyPanel() || G.watch) return;
  if (G.queue.length < 3) G.queue.push(a);
}
function takeOver() { if (G.watch) { G.watch = 0; loadRoom(G.idx); return true; } return false; }
document.addEventListener('keydown', function (ev) {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var c = ev.code;
  if (c === 'Tab') { ev.preventDefault(); G.peek = true; $('bPeek').classList.add('on'); return; }
  if (anyPanel()) {
    if (c === 'Escape') { hideAll(); ev.preventDefault(); }
    else if (c === 'Enter' && $('won').classList.contains('show')) { nextRoom(); ev.preventDefault(); }
    else if (c === 'Enter' && $('title').classList.contains('show')) { begin(); ev.preventDefault(); }
    return;
  }
  if (G.watch) { ev.preventDefault(); takeOver(); return; }
  if (KEYS[c]) { ev.preventDefault(); push(KEYS[c]); return; }
  if (c === 'KeyZ' || c === 'Backspace') { ev.preventDefault(); undo(); }
  else if (c === 'KeyR') { ev.preventDefault(); ev.shiftKey ? restart() : endHour(false); }
  else if (c === 'Escape') { ev.preventDefault(); show('rooms'); }
  else if (c === 'KeyH' || c === 'Slash') { ev.preventDefault(); buildLegend(); show('help'); }
  else if (c === 'KeyM') { toggleSound(); }
});
document.addEventListener('keyup', function (ev) {
  if (ev.code === 'Tab') { G.peek = false; $('bPeek').classList.remove('on'); }
});
window.addEventListener('blur', function () { G.peek = false; $('bPeek').classList.remove('on'); });

/* tap an adjacent tile to step into it */
cv.addEventListener('pointerdown', function (ev) {
  if (anyPanel() || !G.L) return;
  if (takeOver()) return;
  var r = cv.getBoundingClientRect();
  var gx = Math.floor((ev.clientX - r.left - OX) / TS), gy = Math.floor((ev.clientY - r.top - OY) / TS);
  var me = G.st.bodies[G.st.bodies.length - 1];
  var dx = gx - me.x, dy = gy - me.y;
  if (dx === 0 && dy === 0) { push('a'); return; }
  if (Math.abs(dx) + Math.abs(dy) !== 1) return;
  push(dx === 1 ? 'r' : dx === -1 ? 'l' : dy === 1 ? 'd' : 'u');
});

function holdBtn(el, fn) {
  var t = null, iv = null;
  function go(e) {
    e.preventDefault(); fn();
    t = setTimeout(function () { iv = setInterval(fn, 105); }, 300);
  }
  function stop() { clearTimeout(t); clearInterval(iv); }
  el.addEventListener('pointerdown', go);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (k) { el.addEventListener(k, stop); });
}
Array.prototype.forEach.call(document.querySelectorAll('.pk[data-d]'), function (el) {
  holdBtn(el, function () { push(el.dataset.d); });
});
holdBtn($('pWait'), function () { push('w'); });
$('pPeek').addEventListener('pointerdown', function (e) { e.preventDefault(); G.peek ? peekOff() : peekOn(); });
$('pAct').addEventListener('pointerdown', function (e) { e.preventDefault(); push('a'); });
$('pUndo').addEventListener('pointerdown', function (e) { e.preventDefault(); undo(); });
$('pLoop').addEventListener('pointerdown', function (e) { e.preventDefault(); endHour(false); });

$('bUndo').onclick = undo;
$('bLoop').onclick = function () { endHour(false); };
$('bRooms').onclick = function () { show('rooms'); };
$('bHelp').onclick = function () { buildLegend(); show('help'); };
$('bSound').onclick = toggleSound;
function peekOn() { G.peek = true; $('bPeek').classList.add('on'); $('pPeek').classList.add('lit'); }
function peekOff() { G.peek = false; $('bPeek').classList.remove('on'); $('pPeek').classList.remove('lit'); }
$('bPeek').addEventListener('pointerdown', function (e) { e.preventDefault(); G.peek ? peekOff() : peekOn(); });
function toggleSound() {
  SAVE.snd = SAVE.snd ? 0 : 1; store();
  $('bSound').classList.toggle('on', !!SAVE.snd);
  if (SAVE.snd) tone(660, .1, 'sine', .1);
}
$('rClose').onclick = hideAll;
$('tPlay').onclick = begin;
$('tRooms').onclick = function () { show('rooms'); };
$('wNext').onclick = nextRoom;
$('wRetry').onclick = function () { hideAll(); loadRoom(G.idx); };
$('wRooms').onclick = function () { show('rooms'); };
$('wShare').onclick = copyLink;
document.addEventListener('click', function (e) { if (e.target && e.target.id === 'hClose') hideAll(); });
['title', 'rooms', 'help', 'won'].forEach(function (k) {
  $(k).addEventListener('click', function (e) { if (e.target === $(k) && k !== 'title' && k !== 'won') hideAll(); });
});
$('hint').addEventListener('click', function () { this.style.opacity = 0; });

function begin() { hideAll(); SAVE.seen = 1; store(); ac(); loadRoom(furthest()); }
function nextRoom() { hideAll(); loadRoom(Math.min(ROOMS.length - 1, G.idx + 1)); }

/* ------------------------------------------------------------------- loop */
var last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(64, now - last); last = now;
  if (G.anim < 1) {
    G.anim += dt / G.dur;
    if (G.anim >= 1) { G.anim = 1; G.animFrom = null; }
  } else if (G.queue.length && !G.busy && !G.over && (G.watch || !anyPanel())) {
    step(G.queue.shift());
  }
  render(now);
}

/* --------------------------------------------------------------- start up */
if (TOUCH) document.body.classList.add('touch');
$('helpBody').innerHTML = HELP;
$('bSound').classList.toggle('on', !!SAVE.snd);
window.addEventListener('resize', function () { fit(); hud(); });
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

var q = new URLSearchParams(location.search);
var want = parseInt(q.get('r') || q.get('room'), 10);
var shared = (q.get('p') || '').replace(/[^udlrwa.]/g, '');
loadRoom(isFinite(want) && want > 0 ? want - 1 : furthest(), true);
fit();
if (shared) { ac(); requestAnimationFrame(frame); watch(shared.split('.').filter(function (s) { return s.length; })); }
else {
  if (!SAVE.seen) show('title'); else if (isFinite(want) && want > 0) hideAll(); else show('title');
  requestAnimationFrame(frame);
}

/* ?debug=1 exposes the internals so the claims above can be re-tested from a
   browser harness: every room's shipped solution replays through this same
   code path. Nothing here is secret — this is one readable file. */
if (/[?&]debug=1/.test(location.search)) {
  window.SELFSAME = { SS: SS, ROOMS: ROOMS, G: G, loadRoom: loadRoom, step: step, endHour: endHour,
                      play: function (i, plan) { loadRoom(i); for (var k = 0; k < plan.length; k++) {
                        for (var t = 0; t < plan[k].length; t++) { G.cur += plan[k].charAt(t); }
                        refresh(); if (k < plan.length - 1) { G.loops.push(G.cur); G.cur = ''; refresh(); } }
                        hud(); return G.st; } };
}
/*==/UI==*/

})();
</script>
</body>
</html>
