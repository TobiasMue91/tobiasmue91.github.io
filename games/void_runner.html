<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Void Runner</title>
<meta name="description" content="An endless runner on a thin line of light. Jump, double jump and slide through a void that never stops speeding up, brush past danger for bonus points and chain orbs into a combo.">
<meta name="theme-color" content="#020207">
<style>
:root{--bone:#ece8dd;--ember:#ff4b2b;--gold:#ffcf6e;--teal:#7fe9ff;--ink:#020207;
  --font:"Bahnschrift","DIN Condensed","Roboto Condensed","Oswald","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--font);
  text-transform:uppercase;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
#hud{padding-top:calc(env(safe-area-inset-top) + 12px);text-align:center;transition:opacity .3s ease}
#hud.off{opacity:0}
#score{display:block;font-size:min(6.8vh,12vw,58px);font-weight:700;letter-spacing:.05em;line-height:1;font-variant-numeric:tabular-nums;min-height:1em;will-change:transform}
#combo{position:relative;width:58px;height:58px;margin:8px auto 0;opacity:0;transform:scale(.85);transition:opacity .25s ease,transform .25s cubic-bezier(.2,.9,.3,1.3)}
#combo.on{opacity:1;transform:scale(1)}
#combo svg{position:absolute;inset:0;overflow:visible}
#combo b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
#ringfg{transition:stroke .2s}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
.screen.on{opacity:1;visibility:visible;transition:opacity .35s ease}
h1{margin:0;font-weight:700;line-height:.86;text-align:center;font-size:min(23vw,22vh,170px);letter-spacing:.04em}
h1 span{display:block}
h1 .v{color:transparent;-webkit-text-stroke:max(2px,.012em) var(--bone);letter-spacing:.2em;margin-right:-.2em;filter:drop-shadow(0 0 .12em rgba(236,232,221,.35))}
h1 .r{font-size:.78em;letter-spacing:.07em;margin-top:.06em;text-shadow:0 0 .3em rgba(236,232,221,.25)}
.sub{margin-top:min(3vh,22px);font-size:13px;letter-spacing:.34em;opacity:.65;min-height:1em}
.go{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 21vh);text-align:center;font-size:clamp(17px,2.9vh,24px);letter-spacing:min(.36em,2vw);font-weight:700;padding-left:.3em;white-space:nowrap;
  animation:pulse 1.6s ease-in-out infinite}
.go.wait{opacity:.28;animation:none}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
.btn{pointer-events:auto;font:inherit;text-transform:uppercase;color:var(--bone);background:rgba(2,2,7,.55);border:1.5px solid rgba(236,232,221,.4);
  border-radius:999px;padding:0 20px;min-height:46px;letter-spacing:.22em;font-size:13px;font-weight:700;cursor:pointer;
  transition:background .15s,border-color .15s,transform .12s}
.btn:hover{background:rgba(236,232,221,.12);border-color:var(--bone)}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.btn small{display:block;font-size:10px;letter-spacing:.2em;opacity:.7;margin-top:1px;font-weight:400}
#dailyBtn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 6vh);transform:translateX(-50%);padding:6px 24px}
#dailyBtn:active{transform:translateX(-50%) scale(.95)}
#snd{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 8px);width:46px;height:46px;padding:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  border-color:transparent;background:transparent;opacity:.7;z-index:5}
#snd svg{width:22px;height:22px;stroke:var(--bone);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#snd .x{display:none}#snd.mute .x{display:block}#snd.mute .w{display:none}
#over .tag{font-size:14px;letter-spacing:.4em;color:var(--gold);font-weight:700;min-height:1.2em;padding-left:.4em;transform:scale(.8);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.4),opacity .3s}
#over .tag.on{transform:scale(1);opacity:1}
#final{font-size:min(19vw,17vh,150px);font-weight:700;line-height:1;letter-spacing:.03em;font-variant-numeric:tabular-nums;margin:.06em 0 .1em;text-shadow:0 0 .35em rgba(236,232,221,.25)}
#stats{display:flex;gap:clamp(16px,4vw,38px);font-size:19px;font-weight:700;letter-spacing:.14em;opacity:.92;font-variant-numeric:tabular-nums}
#stats i{font-style:normal;opacity:.6;margin-left:.4em;font-size:13px;font-weight:400}
#best{margin-top:min(3vh,22px);font-size:15px;letter-spacing:.3em;opacity:.7}
#menuBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 6vh)}
#menuBtn:active{transform:translateX(-50%) scale(.95)}
#paused h2{margin:0;font-size:min(14vw,10vh,90px);letter-spacing:.14em;padding-left:.14em}
#title{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 11vh)}
#dim{background:rgba(2,2,7,.68);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity .3s ease}
#dim.on{opacity:1}
@media (prefers-reduced-motion:reduce){.go{animation:none;opacity:.9}#combo{transition:opacity .2s}#over .tag{transition:opacity .2s;transform:none}}
@media (max-height:430px){#title{padding-top:calc(env(safe-area-inset-top) + 5vh)}h1{font-size:min(16vw,26vh,110px)}.go{bottom:calc(env(safe-area-inset-bottom) + 16vh)}#final{font-size:min(14vw,22vh,100px)}}
</style>
</head>
<body>
<canvas id="c" aria-label="Void Runner game"></canvas>
<div id="hud" class="layer off" aria-hidden="true"><span id="score">0</span>
  <div id="combo"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="25" fill="rgba(2,2,7,.65)" stroke="rgba(255,255,255,.16)" stroke-width="4"/><circle id="ringfg" cx="29" cy="29" r="25" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="157.08" stroke-dashoffset="0" transform="rotate(-90 29 29)"/></svg><b id="mult">×2</b></div></div>
<div id="dim" class="layer"></div>
<div id="title" class="screen on">
  <h1><span class="v">Void</span><span class="r">Runner</span></h1>
  <div class="sub" id="titleBest"></div>
  <div class="go" id="titleGo">Tap to run</div>
  <button class="btn" id="dailyBtn" type="button">Daily run<small id="dailySub">Same course for all</small></button>
</div>
<div id="over" class="screen">
  <div class="tag" id="tag">New best</div>
  <div id="final">0</div>
  <div id="stats"><span id="sM">0<i>m</i></span><span id="sO">0<i>orbs</i></span><span id="sC">0<i>close</i></span></div>
  <div id="best"></div>
  <div class="go wait" id="overGo">Tap to run again</div>
  <button class="btn" id="menuBtn" type="button">Menu</button>
</div>
<div id="paused" class="screen"><h2>Paused</h2><div class="go" style="bottom:calc(env(safe-area-inset-bottom) + 21vh)">Tap to continue</div></div>
<button class="btn" id="snd" type="button" aria-label="Sound"><svg viewBox="0 0 24 24"><path class="w" d="M4 9v6h4l5 4V5L8 9H4zM17 8.5a5 5 0 0 1 0 7"/><path class="x" d="M4 9v6h4l5 4V5L8 9H4zM17 9l5 6M22 9l-5 6"/></svg></button>
<script id="core">
/* Void Runner core: DOM-free rules. A seed deals the same run to everyone. */
var VR = (function () {
  'use strict';
  // ---- physics (world units: the runner is 1.0 tall, ground is y = 0) ----
  var STEP = 1 / 120;
  var G_UP = 50, G_DOWN = 80, JUMP_V = 17.5, JUMP2_V = 15, DIVE_V = -30;
  var SLIDE_T = 0.65, STAND_H = 1.0, SLIDE_H = 0.5, HW = 0.26;
  var BEAM_Y = 0.62, WALL_H = 3.4, BLOCK_H = 1.0;
  var COYOTE = 0.08, BUFFER = 0.14, FALL_DEATH = -2.4;
  var CHAIN_T = 3.0, ORB_PTS = 10, SHAVE_PTS = 30, MULT_MAX = 8;
  var INSET = 0.08;                       // hazards are a hair smaller than they look

  function mulberry(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashString(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // speed climbs with distance, so a good run is always a fast one
  function speedAt(x) { return 9 + 9 * (1 - Math.exp(-Math.max(0, x) / 1100)); }

  // numbers measured from the physics themselves, so the generator can never promise what a jump cannot do
  var AIR = (function () {
    var y = 0, vy = JUMP_V, t = 0, above = 0, peak = 0, dt = 1 / 2000;
    while (y >= 0) {
      vy -= (vy > 0 ? G_UP : G_DOWN) * dt; y += vy * dt; t += dt;
      if (y > BLOCK_H) above += dt;
      if (y > peak) peak = y;
    }
    return { T1: t, aboveBlock: above, peak: peak };
  })();

  // ---- state ----
  function create(seed, opts) {
    opts = opts || {};
    var s = {
      seed: seed >>> 0, rnd: mulberry(seed), opts: opts,
      t: 0, x: 0, y: 0, vy: 0, grounded: true, jumps: 0, coyote: 0, buffered: 0,
      slide: 0, dive: false, jumpPressed: 0,
      segs: [], hz: [], orbs: [], hzIdx: 0, orbIdx: 0,
      dead: null, deathX: 0,
      pts: 0, orbsGot: 0, shaves: 0, chain: 0, chainT: 0, bestChain: 0,
      events: [], acc: 0, queue: [],
      gen: { c: 0, last: null, n: 0, teach: (opts.teach || []).slice(), empty: !!opts.empty },
      taught: {}
    };
    s.segs.push({ a: -40, b: 0 });
    extend(s, 60);
    return s;
  }

  function speed(s) {
    var ramp = Math.min(1, 0.62 + 0.38 * (s.t / 0.8));
    return speedAt(s.x) * ramp;
  }
  function mult(s) { return Math.min(MULT_MAX, 1 + Math.floor(s.chain / 5)); }
  function score(s) { return Math.floor(s.x) + s.pts; }

  // ---- generator ----
  function cover(s, upTo) {
    var seg = s.segs[s.segs.length - 1];
    if (seg.b < upTo) seg.b = upTo;
  }
  function rr(s, a, b) { return a + (b - a) * s.rnd(); }
  var JUMPY = { block: 1, gap: 1, wall: 1 };

  // earliest start of the next hazard, measured from where the last one starts (a) and ends (b)
  function minStart(prev, kind, v) {
    if (!prev) return 0;
    var a = prev.a, b = prev.b, t, extra = kind === 'wall' ? 0.62 : 0;   // a wall needs its run-up on the ground
    if (JUMPY[prev.k]) t = JUMPY[kind] ? (prev.k === 'wall' ? 1.45 : AIR.T1 + 0.2) + extra : (prev.k === 'wall' ? 1.15 : 0.68);
    else t = JUMPY[kind] ? 0.5 + extra : 0.25;
    return Math.max(a + v * t, b + v * (0.15 + extra));
  }

  function arc(s, x0, v, n, lift) {
    // orbs laid along the single jump that starts at x0, so a good jump collects them
    var T = AIR.T1;
    for (var i = 1; i <= n; i++) {
      var tt = T * i / (n + 1), y = 0, vy = JUMP_V, t = 0, dt = 1 / 600;
      while (t < tt) { vy -= (vy > 0 ? G_UP : G_DOWN) * dt; y += vy * dt; t += dt; }
      s.orbs.push({ x: x0 + v * tt, y: 0.55 + y * (lift || 1), got: false });
    }
  }
  function row(s, x0, n, gapx, y) {
    for (var i = 0; i < n; i++) s.orbs.push({ x: x0 + i * gapx, y: y, got: false });
  }

  function addHazard(s, h) {
    s.hz.push(h); s.gen.last = h;
  }

  function lead(s, d) {      // extra slack, in seconds, on top of the fair minimum
    var l = Math.max(0.06, 0.85 - d / 1700);
    return l * (0.3 + 0.9 * s.rnd());
  }

  function pick(s, d) {
    var r = s.rnd(), pool = [];
    pool.push('block', 'block');
    if (d > 45) pool.push('gap', 'gap');
    if (d > 110) pool.push('beam', 'beam');
    if (d > 260) pool.push('wall');
    if (d > 520) pool.push('beam', 'gap', 'block');
    var k = pool[Math.floor(r * pool.length)];
    var last = s.gen.last;
    if (last && last.k === k && s.rnd() < 0.5) k = pool[Math.floor(s.rnd() * pool.length)];
    return k;
  }

  function extend(s, upTo) {
    var g = s.gen;
    while (g.c < upTo) {
      var d = g.c, v = speedAt(d + 45), kind, hint = false, w, a, vw;
      if (g.empty) {
        row(s, g.c + 2, 5, 1.2, 0.5);
        g.c += 12; cover(s, g.c); continue;
      }
      if (g.teach.length) { kind = g.teach.shift(); hint = true; }
      else if (d < 22) { g.c = 22; cover(s, g.c); continue; }
      else kind = pick(s, d);
      var lt = hint ? 1.9 : lead(s, d);
      var start = Math.max(minStart(g.last, kind, v) + v * lt, g.c + 6);
      if (!g.last && !hint) start = Math.max(start, 26);
      if (hint && !g.last) start = Math.max(start, 24);
      a = start; vw = speedAt(a);
      var T1 = AIR.T1;
      if (kind === 'block') {
        var wmax = Math.min(1.6 + d / 600, 0.5 * vw * AIR.aboveBlock - 0.7);
        w = hint ? 1.0 : rr(s, 0.9, Math.max(1, wmax));
        cover(s, a + w + 4);
        addHazard(s, { k: 'block', a: a, b: a + w, h: BLOCK_H, hint: hint, min: 9 });
        arc(s, a - v * 0.2, v, 5, 1);
        g.c = a + w + 4;
      } else if (kind === 'gap') {
        var gmax = Math.min(6.4, 0.6 * vw * T1);
        w = hint ? 2.4 : rr(s, 2.2, Math.max(2.4, gmax));
        cover(s, a);
        addHazard(s, { k: 'gap', a: a, b: a + w, hint: hint, min: 9 });
        s.segs.push({ a: a + w, b: a + w + 4 });
        arc(s, a - v * 0.04, v, 5, 1);
        g.c = a + w + 4;
      } else if (kind === 'beam') {
        var Lmax = Math.min(5.5, 0.55 * vw * SLIDE_T);
        w = hint ? 3.2 : rr(s, 2.6, Math.max(2.8, Lmax));
        cover(s, a + w + 4);
        addHazard(s, { k: 'beam', a: a, b: a + w, hint: hint, min: 9 });
        row(s, a + 0.3, Math.max(2, Math.floor((w - 0.2) / 0.9)), 0.9, 0.34);
        g.c = a + w + 4;
      } else {
        w = hint ? 1.1 : rr(s, 0.9, 1.3);
        cover(s, a + w + 4);
        addHazard(s, { k: 'wall', a: a, b: a + w, h: WALL_H, hint: hint, min: 9 });
        // orbs on a double-jump line above the wall
        row(s, a - 0.4, 4, 0.55, 2.2);
        row(s, a + w + 0.1, 4, 0.55, 4.0);
        g.c = a + w + 4;
      }
      g.n++;
      // free-running orb lines in the open stretch before the next thing
      if (s.rnd() < 0.55) {
        var gapStart = a - v * 1.2;
        if (gapStart > 8 && g.n > 1) row(s, gapStart - 4, 4, 1.1, 0.5);
      }
    }
  }

  // ---- input ----
  function press(s, what) { if (!s.dead) s.queue.push(what); }

  function doJump(s, ev) {
    if (s.grounded || s.coyote > 0) {
      s.vy = JUMP_V; s.grounded = false; s.coyote = 0; s.jumps = 1; s.slide = 0; s.jumpPressed = 0;
      ev.push({ t: 'jump', x: s.x });
      return true;
    }
    if (s.jumps === 1) {
      if (s.y < 0.6 && s.vy < 0) { s.buffered = BUFFER; return true; }     // a tap just before landing
      s.vy = JUMP2_V; s.jumps = 2; ev.push({ t: 'djump', x: s.x, y: s.y });
      return true;
    }
    if (s.jumps === 2 && s.y < 0.9 && s.vy < 0) { s.buffered = BUFFER; return true; }
    return false;
  }
  function doSlide(s, ev) {
    if (s.grounded) { s.slide = SLIDE_T; ev.push({ t: 'slide', x: s.x }); }
    else if (!s.dive) { s.dive = true; if (s.vy > DIVE_V) s.vy = DIVE_V; ev.push({ t: 'dive', x: s.x, y: s.y }); }
  }

  function supported(s) {
    for (var i = 0; i < s.segs.length; i++) {
      var q = s.segs[i];
      if (s.x + 0.2 > q.a && s.x - 0.2 < q.b) return true;
    }
    return false;
  }

  function die(s, kind, ev) { s.dead = kind; s.deathX = s.x; ev.push({ t: 'die', kind: kind, x: s.x, y: s.y }); }
  function bump(s, n, ev, kind) {
    s.chain += n; s.chainT = CHAIN_T;
    if (s.chain > s.bestChain) s.bestChain = s.chain;
  }

  function height(s) { return s.slide > 0 ? SLIDE_H : STAND_H; }

  function sub(s, dt, ev) {
    s.t += dt;
    var v = speed(s);
    var prevX = s.x, wasGrounded = s.grounded;
    s.x += v * dt;
    // actions queued by the player
    // (handled in step before substeps)
    if (s.slide > 0) s.slide = Math.max(0, s.slide - dt);
    if (s.buffered > 0) s.buffered -= dt;
    if (s.coyote > 0) s.coyote -= dt;
    s.jumpPressed += 0;

    // vertical
    if (!s.grounded) {
      var gr = s.vy > 0 ? G_UP : G_DOWN;
      var oy = s.y;
      s.vy -= gr * dt; s.y += s.vy * dt;
      if (s.y <= 0 && s.vy <= 0 && oy >= 0 && supported(s)) {
        var impact = -s.vy;
        s.y = 0; s.vy = 0; s.grounded = true; s.jumps = 0; s.dive = false;
        ev.push({ t: 'land', x: s.x, impact: impact });
        // gap landing close to the far edge: a close call
        for (var i = 0; i < s.hz.length; i++) {
          var h = s.hz[i];
          if (h.k === 'gap' && h.flown && !h.done && s.x > h.b - 0.3 && s.x - h.b < 0.65) {
            h.done = true; h.shave = true; ev.push({ t: 'shave', x: s.x, y: 0, kind: 'gap' });
          }
        }
        if (s.diveQueued || s.dive) {}
        if (s.wantSlide) { s.slide = SLIDE_T; s.wantSlide = false; ev.push({ t: 'slide', x: s.x }); }
        if (s.buffered > 0) { s.buffered = 0; doJump(s, ev); }
      }
      if (s.y < FALL_DEATH) { die(s, 'fall', ev); return; }
    } else {
      if (!supported(s)) { s.grounded = false; s.coyote = COYOTE; s.jumps = 1; s.vy = 0; }
    }
    if (s.dive && !s.grounded) s.wantSlide = true;
    if (s.grounded) s.dive = false;

    // hazards
    var hh = height(s), L = s.x - HW, R = s.x + HW, bottom = s.y, top = s.y + hh;
    for (var j = s.hzIdx; j < s.hz.length; j++) {
      var z = s.hz[j];
      if (z.a - HW > s.x + 2) break;
      var ia = z.a + INSET, ib = z.b - INSET;
      if (z.k === 'gap') {
        if (R > z.a + 0.25 && L < z.b - 0.25 && !s.grounded) z.flown = true;
        if (L > z.b + 0.1 && !z.passed) { z.passed = true; if (!z.cleared) { z.cleared = 1; ev.push({ t: 'cleared', k: 'gap', hint: z.hint, x: s.x }); } }
        continue;
      }
      var overlap = R > ia && L < ib;
      if (z.k === 'block' || z.k === 'wall') {
        if (overlap) {
          var clear = bottom - z.h;
          if (clear < z.min) z.min = clear;
          if (clear < -0.05) { die(s, z.k, ev); return; }
        }
        if (L > ib && !z.passed) {
          z.passed = true;
          if (z.min < (z.k === 'block' ? 0.3 : 0.45)) { z.shave = true; ev.push({ t: 'shave', x: s.x, y: s.y, kind: z.k }); }
          if (!z.cleared) { z.cleared = 1; ev.push({ t: 'cleared', k: z.k, hint: z.hint, x: s.x }); }
        }
      } else if (z.k === 'beam') {
        if (overlap) {
          if (top > BEAM_Y - 0.04) { die(s, 'beam', ev); return; }
          z.rem = s.slide;
        }
        if (L > ib && !z.passed) {
          z.passed = true;
          if (z.rem !== undefined && z.rem < 0.1) { z.shave = true; ev.push({ t: 'shave', x: s.x, y: 0, kind: 'beam' }); }
          if (!z.cleared) { z.cleared = 1; ev.push({ t: 'cleared', k: 'beam', hint: z.hint, x: s.x }); }
        }
      }
    }
    while (s.hzIdx < s.hz.length && s.hz[s.hzIdx].passed && s.hz[s.hzIdx].b < s.x - 30) s.hzIdx++;

    // orbs
    for (var k = s.orbIdx; k < s.orbs.length; k++) {
      var o = s.orbs[k];
