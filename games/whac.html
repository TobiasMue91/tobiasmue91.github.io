<!doctype html>
<html lang="en">
<head>

<title>Prickle Patch — Whac-a-Hedgehog at Sunset</title>
<meta name="description" content="Whac-a-mole with hedgehogs, printed like a garden linocut: boop every hedgehog on the nose before it curls up, never touch a wasp, and keep a streak going until the sun sets behind the hedge.">

<style>
:root{--paper:#f3e9d3;--ink:#1d1813;--rust:#c9412d;--mari:#e07a3a;--sky:150px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#24402a;overflow:hidden;overscroll-behavior:none}
body{font-family:Fraunces,Georgia,serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;
  font-variation-settings:'SOFT' 50,'opsz' 72;font-variant-numeric:lining-nums tabular-nums}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .5s ease-out}
body.ready #cv{opacity:1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* a garden tag: cut card with a notched end, printed in ink */
.tag{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:4px 9px 9px 4px;
  clip-path:polygon(0 50%,14px 0,100% 0,100% 100%,14px 100%);padding:4px 14px 4px 22px;box-shadow:3px 3px 0 rgba(29,24,19,.35)}
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .4s ease-out}

#scoreTag{transform:rotate(-1.5deg);min-width:96px}
#score{display:block;font-size:clamp(26px,3.6vw,40px);font-weight:900;line-height:1.05;font-variation-settings:'SOFT' 50,'WONK' 1,'opsz' 72}
#streakTag{display:flex;align-items:center;gap:8px;transform:rotate(1.5deg);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
#mult{font-size:clamp(22px,3vw,32px);font-weight:900;line-height:1.05;min-width:1.6em;font-variation-settings:'SOFT' 50,'WONK' 1,'opsz' 72}
#pips{display:flex;gap:3px}
#pips i{display:block;width:clamp(24px,2.6vw,32px);height:clamp(24px,2.6vw,32px);transition:transform .18s cubic-bezier(.3,1.8,.5,1)}
#pips svg{display:block;width:100%;height:100%}
#pips .petals{fill:var(--paper);transition:fill .12s}#pips .heart{fill:var(--paper);transition:fill .12s}
#pips i.on{transform:scale(1.12) rotate(18deg)}#pips i.on .petals{fill:var(--mari)}#pips i.on .heart{fill:#8a3a22}
#streakTag.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
#streakTag.lose #pips{animation:lose .4s ease-out}#streakTag.lose #pips i{animation:wilt .4s ease-out}
@keyframes wilt{0%{transform:scale(1.12) rotate(18deg)}40%{transform:scale(.7) rotate(-30deg)}100%{transform:none}}
#streakTag.max{background:#f6cf6a}
@keyframes bump{0%{transform:rotate(1.5deg) scale(1)}30%{transform:rotate(-3deg) scale(1.18)}100%{transform:rotate(1.5deg) scale(1)}}
@keyframes lose{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{transform:none}}

/* the tags sit at our feet, under the burrows, so the sky stays clear for the sun */

#title .sub{font-size:clamp(14px,2.2vw,18px);font-weight:600;font-style:italic;margin-top:2px;text-align:center}

#titleBest b{font-weight:900}

#resScore{display:block;font-size:clamp(52px,14vw,72px);font-weight:900;line-height:1;margin:2px 0 4px;font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144}
#resStamp{position:absolute;right:14px;top:16px;transform:rotate(12deg);border:3px solid var(--rust);color:var(--rust);border-radius:6px;padding:2px 8px;font-weight:900;font-size:15px;
  letter-spacing:.06em;text-transform:uppercase;animation:stamp .4s .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(12deg) scale(2)}to{opacity:1;transform:rotate(12deg) scale(1)}}
#resRank{font-size:22px;font-weight:900;font-style:italic;color:var(--rust)}
#resNext,#resBest{font-size:14px;font-weight:600;min-height:1.2em}
.stats{display:flex;justify-content:center;gap:18px;margin:12px 0 14px;padding:10px 0;border-top:2px dashed rgba(29,24,19,.5);border-bottom:2px dashed rgba(29,24,19,.5)}

#again{border:3px solid var(--ink);background:var(--mari);border-radius:6px 12px 12px 6px;padding:10px 34px 12px 40px;font-size:24px;font-weight:900;
  clip-path:polygon(0 50%,18px 0,100% 0,100% 100%,18px 100%);box-shadow:3px 3px 0 rgba(29,24,19,.4);transition:transform .12s}

.foot{margin-top:10px;font-size:12px;font-weight:600;opacity:.75}.foot a{color:inherit}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

<script id="core">
// Prickle Patch - the rules. No DOM, no clock of its own: the page calls step(dt) and tap(hole).
// One round is one evening: ROUND seconds of sun. Hedgehogs come up out of nine burrows; boop them
// before they tuck in and drop away. Wasps come up too; touching one is a sting, and costs sun.
const PrickleCore = (() => {
    const ROUND = 45;          // seconds of evening
    const STING_COST = 4;      // a sting burns this much sun
    const APPLE_GIFT = 2;      // an apple gives this much back
    const PIPS = 5, MAX_MULT = 5;
    const RISE = 0.14, TUCK = 0.16, SINK = 0.2, DROP = 0.26, GRACE = 0.1;
    const RANKS = [[0, 'Seedling'], [3000, 'Weeder'], [8000, 'Gardener'], [16000, 'Head Gardener'], [28000, 'Hedgehog Whisperer']];
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

    function rng(seed) {
        let a = seed >>> 0 || 1;
        return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    // how far into the evening: the sun's own position, so a sting brings night on faster and an
    // apple holds it back
    const dusk = s => clamp(1 - s.left / ROUND, 0, 1);

    function create(opt = {}) {
        return {
            seed: opt.seed >>> 0 || 1, rand: rng(opt.seed || 1), tutorial: !!opt.tutorial,
            t: 0, left: ROUND, over: false,
            score: 0, streak: 0, bestStreak: 0, mult: 1, pips: 0,
            boops: 0, misses: 0, stings: 0, apples: 0, spawned: 0, wasps: 0,
            holes: new Array(9).fill(null), nextId: 1,
            nextSpawn: opt.tutorial ? 0.05 : 0.3, lastApple: 0, recent: [], firstWasp: false
        };
    }

    // ---- the tempo of the evening, d = 0 at golden hour, 1 at dark
    const tempo = {
        warn: d => lerp(0.3, 0.17, d),                 // how long a burrow heaves before something comes up
        hogUp: d => lerp(1.25, 0.62, d),                // how long a hedgehog waits to be booped
        waspUp: d => lerp(1.7, 1.1, d),                 // how long a wasp hangs about
        gap: d => lerp(0.95, 0.4, Math.pow(d, 0.9)),    // time between arrivals
        cap: d => Math.min(4, 2 + Math.floor(d * 2.5)), // most burrows busy at once
        wasp: d => lerp(0.15, 0.3, d)                   // chance an arrival is a wasp
    };

    function busy(s) { return s.holes.filter(Boolean).length; }
    function pickHole(s) {
        const free = [];
        for (let i = 0; i < 9; i++) if (!s.holes[i]) free.push(i);
        if (!free.length) return -1;
        const fresh = free.filter(i => !s.recent.includes(i));
        const from = fresh.length ? fresh : free;
        return from[Math.floor(s.rand() * from.length)];
    }
    function spawn(s, ev) {
        const d = dusk(s), tut = s.tutorial && s.t < 12;
        const cap = tut ? 1 : tempo.cap(d);
        if (busy(s) >= cap) { s.nextSpawn = s.t + 0.12; return; }
        let kind = 'hog';
        if (tut) {
            // the first round teaches one thing at a time: three hedgehogs, then a wasp, alone
            if (s.spawned >= 3 && !s.firstWasp) kind = 'wasp';
        } else if (s.t > 6 && s.rand() < tempo.wasp(d) && !(d < 0.4 && s.holes.some(e => e && e.kind === 'wasp'))) kind = 'wasp';
        if (!s.tutorial && s.t > 6 && !s.firstWasp) kind = 'wasp';
        const hole = pickHole(s); if (hole < 0) { s.nextSpawn = s.t + 0.12; return; }
        const apple = kind === 'hog' && s.t > 10 && s.t - s.lastApple > 11 + s.rand() * 4;
        if (apple) s.lastApple = s.t;
        if (kind === 'wasp') { s.firstWasp = true; s.wasps++; }
        const warn = tempo.warn(d), up = kind === 'wasp' ? tempo.waspUp(d) : tut ? 1.7 : tempo.hogUp(d);
        const e = {id: s.nextId++, kind, apple, hole, phase: 'warn', t0: s.t, warn, up, upAt: 0};
        s.holes[hole] = e; s.spawned++;
        s.recent.push(hole); if (s.recent.length > 2) s.recent.shift();
        ev.push({type: 'warn', hole, kind, apple, id: e.id});
        s.nextSpawn = s.t + (tut ? 1.15 : tempo.gap(d) * (0.8 + s.rand() * 0.4));
    }
    function breakStreak(s, hard) {
        s.streak = 0; s.pips = 0;
        s.mult = hard ? 1 : Math.max(1, s.mult - 1);
    }
    // advance the evening by dt seconds; returns what happened, for the page to draw and play
    function step(s, dt) {
        const ev = [];
        if (s.over) { advance(s, dt, ev); return ev; }
        s.t += dt; s.left -= dt;
        if (s.left <= 0) {
            s.left = 0; s.over = true;
            for (const e of s.holes) if (e && e.phase !== 'sink' && e.phase !== 'drop' && e.phase !== 'flee') { e.phase = 'sink'; e.t0 = s.t; }
            ev.push({type: 'end'});
            return ev;
        }
        if (s.t >= s.nextSpawn) spawn(s, ev);
        advance(s, 0, ev);
        return ev;
    }
    function advance(s, dt, ev) {
        if (s.over) s.t += dt;
        for (let i = 0; i < 9; i++) {
            const e = s.holes[i]; if (!e) continue;
            const age = s.t - e.t0;
            if (e.phase === 'warn' && age >= e.warn) { e.phase = 'rise'; e.t0 += e.warn; ev.push({type: 'rise', hole: i, kind: e.kind, apple: e.apple}); }
            else if (e.phase === 'rise' && age >= RISE) { e.phase = 'up'; e.t0 += RISE; e.upAt = e.t0; }
            else if (e.phase === 'up' && age >= e.up) {
                e.phase = e.kind === 'hog' ? 'tuck' : 'sink'; e.t0 += e.up; e.tucked = e.kind === 'hog';
                if (e.kind === 'hog') { s.misses++; breakStreak(s, false); ev.push({type: 'escape', hole: i, apple: e.apple}); }
                else ev.push({type: 'leave', hole: i});
            }
            else if (e.phase === 'tuck' && age >= TUCK) { e.phase = 'sink'; e.t0 += TUCK; }
            else if ((e.phase === 'sink' && age >= SINK) || (e.phase === 'drop' && age >= DROP) || (e.phase === 'flee' && age >= DROP)) s.holes[i] = null;
        }
    }
    // a touch on burrow i. Returns the events it caused.
    function tap(s, i) {
        const ev = [];
        if (s.over || i < 0 || i > 8) return ev;
        const e = s.holes[i];
        if (!e || e.phase === 'warn' || e.phase === 'sink' || e.phase === 'drop' || e.phase === 'flee' || (e.phase === 'tuck' && s.t - e.t0 > GRACE)) {
            // thumping bare earth: nothing is hurt, but the hedgehogs hear it - the pips empty
            const had = s.pips; if (s.mult < MAX_MULT) s.pips = 0;
            ev.push({type: 'dud', hole: i, lost: had - s.pips}); return ev;
        }
        if (e.kind === 'wasp') {
            s.stings++; s.left = Math.max(0, s.left - STING_COST); breakStreak(s, true);
            e.phase = 'flee'; e.t0 = s.t;
            ev.push({type: 'sting', hole: i, cost: STING_COST});
            return ev;
        }
        if (e.phase === 'tuck') { s.misses--; } // booped in the very last moment: the miss is taken back
        // a quick boop is worth more: full bonus inside a quarter second of the face appearing
        const react = e.phase === 'rise' ? 0 : s.t - e.upAt;
        const quick = Math.round(50 * clamp(1 - (react - 0.25) / 0.5, 0, 1));
        const base = e.apple ? 250 : 100, pts = base * s.mult + quick;
        s.score += pts; s.boops++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak);
        let up = false;
        if (s.mult < MAX_MULT) { s.pips++; if (s.pips >= PIPS) { s.pips = 0; s.mult++; up = true; } } else s.pips = PIPS;
        e.phase = 'drop'; e.t0 = s.t;
        ev.push({type: 'boop', hole: i, pts, quick, apple: e.apple, mult: s.mult, streak: s.streak});
        if (up) ev.push({type: 'mult', mult: s.mult});
        if (e.apple) { s.apples++; const before = s.left; s.left = Math.min(ROUND, s.left + APPLE_GIFT); ev.push({type: 'apple', hole: i, gift: s.left - before}); }
        return ev;
    }
    function rank(score) { let r = RANKS[0]; for (const k of RANKS) if (score >= k[0]) r = k; return r[1]; }
    function nextRank(score) { for (const k of RANKS) if (score < k[0]) return k; return null; }
    return {ROUND, STING_COST, APPLE_GIFT, PIPS, MAX_MULT, RISE, TUCK, SINK, DROP, GRACE, RANKS, tempo, dusk, create, step, tap, rank, nextRank, rng};
})();
</script>
<script>
// Prickle Patch - the print. Everything is drawn as a garden linocut: a few inks on paper, a key
// block whose lines swell and thin like carved lines do, and gouges cut out of the ink.
// Sprites are printed once per size and per ink run (dusk, night) and then only placed.
const Art = (() => {
    const TAU = Math.PI * 2;
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    const hexc = {};
    const hex = h => hexc[h] || (hexc[h] = (n => [n >> 16 & 255, n >> 8 & 255, n & 255])(parseInt(h.slice(1), 16)));
    const mix = (a, b, t) => { const A = hex(a), B = hex(b); t = clamp(t, 0, 1); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); };
    const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
    const hash = n => { n = Math.floor(n * 1000) | 0; n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; };

    // Two print runs. Dusk: paper, key, ochre, rust, umber, green, leaf, slate (the shade).

    const INKS = {

            face: '#f4e3be', faceCut: '#d2a56c', blush: '#d9643f',

            bed: '#4a2c20', poppy: '#c9412d', mari: '#e07a3a', daisy: '#f3e9d3',
        },
        night: {
            paper: '#efe4cf', line: '#e9dfc8', ink: '#0d0f19', bands: ['#0f1433', '#171f4a', '#212c62', '#2e3b78'],
            skyHi: '#151a3f', skyLo: '#232c63', ray: '#2f3b7c', sun: '#f3e9d3',
            hedge: '#123327', hedgeLo: '#0b231b', nick: '#3f7a5c',
            lawn: '#1b5143', tick: '#2a6e5a', shade: '#0e1a2a',

        // the hedgehogs come up to see how you did
        resultsEl.classList.add('show'); const R = resultsEl.getBoundingClientRect(); resultsEl.classList.remove('show');
        const clear = L.holes.filter(h => h.x + h.rx < R.left - 4 || h.x - h.rx > R.right + 4 || h.y - h.r * 2.6 > R.bottom + 30 || h.y + h.ry < R.top - 40).map(h => h.i);
        const holes = clear.sort((a, b) => hash(a * 13 + core.seed) - hash(b * 13 + core.seed)).slice(0, 3);
        curtain = holes.map((h, k) => ({hole: h, t0: clock + 0.3 + k * 0.22, id: 100 + h}));
        resultsAt = clock;
        setMode('results');
        setTimeout(() => $('again').focus({preventScroll: true}), 50);
    }
    function pause() { if (mode === 'play') setMode('paused'); }
    function resume() { if (mode === 'paused') { setMode('play'); last = performance.now(); } }
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
    addEventListener('blur', pause);

    // ------------------------------------------------------------------ input
    function holeAt(x, y) {
        let best = -1, bd = 1.15;
        for (const h of L.holes) {
            const dx = (x - h.x) / (h.rx * 1.05), dy = (y - (h.y - h.r * 1.05)) / (h.r * 1.75), d = dx * dx + dy * dy;
            if (d < bd) { bd = d; best = h.i; }
        }
        return best;
    }
    function tapHole(i) {
        if (mode === 'title') {
            if (i === 4 && titleHog && titleHog.phase !== 'drop') {
                Sound.init(); Sound.boop(0, true);
                titleHog = {phase: 'drop', t0: clock};
                fx.push({type: 'burst', hole: 4, t0: clock});
                setTimeout(() => { if (mode === 'title') start(); }, 260);
            } else if (i >= 0) fx.push({type: 'dud', hole: i, t0: clock});
            return;
        }
        if (mode !== 'play' || i < 0) return;
        const before = core.streak; handle(C.tap(core, i), before);
    }
    addEventListener('pointerdown', e => {
        if (!ready) return;
        if (e.target.closest('button, a')) return;
        if (mode === 'paused') { resume(); return; }
        if (mode === 'results') return;
        e.preventDefault();
        tapHole(holeAt(e.clientX, e.clientY));
    }, {passive: false});
    const KEYMAP = {Numpad7: 0, Numpad8: 1, Numpad9: 2, Numpad4: 3, Numpad5: 4, Numpad6: 5, Numpad1: 6, Numpad2: 7, Numpad3: 8,
        KeyQ: 0, KeyW: 1, KeyE: 2, KeyA: 3, KeyS: 4, KeyD: 5, KeyZ: 6, KeyX: 7, KeyC: 8};
    addEventListener('keydown', e => {
        if (!ready || e.repeat) return;
        if (e.code === 'KeyM') { toggleMute(); return; }
        if (mode === 'paused') { if (e.code !== 'Tab') { resume(); e.preventDefault(); } return; }
        if ((e.code === 'Escape' || e.code === 'KeyP') && mode === 'play') { pause(); return; }
        if (e.code === 'Space' || e.code === 'Enter') {
            if (mode === 'title') { e.preventDefault(); tapHole(4); return; }
            if (mode === 'results' && clock - resultsAt > 0.8) { e.preventDefault(); start(); return; }
        }
        if (e.code in KEYMAP) { e.preventDefault(); tapHole(KEYMAP[e.code]); }
    });
    $('again').addEventListener('click', () => { if (clock - resultsAt > 0.8) start(); });
    function toggleMute() { Sound.init(); Sound.setMuted(!Sound.muted); store.muted = Sound.muted; save(); $('mute').classList.toggle('off', Sound.muted); $('mute').setAttribute('aria-label', Sound.muted ? 'Sound on' : 'Sound off'); }
    $('mute').addEventListener('click', toggleMute);
    $('mute').classList.toggle('off', Sound.muted);

    // ------------------------------------------------------------------ what happened
    function beadFlash(p0, p1, kind) { // beads between two points of the evening light up or burn off
        const nb = Scene.beads(L), lo = Math.min(p0, p1), hi = Math.max(p0, p1);
        for (let q = 1; q <= nb; q++) { const pp = q / nb * 0.9; if (pp > lo && pp <= hi + 1e-6) flashes[q] = {t0: clock + (kind === 'gift' ? 0.45 : 0), kind}; }
    }
    // before: the streak as it stood before these events, so a break knows what it broke
    function handle(ev, before = 0) {
        const lostStreak = before;
        for (const e of ev) {
            const h = e.hole != null ? L.holes[e.hole] : null;
            switch (e.type) {
                case 'rise': Sound.rise(e.kind); break;
                case 'boop':
                    Sound.boop(e.streak - 1, e.quick >= 40);
                    fx.push({type: 'pop', hole: e.hole, t0: clock, text: '+' + e.pts, hot: e.quick >= 40});
                    scoreTo = core.score; showStreak(false);
                    if (navigator.vibrate) try { navigator.vibrate(8); } catch (x) {}
                    break;
                case 'mult': Sound.mult(e.mult); showStreak(true); break;
                case 'apple': {
                    Sound.apple();
                    const p0 = 1 - (core.left - e.gift) / C.ROUND, p1 = 1 - core.left / C.ROUND;
                    beadFlash(p0, p1, 'gift');
                    fx.push({type: 'apple', hole: e.hole, t0: clock, to: Scene.sunAt(L, Math.max(0, p1))});
                    fx.push({type: 'time', t0: clock + 0.45, text: '+' + Math.round(e.gift) + 's', hot: true});
                    break;
                }
                case 'escape': Sound.escape(); if (lostStreak >= 3) scatter(lostStreak); showStreak(false); emptyPips(); break;
                case 'sting': {
                    Sound.sting();
                    fx.push({type: 'ouch', hole: e.hole, t0: clock});
                    if (!RM.matches) { shakeAt = clock; shakeMag = 9; }
                    const p1 = 1 - core.left / C.ROUND; beadFlash(p1 - e.cost / C.ROUND, p1, 'burn');
                    fx.push({type: 'time', t0: clock, text: '−' + e.cost + 's', hot: false});
                    fx.push({type: 'pop', hole: e.hole, t0: clock + 0.05, text: '−' + e.cost + 's', hot: false});
                    if (lostStreak >= 3) scatter(lostStreak); showStreak(false); emptyPips();
                    if (navigator.vibrate) try { navigator.vibrate([40, 30, 40]); } catch (x) {}
                    break;
                }
                case 'dud': Sound.dud(); fx.push({type: 'dud', hole: e.hole, t0: clock}); if (e.lost > 0) { showStreak(false); emptyPips(); } break;
                case 'end': Sound.nightfall(); setMode('night'); break;
            }
        }
    }

    // ------------------------------------------------------------------ drawing
    function hogVis(e, t, reduced) {
        const age = t - e.t0, base = {kind: e.kind, apple: e.apple, variant: e.id % 3, face: 'idle', t};
        const blink = ((t * 0.7 + e.id * 0.37) % 3.1) < 0.12;
        base.look = Math.sin(t * 1.3 + e.id) * 0.8; base.sniff = Math.sin(t * 13 + e.id) > 0.3 ? 1 : 0;
        if (blink) base.face = 'blink';
        switch (e.phase) {
            case 'warn': return null;
            case 'rise': { const k = clamp(age / C.RISE, 0, 1); base.rise = reduced ? easeOut(k) : easeOutBack(k); return base; }
            case 'up': base.rise = 1; return base;
            case 'tuck': base.rise = 1; base.tuck = easeOut(clamp(age / C.TUCK, 0, 1)); return base;
            case 'sink': base.rise = 1 - easeIn(clamp(age / C.SINK, 0, 1)); if (e.tucked) base.tuck = 1; return base;
            case 'drop': {
                base.face = 'boop'; base.apple = false;
                base.squash = reduced ? 0.5 * (1 - clamp(age / 0.2, 0, 1)) : Math.max(0, 1 - age / 0.16);
                base.rise = 1 - easeIn(clamp((age - 0.07) / 0.19, 0, 1));
                base.burst = age / 0.32; return base;
            }
            case 'flee': base.rise = 1; base.flee = clamp(age / C.DROP, 0, 1); return base;
        }
        return null;
    }
    function draw() {
        const W = L.W, H = L.H, reduced = RM.matches;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const sa = clock - shakeAt, sm = sa < 0.4 ? shakeMag * Math.exp(-sa * 9) * Math.sin(sa * 70) : 0;
        if (sm) ctx.translate(sm, sm * 0.4);
        // the sun's place: eased, so a sting or an apple moves it, not teleports it
        const pTrue = core ? 1 - core.left / C.ROUND : 0;
        pShown += (pTrue - pShown) * Math.min(1, (Math.abs(pTrue - pShown) > 0.01 ? 0.12 : 1));
        for (const q in flashes) { const f = flashes[q]; f.k = clamp(1 - (clock - f.t0) / 0.7, 0, 1); if (clock - f.t0 > 0.7) delete flashes[q]; else if (clock < f.t0) f.k = 1; }
        Scene.sky(ctx, L, mode === 'title' ? 0 : pShown, night, flashes);
        Scene.ground(ctx, night);
        const t = core ? core.t : clock;
        for (const h of L.holes) {
            let o = null, lift = 0, shake = 0;
            const e = core && core.holes[h.i];
            if (e) {
                if (e.phase === 'warn') { const k = clamp((core.t - e.t0) / e.warn, 0, 1); lift = Math.sin(k * Math.PI * 0.5) * 0.9; shake = reduced ? 0 : Math.sin(core.t * 70 + h.i) * h.r * 0.05 * k; }
                o = hogVis(e, core.t, reduced);
            }
            if (mode === 'title' && h.i === 4 && titleHog) o = hogVis({...titleHog, kind: 'hog', id: 7, warn: 0}, clock, reduced);
            if ((mode === 'results' || mode === 'night') && !e) for (const c of curtain) if (c.hole === h.i && clock > c.t0) {
                const k = clamp((clock - c.t0) / C.RISE, 0, 1);
                o = hogVis({phase: k < 1 ? 'rise' : 'up', t0: c.t0, kind: 'hog', id: c.id}, clock, reduced);
            }
            if (o && !o.burst) { const b = fx.find(f => f.type === 'burst' && f.hole === h.i && clock - f.t0 < 0.35); if (b) o.burst = (clock - b.t0) / 0.32; }
            Scene.hole(ctx, h, o, night, lift, shake);
            if (lift > 0 && e) Scene.telegraph(ctx, h, clamp((core.t - e.t0) / e.warn, 0, 1), night);
        }
        // effects
        for (let i = fx.length - 1; i >= 0; i--) {
            const f = fx[i], age = clock - f.t0, h = f.hole != null ? L.holes[f.hole] : null;
            if (f.type === 'pop') { if (age < 0) continue; const k = age / 0.6; if (k >= 1) { fx.splice(i, 1); continue; } Scene.pop(ctx, h.x + h.r * 1.05 * (h.col === 2 ? -1 : 1), h.y - h.r * 2.05, f.text, k, Math.max(17, h.r * 0.4), f.hot); }
            else if (f.type === 'ouch') { const k = age / 0.38; if (k >= 1) { fx.splice(i, 1); continue; } Scene.ouch(ctx, h.x, h.y - h.r * 1.5, h.r * 1.1, k, night); }
            else if (f.type === 'dud') { const k = age / 0.3; if (k >= 1) { fx.splice(i, 1); continue; } Scene.dud(ctx, h, k, night); }
            else if (f.type === 'apple') {
                const k = age / 0.5; if (k >= 1) { fx.splice(i, 1); continue; }
                const x0 = h.x + h.r * 0.5, y0 = h.y - h.r * 1.9, e = easeOut(k), x = lerp(x0, f.to.x, e), y = lerp(y0, f.to.y, e) - Math.sin(k * Math.PI) * h.r * 1.5;
                Scene.flyingApple(ctx, x, y, lerp(1, 0.6, k), k * 6);
            }
            else if (f.type === 'burst' && age > 0.4) fx.splice(i, 1);
            else if (f.type === 'petal') {
                const k = age / 0.9; if (k >= 1) { fx.splice(i, 1); continue; }
                const x = f.x + f.vx * age, y = f.y + f.vy * age + 520 * age * age;
                ctx.save(); ctx.globalAlpha = 1 - k * k; ctx.translate(x, y); ctx.rotate(f.spin * age); ctx.scale(f.s, f.s);
                const pts = Art.ellipsePts(0, 0, 7, 4.5, 12, i, 0.05); Art.fill(ctx, pts, '#e07a3a'); Art.ink(ctx, pts, 1.6, Art.INKS.dusk.ink, i);
                ctx.restore();
            }
            else if (f.type === 'time') { // what a sting took or an apple gave, said at the sun
                if (age < 0) continue; const k = age / 0.9; if (k >= 1) { fx.splice(i, 1); continue; }
                const s = Scene.sunAt(L, pShown); Scene.pop(ctx, clamp(s.x, 50, W - 50), s.y + s.r * 1.9, f.text, k, Math.max(18, L.skyH * 0.13), f.hot);
            }
        }
        // the last few seconds count down on the hedge
        if (mode === 'play' && core.left <= 5 && core.left > 0) {
            const n = Math.ceil(core.left), k = n - core.left, s = Math.min(W * 0.3, L.skyH * 0.95) * (1 + (1 - Math.min(1, k * 5)) * 0.3);
            ctx.save(); ctx.globalAlpha = (k > 0.7 ? (1 - k) / 0.3 : 1) * 0.92;
            ctx.font = `900 ${Math.round(s)}px Fraunces, Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round'; ctx.lineWidth = s * 0.14; ctx.strokeStyle = Art.INKS.dusk.ink;
            const cx = W / 2, cy = L.skyH + (L.holes[3].y - L.skyH) * 0.42;
            ctx.strokeText(n, cx, cy); ctx.fillStyle = Art.INKS.dusk.paper; ctx.fillText(n, cx, cy);
            ctx.restore();
        }
        if (mode === 'title' && titleHog && titleHog.phase !== 'drop' && clock - titleHog.t0 > 0.6) {
            const h = L.holes[4]; Scene.hand(ctx, h.x + h.r * 0.12, h.y - h.r * 0.2, Math.max(0.8, h.r / 50), ((clock - titleHog.t0 - 0.6) * 0.8) % 1);
        }
        Scene.fireflies(ctx, L, clock, night);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1 - night * 0.6; Art.mottle(ctx, W, H); ctx.globalAlpha = 1;
    }
    let timeScale = 1;
    function frame(ts) {
        const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)) * timeScale; last = ts; clock += dt;
        if (mode === 'title' && titleHog && titleHog.phase === 'rise' && clock - titleHog.t0 > C.RISE) titleHog = {phase: 'up', t0: titleHog.t0 + C.RISE};
        if (mode === 'play') { const before = core.streak; handle(C.step(core, dt), before); }
        else if (mode === 'night') {
            C.step(core, dt);
            night = easeOut(clamp((clock - modeAt - 0.35) / 0.9, 0, 1));
            if (clock - modeAt > 1.5) finish();
        }
        if (mode === 'play') Sound.wasps(core.holes.filter(e => e && e.kind === 'wasp' && (e.phase === 'up' || e.phase === 'rise')).length);
        // the score tag counts up to what was earned
        if (scoreShown !== scoreTo) { scoreShown += (scoreTo - scoreShown) * Math.min(1, dt * 14); if (Math.abs(scoreTo - scoreShown) < 1) scoreShown = scoreTo; scoreEl.textContent = fmt(scoreShown); }
        if (core && mode === 'play') {
            // tick the last seconds on a woodblock
            const n = Math.ceil(core.left); if (n <= 5 && n !== frame.lastTick) { frame.lastTick = n; if (n > 0) Sound.tick(n === 1); }
        } else frame.lastTick = 99;
        draw();
        requestAnimationFrame(frame);
    }

    // ------------------------------------------------------------------ go
    resize();
    showTitle();
    const go = () => { ready = true; document.body.classList.add('ready'); last = performance.now(); requestAnimationFrame(frame); };
    (document.fonts && document.fonts.load ? Promise.race([document.fonts.load('900 40px Fraunces'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(go, go);
    // for the tests and the screenshot tools
    window.__pp = {get mode() { return mode; }, get core() { return core; }, get L() { return L; }, start, tap: tapHole, finish,
        set timeScale(v) { timeScale = v; },
        // put something in a burrow now (for filming and tests): kind 'hog' | 'wasp'
        spawn(hole, kind, apple = false, up = 1.2) { const c = core; c.holes[hole] = {id: c.nextId++, kind, apple, hole, phase: 'warn', t0: c.t, warn: 0.28, up, upAt: 0}; c.nextSpawn = c.t + 99; },
        hold(on) { core.nextSpawn = on ? core.t + 9999 : core.t; }};
})();
</script>
