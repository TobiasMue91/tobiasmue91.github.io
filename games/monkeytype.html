<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content">
<title>Monkeytype Clone</title>
<meta name="keywords" content="typing test, monkeytype, typing speed test, wpm test, words per minute, typing practice, touch typing">
<meta name="description" content="A typing test in the style of Monkeytype: type the words, see your WPM, accuracy and consistency with a graph of the run, and beat your personal best. Timed and word-count tests, punctuation and numbers, practice for the words you missed, and it works with a phone keyboard too.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
    :root {
        --bg: #323437; --main: #e2b714; --caret: #e2b714; --sub: #646669; --sub-alt: #2c2e31;
        --text: #d1d0c5; --error: #ca4754; --error-extra: #7e2a33;
        --font: 'Roboto Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        --size: 1.6rem;
    }
    @media (prefers-color-scheme: light) {
        :root {
            --bg: #e1e1e3; --main: #c79c00; --caret: #c79c00; --sub: #8f9399; --sub-alt: #d1d3d8;
            --text: #323437; --error: #da3333; --error-extra: #791717;
        }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        background: var(--bg); color: var(--text); font-family: var(--font);
        display: flex; flex-direction: column; min-height: 100%;
        -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--main); outline-offset: 3px; border-radius: 4px; }

    header {
        width: 100%; max-width: 1000px; margin: 0 auto; padding: 28px 24px 0;
        display: flex; align-items: center; gap: 16px; transition: opacity .25s;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; color: var(--text); text-decoration: none; }
    .brand b { font-size: 1.9rem; font-weight: 500; letter-spacing: -.02em; }
    .brand small { color: var(--sub); font-size: .8rem; }
    .brand b span { color: var(--main); }
    header .spacer { flex: 1; }
    .icon-btn { color: var(--sub); font-size: .8rem; padding: 6px 8px; border-radius: 6px; transition: color .15s; }
    .icon-btn:hover { color: var(--text); }
    .icon-btn.on { color: var(--main); }

    main {
        flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 24px;
        display: flex; flex-direction: column; justify-content: center;
    }
    #config {
        align-self: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
        background: var(--sub-alt); border-radius: 8px; padding: 4px 10px; margin: 24px 0 8px;
        font-size: .8rem; transition: opacity .25s;
    }
    #config .group { display: flex; align-items: center; }
    #config .sep { width: 4px; height: 18px; margin: 0 8px; border-radius: 2px; background: var(--bg); }
    #config button { color: var(--sub); padding: 8px 8px; transition: color .15s; white-space: nowrap; }
    #config button:hover { color: var(--text); }
    #config button.active { color: var(--main); }
    #config button[hidden] { display: none; }
    body.typing header, body.typing #config, body.typing #langBtn, body.typing footer { opacity: 0; pointer-events: none; }

    #test { position: relative; margin-top: 20px; }
    #topline { position: relative; display: flex; align-items: flex-end; height: 2.2rem; gap: 18px; }
    #counter { color: var(--main); font-size: 1.6rem; opacity: 0; transition: opacity .15s; }
    #liveWpm { color: var(--sub); font-size: 1rem; opacity: 0; transition: opacity .15s; padding-bottom: 3px; }
    body.typing #counter, body.typing #liveWpm { opacity: 1; }
    #langBtn { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); white-space: nowrap; color: var(--sub); font-size: .85rem; padding: 6px 10px; transition: color .15s, opacity .25s; }
    #langBtn:hover { color: var(--text); }
    #caps {
        position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
        background: var(--main); color: var(--bg); padding: 6px 12px; border-radius: 6px; font-size: .85rem;
        display: none; z-index: 3;
    }
    #caps.show { display: block; }

    #wordsWrap { position: relative; overflow: hidden; margin-top: 8px; font-size: var(--size); cursor: text; }
    #words {
        position: relative; display: flex; flex-wrap: wrap; align-content: flex-start;
        transition: transform .12s ease-out, filter .25s, opacity .25s;
        user-select: none; -webkit-user-select: none;
    }
    .word { margin: .25em .3em; height: 1.25em; line-height: 1.25em; color: var(--sub); white-space: nowrap; }
    .word span.c { color: var(--text); }
    .word span.i { color: var(--error); }
    .word span.x { color: var(--error-extra); }
    .word.err { text-decoration: underline; text-decoration-color: var(--error); text-underline-offset: .22em; text-decoration-thickness: 2px; }
    #caret {
        position: absolute; left: 0; top: 0; width: .1em; height: 1.25em; border-radius: .05em;
        background: var(--caret); transition: transform .1s ease-out; pointer-events: none;
    }
    #caret.blink { animation: blink 1s infinite; }
    @keyframes blink { 0%, 40% { opacity: 1 } 50%, 90% { opacity: 0 } 100% { opacity: 1 } }
    #wordsInput {
        position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; margin: 0;
        font-size: 16px; color: transparent; background: transparent; caret-color: transparent; z-index: 2;
        cursor: text; resize: none;
    }
    #focusHint {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 10px;
        color: var(--text); font-size: 1rem; z-index: 1; pointer-events: none; text-align: center; padding: 0 12px;
    }
    #test.blurred #words { filter: blur(4px); opacity: .35; }
    #test.blurred #caret { opacity: 0; }
    #test.blurred #focusHint { display: flex; }
    #restart {
        display: block; margin: 26px auto 0; color: var(--sub); font-size: 1.3rem; padding: 10px 22px; border-radius: 8px;
        transition: color .15s, background .15s;
    }
    #restart:hover { color: var(--text); background: var(--sub-alt); }

    /* result */
    #result { display: none; margin-top: 26px; }
    #result.show { display: block; animation: fadein .25s ease-out; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    .res-top { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: stretch; }
    .big { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 150px; }
    .stat .k { color: var(--sub); font-size: 1rem; display: flex; align-items: center; gap: 6px; }
    .stat .v { color: var(--main); font-size: 1.1rem; line-height: 1.1; }
    .big .v { font-size: 4rem; }
    .pb-crown { display: none; font-size: .8rem; background: var(--main); color: var(--bg); border-radius: 4px; padding: 1px 6px; }
    .pb-crown.show { display: inline-block; }
    #chartBox { position: relative; min-height: 190px; }
    #chart { position: absolute; inset: 0; width: 100%; height: 100%; }
    #legend { position: absolute; right: 12px; top: -2px; display: flex; gap: 14px; font-size: .7rem; color: var(--sub); }
    #legend span::before { content: ''; display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
    #legend .lw::before { background: var(--main); }
    #legend .lr::before { background: var(--sub); }
    #legend .le::before { content: '\00d7'; width: auto; height: auto; color: var(--error); font-weight: 700; background: none; }
    #tip {
        position: absolute; pointer-events: none; background: var(--sub-alt); color: var(--text); font-size: .75rem;
        padding: 6px 8px; border-radius: 6px; white-space: nowrap; display: none; z-index: 2; line-height: 1.5;
    }
    .res-row { display: flex; flex-wrap: wrap; gap: 14px 34px; margin-top: 18px; }
    .res-row .v { font-size: 1.6rem; }
    .res-row .v small { font-size: .9rem; color: var(--sub); }
    #note { color: var(--sub); font-size: .85rem; margin-top: 18px; min-height: 1.2em; }
    #note b { color: var(--text); font-weight: 400; }
    .res-btns { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .res-btns button { color: var(--sub); padding: 12px 18px; border-radius: 8px; font-size: .9rem; transition: color .15s, background .15s; }
    .res-btns button:hover { color: var(--text); background: var(--sub-alt); }
    .res-btns button[hidden] { display: none; }
    #missed { color: var(--sub); font-size: .85rem; text-align: center; margin-top: 10px; min-height: 1em; }
    #missed span { color: var(--error); }

    footer {
        width: 100%; max-width: 1000px; margin: 0 auto; padding: 18px 24px 22px; color: var(--sub); font-size: .75rem;
        display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; transition: opacity .25s;
    }
    footer kbd { background: var(--sub); color: var(--bg); border-radius: 3px; padding: 1px 5px; font-family: inherit; }
    footer a { color: var(--sub); }
    footer a:hover { color: var(--text); }
    .touch-only { display: none; }

    @media (max-width: 700px) {
        :root { --size: 1.3rem; }
        header { padding: 14px 16px 0; }
        .brand b { font-size: 1.35rem; }
        .brand small { display: none; }
        main { padding: 0 16px; justify-content: flex-start; }
        #config { margin: 14px 0 0; padding: 2px 4px; font-size: .75rem; }
        #config { gap: 0 2px; }
        #config .sep { display: none; }
        #config .group + .sep + .group { margin-left: 8px; }
        #config button { padding: 8px 6px; }
        #test { margin-top: 10px; }
        #counter { font-size: 1.3rem; }
        .res-top { grid-template-columns: 1fr; gap: 6px; }
        .big { flex-direction: row; gap: 34px; }
        .big .v { font-size: 3rem; }
        #chartBox { min-height: 170px; }
        .res-row { gap: 10px 22px; }
        .res-row .v { font-size: 1.25rem; }
        footer .keys { display: none; }
        .touch-only { display: inline; }
    }
    @media (max-width: 700px) and (max-height: 500px) {
        header { display: none; }
    }
</style>
</head>
<body>
<header>
    <a class="brand" href="https://monkeytype.com/" target="_blank" rel="noopener" title="the original: monkeytype.com">
        <b>monkey<span>type</span></b><small>clone</small>
    </a>
    <div class="spacer"></div>
    <button class="icon-btn" id="soundBtn" title="typing sounds" aria-pressed="false">sound off</button>
</header>

<main>
    <div id="config" role="toolbar" aria-label="test settings">
        <div class="group">
            <button data-toggle="punctuation" title="add capitals and punctuation">@ punctuation</button>
            <button data-toggle="numbers" title="mix in numbers"># numbers</button>
        </div>
        <div class="sep"></div>
        <div class="group">
            <button data-mode="time">time</button>
            <button data-mode="words">words</button>
        </div>
        <div class="sep"></div>
        <div class="group" id="amounts"></div>
    </div>

    <section id="test">
        <div id="topline"><span id="counter"></span><span id="liveWpm"></span><button id="langBtn" title="change word list">english</button></div>
        <div id="caps">Caps Lock</div>
        <div id="wordsWrap">
            <div id="words" aria-hidden="true"></div>
            <textarea id="wordsInput" rows="1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-gramm="false" aria-label="type the words"></textarea>
            <div id="focusHint"><span>click here or press any key to focus</span></div>
        </div>
        <button id="restart" title="restart test (tab)" aria-label="restart test">&#x21bb;</button>
    </section>

    <section id="result" aria-live="polite">
        <div class="res-top">
            <div class="big">
                <div class="stat"><div class="k">wpm <span class="pb-crown" id="pbCrown">new best</span></div><div class="v" id="rWpm">0</div></div>
                <div class="stat"><div class="k">acc</div><div class="v" id="rAcc">0%</div></div>
            </div>
            <div id="chartBox"><canvas id="chart"></canvas><div id="tip"></div>
                <div id="legend"><span class="lw">wpm</span><span class="lr">raw</span><span class="le">errors</span></div></div>
        </div>
        <div class="res-row">
            <div class="stat"><div class="k">test type</div><div class="v" id="rType" style="font-size:1rem;line-height:1.35"></div></div>
            <div class="stat" title="every character you typed, right or wrong"><div class="k">raw</div><div class="v" id="rRaw">0</div></div>
            <div class="stat" title="correct / incorrect / extra / missed"><div class="k">characters</div><div class="v" id="rChars">0</div></div>
            <div class="stat" title="how even your pace was, second to second"><div class="k">consistency</div><div class="v" id="rCons">0%</div></div>
            <div class="stat"><div class="k">time</div><div class="v" id="rTime">0s</div></div>
        </div>
        <div id="note"></div>
        <div id="missed"></div>
        <div class="res-btns">
            <button id="nextBtn" title="next test (tab or enter)">&#x276F; next test</button>
            <button id="repeatBtn" title="the same words again">&#x21BA; repeat</button>
            <button id="practiceBtn" title="a short test made of the words you got wrong">practice missed words</button>
            <button id="linkBtn" title="copy a link to these exact words">copy link</button>
        </div>
    </section>
</main>

<footer>
    <span class="keys"><kbd>tab</kbd> restart &nbsp; <kbd>esc</kbd> restart &nbsp; <kbd>enter</kbd> next test</span>
    <span class="touch-only">tap the words to type</span>
    <span>a small clone of <a href="https://monkeytype.com/" target="_blank" rel="noopener">monkeytype.com</a> - go and play the original</span>
</footer>

<script id="core">
// The typing test itself, with no DOM, so test/monkeytype.mjs can run it in Node.
//
// Input arrives the way a phone keyboard sends it: as the whole value of a text field, not as
// keys. The field holds a space followed by what has been typed of the current word; the page
// passes each new value to input() and puts back the value it returns. A deleted leading space
// is a backspace on an empty word, a space inside the value ends the word, and anything else is
// diffed against the word as it was - which covers desktop keys, autocorrect replacing a whole
// word, and dead keys and IMEs composing a letter in several steps.
//
// Scoring follows Monkeytype: wpm counts only the characters of correctly typed words and the
// spaces after them, raw counts everything typed, accuracy is correct keystrokes over all
// keystrokes, and consistency is how little the per-second raw speed varies.
const TypeCore = (() => {
    'use strict';
    const LISTS = {
        english: 'the be of and a to in he have it that for they with as not on she at by this we you do but from or which one would all will there say who make when can more if no man out other so what time up go about than into could state only new year some take come these know see use get like then first any work now may such give over think most even find day also after way many must look before great back through long where much should well people down own just because good each those feel seem how high too place little world very still nation hand old life tell write become here show house both between need mean call develop under last right move thing general school never same another begin while number part turn real leave might want point form off child few small since against ask late home interest large person end open public follow during present without again hold govern around possible head consider word program problem however lead system set order eye plan run keep face fact group play stand increase early course change help line city'.split(' '),
        english_1k: 'able about above accept across act action activity actually add address admit adult affect after again against age agency agent ago agree agreement ahead air all allow almost alone along already also although always among amount analysis and animal another answer any anyone anything appear apply approach area argue arm around arrive art article artist as ask assume at attack attention attorney audience author authority available avoid away baby back bad bag ball bank bar base be beat beautiful because become bed before begin behavior behind believe benefit best better between beyond big bill billion bit black blood blue board body book born both box boy break bring brother budget build building business but buy by call camera campaign can cancer candidate capital car card care career carry case catch cause cell center central century certain certainly chair challenge chance change character charge check child choice choose church citizen city civil claim class clear clearly close coach cold collection college color come commercial common community company compare computer concern condition conference congress consider consumer contain continue control cost could country couple course court cover create crime cultural culture cup current customer cut dark data daughter day dead deal death debate decade decide decision deep defense degree democrat describe design despite detail determine develop development die difference different difficult dinner direction director discover discuss discussion disease do doctor dog door down draw dream drive drop drug during each early east easy eat economic economy edge education effect effort eight either election else employee end energy enjoy enough enter entire environment especially establish even evening event ever every everybody everyone everything evidence exactly example executive exist expect experience expert explain eye face fact factor fail fall family far fast father fear federal feel feeling few field fight figure fill film final finally financial find fine finger finish fire firm first fish five floor fly focus follow food foot for force foreign forget form former forward four free friend from front full fund future game garden gas general generation get girl give glass go goal good government great green ground group grow growth guess gun guy hair half hand hang happen happy hard have he head health hear heart heat heavy help her here herself high him himself his history hit hold home hope hospital hot hotel hour house how however huge human hundred husband idea identify if image imagine impact important improve in include including increase indeed indicate individual industry information inside instead institution interest interesting international interview into investment involve issue it item its itself job join just keep key kid kill kind kitchen know knowledge land language large last late later laugh law lawyer lay lead leader learn least leave left leg legal less let letter level lie life light like likely line list listen little live local long look lose loss lot love low machine magazine main maintain major majority make man manage management manager many market marriage material matter may maybe me mean measure media medical meet meeting member memory mention message method middle might military million mind minute miss mission model modern moment money month more morning most mother mouth move movement movie much music must my myself name nation national natural nature near nearly necessary need network never new news newspaper next nice night no none nor north not note nothing notice now number occur of off offer office officer official often oh oil ok old on once one only onto open operation opportunity option or order organization other others our out outside over own owner page pain painting paper parent part participant particular particularly partner party pass past patient pattern pay peace people per perform performance perhaps period person personal phone physical pick picture piece place plan plant play player point police policy political politics poor popular population position positive possible power practice prepare present president pressure pretty prevent price private probably problem process produce product production professional professor program project property protect prove provide public pull purpose push put quality question quickly quite race radio raise range rate rather reach read ready real reality realize really reason receive recent recently recognize record red reduce reflect region relate relationship religious remain remember remove report represent require research resource respond response responsibility rest result return reveal rich right rise risk road rock role room rule run safe same save say scene school science scientist score sea season seat second section security see seek seem sell send senior sense series serious serve service set seven several shake share she shoot short shot should shoulder show side sign significant similar simple simply since sing single sister sit site situation six size skill skin small smile so social society soldier some somebody someone something sometimes son song soon sort sound source south southern space speak special specific speech spend sport spring staff stage stand standard star start state statement station stay step still stock stop store story strategy street strong structure student study stuff style subject success successful such suddenly suffer suggest summer support sure surface system table take talk task tax teach teacher team technology television tell ten tend term test than thank that the their them themselves then theory there these they thing think third this those though thought thousand threat three through throughout throw thus time to today together tonight too top total tough toward town trade traditional training travel treat treatment tree trial trip trouble true truth try turn two type under understand unit until up upon us use usually value various very victim view violence visit voice vote wait walk wall want war watch water way we weapon wear week weight well west western what whatever when where whether which while white who whole whom whose why wide wife will win wind window wish with within without woman wonder word work worker world worry would write writer wrong yard yeah year yes yet you young your yourself river mountain village winter island forest bridge ocean silver train horse bread cloud storm quiet gentle bright'.split(' ')
    };
    const LIST_NAMES = {english: 'english', english_1k: 'english 1k'};
    const AMOUNTS = {time: [15, 30, 60, 120], words: [10, 25, 50, 100]};
    const MAX_EXTRA = 20;          // letters typed past the end of a word
    const MIN_ACC = 75;            // below this a test is not counted as a personal best
    const AFK_SECS = 7;            // this long without a key and the test does not count either

    function hash(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
        return h;
    }
    function rng(seed) {
        let a = seed >>> 0;
        return () => {
            a = (a + 0x6D2B79F5) >>> 0;
            let t = a;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    function newSeed(r = Math.random) { return Math.floor(r() * 36 ** 6).toString(36).padStart(6, '0'); }

    function normalizeConfig(c) {
        c = c || {};
        const mode = c.mode === 'words' ? 'words' : 'time';
        const amount = AMOUNTS[mode].includes(+c.amount) ? +c.amount : (mode === 'time' ? 30 : 25);
        return {
            mode, amount,
            list: LISTS[c.list] ? c.list : 'english',
            punctuation: !!c.punctuation, numbers: !!c.numbers
        };
    }

    // An endless, reproducible stream of words for a seed and config. The same seed and config
    // always give the same words, so a test is a link.
    function wordSource(cfg, seed) {
        const r = rng(hash(String(seed)));
        const list = LISTS[cfg.list] || LISTS.english;
        let prev = '', prev2 = '', sentence = 0, cap = true;
        return () => {
            let w;
            do { w = list[Math.floor(r() * list.length)]; } while (w === prev || w === prev2);
            prev2 = prev; prev = w;
            if (cfg.numbers && r() < 0.12) {
                const digits = 1 + Math.floor(r() * 4);
                w = String(Math.floor(r() * 10 ** digits));
            }
            if (!cfg.punctuation) return w;
            if (cap) { w = w[0].toUpperCase() + w.slice(1); cap = false; }
            sentence++;
            const x = r();
            if (sentence >= 3 && x < 0.06 + sentence * 0.012) {
                const e = r();
                w += e < 0.8 ? '.' : e < 0.9 ? '?' : '!';
                cap = true; sentence = 0;
            } else if (x > 0.88) {
                const k = r();
                if (k < 0.6) w += ',';
                else if (k < 0.68) w += ';';
                else if (k < 0.76) w += ':';
                else if (k < 0.88) w = '"' + w + '"';
                else w = '(' + w + ')';
            }
            return w;
        };
    }

    // cfg is a normalized config; opts.seed picks the words, opts.words (practice) replaces them.
    function create(cfg, opts = {}) {
        cfg = normalizeConfig(cfg);
        const seed = opts.seed || newSeed();
        const custom = Array.isArray(opts.words) && opts.words.length ? opts.words.slice() : null;
        const t = {
            cfg, seed, custom,
            mode: custom ? 'words' : cfg.mode,
            amount: custom ? custom.length : cfg.amount,
            next: custom ? null : wordSource(cfg, seed),
            words: [], typed: [''], wi: 0,
            start: null, end: null, done: false,
            keys: 0, correctKeys: 0,
            secs: [],              // per second: {chars, errors}
            samples: [],           // per whole second: cumulative wpm
            wordErr: [],           // a word that ever took a wrong keystroke
            lastInput: null
        };
        if (custom) t.words = custom;
        fill(t);
        return t;
    }
    function fill(t) {
        if (t.custom) return;
        const want = t.mode === 'words' ? t.amount : t.wi + 60;
        while (t.words.length < want) t.words.push(t.next());
    }
    function sec(t, time) {
        let s = Math.floor((time - t.start) / 1000);
        if (t.mode === 'time') s = Math.min(s, t.amount - 1);
        s = Math.max(0, s);
        while (t.secs.length <= s) t.secs.push({chars: 0, errors: 0});
        return t.secs[s];
    }
    function key(t, ok, time) {
        t.keys++;
        const b = sec(t, time);
        b.chars++;

    // Characters that count toward wpm: every character of a correctly finished word and the

        const last = Math.min(t.wi, t.words.length - 1);

            const committed = i < t.wi || (t.done && t.mode === 'words' && i === t.words.length - 1);
            for (let k = 0; k < Math.max(typed.length, target.length); k++) {

            else if (target.startsWith(typed)) wpmChars += typed.length;

    // Record one cumulative-wpm sample for each whole second that has passed. Called before
    // anything changes, so each sample sees the state exactly as it was at that second.
    function flush(t, time) {
        if (t.start === null) return;

        while (t.samples.length < cap && time - t.start >= (t.samples.length + 1) * 1000) {

            if (t.done || sp < 0) break;
            space(t, time);
            if (t.done) break;
            s = s.slice(sp + 1);

        return ' ' + (t.typed[t.wi] || '');
    }

    function consistency(values) {
        if (values.length < 2) return 100;
        const mean = values.reduce((a, b) => a + b, 0) / values.length;
        if (mean === 0) return 0;
        const sd = Math.sqrt(values.reduce((a, b) => a + (b - mean) ** 2, 0) / values.length);
        const c = sd / mean;
        return 100 * (1 - Math.tanh(c + c ** 3 / 3 + c ** 5 / 5));
    }

    function result(t) {
        const ms = t.done ? t.end - t.start : 0;
        const c = counts(t);
        const wpm = perMin(c.wpmChars, ms), raw = perMin(c.rawChars, ms);
        const acc = t.keys ? t.correctKeys / t.keys * 100 : 0;
        // per second: cumulative wpm, raw burst, errors; the last second may be partial
        const graph = [], bursts = [];
        const secsTotal = ms / 1000;
        for (let i = 0; i < Math.ceil(secsTotal - 1e-9); i++) {
            const len = Math.min(1, secsTotal - i);
            const b = t.secs[i] || {chars: 0, errors: 0};
            const burst = b.chars / 5 * 60 / len;
            const w = i < t.samples.length ? t.samples[i] : wpm;
            graph.push({s: i + len, wpm: w, raw: burst, errors: b.errors});
            if (len >= 0.5 || i === 0) bursts.push(burst);
        }
        const missed = [];
        const lastWord = t.words.length - 1;
        for (let i = 0; i <= Math.min(t.wi, lastWord); i++) {
            const w = t.words[i];
            const committed = i < t.wi || (t.done && t.mode === 'words' && i === lastWord);
            if ((t.wordErr[i] || (committed && t.typed[i] !== w)) && !missed.includes(w)) missed.push(w);
        }
        // a stretch of AFK_SECS or more without a keystroke means nobody was typing
        let idle = 0, afk = false;
        for (let i = 0; i < Math.ceil(secsTotal - 1e-9); i++) {
            idle = (t.secs[i] && t.secs[i].chars) ? 0 : idle + 1;
            if (idle >= AFK_SECS) afk = true;
        }
        return {
            wpm, raw, acc, consistency: consistency(bursts), time: secsTotal,
            chars: {correct: c.correct, incorrect: c.incorrect, extra: c.extra, missed: c.missed},
            keys: t.keys, graph, missed, afk,
            valid: t.keys > 0 && acc >= MIN_ACC && !afk && !t.custom

    }
    function live(t, time) {
        if (t.start === null) return {wpm: 0, left: t.mode === 'time' ? t.amount : 0};
        const ms = Math.max(1, (t.done ? t.end : time) - t.start);

    // A word list to practise: the words missed, each three times, in a shuffled order.
    function practice(missed, seed) {

            left.set(filler.splice(Math.floor(r() * filler.length), 1)[0], 1);
        }
        const out = [];
        let total = [...left.values()].reduce((a, n) => a + n, 0);

            const prev = out[out.length - 1];
            // the word with the most copies left goes first when it must, so no two end up together
            const most = Math.max(...[...left.values()]);
            let pool = [...left.keys()].filter(w => w !== prev && left.get(w) > 0);
            const urgent = pool.filter(w => left.get(w) === most);
            if (most * 2 - 1 >= total && urgent.length) pool = urgent;
            if (!pool.length) pool = [...left.keys()].filter(w => left.get(w) > 0);
            const w = pool[Math.floor(r() * pool.length)];
            out.push(w); left.set(w, left.get(w) - 1); total--;
        }
        return out;
    }

    // Saved data: personal bests per test type, and recent results.
    function configKey(cfg) {
        cfg = normalizeConfig(cfg);
        return `${cfg.mode}-${cfg.amount}-${cfg.list}${cfg.punctuation ? '-p' : ''}${cfg.numbers ? '-n' : ''}`;
    }
    function loadStore(json) {
        let s;
        try { s = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { s = null; }
        const out = {v: 1, config: normalizeConfig(s && s.config), sound: !!(s && s.sound), pb: {}, history: []};
        if (s && typeof s.pb === 'object' && s.pb) {
            for (const k in s.pb) {
                const p = s.pb[k];
                if (p && isFinite(p.wpm) && isFinite(p.acc)) out.pb[k] = {wpm: +p.wpm, acc: +p.acc, raw: +p.raw || 0, consistency: +p.consistency || 0, date: p.date || 0};
            }
        }
        if (s && Array.isArray(s.history)) out.history = s.history.filter(h => h && typeof h.key === 'string' && isFinite(h.wpm)).slice(-200);

    }
    // Returns {pb, previous, average} and adds the result to the store if it counts.
    function record(store, cfg, res, date = Date.now()) {
        const k = configKey(cfg), prev = store.pb[k] || null;

        const entry = {wpm: res.wpm, acc: res.acc, raw: res.raw, consistency: res.consistency, date};
        store.history.push({key: k, ...entry});
        if (store.history.length > 200) store.history.splice(0, store.history.length - 200);
        const pb = !prev || res.wpm > prev.wpm;
        if (pb) store.pb[k] = entry;
        return {pb, previous: prev, counted: true, average: average(store, k)};
    }
    function average(store, k, n = 10) {
        const h = store.history.filter(x => x.key === k).slice(-n);
        return h.length ? {wpm: h.reduce((a, x) => a + x.wpm, 0) / h.length, n: h.length} : null;
    }

    return {LISTS, LIST_NAMES, AMOUNTS, MIN_ACC, rng, hash, newSeed, normalizeConfig, create, input, tick, result, live,
        counts, canGoBack, consistency, practice, configKey, loadStore, record, average};
})();

<script>
(() => {

    let cfg = store.config;
    let test = null, lastResult = null, practiceWords = null;

    // ------------------------------------------------------------ sound
    let actx = null, noise = null;
    function audio() {
        if (!store.sound) return null;
        if (!actx) {
            try {
                actx = new (window.AudioContext || window.webkitAudioContext)();
                noise = actx.createBuffer(1, actx.sampleRate * 0.05, actx.sampleRate);
                const d = noise.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
            } catch (e) { return null; }
        }
        if (actx.state === 'suspended') actx.resume();
        return actx;
    }

        const a = audio(); if (!a) return;
        const t = a.currentTime;
        const src = a.createBufferSource(); src.buffer = noise;
        src.playbackRate.value = 0.8 + Math.random() * 0.4;
        const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = ok ? 2600 + Math.random() * 900 : 900; f.Q.value = 1.4;
        const g = a.createGain(); g.gain.value = ok ? 0.5 : 0.7;

        o.frequency.exponentialRampToValueAtTime(ok ? 80 : 70, t + 0.04);

        notes.forEach((f, i) => {
            const t = a.currentTime + i * 0.09, o = a.createOscillator(), g = a.createGain();
            o.type = 'sine'; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);

    }
    function paintSound() {

        $('soundBtn').classList.toggle('on', store.sound);
        $('soundBtn').setAttribute('aria-pressed', store.sound);
    }
    $('soundBtn').addEventListener('click', () => { store.sound = !store.sound; save(); paintSound(); if (store.sound) click(true); focusInput(); });

    // ------------------------------------------------------------ config bar
    function paintConfig() {
        const practising = !!practiceWords;
        document.querySelectorAll('[data-toggle]').forEach(b => {
            b.classList.toggle('active', !practising && cfg[b.dataset.toggle]);
            b.setAttribute('aria-pressed', !!cfg[b.dataset.toggle]);
        });

        $('amounts').innerHTML = C.AMOUNTS[cfg.mode].map(n =>
            `<button data-amount="${n}" class="${!practising && cfg.amount === n ? 'active' : ''}">${n}</button>`).join('');
        $('langBtn').textContent = practising ? 'practice: missed words' : C.LIST_NAMES[cfg.list];
    }
    $('config').addEventListener('click', e => {

        if (b.dataset.toggle) cfg[b.dataset.toggle] = !cfg[b.dataset.toggle];

        store.config = cfg; save();
        newTest();
    });

    // ------------------------------------------------------------ rendering the words

    function wordHTML(i) {
        const target = test.words[i], typed = test.typed[i] || '';

        for (let k = 0; k < target.length; k++) {
            const cls = k < typed.length ? (typed[k] === target[k] ? 'c' : 'i') : '';
            h += cls ? `<span class="${cls}">${esc(target[k])}</span>` : `<span>${esc(target[k])}</span>`;

    function paintWord(i) {
        const el = wordsEl.children[i]; if (!el) return;
        el.innerHTML = wordHTML(i);
        el.classList.toggle('err', i < test.wi && test.typed[i] !== test.words[i]);
    }
    function appendWords() {

            const d = document.createElement('div');

            frag.appendChild(d);

            ? 'practice<br>missed words'
            : `${t.mode} ${t.amount}<br>${C.LIST_NAMES[cfg.list]}${cfg.punctuation ? '<br>punctuation' : ''}${cfg.numbers ? '<br>numbers' : ''}`;
        $('pbCrown').classList.toggle('show', rec.pb && !!rec.previous);

        let note = '';
        if (practiceWords) note = 'practice tests do not count toward your personal bests';
        else if (!r.keys) note = 'nothing typed';
        else if (r.afk) note = 'no typing for several seconds - this one does not count';
        else if (!rec.counted) note = `accuracy under ${C.MIN_ACC}% - this one does not count`;
        else if (rec.pb && rec.previous) note = `<b>new personal best</b> - up from ${Math.round(rec.previous.wpm)} wpm`;
        else if (rec.pb) note = `first ${t.mode} ${t.amount} test - that is your personal best to beat`;
        else note = `personal best <b>${Math.round(store.pb[C.configKey(cfg)].wpm)} wpm</b>`;
        if (rec.average && rec.average.n > 1) note += ` &nbsp;·&nbsp; average of your last ${rec.average.n}: <b>${Math.round(rec.average.wpm)} wpm</b>`;
        $('note').innerHTML = note;

        $('missed').innerHTML = r.missed.length
            ? 'missed: ' + r.missed.slice(0, 12).map(w => `<span>${w.replace(/[<>&]/g, '')}</span>`).join(' ') + (r.missed.length > 12 ? ' ...' : '')
            : '';
        $('practiceBtn').hidden = !r.missed.length;
        $('linkBtn').hidden = !!practiceWords;
        $('linkBtn').textContent = 'copy link';
        drawChart(r);
        chime(rec.pb && !!rec.previous);
        // keys still in flight from the last word must not start the next test
        resultAt = performance.now();
        if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    }

    function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    let chartPts = [];
    function drawChart(r) {
        const cv = $('chart'), box = $('chartBox');
        const dpr = window.devicePixelRatio || 1, W = box.clientWidth, H = box.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        const g = cv.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, W, H);
        const data = r.graph;
        chartPts = [];
        if (!data.length) return;
        const font = '11px ' + css('--font');
        const maxW = Math.max(10, ...data.map(d => Math.max(d.wpm, d.raw)));
        const top = Math.ceil(maxW * 1.1 / 20) * 20;
        const maxE = Math.max(1, ...data.map(d => d.errors));
        const L = 34, R = 12, T = 22, B = 22;
        const X = s => L + (data.length === 1 ? 0.5 : (s - data[0].s) / (data[data.length - 1].s - data[0].s)) * (W - L - R);
        const Y = v => T + (1 - v / top) * (H - T - B);
        const YE = v => T + (1 - v / maxE / 1.15) * (H - T - B);
        g.font = font; g.textBaseline = 'middle';
        g.strokeStyle = css('--sub-alt'); g.fillStyle = css('--sub'); g.lineWidth = 1;
        for (let k = 0; k <= 4; k++) {
            const v = top * k / 4, y = Math.round(Y(v)) + 0.5;
            g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke();
            g.textAlign = 'right'; g.fillText(Math.round(v), L - 6, y);
        }
        g.textAlign = 'center'; g.textBaseline = 'top';
        const every = Math.max(1, Math.ceil(data.length / ((W - L - R) / 36)));
        let lastX = -1e9;
        const lastLabel = X(data[data.length - 1].s);
        data.forEach((d, i) => {
            const x = X(d.s), end = i === data.length - 1;
            if ((i % every === 0 && lastLabel - x > 28) || end) { if (x - lastX > 24) g.fillText(Math.round(d.s), x, H - B + 6); lastX = x; }
        });
        const line = (key, color, width, dash) => {
            g.beginPath(); g.strokeStyle = color; g.lineWidth = width; g.setLineDash(dash || []); g.lineJoin = 'round';
            data.forEach((d, i) => { const x = X(d.s), y = Y(d[key]); i ? g.lineTo(x, y) : g.moveTo(x, y); });
            g.stroke(); g.setLineDash([]);
        };
        line('raw', css('--sub'), 2);
        line('wpm', css('--main'), 3);
        g.strokeStyle = css('--error'); g.lineWidth = 2;
        data.forEach(d => {
            if (!d.errors) return;
            const x = X(d.s), y = YE(d.errors), s = 4;
            g.beginPath(); g.moveTo(x - s, y - s); g.lineTo(x + s, y + s); g.moveTo(x + s, y - s); g.lineTo(x - s, y + s); g.stroke();
        });
        chartPts = data.map(d => ({x: X(d.s), d}));
    }
    function chartTip(e) {
        const tip = $('tip'), box = $('chartBox').getBoundingClientRect();
        if (!chartPts.length) return;
        const x = e.clientX - box.left;
        let best = chartPts[0];
        for (const p of chartPts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
        tip.innerHTML = `${best.d.s.toFixed(best.d.s % 1 ? 1 : 0)}s<br>wpm ${Math.round(best.d.wpm)}<br>raw ${Math.round(best.d.raw)}<br>errors ${best.d.errors}`;
        tip.style.display = 'block';
        const left = Math.min(Math.max(0, best.x + 10), box.width - tip.offsetWidth);
        tip.style.left = left + 'px'; tip.style.top = '4px';
    }
    $('chartBox').addEventListener('pointermove', chartTip);
    $('chartBox').addEventListener('pointerdown', chartTip);
    $('chartBox').addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });

    function next() { practiceWords = null; newTest(); }
    $('nextBtn').addEventListener('click', next);
    $('repeatBtn').addEventListener('click', () => newTest(test.seed, test.custom));
    $('practiceBtn').addEventListener('click', () => {
        practiceWords = C.practice(lastResult.missed, test.seed);
        newTest();
    });
    $('linkBtn').addEventListener('click', () => {
        const u = new URL(location.href);
        u.search = '';
        u.searchParams.set('seed', test.seed);
        u.searchParams.set('mode', cfg.mode);
        u.searchParams.set('n', cfg.amount);
        if (cfg.list !== 'english') u.searchParams.set('list', cfg.list);
        if (cfg.punctuation) u.searchParams.set('p', 1);
        if (cfg.numbers) u.searchParams.set('num', 1);
        const done = () => { $('linkBtn').textContent = 'link copied'; };
        try { navigator.clipboard.writeText(u.href).then(done, () => prompt('copy this link', u.href)); }
        catch (e) { prompt('copy this link', u.href); }
    });
    $('restart').addEventListener('click', () => newTest());

    // ------------------------------------------------------------ keys
    document.addEventListener('keydown', e => {
        if (e.getModifierState) $('caps').classList.toggle('show', e.getModifierState('CapsLock') && !resultEl.classList.contains('show'));
        const onResult = resultEl.classList.contains('show');
        if (onResult && performance.now() - resultAt < 350 && (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return; }
        if (e.key === 'Tab' || e.key === 'Escape') {
            e.preventDefault();
            if (onResult) next(); else newTest();
            return;
        }
        if (onResult) {
            if (e.key === 'Enter' && e.target === document.body) { e.preventDefault(); next(); }
            return;
        }
        if (e.key === 'Enter' && e.target === inputEl) { e.preventDefault(); return; }
        // any typing key focuses the field; the key itself then lands in it
        if (document.activeElement !== inputEl && !e.ctrlKey && !e.metaKey && !e.altKey &&
            (e.key.length === 1 || e.key === 'Backspace') && !(e.target.closest && e.target.closest('button') && (e.key === ' '))) {
            inputEl.focus({preventScroll: true});
            updateBlur();
        }
    });
    wrap.addEventListener('pointerdown', () => { if (document.activeElement !== inputEl) setTimeout(() => { inputEl.focus({preventScroll: true}); updateBlur(); }, 0); });

    let resizeT = 0;
    const relayout = () => {
        clearTimeout(resizeT);
        resizeT = setTimeout(() => {
            if (!test) return;
            measure(); place(false);
            if (resultEl.classList.contains('show') && lastResult) drawChart(lastResult);
        }, 60);
    };
    window.addEventListener('resize', relayout);
    if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (test) { measure(); place(false); } });

    // ------------------------------------------------------------ start
    const q = new URLSearchParams(location.search);
    let seed;
    if (q.get('seed')) {
        seed = q.get('seed').slice(0, 32);
        cfg = C.normalizeConfig({mode: q.get('mode'), amount: q.get('n'), list: q.get('list'), punctuation: q.get('p') === '1', numbers: q.get('num') === '1'});
    }
    paintSound();
    newTest(seed, undefined, false);
})();
</script>
<script src="../logo.js"></script>
</body>
</html>
