<!DOCTYPE html>
<html lang="en">

            --paper: #f3ead6;

        .hud.r { right: max(12px, env(safe-area-inset-right)); }

        .sub { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font: italic 500 16px var(--serif); font-variant-numeric: oldstyle-nums; color: #3f3626; }

        .entry em { font-style: normal; margin-left: 4px; display: inline-block; vertical-align: -5px; color: #2a2418; }

</head>

        for (let i = 0; i <= 40; i++) { const u = i / 40, px = (1 - u) ** 2 * tip.x + 2 * (1 - u) * u * cx + u * u * x, py = (1 - u) ** 2 * tip.y + 2 * (1 - u) * u * cy + u * u * y; if (py >= surf(px / pxm, t)) { fx.cross = px / pxm; break; } }
        if (fx.cross) foam(fx.cross, t, .8);
      }
      return;
    }
    // float on the water, line down to the hook
    const x = sx(L.x), ys = surf(L.x, t);
    const bob = ys + fx.bob;
    const hy = sy(L.hookY) + (L.jerk ? -Math.sin(L.jerk * Math.PI) * 10 : 0);
    ctx.strokeStyle = 'rgba(246,238,214,.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.quadraticCurveTo(mix(tip.x, x, .55), Math.max(tip.y, bob) + 26, x, bob - 2); ctx.stroke();
    // below the float the line leans a little with the current
    const drift = Math.sin(t * .4 + L.x) * 6 + (hy - bob) * .03;
    const taut = L.dip >= 1;
    ctx.strokeStyle = taut ? 'rgba(255,246,220,.95)' : 'rgba(230,240,240,.5)'; ctx.lineWidth = taut ? 2 : 1; ctx.beginPath(); ctx.moveTo(x, bob + 6); ctx.quadraticCurveTo(taut ? x : x + drift, mix(bob, hy, .5), x, hy - 6); ctx.stroke(); ctx.lineWidth = 1;
    if (taut && !reduce && Math.random() < .5) bubbles.push({x: L.x + (Math.random() - .5) * .3, y: Math.max(.1, (bob - skyH) / pxm), t: 0});
    const hg = ctx.createRadialGradient(x, hy, 0, x, hy, 9); hg.addColorStop(0, `rgba(255,236,200,${.12 + .2 * P.night})`); hg.addColorStop(1, 'rgba(255,236,200,0)');
    ctx.fillStyle = hg; ctx.fillRect(x - 9, hy - 9, 18, 18);
    ctx.fillStyle = '#5b6066'; ctx.beginPath(); ctx.arc(x, hy - 6, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c8ccd0'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(x, hy - 3); ctx.lineTo(x, hy + 3); ctx.arc(x - 2.5, hy + 3, 2.5, 0, Math.PI * .9); ctx.stroke();
    ctx.fillStyle = '#e88a8a'; ctx.beginPath(); ctx.ellipse(x - 1, hy + 1, 2, 4, .4, 0, Math.PI * 2); ctx.fill();
    bobber(x, bob, Math.max(0, Math.min(1, fx.bob / 14)));
  }
  function bobber(x, y, under) {
    const r = Math.max(7, U * .34), t = st.t;
    const paint = () => {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = '#efe7d3'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#e8462b'; ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-.8, -r - r * 1.1, 1.6, r * 1.1);
      ctx.fillStyle = '#e8462b'; ctx.fillRect(-1.4, -r - r * 1.25, 2.8, r * .45);
      ctx.restore();
    };
    if (!under && y < surf(x / pxm, t) - r * 2.5) return paint();
    // above the surface in full colour, below it seen through the water
    ctx.save(); ctx.beginPath(); ctx.moveTo(0, 0);
    for (let xx = 0; xx <= vw + 8; xx += 8) ctx.lineTo(xx, surf(xx / pxm, t));
    ctx.lineTo(vw, 0); ctx.closePath(); ctx.clip(); paint(); ctx.restore();
    underwater(() => { ctx.globalAlpha = .45; paint(); }, t);
  }

  function drawFx(t) {
    // the depth, marked down the west reef like a tide gauge: the depth decides who you meet
    // rings on the water
    for (const r of rings) {
      const a = 1 - r.t / 1.4; if (a <= 0) continue;
      ctx.strokeStyle = `rgba(255,255,255,${a * .55})`; ctx.lineWidth = 1.5;
      const rad = (8 + r.t * 50) * r.s, y = surf(r.x, t);
      ctx.beginPath(); ctx.ellipse(sx(r.x), y, rad, rad * .22, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(240,250,255,.85)';
    for (const d of drops) { ctx.beginPath(); ctx.arc(d.x, d.y, 2.2, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(220,240,255,.5)';
    for (const b of bubbles) { ctx.beginPath(); ctx.arc(sx(b.x), sy(b.y), 1.5 + b.t, 0, Math.PI * 2); ctx.fill(); }
    if (fx.pop > 0 && st.line.x != null) {
      const x = sx(st.line.x), y = surf(st.line.x, t), p = 1 - fx.pop;
      ctx.strokeStyle = `rgba(255,255,255,${fx.pop * .9})`; ctx.lineWidth = 3 * fx.pop + 1;
      ctx.beginPath(); ctx.ellipse(x, y, 10 + p * 46, 3 + p * 10, 0, 0, Math.PI * 2); ctx.stroke();
      const gl = ctx.createRadialGradient(x, y, 0, x, y, 60 + p * 60); gl.addColorStop(0, `rgba(255,250,230,${fx.pop * .5})`); gl.addColorStop(1, 'rgba(255,250,230,0)'); ctx.fillStyle = gl; ctx.fillRect(x - 130, y - 130, 260, 260);
      ctx.strokeStyle = `rgba(255,255,255,${fx.pop * .6})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, y, 20 + p * 90, 5 + p * 18, 0, 0, Math.PI * 2); ctx.stroke();
    }
    // sea sparkle
    for (const g of glints) { const a = Math.max(0, 1 - g.t / 1.2); ctx.fillStyle = `rgba(150,240,255,${a * .8})`; ctx.fillRect(sx(g.x) - 1, sy(g.y) - 1, 2.2, 2.2); }
    if (st.line.phase === 'set' || st.line.phase === 'sinking') foam(st.line.x, t, .6);
    // words
    ctx.textAlign = 'center'; ctx.font = `italic 700 ${Math.round(Math.max(20, Math.min(26, vw / 40)))}px Fraunces, Georgia, serif`;
    for (const w of words) {
      const a = Math.min(1, w.t * 6) * Math.max(0, 1 - Math.max(0, w.t - 1.2) / .5), y = w.y - (reduce ? 0 : 18 * (1 - Math.pow(1 - Math.min(1, w.t / .6), 3)));
      ctx.fillStyle = `rgba(6,16,26,${a * .45})`; ctx.fillText(w.text, w.x + 1, y + 1.5);
      ctx.fillStyle = `rgba(255,248,232,${a})`; ctx.fillText(w.text, w.x, y);
    }
  }

  function drawAim(t) {
    const tip = rodTip(t), x = sx(aim.x), y = sy(Math.max(.6, aim.y)), ys = surf(aim.x, t), ok = aim.y > -.2;
    ctx.save();
    ctx.setLineDash([3, 6]); ctx.lineDashOffset = -t * 30; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.quadraticCurveTo(mix(tip.x, x, .5), Math.min(tip.y, ys) - Math.max(50, Math.abs(x - tip.x) * .3), x, ys); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, ys); ctx.lineTo(x, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = ok ? '#fff' : 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    // the depth, on the line
    ctx.font = '600 14px Fraunces, Georgia, serif'; ctx.textAlign = x > vw - 70 ? 'right' : 'left';
    const lbl = fx.hint > .02 && !down ? '' : `${Math.round(Math.max(.6, aim.y))} m`;
    ctx.fillStyle = 'rgba(6,16,26,.5)'; ctx.fillText(lbl, x + (x > vw - 70 ? -17 : 17) + 1, y + 5);
    ctx.fillStyle = '#fff'; ctx.fillText(lbl, x + (x > vw - 70 ? -17 : 17), y + 4);
    ctx.restore();
  }

  // ---- the loop ----
  function tick(now) {
    const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
    if (!MOCK) {
      acc += dt * timeScale;
      while (acc >= S.STEP) { acc -= S.STEP; for (const ev of S.step(st)) feel(ev); }
    }
    const L = st.line;
    // the float: a spring toward where the fish holds it
    const target = (L.dip || 0) * (L.dip >= 1 ? Math.max(30, U * 1.6) : Math.max(14, U * .7)) + (L.phase === 'set' && L.fish ? 1 : 0);
    for (let k = 0, n = Math.ceil(dt / (1 / 240)); k < n; k++) { const h = dt / n; fx.bobV += ((target - fx.bob) * 260 - fx.bobV * 16) * h; fx.bob += fx.bobV * h; }   // substeps keep the spring stable on a long frame
    if (L.dip >= 1 && !reduce) fx.bob += Math.sin(now / 30) * .8;
    // the rod swings to the side it fishes, and bends with the load
    const ox = L.phase === 'idle' || L.phase === 'landed' ? (aim ? aim.x : null) : L.phase === 'fight' ? L.fx : L.x;
    const side = ox == null || Math.abs(ox - st.boat) < 1.5 ? fx.side : Math.sign(ox - st.boat);   // turn only for water clearly on the other side
    fx.side = side || 1;
    fx.face += (fx.side - fx.face) * Math.min(1, dt * 7);
    const wantA = L.phase === 'fight' ? .25 : L.phase === 'idle' || L.phase === 'landed' ? (aim ? .2 : .5) : .8;
    fx.rodA += (wantA - fx.rodA) * Math.min(1, dt * (aim ? 12 : 5));
    const wantB = L.phase === 'fight' ? Math.min(1.1, L.T) : (L.dip || 0) * .5 + (fx.kick || 0) * .5;
    fx.bend += (wantB - fx.bend) * Math.min(1, dt * 10);
    fx.gauge += ((L.phase === 'fight' ? L.T : 0) - fx.gauge) * Math.min(1, dt * 14);
    fx.gaugeA += ((L.phase === 'fight' ? 1 : 0) - fx.gaugeA) * Math.min(1, dt * 6);
    fx.flash = Math.max(0, fx.flash - dt * 2.5); fx.shake = Math.max(0, fx.shake - dt * 4); fx.pop = Math.max(0, (fx.pop || 0) - dt * 2.2); fx.kick = Math.max(0, (fx.kick || 0) - dt * 3);
    for (const r of rings) r.t += dt; while (rings.length && rings[0].t > 1.5) rings.shift();
    for (const d of drops) { d.t += dt; d.vy += 600 * dt; d.x += d.vx * dt; d.y += d.vy * dt; }
    for (let i = drops.length - 1; i >= 0; i--) if (drops[i].t > .4 && drops[i].y > sy(0) + 4) drops.splice(i, 1);
    for (const b of bubbles) { b.t += dt; b.y -= dt * 2.2; }
    for (const g of glints) g.t += dt; while (glints.length && glints[0].t > 1.2) glints.shift();
    for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].y < 0 || bubbles[i].t > 3) bubbles.splice(i, 1);
    for (const w of words) w.t += dt; while (words.length && words[0].t > 1.8) words.shift();
    // reel sounds: a ratchet clicking at the reel's speed, a hum rising with the load
    if (ac && !prefs.muted) {
      if (L.phase === 'fight' && L.hold) { clickAcc += dt * (14 + 30 * (1 - Math.min(1, L.T))); if (clickAcc > 1) { clickAcc = 0; SFX.click(); } }
      const T = L.phase === 'fight' ? L.T : 0;
      humG.gain.setTargetAtTime(T > .45 ? (T - .45) * .12 : 0, ac.currentTime, .05);
      hum.frequency.setTargetAtTime(110 + T * 260, ac.currentTime, .05);
      if (wash.g) wash.g.gain.setTargetAtTime(.25, ac.currentTime, 1);
    }
    // the title gives way to the bay once a cast is made; the hint comes back if nothing happens
    idleT += dt;
    const showHint = L.phase === 'idle' && !aim && (!(prefs.taught & 1) || idleT > 9);
    fx.hint += ((showHint ? 1 : 0) - fx.hint) * Math.min(1, dt * 4);
    $('hint').style.opacity = fx.hint.toFixed(3);
    const showTitle = !(prefs.taught & 1) && L.phase === 'idle' && !aim || MOCK === 'title';
    fx.title += ((showTitle ? 1 : 0) - fx.title) * Math.min(1, dt * (showTitle ? 3 : 12));
    $('title').style.opacity = fx.title.toFixed(3);
    $('title').style.transform = `translateY(${(1 - fx.title) * -12}px)`;
    draw(now);
    requestAnimationFrame(tick);
  }

  addEventListener('resize', layout);
  layout(); syncHud();
  if (MOCK) mock(MOCK);
  window.__salt = {get st() { return st; }, S, fx, prefs, set timeScale(v) { timeScale = v; }};   // for the test suite's page checks
  requestAnimationFrame(tick);

  // a still of the bay for design reviews: ?mock=float|fight|card|title
  function mock(kind) {
    fx.title = kind === 'title' ? 1 : 0; fx.hint = kind === 'title' ? 1 : 0;
    st.clock = +(params.get('clock') || .3); st.t = 12;
    st.fish = [];
    const put = (id, x, y, dir, cm) => { const f = S.spawn(st, true, S.BY[id]); f.x = x; f.y = y; f.dir = dir; f.cm = cm || f.cm; return f; };
    const W = st.W, b = st.boat;
    const put2 = (id, x, y, dir, cm) => { const n = st.fish.length, f = put(id, x, y, dir, cm); st.fish.slice(n + 1).forEach((g, i) => { g.x = x - dir * (2 + i * 1.8); g.y = y + (i % 2 ? 1 : -.8); g.dir = dir; }); return f; };
    for (let i = 0; i < 4; i++) { const f = S.spawn(st, true); f.x = (.08 + .84 * ((i * .37 + .2) % 1)) * W; }
    put2('mackerel', b - W * .3, 3.5, 1, 38); const hooked = put('pollack', b + W * .25, 9.5, -1, 80); put('cod', b - W * .12, 16, 1, 95);
    put2('smelt', b + W * .36, 2, -1, 14); put('turbot', b + W * .1, 21, 1, 60); put('bream', b - W * .38, 11, 1); put('conger', b + W * .05, 20.8, -1, 150);
    if (kind === 'float' || kind === 'card') {
      S.cast(st, b + W * .22, 9.5); st.line.phase = 'set'; st.line.hookY = 9.5;
      const f = hooked; f.x = b + W * .22 + S.mouth(f) * (st.sizeK || 1); f.y = 9.5; f.dir = -1; f.state = 'nibble'; st.line.fish = f.id; st.line.dip = .2;
      prefs.taught |= 1;
    }
    if (kind === 'fight') {
      prefs.taught |= 1;
      const f = hooked; S.cast(st, b + W * .3, 9); st.line.phase = 'set'; st.line.hookY = 9; f.state = 'bite'; st.line.fish = f.id; S.tap(st);
      Object.assign(st.line, {r: 7, ang: .8, T: .82, mode: 'run'}); st.line.fx = b + Math.sin(.8) * 7; st.line.fy = Math.cos(.8) * 7;
      fx.gauge = .82; fx.gaugeA = 1; fx.bend = .82; fx.rodA = .95;
    }
    if (kind === 'card') { st.journal.pollack = {n: 1, best: 78}; setTimeout(() => showCard({id: 'pollack', name: 'Pollack', cm: 78, kg: S.kgOf(S.BY.pollack, 78), first: true}), 50); }
    if (kind === 'journal') { prefs.taught |= 1; for (const id of ['smelt', 'mackerel', 'pollack', 'cod', 'bass', 'scad', 'wrasse']) st.journal[id] = {n: 3, best: S.BY[id].len[1] - 4}; setTimeout(openJournal, 50); }
    syncHud();
  }
})();
</script>
