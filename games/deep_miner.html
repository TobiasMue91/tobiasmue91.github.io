<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120a14">
<title>Wick: a Mining Game by Lamplight</title>
<meta name="description" content="Dig down through five layers of rock by lamplight. Your lamp oil is both your clock and your light: haul ore up, upgrade, and reach the Deep Heart.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#120a14; --ink2:#1e1322; --cream:#f3e7c9; --cream2:#d9c9a2; --amber:#ffb43b; --ember:#ff6a3a; --brass:#c28a2b; --moss:#7fcf6a; --rose:#ff5d73;
  --slab:"Alfa Slab One","Rockwell","Roboto Slab",Georgia,serif; --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07060d;overflow:hidden;color:var(--cream);font-family:var(--cond);font-weight:600;overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--safe-t)) calc((100vw - var(--colw,100vw))/2 + 14px) 26px;pointer-events:none;background:linear-gradient(#07060dcc 0,#07060d99 55%,#07060d00);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.depth{display:flex;flex-direction:column;line-height:1}
.depth b{font:400 clamp(34px,9vw,48px)/1 var(--slab);color:var(--cream);letter-spacing:.5px;text-shadow:0 3px 0 #000a;font-variant-numeric:tabular-nums}
.depth b i{font:600 .36em var(--cond);font-style:normal;color:var(--cream2);margin-left:5px;letter-spacing:1px}
.depth>span{font:700 15px var(--cond);letter-spacing:2.4px;text-transform:uppercase;margin-top:3px;color:var(--zc,#e0955f)}
.cash{display:flex;align-items:center;gap:8px;padding-top:6px}
.cash b{font:400 clamp(24px,6.4vw,32px)/1 var(--slab);color:var(--amber);text-shadow:0 2px 0 #000a;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1a8,#ffc83a 45%,#b87912);box-shadow:inset 0 0 0 2px #7b4d0a,0 2px 0 #000a;position:relative}
.coin:after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid #8a560c;opacity:.7}
.gauges{grid-column:1/3;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:2px;transition:opacity .3s}.hud.surf .gauges{opacity:0}
.g{display:flex;align-items:center;gap:8px;min-width:0}
.g svg{flex:none;width:28px;height:28px}.pack{background:#0c0710cc;border-radius:10px;padding:3px 10px 3px 8px;box-shadow:inset 0 0 0 2px #3a2a40}.pack .bar{display:none}.pack em{font:400 20px var(--slab);min-width:0;color:var(--cream)}.pack.full{box-shadow:inset 0 0 0 2px var(--amber)}.pack.full em{color:var(--amber)}
.bar{position:relative;flex:1;height:20px;border-radius:3px;background:#0c0710;box-shadow:inset 0 0 0 2px #3a2a40;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:var(--v,100%);background:var(--bc);transition:width .18s cubic-bezier(.2,.8,.3,1)}
.bar:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#0c0710 9px 11px);opacity:.8}.oil{filter:drop-shadow(0 0 8px #ff8a2a55)}
.oil{--bc:linear-gradient(90deg,#ff6a3a,#ffb43b)}
.pack{--bc:linear-gradient(90deg,#b9a77a,#f3e7c9)}
.g em{font:700 20px var(--cond);font-style:normal;color:var(--cream);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.oil.low .bar{animation:warn .5s steps(2) infinite}.oil.low svg{animation:flick .25s steps(2) infinite}@keyframes flick{50%{transform:scale(1.25)}}.oil.low .bar i{background:var(--rose)}
.pack.full .bar i{background:var(--amber)}
@keyframes warn{50%{box-shadow:inset 0 0 0 2px var(--rose)}}

.dock{position:absolute;left:0;right:0;bottom:0;padding:0 calc((100vw - var(--colw,100vw))/2 + 14px) calc(16px + var(--safe-b));display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
.dock>*{pointer-events:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border-radius:14px;font:400 20px/1 var(--slab);letter-spacing:.5px;color:var(--ink);background:linear-gradient(var(--amber),#f09a1e);box-shadow:0 5px 0 #8a560c,0 10px 18px #0008;transition:transform .12s cubic-bezier(.2,.8,.3,1),box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a560c,0 4px 8px #0008}
.btn.ghost{background:linear-gradient(#3a2742,#2a1b32);color:var(--cream);box-shadow:0 5px 0 #120a14,0 10px 18px #0008,inset 0 0 0 2px #5a4166}
.btn.ghost:active{box-shadow:0 1px 0 #120a14,0 4px 8px #0008,inset 0 0 0 2px #5a4166}
.btn[disabled]{opacity:.45;pointer-events:none}
#haul{width:72px;height:72px;border-radius:50%;padding:0;flex-direction:column;gap:2px;font-size:14px;letter-spacing:1.5px;margin-left:auto;transition:transform .12s cubic-bezier(.2,.8,.3,1),box-shadow .12s,opacity .25s,scale .25s}
#haul svg{width:30px;height:30px}
@media(min-width:900px){#haul{width:88px;height:88px;font-size:16px}#haul svg{width:34px;height:34px}.btn{min-height:60px}}
#haul.hide{opacity:0;scale:.6;pointer-events:none}
#haul.pulse{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 #8a560c,0 0 0 10px #ffb43b44,0 10px 18px #0008}}
.mini{width:48px;height:48px;border-radius:12px;padding:0;min-height:0;font-size:0}
.mini svg{width:24px;height:24px}
#surf{display:flex;position:absolute;left:calc((100vw - var(--colw,100vw))/2 + 14px);right:calc((100vw - var(--colw,100vw))/2 + 14px);bottom:calc(16px + var(--safe-b));gap:10px;align-items:flex-end;transition:opacity .25s,translate .3s cubic-bezier(.2,.8,.3,1)}
#surf.hide{opacity:0;translate:0 30px;pointer-events:none}
#surf .btn.go{flex:1;min-width:0;font-size:26px;min-height:64px}
#surf .btn.ghost{flex:none;min-height:64px;padding:0 12px;min-width:84px;font-size:14px;flex-direction:column;gap:3px}
#surf .btn.ghost svg{width:24px;height:24px}
#snd{position:absolute;left:calc((100vw - var(--colw,100vw))/2 + 14px);bottom:calc(20px + var(--safe-b));width:44px;height:44px;opacity:.8;transition:opacity .3s}.hud.surf~#snd{opacity:0;pointer-events:none}

#hint{position:absolute;left:0;right:0;top:56%;text-align:center;pointer-events:none;font:400 22px var(--slab);color:var(--cream);text-shadow:0 3px 0 #000b;transition:opacity .4s}
#hint small{display:block;font:600 16px var(--cond);letter-spacing:2px;color:var(--cream2);margin-top:6px;text-transform:uppercase}
#hint.hide{opacity:0}
#title{position:absolute;left:0;right:0;top:calc(46px + var(--safe-t));text-align:center;pointer-events:none;transition:opacity .5s}
#title h1{margin:0;font:400 clamp(54px,15vw,96px)/.9 var(--slab);color:#ffe3a1;letter-spacing:2px;text-shadow:0 5px 0 #7a2f2a,0 9px 0 #2a1630,0 16px 24px #000a}
#title p{margin:10px 0 0;font:700 15px var(--cond);letter-spacing:4px;text-transform:uppercase;color:#f3c9a0}
#title.hide{opacity:0}

#toast{position:absolute;left:50%;top:calc(150px + var(--safe-t));translate:-50% 0;padding:10px 18px;border-radius:12px;background:#120a14ee;box-shadow:inset 0 0 0 2px var(--amber);font:700 18px var(--cond);letter-spacing:1.5px;text-transform:uppercase;color:var(--cream);opacity:0;pointer-events:none;transition:opacity .25s,translate .3s cubic-bezier(.2,.8,.3,1);width:max-content;max-width:86vw;text-align:center}
#toast.on{opacity:1;translate:-50% 8px}
#zonebanner{position:absolute;left:0;right:0;top:19%;text-align:center;pointer-events:none;opacity:0;transform:scale(.92);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.3,1)}
#zonebanner.on{opacity:1;transform:none}
#zonebanner small{display:block;font:700 15px var(--cond);letter-spacing:5px;color:var(--cream2);text-transform:uppercase}
#zonebanner b{display:block;font:400 clamp(34px,10vw,56px)/1.05 var(--slab);color:var(--zc);text-shadow:0 4px 0 #000b,0 0 30px #000a}

.sheetwrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:#07060d00;pointer-events:none;transition:background .3s}
.sheetwrap.on{background:#07060d99;pointer-events:auto}
.sheet{width:min(560px,100%);max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + var(--safe-b));color:var(--ink);background:linear-gradient(#f6ecd0,#e9d9ac);box-shadow:0 -10px 40px #000a,inset 0 0 0 3px #c9b17a;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
.sheetwrap.on .sheet{transform:none}
@media(min-width:700px){.sheetwrap{align-items:center}.sheet{border-radius:22px;max-height:84%;transform:translateY(30px) scale(.97);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s}.sheetwrap.on .sheet{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font:400 28px var(--slab);color:var(--ink);letter-spacing:.5px}
.sheet .sub{font:700 14px var(--cond);letter-spacing:2.4px;text-transform:uppercase;color:#7a5a2a;margin-bottom:12px}
.rows{border-top:3px double #b9a06a;margin:6px 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed #b9a06a;font:700 20px var(--cond);opacity:0;transform:translateX(-14px);animation:rowin .35s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes rowin{to{opacity:1;transform:none}}
.row .gem{width:22px;height:22px;flex:none;border-radius:6px;box-shadow:inset 0 0 0 2px #0004,inset 3px 3px 0 #fff6}
.row .n{flex:1}.row .n small{font-weight:600;color:#7a5a2a;font-size:16px;margin-left:6px}
.row .v{font:400 20px var(--slab);font-variant-numeric:tabular-nums}
.total{display:flex;align-items:baseline;justify-content:space-between;padding:8px 2px 14px}
.total span{font:700 16px var(--cond);letter-spacing:2.5px;text-transform:uppercase;color:#7a5a2a}
.total b{font:400 44px var(--slab);color:#a8630b;font-variant-numeric:tabular-nums}

.sheet .btn{width:100%}

.up{display:grid;grid-template-columns:48px 1fr auto;gap:2px 12px;align-items:center;padding:11px 0;border-bottom:1px dashed #b9a06a}
.up .ic{grid-row:1/3;width:48px;height:48px;border-radius:12px;background:#2a1b32;display:grid;place-items:center}
.up .ic svg{width:28px;height:28px}
.up h3{margin:0;font:400 19px var(--slab);color:var(--ink)}
.up p{margin:0;font:600 16px var(--cond);color:#6a4c22}
.up .pips{grid-column:2;display:flex;gap:4px;margin-top:3px}
.up .pips i{width:16px;height:7px;border-radius:2px;background:#cdb98a}.up .pips i.on{background:#c9741a}
.up .buy{grid-column:3;grid-row:1/4;min-height:48px;padding:0 14px;border-radius:12px;font:400 17px var(--slab);width:auto}
.up .buy small{display:block;font:700 12px var(--cond);letter-spacing:1.5px;opacity:.75;margin-bottom:2px}

.relics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}
.rl{aspect-ratio:1;border-radius:14px;background:#2a1b32;display:grid;place-items:center;position:relative;overflow:hidden}
.rl canvas{width:70%;image-rendering:pixelated}
.rl.no canvas{filter:brightness(0) opacity(.35)}
.rl.new{animation:newrl 1.2s ease-out 2}
@keyframes newrl{0%{box-shadow:0 0 0 0 #ffd13a}100%{box-shadow:0 0 0 18px #ffd13a00}}
.relicname{text-align:center;font:700 17px var(--cond);min-height:22px;color:#6a4c22;letter-spacing:1px}

#black{position:absolute;inset:0;background:#07060d;opacity:0;pointer-events:none;transition:opacity .9s}
#black.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

#vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,#0000 45%,#ff2a4a55 100%);transition:opacity .4s}#vig.on{opacity:1;animation:vig .9s ease-in-out infinite alternate}@keyframes vig{to{opacity:.4}}
.pack.full em:after{content:' FULL';font:700 13px var(--cond);letter-spacing:2px;color:var(--amber);margin-left:4px}
.hud.surf .depth{visibility:hidden}
.total b.pop{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}@keyframes stamp{0%{transform:scale(1.5);opacity:.3}100%{transform:none;opacity:1}}
.up .buy[data-no]{background:#cdb98a;color:#5a4220;box-shadow:inset 0 0 0 2px #a8905a}.up .buy[data-no] small{opacity:1}
.note{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#7a2f2a;color:#fff1d6;font:700 18px var(--cond)}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Mine cross-section"></canvas>
  <div class="hud" id="hud">
    <div class="depth"><b><span id="dep">0</span><i>m</i></b><span id="zone">Clay Hollow</span></div>
    <div class="cash"><span class="coin"></span><b id="cash">0</b></div>
    <div class="gauges">
      <div class="g oil" id="goil"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-7 1 1 2 2 2 3 1-2 1-5 1-8z" fill="#ffb43b" stroke="#120a14" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 12c1 2 3 3 3 5a3 3 0 0 1-6 0c0-2 2-3 3-5z" fill="#fff3b0"/></svg><div class="bar"><i id="oilb"></i></div></div>
      <div class="g pack" id="gpack"><svg viewBox="0 0 24 24"><path d="M8 4h8l1 3c3 2 4 5 4 9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4c0-4 1-7 4-9z" fill="#c9a66b" stroke="#120a14" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 4h8M7 8h10" stroke="#120a14" stroke-width="1.5"/><path d="M9 13h6" stroke="#6b4a22" stroke-width="2"/></svg><div class="bar"><i id="packb"></i></div><em id="packn">0/6</em></div>
    </div>
  </div>
  <div id="title"><h1>Wick</h1><p>dig by lamplight</p></div>
  <div id="hint">Drag to dig<small>hold your thumb anywhere</small></div>
  <div id="zonebanner"><small>Entering</small><b id="zbname"></b></div>
  <div id="toast"></div>
  <div class="dock">
    <div id="surf">
      <button class="btn ghost" id="bShop"><svg viewBox="0 0 24 24"><path d="M3 20l8-8m0 0l-2-2 3-3 3 1 5-5 2 2-5 5 1 3-3 3z" fill="#f3e7c9" stroke="#120a14" stroke-width="1.4" stroke-linejoin="round"/></svg>Workshop</button>
      <button class="btn go" id="bGo">Dig</button>
      <button class="btn ghost" id="bMuseum"><svg viewBox="0 0 24 24"><path d="M12 3l9 5v2H3V8zM5 11h2v7H5zm6 0h2v7h-2zm6 0h2v7h-2zM3 19h18v2H3z" fill="#f3e7c9" stroke="#120a14" stroke-width="1.2" stroke-linejoin="round"/></svg>Relics</button>
    </div>
    <button class="btn" id="haul" aria-label="Haul up"><svg viewBox="0 0 24 24"><path d="M12 3l7 8h-4.5v10h-5V11H5z" fill="#120a14"/></svg>HAUL</button>
  </div>
  <button class="btn ghost mini" id="snd" aria-label="Sound"><svg viewBox="0 0 24 24" id="sndi"></svg></button>
  <div class="sheetwrap" id="sheetwrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="vig"></div>
  <div id="black"></div>
</div>

<script id="core">
const Core = (() => {
  const W = 15, H = 301, SHAFT = 7, ZROWS = 60, HEART_Y = 300;
  const AIR = 0, ROCK = 1, ORE = 2, LAVA = 3, RELIC = 4;
  const ZONES = [
    {name: 'Clay Hollow', hard: 1.0, cost: 1.1},
    {name: 'Chalk Vaults', hard: 1.5, cost: 1.5},
    {name: 'Glimmer Deep', hard: 2.2, cost: 2.0},
    {name: 'Ember Reach', hard: 3.2, cost: 2.6},
    {name: 'The Hush', hard: 4.6, cost: 3.4},
  ];
  // value, hardness multiplier, vein size range, weight per zone
  const ORES = [
    {id: 'copper',    name: 'Copper',    value: 5,    hard: 1.0, size: [3, 7], w: [6, 3, 0, 0, 0]},
    {id: 'iron',      name: 'Iron',      value: 11,   hard: 1.3, size: [3, 6], w: [2, 4, 2, 0, 0]},
    {id: 'silver',    name: 'Silver',    value: 26,   hard: 1.6, size: [3, 5], w: [0, 3, 4, 2, 0]},
    {id: 'gold',      name: 'Gold',      value: 62,   hard: 2.0, size: [2, 5], w: [0, 0, 3, 4, 2]},
    {id: 'amethyst',  name: 'Amethyst',  value: 120,  hard: 2.2, size: [2, 4], w: [0, 0, 2, 3, 0]},
    {id: 'ruby',      name: 'Ruby',      value: 260,  hard: 3.0, size: [2, 4], w: [0, 0, 0, 3, 3]},
    {id: 'sapphire',  name: 'Sapphire',  value: 520,  hard: 3.4, size: [2, 3], w: [0, 0, 0, 0, 4]},
    {id: 'voidstone', name: 'Voidstone', value: 1100, hard: 4.0, size: [1, 3], w: [0, 0, 0, 0, 2]},
  ];
  const RELICS = [
    'Clay Whistle', 'Tin Spoon', 'Miner’s Tally', 'Chalk Idol', 'Bone Compass', 'Glass Bell',
    'Prism Eye', 'Quartz Harp', 'Sunken Crown', 'Ash Mask', 'Cinder Clock', 'Forge Heart',
    'Pale Lantern', 'Star Seed', 'Moon Key', 'The Deep Heart',
  ];
  const TRACKS = ['pick', 'oil', 'pack', 'glass'];
  const UP = {
    pick:  {name: 'Pick',  val: [1, 1.35, 1.8, 2.4, 3.2, 4.3, 5.8, 7.8],       cost: [35, 150, 450, 1300, 3600, 9500, 25000]},
    oil:   {name: 'Oil',   val: [60, 85, 120, 170, 240, 340, 480, 680],         cost: [30, 130, 400, 1150, 3200, 8800, 23000]},
    pack:  {name: 'Pack',  val: [6, 10, 15, 22, 32, 46, 66, 95],                cost: [25, 100, 340, 1000, 2900, 8000, 21000]},
    glass: {name: 'Glass', val: [3.6, 4.2, 4.8, 5.4, 6.1, 6.8, 7.6, 8.4],       cost: [45, 190, 560, 1600, 4300, 11500, 29000]},
  };
  const BASE_DIG = 0.5, IDLE = 0.4, MOVE = 0.085, MOVE_COST = 0.03, LAVA_COST = 12, HIT_EVERY = 0.16;

  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const idx = (x, y) => y * W + x;
  const zoneAt = y => Math.max(0, Math.min(4, Math.floor((y - 1) / ZROWS)));
  const depthM = y => y * 2;

  function generate(seed) {
    const rnd = mulberry(seed >>> 0 || 1);
    const kind = new Uint8Array(W * H).fill(ROCK), aux = new Uint8Array(W * H), vr = new Uint8Array(W * H);
    for (let i = 0; i < kind.length; i++) vr[i] = Math.floor(rnd() * 4);
    for (let x = 0; x < W; x++) kind[idx(x, 0)] = AIR;
    const pickW = z => { const ws = ORES.map(o => o.w[z]); let t = ws.reduce((a, b) => a + b, 0), r = rnd() * t; for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; } return 0; };
    const blob = (cx, cy, n, set) => {
      let x = cx, y = cy, tries = 0;
      for (let k = 0; k < n && tries < 60; tries++) {
        if (x >= 0 && x < W && y >= 1 && y < HEART_Y - 3 && kind[idx(x, y)] === ROCK) { set(x, y); k++; }
        const d = Math.floor(rnd() * 4); x += d === 0 ? 1 : d === 1 ? -1 : 0; y += d === 2 ? 1 : d === 3 ? -1 : 0;
      }
    };
    const putOre = (o, x, y) => { kind[idx(x, y)] = ORE; aux[idx(x, y)] = o; };
    // a first strike close to the shaft so the first dive pays
    putOre(0, SHAFT, 3); putOre(0, SHAFT, 4); putOre(0, SHAFT - 1, 4); putOre(1, SHAFT, 6);
    blob(SHAFT - 3, 4, 4, (x, y) => putOre(0, x, y)); blob(SHAFT + 2, 5, 5, (x, y) => putOre(0, x, y));
    blob(SHAFT, 8, 4, (x, y) => putOre(0, x, y));
    for (let z = 0; z < 5; z++) {
      const y0 = z * ZROWS + 1;
      for (let v = 0; v < [18, 22, 30, 34, 34][z]; v++) {

      }
      R.rig = {x: rx + C / 2, y: ry, C, ox, oy};
    };
    return R;
  }
  return {create};
})();
</script>
<script id="migrate">
// The page this replaced kept its progress under "deepMiner3": coins and prestiges. Neither means the same
// thing here (a coin was a block's worth, a coin now is a day's wages), so they carry over as a head start:
// up to 500 to spend, and each old prestige becomes a signed charter (a lasting +20% on prices), to a maximum of three.
function migrate() {
  try {
    const o = JSON.parse(localStorage.getItem('deepMiner3') || 'null');
    if (!o || typeof o !== 'object') return null;
    const coins = Number.isFinite(+o.coins) ? Math.max(0, +o.coins) : 0, pres = Number.isFinite(+o.prestiges) ? Math.max(0, +o.prestiges) : 0;
    if (!coins && !pres && !o.maxDepth) return null;
    const s = Core.create({seed: 1 + Math.floor(Math.random() * 4294967294), cash: Math.min(500, Math.floor(coins)), charters: Math.min(3, Math.floor(pres))});
    s.migrated = true; return s;
  } catch (e) { return null; }
}
</script>

    if (e.target.closest('button') || sheetOpen) return;
    Snd.init(); autoDown = false; store.set(SEEN, '1');
    ptr = {id: e.pointerId, ax: e.clientX, ay: e.clientY, x: e.clientX, y: e.clientY, d: null};
    try { app.setPointerCapture(e.pointerId); } catch (_) {}
    el.hint.classList.add('hide'); e.preventDefault();
  });
  app.addEventListener('pointermove', e => {
    if (!ptr || e.pointerId !== ptr.id) return; ptr.x = e.clientX; ptr.y = e.clientY;
    const dx = ptr.x - ptr.ax, dy = ptr.y - ptr.ay, len = Math.hypot(dx, dy), max = 64;
    if (len > max) { ptr.ax += dx / len * (len - max); ptr.ay += dy / len * (len - max); }
  });
  const up = e => { if (ptr && e.pointerId === ptr.id) { ptr = null; R.stick = null; } };
  app.addEventListener('pointerup', up); app.addEventListener('pointercancel', up);
  addEventListener('keydown', e => {
    const k = {ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd'}[e.key];
    if (!k || sheetOpen) return; Snd.init(); autoDown = false; el.hint.classList.add('hide'); store.set(SEEN, '1'); held = held.filter(x => x !== k); held.push(k); e.preventDefault();
  });
  addEventListener('keyup', e => { const k = {ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd'}[e.key]; if (k) held = held.filter(x => x !== k); });
  const KD = {l: [-1, 0], r: [1, 0], u: [0, -1], d: [0, 1]};
  function inputDir() {
    if (sheetOpen) return null;
    if (held.length) return KD[held[held.length - 1]];
    if (ptr) {
      const dx = ptr.x - ptr.ax, dy = ptr.y - ptr.ay, len = Math.hypot(dx, dy);
      R.stick = {ax: ptr.ax, ay: ptr.ay, dx: Math.max(-1, Math.min(1, dx / 64)), dy: Math.max(-1, Math.min(1, dy / 64))};
      if (len < 14) return ptr.d = null;
      const ax = Math.abs(dx), ay = Math.abs(dy), cur = ptr.d;
      let horiz = ax >= ay; if (cur) { const curH = cur[0] !== 0; horiz = curH ? ax * 1.35 >= ay : ax > ay * 1.35; }
      ptr.d = horiz ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
      return ptr.d;
    }
    if (autoDown) return s.y >= 3 ? (autoDown = false, null) : [0, 1];
    return null;
  }
  $('bGo').onclick = () => { Snd.init(); Snd.uiTap(); autoDown = true; store.set(SEEN, '1'); el.hint.classList.add('hide'); };
  $('bShop').onclick = () => { Snd.init(); Snd.uiTap(); workshop(); };
  $('bMuseum').onclick = () => { Snd.init(); Snd.uiTap(); justFound = -1; relics(); };
  $('haul').onclick = () => { Snd.init(); const ev = Core.haul(s); handle(ev); };
  const sicon = () => { $('sndi').innerHTML = Snd.muted ? '<path d="M4 9h4l5-4v14l-5-4H4z" fill="#f3e7c9"/><path d="M16 9l5 6m0-6l-5 6" stroke="#f3e7c9" stroke-width="2" stroke-linecap="round"/>' : '<path d="M4 9h4l5-4v14l-5-4H4z" fill="#f3e7c9"/><path d="M16 9c2 2 2 4 0 6M18.5 6.5c4 3.5 4 7.5 0 11" stroke="#f3e7c9" stroke-width="2" fill="none" stroke-linecap="round"/>'; };
  sicon(); $('snd').onclick = () => { Snd.init(); Snd.setMuted(!Snd.muted); sicon(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Snd.suspend(); save(); } else Snd.resume(); });
  addEventListener('pagehide', save);

  // ---------- events -> feel ----------
  const ROCKC = [['#a55f3d', '#7d4329', '#c27a52'], ['#c2b48f', '#a89a76', '#dccfa8'], ['#3d6b79', '#2a4b57', '#5b8f9d'], ['#6e2c33', '#4a1b22', '#ff7b39'], ['#2d2e66', '#4a4c93', '#d6d9ff']];
  let warnedLow = false, warnedFull = false, firstGot = false;
  function handle(evs) {
    for (const e of evs) {
      const z = Core.zoneAt(e.y !== undefined ? e.y : s.y);
      switch (e.t) {
        case 'hit': Snd.hit(z); R.burst(e.x, e.y, ROCKC[z], 2, 0.6); R.kick(0.12 + (e.ore >= 0 ? 0.1 : 0)); break;
        case 'break':
          Snd.brk(z); R.kick(e.kind === Core.ORE ? 0.5 : 0.4);
          R.burst(e.x, e.y, e.ore >= 0 ? [OC[e.ore], ...ROCKC[z]] : ROCKC[z], e.ore >= 0 ? 14 : 9, 1); break;
        case 'got': Snd.ore(e.ore); R.burst(e.x, e.y, [OC[e.ore], '#ffffff'], 8, 1.3); R.pop(s.x, s.y - 0.7, '+' + oreName(e.ore).toLowerCase() === '' ? '' : '+' + fmt(Core.ORES[e.ore].value * Core.mult(s)), OC[e.ore]); dirty = true;
          if (!firstGot) { firstGot = true; } break;
        case 'full': Snd.full(); R.burst(e.x, e.y, ['#8a8a8a'], 6); R.pop(s.x, s.y - 0.7, 'FULL', '#ffb43b'); if (!warnedFull) { warnedFull = true; toast('Pack full: haul it up'); } break;
        case 'lava': Snd.lava(); R.flashScreen('#ff5a1a', 0.55); R.kick(1); toast('Lava! The lamp burns hotter'); R.pop(s.x, s.y - 0.7, '-12', '#ff5d73'); break;
        case 'relic': R.flashScreen('#ffe9a8', 0.4); R.burst(e.x !== undefined ? e.x : s.x, s.y, ['#ffe9a8', '#fff', '#d29a3a'], 24, 1.6); Snd.relic(); justFound = e.id; save();
          if (e.id !== 15) { toast(Core.RELICS[e.id] + (e.first ? ' · relic found' : ''), 2600); } break;
        case 'heart': setTimeout(heartCard, 1400); break;
        case 'zone': if (e.z > 0) { zoneBanner(e.z); Snd.zonein(); } break;
        case 'haul': Snd.haul(e.dur); toast('Hauling up…', 1000); break;
        case 'out': Snd.out(); el.black.classList.add('on'); toast('The lamp is out', 2000); break;
        case 'sold': el.black.classList.remove('on'); warnedLow = warnedFull = false; save();
          if (!e.total && !e.rescued) { toast('Nothing to sell: dig some ore first', 2200); break; }
          setTimeout(() => assay(e), 260); break;
      }
    }
  }

  // ---------- loop ----------
  let tPrev = performance.now(), t = 0, lastZ = -1;
  function frame(now) {
    const dt = Math.min(0.1, (now - tPrev) / 1000); tPrev = now; t += dt;
    const evs = [];
    const dir = s.mode === 'dive' ? inputDir() : null;
    const before = s.x;
    Core.step(s, dt, dir, evs);
    if (evs.length) handle(evs);
    if (s.y > 0 && s.mode === 'dive' && Core.oilFrac(s) < 0.3 && !warnedLow) { warnedLow = true; toast('The lamp is running low'); }
    const z = s.y === 0 ? -1 : Core.zoneAt(s.y); if (z !== lastZ) { lastZ = z; Snd.zone(Math.max(0, z), z >= 0); }
    R.draw(s, t, dt); hud();
    dirty = dirty || evs.length > 0;
    if (dirty && (saveT += dt) > 3) { saveT = 0; save(); }
    requestAnimationFrame(frame);
  }
  if (sharedSeed) toast('Seed ' + sharedSeed + ' · progress is not saved', 3200);
  else if (!fresh) el.hint.classList.add('hide');
  if (fresh) store.set(SEEN, '1');
  if (s.migrated) { setTimeout(() => toast('Your old progress came along: ' + fmt(s.cash) + ' to spend' + (s.charters ? ', charter ×' + (1 + 0.2 * s.charters).toFixed(1) : ''), 4200), 800); save(); }
  if (s.y === 0 && s.best > 0) el.hint.classList.add('hide');
  requestAnimationFrame(frame);

  // exposed for tests and the filmstrip
  window.__wick = {get s() { return s; }, Core, R, Snd, toast, assay, workshop, relics, heartCard, held: () => held, setDir: d => { held = d ? [d[0] < 0 ? 'l' : d[0] > 0 ? 'r' : d[1] < 0 ? 'u' : 'd'] : []; }};
})();
</script>
</body>
</html>
