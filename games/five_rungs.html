'use strict';
/* =========================================================================
   Five Rungs — five daily puzzles generated from the UTC date.
   Nothing is fetched and nothing is stored anywhere but this browser.
   Every puzzle below is produced by a seeded generator and then handed to a
   solver; a seed whose puzzle is unsolvable or has more than one answer is
   thrown away and the counter moves on. What you see has been proved.
   ========================================================================= */

/* ---------- deterministic RNG (xmur3 seed -> sfc32 stream) ---------- */
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){
    h=Math.imul(h^str.charCodeAt(i),3432918353);
    h=(h<<13)|(h>>>19);
  }
  return function(){
    h=Math.imul(h^(h>>>16),2246822507);
    h=Math.imul(h^(h>>>13),3266489909);
    h^=h>>>16;return h>>>0;
  };
}
function sfc32(a,b,c,d){
  return function(){
    a|=0;b|=0;c|=0;d|=0;
    const t=(((a+b)|0)+d)|0;
    d=(d+1)|0;a=b^(b>>>9);b=(c+(c<<3))|0;c=(c<<21)|(c>>>11);c=(c+t)|0;
    return (t>>>0)/4294967296;
  };
}
function rngFor(label){
  const s=xmur3(label);
  return sfc32(s(),s(),s(),s());
}
function ri(rnd,n){return Math.floor(rnd()*n);}
function shuffle(rnd,a){for(let i=a.length-1;i>0;i--){const j=ri(rnd,i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- the day ---------- */
const EPOCH=Date.UTC(2026,0,1);
function todayUTC(){
  const n=new Date();
  return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()));
}
function iso(d){return d.toISOString().slice(0,10);}
function dayNumber(dateStr){
  const[y,m,dd]=dateStr.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,dd)-EPOCH)/86400000);
}
function dateFromNumber(n){return iso(new Date(EPOCH+n*86400000));}
function msToUtcMidnight(){
  const n=new Date();
  return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1)-n.getTime();
}
function fmtCountdown(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return String(Math.floor(s/3600)).padStart(2,'0')+':'+
         String(Math.floor(s/60)%60).padStart(2,'0')+':'+
         String(s%60).padStart(2,'0');
}

/* ---------- storage that survives being switched off ---------- */
const Store=(function(){
  let live=true,mem={};
  try{
    const k='__fr_probe';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
  }catch(e){live=false;}
  function get(k){
    if(live){try{return window.localStorage.getItem(k);}catch(e){live=false;}}
    return k in mem?mem[k]:null;
  }
  function set(k,v){
    if(live){try{window.localStorage.setItem(k,v);return;}catch(e){live=false;}}
    mem[k]=v;
  }
  return{
    get available(){return live;},
    readJSON(k,dflt){
      const raw=get(k);
      if(raw===null)return dflt;
      try{const v=JSON.parse(raw);return v===null||v===undefined?dflt:v;}catch(e){return dflt;}
    },
    writeJSON(k,v){try{set(k,JSON.stringify(v));}catch(e){}}
  };
})();

const SKEY='fiveRungs.v1';
function loadState(){
  const s=Store.readJSON(SKEY,{});
  if(typeof s!=='object'||!s)return{};
  return s;
}
function saveState(s){Store.writeJSON(SKEY,s);}
let STATE=loadState();

/* per-puzzle record for one day: {st:'open'|'won'|'lost', marks:[...], t:seconds, extra} */
function recFor(pid,date){
  const d=STATE[date];
  if(d&&d[pid])return d[pid];
  return null;
}
function putRec(pid,date,rec){
  if(!STATE[date])STATE[date]={};
  STATE[date][pid]=rec;
  /* keep the file small: 400 days is plenty of history */
  const keys=Object.keys(STATE).sort();
  while(keys.length>400)delete STATE[keys.shift()];
  saveState(STATE);
}

/* streaks and stats are derived, never stored separately, so they cannot drift */
function statsFor(pid,uptoDate){
  const upto=dayNumber(uptoDate);
  let played=0,won=0,streak=0,best=0,run=0;
  const days=Object.keys(STATE).sort();
  let prev=null;
  for(const d of days){
    const n=dayNumber(d);
    if(n>upto)continue;
    const r=STATE[d][pid];
    if(!r||r.st==='open')continue;
    played++;
    if(r.st==='won'){
      won++;
      run=(prev!==null&&n===prev+1)?run+1:1;
      if(run>best)best=run;
      prev=n;
    }else{run=0;prev=null;}
  }
  /* the current streak only counts if it reaches the day being looked at,
     or the day before it (today may still be unfinished) */
  streak=0;
  for(let n=upto;n>=upto-400;n--){
    const r=STATE[dateFromNumber(n)];
    const rec=r&&r[pid];
    if(rec&&rec.st==='won')streak++;
    else if(n===upto&&(!rec||rec.st==='open'))continue;
    else break;
  }
  return{played:played,won:won,streak:streak,best:best};
}

/* ---------- sharing ---------- */
function copyText(text,btn){
  const done=function(ok){
    if(!btn)return;
    const old=btn.textContent;
    btn.textContent=ok?'Copied':'Select the box below';
    setTimeout(function(){btn.textContent=old;},1600);
  };
  let p=null;
  try{
    if(navigator.clipboard&&window.isSecureContext)p=navigator.clipboard.writeText(text);
  }catch(e){p=null;}
  if(p&&p.then){p.then(function(){done(true);},function(){fallback(text);done(false);});}
  else{fallback(text);done(false);}
}
function fallback(text){
  /* the textarea is always on the page next to the button, so a refused
     clipboard leaves a selected box the player can copy by hand */
  const ta=document.getElementById('shareBox');
  if(!ta)return;
  ta.value=text;ta.classList.remove('hidden');
  try{ta.focus();ta.setSelectionRange(0,text.length);}catch(e){}
}

/* =========================================================================
   LANTERNS — region logic
   An 8x8 board cut into 8 irregular regions. Light exactly one lantern in
   every row, every column and every region; no two lanterns may touch, not
   even at a corner.

   A random cut almost never yields a unique puzzle, so the generator carves
   towards one: it grows regions, asks the solver for a second answer, and
   moves one cell of the board across a region border to destroy it. It
   repeats until the solver can only find the intended answer.
   ========================================================================= */
const LN_N=8;

/* returns up to `limit` solutions plus the nodes the search visited */
function lanternSolve(region,N,limit){
  const colUsed=new Array(N).fill(false),regUsed=new Array(N).fill(false);
  const sols=[];let nodes=0;
  const pick=new Array(N).fill(-1);
  (function rec(r){
    if(sols.length>=limit)return;
    if(r===N){sols.push(pick.slice());return;}
    for(let c=0;c<N;c++){
      nodes++;
      if(colUsed[c])continue;
      if(r>0&&Math.abs(pick[r-1]-c)<=1)continue;
      const g=region[r*N+c];
      if(regUsed[g])continue;
      colUsed[c]=true;regUsed[g]=true;pick[r]=c;
      rec(r+1);
      colUsed[c]=false;regUsed[g]=false;pick[r]=-1;
      if(sols.length>=limit)return;
    }
  })(0);
  return{sols:sols,nodes:nodes};
}

function lnConnected(region,N,g,skip){
  let start=-1,total=0;
  for(let i=0;i<N*N;i++)if(region[i]===g&&i!==skip){if(start<0)start=i;total++;}
  if(start<0)return false;
  const seen=new Set([start]),st=[start];
  while(st.length){
    const i=st.pop(),r=(i/N)|0,c=i%N;
    const nb=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
    for(const[nr,nc]of nb){
      if(nr<0||nc<0||nr>=N||nc>=N)continue;
      const j=nr*N+nc;
      if(j===skip||region[j]!==g||seen.has(j))continue;
      seen.add(j);st.push(j);
    }
  }
  return seen.size===total;
}


/* A solver that only makes deductions a person can make, and reports how many
   rounds of them the puzzle needs. If this cannot finish the board, the board
   needs guessing and is thrown away. */
function lanternDeduce(region,N){
  const UNK=0,LIT=1,OUT=2;
  const st=new Uint8Array(N*N);
  const units=[];
  for(let r=0;r<N;r++){const u=[];for(let c=0;c<N;c++)u.push(r*N+c);units.push(u);}
  for(let c=0;c<N;c++){const u=[];for(let r=0;r<N;r++)u.push(r*N+c);units.push(u);}
  for(let g=0;g<N;g++){const u=[];for(let i=0;i<N*N;i++)if(region[i]===g)u.push(i);units.push(u);}
  let lit=0,bad=false;
  function light(i){
    if(st[i]===LIT)return;
    if(st[i]===OUT){bad=true;return;}
    st[i]=LIT;lit++;
    const r=(i/N)|0,c=i%N;
    for(let k=0;k<N;k++){
      if(k!==c&&st[r*N+k]===UNK)st[r*N+k]=OUT;
      if(k!==r&&st[k*N+c]===UNK)st[k*N+c]=OUT;
    }
    for(let j=0;j<N*N;j++)if(j!==i&&region[j]===region[i]&&st[j]===UNK)st[j]=OUT;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nc<0||nr>=N||nc>=N||(dr===0&&dc===0))continue;
      const j=nr*N+nc;
      if(st[j]===LIT)bad=true;
      else if(st[j]===UNK)st[j]=OUT;
    }
  }
  let rounds=0,confines=0;
  while(!bad&&lit<N&&rounds<80){
    rounds++;
    let changed=false;
    /* a unit with one square left must use it */
    for(const u of units){
      if(u.some(function(i){return st[i]===LIT;}))continue;
      const cand=u.filter(function(i){return st[i]===UNK;});
      if(cand.length===0){bad=true;break;}
      if(cand.length===1){light(cand[0]);changed=true;}
    }
    if(bad||lit>=N)break;
    if(changed)continue;
    /* every square a unit has left sits inside one row, column or region, so
       that other unit's lantern is this one's and the rest of it goes dark */
    for(const u of units){
      if(u.some(function(i){return st[i]===LIT;}))continue;
      const cand=u.filter(function(i){return st[i]===UNK;});
      if(cand.length<2)continue;
      const sameRow=cand.every(function(i){return ((i/N)|0)===((cand[0]/N)|0);});
      const sameCol=cand.every(function(i){return (i%N)===(cand[0]%N);});
      const sameReg=cand.every(function(i){return region[i]===region[cand[0]];});
      const kill=[];
      if(sameRow){const r=(cand[0]/N)|0;for(let c=0;c<N;c++){const j=r*N+c;if(st[j]===UNK&&cand.indexOf(j)<0)kill.push(j);}}
      if(sameCol){const c=cand[0]%N;for(let r=0;r<N;r++){const j=r*N+c;if(st[j]===UNK&&cand.indexOf(j)<0)kill.push(j);}}
      if(sameReg){const g=region[cand[0]];for(let j=0;j<N*N;j++)if(region[j]===g&&st[j]===UNK&&cand.indexOf(j)<0)kill.push(j);}
      if(kill.length){for(const j of kill)st[j]=OUT;changed=true;confines++;break;}
    }
    if(!changed)break;
  }
  const sol=[];
  if(!bad&&lit===N){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(st[r*N+c]===LIT)sol[r]=c;}
  return{solved:!bad&&lit===N,rounds:rounds,confines:confines,sol:sol,st:st};
}

function lanternGen(seed){
  const N=LN_N;
  for(let attempt=0;attempt<6000;attempt++){
    const rnd=rngFor(seed+'#lanterns#'+attempt);
    /* the intended answer: one lantern per row and column, never touching */
    const perm=[];let ok=true;
    for(let r=0;r<N;r++){
      const cand=[];
      for(let c=0;c<N;c++){
        if(perm.indexOf(c)>=0)continue;
        if(r>0&&Math.abs(perm[r-1]-c)<=1)continue;
        cand.push(c);
      }
      if(!cand.length){ok=false;break;}
      perm.push(cand[ri(rnd,cand.length)]);
    }
    if(!ok)continue;

    /* grow 8 connected regions, one seeded on each lantern. Growth walks from
       the region's newest cell most of the time, which makes long crooked
       regions rather than blobs — blobs barely constrain anything. */
    const region=new Array(N*N).fill(-1),size=new Array(N).fill(1),tip=new Array(N);
    const cells=[],isSeed=new Array(N*N).fill(false);
    for(let r=0;r<N;r++){const i=r*N+perm[r];region[i]=r;tip[r]=i;isSeed[i]=true;cells.push([i]);}
    let placed=N,stuck=false;
    const order=[];for(let g=0;g<N;g++)order.push(g);
    while(placed<N*N&&!stuck){
      shuffle(rnd,order);
      order.sort(function(a,b){return size[a]-size[b];});
      let grew=false;
      for(const g of order){
        const near=[],far=[];
        for(const i of cells[g]){
          const r=(i/N)|0,c=i%N;
          if(r>0&&region[i-N]===-1)(i===tip[g]?near:far).push(i-N);
          if(r<N-1&&region[i+N]===-1)(i===tip[g]?near:far).push(i+N);
          if(c>0&&region[i-1]===-1)(i===tip[g]?near:far).push(i-1);
          if(c<N-1&&region[i+1]===-1)(i===tip[g]?near:far).push(i+1);
        }
        const pool=(near.length&&rnd()<0.75)?near:(far.length?far:near);
        if(!pool.length)continue;
        const cell=pool[ri(rnd,pool.length)];
        region[cell]=g;cells[g].push(cell);tip[g]=cell;size[g]++;placed++;grew=true;break;
      }
      if(!grew)stuck=true;
    }
    if(stuck||placed<N*N)continue;

    /* Carve towards a board that comes out by deduction alone. Deduction with
       sound rules cannot reach two different answers, so a board the deducer
       finishes is a board with exactly one answer — the exhaustive solver is
       kept for the audit rather than for the player's benefit. */
    let ded=lanternDeduce(region,N),carves=0;
    while(!ded.solved&&carves<160){
      /* squares deduction could not settle, that the answer does not use:
         pushing one across a region border removes a place to hesitate */
      const stuckCells=[];
      for(let i=0;i<N*N;i++){
        if(ded.st[i]!==0)continue;
        const r=(i/N)|0;
        if(perm[r]===i%N)continue;
        if(isSeed[i])continue;
        stuckCells.push(i);
      }
      if(!stuckCells.length)break;
      shuffle(rnd,stuckCells);
      let moved=false;
      for(const i of stuckCells){
        const g=region[i];
        if(size[g]<=3)continue;
        const r=(i/N)|0,c=i%N,opts=[];
        if(r>0&&region[i-N]!==g)opts.push(region[i-N]);
        if(r<N-1&&region[i+N]!==g)opts.push(region[i+N]);
        if(c>0&&region[i-1]!==g)opts.push(region[i-1]);
        if(c<N-1&&region[i+1]!==g)opts.push(region[i+1]);
        if(!opts.length)continue;
        if(!lnConnected(region,N,g,i))continue;
        const h=opts[ri(rnd,opts.length)];
        region[i]=h;size[g]--;size[h]++;
        cells[g].splice(cells[g].indexOf(i),1);cells[h].push(i);
        moved=true;break;
      }
      if(!moved)break;
      carves++;
      ded=lanternDeduce(region,N);
    }
    if(!ded.solved)continue;
    let same=true;for(let r=0;r<N;r++)if(ded.sol[r]!==perm[r])same=false;
    if(!same)continue;
    /* keep the day-to-day difficulty in a band */
    if(ded.rounds<4||ded.rounds>11)continue;
    let minSize=99;for(let g=0;g<N;g++)minSize=Math.min(minSize,size[g]);
    if(minSize<3)continue;
    return{region:region,sol:perm,rounds:ded.rounds,confines:ded.confines,carves:carves,attempt:attempt,N:N};
  }
  return null;
}
/* =========================================================================
   LEDGER — arithmetic
   A 5x5 grid of digits with a total beside every row and under every column.
   Cross out digits until each row and each column adds up to its total.

   The commercial version of this idea is famously ambiguous: most randomly
   built grids have several valid answers, which is survivable when everyone
   gets a different grid and fatal when everyone gets the same one. Every grid
   here is counted exhaustively and only the ones with a single answer ship.
   ========================================================================= */
const LG_N=6;

/* counts answers up to `limit`; also reports the nodes the search visited,
   which is what "how much work is this" is measured with */
function ledgerCount(vals,N,rowT,colT,limit){
  const rowSubsets=[];
  for(let r=0;r<N;r++){
    const list=[];
    for(let m=0;m<(1<<N);m++){
      let s=0;
      for(let c=0;c<N;c++)if(m&(1<<c))s+=vals[r*N+c];
      if(s===rowT[r])list.push(m);
    }
    if(!list.length)return{count:0,nodes:0,sol:null};
    rowSubsets.push(list);
  }
  /* most-constrained row first keeps the search honest about its own size */
  const order=[];for(let r=0;r<N;r++)order.push(r);
  order.sort(function(a,b){return rowSubsets[a].length-rowSubsets[b].length;});
  const maxLeft=new Array(N+1).fill(0);

  let count=0,nodes=0,first=null;
  const chosen=new Array(N).fill(0);
  const colSum=new Array(N).fill(0);
  const remainRows=new Array(N+1).fill(null);
  for(let k=N;k>=0;k--){
    const rem=new Array(N).fill(0);
    for(let idx=k;idx<N;idx++){
      const r=order[idx];
      for(let c=0;c<N;c++)rem[c]+=vals[r*N+c];
    }
    remainRows[k]=rem;
  }
  (function rec(k){
    if(count>=limit)return;
    if(k===N){
      for(let c=0;c<N;c++)if(colSum[c]!==colT[c])return;
      count++;if(count===1)first=chosen.slice();
      return;
    }
    const r=order[k],rem=remainRows[k+1];
    for(const m of rowSubsets[r]){
      nodes++;
      let ok=true;
      for(let c=0;c<N;c++){
        const add=(m&(1<<c))?vals[r*N+c]:0;
        const s=colSum[c]+add;
        if(s>colT[c]||s+rem[c]<colT[c]){ok=false;break;}
      }
      if(!ok)continue;
      for(let c=0;c<N;c++)if(m&(1<<c))colSum[c]+=vals[r*N+c];
      chosen[r]=m;
      rec(k+1);
      for(let c=0;c<N;c++)if(m&(1<<c))colSum[c]-=vals[r*N+c];
      if(count>=limit)return;
    }
  })(0);
  return{count:count,nodes:nodes,sol:first};
}


/* The same board seen the way a person sees it: for each line, which of its
   32 keep/cross patterns still fit the total and what is already known. A cell
   in every surviving pattern stays; a cell in none is crossed. Rounds of this
   are the difficulty number. A grid this cannot finish needs guessing, and is
   thrown away. */
function ledgerDeduce(vals,N,rowT,colT){
  const st=new Uint8Array(N*N); /* 0 unknown 1 keep 2 cross */
  const lines=[];
  for(let r=0;r<N;r++){const u=[];for(let c=0;c<N;c++)u.push(r*N+c);lines.push({cells:u,t:rowT[r]});}
  for(let c=0;c<N;c++){const u=[];for(let r=0;r<N;r++)u.push(r*N+c);lines.push({cells:u,t:colT[c]});}
  let rounds=0,bad=false;
  for(;;){
    let changed=false;rounds++;
    if(rounds>60){bad=true;break;}
    for(const ln of lines){
      let all=(1<<N)-1,none=(1<<N)-1,found=0;
      for(let m=0;m<(1<<N);m++){
        let s=0,ok=true;
        for(let k=0;k<N;k++){
          const i=ln.cells[k],on=(m>>k)&1;
          if(st[i]===1&&!on){ok=false;break;}
          if(st[i]===2&&on){ok=false;break;}
          if(on)s+=vals[i];
        }
        if(!ok||s!==ln.t)continue;
        found++;all&=m;none&=~m&((1<<N)-1);
      }
      if(!found){bad=true;break;}
      for(let k=0;k<N;k++){
        const i=ln.cells[k];
        if(st[i]!==0)continue;
        if(all&(1<<k)){st[i]=1;changed=true;}
        else if(none&(1<<k)){st[i]=2;changed=true;}
      }
    }
    if(bad)break;
    let open=0;for(let i=0;i<N*N;i++)if(st[i]===0)open++;
    if(open===0)break;
    if(!changed)break;
  }
  let open=0;for(let i=0;i<N*N;i++)if(st[i]===0)open++;
  return{solved:!bad&&open===0,rounds:rounds,st:st};
}

function ledgerGen(seed){
  const N=LG_N;
  for(let attempt=0;attempt<3000;attempt++){
    const rnd=rngFor(seed+'#ledger#'+attempt);
    const vals=new Array(N*N),keep=new Array(N*N);
    for(let i=0;i<N*N;i++)vals[i]=1+ri(rnd,9);
    let kept=0;
    for(let i=0;i<N*N;i++){keep[i]=rnd()<0.56?1:0;kept+=keep[i];}
    /* a grid where almost everything stays, or almost nothing, is not a puzzle */
    if(kept<17||kept>23)continue;
    const rowT=new Array(N).fill(0),colT=new Array(N).fill(0);
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(keep[r*N+c]){rowT[r]+=vals[r*N+c];colT[c]+=vals[r*N+c];}
    /* an empty or untouched line gives the whole row away for free */
    let trivial=false;
    for(let r=0;r<N;r++){
      let k=0;for(let c=0;c<N;c++)k+=keep[r*N+c];
      if(k===0||k===N)trivial=true;
    }
    for(let c=0;c<N;c++){
      let k=0;for(let r=0;r<N;r++)k+=keep[r*N+c];
      if(k===0||k===N)trivial=true;
    }
    if(trivial)continue;

    const res=ledgerCount(vals,N,rowT,colT,2);
    if(res.count!==1)continue;
    const ded=ledgerDeduce(vals,N,rowT,colT);
    if(!ded.solved)continue;
    if(ded.rounds<3||ded.rounds>6)continue;
    return{vals:vals,keep:keep,rowT:rowT,colT:colT,rounds:ded.rounds,nodes:res.nodes,
           kept:kept,attempt:attempt,N:N};
  }
  return null;
}
/* =========================================================================
   TESSERA — spatial
   Five five-square pieces and a ragged hole to put them in. Turn them over,
   spin them round, fill it exactly.

   Rectangles were the obvious board and they are the wrong one: a 6x5
   rectangle cut into five pentominoes can almost always be reassembled some
   other way, so nothing about it is ever certain. A ragged outline constrains
   hard enough that about four cut-ups in ten have a single arrangement, and
   an exact-cover count throws the rest away.
   ========================================================================= */
const TS_W=7,TS_H=6,TS_PIECES=5,TS_SIZE=5;

/* canonical name of a shape under the eight square symmetries */
function tsNorm(cells){
  let best=null;
  for(let t=0;t<8;t++){
    const v=cells.map(function(p){
      let x=p[0],y=p[1];
      if(t&4){const s=x;x=y;y=s;}
      if(t&1)x=-x;
      if(t&2)y=-y;
      return[x,y];
    });
    let mx=Infinity,my=Infinity;
    for(const p of v){if(p[0]<mx)mx=p[0];if(p[1]<my)my=p[1];}
    const s=v.map(function(p){return[p[0]-mx,p[1]-my];})
             .sort(function(a,b){return a[1]-b[1]||a[0]-b[0];})
             .map(function(p){return p[0]+','+p[1];}).join(' ');
    if(best===null||s<best)best=s;
  }
  return best;
}
/* every orientation of a shape, normalised to the origin */
function tsOrients(cells){
  const seen={},out=[];
  for(let t=0;t<8;t++){
    let v=cells.map(function(p){
      let x=p[0],y=p[1];
      if(t&4){const s=x;x=y;y=s;}
      if(t&1)x=-x;
      if(t&2)y=-y;
      return[x,y];
    });
    let mx=Infinity,my=Infinity;
    for(const p of v){if(p[0]<mx)mx=p[0];if(p[1]<my)my=p[1];}
    v=v.map(function(p){return[p[0]-mx,p[1]-my];})
       .sort(function(a,b){return a[1]-b[1]||a[0]-b[0];});
    const k=v.map(function(p){return p[0]+','+p[1];}).join(' ');
    if(seen[k])continue;
    seen[k]=1;out.push(v);
  }
  return out;
}
/* every way a shape lands inside the board, as a sorted list of board slots */
function tsPlacements(cells,slots,W,H){
  const seen={},out=[];
  for(const v of tsOrients(cells)){
    for(let oy=0;oy<H;oy++)for(let ox=0;ox<W;ox++){
      const ids=[];let ok=true;
      for(const p of v){
        const gx=p[0]+ox,gy=p[1]+oy;
        if(gx<0||gy<0||gx>=W||gy>=H){ok=false;break;}
        const id=slots[gy*W+gx];
        if(id===undefined||id<0){ok=false;break;}
        ids.push(id);
      }
      if(!ok)continue;
      ids.sort(function(a,b){return a-b;});
      const k=ids.join(',');
      if(seen[k])continue;
      seen[k]=1;out.push(ids);
    }
  }
  return out;
}
/* how many ways the multiset of shapes fills the board, up to `limit`.
   Filling the lowest empty slot first counts each arrangement once, so two
   identical pieces swapping places is never mistaken for a second answer. */
function tesseraCount(shapes,slots,nSlots,W,H,limit){
  const types=[],counts=[],rep=[];
  for(const s of shapes){
    const k=types.indexOf(s.key);
    if(k<0){types.push(s.key);counts.push(1);rep.push(s.cells);}else counts[k]++;
  }
  const byLow=types.map(function(_,k){
    const t=[];for(let i=0;i<nSlots;i++)t.push([]);
    for(const ids of tsPlacements(rep[k],slots,W,H))t[ids[0]].push(ids);
    return t;
  });
  const occ=new Array(nSlots).fill(false);
  let found=0,nodes=0,first=null;
  const used=[];
  (function rec(filled){
    if(found>=limit)return;
    if(filled===nSlots){found++;if(found===1)first=used.map(function(u){return{t:u.t,ids:u.ids.slice()};});return;}
    let low=0;while(occ[low])low++;
    for(let k=0;k<types.length;k++){
      if(!counts[k])continue;
      for(const ids of byLow[k][low]){
        nodes++;
        let clash=false;
        for(const i of ids)if(occ[i]){clash=true;break;}
        if(clash)continue;
        for(const i of ids)occ[i]=true;
        counts[k]--;used.push({t:k,ids:ids});
        rec(filled+ids.length);
        used.pop();counts[k]++;
        for(const i of ids)occ[i]=false;
        if(found>=limit)return;
      }
    }
  })(0);
  return{count:found,nodes:nodes,sol:first,types:types};
}

function tesseraGen(seed){
  const W=TS_W,H=TS_H,TOT=TS_PIECES*TS_SIZE;
  for(let attempt=0;attempt<3000;attempt++){
    const rnd=rngFor(seed+'#tessera#'+attempt);
    /* a ragged connected board */
    const inb=new Set([ri(rnd,W*H)]);
    let grewAll=true;
    while(inb.size<TOT){
      const front=[];
      for(const i of inb){
        const x=i%W,y=(i/W)|0;
        if(x>0&&!inb.has(i-1))front.push(i-1);
        if(x<W-1&&!inb.has(i+1))front.push(i+1);
        if(y>0&&!inb.has(i-W))front.push(i-W);
        if(y<H-1&&!inb.has(i+W))front.push(i+W);
      }
      if(!front.length){grewAll=false;break;}
      inb.add(front[ri(rnd,front.length)]);
    }
    if(!grewAll)continue;

    /* cut it into five connected fives, never leaving a scrap that cannot be
       a whole number of pieces */
    const rem=new Set(inb),pieces=[];
    let cutOk=true;
    for(let p=0;p<TS_PIECES;p++){
      let low=Infinity;for(const i of rem)if(i<low)low=i;
      let placed=false;
      for(let tries=0;tries<50&&!placed;tries++){
        const pc=[low],mine=new Set([low]);
        while(pc.length<TS_SIZE){
          const front=[];
          for(const i of pc){
            const x=i%W,y=(i/W)|0;
            if(x>0&&rem.has(i-1)&&!mine.has(i-1))front.push(i-1);
            if(x<W-1&&rem.has(i+1)&&!mine.has(i+1))front.push(i+1);
            if(y>0&&rem.has(i-W)&&!mine.has(i-W))front.push(i-W);
            if(y<H-1&&rem.has(i+W)&&!mine.has(i+W))front.push(i+W);
          }
          if(!front.length)break;
          const c=front[ri(rnd,front.length)];pc.push(c);mine.add(c);
        }
        if(pc.length<TS_SIZE)continue;
        for(const i of pc)rem.delete(i);
        if(tsLeftoverOk(rem,W,H,TS_SIZE)){pieces.push(pc);placed=true;}
        else for(const i of pc)rem.add(i);
      }
      if(!placed){cutOk=false;break;}
    }
    if(!cutOk)continue;

    const shapes=pieces.map(function(g){
      const cells=g.map(function(i){return[i%W,(i/W)|0];});
      return{cells:cells,key:tsNorm(cells),board:g.slice()};
    });
    const distinct={};for(const s of shapes)distinct[s.key]=1;
    const kinds=Object.keys(distinct).length;
    /* five copies of one shape is a board with nothing to read */
    if(kinds<3)continue;

    const list=Array.from(inb).sort(function(a,b){return a-b;});
    const slots=new Array(W*H).fill(-1);
    list.forEach(function(cell,i){slots[cell]=i;});

    const res=tesseraCount(shapes,slots,list.length,W,H,2);
    if(res.count!==1)continue;
    /* an easy pack falls out in a handful of tries; a hard one wanders */
    if(res.nodes<220||res.nodes>1500)continue;
    return{shapes:shapes,cells:list,slots:slots,W:W,H:H,
           nodes:res.nodes,kinds:kinds,attempt:attempt};
  }
  return null;
}
function tsLeftoverOk(rem,W,H,size){
  const s=new Set(rem);
  while(s.size){
    const start=s.values().next().value;
    s.delete(start);
    const st=[start];let n=0;
    while(st.length){
      const i=st.pop();n++;
      const x=i%W,y=(i/W)|0;
      const nb=[x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1];
      for(const j of nb)if(j>=0&&s.has(j)){s.delete(j);st.push(j);}
    }
    if(n%size!==0)return false;
  }
  return true;
}
/* =========================================================================
   RUNGS — word ladder
   Climb from the first word to the last, changing one letter at a time, and
   every rung has to be a word. The number of rungs is fixed, and the pair is
   chosen so that exactly one chain of that length exists — a breadth-first
   count of shortest paths, run over the whole word graph, picks them.
   ========================================================================= */
const RG_LEN=4;
let RG_GRAPH=null;

function rungsGraph(){
  if(RG_GRAPH)return RG_GRAPH;
  const idx={},adj=[];
  WORDS4.forEach(function(w,i){idx[w]=i;adj.push([]);});
  const buckets={};
  WORDS4.forEach(function(w,i){
    for(let k=0;k<4;k++){
      const key=w.slice(0,k)+'*'+w.slice(k+1);
      (buckets[key]||(buckets[key]=[])).push(i);
    }
  });
  for(const key in buckets){
    const b=buckets[key];
    for(let a=0;a<b.length;a++)for(let c=a+1;c<b.length;c++){
      adj[b[a]].push(b[c]);adj[b[c]].push(b[a]);
    }
  }
  RG_GRAPH={idx:idx,adj:adj,words:WORDS4};
  return RG_GRAPH;
}
/* distance from `src` to everything, and how many shortest chains reach it */
function rungsBFS(g,src){
  const n=g.words.length;
  const dist=new Int16Array(n).fill(-1),cnt=new Float64Array(n);
  dist[src]=0;cnt[src]=1;
  const q=[src];
  for(let h=0;h<q.length;h++){
    const x=q[h];
    for(const y of g.adj[x]){
      if(dist[y]<0){dist[y]=dist[x]+1;cnt[y]=cnt[x];q.push(y);}
      else if(dist[y]===dist[x]+1)cnt[y]+=cnt[x];
    }
  }
  return{dist:dist,cnt:cnt};
}
function rungsGen(seed,steps){
  const g=rungsGraph();
  const L=steps||RG_LEN;
  for(let attempt=0;attempt<600;attempt++){
    const rnd=rngFor(seed+'#rungs#'+attempt);
    const src=ri(rnd,g.words.length);
    if(g.adj[src].length<2)continue;
    const b=rungsBFS(g,src);
    /* every word exactly L moves away that only one chain reaches */
    const targets=[];
    for(let i=0;i<g.words.length;i++)if(b.dist[i]===L&&b.cnt[i]===1&&g.adj[i].length>=2)targets.push(i);
    if(!targets.length)continue;
    const dst=targets[ri(rnd,targets.length)];
    /* walk the one chain back */
    const back=rungsBFS(g,dst);
    const path=[dst];
    let cur=dst;
    for(let k=L-1;k>=0;k--){
      const nxt=g.adj[cur].filter(function(y){return b.dist[y]===k;});
      if(nxt.length!==1)break;
      cur=nxt[0];path.push(cur);
    }
    if(path.length!==L+1)continue;
    path.reverse();
    if(path[0]!==src)continue;
    /* how wide the choice is at each rung: the real-word neighbours of the
       word you are standing on, minus the one you came from */
    let branch=0,worst=0;
    for(let k=0;k<L;k++){
      const d=g.adj[path[k]].length-(k>0?1:0);
      branch+=d;if(d>worst)worst=d;
    }
    const mean=branch/L;
    /* a rung with one option is a corridor; a rung with fifteen is a lottery */
    if(mean<4.2||mean>9)continue;
    if(worst>16)continue;
    return{
      words:path.map(function(i){return g.words[i].toUpperCase();}),
      steps:L,branch:Math.round(mean*10)/10,worst:worst,attempt:attempt,
      degrees:path.map(function(i){return g.adj[i].length;})
    };
  }
  return null;
}
/* the player's typed word, judged */
function rungsJudge(prev,word,target,idxSet){
  const w=word.toLowerCase();
  if(w.length!==4||!/^[a-z]{4}$/.test(w))return'shape';
  if(!idxSet[w])return'word';
  let diff=0;
  for(let i=0;i<4;i++)if(w[i]!==prev[i].toLowerCase())diff++;
  if(diff!==1)return'step';
  return'ok';
}
/* =========================================================================
   MERIDIAN — geography
   One country a day. Every guess answers with the great-circle distance to
   the answer and the direction to walk. Nothing is drawn and nothing is
   named: the only thing a guess tells you is where it stands relative to the
   place you are looking for.
   ========================================================================= */
const COUNTRIES=(function(){
  return COUNTRY_SRC.split(';').map(function(row){
    const p=row.split('|');
    return{name:p[0],lat:+p[1],lon:+p[2],big:p[3]==='1'};
  });
})();
const MER_POOL=COUNTRIES.filter(function(c){return c.big;});

function haversine(a,b){
  const R=6371,rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad;
  const s=Math.sin(dLat/2)*Math.sin(dLat/2)+
    Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function bearing(a,b){
  const rad=Math.PI/180;
  const y=Math.sin((b.lon-a.lon)*rad)*Math.cos(b.lat*rad);
  const x=Math.cos(a.lat*rad)*Math.sin(b.lat*rad)-
          Math.sin(a.lat*rad)*Math.cos(b.lat*rad)*Math.cos((b.lon-a.lon)*rad);
  return(Math.atan2(y,x)/rad+360)%360;
}
const MER_ARROWS=['↑','↗','→','↘','↓','↙','←','↖'];
function octant(deg){return Math.round(deg/45)%8;}
/* distances are rounded before they are shown, so the solver must work with
   exactly what the player is given and never with more */
function merRound(km){return Math.round(km/10)*10;}
function merFeedback(guess,answer){
  const km=merRound(haversine(guess,answer));
  return{km:km,oct:km===0?-1:octant(bearing(guess,answer))};
}
function merConsistent(pool,history){
  return pool.filter(function(c){
    for(const h of history){
      const f=merFeedback(h.guess,c);
      if(f.km!==h.km||f.oct!==h.oct)return false;
    }
    return true;
  });
}
/* Drawing a country at random repeats one about every fortnight, which on a
   daily puzzle reads as a bug. Instead the pool is shuffled once per cycle and
   dealt out in order: no country comes back until all 161 have been. */
function meridianGen(seed){
  const n=dayNumber(seed);
  const cycle=Math.floor(n/MER_POOL.length);
  const deck=shuffle(rngFor('meridian-deck#'+cycle),MER_POOL.slice());
  return{answer:deck[n-cycle*MER_POOL.length],pool:COUNTRIES};
}
/* A bot that plays the way the feedback allows: keep every country still
   consistent with what has been said, then guess the one that splits that
   set most evenly. It is the solver — if it finishes, the day is solvable,
   and the number of guesses is the difficulty. */
function meridianSolve(answer,maxGuesses){
  let live=COUNTRIES.slice();
  const history=[];
  for(let n=1;n<=(maxGuesses||14);n++){
    let pick=null;
    if(history.length===0){
      pick=COUNTRIES.find(function(c){return c.name==='Turkmenistan';})||COUNTRIES[0];
    }else if(live.length<=2){
      pick=live[0];
    }else{
      let bestScore=Infinity;
      /* candidates are drawn from what is still alive plus a spread of the
         whole list, so the bot can ask a question it knows the answer is not */
      const probes=live.concat(COUNTRIES.filter(function(_,i){return i%7===0;}));
      for(const p of probes){
        const buckets={};
        for(const c of live){
          const f=merFeedback(p,c);
          const k=f.km+':'+f.oct;
          buckets[k]=(buckets[k]||0)+1;
        }
        let worst=0;
        for(const k in buckets)if(buckets[k]>worst)worst=buckets[k];
        if(worst<bestScore){bestScore=worst;pick=p;}
      }
    }
    const f=merFeedback(pick,answer);
    history.push({guess:pick,km:f.km,oct:f.oct});
    if(f.km===0&&pick.name===answer.name)return{guesses:n,history:history,live:1};
    live=merConsistent(live,history).filter(function(c){return c.name!==pick.name||f.km===0;});
    if(!live.length)return{guesses:-1,history:history,live:0};
  }
  return{guesses:-1,history:history,live:live.length};
}

/* The exact solver above proves the day is decidable, but it reads the rounded
   kilometres as a fingerprint, which no person does. This second bot is the
   difficulty instrument: it walks. It takes its best guess so far, steps the
   reported distance along the reported heading, and names the nearest country
   it has not tried yet — which is what a player does with a mental map. */
function meridianWalk(answer,maxGuesses){
  const tried={};
  let best=null,bestKm=Infinity;
  let cur=COUNTRIES.find(function(c){return c.name==='Egypt';});
  for(let n=1;n<=(maxGuesses||25);n++){
    tried[cur.name]=1;
    const f=merFeedback(cur,answer);
    if(f.km===0&&cur.name===answer.name)return{guesses:n};
    if(f.km<bestKm){bestKm=f.km;best=cur;}
    /* step bestKm along the octant from the best guess so far */
    const fb=merFeedback(best,answer);
    const th=fb.oct*45*Math.PI/180,d=fb.km/6371;
    const la=best.lat*Math.PI/180,lo=best.lon*Math.PI/180;
    const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(th));
    const lo2=lo+Math.atan2(Math.sin(th)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));
    const aim={lat:la2*180/Math.PI,lon:((lo2*180/Math.PI+540)%360)-180};
    let pick=null,pd=Infinity;
    for(const c of COUNTRIES){
      if(tried[c.name])continue;
      const d2=haversine(aim,c);
      if(d2<pd){pd=d2;pick=c;}
    }
    if(!pick)break;
    cur=pick;
  }
  return{guesses:-1};
}

/* a short beep, built rather than loaded */
let AC=null;
function blip(freq,dur,type){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09,AC.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}

  good:function(){blip(660,0.09);},

  tick:function(){blip(420,0.04);}
};

}
function combinedShare(date){
  const lines=['Five Rungs '+date+' (UTC)'];

/* =========================================================================
   The five front ends. Each one owns a generator, a board, and the rules for
   what counts as a square in the result grid.
   ========================================================================= */
function cellPx(cols,max){
  const w=Math.min(window.innerWidth,560)-40;
  return Math.max(26,Math.min(max||46,Math.floor(w/cols)));
}
function gridEl(cols,size){
  const g=el('div','grid');
  g.style.gridTemplateColumns='repeat('+cols+','+size+'px)';
  return g;
}
const REGION_HUES=[205,152,44,276,12,186,96,320];

/* ========================= LANTERNS ========================= */
PUZZLES.push({
  id:'lanterns',kind:'logic',name:'Lanterns',
  blurb:'One lantern per row, column and region',
  icon:'<circle cx="12" cy="10" r="4"/><path d="M12 14v6M8 20h8"/>',
  rules:'Light <b>one lantern in every row, every column and every region</b>. '+
        'No two lanterns may touch, not even diagonally. Tap once for a lantern, '+
        'twice for a pencil dot, three times to clear.',
  gen:function(date){return lanternGen(date);},
  shareTail:function(r){return r.st==='won'?('lit in '+r.marks.length+' placements'):'unfinished';},
  winTitle:function(r){return 'All eight lit';},
  loseTitle:function(){return 'Not this time';},
  resultNote:function(r){
    const bad=r.marks.filter(function(m){return m==='🟥';}).length;
    return bad===0?'Eight lanterns, no wrong turns.':
      'Eight lanterns, '+bad+' of them put somewhere the answer did not want them.';
  },
  mount:function(stage,p,api){
    const N=p.N,size=cellPx(N,44);
    const st=(api.rec.board&&api.rec.board.length===N*N)?api.rec.board.slice():new Array(N*N).fill(0);
    const marks=api.rec.marks?api.rec.marks.slice():[];
    const g=gridEl(N,size);
    /* a hairline between every pair of squares, so rows and columns can be
       counted, and a thick one wherever two regions meet */
    g.style.gap='1px';
    const cells=[];
    for(let i=0;i<N*N;i++){
      const c=el('div','cell');
      c.style.width=size+'px';c.style.height=size+'px';
      c.style.fontSize=Math.round(size*0.5)+'px';
      const h=REGION_HUES[p.region[i]];
      c.style.background='hsl('+h+' 30% 21%)';
      c.dataset.i=i;
      /* a heavier line wherever two regions meet */
      const r=(i/N)|0,col=i%N,sh=[];
      if(r>0&&p.region[i-N]!==p.region[i])sh.push('inset 0 2.5px 0 var(--fg)');
      if(r<N-1&&p.region[i+N]!==p.region[i])sh.push('inset 0 -2.5px 0 var(--fg)');
      if(col>0&&p.region[i-1]!==p.region[i])sh.push('inset 2.5px 0 0 var(--fg)');
      if(col<N-1&&p.region[i+1]!==p.region[i])sh.push('inset -2.5px 0 0 var(--fg)');
      if(sh.length)c.style.boxShadow=sh.join(',');
      c.onclick=function(){tap(i);};
      cells.push(c);g.appendChild(c);
    }
    stage.appendChild(g);

    const bar=el('div','bar');
    const clr=el('button','btn','Clear board');
    clr.onclick=function(){for(let i=0;i<N*N;i++)st[i]=0;paint();persist();};
    bar.appendChild(clr);
    stage.appendChild(bar);
    const info=el('div','stat');
    stage.appendChild(info);

    function conflicts(){
      const bad=new Set();
      const lit=[];
      for(let i=0;i<N*N;i++)if(st[i]===1)lit.push(i);
      for(let a=0;a<lit.length;a++)for(let b=a+1;b<lit.length;b++){
        const i=lit[a],j=lit[b];
        const ri=(i/N)|0,ci=i%N,rj=(j/N)|0,cj=j%N;
        if(ri===rj||ci===cj||p.region[i]===p.region[j]||
           (Math.abs(ri-rj)<=1&&Math.abs(ci-cj)<=1)){bad.add(i);bad.add(j);}
      }
      return{bad:bad,lit:lit};
    }
    function paint(){
      const cf=conflicts();
      for(let i=0;i<N*N;i++){
        const c=cells[i];
        c.textContent=st[i]===1?'●':st[i]===2?'·':'';
        c.style.color=st[i]===1?(cf.bad.has(i)?'var(--bad)':'#fff'):'var(--dim2)';
      }
      info.innerHTML='';
      const a=el('div','');a.innerHTML='<b>'+cf.lit.length+'</b>/'+N+' lit';
      info.appendChild(a);
      const b=el('div','');b.innerHTML='<b>'+cf.bad.size+'</b> clashing';
      info.appendChild(b);
    }
    function persist(){
      if(api.rec.st!=='open')return;
      api.save({st:'open',marks:marks,board:st.slice()});
    }
    function tap(i){
      if(api.rec.st!=='open')return;
      const was=st[i];
      st[i]=(st[i]+1)%3;
      if(st[i]===1){
        const right=p.sol[(i/N)|0]===i%N;
        marks.push(right?'🟩':'🟥');
        if(right)SFX.good();else SFX.tick();
      }else SFX.tick();
      paint();
      if(was!==1&&st[i]===1)check();
      else persist();
    }
    function check(){
      const cf=conflicts();
      if(cf.lit.length!==N||cf.bad.size)return persist();
      for(let r=0;r<N;r++)if(st[r*N+p.sol[r]]!==1)return persist();
      api.finish(true,{st:'won',marks:marks,board:st.slice()});
      g.style.borderColor='var(--good)';
    }
    paint();
  }
});

const PIECE_HUES=[205,152,44,276,12];
PUZZLES.push({
  id:'tessera',kind:'space',name:'Tessera',
  blurb:'Five pieces, one ragged hole, one way in',
  icon:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',
  rules:'Fit all five pieces into the outline. Pick a piece, <b>turn or flip it</b>, then tap the '+
        'square where its <b>ringed corner</b> should land. Tap a placed piece to take it back. '+
        'Exactly one arrangement fits.',
  gen:function(date){return tesseraGen(date);},
  shareTail:function(r){return r.st==='won'?('packed in '+r.marks.length+' placements'):'unfinished';},
  winTitle:function(){return 'It fits';},
  loseTitle:function(){return 'Still loose';},
  resultNote:function(r){
    const bad=r.marks.filter(function(m){return m==='🟥';}).length;
    return bad===0?'Five pieces, five placements, no second thoughts.':
      bad+' placements went somewhere the answer did not have them.';
  },
  mount:function(stage,p,api){
    const W=p.W,H=p.H,size=cellPx(W,44);
    const marks=api.rec.marks?api.rec.marks.slice():[];
    /* placed[k] = array of board cell indices, or null */
    const placed=new Array(p.shapes.length).fill(null);
    if(api.rec.board&&api.rec.board.length===p.shapes.length){
      for(let k=0;k<p.shapes.length;k++)if(api.rec.board[k])placed[k]=api.rec.board[k].slice();
    }
    const orients=p.shapes.map(function(s){return tsOrients(s.cells);});
    const rot=new Array(p.shapes.length).fill(0);
    let sel=-1;

    /* the outline is the puzzle, so it has to read as a shape: squares outside
       it are not drawn at all, and the ones inside carry the border */
    const g=gridEl(W,size);
    g.style.cssText+=';background:transparent;border:none;gap:2px';
    const cells=[];
    for(let i=0;i<W*H;i++){
      const c=el('div','cell');
      c.style.width=size+'px';c.style.height=size+'px';
      if(p.slots[i]<0){
        c.style.cssText+=';background:transparent;cursor:default;visibility:hidden';
      }else{
        c.style.borderRadius='4px';
        c.style.boxShadow='inset 0 0 0 1.5px var(--line2)';
      }
      c.onclick=function(){boardTap(i);};
      cells.push(c);g.appendChild(c);
    }
    stage.appendChild(g);

    const ctl=el('div','bar');
    const rotB=el('button','btn','↻ Turn / flip');
    rotB.onclick=function(){
      if(sel<0)return api.msg('Pick a piece first.','wa');
      rot[sel]=(rot[sel]+1)%orients[sel].length;SFX.tick();drawTray();
    };
    ctl.appendChild(rotB);
    const clrB=el('button','btn','Clear board');
    clrB.onclick=function(){
      for(let k=0;k<placed.length;k++)placed[k]=null;
      sel=-1;paint();drawTray();persist();
    };
    ctl.appendChild(clrB);
    stage.appendChild(ctl);

    const tray=el('div','bar tray');
    tray.style.cssText='gap:10px;margin-top:2px';
    stage.appendChild(tray);

    function drawTray(){
      tray.innerHTML='';
      p.shapes.forEach(function(s,k){
        if(placed[k])return;
        const v=orients[k][rot[k]];
        let w=0,h=0;
        for(const c of v){if(c[0]+1>w)w=c[0]+1;if(c[1]+1>h)h=c[1]+1;}
        const mini=el('button','');
        mini.type='button';
        const ms=Math.max(11,Math.floor(size*0.42));
        mini.style.cssText='display:grid;gap:2px;padding:7px;border-radius:9px;border:2px solid '+
          (sel===k?'hsl('+PIECE_HUES[k]+' 60% 60%)':'var(--line)')+';background:var(--bg2);'+
          'grid-template-columns:repeat('+w+','+ms+'px)';
        for(let y=0;y<h;y++)for(let x=0;x<w;x++){
          const on=v.some(function(c){return c[0]===x&&c[1]===y;});
          const d=el('div','');
          const anchor=on&&v[0][0]===x&&v[0][1]===y;
          d.style.cssText='width:'+ms+'px;height:'+ms+'px;border-radius:2px;background:'+
            (on?'hsl('+PIECE_HUES[k]+' 52% 52%)':'transparent')+
            (anchor?';box-shadow:inset 0 0 0 2px #fff':'');
          mini.appendChild(d);
        }
        mini.onclick=function(){sel=(sel===k?-1:k);SFX.tick();drawTray();api.msg(sel<0?'':'Now tap the square its ringed corner should land on.');};
        tray.appendChild(mini);
      });
      if(!tray.children.length)tray.appendChild(el('div','msg','Tray empty.'));
    }
    function occupied(){
      const o=new Array(W*H).fill(-1);
      placed.forEach(function(cells2,k){if(cells2)for(const i of cells2)o[i]=k;});
      return o;
    }
    function paint(){
      const o=occupied();
      for(let i=0;i<W*H;i++){
        const c=cells[i];
        if(p.slots[i]<0)continue;
        c.style.background=o[i]>=0?'hsl('+PIECE_HUES[o[i]]+' 52% 48%)':'var(--bg3)';
        c.style.boxShadow=o[i]>=0?'none':'inset 0 0 0 1.5px var(--line2)';
      }
    }
    function persist(){
      if(api.rec.st!=='open')return;
      api.save({st:'open',marks:marks,board:placed.map(function(x){return x?x.slice():null;})});
    }
    function boardTap(i){
      if(api.rec.st!=='open')return;
      const o=occupied();
      if(o[i]>=0){
        const k=o[i];placed[k]=null;sel=k;SFX.tick();
        paint();drawTray();persist();api.msg('Picked it back up.');
        return;
      }
      if(sel<0)return api.msg('Pick a piece from the tray first.','wa');
      if(p.slots[i]<0)return api.msg('That square is outside the outline.','wa');
      const v=orients[sel][rot[sel]];
      /* the tapped square is where the piece's own first square goes, not where
         its bounding box starts — on a ragged board that corner is often a hole */
      const ox=(i%W)-v[0][0],oy=((i/W)|0)-v[0][1];
      const want=[];
      for(const c of v){
        const x=c[0]+ox,y=c[1]+oy;
        if(x<0||y<0||x>=W||y>=H)return api.msg('It hangs off the board there.','wa');
        const j=y*W+x;
        if(p.slots[j]<0)return api.msg('It hangs outside the outline there.','wa');
        if(o[j]>=0)return api.msg('Another piece is already there.','wa');
        want.push(j);
      }
      want.sort(function(a,b){return a-b;});
      const right=p.shapes.some(function(s){
        const b=s.board.slice().sort(function(a,c){return a-c;});
        return b.length===want.length&&b.every(function(x,n){return x===want[n];});
      });
      marks.push(right?'🟩':'🟥');
      if(right)SFX.good();else SFX.tick();
      placed[sel]=want;sel=-1;
      paint();drawTray();api.msg('');
      if(placed.every(function(x){return x;})){
        api.finish(true,{st:'won',marks:marks,board:placed.map(function(x){return x.slice();})});
        g.style.filter='drop-shadow(0 0 6px rgba(88,193,142,.6))';
      }else persist();
    }
    paint();drawTray();
  }
});

          if(typed.length<4&&api.rec.st==='open'){typed+=ch;SFX.tick();paint();}
        };
        rr.appendChild(k);
      }
      if(n===2){
        const k=el('button','key wide','⌫');
        k.onclick=function(){typed=typed.slice(0,-1);SFX.tick();paint();};
        rr.appendChild(k);
      }
      kb.appendChild(rr);
    });
    stage.appendChild(kb);
    function keyHandler(ev){
      if(api.rec.st!=='open')return;
      if(ev.key==='Enter')submit();
      else if(ev.key==='Backspace'){typed=typed.slice(0,-1);paint();}
      else if(/^[a-zA-Z]$/.test(ev.key)&&typed.length<4){typed+=ev.key.toUpperCase();paint();}
      else return;
      ev.preventDefault();
    }
    document.addEventListener('keydown',keyHandler);

    function paint(){
      box.innerHTML='';
      const size=cellPx(4,50);
      for(let r=0;r<=L;r++){
        const row=el('div','');
        row.style.cssText='display:flex;gap:6px';
        let text='',cls='';
        if(r===0){text=words[0];cls='fix';}
        else if(r===L){text=words[L];cls='fix';}
        else if(r<=got.length){text=got[r-1];cls='got';}
        else if(r===got.length+1&&api.rec.st==='open'){text=typed;cls='now';}
        for(let c=0;c<4;c++){
          const e=el('div','');
          e.style.cssText='width:'+size+'px;height:'+Math.round(size*0.92)+'px;border-radius:8px;'+
            'display:grid;place-items:center;font-weight:700;font-size:'+Math.round(size*0.45)+'px;'+
            'border:2px solid '+(cls==='now'?'var(--k-word)':'var(--line)')+';'+
            'background:'+(cls==='fix'?'var(--bg3)':cls==='got'?'rgba(199,146,234,.22)':'var(--bg2)')+';'+
            'color:'+(cls==='fix'?'var(--dim)':'var(--fg)');
          e.textContent=text[c]||'';
          row.appendChild(e);
        }
        box.appendChild(row);
      }
      livesEl.innerHTML='<div><b>'+lives+'</b> tries left</div><div><b>'+
        (L-1-got.length)+'</b> rungs to fill</div>';
    }
    function persist(extra){
      const rec={st:api.rec.st,marks:marks,board:got.slice(),lives:lives};
      if(extra)Object.assign(rec,extra);
      api.save(rec);
    }
    function submit(){
      if(api.rec.st!=='open')return;
      if(typed.length<4)return api.msg('Four letters.','wa');
      const prev=got.length?got[got.length-1]:words[0];
      const verdict=rungsJudge(prev,typed,words[L],idxSet);
      if(verdict!=='ok'){
        lives--;marks.push('🟥');SFX.bad();
        api.msg(verdict==='word'?'"'+typed+'" is not in the word list.':
                'That changes '+(verdict==='step'?'more than one letter, or none':'the wrong number of letters')+'.','no');
        typed='';
        if(lives<=0){api.rec.st='lost';api.finish(false,{st:'lost',marks:marks,board:got.slice(),lives:0});return;}
        persist();paint();return;
      }
      /* a word, one letter away, but is it the rung? */
      const want=words[got.length+1];
      if(typed!==want){
        lives--;marks.push('🟨');SFX.bad();
        api.msg('A word, and one letter away — but the chain does not go through it.','wa');
        typed='';
        if(lives<=0){api.rec.st='lost';api.finish(false,{st:'lost',marks:marks,board:got.slice(),lives:0});return;}
        persist();paint();return;
      }
      got.push(typed);marks.push('🟩');typed='';SFX.good();
      api.msg('');
      if(got.length===L-1){
        document.removeEventListener('keydown',keyHandler);
        api.rec.st='won';
        api.finish(true,{st:'won',marks:marks,board:got.slice(),lives:lives});
        kb.classList.add('hidden');
        paint();return;
      }
      persist();paint();
    }
    paint();
    if(api.rec.st!=='open'){kb.classList.add('hidden');document.removeEventListener('keydown',keyHandler);}
  }
});

/* ========================= MERIDIAN ========================= */
const MER_BANDS=[
  {max:0,    e:'🟩',t:'there'},
  {max:800,  e:'🟧',t:'next door'},
  {max:2500, e:'🟨',t:'same corner of the world'},
  {max:6000, e:'🟫',t:'the right continent, roughly'},
  {max:1e9,  e:'⬛',      t:'a long way off'}
];
function merBand(km){
  for(const b of MER_BANDS)if(km<=b.max)return b;
  return MER_BANDS[MER_BANDS.length-1];
}
PUZZLES.push({
  id:'meridian',kind:'world',name:'Meridian',
  blurb:'Find the country by distance and heading',
  icon:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>',
  rules:'Name any country and you are told <b>how far it is from today’s country and which way '+
        'to walk</b>. Nothing is drawn and nothing is named. Six guesses.',
  gen:function(date){return meridianGen(date);},
  shareTail:function(r){
    return r.st==='won'?(r.marks.length+'/6'):'X/6';
  },
  winTitle:function(r){return r.marks.length===1?'First guess':'Found it';},
  loseTitle:function(){return 'Out of guesses';},
  resultNote:function(r){
    return r.st==='won'?'The squares are how close each guess was, with the way you had to go.':
      'The answer stays hidden — the archive keeps this day, so it can be played again.';
  },
  mount:function(stage,p,api){
    const guesses=(api.rec.board&&Array.isArray(api.rec.board))?api.rec.board.slice():[];
    const marks=api.rec.marks?api.rec.marks.slice():[];
    const MAX=6;

    const list=el('div','');
    list.style.cssText='width:100%;display:flex;flex-direction:column;gap:6px';
    stage.appendChild(list);

    const form=el('div','arch');
    form.style.width='100%';
    const inp=el('input');
    inp.type='text';inp.placeholder='a country';inp.autocomplete='off';
    inp.setAttribute('list','merList');inp.style.flex='1';
    const dl=el('datalist');dl.id='merList';
    for(const c of COUNTRIES)dl.appendChild(new Option(c.name));
    form.appendChild(inp);form.appendChild(dl);
    const go2=el('button','btn pri','Guess');
    go2.onclick=function(){submit();};
    form.appendChild(go2);
    stage.appendChild(form);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});

    const left=el('div','stat');
    stage.appendChild(left);

    const leg=el('div','legend');
    for(const bnd of MER_BANDS){
      const row=el('div','');
      row.appendChild(el('span','',bnd.e));
      row.appendChild(el('span','',bnd.max===0?'the country itself':
        bnd.max>1e8?'more than 6,000 km away':'within '+bnd.max.toLocaleString('en-US')+' km'));
      leg.appendChild(row);
    }
    const arrRow=el('div','');
    arrRow.appendChild(el('span','','\u2197'));
    arrRow.appendChild(el('span','','the way you would walk from your guess to the answer'));
    leg.appendChild(arrRow);
    stage.appendChild(leg);

    function lookup(name){
      const n=name.trim().toLowerCase();
      if(!n)return null;
      const alias={'usa':'United States','us':'United States','united states of america':'United States',
        'uk':'United Kingdom','great britain':'United Kingdom','britain':'United Kingdom',
        'uae':'United Arab Emirates','south korea':'South Korea','north korea':'North Korea',
        'drc':'DR Congo','congo-kinshasa':'DR Congo','democratic republic of the congo':'DR Congo',
        'ivory coast':'Ivory Coast','turkey':'Türkiye','burma':'Myanmar','holland':'Netherlands',
        'czech republic':'Czechia','swaziland':'Eswatini','east timor':'Timor-Leste',
        'cabo verde':'Cape Verde','macedonia':'North Macedonia','vatican':'Vatican City'};
      const target=(alias[n]||name).trim().toLowerCase();
      return COUNTRIES.find(function(c){return c.name.toLowerCase()===target;})||
             COUNTRIES.find(function(c){return c.name.toLowerCase().replace(/[^a-z]/g,'')===target.replace(/[^a-z]/g,'');});
    }
    function paint(){
      list.innerHTML='';
      for(const gname of guesses){
        const c=lookup(gname);
        const f=merFeedback(c,p.answer);
        const b=merBand(f.km);
        const row=el('div','');
        row.style.cssText='display:flex;align-items:center;gap:10px;background:var(--bg2);'+
          'border:1px solid var(--line);border-radius:10px;padding:10px 12px';
        row.appendChild(el('span','',b.e));
        const nm=el('span','',c.name);
        nm.style.cssText='flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        row.appendChild(nm);
        const d=el('span','',f.km===0?'—':f.km.toLocaleString('en-US')+' km');
        d.style.cssText='color:var(--dim);font-variant-numeric:tabular-nums;font-size:13.5px';
        row.appendChild(d);
        const ar=el('span','',f.km===0?'🎯':MER_ARROWS[f.oct]);
        ar.style.fontSize='19px';
        row.appendChild(ar);
        list.appendChild(row);
      }
      left.innerHTML='<div><b>'+(MAX-guesses.length)+'</b> guesses left</div>';
      if(api.rec.st!=='open')form.classList.add('hidden');
    }
    function submit(){
      if(api.rec.st!=='open')return;
      const c=lookup(inp.value);
      if(!c)return api.msg('No UN member state by that name. Try the common English spelling.','no');
      if(guesses.some(function(g){return g.toLowerCase()===c.name.toLowerCase();}))
        return api.msg('Already guessed.','wa');
      inp.value='';
      guesses.push(c.name);
      const f=merFeedback(c,p.answer);
      marks.push(merBand(f.km).e+(f.km===0?'🎯':MER_ARROWS[f.oct]));
      if(f.km===0&&c.name===p.answer.name){
        SFX.good();api.msg('');
        paint();
        api.finish(true,{st:'won',marks:marks,board:guesses.slice()});
        return;
      }
      SFX.tick();
      api.msg(merBand(f.km).t+'.','wa');
      paint();
      if(guesses.length>=MAX){
        api.finish(false,{st:'lost',marks:marks,board:guesses.slice()});
        return;
      }
      api.save({st:'open',marks:marks,board:guesses.slice()});
    }
    paint();
  }
});

readRoute();
render();
window.addEventListener('resize',function(){
  clearTimeout(window.__frT);
  window.__frT=setTimeout(render,180);
});

/* ---------- the audit hook ----------
   Everything the verification script needs, so the checks run against exactly
   the code the page runs and not against a copy of it. */
window.FiveRungs={
  puzzles:PUZZLES.map(function(p){return p.id;}),
  gen:function(id,date){return puzzleFor(puzzleById(id),date);},
  dayNumber:dayNumber,dateFromNumber:dateFromNumber,
  audit:function(date){
    const out={date:date};
    const L=lanternGen(date);
    out.lanterns=L?{ok:true,rounds:L.rounds,carves:L.carves,
      solutions:lanternSolve(L.region,L.N,3).sols.length,
      sig:L.region.join('')+'|'+L.sol.join('')}:{ok:false};
    const G=ledgerGen(date);
    out.ledger=G?{ok:true,rounds:G.rounds,
      solutions:ledgerCount(G.vals,G.N,G.rowT,G.colT,3).count,
      nodes:G.nodes,sig:G.vals.join('')+'|'+G.keep.join('')}:{ok:false};
    const T=tesseraGen(date);
    out.tessera=T?{ok:true,nodes:T.nodes,kinds:T.kinds,
      solutions:tesseraCount(T.shapes,T.slots,T.cells.length,T.W,T.H,3).count,
      sig:T.cells.join(',')+'|'+T.shapes.map(function(s){return s.board.join('-');}).join('_')}:{ok:false};
    const R=rungsGen(date);
    out.rungs=R?{ok:true,branch:R.branch,worst:R.worst,steps:R.steps,
      solutions:1,sig:R.words.join('>')}:{ok:false};
    const M=meridianGen(date);
    const solved=meridianSolve(M.answer,14),walk=meridianWalk(M.answer,25);
    out.meridian={ok:true,solverGuesses:solved.guesses,botGuesses:walk.guesses,
      solutions:solved.live,sig:M.answer.name};
    return out;
  },
  /* the result grid must never contain the answer */
  leakProbe:function(date){
    return{
      lanterns:lanternGen(date).sol.join(''),
      ledger:ledgerGen(date).keep.join(''),
      tessera:tesseraGen(date).shapes.map(function(s){return s.board.join('-');}).join('_'),
      rungs:rungsGen(date).words.join(''),
      meridian:meridianGen(date).answer.name
    };
  }
};
