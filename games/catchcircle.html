<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efe6d2">
<title>Catch Circle</title>
<meta name="description" content="Discs drift and bounce, and a black arc runs out around each one. Tap them before it does, keep the chain alive, and leave the black ones alone.">
<style>
:root{
  --paper:#efe6d2; --ink:#1b1a17; --red:#e2452b; --blue:#2b4bb0; --yel:#f2b632;
  --ink-soft:rgba(27,26,23,.78);
  --font:Futura,"Century Gothic","Avenir Next",Jost,"Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.score{position:absolute;left:max(5vmin,16px);top:max(3.5vmin,12px);font-weight:800;font-size:clamp(38px,8vmin,64px);line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;transform-origin:0 100%;will-change:transform}
.score small{display:block;font-size:clamp(11px,2.2vmin,15px);letter-spacing:.22em;font-weight:700;color:var(--ink-soft);margin-top:1.4vmin;transform:none}
.lives{position:absolute;right:max(5vmin,16px);top:max(4.4vmin,16px);display:flex;gap:max(2vmin,9px)}
.lives i{width:clamp(22px,4.6vmin,34px);height:clamp(22px,4.6vmin,34px);border-radius:50%;background:var(--ink);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background-color .2s,opacity .2s,box-shadow .2s}
.lives i.gone{background:transparent;box-shadow:inset 0 0 0 3px var(--ink);opacity:.28;transform:scale(.86)}
.chain{position:absolute;left:50%;transform:translateX(-50%);top:max(3.6vmin,14px);display:flex;align-items:baseline;gap:.7em;font-weight:800;opacity:0;transition:opacity .2s}
.chain.on{opacity:1}
.chain b{font-size:clamp(28px,6vmin,46px);color:var(--red);line-height:1;display:inline-block;transform-origin:50% 100%;letter-spacing:-.03em}
.chain span{font-size:clamp(11px,2.2vmin,15px);letter-spacing:.2em;color:var(--ink-soft)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;padding:20px}
.screen.on{opacity:1;visibility:visible;transition:opacity .35s}
.title{font-weight:800;font-size:clamp(44px,13vmin,120px);line-height:.88;letter-spacing:-.045em;margin:0}
.title i{font-style:normal;color:var(--red)}
.cta{margin-top:clamp(20px,5vmin,40px);font-weight:700;letter-spacing:.28em;font-size:clamp(12px,2.6vmin,17px);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px);opacity:.55}}
.best{margin-top:1.6vmin;font-weight:700;letter-spacing:.2em;font-size:clamp(11px,2.2vmin,15px);color:var(--ink-soft)}
.big{font-weight:800;font-size:clamp(88px,26vmin,220px);line-height:.85;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;margin-top:2.4vmin;padding:.5em 1em;border:3px solid var(--red);color:var(--red);font-weight:800;letter-spacing:.24em;font-size:clamp(12px,2.6vmin,17px);transform:rotate(-5deg) scale(1);border-radius:6px}
.stamp[hidden]{display:none}
.stamp.pop{animation:stamp .5s cubic-bezier(.2,1.8,.4,1) both .35s}
@keyframes stamp{from{transform:rotate(-5deg) scale(2.2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
#mute{position:fixed;right:max(4vmin,12px);bottom:max(3vmin,12px);z-index:5;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .3s}
#mute.on{opacity:.7;visibility:visible}
#mute:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#mute svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.cta{animation:none}.stamp.pop{animation:none}.lives i,.chain{transition:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Catch Circle playfield"></canvas>
<div class="hud" id="hud" aria-hidden="true">
  <div class="score" id="score">0<small id="bestline">BEST 0</small></div>
  <div class="lives" id="lives"><i></i><i></i><i></i></div>
  <div class="chain" id="chain"><b id="mult">×1</b><span id="runlen"></span></div>
</div>
<div class="screen on" id="title">
  <h1 class="title">Catch<br><i>Circle</i></h1>
  <div class="cta">TAP TO START</div>
  <div class="best" id="titleBest"></div>
</div>
<div class="screen" id="over">
  <div class="best">YOU CAUGHT</div>
  <div class="big" id="overScore">0</div>
  <div class="stamp" id="stamp" hidden>NEW BEST</div>
  <div class="best" id="overLine"></div>
  <div class="cta">TAP TO GO AGAIN</div>
</div>
<div class="screen" id="paused">
  <h1 class="title" style="font-size:clamp(36px,10vmin,90px)">Paused</h1>
  <div class="cta">TAP TO CONTINUE</div>
</div>
<button id="mute" type="button" aria-label="Sound on"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script id="core">
/* Catch Circle core: discs, ring, chain, lives. DOM-free; test/catch_circle.mjs runs this block. */
const Core = (() => {
  const LIVES = 3, SLOP = 10, ARM = 0.14, PERFECT = 0.34, HEAL_EVERY = 20;
  const COLORS = ['red', 'blue', 'yel'], BASE = [25, 15, 10], SIZE = [0.055, 0.075, 0.1]; // small and quick is worth most

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const unit = s => Math.min(s.b.x1 - s.b.x0, s.b.y1 - s.b.y0);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mult = chain => Math.min(6, 1 + Math.floor(chain / 5));

  function create(opts) {
    opts = opts || {};
    return {
      b: Object.assign({}, opts.bounds || { x0: 0, y0: 0, x1: 400, y1: 700 }),
      rand: rng(opts.seed == null ? 1 : opts.seed),
      demo: !!opts.demo,
      t: 0, nextId: 1, discs: [], spawnIn: 0.45,
      score: 0, chain: 0, bestChain: 0, lives: LIVES, caught: 0, perfects: 0,
      blackSeen: false, over: false
    };
  }

  // Everything that sets the pace comes from how many have been caught, so a seed plays the same run.
  const maxDiscs = s => s.demo ? 5 : 1 + Math.min(5, Math.floor(s.caught / 4));
  const interval = s => s.demo ? 0.6 : Math.max(0.55, 1.5 - 0.016 * s.caught);
  const lifeOf = s => clamp(5.6 - 0.05 * s.caught, 2.5, 5.6);
  const speedOf = s => unit(s) * (0.13 + 0.004 * Math.min(s.caught, 60));

  function spawn(s) {
    const u = unit(s), R = s.rand;
    const black = !s.demo && s.caught >= 10 &&
      !s.discs.some(d => d.kind === 'k') && (!s.blackSeen || R() < 0.16);
    const tier = black ? 1 : [0, 0, 1, 1, 2][Math.floor(R() * 5)];
    const r = clamp(u * SIZE[tier] * (0.94 + 0.12 * R()), 24, 80);
    let x = 0, y = 0;
    for (let i = 0; i < 10; i++) {
      x = s.b.x0 + r + R() * (s.b.x1 - s.b.x0 - 2 * r);
      y = s.b.y0 + r + R() * (s.b.y1 - s.b.y0 - 2 * r);
      if (s.discs.every(d => Math.hypot(d.x - x, d.y - y) > d.r + r + 6)) break;
    }
    const a = R() * Math.PI * 2, sp = speedOf(s) * (0.85 + 0.3 * R()) * (tier === 0 ? 1.25 : 1);
    const life = black ? 4 : lifeOf(s);
    const d = { id: s.nextId++, kind: black ? 'k' : 'c', tier, color: black ? 'ink' : COLORS[tier],
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, life, max: life, age: 0 };
    if (black) s.blackSeen = true;
    s.discs.push(d);
    return d;
  }

  function step(s, dt) {
    const ev = [];
    if (s.over) return ev;
    dt = clamp(dt, 0, 0.05);
    s.t += dt;
    for (const d of s.discs) {
      d.age += dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.x < s.b.x0 + d.r) { d.x = s.b.x0 + d.r; d.vx = Math.abs(d.vx); }
      if (d.x > s.b.x1 - d.r) { d.x = s.b.x1 - d.r; d.vx = -Math.abs(d.vx); }
      if (d.y < s.b.y0 + d.r) { d.y = s.b.y0 + d.r; d.vy = Math.abs(d.vy); }
      if (d.y > s.b.y1 - d.r) { d.y = s.b.y1 - d.r; d.vy = -Math.abs(d.vy); }
      if (!s.demo && d.age > ARM) d.life -= dt;
    }
    // discs knock each other aside, so none ever hides another
    for (let i = 0; i < s.discs.length; i++) for (let j = i + 1; j < s.discs.length; j++) {
      const a = s.discs[i], c = s.discs[j], dx = c.x - a.x, dy = c.y - a.y, dist = Math.hypot(dx, dy) || 0.001, min = a.r + c.r;
      if (dist >= min) continue;
      const nx = dx / dist, ny = dy / dist, push = (min - dist) / 2;
      a.x -= nx * push; a.y -= ny * push; c.x += nx * push; c.y += ny * push;
      const rel = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
      if (rel < 0) { a.vx += rel * nx; a.vy += rel * ny; c.vx -= rel * nx; c.vy -= rel * ny; }
    }
    for (const d of s.discs) {
      d.x = clamp(d.x, s.b.x0 + d.r, Math.max(s.b.x0 + d.r, s.b.x1 - d.r));
      d.y = clamp(d.y, s.b.y0 + d.r, Math.max(s.b.y0 + d.r, s.b.y1 - d.r));
    }
    for (const d of s.discs.slice()) {
      if (d.life > 0) continue;
      s.discs.splice(s.discs.indexOf(d), 1);
      if (d.kind === 'k') { ev.push({ type: 'fade', disc: d }); continue; }
      s.lives--; s.chain = 0;
      ev.push({ type: 'slip', disc: d });
      if (s.lives <= 0) { s.over = true; ev.push({ type: 'over' }); return ev; }
    }
    s.spawnIn -= dt;
    if ((s.spawnIn <= 0 && s.discs.length < maxDiscs(s)) || (s.discs.length === 0 && s.spawnIn < -0.05)) {
      ev.push({ type: 'spawn', disc: spawn(s) });
      s.spawnIn = interval(s);
    } else if (s.spawnIn < 0 && s.discs.length >= maxDiscs(s)) s.spawnIn = 0;
    return ev;
  }

  // The disc whose edge is nearest to the finger wins; a disc must have finished appearing to be caught.
  function pick(s, x, y) {
    let best = null, bd = Infinity;
    for (const d of s.discs) {
      if (d.age < ARM) continue;
      const dist = Math.hypot(d.x - x, d.y - y);
      if (dist > d.r + SLOP) continue;
      const edge = dist - d.r;
      if (edge < bd) { bd = edge; best = d; }
    }
    return best;
  }

  function tap(s, x, y) {
    const ev = [];
    if (s.over) return ev;
    const d = pick(s, x, y);
    if (!d) {
      const had = s.chain;
      s.chain = 0;
      ev.push({ type: 'miss', x, y, broke: had >= 2 });
      return ev;
    }
    s.discs.splice(s.discs.indexOf(d), 1);
    if (d.kind === 'k') {
      s.lives--; s.chain = 0;
      ev.push({ type: 'bomb', disc: d });
      if (s.lives <= 0) { s.over = true; ev.push({ type: 'over' }); }
      return ev;
    }
    const dist = Math.hypot(d.x - x, d.y - y);
    const perfect = dist <= d.r * PERFECT;
    s.chain++; s.caught++;
    if (s.chain > s.bestChain) s.bestChain = s.chain;
    if (perfect) s.perfects++;
    const m = mult(s.chain), pts = Math.round(m * BASE[d.tier] * (perfect ? 1.5 : 1));
    s.score += pts;
    ev.push({ type: 'catch', disc: d, pts, mult: m, perfect, chain: s.chain });
    if (s.caught % HEAL_EVERY === 0 && s.lives < LIVES) { s.lives++; ev.push({ type: 'heal' }); }
    return ev;
  }

  function resize(s, bounds) {
    s.b = Object.assign({}, bounds);
    for (const d of s.discs) {
      d.x = clamp(d.x, s.b.x0 + d.r, Math.max(s.b.x0 + d.r, s.b.x1 - d.r));
      d.y = clamp(d.y, s.b.y0 + d.r, Math.max(s.b.y0 + d.r, s.b.y1 - d.r));
    }
  }

  return { LIVES, SLOP, ARM, create, step, tap, pick, resize, mult, unit };
})();
</script>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PAL = { red: '#e2452b', blue: '#2b4bb0', yel: '#f2b632', ink: '#1b1a17', paper: '#efe6d2' };
  const KEY = 'gptgames.catchcircle.v2';

  /* ---------- save ---------- */
  let save = { best: 0, plays: 0, muted: false };
  try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  // the first page kept its best score under this key; carry it over once
  try { const old = parseInt(localStorage.getItem('catchCircleHS2')) || 0; if (old > save.best) save.best = old; } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

  /* ---------- sound: a wooden marimba, pentatonic, climbing with the chain ---------- */
  let ac = null;
  const SCALE = [0, 2, 4, 7, 9];
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = false; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac || null;
  }
  function tone(f, dur, type, vol, when, slideTo) {
    const a = audio(); if (!a || save.muted) return;
    const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function note(chain, perfect) {
    const i = chain - 1, deg = SCALE[i % 5] + 12 * Math.floor(i / 5 % 3);
    const f = 261.63 * Math.pow(2, deg / 12);
    tone(f, 0.34, 'sine', 0.3);
    tone(f * 4, 0.09, 'sine', 0.1);               // the stick's click
    if (perfect) tone(f * 2, 0.4, 'triangle', 0.12, 0.02);
  }
  const sfx = {
    miss: () => tone(180, 0.07, 'triangle', 0.1, 0, 120),
    slip: () => { tone(110, 0.35, 'sine', 0.4, 0, 55); },
    bomb: () => { tone(90, 0.4, 'sawtooth', 0.2, 0, 45); tone(67, 0.4, 'square', 0.1, 0, 40); },
    heal: () => [0, 4, 7, 12].forEach((d, i) => tone(392 * Math.pow(2, d / 12), 0.3, 'sine', 0.18, i * 0.07)),
    over: () => [7, 4, 0].forEach((d, i) => tone(261.63 * Math.pow(2, d / 12), 0.7, 'sine', 0.22, 0.15 + i * 0.22)),
    best: () => [0, 4, 7, 12, 16].forEach((d, i) => tone(523.25 * Math.pow(2, d / 12), 0.5, 'sine', 0.16, i * 0.09))
  };
  const buzz = ms => { if (!save.muted && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} };

  /* ---------- sizing ---------- */
  let W = 0, H = 0, DPR = 1, bounds = null;
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const pad = Math.max(10, W * 0.02);
    bounds = { x0: pad, y0: Math.max(84, H * 0.1), x1: W - pad, y1: H - pad };
    if (game) Core.resize(game, bounds);
  }

  /* ---------- state ---------- */
  let mode = 'title', game = null, last = 0, shake = 0, fx = [], pops = [], flash = 0, guardUntil = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const scoreEl = $('score'), bestLine = $('bestline'), livesEl = $('lives').children,
    chainEl = $('chain'), multEl = $('mult'), runEl = $('runlen');
  let shownScore = -1;

  function setScore(n) {
    if (n === shownScore) return;
    shownScore = n;
    scoreEl.firstChild.nodeValue = n;
  }
  function bump(el, k) {
    if (reduce || !el.animate) return;
    el.animate([{ transform: `scale(${k})` }, { transform: 'scale(1)' }], { duration: 260, easing: 'cubic-bezier(.2,1.6,.4,1)' });
  }
  function renderHud() {
    setScore(game.score); showBest();
    for (let i = 0; i < Core.LIVES; i++) livesEl[i].classList.toggle('gone', i >= game.lives);
    const m = Core.mult(game.chain);
    chainEl.classList.toggle('on', game.chain >= 2);
    multEl.textContent = '×' + m;
    runEl.textContent = game.chain + ' IN A ROW';
  }
  function showBest() { bestLine.textContent = 'BEST ' + Math.max(save.best, game && mode === 'play' ? game.score : 0); }

  function show(name) {
    for (const id of ['title', 'over', 'paused']) $(id).classList.toggle('on', id === name);
    $('mute').classList.toggle('on', name === 'title' || name === 'over');
  }

  function newGame(demo) {
    const g = Core.create({ bounds, demo, seed: (Math.random() * 2 ** 32) >>> 0 });
    return g;
  }

  function toTitle() {
    mode = 'title'; game = newGame(true); fx = []; pops = [];
    $('titleBest').textContent = save.best ? 'BEST ' + save.best : '';
    scoreEl.style.opacity = 0; $('lives').style.opacity = 0; chainEl.classList.remove('on');
    show('title');
  }
  function start() {
    audio();
    mode = 'play'; game = newGame(false); fx = []; pops = []; shownScore = -1;
    scoreEl.style.opacity = 1; $('lives').style.opacity = 1;
    showBest(); renderHud(); show(null);
    $('live').textContent = '';
  }
  function finish() {
    mode = 'over'; guardUntil = performance.now() + 750;
    const fresh = game.score > save.best && game.score > 0;
    const before = save.best;
    if (fresh) save.best = game.score;
    save.plays++; persist();
    $('overScore').textContent = game.score;
    const st = $('stamp'); st.hidden = !(fresh && before > 0);
    st.classList.remove('pop'); void st.offsetWidth; if (!st.hidden) st.classList.add('pop');
    $('overLine').textContent = `${game.caught} CAUGHT · LONGEST CHAIN ${game.bestChain}` + (fresh && before === 0 ? '' : fresh ? '' : ` · BEST ${save.best}`);
    $('live').textContent = `Game over. Score ${game.score}.`;
    scoreEl.style.opacity = 0; $('lives').style.opacity = 0; chainEl.classList.remove('on');
    setTimeout(() => { if (mode === 'over') { show('over'); (fresh && before > 0 ? sfx.best : sfx.over)(); } }, 650);
  }

  /* ---------- effects ---------- */
  function burst(x, y, color, n, speed) {
    fx.push({ k: 'ring', x, y, r0: 0, r1: speed * 0.55, t: 0, d: 0.5, c: color, w: 4 });
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 6.283 + rnd(-.2, .2), v = speed * rnd(.6, 1.2);
      fx.push({ k: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(2.5, 5), t: 0, d: rnd(.35, .6), c: color });
    }
  }
  function onEvents(ev) {
    for (const e of ev) {
      if (e.type === 'catch') {
        const d = e.disc, c = PAL[d.color];
        burst(d.x, d.y, c, e.perfect ? 14 : 8, d.r * 4.5);
        pops.push({ x: d.x, y: d.y - d.r, t: 0, text: '+' + e.pts, c: e.perfect ? PAL.red : PAL.ink, big: e.perfect });
        fx.push({ k: 'shrink', x: d.x, y: d.y, r: d.r, c, t: 0, d: 0.22 });
        note(e.chain, e.perfect); buzz(e.perfect ? 14 : 8);
        bump(scoreEl, 1.1); bump(multEl, 1 + 0.08 * e.mult);
      } else if (e.type === 'miss') {
        fx.push({ k: 'ring', x: e.x, y: e.y, r0: 6, r1: 26, t: 0, d: 0.3, c: 'rgba(27,26,23,.35)', w: 2 });
        sfx.miss(); if (e.broke) buzz(20);
      } else if (e.type === 'slip') {
        const d = e.disc;
        fx.push({ k: 'shrink', x: d.x, y: d.y, r: d.r, c: PAL.ink, t: 0, d: 0.35, hollow: true });
        flash = 1; if (!reduce) shake = 14; sfx.slip(); buzz(60);
        bump($('lives'), 1.15);
      } else if (e.type === 'bomb') {
        const d = e.disc;
        burst(d.x, d.y, PAL.ink, 12, d.r * 5);
        flash = 1; if (!reduce) shake = 18; sfx.bomb(); buzz([40, 30, 60]);
      } else if (e.type === 'heal') { sfx.heal(); bump($('lives'), 1.25); }
      else if (e.type === 'fade') {
        fx.push({ k: 'shrink', x: e.disc.x, y: e.disc.y, r: e.disc.r, c: PAL.ink, t: 0, d: 0.4 });
      } else if (e.type === 'over') finish();
    }
  }

  /* ---------- input ---------- */
  cv.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    const now = performance.now();
    if (mode === 'title') return start();
    if (mode === 'over') { if (now > guardUntil) { toTitleThenStart(); } return; }
    if (mode === 'paused') { resume(); return; }
    if (mode !== 'play') return;
    const r = cv.getBoundingClientRect();
    onEvents(Core.tap(game, ev.clientX - r.left, ev.clientY - r.top));
    renderHud();
  });
  function toTitleThenStart() { start(); }
  addEventListener('keydown', e => {
    if (e.key === 'm' || e.key === 'M') toggleMute();
    else if (e.key === 'Escape' && mode === 'play') pause();
    else if ((e.key === ' ' || e.key === 'Enter') && mode !== 'play') { e.preventDefault(); if (mode === 'paused') resume(); else if (mode === 'title' || (mode === 'over' && performance.now() > guardUntil)) start(); }
  });
  function pause() { if (mode !== 'play') return; mode = 'paused'; show('paused'); }
  function resume() { mode = 'play'; guardUntil = 0; show(null); last = performance.now(); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('blur', pause);

  const muteBtn = $('mute');
  function paintMute() {
    $('wave').style.display = save.muted ? 'none' : '';
    muteBtn.setAttribute('aria-label', save.muted ? 'Sound off' : 'Sound on');
  }
  function toggleMute() { save.muted = !save.muted; persist(); paintMute(); if (!save.muted) tone(523, .2, 'sine', .2); }
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', toggleMute);
  muteBtn.style.pointerEvents = 'auto';

  /* ---------- drawing ---------- */
  const ease = { outBack: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }, out: t => 1 - Math.pow(1 - t, 3) };

  function drawDisc(d, t) {
    const appear = Math.min(1, d.age / 0.28), sc = reduce ? 1 : Math.max(0.001, ease.outBack(appear));
    const frac = Math.max(0, d.life / d.max), urgent = d.kind === 'c' && frac < 0.3;
    const pulse = urgent && !reduce ? 1 + 0.045 * Math.sin(t * 22) : 1;
    const r = d.r * sc * pulse;
    ctx.save();
    ctx.translate(d.x, d.y);
    if (d.kind === 'k') {
      // the hazard is the only spiked thing on the table, and the only thing that turns
      ctx.globalAlpha = Math.min(1, d.life / 0.8);
      ctx.rotate(reduce ? 0 : t * 0.9);
      const n = 10, ro = r * 1.12, ri = r * 0.72;
      ctx.fillStyle = PAL.ink; ctx.beginPath();
      for (let i = 0; i < n * 2; i++) {
        const a = (i / (n * 2)) * 6.283, rad = i % 2 ? ri : ro;
        ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = PAL.paper; ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, 6.283); ctx.fill();
    } else {
      const col = PAL[d.color];
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
      // the ring is the disc's own colour, thick, and unwinds clockwise from twelve: what is left is what you have
      const lw = Math.max(5, d.r * 0.2) * (urgent ? 1 + 0.25 * Math.sin(t * 22) : 1), rr = r + lw * 0.5 + 5;
      ctx.lineWidth = lw; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.2; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
      if (frac > 0.01) { ctx.beginPath(); ctx.arc(0, 0, rr, -Math.PI / 2 + (1 - frac) * 6.283, Math.PI * 1.5); ctx.stroke(); }
    }
    ctx.restore();
  }

  function drawFx(dt) {
    for (const f of fx) {
      f.t += dt;
      const p = Math.min(1, f.t / f.d);
      ctx.save();
      if (f.k === 'ring') {
        ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.c; ctx.lineWidth = f.w * (1 - p * .6);
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * ease.out(p), 0, 6.283); ctx.stroke();
      } else if (f.k === 'dot') {
        f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.93; f.vy = f.vy * 0.93 + 260 * dt;
        ctx.globalAlpha = 1 - p * p; ctx.fillStyle = f.c;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - p * .5), 0, 6.283); ctx.fill();
      } else if (f.k === 'shrink') {
        ctx.globalAlpha = 1 - p; ctx.strokeStyle = ctx.fillStyle = f.c; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (f.hollow ? 1 + p * .3 : 1 - ease.out(p)), 0, 6.283);
        f.hollow ? ctx.stroke() : ctx.fill();
      }
      ctx.restore();
    }
    fx = fx.filter(f => f.t < f.d);
    for (const p of pops) {
      p.t += dt;
      const q = Math.min(1, p.t / 0.8);
      ctx.save(); ctx.globalAlpha = 1 - ease.out(Math.max(0, (q - .4) / .6));
      ctx.fillStyle = p.c; ctx.textAlign = 'center';
      ctx.font = `800 ${p.big ? 30 : 22}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText(p.text, p.x, p.y - 34 * ease.out(q));
      ctx.restore();
    }
    pops = pops.filter(p => p.t < 0.8);
  }

  /* ---------- loop ---------- */
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (game && (mode === 'play' || mode === 'title')) {
      const ev = Core.step(game, dt);
      if (mode === 'play') { if (ev.length) { onEvents(ev); renderHud(); } }
      else for (const e of game.discs) if (e.age > 20) e.age = 20;
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = PAL.paper; ctx.fillRect(0, 0, W, H);
    if (shake > 0.2) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= Math.pow(0.001, dt); }
    if (game) for (const d of game.discs) drawDisc(d, now / 1000);
    drawFx(dt);
    if (flash > 0.01) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = `rgba(226,69,43,${flash * 0.18})`; ctx.fillRect(0, 0, cv.width, cv.height);
      flash *= Math.pow(0.0005, dt);
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', layout);
  layout(); paintMute(); showBest(); toTitle();
  last = performance.now(); requestAnimationFrame(frame);
  window.__cc = { get game() { return game; }, get mode() { return mode; }, tapAt: (x, y) => { onEvents(Core.tap(game, x, y)); renderHud(); }, start };
})();
</script>
</body>
</html>
