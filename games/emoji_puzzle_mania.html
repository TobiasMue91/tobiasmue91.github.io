<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peel &amp; Seek - Find the Emoji Sticker</title>
<meta name="description" content="Peel &amp; Seek: a sheet of emoji stickers and one to find. Spot the fox among the cats and tigers before the tape runs out - every find buys a little time, every wrong peel tears some off. Sheets grow, lookalikes close in, stickers turn and spin, and collector sheets hide several of a kind. A daily sheet, the same for everyone.">
<meta name="theme-color" content="#f4eee2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
    --paper: #f4eee2;
    --sheet: #fffdf8;
    --collector: #fff3b3;
    --pink: #ff48b0;
    --blue: #0078bf;
    --yellow: #ffe800;
    --ink: #22201c;
    --ink2: #6b645a;
    --stamp: clamp(92px, min(23vh, 46vw), 190px);
    --out: cubic-bezier(.2, .8, .25, 1);
    --spring: cubic-bezier(.3, 1.45, .5, 1);
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
    --font: "Bricolage Grotesque", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
    background-color: var(--paper);
    background-image: radial-gradient(rgba(0, 120, 191, .09) 1.1px, transparent 1.4px);
    background-size: 7px 7px;
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 12px; }

.app {
    position: relative;
    height: 100vh;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "top" "find" "tape" "pad" "foot";
    gap: 6px;
    padding: max(14px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
}

/* top bar: the wordmark on the title, the score in play */
.top { grid-area: top; display: flex; justify-content: space-between; align-items: center; min-height: 60px; }
.left { position: relative; height: 56px; flex: 1; }
.brand, .score { position: absolute; left: 0; top: 50%; transform: translateY(-50%); transition: opacity .22s var(--out) .16s, transform .38s var(--out) .16s; white-space: nowrap; }
.brand b { display: block; font-weight: 800; font-size: 34px; line-height: .95; letter-spacing: -.02em; color: var(--blue); text-shadow: 2px 2px 0 rgba(255, 72, 176, .85); }
.brand b i { font-style: normal; color: var(--pink); text-shadow: 2px 2px 0 rgba(0, 120, 191, .35); }
.brand small, .score small { display: block; font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin-top: 5px; }
.score small { margin: 0 0 4px; }
.score b { display: block; font-weight: 800; font-size: 40px; line-height: .9; letter-spacing: -.02em; color: var(--blue); text-shadow: 2px 2px 0 rgba(255, 72, 176, .85); font-variant-numeric: tabular-nums; }
.app[data-state="title"] .score, .app:not([data-state="title"]) .brand { opacity: 0; transform: translateY(-30%); pointer-events: none; transition-duration: .14s; transition-delay: 0s; }

.tools { display: flex; align-items: center; gap: 8px; }
.streak {
    position: relative;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--sheet); color: var(--ink2);
    transition: background-color .2s, color .2s;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 23px; letter-spacing: -.02em;
    transform: rotate(9deg);
    box-shadow: 0 2px 0 rgba(0, 0, 0, .12), 0 6px 10px -6px rgba(0, 0, 0, .3);
}
.streak span { font-size: 15px; margin-right: 1px; }
.streak.hot { background: var(--yellow); color: var(--ink); }
.app[data-state="title"] .streak { visibility: hidden; }
.ring3 { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); overflow: visible; }
.ring3 path { fill: none; stroke: rgba(34, 32, 28, .13); stroke-width: 5; stroke-linecap: round; transition: stroke .15s; }
.ring3 path.on { stroke: var(--pink); }
.icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--sheet);
    display: grid; place-items: center;
    box-shadow: 0 1.5px 0 rgba(0, 0, 0, .1), 0 4px 8px -4px rgba(0, 0, 0, .25);
    transition: transform .15s var(--out);
}
.icon:active { transform: scale(.92); }
.icon svg { width: 20px; height: 20px; }
#pauseBtn { display: none; }
.app[data-state="play"] #pauseBtn { display: grid; }
#soundBtn .off { display: none; }
#soundBtn.muted .on { display: none; }
#soundBtn.muted .off { display: inline; }

/* the target: a riso stamp, and the tape that is the clock */
.find { grid-area: find; display: flex; flex-direction: column; align-items: center; padding-top: 2px; }
.stampWrap { position: relative; }
.stamp {
    position: relative;
    width: var(--stamp); height: var(--stamp);
    border-radius: 50%;
    background: var(--pink);
    display: grid; place-items: center;
    mix-blend-mode: multiply;
}
.stamp::before { content: ""; position: absolute; inset: 7%; border-radius: 50%; border: 2.5px dashed rgba(255, 255, 255, .75); }
.stamp .e { font-family: var(--emoji); font-size: calc(var(--stamp) * .56); line-height: 1; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .16)); }
.label {
    position: absolute; left: calc(100% - 14px); top: 2%;
    font-weight: 800; font-size: clamp(15px, calc(var(--stamp) * .11), 20px);
    color: var(--blue); text-transform: uppercase; letter-spacing: .04em;
    transform: rotate(9deg); transform-origin: left center; white-space: nowrap;
}
.count {
    position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%) rotate(-3deg);
    background: var(--blue); color: #fff; font-weight: 800; font-size: 15px;
    padding: 3px 10px 4px; border-radius: 999px; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 5px; min-height: 24px; white-space: nowrap;
    box-shadow: 0 2px 0 rgba(0, 0, 0, .12);
}
.app[data-state="title"] .count { visibility: hidden; }
.count i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
.count i.on { background: #fff; }
.count b { font-weight: 800; margin-right: 3px; letter-spacing: .02em; }
.tape { grid-area: tape; justify-self: center; position: relative; z-index: 3; width: calc(var(--s, 300px) * .9); height: 26px; margin: 10px 0 -19px; transform: rotate(-1.2deg); }
.tape::before { content: ""; position: absolute; inset: 0; background: rgba(0, 120, 191, .13); clip-path: polygon(0 14%, 2% 0, 98% 8%, 100% 34%, 99% 100%, 1% 90%); }
.fill {
    position: absolute; inset: 0;
    background: var(--blue); opacity: .92; mix-blend-mode: multiply;
    clip-path: polygon(0 14%, 2% 0, 100% 6%, 98.4% 32%, 100% 62%, 98.8% 100%, 1% 90%);
    transform-origin: left center;
    transition: background-color .3s;
}
.tape.low .fill { background: var(--pink); }
.tape.low.shake { animation: flutter .22s linear infinite; }
@keyframes flutter { 0%, 100% { transform: rotate(-1.2deg); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(-.4deg); } }

/* the sheet of stickers */
.pad { grid-area: pad; position: relative; display: grid; place-items: start center; min-height: 0; }
.sheet {
    grid-area: 1 / 1;
    position: relative;
    width: var(--s, 300px); height: var(--s, 300px);
    background: var(--sheet);
    border-radius: 14px;
    padding: var(--sp, 5%);
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--cols), 1fr);
    gap: var(--sg, 3%);
    box-shadow: 0 1px 0 rgba(0, 0, 0, .07), 0 18px 30px -18px rgba(60, 40, 20, .38);
    transform: rotate(.6deg);
    margin-bottom: 22px;
    touch-action: none;
}
.sheet.collector { background: var(--collector); }
.sheet::before {
    content: ""; position: absolute; right: 0; top: 0; width: 34px; height: 34px;
    border-top-right-radius: 14px;
    background: linear-gradient(225deg, var(--paper) 0 50%, rgba(0, 0, 0, .06) 50%, #fff 58%, #efe8da 100%);
    box-shadow: -2px 2px 4px -2px rgba(60, 40, 20, .25);
}
.sheet.collector::before { background: linear-gradient(225deg, var(--paper) 0 50%, rgba(0, 0, 0, .06) 50%, #fffbe0 58%, #efe3a6 100%); }
.sheet::after {
    content: none;
    position: absolute; right: 12px; bottom: -24px;
    font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2);
}
.st { position: relative; display: grid; min-width: 0; min-height: 0; }
.body {
    position: relative;
    display: grid; place-items: center;
    transition: transform .12s var(--out);
}
.face {
    --ol: calc(var(--fs, 30px) * .05);
    font-family: var(--emoji);
    font-size: var(--fs, 30px);
    line-height: 1;
    transform: rotate(var(--r, 0deg));
    filter: drop-shadow(var(--ol) 0 0 #fff) drop-shadow(calc(var(--ol) * -1) 0 0 #fff) drop-shadow(0 var(--ol) 0 #fff) drop-shadow(0 calc(var(--ol) * -1) 0 #fff)
            drop-shadow(0 1px 0 rgba(60, 40, 20, .18)) drop-shadow(0 calc(var(--ol) * 1.4) calc(var(--ol) * 1.4) rgba(60, 40, 20, .22));
    transition: opacity .18s;
    will-change: transform;
}
.face { grid-area: 1 / 1; }
.face.spin { animation: spin var(--spin, 6s) linear infinite; }
.face.ccw { animation-direction: reverse; }
@keyframes spin { from { transform: rotate(var(--r, 0deg)); } to { transform: rotate(calc(var(--r, 0deg) + 360deg)); } }
.st:active .body { transform: scale(.93); }
@media (hover: hover) {
    .st:hover .body { transform: translateY(-2px) scale(1.04); }
    .st:active .body { transform: scale(.93); }
}
.st.gone { pointer-events: none; }
.st.gone .face { filter: brightness(0); opacity: .07; }
.st.gone .face.spin { animation: none; }
.pad.down .face { opacity: 0; }
.pad.down .st { pointer-events: none; }

.foot { grid-area: foot; min-height: 30px; display: flex; align-items: center; gap: 16px; padding-right: 46px; font-size: 14px; color: var(--ink2); transition: opacity .25s; }
.foot b { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
.link { font-weight: 800; color: var(--blue); padding: 6px 0; white-space: nowrap; }
.app:not([data-state="title"]) .foot { opacity: 0; pointer-events: none; }

/* effects: flying stickers, points, tape scraps, confetti */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.fx > * { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
.fly { display: grid; place-items: center; }
.fly span { font-family: var(--emoji); line-height: 1; --ol: calc(var(--fs) * .05);
    filter: drop-shadow(var(--ol) 0 0 #fff) drop-shadow(calc(var(--ol) * -1) 0 0 #fff) drop-shadow(0 var(--ol) 0 #fff) drop-shadow(0 calc(var(--ol) * -1) 0 #fff) drop-shadow(0 3px 2px rgba(60, 40, 20, .22)); }
.chip { font-weight: 800; font-size: 17px; line-height: 1; color: #fff; background: var(--pink); padding: 5px 9px 6px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
.chip.gain { background: var(--blue); font-size: 15px; }
.chip.hot { background: var(--yellow); color: var(--ink); }
.chip.big { font-size: 19px; padding: 7px 12px 8px; }
.slap { position: absolute; z-index: 4; width: 96px; height: 86px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; font-weight: 800; font-size: 17px; text-transform: uppercase; box-shadow: 0 2px 0 rgba(0, 0, 0, .12), 0 10px 16px -8px rgba(0, 0, 0, .35); }
.ring { border-radius: 50%; border: 7px solid var(--pink); box-shadow: 0 0 0 3px rgba(255, 255, 255, .8); }
.cross { font-weight: 800; color: var(--pink); mix-blend-mode: multiply; line-height: 1; }
.scrap { background: var(--blue); opacity: .9; mix-blend-mode: multiply; }
.bit { width: 9px; height: 9px; mix-blend-mode: multiply; }

/* the pause card and the results card */
.veil { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px 16px max(58px, calc(env(safe-area-inset-bottom) + 50px)); background-color: var(--paper); background-image: radial-gradient(rgba(0, 120, 191, .09) 1.1px, transparent 1.4px); background-size: 7px 7px; visibility: hidden; opacity: 0; transition: opacity .3s var(--out), visibility 0s .3s; }
.veil.show { visibility: visible; opacity: 1; transition: opacity .3s var(--out); }
.card {
    width: min(100%, 380px);
    background: var(--sheet);
    border-radius: 22px;
    padding: 22px 22px 18px;
    box-shadow: 0 1px 0 rgba(0, 0, 0, .06), 0 30px 50px -24px rgba(60, 40, 20, .5);
    text-align: center;
    position: relative;
    transform: translateY(40px) rotate(-1deg);
    transition: transform .5s var(--spring);
}
.veil.show .card { transform: none; }
#overVeil .card { margin-top: 70px; padding-top: 74px; }
.missed { position: absolute; left: 50%; top: -72px; transform: translateX(-50%) rotate(-5deg); display: flex; flex-direction: column; align-items: center; }
.missed .stamp.small { --stamp: 132px; }
.missed .note { position: absolute; left: calc(100% - 6px); top: 10px; transform: rotate(8deg); font-weight: 800; font-size: 16px; color: var(--blue); text-transform: uppercase; white-space: nowrap; }
.card .k { font-weight: 800; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--pink); }
.card .big { font-weight: 800; font-size: 68px; line-height: 1; letter-spacing: -.03em; color: var(--blue); text-shadow: 3px 3px 0 rgba(255, 72, 176, .85); margin: 10px 0 6px; font-variant-numeric: tabular-nums; }
.newbest {
    position: absolute; right: -8px; top: -18px;
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--yellow);
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em;
    transform: rotate(12deg);
    box-shadow: 0 2px 0 rgba(0, 0, 0, .12), 0 8px 14px -8px rgba(0, 0, 0, .35);
}
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 18px; }
.stats div { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.stats b { display: block; font-size: 26px; letter-spacing: -.01em; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; }
.again {
    width: 100%; height: 58px; border-radius: 999px;
    background: var(--pink); color: #fff;
    font-weight: 800; font-size: 21px; letter-spacing: .01em;
    box-shadow: 0 4px 0 #c42c83;
    transition: transform .1s, box-shadow .1s;
}
.again:active { transform: translateY(3px); box-shadow: 0 1px 0 #c42c83; }
.again:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; border-radius: 999px; }
.card .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 14px; color: var(--ink2); }
.card .row b { color: var(--ink); font-variant-numeric: tabular-nums; }
.pausecard .big { font-size: 44px; margin: 4px 0 2px; }
.pausecard p { margin: 0 0 16px; color: var(--ink2); }

@media (min-aspect-ratio: 1/1) {
    :root { --stamp: clamp(96px, min(42vh, 26vw), 340px); }
    .brand b { font-size: clamp(40px, 5vw, 76px); }
    .brand small, .score small { font-size: 14px; }
    .score b { font-size: clamp(48px, 6vw, 88px); }
    .top { min-height: 100px; }
    .left { height: 100px; }
    .icon { width: 48px; height: 48px; }
    .icon svg { width: 24px; height: 24px; }
    .tape { align-self: end; height: 30px; margin: 4px 0 -22px; }
    .label { font-size: 22px; }
    .count { font-size: 17px; padding: 4px 12px 5px; }
    .count i { width: 11px; height: 11px; }
    .streak { width: 72px; height: 72px; font-size: 30px; }
    .tools { gap: 12px; }
    .app {
        max-width: 1320px;
        grid-template-columns: clamp(230px, 30vw, 400px) minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        grid-template-areas: "top top" "find tape" "find pad" "foot pad";
        column-gap: clamp(24px, 5vw, 64px);
        padding: max(22px, env(safe-area-inset-top)) clamp(18px, 4vw, 48px) max(16px, env(safe-area-inset-bottom));
    }
    .find { align-self: center; padding-bottom: 4vh; }
    .foot { padding-right: 0; }
    .veil { place-items: center; padding-bottom: 16px; }
}
@media (max-height: 520px) and (min-aspect-ratio: 1/1) {
    .top { min-height: 48px; }
    .brand b { font-size: 26px; }
    .score b { font-size: 30px; }
    .streak { width: 46px; height: 46px; font-size: 19px; }
    .find { padding-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) {
    .face.spin { animation: none; }
    .tape.low.shake { animation: none; }
    .card { transition: none; transform: none; }
}
</style>
</head>
<body>
<main class="app" id="app" data-state="title">
    <header class="top">
        <div class="left">
            <div class="brand" id="brand"><b>Peel <i>&amp;</i> Seek</b><small id="brandSub">find the sticker</small></div>
            <div class="score" id="score" aria-live="off"><small>Score</small><b id="scoreNum">0</b></div>
        </div>
        <div class="tools">
            <div class="streak" id="streak" aria-hidden="true"><span>×</span><em id="multNum" style="font-style:normal">1</em><svg class="ring3" id="ring3" viewBox="0 0 70 70"></svg></div>
            <button class="icon" id="pauseBtn" aria-label="Pause">
                <svg viewBox="0 0 20 20"><rect x="4.5" y="3.5" width="4" height="13" rx="1.5" fill="#22201c"/><rect x="11.5" y="3.5" width="4" height="13" rx="1.5" fill="#22201c"/></svg>
            </button>
            <button class="icon" id="soundBtn" aria-label="Sound on" aria-pressed="true">
                <svg viewBox="0 0 20 20"><path d="M3 7.5h3l4.5-3.5v12L6 12.5H3z" fill="#22201c"/>
                    <path class="on" d="M13.2 7.2a4 4 0 0 1 0 5.6M15.4 5a7 7 0 0 1 0 10" stroke="#0078bf" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                    <path class="off" d="M13 7.5l5 5M18 7.5l-5 5" stroke="#ff48b0" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
        </div>
    </header>

    <section class="find">
        <div class="stampWrap">
            <div class="stamp" id="stamp" role="img" aria-live="polite" aria-label="Find"><span class="e" id="stampEmoji"></span></div>
            <div class="label" id="label">find!</div>
            <div class="count" id="count"></div>
        </div>
    </section>

    <div class="tape" id="tape"><div class="fill" id="fill"></div></div>

    <section class="pad" id="pad" aria-label="Sticker sheet"></section>

    <footer class="foot" id="foot">
        <span id="bestLine"></span>
        <button class="link" id="modeBtn">today's sheet →</button>
    </footer>
</main>

<div class="fx" id="fx" aria-hidden="true"></div>

<div class="veil" id="pauseVeil">
    <div class="card pausecard">
        <div class="k">paused</div>
        <div class="big">The tape waits.</div>
        <p>The sheet is face down until you come back.</p>
        <button class="again" id="resumeBtn">Carry on</button>
    </div>
</div>

<div class="veil" id="overVeil">
    <div class="card" role="dialog" aria-labelledby="overKind">
        <div class="missed" id="missed"><div class="stamp small"><span class="e" id="missedEmoji"></span></div><span class="note">you missed</span></div>
        <div class="newbest" id="newBest">new<br>best!</div>
        <div class="k" id="overKind">time's up</div>
        <div class="big" id="overScore">0</div>
        <div class="stats">
            <div><b id="stFinds">0</b>finds</div>
            <div><b id="stStreak">0</b>best run</div>
            <div><b id="stSheet">1</b>round</div>
        </div>
        <button class="again" id="againBtn">Play again</button>
        <div class="row"><span id="overBest"></span><button class="link" id="overMode">today's sheet →</button></div>
    </div>
</div>

<script id="core">
// The rules of Peel & Seek, with no DOM, so test/emoji_puzzle_mania.mjs can run them in Node.
// A run is a seeded stream of sheets; every board, target and tilt comes from the seed, so the
// same seed and the same taps at the same moments always give the same run. Time is passed in
// (milliseconds, any clock) rather than read, so a test can play a whole run in a loop.
const Peel = (() => {
    // Families of lookalikes. Decoys come from the target's own family more and more often as
    // the sheets go by: finding the fox among cats and tigers is the game. Emoji 11 or older, so
    // no phone draws a target as an empty box. `still` families change meaning when turned (a
    // moon's phase, a clock's time) and are never tilted.
    const FAMILIES = [
        {id: 'animals', tier: 1, items: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐺', '🦝']},
        {id: 'fruit', tier: 1, items: ['🍎', '🍏', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍈', '🍒', '🍑', '🥭', '🍍', '🥥', '🥝', '🍅']},
        {id: 'veg', tier: 1, items: ['🥑', '🍆', '🥔', '🥕', '🌽', '🌶️', '🥒', '🥬', '🥦', '🍄', '🥜', '🌰']},
        {id: 'sweets', tier: 1, items: ['🍩', '🍪', '🎂', '🍰', '🧁', '🥧', '🍫', '🍬', '🍭', '🍮', '🍯', '🍦', '🍧', '🍨']},
        {id: 'sea', tier: 1, items: ['🐳', '🐋', '🐬', '🐟', '🐠', '🐡', '🦈', '🐙', '🦑', '🦐', '🦞', '🦀']},
        {id: 'birds', tier: 1, items: ['🐔', '🐧', '🐦', '🐤', '🐣', '🐥', '🦆', '🦅', '🦉', '🦜', '🦚', '🦢']},
        {id: 'bugs', tier: 1, items: ['🐛', '🦋', '🐌', '🐞', '🐜', '🦗', '🕷️', '🦂', '🦟', '🐝']},
        {id: 'plants', tier: 1, items: ['🌵', '🎄', '🌲', '🌳', '🌴', '🌱', '🌿', '☘️', '🍀', '🍁', '🍂', '🍃']},
        {id: 'flowers', tier: 1, items: ['🌷', '🌹', '🥀', '🌺', '🌸', '🌼', '🌻', '💐', '🏵️']},
        {id: 'balls', tier: 1, items: ['⚽', '🏀', '🏈', '⚾', '🥎', '🎾', '🏐', '🏉', '🎱', '🥏', '🏓']},
        {id: 'vehicles', tier: 1, items: ['🚗', '🚕', '🚙', '🚌', '🚎', '🏎️', '🚓', '🚑', '🚒', '🚐', '🚚', '🚛', '🚜']},
        {id: 'smileys', tier: 2, items: ['😀', '😃', '😄', '😁', '😆', '😅', '😂', '🤣', '🙂', '😊', '😇', '😉', '😌', '😍', '🥰', '😘', '😋', '😛']},
        {id: 'faces', tier: 2, items: ['😐', '😑', '😶', '🙄', '😏', '😒', '😬', '🤐', '😯', '😮', '😲', '😳', '🥺', '😦', '😧', '😟']},
        {id: 'cats', tier: 2, items: ['😺', '😸', '😹', '😻', '😼', '😽', '🙀', '😿', '😾']},
        {id: 'weather', tier: 2, items: ['☀️', '🌤️', '⛅', '🌥️', '☁️', '🌦️', '🌧️', '⛈️', '🌩️', '🌨️', '❄️', '🌪️', '🌈']},
        {id: 'hearts', tier: 2, items: ['💖', '💗', '💓', '💞', '💕', '💘', '💝', '💟', '❣️', '💔']},
        {id: 'moons', tier: 3, still: true, items: ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘', '🌙', '🌚', '🌛', '🌜', '🌝']},
        {id: 'clocks', tier: 3, still: true, items: ['🕐', '🕑', '🕒', '🕓', '🕔', '🕕', '🕖', '🕗', '🕘', '🕙', '🕚', '🕛']},
    ];

    const START_MS = 15000;      // on the tape when the starter sticker is found
    const MAX_MS = 20000;        // the tape is never longer than this
    const MISS_MS = 3000;        // a wrong sticker tears this much off
    const FINDS = 5;             // finds to a round; each round is a new sheet
    const REFRESH_MS = 360;      // a find: the board flips over; the clock waits and taps wait
    const SHEET_MS = 720;        // a finished sheet peels off and the next slides in
    const COPY_MS = 700;         // each copy found on a collector sheet
    const CLEAR_MS = 4000;       // clearing a collector sheet
    const CLEAR_HOLD_MS = 1200;  // ... which shows its cleared sticker before it peels off
    const FAST_MS = 2500;        // a find quicker than this pays up to double

    // Rounds 1..12 by hand; after that the last row repeats with a collector every fourth.
    //   cols, similar (share of decoys from the target's family), tilt (share turned well off
    //   straight), spin (share that keep turning), copies (a collector sheet when > 0)
    const SHEETS = [
        [3, .3, 0, 0, 0],
        [4, .25, 0, 0, 0],
        [4, .5, 0, 0, 0],
        [4, .5, 0, 0, 3],
        [5, .55, 0, 0, 0],
        [5, .7, .35, 0, 0],
        [5, .8, .45, .12, 0],
        [5, .8, .45, .12, 4],
        [6, .8, .4, .1, 0],
        [6, .9, .55, .18, 0],
        [6, 1, .65, .25, 0],
        [6, 1, .65, .25, 5],
    ];

    function sheetSpec(n) {
        const row = SHEETS[Math.min(n, SHEETS.length) - 1].slice();
        if (n > SHEETS.length) {
            row[2] = Math.min(.85, .65 + (n - 12) * .03);
            row[3] = Math.min(.45, .25 + (n - 12) * .03);
            row[4] = n % 4 === 0 ? 5 : 0;
        }
        const [cols, similar, tilt, spin, copies] = row;
        return {n, cols, cells: cols * cols, similar, tilt, spin, copies, tier: n <= 3 ? 1 : n <= 8 ? 2 : 3};
    }

    // Seconds a find puts back on the tape: generous early, a little under two at sheet ten.
    const bonusMs = n => Math.max(1200, 2600 - 120 * (n - 1));
    const multiplier = streak => Math.min(6, 1 + Math.floor(streak / 3));
    const round5 = x => Math.round(x / 5) * 5;

    function hash(str) {
        let h = 2166136261;
        for (const ch of String(str)) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
        return h >>> 0;
    }

    function rng(seed) {
        let a = seed >>> 0;
        const next = () => {
            a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
        next.int = n => Math.floor(next() * n);
        next.pick = arr => arr[Math.floor(next() * arr.length)];
        return next;
    }

    // One board. `avoid` is the previous target, never repeated straight away.
    function makeBoard(rand, spec, avoid) {
        const pool = FAMILIES.filter(f => f.tier <= spec.tier);
        let fam, target;
        do {
            fam = rand.pick(pool);
            target = rand.pick(fam.items);
        } while (target === avoid);
        const others = pool.filter(f => f !== fam);
        const cells = [];
        const answers = [];
        const spots = new Set();
        const copies = Math.max(1, spec.copies);
        while (spots.size < copies) spots.add(rand.int(spec.cells));
        for (let i = 0; i < spec.cells; i++) {
            let e;
            if (spots.has(i)) {
                e = target;
                answers.push(i);
            } else {
                // A lookalike from the target's family, or anything else. Small boards try not
                // to repeat a decoy, so a nine-sticker sheet shows nine different things.
                const near = rand() < spec.similar;
                for (let tries = 0; tries < 6; tries++) {
                    if (near) do e = rand.pick(fam.items); while (e === target);
                    else e = rand.pick(rand.pick(others).items);
                    if (spec.cells > 16 || !cells.some(c => c.e === e)) break;
                }
            }
            const still = fam.still || FAMILIES.find(f => f.items.includes(e)).still;
            // Every sticker sits a little crooked, as stuck by hand; some are turned well off.
            let tilt = (rand() - .5) * 14;
            let spin = 0;
            if (!still && rand() < spec.tilt) tilt = (rand() < .5 ? -1 : 1) * (35 + rand() * 145);
            if (!still && rand() < spec.spin) spin = (rand() < .5 ? -1 : 1) * (35 + rand() * 55);
            cells.push({e, tilt: Math.round(tilt), spin: Math.round(spin)});
        }
        return {target, family: fam.id, cols: spec.cols, cells, answers, left: answers.slice()};
    }

    // The starter: a small, easy board whose find starts the clock. On the title and after
    // every run, so the first second of a run is never spent before the player is ready.
    function starterBoard(rand, avoid) {
        return makeBoard(rand, {cols: 3, cells: 9, similar: .25, tilt: 0, spin: 0, copies: 0, tier: 1}, avoid);
    }

    function newRun(seed) {
        const rand = rng(seed);
        const run = {
            seed, rand, sheet: 0, found: 0, score: 0, streak: 0, bestStreak: 0,
            finds: 0, misses: 0, fastest: Infinity, started: false, over: false,
            deadline: 0, shownAt: 0, pausedAt: null, board: null,
        };
        run.board = starterBoard(rand);
        return run;
    }

    function remaining(run, t) {
        if (!run.started) return START_MS;
        if (run.over) return 0;
        const now = run.pausedAt ?? t;
        return Math.max(0, run.deadline - now);
    }

    // Ends the run if the tape is empty. Returns true once it is.
    function update(run, t) {
        if (run.started && !run.over && run.pausedAt == null && run.deadline - t <= 0) run.over = true;
        return run.over;
    }

    function pause(run, t) {
        if (run.started && !run.over && run.pausedAt == null) run.pausedAt = t;
    }

    function resume(run, t) {
        if (run.pausedAt == null) return;
        const gone = t - run.pausedAt;
        run.deadline += gone;
        run.shownAt += gone;
        run.pausedAt = null;
    }

    function nextSheet(run, t, hold) {
        run.sheet++;
        run.found = 0;
        run.board = makeBoard(run.rand, sheetSpec(run.sheet), run.board.target);
        run.shownAt = t + hold;
    }

    // A tap on cell i at time t. Returns what happened, or null when the tap does not count
    // (the board is still flipping, the run is over or paused, the spot is already empty).
    function tap(run, i, t) {
        if (run.over || run.pausedAt != null || t < run.shownAt) return null;
        if (update(run, t)) return null;
        const b = run.board;
        if (i < 0 || i >= b.cells.length || b.cells[i] == null) return null;
        const hit = b.cells[i].e === b.target;
        const cols = b.cols;

        if (!run.started) {
            if (!hit) return {type: 'miss', free: true, i};
            run.started = true;
            run.deadline = t + REFRESH_MS + START_MS;
            nextSheet(run, t, REFRESH_MS);
            return {type: 'start', i, remaining: START_MS, sheet: run.sheet, newSheet: true};
        }

        if (!hit) {
            run.misses++;
            run.streak = 0;
            run.deadline -= MISS_MS;
            if (run.deadline - t <= 0) run.over = true;
            return {type: 'miss', i, cost: MISS_MS, over: run.over};
        }

        const spec = sheetSpec(run.sheet);
        run.streak++;
        run.bestStreak = Math.max(run.bestStreak, run.streak);
        run.finds++;
        const mult = multiplier(run.streak);
        const dt = t - run.shownAt;

        if (spec.copies) {
            // A collector sheet: the copy peels off and leaves its spot empty.
            b.cells[i] = null;
            b.left = b.left.filter(x => x !== i);
            let points = round5(cols * cols * 3 * mult);
            let gain = COPY_MS;
            const cleared = b.left.length === 0;
            if (cleared) {
                points += round5(cols * cols * 15 * mult);
                gain += CLEAR_MS;
            }
            run.score += points;
            const hold = cleared ? CLEAR_HOLD_MS : 0;
            run.deadline = Math.min(run.deadline + gain + hold, t + hold + MAX_MS);
            if (cleared) nextSheet(run, t, CLEAR_HOLD_MS);
            return {type: cleared ? 'clear' : 'copy', i, points, mult, streak: run.streak, gain,
                left: cleared ? 0 : b.left.length, newSheet: cleared, sheet: run.sheet};
        }

        run.fastest = Math.min(run.fastest, dt);
        const speed = 1 + Math.max(0, Math.min(1, (FAST_MS - dt) / FAST_MS));
        const points = round5(cols * cols * 5 * speed * mult);
        run.score += points;
        run.found++;
        const done = run.found >= FINDS;
        const hold = done ? SHEET_MS : REFRESH_MS;
        const gain = bonusMs(run.sheet);
        run.deadline = Math.min(run.deadline + gain + hold, t + hold + MAX_MS);
        if (done) nextSheet(run, t, SHEET_MS);
        else {
            run.board = makeBoard(run.rand, spec, b.target);
            run.shownAt = t + REFRESH_MS;
        }
        return {type: 'find', i, points, mult, streak: run.streak, gain, dt, newSheet: done, sheet: run.sheet};
    }

    return {
        FAMILIES, START_MS, MAX_MS, MISS_MS, FINDS, REFRESH_MS, SHEET_MS, COPY_MS, CLEAR_MS, CLEAR_HOLD_MS, FAST_MS,
        sheetSpec, bonusMs, multiplier, hash, rng, makeBoard, starterBoard, newRun, remaining, update,
        pause, resume, tap,
    };
})();
</script>

<script>
(() => {
    const $ = id => document.getElementById(id);
    const app = $('app'), pad = $('pad'), fx = $('fx');
    const stamp = $('stamp'), stampEmoji = $('stampEmoji'), label = $('label'), count = $('count');
    const tape = $('tape'), fill = $('fill'), scoreNum = $('scoreNum'), streakEl = $('streak'), multNum = $('multNum');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    let still = motion.matches;
    motion.addEventListener?.('change', e => { still = e.matches; });

    // ---- saved things: best scores, today's best, sound ----
    const KEY = 'peelAndSeek';
    const save = (() => {
        const base = {best: 0, daily: {}, muted: false, runs: 0};
        try { return Object.assign(base, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { return base; }
    })();
    const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch { /* private mode */ } };

    const two = n => String(n).padStart(2, '0');
    const today = () => { const d = new Date(); return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}`; };
    const prettyDay = () => new Date().toLocaleDateString(undefined, {day: 'numeric', month: 'short'});
    const fmt = n => Math.round(n).toLocaleString('en-US').replace(/,/g, ' ');
    const params = new URLSearchParams(location.search);
    let mode = params.has('daily') ? 'daily' : 'free';

    // ---- sound: all synthesised, nothing to load ----
    const Sfx = (() => {
        let ac = null, out = null, noise = null;
        const init = () => {
            if (ac) return;
            const C = window.AudioContext || window.webkitAudioContext;
            if (!C) return;
            ac = new C();
            out = ac.createGain();
            out.gain.value = .55;
            out.connect(ac.destination);
            noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
            const d = noise.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        };
        const live = () => ac && !save.muted;
        const env = (g, t, vol, dur, attack = .004) => {
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol, t + attack);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        };
        const tone = (f, t, dur, type = 'triangle', vol = .25, to = null) => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = type;
            o.frequency.setValueAtTime(f, t);
            if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
            env(g, t, vol, dur);
            o.connect(g).connect(out);
            o.start(t);
            o.stop(t + dur + .02);
        };
        const hiss = (t, dur, f0, f1, vol = .2, q = 1, type = 'bandpass') => {
            const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
            s.buffer = noise;
            f.type = type;
            f.Q.value = q;
            f.frequency.setValueAtTime(f0, t);
            f.frequency.exponentialRampToValueAtTime(f1, t + dur);
            env(g, t, vol, dur, .006);
            s.connect(f).connect(g).connect(out);
            s.start(t, Math.random() * .5);
            s.stop(t + dur + .02);
        };
        // a major pentatonic from C5: the blip climbs it as the run of finds grows
        const PENTA = [0, 2, 4, 7, 9];
        const note = n => 523.25 * Math.pow(2, (12 * Math.floor(n / 5) + PENTA[n % 5]) / 12);
        return {
            unlock() { init(); if (ac && ac.state === 'suspended') ac.resume(); },
            peel(streak) {
                if (!live()) return;
                const t = ac.currentTime, n = Math.min(streak, 14);
                hiss(t, .08, 1200, 6000, .32, 1.4);
                tone(note(n), t + .015, .17, 'triangle', .26);
                tone(note(n) * 2, t + .015, .07, 'sine', .07);
            },
            miss(soft) {
                if (!live()) return;
                const t = ac.currentTime;
                tone(170, t, .2, 'triangle', soft ? .16 : .3, 85);
                hiss(t, .14, 700, 180, soft ? .12 : .22, .8, 'lowpass');
            },
            stamp() { if (live()) tone(110, ac.currentTime, .08, 'sine', .3, 55); },
            sheet() {
                if (!live()) return;
                const t = ac.currentTime;
                hiss(t, .32, 380, 2600, .16, .6);
                tone(note(7), t + .12, .12, 'triangle', .16);
                tone(note(9), t + .2, .2, 'triangle', .16);
            },
            clear() {
                if (!live()) return;
                const t = ac.currentTime;
                [5, 7, 9, 10, 12].forEach((n, k) => tone(note(n), t + k * .06, .22, 'triangle', .2));
            },
            tick() { if (live()) tone(1250, ac.currentTime, .035, 'sine', .12); },
            lose() {
                if (!live()) return;
                const t = ac.currentTime;
                tone(note(7) / 2, t + .05, .16, 'triangle', .18, note(2) / 2);
                tone(note(2) / 2, t + .2, .3, 'triangle', .18, note(0) / 4);
            },
            over() {
                if (!live()) return;
                const t = ac.currentTime;
                [4, 2, 0].forEach((n, k) => tone(note(n) / 2, t + k * .14, k === 2 ? .5 : .18, 'triangle', .22));
            },
        };
    })();
    const buzz = ms => { try { navigator.vibrate?.(ms); } catch { /* not allowed */ } };

    // ---- helpers for motion ----
    const play = (el, frames, opts) => el.animate(frames, Object.assign({easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'none'}, opts));
    const center = el => { const r = el.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height}; };
    const spawn = (cls, html, x, y) => {
        const el = document.createElement('div');
        el.className = cls;
        el.innerHTML = html;
        fx.appendChild(el);
        el.style.transform = `translate(${x}px, ${y}px)`;
        return el;
    };

    // ---- the sheet on screen ----
    let sheetEl = null;
    let cells = [];
    let size = 300;

    function layout() {
        if (!sheetEl) return;
        const w = pad.clientWidth, h = pad.clientHeight - 24;
        size = Math.max(160, Math.floor(Math.min(w, h, 720)));
        const cols = +sheetEl.dataset.cols;
        const sp = cols >= 6 ? .04 : .05, sg = cols >= 6 ? .022 : .032;
        const cell = size * (1 - 2 * sp - (cols - 1) * sg) / cols;
        app.style.setProperty('--s', size + 'px');
        for (const s of pad.querySelectorAll('.sheet')) {
            s.style.setProperty('--s', size + 'px');
            s.style.setProperty('--sp', sp * 100 + '%');
            s.style.setProperty('--sg', sg * 100 + '%');
            s.style.setProperty('--fs', (cell * .6).toFixed(1) + 'px');
        }
    }
    new ResizeObserver(layout).observe(pad);

    function paint(btn, cell) {
        const face = btn.firstChild.lastChild;
        if (!cell) {
            btn.classList.add('gone');
            btn.setAttribute('aria-hidden', 'true');
            return;
        }
        btn.classList.remove('gone');
        btn.removeAttribute('aria-hidden');
        btn.setAttribute('aria-label', cell.e);
        setFace(face, cell);
    }
    function setFace(face, cell) {
        face.textContent = cell.e;
        face.style.setProperty('--r', cell.tilt + 'deg');
        face.classList.toggle('spin', !!cell.spin);
        face.classList.toggle('ccw', cell.spin < 0);
        if (cell.spin) face.style.setProperty('--spin', (360 / Math.abs(cell.spin)).toFixed(2) + 's');
    }

    function buildSheet(board) {
        const el = document.createElement('div');
        el.className = 'sheet' + (run.started && Peel.sheetSpec(run.sheet).copies ? ' collector' : '');
        el.dataset.cols = board.cols;
        el.style.setProperty('--cols', board.cols);
        el.dataset.label = sheetLabel();
        board.cells.forEach((c, i) => {
            const b = document.createElement('button');
            b.className = 'st';
            b.dataset.i = i;
            b.innerHTML = '<span class="body"><span class="face"></span></span>';
            paint(b, c);
            el.appendChild(b);
        });
        return el;
    }

    // A round is one sheet: five finds, each on fresh stickers, then the sheet peels away.
    const sheetLabel = () => {
        if (!run.started) return mode === 'daily' ? `today · ${prettyDay()}` : '';
        const spec = Peel.sheetSpec(run.sheet);
        return `${spec.copies ? 'collector ' : ''}round ${run.sheet}`;
    };

    function mountSheet(board, how) {
        const old = sheetEl;
        sheetEl = buildSheet(board);
        cells = [...sheetEl.children];
        pad.appendChild(sheetEl);
        layout();
        if (!old) {
            if (!still) cells.forEach((b, k) => play(b.firstChild, [{transform: 'scale(0) rotate(-30deg)'}, {transform: 'scale(1.08)', offset: .7}, {transform: 'none'}], {duration: 320, delay: 60 + k * 22, fill: 'backwards'}));
            return;
        }
        if (still) { old.remove(); return; }
        if (how === 'peel') {
            // the finished sheet is peeled off the pad and the next one is underneath
            old.style.zIndex = 2;
            old.dataset.label = '';
            play(old, [{transform: 'rotate(.6deg)', opacity: 1}, {transform: 'translate(-8%, -10%) rotate(-7deg) scale(1.02)', opacity: 1, offset: .45}, {transform: 'translate(-30%, -34%) rotate(-16deg) scale(1.04)', opacity: 0}],
                {duration: 340, easing: 'cubic-bezier(.45,0,.8,.45)', fill: 'forwards'}).onfinish = () => old.remove();
            play(sheetEl, [{transform: 'translateY(46px) rotate(2deg)', opacity: 0}, {transform: 'rotate(.6deg)', opacity: 1}], {duration: 360, delay: 300, easing: 'cubic-bezier(.2,.9,.3,1.04)', fill: 'backwards'});
        } else {
            play(old, [{opacity: 1, transform: 'rotate(.6deg)'}, {opacity: 0, transform: 'translateY(26px) rotate(2deg)'}], {duration: 260, fill: 'forwards'}).onfinish = () => old.remove();
            play(sheetEl, [{opacity: 0, transform: 'translateY(-16px) rotate(-1deg)'}, {opacity: 1, transform: 'rotate(.6deg)'}], {duration: 380, delay: 120, fill: 'backwards'});
        }
    }

    // A find on the same sheet: every sticker flips over, in a ripple out from the finger.
    function flipBoard(board, from) {
        const cols = board.cols;
        const fr = Math.floor(from / cols), fc = from % cols;
        let far = 0;
        for (let k = 0; k < cells.length; k++) far = Math.max(far, Math.hypot(Math.floor(k / cols) - fr, k % cols - fc));
        sheetEl.dataset.label = sheetLabel();
        // A fresh deal, in a wave out from the finger: each old sticker lifts away while its
        // replacement is slapped down on the same spot, so the sheet is never empty.
        cells.forEach((btn, k) => {
            const body = btn.firstChild;
            const old = body.lastChild;
            const cell = board.cells[k];
            if (still) { paint(btn, cell); play(body, [{opacity: .3}, {opacity: 1}], {duration: 180}); return; }
            const face = document.createElement('span');
            face.className = 'face';
            setFace(face, cell);
            body.appendChild(face);
            btn.setAttribute('aria-label', cell.e);
            const delay = k === from ? 0 : Math.hypot(Math.floor(k / cols) - fr, k % cols - fc) / (far || 1) * 110;
            const ot = parseFloat(old.style.getPropertyValue('--r')) || 0;
            play(old, [{transform: `rotate(${ot}deg) scale(1)`}, {transform: `rotate(${ot - 25}deg) scale(0)`}],
                {duration: k === from ? 1 : 110, delay, easing: 'cubic-bezier(.55,0,.9,.5)', fill: 'forwards'}).onfinish = () => old.remove();
            play(face, [{transform: `rotate(${cell.tilt + 25}deg) scale(0)`}, {transform: `rotate(${cell.tilt - 3}deg) scale(1.12)`, offset: .65}, {transform: `rotate(${cell.tilt}deg) scale(1)`}],
                {duration: 190, delay: delay + 75, easing: 'cubic-bezier(.25,.6,.4,1)', fill: 'backwards'});
        });
    }

    // ---- the target stamp, the tape, the score ----
    let stampTarget = null;
    function showTarget(board, force) {
        const multi = board.answers.length > 1;
        if (multi) count.textContent = `${board.answers.length - board.left.length} of ${board.answers.length}`;
        else {
            // five dots, one per find: the fifth peels the sheet off
            const n = run.started ? run.found : 0;
            count.innerHTML = `<b>${Math.max(1, run.sheet)}</b>` + '<i></i>'.repeat(Peel.FINDS);
            const dots = count.querySelectorAll('i');
            dots.forEach((d, k) => d.classList.toggle('on', k < n));
            const dot = dots[n - 1];
            if (dot && !still && !force) play(dot, [{transform: 'scale(2.2)'}, {transform: 'scale(1)'}], {duration: 300, easing: 'cubic-bezier(.3,1.6,.5,1)'});
        }
        label.textContent = multi ? `find all ${board.answers.length}!` : 'find!';
        stamp.setAttribute('aria-label', (multi ? `Find all ${board.answers.length} of ` : 'Find ') + board.target);
        if (board.target === stampTarget && !force) return;
        stampTarget = board.target;
        const r = (Math.random() - .5) * 12;
        if (still || force) { stampEmoji.textContent = board.target; stamp.style.transform = `rotate(${r}deg)`; return; }
        const from = stamp.style.transform || 'none';
        stamp.style.transform = `rotate(${r}deg)`;
        play(stamp, [{transform: from}, {transform: `rotate(${r - 8}deg) scale(.8)`, offset: .4}, {transform: `rotate(${r + 3}deg) scale(1.08)`, offset: .75}, {transform: `rotate(${r}deg)`}],
            {duration: 260, easing: 'cubic-bezier(.3,0,.5,1)'});
        setTimeout(() => { if (stampTarget === board.target) stampEmoji.textContent = board.target; Sfx.stamp(); }, 100);
    }

    let tapeShown = 1, shownScore = 0, lastTick = 0;
    function drawTape(ratio, dt) {
        tapeShown += (ratio - tapeShown) * (still ? 1 : 1 - Math.exp(-dt / 70));
        fill.style.transform = `scaleX(${Math.max(0, tapeShown).toFixed(4)})`;
    }
    function tapeEnd() {
        const r = tape.getBoundingClientRect();
        return {x: r.left + r.width * Math.max(0, Math.min(1, tapeShown)), y: r.top + r.height / 2, w: r.width, h: r.height, left: r.left};
    }

    let mult = 1;
    // three segments round the badge: each find fills one, the third raises the multiplier
    const ring3 = $('ring3');
    ring3.innerHTML = [0, 1, 2].map(k => {
        const a0 = (-90 + k * 120 + 9) * Math.PI / 180, a1 = (-90 + k * 120 + 111) * Math.PI / 180;
        const p = a => `${(35 + 31 * Math.cos(a)).toFixed(2)} ${(35 + 31 * Math.sin(a)).toFixed(2)}`;
        return `<path d="M${p(a0)} A31 31 0 0 1 ${p(a1)}"/>`;
    }).join('');
    const segs = [...ring3.children];
    // The badge is the multiplier; its ring fills a third with each find and every third find raises it.
    function showStreak(streak, broken) {
        const m = Peel.multiplier(streak);
        const filled = m >= 6 ? 3 : streak % 3;
        segs.forEach((p, k) => p.classList.toggle("on", k < filled));
        multNum.textContent = m;
        streakEl.classList.toggle('hot', m >= 2);
        if (!still) {
            if (broken && mult > 1) streakChip(`×${mult} → ×1`, 'chip big');
            else if (m > mult) streakChip('streak ×' + m, 'chip hot');
            if (broken && mult > 1) {
                Sfx.lose();
                play(streakEl, [{transform: 'rotate(9deg) scale(1)', background: '#ff48b0'}, {transform: 'translateY(10px) rotate(-24deg) scale(.7)', background: '#ff48b0', offset: .3},
                    {transform: 'rotate(18deg) scale(1.06)', offset: .7}, {transform: 'rotate(9deg) scale(1)'}], {duration: 560, easing: 'ease-out'});
            }
            else if (m > mult) play(streakEl, [{transform: 'rotate(-30deg) scale(.4)'}, {transform: 'rotate(16deg) scale(1.2)', offset: .6}, {transform: 'rotate(9deg) scale(1)'}], {duration: 420});
            else if (!broken && streak) play(streakEl, [{transform: 'rotate(9deg) scale(1)'}, {transform: 'rotate(4deg) scale(1.1)'}, {transform: 'rotate(9deg) scale(1)'}], {duration: 220});
        }
        mult = m;
    }
    function streakChip(text, cls) {
        const r = streakEl.getBoundingClientRect();
        chip(text, r.left - 8, r.top + r.height / 2, cls, 'right');
    }

    // ---- effects ----
    function flyToStamp(btn) {
        const c = center(btn.firstChild), s = center(stamp);
        const face = btn.firstChild.lastChild;
        const fs = parseFloat(getComputedStyle(face).fontSize);
        const el = spawn('fly', `<span style="font-size:${fs}px;--fs:${fs}px">${face.textContent}</span>`, 0, 0);
        el.style.width = el.style.height = c.w + 'px';
        const x0 = c.x - c.w / 2, y0 = c.y - c.h / 2;
        btn.firstChild.style.opacity = 0;
        requestAnimationFrame(() => { btn.firstChild.style.opacity = ''; });
        if (still) {
            play(el, [{transform: `translate(${x0}px,${y0}px)`, opacity: 1}, {transform: `translate(${x0}px,${y0}px)`, opacity: 0}], {duration: 200}).onfinish = () => el.remove();
            return;
        }
        const dx = s.x - c.x, dy = s.y - c.y;
        const k = (s.w * .55) / c.w;
        play(el, [
            {transform: `translate(${x0}px,${y0}px) perspective(300px) rotateX(0deg) rotate(0deg) scale(1)`, opacity: 1},
            {transform: `translate(${x0 + dx * .06}px,${y0 - 16 + dy * .04}px) perspective(300px) rotateX(28deg) rotate(-14deg) scale(1.3)`, opacity: 1, offset: .3},
            {transform: `translate(${x0 + dx}px,${y0 + dy}px) perspective(300px) rotateX(0deg) rotate(8deg) scale(${(k * .5).toFixed(2)})`, opacity: 1, offset: .92},
            {transform: `translate(${x0 + dx}px,${y0 + dy}px) perspective(300px) rotateX(0deg) rotate(8deg) scale(${(k * .3).toFixed(2)})`, opacity: 0},
        ], {duration: 400, easing: 'cubic-bezier(.45,.05,.6,1)', fill: 'forwards'}).onfinish = () => el.remove();
    }

    // A small pill that says what just changed, next to the thing it changed.
    function chip(text, x, y, cls, anchor) {
        const el = spawn(cls, text, 0, 0);
        const w = el.offsetWidth, h = el.offsetHeight;
        const x0 = anchor === 'left' ? x : anchor === 'right' ? x - w : x - w / 2, y0 = y - h / 2;
        if (still) {
            play(el, [{transform: `translate(${x0}px,${y0}px)`, opacity: 1}, {transform: `translate(${x0}px,${y0}px)`, opacity: 0}], {duration: 700, fill: 'forwards'}).onfinish = () => el.remove();
            return;
        }
        play(el, [
            {transform: `translate(${x0}px,${y0 + 6}px) scale(.5)`, opacity: 0},
            {transform: `translate(${x0}px,${y0}px) scale(1.08)`, opacity: 1, offset: .2},
            {transform: `translate(${x0}px,${y0}px) scale(1)`, opacity: 1, offset: .82},
            {transform: `translate(${x0}px,${y0 - 6}px) scale(.8)`, opacity: 0},
        ], {duration: 480, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards'}).onfinish = () => el.remove();
    }

    // A collector sheet cleared: a yellow sticker is slapped onto the middle of it, and it goes
    // when the sheet is peeled off.
    function slap(text) {
        const el = document.createElement('div');
        el.className = 'slap';
        el.textContent = text;
        el.style.left = 'calc(50% - 48px)';
        el.style.top = 'calc(50% - 48px)';
        sheetEl.appendChild(el);
        if (!still) play(el, [{transform: 'rotate(-50deg) scale(2)', opacity: 0}, {transform: 'rotate(14deg) scale(.92)', opacity: 1, offset: .55}, {transform: 'rotate(10deg) scale(1)', opacity: 1}],
            {duration: 300, easing: 'cubic-bezier(.3,0,.4,1)'});
        const c = center(el);
        confetti(c.x, c.y, 24);
    }

    function confetti(x, y, n = 16) {
        if (still) return;
        const colors = ['#ff48b0', '#0078bf', '#ffe800'];
        for (let k = 0; k < n; k++) {
            const el = spawn('bit', '', x, y);
            el.style.background = colors[k % 3];
            if (k % 2) el.style.borderRadius = '50%';
            const a = Math.random() * Math.PI * 2, v = 50 + Math.random() * 90;
            const dx = Math.cos(a) * v, dy = Math.sin(a) * v - 40;
            play(el, [
                {transform: `translate(${x}px,${y}px) rotate(0deg)`, opacity: 1},
                {transform: `translate(${x + dx}px,${y + dy}px) rotate(${k * 47}deg)`, opacity: 1, offset: .45},
                {transform: `translate(${x + dx * 1.2}px,${y + dy + 90}px) rotate(${k * 90}deg)`, opacity: 0},
            ], {duration: 800 + Math.random() * 300, easing: 'cubic-bezier(.2,.6,.5,1)', fill: 'forwards'}).onfinish = () => el.remove();
        }
    }

    function missFx(btn, free) {
        const c = center(btn.firstChild);
        const el = spawn('cross', '✕', 0, 0);
        el.style.fontSize = (c.w * .9).toFixed(0) + 'px';
        const w = el.offsetWidth, h = el.offsetHeight;
        const x0 = c.x - w / 2, y0 = c.y - h / 2;
        play(el, [{transform: `translate(${x0}px,${y0}px) scale(1.5) rotate(-12deg)`, opacity: 0}, {transform: `translate(${x0}px,${y0}px) scale(1) rotate(0)`, opacity: .95, offset: .25},
            {transform: `translate(${x0}px,${y0}px) scale(1)`, opacity: .95, offset: .7}, {transform: `translate(${x0}px,${y0}px) scale(1)`, opacity: 0}], {duration: still ? 500 : 460, fill: 'forwards'}).onfinish = () => el.remove();
        if (!still) play(btn.firstChild, [{transform: 'translateX(0)'}, {transform: 'translateX(-7px) rotate(-6deg)'}, {transform: 'translateX(6px) rotate(5deg)'}, {transform: 'translateX(-4px)'}, {transform: 'translateX(2px)'}, {transform: 'none'}], {duration: 320, easing: 'linear'});
        if (free) return;
        // the cost is shown, not written: a strip of tape tears off and drops
        const t = tapeEnd();
        const w2 = t.w * Peel.MISS_MS / Peel.MAX_MS;
        const scrap = spawn('scrap', '', 0, 0);
        scrap.style.width = w2 + 'px';
        scrap.style.height = t.h + 'px';
        const xs = Math.max(t.left, t.x - w2), ys = t.y - t.h / 2;
        if (still) { scrap.remove(); return; }
        play(scrap, [{transform: `translate(${xs}px,${ys}px) rotate(0)`, opacity: .9}, {transform: `translate(${xs + 8}px,${ys + 70}px) rotate(24deg)`, opacity: 0}], {duration: 650, easing: 'cubic-bezier(.4,0,.8,.6)', fill: 'forwards'}).onfinish = () => scrap.remove();
    }

    // ---- the run ----
    let run = null, state = 'title', raf = 0, lastFrame = 0, hintTimer = 0;

    function seedFor() {
        if (mode === 'daily') return Peel.hash('peel-and-seek:' + today());
        if (params.has('seed')) return Peel.hash(params.get('seed'));
        return (crypto.getRandomValues?.(new Uint32Array(1))[0]) ?? Math.floor(Math.random() * 2 ** 32);
    }

    function setState(s) {
        state = s;
        app.dataset.state = s;
    }

    function newRun(first) {
        run = Peel.newRun(seedFor());
        if (params.has('seed') && mode === 'free') params.delete('seed');
        setState('title');
        shownScore = 0;
        scoreNum.textContent = '0';
        showStreak(0, true);
        tapeShown = 1;
        tape.classList.remove('low', 'shake');
        fill.style.transform = 'scaleX(1)';
        $('brandSub').textContent = mode === 'daily' ? `today's sheet · ${prettyDay()}` : 'find the sticker';
        $('modeBtn').textContent = mode === 'daily' ? 'free play →' : "today's sheet →";
        const best = mode === 'daily' ? (save.daily[today()] || 0) : save.best;
        $('bestLine').innerHTML = best ? `${mode === 'daily' ? "today's best" : 'best'} <b>${fmt(best)}</b>` : (mode === 'daily' ? 'the same for everyone today' : '');
        if (sheetEl && !first) mountSheet(run.board, 'swap');
        else mountSheet(run.board);
        showTarget(run.board, true);
        armHint();
    }

    // Nobody has found the starter yet: after a pause, the right sticker wiggles once.
    function armHint() {
        clearTimeout(hintTimer);
        if (state !== 'title') return;
        hintTimer = setTimeout(() => {
            if (state !== 'title') return;
            const b = cells[run.board.answers[0]];
            if (b) {
                if (!still) play(b.firstChild, [{transform: 'none'}, {transform: 'translateY(-6px) rotate(-16deg) scale(1.2)'}, {transform: 'translateY(-6px) rotate(13deg) scale(1.2)'}, {transform: 'rotate(-7deg) scale(1.08)'}, {transform: 'none'}], {duration: 620, easing: 'ease-in-out'});
                const c = center(b), r = c.w * .62;
                const ring = spawn('ring', '', 0, 0);
                ring.style.width = ring.style.height = 2 * r + 'px';
                play(ring, [{transform: `translate(${c.x - r}px,${c.y - r}px) scale(1.35)`, opacity: .6}, {transform: `translate(${c.x - r}px,${c.y - r}px) scale(1)`, opacity: 1, offset: .2}, {transform: `translate(${c.x - r}px,${c.y - r}px) scale(1.04)`, opacity: 1, offset: .8}, {transform: `translate(${c.x - r}px,${c.y - r}px) scale(1.1)`, opacity: 0}], {duration: 1500, fill: 'forwards'}).onfinish = () => ring.remove();
            }
            armHint();
        }, save.runs ? 4200 : 1700);
    }

    function tapAt(i, x, y) {
        if (state === 'over' || state === 'paused') return;
        const t = performance.now();
        const btn = cells[i];
        const res = Peel.tap(run, i, t);
        if (!res) return;
        if (res.type === 'miss') {
            Sfx.miss(res.free);
            buzz(res.free ? 15 : 40);
            missFx(btn, res.free);
            if (res.free) { armHint(); return; }
            showStreak(0, true);
            if (res.over) end(t);
            return;
        }
        Sfx.peel(res.type === 'start' ? 1 : res.streak);
        buzz(8);
        flyToStamp(btn);
        if (res.type === 'start') {
            clearTimeout(hintTimer);
            setState('play');
            save.runs++;
            persist();
            flipBoard(run.board, i);
            showTarget(run.board);
            loop();
            return;
        }
        const sc = scoreNum.getBoundingClientRect();
        chip('+' + fmt(res.points), sc.left, sc.bottom + 16, 'chip', 'left');
        const te = tapeEnd();
        chip('+' + (res.gain / 1000).toFixed(1).replace(/\.0$/, '') + 's', Math.max(te.left + 30, Math.min(te.x, te.left + te.w - 46)), te.y, 'chip gain');
        showStreak(res.streak);
        if (res.type === 'copy') {
            paint(btn, null);
            showTarget(run.board);
            if (!still) play(count, [{transform: 'translateX(-50%) rotate(-3deg) scale(1.3)'}, {transform: 'translateX(-50%) rotate(-3deg) scale(1)'}], {duration: 260});
            return;
        }
        if (res.type === 'clear') {
            paint(btn, null);
            Sfx.clear();
            slap('cleared!');
        }
        if (res.newSheet) {
            if (res.type !== 'clear') Sfx.sheet();
            setTimeout(() => { if (res.type === 'clear') Sfx.sheet(); mountSheet(run.board, 'peel'); showTarget(run.board); }, still ? 0 : res.type === 'clear' ? 700 : 140);
        } else {
            flipBoard(run.board, i);
            showTarget(run.board);
        }
    }

    function loop() {
        cancelAnimationFrame(raf);
        lastFrame = performance.now();
        const frame = now => {
            const dt = Math.min(100, now - lastFrame);
            lastFrame = now;
            if (state === 'play') {
                if (Peel.update(run, now)) { end(now); return; }
                const left = Peel.remaining(run, now);
                drawTape(left / Peel.MAX_MS, dt);
                const low = left < 3000;
                tape.classList.toggle('low', low);
                tape.classList.toggle('shake', low);
                const sec = Math.ceil(left / 1000);
                if (low && sec !== lastTick) { lastTick = sec; Sfx.tick(); }
            }
            if (shownScore !== run.score) {
                shownScore += (run.score - shownScore) * (still ? 1 : 1 - Math.exp(-dt / 90));
                if (Math.abs(run.score - shownScore) < 1) shownScore = run.score;
                scoreNum.textContent = fmt(shownScore);
            }
            if (state === 'play' || state === 'over' || shownScore !== run.score) raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);
    }

    function end(t) {
        if (state === 'over') return;
        setState('over');
        drawTape(0, 1000);
        tape.classList.remove('shake');
        Sfx.over();
        buzz([20, 60, 20]);
        const key = mode === 'daily' ? today() : null;
        const prev = key ? (save.daily[key] || 0) : save.best;
        const best = run.score > prev;
        if (key) { save.daily = {[key]: Math.max(prev, run.score)}; } else save.best = Math.max(prev, run.score);
        persist();
        // "it was here": the stickers you missed pulse, the rest fall away
        const left = new Set(run.board.left);
        cells.forEach((b, k) => {
            if (still) return;
            if (left.has(k)) {
                play(b.firstChild, [{transform: 'scale(1)'}, {transform: 'scale(1.35)'}, {transform: 'scale(1.25)'}], {duration: 380, easing: 'cubic-bezier(.3,1.5,.5,1)', fill: 'forwards'});
                const c = center(b), r = c.w * .7;
                const ring = spawn('ring', '', 0, 0);
                ring.style.width = ring.style.height = 2 * r + 'px';
                play(ring, [{transform: `translate(${c.x - r}px,${c.y - r}px) scale(1.6)`, opacity: 0}, {transform: `translate(${c.x - r}px,${c.y - r}px) scale(1)`, opacity: 1, offset: .4}, {transform: `translate(${c.x - r}px,${c.y - r}px) scale(1)`, opacity: 1, offset: .85}, {transform: `translate(${c.x - r}px,${c.y - r}px) scale(1)`, opacity: 0}],
                    {duration: 1250, fill: 'forwards'}).onfinish = () => ring.remove();
            } else {
                play(b.firstChild, [{transform: 'none', opacity: 1}, {transform: `translateY(${40 + Math.random() * 40}px) rotate(${(Math.random() - .5) * 90}deg)`, opacity: 0}],
                    {duration: 520, delay: 380 + Math.random() * 260, easing: 'cubic-bezier(.5,0,.9,.5)', fill: 'forwards'});
            }
        });
        $('overKind').textContent = mode === 'daily' ? `today's sheet · ${prettyDay()}` : "time's up";
        $('missedEmoji').textContent = run.board.target;
        $('overScore').textContent = '0';
        $('stFinds').textContent = run.finds;
        $('stStreak').textContent = run.bestStreak;
        $('stSheet').textContent = run.sheet;
        $('newBest').style.display = best && run.score > 0 ? 'grid' : 'none';
        $('overBest').innerHTML = best ? (prev ? `was <b>${fmt(prev)}</b>` : '') : `${key ? "today's best" : 'best'} <b>${fmt(prev)}</b>`;
        $('overMode').textContent = mode === 'daily' ? 'free play →' : "today's sheet →";
        setTimeout(() => {
            $('overVeil').classList.add('show');
            countUp($('overScore'), run.score, still ? 0 : 700, 200);
            if (!still) play($('missed'), [{transform: 'translateX(-50%) rotate(-20deg) scale(1.4)', opacity: 0}, {transform: 'translateX(-50%) rotate(-3deg) scale(.95)', opacity: 1, offset: .7}, {transform: 'translateX(-50%) rotate(-5deg) scale(1)', opacity: 1}], {duration: 380, delay: 120, fill: 'backwards'});
            if (best && run.score > 0 && !still) play($('newBest'), [{transform: 'rotate(-40deg) scale(0)'}, {transform: 'rotate(20deg) scale(1.2)', offset: .65}, {transform: 'rotate(12deg) scale(1)'}], {duration: 520, delay: 260, fill: 'backwards'});
        }, still ? 400 : 1150);
    }

    function countUp(el, to, dur, delay) {
        if (!dur) { el.textContent = fmt(to); return; }
        const t0 = performance.now() + delay;
        const step = now => {
            const k = Math.max(0, Math.min(1, (now - t0) / dur));
            el.textContent = fmt(to * (1 - Math.pow(1 - k, 3)));
            if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }

    function again(newMode) {
        if (newMode) mode = newMode;
        $('overVeil').classList.remove('show');
        newRun();
    }

    function pause() {
        if (state !== 'play') return;
        Peel.pause(run, performance.now());
        setState('paused');
        pad.classList.add('down');
        $('pauseVeil').classList.add('show');
    }

    function resume() {
        if (state !== 'paused') return;
        Peel.resume(run, performance.now());
        pad.classList.remove('down');
        $('pauseVeil').classList.remove('show');
        setState('play');
        loop();
    }

    // ---- input: the press is answered on pointerdown, in the same frame ----
    let pressed = false;
    pad.addEventListener('pointerdown', e => {
        if (e.button > 0) return;
        const btn = e.target.closest('.st');
        if (!btn) return;
        e.preventDefault();
        Sfx.unlock();
        pressed = true;
        tapAt(+btn.dataset.i, e.clientX, e.clientY);
    });
    pad.addEventListener('click', e => {
        const btn = e.target.closest('.st');
        if (!btn) return;
        if (pressed || e.detail > 0) { pressed = false; return; }
        const c = center(btn);
        Sfx.unlock();
        tapAt(+btn.dataset.i, c.x, c.y);
    });
    pad.addEventListener('contextmenu', e => e.preventDefault());

    $('pauseBtn').addEventListener('click', pause);
    $('resumeBtn').addEventListener('click', resume);
    $('pauseVeil').addEventListener('pointerdown', e => { if (e.target === $('pauseVeil')) resume(); });
    $('againBtn').addEventListener('click', () => { Sfx.unlock(); again(); });
    $('overMode').addEventListener('click', () => again(mode === 'daily' ? 'free' : 'daily'));
    $('modeBtn').addEventListener('click', () => { mode = mode === 'daily' ? 'free' : 'daily'; newRun(); });
    const soundBtn = $('soundBtn');
    const showSound = () => {
        soundBtn.classList.toggle('muted', save.muted);
        soundBtn.setAttribute('aria-pressed', String(!save.muted));
        soundBtn.setAttribute('aria-label', save.muted ? 'Sound off' : 'Sound on');
    };
    soundBtn.addEventListener('click', () => { save.muted = !save.muted; persist(); showSound(); Sfx.unlock(); Sfx.stamp(); });
    showSound();

    document.addEventListener('keydown', e => {
        if (state === 'over' && $('overVeil').classList.contains('show') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); Sfx.unlock(); again(); return; }
        if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
            if (state === 'play') pause(); else if (state === 'paused') resume();
        }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
    window.addEventListener('blur', () => pause());

    newRun(true);
})();
</script>
<script src="../logo.js"></script>
</body>
