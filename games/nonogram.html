<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Tesserae - Nonogram Puzzles</title>
<meta name="description" content="Nonogram (picross) as mosaic work: lay tiles on a plaster wall by the numbers, and a hidden picture turns to glaze. 21 hand-made pictures, every one solvable by logic alone. Free in your browser.">
<meta name="theme-color" content="#1b1511">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1511;--night2:#2b211a;
  --plaster:#ecdfc4;--plaster-hi:#f7efdb;--mortar:#cdbb95;--score:#bba684;
  --ink:#2f2218;--ink-dim:#7a694f;
  --lapis:#2d4170;--lapis-hi:#34497d;--lapis-lo:#2a3b69;
  --terra:#c4623a;--terra-hi:#e58a5e;--gold:#dcae4c;
  --text:#ecdfc4;--text-dim:#b9a98a;
  --display:"Cinzel","Trajan Pro","Palatino Linotype",Palatino,Georgia,serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(90% 70% at 50% 35%,#3a2b20 0%,var(--night2) 48%,var(--night) 100%) var(--night);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;display:flex;justify-content:center;opacity:1;transition:opacity .25s var(--ease),transform .3s var(--ease)}
.screen.off{opacity:0;pointer-events:none;transform:scale(.985)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;transition:background .15s}
.ib:active{background:#ffffff1a}

/* ---------- the wall ---------- */
#wall{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.wallin{width:100%;max-width:760px;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.mast{display:flex;align-items:center;gap:14px;padding:6px 2px 18px}
.logo{width:46px;height:46px;border-radius:10px;background:var(--plaster);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px;box-shadow:0 0 0 3px #7a5f36,0 6px 14px -6px #000}
.logo i{background:var(--lapis);border-radius:2px}.logo i:nth-child(2){background:var(--terra)}.logo i:nth-child(5){background:var(--gold)}.logo i:nth-child(4),.logo i:nth-child(6),.logo i:nth-child(7),.logo i:nth-child(9){background:#0000}
.mast h1{font-family:var(--display);font-size:24px;letter-spacing:.24em;font-weight:700;line-height:1}
.mast p{font-size:13px;color:var(--text-dim);margin-top:6px;letter-spacing:.03em}
.total{margin-left:auto;text-align:right;font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.total span{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--text-dim);margin-top:5px;text-transform:uppercase}
.today{width:100%;display:flex;align-items:center;gap:16px;text-align:left;padding:14px 16px 14px 14px;border-radius:18px;background:linear-gradient(#ffffff17,#ffffff0a);box-shadow:inset 0 0 0 1px #ffffff1f,0 14px 30px -18px #000;margin-bottom:24px;transition:transform .15s var(--ease)}
.today:active{transform:scale(.985)}
.today .th{flex:none}
.today b{display:block;font-family:var(--display);letter-spacing:.2em;font-size:12px;color:var(--gold);margin-bottom:6px}
.today strong{display:block;font-family:var(--display);font-size:20px;letter-spacing:.06em}
.today small{display:block;margin-top:5px;font-size:13px;color:var(--text-dim)}
.today .go{margin-left:auto;flex:none;height:44px;padding:0 18px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(var(--terra-hi),var(--terra));color:#2a120a;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;box-shadow:inset 0 1px 0 #fff7,0 6px 14px -6px var(--terra)}
.today.done .go{background:#ffffff14;color:var(--text);box-shadow:inset 0 0 0 1px #ffffff26}
.sethead{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
.sethead h2{font-family:var(--display);font-size:15px;letter-spacing:.24em;font-weight:700}
.sethead span{font-size:12px;letter-spacing:.08em;color:var(--text-dim);font-variant-numeric:tabular-nums}
.sethead i{flex:1;height:1px;background:linear-gradient(90deg,#ffffff2a,#0000)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px;margin-bottom:28px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;transition:transform .15s var(--ease)}
.card:active{transform:scale(.95)}
.card .th{width:100%}
.card em{font-style:normal;font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--text-dim);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card.laid em{color:var(--text)}
.card.next .th{box-shadow:0 0 0 2px var(--gold),0 0 0 6px #dcae4c33}
.th{display:block;aspect-ratio:1;border-radius:12px;background:var(--plaster);padding:7px;box-shadow:inset 0 0 0 1px #fff8,0 0 0 1px #0006,0 8px 16px -10px #000}
.th canvas{display:block;width:100%;height:100%;image-rendering:pixelated;border-radius:4px}
.card .th{position:relative}
.card .th.bare canvas{opacity:.9}
.sw{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:4px}.sw i{width:11px;height:11px;border-radius:3px;box-shadow:0 0 0 1px #0003,inset 0 1px 0 #fff5}
.pct{position:absolute;left:7px;right:7px;bottom:7px;height:4px;border-radius:2px;background:#0003;overflow:hidden}
.pct u{display:block;height:100%;background:var(--terra);border-radius:2px}
.foot{text-align:center;font-size:12px;letter-spacing:.1em;color:var(--text-dim);padding-top:4px}
.foot a{color:inherit}

/* ---------- play ---------- */
#play{padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.layout{position:relative;width:100%;max-width:1040px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.side{width:100%;max-width:520px;flex:none}
.prog{display:flex;gap:12px;align-items:center;padding:8px 8px 8px 4px;border-radius:16px;background:#ffffff0d;box-shadow:inset 0 0 0 1px #ffffff17}
.frame{padding:3px;border-radius:9px;background:var(--plaster);box-shadow:0 0 0 1px #0006,0 0 0 3px #7a5f36,0 5px 12px -6px #000;flex:none}
.frame canvas{display:block;width:44px;height:44px;image-rendering:pixelated;border-radius:2px}
.ps{flex:1;min-width:0}
.big{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--text-dim);letter-spacing:.04em;white-space:nowrap}
.big b{font-family:var(--display);font-size:24px;line-height:1.15;color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.big b.name{letter-spacing:.06em}
.meter{margin:4px 0 5px;height:5px;border-radius:3px;background:#ffffff1a;overflow:hidden}
.meter u{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#6f8bc9,#a8bdec);transition:width .35s var(--ease)}
.tm{font-size:11.5px;letter-spacing:.12em;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap;text-transform:uppercase}
.stage{flex:none;width:100%;display:flex;align-items:center;justify-content:center;transition:height .7s var(--ease)}
.slab{position:relative;padding:6px 8px 8px 4px;border-radius:14px;background:linear-gradient(#f3e8d0,#e8dabd);box-shadow:inset 0 1px 0 #fffc,inset 0 0 0 1px #c9b78f,0 0 0 3px #3d2e21,0 0 0 4px #8d6f3f,0 22px 40px -14px #000;transition:padding .6s var(--ease),border-radius .6s var(--ease)}
.slab.solved{padding:8px}
.slab::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:linear-gradient(105deg,#fff0 38%,#fff9 50%,#fff0 62%) 0 0/300% 100%;background-position:130% 0}
.slab.shine::after{opacity:1;animation:shine 1.1s .1s var(--ease) both}
@keyframes shine{from{background-position:130% 0}to{background-position:-30% 0}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.slab::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.5;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .22  0 0 0 .22 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.board{position:relative;display:grid;transition:grid-template-columns .7s var(--ease),grid-template-rows .7s var(--ease);grid-template-columns:var(--gw) calc(var(--n)*var(--c));grid-template-rows:var(--gh) calc(var(--n)*var(--c))}
.cols{display:grid;grid-template-columns:repeat(var(--n),var(--c));align-items:end;transition:opacity .5s}
.rows{display:grid;grid-template-rows:repeat(var(--n),var(--c));transition:opacity .5s}
.col,.row{font-family:var(--display);font-weight:700;font-size:var(--f);color:var(--ink);line-height:1;font-variant-numeric:lining-nums tabular-nums;transition:color .2s}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:calc(var(--f)*.3);padding-bottom:9px}
.row{display:flex;justify-content:flex-end;align-items:center;gap:calc(var(--f)*.6);padding-right:11px}
.col.g{background:linear-gradient(#0000,#8a6d3a14)}.row.g{background:linear-gradient(90deg,#0000,#8a6d3a14)}
.col.done,.row.done{color:#5c7f55;font-weight:500}
.col.done span,.row.done span{animation:pop .35s var(--ease)}
@keyframes pop{40%{transform:scale(1.35)}}
.col.hot,.row.hot{color:#1d2f5e}
.col.done.hot,.row.done.hot{color:#44683f}
.col.hint,.row.hint{color:var(--terra);animation:hl 1.2s ease-in-out infinite}
@keyframes hl{50%{opacity:.45}}
.grid{position:relative;display:grid;transition:grid-template-columns .7s var(--ease),grid-template-rows .7s var(--ease);grid-template-columns:repeat(var(--n),var(--c));grid-template-rows:repeat(var(--n),var(--c));border-radius:5px;touch-action:none;cursor:pointer;box-shadow:0 0 0 3px #8c7650,inset 0 2px 5px #6b522b55;background:var(--plaster-hi)}
.grid::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;transition:opacity .5s;background:
  linear-gradient(90deg,#8c7650 0 2px,#0000 2px) 0 0/calc(var(--c)*5) 100%,
  linear-gradient(#8c7650 0 2px,#0000 2px) 0 0/100% calc(var(--c)*5),
  linear-gradient(90deg,#b7a27d66 0 1px,#fff8 1px 2px,#0000 2px) 0 0/var(--c) 100%,
  linear-gradient(#b7a27d77 0 1px,#fff8 1px 2px,#0000 2px) 0 0/100% var(--c)}
.band{position:absolute;pointer-events:none;background:#2d417036;box-shadow:inset 0 0 0 1px #2d417033;opacity:0;transition:opacity .12s}
.band.show{opacity:1}
.t{position:relative;display:block}
.t::before{content:"";position:absolute;inset:6%;border-radius:16%;background:linear-gradient(var(--lapis-hi),var(--lapis-lo));box-shadow:inset 0 1px 0 #ffffff40,0 1px 0 #1b2848;opacity:0;transform:scale(1.2);transition:none}
.t.on::before{opacity:1;transform:none;animation:press .17s var(--ease)}
.t.on.still::before{animation:none}
@keyframes press{0%{transform:scale(1.28);opacity:.4;box-shadow:inset 0 1px 0 #ffffff40,0 6px 9px #0006}55%{transform:scale(.93);opacity:1}100%{transform:none}}
.t b{position:absolute;inset:0;opacity:0;transform:scale(.6);transition:opacity .12s,transform .15s var(--ease);background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><path d='M3 3L7 7M7 3L3 7' stroke='%23b9633f' stroke-width='.9' stroke-linecap='round' opacity='.85'/></svg>") center/100% 100% no-repeat}
.t.x b{opacity:1;transform:none}
.t.glint::before{animation:glint .5s calc(var(--k,0)*28ms) ease-out}
@keyframes glint{40%{filter:brightness(1.9) saturate(.8);transform:scale(1.08)}}
.t.crack{animation:shake .32s}
.t.crack::after{content:"";position:absolute;inset:6%;z-index:2;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><path d='M5.5 0L4.4 3 6 4.2 3.8 6.4 5 8 4.2 10' stroke='%23f3e8d0' stroke-width='.7' fill='none'/><path d='M5.5 0L4.4 3 6 4.2 3.8 6.4 5 8 4.2 10' stroke='%23c4623a' stroke-width='.28' fill='none'/></svg>") center/100% 100% no-repeat;animation:fade .7s .15s forwards}
.t.crack::before{opacity:1;transform:none;background:linear-gradient(#5d4b6a,#43355a);animation:fade .55s .1s forwards}
@keyframes fade{to{opacity:0}}
@keyframes shake{20%{transform:translateX(-2px)}45%{transform:translateX(2px)}70%{transform:translateX(-1px)}}
.t.refuse{animation:shake .3s}
.t.pulse::after{content:"";position:absolute;inset:7%;border-radius:18%;border:2px solid var(--terra);animation:pl 1.2s ease-in-out infinite}
.t.pulse.fillhint::after{background:#c4623a22}
@keyframes pl{50%{opacity:.25;transform:scale(.9)}}
/* close-up: big boards on a phone scroll under sticky clues */
.stage.zoomed{overflow:auto;scrollbar-width:none;touch-action:none;justify-content:flex-start;align-items:flex-start;overscroll-behavior:contain}
.stage.zoomed::-webkit-scrollbar{display:none}
.stage.zoomed .slab{margin:auto;flex:none}
.stage.zoomed .corner,.stage.zoomed .cols,.stage.zoomed .rows{position:sticky;background:#efe4ca}
.stage.zoomed .corner{top:0;left:0;z-index:4}
.stage.zoomed .cols{top:0;z-index:3;box-shadow:0 3px 6px -3px #0005}
.stage.zoomed .rows{left:0;z-index:3;box-shadow:3px 0 6px -3px #0005}
/* the reveal */
.grid.solved{cursor:default;box-shadow:0 0 0 3px #8c7650,0 12px 30px -10px #0008}
.grid.solved::before{opacity:0}
.grid.solved .band{display:none}
.grid.solved .t::before{inset:-.4px;border-radius:0;opacity:1;transform:none;background:var(--g);box-shadow:none;animation:flip .62s cubic-bezier(.3,.7,.2,1) calc(var(--d)*30ms + .45s) both}
.grid.solved.instant .t::before{animation:none}
.grid.solved .t b{opacity:0}
@keyframes flip{0%{transform:perspective(200px) rotateX(0);background:var(--from);inset:6%;border-radius:16%}50%{transform:perspective(200px) rotateX(90deg);background:var(--from);inset:6%;border-radius:16%}51%{background:var(--g);inset:-.4px;border-radius:0}100%{transform:perspective(200px) rotateX(0);background:var(--g);inset:-.4px;border-radius:0}}
.grid.solved .t{--from:#f7efdb}.grid.solved .t.on{--from:#2d4170}
.board.solved .cols,.board.solved .rows{opacity:0}
.note{flex:none;width:100%;height:58px;display:flex;align-items:center;justify-content:center}
.chip{max-width:min(100%,460px);padding:8px 16px;border-radius:12px;background:#ffffff14;box-shadow:inset 0 0 0 1px #ffffff22;color:var(--text);font-weight:500;font-size:14px;line-height:1.35;text-align:center;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s var(--ease);pointer-events:none}
.chip.show{opacity:1;transform:none}
.dock{position:relative;width:100%;max-width:520px;flex:none;height:116px}
.tools,.plaque{position:absolute;inset:0;display:grid;gap:8px;transition:opacity .35s,transform .4s var(--ease)}
.tools{grid-template-rows:58px 50px}
.dock.won .tools{transition-duration:.2s}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.18em;color:#f1e6cc;background:#ffffff1c;box-shadow:inset 0 0 0 1px #ffffff26;transition:background .15s,transform .1s}
.seg:active{transform:scale(.98)}
.seg.on{background:linear-gradient(var(--terra-hi),var(--terra));color:#2a120a;box-shadow:inset 0 1px 0 #fff7,0 6px 14px -6px var(--terra)}
.seg .tile{width:20px;height:20px;border-radius:5px;background:linear-gradient(var(--lapis-hi),var(--lapis-lo));box-shadow:inset 0 1px 0 #fff5}
.seg.on .tile{box-shadow:inset 0 1px 0 #fff5,0 0 0 1.5px #2a120a}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acts.z{grid-template-columns:1fr 1fr 1fr 54px}
.rb{height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.06em;color:#e8dcc0;background:#ffffff12;box-shadow:inset 0 0 0 1px #ffffff1c;transition:background .15s,opacity .2s,transform .1s}
.rb:active{transform:scale(.97);background:#ffffff22}
.rb[disabled]{opacity:.35;pointer-events:none}
.rb svg.i{width:20px;height:20px}
.plaque{opacity:0;transform:translateY(14px);pointer-events:none;grid-template-rows:1fr 54px;align-content:end}
.plaque .stats{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:17px;text-transform:uppercase}
.plaque .stats i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.plaque .stats .fl{color:var(--gold)}
.plaque .btns{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.plaque .btn{border-radius:14px;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;background:#ffffff14;box-shadow:inset 0 0 0 1px #ffffff26}
.plaque .btn.pri{background:linear-gradient(var(--terra-hi),var(--terra));color:#2a120a;box-shadow:inset 0 1px 0 #fff7,0 6px 14px -6px var(--terra)}
.dock.won .tools{opacity:0;transform:translateY(14px);pointer-events:none}
.dock.won .plaque{opacity:1;transform:none;pointer-events:auto;transition-delay:.15s}

@media (min-width:900px) and (min-aspect-ratio:1/1){
  #play{padding:24px 28px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:1fr auto auto auto 1fr;column-gap:44px;row-gap:12px;max-width:1120px;align-items:start}
  .stage{grid-column:1;grid-row:1/-1;justify-content:flex-end;height:100%;flex:none}
  .side{grid-column:2;grid-row:2;max-width:none}
  .note{grid-column:2;grid-row:3;justify-content:flex-start}
  .dock{grid-column:2;grid-row:4;max-width:none}
  .prog{flex-direction:column;align-items:stretch;padding:18px 20px 20px;gap:14px;position:relative}
  .prog .ib.back{position:absolute;top:10px;left:8px;z-index:2}
  .prog .ib.snd{position:absolute;top:10px;right:8px;z-index:2}
  .frame{align-self:center;padding:5px;border-radius:12px;box-shadow:0 0 0 1px #0006,0 0 0 5px #7a5f36,0 10px 24px -10px #000;margin-top:6px}
  .frame canvas{width:176px;height:176px;border-radius:3px}
  .big b{font-size:32px}
  .tm{font-size:12px}
}
@media (max-width:899px),(max-aspect-ratio:1/1){
  .prog .ib.back{margin-left:0}
}
@media (max-height:640px){
  .dock{height:104px}.tools{grid-template-rows:52px 44px}.seg{height:52px}.rb{height:44px}.plaque{grid-template-rows:1fr 46px}.note{height:50px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .grid.solved .t::before{animation:none!important}
}
</style>
</head>
<body>

<section id="wall" class="screen off" aria-label="The wall"></section>

<section id="play" class="screen off" aria-label="Puzzle">
 <canvas id="fx"></canvas>
 <div class="layout">
  <header class="side">
   <div class="prog">
    <button class="ib back" id="back" aria-label="Back to the wall"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="frame"><canvas id="thumb" width="40" height="40" aria-label="The picture so far"></canvas></div>
    <div class="ps">
     <div class="big"><b id="cnt">0</b><span id="of"></span></div>
     <div class="meter"><u id="meter"></u></div>
     <div class="tm" id="tm"></div>
    </div>
    <button class="ib snd" id="snd" aria-label="Sound" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16.5 9a4 4 0 010 6"/></svg></button>
   </div>

  }
  for (const j of ev.auto) paint(j);
  for (const L of ev.lines) { stroke.lines.push(L); markDone(L.axis, L.idx); glint(L); }
  if (ev.lines.length) Snd.line();
  if (stroke.mode === 'unlay') { markDone('r', (i / P.w) | 0); markDone('c', i % P.w); }
  if (ev.solved) stroke.solved = true;
  updateHud();
}
function glint(L) {
  for (let k = 0; k < (L.axis === 'r' ? P.w : P.h); k++) {
    const j = L.axis === 'r' ? L.idx * P.w + k : k * P.w + L.idx, el = cells[j];
    if (S.g[j] !== TILE) continue;
    el.style.setProperty('--k', k); el.classList.add('glint'); setTimeout(() => el.classList.remove('glint'), 900);
  }
}
function tellCrack() { if (!crackTold) { crackTold = true; setChip('That square is empty, so it is marked. Cracks are counted.', 4200); } }
function endStroke(s) {
  updateButtons();
  saveNow();
  if (s.solved) { solve(); return; }
  if (coach) {
    if (!cells.some(c => c.classList.contains('pulse'))) {
      if (--coachLeft <= 0 || !TESS.hint(P, S)) { coach = false; save.coach = true; persist(); setChip(''); }
      else setTimeout(() => { if (coach && !won) giveHint(true); }, 650);
    }
  }
}
function undoMove() {
  if (!undo.length || won) return; Snd.init();
  redo.push(TESS.clone(S)); const prev = undo.pop(); const cracks = S.cracks;
  S.g = Uint8Array.from(prev.g); S.moves = prev.moves; S.cracks = cracks; // cracks are never refunded
  resync(); Snd.unlay(); buzz(6);
}
function redoMove() {
  if (!redo.length || won) return; Snd.init();
  undo.push(TESS.clone(S)); const nx = redo.pop(); const cracks = S.cracks;
  S.g = Uint8Array.from(nx.g); S.moves = nx.moves; S.cracks = cracks;
  resync(); Snd.mark();
}
function resync() {
  clearHint(); setChip('');
  for (let i = 0; i < cells.length; i++) paint(i, true);
  for (let r = 0; r < P.h; r++) markDone('r', r); for (let c = 0; c < P.w; c++) markDone('c', c);
  updateHud(); updateButtons(); saveNow();
}
$('undo').onclick = undoMove; $('redo').onclick = redoMove;
addEventListener('keydown', e => {
  if (!P || $('play').classList.contains('off')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redoMove() : undoMove(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redoMove(); }
  else if (e.key === 'x' || e.key === 'X') setTool(tool === 'lay' ? 'mark' : 'lay');
  else if (e.key === 'h' || e.key === 'H') giveHint(false);
  else if (e.key === 'Escape') goWall();
});

$('zoomb').onclick = () => { Snd.init(); zoom = !zoom; fit(); $('stage').scrollLeft = 0; $('stage').scrollTop = 0; };
// two fingers (or one on the clues) move a close-up board
(() => {
  const st = $('stage'), fingers = new Map(); let pan = null;
  const mid = () => { let x = 0, y = 0; fingers.forEach(f => { x += f.x; y += f.y; }); return {x: x / fingers.size, y: y / fingers.size}; };
  const begin = () => { const m = mid(); pan = {x: m.x, y: m.y, l: st.scrollLeft, t: st.scrollTop}; };
  st.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || !st.classList.contains('zoomed')) return;
    fingers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (fingers.size === 2) { cancelStroke(); begin(); }
    else if (!e.target.closest('#grid')) begin();
  }, true);
  st.addEventListener('pointermove', e => {
    const f = fingers.get(e.pointerId); if (!f) return; f.x = e.clientX; f.y = e.clientY;
    if (pan) { const m = mid(); st.scrollLeft = pan.l - (m.x - pan.x); st.scrollTop = pan.t - (m.y - pan.y); }
  });
  const end = e => { fingers.delete(e.pointerId); if (fingers.size === 0) pan = null; else if (pan) begin(); };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  window.fingerCount = () => fingers.size;
})();
function cancelStroke() {
  if (!stroke) return;
  const s = stroke; stroke = null;
  S.g = Uint8Array.from(s.before.g); S.moves = s.before.moves; resync();
}
// ---------------- hints ----------------
let chipTimer = 0;
function setChip(text, ms) {
  clearTimeout(chipTimer);
  if (!text) { chip.classList.remove('show'); return; }
  chip.textContent = text; chip.classList.add('show');
  if (ms) chipTimer = setTimeout(() => chip.classList.remove('show'), ms);
}
function clearHint() {
  hintShown = null;
  cells.forEach(c => c.classList.remove('pulse', 'fillhint'));
  rowEls.forEach(e => e.classList.remove('hint')); colEls.forEach(e => e.classList.remove('hint'));
}
function giveHint(fromCoach) {
  if (won || gallery || !P) return; if (!fromCoach) { Snd.init(); coach = false; }
  clearHint();
  const h = TESS.hint(P, S);
  if (!h) { setChip('Nothing is certain here. Check your marks.', 3000); return; }
  hintShown = h;
  for (const x of h.cells) { cells[x.i].classList.add('pulse'); if (x.v === TILE) cells[x.i].classList.add('fillhint'); }
  (h.axis === 'r' ? rowEls : colEls)[h.idx].classList.add('hint');
  setChip(h.text); Snd.hint();
  if ($('stage').classList.contains('zoomed')) cells[h.cells[0].i].scrollIntoView({block: 'center', inline: 'center', behavior: reduce.matches ? 'auto' : 'smooth'});
}
$('hintb').onclick = () => giveHint(false);

// ---------------- finishing ----------------
function solve() {
  won = true; stopClock(); clearHint(); hideBands(); coach = false; save.coach = true;
  const prev = save.solved[P.id];
  save.solved[P.id] = {t: prev ? Math.min(prev.t, Math.round(elapsed)) : Math.round(elapsed), cracks: prev ? Math.min(prev.cracks, S.cracks) : S.cracks};
  save.dailyDone = byId[TESS.dailyPick(dayKey(), PI.map(p => p.id), {})] === P ? dayKey() : save.dailyDone;
  delete save.cur[P.id]; persist();
  locked = true; setChip('');
  const lastD = P.w + P.h;
  P.glaze.forEach((g, i) => cells[i].style.setProperty('--g', g || P.bg));
  cells.forEach((el, i) => el.style.setProperty('--d', (((i / P.w) | 0) + i % P.w)));
  Snd.win(); buzz([20, 60, 20, 60, 40]);
  gridEl.classList.add('solved'); board.classList.add('solved');
  updateHud(); updateButtons();
  fit(); $('stage').scrollLeft = 0; $('stage').scrollTop = 0;
  const wait = reduce.matches ? 200 : lastD * 30 + 1350;
  revealTimer = setTimeout(() => { fit(); $('slab').classList.add('shine'); confetti(); }, wait);
  setTimeout(() => { finishView(false); locked = false; }, wait + (reduce.matches ? 0 : 1250));
}
function confetti() {
  if (reduce.matches) return;
  const cv = $('fx'), x = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; x.scale(dpr, dpr);
  const r = $('slab').getBoundingClientRect(), cols = [...new Set(P.glaze.filter(Boolean))].concat(['#dcae4c', '#f7efdb']);
  const ps = Array.from({length: 46}, (_, i) => ({x: r.left + r.width * (.1 + .8 * Math.random()), y: r.top + r.height * .55, vx: (Math.random() - .5) * 7, vy: -6 - Math.random() * 7, s: 5 + Math.random() * 7, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[i % cols.length]}));
  const t0 = performance.now();
  (function frame(t) {
    const k = (performance.now() - t0) / 1700; x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height); x.restore();
    if (k >= 1) return;
    for (const p of ps) { p.vy += .38; p.x += p.vx; p.y += p.vy; p.a += p.va; p.vx *= .995; x.save(); x.globalAlpha = Math.min(1, (1 - k) * 2); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); x.restore(); }
    requestAnimationFrame(frame);
  })(t0);
}
function finishView(instant) {
  if (instant) { P.glaze.forEach((g, i) => cells[i].style.setProperty('--g', g || P.bg)); gridEl.classList.add('solved', 'instant'); board.classList.add('solved'); won = true; }
  const rec = save.solved[P.id];
  const cr = rec.cracks;
  $('stats').innerHTML = (cr === 0 ? '<span class="fl">Flawless</span>' : '<span>' + cr + (cr === 1 ? ' crack' : ' cracks') + '</span>') + '<i></i><span>' + (gallery ? 'Best ' : '') + TESS.fmtTime(gallery ? rec.t : Math.round(elapsed)) + '</span>';
  $('pNext').textContent = gallery ? 'Play again' : (nextUnsolved(P) ? 'Next picture' : 'Play again');
  dock.classList.add('won'); updateHud(); updateButtons(); fit();
}
$('pWall').onclick = () => goWall();
$('pNext').onclick = () => {
  Snd.init();
  if (gallery || !nextUnsolved(P)) { openPuzzle(P, true); return; }
  openPuzzle(nextUnsolved(P));
};
$('back').onclick = () => goWall();
$('snd').onclick = () => { Snd.init(); save.sound = !save.sound; persist(); syncSnd(); if (save.sound) Snd.hint(); };
function syncSnd() { const b = $('snd'); b.setAttribute('aria-pressed', save.sound); b.querySelector('.w').style.display = save.sound ? '' : 'none'; b.style.opacity = save.sound ? 1 : .55; }
syncSnd();

// ---------------- start ----------------
(function boot() {
  const hash = (location.hash || '').slice(1), want = byId[hash];
  const anyPlayed = Object.keys(save.solved).length || Object.keys(save.cur).length;
  renderWall();
  if (want) openPuzzle(want);
  else if (!anyPlayed) openPuzzle(PI[0]);
  else { show('wall'); }
  requestAnimationFrame(fit);
})();
window.addEventListener('beforeunload', saveNow);
})();
</script>
</body>
