<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living RPS - Rock Paper Scissors Battle Simulation</title>
<meta name="description" content="Living Rock Paper Scissors: rocks, papers and scissors chase and convert each other across the board. Back a side, read the opening layout, blow gusts to save your army and build a winning streak.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e9dfc8; --desk2:#e2d6bb; --ink:#25221d; --ink2:#5d564a;
  --rock:#4f5661; --paper:#2f66d0; --scis:#e0412f; --gold:#f2b632;
  --card:#fbf6ea;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--desk);color:var(--ink);
  font-family:Archivo,system-ui,sans-serif;font-stretch:100%;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{flex:0 0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px}
#bar{flex:1;height:30px;border-radius:15px;display:flex;overflow:hidden;border:2.5px solid var(--ink);background:var(--card);position:relative}
#bar div{height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;
  transition:flex-grow .35s cubic-bezier(.2,.8,.2,1);min-width:0;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
#bar .r{background:var(--rock)} #bar .p{background:var(--paper)} #bar .s{background:var(--scis)}
#bar div.mine{box-shadow:inset 0 -5px 0 var(--gold)}
#bar div+div{border-left:2px solid var(--ink)}
.iconbtn{flex:0 0 40px;height:40px;border-radius:20px;border:2.5px solid var(--ink);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:active{transform:translateY(1px)}
#stage{flex:1;position:relative;margin:0 12px calc(12px + env(safe-area-inset-bottom));}
canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:22px;display:block;touch-action:none}
#stage::after{content:"";position:absolute;inset:0;border-radius:22px;border:3px solid var(--ink);pointer-events:none}
#gusts{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:7px;align-items:center;pointer-events:none;transition:opacity .3s}
#gusts i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:var(--gold);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
#gusts i.used{background:transparent;transform:scale(.7)}
#gusts i.spend{animation:spend .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes spend{0%{transform:scale(1.6);background:#fff}100%{transform:scale(.7)}}
#gusts b{font-weight:900;font-stretch:115%;font-size:30px;line-height:1;margin-right:8px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
#gusts b.danger span{color:var(--scis);animation:danger .7s ease-in-out infinite alternate}
@keyframes danger{to{transform:scale(1.18)}}
#gusts b span{display:inline-block}
@media (min-width:900px){#bar{height:38px;border-radius:19px}#bar div{font-size:17px}.sheet{width:520px;padding:24px}.sheet h1{font-size:32px}#gusts b{font-size:38px}#gusts i{width:22px;height:22px}}
#gusts b canvas{position:static;width:30px;height:30px;border-radius:0}
#stamp{position:absolute;left:50%;top:16%;transform:translate(-50%,-50%) scale(.6);font-weight:900;font-stretch:125%;font-size:clamp(44px,12vw,84px);
  color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;opacity:0;pointer-events:none;letter-spacing:-.02em;text-shadow:0 5px 0 var(--ink)}
#stamp.show{animation:stamp .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}35%{opacity:1;transform:translate(-50%,-50%) scale(1)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

/* sheets */
.sheet{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));width:min(460px,calc(100% - 24px));
  background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px 18px 16px;box-shadow:0 8px 0 var(--ink);
  transform:translate(-50%,0);transition:transform .45s cubic-bezier(.2,.9,.25,1.1),opacity .3s;z-index:5}
.sheet.hide{transform:translate(-50%,calc(100% + 60px));opacity:0;pointer-events:none}
.sheet h1{font-weight:900;font-stretch:112%;font-size:clamp(21px,6vw,26px);line-height:1.05;letter-spacing:-.01em}
.sheet .sub{font-weight:600;font-size:14px;color:var(--ink2);margin-top:5px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pick{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px 4px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.pick:active,.pick.press{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.pick canvas{position:static;width:40px;height:40px;border-radius:0}
.pick b{font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.pick small{font-weight:800;font-size:12px;text-align:center;line-height:1.5;color:var(--ink2);letter-spacing:.03em}
.pick small em{font-style:normal;color:var(--ink);background:var(--gold);border-radius:6px;padding:0 5px}
.stats{display:flex;gap:16px;margin-top:12px;font-weight:700;font-size:13px;color:var(--ink2)}
.stats b{color:var(--ink);font-weight:900}
.cta{margin-top:14px;width:100%;height:54px;border:3px solid var(--ink);border-radius:16px;background:var(--gold);font-family:inherit;font-weight:900;font-size:19px;
  color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.cta:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
#endTitle{display:flex;align-items:center;gap:12px}
#endTitle canvas{position:static;width:54px;height:54px;border-radius:0;flex:0 0 54px}
#endGain{font-weight:900;font-size:18px;margin-top:10px}
#endGain.lose{color:var(--ink2)}
@media (prefers-reduced-motion:reduce){
  #gusts b.danger span{animation:none}
  #bar div,.sheet,#gusts i{transition:none}
  #stamp.show{animation:fade 1s forwards}
  @keyframes fade{0%,70%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-50%)}}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="bar"><div class="r" id="barR"></div><div class="p" id="barP"></div><div class="s" id="barS"></div></div>
    <button class="iconbtn" id="mute" aria-label="Sound on/off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="muteX" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg>
    </button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="gusts" style="opacity:0"><b id="mineN"></b><i></i><i></i><i></i></div>
    <div id="stamp"></div>
  </div>

  <div class="sheet" id="pickSheet">
    <h1>Who takes the board?</h1>
    <div class="sub">Read the layout. Back one side.</div>
    <div class="picks" id="picks"></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="sheet hide" id="endSheet">
    <div id="endTitle"><canvas id="endIcon" width="108" height="108"></canvas><h1 id="endH"></h1></div>
    <div id="endGain"></div>
    <div class="stats" id="endStats"></div>
    <button class="cta" id="again">Next board</button>
  </div>
</div>

<script id="core">
// DOM-free rules of Living RPS. Kinds: 0 rock, 1 paper, 2 scissors. Each kind beats PREY[kind].
const RPS = (() => {
  const PREY = [2, 0, 1];
  const R = 11;            // unit radius, world units
  const DT = 1 / 60;
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function beats(a, b) { return PREY[a] === b; }
  // Uneven armies so the pick is a decision: 54 units split around 18 each.
  function deal(seed) {
    const r = rng(seed ^ 0x9e3779b9);
    const c = [18, 18, 18];
    for (let i = 0; i < 6; i++) { const a = Math.floor(r() * 3), b = (a + 1 + Math.floor(r() * 2)) % 3; if (c[a] > 12) { c[a]--; c[b]++; } }
    return c;
  }
  function create(seed, w, h) {
    const r = rng(seed);
    const counts = deal(seed);
    const units = [];
    for (let k = 0; k < 3; k++) {
      // each army starts in one or two camps
      const camps = [];
      const nc = 1 + (r() < 0.5 ? 1 : 0);
      for (let i = 0; i < nc; i++) camps.push([w * (0.15 + 0.7 * r()), h * (0.14 + 0.62 * r())]); // mostly above the pick sheet
      for (let i = 0; i < counts[k]; i++) {
        const c = camps[i % nc];
        let x, y, tries = 0;
        do {
          const a = r() * Math.PI * 2, d = Math.sqrt(r()) * 70 + tries;
          x = Math.min(w - R, Math.max(R, c[0] + Math.cos(a) * d));
          y = Math.min(h - R, Math.max(R, c[1] + Math.sin(a) * d));
          tries++;
        } while (tries < 60 && units.some(u => (u.x - x) ** 2 + (u.y - y) ** 2 < (2.2 * R) ** 2));
        units.push({ x, y, vx: 0, vy: 0, k, id: units.length, flip: 0, roll: 0, shape: r() });
      }
    }
    return { w, h, t: 0, units, r, seed, events: [] };
  }
  function counts(s) { const c = [0, 0, 0]; for (const u of s.units) c[u.k]++; return c; }
  function winner(s) { const c = counts(s); const alive = [0, 1, 2].filter(k => c[k] > 0); return alive.length === 1 ? alive[0] : -1; }
  function speedCap(s) { return 62 + Math.max(0, s.t - 30) * 3; } // late game heats up so boards always finish
  function step(s) {
    const us = s.units, n = us.length, cap = speedCap(s), r = s.r;
    s.events = [];
    for (let i = 0; i < n; i++) {
      const u = us[i];
      let px = 0, py = 0, pd = 1e9, qx = 0, qy = 0, qd = 1e9;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const v = us[j], dx = v.x - u.x, dy = v.y - u.y, d = dx * dx + dy * dy;
        if (beats(u.k, v.k)) { if (d < pd) { pd = d; px = dx; py = dy; } }
        else if (beats(v.k, u.k)) { if (d < qd) { qd = d; qx = dx; qy = dy; } }
      }
      let ax = 0, ay = 0;
      if (pd < 1e9) { const d = Math.sqrt(pd) || 1; ax += px / d * 1.0; ay += py / d * 1.0; }
      if (qd < 1e9) { const d = Math.sqrt(qd) || 1; const f = Math.max(0, 1 - d / 160) * 1.5 * Math.max(0.35, 1 - Math.max(0, s.t - 30) / 60); ax -= qx / d * f; ay -= qy / d * f; }
      // wander
      ax += (r() - 0.5) * 0.9; ay += (r() - 0.5) * 0.9;
      // walls push inward
      const m = 30;
      if (u.x < m) ax += (m - u.x) / m * 1.6; if (u.x > s.w - m) ax -= (u.x - s.w + m) / m * 1.6;
      if (u.y < m) ay += (m - u.y) / m * 1.6; if (u.y > s.h - m) ay -= (u.y - s.h + m) / m * 1.6;
      u.vx += ax * 240 * DT; u.vy += ay * 240 * DT;
      const sp = Math.hypot(u.vx, u.vy), lim = cap * (u.boost > 0 ? 3 : 1);
      if (sp > lim) { u.vx *= lim / sp; u.vy *= lim / sp; }
      if (u.boost > 0) u.boost -= DT;
    }
    for (const u of us) {
      u.x += u.vx * DT; u.y += u.vy * DT;
      if (u.x < R) { u.x = R; u.vx = Math.abs(u.vx); } if (u.x > s.w - R) { u.x = s.w - R; u.vx = -Math.abs(u.vx); }
      if (u.y < R) { u.y = R; u.vy = Math.abs(u.vy); } if (u.y > s.h - R) { u.y = s.h - R; u.vy = -Math.abs(u.vy); }
      u.roll += Math.hypot(u.vx, u.vy) * DT / R;
      if (u.flip > 0) u.flip = Math.max(0, u.flip - DT);
    }
    // contacts: winner converts loser, same kind just separate
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = us[i], b = us[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 >= 4 * R * R) continue;
      if (a.k === b.k) {
        const d = Math.sqrt(d2) || 0.01, o = (2 * R - d) / 2;
        a.x -= dx / d * o; a.y -= dy / d * o; b.x += dx / d * o; b.y += dy / d * o;
      } else if (a.flip === 0 && b.flip === 0) {
        const win = beats(a.k, b.k) ? a : b, lose = win === a ? b : a;
        s.events.push({ x: lose.x, y: lose.y, from: lose.k, to: win.k, id: lose.id });
        lose.k = win.k; lose.flip = 0.35; // a just-converted unit can't flip again for a moment
      }
    }
    for (const u of us) { u.x = Math.min(s.w - R, Math.max(R, u.x)); u.y = Math.min(s.h - R, Math.max(R, u.y)); } // separation can push past a wall
    s.t += DT;
  }
  // A gust shoves everything within reach outward.
  function gust(s, x, y) {
    let hit = 0;
    for (const u of s.units) {
      const dx = u.x - x, dy = u.y - y, d = Math.hypot(dx, dy);
      if (d > 120) continue;
      const f = (1 - d / 120) * 520 + 120, dd = d || 1;
      u.vx += dx / dd * f; u.vy += dy / dd * f; u.boost = 0.5; hit++;
    }
    return hit;
  }
  function payout(c, k) { const tot = c[0] + c[1] + c[2]; return Math.round(tot / c[k] * 10) / 10; }
  function award(c, k) { return Math.round(100 * payout(c, k)); }
  return { PREY, R, DT, rng, beats, deal, create, counts, winner, step, gust, payout, award };
})();
</script>

<script>
(() => {
const KIND = ['Rock', 'Paper', 'Scissors'];
const COL = ['#4f5661', '#2f66d0', '#e0412f'];
const LIGHT = ['#8b929c', '#7ea4ef', '#ff8a72'];
const INK = '#25221d';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

// ---------- save ----------
const SAVE_KEY = 'livingrps.v1';
let save = { streak: 0, best: 0, points: 0, played: 0, gustTaught: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

// ---------- drawing tokens ----------
function rockPath(c, r, shape) {
  c.beginPath();
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2, w = 0.82 + 0.18 * Math.sin(i * 2.3 + shape * 19) * Math.cos(i * 1.1 + shape * 7);
    const x = Math.cos(a) * r * w * 1.06, y = Math.sin(a) * r * w * 0.94;
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.closePath();
}
function drawToken(c, k, x, y, r, opt = {}) {
  const ang = opt.ang || 0, lw = Math.max(1.5, r * 0.2);
  c.save(); c.translate(x, y);
  if (opt.scale) c.scale(opt.scale, opt.scale);
  c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = lw;
  if (k === 0) {
    c.rotate(opt.roll || 0);
    rockPath(c, r, opt.shape || 0.3);
    c.fillStyle = COL[0]; c.fill(); c.stroke();
    c.fillStyle = LIGHT[0]; c.beginPath(); c.ellipse(-r * 0.3, -r * 0.3, r * 0.32, r * 0.2, -0.6, 0, 7); c.fill();
  } else if (k === 1) {
    c.rotate(ang * 0.25 + Math.sin(opt.t * 3 + (opt.shape || 0) * 9) * 0.12);
    const s = r * 0.95, f = s * 0.55;
    c.beginPath(); c.moveTo(-s, -s); c.lineTo(s - f, -s); c.lineTo(s, -s + f); c.lineTo(s, s); c.lineTo(-s, s); c.closePath();
    c.fillStyle = COL[1]; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(s - f, -s); c.lineTo(s - f, -s + f); c.lineTo(s, -s + f); c.closePath();
    c.fillStyle = LIGHT[1]; c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = lw * 0.7;
    c.beginPath(); c.moveTo(-s * 0.55, -s * 0.15); c.lineTo(s * 0.45, -s * 0.15); c.moveTo(-s * 0.55, s * 0.35); c.lineTo(s * 0.45, s * 0.35); c.stroke();
  } else {
    c.rotate(ang);
    const open = opt.snip == null ? 0.42 : opt.snip;
    for (const sg of [-1, 1]) {
      c.save(); c.rotate(sg * open);
      // blade
      c.beginPath(); c.moveTo(-r * 0.15, sg * r * 0.12); c.quadraticCurveTo(r * 0.7, sg * r * 0.2, r * 1.25, 0); c.lineTo(-r * 0.15, -sg * r * 0.08); c.closePath();
      c.fillStyle = '#f5efe2'; c.fill(); c.stroke();
      // handle ring
      c.beginPath(); c.ellipse(-r * 0.62, sg * r * 0.18, r * 0.42, r * 0.33, 0, 0, 7);
      c.fillStyle = COL[2]; c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-r * 0.62, sg * r * 0.18, r * 0.16, r * 0.11, 0, 0, 7); c.fill();
      c.restore();
    }
    c.fillStyle = INK; c.beginPath(); c.arc(0, 0, r * 0.13, 0, 7); c.fill();
  }
  c.restore();
}
function iconTo(canvas, k) {
  const c = canvas.getContext('2d'), d = canvas.width;
  c.clearRect(0, 0, d, d);
  drawToken(c, k, d / 2, d / 2, d * 0.34, { ang: -0.6, shape: 0.42, t: 0, snip: 0.45 });
}

// ---------- layout ----------
let W = 600, H = 600, scale = 1, dpr = 1;
function worldSize() {
  const r = cv.getBoundingClientRect();
  // the short side is ~1 world unit per CSS pixel on phones, so tokens stay thumb-readable
  const aspect = r.height / Math.max(1, r.width), k = Math.min(2.2, Math.max(1, aspect > 1 ? aspect : 1 / aspect));
  const base = Math.round(Math.min(520, Math.max(400, Math.min(r.width, r.height))));
  return aspect > 1 ? [base, Math.round(base * k)] : [Math.round(base * k), base];
}
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  scale = Math.min(r.width / W, r.height / H);
}

// ---------- audio ----------
let ac = null, muted = localStorage.getItem('livingrps.mute') === '1';
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
let noiseBuf = null;
function noise() { if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return noiseBuf; }
let lastSnd = 0;
function sound(kind, vol = 1, pitch = 1) {
  if (muted || !ac) return;
  const t = ac.currentTime;
  if (kind < 3 && t - lastSnd < 0.045) return; lastSnd = t;
  const g = ac.createGain(); g.connect(ac.destination);
  if (kind === 0) { // rock: knock
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(160 * pitch, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
    g.gain.setValueAtTime(0.45 * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16); o.connect(g); o.start(t); o.stop(t + 0.18);
  } else if (kind === 1) { // paper: flap
    const n = ac.createBufferSource(); n.buffer = noise(); const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500 * pitch; f.Q.value = 0.9;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5 * vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    n.connect(f); f.connect(g); n.start(t); n.stop(t + 0.1);
  } else if (kind === 2) { // scissors: snip-snip
    for (const dt of [0, 0.045]) {
      const n = ac.createBufferSource(); n.buffer = noise(); const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 4200 * pitch;
      const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t + dt); gg.gain.exponentialRampToValueAtTime(0.45 * vol, t + dt + 0.004); gg.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.035);
      n.connect(f); f.connect(gg); gg.connect(ac.destination); n.start(t + dt); n.stop(t + dt + 0.05);
    }

    const n = ac.createBufferSource(); n.buffer = noise(); n.loop = true; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(1800, t + 0.12); f.frequency.exponentialRampToValueAtTime(300, t + 0.45);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.05); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    n.connect(f); f.connect(g); n.start(t); n.stop(t + 0.55);
  } else if (kind === 4 || kind === 5) { // win / lose
    const notes = kind === 4 ? [523, 659, 784, 1047] : [392, 330, 262];
    notes.forEach((fq, i) => {
      const o = ac.createOscillator(), gg = ac.createGain(); o.type = 'triangle'; o.frequency.value = fq;
      const s = t + i * 0.09; gg.gain.setValueAtTime(0.0001, s); gg.gain.exponentialRampToValueAtTime(0.22, s + 0.015); gg.gain.exponentialRampToValueAtTime(0.001, s + 0.4);
      o.connect(gg); gg.connect(ac.destination); o.start(s); o.stop(s + 0.45);
    });
  }
}
function setMuteIcon() { $('muteWave').style.display = muted ? 'none' : ''; $('muteX').style.display = muted ? '' : 'none'; }
setMuteIcon();
$('mute').onclick = () => { muted = !muted; try { localStorage.setItem('livingrps.mute', muted ? '1' : '0'); } catch (e) {} setMuteIcon(); audio(); };

// ---------- game state ----------
let phase = 'pick';          // pick -> play -> end
let sim, seed, mine = -1, start = [0, 0, 0], gustsLeft = 3, acc = 0, endAt = 0, winK = -1;
const fx = [];               // bursts: {x,y,k,t}
const pops = new Map();      // unit id -> time since flipped
const gustFx = [];
let hintT = 0;

function newSeed() { return (Math.random() * 2 ** 31) >>> 0; }
function readSeed() { const m = location.hash.match(/seed=(\d+)/); return m ? +m[1] >>> 0 : null; }

function setupBoard(sd) {
  seed = sd;
  [W, H] = worldSize();
  resize();
  sim = RPS.create(seed, W, H);
  start = RPS.counts(sim);
  fx.length = 0; pops.clear(); gustFx.length = 0;
  gustsLeft = 3; acc = 0; winK = -1; mine = -1;
  history.replaceState(null, '', '#seed=' + seed);
  updateBar(true);
  buildPicks();
}

function buildPicks() {
  const box = $('picks'); box.innerHTML = '';
  for (let k = 0; k < 3; k++) {
    const b = document.createElement('button'); b.className = 'pick'; b.setAttribute('aria-label', 'Back ' + KIND[k]);
    const ic = document.createElement('canvas'); ic.width = 92; ic.height = 92; iconTo(ic, k);
    const n = document.createElement('b'); n.textContent = start[k];
    const sm = document.createElement('small'); sm.innerHTML = KIND[k] + '<br>pays <em>×' + RPS.payout(start, k).toFixed(1) + '</em>';
    b.append(ic, n, sm);
    b.addEventListener('pointerdown', () => b.classList.add('press'));
    b.addEventListener('pointerleave', () => b.classList.remove('press'));
    b.onclick = () => { b.classList.remove('press'); choose(k); };
    box.append(b);
  }
  $('stats').innerHTML = statLine();
}
function statLine() {
  return `<span>Streak <b>${save.streak}</b></span><span>Best <b>${save.best}</b></span><span>Points <b>${save.points.toLocaleString()}</b></span>`;
}

function choose(k) {
  audio();
  mine = k; phase = 'play';
  $('pickSheet').classList.add('hide');
  $('gusts').style.opacity = 1;
  renderGusts();
  const mi = document.createElement('canvas'); mi.width = mi.height = 60; iconTo(mi, k); $('mineN').replaceChildren(mi, document.createElement('span'));
  updateBar(true);
  stamp('Go!');
  sound(k, 1);
  hintT = save.gustTaught ? 0 : 1;
}
function stamp(text) { const s = $('stamp'); s.textContent = text; s.classList.remove('show'); void s.offsetWidth; s.classList.add('show'); }
function renderGusts() { [...$('gusts').querySelectorAll('i')].forEach((el, i) => el.classList.toggle('used', i >= gustsLeft)); }

function updateBar(force) {
  const c = RPS.counts(sim);
  ['barR', 'barP', 'barS'].forEach((id, k) => {
    const el = $(id);
    el.style.flexGrow = c[k];
    el.style.display = c[k] ? 'flex' : 'none';
    const txt = c[k] >= 3 ? (k === mine && c[k] >= 6 ? 'YOU ' : '') + c[k] : '';
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('mine', k === mine);
  });
  const sp = $('mineN').querySelector('span'); if (sp && mine >= 0) sp.textContent = c[mine];
  $('mineN').classList.toggle('danger', mine >= 0 && c[mine] > 0 && c[mine] < 9);
}

function finish(k) {
  phase = 'end'; winK = k; endAt = performance.now();
  if (!reduced) sim.units.forEach((u, i) => pops.set(u.id, -0.15 - i * 0.018)); // victory ripple across the army
  const won = k === mine;
  save.played++;
  let gain = '';
  if (won) {
    const pts = RPS.award(start, mine);
    save.streak++; save.best = Math.max(save.best, save.streak); save.points += pts;
    gain = `+${pts} points · streak ${save.streak}`;
  } else {
    gain = save.streak > 1 ? `Your ${KIND[mine].toLowerCase()} fell. Streak of ${save.streak} ends.` : `Your ${KIND[mine].toLowerCase()} fell.`;
    save.streak = 0;
  }
  persist();
  sound(won ? 4 : 5);
  setTimeout(() => {
    iconTo($('endIcon'), k);
    $('endH').textContent = won ? 'You called it' : `${KIND[k]} takes the board`;
    $('endGain').textContent = gain; $('endGain').className = won ? '' : 'lose';
    $('endStats').innerHTML = statLine();
    $('endSheet').classList.remove('hide');
    $('gusts').style.opacity = 0;
  }, reduced ? 300 : 1800);
}

$('again').onclick = () => {
  $('endSheet').classList.add('hide');
  phase = 'pick';
  setupBoard(newSeed());
  setTimeout(() => $('pickSheet').classList.remove('hide'), 200);
};

// ---------- input: gust ----------
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const ox = (r.width - W * scale) / 2, oy = (r.height - H * scale) / 2;
  tapAt((e.clientX - r.left - ox) / scale, (e.clientY - r.top - oy) / scale);
});
function tapAt(x, y) {
  if (phase !== 'play') return;
  if (gustsLeft <= 0) { gustFx.push({ x, y, t: 0, dud: true }); return; }
  gustsLeft--; renderGusts(); const pip = $('gusts').querySelectorAll('i')[gustsLeft]; pip.classList.remove('spend'); void pip.offsetWidth; pip.classList.add('spend');
  kick = 1;
  RPS.gust(sim, x, y);
  gustFx.push({ x, y, t: 0 });
  sound(3);
  if (!save.gustTaught) { save.gustTaught = true; persist(); }
  hintT = 0;
}
let kick = 0;

// ---------- render ----------
function drawDesk(t) {
  // board: warm card with a fixed dot grid (static, no camera)
  ctx.fillStyle = '#f4ecd9'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(37,34,29,.10)';
  for (let y = 20; y < H; y += 30) for (let x = 20; x < W; x += 30) { ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 7); ctx.fill(); }
}
function easeOutBack(x) { const c = 1.9; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; }

let last = performance.now(), simT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (phase === 'play') {
    acc += dt;
    let steps = 0;
    while (acc >= RPS.DT && steps < 5) {
      RPS.step(sim); acc -= RPS.DT; steps++;
      for (const ev of sim.events) {
        fx.push({ x: ev.x, y: ev.y, k: ev.to, t: 0 });
        pops.set(ev.id, 0);
        const near = ev.to === mine || ev.from === mine;
        sound(ev.to, near ? 0.9 : 0.5, 0.9 + Math.random() * 0.2);
      }
      if (sim.events.length) updateBar();
      const w = RPS.winner(sim);
      if (w >= 0) { finish(w); break; }
    }
  }
  if (phase === 'end') { // the winners glide to rest instead of wandering off
    const damp = Math.exp(-dt * 3);
    for (const u of sim.units) { u.vx *= damp; u.vy *= damp; u.x += u.vx * dt; u.y += u.vy * dt; u.roll += Math.hypot(u.vx, u.vy) * dt / RPS.R; }
  }
  kick = Math.max(0, kick - dt * 5);
  simT += dt;
  for (const f of fx) f.t += dt;
  while (fx.length && fx[0].t > 0.5) fx.shift();
  for (const [id, v] of pops) { if (v > 0.5) pops.delete(id); else pops.set(id, v + dt); }
  for (const g of gustFx) g.t += dt;
  while (gustFx.length && gustFx[0].t > 0.6) gustFx.shift();
  if (hintT > 0 && phase === 'play' && sim.t > 2.5) hintT += dt;
  if (hintT > 7) hintT = 0; // shown once, for a few seconds; the board teaches the rest

  // draw
  const r = cv.getBoundingClientRect();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#e2d6bb'; ctx.fillRect(0, 0, cv.width, cv.height);
  const ox = (r.width - W * scale) / 2, oy = (r.height - H * scale) / 2;
  const kz = reduced ? 1 : 1 + 0.012 * kick * kick;
  ctx.setTransform(dpr * scale * kz, 0, 0, dpr * scale * kz, dpr * (ox - W * scale * (kz - 1) / 2), dpr * (oy - H * scale * (kz - 1) / 2));
  drawDesk(simT);

  // gust rings
  for (const g of gustFx) {
    const p = g.t / 0.6, e = 1 - (1 - p) ** 3;
    ctx.strokeStyle = g.dud ? `rgba(37,34,29,${0.4 * (1 - p)})` : `rgba(242,182,50,${1 - p})`;
    ctx.lineWidth = g.dud ? 2 : 6 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(g.x, g.y, (g.dud ? 30 : 120) * e, 0, 7); ctx.stroke();
    if (!g.dud) {
      ctx.fillStyle = `rgba(255,250,235,${0.7 * (1 - p) ** 2})`; ctx.beginPath(); ctx.arc(g.x, g.y, 120 * e, 0, 7); ctx.fill();
      ctx.strokeStyle = `rgba(37,34,29,${0.8 * (1 - p)})`; ctx.lineWidth = 3;
      for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283 + 0.3, d0 = 30 + 90 * e, d1 = d0 + 22 * (1 - p); ctx.beginPath(); ctx.moveTo(g.x + Math.cos(a) * d0, g.y + Math.sin(a) * d0); ctx.lineTo(g.x + Math.cos(a) * d1, g.y + Math.sin(a) * d1); ctx.stroke(); }
    }
  }
  // bursts
  for (const f of fx) {
    const p = f.t / 0.5, e = 1 - (1 - p) ** 2;
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = COL[f.k]; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, RPS.R + 16 * e, 0, 7); ctx.stroke();
    if (!reduced) {
      ctx.fillStyle = INK;
      for (let i = 0; i < 5; i++) { const a = i / 5 * 6.283 + f.x; const d = RPS.R + 8 + 18 * e; ctx.fillRect(f.x + Math.cos(a) * d - 1.5, f.y + Math.sin(a) * d - 1.5, 3, 3); }
    }
    ctx.globalAlpha = 1;
  }
  // units: shadow pass then tokens; my side drawn last so it sits on top
  const order = sim.units.slice().sort((a, b) => (a.k === mine) - (b.k === mine));
  for (const u of order) {
    const own = u.k === mine && phase !== 'pick';
    ctx.fillStyle = own ? 'rgba(242,182,50,.85)' : 'rgba(37,34,29,.16)';
    ctx.beginPath(); ctx.ellipse(u.x + 1, u.y + RPS.R * 0.75, RPS.R * (own ? 1.15 : 0.95), RPS.R * (own ? 0.5 : 0.4), 0, 0, 7); ctx.fill();
  }
  const idle = phase === 'pick';
  // shoved units leave a short smear behind them
  ctx.lineCap = 'round';
  for (const u of order) if (u.boost > 0 && !reduced) {
    const sp = Math.hypot(u.vx, u.vy) || 1, L = Math.min(40, sp * 0.12);
    ctx.strokeStyle = `rgba(37,34,29,${0.35 * u.boost / 0.5})`; ctx.lineWidth = RPS.R * 0.9;
    ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(u.x - u.vx / sp * L, u.y - u.vy / sp * L); ctx.stroke();
  }
  for (const u of order) {
    let sc = 1;
    if (pops.has(u.id) && pops.get(u.id) >= 0) { const p = Math.min(1, pops.get(u.id) / 0.32); sc = reduced ? 1 : 0.4 + 0.6 * easeOutBack(p); }
    const bob = idle && !reduced ? Math.sin(simT * 2.2 + u.id * 1.7) * 1.2 : 0;
    const ang = Math.atan2(u.vy, u.vx || 0.0001);
    const snip = u.k === 2 ? 0.12 + 0.34 * (0.5 + 0.5 * Math.sin((idle ? simT * 2 : sim.t * 9) + u.id)) : null;
    drawToken(ctx, u.k, u.x, u.y + bob, RPS.R * 1.05, { ang: (u.vx || u.vy) ? ang : -0.6, roll: u.roll + u.shape * 6, shape: u.shape, t: simT, scale: sc, snip: reduced ? 0.35 : snip });
  }
  // first-round teaching: a pulsing ring around your army's centre with a finger dot
  if (hintT > 0 && phase === 'play') {
    const a = Math.min(1, hintT * 2) * (0.5 + 0.5 * Math.sin(simT * 5));
    const mineU = sim.units.filter(u => u.k === mine);
    if (mineU.length) {
      const cx = mineU.reduce((s, u) => s + u.x, 0) / mineU.length, cy = mineU.reduce((s, u) => s + u.y, 0) / mineU.length;
      ctx.strokeStyle = `rgba(242,182,50,${a})`; ctx.lineWidth = 4; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.arc(cx, cy, 60 + 8 * Math.sin(simT * 5), 0, 7); ctx.stroke(); ctx.setLineDash([]);
      // a fingertip that keeps pressing next to your army
      const press = 0.5 + 0.5 * Math.sin(simT * 5), fx0 = Math.min(W - 30, cx + 70), fy0 = Math.max(30, cy - 50);
      ctx.globalAlpha = Math.min(1, hintT * 2);
      ctx.fillStyle = 'rgba(242,182,50,.35)'; ctx.beginPath(); ctx.arc(fx0, fy0, 14 + 14 * (1 - press), 0, 7); ctx.fill();
      // pointing finger: a capsule whose tip dips onto the board
      const lift = 6 * press;
      ctx.save(); ctx.translate(fx0 + 4, fy0 + 2 - lift); ctx.rotate(-0.45);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(-8, -4, 16, 40, 8); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(-5, 0, 10, 9, 4); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(-14, 26, 28, 30, 10); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
  // end: winner wash

  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  if (phase === 'pick') { setupBoard(seed); } else resize();
});

setupBoard(readSeed() ?? newSeed());
requestAnimationFrame(frame);
window.__rps = { get sim() { return sim; }, get phase() { return phase; }, choose, gust: (x, y) => tapAt(x, y) };
})();
</script>
<script src="../logo.js"></script>
</body>
