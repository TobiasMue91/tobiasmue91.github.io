<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
    <title>Sudoku — Classic Number Puzzle</title>
    <meta name="keywords"
          content="Sudoku, online game, puzzle game, brain game, free game, difficulty levels, notes, pencil marks, expert sudoku"/>
    <meta name="description"
          content="Play Sudoku online for free. Five difficulty levels rated by real solving techniques, pencil marks, hints, undo, shareable seeds and a board built for touch."/>
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
    <style>
        :root {
            --bg: #f2f2ef;
            --surface: #ffffff;
            --surface-2: #f7f7f5;
            --surface-3: #ececea;
            --line: #dcdcd7;
            --line-strong: #82847e;
            --text: #1b1c1f;
            --text-2: #5f6169;
            --text-3: #8b8d95;
            --accent: #4f46e5;
            --accent-soft: #e5e3fb;
            --accent-text: #4338ca;
            --danger: #d92d20;
            --danger-soft: #fde5e2;
            --good: #0d8a5f;
            --good-soft: #dbf3e8;
            --peer: #edeefb;
            --match: #fdf0cd;
            --ring: 0 0 0 3px rgba(79, 70, 229, .35);
            --shadow: 0 1px 2px rgba(16, 17, 20, .06), 0 8px 24px -12px rgba(16, 17, 20, .25);
            --radius: 14px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #101116;
                --surface: #191b21;
                --surface-2: #20232b;
                --surface-3: #282c36;
                --line: #2e323d;
                --line-strong: #6a707f;
                --text: #eceef4;
                --text-2: #a2a7b4;
                --text-3: #767c8b;
                --accent: #7c74ff;
                --accent-soft: #2a2857;
                --accent-text: #b9b4ff;
                --danger: #ff6f61;
                --danger-soft: #4a2020;
                --good: #45d19a;
                --good-soft: #10382a;
                --peer: #232739;
                --match: #3b3418;
                --ring: 0 0 0 3px rgba(124, 116, 255, .45);
                --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -16px rgba(0, 0, 0, .8);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.45;
            min-height: 100svh;
            display: flex;
            justify-content: center;
            padding: clamp(10px, 2.5vw, 28px) clamp(10px, 3vw, 24px) calc(20px + env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ---------- top bar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-right: auto;
            min-width: 0;
        }

        .brand h1 {
            font-size: clamp(19px, 5vw, 24px);
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .brand .level {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: .08em;
            white-space: nowrap;
        }

        .clock {
            display: flex;
            align-items: center;
            gap: 6px;
            font-variant-numeric: tabular-nums;
            font-weight: 650;
            font-size: 16px;
            color: var(--text-2);
            padding: 6px 10px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .clock.hot {
            color: var(--text);
        }

        /* ---------- generic controls ---------- */
        .btn {
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            min-height: 40px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
            touch-action: manipulation;
            transition: background .15s, border-color .15s, color .15s, opacity .15s;
        }

        .btn:hover:not(:disabled) {
            background: var(--surface-2);
        }

        .btn:active:not(:disabled) {
            background: var(--surface-3);
        }

        .btn:disabled {
            opacity: .4;
            cursor: default;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled),
        .btn-primary:active:not(:disabled) {
            background: var(--accent-text);
            border-color: var(--accent-text);
        }

        .btn-icon {
            padding: 0;
            width: 40px;
        }

        :is(.btn, .cell, select, input, .digit):focus-visible {
            outline: none;
            box-shadow: var(--ring);
            position: relative;
            z-index: 3;
        }

        select {
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            min-height: 40px;
            padding: 0 30px 0 12px;
            cursor: pointer;
            touch-action: manipulation;
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
            background-position: right 14px center, right 9px center;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }

        /* ---------- board ---------- */
        .board-wrap {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(8px, 2vw, 12px);
        }

        .board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            aspect-ratio: 1;
            width: 100%;
            border: 2px solid var(--line-strong);
            border-radius: 4px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .cell {
            position: relative;
            font: inherit;
            font-size: clamp(17px, 5.4vw, 27px);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: var(--accent-text);
            background: var(--surface);
            border: 0;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            padding: 0;
            transition: background .12s ease;
        }

        /* 3x3 box separators sit above the cells so no background paints over them */
        .board::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            --l: linear-gradient(var(--line-strong), var(--line-strong));
            background: var(--l) calc(100% / 3) 0 / 2px 100% no-repeat,
            var(--l) calc(200% / 3) 0 / 2px 100% no-repeat,
            var(--l) 0 calc(100% / 3) / 100% 2px no-repeat,
            var(--l) 0 calc(200% / 3) / 100% 2px no-repeat;
        }

        .cell:nth-child(9n) {
            border-right: 0;
        }

        .cell:nth-last-child(-n+9) {
            border-bottom: 0;
        }

        .cell.given {
            color: var(--text);
            font-weight: 700;
        }

        .cell.peer {
            background: var(--peer);
        }

        .cell.match {
            background: var(--match);
        }

        .cell.bad {
            color: var(--danger);
            background: var(--danger-soft);
        }

        .cell.sel {
            background: var(--accent-soft);
            box-shadow: inset 0 0 0 2px var(--accent);
            z-index: 2;
        }

        .cell.sel.bad {
            background: var(--danger-soft);
            box-shadow: inset 0 0 0 2px var(--danger);
        }

        .cell.pop {
            animation: pop .18s ease-out;
        }

        .cell.shake {
            animation: shake .3s ease;
        }

        .cell.reveal {
            animation: reveal .5s ease;
        }

        @keyframes pop {
            from {
                transform: scale(.72);
                opacity: .4;
            }
        }

        @keyframes shake {
            25% {
                transform: translateX(-3px);
            }
            75% {
                transform: translateX(3px);
            }
        }

        @keyframes reveal {
            0%, 60% {
                background: var(--good-soft);
            }
        }

        .notes {
            position: absolute;
            inset: 6%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            font-size: clamp(7px, 2vw, 11px);
            font-weight: 600;
            line-height: 1;
            color: var(--text-3);
            pointer-events: none;
        }

        .notes i {
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: normal;
        }

        .notes i.hl {
            color: var(--accent);
            font-weight: 800;
        }

        /* ---------- overlays ---------- */
        .veil {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 20px;
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface) 86%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 5;
        }

        .veil.show {
            display: flex;
        }

        .veil h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .veil p {
            color: var(--text-2);
            font-size: 14px;
            max-width: 32ch;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- pads ---------- */
        .pad {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
        }

        .digit {
            position: relative;
            font: inherit;
            font-size: clamp(19px, 5.5vw, 24px);
            font-weight: 650;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            height: 58px;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: background .12s, color .12s, border-color .12s, transform .08s;
        }

        .digit:active:not(:disabled) {
            transform: translateY(1px);
            background: var(--surface-3);
        }

        .digit .left {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-3);
            line-height: 1;
            margin-top: 3px;
            font-variant-numeric: tabular-nums;
        }

        .digit.done {
            color: var(--text-3);
            background: var(--surface-2);
            box-shadow: none;
        }

        .digit.done .left {
            visibility: hidden;
        }

        .digit.notes-on {
            color: var(--accent-text);
        }

        .tools {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .tool {
            font: inherit;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-2);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            min-height: 54px;
            padding: 6px 2px;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: background .12s, color .12s, border-color .12s;
        }

        .tool svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tool:hover:not(:disabled) {
            background: var(--surface-2);
        }

        .tool:disabled {
            opacity: .38;
            cursor: default;
        }

        .tool.on {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .tool .badge {
            position: absolute;
            top: 5px;
            right: 8px;
            font-size: 10px;
            font-weight: 700;
        }

        .tool.rel {
            position: relative;
        }

        /* ---------- footer / status ---------- */
        .statusbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12.5px;
            color: var(--text-2);
            padding: 0 2px;
        }

        .statusbar .grow {
            margin-left: auto;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 3px 10px;
            font-weight: 600;
        }

        .link {
            font: inherit;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-2);
            background: none;
            border: 0;
            padding: 3px 2px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-color: var(--line-strong);
        }

        .link:hover {
            color: var(--text);
        }

        /* ---------- settings ---------- */
        .settings {
            display: none;
            flex-direction: column;
            gap: 2px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 8px;
        }

        .settings.show {
            display: flex;
        }

        .setting {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .setting:hover {
            background: var(--surface-2);
        }

        .setting span {
            flex: 1;
        }

        .setting small {
            display: block;
            color: var(--text-3);
            font-size: 12px;
            font-weight: 400;
        }

        .switch {
            flex: none;
            width: 40px;
            height: 24px;
            border-radius: 999px;
            background: var(--surface-3);
            border: 1px solid var(--line);
            position: relative;
            transition: background .16s;
        }

        .switch::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
            transition: transform .16s;
        }

        input[type=checkbox] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        input:checked + .switch {
            background: var(--accent);
            border-color: var(--accent);
        }

        input:checked + .switch::after {
            transform: translateX(16px);
            background: #fff;
        }

        input:focus-visible + .switch {
            box-shadow: var(--ring);
        }

        /* ---------- modal ---------- */
        dialog {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            color: var(--text);
            padding: 28px 24px 22px;
            width: min(400px, calc(100vw - 32px));
            box-shadow: var(--shadow);
            text-align: center;
        }

        dialog::backdrop {
            background: rgba(10, 11, 14, .55);
            backdrop-filter: blur(3px);
        }

        dialog h2 {
            font-size: 24px;
            font-weight: 700;
            margin: 10px 0 6px;
        }

        dialog .big {
            font-size: 42px;
            line-height: 1;
        }

        dialog p {
            color: var(--text-2);
            font-size: 14.5px;
        }

        .score {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 18px 0;
        }

        .score div {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 6px;
        }

        .score b {
            display: block;
            font-size: 19px;
            font-variant-numeric: tabular-nums;
        }

        .score small {
            color: var(--text-3);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row > * {
            flex: 1;
        }

        /* ---------- toast ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(22px + env(safe-area-inset-bottom));
            transform: translate(-50%, 12px);
            background: var(--text);
            color: var(--bg);
            font-size: 14px;
            font-weight: 600;
            padding: 11px 18px;
            border-radius: 999px;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 50;
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        @media (max-width: 400px) {
            .app {
                gap: 10px;
            }

            .pad {
                gap: 4px;
            }

            .digit {
                height: 52px;
                border-radius: 10px;
            }

            .tools {
                gap: 4px;
            }

            .tool {
                min-height: 50px;
                font-size: 10px;
            }
        }

        @media (min-width: 560px) and (min-height: 720px) {
            .digit {
                height: 62px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: .001ms !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="brand">
            <h1>Sudoku</h1>
            <span class="level" id="level-label">Medium</span>
        </div>
        <div class="clock" id="clock">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7v5l3 2"/>
            </svg>
            <span id="elapsed">00:00</span>
        </div>
        <button class="btn btn-icon" id="pause-btn" title="Pause (Space)" aria-label="Pause">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="6" y="4" width="4" height="16" rx="1.2"/>
                <rect x="14" y="4" width="4" height="16" rx="1.2"/>
            </svg>
        </button>
        <button class="btn btn-icon" id="settings-btn" title="Settings" aria-label="Settings" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 2.6 15a1.7 1.7 0 0 0-1.6-1.1H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 7 4.6h.08A1.7 1.7 0 0 0 8.2 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.02 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.08a1.7 1.7 0 0 0 1.6 1.02H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
            </svg>
        </button>
    </div>

    <div class="settings" id="settings-panel">
        <label class="setting"><span>Highlight mistakes<small>Mark digits that break the solution</small></span>
            <input type="checkbox" id="opt-mistakes" checked><i class="switch"></i></label>
        <label class="setting"><span>Auto-clear pencil marks<small>Remove notes that a placement rules out</small></span>
            <input type="checkbox" id="opt-autonotes" checked><i class="switch"></i></label>
        <label class="setting"><span>Highlight matching digits<small>Shine a light on the same number elsewhere</small></span>
            <input type="checkbox" id="opt-match" checked><i class="switch"></i></label>
    </div>

    <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
        <div class="veil" id="veil-loading">
            <div class="spinner"></div>
            <p id="loading-text">Carving out a puzzle…</p>
        </div>
        <div class="veil" id="veil-paused">
            <h2>Paused</h2>
            <p>The clock is stopped and the board is hidden.</p>
            <button class="btn btn-primary" id="resume-btn">Resume</button>
        </div>
    </div>

    <div class="pad" id="pad"></div>

    <div class="tools">
        <button class="tool" id="undo-btn" title="Undo (Ctrl+Z)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 14 4 9l5-5"/>
                <path d="M4 9h11a5 5 0 0 1 0 10h-3"/>
            </svg>
            Undo
        </button>
        <button class="tool" id="redo-btn" title="Redo (Ctrl+Y)">
            <svg viewBox="0 0 24 24" aria-hidden="true">

                <path d="m13 7.5 4-4a2.1 2.1 0 0 1 3 0l1.5 1.5a2.1 2.1 0 0 1 0 3L18 12"/>

                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>

            <svg viewBox="0 0 24 24" aria-hidden="true">

                <path d="M10 21h4"/>
                <path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5.9 1.1 1 1.7l.1.5h5l.1-.5c.1-.6.4-1.2 1-1.7A6 6 0 0 0 12 3z"/>
            </svg>

    <div class="statusbar">
        <span class="chip" id="left-chip">0 left</span>
        <span class="chip" id="mistake-chip" hidden>0 mistakes</span>
        <span class="chip" id="best-chip" hidden>Best —</span>

    </div>

    <div class="row">
        <select id="difficulty" aria-label="Difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>

<dialog id="win-dialog">
    <div class="big">🎉</div>
    <h2 id="win-title">Solved!</h2>
    <p id="win-sub">Nicely done.</p>

        <div><b id="win-time">00:00</b><small>Time</small></div>
        <div><b id="win-best">—</b><small>Best</small></div>
        <div><b id="win-hints">0</b><small>Hints</small></div>

        <button class="btn" id="win-close">Close</button>
        <button class="btn btn-primary" id="win-again">Play again</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script>
    "use strict";

    /* ------------------------------------------------------------------ *
     * Core: generation, solving and difficulty rating.
     * Kept as one self-contained factory so the exact same source can be
     * handed to a Web Worker — generating a Master grid takes real work and
     * must never block the page (the old version froze here).
     * ------------------------------------------------------------------ */
    function SudokuCore() {
        const ROWS = [], COLS = [], BOXES = [], UNITS = [], UNITS_OF = [], PEERS = [];
        for (let i = 0; i < 9; i++) {
            ROWS.push([]);
            COLS.push([]);
            BOXES.push([]);
        }
        for (let i = 0; i < 81; i++) {
            const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
            ROWS[r].push(i);
            COLS[c].push(i);
            BOXES[b].push(i);
        }
        UNITS.push(...ROWS, ...COLS, ...BOXES);
        for (let i = 0; i < 81; i++) {
            const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
            UNITS_OF.push([ROWS[r], COLS[c], BOXES[b]]);
            const set = new Set();
            for (const u of UNITS_OF[i]) for (const j of u) if (j !== i) set.add(j);
            PEERS.push([...set]);
        }
        const ALL = 0x1ff;
        const bit = v => 1 << (v - 1);
        const POP = new Uint8Array(512);
        for (let m = 1; m < 512; m++) POP[m] = POP[m >> 1] + (m & 1);
        const lowBitDigit = m => 32 - Math.clz32(m & -m);

        function rngFrom(seed) {
            let a = seed >>> 0;
            return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function shuffle(arr, rnd) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = (rnd() * (i + 1)) | 0;
                const t = arr[i];
                arr[i] = arr[j];
                arr[j] = t;
            }
            return arr;
        }

        /* --- constraint bookkeeping ------------------------------------- */
        function masksOf(grid) {
            const rm = new Int32Array(9), cm = new Int32Array(9), bm = new Int32Array(9);
            for (let i = 0; i < 81; i++) {
                const v = grid[i];
                if (!v) continue;
                const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0), m = bit(v);
                rm[r] |= m;
                cm[c] |= m;
                bm[b] |= m;
            }
            return [rm, cm, bm];
        }

        /* Counts solutions, stopping at `cap`. MRV keeps it near-instant. */
        function countSolutions(grid, cap) {
            const g = Int8Array.from(grid), [rm, cm, bm] = masksOf(g);
            let found = 0;

            function rec() {
                let best = -1, bestMask = 0, bestCount = 10;
                for (let i = 0; i < 81; i++) {
                    if (g[i]) continue;
                    const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
                    const m = ALL & ~(rm[r] | cm[c] | bm[b]), n = POP[m];
                    if (n === 0) return false;
                    if (n < bestCount) {
                        bestCount = n;
                        bestMask = m;
                        best = i;
                        if (n === 1) break;
                    }
                }
                if (best === -1) {
                    found++;
                    return found >= cap;
                }
                const r = (best / 9) | 0, c = best % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
                let m = bestMask;
                while (m) {
                    const low = m & -m, v = lowBitDigit(m);
                    m ^= low;
                    g[best] = v;
                    rm[r] |= low;
                    cm[c] |= low;
                    bm[b] |= low;
                    const stop = rec();
                    g[best] = 0;
                    rm[r] ^= low;
                    cm[c] ^= low;
                    bm[b] ^= low;
                    if (stop) return true;
                }
                return false;
            }

            rec();
            return found;
        }

        function fillGrid(rnd) {
            const g = new Int8Array(81), rm = new Int32Array(9), cm = new Int32Array(9), bm = new Int32Array(9);
            const order = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9], rnd);

            function rec(i) {
                if (i === 81) return true;
                const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
                const avail = ALL & ~(rm[r] | cm[c] | bm[b]);
                const digits = shuffle(order.slice(), rnd);
                for (const v of digits) {
                    const m = bit(v);
                    if (!(avail & m)) continue;
                    g[i] = v;
                    rm[r] |= m;
                    cm[c] |= m;
                    bm[b] |= m;
                    if (rec(i + 1)) return true;
                    g[i] = 0;
                    rm[r] ^= m;
                    cm[c] ^= m;
                    bm[b] ^= m;
                }
                return false;
            }

            rec(0);
            return g;
        }

        /* --- human-style solver, used to rate a puzzle ------------------ *
         * level 1 singles · 2 locked candidates · 3 subsets ·
         * 4 fish (X-Wing) · 5 needs trial and error                       */
        function rate(grid) {
            const g = Int8Array.from(grid);
            const cand = new Int32Array(81);
            const [rm, cm, bm] = masksOf(g);
            for (let i = 0; i < 81; i++) {
                if (g[i]) continue;
                const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
                cand[i] = ALL & ~(rm[r] | cm[c] | bm[b]);
            }
            let level = 1, empty = 0;
            for (let i = 0; i < 81; i++) if (!g[i]) empty++;

            const place = (i, v) => {
                g[i] = v;
                cand[i] = 0;
                empty--;
                const m = ~bit(v);
                for (const p of PEERS[i]) if (!g[p]) cand[p] &= m;
            };

            const singles = () => {
                let did = false;
                for (let i = 0; i < 81; i++) {
                    if (g[i]) continue;
                    if (!cand[i]) return null;              // contradiction
                    if (POP[cand[i]] === 1) {
                        place(i, lowBitDigit(cand[i]));
                        did = true;
                    }
                }
                for (const u of UNITS) {
                    for (let v = 1; v <= 9; v++) {
                        const m = bit(v);
                        let spot = -1, n = 0;
                        for (const i of u) {
                            if (g[i] === v) {
                                n = 0;
                                break;
                            }
                            if (!g[i] && (cand[i] & m)) {
                                n++;
                                spot = i;
                            }
                        }
                        if (n === 1) {
                            place(spot, v);
                            did = true;
                        }
                    }
                }
                return did;
            };

            const lockedCandidates = () => {
                let did = false;
                for (let v = 1; v <= 9; v++) {
                    const m = bit(v);
                    for (let b = 0; b < 9; b++) {
                        const cells = BOXES[b].filter(i => !g[i] && (cand[i] & m));
                        if (cells.length < 2) continue;
                        const rows = new Set(cells.map(i => (i / 9) | 0));
                        const cols = new Set(cells.map(i => i % 9));
                        if (rows.size === 1) {
                            for (const i of ROWS[[...rows][0]]) {
                                if (!g[i] && (cand[i] & m) && !cells.includes(i)) {
                                    cand[i] &= ~m;
                                    did = true;
                                }
                            }
                        }
                        if (cols.size === 1) {
                            for (const i of COLS[[...cols][0]]) {
                                if (!g[i] && (cand[i] & m) && !cells.includes(i)) {
                                    cand[i] &= ~m;
                                    did = true;
                                }
                            }
                        }
                    }
                    for (const line of [...ROWS, ...COLS]) {
                        const cells = line.filter(i => !g[i] && (cand[i] & m));
                        if (cells.length < 2) continue;
                        const boxes = new Set(cells.map(i => (((i / 9) | 0) / 3 | 0) * 3 + ((i % 9) / 3 | 0)));
                        if (boxes.size === 1) {
                            for (const i of BOXES[[...boxes][0]]) {
                                if (!g[i] && (cand[i] & m) && !cells.includes(i)) {
                                    cand[i] &= ~m;
                                    did = true;
                                }
                            }
                        }
                    }
                }
                return did;
            };

            const subsets = () => {
                let did = false;
                for (const u of UNITS) {
                    const open = u.filter(i => !g[i]);
                    // naked pairs / triples
                    for (let a = 0; a < open.length; a++) {
                        for (let b = a + 1; b < open.length; b++) {
                            const m2 = cand[open[a]] | cand[open[b]];
                            if (POP[m2] === 2) {
                                for (const i of open) {
                                    if (i !== open[a] && i !== open[b] && (cand[i] & m2)) {
                                        cand[i] &= ~m2;
                                        did = true;
                                    }
                                }
                            }
                            for (let c = b + 1; c < open.length; c++) {
                                const m3 = m2 | cand[open[c]];
                                if (POP[m3] === 3) {
                                    for (const i of open) {
                                        if (i !== open[a] && i !== open[b] && i !== open[c] && (cand[i] & m3)) {
                                            cand[i] &= ~m3;
                                            did = true;
                                        }
                                    }
                                }
                            }
                        }
                    }
                    // hidden pairs
                    for (let v1 = 1; v1 <= 8; v1++) {
                        for (let v2 = v1 + 1; v2 <= 9; v2++) {
                            const m = bit(v1) | bit(v2);
                            const hit = open.filter(i => cand[i] & m);
                            if (hit.length !== 2) continue;
                            if (!(cand[hit[0]] & bit(v1)) || !(cand[hit[0]] & bit(v2))) continue;
                            if (!(cand[hit[1]] & bit(v1)) || !(cand[hit[1]] & bit(v2))) continue;
                            for (const i of hit) {
                                if (cand[i] !== m) {
                                    cand[i] = m;
                                    did = true;
                                }
                            }
                        }
                    }
                }
                return did;
            };

            const fish = () => {
                let did = false;
                for (let v = 1; v <= 9; v++) {
                    const m = bit(v);
                    for (const [lines, cross, idxOf] of [[ROWS, COLS, i => i % 9], [COLS, ROWS, i => (i / 9) | 0]]) {
                        const spots = lines.map(line => line.filter(i => !g[i] && (cand[i] & m)).map(idxOf));
                        for (let a = 0; a < 9; a++) {
                            if (spots[a].length !== 2) continue;
                            for (let b = a + 1; b < 9; b++) {
                                if (spots[b].length !== 2) continue;
                                if (spots[a][0] !== spots[b][0] || spots[a][1] !== spots[b][1]) continue;
                                for (const k of spots[a]) {
                                    for (const i of cross[k]) {
                                        const li = lines === ROWS ? (i / 9) | 0 : i % 9;
                                        if (li === a || li === b) continue;
                                        if (!g[i] && (cand[i] & m)) {
                                            cand[i] &= ~m;
                                            did = true;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
                return did;
            };

            const steps = [[1, singles], [2, lockedCandidates], [3, subsets], [4, fish]];
            outer: while (empty > 0) {
                for (const [lv, fn] of steps) {
                    const r = fn();
                    if (r === null) return {solved: false, level: 5};
                    if (r) {
                        if (lv > level) level = lv;
                        continue outer;
                    }
                }
                break;
            }
            return {solved: empty === 0, level: empty === 0 ? level : 5};
        }

        const TARGETS = {
            easy: {min: 1, max: 1, clues: 42},
            medium: {min: 1, max: 2, clues: 34},
            hard: {min: 2, max: 3, clues: 30},
            expert: {min: 3, max: 4, clues: 26},
            master: {min: 4, max: 5, clues: 23}
        };

        /* Dig holes out of a solved grid, never breaking uniqueness and
           never letting the puzzle get harder than the chosen tier. */
        function generate(seed, difficulty, budgetMs) {
            const t = TARGETS[difficulty] || TARGETS.medium;
            const rnd = rngFrom(seed);
            const deadline = Date.now() + (budgetMs || 5000);
            let fallback = null;

            for (let attempt = 0; ; attempt++) {
                const solution = fillGrid(rnd);
                const puzzle = Int8Array.from(solution);
                let clues = 81, snapshot = null, snapshotLevel = 0;
                const order = shuffle(Array.from({length: 81}, (_, i) => i), rnd);

                const dig = symmetric => {
                    for (const i of order) {
                        if (clues <= t.clues) return;
                        const mirror = 80 - i;
                        const touched = symmetric && mirror !== i ? [i, mirror] : [i];
                        if (touched.every(k => puzzle[k] === 0)) continue;
                        const saved = touched.map(k => puzzle[k]);
                        touched.forEach(k => puzzle[k] = 0);
                        const removed = saved.filter(v => v !== 0).length;
                        if (countSolutions(puzzle, 2) !== 1) {
                            touched.forEach((k, n) => puzzle[k] = saved[n]);
                            continue;
                        }
                        let level = 5;
                        if (t.max < 5) {
                            level = rate(puzzle).level;
                            if (level > t.max) {                // too hard for this tier — put it back
                                touched.forEach((k, n) => puzzle[k] = saved[n]);
                                continue;
                            }
                        }
                        clues -= removed;
                        if (level >= t.min) {
                            snapshot = Int8Array.from(puzzle);
                            snapshotLevel = level;
                        }
                    }
                };

                dig(true);          // rotationally symmetric holes look like a printed grid…
                dig(false);         // …then single cells, to reach the tier's clue count

                if (t.max >= 5) {                                // verify the hard tiers once, at the end
                    snapshotLevel = rate(puzzle).level;
                    snapshot = Int8Array.from(puzzle);
                }

                const out = snapshot && snapshotLevel >= t.min
                    ? {puzzle: snapshot, solution, level: snapshotLevel}
                    : null;
                if (out) return pack(out, seed, difficulty);
                if (!fallback && snapshot) fallback = {puzzle: snapshot, solution, level: snapshotLevel};
                if (Date.now() > deadline) {
                    return pack(fallback || {puzzle, solution, level: snapshotLevel || 1}, seed, difficulty);
                }
            }
        }

        function pack(o, seed, difficulty) {
            return {
                puzzle: Array.from(o.puzzle),
                solution: Array.from(o.solution),
                level: o.level,
                clues: Array.from(o.puzzle).filter(Boolean).length,
                seed, difficulty
            };
        }

        return {generate, rate, countSolutions, UNITS, PEERS, rngFrom};
    }

    /* ------------------------------------------------------------------ *
     * Puzzle supply: a Worker when available, the main thread otherwise.
     * ------------------------------------------------------------------ */
    const core = SudokuCore();
    const worker = (() => {
        try {
            const src = "const core=(" + SudokuCore.toString() + ")();" +
                "onmessage=e=>{try{postMessage(core.generate(e.data.seed,e.data.difficulty,e.data.budget))}" +
                "catch(err){postMessage({error:String(err)})}};";
            const w = new Worker(URL.createObjectURL(new Blob([src], {type: "text/javascript"})));
            w.onerror = () => {
            };
            return w;
        } catch (e) {
            return null;
        }
    })();

    function generate(seed, difficulty) {
        if (!worker) return Promise.resolve(core.generate(seed, difficulty, 3000));
        return new Promise(resolve => {
            let settled = false;
            const done = res => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                worker.onmessage = null;
                resolve(res && !res.error ? res : core.generate(seed, difficulty, 3000));
            };
            const timer = setTimeout(() => done(null), 12000);
            worker.onmessage = e => done(e.data);
            worker.postMessage({seed, difficulty, budget: 5000});
        });
    }

    /* ------------------------------------------------------------------ *
     * Game state
     * ------------------------------------------------------------------ */
    const LEVEL_NAMES = {easy: "Easy", medium: "Medium", hard: "Hard", expert: "Expert", master: "Master"};
    const HINT_BUDGET = 3;
    const SAVE_KEY = "sudoku.v2.save";
    const BEST_KEY = "sudoku.v2.best";
    const OPTS_KEY = "sudoku.v2.opts";

    const S = {
        grid: new Int8Array(81),
        given: new Uint8Array(81),
        solution: new Int8Array(81),
        notes: new Int32Array(81),
        difficulty: "medium",
        seed: 1,
        sel: -1,
        focusDigit: 0,
        notesMode: false,
        hints: 0,
        mistakes: 0,
        time: 0,
        paused: false,
        running: false,
        solved: false,
        undo: [],
        redo: []
    };

    const opts = Object.assign({mistakes: true, autonotes: true, match: true}, readJSON(OPTS_KEY) || {});
    const best = readJSON(BEST_KEY) || {};

    function readJSON(k) {
        try {
            return JSON.parse(localStorage.getItem(k));
        } catch (e) {
            return null;
        }
    }

    function writeJSON(k, v) {
        try {
            localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {
        }
    }

    const $ = sel => document.querySelector(sel);
    const boardEl = $("#board"), padEl = $("#pad"), toastEl = $("#toast"), liveEl = $("#live");
    const cells = [], digitBtns = [];

    /* ------------------------------------------------------------------ *
     * Board construction
     * ------------------------------------------------------------------ */
    for (let i = 0; i < 81; i++) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "cell";
        b.dataset.i = i;
        b.setAttribute("role", "gridcell");
        b.tabIndex = -1;
        const v = document.createElement("span");
        v.className = "v";
        const n = document.createElement("div");
        n.className = "notes";
        for (let d = 1; d <= 9; d++) n.appendChild(document.createElement("i"));
        b.append(v, n);
        boardEl.appendChild(b);
        cells.push({el: b, v, n, marks: n.children});
    }

    for (let d = 1; d <= 9; d++) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "digit";
        b.dataset.d = d;
        b.innerHTML = "<span>" + d + "</span><span class='left'></span>";
        b.setAttribute("aria-label", "Enter " + d);
        padEl.appendChild(b);
        digitBtns.push(b);
    }

    /* ------------------------------------------------------------------ *
     * Rendering
     * ------------------------------------------------------------------ */
    function conflicts() {
        const bad = new Uint8Array(81);
        for (const unit of core.UNITS) {
            const seen = new Map();
            for (const i of unit) {
                const v = S.grid[i];
                if (!v) continue;
                if (seen.has(v)) {
                    bad[i] = 1;
                    bad[seen.get(v)] = 1;
                } else seen.set(v, i);
            }
        }
        if (opts.mistakes) {
            for (let i = 0; i < 81; i++) if (S.grid[i] && S.grid[i] !== S.solution[i]) bad[i] = 1;
        }
        return bad;
    }

    function paint() {
        const bad = conflicts();
        const sel = S.sel;
        const selVal = sel >= 0 ? S.grid[sel] : 0;
        const highlight = selVal || S.focusDigit;
        const peers = sel >= 0 ? core.PEERS[sel] : null;
        const peerSet = peers ? new Set(peers) : null;

        for (let i = 0; i < 81; i++) {
            const cell = cells[i], v = S.grid[i], cl = cell.el.classList;
            cell.v.textContent = v || "";
            const showNotes = !v && S.notes[i];
            cell.n.style.display = showNotes ? "" : "none";
            if (showNotes) {
                for (let d = 1; d <= 9; d++) {
                    const on = (S.notes[i] >> (d - 1)) & 1;
                    const m = cell.marks[d - 1];
                    m.textContent = on ? d : "";
                    m.className = on && highlight === d && opts.match ? "hl" : "";
                }
            }
            cl.toggle("given", !!S.given[i]);
            cl.toggle("bad", !!bad[i]);
            cl.toggle("sel", i === sel);
            cl.toggle("peer", !!peerSet && peerSet.has(i) && i !== sel);
            cl.toggle("match", !!highlight && v === highlight && i !== sel && opts.match);
            cell.el.setAttribute("aria-label",
                "Row " + (((i / 9) | 0) + 1) + " column " + ((i % 9) + 1) + ", " +
                (v ? v + (S.given[i] ? " given" : "") : "empty"));
        }

        let placed = 0;
        for (let d = 1; d <= 9; d++) {
            let n = 0;
            for (let i = 0; i < 81; i++) if (S.grid[i] === d) n++;
            placed += n;
            const b = digitBtns[d - 1];
            b.querySelector(".left").textContent = 9 - n;
            b.classList.toggle("done", n >= 9);
            b.classList.toggle("notes-on", S.notesMode);
        }
        $("#left-chip").textContent = (81 - placed) + " left";
        const mc = $("#mistake-chip");
        mc.hidden = S.mistakes === 0;
        mc.textContent = S.mistakes + (S.mistakes === 1 ? " mistake" : " mistakes");
        const rove = S.sel < 0 ? 0 : S.sel;
        for (let i = 0; i < 81; i++) cells[i].el.tabIndex = i === rove ? 0 : -1;
        $("#undo-btn").disabled = !S.undo.length;
        $("#redo-btn").disabled = !S.redo.length;
        $("#hint-btn").disabled = S.hints >= HINT_BUDGET || S.solved;
        $("#hint-badge").textContent = Math.max(0, HINT_BUDGET - S.hints);
        $("#notes-btn").classList.toggle("on", S.notesMode);
        $("#notes-btn").setAttribute("aria-pressed", String(S.notesMode));
        boardEl.style.visibility = S.paused ? "hidden" : "";
    }

    function paintMeta() {
        $("#level-label").textContent = LEVEL_NAMES[S.difficulty];
        const b = best[S.difficulty];
        const chip = $("#best-chip");
        chip.hidden = !b;
        if (b) chip.textContent = "Best " + fmt(b);
    }

    function fmt(sec) {
        const m = (sec / 60) | 0, s = sec % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    let toastTimer;
    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
        liveEl.textContent = msg;
    }

    function flash(i, cls) {
        const el = cells[i].el;
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
        setTimeout(() => el.classList.remove(cls), 600);
    }

    /* ------------------------------------------------------------------ *
     * Moves — every change goes through commit() so undo/redo stay honest
     * ------------------------------------------------------------------ */
    function commit(changes) {
        const inverse = changes.map(c => ({i: c.i, val: S.grid[c.i], notes: S.notes[c.i]}));
        let touched = false;
        for (const c of changes) {
            if (S.grid[c.i] !== c.val || S.notes[c.i] !== c.notes) touched = true;
            S.grid[c.i] = c.val;
            S.notes[c.i] = c.notes;
        }
        if (!touched) return false;
        S.undo.push(inverse);
        if (S.undo.length > 300) S.undo.shift();
        S.redo.length = 0;
        return true;
    }

    function applyRecord(rec, target) {
        const inverse = rec.map(c => ({i: c.i, val: S.grid[c.i], notes: S.notes[c.i]}));
        for (const c of rec) {
            S.grid[c.i] = c.val;
            S.notes[c.i] = c.notes;
        }
        target.push(inverse);
        S.sel = rec[0].i;
    }

    function undo() {
        if (!S.undo.length || S.paused) return;
        applyRecord(S.undo.pop(), S.redo);
        S.solved = false;
        after();
    }

    function redo() {
        if (!S.redo.length || S.paused) return;
        applyRecord(S.redo.pop(), S.undo);
        after();
    }

    function after() {
        paint();
        save();
    }

    function placeDigit(d) {
        if (S.paused || S.solved) return;
        if (S.sel < 0 || S.given[S.sel]) {
            S.focusDigit = S.focusDigit === d ? 0 : d;
            paint();
            return;
        }
        const i = S.sel;
        if (S.notesMode) {
            if (S.grid[i]) return;
            commit([{i, val: 0, notes: S.notes[i] ^ (1 << (d - 1))}]);
            after();
            return;
        }
        if (S.grid[i] === d) {                       // tapping the same digit clears it
            commit([{i, val: 0, notes: 0}]);
            after();
            return;
        }
        const changes = [{i, val: d, notes: 0}];
        if (opts.autonotes) {
            const mask = ~(1 << (d - 1));
            for (const p of core.PEERS[i]) {
                if (!S.grid[p] && (S.notes[p] & ~mask)) changes.push({i: p, val: 0, notes: S.notes[p] & mask});
            }
        }
        commit(changes);
        if (S.solution[i] !== d) {
            S.mistakes++;
            flash(i, "shake");
        } else {
            flash(i, "pop");
        }
        after();
        checkWin();
    }

    function erase() {
        if (S.paused || S.solved || S.sel < 0 || S.given[S.sel]) return;
        commit([{i: S.sel, val: 0, notes: 0}]);
        after();
    }

    function hint() {
        if (S.paused || S.solved || S.hints >= HINT_BUDGET) return;
        let target = S.sel >= 0 && !S.given[S.sel] && S.grid[S.sel] !== S.solution[S.sel] ? S.sel : -1;
        if (target < 0) {
            const open = [];
            for (let i = 0; i < 81; i++) if (S.grid[i] !== S.solution[i]) open.push(i);
            if (!open.length) return;
            target = open[(Math.random() * open.length) | 0];
        }
        const d = S.solution[target];
        const changes = [{i: target, val: d, notes: 0}];
        const mask = ~(1 << (d - 1));
        for (const p of core.PEERS[target]) {
            if (!S.grid[p] && (S.notes[p] & ~mask)) changes.push({i: p, val: 0, notes: S.notes[p] & mask});
        }
        commit(changes);
        S.hints++;
        S.sel = target;
        flash(target, "reveal");
        after();
        checkWin();
    }

    function checkWin() {
        for (let i = 0; i < 81; i++) if (S.grid[i] !== S.solution[i]) return false;
        S.solved = true;
        stopClock();
        const prev = best[S.difficulty];
        const record = S.hints === 0 && (!prev || S.time < prev);   // hinted runs don't set records
        if (record) {
            best[S.difficulty] = S.time;
            writeJSON(BEST_KEY, best);
        }
        paintMeta();
        paint();
        clearSave();
        $("#win-time").textContent = fmt(S.time);
        $("#win-best").textContent = best[S.difficulty] ? fmt(best[S.difficulty]) : "—";
        $("#win-hints").textContent = String(S.hints);
        $("#win-title").textContent = record ? "New best time!" : "Solved!";
        $("#win-sub").textContent = LEVEL_NAMES[S.difficulty] + " · " +
            (S.mistakes === 0 ? "flawless run" : S.mistakes + (S.mistakes === 1 ? " misstep" : " missteps"));
        const dlg = $("#win-dialog");
        if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
        return true;
    }

    /* ------------------------------------------------------------------ *
     * Selection & clock
     * ------------------------------------------------------------------ */
    function select(i) {
        if (S.paused || i < 0 || i > 80) return;
        S.sel = i;
        S.focusDigit = 0;
        cells[i].el.focus({preventScroll: true});
        paint();
    }

    function move(dr, dc) {
        const cur = S.sel < 0 ? 40 : S.sel;
        const r = Math.min(8, Math.max(0, ((cur / 9) | 0) + dr));
        const c = Math.min(8, Math.max(0, (cur % 9) + dc));
        select(r * 9 + c);
    }

    let clockId = 0, lastTick = 0;

    function startClock() {
        stopClock();
        lastTick = Date.now();
        S.running = true;
        clockId = setInterval(() => {
            if (S.paused || S.solved) return;
            const now = Date.now();
            S.time += Math.round((now - lastTick) / 1000);
            lastTick = now;
            $("#elapsed").textContent = fmt(S.time);
            if (S.time % 10 === 0) save();
        }, 1000);
        $("#elapsed").textContent = fmt(S.time);
    }

    function stopClock() {
        clearInterval(clockId);
        clockId = 0;
        S.running = false;
    }

    function setPaused(p) {
        if (S.solved || !S.grid.length) return;
        S.paused = p;
        lastTick = Date.now();
        $("#veil-paused").classList.toggle("show", p);
        $("#pause-btn").setAttribute("aria-label", p ? "Resume" : "Pause");
        $("#pause-btn").innerHTML = p
            ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>'
            : '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg>';
        paint();
    }

    /* ------------------------------------------------------------------ *
     * Persistence
     * ------------------------------------------------------------------ */
    function save() {
        if (S.solved) return;
        writeJSON(SAVE_KEY, {
            v: 2,
            grid: Array.from(S.grid),
            given: Array.from(S.given),
            solution: Array.from(S.solution),
            notes: Array.from(S.notes),
            difficulty: S.difficulty,
            seed: S.seed,
            time: S.time,
            hints: S.hints,
            mistakes: S.mistakes
        });
    }

    function clearSave() {
        try {
            localStorage.removeItem(SAVE_KEY);
        } catch (e) {
        }
    }

    function restore() {
        const d = readJSON(SAVE_KEY);
        if (!d || d.v !== 2 || !d.grid || d.grid.length !== 81) return false;
        S.grid = Int8Array.from(d.grid);
        S.given = Uint8Array.from(d.given);
        S.solution = Int8Array.from(d.solution);
        S.notes = Int32Array.from(d.notes || []);
        if (S.notes.length !== 81) S.notes = new Int32Array(81);
        S.difficulty = d.difficulty in LEVEL_NAMES ? d.difficulty : "medium";
        S.seed = d.seed | 0;
        S.time = d.time | 0;
        S.hints = d.hints | 0;
        S.mistakes = d.mistakes | 0;
        S.undo = [];
        S.redo = [];
        S.sel = -1;
        S.solved = false;
        $("#difficulty").value = S.difficulty;
        return true;
    }

    /* ------------------------------------------------------------------ *
     * New game
     * ------------------------------------------------------------------ */
    let generating = false;

    async function newGame(difficulty, seed) {
        if (generating) return;
        generating = true;
        S.difficulty = difficulty;
        S.seed = (seed == null ? (Math.random() * 0xffffffff) >>> 0 : seed >>> 0) || 1;
        stopClock();
        setPausedSilently();
        S.solved = false;
        $("#loading-text").textContent = difficulty === "master" || difficulty === "expert"
            ? "Carving out a hard one — this can take a moment…"
            : "Carving out a puzzle…";
        $("#veil-loading").classList.add("show");
        paintMeta();
        try {
            const res = await generate(S.seed, difficulty);
            S.grid = Int8Array.from(res.puzzle);
            S.given = Uint8Array.from(res.puzzle.map(v => v ? 1 : 0));
            S.solution = Int8Array.from(res.solution);
            S.notes = new Int32Array(81);
            S.undo = [];
            S.redo = [];
            S.sel = -1;
            S.focusDigit = 0;
            S.hints = 0;
            S.mistakes = 0;
            S.time = 0;
            S.notesMode = false;
            startGame();
        } catch (err) {
            toast("Could not build a puzzle — please try again.");
        } finally {
            $("#veil-loading").classList.remove("show");
            generating = false;
        }
    }

    function setPausedSilently() {
        S.paused = false;
        $("#veil-paused").classList.remove("show");
    }

    function startGame() {
        paintMeta();
        paint();
        startClock();
        save();
        const url = new URL(location.href);
        url.searchParams.set("d", S.difficulty);
        url.searchParams.set("seed", String(S.seed));
        history.replaceState(null, "", url);
    }

    /* ------------------------------------------------------------------ *
     * Events
     * ------------------------------------------------------------------ */
    boardEl.addEventListener("pointerdown", e => {
        const t = e.target.closest(".cell");
        if (!t) return;
        e.preventDefault();
        select(+t.dataset.i);
    });

    padEl.addEventListener("click", e => {
        const t = e.target.closest(".digit");
        if (t) placeDigit(+t.dataset.d);
    });

    $("#undo-btn").addEventListener("click", undo);
    $("#redo-btn").addEventListener("click", redo);
    $("#erase-btn").addEventListener("click", erase);
    $("#hint-btn").addEventListener("click", hint);
    $("#notes-btn").addEventListener("click", () => {
        S.notesMode = !S.notesMode;
        paint();
    });
    $("#pause-btn").addEventListener("click", () => setPaused(!S.paused));
    $("#resume-btn").addEventListener("click", () => setPaused(false));
    $("#new-btn").addEventListener("click", () => {
        const started = S.undo.length > 0;
        if (!S.solved && started && !confirm("Start a new game? This puzzle will be lost.")) return;
        newGame($("#difficulty").value);
    });
    $("#difficulty").addEventListener("change", e => {
        const next = e.target.value;
        if (!S.solved && S.undo.length &&
            !confirm("Start a new " + LEVEL_NAMES[next] + " game? This puzzle will be lost.")) {
            e.target.value = S.difficulty;
            return;
        }
        newGame(next);
    });
    $("#win-again").addEventListener("click", () => {
        $("#win-dialog").close();
        newGame(S.difficulty);
    });
    $("#win-close").addEventListener("click", () => $("#win-dialog").close());

    $("#share-btn").addEventListener("click", async () => {
        const url = location.origin + location.pathname + "?d=" + S.difficulty + "&seed=" + S.seed;
        try {
            if (navigator.share && matchMedia("(pointer: coarse)").matches) {
                await navigator.share({title: "Sudoku", text: LEVEL_NAMES[S.difficulty] + " sudoku", url});
            } else {
                await navigator.clipboard.writeText(url);
                toast("Puzzle link copied");
            }
        } catch (e) {
            toast(url);
        }
    });

    const settingsPanel = $("#settings-panel"), settingsBtn = $("#settings-btn");
    settingsBtn.addEventListener("click", () => {
        const show = !settingsPanel.classList.contains("show");
        settingsPanel.classList.toggle("show", show);
        settingsBtn.setAttribute("aria-expanded", String(show));
    });
    [["opt-mistakes", "mistakes"], ["opt-autonotes", "autonotes"], ["opt-match", "match"]].forEach(([id, key]) => {
        const el = $("#" + id);
        el.checked = !!opts[key];
        el.addEventListener("change", () => {
            opts[key] = el.checked;
            writeJSON(OPTS_KEY, opts);
            paint();
        });
    });

    document.addEventListener("keydown", e => {
        if (e.target.matches("select, input")) return;
        const k = e.key;
        if (k === "Escape") {
            settingsPanel.classList.remove("show");
            settingsBtn.setAttribute("aria-expanded", "false");
            S.sel = -1;
            S.focusDigit = 0;
            paint();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && (k === "z" || k === "Z")) {
            e.preventDefault();
            return e.shiftKey ? redo() : undo();
        }
        if ((e.ctrlKey || e.metaKey) && (k === "y" || k === "Y")) {
            e.preventDefault();
            return redo();
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (k >= "1" && k <= "9") {
            e.preventDefault();
            placeDigit(+k);
        } else if (k === "Backspace" || k === "Delete" || k === "0") {
            e.preventDefault();
            erase();
        } else if (k === "n" || k === "N") {
            S.notesMode = !S.notesMode;
            paint();
        } else if (k === "h" || k === "H") {
            hint();
        } else if (k === " ") {
            e.preventDefault();
            setPaused(!S.paused);
        } else if (k === "ArrowUp" || k === "w") {
            e.preventDefault();
            move(-1, 0);
        } else if (k === "ArrowDown" || k === "s") {
            e.preventDefault();
            move(1, 0);
        } else if (k === "ArrowLeft" || k === "a") {
            e.preventDefault();
            move(0, -1);
        } else if (k === "ArrowRight" || k === "d") {
            e.preventDefault();
            move(0, 1);
        }
    });

    document.addEventListener("visibilitychange", () => {
        if (document.hidden && S.running && !S.paused && !S.solved) setPaused(true);
        save();
    });
    window.addEventListener("pagehide", save);

    /* ------------------------------------------------------------------ *
     * Boot
     * ------------------------------------------------------------------ */
    (function boot() {
        const params = new URLSearchParams(location.search);
        const wanted = params.get("d");
        const seedParam = params.get("seed");
        const linked = wanted && wanted in LEVEL_NAMES && seedParam && /^\d+$/.test(seedParam);
        const saved = readJSON(SAVE_KEY);
        // A seeded link only starts a fresh puzzle if it is not the one already in progress,
        // so reloading mid-game (the URL carries the seed) resumes instead of restarting.
        if (linked && !(saved && saved.seed === +seedParam && saved.difficulty === wanted)) {
            $("#difficulty").value = wanted;
            newGame(wanted, +seedParam);
            return;
        }
        if (restore()) {
            paintMeta();
            paint();
            startClock();
            return;
        }
        newGame("medium");
    })();
</script>
<script src="../logo.js"></script>
</body>
</html>
