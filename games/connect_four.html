<body>
<div class="container">
  <header>
    <h1>Connect Four</h1>
    <p>Connect four pieces horizontally, vertically, or diagonally to win!</p>
  </header>

  <div class="game-area">
    <div class="controls">
      <div class="player-info">
        <div id="player1" class="player player-red active">
          <div class="player-name">Red</div>
          <div class="player-score">0</div>
        </div>
        <div id="player2" class="player player-yellow">
          <div class="player-name">Yellow</div>
          <div class="player-score">0</div>
        </div>
      </div>

      <div id="game-status" class="status">Red's turn</div>

      <div class="control-group">
        <label for="opponent">Opponent</label>
        <select id="opponent">
          <option value="ai" selected>Computer</option>
          <option value="human">Human</option>
        </select>
      </div>

      <div id="difficulty-container" class="control-group">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <button id="undo" disabled>Undo Move</button>
      <button id="reset" class="primary">New Game</button>
    </div>

    <div class="board-container">
      <div id="board" class="board" role="grid" aria-label="Connect Four game board"></div>
    </div>
  </div>

  <footer>
    <p>© 2025 Connect Four Online - The classic strategy game</p>
  </footer>
</div>

<div id="win-modal" class="modal">
  <div class="modal-content">
    <h2 id="win-message">Player Wins!</h2>
    <p id="win-description">Congratulations!</p>
    <div class="modal-buttons">
      <button id="new-game" class="primary">New Game</button>
      <button id="close-modal">Continue</button>
    </div>
  </div>
</div>

<script>
  // Game state
  const game = {
    board: Array(6).fill().map(() => Array(7).fill(null)),
    currentPlayer: 'red',
    gameOver: false,
    winner: null,
    moveHistory: [],
    scores: { red: 0, yellow: 0 },
    winningCells: [],
    aiThinking: false,
    id: 0
  };

  // DOM elements
  const elements = {
    board: document.getElementById('board'),
    status: document.getElementById('game-status'),
    player1: document.getElementById('player1'),
    player2: document.getElementById('player2'),
    player1Score: document.querySelector('#player1 .player-score'),
    player2Score: document.querySelector('#player2 .player-score'),
    opponent: document.getElementById('opponent'),
    difficulty: document.getElementById('difficulty'),
    difficultyContainer: document.getElementById('difficulty-container'),
    undoBtn: document.getElementById('undo'),
    resetBtn: document.getElementById('reset'),
    winModal: document.getElementById('win-modal'),
    winMessage: document.getElementById('win-message'),
    winDescription: document.getElementById('win-description'),
    newGameBtn: document.getElementById('new-game'),
    closeModalBtn: document.getElementById('close-modal')
  };

  // Initialize game
  function initGame() {
    createBoard();
    attachEventListeners();
    updateUI();
  }

  // Create game board
  function createBoard() {
    elements.board.innerHTML = '';
    for (let col = 0; col < 7; col++) {
      const column = document.createElement('div');
      column.className = 'column';
      column.dataset.col = col;
      column.setAttribute('role', 'columnheader');
      column.setAttribute('aria-label', `Column ${col + 1}`);
      for (let row = 0; row < 6; row++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = 5 - row; // Invert for visual representation
        cell.dataset.col = col;
        cell.setAttribute('tabindex', '0');
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('aria-label', `Row ${5 - row + 1}, Column ${col + 1}`);
        column.appendChild(cell);
      }
      elements.board.appendChild(column);
    }
  }

  // Add event listeners
  function attachEventListeners() {
    elements.board.addEventListener('click', handleColumnClick);
    elements.board.addEventListener('keydown', handleKeyboardNavigation);
    elements.resetBtn.addEventListener('click', resetGame);
    elements.undoBtn.addEventListener('click', undoMove);
    elements.opponent.addEventListener('change', handleOpponentChange);
    elements.difficulty.addEventListener('change', () => updateUI());
    elements.newGameBtn.addEventListener('click', () => {
      resetGame();
      elements.winModal.classList.remove('active');
    });
    elements.closeModalBtn.addEventListener('click', () => {
      elements.winModal.classList.remove('active');
    });
  }

  // Handle column click
  function handleColumnClick(e) {
    if (game.gameOver || game.aiThinking) return;

    const column = e.target.closest('.column');
    if (!column) return;

    const colIndex = parseInt(column.dataset.col);
    makeMove(colIndex);
  }

  // Handle keyboard navigation
  function handleKeyboardNavigation(e) {
    if (game.gameOver || game.aiThinking) return;

    const cell = e.target.closest('.cell');
    if (!cell) return;

    const row = parseInt(cell.dataset.row);
    const col = parseInt(cell.dataset.col);

    switch(e.key) {
      case 'ArrowLeft':
        if (col > 0) {
          document.querySelector(`.cell[data-row="${row}"][data-col="${col-1}"]`).focus();
        }
        break;
      case 'ArrowRight':
        if (col < 6) {
          document.querySelector(`.cell[data-row="${row}"][data-col="${col+1}"]`).focus();
        }
        break;
      case 'ArrowUp':
        if (row < 5) {
          document.querySelector(`.cell[data-row="${row+1}"][data-col="${col}"]`).focus();
        }
        break;
      case 'ArrowDown':
        if (row > 0) {
          document.querySelector(`.cell[data-row="${row-1}"][data-col="${col}"]`).focus();
        }
        break;
      case 'Enter':
      case ' ':
        makeMove(col);
        break;
    }
  }

  // Handle opponent change
  function handleOpponentChange() {
    elements.difficultyContainer.style.display =
            elements.opponent.value === 'ai' ? 'block' : 'none';
    resetGame();
  }

  // Make a move
  function makeMove(col) {
    if (game.gameOver || game.aiThinking) return;

    const row = findAvailableRow(col);
    if (row === -1) return; // Column is full

    // Place piece and record move
    game.board[row][col] = game.currentPlayer;
    game.moveHistory.push({row, col, player: game.currentPlayer});

    // Update UI
    const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
    cell.classList.add(game.currentPlayer, 'dropped');

    // Check for win
    if (checkWin(row, col)) {
      game.gameOver = true;
      game.winner = game.currentPlayer;
      game.scores[game.currentPlayer]++;
      highlightWinningCells();
      setTimeout(showWinModal, 500);
      updateUI();
      return;
    }

    // Check for draw
    if (checkDraw()) {
      game.gameOver = true;
      setTimeout(showDrawModal, 500);
      updateUI();
      return;
    }

    // Switch player
    game.currentPlayer = game.currentPlayer === 'red' ? 'yellow' : 'red';
    updateUI();

    // AI move
    if (elements.opponent.value === 'ai' && game.currentPlayer === 'yellow' && !game.gameOver) {
      game.aiThinking = true;
      updateUI();

      // Let "AI is thinking..." paint, search, then play at the usual pace.
      // A new game or opponent change while it thinks discards the move.
      const gameId = game.id;
      const started = performance.now();
      setTimeout(() => {
        if (game.id !== gameId) return;
        const aiCol = getAIMove();
        setTimeout(() => {
          if (game.id !== gameId) return;
          game.aiThinking = false;
          makeMove(aiCol);
        }, Math.max(0, 600 - (performance.now() - started)));
      }, 30);
    }
  }

  // Find available row in column
  function findAvailableRow(col) {
    for (let row = 0; row < 6; row++) {
      if (game.board[row][col] === null) {
        return row;
      }
    }
    return -1; // Column is full
  }

  // Check for win
  function checkWin(row, col) {
    const directions = [
      [0, 1],  // horizontal
      [1, 0],  // vertical
      [1, 1],  // diagonal down-right
      [1, -1]  // diagonal down-left
    ];

    const player = game.board[row][col];

    for (const [dr, dc] of directions) {
      game.winningCells = [{row, col}];

      // Check in one direction
      let r = row + dr;
      let c = col + dc;
      while (isValidCell(r, c) && game.board[r][c] === player) {
        game.winningCells.push({row: r, col: c});
        r += dr;
        c += dc;
      }

      // Check in opposite direction
      r = row - dr;
      c = col - dc;
      while (isValidCell(r, c) && game.board[r][c] === player) {
        game.winningCells.push({row: r, col: c});
        r -= dr;
        c -= dc;
      }

      if (game.winningCells.length >= 4) {
        return true;
      }
    }

    game.winningCells = [];
    return false;
  }

  // Check if cell coordinates are valid
  function isValidCell(row, col) {
    return row >= 0 && row < 6 && col >= 0 && col < 7;
  }

  // Check for draw
  function checkDraw() {
    return game.board.every(row => row.every(cell => cell !== null));
  }

  // Highlight winning cells
  function highlightWinningCells() {
    game.winningCells.forEach(({row, col}) => {
      const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
      cell.classList.add('win');
    });
  }

  // Show win modal
  function showWinModal() {
    const winner = game.winner === 'red' ? 'Red' : 'Yellow';
    elements.winMessage.textContent = `${winner} Wins!`;
    elements.winDescription.textContent = `Congratulations! ${winner} has connected four pieces.`;
    elements.winModal.classList.add('active');
  }

  // Show draw modal
  function showDrawModal() {
    elements.winMessage.textContent = 'Game Draw!';
    elements.winDescription.textContent = 'The board is full with no winner.';
    elements.winModal.classList.add('active');
  }

  // AI move logic
  // The computer searches ahead instead of scoring one move in isolation:
  // negamax with alpha-beta over the 69 four-in-a-row windows, a
  // transposition table, and iterative deepening against a time budget.
  // Difficulty is how far it looks and how much noise it adds to close calls;
  // it never plays a move that loses on the spot.
  const AI_LEVELS = {
    easy:   { depth: 2,  budget: 100, noise: 40 },
    medium: { depth: 6,  budget: 300, noise: 6 },
    hard:   { depth: 42, budget: 700, noise: 0 }
  };
  const ai = (() => {
    const WIN = 100000;
    const ORDER = [3, 2, 4, 1, 5, 0, 6];
    const WEIGHT = [0, 1, 5, 40];
    const windows = [];            // each window: four cell indices (col * 6 + row)
    const cellWindows = [];        // cell index -> windows through it
    for (let i = 0; i < 42; i++) cellWindows.push([]);
    for (let c = 0; c < 7; c++) {
      for (let r = 0; r < 6; r++) {
        for (const [dc, dr] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
          const ec = c + 3 * dc, er = r + 3 * dr;
          if (ec > 6 || er < 0 || er > 5) continue;
          const w = [];
          for (let k = 0; k < 4; k++) w.push((c + k * dc) * 6 + r + k * dr);
          w.forEach(i => cellWindows[i].push(windows.length));
          windows.push(w);
        }
      }
    }
    const NW = windows.length;

    const cells = new Int8Array(42);          // 0 empty, 1 / 2 players
    const height = new Int8Array(7);
    const count = new Int8Array(NW * 3);      // pieces per player in each window
    let moves = 0;

    // Zobrist keys, two 32-bit halves
    const zA = new Int32Array(42 * 3), zB = new Int32Array(42 * 3);
    for (let i = 0; i < zA.length; i++) {
      zA[i] = (Math.random() * 4294967296) | 0;
      zB[i] = (Math.random() * 4294967296) | 0;
    }
    let hA = 0, hB = 0;
    const TT_SIZE = 1 << 20, TT_MASK = TT_SIZE - 1;
    const ttKey = new Int32Array(TT_SIZE), ttScore = new Int32Array(TT_SIZE);
    const ttDepth = new Int8Array(TT_SIZE), ttFlag = new Int8Array(TT_SIZE), ttMove = new Int8Array(TT_SIZE);
    const EXACT = 1, LOWER = 2, UPPER = 3;
    const history = new Int32Array(84);     // cutoff counts per player and cell

    function play(col, p) {
      const i = col * 6 + height[col]++;
      cells[i] = p; moves++;
      hA ^= zA[i * 3 + p]; hB ^= zB[i * 3 + p];
      const ws = cellWindows[i];
      for (let k = 0; k < ws.length; k++) count[ws[k] * 3 + p]++;
    }
    function unplay(col) {
      const i = col * 6 + --height[col], p = cells[i];
      cells[i] = 0; moves--;
      hA ^= zA[i * 3 + p]; hB ^= zB[i * 3 + p];
      const ws = cellWindows[i];
      for (let k = 0; k < ws.length; k++) count[ws[k] * 3 + p]--;
    }
    // Would p complete four by filling cell i?
    function completes(i, p) {
      const o = 3 - p, ws = cellWindows[i];
      for (let k = 0; k < ws.length; k++) {
        const w = ws[k] * 3;
        if (count[w + p] === 3 && count[w + o] === 0) return true;
      }
      return false;
    }
    function winningCol(col, p) {
      return height[col] < 6 && completes(col * 6 + height[col], p);
    }

    // Static score for the side to move. Open windows count by how full they
    // are; a completed-but-for-one cell that is not yet playable is a threat,
    // and the first player's threats are worth more on odd rows, the second's
    // on even rows, because zugzwang fills the board in that parity.
    function evaluate(p) {
      const o = 3 - p;
      let s = 0;
      for (let w = 0; w < NW; w++) {
        const a = count[w * 3 + p], b = count[w * 3 + o];
        if (a && !b) s += WEIGHT[a];
        else if (b && !a) s -= WEIGHT[b];
      }
      for (let c = 0; c < 7; c++) {
        for (let r = height[c] + 1; r < 6; r++) {
          const i = c * 6 + r;
          const good = r % 2 === 0 ? 1 : 2;   // row 0 is the bottom row (row 1 on the board)
          if (completes(i, p)) s += good === p ? 30 : 12;
          if (completes(i, o)) s -= good === o ? 30 : 12;
        }
      }
      return s;
    }

    let deadline = 0, nodes = 0;
    const ABORT = {};

    function negamax(depth, alpha, beta, p, ply) {
      if ((++nodes & 4095) === 0 && performance.now() > deadline) throw ABORT;
      const o = 3 - p;
      for (let c = 0; c < 7; c++) if (winningCol(c, p)) return WIN - ply;
      if (moves === 42) return 0;

      // Opponent threats that are playable right now force our hand.
      let forced = -1, threats = 0;
      for (let c = 0; c < 7; c++) if (winningCol(c, o)) { threats++; forced = c; }
      if (threats > 1) return -(WIN - ply - 1);
      if (depth <= 0) return evaluate(p);

      const alpha0 = alpha;
      const slot = hA & TT_MASK;
      let ttBest = -1;
      if (ttKey[slot] === hB && ttFlag[slot]) {
        ttBest = ttMove[slot];
        if (ttDepth[slot] >= depth) {
          const v = ttScore[slot], f = ttFlag[slot];
          if (f === EXACT) return v;
          if (f === LOWER && v > alpha) alpha = v;
          else if (f === UPPER && v < beta) beta = v;
          if (alpha >= beta) return v;
        }
      }

      let best = -Infinity, bestCol = -1;
      let list;
      if (forced >= 0) list = [forced];
      else {
        // Table move first, then moves that caused cutoffs elsewhere, centre first on ties.
        const hist = history.subarray((p - 1) * 42, p * 42);
        list = ORDER.filter(c => c !== ttBest && height[c] < 6)
          .sort((a, b) => hist[b * 6 + height[b]] - hist[a * 6 + height[a]]);
        if (ttBest >= 0) list.unshift(ttBest);
      }
      for (let k = 0; k < list.length; k++) {
        const c = list[k];
        if (height[c] >= 6) continue;
        let v;
        // Playing under the opponent's winning cell loses at once.
        if (height[c] < 5 && completes(c * 6 + height[c] + 1, o)) v = -(WIN - ply - 2);
        else {
          play(c, p);
          v = -negamax(depth - 1, -beta, -alpha, o, ply + 1);
          unplay(c);
        }
        if (v > best) { best = v; bestCol = c; }
        if (v > alpha) alpha = v;
        if (alpha >= beta) {
          if (height[c] < 6) history[(p - 1) * 42 + c * 6 + height[c]] += depth * depth;
          break;
        }
      }
      ttKey[slot] = hB; ttScore[slot] = best; ttDepth[slot] = depth; ttMove[slot] = bestCol;
      ttFlag[slot] = best <= alpha0 ? UPPER : best >= beta ? LOWER : EXACT;
      return best;
    }

    // Scores for every legal root move at a given depth. With narrow set,
    // moves that cannot match the best so far are only proven worse, which is
    // all a noiseless pick needs and lets the search go deeper.
    function scoreRoot(depth, p, prev, narrow) {
      const o = 3 - p, scores = [];
      const order = prev ? prev.slice().sort((a, b) => b.score - a.score).map(s => s.col) : ORDER;
      let best = -Infinity;
      for (const c of order) {
        if (height[c] >= 6) continue;
        let v;
        if (winningCol(c, p)) v = WIN;
        else {
          play(c, p);
          v = -negamax(depth - 1, -Infinity, narrow && best > -Infinity ? -(best - 1) : Infinity, o, 1);
          unplay(c);
        }
        if (v > best) best = v;
        scores.push({ col: c, score: v });
      }
      return scores;
    }

    function load(board) {
      cells.fill(0); height.fill(0); count.fill(0); moves = 0; hA = 0; hB = 0;
      ttFlag.fill(0); history.fill(0);
      for (let c = 0; c < 7; c++) {
        for (let r = 0; r < 6 && board[r][c] !== null; r++) play(c, board[r][c] === 'red' ? 1 : 2);
      }
    }

    function chooseMove(board, player, level) {
      const cfg = AI_LEVELS[level] || AI_LEVELS.medium;
      const p = player === 'red' ? 1 : 2;
      load(board);
      const start = performance.now();
      deadline = start + cfg.budget;
      nodes = 0;
      let scores = null;
      const maxDepth = Math.min(cfg.depth, 42 - moves);
      try {
        for (let d = 1; d <= maxDepth; d++) {
          scores = scoreRoot(d, p, scores, cfg.noise === 0);
          if (scores.some(s => Math.abs(s.score) > WIN / 2 && s.score > 0)) break;    // a forced win is found
          if (scores.every(s => s.score < -WIN / 2)) break;                           // every move loses
        }
      } catch (e) {
        if (e !== ABORT) throw e;
        load(board);   // an aborted search leaves pieces on the scratch board
      }
      if (!scores) { deadline = Infinity; scores = scoreRoot(1, p); }

      // Noise only reshuffles moves that are close; it never turns a win
      // down or walks into a loss that another move would avoid.
      const best = Math.max(...scores.map(s => s.score));
      // Lost anyway: still block the win on offer and make the opponent find the next one.
      if (best < -WIN / 2) {
        const block = scores.find(s => winningCol(s.col, 3 - p));
        if (block) return block.col;
      }
      const decisive = Math.abs(best) > WIN / 2;
      const picked = scores.map(s => ({
        col: s.col,
        v: decisive || Math.abs(s.score) > WIN / 2 ? s.score : s.score + (Math.random() * 2 - 1) * cfg.noise
      }));
      const top = Math.max(...picked.map(s => s.v));
      const ties = picked.filter(s => s.v === top);
      return ties[Math.floor(Math.random() * ties.length)].col;
    }

    return { chooseMove };
  })();

  function getAIMove() {
    return ai.chooseMove(game.board, 'yellow', elements.difficulty.value);
  }

  // Undo move
  function undoMove() {
    if (game.moveHistory.length === 0 || game.gameOver) return;

    // If playing against AI, undo both AI and player moves
    if (elements.opponent.value === 'ai' && game.moveHistory.length > 1) {
      // Undo AI move
      const aiMove = game.moveHistory.pop();
      game.board[aiMove.row][aiMove.col] = null;
      const aiCell = document.querySelector(`.cell[data-row="${aiMove.row}"][data-col="${aiMove.col}"]`);
      aiCell.classList.remove('yellow', 'red', 'dropped');
    }

    // Undo player move
    const lastMove = game.moveHistory.pop();
    game.board[lastMove.row][lastMove.col] = null;
    const cell = document.querySelector(`.cell[data-row="${lastMove.row}"][data-col="${lastMove.col}"]`);
    cell.classList.remove('yellow', 'red', 'dropped', 'win');

    // Reset game state
    game.gameOver = false;
    game.winner = null;
    game.winningCells = [];
    game.currentPlayer = lastMove.player;

    // Remove win highlighting
    document.querySelectorAll('.cell.win').forEach(cell => {
      cell.classList.remove('win');
    });

    updateUI();
  }

  // Reset game
  function resetGame() {
    // Clear the board
    game.board = Array(6).fill().map(() => Array(7).fill(null));
    game.currentPlayer = 'red';
    game.gameOver = false;
    game.winner = null;
    game.moveHistory = [];
    game.winningCells = [];
    game.aiThinking = false;
    game.id++;

    // Reset UI
    document.querySelectorAll('.cell').forEach(cell => {
      cell.classList.remove('red', 'yellow', 'dropped', 'win');
    });

    updateUI();
  }

  // Update UI
  function updateUI() {
    // Update player indicators
    elements.player1.classList.toggle('active', game.currentPlayer === 'red' && !game.gameOver);
    elements.player2.classList.toggle('active', game.currentPlayer === 'yellow' && !game.gameOver);

    // Update scores
    elements.player1Score.textContent = game.scores.red;
    elements.player2Score.textContent = game.scores.yellow;

    // Update status message
    if (game.gameOver) {
      if (game.winner) {
        const winner = game.winner === 'red' ? 'Red' : 'Yellow';
        elements.status.textContent = `${winner} wins!`;
      } else {
        elements.status.textContent = 'Game Draw!';
      }
    } else if (game.aiThinking) {
      elements.status.textContent = 'AI is thinking...';
    } else {
      const player = game.currentPlayer === 'red' ? 'Red' : 'Yellow';
      elements.status.textContent = `${player}'s turn`;
    }

    // Update button states
    elements.undoBtn.disabled =
            game.moveHistory.length === 0 ||
            game.aiThinking ||
            (game.currentPlayer === 'yellow' && elements.opponent.value === 'ai' && !game.gameOver);
  }

  // Initialize game when DOM is loaded
  document.addEventListener('DOMContentLoaded', initGame);
</script>
<script src="../logo.js"></script>
</body>
