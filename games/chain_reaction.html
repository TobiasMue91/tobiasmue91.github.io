<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glowtide - Chain Reaction</title>
<meta name="description" content="Chain Reaction, remade as Glowtide: one tap sets off a bloom of light in a dark sea, and every drifting orb it touches blooms too. Light enough of them to rise a level. A new tide every day.">
<meta name="theme-color" content="#031019">
<style>
:root{
  --ink:#031019; --text:#eafffb; --dim:#8fc7c0; --gold:#ffc24d; --cyan:#38f5d0;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;pointer-events:none;opacity:0;transition:opacity .4s var(--ease);z-index:2}
#hud::before{content:"";position:fixed;left:0;right:0;top:0;height:150px;background:linear-gradient(rgba(2,10,16,.85),rgba(2,10,16,0));z-index:-1}
body.playing #hud{opacity:1}
#lv{font-size:18px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#cfeee9}
#sc{display:block;margin-top:4px;font-size:17px;font-weight:600;letter-spacing:.04em;color:var(--dim);font-variant-numeric:tabular-nums}
.gauge{position:relative;width:104px;height:104px;display:grid;place-items:center}
.gauge svg{position:absolute;inset:0}
.gauge .trk{stroke:#12404a}
.gauge .arc{stroke:var(--cyan);transition:stroke-dashoffset .35s var(--ease),stroke .3s;filter:drop-shadow(0 0 6px currentColor)}
.gauge.met .arc{stroke:var(--gold)}
#cnt{font-weight:800;font-size:42px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(56,245,208,.5);transform-origin:50% 55%}
#cnt small{display:block;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.12em;margin-top:3px;text-shadow:none}
.gauge.met #cnt{color:var(--gold);text-shadow:0 0 18px rgba(255,194,77,.6)}
#cnt.pop{animation:pop .22s var(--ease)}
@keyframes pop{0%{transform:scale(1.22)}100%{transform:scale(1)}}
.lights{justify-self:end;display:flex;gap:10px}
.lights i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,rgba(56,245,208,.25) 24%);border:2.5px solid #38f5d0;box-shadow:0 0 14px #38f5d0,inset 0 0 8px rgba(56,245,208,.6);transition:background .4s,box-shadow .4s,transform .4s var(--ease),border-color .4s}
.lights i.off{background:transparent;box-shadow:none;border:2px dashed #34666e;transform:scale(.8)}
.lights i.just{animation:snuff .7s var(--ease)}
@keyframes snuff{0%{transform:scale(1.6)}100%{transform:scale(.8)}}

/* corner buttons */
.ico{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--dim);z-index:3;opacity:.85;transition:opacity .2s,color .2s}
.ico:hover{opacity:1;color:var(--text)}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bSound{right:10px} #bHome{left:10px}
body:not(.playing) #bHome{display:none}

/* screens */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:4;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s}
.scr.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .45s var(--ease)}
#home{background:radial-gradient(ellipse at 50% 45%,rgba(3,16,25,.78),rgba(3,16,25,.35) 70%)}
#home h1{margin:0;font-size:clamp(54px,15vw,104px);font-weight:200;letter-spacing:-.03em;line-height:1;text-shadow:0 0 40px rgba(56,245,208,.55)}
#home h1 b{font-weight:800;color:var(--cyan)}
#home p.tag{margin:14px 0 34px;font-size:clamp(16px,4.4vw,20px);color:var(--dim);letter-spacing:.02em}
.btn{display:block;min-width:min(280px,78vw);padding:17px 28px;border-radius:999px;font-size:18px;font-weight:700;letter-spacing:.03em;transition:transform .15s var(--ease),box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn.main{background:linear-gradient(180deg,#5ffbe0,#1fd3b4);color:#02221d;box-shadow:0 0 30px rgba(56,245,208,.45)}
.btn.main:hover{box-shadow:0 0 44px rgba(56,245,208,.7)}
.btn.ghost{margin-top:12px;border:2px solid rgba(143,199,192,.45);color:var(--text)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn small{display:block;font-size:13px;font-weight:600;opacity:.75;letter-spacing:.06em;margin-top:2px}
#homeStats{margin-top:30px;display:flex;gap:26px;color:var(--dim);font-size:13px;letter-spacing:.12em;text-transform:uppercase;min-height:44px}
#homeStats b{display:block;font-size:26px;letter-spacing:0;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;text-transform:none}
#credit{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));font-size:12px;color:var(--dim);opacity:.65;text-decoration:none;letter-spacing:.08em}

/* result sheet */
#card{justify-content:flex-end;padding:0 0 max(16px,env(safe-area-inset-bottom));background:none;pointer-events:none}
#card.on{pointer-events:none}
.sheet{pointer-events:auto;width:min(420px,calc(100vw - 24px));padding:22px 22px 20px;border-radius:26px;background:rgba(5,24,34,.9);border:1px solid rgba(143,199,192,.22);box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(56,245,208,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateY(40px);transition:transform .5s var(--ease)}
#card.on .sheet{transform:none}
@media (min-width:700px){#card{justify-content:center}}
.sheet h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
.sheet .sub{margin:6px 0 0;color:var(--dim);font-size:16px}
.stars{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.stars svg{width:46px;height:46px;fill:#0f3841;transition:fill .2s,filter .2s}
.stars svg.lit{fill:var(--gold);filter:drop-shadow(0 0 10px rgba(255,194,77,.8));animation:starIn .5s var(--ease) backwards}
@keyframes starIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.pts{font-size:20px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.sheet .btn{margin:16px auto 0;width:100%}
.sheet .btn.ghost{margin-top:10px}
.sheet .big{font-size:64px;font-weight:200;line-height:1.05;margin:10px 0 0;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(56,245,208,.5)}
.sheet .row{display:flex;justify-content:center;gap:28px;margin-top:8px;color:var(--dim);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.sheet .row b{display:block;font-size:22px;letter-spacing:0;color:var(--text);text-transform:none}
.sheet .lnk{display:inline-block;margin-top:10px;font-size:14px;color:var(--dim);padding:8px 12px;letter-spacing:.04em;text-decoration:underline;text-underline-offset:3px}
.sheet .lights{justify-content:center;margin-top:12px}
#pop{position:fixed;left:0;right:0;top:32%;text-align:center;font-size:clamp(56px,16vw,104px);font-weight:800;color:var(--gold);text-shadow:0 0 30px rgba(255,194,77,.7);opacity:0;pointer-events:none;z-index:3;font-variant-numeric:tabular-nums}
#pop.go{animation:popup 1.9s var(--ease)}
@keyframes popup{0%{opacity:0;transform:translateY(24px) scale(.8)}18%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#intro{position:fixed;left:0;right:0;top:27%;text-align:center;font-size:clamp(30px,8vw,48px);font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:0;pointer-events:none;z-index:2;text-shadow:0 0 24px rgba(56,245,208,.45)}
#intro span{display:block;font-size:.5em;font-weight:700;letter-spacing:.3em;color:#9fe9df;margin-bottom:6px}
#intro.hold.go{animation:introHold 2.2s var(--ease) forwards}
#intro.out{animation:introOut .4s forwards!important}
@keyframes introOut{from{opacity:.95}to{opacity:0}}
#sc::before{content:'SCORE ';font-size:.72em;letter-spacing:.14em;opacity:.8}
@keyframes introHold{0%{opacity:0;transform:translateY(10px)}20%,100%{opacity:.95;transform:none}}
#intro.go{animation:intro 2.2s var(--ease)}
@keyframes intro{0%{opacity:0;transform:translateY(10px)}20%{opacity:.9;transform:none}75%{opacity:.9}100%{opacity:0}}
#dim{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0),rgba(0,0,0,.65));opacity:0;z-index:1}
#dim.go{animation:dim 1.1s var(--ease)}
@keyframes dim{0%{opacity:1}100%{opacity:0}}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 12%,rgba(255,194,77,.28),rgba(255,194,77,0) 55%);opacity:0;pointer-events:none;z-index:1}
#flash.go{animation:flash .9s var(--ease)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#tip{position:fixed;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);white-space:nowrap;padding:10px 20px;border-radius:999px;background:rgba(5,24,34,.8);border:1px solid rgba(143,199,192,.3);font-size:18px;font-weight:700;letter-spacing:.05em;color:#fff;opacity:0;pointer-events:none;transition:opacity .5s;z-index:2}
#tip.on{opacity:1}
@media (min-width:900px){.gauge{width:124px;height:124px}#cnt{font-size:50px}#lv{font-size:20px}#sc{font-size:19px}.lights i{width:26px;height:26px}.sheet{width:500px}.sheet h2{font-size:36px}.btn{font-size:20px}.stars svg{width:56px;height:56px}}
@media (max-width:420px){.gauge{width:96px;height:96px}#cnt{font-size:38px}#lv{font-size:16px}}
@media (prefers-reduced-motion:reduce){
  .sheet{transform:none;transition:none}#cnt.pop,.lights i.just,.stars svg.lit,#flash.go,#pop.go,#dim.go,#intro.go{animation:none}
  .scr,.scr.on{transition-duration:.01s}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="flash"></div>
<div id="hud">
  <div><span id="lv">Level 1</span><span id="sc">0</span></div>
  <div class="gauge" id="gauge">
    <svg viewBox="0 0 104 104" aria-hidden="true"><circle class="trk" cx="52" cy="52" r="46" fill="none" stroke-width="5"/><circle class="arc" id="arc" cx="52" cy="52" r="46" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="289.03" transform="rotate(-90 52 52)"/></svg>
    <div id="cnt">0<small>OF 12</small></div>
  </div>
  <div class="lights" id="lights" aria-label="Lights left"><i></i><i></i><i></i></div>
</div>
<div id="pop"></div>
<div id="intro"></div>
<div id="dim"></div>
<div id="tip">Press, aim, release</div>
<div class="sr" id="live" aria-live="polite"></div>

<button class="ico" id="bHome" aria-label="Back to the shore"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg></button>
<button class="ico" id="bSound" aria-label="Sound on" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>

<section class="scr on" id="home">
  <h1>Glow<b>tide</b></h1>
  <p class="tag">One tap. Light them all.</p>
  <button class="btn main" id="bDaily">Tonight's tide<small id="dailySub"></small></button>
  <button class="btn ghost" id="bFree">Free dive</button>
  <div id="homeStats"></div>
  <a id="credit" href="/">gptgames.dev</a>
</section>
<section class="scr" id="card"><div class="sheet" id="sheet"></div></section>
<script id="core">
'use strict';
// Glowtide core: no DOM, no clock, no Math.random. The page only draws what this returns.
// Units: the field's short side is 1. A field is {w, h, top}: orbs live in [0,w] x [top,h].
const TIDE = (() => {
  const DT = 1 / 60;
  const GROW = 0.5, SHRINK = 0.8;
  const KINDS = {
    spark: {R: 0.17, hold: 1.6, r: 0.032},
    giant: {R: 0.26, hold: 1.6, r: 0.046},
    long:  {R: 0.17, hold: 4.4, r: 0.034},
  };
  const KIND_IDS = ['spark', 'giant', 'long'];
  const LIGHTS = 3;

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(...parts) {
    let h = 2166136261;
    for (const p of parts) {
      const s = String(p);
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      h ^= 124; h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  const dateSeed = ymd => hash('tide', ymd);
  const seedFrom = text => hash('tide', String(text).trim().toLowerCase());

  // What level n asks for.
  function spec(n, field) {
    const area = field ? field.w * (field.h - field.top) : 1.6;
    const total = Math.max(8, Math.min(48, Math.round(area * (8.5 + 0.7 * Math.min(n, 14)))));
    const frac = Math.min(0.9, 0.15 + 0.035 * n + (n > 10 ? 0.01 * (n - 10) : 0));
    const goal = Math.min(total - 1, Math.max(2, Math.ceil(total * frac)));
    const giants = n >= 4 ? Math.min(5, 1 + Math.floor((n - 4) / 3)) : 0;
    const longs = n >= 7 ? Math.min(5, 1 + Math.floor((n - 7) / 3)) : 0;
    const rest = total - goal;
    return {n, total, goal, giants, longs,
      star2: goal + Math.ceil(rest * 0.3), star3: goal + Math.ceil(rest * 0.65)};
  }

  function layout(seed, n, field, salt) {
    const sp = spec(n, field), rnd = rng(hash(seed, n, salt || 0, Math.round(field.w * 100), Math.round(field.h * 100)));
    const orbs = [];
    const kinds = [];
    for (let i = 0; i < sp.total; i++) kinds.push(i < sp.giants ? 'giant' : i < sp.giants + sp.longs ? 'long' : 'spark');
    for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
    for (const kind of kinds) {
      const r = KINDS[kind].r;
      let x, y, tries = 0;
      do {
        x = r + rnd() * (field.w - 2 * r);
        y = field.top + r + rnd() * (field.h - field.top - 2 * r);
        tries++;
      } while (tries < 40 && orbs.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 0.03));
      const ang = rnd() * Math.PI * 2, sp2 = (0.05 + rnd() * 0.05) * (1 + 0.025 * Math.min(n, 24));
      orbs.push({x, y, vx: Math.cos(ang) * sp2, vy: Math.sin(ang) * sp2, kind, r, phase: rnd()});
    }
    return orbs;
  }

  function bloomRadius(b) {
    const K = KINDS[b.kind];
    if (b.age < GROW) { const t = b.age / GROW; return K.R * (1 - (1 - t) ** 3); }
    if (b.age < GROW + K.hold) return K.R;
    const t = (b.age - GROW - K.hold) / SHRINK;
    return t >= 1 ? 0 : K.R * (1 - t * t);
  }
  const bloomLife = kind => GROW + KINDS[kind].hold + SHRINK;

  function newSim(orbs, field) {
    return {
      field, t: 0, tapped: false, caught: 0, score: 0, goalAt: 0, done: false,
      orbs: orbs.map(o => ({...o})), blooms: [], events: [], nextId: 1,
    };
  }
  function tap(sim, x, y) {
    if (sim.tapped) return false;
    sim.tapped = true;
    sim.blooms.push({id: sim.nextId++, x, y, kind: 'spark', depth: 0, age: 0, seed: true});
    sim.events.push({type: 'seed', x, y});
    return true;
  }
  function step(sim, goal) {
    const f = sim.field;
    sim.t += DT;
    for (const o of sim.orbs) {
      o.x += o.vx * DT; o.y += o.vy * DT;
      if (o.x < o.r) { o.x = o.r; o.vx = Math.abs(o.vx); }
      if (o.x > f.w - o.r) { o.x = f.w - o.r; o.vx = -Math.abs(o.vx); }
      if (o.y < f.top + o.r) { o.y = f.top + o.r; o.vy = Math.abs(o.vy); }
      if (o.y > f.h - o.r) { o.y = f.h - o.r; o.vy = -Math.abs(o.vy); }
    }
    for (const b of sim.blooms) b.age += DT;
    const born = [];
    for (const b of sim.blooms) {
      const r = bloomRadius(b);
      if (r <= 0) continue;
      for (let i = sim.orbs.length - 1; i >= 0; i--) {
        const o = sim.orbs[i];
        const dx = o.x - b.x, dy = o.y - b.y, rr = r + o.r;
        if (dx * dx + dy * dy <= rr * rr) {
          sim.orbs.splice(i, 1);
          sim.caught++;
          sim.score += 10 * sim.caught;
          const nb = {id: sim.nextId++, x: o.x, y: o.y, kind: o.kind, depth: b.depth + 1, age: 0, seed: false, parent: b.id};
          born.push(nb);
          sim.events.push({type: 'ignite', x: o.x, y: o.y, kind: o.kind, depth: nb.depth, k: sim.caught, id: nb.id});
          if (goal && sim.caught === goal && !sim.goalAt) { sim.goalAt = sim.t; sim.events.push({type: 'goal', k: sim.caught}); }
        }
      }
    }
    for (const nb of born) sim.blooms.push(nb);
    sim.blooms = sim.blooms.filter(b => b.age < bloomLife(b.kind));
    if (!sim.done && sim.tapped && sim.blooms.length === 0) { sim.done = true; sim.events.push({type: 'end', caught: sim.caught}); }
  }
  function runToEnd(sim, goal, maxSteps) {
    for (let i = 0; i < (maxSteps || 3000) && !sim.done; i++) step(sim, goal);
    return sim;
  }

  // Try taps on a grid at t=0; the page uses it to deal fair levels, the tests to judge them.
  function bestTap(orbs, field, goal, grid) {
    const g = grid || 8;
    let best = {caught: -1, x: 0, y: 0}, hits = 0, cells = 0;
    for (let i = 0; i < g; i++) for (let j = 0; j < g; j++) {
      const x = field.w * (i + 0.5) / g, y = field.top + (field.h - field.top) * (j + 0.5) / g;
      const s = newSim(orbs, field); tap(s, x, y); runToEnd(s, goal);
      cells++; if (s.caught >= goal) hits++;
      if (s.caught > best.caught) best = {caught: s.caught, x, y};
    }
    best.share = hits / cells;
    return best;
  }

  // A level every run can pass in principle: some tap clears the goal with room to spare,
  // but a tap at random usually does not.
  function makeLevel(seed, n, field) {
    const sp = spec(n, field);
    let last = null;
    for (let salt = 0; salt < 4; salt++) {
      const orbs = layout(seed, n, field, salt);
      const best = bestTap(orbs, field, sp.goal, 6);
      last = {spec: sp, orbs, hint: best, salt};
      if (best.caught >= Math.min(sp.total, sp.goal + 1) && best.share <= (n >= 8 ? 0.35 : 0.55) && (n > 3 || best.share >= 0.3)) return last;
    }
    return last;
  }

  function stars(sp, caught) { return caught >= sp.star3 ? 3 : caught >= sp.star2 ? 2 : caught >= sp.goal ? 1 : 0; }

  function newRun(seed) { return {seed, level: 1, lights: LIGHTS, score: 0, over: false, clears: 0}; }
  // result: {caught, score}; returns the run after the level, plus what happened.
  function settle(run, sp, result) {
    const st = stars(sp, result.caught);
    const r = {...run};
    r.score += result.score;
    let relit = false;
    if (st > 0) {
      r.score += 100 * st; r.level++; r.clears++;
      if (st === 3 && r.lights < LIGHTS) { r.lights++; relit = true; }
    } else {
      r.lights--;
      if (r.lights <= 0) r.over = true;
    }
    return {run: r, stars: st, passed: st > 0, relit};
  }

  // Saves trust nothing.
  function cleanSave(o) {
    const n = (v, max) => Number.isFinite(v) ? Math.max(0, Math.min(max, Math.floor(v))) : 0;
    o = o && typeof o === 'object' ? o : {};
    const day = /^\d{4}-\d{2}-\d{2}$/.test(o.lastDay) ? o.lastDay : '';
    const daily = o.daily && typeof o.daily === 'object' ? o.daily : {};
    return {
      best: n(o.best, 1e9), bestLevel: n(o.bestLevel, 999), runs: n(o.runs, 1e6),
      streak: n(o.streak, 9999), lastDay: day,

    g.lineWidth = Math.max(2.5, r * 0.11); g.setLineDash([2, 7]); g.lineDashOffset = -t * 6;
    g.beginPath(); g.arc(x, y, r * 1.75, 0, 7); g.stroke(); g.setLineDash([]);
  }
  g.globalAlpha = 1;
}
function drawBloom(b) {
  const r = px(T.bloomRadius(b)); if (r <= 0.5) return;
  const life = T.bloomLife(b.kind), K = T.KINDS[b.kind];
  const shrinkT = (b.age - T.GROW - K.hold) / T.SHRINK;
  const a = shrinkT > 0 ? Math.max(0, 1 - shrinkT) : 1;
  const col = DEPTH[Math.min(b.depth, 6)], x = px(b.x), y = px(b.y);
  const fill = g.createRadialGradient(x, y, 0, x, y, r);
  fill.addColorStop(0, col + '55'); fill.addColorStop(0.55, col + '22'); fill.addColorStop(0.9, col + '44'); fill.addColorStop(1, col + '00');
  g.globalAlpha = a; g.fillStyle = fill; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.lineWidth = 3.5; g.strokeStyle = col; g.shadowColor = col; g.shadowBlur = 22;
  g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.shadowBlur = 0;
  g.lineWidth = 1.3; g.strokeStyle = '#fff'; g.globalAlpha = a * 0.75; g.beginPath(); g.arc(x, y, Math.max(1, r - 3), 0, 7); g.stroke();
  const flare = Math.max(0, 1 - b.age / 0.5);
  const fr = r * (0.22 + 0.3 * flare), f2 = g.createRadialGradient(x, y, 0, x, y, fr);
  f2.addColorStop(0, '#fff'); f2.addColorStop(1, 'rgba(255,255,255,0)');
  g.globalAlpha = a * (0.55 + 0.45 * flare); g.fillStyle = f2; g.beginPath(); g.arc(x, y, fr, 0, 7); g.fill();
  if (b.seed) { g.globalAlpha = a; g.strokeStyle = '#fff'; g.lineWidth = 2; const c = Math.max(7, r * 0.1); g.beginPath(); g.moveTo(x - c, y); g.lineTo(x + c, y); g.moveTo(x, y - c); g.lineTo(x, y + c); g.stroke(); }
  g.globalAlpha = 1;
}
function drawScene(sim, t, orbAlpha, dt) {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.drawImage(backdrop, 0, 0, W, H);
  if (G.pulse > 0 && !REDUCED) { g.fillStyle = `rgba(190,255,245,${0.07 * G.pulse})`; g.fillRect(0, 0, W, H); }
  for (const s of snow) {
    const sp = REDUCED ? 0 : (0.004 + s.L * 0.004);
    const yy = ((s.y - t * sp) % 1 + 1) % 1, xx = s.x + (REDUCED ? 0 : Math.sin(t * 0.3 + s.p) * 0.01);
    g.fillStyle = `rgba(170,255,240,${s.a})`; g.beginPath(); g.arc(xx * W, yy * H, s.s, 0, 7); g.fill();
  }
  g.globalCompositeOperation = 'lighter';
  if (sim) {
    for (const o of sim.orbs) drawOrb(o, t, orbAlpha);
    for (const l of G.links) {
      const a = Math.max(0, 1 - l.age / 0.9);
      g.globalAlpha = a * 0.85; g.strokeStyle = l.col; g.lineWidth = 3;
      g.beginPath(); g.moveTo(px(l.x1), px(l.y1)); g.lineTo(px(l.x1) + (px(l.x2) - px(l.x1)) * Math.min(1, l.age / 0.12), px(l.y1) + (px(l.y2) - px(l.y1)) * Math.min(1, l.age / 0.12)); g.stroke();
    }
    g.globalAlpha = 1;
    for (const b of sim.blooms) drawBloom(b);
  }
  for (const r of G.rings) {
    const k = r.life / r.max, e = 1 - (1 - k) ** 3, rr = px(r.R) * e + 2;
    g.globalAlpha = (1 - k) * (r.flash ? 0.9 : 0.75); g.strokeStyle = r.col; g.lineWidth = r.flash ? 5 : 3 * (1 - k) + 1;
    g.beginPath(); g.arc(px(r.x), px(r.y), rr, 0, 7); g.stroke();
    if (r.flash) { g.fillStyle = '#fff'; g.globalAlpha = (1 - k) * 0.6; g.beginPath(); g.arc(px(r.x), px(r.y), rr * 0.7, 0, 7); g.fill(); }
  }
  for (const p of G.parts) {
    const k = p.life / p.max; g.globalAlpha = (1 - k) * 0.9; g.fillStyle = p.col;
    g.beginPath(); g.arc(px(p.x + p.vx * p.life), px(p.y + p.vy * p.life), 2.2 * (1 - k) + 0.6, 0, 7); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  for (const t of G.tags) {
    const k = t.life / t.max, e = 1 - (1 - Math.min(1, k * 2)) ** 2;
    g.globalAlpha = k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4;
    g.font = `800 ${Math.round(18 + Math.min(t.k, 20) * 0.5)}px ${getComputedStyle(document.body).fontFamily}`;
    g.textAlign = 'center'; g.fillStyle = '#fff'; g.shadowColor = t.col; g.shadowBlur = 12;
    g.fillText(t.k, px(t.x), px(t.y) - 18 - e * 22);
  }
  g.shadowBlur = 0; g.globalAlpha = 1; g.globalCompositeOperation = 'lighter';
  // aim ghost: a mouse hovers it, a finger drags it; the pearls it would reach swell
  if (G.screen === 'play' && G.phase === 'aim' && G.cursor && sim) {
    const cx = G.cursor.x, cy = G.cursor.y, R = px(T.KINDS.spark.R), pu = REDUCED ? 1 : 0.5 + 0.5 * Math.sin(clock * 8);
    g.globalCompositeOperation = 'lighter';
    const gh = g.createRadialGradient(cx, cy, 0, cx, cy, R);
    gh.addColorStop(0, 'rgba(255,255,255,.10)'); gh.addColorStop(1, 'rgba(255,255,255,.02)');
    g.fillStyle = gh; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3; g.shadowColor = '#fff'; g.shadowBlur = 12;
    g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke(); g.shadowBlur = 0;
    g.lineWidth = 2; g.beginPath(); g.moveTo(cx - 9, cy); g.lineTo(cx + 9, cy); g.moveTo(cx, cy - 9); g.lineTo(cx, cy + 9); g.stroke();
    for (const o of sim.orbs) if (Math.hypot(px(o.x) - cx, px(o.y) - cy) <= R + px(o.r)) {
      g.strokeStyle = `rgba(255,255,255,${0.5 + 0.4 * pu})`; g.lineWidth = 2.5;
      g.beginPath(); g.arc(px(o.x), px(o.y), px(o.r) * (1.9 + 0.2 * pu), 0, 7); g.stroke();
    }
  }
  // first-time hint
  if (G.screen === 'play' && G.phase === 'aim' && !save.seen && G.run.level === 1 && G.lv) {
    const h = G.lv.hint, k = REDUCED ? 1 : 0.5 + 0.5 * Math.sin(t * 3);
    g.globalCompositeOperation = 'source-over';
    g.strokeStyle = `rgba(255,255,255,${0.35 + 0.4 * k})`; g.lineWidth = 2.5; g.setLineDash([6, 8]);
    g.beginPath(); g.arc(px(h.x), px(h.y), px(T.KINDS.spark.R) * (REDUCED ? 1 : 0.94 + 0.06 * k), 0, 7); g.stroke(); g.setLineDash([]);
  }
}

/* ---------- loop ---------- */
let last = 0, acc = 0, clock = 0;
function frame(ts) {
  const dt = Math.min(0.1, last ? (ts - last) / 1000 : 0.016); last = ts; clock += dt;
  for (const p of G.parts) p.life += dt;
  G.parts = G.parts.filter(p => p.life < p.max);
  for (const t of G.tags) t.life += dt;
  G.tags = G.tags.filter(t => t.life < t.max);
  for (const r of G.rings) r.life += dt;
  G.rings = G.rings.filter(r => r.life < r.max);
  G.pulse = Math.max(0, G.pulse - dt * 2.2);
  if (G.screen === 'play' && G.phase === 'burst' && !G.dud && G.sim && G.t - G.tapT > 0.5 && G.sim.caught === 0) {
    G.dud = true; sfx('fail');
    for (let i = 0; i < 10; i++) { const a = Math.random() * 6.283, sp = 0.03 + Math.random() * 0.06; G.parts.push({x: G.seedPos.x, y: G.seedPos.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 0.04, life: 0, max: 0.7 + Math.random() * 0.5, col: '#7f9a9a'}); }
  }
  for (const l of G.links) l.age += dt;
  G.links = G.links.filter(l => l.age < 0.95);
  if (G.screen === 'home' && G.attract) {
    acc += dt;
    while (acc >= T.DT) { attractTick(T.DT); acc -= T.DT; }
    drawScene(G.attract.sim, clock, 0.75);
  } else if (G.screen === 'play' && G.sim) {
    G.t += dt;
    if (G.phase !== 'result') {
      acc += dt;
      while (acc >= T.DT) { T.step(G.sim, G.lv.spec.goal); acc -= T.DT; if (G.sim.events.length) handleEvents(); }
    }
    if (G.phase === 'settle' && G.t >= G.resultAt) finishLevel();
    drawScene(G.sim, clock, Math.min(1, G.t / 0.5));
  } else drawScene(null, clock, 1);
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
let down = false;
const TOUCH_LIFT = 84; // a finger hides what it aims at, so the ring floats above it
const aimAt = e => { const t = e.pointerType !== 'mouse'; G.cursor = {x: e.clientX, y: Math.max(field.top * U, e.clientY - (t ? TOUCH_LIFT : 0)), touch: t}; };
cv.addEventListener('pointerdown', e => { if (G.phase !== 'aim') return; down = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {} aimAt(e); });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || down) aimAt(e); });
cv.addEventListener('pointerup', e => { if (!down) return; down = false; aimAt(e); const c = G.cursor; doTap(c.x, c.y); if (e.pointerType !== 'mouse') G.cursor = null; });
cv.addEventListener('pointercancel', () => { down = false; G.cursor = null; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') G.cursor = null; });
$('bDaily').addEventListener('click', () => startRun('daily'));
$('bFree').addEventListener('click', () => startRun('free'));
$('bHome').addEventListener('click', () => { sfx('ui'); goHome(); });
const bs = $('bSound');
function paintSound() { bs.setAttribute('aria-pressed', String(muted)); bs.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); bs.style.opacity = muted ? 0.45 : ''; bs.querySelector('.w').style.display = muted ? 'none' : ''; }
bs.addEventListener('click', () => { muted = !muted; try { localStorage.setItem('glowtide.mute', muted ? '1' : '0'); } catch (e) {} paintSound(); if (!muted) { audio(); sfx('ui'); } });
paintSound();
addEventListener('resize', resize);
document.addEventListener('contextmenu', e => e.preventDefault());

resize();
const qs = new URLSearchParams(location.search);
refreshHome();
if (qs.get('seed')) { G.screen = 'home'; startAttract(); startRun('free', qs.get('seed').slice(0, 40)); }
else startAttract();
window.__tide = {G, T, doTap, finishLevel, beginLevel};
requestAnimationFrame(frame);
})();
</script>
