<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Moonhop — bounce from the rooftops to the moon</title>
<meta name="description" content="Moonhop: an endless bouncing climber. Steer a little moonling from dusk rooftops up through the clouds, the aurora and the stars to the moon it fell from. Drifting, bursting and ghost clouds, springs, balloon rides and glooms to stomp or shoot. Plays with one thumb.">
<link rel="canonical" href="https://www.gptgames.dev/games/jump.html">
<meta name="theme-color" content="#3B3486">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B1B45;--cream:#FFF7EC;--lemon:#FFE070;--coral:#FF7A8A;--colw:400px;--ease:cubic-bezier(.2,.9,.25,1.15)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#1D2060;font-family:Fredoka,system-ui,sans-serif;color:var(--cream);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}
.col{position:fixed;top:0;bottom:0;left:50%;width:var(--colw);transform:translateX(-50%);pointer-events:none}
/* HUD */
.scrim{position:absolute;left:0;right:0;top:0;height:92px;background:linear-gradient(rgba(14,8,40,.42),rgba(14,8,40,0));opacity:0;transition:opacity .4s}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 14px 0;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .45s var(--ease)}
.alt{font-weight:700;font-size:calc(36px * var(--hs,1));line-height:1;text-shadow:0 2px 0 rgba(43,27,69,.5);font-variant-numeric:tabular-nums}
.alt small{font-size:18px;font-weight:600;opacity:.75;margin-left:3px}
.round{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,247,236,.16);display:grid;place-items:center;padding:0}
.round:active{transform:scale(.92)}
.pause i{display:block;width:4px;height:13px;background:var(--cream);border-radius:2px;box-shadow:7px 0 0 var(--cream);margin-left:-7px}
body[data-mode=play] .hud,body[data-mode=play] .scrim,body[data-mode=paused] .hud{opacity:1;transform:none}
body[data-mode=paused] .hud .pause{visibility:hidden}
/* banner */
.banner{position:absolute;left:0;right:0;top:calc(max(12px,env(safe-area-inset-top)) + 46px * var(--hs,1));text-align:left;padding-left:16px;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--lemon);text-shadow:0 2px 0 rgba(43,27,69,.6);opacity:0}
.banner.show{animation:ban 2.2s ease-out}
@keyframes ban{0%{opacity:0;transform:translateY(10px) scale(.96)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
/* title */
.title{position:absolute;left:0;right:0;top:15%;text-align:center;transition:opacity .4s,transform .6s var(--ease)}
.logo{margin:0;font-weight:700;font-size:min(64px,16vw);letter-spacing:1px;line-height:1;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 10px 22px rgba(43,27,69,.35)}
.logo b{color:var(--lemon)}
.tbest{display:inline-block;margin-top:14px;padding:6px 16px;border-radius:99px;background:rgba(43,27,69,.55);font-weight:600;font-size:18px}
.tsnd{position:absolute;right:14px;top:max(12px,env(safe-area-inset-top));pointer-events:auto;transition:opacity .3s}
body:not([data-mode=title]):not([data-mode=ready]) .title{opacity:0;transform:translateY(-40px);pointer-events:none}
body[data-mode=ready] .title .logo,body[data-mode=ready] .title .tbest{opacity:0}
body:not([data-mode=title]):not([data-mode=ready]) .tsnd{opacity:0;pointer-events:none}
/* sound icon */
.snd svg{width:20px;height:20px}
.snd[data-on="0"] .wave{display:none}
.snd[data-on="1"] .x{display:none}
/* cards */
.veil{position:fixed;inset:0;background:rgba(14,8,40,.5);opacity:0;pointer-events:none;transition:opacity .3s}
body[data-mode=paused] .veil,body[data-mode=results] .veil{opacity:1}
.card{position:absolute;left:16px;right:16px;bottom:max(24px,env(safe-area-inset-bottom));margin:0 auto;max-width:360px;padding:22px 20px 18px;border-radius:26px;background:#FFF7EC;color:var(--ink);text-align:center;box-shadow:0 0 0 3px var(--ink),0 10px 0 var(--ink),0 24px 40px rgba(10,5,30,.4);transform:translateY(130%);transition:transform .5s var(--ease);pointer-events:auto}
body[data-mode=results] #results,body[data-mode=paused] #pausecard{transform:none}
.card h2{margin:0;font-size:20px;font-weight:600;letter-spacing:.5px;color:#6E5DB4}
.big{font-weight:700;font-size:64px;line-height:1.05;margin:4px 0 0;font-variant-numeric:tabular-nums}
.big small{font-size:26px;margin-left:4px;color:#6E5DB4}
.band{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;background:#EDE5FF;font-weight:600;font-size:14px;color:#4A2F70}
.rbest{margin-top:10px;font-weight:600;font-size:16px;color:#6E5DB4}
#results.isbest .rbest{color:#fff;background:var(--coral);display:inline-block;padding:6px 18px;border-radius:99px;box-shadow:0 0 0 3px var(--ink),0 4px 0 var(--ink);font-size:20px;font-weight:700;animation:slam .5s cubic-bezier(.3,1.6,.5,1) .45s both}
@keyframes slam{0%{transform:scale(2.4) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:rotate(-3deg);opacity:1}}
.rstats{margin-top:8px;font-size:15px;color:#7A6A93;min-height:1em}
.row{display:flex;gap:10px;margin-top:16px;align-items:center}
.go{flex:1;border:0;border-radius:18px;padding:14px 10px;font-weight:700;font-size:21px;background:var(--lemon);color:var(--ink);box-shadow:0 0 0 3px var(--ink),0 5px 0 var(--ink);transition:transform .1s}
.go:active{transform:translateY(4px);box-shadow:0 0 0 3px var(--ink),0 1px 0 var(--ink)}
.go.alt2{background:#EDE5FF;font-size:17px}
.card .round{background:#EDE5FF;color:var(--ink);width:50px;height:50px;box-shadow:0 0 0 3px var(--ink)}
#journey{display:block;width:100%;height:60px;margin:4px 0 2px}
.cause{font-size:17px;font-weight:600;color:#7A6A93;margin:0 0 2px}
@media (prefers-reduced-motion: reduce){.card,.title,.hud{transition:opacity .2s}.banner.show{animation-duration:1.6s}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body data-mode="title">
<canvas id="c" aria-label="Moonhop: steer with arrow keys or drag; tap, click or press space to shoot"></canvas>
<div class="col">
  <div class="scrim"></div>
  <div class="hud"><div class="alt" id="alt" aria-live="off">0<small>m</small></div><button class="round pause" id="pausebtn" aria-label="Pause"><i></i></button></div>
  <div class="banner" id="banner" aria-live="polite"></div>
  <div class="title"><h1 class="logo">Moon<b>hop</b></h1><div class="tbest" id="t-best" hidden></div></div>
  <button class="round snd tsnd" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button>
</div>
<div class="veil"></div>
<div class="col">
  <section class="card" id="results" aria-label="Run over">
    <p class="cause" id="r-cause"></p>
    <canvas id="journey" width="640" height="120" aria-hidden="true"></canvas>
    <div class="big"><span id="r-m">0</span><small>m</small></div>
    <div class="band" id="r-band"></div>
    <div><div class="rbest" id="r-best"></div></div>
    <div class="rstats" id="r-stats"></div>
    <div class="row"><button class="go" id="again">Hop again</button><button class="round snd" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button></div>
  </section>
  <section class="card" id="pausecard" aria-label="Paused">
    <h2>Paused</h2>
    <div class="row"><button class="go" id="resume">Resume</button><button class="round snd" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button></div>
    <div class="row"><button class="go alt2" id="restart">Start over</button></div>
  </section>
</div>
<script id="core">
// Moonhop core: world, generation and rules. No DOM — test/jump.mjs runs this block in Node.
// World units, y up; 10 units = 1 m. The column is W wide and wraps.
var MH = (function () {
  'use strict';
  var W = 400;
  var T = {
    grav: 1850,        // u/s²
    bounce: 900,       // take-off speed off a ledge: 900²/(2·1850) ≈ 219 u high, ~0.97 s in the air
    spring: 1560,      // ≈ 658 u
    stomp: 1000,
    // two rides, as the old page had a propeller and a jetpack: balloons float you up ~120 m,
    // a comet (rarer, higher up) carries you ~275 m
    ride: { balloons: { v: 760, t: 1.6 }, comet: { v: 1250, t: 2.2 } },
    runV: 440, accel: 3400, // keyboard steering
    dragMax: 2200,     // u/s cap on finger-driven movement
    footHalf: 15,      // half-width of the feet for landing
    bodyR: 19,         // body radius for glooms, balloons
    seedV: 1500, seedLife: 0.75, shootGap: 0.2,
    maxGap: 172,       // hard cap between consecutive landable ledges (jump is 219)
  };
  // named for what the sky shows there (the palette and landmarks in the view are keyed to the same heights)
  var BANDS = [[0, 'Rooftops'], [120, 'Cloud Sea'], [380, 'Violet Hour'], [650, 'Aurora'], [1100, 'Starfield'], [2200, "Moon's Pull"], [3200, 'Beyond']];

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }
  function sm(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function wrapX(x) { return ((x % W) + W) % W; }
  function wrapD(a, b) { var d = wrapX(a - b); return d > W / 2 ? d - W : d; } // signed shortest a-b
  function bandAt(m) { var i = 0; while (i < BANDS.length - 1 && BANDS[i + 1][0] <= m) i++; return i; }

  function create(seed, opts) {
    opts = opts || {};
    var s = {
      seed: seed >>> 0, rnd: rng(seed), t: 0, VH: opts.VH || 720, nextId: 1,
      p: { x: W / 2, y: 0, vx: 0, vy: T.bounce, lift: 0, ride: null, dead: false, face: 1, lastLandY: 0, streak: 0, shootCd: 0, look: 0 },
      cam: -(opts.VH || 720) * 0.15, maxY: 0, over: false, idle: !!opts.idle,
      ledges: [], glooms: [], seeds: [], events: [],
      gen: { y: 0, lastX: W / 2, sinceSpring: 0, sinceBalloon: 0, sinceComet: 0, sinceGloom: 0, springs: 0, balloons: 0, comets: 0, glooms: 0, mains: 0 },
      stats: { land: {}, springs: 0, balloons: 0, comets: 0, stomps: 0, shots: 0, kills: 0, hits: 0, wisps: 0, blasts: 0 },
      band: 0, cause: null,
    };
    // the roof: full width, solid, at y = 0
    s.ledges.push({ id: s.nextId++, kind: 'roof', x: -W, w: 3 * W, y: 0, vx: 0, broken: false, item: null, main: true });
    generate(s);
    return s;
  }

  function addLedge(s, kind, x, y, w, extra) {
    var L = { id: s.nextId++, kind: kind, x: x, y: y, w: w, vx: 0, broken: false, brokeAt: 0, item: null, itemX: 0, main: false };
    for (var k in extra) L[k] = extra[k];
    s.ledges.push(L); return L;
  }
  function overlaps(s, x, y, w, pad) { // would a new ledge crowd an existing one?
    for (var i = s.ledges.length - 1; i >= 0; i--) {
      var L = s.ledges[i]; if (L.kind === 'roof') continue;
      if (Math.abs(L.y - y) > 34) { if (L.y < y - 40) break; continue; }
      var ca = L.x + L.w / 2, cb = x + w / 2;
      if (Math.abs(wrapD(ca, cb)) < (L.w + w) / 2 + pad) return true;
    }
    return false;
  }

  // Build the course upward until it is a screen and a half above the camera.
  // Every "main" ledge is landable and at most T.maxGap above the previous main: that chain is the
  // guarantee the course is always climbable. Everything else (extras, wisps, glooms) is decoration
  // or danger placed around the chain.
  function generate(s) {
    var g = s.gen, R = s.rnd, top = s.cam + s.VH * 1.6 + 300;
    while (g.y < top) {
      var y0 = g.y, m = y0 / 10;
      var gap = lerp(78, 162, sm(m / 2300)) * (0.8 + 0.25 * R());
      gap = Math.min(gap, T.maxGap);
      var y = y0 + gap;
      var mm = y / 10;
      var w = Math.round(lerp(96, 66, sm(mm / 2200)) + (R() - 0.5) * 12);
      // the chain is solid: plain or drifting clouds only. A puff in the chain would let a player who
      // used it and then missed fall back to a cloud from which nothing above is in reach.
      var kind = 'pad', r = R();
      var pDrift = mm < 90 ? 0 : Math.min(0.42, 0.12 + mm / 2400);
      if (mm >= 95 && !g.firstDrift) { kind = 'drift'; g.firstDrift = true; }
      else if (r < pDrift) kind = 'drift';
      // x: anywhere, but early on keep it within an easy reach of the last one
      var reach = lerp(130, W / 2, sm(mm / 300));
      var x = wrapX(g.lastX + (R() * 2 - 1) * reach) - w / 2;
      x = clamp(x, 4, W - w - 4);
      // the first ledges stay out of the lane straight above the start, so the first thing to do is steer
      if (y < 260 && Math.abs(x + w / 2 - W / 2) < w / 2 + 40) x = x + w / 2 < W / 2 ? W / 2 - w / 2 - 40 - w / 2 - R() * 60 : W / 2 + 40 + R() * 60;
      x = clamp(x, 4, W - w - 4);
      var extra = { main: true };
      if (kind === 'drift') {
        var sp = lerp(45, 135, sm(mm / 2400)) * (0.8 + 0.4 * R());
        extra.vx = R() < 0.5 ? -sp : sp;
      }
      var L = addLedge(s, kind, x, y, w, extra);
      g.mains++; g.sinceSpring += gap; g.sinceBalloon += gap; g.sinceComet += gap; g.sinceGloom += gap;
      // items on plain pads
      if (kind === 'pad') {
        var wantSpring = (g.springs === 0 && mm > 34) || (g.sinceSpring > 1100 && R() < lerp(0.08, 0.06, mm / 2000));
        var wantBalloon = mm > 170 && ((g.balloons === 0 && mm > 185) || (g.sinceBalloon > 2200 && R() < 0.04));
        var wantComet = mm > 450 && ((g.comets === 0 && mm > 480) || (g.sinceComet > 6000 && R() < 0.03));
        if (wantComet) { L.item = 'comet'; L.itemX = w / 2; g.sinceComet = 0; g.sinceBalloon = Math.min(g.sinceBalloon, 1200); g.comets++; }
        else if (wantBalloon) { L.item = 'balloons'; L.itemX = w / 2; g.sinceBalloon = 0; g.balloons++; }
        else if (wantSpring) { L.item = 'spring'; L.itemX = 14 + R() * (w - 28); g.sinceSpring = 0; g.springs++; }
      }
      // a gloom in this gap, well clear of the two mains around it, so it is something to steer round
      var pG = mm < 230 ? 0 : lerp(0.07, 0.17, sm((mm - 230) / 2000));
      if (gap > 70 && g.sinceGloom > lerp(1500, 750, sm((mm - 230) / 3000)) && (R() < pG || (g.glooms === 0 && mm > 235))) {
        var gy = y0 + gap * 0.5, gx = -1;
        for (var tries = 0; tries < 8 && gx < 0; tries++) {
          var cx = R() * W;
          if (Math.abs(wrapD(cx, g.lastX)) > 115 && Math.abs(wrapD(cx, x + w / 2)) > 115) gx = cx;
        }
        if (gx >= 0) {
          s.glooms.push({ id: s.nextId++, x: gx, x0: gx, y: gy, r: 26, alive: true, ph: R() * 6.28, sway: mm > 1000 ? 22 + R() * 26 : 0, diedAt: 0 });
          g.sinceGloom = 0; g.glooms++;
        }
      }
      // extras: more footholds low down, wisps (traps) higher up
      var pExtra = lerp(0.42, 0.3, sm(mm / 900)), wantPuff = mm >= 55 && !g.firstPuff;
      if (R() < pExtra || wantPuff) {
        var ey = y0 + gap * (0.35 + 0.3 * R()), ew = Math.round(lerp(90, 70, mm / 1500));
        var ex = clamp(wrapX(x + w / 2 + W / 2 + (R() - 0.5) * 140) - ew / 2, 4, W - ew - 4);
        var ek = wantPuff || (mm > 55 && R() < lerp(0.35, 0.65, sm(mm / 1500))) ? 'puff' : 'pad';
        if (!(ey < 260 && Math.abs(ex + ew / 2 - W / 2) < ew / 2 + 40) && !overlaps(s, ex, ey, ew, 10)) { addLedge(s, ek, ex, ey, ew, {}); if (ek === 'puff') g.firstPuff = true; }
      }
      var pWisp = mm < 150 ? 0 : lerp(0.25, 0.45, sm((mm - 150) / 1500));
      if (R() < pWisp || (mm > 160 && !g.firstWisp)) {
        var wy = y0 + gap * (0.3 + 0.4 * R()), ww = Math.round(lerp(88, 72, mm / 1500));
        var wx = clamp(R() * (W - ww), 4, W - ww - 4);
        if (!overlaps(s, wx, wy, ww, 6)) { addLedge(s, 'wisp', wx, wy, ww, {}); g.firstWisp = true; }
      }
      g.lastX = x + w / 2; g.y = y;
    }
  }

  function emit(s, type, data) { var e = data || {}; e.type = type; e.t = s.t; s.events.push(e); }

  // input: { move: -1..1, drag: units this frame (already scaled), shoot: bool }
  function step(s, dt, input) {
    input = input || {};
    var n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n, drag = input.drag || 0;
    for (var i = 0; i < n; i++) sub(s, h, input, drag / n, i === 0 && input.shoot);
    // camera: follow upward only
    var p = s.p;
    if (!p.dead && !s.idle) {
      var want = p.y - s.VH * 0.45;
      if (want > s.cam) s.cam += (want - s.cam) * Math.min(1, dt * 9);
    }
    s.maxY = Math.max(s.maxY, p.y);
    var b = bandAt(s.maxY / 10);
    if (b > s.band) { s.band = b; emit(s, 'band', { band: b, name: BANDS[b][1] }); }
    generate(s);
    // forget what has fallen far below
    var cut = s.cam - 260;
    if (s.ledges.length > 80 || (s.ledges[0] && s.ledges[0].y < cut)) s.ledges = s.ledges.filter(function (L) { return L.y > cut; });
    if (s.glooms.length && s.glooms[0].y < cut) s.glooms = s.glooms.filter(function (G) { return G.y > cut; });
    if (!s.over && p.y < s.cam - 60) { s.over = true; if (!s.cause) s.cause = 'fall'; emit(s, 'over', { cause: s.cause }); }
  }

  function sub(s, dt, input, drag, shoot) {
    var p = s.p; s.t += dt;
    // ledges move
    for (var i = 0; i < s.ledges.length; i++) {
      var L = s.ledges[i];
      if (L.vx) { L.x += L.vx * dt; if (L.x < 2) { L.x = 2; L.vx = -L.vx; } else if (L.x + L.w > W - 2) { L.x = W - 2 - L.w; L.vx = -L.vx; } }
    }
    for (i = 0; i < s.glooms.length; i++) { var G = s.glooms[i]; if (G.sway && G.alive) G.x = wrapX(G.x0 + Math.sin(s.t * 0.9 + G.ph) * G.sway); }
    // steering
    if (!p.dead) {
      var target = clamp(input.move || 0, -1, 1) * T.runV;
      if (input.move) p.vx += clamp(target - p.vx, -T.accel * dt, T.accel * dt);
      else p.vx += clamp(-p.vx, -T.accel * 1.3 * dt, T.accel * 1.3 * dt);
      var dd = clamp(drag, -T.dragMax * dt, T.dragMax * dt);
      p.x = wrapX(p.x + p.vx * dt + dd);
      var lk = input.move || (drag ? Math.sign(drag) : 0);
      if (lk) p.face = lk > 0 ? 1 : -1;
      p.look += ((input.move || clamp(drag / (dt * 600), -1, 1)) - p.look) * Math.min(1, dt * 10);
    } else p.x = wrapX(p.x + p.vx * dt);
    // vertical
    var prevY = p.y;
    if (p.lift > 0) {

    V.t += dt;
    if (dt > 0) tick(dt);
    render();
    requestAnimationFrame(frame);
  }
  function tick(dt) {
    let move = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), drag = 0, shoot = false;
    if (mode === 'play') { drag = dragAcc; shoot = shootReq; }
    else move = 0;
    dragAcc = 0; shootReq = false;
    // until the run starts, the moonling keeps to the roof: steering is off, ledges are out of reach
    MH.step(S, dt, { move, drag, shoot });
    handleEvents();
    updateFx(dt);
    if (mode === 'play') {
      const m = Math.floor(S.maxY / 10);
      $('alt').firstChild.nodeValue = m.toLocaleString();
      if (!crossedBest && runBest > 0 && m > runBest) { crossedBest = true; sfx('pass'); starFx(S.p.x, S.p.y + 20, 14); banner('Past your best!'); }
      const rocket = S.p.lift > 0 || S.p.vy > MH.T.bounce + 100;
      if (rocket && Math.random() < dt * (RM.matches ? 14 : 55)) fx.push({ k: 'trail', x: S.p.x + (Math.random() - 0.5) * 18, y: S.p.y + 4, t: 0, life: 0.55, s: 0.7 + Math.random() * 0.6 });
      // speed streaks: fixed in the world above the view, so the camera rushes past them
      if (rocket && !RM.matches) for (let q = 0; q < 2; q++) if (Math.random() < dt * 18) { const sd = Math.random() < 0.5 ? -1 : 1; fx.push({ k: 'streak', x: MH.wrapX(S.p.x + sd * (34 + Math.random() * 70)), y: S.p.y + 40 + Math.random() * 160, len: 26 + Math.random() * 40, t: 0, life: 0.45 }); }
    }
    if (overT >= 0) { overT += dt; if (overT > 0.7 && mode === 'play') showResults(); }
    blinkT -= dt; if (blinkT < -0.12) blinkT = 2 + Math.random() * 3;
    hint.t += dt;
  }

  // ---------- render ----------
  function render() {
    const d = V.dpr;
    V.cam = S.cam;
    let sx = 0, sy = 0;
    if (shake > 0 && !RM.matches) { sx = (Math.random() - 0.5) * 6 * shake; sy = (Math.random() - 0.5) * 6 * shake; }
    ctx.setTransform(d, 0, 0, d, 0, 0);
    V.still = RM.matches;
    drawSky(ctx, V);
    const colT = () => ctx.setTransform(d * V.scale, 0, 0, d * V.scale, d * (V.offX + sx), d * sy);
    colT();
    ctx.save(); ctx.beginPath(); ctx.rect(0, -20, W, V.VH + 40); ctx.clip();
    drawFar(ctx, V);
    drawRoof(ctx, V);
    if (save.best > 0 && (mode !== 'title')) drawBest(ctx, V, runBest * 10, runBest.toLocaleString());
    // ledges
    for (const L of S.ledges) {
      if (L.kind === 'roof') continue;
      const sy0 = V.VH - (L.y - V.cam); if (sy0 < -80 || sy0 > V.VH + 40) continue;
      const dip = dips.get(L.id), p = { x: L.x, y: L.y, w: L.w, kind: L.kind, seed: L.id, dip: dip ? dip.d : 0, dir: Math.sign(L.vx) || 1 };
      if (L.broken) {
        const k = Math.min(1, (S.t - L.brokeAt) / (L.kind === 'wisp' ? 0.45 : 0.3)); if (k >= 1) continue;
        drawBroken(ctx, V, p, k); continue;
      }
      if (mode === 'title' || mode === 'ready') p.alpha = 0.22 + 0.78 * Math.min(1, Math.max(0, (sy0 - V.VH * 0.5) / (V.VH * 0.2)));
      if (mode === 'play' && sy0 < 70 / V.scale) p.alpha = 0.5 + 0.5 * Math.max(0, sy0 / (70 / V.scale));
      drawLedge(ctx, V, p);
      if ((mode === 'title' || mode === 'ready') && sy0 < V.VH * 0.55) continue;
      if (L.item === 'spring') { const c = springComp.get(L.id); drawSpring(ctx, V, L.x + L.itemX, L.y - (dip ? dip.d : 0), c ? Math.max(-0.4, Math.min(1, c.d)) : 0); }
      if (L.item === 'balloons') drawBalloons(ctx, V, L.x + L.itemX, L.y + 58, V.t + L.id);
      if (L.item === 'comet') drawComet(ctx, V, L.x + L.itemX, L.y + 46, V.t + L.id);
    }
    // glooms
    for (const G of S.glooms) {
      const gy = V.VH - (G.y - V.cam); if (gy < -60 || gy > V.VH + 60) continue;
      if (G.alive) { const ddx = MH.wrapD(S.p.x, G.x), ddy = G.y - S.p.y - 20, dl = Math.hypot(ddx, ddy) || 1; G.lx = ddx / dl; G.ly = ddy / dl; drawGloom(ctx, V, G, RM.matches ? 0 : V.t); wrapCopy(G.x, 34, x => drawGloom(ctx, V, { x, y: G.y, r: G.r, lx: G.lx, ly: G.ly }, RM.matches ? 0 : V.t)); }
      else { const k = (S.t - G.diedAt) / 0.35; if (k < 1) drawGloomPop(ctx, V, G, k); }
    }
    for (const s of S.seeds) drawSeed(ctx, V, s);
    for (const b of flights) b.ride === 'comet' ? drawCometFree(ctx, V, b.x, b.y, b.t) : drawBalloonsFree(ctx, V, b.x, b.y, b.t);
    // effects behind the hero
    for (const f of fx) {
      const k = f.t / f.life;
      if (f.k === 'puff') { ctx.globalAlpha = (1 - k) * 0.9; ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, V.VH - (f.y - V.cam), f.r * (0.6 + k * 0.8), 0, 7); ctx.fill(); }
      else if (f.k === 'streak') { const sy = V.VH - (f.y - V.cam); const g = ctx.createLinearGradient(0, sy, 0, sy + f.len); g.addColorStop(0, 'rgba(255,247,236,0)'); g.addColorStop(1, 'rgba(255,247,236,' + (0.6 * Math.sin(Math.PI * Math.min(1, k * 1.4))) + ')'); ctx.fillStyle = g; ctx.fillRect(f.x - 1.25, sy, 2.5, f.len); }
      else if (f.k === 'trail') { ctx.globalAlpha = (1 - k) * 0.95; const ts = (f.s || 1) * (1 - k * 0.7); star(ctx, f.x, V.VH - (f.y - V.cam), 7 * ts, 3 * ts, '#FFF0A0', k * 3); }
    }
    ctx.globalAlpha = 1;
    drawHero();
    for (const f of fx) if (f.k === 'flash') { const k = f.t / f.life, sy = V.VH - (f.y - V.cam); const g = ctx.createRadialGradient(f.x, sy, 0, f.x, sy, f.r * (0.6 + k)); g.addColorStop(0, 'rgba(255,252,235,' + (0.95 * (1 - k)) + ')'); g.addColorStop(1, 'rgba(255,240,190,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, sy, f.r * (0.6 + k), 0, 7); ctx.fill(); }
    for (const f of fx) if (f.k === 'star') { ctx.globalAlpha = 1 - (f.t / f.life) ** 2; star(ctx, f.x, V.VH - (f.y - V.cam), f.r, f.r * 0.45, '#FFE28C', f.rot); }
    ctx.globalAlpha = 1;
    ctx.restore();
    // hint track on the roof before the run
    if (mode === 'title' || mode === 'ready') drawHint();
    // desktop margins: the sky continues, darkened, so the column reads as the stage
    if (V.offX > 0) {
      ctx.setTransform(d, 0, 0, d, 0, 0);
      for (const [a, b] of [[V.offX, 0], [V.w - V.offX, V.w]]) {
        const g = ctx.createLinearGradient(a, 0, b, 0); g.addColorStop(0, 'rgba(10,6,30,0.5)'); g.addColorStop(1, 'rgba(10,6,30,0.25)');
        ctx.fillStyle = g; ctx.fillRect(Math.min(a, b), 0, Math.abs(b - a), V.h);
      }
    }
    if (V.offX > 150 && mode !== 'title') drawAltimeter();
    // pointer ripples (screen space)
    ctx.setTransform(d, 0, 0, d, 0, 0);
    for (const f of fx) if (f.k === 'ripple') { const k = f.t / f.life; ctx.globalAlpha = (1 - k) * 0.5; ctx.strokeStyle = '#FFF7EC'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.sx, f.sy, 10 + k * 26, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  // desktop only: the margin beside the column becomes an altimeter from the roof to the moon
  function drawAltimeter() {
    const d = V.dpr; ctx.setTransform(d, 0, 0, d, 0, 0);
    const x = V.w - V.offX / 2 - 30, top = V.h * 0.14, bot = V.h * 0.88, H = bot - top;
    const MAXM = 3200, ym = m => bot - H * Math.sqrt(Math.min(1, m / MAXM));
    ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,247,236,0.18)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, bot); ctx.lineTo(x, top); ctx.stroke();
    const cur = S.maxY / 10;
    ctx.strokeStyle = 'rgba(255,224,112,0.75)'; ctx.beginPath(); ctx.moveTo(x, bot); ctx.lineTo(x, ym(cur)); ctx.stroke();
    ctx.font = '600 13px Fredoka, system-ui, sans-serif'; ctx.textBaseline = 'middle';
    for (const [m, name] of MH.BANDS) {
      const y = ym(m), on = cur >= m;
      ctx.fillStyle = on ? 'rgba(255,247,236,0.85)' : 'rgba(255,247,236,0.32)';
      ctx.beginPath(); ctx.arc(x, y, on ? 4 : 3, 0, 7); ctx.fill();
      ctx.fillText(name, x + 14, y);
    }
    if (runBest > 0) { const y = ym(runBest); ctx.strokeStyle = '#FF7A8A'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x + 8, y); ctx.stroke(); ctx.fillStyle = '#FF7A8A'; ctx.textAlign = 'right'; ctx.fillText('best', x - 14, y); ctx.textAlign = 'left'; }
    // you: a small moonling on the gauge
    const y = ym(cur); ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fillStyle = '#FFE070'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }
  function wrapCopy(x, r, fn) { if (x < r) fn(x + W); else if (x > W - r) fn(x - W); }
  function drawHero() {
    const p = S.p;
    const stretch = p.dead ? 0 : Math.max(-0.06, Math.min(0.26, p.vy / 5200));
    const sq = squash.d;
    const syv = 1 + stretch + sq, sxv = 1 / Math.sqrt(Math.max(0.4, syv));
    const h = {
      x: p.x, y: p.y, sx: sxv, sy: syv, look: Math.max(-1, Math.min(1, p.look)),
      face: p.dead ? 'daze' : p.vy < -1350 ? 'fear' : (S.seeds.length && S.seeds[S.seeds.length - 1].t < 0.25) || p.lift > 0 ? 'up' : 'norm',
      blink: blinkT < 0 && !p.dead, feet: sq < -0.05 ? 1 : p.vy > 200 ? -0.6 : 0, rot: p.dead ? V.t * 9 : 0,
    };
    if (mode === 'title' || mode === 'ready') { const hx = hintX(); h.look = Math.max(-1, Math.min(1, (hx - p.x) / 60)); }
    if (p.lift > 0 && p.ride === 'balloons') drawBalloonsHeld(ctx, V, p.x, p.y + 34, V.t);
    if (p.lift > 0 && p.ride === 'comet') drawCometHeld(ctx, V, p.x, p.y, V.t);
    drawHopper(ctx, V, h);
    wrapCopy(p.x, 22, x => drawHopper(ctx, V, Object.assign({}, h, { x })));
  }
  function hintX() { return 200 + Math.sin(hint.t * 2.2) * 60; }
  const COARSE = matchMedia('(pointer: coarse)');
  function drawHint() {
    const d = V.dpr; ctx.setTransform(d * V.scale, 0, 0, d * V.scale, d * V.offX, 0);
    const hy = V.VH - (0 - V.cam) + 56; if (hy > V.VH - 24) return;
    const a = Math.min(1, hint.t * 2), dx = hintX();
    ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (COARSE.matches) {
      // a track with a fingertip sliding along it: the moonling copies it with its eyes
      ctx.beginPath(); capsule(ctx, 110, hy - 6, 180, 12); ctx.fillStyle = 'rgba(255,247,236,0.3)'; ctx.fill();
      const gl = ctx.createRadialGradient(dx, hy, 2, dx, hy, 26); gl.addColorStop(0, 'rgba(255,240,180,0.9)'); gl.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(dx, hy, 26, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(dx, hy, 7, 0, 7); ctx.fillStyle = '#FFF7EC'; ctx.fill();
      // fingertip: a rounded finger coming up from below, pressing the dot
      ctx.save(); ctx.translate(dx + 4, hy + 4); ctx.rotate(-0.18);
      ctx.beginPath(); ctx.moveTo(-9, 44); ctx.lineTo(-9, 2); ctx.arc(0, 2, 9, Math.PI, 0); ctx.lineTo(9, 44); ctx.closePath();
      ctx.fillStyle = '#FFF7EC'; ctx.fill(); ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 1, 4.6, 5.6, 0, 0, 7); ctx.fillStyle = '#F4D9E4'; ctx.fill(); ctx.lineWidth = 1.4; ctx.stroke();
      ctx.restore();
      for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(200 + sd * 112, hy - 7); ctx.lineTo(200 + sd * 120, hy); ctx.lineTo(200 + sd * 112, hy + 7); ctx.strokeStyle = 'rgba(255,247,236,0.85)'; ctx.lineWidth = 3; ctx.stroke(); }
    } else {
      // keycaps: the one being "pressed" follows the swing
      const press = Math.cos(hint.t * 2.2);
      for (const sd of [-1, 1]) {
        const on = sd * press > 0.3, kx = 200 + sd * 34, ky = hy + (on ? 3 : 0);
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(kx - 22, hy - 18 + 5, 44, 40, 9) : ctx.rect(kx - 22, hy - 13, 44, 40); ctx.fillStyle = INK; ctx.fill();
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(kx - 22, ky - 18, 44, 40, 9) : ctx.rect(kx - 22, ky - 18, 44, 40); ctx.fillStyle = on ? '#FFE070' : '#FFF7EC'; ctx.fill(); ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(kx + sd * 7, ky - 8 + 10); ctx.lineTo(kx - sd * 7, ky + 2); ctx.lineTo(kx + sd * 7, ky + 12 - 0); ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---------- boot ----------
  resize();
  addEventListener('resize', resize);
  newRun();
  updateTitleBest(); syncSound(); setMode('title');
  document.fonts && document.fonts.ready.then(() => { cloudCache.clear(); });
  window.__moonhop = { get S() { return S; }, get mode() { return mode; }, start: () => startRun(), again, V, dbg };
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
<script src="../logo.js"></script>
</body>
