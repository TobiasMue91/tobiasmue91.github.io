<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vigil — Breakout in Stained Glass</title>
<meta name="description" content="Breakout in a cathedral window at night: aim the gilded bar, break through the stained glass and let the moonlight in. Twelve windows, three candles, one spark.">
<meta name="theme-color" content="#07080f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07080f; --gold:#e8c47a; --gold-hi:#fff0c4; --pale:#d9dff5; --dim:#c0c5da; --ink:#0b0c16;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--pale);-webkit-user-select:none;user-select:none;
  touch-action:none;-webkit-tap-highlight-color:transparent;cursor:default}
body.playing{cursor:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.sc{font-family:"Cormorant SC",Georgia,serif;font-weight:600;letter-spacing:.22em;text-transform:lowercase;color:var(--dim)}
.it{font-style:italic;color:var(--gold)}
/* HUD */
.hudbox{position:fixed;pointer-events:none;opacity:0;transition:opacity .6s ease}
.ready .hudbox{opacity:1}
.ready.carded .hudbox{opacity:.25}
#scoreBox .num{font-weight:500;color:#f3ead6;line-height:1;font-variant-numeric:lining-nums tabular-nums;
  text-shadow:0 0 28px rgba(232,196,122,.35)}
#scoreBox .best{font-style:italic;color:var(--dim);min-height:1.3em}
#whereBox .name{font-style:italic;color:var(--gold);line-height:1.05}
.wide #scoreBox{text-align:right}
.wide #scoreBox .lbl{font-size:18px}
.wide #scoreBox .num{font-size:64px;margin-top:4px}
.wide #scoreBox .best{font-size:20px;margin-top:6px}
.wide #whereBox .lbl{font-size:18px}
.wide #whereBox .name{font-size:38px;margin-top:4px}
.wide #whereBox .orn{display:none}
.narrow #scoreBox{text-align:right}
.narrow #scoreBox .lbl,.narrow #scoreBox .best{display:none}
.narrow #scoreBox .num{font-size:34px;margin-top:4px}
.narrow #whereBox .lbl{font-size:12px;letter-spacing:.2em}
.narrow #whereBox .name{font-size:25px}
.narrow #whereBox .orn{display:none}
#pauseBtn{position:fixed;width:44px;height:44px;border:1px solid rgba(232,196,122,.35);background:rgba(10,11,22,.35);color:var(--gold);cursor:pointer;opacity:0;
  transition:opacity .6s ease,border-color .2s;display:grid;place-items:center;border-radius:50%}
#pauseBtn:hover{border-color:var(--gold)}
.ready #pauseBtn{opacity:.8}
#pauseBtn:hover{opacity:1}
#pauseBtn:focus-visible,button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
#pauseBtn svg{width:14px;height:14px}
/* the nave: title, cards and captions sit over the dark lower half of the window */
#nave{position:fixed;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{position:absolute;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.panel.on{opacity:1;transform:none}
.panel.on.live{pointer-events:auto}
#title h1{font-weight:500;font-style:italic;color:var(--gold);font-size:calc(var(--k) * 64px);line-height:1;
  text-shadow:0 0 30px rgba(232,196,122,.45),0 2px 0 rgba(0,0,0,.6)}
#title .sub{margin-top:calc(var(--k) * 6px);font-size:calc(var(--k) * 13px)}
#title .hint{margin-top:calc(var(--k) * 26px);font-size:calc(var(--k) * 17px);font-style:italic;color:var(--pale);opacity:.85}
#title .tbest{margin-top:calc(var(--k) * 8px);font-size:calc(var(--k) * 16px);font-style:italic;color:var(--dim)}
#title .hint b{font-weight:600;color:var(--gold-hi);font-style:normal;font-family:"Cormorant SC",serif;letter-spacing:.12em}
.card{min-width:calc(var(--k) * 270px);max-width:calc(var(--k) * 340px);padding:calc(var(--k) * 26px) calc(var(--k) * 24px) calc(var(--k) * 22px);
  background:radial-gradient(ellipse at 50% 0,rgba(40,44,78,.92),rgba(10,11,22,.94) 70%);
  border:1px solid rgba(232,196,122,.38);border-radius:2px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 4px rgba(10,11,22,.9),inset 0 0 0 5px rgba(232,196,122,.14)}
.card .eyebrow{font-size:calc(var(--k) * 13px)}
.card .big{font-size:calc(var(--k) * 54px);font-weight:500;color:#f3ead6;line-height:1.05;margin-top:calc(var(--k) * 6px);
  font-variant-numeric:lining-nums;text-shadow:0 0 26px rgba(232,196,122,.3)}
.card .big.word{font-style:italic;color:var(--gold);font-size:calc(var(--k) * 40px)}
.card .line{font-style:italic;font-size:calc(var(--k) * 18px);color:var(--dim);margin-top:calc(var(--k) * 6px);min-height:1.2em}
.card .line.gold{color:var(--gold)}
.btns{display:flex;flex-direction:column;gap:calc(var(--k) * 8px);margin-top:calc(var(--k) * 20px);align-items:stretch}
.btns button{font:inherit;font-family:"Cormorant SC",serif;font-weight:600;letter-spacing:.16em;text-transform:lowercase;
  font-size:calc(var(--k) * 17px);min-height:44px;padding:8px 18px;border-radius:1px;cursor:pointer;
  color:var(--gold);background:transparent;border:1px solid rgba(232,196,122,.35);transition:background .2s,border-color .2s,color .2s,transform .1s}
.btns button:hover{border-color:var(--gold);background:rgba(232,196,122,.08)}
.btns button:active{transform:scale(.98)}
.btns button.primary{background:linear-gradient(#f3d58f,#c89a45);color:#1a1206;border-color:#f7e2ae;
  box-shadow:0 0 24px rgba(232,196,122,.3)}
.btns button.primary:hover{background:linear-gradient(#fbe2a6,#d6a852)}
.btns button[hidden]{display:none}
#caption .lbl{font-size:calc(var(--k) * 13px)}
#caption .name{display:block;font-style:italic;color:var(--gold);font-size:calc(var(--k) * 46px);line-height:1.1;text-shadow:0 0 26px rgba(232,196,122,.4)}
#caption .bonus{display:block;margin-top:calc(var(--k) * 4px);font-size:calc(var(--k) * 20px);color:#f3ead6;font-variant-numeric:lining-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
noscript{position:fixed;inset:0;display:grid;place-items:center;color:var(--gold);font-style:italic;font-size:22px}
</style>
</head>
<body>
<canvas id="scene" aria-label="Vigil: a stained-glass window at night. Move the bar to keep the spark alive and break the glass."></canvas>
<div id="scoreBox" class="hudbox"><div class="lbl sc">score</div><div class="num" id="score">0</div><div class="best" id="best"></div></div>
<div id="whereBox" class="hudbox"><div class="lbl sc" id="wnum">window i</div><div class="name" id="wname">Vigil</div><div class="orn"></div></div>
<button id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="4" y="3" width="2.4" height="12" rx="1" fill="currentColor"/><rect x="11.6" y="3" width="2.4" height="12" rx="1" fill="currentColor"/></svg></button>
<div id="nave">
  <div id="title" class="panel"><h1>Vigil</h1><p class="sub sc">a breakout in glass</p><p class="hint" id="hint"></p><p class="tbest" id="titleBest"></p></div>
  <div id="caption" class="panel" aria-hidden="true"><span class="lbl sc" id="capLbl"></span><span class="name" id="capName"></span><span class="bonus" id="capBonus"></span></div>
  <div id="card" class="panel card" role="dialog" aria-modal="false" aria-labelledby="cardEyebrow">
    <p class="eyebrow sc" id="cardEyebrow"></p><p class="big" id="cardBig"></p><p class="line" id="cardLine"></p>
    <div class="btns"><button class="primary" id="btnA"></button><button id="btnB"></button><button id="btnC"></button></div>
  </div>
</div>
<div class="sr" aria-live="polite" id="announce"></div>
<noscript>Vigil needs JavaScript to light its candles.</noscript>
<script id="core">
// Vigil - rules. DOM-free: the page draws and sounds whatever this reports, test/vigil.mjs plays it.
var VigilCore = (function () {
    'use strict';
    // The window, in field units. 0,0 is the top-left of the opening; the arch spans the top.
    var W = 400, H = 640, COLS = 10, CW = 40, CH = 18;
    var SPRING = 160, APEX = 10;           // arch springs from the jambs at SPRING, peaks at APEX
    var WALL_TOP = 176;                    // top of the first row of glass
    var PADDLE_Y = 590, PADDLE_H = 10, PADDLE_W = 70, BROAD_W = 106;
    var BALL_R = 6, STEP = 1 / 240, MAX_ANGLE = 62 * Math.PI / 180, MIN_RISE = Math.sin(20 * Math.PI / 180);
    var MAX_BALLS = 9, JEWEL_FALL = 130;
    // The arch head is two circular arcs, each centred on the far side, meeting in a shallow point.
    var ARC_D = 60, ARC_CY = ((200 + ARC_D) * (200 + ARC_D) + SPRING * SPRING - ARC_D * ARC_D - APEX * APEX) / (2 * (SPRING - APEX));
    var ARC_R = Math.sqrt(ARC_D * ARC_D + (APEX - ARC_CY) * (APEX - ARC_CY));
    var ARCS = [{x: 200 + ARC_D, y: ARC_CY}, {x: 200 - ARC_D, y: ARC_CY}];
    function archY(x) {                    // underside of the arch at x (for drawing and tests)
        var c = x <= 200 ? ARCS[0] : ARCS[1], dx = x - c.x;
        return Math.max(APEX, c.y - Math.sqrt(Math.max(0, ARC_R * ARC_R - dx * dx)));
    }

    // The windows run through one night, from Vespers at dusk to Prime at sunrise.
    // Glass: lower case breaks at once, upper case is flashed glass (two blows), o is a rondel
    // (three), * a lantern (one, and drops a jewel), # the lead and stone tracery (never breaks).
    var HUES = {r: 'ruby', a: 'amber', g: 'emerald', b: 'sapphire', v: 'violet', w: 'opal'};
    var WINDOWS = [
        {name: 'Vespers', top: 176, rows: [
            '...bbbb...',
            '..bbwwbb..',
            '.vbwaawbv.',
            'vvbwaawbvv',
            'v*bbwwbb*v',
            'gggrwwrggg']},
        {name: 'Compline', top: 150, rows: [
            '.VVVVVVVV.',
            'vvbvvvvbvv',
            'vbwbvvbwbv',
            'vvbvvvvbvv',
            'v*vvvvvv*v',
            'BBBBBBBBBB',
            'bbbbbbbbbb']},
        {name: 'Rose', top: 112, rows: [
            '...vvvv...',
            '.vvbbbbvv.',
            '.vbrRRrbv.',
            'vbrRooRrbv',
            'vbrRooRrbv',
            'vvbrRRrbvv',
            '.vvb**bvv.',
            '...vvvv...']},
        {name: 'Lancet', top: 176, rows: [
            'bbbb##bbbb',
            'bwwb##bwwb',
            'bwwb##bwwb',
            'bAgb##bgAb',
            'gggg##gggg',
            'g*gg##gg*g',
            'vvvv##vvvv']},
        {name: 'Quatrefoil', top: 146, rows: [
            '.g.gggg.g.',
            'g.GaaaaG.g',
            '.GarrrraG.',
            'gar*oo*rag',
            'garwoowrag',
            '.GarrrraG.',
            'g.GaaaaG.g',
            'gg.gggg.gg']},
        {name: 'Cloister', top: 176, rows: [
            'rrr#aa#rrr',
            'rRr#aa#rRr',
            'rrr#**#rrr',
            '####..####',
            'bbb#gg#bbb',
            'bBb#gg#bBb',
            'bbb#gg#bbb']},
        {name: 'Martyr', top: 196, rows: [
            'rrrrrrrrrr',
            'rRRRrrRRRr',
            'rRoRr*RoRr',
            'rRRRrrRRRr',
            'aaaaaaaaaa',
            'a.a.aa.a.a']},
        {name: 'Tracery', top: 176, rows: [
            'w#wwwwww#w',
            'wwwwwwwwww',
            '#bb#bb#bb#',
            'bBbbBBbbBb',
            'g#g*gg*g#g',
            'gggggggggg']},
        {name: 'Nocturne', top: 128, rows: [
            '.bbbbbbbb.',
            '.vvvvvvvv.',
            'bv*wwww*vb',
            'bvwoooowvb',
            'bvvvvvvvvb',
            'bbbbbbbbbb',
            'BBBBBBBBBB']},
        {name: 'Clerestory', top: 118, rows: [
            '.aaaaaaaa.',
            '.AAAAAAAA.',
            '.rrrrrrrr.',
            'r#r#rr#r#r',
            'gggggggggg',
            'g*gggggg*g',
            'GGGGGGGGGG',
            'bbbbbbbbbb',
            'b#b#bb#b#b',
            'vvvvvvvvvv']},
        {name: 'Lauds', top: 186, rows: [
            '..vvvvvv..',
            '.vbbbbbbv.',
            'vbbbaabbbv',
            'bba*AA*abb',
            'raaaAAaaar',
            'rRrRaaRrRr',
            'gggggggggg']},
        {name: 'Prime', top: 100, rows: [
            '..aaaaaa..',
            '.aAwwwwAa.',
            '.AwoooowA.',
            '.rr*rr*rr.',
            'RrRrRRrRrR',
            '.vvvvvvvv.',
            'vVvVvVvVvV',
            '##bb##bb##',
            'bbbbbbbbbb']}
    ];
    var BASE = {glass: 10, flashed: 25, rondel: 50, lantern: 30};

    function rng(seed) {
        var s = seed >>> 0;
        return function () {
            s = s + 0x6D2B79F5 | 0;
            var t = Math.imul(s ^ s >>> 15, 1 | s);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function parse(win) {
        var out = [];
        win.rows.forEach(function (row, r) {
            for (var c = 0; c < COLS; c++) {
                var ch = row[c] || '.';
                if (ch === '.') continue;
                var b = {c: c, r: r, x: c * CW, y: (win.top || WALL_TOP) + r * CH, w: CW, h: CH, id: r * COLS + c, ch: ch};
                if (ch === '#') { b.kind = 'lead'; b.hp = b.max = Infinity; b.hue = 'lead'; }
                else if (ch === 'o') { b.kind = 'rondel'; b.hp = b.max = 3; b.hue = 'opal'; }
                else if (ch === '*') { b.kind = 'lantern'; b.hp = b.max = 1; b.hue = 'lantern'; }
                else if (ch === ch.toUpperCase()) { b.kind = 'flashed'; b.hp = b.max = 2; b.hue = HUES[ch.toLowerCase()]; }
                else { b.kind = 'glass'; b.hp = b.max = 1; b.hue = HUES[ch]; }
                out.push(b);
            }
        });
        return out;
    }

    function create(opts) {
        opts = opts || {};
        var s = {
            seed: opts.seed == null ? (Date.now() & 0xffffffff) : opts.seed,
            level: 0, score: 0, lives: opts.lives || 3, mode: 'serve', t: 0,
            balls: [], jewels: [], bricks: [], grid: [],
            paddle: {x: W / 2, w: PADDLE_W, target: PADDLE_W},
            combo: 0, hits: 0, through: false, broadT: 0, hushT: 0, hush: 1,
            sinceBreak: 0, aim: 0, stats: {breaks: 0, lost: 0, caught: 0}
        };
        s.rand = rng(s.seed);
        start(s, opts.level || 0);
        if (opts.score) s.score = opts.score;
        return s;
    }

    function start(s, level) {
        s.level = level;
        var win = WINDOWS[level % WINDOWS.length];
        s.top = win.top || WALL_TOP;
        s.bricks = parse(win);
        s.bricks.forEach(function (b) {
            if (b.kind !== 'lantern') return;
            var roll = s.rand();
            b.gem = roll < 0.4 ? 'split' : roll < 0.75 ? 'broad' : 'hush';
        });
        s.grid = [];
        s.bricks.forEach(function (b) { s.grid[b.id] = b; });
        s.jewels = [];
        s.remaining = s.bricks.filter(function (b) { return b.kind !== 'lead'; }).length;
        serve(s);
    }

    function serve(s) {
        s.mode = s.lives > 0 ? 'serve' : 'over';
        s.balls = [];
        s.combo = 0; s.hits = 0; s.through = false; s.broadT = 0; s.hushT = 0; s.hush = 1;
        s.paddle.target = PADDLE_W;
        s.serveT = 0;
    }

    // Speed in field units per second: the window, the round, and the classic steps up -
    // after the fourth and twelfth pane of a life, and the first time a spark gets behind the glass.
    function speed(s) {
        var lvl = s.level % WINDOWS.length, cycle = Math.floor(s.level / WINDOWS.length);
        var base = Math.min(300 + 12 * lvl, 440) * Math.pow(1.08, cycle);
        var tier = 1 + (s.hits >= 4 ? 0.07 : 0) + (s.hits >= 12 ? 0.07 : 0) + (s.through ? 0.08 : 0);
        return base * tier * s.hush;
    }

    function aimAngle(s) { return Math.sin(s.serveT * 1.7) * 0.6; }

    function launch(s) {
        if (s.mode !== 'serve') return false;
        var a = aimAngle(s), v = speed(s);
        s.balls.push({x: s.paddle.x, y: PADDLE_Y - BALL_R, vx: Math.sin(a) * v, vy: -Math.cos(a) * v, behind: false, id: 1});
        s.mode = 'play';
        s.sinceBreak = 0;
        return true;
    }

    function setPaddle(s, x) {
        var half = s.paddle.w / 2;
        s.paddle.x = Math.max(half, Math.min(W - half, x));
    }

    // Keep every spark at its current speed and away from the flat angles that make a rally endless.
    function normalise(s, b) {
        var v = speed(s), m = Math.hypot(b.vx, b.vy) || 1;
        b.vx = b.vx / m * v; b.vy = b.vy / m * v;
        if (Math.abs(b.vy) < v * MIN_RISE) {
            var sy = b.vy < 0 ? -1 : 1, sx = b.vx < 0 ? -1 : 1;
            b.vy = sy * v * MIN_RISE; b.vx = sx * v * Math.cos(Math.asin(MIN_RISE));
        }
    }

    function nudge(s, b, amt) {             // a hair of spin on stone and lead, so no loop repeats
        var a = (s.rand() - 0.5) * amt, c = Math.cos(a), si = Math.sin(a);
        var vx = b.vx * c - b.vy * si; b.vy = b.vx * si + b.vy * c; b.vx = vx;
    }

    function topOfGlass(s) {
        for (var i = 0; i < s.bricks.length; i++) if (s.bricks[i].hp > 0 && s.bricks[i].kind !== 'lead') return s.bricks[i].y;
        return s.top;
    }

    // The nearest pane the spark could reach in a straight line - lead in the way rules it out.
    function nearest(s, b) {
        var best = null, bd = 1e18;
        for (var i = 0; i < s.bricks.length; i++) {
            var br = s.bricks[i];
            if (br.hp <= 0 || br.kind === 'lead') continue;
            var tx = br.x + br.w / 2, ty = br.y + br.h / 2, dx = tx - b.x, dy = ty - b.y, d = dx * dx + dy * dy;
            if (d >= bd || blocked(s, b.x, b.y, tx, ty)) continue;
            bd = d; best = br;
        }
        return best || waypoint(s, b);
    }

    // No pane in sight: find the way to one through the open cells (over the top of the glass if
    // need be) and head for the farthest point on that way the spark can already see.
    function waypoint(s, b) {
        var rows = 0, R0 = -6;
        s.bricks.forEach(function (br) { rows = Math.max(rows, br.r + 1); });
        var R1 = rows + 6, NR = R1 - R0, dist = new Array(NR * COLS), q = [];
        function cx(c) { return c * CW + CW / 2; }
        function cy(r) { return s.top + r * CH + CH / 2; }
        function open(r, c) {
            if (c < 0 || c >= COLS || r < R0 || r >= R1) return false;
            if (r >= 0 && r < rows) { var br = s.grid[r * COLS + c]; if (br && br.hp > 0) return false; }
            return cy(r) > archY(cx(c)) + 8;
        }
        for (var r = R0; r < R1; r++) for (var c = 0; c < COLS; c++) {
            if (!open(r, c)) continue;
            var goal = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(function (d) {
                var rr = r + d[0], cc = c + d[1]; if (rr < 0 || rr >= rows || cc < 0 || cc >= COLS) return false;
                var br = s.grid[rr * COLS + cc]; return br && br.hp > 0 && br.kind !== 'lead';
            });
            if (goal) { dist[(r - R0) * COLS + c] = 0; q.push([r, c]); }
        }
        for (var h = 0; h < q.length; h++) {
            var cur = q[h], dc = dist[(cur[0] - R0) * COLS + cur[1]];
            [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
                var rr = cur[0] + d[0], cc = cur[1] + d[1];
                if (!open(rr, cc) || dist[(rr - R0) * COLS + cc] !== undefined) return;
                dist[(rr - R0) * COLS + cc] = dc + 1; q.push([rr, cc]);
            });
        }
        var br0 = Math.max(R0, Math.min(R1 - 1, Math.floor((b.y - s.top) / CH))), bc = Math.max(0, Math.min(COLS - 1, Math.floor(b.x / CW)));
        if (dist[(br0 - R0) * COLS + bc] === undefined) return null;
        var pr = br0, pc = bc, best = null;
        for (var step = 0; step < 60; step++) {
            var here = dist[(pr - R0) * COLS + pc];
            if (here === 0) break;
            var nxt = null;
            [[-1, 0], [0, -1], [0, 1], [1, 0]].forEach(function (d) {
                var rr = pr + d[0], cc = pc + d[1], v = rr >= R0 && rr < R1 && cc >= 0 && cc < COLS ? dist[(rr - R0) * COLS + cc] : undefined;
                if (v !== undefined && v < here && !nxt) nxt = [rr, cc];
            });
            if (!nxt) break;
            pr = nxt[0]; pc = nxt[1];
            if (!blocked(s, b.x, b.y, cx(pc), cy(pr))) best = {x: cx(pc) - CW / 2, y: cy(pr) - CH / 2, w: CW, h: CH, hp: 1};
        }
        return best;
    }

function paintMotif(g, hue, R, hh) {

}
function paintLantern(g, R, kind) {

function paintRondel(g, b, R) {

        g.beginPath(); g.ellipse(cx, cy, k * 3.7, k * 1.75, 0, 0, 7); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.ellipse(cx - 1, cy - 0.8, 1.6, 1, 0, 0, 7); g.fill();

function stoneEdges(g, bricks) {
    var at = {};

    bricks.forEach(function (b) {
        if (!at[b.r * 10 + b.c]) return;
        var up = at[(b.r - 1) * 10 + b.c], dn = at[(b.r + 1) * 10 + b.c], lf = b.c > 0 && at[b.r * 10 + b.c - 1], rt = b.c < 9 && at[b.r * 10 + b.c + 1];

        if (!lf) g.fillRect(x, y, 1.4, CH);
        g.fillStyle = 'rgba(0,0,0,0.55)';
        if (!dn) g.fillRect(x, y + CH - 1.8, CW, 1.8);

// ---------------------------------------------------------------- the pictures
// Each window is one picture laid over its panes: shapes of coloured glass with lead along their
// contours, as a glazier would cut them. A pane that breaks takes its piece of the picture with it.
var RH = CH;                                     // row height; each window sets its own top
