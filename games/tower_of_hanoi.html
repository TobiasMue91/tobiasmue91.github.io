<script id="core">
// Rules of the Tower of Hanoi. Discs are 1 (smallest) .. n; a peg is a list from bottom to top.
// A state is {n, pegs:[[],[],[]]}; the goal is the right-hand peg (index 2). Nothing here touches the DOM.
const HANOI = (() => {
  const GOAL = 2, FIRST = 3, LAST = 8;
  const par = n => 2 ** n - 1;
  const fresh = n => ({n, pegs: [Array.from({length: n}, (_, i) => n - i), [], []]});
  const clone = s => ({n: s.n, pegs: s.pegs.map(p => p.slice())});
  const top = (s, p) => s.pegs[p][s.pegs[p].length - 1];
  const canMove = (s, from, to) =>
    from !== to && from >= 0 && from < 3 && to >= 0 && to < 3 && s.pegs[from].length > 0 &&
    (s.pegs[to].length === 0 || top(s, to) > top(s, from));
  // Returns {ok, disc, state} without touching the input.
  const move = (s, from, to) => {
    if (!canMove(s, from, to)) return {ok: false, disc: 0, state: s};
    const t = clone(s), d = t.pegs[from].pop();
    t.pegs[to].push(d);
    return {ok: true, disc: d, state: t};
  };
  const solved = s => s.pegs[GOAL].length === s.n;
  const replay = (n, hist) => {
    let s = fresh(n);
    for (const [f, t] of hist) { const r = move(s, f, t); if (!r.ok) return null; s = r.state; }
    return s;
  };
  // The fewest moves that carry every disc to the goal peg from ANY legal state, as [[from,to],...].
  // The largest disc not yet home forces everything smaller onto the spare peg, crosses, and the
  // small tower rebuilds on top of it; discs already in place cost nothing.
  const plan = s => {
    const where = new Array(s.n + 1), out = [];
    s.pegs.forEach((p, i) => p.forEach(d => { where[d] = i; }));
    const go = (k, target) => {
      if (k === 0) return;
      if (where[k] === target) return go(k - 1, target);
      const other = 3 - where[k] - target;
      go(k - 1, other);
      out.push([where[k], target]); where[k] = target;
      go(k - 1, target);
    };
    go(s.n, GOAL);
    return out;
  };
  const hint = s => { const p = plan(s); return p.length ? p[0] : null; };
  const medal = (n, moves) => moves <= par(n) ? 'gold' : moves <= Math.ceil(par(n) * 1.5) ? 'silver' : 'bronze';
  const histToStr = h => h.map(([f, t]) => f + '' + t).join('');
  const strToHist = str => {
    if (typeof str !== 'string' || str.length % 2 || /[^012]/.test(str)) return null;
    const h = []; for (let i = 0; i < str.length; i += 2) h.push([+str[i], +str[i + 1]]);
    return h;
  };
  // Which note a disc strikes: the largest is always the lowest. Steps along a pentatonic ladder.
  const LADDER = [0, 2, 4, 7, 9, 12, 14, 16, 19];
  const semitone = (n, d) => LADDER[n - d];
  return {GOAL, FIRST, LAST, par, fresh, clone, top, canMove, move, solved, replay, plan, hint, medal,
    histToStr, strToHist, semitone};
})();
</script>
<script>
(() => {
const H = HANOI, $ = id => document.getElementById(id);
const stage = $('stage'), board = $('board');
const PAL = ['#ffd23f','#f8be5e','#f0975c','#e5726a','#cc588a','#a959a8','#8662b8','#6d6dc6'];
const INK = ['#3a2600','#3a2400','#3d1806','#40101a','#fff0f6','#fbeaff','#f2ecff','#eef0ff'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const KEY = 'hanoi-benares-v1';

// ---------- save ----------
let save = {best: {}, cur: null, mute: false, seen: false};
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

// ---------- audio: every disc is a small bell ----------
let ac = null, master = null;
const audio = () => {
  if (save.mute) return null;
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); } catch (e) { return null; }
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
};
const bell = (n, d, when = 0, vol = 1, len = 1.6) => {
  const a = audio(); if (!a) return;
  const f = 196 * Math.pow(2, H.semitone(n, d) / 12), t = a.currentTime + when;
  [[1, 1], [2.76, .35], [5.4, .12]].forEach(([m, g]) => {
    const o = a.createOscillator(), e = a.createGain();
    o.type = 'sine'; o.frequency.value = f * m;
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(.32 * g * vol, t + .006);
    e.gain.exponentialRampToValueAtTime(.0001, t + len / (m > 1 ? m * .6 : 1));
    o.connect(e); e.connect(master); o.start(t); o.stop(t + len + .05);
  });
};
const thud = () => {
  const a = audio(); if (!a) return; const t = a.currentTime;
  const o = a.createOscillator(), e = a.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(60, t + .12);
  e.gain.setValueAtTime(.4, t); e.gain.exponentialRampToValueAtTime(.0001, t + .16);
  o.connect(e); e.connect(master); o.start(t); o.stop(t + .2);
};

// ---------- state ----------
let n = H.FIRST, state, hist = [], sel = null, hinted = null, hintTimer = 0, won = false, drag = null;
let G = {}, els = [];
const medalOf = m => H.medal(n, m);

function pickStart() {
  if (save.cur && save.cur.n >= H.FIRST && save.cur.n <= H.LAST) {
    const h = H.strToHist(save.cur.h), s = h && H.replay(save.cur.n, h);
    if (s && !H.solved(s)) { n = save.cur.n; hist = h; state = s; return; }
  }
  for (let k = H.FIRST; k <= H.LAST; k++) if (!save.best[k]) { n = k; break; n = H.LAST; }
  hist = []; state = H.fresh(n);
}

// ---------- layout ----------
function layout() {
  const W = board.clientWidth, BH = board.clientHeight, col = W / 3, gap = 3;
  const h = Math.max(16, Math.min(col * .42, (BH - 90) / (n + 2.2)));
  const pegH = Math.min(BH - 84 - h * 1.5, (n + 3) * (h + gap)), SH = pegH + h * 1.5 + 84;
  G = {W, col, gap, h, pegH, SH, slabTop: SH - 46, lift: SH - 46 - pegH - h * 1.15};
  stage.style.height = SH + 'px';
}
const wOf = d => G.col * (.3 + .52 * (d - 1) / Math.max(1, n - 1));
const restXY = (s, d) => {
  for (let p = 0; p < 3; p++) { const j = s.pegs[p].indexOf(d); if (j >= 0) return {x: G.col * (p + .5) - wOf(d) / 2, y: G.slabTop - (j + 1) * (G.h + G.gap) + G.gap, p}; }
};
const liftXY = (p, d) => ({x: G.col * (p + .5) - wOf(d) / 2, y: G.lift});
const put = (el, x, y) => { el._x = x; el._y = y; el.style.transform = `translate(${x}px,${y}px)`; };
const tr = (x, y, sy = 1, sx = 1) => `translate(${x}px,${y}px) scale(${sx},${sy})`;
const dur = ms => reduce.matches ? 1 : ms;

function build() {
  stage.innerHTML = ''; els = [];
  const mk = (cls, css, html) => { const e = document.createElement('div'); e.className = cls; if (css) e.style.cssText = css; if (html) e.innerHTML = html; stage.appendChild(e); return e; };
  mk('slab', `top:${G.slabTop}px`);
  for (let p = 0; p < 3; p++) {
    const cx = G.col * (p + .5), goal = p === H.GOAL;
    if (goal) mk('halo', `left:${cx - G.col / 2}px;width:${G.col}px;top:${G.slabTop - 30}px`);
    if (goal) mk('goalmark', `left:${cx}px;top:${G.slabTop - 2}px`);
    mk('boss', `left:${cx}px;top:${G.slabTop - 8}px`);
    mk('peg' + (goal ? ' goal' : ''), `left:${cx}px;top:${G.slabTop - G.pegH}px;height:${G.pegH + 4}px`);
    if (goal) mk('lantern', `left:${cx}px;top:${G.slabTop - G.pegH - 84}px`, '<svg viewBox="0 0 44 56"><path d="M16 8l6-8 6 8z" fill="#7a1f2b"/><rect x="12" y="8" width="20" height="5" rx="2" fill="#7a1f2b"/><path d="M10 15h24l2 22-4 12H12L8 37z" fill="#ffd36a" stroke="#7a1f2b" stroke-width="3"/><path d="M22 15v34M15 15 14 49M29 15l1 34" stroke="#c0432a" stroke-width="1.5" opacity=".6"/><rect x="14" y="49" width="16" height="4" rx="2" fill="#7a1f2b"/></svg>');
  }
  const cols = [];
  for (let p = 0; p < 3; p++) cols.push(mk('col', `left:${G.col * p}px;width:${G.col}px`));
  G.cols = cols;
  for (let d = 1; d <= n; d++) {
    const ci = Math.round((d - 1) * 7 / Math.max(1, n - 1));
    const e = mk('disc', `--h:${G.h}px;--c:${PAL[ci]};--t:${INK[ci]};--ts:${ci > 3 ? '#00000066' : '#ffffff66'};width:${wOf(d)}px`, d);
    els[d] = e;
  }
  settle();
}
function settle() {
  for (let d = 1; d <= n; d++) {
    els[d].getAnimations().forEach(a => a.cancel());
    const sp = restXY(state, d);
    if (sel && sel.d === d) { const l = liftXY(sp.p, d); put(els[d], l.x, l.y); } else put(els[d], sp.x, sp.y);
  }
  markTarget();
}

// ---------- hud ----------
const sayEl = $('say');
let sayT = 0;
function say(txt, bad, ms = 0) {
  clearTimeout(sayT); sayEl.textContent = txt; sayEl.classList.toggle('bad', !!bad); sayEl.classList.toggle('off', !txt);
  if (ms) sayT = setTimeout(() => { sayEl.classList.add('off'); }, ms);
}
function hud(tick) {
  const m = $('moves'), par = H.par(n);
  m.firstChild.nodeValue = hist.length; $('par').textContent = '/ ' + par;
  if (tick) { m.classList.remove('tick'); void m.offsetWidth; m.classList.add('tick'); }
  const pr = $('prog'); pr.classList.toggle('over', hist.length > par);
  $('progu').style.transform = `scaleX(${Math.min(1, hist.length / par)})`;
  $('undo').disabled = !hist.length || won; $('hint').disabled = won;
  document.querySelectorAll('.lv').forEach(b => {
    const k = +b.dataset.n; b.classList.toggle('on', k === n);
    b.classList.toggle('done', !!save.best[k]); b.classList.toggle('perfect', save.best[k] === H.par(k));
    b.setAttribute('aria-label', k + ' discs' + (save.best[k] ? ', solved in ' + save.best[k] : ''));
    b.setAttribute('aria-current', k === n ? 'true' : 'false');
  });
}
function levels() {
  const box = $('levels'); box.innerHTML = '';
  for (let k = H.FIRST; k <= H.LAST; k++) {
    const b = document.createElement('button'); b.className = 'lv'; b.textContent = k; b.dataset.n = k;
    b.onclick = () => { audio(); start(k); }; box.appendChild(b);
  }
}
function persistGame() { save.cur = hist.length && !won ? {n, h: H.histToStr(hist)} : null; persist(); }

// ---------- target / hint markers ----------
function markTarget() {
  stage.querySelectorAll('.ghost').forEach(e => e.remove());
  els.forEach(e => e && e.classList.remove('hinted'));
  if (!hinted) return;
  const d = H.top(state, hinted[0]);
  els[d] && els[d].classList.add('hinted');
  const to = H.move(state, hinted[0], hinted[1]).state, gx = G.col * (hinted[1] + .5) - wOf(d) / 2, gy = restXY(to, d).y;
  const t = document.createElement('div'); t.className = 'ghost';
  t.style.cssText = `width:${wOf(d)}px;height:${G.h}px;transform:translate(${gx}px,${gy}px)`; stage.appendChild(t);
}
function clearHint() { hinted = null; clearTimeout(hintTimer); $('hintl').textContent = 'Hint'; $('hint').classList.remove('live'); markTarget(); }

// ---------- selecting and moving ----------
function glide(el, x, y, ms, ease = 'cubic-bezier(.2,.8,.2,1)') {
  const a = {x: el._x, y: el._y}; el.getAnimations().forEach(q => q.cancel());
  put(el, x, y);
  if (reduce.matches) return;
  el.animate([{transform: tr(a.x, a.y)}, {transform: tr(x, y)}], {duration: ms, easing: ease});
}
function select(p) {
  const d = H.top(state, p); if (!d) return;
  sel = {p, d}; clearHint(); say('');
  const l = liftXY(p, d); els[d].style.zIndex = 4; glide(els[d], l.x, l.y, dur(170));
  bell(n, d, 0, .35, .5);
}
function putDown() {
  if (!sel) return; const d = sel.d, r = restXY(state, d); sel = null;
  glide(els[d], r.x, r.y, dur(170)); setTimeout(() => { els[d].style.zIndex = ''; }, 170);
}
function shake(d) {
  const el = els[d]; if (reduce.matches) return;
  const x = el._x, y = el._y; el.getAnimations().forEach(q => q.cancel());
  el.animate([0, -9, 8, -6, 4, 0].map(o => ({transform: tr(x + o, y)})), {duration: 320, easing: 'ease-out'});
}
let mistakes = 0;
function refuse(to, d) {
  thud(); shake(d); els[d].classList.remove('bad'); void els[d].offsetWidth; els[d].classList.add('bad'); setTimeout(() => els[d].classList.remove('bad'), 360);
  const c = G.cols[to]; c.classList.add('nope'); setTimeout(() => c.classList.remove('nope'), 260);
  if (!save.seen || mistakes < 1) say('A larger disc can’t rest on a smaller one.', true, 2600);
  mistakes++;
}
function attempt(from, to) {
  if (from === to) { putDown(); return false; }
  if (!H.canMove(state, from, to)) { refuse(to, H.top(state, from)); return false; }
  commit(from, to); return true;
}
function commit(from, to, opt = {}) {
  clearHint();
  const d = H.top(state, from), el = els[d], was = sel && sel.d === d;
  const a = {x: el._x, y: el._y};
  state = H.move(state, from, to).state; sel = null;
  if (opt.undo) hist.pop(); else hist.push([from, to]);
  const r = restXY(state, d), lx0 = a.y > G.lift ? G.lift : a.y;
  el.getAnimations().forEach(q => q.cancel()); put(el, r.x, r.y); el.style.zIndex = 4;
  const far = Math.abs(to - from), total = dur(was ? 340 + far * 90 : 460 + far * 100);
  if (reduce.matches) { el.style.zIndex = ''; }
  else {
    const L = G.lift, up = was ? 0 : .22;
    const kf = [{transform: tr(a.x, a.y), offset: 0}];
    if (!was) kf.push({transform: tr(a.x, L), offset: .22, easing: 'ease-in-out'});
    kf.push({transform: tr(r.x, L), offset: .62, easing: 'cubic-bezier(.5,0,1,.6)'}, {transform: tr(r.x, r.y), offset: .88},
      {transform: tr(r.x, r.y, .86, 1.05), offset: .94}, {transform: tr(r.x, r.y), offset: 1});
    kf[0].easing = 'cubic-bezier(.2,.8,.2,1)';
    el.animate(kf, {duration: total, easing: 'linear'});
    setTimeout(() => { el.style.zIndex = ''; }, total);
  }
  const land = total * .88;
  setTimeout(() => ripple(r.x + wOf(d) / 2, r.y + G.h, wOf(d)), land);
  bell(n, d, land / 1000, opt.undo ? .5 : 1);
  if (!opt.undo && !save.seen) { save.seen = true; persist(); }
  hud(true); persistGame();
  if (!opt.undo && H.solved(state)) win(land);
  else if (!opt.undo && !hist.length === 1) {}
  if (hist.length === 1) say('', false);
}
function ripple(cx, y, w) {
  if (reduce.matches) return;
  const e = document.createElement('div'); e.className = 'ring'; e.style.cssText = `left:${cx - w / 2}px;top:${y}px;width:${w}px`;
  stage.appendChild(e); setTimeout(() => e.remove(), 600);
}

// ---------- hint / undo / restart ----------
$('hint').onclick = () => {
  audio(); if (won) return;
  if (sel) putDown();
  if (hinted) { const [f, t] = hinted; commit(f, t); return; }
  hinted = H.hint(state); if (!hinted) return;
  $('hintl').textContent = 'Do it'; $('hint').classList.add('live'); markTarget();
  hintTimer = setTimeout(clearHint, 6000);
};
$('undo').onclick = () => {
  audio(); if (!hist.length || won) return;
  if (sel) { putDown(); }
  const [f, t] = hist[hist.length - 1]; commit(t, f, {undo: true});
};
$('reset').onclick = () => { audio(); start(n, true); };

// ---------- winning: the whole tower rings ----------
function win(delay) {
  won = true; const par = H.par(n), m = hist.length, medal = medalOf(m);
  const prev = save.best[n], better = !prev || m < prev;
  if (better) save.best[n] = m; save.cur = null; persist();
  hud(); const base = delay / 1000 + .25;
  for (let d = n; d >= 1; d--) {
    const i = n - d;
    bell(n, d, base + i * .13, .9, 2.2);
    setTimeout(() => { els[d].classList.add('glow'); const r = restXY(state, d); ripple(r.x + wOf(d) / 2, r.y + G.h, wOf(d)); }, delay + 250 + i * 130);
  }
  const t = delay + 250 + n * 130;
  setTimeout(() => { $('stage').querySelector('.lantern').classList.add('flare'); motes(); $('app').classList.add('dawn'); }, t - 200);
  setTimeout(() => sheet(m, par, medal, better), t + 1500);
}
function motes() {
  if (reduce.matches) return;
  const x = G.col * (H.GOAL + .5);
  for (let i = 0; i < 16; i++) {
    const e = document.createElement('div'); e.className = 'mote';
    e.style.cssText = `left:${x + (Math.random() - .5) * G.col * .8}px;top:${G.slabTop - Math.random() * G.pegH * .8}px;--dx:${(Math.random() - .5) * 60}px;animation-delay:${Math.random() * .5}s`;
    stage.appendChild(e); setTimeout(() => e.remove(), 3000);
  }
}
const MED = {gold: '#f2d57a', silver: '#cfd8ee', bronze: '#d99a64'};
function sheet(m, par, medal) {
  const v = $('veil'); $('medal').style.setProperty('--m', MED[medal]); $('medal').textContent = m;
  $('vt').textContent = medal === 'gold' ? 'Perfect.' : medal === 'silver' ? 'Well carried.' : 'Across.';
  $('vp').textContent = medal === 'gold' ? `${m} moves — the fewest there can be.` : `${m} moves. The fewest possible is ${par}.`;
  const last = n === H.LAST; $('next').textContent = last ? 'Again' : `${n + 1} discs`;
  $('again').textContent = medal === 'gold' && !last ? 'Replay' : 'Try again';
  $('again').style.display = last ? 'none' : '';
  v.classList.add('on'); $('next').focus({preventScroll: true});
}
function closeSheet() { $('veil').classList.remove('on'); $('app').classList.remove('dawn'); }
$('next').onclick = () => { closeSheet(); start(n === H.LAST ? n : n + 1, true); };
$('again').onclick = () => { closeSheet(); start(n, true); };
$('veil').onclick = e => { if (e.target === $('veil')) closeSheet(); };

// ---------- start a level ----------
function start(k, fresh) {
  closeSheet(); won = false; sel = null; drag = null; clearHint(); mistakes = 0;
  if (!fresh && k === n && state && !hist.length) { /* same level, nothing played */ }
  if (k !== n || fresh || true) {
    n = k;
    const cur = !fresh && save.cur && save.cur.n === k ? H.strToHist(save.cur.h) : null, s = cur && H.replay(k, cur);
    if (s && !H.solved(s)) { hist = cur; state = s; } else { hist = []; state = H.fresh(k); if (fresh) { save.cur = null; persist(); } }
  }
  layout(); build(); hud();
  say(hist.length ? '' : (save.seen ? '' : 'Carry every disc to the lantern — one at a time.'));
  if (!save.seen) { /* first-time line stays until the first move */ }
}

// ---------- pointer: tap a peg or drag a disc ----------
const colOf = e => { const r = stage.getBoundingClientRect(); return Math.max(0, Math.min(2, Math.floor((e.clientX - r.left) / (r.width / 3)))); };
stage.addEventListener('pointerdown', e => {
  if (won || e.button > 0) return; audio();
  const p = colOf(e); drag = {p, id: e.pointerId, x: e.clientX, y: e.clientY, on: false, picked: false};
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  if (!sel) { if (state.pegs[p].length) { select(p); drag.picked = true; } else drag = null; }
  else { const ok = attempt(sel.p, p); drag = null; if (!ok && sel && sel.p === p) {} }
});
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  if (!drag || !drag.picked || !sel) return;
  if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) { drag.on = true; els[sel.d].getAnimations().forEach(q => q.cancel()); }
  if (!drag.on) return;
  const el = els[sel.d], w = wOf(sel.d), px = e.clientX - r.left, py = e.clientY - r.top;
  put(el, px - w / 2, Math.max(0, Math.min(G.slabTop - G.h, py - G.h * 1.2)));
  const c = colOf(e); G.cols.forEach((q, i) => { q.classList.toggle('hot', i === c && i !== sel.p && H.canMove(state, sel.p, i)); q.classList.toggle('nope', i === c && i !== sel.p && !H.canMove(state, sel.p, i)); });
});
const endDrag = e => {
  if (!drag) return; const was = drag; drag = null;
  G.cols && G.cols.forEach(q => q.classList.remove('hot', 'nope'));
  if (!was.on || !sel) return;
  const c = colOf(e), el = els[sel.d];
  if (c === sel.p) { putDown(); return; }
  if (H.canMove(state, sel.p, c)) commit(sel.p, c); else { const d = sel.d, r = restXY(state, d); thud(); const f = sel.p; refuse(c, d); sel = null; glide(el, r.x, r.y, dur(260)); setTimeout(() => { el.style.zIndex = ''; }, 260); }
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '3' && !won) { audio(); const p = +k - 1; if (!sel) { if (state.pegs[p].length) select(p); } else attempt(sel.p, p); }
  else if (k === 'z' || k === 'u') $('undo').click();
  else if (k === 'h') $('hint').click();
  else if (k === 'r') $('reset').click();
  else if (k === 'escape') { if (sel) putDown(); else closeSheet(); }
});

// ---------- sound toggle ----------
const syncSnd = () => { $('sndwave').style.display = save.mute ? 'none' : ''; $('snd').setAttribute('aria-label', save.mute ? 'Sound off' : 'Sound on'); };
$('snd').onclick = () => { save.mute = !save.mute; persist(); syncSnd(); if (!save.mute) bell(n, 1, 0, .6); };

let rz = 0;
addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { layout(); build(); hud(); }); });

levels(); syncSnd(); pickStart(); layout(); build(); hud();
if (!save.seen && !hist.length) say('Carry every disc to the lantern — one at a time.');
// first move retires the opening line for good
const origCommit = commit; 
window.__hanoi = {get state() { return state; }, get hist() { return hist; }, get n() { return n; }, start, attempt};
})();
</script>
</body></html>
