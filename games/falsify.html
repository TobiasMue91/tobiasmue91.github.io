<style>
:root{
  --ink:#070b0e; --ink2:#0a1015; --panel:#0f181e; --panel2:#152430; --panel3:#1b2f3b;
  --edge:#1d3039; --edge2:#2c4a58;
  --text:#e8f2f4; --dim:#8aa5ae; --dim2:#5a757f;
  --bloom:#6fe6a4; --bloom2:#a8ffcf; --inert:#5d7a86;
  --gold:#ffce74; --warn:#ff7d6b;
  --sp:clamp(46px,7.2vw,58px);
  --r:14px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 12% -10%, #10333a 0%, transparent 62%),
    radial-gradient(900px 620px at 100% 108%, #17233d 0%, transparent 60%),
    var(--ink);
  color:var(--text);
  font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3{font-weight:700;letter-spacing:.02em}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.serif{font-family:Spectral,Georgia,serif}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh;min-height:100dvh}
header{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px clamp(12px,2.2vw,22px);
  border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(13,26,32,.92),rgba(9,16,20,.72));
  backdrop-filter:blur(8px); flex:0 0 auto; z-index:20;
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:20px;letter-spacing:.24em;font-weight:700}
.brand .tag{font-size:11px;color:var(--dim2);letter-spacing:.16em;text-transform:uppercase}
.stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.stat{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:64px;padding:4px 10px;border-radius:10px;
  background:rgba(255,255,255,.032);border:1px solid var(--edge);
}
.stat b{font-size:16px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:9.5px;color:var(--dim2);letter-spacing:.13em;text-transform:uppercase}
.stat.rank b{color:var(--gold)}
.hbtns{display:flex;gap:6px}
.hbtn{
  padding:7px 12px;border-radius:9px;border:1px solid var(--edge);
  background:rgba(255,255,255,.03);font-size:12.5px;color:var(--dim);
  transition:.16s;white-space:nowrap;
}
.hbtn:hover{color:var(--text);border-color:var(--edge2);background:rgba(255,255,255,.07)}

main{flex:1;display:grid;grid-template-columns:minmax(340px,400px) 1fr;min-height:0}
#bench{
  border-right:1px solid var(--edge);
  padding:clamp(12px,1.8vw,20px) clamp(12px,1.8vw,20px) 62px;
  display:flex;flex-direction:column;gap:14px;
  overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,rgba(16,32,40,.4),rgba(7,11,14,0) 320px);
}
#bench > *{flex:0 0 auto}
.secTitle{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.secTitle h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2)}
.secTitle .rule{flex:1;height:1px;background:var(--edge)}

/* ---------- trays ---------- */
.tray{display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
.trayBox{
  position:relative;border-radius:var(--r);border:1px solid var(--edge2);
  background:linear-gradient(180deg,#132029,#0c151b);
  padding:14px 12px;min-height:calc(var(--sp) + 30px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 10px 26px -18px #000;
  overflow:hidden;
}
.trayBox::after{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:var(--r);
  background:radial-gradient(120% 90% at 50% 120%,rgba(111,230,164,0),transparent 70%);
  transition:background .5s;
}
.trayBox.lit::after{background:radial-gradient(120% 110% at 50% 130%,rgba(111,230,164,.3),transparent 72%)}
.trayBox.dud::after{background:radial-gradient(120% 110% at 50% 130%,rgba(90,117,127,.2),transparent 72%)}
.trayBox .empty{color:var(--dim2);font-size:12.5px;letter-spacing:.06em}

.spore{
  position:relative;flex:0 0 auto;display:block;
  width:var(--sp);height:var(--sp);
  border-radius:50%;cursor:pointer;transition:transform .14s, filter .25s;
}
.spore svg{display:block;width:100%;height:100%;overflow:visible}
.spore:hover{transform:translateY(-3px)}
.spore.sel{transform:translateY(-5px)}
.spore.sel::before{
  content:'';position:absolute;inset:-7px;border-radius:12px;
  border:1.5px dashed var(--gold);opacity:.85;
}
.spore .x{
  position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;
  background:#22343d;border:1px solid var(--edge2);color:var(--dim);
  font-size:12px;line-height:17px;text-align:center;opacity:0;transition:.15s;
}
.spore.sel .x{opacity:1}
.spore .x:hover{background:var(--warn);color:#170a08;border-color:var(--warn)}
.tray.small .spore{width:24px;height:24px;cursor:default}
.tray.small .spore:hover{transform:none}
.tray.mid .spore{width:34px;height:34px;cursor:default}
.tray.mid .spore:hover{transform:none}

/* ---------- palette ---------- */
.palRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.palBtn{
  position:relative;width:44px;height:44px;border-radius:12px;
  border:1px solid var(--edge);background:rgba(255,255,255,.03);
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.palBtn:hover{border-color:var(--edge2);background:rgba(255,255,255,.08);transform:translateY(-2px)}
.palBtn svg{width:26px;height:26px;overflow:visible}
.palBtn .k{position:absolute;bottom:1px;right:4px;font-size:8.5px;color:var(--dim2)}
.formRow .palBtn{width:auto;height:34px;padding:0 12px;gap:7px;font-size:12px;color:var(--dim)}
.formRow .palBtn svg{width:16px;height:16px}
.formRow .palBtn.on{border-color:var(--gold);color:var(--text);background:rgba(255,206,116,.1)}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);margin-bottom:6px}

.btnRow{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  padding:10px 15px;border-radius:11px;border:1px solid var(--edge2);
  background:rgba(255,255,255,.04);font-size:13.5px;transition:.15s;color:var(--dim);
}
.btn:hover:not(:disabled){background:rgba(255,255,255,.09);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{
  flex:1;color:#04140c;font-weight:700;letter-spacing:.04em;
  background:linear-gradient(180deg,var(--bloom2),var(--bloom));border-color:#8df0bb;
  box-shadow:0 10px 30px -14px var(--bloom);
}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.trial{
  flex:1;color:#1a1204;font-weight:700;
  background:linear-gradient(180deg,#ffdf9c,var(--gold));border-color:#ffdf9c;
}
.btn.trial:hover:not(:disabled){filter:brightness(1.07)}
.btn.ghost{font-size:12px;padding:8px 12px}
.btn.icon{flex:0 0 46px;padding:10px 0;text-align:center;font-size:15px}

/* ---------- verdict + gauge ---------- */
#verdict{min-height:0}
.vd{
  border-radius:12px;border:1px solid var(--edge);padding:11px 13px;
  background:rgba(255,255,255,.028);font-size:13px;color:var(--dim);
}
.vd.yes{border-color:rgba(111,230,164,.4);background:rgba(111,230,164,.08)}
.vd.no{border-color:var(--edge2);background:rgba(120,150,163,.06)}
.vd .head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.vd .head b{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.vd.yes .head b{color:var(--bloom2)}
.vd.no .head b{color:var(--dim)}
.vd .grade{margin-left:auto;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.splitBar{
  position:relative;height:9px;border-radius:5px;overflow:hidden;
  background:#22343d;margin:8px 0 6px;
}
.splitBar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4ec98c,#7dffb8);transition:width .5s cubic-bezier(.2,.9,.25,1)}
.splitBar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold);opacity:.9;transition:left .5s}
.splitLbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}

.gauge{border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.028);padding:12px 13px}
.gauge .top{display:flex;align-items:flex-end;gap:9px}
.gauge .n{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold)}
.gauge .cap{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);padding-bottom:3px}
.gauge .delta{margin-left:auto;font-size:12px;color:var(--bloom);font-variant-numeric:tabular-nums;padding-bottom:3px}
.gaugeBar{height:6px;border-radius:4px;background:#22343d;margin-top:10px;overflow:hidden}
.gaugeBar i{display:block;height:100%;background:linear-gradient(90deg,#ffce74,#ff9f6b);transition:width .6s cubic-bezier(.2,.9,.25,1)}
.hintLine{font-size:11.5px;color:var(--dim2);margin-top:8px;line-height:1.5}
.hintLine em{color:var(--gold);font-style:normal}

/* ---------- evidence ---------- */
#evidence{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col + .col{border-left:1px solid var(--edge)}
.colHead{
  display:flex;align-items:center;gap:9px;padding:12px clamp(10px,1.4vw,16px) 10px;
  border-bottom:1px solid var(--edge);flex:0 0 auto;
}
.colHead h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.colHead .dot{width:8px;height:8px;border-radius:50%}
.colHead .cnt{margin-left:auto;font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums}
#colYes .colHead{background:linear-gradient(180deg,rgba(111,230,164,.09),transparent)}
#colYes .colHead h3{color:var(--bloom2)} #colYes .dot{background:var(--bloom);box-shadow:0 0 10px var(--bloom)}
#colNo .colHead h3{color:var(--dim)} #colNo .dot{background:var(--inert)}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px clamp(8px,1.2vw,14px) 58px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:6px;align-content:start}
.evi{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;
  border:1px solid var(--edge);background:rgba(255,255,255,.022);
  cursor:pointer;transition:.14s;
}
.evi:hover{border-color:var(--edge2);background:rgba(255,255,255,.07);transform:translateY(-1px)}
.evi.fresh{animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.evi .no{font-size:10px;color:var(--dim2);width:20px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.evi .from{margin-left:auto;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);flex:0 0 auto}
.evi .from.t{color:var(--gold)}
#colNo .evi{background:rgba(255,255,255,.014)}
#colNo .evi .spore{opacity:.68}
#colNo .evi:hover .spore{opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
.emptyNote{color:var(--dim2);font-size:12px;padding:8px 4px;line-height:1.6;grid-column:1/-1}

/* ---------- overlays ---------- */
#ov{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
#ov .scrim{position:absolute;inset:0;background:rgba(4,7,9,.82);backdrop-filter:blur(6px)}
.card{
  position:relative;width:min(720px,100%);max-height:92dvh;overflow-y:auto;
  border-radius:20px;border:1px solid var(--edge2);
  background:linear-gradient(180deg,#13222b,#0a1218);
  padding:clamp(18px,3vw,30px);box-shadow:0 40px 90px -30px #000;
}
.card h2{font-size:clamp(19px,3vw,25px);margin-bottom:6px;letter-spacing:.01em}
.card .sub{color:var(--dim);font-size:13.5px;margin-bottom:18px;line-height:1.6}
.card .close{position:absolute;top:14px;right:16px;color:var(--dim2);font-size:22px;line-height:1}
.card .close:hover{color:var(--text)}
.lawCard{
  border-radius:14px;border:1px solid rgba(255,206,116,.4);
  background:linear-gradient(180deg,rgba(255,206,116,.11),rgba(255,206,116,.03));
  padding:16px 18px;margin:14px 0;
}
.lawCard .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.lawCard .t{font-family:Spectral,Georgia,serif;font-size:clamp(16px,2.6vw,20px);line-height:1.45}
.lawCard .t b{color:var(--gold);font-weight:600}
.trialGrid{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.tq{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-radius:13px;border:1px solid var(--edge);background:rgba(255,255,255,.025);padding:11px 13px;
}
.tq .num{font-size:11px;color:var(--dim2);width:16px;flex:0 0 auto}
.tq .picks{margin-left:auto;display:flex;gap:6px}
.pick{padding:7px 13px;border-radius:9px;border:1px solid var(--edge2);font-size:12px;color:var(--dim);transition:.14s}
.pick:hover{background:rgba(255,255,255,.07);color:var(--text)}
.pick.on[data-v="1"]{background:var(--bloom);border-color:var(--bloom);color:#04140c;font-weight:700}
.pick.on[data-v="0"]{background:#43606c;border-color:#5c7d8a;color:#eaf4f6;font-weight:700}
.tq.right{border-color:rgba(111,230,164,.55);background:rgba(111,230,164,.08)}
.tq.wrong{border-color:rgba(255,125,107,.55);background:rgba(255,125,107,.08)}
.tq .mark{font-size:15px;width:18px;text-align:center}
.stats2{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin:16px 0}
.st{border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.028);padding:10px 12px}
.st b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.st span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-top:10px}
.gitem{border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.025);padding:10px 12px}
.gitem.new{border-color:rgba(255,206,116,.45);background:rgba(255,206,116,.07)}
.gitem b{font-size:12px;letter-spacing:.05em;display:block;margin-bottom:3px}
.gitem.new b::after{content:' · new';color:var(--gold);font-size:9.5px;letter-spacing:.15em}
.gitem span{font-size:11.5px;color:var(--dim);font-family:Spectral,Georgia,serif;line-height:1.45}
.codexList{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.cx{display:flex;gap:11px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.022);padding:9px 12px}
.cx i{font-style:normal;color:var(--gold);font-size:11px;font-variant-numeric:tabular-nums;flex:0 0 30px}
.cx span{font-family:Spectral,Georgia,serif;font-size:13px;line-height:1.5}
.steps{display:flex;flex-direction:column;gap:11px;margin:16px 0}
.step{display:flex;gap:13px}
.step i{
  flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--edge2);
  font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--gold);
}
.step p{font-size:13.5px;color:var(--dim);line-height:1.6}
.step p b{color:var(--text);font-weight:500}
.kbd{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--edge2);background:rgba(255,255,255,.05);color:var(--dim)}
.jump{
  display:none;width:100%;padding:12px;border-radius:12px;
  border:1px dashed var(--edge2);background:rgba(255,255,255,.02);
  font-size:12.5px;color:var(--dim);letter-spacing:.04em;
}
.jump:hover{color:var(--text);border-color:var(--dim2)}
.menuList{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.menuList button{
  text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--edge);
  background:rgba(255,255,255,.03);font-size:14px;
}
.menuList button span{display:block;font-size:11.5px;color:var(--dim2);margin-top:2px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:300;
  padding:10px 18px;border-radius:11px;border:1px solid var(--edge2);
  background:#16262f;font-size:13px;opacity:0;pointer-events:none;transition:.25s;
  box-shadow:0 20px 40px -20px #000;max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
#bMenu{display:none}
#loading{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(5,9,11,.9)}
#loading.on{display:flex}
#loading div{color:var(--dim);font-size:12px;letter-spacing:.24em;text-transform:uppercase;animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes bloomPulse{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes dudShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.trayBox.anim-yes .spore{animation:bloomPulse .6s cubic-bezier(.2,1.4,.4,1)}
.trayBox.anim-no{animation:dudShake .32s}
.ring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--bloom);pointer-events:none;animation:ringOut .85s ease-out forwards}
@keyframes ringOut{to{width:520px;height:520px;margin:-260px 0 0 -260px;opacity:0;border-width:1px}}

/* ---------- responsive ---------- */
@media(max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100dvh}
  main{display:flex;flex-direction:column;min-height:0}

<body>
<div id="app">
  <header>
    <div class="brand"><b>FALSIFY</b><span class="tag">rule induction</span></div>
    <div class="stats">
      <div class="stat rank"><b id="sRank">1</b><span id="sRankName">apprentice</span></div>
      <div class="stat"><b id="sScore">0</b><span>score</span></div>
      <div class="stat"><b id="sAssay">0</b><span>assays</span></div>
    </div>
    <div class="hbtns">
      <button class="hbtn wide" id="bGuide">Field guide</button>
      <button class="hbtn wide" id="bCodex">Codex</button>
      <button class="hbtn wide" id="bSound" title="Sound">♪</button>
      <button class="hbtn" id="bHelp" title="How to play">?</button>
      <button class="hbtn" id="bMenu" title="Menu">☰</button>
    </div>
  </header>

  <main>
    <section id="bench">
      <div>
        <div class="secTitle"><h2>Bench</h2><div class="rule"></div><span id="benchNote" style="font-size:11px;color:var(--dim2)"></span></div>
        <div class="trayBox" id="trayBox"><div class="tray" id="tray"></div></div>
      </div>

      <div>
        <div class="lbl" id="palLbl">Spectrum strip — click to add</div>
        <div class="palRow" id="palette"></div>
      </div>
      <div id="formWrap" hidden>
        <div class="lbl">Form</div>
        <div class="palRow formRow" id="forms"></div>
      </div>

      <div class="btnRow">
        <button class="btn primary" id="bRun">Run assay</button>
        <button class="btn icon" id="bUndo" title="Undo (Z)">↺</button>
        <button class="btn icon" id="bRand" title="Random tray (R)">⚂</button>
        <button class="btn icon" id="bClear" title="Clear (C)">✕</button>
      </div>

      <div id="verdict"></div>

      <div class="gauge">
        <div class="top">
          <span class="n mono" id="gN">—</span>
          <span class="cap">candidate laws standing</span>
          <span class="delta mono" id="gD"></span>
        </div>
        <div class="gaugeBar"><i id="gBar" style="width:100%"></i></div>

      </div>

        <div class="list" id="listYes"></div>
      </div>

        <div class="colHead"><span class="dot"></span><h3>Inert</h3><span class="cnt" id="cNo">0</span></div>
        <div class="list" id="listNo"></div>
      </div>
    </section>
  </main>
</div>

<script>
/* ==FALSIFY-CORE-START== */
/* Falsify — rule-induction engine.
   A "tray" is a row of spores. Each spore has a colour and a form.
   A "law" is a predicate over trays. The engine enumerates the whole tray
   universe for a world, evaluates every candidate law over it as a bitset,
   and reasons exactly from there: pruning, information gain, trials. */

var FalsifyCore = (function () {
  'use strict';

  /* ---------- seeded rng ---------- */
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFrom(seedStr) {
    var s = xmur3(String(seedStr));
    var r = mulberry32(s());
    r.int = function (n) { return Math.floor(r() * n); };
    r.pick = function (arr) { return arr[Math.floor(r() * arr.length)]; };
    r.shuffle = function (arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(r() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    };
    return r;
  }

  /* ---------- palette ---------- */
  /* Spectrum order matters: laws may talk about colours never stepping
     backwards along it, so the UI must show the palette in this order. */
  var COLOURS = [
    { key: 'ember',   name: 'Ember',   hex: '#ff5a3c' },
    { key: 'amber',   name: 'Amber',   hex: '#ffc23d' },
    { key: 'verdant', name: 'Verdant', hex: '#43e08a' },
    { key: 'azure',   name: 'Azure',   hex: '#4aa8ff' },
    { key: 'orchid',  name: 'Orchid',  hex: '#c07dff' }
  ];
  var FORMS = [
    { key: 'round', name: 'Round' },
    { key: 'spike', name: 'Spike' },
    { key: 'crux',  name: 'Crux' }
  ];
  /* 3-colour worlds skip Amber so the three remaining hues stay far apart. */
  var COLOUR_SUBSET = { 3: [0, 2, 3], 4: [0, 1, 2, 3], 5: [0, 1, 2, 3, 4] };

  function makeWorld(spec) {
    var idx = COLOUR_SUBSET[spec.C];
    return {
      C: spec.C, F: spec.F, minLen: spec.minLen, maxLen: spec.maxLen,
      colourIdx: idx,
      colours: idx.map(function (i) { return COLOURS[i]; }),
      forms: FORMS.slice(0, spec.F)
    };
  }

  /* ---------- universe ---------- */
  /* A tray is an array of cells; a cell is colour*F + form. */
  function enumerateUniverse(world) {
    var S = world.C * world.F, out = [];
    for (var len = world.minLen; len <= world.maxLen; len++) {
      var total = Math.pow(S, len);
      for (var n = 0; n < total; n++) {
        var t = new Array(len), x = n;
        for (var i = len - 1; i >= 0; i--) { t[i] = x % S; x = (x / S) | 0; }
        out.push(t);
      }
    }
    return out;
  }
  function universeSize(world) {
    var S = world.C * world.F, n = 0;
    for (var len = world.minLen; len <= world.maxLen; len++) n += Math.pow(S, len);
    return n;
  }

  /* ---------- features ---------- */
  function features(tray, world) {
    var C = world.C, F = world.F, len = tray.length;
    var cc = new Array(C).fill(0), fc = new Array(F).fill(0);
    var cellCount = new Array(C * F).fill(0);
    var colSeq = new Array(len), formSeq = new Array(len);
    for (var i = 0; i < len; i++) {
      var c = (tray[i] / F) | 0, f = tray[i] % F;
      colSeq[i] = c; formSeq[i] = f;
      cc[c]++; fc[f]++; cellCount[c * F + f]++;
    }
    var colMask = 0, formMask = 0, cellMask = 0;
    for (var c2 = 0; c2 < C; c2++) if (cc[c2]) colMask |= 1 << c2;
    for (var f2 = 0; f2 < F; f2++) if (fc[f2]) formMask |= 1 << f2;
    for (var k = 0; k < C * F; k++) if (cellCount[k]) cellMask |= 1 << k;

    var adjSameC = false, adjSameF = false, adjPair = 0, adjFormPair = 0;
    var runC = len ? 1 : 0, cur = 1;
    for (var j = 1; j < len; j++) {
      if (colSeq[j] === colSeq[j - 1]) { adjSameC = true; cur++; if (cur > runC) runC = cur; }
      else cur = 1;
      if (formSeq[j] === formSeq[j - 1]) adjSameF = true;
      adjPair |= 1 << (colSeq[j - 1] * C + colSeq[j]);
      adjFormPair |= 1 << (formSeq[j - 1] * F + formSeq[j]);
    }
    var pal = true, palF = true;
    for (var p = 0, q = len - 1; p < q; p++, q--) {
      if (colSeq[p] !== colSeq[q]) pal = false;
      if (formSeq[p] !== formSeq[q]) palF = false;
    }
    var nonDec = true, nonInc = true;
    for (var s = 1; s < len; s++) {
      if (colSeq[s] < colSeq[s - 1]) nonDec = false;
      if (colSeq[s] > colSeq[s - 1]) nonInc = false;
    }
    var distinctC = 0, distinctF = 0, maxC = 0, majority = -1, ties = 0;
    for (var a = 0; a < C; a++) {
      if (cc[a]) distinctC++;
      if (cc[a] > maxC) { maxC = cc[a]; majority = a; ties = 1; }
      else if (cc[a] === maxC && maxC > 0) ties++;
    }
    if (ties !== 1) majority = -1;
    for (var b = 0; b < F; b++) if (fc[b]) distinctF++;

    /* pure[c*F+f]: colour c is present and every c spore has form f */
    var pure = 0;
    for (var cx = 0; cx < C; cx++) {
      if (!cc[cx]) continue;
      for (var fx = 0; fx < F; fx++) if (cellCount[cx * F + fx] === cc[cx]) pure |= 1 << (cx * F + fx);
    }
    return {
      len: len, cc: cc, fc: fc, cellCount: cellCount,
      colSeq: colSeq, formSeq: formSeq,
      colMask: colMask, formMask: formMask, cellMask: cellMask,
      adjSameC: adjSameC, adjSameF: adjSameF, adjPair: adjPair, adjFormPair: adjFormPair,
      pal: pal, palF: palF, nonDec: nonDec, nonInc: nonInc,
      distinctC: distinctC, distinctF: distinctF,
      runC: runC, majority: majority, pure: pure,
      first: colSeq[0], last: colSeq[len - 1],
      firstF: formSeq[0], lastF: formSeq[len - 1]
    };
  }

  /* ---------- atoms ---------- */
  var GROUPS = {
    presence: 'Presence',
    count:    'Counting',
    parity:   'Parity',
    size:     'Tray size',
    position: 'Position',
    neighbour:'Neighbours',
    compare:  'Comparison',
    variety:  'Variety',
    pattern:  'Pattern',
    form:     'Form',
    link:     'Colour & form'
  };

  function buildAtoms(world) {
    var A = [], C = world.C, F = world.F;
    var cn = function (i) { return world.colours[i].name; };
    var an = function (i) { return article(cn(i)) + ' ' + cn(i); };
    var fnm = function (i) { return world.forms[i].name.toLowerCase(); };
    var afn = function (i) { return article(fnm(i)) + ' ' + fnm(i); };
    var fnmP = function (i) {
      var n = world.forms[i].name.toLowerCase();
      return n === 'crux' ? 'cruxes' : n + 's';
    };
    function add(group, key, text, t) { A.push({ group: group, key: key, text: text, t: t }); }
    var c, d, k, s, t2;

    /* Every text is a clause that completes "a tray blooms when ___",
       so clauses can be joined without reading like a form letter. */

    /* presence */
    for (c = 0; c < C; c++) (function (c) {
      add('presence', 'has' + c, 'it holds at least one ' + cn(c) + ' spore',
        function (f) { return f.cc[c] > 0; });
      add('presence', 'no' + c, 'it holds no ' + cn(c) + ' spore at all',
        function (f) { return f.cc[c] === 0; });
    })(c);

    /* counting */
    for (c = 0; c < C; c++) for (k = 1; k <= 3; k++) (function (c, k) {
      if (k >= 2) add('count', 'ge' + c + '_' + k,
        'it holds at least ' + num(k) + ' ' + cn(c) + ' spores',
        function (f) { return f.cc[c] >= k; });
      add('count', 'eq' + c + '_' + k,
        'it holds exactly ' + num(k) + ' ' + cn(c) + (k === 1 ? ' spore' : ' spores'),
        function (f) { return f.cc[c] === k; });
      if (k <= 2) add('count', 'le' + c + '_' + k,
        'it holds no more than ' + num(k) + ' ' + cn(c) + (k === 1 ? ' spore' : ' spores'),
        function (f) { return f.cc[c] <= k; });
    })(c, k);

    /* parity */
    for (c = 0; c < C; c++) (function (c) {
      add('parity', 'even' + c, 'it holds an even number of ' + cn(c) + ' spores',
        function (f) { return f.cc[c] % 2 === 0; });
      add('parity', 'odd' + c, 'it holds an odd number of ' + cn(c) + ' spores',
        function (f) { return f.cc[c] % 2 === 1; });
    })(c);

    /* tray size */
    for (k = world.minLen; k <= world.maxLen; k++) (function (k) {
      add('size', 'len' + k, 'it is exactly ' + num(k) + (k === 1 ? ' spore long' : ' spores long'),
        function (f) { return f.len === k; });
      if (k > world.minLen) add('size', 'lenge' + k, 'it is at least ' + num(k) + ' spores long',
        function (f) { return f.len >= k; });
      if (k < world.maxLen) add('size', 'lenle' + k, 'it is no more than ' + num(k) + (k === 1 ? ' spore long' : ' spores long'),
        function (f) { return f.len <= k; });
    })(k);
    add('size', 'lenEven', 'its length is even', function (f) { return f.len % 2 === 0; });
    add('size', 'lenOdd', 'its length is odd', function (f) { return f.len % 2 === 1; });

    /* position */
    for (c = 0; c < C; c++) (function (c) {
      add('position', 'first' + c, 'its leftmost spore is ' + cn(c), function (f) { return f.first === c; });
      add('position', 'last' + c, 'its rightmost spore is ' + cn(c), function (f) { return f.last === c; });
    })(c);
    add('position', 'endsSame', 'its leftmost and rightmost spores share a colour',
      function (f) { return f.first === f.last; });
    add('position', 'endsDiff', 'its leftmost and rightmost spores differ in colour',
      function (f) { return f.first !== f.last; });

    /* neighbours */
    add('neighbour', 'adjSame', 'two neighbouring spores somewhere share a colour',
      function (f) { return f.adjSameC; });
    add('neighbour', 'noAdjSame', 'no two neighbouring spores share a colour',
      function (f) { return !f.adjSameC; });
    for (c = 0; c < C; c++) for (d = 0; d < C; d++) (function (c, d) {
      var bit = 1 << (c * C + d);
      add('neighbour', 'adj' + c + '_' + d,
        c === d ? 'two ' + cn(c) + ' spores sit side by side'
                : an(c) + ' spore sits immediately left of ' + an(d) + ' spore',
        function (f) { return (f.adjPair & bit) !== 0; });
    })(c, d);

    /* comparison */
    for (c = 0; c < C; c++) for (d = 0; d < C; d++) if (c !== d) (function (c, d) {
      add('compare', 'more' + c + '_' + d,
        'it holds more ' + cn(c) + ' spores than ' + cn(d) + ' spores',
        function (f) { return f.cc[c] > f.cc[d]; });
    })(c, d);
    for (c = 0; c < C; c++) for (d = c + 1; d < C; d++) (function (c, d) {
      add('compare', 'same' + c + '_' + d,
        'it holds exactly as many ' + cn(c) + ' spores as ' + cn(d) + ' spores',
        function (f) { return f.cc[c] === f.cc[d]; });
    })(c, d);
    for (c = 0; c < C; c++) (function (c) {
      add('compare', 'maj' + c, cn(c) + ' is its single most common colour',
        function (f) { return f.majority === c; });
    })(c);

    /* variety */
    add('variety', 'allSame', 'all of its spores share one colour',
      function (f) { return f.distinctC === 1; });
    add('variety', 'allDiff', 'no two of its spores share a colour',
      function (f) { return f.distinctC === f.len; });
    for (k = 1; k <= C; k++) (function (k) {
      add('variety', 'dist' + k, 'exactly ' + num(k) + (k === 1 ? ' colour appears' : ' different colours appear') + ' in it',
        function (f) { return f.distinctC === k; });
      if (k >= 2) add('variety', 'distge' + k, 'at least ' + num(k) + ' different colours appear in it',
        function (f) { return f.distinctC >= k; });
    })(k);

    /* pattern */
    add('pattern', 'pal', 'its colours read the same left-to-right and right-to-left',
      function (f) { return f.pal; });
    add('pattern', 'nonDec', 'its colours never step backwards along the spectrum strip',
      function (f) { return f.nonDec; });
    add('pattern', 'nonInc', 'its colours never step forwards along the spectrum strip',
      function (f) { return f.nonInc; });
    for (k = 2; k <= Math.min(3, world.maxLen); k++) (function (k) {
      add('pattern', 'run' + k, num(k) + ' or more spores of one colour sit side by side in an unbroken run',
        function (f) { return f.runC >= k; });
    })(k);

    if (F > 1) {
      /* form */
      for (s = 0; s < F; s++) (function (s) {
        add('form', 'hasF' + s, 'it holds at least one ' + fnm(s),
          function (f) { return f.fc[s] > 0; });
        add('form', 'noF' + s, 'it holds no ' + fnm(s) + ' at all',
          function (f) { return f.fc[s] === 0; });
        add('form', 'evenF' + s, 'it holds an even number of ' + fnmP(s),
          function (f) { return f.fc[s] % 2 === 0; });
        add('form', 'firstF' + s, 'its leftmost spore is ' + afn(s),
          function (f) { return f.firstF === s; });
        for (k = 2; k <= 3; k++) (function (k) {
          add('form', 'geF' + s + '_' + k, 'it holds at least ' + num(k) + ' ' + fnmP(s),
            function (f) { return f.fc[s] >= k; });
        })(k);
        for (k = 1; k <= 2; k++) (function (k) {
          add('form', 'eqF' + s + '_' + k, 'it holds exactly ' + num(k) + ' ' + (k === 1 ? fnm(s) : fnmP(s)),
            function (f) { return f.fc[s] === k; });
        })(k);
      })(s);
      for (s = 0; s < F; s++) for (t2 = 0; t2 < F; t2++) if (s !== t2) (function (s, t2) {
        add('form', 'moreF' + s + '_' + t2, 'it holds more ' + fnmP(s) + ' than ' + fnmP(t2),
          function (f) { return f.fc[s] > f.fc[t2]; });
      })(s, t2);
      add('form', 'allSameF', 'all of its spores have the same form',
        function (f) { return f.distinctF === 1; });
      add('form', 'noAdjSameF', 'no two neighbouring spores share a form',
        function (f) { return !f.adjSameF; });
      add('form', 'adjSameF', 'two neighbouring spores somewhere share a form',
        function (f) { return f.adjSameF; });
      add('form', 'palF', 'its forms read the same left-to-right and right-to-left',
        function (f) { return f.palF; });

      /* colour & form */
      for (c = 0; c < C; c++) for (s = 0; s < F; s++) (function (c, s) {
        var bit = 1 << (c * F + s);
        add('link', 'cell' + c + '_' + s, 'it holds ' + article(cn(c)) + ' ' + cn(c) + ' ' + fnm(s),
          function (f) { return (f.cellMask & bit) !== 0; });
        add('link', 'pure' + c + '_' + s,
          'it holds ' + cn(c) + ' spores and every one of them is ' + afn(s),
          function (f) { return (f.pure & bit) !== 0; });
        add('link', 'never' + c + '_' + s, 'none of its ' + cn(c) + ' spores is ' + afn(s),
          function (f) { return (f.cellMask & bit) === 0; });
      })(c, s);
    }
    return A;
  }

  function article(w) { return /^[aeiou]/i.test(w) ? 'an' : 'a'; }
  var NUMW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];
  function num(k) { return NUMW[k] !== undefined ? NUMW[k] : String(k); }

  /* ---------- composites ---------- */
  /* Clauses share the subject "it", so a repeated "it " in the second half
     is dropped where English lets it go. */
  function trim2(a, b) {
    if (/^it (holds|is) /.test(a) && /^it (holds|is) /.test(b)) {
      var va = a.match(/^it (holds|is) /)[1], vb = b.match(/^it (holds|is) /)[1];
      if (va === vb) return b.replace(/^it (holds|is) /, '');
    }
    return b;
  }
  function joinAnd(a, b) {
    return { group: 'compound', kind: 'and', parts: [a, b], key: 'AND(' + a.key + ',' + b.key + ')',
      text: a.text + ', and ' + trim2(a.text, b.text),
      t: function (f) { return a.t(f) && b.t(f); } };
  }
  function joinOr(a, b) {
    return { group: 'compound', kind: 'or', parts: [a, b], key: 'OR(' + a.key + ',' + b.key + ')',
      text: 'either ' + a.text + ', or ' + b.text + ' — or both',
      t: function (f) { return a.t(f) || b.t(f); } };
  }
  function joinImplies(a, b) {
    return { group: 'compound', kind: 'implies', parts: [a, b], key: 'IMP(' + a.key + ',' + b.key + ')',
      text: 'whenever ' + a.text + ', ' + b.text,
      t: function (f) { return !a.t(f) || b.t(f); } };
  }
  function joinXor(a, b) {
    return { group: 'compound', kind: 'xor', parts: [a, b], key: 'XOR(' + a.key + ',' + b.key + ')',
      text: 'exactly one of these is true: ' + a.text + '; ' + b.text,
      t: function (f) { return a.t(f) !== b.t(f); } };
  }

  /* ---------- bitsets ---------- */
  function newBits(n) { return new Uint32Array((n + 31) >> 5); }
  function getBit(b, i) { return (b[i >> 5] >>> (i & 31)) & 1; }
  function setBit(b, i) { b[i >> 5] |= 1 << (i & 31); }

  function evalLaw(law, feats) {
    var n = feats.length, b = newBits(n), pos = 0;
    for (var i = 0; i < n; i++) if (law.t(feats[i])) { setBit(b, i); pos++; }
    return { bits: b, pos: pos };
  }

  function hashBits(b) {
    var h = 2166136261;
    for (var i = 0; i < b.length; i++) {
      h ^= b[i]; h = Math.imul(h, 16777619);
      h ^= b[i] >>> 16; h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  /* ---------- rank table ---------- */
  var W = {
    a: { C: 4, F: 1, minLen: 1, maxLen: 4 },  /* 340   */
    b: { C: 4, F: 1, minLen: 1, maxLen: 6 },  /* 5460  */
    c: { C: 4, F: 2, minLen: 1, maxLen: 4 },  /* 4680  */
    d: { C: 3, F: 3, minLen: 1, maxLen: 4 },  /* 7380  */
    e: { C: 5, F: 1, minLen: 1, maxLen: 4 }   /* 780   */
  };

  var COL = ['presence', 'count', 'parity', 'size', 'position', 'neighbour', 'compare', 'variety', 'pattern'];

  /* One new thing per rank: a group of properties, a colour, a second
     attribute, longer trays, or a new way of joining two statements. */
  var RANKS = [
    { n: 1,  title: 'Apprentice',   world: 'a', groups: ['presence', 'count', 'size'],
      forms: ['atom'], newGroups: ['presence', 'count', 'size'] },
    { n: 2,  title: 'Assistant',    world: 'a', groups: ['presence', 'count', 'size', 'position', 'variety'],
      forms: ['atom'], newGroups: ['position', 'variety'] },
    { n: 3,  title: 'Technician',   world: 'a', groups: COL,
      forms: ['atom'], newGroups: ['parity', 'neighbour', 'compare', 'pattern'] },
    { n: 4,  title: 'Analyst',      world: 'a', groups: COL,
      forms: ['atom', 'atom', 'and'], newGroups: [] },
    { n: 5,  title: 'Cartographer', world: 'e', groups: COL,
      forms: ['atom', 'and'], newGroups: [] },
    { n: 6,  title: 'Botanist',     world: 'c', groups: COL.concat(['form']),
      forms: ['atom'], newGroups: ['form'] },
    { n: 7,  title: 'Cultivator',   world: 'c', groups: COL.concat(['form', 'link']),
      forms: ['atom', 'and'], newGroups: ['link'] },
    { n: 8,  title: 'Surveyor',     world: 'b', groups: COL,
      forms: ['atom', 'and'], newGroups: [] },
    { n: 9,  title: 'Theorist',     world: 'c', groups: COL.concat(['form', 'link']),
      forms: ['and', 'or'], newGroups: [] },
    { n: 10, title: 'Lawgiver',     world: 'd', groups: COL.concat(['form', 'link']),
      forms: ['and', 'or'], newGroups: [] },
    { n: 11, title: 'Philosopher',  world: 'b', groups: COL,
      forms: ['and', 'or', 'implies'], newGroups: [] },
    { n: 12, title: 'Archivist',    world: 'c', groups: COL.concat(['form', 'link']),
      forms: ['and', 'or', 'implies', 'xor'], newGroups: [] }
  ];

  /* Genuinely new at this rank — tracked against everything the player has
     already met, so nothing is announced twice. */
  var ORD = ['', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh'];
  function rankNews(rank) {
    var now = rankSpec(rank), wn = W[now.world];
    if (rank <= 1) return ['Four colours, trays of one to four spores, and a law that is a single statement.'];
    var maxC = 0, maxF = 0, maxLen = 0, seenG = {}, seenJ = {}, everAtom = false;
    for (var r = 1; r < rank; r++) {
      var sp = rankSpec(r), w = W[sp.world];
      maxC = Math.max(maxC, w.C); maxF = Math.max(maxF, w.F); maxLen = Math.max(maxLen, w.maxLen);
      sp.groups.forEach(function (g) { seenG[g] = 1; });
      sp.forms.forEach(function (f) { if (f === 'atom') everAtom = true; else seenJ[f] = 1; });
    }
    var out = [];
    if (wn.C > maxC) out.push('A ' + ORD[wn.C] + ' colour joins the strip: ' + COLOURS[COLOUR_SUBSET[wn.C][wn.C - 1]].name + '.');
    if (wn.F > maxF) out.push(wn.F === 2
      ? 'Every spore now has a form as well as a colour — round or spike — and laws can speak about either.'
      : 'A third form, the crux, joins round and spike.');
    if (wn.maxLen > maxLen) out.push('Trays can now run to ' + num(wn.maxLen) + ' spores.');
    (now.groups || []).forEach(function (g) {
      if (!seenG[g]) out.push('Laws can now speak about ' + GROUPS[g].toLowerCase() + '.');
    });
    var join = { and: 'two statements joined by “and”', or: 'two statements joined by “or”',
                 implies: 'the shape “whenever A, B”', xor: 'the shape “exactly one of A and B”' };
    ['and', 'or', 'implies', 'xor'].forEach(function (k) {
      if (now.forms.indexOf(k) >= 0 && !seenJ[k]) out.push('A law may now take ' + join[k] + '.');
    });
    if (everAtom && now.forms.indexOf('atom') < 0 && rankSpec(rank - 1).forms.indexOf('atom') >= 0)
      out.push('From here the law is always two statements, never one.');
    if (!out.length) out.push('No new vocabulary — just a harder law in a world you already know.');
    return out;
  }

  function rankSpec(rank) {
    if (rank <= RANKS.length) return RANKS[rank - 1];
    /* endless: cycle the hard worlds with the full grammar */
    var pool = ['b', 'c', 'd', 'b', 'c'];
    var w = pool[(rank - RANKS.length - 1) % pool.length];
    return {
      n: rank, title: 'Archivist', world: w,
      groups: COL.concat(['form', 'link']),
      forms: ['and', 'or', 'implies', 'xor'], newGroups: [], endless: true
    };
  }

  /* ---------- puzzle construction ---------- */
  var LAW_BUDGET = 2600;      /* candidate laws considered per puzzle  */
  var MIN_RATE = 0.05, MAX_RATE = 0.62;      /* keep laws that bloom sometimes  */
  var SECRET_MIN = 0.10, SECRET_MAX = 0.50;  /* and pick the secret from the meat */

  function buildPuzzle(seed, rank, avoidKeys) {
    var spec = rankSpec(rank);
    var world = makeWorld(W[spec.world]);
    var rng = rngFrom(seed + '|r' + rank);
    var universe = enumerateUniverse(world);
    var feats = new Array(universe.length);
    for (var i = 0; i < universe.length; i++) feats[i] = features(universe[i], world);

    var atoms = buildAtoms(world).filter(function (a) { return spec.groups.indexOf(a.group) >= 0; });
    var atomBits = {};

    /* build the candidate pool in the shapes this rank allows */
    var pool = [], wantAtoms = spec.forms.indexOf('atom') >= 0;
    if (wantAtoms) pool = pool.concat(atoms);
    var joiners = [];
    spec.forms.forEach(function (k) {
      if (k === 'and') joiners.push(joinAnd);
      else if (k === 'or') joiners.push(joinOr);
      else if (k === 'implies') joiners.push(joinImplies);
      else if (k === 'xor') joiners.push(joinXor);
    });
    if (joiners.length) {
      var seen = {}, guard = 0, cap = LAW_BUDGET * 16;
      while (pool.length < LAW_BUDGET && guard < cap) {
        guard++;
        var a = rng.pick(atoms), b = rng.pick(atoms);
        if (a.key === b.key || subject(a) === subject(b)) continue;
        var law = rng.pick(joiners)(a, b);
        if (seen[law.key]) continue;
        seen[law.key] = 1;
        pool.push(law);
      }
    }

    /* evaluate, filter by bloom rate, drop degenerate compounds, dedupe */
    var n = universe.length, byHash = {}, laws = [];
    for (var p = 0; p < pool.length; p++) {
      var cand = pool[p];
      var ev = evalLaw(cand, feats);
      var rate = ev.pos / n;
      if (rate < MIN_RATE || rate > MAX_RATE) continue;
      /* a compound that behaves exactly like one of its own halves is not a
         compound — it just reads like one, which would be a lie to the player */
      if (cand.parts) {
        var degen = false;
        for (var d2 = 0; d2 < cand.parts.length; d2++) {
          var pk = cand.parts[d2].key;
          if (!atomBits[pk]) atomBits[pk] = evalLaw(cand.parts[d2], feats).bits;
          if (sameBits(ev.bits, atomBits[pk])) { degen = true; break; }
        }
        if (degen) continue;
      }
      var h = hashBits(ev.bits), dup = false;
      if (byHash[h] !== undefined) {
        for (var q = 0; q < byHash[h].length; q++) {
          if (sameBits(ev.bits, laws[byHash[h][q]].bits)) { dup = true; break; }
        }
      }
      if (dup) continue;
      cand.bits = ev.bits; cand.pos = ev.pos; cand.rate = rate;
      (byHash[h] = byHash[h] || []).push(laws.length);
      laws.push(cand);
    }

    /* choose the secret's shape the way the rank advertises it: a rank listing
       ['atom','atom','and'] wants an atom two thirds of the time */
    var wantCompound = joiners.length && (!wantAtoms || rng() < compoundShare(spec));
    var avoid = avoidKeys || [];
    function eligible(strict) {
      return laws.filter(function (l) {
        if (l.rate < SECRET_MIN || l.rate > SECRET_MAX) return false;
        if (strict && joiners.length && wantAtoms && (l.group === 'compound') !== wantCompound) return false;
        if (strict && avoid.indexOf(l.key) >= 0) return false;
        return true;
      });
    }
    var cands = eligible(true);
    if (cands.length < 3) cands = eligible(false);
    if (!cands.length) cands = laws;
    var secret = cands[rng.int(cands.length)];

    return {
      seed: seed, rank: rank, spec: spec, world: world,
      universe: universe, feats: feats, laws: laws,
      secretIndex: laws.indexOf(secret), secret: secret, rng: rng
    };
  }

  /* two atoms about the same thing make a dull conjunction */
  function subject(a) { return a.group + ':' + a.key.replace(/[0-9_].*$/, ''); }
  function compoundShare(spec) {
    var c = 0;
    spec.forms.forEach(function (k) { if (k !== 'atom') c++; });
    return c / spec.forms.length;
  }
  function sameBits(x, y) {
    for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
    return true;
  }

  /* ---------- a live investigation ---------- */
  function newInvestigation(puz) {
    var alive = new Uint8Array(puz.laws.length).fill(1);
    return {
      puz: puz, alive: alive, aliveCount: puz.laws.length,
      evidence: [], assays: 0, failedTrials: 0, hints: 0,
      startCount: puz.laws.length
    };
  }

  function trayIndex(puz, tray) {
    /* universe is enumerated in a fixed order: offset by length, then base-S */
    var S = puz.world.C * puz.world.F, off = 0;
    for (var len = puz.world.minLen; len < tray.length; len++) off += Math.pow(S, len);
    var n = 0;
    for (var i = 0; i < tray.length; i++) n = n * S + tray[i];
    return off + n;
  }

  function truth(puz, idx) { return getBit(puz.secret.bits, idx) === 1; }

  function prune(inv, idx, answer) {
    var laws = inv.puz.laws, killed = 0;
    for (var i = 0; i < laws.length; i++) {
      if (!inv.alive[i]) continue;
      if ((getBit(laws[i].bits, idx) === 1) !== answer) { inv.alive[i] = 0; killed++; }
    }
    inv.aliveCount -= killed;
    return killed;
  }

  /* how many survivors a tray would leave, per outcome */
  function splitAt(inv, idx) {
    var laws = inv.puz.laws, yes = 0;
    for (var i = 0; i < laws.length; i++) if (inv.alive[i] && getBit(laws[i].bits, idx)) yes++;
    return { yes: yes, no: inv.aliveCount - yes };
  }

  /* best worst-case split reachable over a sample of trays — the yardstick
     an assay is graded against */
  function bestSplit(inv, sampleSize, rng, exclude) {
    var U = inv.puz.universe.length, best = inv.aliveCount, bestIdx = -1;
    var step = (!sampleSize || sampleSize >= U) ? 1 : Math.max(1, Math.floor(U / sampleSize));
    var start = (rng && step > 1) ? rng.int(step) : 0;
    for (var i = start; i < U; i += step) {
      if (exclude && exclude[i] !== undefined) continue;
      var s = splitAt(inv, i);
      var worst = Math.max(s.yes, s.no);
      if (worst < best) { best = worst; bestIdx = i; }
    }
    return { worst: best, idx: bestIdx };
  }

  /* ---------- the opening pair ---------- */
  /* Two trays to start from, one that blooms and one that does not. They are
     kept short enough to read, and picked so they do not accidentally gut the
     candidate space before the player has run anything. */
  function openingTrays(puz, seedStr) {
    var rng = rngFrom(seedStr), w = puz.world, U = puz.universe.length;
    var laws = puz.laws, S = w.C * w.F;

    function sample(target, wantShort) {
      var lo = wantShort ? Math.min(2, w.maxLen) : w.minLen;
      var hi = wantShort ? Math.min(w.maxLen, 4) : w.maxLen;
      for (var k = 0; k < 4000; k++) {
        var len = lo + rng.int(hi - lo + 1), t = [];
        for (var c = 0; c < len; c++) t.push(rng.int(S));
        var i = trayIndex(puz, t);
        if (truth(puz, i) === target) return i;
      }
      var off = rng.int(U);
      for (var j = 0; j < U; j++) {
        var idx = (off + j) % U;
        if (truth(puz, idx) === target) return idx;
      }
      return -1;
    }
    function survivors(a, b) {
      var ta = truth(puz, a), tb = truth(puz, b), n = 0;
      for (var i = 0; i < laws.length; i++) {
        if ((getBit(laws[i].bits, a) === 1) === ta && (getBit(laws[i].bits, b) === 1) === tb) n++;
      }
      return n;
    }
    var best = null, bestN = -1;
    for (var tryN = 0; tryN < 18; tryN++) {
      var wantShort = tryN < 12;
      var a = sample(true, wantShort), b = sample(false, wantShort);
      if (a < 0 || b < 0 || a === b) continue;
      var n = survivors(a, b);
      if (n > bestN) { bestN = n; best = [a, b]; }
    }
    if (!best) {
      var a2 = sample(true, false), b2 = sample(false, false);
      best = [a2, b2].filter(function (x) { return x >= 0; });
    }
    return best;
  }

  /* ---------- the trial ---------- */
  /* Pick trays where the secret disagrees with as many survivors as
     possible, so anyone still holding a wrong law is caught out. */
  function buildTrial(inv, count, rng, exclude) {
    var puz = inv.puz, U = puz.universe.length;
    var survivors = [];
    for (var i = 0; i < puz.laws.length; i++) if (inv.alive[i] && i !== puz.secretIndex) survivors.push(i);

    /* Scan every tray when that is affordable, so a survivor that differs from
       the law on one obscure tray still gets caught by the trial that names it. */
    var fresh = [];
    for (var u0 = 0; u0 < U; u0++) if (!exclude || exclude[u0] === undefined) fresh.push(u0);
    if (fresh.length < count) fresh = [];
    for (var u1 = 0; fresh.length < count && u1 < U; u1++) fresh.push(u1);
    var scan = fresh;
    if (survivors.length * fresh.length > 4000000) {
      scan = fresh.slice();
      rng.shuffle(scan);
      scan = scan.slice(0, Math.max(1200, Math.floor(4000000 / Math.max(1, survivors.length))));
    }

    /* differ[k] = trays where survivor k disagrees with the law */
    var yesPool = [], noPool = [];
    var scored = new Array(scan.length);
    for (var s = 0; s < scan.length; s++) {
      var idx = scan[s], tv = getBit(puz.secret.bits, idx) === 1, dis = 0;
      for (var k = 0; k < survivors.length; k++) {
        if ((getBit(puz.laws[survivors[k]].bits, idx) === 1) !== tv) dis++;
      }
      scored[s] = { idx: idx, dis: dis, tv: tv };
      (tv ? yesPool : noPool).push(scored[s]);
    }
    var byDis = function (a, b) { return b.dis - a.dis || (a.idx - b.idx); };
    yesPool.sort(byDis); noPool.sort(byDis);

    /* Half blooms, half duds, so the answer sheet is never lopsided. Within
       each half, greedily take the tray that catches the most survivors not
       yet caught. */
    var wantYes = Math.min(yesPool.length, Math.max(1, Math.round(count / 2)));
    var wantNo = Math.min(noPool.length, count - wantYes);
    wantYes = Math.min(yesPool.length, count - wantNo);
    var caught = new Uint8Array(puz.laws.length), chosen = [];
    function take(pool, want) {
      var used = {};
      for (var n = 0; n < want; n++) {
        var best = -1, bestGain = -1;
        for (var p = 0; p < pool.length; p++) {
          if (used[p]) continue;
          var gain = 0, e = pool[p];
          for (var k2 = 0; k2 < survivors.length; k2++) {
            var li = survivors[k2];
            if (!caught[li] && (getBit(puz.laws[li].bits, e.idx) === 1) !== e.tv) gain++;
          }
          if (gain > bestGain) { bestGain = gain; best = p; }
          if (gain === survivors.length) break;
        }
        if (best < 0) break;
        used[best] = 1;
        var pick = pool[best];
        for (var k3 = 0; k3 < survivors.length; k3++) {
          var li3 = survivors[k3];
          if ((getBit(puz.laws[li3].bits, pick.idx) === 1) !== pick.tv) caught[li3] = 1;
        }
        chosen.push(pick.idx);
      }
    }
    take(yesPool, wantYes);
    take(noPool, wantNo);
    /* top up if a pool ran dry */
    var extra = yesPool.concat(noPool);
    for (var x = 0; chosen.length < count && x < extra.length; x++) {
      if (chosen.indexOf(extra[x].idx) < 0) chosen.push(extra[x].idx);
    }
    rng.shuffle(chosen);
    return chosen;
  }

  /* fraction of surviving wrong laws that the trial would catch */
  function trialSeverity(inv, trial) {
    var puz = inv.puz, survivors = [], caught = 0;
    for (var i = 0; i < puz.laws.length; i++) if (inv.alive[i] && i !== puz.secretIndex) survivors.push(i);
    if (!survivors.length) return 1;
    for (var k = 0; k < survivors.length; k++) {
      var li = survivors[k], bad = false;
      for (var t = 0; t < trial.length; t++) {
        var idx = trial[t];
        if ((getBit(puz.laws[li].bits, idx) === 1) !== (getBit(puz.secret.bits, idx) === 1)) { bad = true; break; }
      }
      if (bad) caught++;
    }
    return caught / survivors.length;
  }

  return {
    rngFrom: rngFrom, COLOURS: COLOURS, FORMS: FORMS, GROUPS: GROUPS,
    makeWorld: makeWorld, W: W, RANKS: RANKS, rankSpec: rankSpec, rankNews: rankNews,
    enumerateUniverse: enumerateUniverse, universeSize: universeSize,
    features: features, buildAtoms: buildAtoms, buildPuzzle: buildPuzzle,
    newInvestigation: newInvestigation, trayIndex: trayIndex, truth: truth,
    prune: prune, splitAt: splitAt, bestSplit: bestSplit,
    buildTrial: buildTrial, trialSeverity: trialSeverity, openingTrays: openingTrays,
    getBit: getBit, num: num
  };
})();
/* ==FALSIFY-CORE-END== */

<script>

  if (AC && AC.state === 'suspended') AC.resume();

  } else if (kind === 'win') {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone(f, t + i * 0.09, 0.9, 'triangle', 0.11); });

    tone(147, t + 0.16, 0.4, 'sine', 0.09, 110);
  } else if (kind === 'kill') {
    tone(1400, t, 0.07, 'square', 0.02, 900);
  }
}

var PATH = {

/* ---------------- bench ---------------- */

    if (S.tray.length >= w.maxLen) { toast('A tray holds at most ' + w.maxLen + ' spores.'); return; }

}

/* ---------------- evidence ---------------- */

/* ---------------- gauge ---------------- */

  var alive = S.inv.aliveCount, start = S.inv.startCount;

/* ---------------- verdict ---------------- */
function grade(yes, no) {
  var tot = yes + no, m = Math.min(yes, no);

  var b = m / (tot / 2);

  if (b >= 0.45) return { k: 'sharp', t: 'sharp' };

}

  var g = grade(split.yes, split.no), tot = split.yes + split.no;
  var pct = tot ? (split.yes / tot) * 100 : 50;
  var note;
  if (g.k === 'wasted') {
    note = 'Every law still standing already agreed about this tray. Nothing was ruled out — look for a tray they would argue over.';
  } else if (g.k === 'decisive') {
    note = 'A near-even question: whichever way it fell, half the field died.';
  } else if (g.k === 'lopsided') {
    note = 'Most laws already predicted this. A tray you feel less sure about cuts deeper.';
  } else {
    note = 'Of the ' + fmt(tot) + ' laws standing, ' + fmt(split.yes) + ' predicted a bloom.';
  }
  $('verdict').innerHTML =
    '<div class="vd ' + (bloomed ? 'yes' : 'no') + '">' +
      '<div class="head"><b>' + (bloomed ? 'Bloomed' : 'Inert') + '</b>' +
        '<span style="font-size:12px">' + (killed ? fmt(killed) + ' laws falsified' : 'no laws falsified') + '</span>' +
        '<span class="grade">' + g.t + '</span></div>' +
      '<div class="splitBar"><i style="width:' + pct + '%"></i><u style="left:calc(50% - 1px)"></u></div>' +
      '<div class="splitLbl"><span>' + fmt(split.yes) + ' said bloom</span><span>' + fmt(split.no) + ' said inert</span></div>' +
      '<div style="font-size:11.5px;margin-top:7px;color:var(--dim2);line-height:1.5">' + note + '</div>' +
    '</div>';
}

/* ---------------- assay ---------------- */
function runAssay() {
  if (S.over || !S.tray.length) return;
  var idx = K.trayIndex(S.puz, S.tray);
  if (S.used[idx] !== undefined) {
    toast('That tray is already on the board — change a spore.');
    flashEvidence(S.used[idx]);
    return;
  }
  var bloomed = K.truth(S.puz, idx);
  var split = K.splitAt(S.inv, idx);
  var killed = K.prune(S.inv, idx, bloomed);
  S.assays++;
  S.used[idx] = S.evidence.length;
  S.evidence.push({ idx: idx, yes: bloomed, from: 'assay' });

  var box = $('trayBox');
  box.classList.remove('anim-yes', 'anim-no', 'lit', 'dud');
  void box.offsetWidth;
  box.classList.add(bloomed ? 'anim-yes' : 'anim-no', bloomed ? 'lit' : 'dud');
  if (bloomed) {
    for (var r = 0; r < 3; r++) (function (r) {
      setTimeout(function () {
        var el = document.createElement('span');
        el.className = 'ring';
        box.appendChild(el);
        setTimeout(function () { el.remove(); }, 900);
      }, r * 150);
    })(r);
  }
  sfx(bloomed ? 'bloom' : 'dud');
  if (killed) setTimeout(function () { sfx('kill'); }, 320);

  showVerdict(bloomed, split, killed);
  renderGauge(killed);
  renderEvidence(S.evidence.length - 1);
  $('sAssay').textContent = S.assays;
  $('sScore').textContent = fmt(S.total + runScore());
  save();
  if (S.inv.aliveCount === 1) setTimeout(function () { toast('One law left standing. Claim it.'); }, 700);
}
function flashEvidence(n) {
  var el = document.querySelector('.evi[data-e="' + n + '"]');

  el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh');
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ---------------- scoring ---------------- */
function runScore() {
  var s = 1000 - 35 * S.assays - 250 * S.failedTrials - 120 * S.consults - 40 * S.sharps;
  return Math.max(50, s);
}

/* ---------------- rank ---------------- */
function startRank(rank, fresh) {
  $('loading').classList.add('on');
  setTimeout(function () {
    var avoid = S.lastLaws[rank] ? [S.lastLaws[rank]] : [];
    S.puz = K.buildPuzzle(S.seed, rank, avoid);
    S.inv = K.newInvestigation(S.puz);
    S.rank = rank; S.over = false;
    S.tray = []; S.sel = -1; S.form = 0; S.undo = [];
    S.evidence = []; S.used = {};
    S.assays = 0; S.consults = 0; S.sharps = 0; S.failedTrials = 0;

    if (fresh && fresh.ev && fresh.ev.length) {
      fresh.ev.forEach(function (e) {
        if (S.used[e[0]] !== undefined) return;
        S.used[e[0]] = S.evidence.length;
        S.evidence.push({ idx: e[0], yes: !!e[1], from: e[2] || 'assay' });
        K.prune(S.inv, e[0], !!e[1]);
        if ((e[2] || 'assay') === 'given') S.inv.startCount = S.inv.aliveCount;
      });
      S.assays = fresh.assays || 0; S.consults = fresh.consults || 0;
      S.sharps = fresh.sharps || 0; S.failedTrials = fresh.failedTrials || 0;
    } else {
      seedEvidence();
    }

    $('sRank').textContent = rank;
    $('sRankName').textContent = S.puz.spec.title.toLowerCase();
    $('sAssay').textContent = S.assays;
    $('sScore').textContent = fmt(S.total + runScore());
    $('verdict').innerHTML = '<div class="vd">Two trays are already on the board. Build one of your own and see what it does.</div>';
    renderPalette(); renderBench(); renderEvidence(); renderGauge(0);
    $('loading').classList.remove('on');
    save();
  }, 40);
}
function seedEvidence() {
  K.openingTrays(S.puz, S.seed + '|seed' + S.rank).forEach(function (i) {
    if (S.used[i] !== undefined) return;
    S.used[i] = S.evidence.length;
    S.evidence.push({ idx: i, yes: K.truth(S.puz, i), from: 'given' });
    K.prune(S.inv, i, K.truth(S.puz, i));
  });
  S.inv.startCount = S.inv.aliveCount;
}

/* ---------------- trial ---------------- */
function openTrial() {

  var rng = K.rngFrom(S.seed + '|t' + S.rank + '|' + S.assays + '|' + S.failedTrials);
  S.trial = K.buildTrial(S.inv, 5, rng, S.used).map(function (idx) { return { idx: idx, a: null }; });
  renderTrial();
}

    '<h2>The trial</h2>' +

        (alive > 6 ? ' — more than one of them, so this is a gamble.' : ', and they disagree about these trays.')) +
    '</div><div class="trialGrid">';
  S.trial.forEach(function (q, i) {
    var truth = K.truth(S.puz, q.idx);
    var cls = result ? (q.a === truth ? ' right' : ' wrong') : '';
    html += '<div class="tq' + cls + '" data-idx="' + q.idx + '"><span class="num mono">' + (i + 1) + '</span>' +
      '<span class="tray mid">' + S.puz.universe[q.idx].map(function (v) {
        return '<span class="spore">' + sporeHTML(v) + '</span>'; }).join('') + '</span>';
    if (result) {
      html += '<span class="picks"><span class="pick on" data-v="' + (truth ? 1 : 0) + '">' +
        (truth ? 'Bloomed' : 'Inert') + '</span></span>' +
        '<span class="mark">' + (q.a === truth ? '✓' : '✕') + '</span>';
    } else {
      html += '<span class="picks">' +
        '<button class="pick' + (q.a === true ? ' on' : '') + '" data-v="1" data-q="' + i + '">Bloom</button>' +
        '<button class="pick' + (q.a === false ? ' on' : '') + '" data-v="0" data-q="' + i + '">Inert</button>' +
        '</span>';
    }

  });
  html += '</div>';
  html += boardRef();

    var done = S.trial.every(function (q) { return q.a !== null; });
    html += '<div class="btnRow"><button class="btn trial" id="tSubmit"' + (done ? '' : ' disabled') + '>' +
      (done ? 'Submit the trial' : 'Answer all five') + '</button>' +

  $('ov').classList.add('on');
}
function boardRef() {
  /* the trial covers the board, so bring the board along */

    var rows = S.evidence.filter(function (e) { return e.yes === yes; }).map(function (e) {
      return '<div class="tray small" style="margin:3px 0">' + S.puz.universe[e.idx].map(function (v) {
        return '<span class="spore">' + sporeHTML(v) + '</span>'; }).join('') + '</div>';
    });
    return '<div><div class="lbl" style="color:' + (yes ? 'var(--bloom)' : 'var(--dim2)') + '">' +
      (yes ? 'bloomed' : 'inert') + ' · ' + rows.length + '</div>' +
      (rows.join('') || '<div class="emptyNote">none</div>') + '</div>';
  }
  return '<details style="margin-top:4px"><summary style="cursor:pointer;color:var(--dim);font-size:12.5px;' +
    'padding:8px 0;list-style:none">▸ my board (' + S.evidence.length + ' trays)</summary>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:8px 2px 2px;' +

function submitTrial() {
  var wrong = [];
  S.trial.forEach(function (q) { if (q.a !== K.truth(S.puz, q.idx)) wrong.push(q); });
  renderTrial(true);
  if (!wrong.length) { sfx('win'); setTimeout(function () { winRank(false); }, 1100); return; }
  sfx('fail');
  S.failedTrials++;
  wrong.forEach(function (q) {
    if (S.used[q.idx] !== undefined) return;
    S.used[q.idx] = S.evidence.length;
    S.evidence.push({ idx: q.idx, yes: K.truth(S.puz, q.idx), from: 'trial' });
    K.prune(S.inv, q.idx, K.truth(S.puz, q.idx));
  });
  renderEvidence(); renderGauge(0);
  $('sScore').textContent = fmt(S.total + runScore());
  save();
  var card = $('ovCard');
  card.insertAdjacentHTML('beforeend',
    '<div class="vd no" style="margin-top:6px"><b style="color:var(--warn)">' + wrong.length + ' of 5 misread.</b> ' +
    'Those trays have been added to your board — they are the ones your idea got wrong. ' +
    fmt(S.inv.aliveCount) + ' laws still stand.</div>' +
    '<div class="btnRow" style="margin-top:14px"><button class="btn primary" data-close="1">Back to the bench</button></div>');
}

/* ---------------- winning ---------------- */
function winRank(proven) {
  S.over = true;
  sfx('win');
  var earned = runScore() + (proven ? 400 : 0);
  S.total += earned;
  S.codex[S.puz.secret.key] = { rank: S.rank, text: S.puz.secret.text, title: S.puz.spec.title };
  S.lastLaws[S.rank] = S.puz.secret.key;
  var prev = S.best[S.rank];

  var next = S.rank + 1, nspec = K.rankSpec(next);
  $('ovCard').innerHTML =
    '<h2>' + (proven ? 'Proven' : 'Certified') + '</h2>' +
    '<div class="sub">' + (proven
      ? 'You cut the field to a single law and never needed the trial.'
      : 'Five unseen trays, five correct calls. You have the law.') + '</div>' +
    '<div class="lawCard"><div class="k">Rank ' + S.rank + ' · ' + S.puz.spec.title + '</div>' +
      '<div class="t">A tray blooms exactly when <b>' + S.puz.secret.text + '</b>.</div></div>' +
    '<div class="stats2">' +
      st(S.assays, 'assays') + st(S.failedTrials, 'failed trials') +
      st(fmt(earned), 'earned' + (isBest ? ' ★' : '')) + st(fmt(S.total), 'total') +
      st(S.puz.secret.rate ? Math.round(S.puz.secret.rate * 100) + '%' : '—', 'of trays bloom') +
    '</div>' +
    '<div class="lawCard" style="border-color:var(--edge2);background:rgba(255,255,255,.03)">' +
      '<div class="k" style="color:var(--dim2)">Next — rank ' + next + ' · ' + nspec.title + '</div>' +
      '<div style="font-size:13px;color:var(--dim);line-height:1.6">' + rankBlurb(nspec) + '</div>' +
      '<ul style="margin:9px 0 0 17px;padding:0;font-size:13px;line-height:1.65">' +
      K.rankNews(next).map(function (x) { return '<li style="margin-bottom:2px">' + x + '</li>'; }).join('') +
      '</ul></div>' +
    '<div class="btnRow" style="margin-top:18px">' +
      '<button class="btn primary" id="wNext">Take rank ' + next + '</button>' +
      '<button class="btn" id="wRetry">Replay this rank</button>' +
      '<button class="btn" id="wCodex">Codex</button></div>';
  $('ov').classList.add('on');
  save();
}
function st(v, l) { return '<div class="st"><b class="mono">' + v + '</b><span>' + l + '</span></div>'; }
function rankBlurb(spec) {
  var w = K.W[spec.world], bits = [];
  bits.push(K.num(w.C) + ' colours');
  if (w.F > 1) bits.push(K.num(w.F) + ' forms');
  bits.push('trays of one to ' + K.num(w.maxLen) + ' spores');
  var shapes = spec.forms.filter(function (f) { return f !== 'atom'; });
  var sh;
  if (!shapes.length) sh = 'The law is a single statement';
  else if (spec.forms.indexOf('atom') >= 0) sh = 'The law is one statement, or two joined by ' + joinList(shapes);
  else sh = 'The law always joins two statements, with ' + joinList(shapes);
  return bits.join(', ') + '. ' + sh + '.';
}
function joinList(a) {
  var m = { and: '“and”', or: '“or”', implies: '“whenever”', xor: '“exactly one of”' };
  a = a.map(function (x) { return m[x] || x; });
  return a.length < 2 ? a[0] : a.slice(0, -1).join(', ') + ' or ' + a[a.length - 1];
}

    '<div class="sub" style="margin:0">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> add a colour · ' +
      '<span class="kbd">Q</span><span class="kbd">W</span><span class="kbd">E</span> pick a form · ' +
      '<span class="kbd">↵</span> run · <span class="kbd">⌫</span> delete · ' +
      '<span class="kbd">R</span> random · <span class="kbd">Z</span> undo · <span class="kbd">C</span> clear</div>' +
    '<div class="btnRow" style="margin-top:18px"><button class="btn primary" data-close="1">Start</button></div>';
  $('ov').classList.add('on');
  S.seenHelp = true; save();
}
function openGuide() {
  var spec = S.puz.spec, w = S.puz.world;
  var seen = {};
  var atoms = K.buildAtoms(w).filter(function (a) { return spec.groups.indexOf(a.group) >= 0; });
  var byGroup = {};
  atoms.forEach(function (a) { (byGroup[a.group] = byGroup[a.group] || []).push(a); });
  var rng = K.rngFrom(S.seed + '|g' + S.rank);
  var items = spec.groups.filter(function (g) { return byGroup[g]; }).map(function (g) {
    var ex = byGroup[g][rng.int(byGroup[g].length)];
    var isNew = (spec.newGroups || []).indexOf(g) >= 0;
    return '<div class="gitem' + (isNew ? ' new' : '') + '"><b>' + K.GROUPS[g] + '</b><span>“…' + ex.text + '”</span></div>';
  }).join('');
  $('ovCard').innerHTML =
    '<button class="close" data-close="1">×</button>' +
    '<h2>Field guide — rank ' + S.rank + ', ' + spec.title + '</h2>' +
    '<div class="sub">' + rankBlurb(spec) + ' Every law here blooms for somewhere between 5% and 62% of all possible trays, so neither “always” nor “never” is ever the answer.</div>' +
    '<div class="lawCard"><div class="k">New at this rank</div><ul style="margin:2px 0 0 17px;padding:0;font-size:13.5px;line-height:1.65">' +
      K.rankNews(S.rank).map(function (x) { return '<li style="margin-bottom:2px">' + x + '</li>'; }).join('') + '</ul></div>' +
    '<div class="lawCard" style="border-color:var(--edge2);background:rgba(255,255,255,.03)">' +
      '<div class="k" style="color:var(--dim2)">Spectrum strip, in order</div>' +
      '<div class="tray mid" style="margin-top:4px">' + w.colours.map(function (c, i) {
        return '<span class="spore" title="' + c.name + '">' + sporeSVG(c.hex, 0) + '</span>'; }).join('') +
      '</div><div style="font-size:11.5px;color:var(--dim2);margin-top:8px">' +
      w.colours.map(function (c) { return c.name; }).join(' · ') +
      ' — laws about colours “stepping forwards or backwards” mean along this strip.</div></div>' +
    '<div class="sub" style="margin:16px 0 0">What the laws at this rank can talk about:</div>' +
    '<div class="gg">' + items + '</div>' +
    '<div class="btnRow" style="margin-top:18px"><button class="btn primary" data-close="1">Back to the bench</button></div>';
  $('ov').classList.add('on');
}
function openCodex() {
  var keys = Object.keys(S.codex);
  keys.sort(function (a, b) { return S.codex[a].rank - S.codex[b].rank; });
  $('ovCard').innerHTML =
    '<button class="close" data-close="1">×</button>' +
    '<h2>Codex — ' + keys.length + ' law' + (keys.length === 1 ? '' : 's') + ' recorded</h2>' +
    '<div class="sub">Every law you have pinned down, in the order you found them.</div>' +
    (keys.length ? '<div class="codexList">' + keys.map(function (k) {
      var c = S.codex[k];
      return '<div class="cx"><i>R' + c.rank + '</i><span>A tray blooms exactly when ' + c.text + '.</span></div>';
    }).join('') + '</div>' : '<div class="emptyNote">Nothing recorded yet. Pass a rank and the law lands here.</div>') +
    '<div class="btnRow" style="margin-top:18px">' +
      '<button class="btn primary" data-close="1">Back</button>' +
      '<button class="btn" id="cxReset">Start over</button></div>';
  $('ov').classList.add('on');
}
function openMenu() {
  $('ovCard').innerHTML =
    '<button class="close" data-close="1">×</button>' +
    '<h2>Menu</h2><div class="menuList">' +
      '<button id="mGuide">Field guide<span>What this rank\'s laws can talk about</span></button>' +
      '<button id="mCodex">Codex<span>' + Object.keys(S.codex).length + ' laws recorded</span></button>' +
      '<button id="mHelp">How to play</button>' +
      '<button id="mShare">Share this seed<span>' + S.seed + '</span></button>' +
      '<button id="mSound">Sound: ' + (S.sound ? 'on' : 'off') + '</button>' +
    '</div>';
  $('ov').classList.add('on');
}
function closeOv() { $('ov').classList.remove('on'); }

/* ---------------- hints ---------------- */
function sharpen() {
  if (S.over) return;
  var b = K.bestSplit(S.inv, 900, K.rngFrom(S.seed + '|s' + S.assays + S.sharps), S.used);
  if (b.idx < 0) { toast('No tray on the bench divides the survivors any further.'); return; }
  S.sharps++;
  setTray(S.puz.universe[b.idx].slice());
  var sp = K.splitAt(S.inv, b.idx);
  toast('Loaded a tray that splits the field ' + fmt(sp.yes) + ' / ' + fmt(sp.no) + '.');
  $('sScore').textContent = fmt(S.total + runScore());
  save();
}
function consult() {
  if (S.over) return;
  var alive = [];
  for (var i = 0; i < S.puz.laws.length; i++) if (S.inv.alive[i]) alive.push(i);
  if (!alive.length) return;
  S.consults++;
  var rng = K.rngFrom(S.seed + '|c' + S.rank + '|' + S.consults + '|' + S.assays);
  var pick = S.puz.laws[alive[rng.int(alive.length)]];
  $('ovCard').innerHTML =
    '<button class="close" data-close="1">×</button>' +
    '<h2>Consulted</h2>' +
    '<div class="sub">One of the ' + fmt(alive.length) + ' laws that still fits every tray on your board. ' +
      (alive.length > 1 ? 'It may or may not be the one.' : 'It is the only one left — it is the law.') + '</div>' +
    '<div class="lawCard"><div class="k">a surviving candidate</div>' +
      '<div class="t">A tray blooms exactly when <b>' + pick.text + '</b>.</div></div>' +
    '<div class="btnRow" style="margin-top:10px"><button class="btn primary" data-close="1">Back to the bench</button></div>';
  $('ov').classList.add('on');
  $('sScore').textContent = fmt(S.total + runScore());
  save();
}

/* ---------------- misc ---------------- */
var toastT;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.classList.remove('on'); }, 2600);
}
function randomTray() {
  var w = S.puz.world, t = [];
  for (var attempt = 0; attempt < 40; attempt++) {
    var len = w.minLen + Math.floor(Math.random() * (w.maxLen - w.minLen + 1));
    t = [];
    for (var i = 0; i < len; i++) t.push(Math.floor(Math.random() * w.C * w.F));
    if (S.used[K.trayIndex(S.puz, t)] === undefined) break;
  }
  setTray(t);
  sfx('tick');
}

/* ---------------- events ---------------- */
function wire() {
  $('palette').addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]'); if (b) addCell(+b.dataset.c);
  });
  $('forms').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]'); if (b) setForm(+b.dataset.f);
  });
  $('trayBox').addEventListener('click', function (e) {
    var d = e.target.closest('[data-del]');
    if (d) { pushUndo(); S.tray.splice(+d.dataset.del, 1); S.sel = -1; renderBench(); sfx('tick'); return; }
    var s = e.target.closest('[data-i]');
    if (s) { var i = +s.dataset.i; S.sel = (S.sel === i ? -1 : i); renderBench(); return; }
    S.sel = -1; renderBench();
  });
  $('evidence').addEventListener('click', function (e) {
    var v = e.target.closest('[data-e]'); if (!v) return;
    var ev = S.evidence[+v.dataset.e];
    setTray(S.puz.universe[ev.idx].slice());
    toast('Copied to the bench — now change one spore.');
    if (window.innerWidth <= 900) $('bench').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('bRun').addEventListener('click', runAssay);
  $('bClear').addEventListener('click', function () { setTray([]); });
  $('bRand').addEventListener('click', randomTray);
  $('bUndo').addEventListener('click', function () {
    if (!S.undo.length) return;
    S.tray = S.undo.pop(); S.sel = -1; renderBench();
  });
  $('bTrial').addEventListener('click', openTrial);
  $('bSharp').addEventListener('click', sharpen);
  $('bConsult').addEventListener('click', consult);
  $('bHelp').addEventListener('click', openHelp);
  $('bMenu').addEventListener('click', openMenu);
  $('bJump').addEventListener('click', function () {
    $('evidence').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('bGuide').addEventListener('click', openGuide);
  $('bCodex').addEventListener('click', openCodex);
  $('bSound').addEventListener('click', toggleSound);
  function toggleSound() {
    S.sound = !S.sound;
    $('bSound').style.color = S.sound ? '' : 'var(--dim2)';
    $('bSound').textContent = S.sound ? '♪' : '♪̶';
    if (S.sound) sfx('tick');
    save();
  }
  $('bShare').addEventListener('click', shareSeed);
  function shareSeed() {
    var url = location.origin + location.pathname + '?seed=' + encodeURIComponent(S.seed) + '&rank=' + S.rank;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Link copied — same laws, same order.'); },
      function () { toast(url); });
    else toast(url);
  }
  $('ov').addEventListener('click', function (e) {
    if (e.target.id === 'mGuide') { openGuide(); return; }
    if (e.target.id === 'mCodex') { openCodex(); return; }
    if (e.target.id === 'mHelp') { openHelp(); return; }
    if (e.target.id === 'mShare') { shareSeed(); closeOv(); return; }
    if (e.target.id === 'mSound') { toggleSound(); openMenu(); return; }
    if (e.target.closest('[data-close]') || e.target.classList.contains('scrim')) { closeOv(); return; }
    var p = e.target.closest('[data-q]');
    if (p) { S.trial[+p.dataset.q].a = p.dataset.v === '1'; sfx('tick'); renderTrial(); return; }
    if (e.target.id === 'tSubmit') { submitTrial(); return; }
    if (e.target.id === 'wNext') { closeOv(); startRank(S.rank + 1); return; }
    if (e.target.id === 'wRetry') { closeOv(); startRank(S.rank); return; }
    if (e.target.id === 'wCodex') { openCodex(); return; }
    if (e.target.id === 'cxReset') {
      if (confirm('Wipe your codex, score and rank, and start from rank 1?')) {
        try { localStorage.removeItem(SAVE); } catch (err) {}
        location.href = location.origin + location.pathname;
      }
      return;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ($('ov').classList.contains('on')) {
      if (e.key === 'Escape') closeOv();
      return;
    }
    var w = S.puz ? S.puz.world : null; if (!w) return;
    var k = e.key.toLowerCase();
    if (k >= '1' && k <= '9') { var n = +k - 1; if (n < w.C) { addCell(n); e.preventDefault(); } return; }
    var fi = 'qwe'.indexOf(k);
    if (fi >= 0 && fi < w.F) { setForm(fi); e.preventDefault(); return; }
    if (e.key === 'Enter') { runAssay(); e.preventDefault(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') {
      if (!S.tray.length) return;
      pushUndo();
      S.tray.splice(S.sel >= 0 ? S.sel : S.tray.length - 1, 1);
      S.sel = -1; renderBench(); sfx('tick'); e.preventDefault(); return;
    }
    if (k === 'r') { randomTray(); return; }
    if (k === 'c') { setTray([]); return; }
    if (k === 'z') { if (S.undo.length) { S.tray = S.undo.pop(); S.sel = -1; renderBench(); } return; }
    if (k === 't') { openTrial(); return; }
  });
}

/* ---------------- boot ---------------- */
function boot() {
  var q = new URLSearchParams(location.search);
  var saved = load();
  /* settings and the codex belong to the player, not to the link they opened */
  if (saved) {
    S.total = saved.total || 0; S.sound = saved.sound !== false;
    S.seenHelp = !!saved.seenHelp; S.codex = saved.codex || {};
    S.best = saved.best || {}; S.lastLaws = saved.lastLaws || {};
  }
  S.seed = q.get('seed') || (saved && saved.seed) || Math.random().toString(36).slice(2, 8);
  var rank = +(q.get('rank') || (saved && !q.get('seed') ? saved.rank : 1) || 1);
  if (!(rank >= 1)) rank = 1;
  if (!S.sound) { $('bSound').style.color = 'var(--dim2)'; $('bSound').textContent = '♪̶'; }
  wire();
  var resume = (saved && !q.get('seed') && !q.get('rank') && saved.rank === rank && saved.run) ? saved.run : null;
  startRank(rank, resume);
  if (!S.seenHelp) setTimeout(openHelp, 500);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
<script src="../logo.js" data-position="bottom-right"></script>
</body>
