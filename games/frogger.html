<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Frog Crossing — a Frogger</title>
    <meta name="description" content="A frog's way home on a rainy spring night: hop across five lanes of headlights and a river of logs and diving turtles into the lily pads. A Frogger for phone and desktop.">
    <meta name="theme-color" content="#0a1017">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --sign: #f5c400; --ink: #101114; --txt: #eef2f6; --dim: #a9b5c2; --boardw: 390px; --cell: 43px; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #070b11; overflow: hidden; color: var(--txt);
            font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

        /* HUD: a plate across the top of the crossing */
        #hud { position: fixed; left: 50%; top: 0; transform: translateX(-50%); z-index: 3; display: grid;
            grid-template-columns: 1fr auto 1fr; grid-template-rows: 1fr auto; align-items: center; column-gap: 8px;
            padding: max(6px, env(safe-area-inset-top)) 12px 8px; background: linear-gradient(#0b1119, #0a1017e8);
            border-bottom: 1px solid #ffffff12; border-radius: 0 0 14px 14px; transition: opacity .3s; }
        #hud.card { border-radius: 14px 14px 0 0; border: 1px solid #ffffff10; border-bottom: 0; }
        .stat { display: flex; flex-direction: column; line-height: 1; }
        .lab { font-size: 13px; font-weight: 700; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
        #score { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
        .nightw { display: flex; align-items: center; gap: 4px; }
        .diamond { width: 42px; height: 42px; position: relative; display: grid; place-items: center; flex: none; }
        .diamond::before { content: ""; position: absolute; inset: 6px; background: var(--sign); transform: rotate(45deg); border-radius: 4px;
            box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 3.5px var(--ink); }
        .diamond b { position: relative; font-weight: 800; color: var(--ink); font-size: 21px; line-height: 1; }
        #night { transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
        .right { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
        #lives { display: flex; gap: 2px; min-height: 22px; }
        .life { display: block; width: 29px; height: 29px; transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .35s; }
        .life svg { width: 100%; height: 100%; display: block; }
        .life.born { transform: scale(0); } .life.gone { transform: scale(1.6) translateY(-6px); opacity: 0; }
        .iconbtn { width: 42px; height: 42px; border-radius: 11px; border: 1.5px solid #ffffff26; background: #ffffff0a; display: grid; place-items: center; padding: 0; }
        .iconbtn:active { transform: scale(.94); background: #ffffff18; }
        .iconbtn i { display: block; width: 4px; height: 15px; background: var(--txt); border-radius: 1px; box-shadow: 7px 0 0 var(--txt); margin-left: -7px; }
        #timer { grid-column: 1 / -1; display: flex; align-items: center; gap: 7px; margin-top: 6px; }
        #timer svg { width: 14px; height: 14px; flex: none; }
        #timer span { flex: 1; height: 9px; border-radius: 5px; background: #ffffff14; overflow: hidden; }
        #timebar { display: block; height: 100%; background: var(--sign); border-radius: 4px; transform-origin: left; transition: background-color .3s; }
        #timer.mid #timebar { background: #ff9a1f; } #timer.low #timebar { background: #ff4a3d; animation: pulse .5s infinite alternate; }
        #timer.mid svg *, #timer.low svg *, #timer.flash svg * { stroke: #ff7a3d; }
        #timer.flash span { box-shadow: 0 0 0 2px #ff4a3d; animation: pulse .2s 4 alternate; }
        @keyframes pulse { to { opacity: .45; } }
        body.titled #hud .stat, body.titled #hud .right #lives, body.titled #timer { opacity: .0; }

        /* cards */
        .card-wrap { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none; padding: 16px; }
        .card-wrap > * { opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .28s ease, transform .4s cubic-bezier(.2,1.2,.4,1); }
        .card-wrap.on { pointer-events: auto; } .card-wrap.on > * { opacity: 1; transform: none; }
        #title { pointer-events: none !important; place-items: end center; padding-bottom: calc(var(--cell) * 3.6); }
        .signpost { display: flex; flex-direction: column; align-items: center; gap: 0; filter: drop-shadow(0 10px 22px #000a); }
        .bigdiamond { width: 132px; height: 132px; position: relative; display: grid; place-items: center; }
        .bigdiamond::before { content: ""; position: absolute; inset: 19px; background: var(--sign); transform: rotate(45deg); border-radius: 10px;
            box-shadow: inset 0 0 0 4px var(--sign), inset 0 0 0 8px var(--ink); }
        .bigdiamond svg { position: relative; width: 56px; height: 56px; }
        .plate { background: var(--sign); color: var(--ink); border-radius: 7px; padding: 6px 18px 3px; margin-top: -4px; box-shadow: inset 0 0 0 3px var(--sign), inset 0 0 0 5.5px var(--ink);
            font-weight: 800; font-size: 30px; letter-spacing: .06em; line-height: 1.05; text-align: center; }
        .post { width: 8px; height: 26px; background: linear-gradient(90deg, #5b636c, #9aa2ab, #5b636c); }
        .prompt { margin-top: 14px; font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--sign); border-radius: 99px; padding: 7px 20px 5px; box-shadow: 0 4px 0 #a88300, 0 8px 24px #0008;
            display: flex; align-items: center; gap: 8px; animation: breathe 1.8s ease-in-out infinite; }
        .prompt kbd { font: inherit; border: 2px solid var(--ink); border-radius: 6px; padding: 0 8px; }
        @keyframes breathe { 50% { transform: scale(1.06); } }
        .best { margin-top: 6px; font-size: 16px; font-weight: 600; letter-spacing: .12em; color: #d6dee8; text-transform: uppercase; background: #0a1017cc; border-radius: 99px; padding: 4px 12px 2px; display: none; }
        #title.hasbest .best { display: block; }
        .touchonly { display: none; } body.touch .touchonly { display: inline; } body.touch .keysonly { display: none; }

        .panel { width: min(330px, 100%); background: #0c121af2; border: 1px solid #ffffff1c; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px #000c; text-align: center; }
        .panel header { background: var(--sign); color: var(--ink); font-weight: 800; letter-spacing: .14em; font-size: 20px; padding: 10px 12px 7px; text-transform: uppercase; box-shadow: inset 0 -3px 0 var(--ink); }
        .panel .big { font-size: 64px; font-weight: 800; line-height: 1; margin: 18px 0 2px; font-variant-numeric: tabular-nums; }
        .panel .sub { color: var(--dim); font-weight: 700; letter-spacing: .2em; font-size: 13px; text-transform: uppercase; }
        .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); margin: 18px 16px 6px; border-top: 1px solid #ffffff14; }
        .grid3 div { padding: 12px 0 2px; } .grid3 b { display: block; font-size: 26px; font-weight: 800; } .grid3 span { color: var(--dim); font-size: 12px; letter-spacing: .18em; font-weight: 700; text-transform: uppercase; }
        .stamp { display: none; position: absolute; right: 12px; top: 52px; transform: rotate(8deg); font-size: 15px !important; background: #0c121a; border: 3px solid var(--sign); color: var(--sign); border-radius: 6px; padding: 2px 8px 0; font-weight: 800; letter-spacing: .1em; font-size: 18px; }
        #over.newbest .stamp { display: block; animation: stamp .45s .25s cubic-bezier(.2,1.6,.4,1) both; }
        @keyframes stamp { from { transform: rotate(8deg) scale(2.2); opacity: 0; } }
        .panel { position: relative; }
        .go { display: block; width: calc(100% - 32px); margin: 14px 16px 10px; padding: 14px 0 11px; border: 0; border-radius: 11px; background: var(--sign); color: var(--ink);
            font-weight: 800; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 4px 0 #a88300; }
        .go:active { transform: translateY(3px); box-shadow: 0 1px 0 #a88300; }
        .go:focus-visible, .iconbtn:focus-visible, .mute:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        .foot { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 14px; font-size: 15px; font-weight: 600; letter-spacing: .06em; color: var(--dim); }
        .foot a { color: var(--dim); text-decoration: none; } .foot a:hover { color: #fff; }
        .mute { background: none; border: 0; color: var(--dim); font-weight: 700; letter-spacing: .06em; font-size: 15px; padding: 6px 0; display: flex; gap: 6px; align-items: center; }
        .mute[aria-pressed="true"] { color: #ff8f7a; } .mute .cross { display: none; } .mute[aria-pressed="true"] .cross { display: inline; } .mute[aria-pressed="true"] .wave { display: none; }
        #title .mute { pointer-events: auto; margin-top: 8px; gap: 6px; color: #c9d3de; background: #0a1017cc; border-radius: 99px; padding: 5px 14px 3px; }

        #nightcard { pointer-events: none !important; }
        #nightcard .bigdiamond { width: 180px; height: 180px; } #nightcard .bigdiamond::before { inset: 26px; }
        #nightcard .bigdiamond div { position: relative; color: var(--ink); text-align: center; line-height: .9; }
        #nightcard small { display: block; font-weight: 800; letter-spacing: .14em; font-size: 18px; }
        #nightcard strong { font-size: 58px; font-weight: 800; }
        .bonus { margin-top: 4px; background: #0c121ae6; color: #fff2b0; border-radius: 99px; padding: 5px 14px 3px; font-weight: 800; letter-spacing: .08em; font-size: 18px; text-transform: uppercase; }

        @media (prefers-reduced-motion: reduce) { .card-wrap > *, .life { transition: opacity .2s; transform: none !important; } .prompt, #timer.low #timebar { animation: none; } #over.newbest .stamp { animation: none; } }
        @media (max-width: 380px) { #score { font-size: 28px; } .diamond { width: 38px; height: 38px; } .life { width: 19px; height: 19px; } }
    </style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="cv" aria-label="Frog Crossing game board"></canvas>
<template id="frogsvg"><svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-6.5 3.5 Q-11 8 -6 10.5 M6.5 3.5 Q11 8 6 10.5" stroke="#0f220d" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M-6.5 3.5 Q-11 8 -6 10.5 M6.5 3.5 Q11 8 6 10.5" stroke="#93d64e" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="1" rx="6.5" ry="7.5" fill="#a6e35a" stroke="#0f220d" stroke-width="1.4"/><circle cx="-3.8" cy="-5.4" r="3" fill="#f2c24a" stroke="#0f220d" stroke-width="1.2"/><circle cx="3.8" cy="-5.4" r="3" fill="#f2c24a" stroke="#0f220d" stroke-width="1.2"/><circle cx="-3.8" cy="-5.5" r="1.4" fill="#121d0c"/><circle cx="3.8" cy="-5.5" r="1.4" fill="#121d0c"/></svg></template>

<div id="hud">
    <div class="stat"><span class="lab">Score</span><span id="score">0</span></div>
    <div class="nightw"><span class="lab">Night</span><div class="diamond"><b id="night">1</b></div></div>
    <div class="right"><div id="lives" aria-label="Spare frogs"></div><button class="iconbtn" id="pausebtn" aria-label="Pause"><i></i></button></div>
    <div id="timer" aria-hidden="true"><svg viewBox="0 0 14 14"><circle cx="7" cy="7.8" r="5.2" fill="none" stroke="#f5c400" stroke-width="1.8"/><path d="M7 7.8V5" stroke="#f5c400" stroke-width="1.8" stroke-linecap="round"/><path d="M5.2 1.3h3.6" stroke="#f5c400" stroke-width="1.8" stroke-linecap="round"/></svg><span><b id="timebar"></b></span></div>
</div>

<div class="card-wrap" id="title">
    <div class="signpost">
        <div class="bigdiamond"><svg viewBox="-20 -20 40 40" aria-hidden="true"><g fill="#101114"><ellipse cx="0" cy="3" rx="8.5" ry="10"/><circle cx="-5.5" cy="-7" r="4"/><circle cx="5.5" cy="-7" r="4"/><path d="M-7 8 L-15 15 L-11 16 L-4 11Z M7 8 L15 15 L11 16 L4 11Z M-7 -1 L-14 -6 L-12 -9 L-5 -4Z M7 -1 L14 -6 L12 -9 L5 -4Z"/></g><circle cx="-5.5" cy="-7.5" r="1.6" fill="#f5c400"/><circle cx="5.5" cy="-7.5" r="1.6" fill="#f5c400"/></svg></div>
        <div class="plate">FROG CROSSING</div>
        <div class="post"></div>
        <div class="prompt"><span class="touchonly">Tap to hop</span><span class="keysonly">Press <kbd>↑</kbd> to hop</span></div>
        <div class="best">Best <span id="t-best">0</span> · Night <span id="t-night">1</span></div>
        <button class="mute" aria-pressed="false"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path class="wave" d="M13 6.5c1.6 1.8 1.6 5.2 0 7M15.5 4.5c2.8 3 2.8 8 0 11" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path class="cross" d="M13 7.5l5 5M18 7.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Sound on</span></button>
    </div>
</div>

<div class="card-wrap" id="nightcard"><div class="signpost"><div class="bigdiamond"><div><small>NIGHT</small><strong id="nightnum">2</strong></div></div><div class="bonus" id="nightbonus">+1,000</div></div></div>

<div class="card-wrap" id="paused" role="dialog" aria-label="Paused">
    <div class="panel"><header>Paused</header>
        <button class="go" id="resume">Carry on</button>
        <div class="foot"><button class="mute" aria-pressed="false"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path class="wave" d="M13 6.5c1.6 1.8 1.6 5.2 0 7M15.5 4.5c2.8 3 2.8 8 0 11" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path class="cross" d="M13 7.5l5 5M18 7.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Sound on</span></button><a href="https://www.gptgames.dev/" target="_blank" rel="noopener">gptgames.dev</a></div>
    </div>
</div>

<div class="card-wrap" id="over" role="dialog" aria-label="Game over">
    <div class="panel"><header>End of the road</header>
        <div class="stamp">NEW BEST</div>
        <div class="big" id="o-score">0</div><div class="sub">Score</div>
        <div class="grid3"><div><b id="o-best">0</b><span>Best</span></div><div><b id="o-night">1</b><span>Night</span></div><div><b id="o-frogs">0</b><span>Frogs home</span></div></div>
        <button class="go" id="again">Cross again</button>
        <div class="foot"><button class="mute" aria-pressed="false"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path class="wave" d="M13 6.5c1.6 1.8 1.6 5.2 0 7M15.5 4.5c2.8 3 2.8 8 0 11" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path class="cross" d="M13 7.5l5 5M18 7.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Sound on</span></button><a href="https://www.gptgames.dev/" target="_blank" rel="noopener">gptgames.dev</a></div>
    </div>
</div>


<script id="core">
// Frog Crossing core: lanes, the frog, rules and score. No DOM. The page only draws what this returns.
// Coordinates are in cells: x runs 0..COLS left to right (the frog's x is its centre), rows count up from
// the start verge (0) to the pond bank (12). Every lane is a pure function of the clock, so nothing drifts.
const FROG = (() => {
  const COLS = 9, ROWS = 13, MEDIAN = 6, HOME = 12, M = 5;
  const STEP = 1 / 120, HOP = 0.12, LIFE = 30, DYING = 0.85, CLEAR = 2.2;
  const BAYS = [0.9, 2.7, 4.5, 6.3, 8.1], BAY_REACH = 0.56;
  const FROG_HALF = 0.3, CAR_INSET = 0.06, LOG_GRACE = 0.12;
  const DIRS = {up: [1, 0], down: [-1, 0], left: [0, -1], right: [0, 1]};

  const kind = r => r < 0 ? 'none' : r === 0 || r === MEDIAN ? 'verge' : r < MEDIAN ? 'road' : r < HOME ? 'river' : r === HOME ? 'home' : 'none';
  const mod = (a, n) => ((a % n) + n) % n;
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  // Lane templates, bottom to top. len in cells, v in cells per second at night 1.
  const TEMPLATE = [
    null,
    {kind: 'road', type: 'car', len: 1, v: -1.05, n: 3},
    {kind: 'road', type: 'van', len: 1, v: 0.95, n: 3},
    {kind: 'road', type: 'taxi', len: 1, v: -1.45, n: 3},
    {kind: 'road', type: 'racer', len: 1, v: 2.8, n: 1},
    {kind: 'road', type: 'truck', len: 2, v: -1.15, n: 2},
    null,
    {kind: 'river', type: 'turtle', len: 3, v: -1.2, n: 3},
    {kind: 'river', type: 'log', len: 3, v: 1.0, n: 3},
    {kind: 'river', type: 'log', len: 5, v: 1.9, n: 2},
    {kind: 'river', type: 'turtle', len: 2, v: -1.35, n: 4},
    {kind: 'river', type: 'log', len: 4, v: 1.4, n: 3},
    null
  ];

  const speedFor = n => Math.min(1 + 0.1 * (n - 1), 1.9);

  // The lanes of night n. Same night, same lanes, on every device.
  function night(n) {
    const r = rng(n * 7919 + 13), f = speedFor(n), lanes = [];
    for (let row = 0; row < ROWS; row++) {
      const T = TEMPLATE[row];
      if (!T) { lanes.push(null); continue; }
      let count = T.n, len = T.len;
      if (T.kind === 'road' && n >= 3 && (row === 1 || row === 3)) count++;
      if (T.type === 'racer' && n >= 6) count = 2;
      if (T.type === 'log' && n >= 4 && len > 2) len--;
      if (T.type === 'log' && n >= 8 && len > 2 && row === 9) len--;
      const v = T.v * f;
      const P = 14 + Math.floor(r() * 4) + (T.kind === 'road' && count > 2 ? 1 : 0);
      // gaps: a road gap must let a frog stand in it while the next car comes; a river gap is any size
      const gmin = T.kind === 'road' ? 1.6 + Math.abs(v) * 0.3 : 1;
      const free = P - count * len - count * gmin;
      const w = []; for (let i = 0; i < count; i++) w.push(0.4 + r());
      const ws = w.reduce((a, b) => a + b, 0);
      const items = [];
      let x = r() * P;
      for (let i = 0; i < count; i++) {
        const it = {x: mod(x, P), len, type: T.type, i};
        if (T.type === 'turtle') {
          const divers = n < 2 ? 0 : n < 5 ? 1 : 2;
          if ((row === 7 && i < divers) || (row === 10 && n >= 3 && i < divers)) it.dive = {period: 7 - Math.min(2, (n - 2) * 0.25), off: r()};
        }
        if (T.kind === 'road') it.paint = Math.floor(r() * 5);
        items.push(it);
        x += len + gmin + Math.max(0, free) * w[i] / ws;
      }
      lanes.push({row, kind: T.kind, type: T.type, v, P, len, items});
    }
    return lanes;
  }

  const left = (lane, it, t) => mod(it.x + lane.v * t, lane.P) - M;
  // how far under the water a diving turtle is: 0 on top, 1 gone. Safe while < 1.
  function sink(it, t) {
    if (!it.dive) return 0;
    const p = mod(t / it.dive.period + it.dive.off, 1);
    if (p < 0.5) return 0;
    if (p < 0.62) return (p - 0.5) / 0.12 * 0.6;      // dipping: a warning, still safe
    if (p < 0.86) return 1;                             // under: unsafe
    if (p < 0.95) return 0.6 * (1 - (p - 0.86) / 0.09); // surfacing
    return 0;
  }
  const submerged = (it, t) => sink(it, t) >= 1;
  // a diver's tell before it dips: bubbles rise for two seconds before it goes (0..1), so it can be read in time
  function warn(it, t) {
    if (!it.dive) return 0;
    const p = mod(t / it.dive.period + it.dive.off, 1);
    return p >= 0.5 - 2 / it.dive.period && p < 0.5 ? (p - (0.5 - 2 / it.dive.period)) / (2 / it.dive.period) : 0;
  }

  function itemsAt(g, row, t = g.t) {
    const lane = g.lanes[row]; if (!lane) return [];
    return lane.items.map(it => ({it, x: left(lane, it, t), len: it.len, type: it.type, sink: sink(it, t), v: lane.v, paint: it.paint}));
  }

  // the game's own dice; its state lives in g, so a game can be copied and carried on
  function rand(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }

  function create(opt = {}) {
    const n = opt.night || 1;
    const g = {
      t: opt.t || 0, acc: 0, night: n, lanes: night(n), bays: [0, 0, 0, 0, 0], score: 0, lives: opt.lives || 4,
      state: opt.title ? 'title' : 'play', stateT: 0, queue: null, events: [], rs: (opt.seed == null ? 1 : opt.seed) >>> 0,
      fly: {bay: -1, until: 0, next: (opt.t || 0) + 5}, nextLife: 10000, frogs: 0, deaths: 0
    };
    spawn(g);
    return g;

      ctx.save();
      if (d.cause === 'car') { /* drawn under the traffic, as a mark */ }
      else if (d.cause === 'water' || d.cause === 'dive' || d.cause === 'swept') { const s2 = Math.min(1, k / 0.75), ss = 1 - Math.pow(1 - s2, 2); ctx.globalAlpha = Math.max(0, 1 - ss); ctx.translate(sx + Math.sin(k * 18) * v.c * 0.04 * (1 - s2), sy + ss * v.c * 0.12); ctx.scale(1 - 0.45 * ss, 1 - 0.45 * ss); drawFrog(ctx, 0, 0, c, ang + ss * 1.2, 1 - s2, 0, 0); ctx.fillStyle = `rgba(16,64,78,${0.6 * ss})`; ctx.beginPath(); ctx.arc(0, 0, c * 0.32, 0, 7); ctx.fill(); }
      else if (d.cause === 'time') { const s2 = 1 - Math.pow(1 - Math.min(1, k / 0.35), 3); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - 0.45) * 2.6); ctx.translate(sx, sy + s2 * v.c * 0.06); ctx.scale(1 + 0.18 * s2, 1 - 0.3 * s2); drawFrog(ctx, 0, 0, c, ang, 0, 0, 0, {dead: true}); }
      else { const hop = Math.sin(Math.min(1, k / 0.4) * Math.PI) * v.c * 0.35; ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - 0.5) * 2.5); ctx.translate(sx, sy - hop); drawFrog(ctx, 0, 0, c, ang + Math.min(1, k / 0.4) * Math.PI, 0, 0, 0, {dead: true}); }
      ctx.restore(); return;
    }
    if (g.state === 'title' && !reduced) sy -= Math.abs(Math.sin(now * 2.2)) * v.c * 0.06;
    const born = now - FX.bornAt, grow = reduced ? 1 : Math.min(1, born / 0.25);
    const landAgo = now - FX.landAt, squash = landAgo < 0.14 && !reduced ? Math.sin(landAgo / 0.14 * Math.PI) * 0.9 : 0;
    const bumpAgo = now - FX.bumpAt; if (bumpAgo < 0.18 && !reduced) { const dd = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]}[FX.bumpDir]; const o = Math.sin(bumpAgo / 0.18 * Math.PI) * v.c * 0.12; sx += dd[0] * o; sy += dd[1] * o; }
    const crouch = FX.crouch && !f.hop ? 0.75 : 0;
    ctx.save(); ctx.translate(sx, sy);
    if (grow < 1) { const e = 1 - Math.pow(1 - grow, 3), s = 0.3 + 0.7 * e + 0.18 * Math.sin(grow * Math.PI); ctx.scale(s, s); }
    drawFrog(ctx, 0, 0, c, ang, p.z > 0 ? Math.min(1, p.p * 2.4) : 0, Math.max(squash, crouch), reduced ? 0 : p.z);
    ctx.restore();
    const q = FX.cue;
    if (q && q.kind === 'side' && now > q.from && now < q.until && g.state === 'play') {
      // ghost chevrons either side of the frog: you can step aside
      const a = Math.min(1, (now - q.from) / 0.3, (q.until - now) / 0.3), nudge = reduced ? 0 : Math.sin(now * 4) * v.c * 0.05;
      ctx.save(); ctx.strokeStyle = `rgba(245,196,0,${0.9 * a})`; ctx.lineWidth = Math.max(3, v.c * 0.09); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const s of [-1, 1]) for (const k2 of [0, 1]) { const ox = sx + s * (v.c * (0.72 + k2 * 0.26) + nudge); ctx.globalAlpha = k2 ? 0.55 : 1; ctx.beginPath(); ctx.moveTo(ox - s * v.c * 0.1, sy - v.c * 0.16); ctx.lineTo(ox + s * v.c * 0.06, sy); ctx.lineTo(ox - s * v.c * 0.1, sy + v.c * 0.16); ctx.stroke(); }
      ctx.restore();
    }
  };

  // ---------- game ----------
  let G = FROG.create({title: true, t: 2 + Math.random() * 40, seed: (Date.now() & 0xffff) + 1});
  let paused = false, overAt = -9, rowsTimer = 0, lastTick = 99, chorusI = -1;
  // the first time something kills, the next frog is shown the way out - drawn in the world, not written
  function showHint(key) {
    if (SAVE.hints[key]) return; SAVE.hints[key] = true; save();
    FX.cue = {kind: key, from: FX.now + FROG.DYING, until: FX.now + FROG.DYING + 2.6};
  }
  function renderLives() {
    const want = Math.max(0, Math.min(5, G.lives - 1)); // the frog on the board is not a spare
    while ([...elLives.children].filter(s => !s.classList.contains('gone')).length < want) { const s = document.createElement('i'); s.className = 'life born'; s.innerHTML = FROG_SVG; elLives.appendChild(s); requestAnimationFrame(() => s.classList.remove('born')); }
    const live = [...elLives.children].filter(s => !s.classList.contains('gone'));
    for (let i = want; i < live.length; i++) { const s = live[i]; s.classList.add('gone'); setTimeout(() => s.remove(), 380); }
  }
  let shownScore = 0;
  function renderHud(dt) {
    shownScore += (G.score - shownScore) * Math.min(1, dt * 12); if (Math.abs(G.score - shownScore) < 1) shownScore = G.score;
    elScore.textContent = Math.round(shownScore).toLocaleString('en-US');
    const k = G.state === 'title' ? 1 : Math.max(0, G.timeLeft / FROG.LIFE);
    elTime.style.transform = `scaleX(${k})`;
    elTimer.className = k < 0.2 ? 'low' : k < 0.4 ? 'mid' : '';
  }
  function setNight(n) { elNight.textContent = n; }

  function begin() {
    G = FROG.create({t: G.t, seed: (Date.now() & 0xffff) + 1});
    FROG.start(G); FX.bornAt = FX.now; FX.arrived = []; FX.croak = []; shownScore = 0;
    setNight(1); elLives.innerHTML = ''; renderLives(); hideCards(); document.body.classList.remove('titled');
  }
  function hideCards() { for (const id of ['title', 'over', 'paused', 'nightcard']) $(id).classList.remove('on'); }

  function press(dir) {
    SND.init();
    if (paused) { resume(); return; }
    if (G.state === 'title') { FROG.start(G); document.body.classList.remove('titled'); $('title').classList.remove('on'); renderLives(); }
    if (G.state === 'over') { if (FX.now - overAt > 0.7) begin(); return; }
    FROG.press(G, dir);
  }

  function handle(ev) {
    for (const e of ev) {
      const f = G.frog;
      switch (e.type) {
        case 'hop': SND.hop(Math.max(e.to, e.from), e.to > e.from); FX.crouch = false; if (FX.cue && FX.now > FX.cue.from) FX.cue.until = Math.min(FX.cue.until, FX.now + 0.3); break;
        case 'land': FX.landAt = FX.now; if (FROG.kind(e.row) === 'river') { const p = FROG.pos(G); ring(p.x, e.row, 'rgba(200,235,245,A)', 0.5, 0.25, 0.6); } break;
        case 'step': { const p = FROG.pos(G); popup('+10', p.x, e.row, 'rgba(255,255,255,0.92)', 0.34, 0.6); break; }
        case 'board': SND.board(); break;
        case 'bump': FX.bumpAt = FX.now; FX.bumpDir = e.dir; SND.bump(); break;
        case 'whoosh': { const now = performance.now(); if (now - (handle.lastWhoosh || 0) > 140) { handle.lastWhoosh = now; SND.whoosh(e.v, FROG.pos(G).x); } break; }
        case 'die': {
          const x = e.x, row = e.row;
          if (e.cause === 'car') { SND.splat(); flat(x, row, G.frog.dir || 'up'); FX.stopUntil = FX.now + 0.16; impact(x, row); ring(x, row, 'rgba(255,255,255,A)', 0.4, 0.2, 0.8, false); spray(x, row, 'rgba(180,240,110,A)', 10, 1.6, 0.5); shake(0.25); showHint('side'); }
          else if (e.cause === 'water' || e.cause === 'dive' || e.cause === 'swept') { SND.plop(); for (let i = 0; i < 3; i++) after(i * 0.14, () => ring(x, row, 'rgba(200,235,245,A)', 0.9, 0.15, 0.9)); spray(x, row, 'rgba(225,245,250,A)', 18, 1.8, 0.55, 4); ring(x, row, 'rgba(255,255,255,A)', 0.35, 0.15, 0.6, false); bubbles(x, row);  }
          else if (e.cause === 'time') { SND.timeout(); timeCue(x, row); elTimer.classList.add('flash'); after(1.2, () => elTimer.classList.remove('flash')); }
          else { SND.thud(); ring(x, row, 'rgba(255,255,255,A)', 0.4, 0.2, 0.7, false);  }
          renderLives(); break;
        }
        case 'spawn': FX.bornAt = FX.now; renderLives(); break;
        case 'home': {
          FX.arrived[e.bay] = FX.now; FX.croak[e.bay] = FX.now; SND.home(e.count - 1);
          const bx = FROG.BAYS[e.bay]; popup('+' + e.pts, bx, 12, '#fff2b0', 0.36, 1.2);
          if (e.fly) { SND.firefly(); spray(bx, 12, 'rgba(255,245,150,A)', 14, 1.2, 0.8); }
          ring(bx, 12, 'rgba(190,250,140,A)', 0.7, 0.3, 1.0, false);
          if (e.count < 5) FX.bornAt = FX.now; break;
        }
        case 'fly': break;
        case 'clear': SND.clear(); FX.leaveAt = FX.now + 1.35; for (let i = 0; i < 5; i++) after(i * 0.18, () => { FX.croak[i] = FX.now; }); showNightCard(e.night + 1, 0.8, e.pts); break;
        case 'night': setNight(e.night); FX.bornAt = FX.now; FX.arrived = []; FX.leaveAt = null; renderLives(); break;
        case 'life': SND.life(); renderLives(); break;
        case 'over': gameOver(); break;
      }
    }
  }
  function showNightCard(n, delay, bonus) {
    after(delay, () => { $('nightnum').textContent = n; $('nightbonus').textContent = '+' + bonus.toLocaleString('en-US') + ' night bonus'; $('nightcard').classList.add('on'); after(1.15, () => $('nightcard').classList.remove('on')); });
  }
  // things that happen a moment later run on the game clock, so a pause pauses them too
  const later = []; const after = (sec, fn) => later.push({at: FX.now + sec, fn});
  let shakeUntil = 0;
  function shake(d) { if (!reduced) shakeUntil = FX.now + d; }

  function gameOver() {
    overAt = FX.now; SND.over();
    const best = G.score > SAVE.best;
    if (best) SAVE.best = G.score;
    if (G.night > SAVE.bestNight) SAVE.bestNight = G.night;
    save();
    $('o-score').textContent = G.score.toLocaleString('en-US');
    $('o-best').textContent = SAVE.best.toLocaleString('en-US');
    $('o-night').textContent = G.night;
    $('o-frogs').textContent = G.frogs;
    $('over').classList.toggle('newbest', best && G.score > 0);
    $('over').classList.add('on');
    if (!TOUCH) setTimeout(() => $('again').focus({preventScroll: true}), 50);
  }

  function pause() { if (G.state === 'title' || G.state === 'over' || paused) return; paused = true; $('paused').classList.add('on'); }
  function resume() { if (!paused) return; paused = false; $('paused').classList.remove('on'); last = performance.now(); }

  // ---------- input ----------
  const KEYS = {ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right'};
  addEventListener('keydown', e => {
    if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); paused ? resume() : pause(); return; }
    if (e.code === 'KeyM') { toggleMute(); return; }
    if ((e.code === 'Space' || e.code === 'Enter') && (G.state === 'over' || G.state === 'title' || paused)) { e.preventDefault(); if (G.state === 'over') { if (FX.now - overAt > 0.7) begin(); } else press('up'); return; }
    const d = KEYS[e.code]; if (!d) return;
    e.preventDefault(); if (e.repeat) return;
    press(d); draw(); // same-frame feedback
  });
  let ptr = null;
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    SND.init();
    if (paused) { resume(); return; }
    if (G.state === 'over') return;
    ptr = {id: e.pointerId, x: e.clientX, y: e.clientY, used: false, t: performance.now()};
    FX.crouch = true; draw();
  });
  addEventListener('pointermove', e => {
    if (!ptr || ptr.id !== e.pointerId || ptr.used) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, th = Math.max(16, (V ? V.c : 40) * 0.35);
    if (Math.hypot(dx, dy) < th) return;
    ptr.used = true; FX.crouch = false;
    press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); draw();
  });
  const endPtr = e => {
    if (!ptr || ptr.id !== e.pointerId) return;
    const p = ptr; ptr = null; FX.crouch = false;
    if (!p.used && e.type === 'pointerup') { press('up'); draw(); }
  };
  addEventListener('pointerup', endPtr); addEventListener('pointercancel', endPtr);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  $('pausebtn').addEventListener('click', e => { e.stopPropagation(); SND.init(); paused ? resume() : pause(); });
  $('resume').addEventListener('click', resume);
  $('again').addEventListener('click', () => { SND.init(); if (FX.now - overAt > 0.7) begin(); });
  function toggleMute() { SAVE.muted = !SAVE.muted; save(); SND.setMuted(SAVE.muted); renderMute(); }
  function renderMute() { for (const b of document.querySelectorAll('.mute')) { b.setAttribute('aria-pressed', SAVE.muted); b.querySelector('span').textContent = SAVE.muted ? 'Sound off' : 'Sound on'; } }
  for (const b of document.querySelectorAll('.mute')) b.addEventListener('click', e => { e.stopPropagation(); SND.init(); toggleMute(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('blur', pause);
  addEventListener('resize', () => { layout(); draw(); });

  // ---------- loop ----------
  let last = performance.now();
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (shakeUntil > FX.now) { const k = (shakeUntil - FX.now) / 0.25; ctx.translate((Math.random() - 0.5) * V.c * 0.12 * k, (Math.random() - 0.5) * V.c * 0.12 * k); }
    drawFrame(ctx, V, G, FX);
  }
  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    if (!manual) tick(dt);
    requestAnimationFrame(frame);
  }
  let manual = false; // a test can hold the clock and step it itself
  function tick(dt) {
    if (!paused) {
      FX.now += dt;
      // a hit-stop: the world holds its breath for a moment when a car hits
      const ev = FX.stopUntil > FX.now ? [] : FROG.step(G, dt);
      if (ev.length) handle(ev);
      const ci = SND.chorus(dt, G.bays); if (ci != null && ci >= 0) FX.croak[ci] = FX.now;
      if (G.state === 'play' && G.timeLeft < 5 && Math.ceil(G.timeLeft) !== lastTick) { lastTick = Math.ceil(G.timeLeft); SND.tick(); }
      if (G.state !== 'play') lastTick = 99;
      for (let i = later.length - 1; i >= 0; i--) if (later[i].at <= FX.now) { const f = later[i].fn; later.splice(i, 1); f(); }
      FX.marks = FX.marks.filter(p => !p.dead); FX.parts = FX.parts.filter(p => !p.dead);
      renderHud(dt);
      draw();
    }
  }

  const FROG_SVG = $('frogsvg').innerHTML;
  layout(); renderMute(); setNight(1);
  if (SAVE.best > 0) { $('t-best').textContent = SAVE.best.toLocaleString('en-US'); $('t-night').textContent = SAVE.bestNight; $('title').classList.add('hasbest'); }
  $('title').classList.add('on'); document.body.classList.add('titled');
  if (TOUCH) document.body.classList.add('touch');
  renderLives();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layout(); draw(); });
  requestAnimationFrame(t => { last = t; frame(t); });
  window.__frog = {get g() { return G; }, get v() { return V; }, FX, press, begin, hold(on) { manual = on; }, advance(sec, step = 1 / 60) { for (let k = 0; k < sec / step - 1e-6; k++) tick(step); }};
})();
</script>
