<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margins — Tic-Tac-Toe with a Friend Online</title>
<meta name="description" content="Tic-tac-toe in the margin of a notebook. Send a friend a link and play a match to three online, pass one phone, or take on the computer. Classic rules, or Vanishing: three marks each, and the oldest fades.">
<meta name="theme-color" content="#f3eee2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3eee2; --paper2:#ebe4d3; --rule:#b9cbe0; --margin:#e3a3a0;
  --ink:#2c2a26; --soft:#6c675d; --x:#c4402a; --o:#2443a0; --line:#3a3833;
  --btn:#2c2a26; --btnText:#f6f1e4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
    repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);
  background-attachment:fixed;
  color:var(--ink); font-family:'Kalam',cursive; overflow:hidden;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:2px dashed var(--o);outline-offset:4px;border-radius:8px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom)) 64px;
  opacity:0;transform:translateY(10px);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
.screen.shown{display:flex}
.screen.on{opacity:1;transform:none}
@media (max-width:520px){.screen{padding-left:54px;padding-right:8px}
  #play{justify-content:flex-end;padding-bottom:max(28px,env(safe-area-inset-bottom))}}

/* ---------- home ---------- */
#home{justify-content:center;gap:0}
.brand{width:min(420px,100%);text-align:left}
.brand h1{font-size:clamp(54px,14vw,84px);font-weight:700;line-height:.9;margin:0;letter-spacing:-1px}
.brand h1 .x{color:var(--x)} .brand h1 .o{color:var(--o)}
.brand p{margin:6px 0 0;font-size:20px;color:var(--soft);font-weight:400}
.hero{width:min(220px,58vw);margin:18px 0 10px;align-self:center}
.menu{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;margin-top:6px}
.big{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;
  min-height:62px;padding:10px 22px;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;background:var(--btn);color:var(--btnText);
  border:2.5px solid var(--ink);font-size:24px;font-weight:700;transition:transform .12s ease,background .15s}
.big small{font-size:16px;font-weight:400;opacity:.75}
.big:active{transform:translateY(2px) rotate(-.5deg)}
.big.ghost{background:transparent;color:var(--ink);border-radius:18px 225px 18px 255px/255px 18px 225px 18px}
.big.ghost:hover{background:#fff6d533}
.big.ghost:active{background:#f6e27a55}
.rules{width:min(420px,100%);margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule{position:relative;text-align:left;padding:10px 12px 10px 40px;border-radius:12px;transition:background .15s ease}
.rule{padding:12px 14px;border:2.5px solid transparent;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transition:border-color .2s,transform .2s}
.rule b{font-size:24px!important;color:var(--soft)}
.rule[aria-pressed="false"]{border-color:#2c2a2630;border-style:dashed}
.rule[aria-pressed="true"]{border-color:var(--x);transform:rotate(-1.5deg)}
.rule[aria-pressed="true"] b{color:var(--ink)}
.rule span{font-size:16px!important}
.rule b{display:block;font-size:20px}
.rule span{display:block;font-size:15px;line-height:1.2;color:var(--soft)}

.record{margin-top:14px;font-size:16px;color:var(--soft);min-height:22px;width:min(420px,100%)}

@media (min-width:900px) and (min-height:560px){
  #home{display:none;grid-template-columns:420px 380px;grid-template-rows:auto auto auto auto;column-gap:72px;align-content:center;justify-content:center}
  #home.shown{display:grid}
  #home .hero{grid-column:2;grid-row:1/5;width:380px;align-self:center;margin:0}
  #home .brand,#home .menu,#home .rules,#home .record{grid-column:1}
}
@media (min-width:1000px) and (min-height:720px){ html{font-size:125%} #home{zoom:1.25} .status,.act{zoom:1.12} }
@media (min-width:900px) and (min-height:560px){
  #play{--bw:min(600px,calc(100vh - 290px))}
  #play .boardWrap{width:var(--bw)}
  #play .score{position:absolute;left:50%;top:calc(var(--bw) / 2 + 76px);transform:translate(-50%,-50%);width:auto;grid-template-columns:150px var(--bw) 150px;pointer-events:none;margin:0}
  #play .side svg.mk{width:64px;height:64px}
  #play .tally{width:96px;height:52px}
  #play .side .who{font-size:24px}
}
/* ---------- play ---------- */
#play{justify-content:center}
#play>.top{z-index:2;margin-bottom:auto;flex-shrink:0}
#play>.act{margin-bottom:auto}
.who:empty{display:none}
.top{width:min(460px,100%);display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--soft)}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tag{font-size:20px;color:var(--soft);text-align:center}
.icon svg{width:28px!important;height:28px!important}
.score{width:min(460px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin-top:6px}
.side{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;padding-bottom:18px}
.side .who{font-size:21px;line-height:1;color:var(--soft);transition:color .2s}
.side .num{height:46px;display:flex;align-items:center;gap:0;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tally{width:84px;height:46px;overflow:visible}
.tally path{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s ease}
.tally path.stroke{opacity:0}
.tally path.slot{display:none}
.tally path.on{stroke-dashoffset:0;opacity:1}
.tally path.slot{stroke:#2c2a2630!important;stroke-width:3;stroke-dasharray:none;stroke-dashoffset:0}
.side.x .tally path{stroke:var(--x)} .side.o .tally path{stroke:var(--o)}
.side .mk{width:46px;height:46px;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.side.turn .mk{transform:scale(1.15)}
.side.x .num{color:var(--x)} .side.o .num{color:var(--o)}

.side .under{position:absolute;bottom:0;left:50%;width:90px;height:12px;margin-left:-45px;overflow:visible}
.side .under path{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .35s cubic-bezier(.4,0,.2,1)}
.side.x .under path{stroke:var(--x)} .side.o .under path{stroke:var(--o)}
.side .under{opacity:0;transition:opacity .2s}
.side.turn .under{opacity:0}
.score.live .side:not(.turn){opacity:.3}
.side{transition:opacity .25s}
.side.turn .under path{stroke-dashoffset:0}
.side.turn .who{color:var(--ink)}
.side .dot{position:absolute;top:2px;right:calc(50% - 46px);width:9px;height:9px;border-radius:50%;background:#7aa36a;opacity:0;transition:opacity .3s}
.side.away .dot{opacity:1;background:#c9b9a0}

.side.bump .num{transform:scale(1.3) rotate(-4deg)}
.side.nudge{animation:nudge .45s ease}
@keyframes nudge{30%{transform:translateY(-5px)}60%{transform:translateY(1px)}}
.dash{font-size:34px;color:var(--soft);padding:0 10px 22px}
.boardWrap{position:relative;width:min(600px,100%,calc(100vh - 400px));aspect-ratio:1;margin-top:10px;flex-shrink:0}
@media (max-height:600px){.boardWrap{width:min(460px,100%,calc(100vh - 240px))}}
#board{width:100%;height:100%;display:block;overflow:visible;touch-action:none}
#board .grid path{fill:none;stroke:var(--line);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
#board .grid path{opacity:0}
#board .grid.drawn path{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset .38s cubic-bezier(.5,0,.2,1)}
#board .cell{fill:transparent;cursor:pointer}
.mark path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.mark.x path{stroke:var(--x);stroke-width:7.5}
.mark.o path{stroke:var(--o);stroke-width:7}
.mark path{opacity:0}
.mark.ink path,.mark.ghost path{opacity:1}
.mark.ink path{stroke-dashoffset:0;transition:stroke-dashoffset .2s cubic-bezier(.3,0,.2,1),opacity 0s}
.mark.ink path.second{transition-delay:.11s}
.mark{transition:opacity .3s ease,filter .3s ease;transform-box:fill-box;transform-origin:center}
.mark.faint{opacity:.3;animation:doom 1.1s ease-in-out infinite}
@keyframes doom{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(.94)}75%{transform:rotate(5deg) scale(.97)}}
.rub{fill:none;stroke:#8f897c;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.55;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .22s ease-out,opacity .3s ease .25s}
.rub.on{stroke-dashoffset:0}
.rub.off{opacity:0}
.mark.going{opacity:0;filter:blur(3px);transition:opacity .32s ease,filter .32s ease,transform .32s ease;transform:scale(.88) rotate(-6deg)}
.mark.dim{opacity:.25}
.mark.ghost{opacity:.16;pointer-events:none}
.mark.ghost path{stroke-dashoffset:0}
.mark.wince{animation:wince .3s ease}
@keyframes wince{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.strike{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.92}
.strike{opacity:0}
.strike.on{opacity:.92;transition:stroke-dashoffset .42s cubic-bezier(.6,0,.2,1),opacity 0s!important;stroke-dashoffset:0;transition:stroke-dashoffset .42s cubic-bezier(.6,0,.2,1)}
.status{min-height:68px;margin-top:6px;width:min(460px,100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
.say{font-size:26px;font-weight:700;line-height:1.15;transition:opacity .18s}
.say.swap{opacity:0}
.sub{font-size:17px;color:var(--soft);line-height:1.2;min-height:20px}
.act{display:flex;gap:10px;margin-top:8px;width:min(460px,100%);justify-content:center;min-height:56px}
.act .big{width:auto;min-width:200px;justify-content:center;font-size:22px;min-height:54px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .25s ease,transform .3s cubic-bezier(.2,.9,.3,1.2)}
.act .big.show{opacity:1;transform:none;pointer-events:auto}
.act .big[hidden]{display:none}

/* invite card */
.invite{position:absolute;inset:6% 4%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:#fbeb95;border-radius:2px 2px 18px 2px;box-shadow:0 1px 0 #0001,0 14px 24px -12px #0005;transform:rotate(-1.2deg);
  padding:16px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .35s cubic-bezier(.2,.9,.3,1.2)}
.boardWrap:has(.invite.on) #board{opacity:0}
#board{transition:opacity .3s ease .25s}
.invite.on{opacity:1;pointer-events:auto;transform:rotate(-1.2deg) translateY(0)}
.invite:not(.on){transform:rotate(1deg) translateY(14px)}
.invite::before,.card .sheet::before{content:'';position:absolute;top:-12px;left:50%;width:110px;height:26px;margin-left:-55px;background:#ffffff8c;box-shadow:0 1px 2px #0002;transform:rotate(2deg)}
.invite h2{margin:0;font-size:28px;line-height:1.05}
.invite p{margin:0;font-size:17px;color:var(--soft);line-height:1.25}
.invite .codeLine b{margin-left:4px}
.invite .code{font-size:24px;letter-spacing:3px;font-weight:700;letter-spacing:6px;color:var(--o)}
.invite .big{width:auto;min-width:220px;justify-content:center;font-size:22px}
.invite .wait{display:inline-flex;gap:5px;align-items:center}
.invite .wait i{width:7px;height:7px;border-radius:50%;background:var(--soft);animation:blink 1.2s infinite}
.invite .wait i:nth-child(2){animation-delay:.2s}.invite .wait i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* match card */
.card{position:fixed;inset:0;display:grid;place-items:center;background:#f3eee280;opacity:0;pointer-events:none;transition:opacity .12s ease;padding:16px}
.card.on{opacity:1;pointer-events:auto}
body:has(.card.on) .score,body:has(.card.on) .status,body:has(.card.on) .act{opacity:0;transition:opacity .15s}
.card .sheet{transform:translateY(-60px) rotate(4deg)!important;transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.card.on .sheet{transform:rotate(-.8deg)!important}
.card .sheet{position:relative;width:min(380px,100%);background:#fbeb95;border-radius:2px 2px 22px 2px;padding:22px 20px;text-align:center;
  box-shadow:0 1px 0 #0001,0 18px 40px -14px #0005;transform:translateY(20px) rotate(1deg);transition:transform .45s cubic-bezier(.2,.9,.3,1.15)}
.card.on .sheet{transform:rotate(-.8deg)}
.sheet h2{margin:0;font-size:clamp(30px,8vw,40px);line-height:1;white-space:nowrap}
.sheet .final{font-size:96px;font-weight:700;line-height:1.1;margin:6px 0}
.sheet .final .x{color:var(--x)} .sheet .final .o{color:var(--o)}
.sheet p{margin:0 0 14px;color:var(--soft);font-size:18px}
.sheet .big{justify-content:center;margin-top:8px}

#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px) rotate(-1deg);background:#fbeb95;color:var(--ink);box-shadow:0 8px 18px -10px #0006;font-weight:700;
  padding:10px 18px;border-radius:12px;font-size:18px;opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;max-width:90vw;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0) rotate(-1deg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important;transition-delay:0s!important}
}
</style>
</head>
<body>

<!-- ======================= HOME ======================= -->
<section class="screen" id="home" aria-label="Margins">
  <div class="brand">
    <h1>Marg<span class="x">i</span>ns</h1>
    <p>tic-tac-toe, in the margins</p>
  </div>
  <svg class="hero" id="hero" viewBox="0 0 300 300" aria-hidden="true"></svg>
  <div class="menu">
    <button class="big" id="bInvite">Invite a friend <small>online</small></button>
    <button class="big ghost" id="bLocal">Pass the phone <small>2 players</small></button>
    <button class="big ghost" id="bCpu">Play the computer <small>1 player</small></button>
  </div>
  <div class="rules" role="group" aria-label="Rules">
    <button class="rule" data-rule="c" aria-pressed="true"><b>Classic</b><span>Three in a row wins.</span></button>
    <button class="rule" data-rule="v" aria-pressed="false"><b>Vanishing</b><span>Three marks each. Your oldest fades.</span></button>
  </div>
  <div class="record" id="record"></div>
</section>

<!-- ======================= PLAY ======================= -->
<section class="screen" id="play" aria-label="Game">
  <div class="top">
    <button class="icon" id="bBack" aria-label="Back to the start"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tag" id="tag">first to 3</div>
    <button class="icon" id="bMute" aria-label="Sound"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
  </div>
  <div class="score">
    <div class="side x" id="sideX"><span class="dot"></span><svg class="mk" viewBox="0 0 40 40"><path d="M10 10L30 30M30 10L10 30" stroke="var(--x)" stroke-width="5" stroke-linecap="round" fill="none"/></svg><div class="num" id="numX"></div><div class="who" id="whoX">You</div><svg class="under" viewBox="0 0 90 12"><path pathLength="1" d="M4 7 Q30 2 50 6 T86 5"/></svg></div>
    <div class="dash" aria-hidden="true"></div>
    <div class="side o" id="sideO"><span class="dot"></span><svg class="mk" viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" stroke="var(--o)" stroke-width="5" fill="none"/></svg><div class="num" id="numO"></div><div class="who" id="whoO">Friend</div><svg class="under" viewBox="0 0 90 12"><path pathLength="1" d="M4 6 Q28 9 48 5 T86 7"/></svg></div>
  </div>
  <div class="boardWrap">
    <svg id="board" viewBox="-10 -10 320 320" role="grid" aria-label="Board">
      <g class="grid" id="grid"></g>
      <path class="strike" id="strike" pathLength="1" d=""/>
      <g id="marks"></g>
      <g id="cells"></g>
    </svg>
    <div class="invite" id="invite">
      <h2>Send to a friend</h2>
      <p>When they open it, you play.<br>You are <b style="color:var(--x)">X</b> and go first.</p>
      <button class="big" id="bShare">Send the link</button>
      <button class="big ghost" id="bCopy" style="min-height:48px;font-size:19px">Copy link</button>
      <p class="codeLine">or tell them the code <b class="code" id="code">·····</b></p>
      <p class="wait">waiting for them <i></i><i></i><i></i></p>
    </div>
  </div>
  <div class="status" aria-live="polite">
    <div class="say" id="say"></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="act">
    <button class="big" id="bNext">Next round</button>
  </div>
</section>

<div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="sheet">
    <h2 id="cardTitle">You win</h2>
    <div class="final" id="cardScore"></div>
    <p id="cardLine"></p>
    <button class="big" id="bAgain">Play again</button>
    <button class="big ghost" id="bHome" style="margin-top:10px">Back to the start</button>
  </div>
</div>
<div id="toast" role="status"></div>

<!-- ======================= CORE (DOM-free; test/tic_tac_toe.mjs) ======================= -->
<script id="core">
// Margins core: rules, match record, computer player. No DOM, no clock, no Math.random.
// A match is one string: a digit 0-8 is a mark in that cell (row-major), '|' closes a round
// and opens the next, '/' closes a match and opens a new one. Both phones replay the same
// string, so they cannot disagree about the board or the score.
const TTT = (() => {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const TARGET = 3;          // rounds to win a match
  const KEEP = 3;            // marks each side keeps under Vanishing
  const CAP = 60;            // a Vanishing round this long is a draw
  const other = p => p === 'x' ? 'o' : 'x';

  function line(cells) {
    for (const l of LINES) {
      const p = cells[l[0]];
      if (p && p === cells[l[1]] && p === cells[l[2]]) return {p, line: l};
    }
    return null;
  }

  // who starts round r of match k: alternates every round and every match
  const starter = (r, k = 0) => (r + k) % 2 ? 'o' : 'x';

  function fresh(rule, first = 'x') {
    return {rule, cells: Array(9).fill(''), q: {x: [], o: []}, turn: first, moves: 0, result: null, line: null};
  }

  // the mark that would vanish if `p` placed now (Vanishing only), else -1
  function fading(s, p = s.turn) {
    return s.rule === 'v' && s.q[p].length >= KEEP ? s.q[p][0] : -1;
  }

  function legal(s) {
    if (s.result) return [];
    const out = [];
    for (let i = 0; i < 9; i++) if (!s.cells[i]) out.push(i);
    return out;
  }

  // returns a new state, or null when the move is not allowed
  function play(s, i) {
    if (s.result || !(i >= 0 && i < 9) || s.cells[i]) return null;
    const p = s.turn;
    const cells = s.cells.slice(), q = {x: s.q.x.slice(), o: s.q.o.slice()};
    let gone = -1;
    if (s.rule === 'v' && q[p].length >= KEEP) { gone = q[p].shift(); cells[gone] = ''; }
    cells[i] = p; q[p].push(i);
    const n = {rule: s.rule, cells, q, turn: other(p), moves: s.moves + 1, result: null, line: null, gone};
    const w = line(cells);
    if (w) { n.result = w.p; n.line = w.line; }
    else if (s.rule === 'c' && q.x.length + q.o.length === 9) n.result = 'draw';
    else if (s.rule === 'v' && n.moves >= CAP) n.result = 'draw';
    return n;
  }

  // replay the last match in a record string
  function match(g, rule) {
    g = g || '';
    const matches = g.split('/');
    const k = matches.length - 1;
    const rounds = matches[k].split('|');
    const score = {x: 0, o: 0, d: 0};
    const done = [];
    let s = null, bad = false;
    rounds.forEach((tok, r) => {
      s = fresh(rule, starter(r, k));
      for (const ch of tok) {
        const n = play(s, +ch);
        if (!n) { bad = true; break; }
        s = n;
      }
      if (r < rounds.length - 1) {
        if (!s.result) bad = true;
        done.push(s.result);
      }
      if (s.result) { if (s.result === 'draw') score.d++; else score[s.result]++; }
    });

function turnMarks(m) {
  const t = m.state.result || m.winner ? null : m.state.turn;
  $('sideX').classList.toggle('turn', t === 'x');
  $('sideO').classList.toggle('turn', t === 'o');
  document.querySelector('.score').classList.toggle('live', !!t);
}
let lastSay = '';
function words(m) {
  const s = m.state;
  let say = '', sub = '', next = false;
  if (G.mode === 'online' && !G.peer) {
    say = G.me === 'x' ? '' : 'Joining…';
  } else if (s.result) {
    if (s.result === 'draw') { say = 'Nobody gets it.'; sub = 'A draw — no point.'; }
    else if (G.mode === 'local') say = `${s.result.toUpperCase()} takes the round.`;
    else say = s.result === G.me ? 'Yours.' : G.mode === 'cpu' ? 'The computer takes it.' : 'Your friend takes it.';
    if (!m.winner) {
      const nx = TTT.starter(m.round + 1, m.k);
      if (!sub) sub = `${G.mode === 'local' ? nx.toUpperCase() : name(nx)} start${G.mode === 'local' || nx !== G.me ? 's' : ''} the next one. Tap to go on.`;
      next = true;
    }
  } else if (G.mode === 'local') {
    say = `${s.turn.toUpperCase()} to move`;
  } else if (s.turn === G.me) {
    say = 'Your move';
  } else {
    say = G.mode === 'cpu' ? 'Thinking…' : 'Their move…';
  }
  if (!s.result && !(G.mode === 'online' && !G.peer)) {
    if (s.moves === 0 && m.round === 0 && m.k === 0) sub = G.rule === 'v' ? 'Each side keeps three marks.' : 'Three in a row takes the round.';
    else if (TTT.fading(s) >= 0 && m.round === 0 && m.k === 0 && s.moves < 7) sub = 'The wobbling mark goes when ' + (G.mode === 'local' ? s.turn.toUpperCase() + ' places' : s.turn === G.me ? 'you place' : 'they place') + ' a new one.';
  }
  if (G.mode === 'online' && G.peer && G.away) sub = 'Your friend lost the connection — they can rejoin from the same link.';
  setSay(say, sub);
  const b = $('bNext');
  clearTimeout(words.t);
  if (next && !b.classList.contains('show')) words.t = setTimeout(() => b.classList.add('show'), REDUCED ? 0 : 700);
  else if (!next) b.classList.remove('show');
}
function setSay(say, sub) {
  const e = $('say');
  if (say !== lastSay) {
    lastSay = say;
    if (REDUCED) e.textContent = say;
    else e.textContent = say;
  }
  $('sub').textContent = sub;
}

// ---------- input ----------
function cellFromEvent(ev) {
  const t = ev.target.closest && ev.target.closest('.cell');
  return t ? +t.dataset.i : -1;
}
function tryPlay(i) {
  const m = M(), s = m.state;
  if (m.winner) return;
  if (s.result) { if ($('bNext').classList.contains('show')) nextRound(); return; }
  if (!myTurn(m)) {
    const side = s.turn === 'x' ? $('sideX') : $('sideO');
    side.classList.remove('nudge'); void side.offsetWidth; side.classList.add('nudge');
    if (G.mode === 'online' && !G.peer) toast('Waiting for your friend to open the link.');
    SND.no(); return;
  }
  if (s.cells[i]) {
    const rec = view.marks.get(i);
    if (rec) { rec.g.classList.remove('wince'); void rec.g.getBoundingClientRect(); rec.g.classList.add('wince'); }
    SND.no(); return;
  }
  append(String(i));
}
// add a token to the record; online it is written first and drawn at once, and taken back if refused
function append(tok) {
  if (G.mode !== 'online') { G.g += tok; render(); return; }
  const before = G.g;
  if (!TTT.canAppend(before, G.rule, tok, G.me)) return;
  G.g = before + tok; render();
  G.pending = tok;
  netAppend(before, tok).then(ok => {
    G.pending = null;
    if (!ok) { toast('That move did not go through.'); }
  }).catch(() => { G.pending = null; G.g = before; resetView(); render(true); toast('Lost the connection — try again.'); });
}
$('cells').addEventListener('pointerdown', ev => {
  const i = cellFromEvent(ev); if (i < 0) return;
  ev.preventDefault(); audio(); tryPlay(i);
});
$('cells').addEventListener('keydown', ev => {
  const i = cellFromEvent(ev); if (i < 0) return;
  const mv = {ArrowLeft: -1, ArrowRight: 1, ArrowUp: -3, ArrowDown: 3}[ev.key];
  if (mv) { const j = i + mv; if (j >= 0 && j < 9 && (Math.abs(mv) === 3 || Math.floor(j / 3) === Math.floor(i / 3))) $('cells').children[j].focus(); ev.preventDefault(); }
  else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); tryPlay(i); }
});
document.addEventListener('keydown', ev => {
  if (current !== 'play') return;
  const n = '123456789'.indexOf(ev.key);
  if (n >= 0) { audio(); tryPlay(n); }
  if ((ev.key === 'Enter' || ev.key === ' ') && $('bNext').classList.contains('show') && !ev.target.closest('.cell')) { ev.preventDefault(); nextRound(); }
});
// a pencil hovering: the mark you would make, faintly (mouse only)
$('cells').addEventListener('pointermove', ev => {
  if (ev.pointerType !== 'mouse') return;
  const i = cellFromEvent(ev), m = M();
  if (i < 0 || !myTurn(m) || m.state.cells[i]) { clearGhost(); return; }
  if (view.ghost && view.ghost.i === i) return;
  clearGhost();
  view.ghost = {i, g: makeMark(m.state.turn, i, 1, $('marks'), 'ghost')};
});
$('cells').addEventListener('pointerleave', clearGhost);
function clearGhost() { if (view.ghost) { view.ghost.g.remove(); view.ghost = null; } }

function nextRound() {
  const m = M();
  if (!m.state.result || m.winner) return;
  $('bNext').classList.remove('show');
  append('|');
}
$('bNext').addEventListener('click', () => { audio(); nextRound(); });

// ---------- computer ----------
let cpuT = 0;
function cpuMove() {
  clearTimeout(cpuT);
  const g0 = G.g, mode = G;
  cpuT = setTimeout(() => {
    if (G !== mode || G.g !== g0) return;
    const s = M().state;
    if (s.result || s.turn === G.me) return;
    G.g += TTT.choose(s, cpuRand, 0.72);
    render();
  }, 420 + cpuRand() * 380);
}

// ---------- match end ----------
function matchOver(m, quiet) {
  const w = m.winner;
  if (!G.counted && G.mode !== 'local') {
    G.counted = G.g.length;
    const rec = G.mode === 'cpu' ? P.cpu : P.online;
    if (w === G.me) rec.w++; else rec.l++;
    save();
  }
  let title;
  if (G.mode === 'local') title = `${w.toUpperCase()} takes the match`;
  else if (w === G.me) title = 'You take the match';
  else title = G.mode === 'cpu' ? 'Computer takes it' : 'Your friend takes it';
  $('cardTitle').textContent = title;
  $('cardScore').innerHTML = `<span class="x">${m.score.x}</span> – <span class="o">${m.score.o}</span>`;
  const rec = G.mode === 'cpu' ? P.cpu : P.online;
  $('cardLine').textContent = G.mode === 'local' ? 'Swap seats and go again?' :
    `${G.mode === 'cpu' ? 'Against the computer' : 'Online'}, you have won ${rec.w} of ${rec.w + rec.l}.`;
  $('bAgain').textContent = G.mode === 'online' ? 'Rematch' : 'Play again';
  $('card').classList.add('on');
  if (!quiet) setTimeout(() => $('bAgain').focus(), 300);
}
$('bAgain').addEventListener('click', () => {
  audio();
  $('card').classList.remove('on');
  G.counted = 0;
  if (G.mode === 'cpu') { G.me = TTT.other(G.me); labels(); } // swap who opens
  if (TTT.match(G.g, G.rule).winner) {
    if (G.mode === 'online') append('/');
    else { G.g += '/'; render(); }
  }
});
$('bHome').addEventListener('click', goHome);
$('bBack').addEventListener('click', goHome);
function goHome() {
  clearTimeout(cpuT);
  if (G && G.mode === 'online') leaveRoom();
  G = null;
  $('card').classList.remove('on');
  $('invite').classList.remove('on');
  history.replaceState(null, '', location.pathname);
  showRules();
  show('home');
  requestAnimationFrame(drawHero);
}

// ---------- mute ----------
function muteIcon() {
  $('muteIcon').innerHTML = P.mute
    ? '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'
    : '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5c1.6 1.8 1.6 5.2 0 7"/><path d="M19.6 6c2.8 3.3 2.8 8.7 0 12"/>';
  $('bMute').setAttribute('aria-pressed', P.mute);
}
$('bMute').addEventListener('click', () => { P.mute = !P.mute; save(); muteIcon(); if (!P.mute) SND.o(); });

// ---------- online ----------
let netPromise = null;
function net() {
  if (window.MARGINS_NET) return Promise.resolve(window.MARGINS_NET);
  return netPromise ||= (async () => {
    const [{app}, rt, au] = await Promise.all([import('../firebase.js'), import(FB + 'firebase-database.js'), import(FB + 'firebase-auth.js')]);
    const auth = au.getAuth(app);
    if (!auth.currentUser) await new Promise(res => { const off = au.onAuthStateChanged(auth, u => { if (u) { off(); res(); } }); setTimeout(res, 5000); });
    const db = rt.getDatabase(app);
    const ref = (id, sub = '') => rt.ref(db, `${ROOT}/${id}${sub}`);
    return {
      create: (id, data) => rt.set(ref(id), data),
      get: async id => (await rt.get(ref(id))).val(),
      watch: (id, cb, err) => rt.onValue(ref(id), s => cb(s.val()), err),
      // append to the record only if it is still what we saw and the move is legal
      append: async (id, before, tok, rule, seat) => {
        const r = await rt.runTransaction(ref(id, '/g'), cur => {
          cur = cur || '';
          if (cur !== before) return; // someone moved first
          return TTT.canAppend(cur, rule, tok, seat) ? cur + tok : undefined;
        });
        return r.committed;
      },
      claim: async (id, seat, token) => {
        const r = await rt.runTransaction(ref(id, '/c/' + seat), cur => !cur || cur === token ? token : undefined);
        return r.committed;
      },
      presence: (id, seat) => {
        const r = ref(id, '/on/' + seat);
        rt.set(r, true); rt.onDisconnect(r).set(false);
        return () => rt.set(r, false);
      }
    };
  })().catch(e => { netPromise = null; throw e; });
}
const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const roomId = code => 'margins-' + code;
let unwatch = null, unpresence = null;
function token() {
  let t = P.seats.__me;
  if (!t) { t = Array.from(crypto.getRandomValues(new Uint8Array(9)), b => ALPHA[b % ALPHA.length]).join(''); P.seats.__me = t; save(); }
  return t;
}
async function createRoom() {
  const code = Array.from(crypto.getRandomValues(new Uint8Array(5)), b => ALPHA[b % ALPHA.length]).join('');
  startGame('online', {rule: P.rule, me: 'x', room: code});
  G.peer = false;
  $('code').textContent = code;
  $('invite').classList.add('on');
  history.replaceState(null, '', location.pathname + '?r=' + code);
  try {
    const N = await net();
    await N.create(roomId(code), {r: P.rule, g: '', c: {x: token()}, t: Date.now()});
    rememberSeat(code, 'x');
    enterRoom(code);
  } catch (e) {
    console.warn(e);
    $('invite').classList.remove('on');
    toast('Could not reach the server. Pass the phone instead?', 4000);
  }
}
function rememberSeat(code, seat) {
  P.seats[code] = seat;
  const keys = Object.keys(P.seats).filter(k => k !== '__me');
  while (keys.length > 20) delete P.seats[keys.shift()];
  save();
}
async function joinRoom(code) {
  startGame('online', {room: code, me: 'o'});
  G.peer = false;
  setSay('Joining…', '');
  try {
    const N = await net();
    const d = await N.get(roomId(code));
    if (!d) { goHome(); toast('That game no longer exists.', 3600); return; }
    G.rule = d.r === 'v' ? 'v' : 'c';
    let seat = P.seats[code];
    if (seat && d.c && d.c[seat] !== token()) seat = null;
    if (!seat) {
      if (d.c && d.c.x === token()) seat = 'x';
      else if (await N.claim(roomId(code), 'o', token())) seat = 'o';
    }
    if (!seat) { goHome(); toast('This game already has two players.', 3600); return; }
    rememberSeat(code, seat);
    G.me = seat; labels();
    if (seat === 'x') { $('code').textContent = code; }
    enterRoom(code);
  } catch (e) {
    console.warn(e);
    goHome(); toast('Could not reach the server.', 3600);
  }
}
async function enterRoom(code) {
  const N = await net();
  if (!G || G.room !== code) return;
  unpresence = N.presence(roomId(code), G.me);
  unwatch = N.watch(roomId(code), d => {
    if (!G || G.room !== code || !d) return;
    const them = TTT.other(G.me);
    const hasPeer = !!(d.c && d.c[them]);
    const wasPeer = G.peer;
    G.peer = hasPeer;
    G.away = hasPeer && d.on && d.on[them] === false;
    $(them === 'x' ? 'sideX' : 'sideO').classList.toggle('here', hasPeer && !G.away);
    $(them === 'x' ? 'sideX' : 'sideO').classList.toggle('away', !!G.away);
    $('invite').classList.toggle('on', !hasPeer && G.me === 'x');
    if (hasPeer && !wasPeer && G.me === 'x') { SND.join(); hello(them); drawGrid(); }
    const g = d.g || '';
    if (G.pending && g + '' !== G.g && !g.startsWith(G.g)) {
      // our optimistic token was refused: go back to the truth
      G.pending = null; G.g = g; resetView(); render(true); return;
    }
    if (g === G.g) { render(); return; }
    if (g.startsWith(G.g)) { G.g = g; render(); }
    else { G.g = g; resetView(); render(true); }
  }, () => toast('Lost the connection.'));
}
function netAppend(before, tok) { return net().then(N => N.append(roomId(G.room), before, tok, G.rule, G.me)); }
function leaveRoom() {
  if (unwatch) { unwatch(); unwatch = null; }
  if (unpresence) { unpresence(); unpresence = null; }
}
$('bCopy').addEventListener('click', async () => {
  const url = location.origin + location.pathname + '?r=' + G.room;
  try { await navigator.clipboard.writeText(url); $('bCopy').textContent = 'Copied'; } catch (e) { prompt('Copy this link for your friend:', url); }
  setTimeout(() => $('bCopy').textContent = 'Copy link', 1800);
});
$('bShare').addEventListener('click', async () => {
  const url = location.origin + location.pathname + '?r=' + G.room;
  const text = 'Tic-tac-toe? First to three. You are O.';
  if (navigator.share) { try { await navigator.share({title: 'Margins', text, url}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); $('bShare').textContent = 'Link copied'; setTimeout(() => $('bShare').textContent = 'Send the link', 2000); }
  catch (e) { prompt('Copy this link for your friend:', url); }
});

// a friend arriving is inked next to their mark, where the eye already is
function hello(p) {
  const w = $(p === 'x' ? 'whoX' : 'whoO');
  w.textContent = 'here!'; w.style.color = `var(--${p})`; w.style.fontWeight = 700; SND.o();
  setTimeout(() => { w.style.color = ''; w.style.fontWeight = ''; labels(); }, 2200);
}
// ---------- buttons ----------
$('bInvite').addEventListener('click', () => { audio(); createRoom(); });
$('bLocal').addEventListener('click', () => { audio(); startGame('local'); });
$('bCpu').addEventListener('click', () => { audio(); startGame('cpu', {me: 'x'}); });

// ---------- boot ----------
muteIcon();
showRules();
const qr = new URLSearchParams(location.search).get('r');
if (qr && /^[A-Z0-9]{5}$/.test(qr.toUpperCase())) joinRoom(qr.toUpperCase());
else {
  show('home');
  requestAnimationFrame(drawHero);
  // the previous page shared games as #abc12; those rooms belong to it and cannot be joined here
  if (/^#[a-z0-9]{4,8}$/.test(location.hash)) { history.replaceState(null, '', location.pathname); toast('That invite came from the old version of this page. Start a new one here.', 4200); }
}
</script>
