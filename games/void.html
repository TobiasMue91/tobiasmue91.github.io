<style>
:root{--ink:#2a1c18;--paper:#f1e6cf;--paper2:#e4d6b8;--tom:#e8553d;--vio:#7a4dff;--pink:#ff4fa3;--h:72px;--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas#stage{position:fixed;inset:0;display:block;touch-action:none;background:#7a736a}
#grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.22;background-size:180px 180px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.scene{position:fixed;inset:0;display:none;pointer-events:none}
.scene.on{display:block}
.stamp{background:var(--paper);box-shadow:0 0 0 2.5px var(--ink),3px 4px 0 2.5px rgba(42,28,24,.55);border-radius:50%}

/* hud */
#hud{position:fixed;left:0;right:0;top:0;margin:0 auto;max-width:720px;padding:calc(10px + var(--sa-t)) 12px 0;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none}
body[data-mode=play] #hud,body[data-mode=pause] #hud,body[data-mode=closing] #hud{display:flex}
#badge{position:relative;width:var(--h);height:var(--h);margin-top:4px;flex:none}
#badge canvas{position:absolute;inset:0;width:100%;height:100%}
#badge svg,#timer svg.rg{position:absolute;inset:0;width:100%;height:100%}
#plate.flash{animation:pflash .8s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pflash{0%{transform:rotate(-.6deg) scale(1);background:var(--paper)}20%{transform:rotate(-2deg) scale(1.16);background:#ff9ed0}100%{transform:rotate(-.6deg) scale(1);background:var(--paper)}}
#plate{margin-top:6px;filter:drop-shadow(0 0 7px rgba(42,28,24,.35));padding:6px 14px 8px 12px;border-radius:14px;display:flex;align-items:flex-end;background:var(--paper);box-shadow:0 0 0 2.5px var(--ink),3px 4px 0 2.5px rgba(42,28,24,.55);transform:rotate(-.6deg)}

.cell{display:block;position:relative}
.cell svg{display:block}
.cell.pop{animation:digit .22s cubic-bezier(.2,.9,.3,1.4)}
@keyframes digit{0%{transform:translateY(7px) scale(.82);opacity:.35}100%{transform:none;opacity:1}}
#badge.pop{animation:bpop .55s cubic-bezier(.2,.9,.3,1.5)}

#timer.gain{animation:tgain .6s cubic-bezier(.2,.9,.3,1.5)}
@keyframes tgain{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}
#unit{font:800 18px/1 "Helvetica Neue",Arial,sans-serif;margin:0 0 5px 7px;letter-spacing:.01em;white-space:nowrap}
#timer{position:relative;width:var(--h);height:var(--h);margin-top:4px;flex:none;pointer-events:auto;cursor:pointer;touch-action:manipulation}
#tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
#hud.low #tm{color:var(--tom);animation:pulse .5s ease-in-out infinite alternate}
#hud.low #timer{animation:pulse .5s ease-in-out infinite alternate}

#pops{position:fixed;inset:0;pointer-events:none}

/* chapter card */
#card{position:fixed;left:0;right:0;top:15%;display:flex;justify-content:center;pointer-events:none;opacity:0}
#card.on{animation:card 2.7s cubic-bezier(.2,.8,.2,1) both}
#card small{display:block;margin-top:9px;font:700 clamp(12px,3.4vw,15px)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;opacity:.75;text-align:center}
#slab{position:fixed;left:0;right:0;top:calc(24% );display:flex;justify-content:center;pointer-events:none;opacity:0}
#slab.on{animation:slab 1.5s cubic-bezier(.2,.8,.2,1) both}
#slab div{background:var(--ink);color:var(--paper);padding:9px 18px 9px 22px;border-radius:5px;box-shadow:4px 5px 0 var(--vio);font:800 clamp(12px,3.6vw,16px)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;transform:rotate(1.2deg)}
@keyframes slab{0%{opacity:0;transform:translateX(60vw)}14%{opacity:1;transform:translateX(-8px)}22%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#card div{background:var(--paper);padding:14px 30px 14px 36px;border-radius:6px;box-shadow:0 0 0 3px var(--ink),7px 8px 0 3px rgba(42,28,24,.55);font:800 clamp(22px,7vw,40px)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;transform:rotate(-2.2deg)}
@keyframes card{0%{opacity:0;transform:translateX(-80vw) rotate(-8deg)}14%{opacity:1;transform:translateX(14px) rotate(1deg)}20%{transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateX(70vw) rotate(6deg)}}

/* thumb stick and first-run hand */
#stick{position:fixed;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .12s}
#stick.on{opacity:1}
#stick i{position:absolute;left:-48px;top:-48px;width:96px;height:96px;border-radius:50%;border:3px solid var(--ink);background:rgba(42,28,24,.14);box-shadow:0 0 0 3px rgba(241,230,207,.8)}
#knob{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px var(--ink)}
#hand{position:fixed;left:50%;top:70%;width:96px;height:96px;pointer-events:none;opacity:0;--dx:40px;--dy:-40px}
#hand.on{opacity:1}
#hand i{position:absolute;inset:0;border-radius:50%;border:3px solid var(--ink);background:rgba(42,28,24,.18);box-shadow:0 0 0 3px rgba(241,230,207,.85)}
#hand b{position:absolute;left:26px;top:26px;width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px var(--ink),0 0 0 6px rgba(241,230,207,.8);animation:hand 2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes hand{0%,12%{transform:translate(0,0) scale(1)}22%{transform:translate(0,0) scale(.9)}68%,82%{transform:translate(var(--dx),var(--dy)) scale(.9)}100%{transform:translate(0,0) scale(1)}}

/* title */
#title{align-items:center;justify-content:space-between;flex-direction:column;padding:calc(7vh + var(--sa-t)) 20px calc(6vh + var(--sa-b));text-align:center}
#title.on{display:flex;pointer-events:auto}
#title:before{content:"";position:absolute;inset:0;pointer-events:none}
#brand,#titlefoot{position:relative}
#brand{background:var(--paper);padding:18px 26px 16px;border-radius:8px;box-shadow:0 0 0 3px var(--ink),6px 8px 0 3px rgba(42,28,24,.55);transform:rotate(-1.6deg)}
#wordmark{display:flex;justify-content:center;align-items:flex-end;gap:4px}
#tag{margin-top:12px;font:800 14px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.42em;text-transform:uppercase;color:var(--ink);padding-left:.42em}
#playhole{position:fixed;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;pointer-events:auto;z-index:3}

#titlefoot{text-align:center}
#seedline{font:800 14px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;padding-left:.3em}
#bestline{margin-top:7px;font:700 14px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;min-height:13px}
#titlefoot{background:var(--paper);padding:11px 20px 10px;border-radius:30px;box-shadow:0 0 0 2.5px var(--ink),4px 5px 0 2.5px rgba(42,28,24,.55);transform:rotate(.8deg)}
.snd{position:absolute;right:calc(14px);top:calc(12px + var(--sa-t));width:52px;height:52px;border-radius:50%}
.snd svg{width:22px;height:22px;position:absolute;inset:0;margin:auto}
.snd .x{display:none}body.muted .snd .x{display:block}body.muted .snd .w{display:none}

#pause{align-items:center;justify-content:center;background:rgba(42,28,24,.5)}
#result{align-items:flex-end;justify-content:center;padding:0 14px calc(18px + var(--sa-b))}
@media (orientation:landscape) and (min-width:700px){#result{align-items:center;justify-content:flex-end;padding:0 5vw 0 0}}
@media (orientation:landscape) and (max-height:520px){#result .sheet{padding:14px 18px}}
#pause.on,#result.on{display:flex;pointer-events:auto}
.sheet{background:var(--paper);border-radius:8px;padding:22px 24px 22px;box-shadow:0 0 0 3px var(--ink),7px 9px 0 3px rgba(42,28,24,.55);text-align:center;max-width:min(92vw,420px);width:100%;transform:rotate(-.8deg);animation:sheet .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheet{from{opacity:0;transform:translateY(24px) rotate(-3deg)}}
.sheet h2{margin:0 0 4px;font:800 11px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.38em;text-transform:uppercase;padding-left:.38em}
.sheet .sub{font:700 14px/1.3 "Helvetica Neue",Arial,sans-serif}
.btns{display:flex;gap:10px;justify-content:center;margin-top:18px;align-items:center}
.btn{min-height:52px;padding:0 24px;border-radius:26px;background:var(--ink);color:var(--paper);font:800 14px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;box-shadow:3px 4px 0 var(--vio);transition:transform .12s}

.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 0 0 2.5px var(--ink),3px 4px 0 2.5px rgba(42,28,24,.55)}

.btn.sm{min-height:48px;padding:0 14px;font-size:12px}
.btn.big{padding:0 34px;font-size:16px}
.btn.done:after{content:" \2713"}
#rsize{display:flex;align-items:flex-end;justify-content:center;gap:2px;margin:12px 0 4px}
#rsize .big{display:flex;gap:1px;align-items:flex-end}

#rlike{font:700 14px/1.3 "Helvetica Neue",Arial,sans-serif;min-height:18px}
#rstats{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:14px;border-top:2.5px solid var(--ink)}

#rbestline{margin-top:10px;font:800 12px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
#rbest.on #rbestline{color:#fff;background:var(--pink);display:inline-block;padding:9px 16px 8px 18px;border-radius:3px;font-size:15px;box-shadow:3px 3px 0 var(--ink);animation:thump .5s .9s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes thump{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
#rbest{min-height:30px}
@media (prefers-reduced-motion:reduce){#slab.on{animation:cardr 1.5s both}.cell.pop,#badge.pop,#timer.gain,#rbest.on #rbestline{animation:none}#hand b{animation:none;transform:translate(var(--dx),var(--dy))}#playhole svg,#hud.low #tm,#hud.low #timer{animation:none}.sheet{animation:none}#card.on{animation:cardr 2.6s both}@keyframes cardr{0%{opacity:0}10%,85%{opacity:1;transform:none}100%{opacity:0}}#hand.on{animation:none;opacity:.9}}
@media (max-height:520px){#title{padding-top:3vh;padding-bottom:3vh}}
</style>
</head>
