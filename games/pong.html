<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pong - Table Tennis Against the Club Ladder</title>
<meta name="description" content="Pong as table tennis: climb a ladder of eight club players or play a friend on one screen. First to eleven, the rally speeds up with every hit, and where the ball meets your bat sets the angle.">
<meta name="theme-color" content="#0f0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--hall:#0f0a09;--paper:#f2ebdb;--ink:#201716;--red:#c8232f;--muted:#7d7266;--rule:#d9cfbb;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--hall);overflow:hidden;font-family:'Barlow Condensed','Arial Narrow',sans-serif;color:var(--ink);
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.card{background:var(--paper);border-radius:8px;padding:20px 22px 16px;width:100%;max-width:360px;box-shadow:0 30px 60px rgba(0,0,0,.6);pointer-events:auto;
 transition:transform .45s var(--ease),opacity .3s ease}
.hide .card{transform:translateY(40px);opacity:0;pointer-events:none}
#result{background:rgba(10,6,5,.4);transition:background .4s}#result.hide{background:rgba(10,6,5,0)}
#result .card{transition:transform .6s cubic-bezier(.3,1.45,.5,1),opacity .25s ease}
#result.hide .card{transform:translateY(30px) scale(.92)}
.layer.hide{visibility:hidden;transition:visibility 0s .45s}
.crest{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.crest svg{flex:none}
h1{font-weight:800;font-size:58px;letter-spacing:.03em;margin:0;line-height:.8}
.est{font-weight:600;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:6px}
ol{list-style:none;margin:0 0 14px;padding:0;border-top:1px solid var(--rule)}
li{display:grid;grid-template-columns:18px 1fr auto;align-items:baseline;gap:8px;padding:4px 8px;border-bottom:1px solid var(--rule);font-size:18px;font-weight:700;line-height:1.25;border-radius:3px}
li em{font-style:normal;font-weight:500;font-size:15px;color:var(--muted);margin-left:5px}
li b{font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
li .n{font-size:13px;color:var(--muted)}
li.open{cursor:pointer}
li.open:hover{background:#e8dfcb}
li.sel{background:var(--ink);color:var(--paper);border-color:transparent}li.sel em,li.sel .n{color:#b9ad9c}li.sel b{color:#ff9a5c}
li.locked{color:#8a7f70}li.locked em{color:#a39886}
.more{display:none;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin:-6px 0 12px}
.btn{font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase;border:0;border-radius:5px;padding:12px 18px;width:100%;display:block;
 transition:transform .12s var(--ease),filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn:focus-visible,li:focus-visible,.icon:focus-visible{outline:3px solid #ff8126;outline-offset:2px}
.primary{background:var(--red);color:#fff;margin-bottom:8px}
.primary:hover{filter:brightness(1.08)}
.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px #cfc4b0;font-size:17px;padding:9px}
.ghost:hover{box-shadow:inset 0 0 0 2px #a99c86}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.foot a{color:inherit;text-decoration:none}
.foot a:hover{color:var(--ink)}
.snd{border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:6px 0}
.snd:hover{color:var(--ink)}
@media (orientation:landscape) and (min-width:900px){#menu{justify-content:flex-start;padding-left:max(20px,2.5vw)}}
#menu li.far{display:none}#menu .more{display:block}
@media (orientation:portrait){#menu{align-items:flex-end}}
@media (max-height:520px) and (orientation:landscape){#menu .card{max-width:640px;display:grid;grid-template-columns:1fr 1fr;gap:0 20px}#menu ol{grid-row:span 3}h1{font-size:46px}}
/* match chrome */
.icon{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:44px;height:44px;border:0;border-radius:50%;
 background:rgba(242,235,219,.14);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.icon.on{opacity:1;pointer-events:auto}
.icon i{display:block;width:5px;height:17px;background:#f2ebdb;margin:0 2.5px;border-radius:1.5px}
.icon:hover{background:rgba(242,235,219,.16)}
#plate{position:fixed;left:50%;top:50%;transform:translate(-30%,-50%);pointer-events:none;opacity:0;transition:opacity .3s,transform .55s var(--ease);
 display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 18px;background:#1c1514;color:var(--paper);border-radius:6px;padding:14px 26px 14px 0;
 box-shadow:0 24px 50px rgba(0,0,0,.55);overflow:hidden;min-width:260px}
#plate{grid-template-columns:auto auto 1fr}
#plate:before{content:"";grid-row:span 3;align-self:stretch;width:8px;background:var(--red)}
#plate .gl{grid-row:span 3}#plate .gl svg{display:block}
#plate.on{opacity:1;transform:translate(-50%,-50%)}
#plate .r{font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#ff9a5c}
#plate .nm{font-size:64px;font-weight:800;line-height:.9;letter-spacing:.02em}
#plate .tg{font-size:20px;font-weight:500;color:#cdbfa9}
.res h2{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.res .big{font-size:44px;font-weight:800;line-height:.95;margin:0 0 12px}
.res .sc{display:flex;gap:6px;margin:0 0 14px}
.res .sc span{flex:1;background:#e6dcc7;border-radius:4px;padding:6px 10px;display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:700}
.res .sc b{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.res .stat{font-size:16px;font-weight:600;color:var(--muted);margin:-4px 0 14px;letter-spacing:.04em}
.res .stat b{color:var(--ink)}
.res .nx{font-size:16px;font-weight:600;color:var(--muted);margin:0 0 10px}
.res .nx b{color:var(--ink);font-size:19px}
#pause .card{max-width:300px;text-align:center}
#pause h2{font-size:40px;font-weight:800;margin:0 0 14px;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.card,#plate{transition:opacity .2s!important;transform:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Table tennis table"></canvas>
<button class="icon" id="pauseBtn" aria-label="Pause"><i></i><i></i></button>
<div id="plate" aria-live="polite"><div class="gl" aria-hidden="true"></div><div class="r"></div><div class="nm"></div><div class="tg"></div></div>

<div class="layer" id="menu"><div class="card" role="dialog" aria-label="Pong club">
 <div class="crest"><svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="26" fill="#1f5694" stroke="#201716" stroke-width="3"/><path d="M29 4v50" stroke="#f1efe8" stroke-width="2"/><rect x="11" y="18" width="5" height="22" rx="2.5" fill="#c8232f"/><rect x="42" y="18" width="5" height="22" rx="2.5" fill="#17171b"/><circle cx="35" cy="24" r="4" fill="#ff8126"/></svg>
 <div><h1>PONG</h1><div class="est">club · est. 1972</div></div></div>
 <ol id="ladder"></ol>
 <div class="more" id="more"></div>
 <button class="btn primary" id="playBtn">Play</button>
 <button class="btn ghost" id="twoBtn">Two players, one screen</button>
 <div class="foot"><button class="snd" id="sndBtn">Sound on</button><a href="https://www.gptgames.dev/" target="_top">gptgames.dev</a></div>
</div></div>

<div class="layer hide" id="pause"><div class="card" role="dialog" aria-label="Paused">
 <h2>Paused</h2>
 <button class="btn primary" id="resumeBtn">Resume</button>
 <button class="btn ghost" id="sndBtn2" style="margin-bottom:8px">Sound on</button>
 <button class="btn ghost" id="quitBtn">Leave match</button>
</div></div>

<div class="layer hide" id="result"><div class="card res" role="dialog" aria-label="Match result">
 <h2 id="rKick"></h2>
 <div class="big" id="rHead"></div>
 <div class="sc" id="rScore"></div>
 <div class="stat" id="rStat"></div>
 <div class="nx" id="rNext"></div>
 <button class="btn primary" id="rMain"></button>
 <button class="btn ghost" id="rAlt" style="margin-bottom:8px"></button>
 <button class="btn ghost" id="rMenu">Club</button>
</div></div>

<script id="core">
const Core = (() => {
  // Court units: centimetres-ish. u runs across the table (0..W), v along it (0..L); side 0 plays at v = 0.
  const W = 152.5, L = 244, BR = 3.2, BL = 28, BT = 5, BV = 9;
  const PLANE = BV + BT / 2 + BR;          // where the ball's centre meets a bat face
  const REACH = BL / 2 + BR * 0.7;         // how far from the bat's centre a ball still counts
  const MAXA = 55 * Math.PI / 180;         // the angle the very end of the blade sends the ball at
  const SERVE = 175, ACC = 1.085, MAX = 560;
  const SPINK = 0.24, SPINMAX = 140, SPINTAU = 0.55;
  const HUMAN = 1600;                      // a human bat follows the finger at up to this speed
  const BATMIN = BL / 2 - 6, BATMAX = W - BL / 2 + 6;
  const SERVE_AUTO = 1.6, CPU_SERVE = 0.9, POINT_PAUSE = 1.25, H = 1 / 480;

  // Eight club players. react: seconds before they read a ball coming at them; speed: how fast the bat moves;
  // err: sigma of their misjudgement at a ball of 300 u/s (it grows with the ball); aim: how often they place the
  // ball away from you; spin: how much curve they put on it; reads: whether they allow for your spin; home: how
  // far back to the middle they drift while the ball is away.
  const RIVALS = [
    {name: 'Pip',   tag: 'just learning',     react: .30, speed: 120, err: 9.5, aim: 0,   spin: 0,   reads: 0, home: 0},
    {name: 'Doris', tag: 'never hurries',     react: .26, speed: 140, err: 8.5, aim: .1,  spin: 0,   reads: 0, home: .4},
    {name: 'Marek', tag: 'loves the corners', react: .24, speed: 160, err: 7,   aim: .6,  spin: 0,   reads: 0, home: .5},
    {name: 'Yuki',  tag: 'spins everything',  react: .21, speed: 180, err: 6.3, aim: .3,  spin: 1,   reads: .5, home: .6},
    {name: 'Bram',  tag: 'the wall',          react: .19, speed: 200, err: 5.6, aim: .05, spin: 0,   reads: 1, home: 1},
    {name: 'Ines',  tag: 'fast hands',        react: .14, speed: 270, err: 5.2, aim: .5,  spin: .3,  reads: 1, home: .8},
    {name: 'Chen',  tag: 'reads you',         react: .14, speed: 260, err: 4.6, aim: .8,  spin: .3,  reads: 1, home: 1},
    {name: 'Vera',  tag: 'club champion',     react: .12, speed: 290, err: 4,   aim: .8,  spin: .6,  reads: 1, home: 1},
  ];

  function rng(seed) {
    let a = seed >>> 0 || 1;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const gauss = r => { let s = 0; for (let i = 0; i < 4; i++) s += r(); return (s - 2) * Math.sqrt(3); };

  // A bot is a set of rival-shaped numbers; the page uses RIVALS, the tests also use human-shaped ones.
  function create(o = {}) {
    const seed = o.seed >>> 0 || 1;
    const s = {
      seed, rand: rng(seed), t: 0, phase: 'serve', phaseT: 0,
      first: o.first ?? 0, server: o.first ?? 0, score: [0, 0], winner: -1, to: o.to || 11,
      ball: {u: W / 2, v: PLANE, vu: 0, vv: 0, spd: SERVE, spin: 0, out: -1},
      bats: [0, 1].map(() => ({u: W / 2, vel: 0, sv: 0, target: W / 2, max: HUMAN})),
      bots: [o.bots?.[0] || null, o.bots?.[1] || null].map(b => b && {p: b, readAt: -1, target: W / 2, flick: 0}),
      hits: 0, rally: 0, longest: 0, fastest: 0, lastHit: -1,
    };
    s.bots.forEach((b, i) => { if (b) s.bats[i].max = b.p.speed; });
    placeOnBat(s);
    return s;
  }
  const facing = side => side ? -1 : 1;                     // the direction a side sends the ball along v
  const planeOf = side => side ? L - PLANE : PLANE;
  function placeOnBat(s) { const b = s.ball; b.u = clamp(s.bats[s.server].u, BR, W - BR); b.v = planeOf(s.server); b.vu = b.vv = b.spin = 0; b.spd = SERVE; b.out = -1; }

  function launch(s, side, ev) {
    const b = s.ball, bat = s.bats[side];
    let a;
    if (s.bots[side]) a = (s.rand() < .5 ? -1 : 1) * (0.12 + s.rand() * (0.15 + 0.35 * s.bots[side].p.aim));
    else if (Math.abs(bat.vel) > 25) a = clamp(bat.vel / 900, -1, 1) * 0.6;
    else a = (s.rand() < .5 ? -1 : 1) * (0.12 + s.rand() * 0.25);
    b.spd = SERVE; b.spin = 0; b.vu = Math.sin(a) * SERVE; b.vv = Math.cos(a) * SERVE * facing(side);
    s.phase = 'rally'; s.phaseT = 0; s.rally = 0; s.lastHit = side;
    ev.push({type: 'serve', side, u: b.u, v: b.v});
  }

  // The rule the whole game stands on: where the ball meets the blade sets the angle, the rally sets the speed,
  // and the bat's own motion along the rail puts curve on it.
  function hit(s, side, uc, ev) {
    const b = s.ball, bat = s.bats[side];
    const off = clamp((uc - bat.u) / (BL / 2), -1, 1);
    const a = off * MAXA;
    b.spd = Math.min(MAX, b.spd * ACC);
    let spin = clamp(bat.vel * SPINK, -SPINMAX, SPINMAX);
    const bot = s.bots[side];
    if (bot && bot.p.spin) spin = clamp(spin + bot.flick * bot.p.spin * SPINMAX * 0.8, -SPINMAX, SPINMAX);
    b.spin = spin;
    b.vu = Math.sin(a) * b.spd; b.vv = Math.cos(a) * b.spd * facing(side);
    b.u = uc; b.v = planeOf(side);
    s.hits++; s.rally++; s.lastHit = side;
    s.longest = Math.max(s.longest, s.rally); s.fastest = Math.max(s.fastest, b.spd);
    ev.push({type: 'hit', side, u: uc, v: b.v, off, spd: b.spd, spin, rally: s.rally});
  }

  // Integrate the ball one substep: curve, then keep its speed and a playable angle.
  function fly(b, h) {
    if (b.spin) {
      b.vu += b.spin * h; b.spin *= Math.exp(-h / SPINTAU);
      if (Math.abs(b.spin) < 0.5) b.spin = 0;
      const lim = Math.tan(MAXA + 0.1) * Math.abs(b.vv);
      if (Math.abs(b.vu) > lim) b.vu = Math.sign(b.vu) * lim;
      const k = b.spd / Math.hypot(b.vu, b.vv); b.vu *= k; b.vv *= k;
    }
    b.u += b.vu * h; b.v += b.vv * h;
    let wall = 0;
    if (b.u < BR) { b.u = 2 * BR - b.u; b.vu = Math.abs(b.vu); b.spin *= -0.5; wall = 1; }
    else if (b.u > W - BR) { b.u = 2 * (W - BR) - b.u; b.vu = -Math.abs(b.vu); b.spin *= -0.5; wall = 1; }
    return wall;
  }

  // Where (u) and when (seconds) the ball will cross a side's bat plane, flying as it does now.
  function predict(s, side, withSpin = 1) {
    const b = {...s.ball}; if (!withSpin) b.spin = 0;
    const p = planeOf(side), dir = facing(side);
    if (Math.sign(b.vv) !== -dir) return null;
    let t = 0;
    while (t < 6) {
      const pu = b.u, pv = b.v; fly(b, H); t += H;
      if ((pv - p) * (b.v - p) <= 0) { const f = (pv - p) / (pv - b.v || 1); return {u: pu + (b.u - pu) * f, t: t - H * (1 - f)}; }
    }
    return null;
  }

  function think(s, side, dt) {
    const bot = s.bots[side], p = bot.p, b = s.ball, bat = s.bats[side];
    if (s.phase === 'serve') { bot.target = W / 2; return; }
    if (s.phase !== 'rally') return;
    const coming = Math.sign(b.vv) === -facing(side) && b.out < 0;
    if (!coming) { bot.readAt = -1; bot.target = bat.u + (W / 2 - bat.u) * p.home; return; }
    if (bot.readAt < 0) bot.readAt = s.t + p.react;
    if (s.t >= bot.readAt && bot.readAt > 0) {
      bot.readAt = 0;
      const pr = predict(s, side, p.reads > s.rand() ? 1 : 0);
      if (!pr) return;
      const miss = gauss(s.rand) * p.err * (b.spd / 300) ** 1.4;
      let off = (s.rand() - .5) * 0.5;
      if (s.rand() < p.aim) {
        const opp = s.bats[1 - side].u;
        off = (opp > W / 2 ? -1 : 1) * (0.35 + 0.3 * s.rand());
        if (Math.abs(pr.u - W / 2) > W * 0.4) off = Math.sign(W / 2 - pr.u) * Math.abs(off) * -1;
      }
      bot.flick = p.spin ? (s.rand() < .5 ? -1 : 1) : 0;
      bot.target = pr.u + miss - off * BL / 2;
    }
  }

  // A human bat goes where the finger is; a machine's bat accelerates and brakes, so it never teleports.
  function moveBat(bat, target, h, eased) {
    const want = clamp(target, BATMIN, BATMAX);
    const d = want - bat.u;
    let nu;
    if (eased) {
      const A = bat.max * 9, des = Math.sign(d) * Math.min(bat.max, Math.sqrt(2 * A * Math.abs(d)));
      bat.sv += clamp(des - bat.sv, -A * h, A * h);
      nu = bat.u + bat.sv * h;
      if ((want - nu) * d < 0) { nu = want; bat.sv = 0; }
    } else {
      const m = bat.max * h;
      nu = Math.abs(d) <= m ? want : bat.u + Math.sign(d) * m;
    }
    const v = (nu - bat.u) / h;
    bat.vel += (v - bat.vel) * Math.min(1, h / 0.04);
    bat.u = nu;
  }

  // input: {u: [targetU|null, targetU|null], serve: [bool, bool]}
  function step(s, dt, input = {}) {
    const ev = [];
    if (s.phase === 'over') return ev;
    const n = Math.max(1, Math.ceil(dt / H)), h = dt / n;
    for (let i = 0; i < n; i++) {
      s.t += h; s.phaseT += h;
      for (let k = 0; k < 2; k++) {
        if (s.bots[k]) think(s, k, h);
        const tgt = s.bots[k] ? s.bots[k].target : (input.u?.[k] ?? s.bats[k].u);
        moveBat(s.bats[k], tgt, h, !!s.bots[k]);
      }
      const b = s.ball;
      if (s.phase === 'serve') {
        b.u = clamp(s.bats[s.server].u, BR, W - BR);
        const bot = s.bots[s.server];
        if (bot ? s.phaseT >= CPU_SERVE : (input.serve?.[s.server] && s.phaseT > 0.25) || (!input.hold && s.phaseT >= SERVE_AUTO)) launch(s, s.server, ev);
        continue;
      }
      if (s.phase === 'point') {
        if (s.phaseT >= POINT_PAUSE) {
          if (s.winner >= 0) { s.phase = 'over'; ev.push({type: 'over', winner: s.winner}); return ev; }
          s.phase = 'serve'; s.phaseT = 0; placeOnBat(s); ev.push({type: 'ready', server: s.server});
        } else fly(b, h);
        continue;
      }
      const pu = b.u, pv = b.v;
      if (fly(b, h)) ev.push({type: 'wall', u: b.u, v: b.v, spd: b.spd});
      for (let k = 0; k < 2; k++) {
        const p = planeOf(k);
        if (Math.sign(b.vv) !== -facing(k) || b.out === k) continue;
        if ((pv - p) * (b.v - p) > 0 && pv !== p) continue;
        const f = (pv - p) / (pv - b.v || 1);
        const uc = pu + (b.u - pu) * f;
        if (Math.abs(uc - s.bats[k].u) <= REACH) hit(s, k, clamp(uc, BR, W - BR), ev);
        else { b.out = k; ev.push({type: 'pass', side: k, u: uc}); }
      }
      if (b.v < -BR * 2 || b.v > L + BR * 2) {
        const loser = b.v < 0 ? 0 : 1, w = 1 - loser;
        s.score[w]++;
        s.server = serverFor(s.first, s.score[0] + s.score[1], s.to);
        if (s.score[w] >= s.to && s.score[w] - s.score[loser] >= 2) s.winner = w;
        s.phase = 'point'; s.phaseT = 0;
        ev.push({type: 'point', side: w, score: [...s.score], rally: s.rally, server: s.server, match: s.winner >= 0});
      }
    }
    return ev;
  }

  // Table tennis: two serves each, one each once both players reach to-1.
  function serverFor(first, n, to = 11) {
    const d = 2 * (to - 1);
    return n < d ? (first + Math.floor(n / 2)) % 2 : (first + n) % 2;
  }

  // Saves trust nothing: everything is re-derived from small, clamped integers.
  function cleanSave(raw) {
    const o = {beaten: 0, results: [], best: 0, muted: false, plays: 0};
    if (!raw || typeof raw !== 'object') return o;
    const int = (x, a, b) => Number.isFinite(+x) ? clamp(Math.floor(+x), a, b) : a;

function pause() { if (mode !== 'play' && mode !== 'intro') return; paused = true; pointers.clear(); keys.clear(); show('pause'); $('resumeBtn').focus({preventScroll: true}); }

function finish(winner) {

  const [a, b] = S.score, nm = names();
  const prevBest = save.best;
  if (!two) {
    save.plays++;
    save.best = Math.max(save.best, S.longest);
    if (winner === 0) {
      if (rival === save.beaten) { save.beaten = rival + 1; }
      if (rival < save.beaten) { const prev = save.results[rival]; if (!prev || a - b > prev[0] - prev[1]) save.results[rival] = [a, b]; }
      while (save.results.length < save.beaten) save.results.push(null);
    }
    persist();
  }
  const won = two || winner === 0;
  won ? sfx.win() : sfx.lose();
  $('rKick').textContent = two ? 'Two players' : `Rung ${rival + 1} · ${RIVALS[rival].name}`;
  if (two) $('rHead').textContent = `${winner === 0 ? 'Red' : 'Black'} wins`;
  else if (winner === 0) $('rHead').textContent = rival === RIVALS.length - 1 ? 'Club champion' : `You beat ${RIVALS[rival].name}`;
  else $('rHead').textContent = `${RIVALS[rival].name} wins`;
  $('rScore').innerHTML = `<span>${nm[0]}<b>${a}</b></span><span>${nm[1]}<b>${b}</b></span>`;
  const newBest = !two && S.longest >= 6 && S.longest > prevBest;
  $('rStat').style.display = S.longest >= 3 ? '' : 'none';
  $('rStat').innerHTML = `Longest rally <b>${S.longest}</b> hits` + (newBest ? ' · <b>a new best</b>' : (!two && prevBest > S.longest ? ` · best <b>${prevBest}</b>` : ''));
  const nx = $('rNext'), main = $('rMain'), alt = $('rAlt');
  alt.style.display = '';
  if (two) { nx.innerHTML = ''; main.textContent = 'Rematch'; main.onclick = () => startMatch(0, true); alt.style.display = 'none'; }
  else if (winner === 0 && rival < RIVALS.length - 1) {
    const n = RIVALS[rival + 1];
    nx.innerHTML = `Next on the ladder: <b>${n.name}</b>, ${n.tag}`;
    main.textContent = `Play ${n.name}`; main.onclick = () => startMatch(rival + 1, false);
    alt.textContent = 'Rematch'; alt.onclick = () => startMatch(rival, false);
  } else if (winner === 0) {
    nx.innerHTML = 'Every rung of the ladder is yours.';
    main.textContent = 'Rematch'; main.onclick = () => startMatch(rival, false); alt.style.display = 'none';
  } else {
    nx.textContent = LESSON[rival];
    main.textContent = 'Rematch'; main.onclick = () => startMatch(rival, false);
    alt.style.display = 'none';
  }
  setTimeout(() => { if (mode === 'over') { show('result'); main.focus({preventScroll: true}); } }, RM.matches ? 300 : 950);
}

// What each club player teaches, said once you have lost to them.
const LESSON = [
  'Pip is just learning. Keep the ball on the table and Pip will miss.',
  'Doris never hurries. Every hit speeds the rally up; keep it going and she falls behind.',
  'Marek aims away from you. Drift back to the middle after every hit.',
  'Yuki puts curve on everything. Watch where the ball is heading, not where it is.',
  'Bram returns everything straight. Hit with the end of your bat to send it wide.',
  'Ines has fast hands but loose ones. Long, fast rallies break her.',
  'Chen sends it where you are not. Recover to the middle, then go to the ball.',
  'Vera does it all. Hit off the edge, and move as you hit to curve it past her.',
];

// ---------- the ball's flight above the table (drawing only): over the net, one bounce, up to the bat ----------
const height = {prog: 0, bounced: true};
// Height above the table, in court units: up off the bat, over the net, one bounce on the far half, up to the bat.
function flightHeight() {
  const b = S.ball;
  if (S.phase === 'serve') return 6;
  if (S.lastHit < 0) return 0;
  const dir = S.lastHit ? -1 : 1, span = L - 2 * PLANE;
  const p = clamp(((b.v - Core.planeOf(S.lastHit)) * dir) / span, -0.2, 1.4);
  height.prog = p;
  const B = 0.74, k = (b.spd - Core.SERVE) / (MAX - Core.SERVE);
  if (p < 0) return 5;
  if (p < B) return 5 * (1 - p / B) + (26 - 9 * k) * Math.sin(Math.PI * p / B);
  return (12 - 4 * k) * Math.sin(Math.PI / 2 * Math.min(1.6, (p - B) / (1 - B)));

// ---------- events from the core become sound and motion ----------

    if (e.type === 'hit') {
      const k = (e.spd - Core.SERVE) / (MAX - Core.SERVE);
      sfx.hit(e.spd, e.off, pan(e.u, e.v));
      const b = S.ball;
      fx.hits.push({u: e.u, v: e.v, t: now, k, side: e.side, off: e.off, du: b.vu / b.spd, dv: b.vv / b.spd});

    else if (e.type === 'wall') { sfx.wall(pan(e.u, e.v)); fx.rings.push({u: e.u, v: e.v, t: now, k: -2}); }

    } else if (e.type === 'point') {

  }
}

    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, `rgba(255,190,110,${0.32 * a})`); gr.addColorStop(1, 'rgba(255,150,60,0)');

  for (const side of [0, 1]) {

    const a = t < 0.5 ? 1 : (1 - (t - 0.5) / 0.6) ** 2, s = Lo.s;
    const A = P(0, side ? L : 0), B = P(W, side ? L : 0);

// the umpire's flip scorer: two cards that flip on a point, names on the base, serve pips by the server's name
function drawScorer() {
  const k = Lo.port ? 1 : Lo.k, cw = 40 * k, ch = 54 * k, gap = 6 * k, bh = 20 * k;
  const appear = mode === 'attract' ? 0 : 1;
  if (!appear) return;
  const x0 = Lo.ox + Lo.tw / 2, y0 = Lo.oy - 6 * Lo.s - 12 - bh - ch / 2;
  g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.roundRect(x0 - cw - gap - 8 + 3, y0 - ch / 2 - 8 + 5, 2 * cw + 2 * gap + 16, ch + 16 + bh, 7); g.fill();
  g.fillStyle = '#231a19'; g.beginPath(); g.roundRect(x0 - cw - gap - 8, y0 - ch / 2 - 8, 2 * cw + 2 * gap + 16, ch + 16 + bh, 7); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const nm = names();
  // the cards follow the core's score, and flip whenever it moves
  const hold = fx.out && S.winner < 0 && now - fx.out.t < 0.5;
  for (const i of [0, 1]) if (cards[i].n !== S.score[i] && !hold) { const c = cards[i]; c.prev = c.n; c.n = S.score[i]; c.t = now + 0.15; }
  const serves = S.phase === 'over' ? 0 : servesLeft();
  [0, 1].forEach(i => {
    const x = x0 + (i ? 1 : -1) * (cw / 2 + gap / 2), y = y0, c = cards[i];
    const big = fx.win && fx.win.side === i ? 2.2 : 1, pt = now - fx.pulse[i], pz = pt > 0 && pt < 0.6 * big && !RM.matches ? Math.sin(Math.PI * pt / (0.6 * big)) * 0.12 * big : 0;
    g.save(); g.translate(x, y); g.scale(1 + pz, 1 + pz); g.translate(-x, -y);
    if (pt > 0 && pt < 0.8) { g.save(); g.shadowColor = `rgba(255,129,38,${0.9 * (1 - pt / 0.8)})`; g.shadowBlur = 22; g.fillStyle = '#231a19'; g.beginPath(); g.roundRect(x - cw / 2, y - ch / 2, cw, ch, 3); g.fill(); g.restore(); }
    const ft = RM.matches ? 1 : clamp((now - c.t) / 0.28, 0, 1);
    const font = `800 ${46 * k}px "Barlow Condensed", sans-serif`;
    const half = (n, top) => {
      g.save(); g.beginPath(); g.rect(x - cw / 2, top ? y - ch / 2 : y, cw, ch / 2); g.clip();
      g.fillStyle = top ? '#f2ebdb' : '#e0d6c1'; g.beginPath(); g.roundRect(x - cw / 2, y - ch / 2, cw, ch, 3); g.fill();
      g.font = font; g.fillStyle = '#201716'; g.fillText(n, x, y + 2 * k); g.restore();

    half(ft > 0 ? c.n : c.prev, true);
    half(ft >= 0.5 ? c.n : c.prev, false);

      g.save();
      if (ft < 0.5) { const e = Math.cos(ft * Math.PI); g.translate(x, y); g.scale(1, e); g.translate(-x, -y); half(c.prev, true); g.fillStyle = `rgba(0,0,0,${0.25 * (1 - e)})`; g.fillRect(x - cw / 2, y - ch / 2, cw, ch / 2); }
      else { const e = -Math.cos(ft * Math.PI); g.translate(x, y); g.scale(1, e); g.translate(-x, -y); half(c.n, false); g.fillStyle = `rgba(0,0,0,${0.2 * (1 - e)})`; g.fillRect(x - cw / 2, y, cw, ch / 2); }
      g.restore();

    g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x - cw / 2, y - 0.5, cw, 1);

    const tw = g.measureText(nm[i]).width; g.letterSpacing = '0px';

}
function servesLeft() {
  const n = S.score[0] + S.score[1];

  return 2 - (n % 2);
}

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!Lo) return;
  if (!paused) now += dt;
  if (mode === 'intro' && now - introT > 1.5) { mode = 'play'; $('plate').classList.remove('on'); }
  if (!paused && S) {
    let sim = dt;
    if (fx.stop > 0) { const used = Math.min(fx.stop, sim); fx.stop -= used; sim -= used; }
    if (fx.slow > 0) { fx.slow -= dt; sim *= 0.3; }
    if (mode === 'intro') sim = 0;
    if (sim > 0) {
      if (mode === 'play') applyKeys(sim);
      const input = {u: [target[0], target[1]], serve: [serveReq[0], serveReq[1]], hold: holdServe && !fx.moved};
      if (mode !== 'play') { input.serve = [false, false]; }
      const ev = Core.step(S, sim, input);
      serveReq[0] = serveReq[1] = false;
      handle(ev);
      if (mode === 'attract' && S.score[0] + S.score[1] > 30) newMatch({seed: (Math.random() * 1e9) | 0, bots: [RIVALS[5], RIVALS[4]], to: 99});
    }
    // keep targets glued to the bats while a machine plays that side
    for (const k of [0, 1]) if (S.bots[k]) target[k] = S.bats[k].u;
    fx.trail.push({u: S.ball.u, v: S.ball.v, t: now, h: flightHeight()});
    if (fx.trail.length > 40) fx.trail.shift();
  }
  render(dt);
}
function render(dt) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  let sx = 0, sy = 0;
  if (fx.shake > 0.05) { sx = (Math.random() - 0.5) * fx.shake; sy = (Math.random() - 0.5) * fx.shake; fx.shake *= Math.pow(0.0005, dt); } else fx.shake = 0;
  g.drawImage(bg, 0, 0, Lo.w, Lo.h);
  if (sx || sy) g.translate(sx, sy);
  if (!S) return;
  drawFlash();
  drawBat(0, S.bats[0].u); drawBat(1, S.bats[1].u);
  drawBall();
  drawRings();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawScorer();
  drawRail();
  drawHint();
}

// ---------- boot ----------
mkGrain();
setMuted(save.muted);
resize();
addEventListener('resize', () => { resize(); });
startAttract();
requestAnimationFrame(t => { last = t; frame(t); });
if (document.fonts && document.fonts.load) document.fonts.load('800 40px "Barlow Condensed"').then(() => {}, () => {});
window.__pong = {get S() { return S; }, get mode() { return mode; }, get save() { return save; }, startMatch, finish, fx};
})();
