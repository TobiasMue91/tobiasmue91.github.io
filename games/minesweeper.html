  <style>
      :root {
          --cell-size: 30px;
          --border-size: 1px;
          --border-color: #bfbfbf;
          --cell-hidden-color: #c4c4c4;
          --cell-revealed-color: #fff;
          --mine-color: #c4c4c4;
          --mine-revealed-color: #ff4747;
          --font-size: 18px;
          --font-color: #333;
          --background-color: #e6e6e6;
          --header-font-size: 24px;
          --header-font-color: #333;
          --header-background-color: #fff;
          --header-padding: 10px;
          --header-margin: 0;
      }
      body {
          margin: 0;
          background-color: var(--background-color);
          font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #board-wrap {
          max-width: 100%;
          overflow-x: auto;
          padding: 0 12px 24px;
          box-sizing: border-box;
      }

      #minesweeper {
          margin: 0 auto;
          border-collapse: collapse;
          box-shadow: 0 0 10px 2px rgba(0, 0, 0, 0.2);
          background-color: var(--background-color);
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
          touch-action: manipulation;

      th,
      td {
          width: var(--cell-size);
          min-width: var(--cell-size);
          height: var(--cell-size);
          padding: 0;
          text-align: center;
          vertical-align: middle;
          border: var(--border-size) solid var(--border-color);
          cursor: pointer;
          font-size: calc(var(--cell-size) * 0.6);
          font-weight: bold;
          line-height: 1;
          color: var(--font-color);
      }

      .hidden {
          background-color: var(--cell-hidden-color);
      }

      .over .hidden,
      .over .flag {
          cursor: default;
      }

      .hidden:hover {
          background-color: #d2d2d2;
      }

      .over .hidden:hover {
          background-color: var(--cell-hidden-color);
      }

      .flag {
          background-color: var(--cell-hidden-color);
          font-size: calc(var(--cell-size) * 0.5);
      }

      .revealed {
          background-color: var(--cell-revealed-color);
          cursor: default;
      }

      .revealed.chordable {
          cursor: pointer;
      }

      .mine {
          background-color: var(--mine-color);
          font-size: calc(var(--cell-size) * 0.5);
      }

      .mine.hit {
          background-color: var(--mine-revealed-color);
      }

      .wrong {
          background-color: var(--cell-hidden-color);
          color: #c00;
      }

      .n1 { color: #1a4fd6; }
      .n2 { color: #1e7d22; }
      .n3 { color: #d11a1a; }
      .n4 { color: #10247a; }
      .n5 { color: #7a1010; }
      .n6 { color: #0f7a7a; }
      .n7 { color: #222; }
      .n8 { color: #777; }

      .header {
          display: flex;
          flex-wrap: wrap;
          gap: 8px 16px;
          justify-content: space-between;
          align-items: center;
          font-size: var(--header-font-size);
          color: var(--header-font-color);
          background-color: var(--header-background-color);
          padding: var(--header-padding);
          margin: var(--header-margin);
          box-shadow: 0 2px 5px 2px rgba(0, 0, 0, 0.1);
      }

      .header h1 {
          margin: 0;
          font-weight: normal;
      }

      .controls {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px 14px;
          font-size: 16px;
      }

      .controls label {
          display: inline-flex;
          align-items: center;
          gap: 5px;
      }

      .controls input[type=number] {
          width: 3.2em;
          font-size: 15px;
      }

      .controls select {
          font-size: 15px;
      }

      .header button,
      .status button {
          background-color: var(--background-color);
          border: none;
          color: var(--font-color);
          font-size: var(--font-size);
          padding: 10px 20px;
          border-radius: 5px;
          cursor: pointer;
          transition: background-color 0.3s ease;
      }

      .header button:hover,
      .status button:hover {
          background-color: var(--border-color);
          color: var(--header-font-color);
      }

      .status {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 14px;
          margin: 20px auto 6px;
          font-size: 20px;
          color: var(--font-color);

      .status .count {

      }

      #message {
          min-height: 1.4em;
          margin: 0 12px 14px;
          text-align: center;
          font-size: 15px;
          color: #555;
      }

      #message.won { color: #1e7d22; font-weight: bold; }
      #message.lost { color: #b00; font-weight: bold; }

<script id="core">
  // The board, the game and the no-guess generator. No DOM in here, so test/minesweeper.mjs
  // can run this block on its own in Node.
  const MS = (() => {
    const HIDDEN = 0, FLAGGED = 1, OPEN = 2;

    function neighbours(W, H) {
      const nb = [];
      for (let i = 0; i < W * H; i++) {
        const x = i % W, y = (i / W) | 0, list = [];
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const X = x + dx, Y = y + dy;
            if (X >= 0 && Y >= 0 && X < W && Y < H) list.push(Y * W + X);
          }
        }
        nb.push(list);
      }
      return nb;
    }

    function counts(nb, mine) {
      return nb.map(list => list.reduce((s, j) => s + mine[j], 0));
    }

    // Mines go down after the first click and stay out of the 3x3 around it, so the first
    // click always opens an area. On a board too crowded for that, only the clicked cell is spared.
    function layMines(W, H, M, first, rnd, nb) {
      const N = W * H;
      const spare = new Set([first, ...nb[first]]);
      if (N - spare.size < M) spare.clear(), spare.add(first);
      const pool = [];
      for (let i = 0; i < N; i++) if (!spare.has(i)) pool.push(i);
      const mine = new Uint8Array(N);
      for (let k = 0; k < M; k++) {
        const r = k + ((rnd() * (pool.length - k)) | 0);
        [pool[k], pool[r]] = [pool[r], pool[k]];
        mine[pool[k]] = 1;
      }
      return mine;
    }

    // Can the board be cleared from `first` by deduction alone? Uses the rules a person uses:
    // a number that is satisfied frees its other neighbours, a number with exactly as many
    // hidden neighbours as missing mines has them all, one number's neighbours contained in
    // another's settle the difference, and the total mine count settles the endgame.
    // Every rule is sound, so "true" is a guarantee; "false" only means these rules stall.
    function solve(W, H, M, mine, first, nb) {
      nb = nb || neighbours(W, H);
      const N = W * H, cnt = counts(nb, mine);
      const open = new Uint8Array(N), flag = new Uint8Array(N);
      let safeLeft = N - M, flags = 0, boom = false;
      const reveal = i => {
        const stack = [i];
        while (stack.length) {
          const c = stack.pop();
          if (open[c] || flag[c]) continue;
          if (mine[c]) { boom = true; continue; }
          open[c] = 1;
          safeLeft--;
          if (!cnt[c]) for (const j of nb[c]) if (!open[j]) stack.push(j);
        }
      };
      let progress;
      const settle = (cells, isMine) => {
        for (const j of cells) {
          if (isMine && !flag[j]) { flag[j] = 1; flags++; progress = true; }
          else if (!isMine && !open[j]) { reveal(j); progress = true; }
        }
      };
      reveal(first);
      while (safeLeft > 0 && !boom) {
        progress = false;
        const cons = [];
        for (let i = 0; i < N; i++) {
          if (!open[i] || !cnt[i]) continue;
          const cells = [];
          let f = 0;
          for (const j of nb[i]) {
            if (flag[j]) f++;
            else if (!open[j]) cells.push(j);
          }
          if (cells.length) cons.push({cells, n: cnt[i] - f});
        }
        for (const c of cons) {
          if (c.n === 0) settle(c.cells, false);
          else if (c.n === c.cells.length) settle(c.cells, true);
        }
        if (progress) continue;
        const byCell = new Map();
        cons.forEach(c => c.cells.forEach(j => (byCell.get(j) || byCell.set(j, []).get(j)).push(c)));
        outer:
          for (const a of cons) {
            for (const b of byCell.get(a.cells[0])) {
              if (b === a || b.cells.length <= a.cells.length) continue;
              if (!a.cells.every(j => b.cells.includes(j))) continue;
              const diff = b.cells.filter(j => !a.cells.includes(j)), d = b.n - a.n;
              if (d === 0) settle(diff, false);
              else if (d === diff.length) settle(diff, true);
              if (progress) break outer;
            }
          }
        if (progress) continue;
        const unknown = [];
        for (let i = 0; i < N; i++) if (!open[i] && !flag[i]) unknown.push(i);
        if (M - flags === 0) settle(unknown, false);
        else if (M - flags === unknown.length) settle(unknown, true);
        if (!progress) break;
      }
      return {solved: safeLeft === 0 && !boom, boom, open, flag};
    }

    const now = () => (typeof performance !== 'undefined' ? performance : Date).now();

    // With noGuess, keep dealing until the solver clears the board, within a time budget.
    // A board too dense to find one in time is returned anyway, marked as not guaranteed.
    function generate(W, H, M, first, opt = {}) {
      const rnd = opt.rnd || Math.random, nb = opt.nb || neighbours(W, H);
      const budget = opt.budgetMs ?? 800, maxTries = opt.maxTries ?? 20000, t0 = now();
      let mine, tries = 0;
      do {
        mine = layMines(W, H, M, first, rnd, nb);
        tries++;
        if (!opt.noGuess) return {mine, tries, guaranteed: false};
        if (solve(W, H, M, mine, first, nb).solved) return {mine, tries, guaranteed: true};
      } while (tries < maxTries && now() - t0 < budget);
      return {mine, tries, guaranteed: false};
    }

    class Game {
      constructor(W, H, M, opt = {}) {
        this.W = W; this.H = H; this.N = W * H;
        this.M = Math.max(1, Math.min(M, this.N - 1));
        this.opt = opt;
        this.nb = neighbours(W, H);
        this.state = new Uint8Array(this.N);
        this.mine = null; this.cnt = null;
        this.flags = 0; this.opened = 0;
        this.status = 'ready'; // ready, playing, won, lost
        this.hit = -1; this.guaranteed = false; this.tries = 0;
      }

      get over() { return this.status === 'won' || this.status === 'lost'; }

      _open(i) {
        const stack = [i];
        while (stack.length) {
          const c = stack.pop();
          if (this.state[c] !== HIDDEN) continue;
          this.state[c] = OPEN;
          if (this.mine[c]) {
            if (this.status !== 'lost') this.hit = c;
            this.status = 'lost';
            continue;
          }
          this.opened++;
          if (!this.cnt[c]) for (const j of this.nb[c]) if (this.state[j] === HIDDEN) stack.push(j);
        }
      }

      _settle() {
        if (this.status === 'playing' && this.opened === this.N - this.M) {
          this.status = 'won';
          for (let i = 0; i < this.N; i++) if (this.mine[i] && this.state[i] !== FLAGGED) this.state[i] = FLAGGED;
          this.flags = this.M;
        }
      }

      reveal(i) {
        if (this.over || this.state[i] !== HIDDEN) return false;
        if (!this.mine) {
          const g = generate(this.W, this.H, this.M, i, {...this.opt, nb: this.nb});
          this.mine = g.mine; this.guaranteed = g.guaranteed; this.tries = g.tries;
          this.cnt = counts(this.nb, this.mine);
          this.status = 'playing';
        }
        this._open(i);
        this._settle();
        return true;
      }

      toggleFlag(i) {
        if (this.over || this.state[i] === OPEN) return false;
        this.state[i] = this.state[i] === FLAGGED ? HIDDEN : FLAGGED;
        this.flags += this.state[i] === FLAGGED ? 1 : -1;
        return true;
      }

      // A number whose flags are all placed opens the rest of its neighbours.
      chord(i) {
        if (this.over || this.state[i] !== OPEN || !this.cnt[i]) return false;
        const around = this.nb[i];
        if (around.filter(j => this.state[j] === FLAGGED).length !== this.cnt[i]) return false;
        const todo = around.filter(j => this.state[j] === HIDDEN);
        if (!todo.length) return false;
        todo.forEach(j => this._open(j));
        this._settle();
        return true;
      }
    }

    return {HIDDEN, FLAGGED, OPEN, neighbours, counts, layMines, solve, generate, Game};
  })();
</script>
<script>
  const PRESETS = {
    beginner: [9, 9, 10],
    intermediate: [16, 16, 40],
    expert: [16, 30, 99]
  };
  const $ = id => document.getElementById(id);
  const table = $('minesweeper'), wrap = $('board-wrap'), msg = $('message');
  const presetEl = $('preset'), rowsEl = $('rows'), colsEl = $('columns'), minesEl = $('mines');
  const noGuessEl = $('noguess'), flagBtn = $('flag-mode'), face = $('face');
  let game, cells = [], flagMode = false, transposed = false;
  let time = 0, timerInterval = null;

  const store = {
    get() { try { return JSON.parse(localStorage.getItem('minesweeper') || '{}'); } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem('minesweeper', JSON.stringify(v)); } catch (e) { } }
  };

  function readSettings() {
    let R = Math.round(Number(rowsEl.value)) || 9, C = Math.round(Number(colsEl.value)) || 9;
    R = Math.max(1, Math.min(50, R));
    C = Math.max(1, Math.min(50, C));
    if (R * C < 2) C = 2;
    let M = Math.round(Number(minesEl.value)) || 1;
    M = Math.max(1, Math.min(R * C - 1, M));
    rowsEl.value = R; colsEl.value = C; minesEl.value = M;
    return [R, C, M];
  }

  function applyPreset() {
    const p = PRESETS[presetEl.value];
    if (p) [rowsEl.value, colsEl.value, minesEl.value] = p;
  }

  function matchPreset() {
    const v = [rowsEl.value, colsEl.value, minesEl.value].map(Number);
    presetEl.value = Object.keys(PRESETS).find(k => PRESETS[k].every((n, i) => n === v[i])) || 'custom';
  }

  function newGame() {
    const [R, C, M] = readSettings();
    matchPreset();
    store.set({rows: R, cols: C, mines: M, noGuess: noGuessEl.checked});
    game = new MS.Game(C, R, M, {noGuess: noGuessEl.checked});
    stopTimer();
    time = 0;
    $('timer').textContent = '0';
    buildTable();
    render();
  }

  // A wide board on a narrow portrait screen is shown on its side, so Expert fits a phone.
  function buildTable() {
    const W = game.W, H = game.H;
    transposed = W > H && window.innerWidth < W * 24 && window.innerHeight > window.innerWidth;
    const dispRows = transposed ? W : H, dispCols = transposed ? H : W;
    const avail = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth) - 26;
    const size = Math.max(22, Math.min(32, Math.floor(avail / dispCols)));
    document.documentElement.style.setProperty('--cell-size', size + 'px');
    table.textContent = '';
    cells = new Array(game.N);
    for (let r = 0; r < dispRows; r++) {
      const row = table.insertRow();
      for (let c = 0; c < dispCols; c++) {
        const td = row.insertCell();
        const i = transposed ? c * W + r : r * W + c;
        td.dataset.i = i;
        cells[i] = td;
      }
    }
  }

  function render() {
    const g = game, lost = g.status === 'lost';
    for (let i = 0; i < g.N; i++) {
      const td = cells[i], s = g.state[i];
      let cls, text = '';
      if (s === MS.OPEN && g.mine[i]) { cls = 'mine hit'; text = '💣'; }
      else if (s === MS.OPEN) {
        const n = g.cnt[i];
        cls = 'revealed' + (n ? ' n' + n : '');
        if (n) {
          text = n;
          if (!g.over && g.nb[i].some(j => g.state[j] !== MS.OPEN)) cls += ' chordable';
        }
      } else if (s === MS.FLAGGED) {
        if (lost && !g.mine[i]) { cls = 'wrong'; text = '✕'; }
        else { cls = 'flag'; text = '🚩'; }
      } else if (lost && g.mine[i]) { cls = 'mine'; text = '💣'; }
      else cls = 'hidden';
      if (td.className !== cls) td.className = cls;
      if (td.textContent !== String(text)) td.textContent = text;
    }
    table.classList.toggle('over', g.over);
    $('mines-left').textContent = '💣 ' + (g.M - g.flags);
    face.textContent = g.status === 'won' ? '😎' : lost ? '😵' : '🙂';
    if (g.status === 'won') {
      msg.className = 'won';
      msg.textContent = `Cleared in ${time} s.` + (g.guaranteed ? ' No guess was ever needed.' : '');
    } else if (lost) {
      const left = g.N - g.M - g.opened;
      msg.className = 'lost';
      msg.textContent = `Boom. ${left} safe cell${left === 1 ? '' : 's'} left.` +
        (g.guaranteed ? ' This board had no guesses — the mine could have been worked out.' : '');
    } else if (g.status === 'playing' && g.opt.noGuess && !g.guaranteed) {
      msg.className = '';
      msg.textContent = 'Too many mines to find a guess-free board in time — this one may need a guess.';
    } else if (g.status === 'ready') {
      msg.className = '';
      msg.textContent = 'Right-click or long-press to flag, or switch on 🚩 Flag. Click a number to open its neighbours once its mines are flagged.';
    } else {
      msg.className = '';
      msg.textContent = '';
    }
  }

  function afterMove() {
    if (game.status === 'playing' && !timerInterval) startTimer();
    if (game.over) stopTimer();
    render();
  }

  function primary(i) {
    if (game.state[i] === MS.OPEN) game.chord(i);
    else if (flagMode) game.toggleFlag(i);
    else game.reveal(i);
    afterMove();
  }

  function flag(i) {
    if (game.state[i] === MS.OPEN) game.chord(i);
    else game.toggleFlag(i);
    afterMove();
  }

  // Mouse: left opens, right flags, middle chords. Touch: tap opens, long-press flags.
  let press = null;
  const cellOf = e => {
    const td = e.target.closest && e.target.closest('td');
    return td && table.contains(td) ? Number(td.dataset.i) : null;
  };
  table.addEventListener('contextmenu', e => e.preventDefault());
  table.addEventListener('pointerdown', e => {
    const i = cellOf(e);
    if (i === null) return;
    if (e.pointerType === 'mouse' && e.button === 2) { flag(i); return; }
    if (e.pointerType === 'mouse' && e.button === 1) { e.preventDefault(); game.chord(i); afterMove(); return; }
    if (e.button !== 0) return;
    press = {i, x: e.clientX, y: e.clientY, long: false, timer: null};
    if (e.pointerType !== 'mouse') {
      const p = press;
      p.timer = setTimeout(() => {
        p.long = true;
        if (navigator.vibrate) navigator.vibrate(15);
        flag(p.i);
      }, 380);
    }
  });
  table.addEventListener('pointermove', e => {
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.timer); press = null; }
  });
  table.addEventListener('pointerup', e => {
    if (!press) return;
    const p = press;
    press = null;
    clearTimeout(p.timer);
    if (!p.long) primary(p.i);
  });
  table.addEventListener('pointercancel', () => { if (press) clearTimeout(press.timer); press = null; });

  flagBtn.addEventListener('click', () => {
    flagMode = !flagMode;
    flagBtn.setAttribute('aria-pressed', flagMode);
  });
  presetEl.addEventListener('change', () => { applyPreset(); newGame(); });
  [rowsEl, colsEl, minesEl].forEach(el => el.addEventListener('change', matchPreset));
  noGuessEl.addEventListener('change', () => { if (game.status === 'ready') newGame(); });
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { buildTable(); render(); }, 150);
  });

  function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
      time++;
      $('timer').textContent = time;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  const saved = store.get();
  if (saved.rows) [rowsEl.value, colsEl.value, minesEl.value] = [saved.rows, saved.cols, saved.mines];
  noGuessEl.checked = !!saved.noGuess;
  newGame();
</script>
</body>
</html>
