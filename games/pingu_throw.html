<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pingu Throw</title>
<meta name="description" content="The yeti classic under a winter moon: tap once to send the penguin diving off the ice wall, tap again to swing. A spirit level shows how level the hit was, a tape measure shows how far it went.">
<meta name="theme-color" content="#07101F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--tape:#F5C518;--ink:#141414;--moon:#DDE8FF;--night:#07101F;--red:#E0443A;--blue:#6FB7FF;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--moon);font-family:'Big Shoulders Text',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.fade{opacity:0;transition:opacity .16s ease-out,transform .2s ease-out}
.fade.on{transition:opacity .35s cubic-bezier(.2,.7,.2,1),transform .45s cubic-bezier(.2,.8,.2,1)}
.on{opacity:1}
#title{position:absolute;left:0;right:0;top:calc(22px + env(safe-area-inset-top,0px));text-align:center;transform:translateY(-8px)}
#title.on{transform:none}
#title h1{margin:0;white-space:nowrap;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(40px,11vw,60px);letter-spacing:.03em;line-height:.9;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
#title h1 span{color:var(--tape)}
#title h1 br{display:none}
#title p{margin:10px 0 0;font-weight:800;font-size:18px;letter-spacing:.22em;color:#B9C8E6}

 #title{left:54%;right:auto;top:24vh;width:min(40vw,560px);text-align:left}
 #title h1{font-size:clamp(56px,7.4vw,104px)}

}

#level{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));width:min(280px,50vw);transform:translate(-50%,-14px)}

#result.miss #again{display:none}

#why em{font-style:normal;color:var(--tape)}
#result.on{transform:none}
#big{font-family:'Big Shoulders Display',sans-serif;font-weight:900;white-space:nowrap;font-size:clamp(76px,15vw,150px);line-height:.9;color:var(--tape);text-shadow:0 6px 0 var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#big small{font-size:.34em;margin-left:.08em}
#badge{display:inline-block;margin-bottom:8px;min-height:28px;padding:4px 12px;border-radius:6px;font-weight:900;font-size:16px;letter-spacing:.16em;background:var(--tape);color:var(--ink);visibility:hidden}

button{font:inherit;pointer-events:auto;cursor:pointer;border:0}
#share{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:rgba(7,16,31,.82);color:#fff;border:2px solid rgba(221,232,255,.6);transition:transform .12s}

#share:hover{background:rgba(7,16,31,.9)}
#share[hidden]{display:none}
#mute{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:50%;background:rgba(7,16,31,.5);display:grid;place-items:center;transition:transform .12s}
#mute:active{transform:scale(.9)}
#mute svg{width:22px;height:22px}
#toast{position:absolute;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,8px);padding:10px 16px;border-radius:8px;background:var(--moon);color:var(--night);font-weight:800;letter-spacing:.08em;font-size:14px}
#toast.on{transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){#cap{font-size:15px;letter-spacing:.12em}#why{font-size:16px}}
@media (max-aspect-ratio:11/10){#home{top:auto;bottom:calc(64px + var(--safe-b))}}
@media (prefers-reduced-motion:reduce){.fade{transition:opacity .2s}#badge.show,#title .go{animation:none}}

<body>
<canvas id="c" aria-label="Pingu Throw. Tap or press space to drop the penguin, again to swing."></canvas>
<div class="ui">
  <a id="home" href="https://gptgames.dev">GPTGAMES.DEV</a>
  <div id="title" class="fade"><h1>PINGU <br><span>THROW</span></h1><p id="sub"></p><div class="go">TAP TO DROP</div></div>
  <div id="hint" class="fade"></div>
  <div id="level" class="fade"><span class="hi">EARLY</span><div class="vial"><b></b><i id="bubble"></i></div><span class="lo">LATE</span><div id="cap"></div></div>
  <div id="result" class="fade"><div id="badge"></div><div id="big"></div><div id="why"></div><div id="count"><i></i></div><div id="again" class="fade"><button id="again-btn" type="button">THROW AGAIN</button><button id="share" type="button" aria-label="Send this throw to a friend" title="Send this throw to a friend"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button></div></div>
  <div id="toast" class="fade"></div>
  <button id="mute" type="button" aria-label="Sound on"><svg viewBox="0 0 24 24" fill="none" stroke="#DDE8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#DDE8FF"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="cross" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg></button>
  <div id="live" class="sr" aria-live="polite"></div>
</div>

<script id="core">
// The throw, and nothing else: no DOM, no clock, no randomness. The page feeds it frame
// times and draws what it holds; test/pingu_throw.mjs runs this block on its own.
// The numbers are the ones the 2026-09-15 page played with, so every throw still lands where it
// did then, to the centimetre: the dive is slow and readable, the club is already up, and the
// only thing that matters is how level the penguin is with the club head when you press.
const Core = (() => {
    const G = 15;                 // gravity in flight
    const G_DIVE = 6;             // the dive down the ice wall is slower
    const DRAG = 0.003;
    const TAX = 0.7;              // snow the penguin ploughs through on every landing
    const REST = 0.58;            // bounce restitution
    const KEEP = 0.925;           // horizontal carry-over per bounce
    const WALL_X = -1.35;         // the line the penguin dives down
    const WALL_TOP = 8.6;
    const PIVOT = {x: 0.35, y: 2.15};   // the yeti's hands
    const CLUB_LEN = 1.9;
    const CLUB_REST = 2.79;       // rad, club held out toward the wall
    const SWEET_Y = PIVOT.y + Math.sin(CLUB_REST) * CLUB_LEN;   // club head height
    const CLUB_X = PIVOT.x + Math.cos(CLUB_REST) * CLUB_LEN;
    const BAND = 1.7;             // how far off that height still connects
    const ANG_HI = 62, ANG_LO = 14;     // launch angle at the top and bottom of the band
    const VMAX = 52;              // speed off a perfectly level hit
    const R_PENGU = 0.42;
    const STEP = 1 / 240;

    function newBody() { return {x: WALL_X, y: WALL_TOP, vx: 0, vy: 0, a: -Math.PI / 2, av: 0, S: 'ready', bounces: 0}; }
    function strike(b, dy) {
        const k = dy / BAND;
        const ang = ((ANG_HI + ANG_LO) / 2 + k * (ANG_HI - ANG_LO) / 2) * Math.PI / 180;
        const q = Math.max(0, 1 - Math.pow(Math.abs(k), 1.5));
        const speed = VMAX * (0.35 + 0.65 * q);
        b.vx = Math.cos(ang) * speed;
        b.vy = Math.sin(ang) * speed;
        b.av = -5 - 4 * q;
        b.S = 'flight';
        return {q, dy, ang, speed};
    }
    // the tumble off the club dies down and the penguin lines itself up beak-forward, so it
    // lands on its belly and skids rather than digging in (orientation only: it moves nothing)
    function settle(b, dt) {
        b.av *= Math.pow(0.22, dt);
        b.a += b.av * dt;
        const target = Math.max(-0.42, Math.min(0.75, Math.atan2(b.vy, b.vx)));
        let diff = target - b.a;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        b.a += diff * Math.min(1, 2.6 * dt);
    }
    function land(b) {
        const impact = Math.abs(b.vy);
        b.vy = impact * REST;
        b.vx = Math.max(0, b.vx * KEEP - TAX);
        b.y = R_PENGU;
        b.bounces++;
        b.av = -3 - impact * 0.15;
        if (b.vy < 1.6) { b.vy = 0; b.av = 0; b.S = 'ground'; }
        return impact;
    }
    function flightStep(b, dt) {
        const v = Math.hypot(b.vx, b.vy), dragF = DRAG * v;
        b.vx -= b.vx * dragF * dt;
        b.vy -= (b.vy * dragF + G) * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        settle(b, dt);
        if (b.y <= R_PENGU) { b.y = R_PENGU; return land(b); }
        return 0;
    }
    function groundStep(b, dt) {
        const sgn = Math.sign(b.vx);
        b.vx -= sgn * 5 * dt;
        if (sgn !== Math.sign(b.vx)) b.vx = 0;
        b.x += b.vx * dt;
        b.a += b.av * dt;
        b.av *= Math.pow(0.05, dt);
        b.a += (0 - b.a) * Math.min(1, 4 * dt);
        return Math.abs(b.vx) < 0.05;
    }
    // how long before (dy > 0) or after the penguin was level with the club, from the dive
    // itself: it is still accelerating, so a far-off swing is not just distance over speed
    function offsetMs(dy, vy) {
        const u = Math.max(0, -vy);
        const t = dy >= 0 ? (-u + Math.sqrt(u * u + 2 * G_DIVE * dy)) / G_DIVE
            : (u - Math.sqrt(Math.max(0, u * u + 2 * G_DIVE * dy))) / G_DIVE;
        return Math.round(t * 1000);
    }

    // a throw: phase ready -> dive -> flight -> ground -> done; events queue up in s.ev
    function create() { return {phase: 'ready', b: newBody(), acc: 0, ev: [], swung: false, contact: null, miss: null, peak: 0, n: 0, sinceSwing: -1, dist: null}; }
    function drop(s) {
        if (s.phase !== 'ready') return false;
        s.phase = 'dive'; s.b.S = 'diving'; s.b.vy = -0.6;
        s.ev.push({type: 'drop'});
        return true;
    }
    function swing(s) {
        if (s.phase !== 'dive' || s.swung) return false;
        s.swung = true; s.sinceSwing = 0;
        const b = s.b, dy = b.y - SWEET_Y, vy = b.vy;
        if (Math.abs(dy) > BAND) {
            s.miss = {dy, vy, ms: offsetMs(dy, vy)};
            s.ev.push({type: 'whiff', dy, ms: s.miss.ms});
            return true;
        }
        s.contact = strike(b, dy);
        s.contact.ms = offsetMs(dy, vy);
        s.phase = 'flight';
        s.ev.push({type: 'hit', dy, q: s.contact.q, ms: s.contact.ms});
        return true;
    }
    function step(s) {
        const b = s.b;
        s.n++;
        if (s.sinceSwing >= 0) s.sinceSwing++;
        if (s.phase === 'dive') {
            b.vy -= G_DIVE * STEP;
            b.y += b.vy * STEP;
            b.a = -Math.PI / 2 + 0.16;
            if (b.y <= R_PENGU) {             // never clubbed: it just lands
                b.y = R_PENGU; b.vy = 0; b.vx = 0; b.S = 'ground'; s.phase = 'ground';
                s.ev.push({type: 'plop'});
            }
        } else if (s.phase === 'flight') {
            const impact = flightStep(b, STEP);
            if (b.y > s.peak) s.peak = b.y;
            if (impact) s.ev.push({type: 'bounce', n: b.bounces, impact});
            if (b.S === 'ground') { s.phase = 'ground'; s.ev.push({type: 'slide'}); }
        } else if (s.phase === 'ground') {
            if (groundStep(b, STEP)) {
                s.phase = 'done'; s.dist = Math.max(0, b.x);
                s.ev.push({type: 'rest', dist: s.dist});
            }
        }
    }
    // the page's clock: seconds of game time in, fixed steps out (at most 60 a frame)
    function advance(s, dt) {
        s.acc += dt;
        let guard = 0;
        while (s.acc >= STEP && guard++ < 60) { step(s); s.acc -= STEP; }
    }
    // a whole throw from the height it was struck at: what a ghost flies and a link promises
    function flightFrom(dy) {
        const b = newBody();
        b.y = SWEET_Y + dy;
        strike(b, dy);
        const path = [[b.x, b.y, b.a]];
        for (let n = 0; n < 240 * 60 && b.S !== 'done'; n++) {
            if (b.S === 'flight') flightStep(b, STEP);
            else if (groundStep(b, STEP)) b.S = 'done';
            path.push([b.x, b.y, b.a]);
        }
        return {path, dist: Math.max(0, b.x)};
    }
    return {STEP, WALL_X, WALL_TOP, PIVOT, CLUB_LEN, CLUB_REST, CLUB_X, SWEET_Y, BAND, R_PENGU, create, drop, swing, step, advance, flightFrom, offsetMs};
})();
</script>

<script>
(() => {
'use strict';
// World units: 30 to the metre, y down on screen, y up in the core. The camera maps them to
// the screen with the snow line pinned just above the tape.
const M = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1, PORTRAIT = false;

// ---------- saved data (the keys the page has always used) ----------
const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
};
let best = parseFloat(store.get('pinguThrowBest')) || 0;
let bestDy = parseFloat(store.get('pinguThrowBestDy'));
let bestPath = null;
// the ghost of your best is only trusted if it really flies to your best
if (isFinite(bestDy) && Math.abs(bestDy) <= Core.BAND) {
    const f = Core.flightFrom(bestDy);
    if (Math.abs(f.dist - best) <= .05) bestPath = f.path; else bestDy = null;
} else bestDy = null;
let muted = store.get('pinguThrowMute') === '1';
let throwsEver = parseInt(store.get('pinguThrowCount')) || 0;

// a friend's link carries only the height their penguin was struck at
let friend = null;
(() => {
    const g = new URLSearchParams(location.search).get('ghost');
    if (g === null || g.trim() === '') return;
    const dy = Number(g);
    if (!isFinite(dy) || Math.abs(dy) > Core.BAND) return;
    const f = Core.flightFrom(dy);
    friend = {dy, dist: f.dist, path: f.path};
})();

// ---------- geometry ----------
const PX = Core.WALL_X * M;                       // the line the penguin dives down
const FACE = PX - .55 * M;                        // the ice face just behind it
const TOP = -(Core.WALL_TOP - Core.R_PENGU) * M;  // the snow it stands on
const CLUB = {x: Core.CLUB_X * M, y: -Core.SWEET_Y * M};
// where the yeti stands, for framing and for the end of the club's band
const HANDS = [-40, -128];
const YS = (Core.PIVOT.y * M) / -HANDS[1];
const YETI_X = Core.PIVOT.x * M - HANDS[0] * YS;
const PK = .55;                                   // spectator scale, relative to the player's penguin

// ---------- art ----------
const INK = '#0A1224', TAPE = '#F5C518';
function hash(i, seed) { let n = (i * 374761393 + seed * 668265263) >>> 0; n = (n ^ (n >>> 13)) * 1274126177 >>> 0; return (n & 0xffff) / 0xffff; }
function noise(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i, seed) * (1 - u) + hash(i + 1, seed) * u; }
const PAR = 1.8;                // screen px per world unit the background layers scroll by
const ease = u => 1 - Math.pow(1 - Math.max(0, Math.min(1, u)), 3);

// ---------- state ----------
let S = Core.create();
const cam = {x: 0, y: 0, s: 1, tx: 0, ty: 0, ts: 1, k: 5, shake: 0, punch: 0, sx: 0, sy: 0};
let mode = 'ready';           // ready | dive | flight | rest
let uiTop = 0, snap = null, fadeSnap = 0, missedLast = false, modeT = 0, freeze = 0, slowT = -1, swingT = -1, restAt = 0, rings = [];
let flags = [], parts = [], flakes = [], craters = [], groove = null;
let bubble = 0, bubbleV = 0, bubbleTarget = 0, countT = 0, lastTick = 0, clock = 0;
let mood = 'idle', result = null, levelAt = -9, missAt = null, lastThrow = null;

function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; PORTRAIT = H > W * 1.1;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    flakes = Array.from({length: Math.round(Math.min(150, W * H / 8000))}, (_, i) => ({x: hash(i, 1) * W, y: hash(i, 2) * H, z: .3 + hash(i, 3) * .9, p: hash(i, 4) * 6.28}));
    frameCamera(true);
}

// ---------- camera ----------
let TAPE_H = 56;
const topPad = () => PORTRAIT ? 170 : 120;
const groundY = () => H - TAPE_H - Math.max(16, H * .04);
const sx = x => W / 2 + (x - cam.x) * cam.s + cam.sx;
const sy = y => groundY() + (y - cam.y) * cam.s + cam.sy;

function view() {
    const gy = groundY(), usable = gy - topPad();
    if (mode === 'ready') {
        const s = Math.min(W / (6.9 * M), usable / (10.3 * M));
        return {x: PORTRAIT ? -.35 * M : 1.1 * M + W * .14 / s, y: 0, s};
    }
    if (mode === 'dive') {

    ctx.restore();
    if (throwsEver === 0 && inside && !S.swung && hintAt !== 'band') {
        // the first time only: one word, where the eye already is
        hint('TAP!', 'band');
    }
}
function drawMiss() {
    // after a miss: where the penguin was when you swung, against the club's level
    if (mode !== 'rest' || missAt === null) return;
    const e = ease((clock - restAt - .2) / .4);
    if (e <= 0) return;
    const y = -missAt * M, yc = CLUB.y, X = sx(PX);
    ctx.save(); ctx.globalAlpha = e;
    ctx.strokeStyle = TAPE; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(sx(FACE + 4), sy(yc)); ctx.lineTo(sx(YETI_X - 20 * YS), sy(yc)); ctx.stroke(); ctx.setLineDash([]);
    const ax = X + 34 * cam.s, dir = Math.sign(sy(yc) - sy(y)), tip = sy(yc);
    ctx.beginPath(); ctx.moveTo(ax, sy(y)); ctx.lineTo(ax, tip);
    ctx.moveTo(ax - 7 * cam.s, tip - dir * 9 * cam.s); ctx.lineTo(ax, tip); ctx.lineTo(ax + 7 * cam.s, tip - dir * 9 * cam.s); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.globalAlpha = e; ctx.fillStyle = TAPE; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax - 14 * cam.s, sy(y) - 8 * cam.s); ctx.lineTo(ax - 2 * cam.s, sy(y)); ctx.lineTo(ax - 14 * cam.s, sy(y) + 8 * cam.s); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
}
function drawParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life += dt; if (p.life >= p.max) { parts.splice(i, 1); continue; }
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        if (p.ground && p.y > 0) { p.y = 0; p.vy *= -.2; p.vx *= .5; }
        ctx.globalAlpha = 1 - Math.pow(p.life / p.max, 2); ctx.fillStyle = p.c;
        const X = sx(p.x), Yy = sy(p.y), r = p.r * Math.max(1, cam.s * .6);
        if (p.sq) { ctx.save(); ctx.translate(X, Yy); ctx.rotate(p.rot); ctx.fillRect(-r, -r * .5, r * 2, r); ctx.restore(); }
        else { ctx.beginPath(); ctx.arc(X, Yy, r, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
}
let lastCamX = null, lastCamY = null;
function drawFlakes(dt) {
    const dx = lastCamX === null ? 0 : (cam.x - lastCamX) * cam.s, dy = lastCamY === null ? 0 : (cam.y - lastCamY) * cam.s;
    lastCamX = cam.x; lastCamY = cam.y;
    ctx.fillStyle = '#EEF3FF';
    const fast = mode === 'flight' && !RM;
    for (const f of flakes) {
        f.y += (16 + f.z * 24) * dt - dy * f.z * .8; f.x += Math.sin(clock * .8 + f.p) * 10 * dt * f.z - dx * f.z * .8;
        f.x = ((f.x % W) + W) % W; f.y = ((f.y % H) + H) % H;
        ctx.globalAlpha = .2 + f.z * .45;
        if (fast && f.z > .75 && Math.abs(dx) > 2) {
            ctx.strokeStyle = 'rgba(221,232,255,.35)'; ctx.lineWidth = f.z * 1.8; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + Math.min(120, dx * f.z * 2), f.y + dy * f.z); ctx.stroke();
        } else { ctx.beginPath(); ctx.arc(f.x, f.y, f.z * 1.7, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
}

// ---------- loop ----------
let last = 0;
function frame(ts) {
    const rdt = last ? Math.min(.05, (ts - last) / 1000) : 0;
    last = ts; clock += rdt; modeT += rdt;
    // game time: the hit holds still for a beat, a clean one drifts off in slow motion
    let gdt = rdt;
    if (freeze > 0) { const f = Math.min(freeze, gdt); freeze -= f; gdt -= f; }
    else if (swingT >= 0) swingT += rdt;
    if (slowT >= 0 && freeze <= 0) {
        slowT += rdt;
        gdt *= slowT < .3 ? .28 : slowT < .6 ? .28 + .72 * (slowT - .3) / .3 : 1;
        if (slowT >= .6) slowT = -1;
    }
    if (mode === 'dive' && throwsEver === 0 && Math.abs(S.b.y - Core.SWEET_Y) < Core.BAND) gdt *= .35;
    Core.advance(S, gdt);
    while (S.ev.length) onEvent(S.ev.shift());

    const b = S.b;
    if (mode === 'dive' || mode === 'flight') frameCamera(false);
    if (mode === 'flight') cam.k = 6 + 40 * ease(modeT / .6);
    if (AC) {
        const v = mode === 'flight' ? Math.hypot(b.vx, b.vy) : 0;
        wind.g.gain.setTargetAtTime(muted ? 0 : Math.min(.2, v * .004), AC.currentTime, .06);
        wind.f.frequency.setTargetAtTime(400 + v * 18, AC.currentTime, .06);
        slide.g.gain.setTargetAtTime(!muted && S.phase === 'ground' && S.contact ? Math.min(.25, Math.abs(b.vx) * .03) : 0, AC.currentTime, .05);
    }
    if (mode === 'flight') { const d10 = Math.floor(b.x / 10); if (d10 > lastTick) { lastTick = d10; sfx.tick(d10 % 5 === 0); } }
    if (S.phase === 'ground' && S.contact && b.vx > 1 && Math.random() < b.vx * rdt * 6) {
        burst(b.x * M + 18, -2, 1, {a: -Math.PI * .72, spread: .6, v: 40 + b.vx * 9, r: 3, g: 500, life: .5});
        groove.x1 = b.x * M;
    } else if (groove && S.phase === 'ground') groove.x1 = b.x * M;
    if (mode === 'rest' && result && result.hit) {
        countT += rdt;
        $('big').innerHTML = `${(result.d * ease(countT / .8)).toFixed(1)}<small> m</small>`;
    }
    // the bubble settles like liquid
    // while the penguin dives the level reads it live: pinned HIGH, sliding through the middle, LOW
    const tgt = mode === 'dive' && !S.swung ? Math.max(-1.3, Math.min(1.3, -(S.b.y - Core.SWEET_Y) / Core.BAND)) : mode === 'ready' ? 0 : bubbleTarget;
    if (mode === 'dive' && !S.swung) { bubble = tgt; bubbleV = 0; }
    else { bubbleV += (tgt - bubble) * 160 * rdt; bubbleV *= Math.exp(-rdt * 10); bubble += bubbleV * rdt; }
    if (mode === 'flight' && levelAt > 0 && clock - levelAt > .9) { show('level', false); levelAt = -9; }
    if (mode === 'rest') {
        const r = $('result'), top = result && result.hit ? Math.min(sy(-84), uiTop - 8) : PORTRAIT ? H * .42 : H * .52;
        r.style.top = Math.max(PORTRAIT ? 90 : 60, Math.min(H * .45, top - r.offsetHeight - 20)) + 'px';
    }
    const range = Math.max(40, $('level').offsetWidth * .5 - 32);
    $('bubble').style.transform = `translateX(${Math.max(-1, Math.min(1, bubble)) * range}px)`;

    stepCamera(rdt);
    const kT = S.phase === 'flight' || S.phase === 'ground' || S.phase === 'done' ? Math.max(PORTRAIT ? 1.7 : 1.45, 44 / PPMf()) : 1;
    pk += (kT - pk) * oe(0.08, rdt);
    yetiMind(rdt);
    const punch = cam.punch; cam.punch *= Math.exp(-rdt * 7);
    const s0 = cam.s, x0 = cam.x, y0 = cam.y;
    if (punch > .01) { cam.s = s0 * (1 + punch * .14); cam.x += (CLUB.x - cam.x) * punch * .25; cam.y += (CLUB.y * .3 - cam.y) * punch * .25; }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    uiTop = H;
    drawSky(); drawRanges(); drawGround(); drawProps(); drawLanterns();
    if (best > 0 && !(mode === 'rest' && result && result.nb) ) drawPost(best, TAPE, 'BEST');
    if (friend) drawPost(friend.dist, '#6FB7FF', 'FRIEND');
    // each pennant takes the lowest row where it covers no other; the best has its own post
    const rows = [], laid = [], near = 64 * flagScale();
    flags.filter(f => Math.abs(f.m - best) > .005).sort((a, b) => a.m - b.m).forEach(f => {
        const x = sx(f.m * M);
        let r = 0;
        while (r < 3 && rows[r] !== undefined && x - rows[r] < near) r++;
        if (r === 3) return;                                // a fourth in the same spot adds nothing
        rows[r] = x;
        laid.push([f, r]);
    });
    // every pole first, then the cloth, so a pole never cuts across a pennant below it
    for (const part of ['pole', 'cloth']) for (const [f, r] of laid) drawFlag(f.m, false, clock - f.t - .35, r, part);
    drawGroundTape();
    drawSpectators();
    drawWall();
    if (mode === 'flight' && S.sinceSwing >= 0) {
        const ghost = (path, c) => { if (!path) return; const i = Math.min(path.length - 1, S.sinceSwing); const [gx, gy, ga] = path[i]; ctx.globalAlpha = .45; flat = c; flyAt(gx, gy, ga, pk, {flap: 0}); flat = null; ctx.globalAlpha = 1; };
        ghost(bestPath, '#9FB4DA'); if (friend) ghost(friend.path, '#6FB7FF');
    }
    if (mode === 'ready') {
        const yc = sy(CLUB.y), x0 = sx(FACE + 4), x1 = sx(YETI_X - 20 * YS);
        ctx.save(); ctx.globalAlpha = .35 + .15 * Math.sin(clock * 2.4); ctx.strokeStyle = TAPE; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
        ctx.beginPath(); ctx.moveTo(x0, yc); ctx.lineTo(x1, yc); ctx.stroke(); ctx.restore();
    }
    drawLine();
    drawMiss();
    drawYeti();
    if (S.phase === 'flight' && !RM) {
        // speed lines behind a fast penguin
        const v = Math.hypot(b.vx, b.vy), a = Math.atan2(-b.vy, b.vx), X = mx(b.x), Yy = my(b.y), sc = PPMf() * pk / 8;
        ctx.strokeStyle = 'rgba(221,232,255,.6)'; ctx.lineCap = 'round';
        for (let i = 0; i < 5; i++) {
            const off = (i - 2) * 1.6 * sc, len = (4 + v * .3 + hash(i, Math.floor(clock * 24)) * 5) * sc;
            const bx = X - Math.cos(a) * 6 * sc - Math.sin(a) * off, by = Yy - Math.sin(a) * 6 * sc + Math.cos(a) * off;
            ctx.lineWidth = Math.max(1, 3 - Math.abs(i - 2) * .7); ctx.globalAlpha = .75 - Math.abs(i - 2) * .18;
            ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - Math.cos(a) * len, by - Math.sin(a) * len); ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }
    drawPlayer();
    if (freeze > 0 && !RM) {
        // the impact frame
        const X = sx(CLUB.x), Yy = sy(CLUB.y), q = S.contact ? S.contact.q : .5;
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + .2, r1 = 22 * cam.s, r2 = (i % 2 ? 42 : 70) * cam.s * (.7 + .5 * q); ctx.beginPath(); ctx.moveTo(X + Math.cos(a) * r1, Yy + Math.sin(a) * r1); ctx.lineTo(X + Math.cos(a + .045) * r2, Yy + Math.sin(a + .045) * r2); ctx.lineTo(X + Math.cos(a - .045) * r2, Yy + Math.sin(a - .045) * r2); ctx.fill(); }
        ctx.strokeStyle = TAPE; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(X, Yy, 36 * cam.s, 0, 7); ctx.stroke();
    }
    drawParts(rdt);
    if (sy(0) < H) drawForeground();
    drawFlakes(rdt);
    for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        if (freeze <= 0) r.t += rdt;
        if (r.t > .45 || RM) { rings.splice(i, 1); continue; }
        const u = r.t / .45, X = sx(CLUB.x), Yy = sy(CLUB.y);
        for (let k = 0; k < 2; k++) {
            const v = Math.max(0, u - k * .18); if (v <= 0) continue;
            ctx.strokeStyle = k ? `rgba(245,197,24,${1 - v})` : `rgba(255,255,255,${1 - v})`; ctx.lineWidth = (6 - 4 * v) * Math.max(1, cam.s * .5);
            ctx.beginPath(); ctx.arc(X, Yy, (20 + 150 * ease(v) * (.6 + .4 * r.q)) * cam.s * .6, 0, 7); ctx.stroke();
        }
    }
    drawTape();
    // the cut back to the ledge: the last frame of the throw dissolves into the new one
    if (fadeSnap > 0 && snap) {
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = fadeSnap * fadeSnap; ctx.drawImage(snap, 0, 0); ctx.restore();
        fadeSnap = Math.max(0, fadeSnap - rdt / .35);
    }
    cam.s = s0; cam.x = x0; cam.y = y0;

    if (hintAt) {
        const h = $('hint');
        let x, y;
        if (hintAt === 'band') { x = sx(PX) + 90; y = sy(-S.b.y * M); }
        else { x = sx(PX); y = sy(TOP) - 60; }
        const half = (h.offsetWidth || 200) / 2 + 12;
        h.style.left = Math.min(W - half, Math.max(half, x)) + 'px'; h.style.top = y + 'px';
    }
    requestAnimationFrame(frame);
}

// ---------- input ----------
addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('button,a')) return;
    if (e.button > 0) return;
    press();
});
addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter') {
        if (e.target.closest && e.target.closest('button,a')) return;
        e.preventDefault(); press();
    }
    if (e.code === 'KeyM') toggleMute();
});
function toggleMute() {
    muted = !muted; store.set('pinguThrowMute', muted ? '1' : '0');
    if (master) master.gain.setTargetAtTime(muted ? 0 : .8, AC.currentTime, .02);
    $('waves').style.display = muted ? 'none' : ''; $('cross').style.display = muted ? '' : 'none';
    $('mute').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
}
$('mute').addEventListener('click', e => { audio(); toggleMute(); e.currentTarget.blur(); });
if (muted) { muted = false; toggleMute(); }
$('again-btn').addEventListener('click', e => { e.currentTarget.blur(); press(); });
$('share').addEventListener('click', async e => {
    e.currentTarget.blur();
    if (!S.contact) return;
    const url = `${location.origin}${location.pathname}?ghost=${S.contact.dy.toFixed(6)}`;
    const text = `My penguin flew ${S.dist.toFixed(1)} m. Beat it:`;
    try {
        if (navigator.share && matchMedia('(pointer: coarse)').matches) { await navigator.share({title: 'Pingu Throw', text, url}); return; }
        await navigator.clipboard.writeText(`${text} ${url}`); toast('LINK COPIED — SEND IT TO A FRIEND');
    } catch (err) { if (err && err.name !== 'AbortError') toast('COULD NOT COPY THE LINK'); }
});
function toast(t) { $('toast').textContent = t; show('toast', true); clearTimeout(toast.h); toast.h = setTimeout(() => show('toast', false), 1800); }

addEventListener('resize', resize);
TAPE_H = 56 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-b')) || 0);
resize(); toReady(true);
if (document.fonts) { document.fonts.load('900 20px "Big Shoulders Text"'); document.fonts.load('900 20px "Big Shoulders Display"'); }
requestAnimationFrame(frame);
})();
</script>
