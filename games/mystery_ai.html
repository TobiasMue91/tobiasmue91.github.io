    $('#acc').querySelectorAll('.blank').forEach(b => b.onclick = () => { Snd.select(); openBlank = openBlank === b.dataset.k ? null : b.dataset.k; renderAccuse(); });
    $('#acc').querySelectorAll('.opt').forEach(b => b.onclick = () => {
        Snd.select(); pickA[openBlank] = b.dataset.v;
        const order = ['who', 'weapon', 'motive'];
        openBlank = order.find(k => !pickA[k]) || null;
        renderAccuse();
    });
    $('#doAcc').onclick = doAccuse;
    $('#notYet').onclick = () => { show('game'); };
}
function doAccuse() {
    const r = Lamp.accuse(C, ST, pickA);
    save();
    if (r.ok) { Snd.solve(); ending(); return; }
    Snd.wrong();
    const p = P(pickA.who);
    pickA = {who: null, weapon: null, motive: null};
    $('#acc').innerHTML = `<div class="verdict"><div class="face">${Face.draw(p.look, ST.cracked[p.id] ? 'cracked' : 'smug')}<span class="xstamp ${RM.matches ? '' : 'go'}">✕</span></div>
      <p>${esc(p.first)} almost smiles. "You'll have to do better than that, Inspector."</p>
      <small>The accusation doesn't hold. The case is still open, but it has cost you a rank: close it now and you close it as ${esc(Lamp.rank(ST))}.</small>
      <button class="btn ghost" id="back">Back to the case</button></div>`;
    $('#back').onclick = () => { show('game'); renderClock(); };
    renderClock();
}

/* ---------- case closed ---------- */
function ending(replay) {
    const c = C, st = ST, S = c.C;
    if (!replay) {
        st.solved = true;
        const rank = Lamp.rank(st);
        D.solved[c.seed] = {rank, wrong: st.wrong, day: today};
        if (c.seed === Lamp.dailySeed(today)) { D.streak = D.lastDay === today - 1 ? D.streak + 1 : D.lastDay === today ? D.streak : 1; D.lastDay = today; }
        save();
    }
    const rank = D.solved[c.seed]?.rank || Lamp.rank(st);
    const mins = Math.max(1, Math.round((st.secs || 0) / 60));
    const lies = [c.L, c.C].filter(p => st.cracked[p.id]).length;
    $('#endw').innerHTML = `<div class="face">${Face.draw(S.look, 'cracked')}</div>
      <div><span class="closed ${RM.matches ? '' : 'go'}">Case closed</span>
      <div class="num">№ ${c.number} · ${esc(c.title)}</div>
      <blockquote class="conf">"${esc(Lamp.confession(c))}"<cite>${esc(S.name)}, ${esc(S.role)}</cite></blockquote>
      <div class="rank"><b>${esc(rank)}</b><span>${lies}/2 lies broken · ${st.questions} questions · ${st.misses || 0} missed card${st.misses === 1 ? '' : 's'} · ${st.wrong} wrong accusation${st.wrong === 1 ? '' : 's'} · ${mins} min</span></div>
      <div class="endacts"><button class="btn red" id="eNext">Another case</button><button class="btn ghost" id="eShare">Share</button><button class="btn ghost" id="eTitle">Title screen</button></div>
      <p class="next" id="eNextDaily"></p>
      <h4 class="what">What really happened</h4>
      <ol class="night">${Lamp.solution(c).map(([t, s]) => `<li><b>${esc(t)}</b><span>${esc(s)}</span></li>`).join('')}</ol></div>`;
    show('end');
    const lis = [...document.querySelectorAll('.night li')];
    lis.forEach((li, i) => setTimeout(() => li.classList.add('v'), (RM.matches ? 0 : 900) + i * 450));
    $('#eNext').onclick = () => { let s; do s = 1000 + Math.floor(Math.random() * 9000); while (D.solved[s]); brief(s); };
    $('#eTitle').onclick = () => { const t = titleCase(); renderTitle(t.seed, t.daily); show('title'); };
    $('#eShare').onclick = async () => {
        const url = location.origin + location.pathname + '?case=' + c.number;
        const text = `Under the Lamp · № ${c.number} ${c.title}\nClosed as ${rank} · ${lies}/2 lies broken · ${st.questions} questions\n${url}`;
        try { if (navigator.share && matchMedia('(pointer:coarse)').matches) await navigator.share({text}); else { await navigator.clipboard.writeText(text); toast('Copied'); } } catch (e) {}
    };
    const next = () => { const d = new Date(), t = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1), m = Math.round((t - d) / 60000); return `Tomorrow night's case in ${Math.floor(m / 60)}h ${m % 60}m`; };
    $('#eNextDaily').textContent = next();
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1600); }

/* ---------- menu ---------- */
$('#menuB').onclick = () => {
    openSheet('#menu', `<button class="icon x" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button><span class="kind">№ ${C.number} · ${esc(C.title)}</span><h3>Case notes</h3>
      <div class="row"><button id="mSnd">Sound <em>${D.sound ? 'On' : 'Off'}</em></button></div>
      <div class="row"><button id="mBrief">Hear the briefing again <em>›</em></button></div>
      <div class="row"><button id="mTitle">Leave the case <em>›</em></button></div>`);
    $('#mSnd').onclick = () => { Snd.init(); Snd.set(!D.sound); $('#mSnd em').textContent = D.sound ? 'On' : 'Off'; };
    $('#mBrief').onclick = () => { closeSheets(); const s = C.seed, keep = ST; brief(s); D.cases[s] = ST = keep; save(); };
    $('#mTitle').onclick = () => { closeSheets(); renderTitle(C.seed, C.seed === Lamp.dailySeed(today) && !params.get('case')); show('title'); };
};

/* ---------- keys ---------- */
addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('.sheet.on')) closeSheets(); else if (openRoom) closeRoom(); else if ($('#accuse').classList.contains('on')) show('game'); else if (mode === 'house') setMode('talk'); return; }
    if (!$('#game').classList.contains('on') || $('.sheet.on') || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (mode === 'talk' && /^[1-3]$/.test(e.key)) { askTopic(Lamp.topics(C, ST, cur)[+e.key - 1].topic); e.preventDefault(); }
    else if (e.key === 'p' || e.key === 'P') present();
    else if (e.key === 'h' || e.key === 'H') setMode(mode === 'house' ? 'talk' : 'house');
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const i = C.people.findIndex(p => p.id === cur), n = (i + (e.key === 'ArrowRight' ? 1 : 3)) % 4; if (mode === 'house') setMode('talk'); setSuspect(C.people[n].id); }
    else if (e.key === ' ' && typing) { finishTyping(); e.preventDefault(); }
});

// time spent on the case, only while it is on screen
setInterval(() => { if (ST && !ST.solved && $('#game').classList.contains('on') && !document.hidden) { ST.secs = (ST.secs || 0) + 1; if (ST.secs % 15 === 0) save(); } }, 1000);

/* ---------- start ---------- */
const t0 = titleCase();
renderTitle(t0.seed, t0.daily);
show('title');
window.__lamp = {get C() { return C; }, get ST() { return ST; }, get D() { return D; }};
window.Lamp = Lamp;
})();
</script>
</body>
</html>
