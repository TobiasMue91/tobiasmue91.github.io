<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suika - The Watermelon Game</title>
<meta name="description" content="Drop fruit into a glass jar. Two of a kind squash into the next size up - cherry to strawberry to grape, all the way to a watermelon. Five jars to fill: Fruit, Sea, Sweets, Garden and Space. Free Suika Game in your browser.">
<meta name="theme-color" content="#f7eedc">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7eedc;--ink:#3b2418;--soft:#8a6a52;--red:#d9483b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:Fredoka,ui-rounded,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
#btns{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;display:flex;gap:10px;z-index:2}
.rb{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink);font:600 13px Fredoka,sans-serif;transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s,width .25s cubic-bezier(.3,1.3,.5,1),background .2s}
.rb:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.rb:focus-visible{outline:3px solid #e8a23a;outline-offset:3px}
.rb svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rb.arm{width:96px;border-radius:21px;background:var(--red);color:#fff8ea}
.rb .x{display:none}.rb.off .x{display:inline}.rb.off .w{display:none}
#card{position:fixed;left:50%;bottom:0;transform:translate(-50%,calc(100% + 60vh));width:min(360px,calc(100% - 32px));margin-bottom:max(20px,env(safe-area-inset-bottom));background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink),0 18px 40px rgba(59,36,24,.25);padding:16px 20px 18px;text-align:center;z-index:3;transition:transform .55s cubic-bezier(.2,1.25,.4,1)}
#card.on{transform:translate(-50%,0)}
#card h2{font-weight:700;font-size:22px;line-height:1.1}
#card .sc{font-weight:700;font-size:52px;line-height:1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
#card .bt{font-weight:600;color:var(--soft);font-size:16px}
#card .stamp{display:inline-block;margin-top:8px;padding:3px 12px;border:2.5px solid var(--red);color:var(--red);border-radius:10px;font-weight:700;letter-spacing:.08em;font-size:14px;transform:rotate(-5deg) scale(0);transition:transform .4s .45s cubic-bezier(.3,1.8,.5,1)}
#card.on .stamp.y{transform:rotate(-5deg) scale(1)}
#card .stamp:not(.y){display:none}
#card canvas{width:100%;height:46px;display:block;margin:6px 0 0}
#again{margin-top:10px;width:100%;height:56px;border-radius:20px;border:3px solid var(--ink);background:#e3344a;color:#fff8ea;font:700 22px Fredoka,sans-serif;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s}
#again:active{transform:translateY(4px);box-shadow:none}
#again:focus-visible{outline:3px solid #e8a23a;outline-offset:3px}
#tag{position:fixed;transform:translate(-50%,-50%) rotate(-1.5deg);z-index:2;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 16px;background:#fbf6ea;color:#3b2418;border:2.5px solid #3b2418;border-radius:9px;font:600 16px Fredoka,sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);overflow:hidden;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
#tag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--acc)}
#tag b{font-weight:700}
#tag.new{animation:wig 2.4s cubic-bezier(.3,1.6,.5,1) 1.5s infinite}
@keyframes wig{0%,70%,100%{transform:translate(-50%,-50%) rotate(-1.5deg)}76%{transform:translate(-50%,-50%) rotate(4deg) scale(1.08)}84%{transform:translate(-50%,-50%) rotate(-5deg) scale(1.08)}92%{transform:translate(-50%,-50%) rotate(2deg)}}
#tag svg{width:14px;height:14px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
#tag:hover{transform:translate(-50%,-50%) rotate(-1.5deg) scale(1.05)}
#tag:active{transform:translate(-50%,-50%) rotate(-1.5deg) scale(.96)}
#tag:focus-visible,.lab:focus-visible{outline:3px solid #e8a23a;outline-offset:3px}
#picker{position:fixed;inset:0;z-index:4;background:rgba(30,20,15,.0);pointer-events:none;transition:background .3s;display:flex;align-items:flex-end;justify-content:center}
#picker.on{background:rgba(30,20,15,.45);pointer-events:auto}
#picker .sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fbf6ea;color:#3b2418;border:3px solid #3b2418;border-bottom:0;border-radius:28px 28px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,1.15,.4,1)}
#picker.on .sheet{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.ph h2{font:700 22px Fredoka,sans-serif}
#pList{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:0 0 10px;border:2.5px solid #3b2418;border-radius:16px;background:var(--p);color:var(--t);cursor:pointer;overflow:hidden;font-family:Fredoka,sans-serif;box-shadow:0 3px 0 #3b2418;transition:transform .12s}
.lab:active{transform:translateY(3px);box-shadow:none}
.lab canvas{width:100%;height:78px;display:block}
.lab .nm{font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em;padding:2px 12px 0;border-left:6px solid var(--acc);margin-top:4px}
.lab .bs{font-size:13px;opacity:.75;padding:0 12px 0 18px}
.lab.cur::after{content:"";position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2.5px solid #3b2418}
.lab:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:760px){#picker{align-items:center}#picker .sheet{border-radius:28px;border-bottom:3px solid #3b2418;transform:translateY(30px) scale(.96);opacity:0;transition:transform .35s cubic-bezier(.2,1.2,.4,1),opacity .2s}#picker.on .sheet{opacity:1}}
@media (prefers-reduced-motion:reduce){#tag.new{animation:none}#picker .sheet,#tag,#card,.rb,#card .stamp{transition-duration:.01s!important}}
</style>

<body>
<canvas id="cv" aria-label="The jar. Move to aim, release or press space to drop."></canvas>
<div id="btns">
 <button class="rb" id="snd" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16.5 9a4 4 0 0 1 0 6"/><path class="x" d="M17 9.5l5 5M22 9.5l-5 5"/></svg></button>
 <button class="rb" id="rst" aria-label="Start a new jar"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg></button>
</div>
<button id="tag" aria-label="Change jar"></button>
<div id="picker" aria-hidden="true" role="dialog" aria-label="Choose a jar"><div class="sheet"><div class="ph"><h2>Choose a jar</h2><button class="rb" id="pClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="pList"></div></div></div>
<div id="card" role="dialog" aria-live="polite" aria-hidden="true">
 <h2>The jar is full</h2>
 <div class="sc" id="cScore">0</div>
 <div class="bt" id="cBest">Best 0</div>
 <div class="stamp" id="cStamp">NEW BEST</div>
 <canvas id="cLadder" aria-hidden="true"></canvas>
 <button id="again">Play again</button>
</div>
<script id="core">
// Suika core: jar physics, merges, score, overflow, seeded drops, saves. No DOM.
const SUIKA = (() => {
  const W = 400, H = 600, LINE = 0, HANG = -72;           // jar interior x 0..W, y LINE..H; fruit hangs at HANG
  const RADII = [15, 20, 26, 32, 39, 47, 56, 66, 77, 89, 102];
  const POINTS = RADII.map((_, k) => (k + 1) * (k + 2) / 2); // merging two of level k pays this
  const TOP = RADII.length - 1, DROPS = 5;                  // drops are cherry..dekopon
  const G = 1500, STEP = 1 / 120, ITER = 8, GROW = 0.14, COOLDOWN = 0.45, OVER = 2.2;
  const DAMP_CONTACT = 2.4, SLEEP = 6, HOLD = 14, MAX_UP = 380, MAX_V = 1600;

  function rng(s) { s = s >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return [((t ^ t >>> 14) >>> 0) / 4294967296, s]; }; }
  function draw(st) { const f = rng(st.rs); const [v, s] = f(); st.rs = s; return Math.floor(v * DROPS); }

  function create(seed = 1) {
    const st = {seed: seed >>> 0, rs: seed >>> 0, t: 0, score: 0, bodies: [], nid: 1, cur: 0, next: 0, cool: 0, over: false, overT: 0, drops: 0, best: 0, top: 0};
    st.cur = draw(st); st.next = draw(st); st.cur = Math.min(st.cur, 2); // the very first fruit is small
    return st;
  }
  const rad = b => b.g < 1 ? RADII[b.lv - 1] + (RADII[b.lv] - RADII[b.lv - 1]) * easeOut(b.g) : RADII[b.lv];
  const easeOut = t => 1 - (1 - t) * (1 - t);
  const clampX = (x, lv) => Math.max(RADII[lv], Math.min(W - RADII[lv], x));

  function canDrop(st) { return !st.over && st.cool <= 0; }
  function drop(st, x) {
    if (!canDrop(st)) return null;
    const lv = st.cur, b = {id: st.nid++, lv, x: clampX(x, lv), y: HANG, vx: 0, vy: 0, a: 0, g: 1, touched: false, chain: 0, hot: 0};
    st.bodies.push(b); st.cur = st.next; st.next = draw(st); st.cool = COOLDOWN; st.drops++;
    return b;
  }

  // One fixed step. Returns events: merges [{lv,x,y,points,chain,from}], lands [{id,x,y,lv,speed}], gone [{x,y}].
  function step(st) {
    const ev = {merges: [], lands: [], pops: []};
    if (st.over) return ev;
    const dt = STEP, bs = st.bodies;
    st.t += dt; st.cool -= dt;
    for (const b of bs) {
      if (b.g < 1) b.g = Math.min(1, b.g + dt / GROW);
      b.px = b.x; b.py = b.y; b.vy += G * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.c = 0; b.r = rad(b); b.m = b.r * b.r;
    }
    const pairs = [];
    for (let it = 0; it < ITER; it++) {
      for (let i = 0; i < bs.length; i++) {
        const a = bs[i];
        for (let j = i + 1; j < bs.length; j++) {
          const b = bs[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
          if (dx * dx + dy * dy >= rr * rr) continue;
          let d = Math.sqrt(dx * dx + dy * dy), nx, ny;
          if (d < 1e-6) { nx = 0; ny = 1; d = 0; } else { nx = dx / d; ny = dy / d; }
          const pen = rr - d, wa = b.m / (a.m + b.m), wb = 1 - wa;
          a.x -= nx * pen * wa; a.y -= ny * pen * wa; b.x += nx * pen * wb; b.y += ny * pen * wb;
          a.c++; b.c++;
          if (it === 0 && a.lv === b.lv && a.g >= 1 && b.g >= 1) pairs.push([a, b]);
          if (it === 0) { if (!a.touched) a.landing = true; if (!b.touched) b.landing = true; }
        }
      }
      for (const b of bs) {
        if (b.y + b.r > H) { b.y = H - b.r; b.c++; if (!b.touched) b.landing = true; }
        if (b.x - b.r < 0) { b.x = b.r; b.c++; }
        if (b.x + b.r > W) { b.x = W - b.r; b.c++; }
      }
    }
    for (const b of bs) {
      // static friction: a slow fruit in contact holds its place instead of creeping down its neighbours
      if (b.c && b.g >= 1 && b.vx * b.vx + b.vy * b.vy < HOLD * HOLD && Math.hypot(b.x - b.px, b.y - b.py) < HOLD * dt * 2 && b.px >= b.r && b.px <= W - b.r && b.py <= H - b.r && fits(b, bs)) { b.x = b.px; b.y = b.py; }
      let vx = (b.x - b.px) / dt, vy = (b.y - b.py) / dt;
      // pushing fruit apart must never launch it: corrections give at most a hop
      if (vy < -MAX_UP) vy = -MAX_UP;
      const sp = Math.hypot(vx, vy); if (sp > MAX_V) { vx *= MAX_V / sp; vy *= MAX_V / sp; }
      if (b.landing) { b.landing = false; ev.lands.push({id: b.id, x: b.x, y: b.y, lv: b.lv, speed: Math.hypot(b.vx, b.vy)}); b.touched = true; }
      if (b.c) { const k = Math.max(0, 1 - DAMP_CONTACT * dt); vx *= k; if (vy < 0) vy *= k; b.a += vx / b.r * dt; }
      if (b.c && vx * vx + vy * vy < SLEEP * SLEEP) { vx *= 0.5; vy = Math.min(vy, vy * 0.5); }
      b.vx = vx; b.vy = vy;
    }
    // merges: each body merges at most once a step, closest pairs first
    pairs.sort((p, q) => dist2(p) - dist2(q));
    const dead = new Set();
    for (const [a, b] of pairs) {
      if (dead.has(a) || dead.has(b)) continue;
      dead.add(a); dead.add(b);
      const lv = a.lv, x = (a.x + b.x) / 2, y = (a.y + b.y) / 2, chain = Math.max(a.chain, b.chain) + 1;
      st.score += POINTS[lv];
      if (lv === TOP) { ev.pops.push({x, y, lv}); ev.merges.push({lv: lv + 1, x, y, points: POINTS[lv], chain, from: lv}); continue; }
      const n = {id: st.nid++, lv: lv + 1, x, y, vx: (a.vx + b.vx) / 2, vy: Math.min(0, (a.vy + b.vy) / 2), a: 0, g: 0, touched: true, chain, hot: 0};
      bs.push(n); st.top = Math.max(st.top, lv + 1);
      ev.merges.push({lv: lv + 1, x, y, points: POINTS[lv], chain, from: lv, id: n.id});
    }
    if (dead.size) st.bodies = bs.filter(b => !dead.has(b));
    // overflow: a fruit that has landed and sits above the line
    let worst = 0;
    for (const b of st.bodies) {
      b.r = rad(b);
      const above = b.touched && b.y - b.r < LINE && Math.abs(b.vy) < 400;
      b.hot = above ? b.hot + dt : 0;
      worst = Math.max(worst, b.hot);
    }
    st.overT = worst;
    if (worst >= OVER) st.over = true;
    return ev;
  }
  const fits = (b, bs) => { for (const o of bs) if (o !== b) { const rr = b.r + o.r - 0.3, dx = o.x - b.px, dy = o.y - b.py; if (dx * dx + dy * dy < rr * rr) return false; } return true; };
  const dist2 = ([a, b]) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

  // 0..1: how close the jar is to the line (for the warning), from the highest landed fruit.
  function danger(st) {
    let top = Infinity;
    for (const b of st.bodies) if (b.touched) top = Math.min(top, b.y - rad(b));
    return Math.max(0, Math.min(1, 1 - (top - LINE) / 110));
  }

  // where a fruit dropped at x first touches something: the y of its centre
  function landY(st, x, lv) {
    const r = RADII[lv]; let y = H - r;
    for (const b of st.bodies) {
      const rr = r + rad(b), dx = Math.abs(b.x - x);
      if (dx < rr) { const yy = b.y - Math.sqrt(rr * rr - dx * dx); if (yy < y) y = yy; }
    }
    return y;
  }

  function save(st) {
    return {v: 1, seed: st.seed, rs: st.rs, score: st.score, cur: st.cur, next: st.next, drops: st.drops, top: st.top, t: +st.t.toFixed(3),
      bodies: st.bodies.map(b => [b.lv, +b.x.toFixed(2), +b.y.toFixed(2), +b.a.toFixed(2)])};
  }
  // Trusts nothing: returns a fresh state if the save is not one this core could have written.
  function load(o) {
    const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
    const num = v => typeof v === 'number' && isFinite(v);
    if (!o || o.v !== 1 || !int(o.seed, 0, 2 ** 32 - 1) || !int(o.rs, 0, 2 ** 32 - 1) || !int(o.score, 0, 1e7) || !int(o.cur, 0, DROPS - 1) || !int(o.next, 0, DROPS - 1) || !Array.isArray(o.bodies) || o.bodies.length > 200) return null;
    const st = create(o.seed);
    Object.assign(st, {rs: o.rs, score: o.score, cur: o.cur, next: o.next, drops: int(o.drops, 0, 1e6) ? o.drops : 0, t: num(o.t) && o.t >= 0 ? o.t : 0});
    for (const e of o.bodies) {
      if (!Array.isArray(e) || !int(e[0], 0, TOP) || !num(e[1]) || !num(e[2])) return null;
      const r = RADII[e[0]];
      st.bodies.push({id: st.nid++, lv: e[0], x: Math.max(r, Math.min(W - r, e[1])), y: Math.max(LINE - 2 * r, Math.min(H - r, e[2])), vx: 0, vy: 0, a: num(e[3]) ? e[3] : 0, g: 1, touched: true, chain: 0, hot: 0});
    }
    st.top = Math.max(0, ...st.bodies.map(b => b.lv));
    return st;
  }

  // The old page kept {skinName: bestScore} under 'suikaBest'. Each skin's best goes to the jar it became; skins
  // with no jar of their own count towards Fruit, the jar every player started in.
  const OLD_SKINS = {fruits: 'fruit', underwater: 'sea', dessert: 'sweets', garden: 'garden'};
  function fromOld(raw) {
    const out = {}; let o; try { o = JSON.parse(raw); } catch { return out; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) return out;
    for (const [k, v] of Object.entries(o)) {
      if (!Number.isInteger(v) || v <= 0 || v >= 1e6) continue;
      const id = OLD_SKINS[k] || 'fruit'; out[id] = Math.max(out[id] || 0, v);
    }
    return out;
  }

  return {MAX_UP, fromOld, W, H, LINE, HANG, RADII, POINTS, TOP, DROPS, STEP, OVER, COOLDOWN, create, drop, canDrop, step, danger, landY, save, load, rad, clampX};
})();

</script>
<script id="art">
// Fruit art: ink-outlined flat fruit, drawn once per level and size into a sprite.
const FRUIT_ITEMS = [
  {name: 'Cherry',     body: '#e3344a', dark: '#a91f33'},
  {name: 'Strawberry', body: '#f2513f', dark: '#c0322a'},
  {name: 'Grape',      body: '#8c5bd0', dark: '#62399f'},
  {name: 'Dekopon',    body: '#f9a43a', dark: '#d97a17'},
  {name: 'Persimmon',  body: '#f06f2b', dark: '#c24e15'},
  {name: 'Apple',      body: '#e8413c', dark: '#b52a26'},
  {name: 'Pear',       body: '#eed65a', dark: '#c3a72e'},
  {name: 'Peach',      body: '#ffb0a0', dark: '#ec7f72'},
  {name: 'Pineapple',  body: '#f6c63f', dark: '#c99417'},
  {name: 'Melon',      body: '#b5dc72', dark: '#7fae45'},
  {name: 'Watermelon', body: '#3f9d48', dark: '#1f6b2c'}
];

function leaf(c, x, y, len, ang, col = '#5da548') {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.beginPath(); c.moveTo(0, 0);
  c.quadraticCurveTo(len * 0.5, -len * 0.42, len, 0);
  c.quadraticCurveTo(len * 0.5, len * 0.42, 0, 0);
  c.fillStyle = col; c.fill(); c.stroke();
  c.beginPath(); c.moveTo(len * 0.12, 0); c.lineTo(len * 0.8, 0); c.lineWidth *= 0.5; c.stroke();
  c.restore();
}

// The labels: each jar is its own world of eleven things drawn in the same ink, with its own cloth, colours and voice.
const P = Math.PI;
function spikes(c, R, n, len, col) { c.fillStyle = col; for (let i = 0; i < n; i++) { const t = i / n * P * 2; c.beginPath(); c.moveTo(Math.cos(t - 0.12) * R, Math.sin(t - 0.12) * R); c.lineTo(Math.cos(t) * (R + len), Math.sin(t) * (R + len)); c.lineTo(Math.cos(t + 0.12) * R, Math.sin(t + 0.12) * R); c.fill(); c.stroke(); } }
function blob(c, x, y, rx, ry, col, ang = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, ang, 0, P * 2); c.fillStyle = col; c.fill(); }
function rays(c, R, n, len, col, w) { c.save(); c.strokeStyle = col; c.lineWidth = w; for (let i = 0; i < n; i++) { const t = i / n * P * 2; c.beginPath(); c.moveTo(Math.cos(t) * R * 0.15, Math.sin(t) * R * 0.15); c.lineTo(Math.cos(t) * len, Math.sin(t) * len); c.stroke(); } c.restore(); }
function petals(c, R, n, len, col, ink) { for (let i = 0; i < n; i++) { const t = i / n * P * 2; c.save(); c.rotate(t); c.beginPath(); c.ellipse(R + len * 0.35, 0, len * 0.6, len * 0.32, 0, 0, P * 2); c.fillStyle = col; c.fill(); c.stroke(); c.restore(); } }

const LABELS = {
