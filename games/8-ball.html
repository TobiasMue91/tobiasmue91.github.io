<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>8-Ball Pool - Free Online Billiards vs Computer or a Friend | GPT Games</title>
<meta name="description" content="Play 8-ball pool free in your browser: true-to-life spin, draw and english, an aim guide with ghost ball, three computer opponents from casual to ruthless, or two players on one table. Made for phones and desktop.">
<link rel="canonical" href="https://gptgames.dev/games/8-ball.html">
<meta name="theme-color" content="#0d0a08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --room:#0d0a08; --room2:#17110d; --ink:#f3ecdf; --ink2:#bfb3a1; --ink3:#857a6c;
  --chalk:#6aaed6; --chalk2:#2f7fb8; --brass:#e2b56b; --brass2:#a87a35; --hot:#ff6a3d; --plate:rgba(24,18,14,.86); --line:rgba(243,236,223,.12);
  --f:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --ease:cubic-bezier(.16,.84,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--room);color:var(--ink);font-family:var(--f);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- scoreboard ---------- */
#hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);height:76px;align-items:center;gap:14px;padding:10px 12px 4px;max-width:1180px;width:100%;margin:0 auto}
.plate{justify-self:end;max-width:100%;position:relative;display:flex;flex-direction:column;gap:5px;padding:8px 14px 9px;border-radius:999px;background:var(--plate);border:1px solid var(--line);min-width:0;transition:border-color .5s var(--ease),box-shadow .5s var(--ease)}
.plate.p2{justify-self:start;align-items:flex-end;text-align:right}
.plate .who{display:flex;align-items:baseline;gap:8px;min-width:0;width:100%}
.plate.p2 .who{flex-direction:row-reverse}
.plate .nm{font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .grp{font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.plate:not(.on){opacity:.72}
.plate{transition:opacity .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease)}
.plate.on{background:radial-gradient(130% 160% at 50% -40%,rgba(255,206,130,.32),rgba(28,20,13,.95) 72%);border-color:rgba(226,181,107,.75);box-shadow:0 0 0 1px rgba(226,181,107,.3),0 8px 34px -8px rgba(255,190,100,.55)}
.plate.on .grp{color:var(--brass)}
.socks{display:flex;gap:3px}
.sock{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(243,236,223,.08);position:relative;flex:none}
.sock.eight{margin-left:9px}
.sock.eight::before{content:'';position:absolute;left:-6px;top:3px;bottom:3px;width:1px;background:var(--line)}
.sock img{position:absolute;inset:0;width:100%;height:100%;display:block}
.sock img{transition:opacity .5s var(--ease),filter .5s var(--ease),transform .5s var(--ease)}
.sock.open{box-shadow:none;background:radial-gradient(circle,rgba(243,236,223,.18) 0 2px,transparent 2.5px)}
.nudge{animation:nudge 1.2s var(--ease) 3}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(226,181,107,0)}40%{box-shadow:0 0 0 4px rgba(226,181,107,.9),0 0 22px rgba(226,181,107,.6)}}
.sock.gone img{opacity:.16;filter:grayscale(1);transform:scale(.7)}
.sock.gone{box-shadow:inset 0 0 0 1.5px rgba(243,236,223,.38)}
.sock.hot{box-shadow:0 0 0 2px var(--brass),0 0 12px rgba(226,181,107,.8);animation:hot 1.6s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 0 2px var(--brass),0 0 3px rgba(226,181,107,.3)}}
.sock.drop img{animation:drop .9s var(--ease) both}
.sock.drop{animation:flash .9s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--brass),0 0 16px rgba(226,181,107,.9)}100%{box-shadow:inset 0 0 0 1.5px rgba(243,236,223,.38)}}
@keyframes drop{0%{opacity:1;filter:none;transform:scale(1.35)}35%{opacity:1;filter:none;transform:scale(1.1)}100%{opacity:.16;filter:grayscale(1);transform:scale(.7)}}
#mid{display:flex;align-items:center;justify-content:center}
#menuBtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--plate);border:1px solid var(--line)}
#menuBtn i{display:block;width:16px;height:2px;background:var(--ink2);border-radius:2px;box-shadow:0 -5px 0 var(--ink2),0 5px 0 var(--ink2)}

/* ---------- table + rail column ---------- */
#main{position:relative;min-height:0;width:100%}
#stage{position:absolute;inset:0 0 max(6px,env(safe-area-inset-bottom)) 0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:4}
#call,#hint{z-index:6}
#col{position:absolute;display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
#spin{width:58px;height:58px;border-radius:50%;flex:none;position:relative}
#spin canvas{width:100%;height:100%;display:block;border-radius:50%}
.lbl{font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;text-align:center;margin-top:-8px}
#power{position:relative;flex:1;width:46px;min-height:120px;border-radius:999px;background:linear-gradient(90deg,#120b06,#2b1a0f 30%,#3a2415 50%,#2b1a0f 70%,#120b06);box-shadow:inset 0 0 0 1px var(--line),inset 0 2px 10px rgba(0,0,0,.7);overflow:hidden;cursor:ns-resize;touch-action:none}
#power .tick{position:absolute;left:5px;width:7px;height:2px;border-radius:1px;background:rgba(226,181,107,.45)}
#power .tick::after{content:'';position:absolute;left:calc(100% + var(--tw,22px));width:7px;height:2px;border-radius:1px;background:inherit}
#power .tick.big{width:10px;background:rgba(226,181,107,.85)}
#power .tick.big::after{width:10px;left:calc(100% + var(--tw2,16px))}
#power .fill{position:absolute;left:13px;right:13px;top:6px;height:0;border-radius:999px;background:linear-gradient(180deg,rgba(226,181,107,.35) 0%,#e2b56b 45%,#f0a14a 80%,#ff5a2e 100%);background-size:100% var(--h,300px);box-shadow:0 0 16px rgba(226,181,107,.45)}
#power.teach .cue{animation:teach 1.8s var(--ease) infinite}
@keyframes teach{0%,10%{transform:none}50%{transform:translateY(38%)}62%,100%{transform:none}}
#power .cue{box-shadow:0 2px 6px rgba(0,0,0,.6),0 -2px 0 2px rgba(226,181,107,.0)}
#power .grip{position:absolute;left:4px;right:4px;top:2px;height:30px;border-radius:999px;border:2px solid rgba(226,181,107,.55);pointer-events:none;transition:transform .45s var(--ease)}
#power.live .grip{transition:none}
#power.teach .grip{animation:teach 1.8s var(--ease) infinite;border-color:var(--brass)}
#power .cue{position:absolute;left:50%;top:6px;width:14px;margin-left:-7px;bottom:-400px;border-radius:7px 7px 0 0;background:linear-gradient(90deg,#c9a46b,#f3dcae 45%,#b88f55);box-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;transition:transform .45s var(--ease)}
#power .cue::before{content:'';position:absolute;left:0;right:0;top:0;height:9px;border-radius:7px 7px 0 0;background:var(--chalk2)}
#power .cue::after{content:'';position:absolute;left:0;right:0;top:9px;height:14px;background:#efe8da}
#power.live .cue{transition:none}
#power .pct{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:800;font-size:17px;color:var(--ink);text-shadow:0 1px 4px #000;opacity:0;transition:opacity .2s}
#power.live .pct{opacity:1}
#fine{position:relative;width:46px;height:118px;flex:none;border-radius:12px;background:#14100c;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;cursor:ns-resize;touch-action:none}
#fine canvas{width:100%;height:100%;display:block}
#col.off #power,#col.off #fine{opacity:.35;pointer-events:none}
#col #power,#col #fine{transition:opacity .35s var(--ease)}

/* ---------- calls over the table ---------- */
#call{position:absolute;left:50%;top:12px;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;text-align:center;z-index:5}
#call .c{display:inline-flex;flex-direction:column;align-items:center;padding:10px 26px 12px;border-radius:999px;background:rgba(13,10,8,.82);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transform:translateY(10px) scale(.96);transition:opacity .35s var(--ease),transform .5s var(--ease)}
#call .c.show{opacity:1;transform:none}
#call b{font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;line-height:1;font-style:italic}
#call small{font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-top:5px}
#call .foul b{color:var(--hot)}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-weight:600;font-size:15px;max-width:calc(100vw - 90px);overflow:hidden;text-overflow:ellipsis;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);background:rgba(13,10,8,.78);padding:8px 16px;border-radius:999px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .4s var(--ease)}
#hint.show{opacity:1}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,rgba(13,10,8,.55),rgba(13,10,8,.92) 70%);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.ov.show{opacity:1;pointer-events:auto}
.card{width:min(440px,100%);text-align:center;transform:translateY(16px);transition:transform .6s var(--ease)}
.ov.show .card{transform:none}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-style:italic;font-size:64px;letter-spacing:.02em;line-height:.9;text-transform:uppercase}
.logo canvas{width:58px;height:58px}
.tag{font-weight:600;font-size:14px;letter-spacing:.3em;color:var(--ink2);text-transform:uppercase;margin-top:10px}
.sect{font-weight:600;font-size:12px;letter-spacing:.24em;color:var(--ink2);text-transform:uppercase;margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.sect::before,.sect::after{content:'';flex:1;height:1px;background:var(--line)}
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px 13px;border-radius:22px;background:var(--plate);border:1px solid var(--line);transition:border-color .3s,transform .3s var(--ease),background .3s}
.opp:hover{border-color:rgba(226,181,107,.55);transform:translateY(-2px)}
.opp:active{transform:scale(.97)}
.opp.rec1{border-color:rgba(226,181,107,.6);background:radial-gradient(120% 120% at 50% 0%,rgba(226,181,107,.16),var(--plate) 70%)}
.pips{display:flex;gap:5px;margin-bottom:4px}.pips i{width:9px;height:9px;border-radius:2px;background:rgba(243,236,223,.15);transform:rotate(45deg)}.pips i.on{background:var(--brass)}
.opp .n{font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.opp .d{font-weight:500;font-size:13px;letter-spacing:.02em;color:var(--ink2);line-height:1.15;padding:0 6px;min-height:30px}
.opp .go{font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-top:2px}
.opp .rec:empty{display:none}
.opp .rec{font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--ink2);font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:0 22px;border-radius:999px;font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;background:var(--plate);border:1px solid var(--line);transition:border-color .3s,transform .25s var(--ease)}
.btn:hover{border-color:rgba(226,181,107,.55)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,#f0c983,var(--brass) 55%,#c99a4f);color:#1d1307;border-color:#f0c983}
.btn.pri:hover{filter:brightness(1.07)}
.btn small{font-weight:600;font-size:13px;letter-spacing:.08em;opacity:.7}
.row{display:flex;gap:8px;margin-top:10px}
#cont{margin-top:26px}
.res{font-weight:800;font-style:italic;font-size:58px;letter-spacing:.02em;text-transform:uppercase;line-height:.95}
.why{font-weight:600;font-size:16px;letter-spacing:.12em;color:var(--ink2);text-transform:uppercase;margin-top:10px}
.stats{display:flex;flex-direction:column;align-items:center;gap:12px;margin:26px 0 24px}
.rk{display:flex;align-items:center;gap:12px}.rk span{width:74px;text-align:right;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.rk div{display:flex;gap:4px;min-width:250px}.rk img{width:28px;height:28px}.rk img.up{opacity:.18;filter:grayscale(1)}.rk em{font-style:normal;color:var(--ink3);font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.rc{margin-top:8px;font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}.rc b{color:var(--brass);font-size:20px;margin-left:6px}
.sheet .card{width:min(360px,100%)}
.sheet .btn{margin-top:8px}
.cloths{display:flex;justify-content:center;gap:14px;margin-top:6px}
.cloth{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.4);position:relative}
.cloth.sel::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--brass)}
#spinPop{position:fixed;z-index:30;display:grid;place-items:center;inset:0;background:rgba(13,10,8,.55);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
#spinPop.show{opacity:1;pointer-events:auto}
#spinPop .face{position:relative;width:min(240px,62vw);aspect-ratio:1;transform:scale(.6);transition:transform .45s var(--ease);touch-action:none;cursor:crosshair}
#spinPop.show .face{transform:none}
#spinPop canvas{width:100%;height:100%;display:block}
#spinPop .lbl{margin-top:16px;font-size:13px}

body.menu #hud,body.menu #col{opacity:0;pointer-events:none}
#hud,#col{transition:opacity .5s var(--ease)}
#ovMenu{background:radial-gradient(ellipse at 50% 45%,rgba(13,10,8,.45),rgba(13,10,8,.9) 75%);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.foot button{border:1px solid var(--line);border-radius:999px;padding:0 14px}
.foot button,.foot a{display:inline-flex;align-items:center;color:var(--ink2);text-decoration:none;letter-spacing:.16em;text-transform:uppercase;min-height:32px;font-size:13px;font-weight:600}
.fly{position:fixed;z-index:15;pointer-events:none;will-change:transform}
@media (min-width:900px){.plate .nm{font-size:22px}.plate .grp{font-size:13px}.sock{width:27px;height:27px}.plate{padding:9px 18px 10px}#hud{height:84px}}
.sock.open{background:radial-gradient(circle,rgba(243,236,223,.32) 0 2.5px,transparent 3px)!important}
#ovOver{background:radial-gradient(ellipse at 50% 45%,rgba(13,10,8,.86),rgba(13,10,8,.97) 70%)}
/* ---------- phones ---------- */
@media (max-width:640px){
  #hud{gap:6px;padding:8px 8px 2px;height:62px}
  .plate{padding:6px 11px 7px;gap:4px}
  .plate .nm{font-size:16px}
  .plate .grp{font-size:10px;letter-spacing:.1em}
  .sock{width:15px;height:15px}
  .socks{gap:2px}
  .sock.eight{margin-left:7px}
  .sock.eight::before{left:-5px}
  #menuBtn{width:38px;height:38px}
  #col{gap:10px;padding:2px 0}
  #spin{width:42px;height:42px}
  #power,#fine{width:40px}
  #fine{height:80px}
  #spin{width:42px;height:42px}
  .logo{font-size:50px}
  .logo canvas{width:46px;height:46px}
  .res{font-size:46px}
  .rk div{min-width:0}.rk img{width:22px;height:22px}.rk span{width:58px;font-size:13px}
  #call b{font-size:19px;letter-spacing:.03em}
  #call small{font-size:11px;letter-spacing:.08em}
  #call .c{padding:8px 18px 9px}
  #hint{font-size:12px;letter-spacing:.08em;padding:7px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01s!important;animation-duration:.01s!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="plate p1" id="pl0"><div class="who"><span class="nm" id="nm0">You</span><span class="grp" id="gp0">Open table</span></div><div class="socks" id="sk0"></div></div>
    <div id="mid"><button id="menuBtn" aria-label="Menu"><i></i></button></div>
    <div class="plate p2" id="pl1"><div class="who"><span class="nm" id="nm1">The Regular</span><span class="grp" id="gp1">Open table</span></div><div class="socks" id="sk1"></div></div>
  </header>
  <div id="main">
    <div id="stage">
      <canvas id="cv" aria-label="Pool table"></canvas>
      <canvas id="fx" aria-hidden="true"></canvas>
      <div id="call"><div class="c" id="callC"><b id="callB"></b><small id="callS"></small></div></div>
      <div id="hint"></div>
    <aside id="col">
      <div id="power" role="slider" aria-label="Shot power: pull down and release to shoot" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="pFill"></div><div class="cue" id="pCue"></div><div class="grip" id="pGrip"></div>
      </div>
      <div id="fine" aria-label="Fine aim: drag up or down"><canvas id="fineCv"></canvas></div>
      <button id="spin" aria-label="Cue ball spin"><canvas id="spinCv"></canvas></button>
    </aside>
    </div>
  </div>
</div>

<div class="ov" id="ovMenu">
  <div class="card">
    <div class="logo"><canvas id="logoBall" width="116" height="116"></canvas><span>Eight Ball</span></div>
    <div class="tag">Pool under the lamp</div>
    <div id="cont"></div>
    <div class="sect">Play the house</div>
    <div class="opps" id="opps"></div>
    <div class="sect">Or a friend</div>
    <button class="btn" id="duoBtn">Two players · one table</button>
    <div class="foot"><button id="menuSound">Sound on</button><a href="https://gptgames.dev/" target="_top">More games · gptgames.dev</a></div>
  </div>
</div>

<div class="ov" id="ovOver">
  <div class="card">
    <div class="res" id="resT"></div>
    <div class="why" id="resW"></div>
    <div class="stats" id="resS"></div>
    <button class="btn pri" id="againBtn">Rematch</button>
    <div class="row"><button class="btn" id="homeBtn">Change opponent</button></div>
  </div>
</div>

<div class="ov sheet" id="ovSheet">
  <div class="card">
    <button class="btn pri" id="resumeBtn">Back to the table</button>
    <button class="btn" id="rerackBtn">Rerack</button>
    <button class="btn" id="quitBtn">Change opponent</button>
    <button class="btn" id="soundBtn">Sound: on</button>
    <div class="sect">Cloth</div>
    <div class="cloths" id="cloths"></div>
  </div>
</div>

<div id="spinPop"><div><div class="face" id="spinFace"><canvas id="spinBig"></canvas></div><div class="lbl">Tap where the tip strikes · double-tap to centre</div></div></div>
<script id="core">
/* Eight Ball core: table geometry, ball physics, the rules of eight-ball and the house players.
   DOM-free; test/8-ball.mjs runs this block in Node. Units are millimetres and seconds; x runs along the
   table (head string at L/4, foot spot at 3L/4), y across it, both from the cushion nose. */
const Core = (() => {
  const L = 2540, W = 1270, R = 28.575, D = 2 * R;
  const G = 9810, MU_S = 0.2, MU_R = 0.016, SPIN_DECEL = 14, E_BALL = 0.95, E_RAIL = 0.78, MU_RAIL = 0.2;
  const DT = 1 / 1000;
  const HEAD = L / 4, FOOT = 3 * L / 4;
  const VMAX = 7600;                                        // cue speed at full power, mm/s
  const CORNER_M = 2.1 * D / Math.SQRT2, SIDE_S = 1.12 * D, FACE = 64;

  // ---- table geometry: cushion noses, jaw facings, pockets ----
  const segs = [], pockets = [];
  const seg = (a, b) => segs.push({ax: a[0], ay: a[1], bx: b[0], by: b[1]});
  const c38 = Math.cos(38 * Math.PI / 180), s38 = Math.sin(38 * Math.PI / 180);
  const c14 = Math.cos(12 * Math.PI / 180), s14 = Math.sin(12 * Math.PI / 180);

$('quitBtn').onclick = () => { toggleSheet(false); showMenu(); };
$('soundBtn').onclick = () => { store.sound = !store.sound; persist(); if (store.sound) audio(); toggleSheet(true); };
$('againBtn').onclick = () => start({mode: G.mode, level: G.level, cpuBreaks: G.mode === 'cpu' && G.S.winner === 0});
$('homeBtn').onclick = () => showMenu();
$('duoBtn').onclick = () => start({mode: 'duo'});
$('menuSound').onclick = () => { store.sound = !store.sound; persist(); if (store.sound) audio(); $('menuSound').textContent = (store.sound ? '♪ Sound on' : '♪ Sound off'); };
$('ovSheet').addEventListener('pointerdown', e => { if (e.target === $('ovSheet')) toggleSheet(false); });

// ---------------------------------------------------------------- boot
function boot() {
  buildMasks(); buildIcons();
  resetOrient();
  layout(); renderHud(); drawSpinUi();
  makeWorker();
  const q = new URLSearchParams(location.search);
  if (q.has('mock')) mock(q.get('mock'));
  else showMenu();
  requestAnimationFrame(frame);
}
new ResizeObserver(() => { layout(); setPowerUi(V.power, !!pwDrag); }).observe($('stage'));
document.fonts && document.fonts.ready.then(() => { buildMasks(); buildIcons(); V.sprite = []; renderHud(); if (!G.started && !new URLSearchParams(location.search).has('mock')) showMenu(); });

// a frozen table for screenshots and the critic
function mock(kind) {
  if (kind === 'menu') { showMenu(); return; }
  G.mode = 'cpu'; G.level = 'shark'; G.started = true;
  const S = G.S = Core.newGame({seed: 7});
  // a hand-set table mid-rack: you on solids, a medium cut on the 3 into the top right corner
  const at = {0: [880, 760], 1: [310, 300], 3: [1820, 330], 4: [1600, 1030], 6: [2050, 980], 7: [1250, 980], 8: [1950, 640],
    10: [420, 1010], 12: [1450, 260], 13: [2280, 760], 15: [700, 420]};
  if (kind === 'eight') { for (const k of [1, 4, 6, 7]) delete at[k]; at[8] = at[3]; delete at[3]; }
  S.balls.forEach(b => { const q = at[b.n]; b.on = !!q; if (q) { b.x = q[0]; b.y = q[1]; } else b.pocket = 0; });
  S.broken = true; S.phase = 'aim'; S.turn = 0; S.groups = ['solids', 'stripes']; S.inHand = null;
  resetOrient();
  const ob = S.balls[kind === 'eight' ? 8 : 3], ap = {x: L - 6, y: 6}; let ux = ap.x - ob.x, uy = ap.y - ob.y; const ul = Math.hypot(ux, uy); ux /= ul; uy /= ul;
  V.aim = Math.atan2(ob.y - uy * D - S.balls[0].y, ob.x - ux * D - S.balls[0].x); V.spin = [0, 0];
  renderHud();
  if (kind === 'power') setPower(.62);
  if (kind === 'hand') { S.inHand = 'anywhere'; S.foul = 'scratch'; nextTurn(); }
}
window.__pool = {G, V, Core, icons, start, canControl, human, cueScreen: () => { const b = G.S.balls[0], r = cv.getBoundingClientRect(), s = toScreen(b.x, b.y); return [r.left + s[0], r.top + s[1]]; }, shoot: (a, p, sx = 0, sy = 0) => { V.aim = a; V.power = p; V.spin = [sx, sy]; shootNow(); }, layout, setPower};
boot();
})();
