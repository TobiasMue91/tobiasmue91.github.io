<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bedtime – Lights Out</title>
<meta name="description" content="Bedtime is Lights Out on a street at night: tap a window to switch it and the flats beside it, and put each apartment block to sleep in as few moves as the puzzle allows. Hand-tuned levels that grow from a cottage to a tower, par for every block, and a new block every night.">
<meta name="theme-color" content="#0b1029">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --night0:#090d26;--night1:#1a2150;--night2:#2c2f5e;
  --brick:#33232f;--brick2:#2b1f30;--ledge:#4a3846;--frame:#170f1d;
  --glass:#232a4a;--lit:#ffc76e;--lit2:#ff9a3f;--ember:#c4461c;
  --moon:#f4ecd6;--ink:#efe8d8;--mute:#a7a4c2;--over:#e88a6a;
  --c:56px;--g:16px;--rg:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:linear-gradient(var(--night0),var(--night1) 62%,var(--night2));color:var(--ink);
  font-family:Fraunces,Georgia,serif;overflow:hidden;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--moon);outline-offset:3px;border-radius:8px}
canvas.bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stars{opacity:.3;transition:opacity 1.6s ease}
body.won #stars{opacity:1}
.moon{position:fixed;width:52px;height:52px;border-radius:50%;top:max(86px,12vh);right:max(22px,calc(50% - 330px));
  background:radial-gradient(circle at 64% 60%,#d9cca822 0 12%,#0000 13%),radial-gradient(circle at 34% 66%,#cdbf9a33 0 9%,#0000 10%),radial-gradient(circle at 46% 30%,#d8cba633 0 7%,#0000 8%),radial-gradient(circle at 38% 36%,#fffcf2,#eadfbf 70%);box-shadow:0 0 calc(40px + 70px*var(--k,0)) calc(8px + 22px*var(--k,0)) #f4ecd626;opacity:calc(.55 + .45*var(--k,0));
  transition:opacity 1.6s ease,box-shadow 1.6s ease}
body.won .controls .ctl{opacity:0;pointer-events:none}
body.won .w .moonlit{animation:sweep 1.4s ease-out both;animation-delay:var(--d,0s)}
@keyframes sweep{0%{background-color:#0000}35%{background-color:#c9d3ff2e}100%{background-color:#c9d3ff0a}}
body.won .moon{opacity:1;box-shadow:0 0 110px 34px #f4ecd630}
.app{position:relative;height:100%;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:900px;margin:0 auto;
  padding:env(safe-area-inset-top) 16px 0}
header{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 0 0;gap:12px;width:100%;max-width:560px;margin:0 auto}
.addr{font-style:italic;font-size:15px;color:var(--mute);letter-spacing:.2px;min-height:20px}
.addr b{font-style:normal;font-weight:600;color:var(--ink);font-size:20px;display:block;letter-spacing:.1px;margin-bottom:0}
.tally{display:flex;align-items:center;gap:5px;margin-top:8px;min-height:14px;flex-wrap:wrap;max-width:260px}
.tally i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--moon);background:var(--moon);box-shadow:0 0 8px #f4ecd655;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.tally i.u{background:transparent;border-color:#f4ecd655;box-shadow:none}
.tally i.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(1.5)}100%{transform:none}}
.tally i.x{background:var(--over);border-color:var(--over);box-shadow:none}
.tally span{font-size:13px;color:var(--mute);margin-right:3px;font-style:italic}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;margin:-4px -6px 0 0;flex:none}
.icon svg{width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.bldg{position:relative;padding:calc(var(--c)*.42) calc(var(--c)*.36) 0;border-radius:3px 3px 0 0;
  background:
   repeating-linear-gradient(0deg,#0000 0 9px,#00000014 9px 10px),
   linear-gradient(90deg,#f4ecd612 0 3px,#0000 3px),
   linear-gradient(90deg,var(--brick),var(--brick2));
  box-shadow:0 0 0 1px #0000;transition:transform .6s cubic-bezier(.3,0,.25,1),opacity .6s ease;will-change:transform}
.bldg.out{transition:transform .42s cubic-bezier(.55,0,.8,.4)}
.bldg.out{transform:translateX(-120vw)}
.bldg.in{transform:translateX(120vw);transition:none}
.cornice{position:absolute;left:-8px;right:-8px;top:-10px;height:12px;background:#2a1e2c;border-radius:2px;box-shadow:inset 0 2px 0 #f4ecd614}
.chimney{position:absolute;top:-38px;width:22px;height:30px;background:#2a1e2c}
.grid{display:grid;grid-template-columns:repeat(var(--w),var(--c));column-gap:var(--g);row-gap:var(--rg)}
.door{height:calc(var(--c)*.95);margin-top:calc(var(--rg)*.8);display:flex;justify-content:center;align-items:flex-end}
.door i{width:calc(var(--c)*.75);height:100%;background:#150f1c;border-radius:calc(var(--c)*.4) calc(var(--c)*.4) 0 0;box-shadow:0 0 0 5px #2a1e2c}
.w{position:relative;width:var(--c);height:calc(var(--c)*1.22);border-radius:4px 4px 2px 2px;border:3px solid var(--frame);
  background:var(--glass);transition:transform .14s cubic-bezier(.3,1.6,.5,1),border-color .25s ease,box-shadow .15s ease-out}
.w .moonlit{position:absolute;inset:0;background:radial-gradient(60% 40% at 72% 22%,#c9d3ff1f,#0000 70%),linear-gradient(#0000 60%,#0000001c)}
.w .lit{position:absolute;inset:0;opacity:0;
  background:radial-gradient(120% 90% at 50% 30%,#fff2cc,var(--lit) 48%,var(--lit2))}
.w .lit svg{position:absolute;inset:0;width:100%;height:100%}
.w .ember{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 40%,#ff8a3d,var(--ember) 70%)}
.w.cool .ember{animation:none}
@keyframes cool{0%{opacity:.45}100%{opacity:0}}
.w::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,#0000 calc(50% - 1.5px),var(--frame) calc(50% - 1.5px) calc(50% + 1.5px),#0000 calc(50% + 1.5px)),
             linear-gradient(#0000 calc(42% - 1.5px),var(--frame) calc(42% - 1.5px) calc(42% + 1.5px),#0000 calc(42% + 1.5px))}
.w::before{content:"";position:absolute;left:-6px;right:-6px;bottom:-9px;height:5px;background:var(--ledge);border-radius:1px}
.w.on{box-shadow:0 0 calc(var(--c)*.55) calc(var(--c)*.06) #ff9e4a40}
.w.on .lit{opacity:1}
.w.pv{border-color:#ffd79a}
.w:active,.w.press{transform:scale(.93)}
.w.ghost{animation:ghost 1.6s ease-in-out infinite}
@keyframes ghost{0%,100%{border-color:var(--frame);outline:0 solid #fff0}50%{border-color:#fff1d0;outline:3px solid #ffe2a880;outline-offset:4px}}
.w .ring{position:absolute;inset:-10px;border-radius:10px;border:3px solid var(--moon);box-shadow:0 0 18px #f4ecd688;opacity:0;pointer-events:none}
.w.hint .ring{animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:0;transform:scale(.92)}50%{opacity:.9;transform:scale(1)}}
.blank{width:var(--c);height:calc(var(--c)*1.22);display:grid;place-items:center}
.blank::after{content:"";width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 62% 32%,#3a4270,#1d2340 60%);box-shadow:0 0 0 3px var(--frame),0 0 0 7px var(--ledge),0 4px 0 7px #0003}
.ground{height:12px;background:linear-gradient(#5a4a5a,#3a2f40 30%,#2a2333);margin:0 calc(50% - 50vw)}
.controls{display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,6vw,34px);padding:14px 0 calc(16px + env(safe-area-inset-bottom));background:linear-gradient(#211b2b,#17121f);margin:0 calc(50% - 50vw)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--mute);min-width:56px;transition:color .2s}
.ctl .b{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #f4ecd633;transition:transform .12s ease,background .2s,border-color .2s}
.ctl svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ctl.main .b{background:#f4ecd624;border-color:#f4ecd670}
.ctl:active .b{transform:scale(.9)}
.ctl{transition:opacity .2s ease}.ctl[disabled]{opacity:0;cursor:default}.ctl[disabled] .b{border-color:transparent}
@media (min-width:900px) and (min-height:640px){.addr b{font-size:26px}.addr{font-size:17px}.tally i{width:14px;height:14px}header{padding-top:22px}}
.ctl.nudge .b{border-color:var(--moon);background:#f4ecd62e;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 7px #f4ecd614}}
/* win card */
.card{position:absolute;left:16px;right:16px;bottom:calc(8px + env(safe-area-inset-bottom));margin:auto;max-width:380px;text-align:center;padding:12px 16px 12px;
  background:#0d1130e6;border:1px solid #f4ecd626;border-radius:18px;backdrop-filter:blur(6px);
  opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1);z-index:5}
.card:not(.show){transition-duration:.15s}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card h2{font-style:italic;font-weight:400;font-size:30px;line-height:1}
.card .top{display:flex;align-items:center;justify-content:center;gap:16px}#cline{display:none}
#csub{display:none}.tonight-card #csub{display:block;font-style:normal;color:var(--lit);font-size:17px;margin:6px 0 0}
header{transition:opacity .4s ease}
.card p{color:var(--mute);font-size:15px;margin-top:6px;font-style:italic}
.moons{display:flex;justify-content:center;gap:10px}
.moons svg{width:30px;height:30px;transition:transform .5s cubic-bezier(.3,1.7,.5,1)}
.moons path{fill:#f4ecd61c;stroke:#f4ecd655;stroke-width:1;transition:fill .3s ease}
.moons svg.got.in{transform:scale(1.18)}.moons svg.got.in path{fill:var(--moon);stroke:var(--moon)}
.row{display:flex;gap:10px;justify-content:center;margin-top:10px}
.pill{padding:12px 22px;border-radius:999px;font-size:16px;border:1.5px solid #f4ecd640;min-height:46px}
.pill.sq{padding:0;width:46px;display:grid;place-items:center}.pill.sq svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linejoin:round}
.pill.go{background:var(--moon);color:#141733;border-color:var(--moon);font-weight:600;min-width:130px}
/* street sheet */
.sheet{position:fixed;inset:0;z-index:20;background:#060818cc;opacity:0;pointer-events:none;transition:opacity .3s ease}
.sheet.show{opacity:1;pointer-events:auto}
.panel{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:560px;max-height:86dvh;overflow:auto;background:#121633;border-radius:20px 20px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet.show .panel{transform:none}
.panel h3{font-weight:600;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.tonight{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 20px;padding:16px;border-radius:14px;
  background:linear-gradient(120deg,#2a2550,#1c2048);border:1px solid #f4ecd62a;width:100%;text-align:left}
.tonight small{display:block;color:var(--mute);font-style:italic;font-size:14px;margin-top:2px}
.tonight .st{font-size:14px;white-space:nowrap;padding:9px 16px;border-radius:999px;background:var(--moon);color:#141733;font-weight:600}.tonight .st.q{background:none;color:var(--lit);padding:0;font-weight:400}
.streetname{font-style:italic;color:var(--mute);font-size:14px;margin:18px 0 8px}
.houses{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.house{aspect-ratio:1/1.05;border-radius:10px;background:#1c2046;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:17px;font-weight:600;border:1.5px solid transparent}
.house .mm{display:flex;gap:3px;height:14px}.house .mm svg{width:14px;height:14px}.house .mm path{fill:none;stroke:#f4ecd666;stroke-width:1.5}.house .mm .g path{stroke:var(--moon)}.house .mm .g path{fill:var(--moon)}.house .lk{width:14px;height:14px;stroke:#f4ecd655;fill:none;stroke-width:2}
.house.cur{border-color:var(--lit)}
.house[disabled]{cursor:default;background:#181c40;color:#f4ecd680}
.house.done{background:#262a55}
.credit{display:block;text-align:center;color:var(--mute);font-size:13px;margin-top:22px;text-decoration:none;font-style:italic}
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,10px);background:var(--moon);color:#141733;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .bldg{transition:opacity .3s ease}.bldg.out{transform:none;opacity:0}.bldg.in{transform:none;opacity:0}
  .w .lit{transition-duration:.12s}.w.hint .ring{opacity:.9;animation:none}
}
</style>
</head>
<body>
<canvas class="bg" id="stars"></canvas>
<div class="moon"></div>
<canvas class="bg" id="city"></canvas>
<div class="app">
  <header>
    <div>
      <div class="addr" id="addr"></div>
      <div class="tally" id="tally" aria-live="polite"></div>
    </div>
    <button class="icon" id="snd" aria-label="Sound on"><svg viewBox="0 0 24 24" id="sndi"></svg></button>
  </header>
  <div class="stage" id="stage">
    <div class="bldg" id="bldg"></div>
  </div>
  <div class="card" id="card" role="dialog" aria-live="polite">
    <div class="top"><h2 id="ctitle">Goodnight.</h2><div class="moons" id="cmoons"></div></div>
    <p id="csub"></p>
    <p id="cline" style="font-style:normal"></p>
    <div class="row" id="crow"></div>
  </div>
  <div>
    <div class="ground"></div>
    <nav class="controls">
      <button class="ctl" id="bAgain"><span class="b"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 3.5v5.1h5.1"/></svg></span>Again</button>
      <button class="ctl" id="bStreet"><span class="b"><svg viewBox="0 0 24 24"><path d="M3 21V10l5-4 5 4v11M13 21v-8l4-3 4 3v8M2 21h20M7 14h2M7 17h2"/></svg></span>Street</button>
      <button class="ctl main" id="bUndo"><span class="b"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>Undo</button>
      <button class="ctl" id="bHint"><span class="b"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></span>Hint</button>
    </nav>
  </div>
</div>
<div class="sheet" id="sheet">
  <div class="panel" role="dialog" aria-label="Street">
    <h3>Bedtime <button class="icon" id="sClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h3>
    <button class="tonight" id="sTonight"></button>
    <div id="sList"></div>
    <a class="credit" href="https://www.gptgames.dev/">More games at gptgames.dev</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script id="core">
// Bedtime core: no DOM. Boards are arrays of 0/1 over a w*h grid; mask marks which cells are windows.
var BEDTIME = (function () {
  function hash(s) { var h = 2166136261 >>> 0; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
  function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // Building outlines. 1 = a window, 0 = wall.
  var SHAPES = {
    rect: function (w, h) { return fill(w, h, function () { return 1; }); },
    door: function (w, h) { return fill(w, h, function (x, y) { return y === h - 1 && Math.abs(x - (w - 1) / 2) < 1 ? 0 : 1; }); },
    gable: function (w, h) { return fill(w, h, function (x, y) { return y === 0 && (x === 0 || x === w - 1) ? 0 : 1; }); },
    tower: function (w, h) { return fill(w, h, function (x, y) { return y < 2 && Math.abs(x - (w - 1) / 2) > 0.5 ? 0 : 1; }); },
    wings: function (w, h) { return fill(w, h, function (x, y) { return y === 0 && Math.abs(x - (w - 1) / 2) < 1 ? 0 : 1; }); },
    stepped: function (w, h) { return fill(w, h, function (x, y) { return (y === 0 && (x < 1 || x > w - 2)) || (y === 1 && (x === 0 || x === w - 1) && h > 5) ? 0 : 1; }); }
  };
  function fill(w, h, f) { var m = []; for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) m.push(f(x, y)); return m; }

  // Cells a press on i switches: itself and the windows above, below, left and right of it.
  function reach(w, h, mask, i) {
    var x = i % w, y = (i / w) | 0, out = [i];
    [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(function (d) {
      var nx = x + d[0], ny = y + d[1];
      if (nx >= 0 && ny >= 0 && nx < w && ny < h && mask[ny * w + nx]) out.push(ny * w + nx);
    });
    return out;
  }
  function press(b, i) {
    var n = b.lights.slice();
    reach(b.w, b.h, b.mask, i).forEach(function (j) { n[j] ^= 1; });
    return n;
  }
  function dark(lights) { for (var i = 0; i < lights.length; i++) if (lights[i]) return false; return true; }

  // Fewest presses that turn every light off, over GF(2). Returns cell indices, or null if none.
  function solve(w, h, mask, lights) {
    var cells = []; for (var i = 0; i < mask.length; i++) if (mask[i]) cells.push(i);
    var n = cells.length, pos = {}; cells.forEach(function (c, k) { pos[c] = k; });
    var rows = cells.map(function (c) { var r = new Uint8Array(n + 1); reach(w, h, mask, c).forEach(function (j) { r[pos[j]] = 1; }); r[n] = lights[c] ? 1 : 0; return r; });
    var piv = [], r = 0;
    for (var col = 0; col < n && r < n; col++) {
      var p = -1; for (var k = r; k < n; k++) if (rows[k][col]) { p = k; break; }
      if (p < 0) continue;
      var t = rows[p]; rows[p] = rows[r]; rows[r] = t;
      for (k = 0; k < n; k++) if (k !== r && rows[k][col]) for (var j = col; j <= n; j++) rows[k][j] ^= rows[r][j];
      piv.push(col); r++;
    }
    for (k = r; k < n; k++) if (rows[k][n]) return null;
    var isPiv = new Uint8Array(n); piv.forEach(function (c) { isPiv[c] = 1; });
    var free = []; for (k = 0; k < n; k++) if (!isPiv[k]) free.push(k);
    var base = new Uint8Array(n); piv.forEach(function (c, q) { base[c] = rows[q][n]; });
    var basis = free.map(function (f) { var v = new Uint8Array(n); v[f] = 1; piv.forEach(function (c, q) { v[c] = rows[q][f]; }); return v; });
    var best = base, bestW = weight(base);
    if (free.length && free.length <= 16) {
      var cur = base.slice();
      for (var g = 1; g < (1 << free.length); g++) {
        var bit = 0; while (!((g >> bit) & 1)) bit++;           // gray code: one basis vector changes per step
        var v = basis[bit]; for (k = 0; k < n; k++) cur[k] ^= v[k];
        var cw = weight(cur); if (cw < bestW) { bestW = cw; best = cur.slice(); }
      }
    }
    var out = []; for (k = 0; k < n; k++) if (best[k]) out.push(cells[k]);
    return out;
  }
  function weight(v) { var s = 0; for (var i = 0; i < v.length; i++) s += v[i]; return s; }

  var STREETS = ['Linden Row', 'Quay Lane', 'Orchard Street', 'Bell Yard', 'Mercer Walk', 'Tannery Close', 'Halfmoon Street', 'Rook Terrace'];
  var PER_STREET = 10;

  // What level n is: size, outline and par. Par is the fewest presses the block needs.
  function spec(n) {
    if (n <= 3) return { w: 3, h: 3, shape: 'rect', par: n };

  $('bStreet').onclick = openStreet;
  $('sClose').onclick = closeStreet;
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeStreet(); });
  $('sTonight').onclick = function () { closeStreet(); startLevel('tonight', { slide: true }); };
  $('sList').addEventListener('click', function (e) { var h = e.target.closest('.house'); if (!h || h.disabled) return; closeStreet(); var n = +h.dataset.n; startLevel(n, { slide: true, keep: n === save.cur }); });
  function openStreet() {
    var d = save.daily.done[today], st = save.daily.streak && (save.daily.last === today || B.nextDay(save.daily.last) === today) ? save.daily.streak : 0;
    $('sTonight').innerHTML = '<span><b style="font-weight:600;font-size:18px">Tonight’s block</b><small>' + (d ? 'Asleep in ' + d.m + ' moves' : 'A new block every night') + '</small></span>' + (d ? '<span class="st q">' + (st ? st + (st === 1 ? ' night' : ' nights') + ' running' : '') + '</span>' : '<span class="st">Play</span>');
    var top = Math.max(save.unlocked, save.cur), last = Math.ceil(Math.max(top, 1) / B.PER_STREET) * B.PER_STREET, html = '';
    for (var s = 0; s < last; s += B.PER_STREET) {
      html += '<div class="streetname">' + B.STREETS[(s / B.PER_STREET) % B.STREETS.length] + '</div><div class="houses">';
      for (var n = s + 1; n <= s + B.PER_STREET; n++) {
        var b = save.best[n], mm = ''; for (var k = 0; k < 3; k++) mm += '<svg viewBox="0 0 24 24" class="' + (b && k < b.s ? 'g' : '') + '"><path d="M15.5 3.2A9 9 0 1 0 20.8 15 7.2 7.2 0 0 1 15.5 3.2z"/></svg>';
        if (n > top) mm = '<svg class="lk" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
        html += '<button class="house' + (b ? ' done' : '') + (n === save.cur && mode === 'level' ? ' cur' : '') + '" data-n="' + n + '"' + (n > top ? ' disabled' : '') + ' aria-label="Block ' + n + '">' + ((n - 1) % B.PER_STREET + 1) + '<span class="mm">' + mm + '</span></button>';
      }
      html += '</div>';
    }
    $('sList').innerHTML = html; $('sheet').classList.add('show');
    setTimeout(function () { var c = $('sList').querySelector('.cur'); if (c) c.scrollIntoView({ block: 'nearest' }); $('sClose').focus({ preventScroll: true }); }, 30);
  }
  function closeStreet() { $('sheet').classList.remove('show'); }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeStreet();
    if ($('sheet').classList.contains('show')) return;
    if ((e.key === 'z' || e.key === 'u') && !e.metaKey) $('bUndo').click();
    if (e.key === 'r' && !e.metaKey && !e.ctrlKey) $('bAgain').click();
    var f = document.activeElement && document.activeElement.closest && document.activeElement.closest('.w');
    if (f && /^Arrow/.test(e.key)) {
      e.preventDefault(); var i = +f.dataset.i, w = board.w, d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -w, ArrowDown: w }[e.key];
      for (var j = i + d; j >= 0 && j < w * board.h; j += d) { if (Math.abs((j % w) - (i % w)) > 1 && Math.abs(d) === 1) break; if (cells[j]) { cells[j].focus(); break; } }
    }
  });
  function sndIcon() {
    $('sndi').innerHTML = save.mute ? '<path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"/>' : '<path d="M4 9h4l5-4v14l-5-4H4zM17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>';
    $('snd').setAttribute('aria-label', save.mute ? 'Sound off' : 'Sound on');
  }
  $('snd').onclick = function () { save.mute = !save.mute; store(); sndIcon(); if (!save.mute) { audio(); click(true, 0); } };

  var rz; addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { paintSky(); layout(); }, 80); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && isoToday() !== today) today = isoToday(); });

  addEventListener('load', function () { paintSky(); layout(); });
  sndIcon(); paintSky();
  startLevel(save.cur || 1, { keep: true });
  if (!reduce) evening();
  window.__bedtime = { get board() { return board; }, get lights() { return lights; }, act: act, start: startLevel, save: function () { return save; } };
})();
