:root{
  --paper:#ebe2cc; --paper-hi:#f7f1e1; --paper-lo:#d6c9ab; --rule:#85775a;
  --ink:#1d1a16; --ink-2:#4a443c; --vermilion:#d63f27; --blue:#2b45a0;
  --display:"Ultra","Rockwell","Georgia",serif; --type:"Courier Prime","Courier New",ui-monospace,monospace;
  --pad:14px; --kw:calc((100vw - 14px - 36px)/10); --kgap:4px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--type);font-weight:700;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .15  0 0 0 .08 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100vh;height:100dvh;max-width:1040px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) var(--pad) 0;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;row-gap:10px;position:relative;overflow:hidden}
.bar{grid-row:1;grid-column:1;display:flex;align-items:center;gap:12px;min-height:44px}
.mark{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.03em;color:var(--ink);text-decoration:none;flex:none}
.mark i{color:var(--vermilion);font-style:normal}
.modes{display:flex;gap:2px;margin-inline:auto}
.modes button{background:none;border:0;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:0 12px;height:44px;color:var(--ink-2);position:relative;transition:color .15s}
.modes button[aria-pressed=true]{color:var(--ink)}
.modes button[aria-pressed=true]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:4px;border-radius:2px;background:var(--vermilion)}
.modes button:disabled{opacity:.45;cursor:default}
.modes .dot{position:absolute;top:9px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--vermilion);display:none}
.modes .dot.on{display:block}
.tools{display:flex;gap:2px;flex:none}
.tools button{width:40px;height:44px;border-radius:10px;border:0;background:none;display:grid;place-items:center}
.tools svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tools .off{display:none}.tools button[aria-pressed=false] .on{display:none}.tools button[aria-pressed=false] .off{display:block}

.clock{grid-row:2;grid-column:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.time{font-family:var(--display);font-size:clamp(70px,12.5vh,104px);line-height:.95;display:flex;justify-content:center;transition:opacity .2s;font-weight:400}
.time span{display:inline-block;width:.8em;text-align:center}
.time span.p{width:.34em}
.time span.u{width:auto;font-size:.3em;align-self:flex-end;margin:0 0 .2em .15em;color:var(--ink-2)}
.app[data-state=ready] .time{opacity:.4}
.chip{opacity:1;min-width:132px;height:32px;padding:0 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper-hi);background:var(--blue);box-shadow:inset 0 0 0 2px var(--blue);transition:opacity .15s}
.chip.behind{background:var(--vermilion);box-shadow:inset 0 0 0 2px var(--vermilion)}
.chip.best{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

.prog{grid-row:3;grid-column:1;margin-top:26px;display:grid;grid-template-columns:repeat(26,1fr);gap:4px;height:24px;align-items:end;position:relative}
.prog i{height:14px;border-radius:2px;border:2px solid var(--rule)}
.prog i.done{background:var(--ink);border-color:var(--ink)}
.prog i.now{background:var(--vermilion);border-color:var(--vermilion);height:24px}
.ghost{position:absolute;left:0;bottom:calc(100% + 7px);width:0;height:0;display:none;will-change:translate}
.ghost.on{display:block}
.ghost::before{content:"";position:absolute;left:-10px;top:0;border:10px solid transparent;border-top:15px solid var(--blue);border-bottom:0}
.ghost.lab::after{content:"best";position:absolute;left:12px;bottom:2px;font-size:14px;letter-spacing:.04em;color:var(--blue)}

.stage{grid-row:4;grid-column:1;position:relative;min-height:0;container-type:size;display:grid;place-content:center;justify-items:center;padding-block:22px;row-gap:2cqh}
.crop{position:absolute;width:20px;height:20px;border:0 solid var(--ink);pointer-events:none}
.crop.tl{left:0;top:0;border-width:2px 0 0 2px}.crop.tr{right:0;top:0;border-width:2px 2px 0 0}
.crop.bl{left:0;bottom:0;border-width:0 0 2px 2px}.crop.br{right:0;bottom:0;border-width:0 2px 2px 0}

  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;overflow:hidden;visibility:hidden;transform:translateY(105%);transition:transform .22s cubic-bezier(.5,0,.8,.4),visibility 0s .22s}

<body>
<main class="app" id="app" data-state="ready">
  <header class="bar">
    <a class="mark" href="../" aria-label="gptgames.dev, all games">A<i>&ndash;</i>Z</a>
    <h1 class="sr">Alphabet Typing Speed</h1>
    <div class="modes" id="modes" role="group" aria-label="Board">
      <button type="button" data-mode="az" aria-pressed="true">Forward</button>
      <button type="button" data-mode="za" aria-pressed="false">Reverse</button>
      <button type="button" data-mode="daily" aria-pressed="false">Daily<i class="dot" id="dot"></i></button>
    </div>
    <div class="tools">
      <button type="button" id="sound" aria-pressed="true" aria-label="Sound">
        <svg viewBox="0 0 24 24" class="on"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        <svg viewBox="0 0 24 24" class="off"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
      </button>
      <button type="button" id="hist" aria-pressed="false" aria-label="History"><svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-11"/></svg></button>
      <button type="button" id="restart" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
    </div>
  </header>

  <section class="clock" aria-label="Clock">
    <div class="time" id="time" aria-hidden="true"></div>
    <div class="chip best" id="chip" aria-hidden="true"></div>
  </section>

  <div class="prog" id="prog" aria-hidden="true"><s class="ghost" id="ghost"></s></div>

  <section class="stage" id="stage">
    <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
    <div class="big" id="big" aria-hidden="true"></div>
    <div class="queue" id="queue" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="cap" id="cap"></div>
  </section>

  <div class="kbd" id="kbd" aria-hidden="true"><div class="rows" id="rows"></div></div>

  <section class="sheet" id="sheet" aria-label="Result" inert></section>
</main>
<div class="fly-layer" id="fly" aria-hidden="true"></div>
<p class="sr" id="live" aria-live="polite"></p>

<script id="core">
/* Core: the rules, the boards, the clock and the records. No DOM, no clock of its own. */
const AZ = (() => {
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const N = 26;
  const MODES = ['az', 'za', 'daily'];
  const LABEL = {az: 'A–Z', za: 'Z–A', daily: 'Daily'};
  const HINT_AFTER = 1.4;              // seconds without progress before the next key lights up
  const SAVE_KEY = 'gptgames.alphabet.v2';

  // The keyboard the page draws, in key units. Rows are staggered the way a real one is.
  const ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const STAGGER = [0, 0.25, 0.75];
  const POS = {};
  ROWS.forEach((row, r) => [...row].forEach((ch, c) => { POS[ch] = {x: c + STAGGER[r], y: r}; }));
  const dist = (a, b) => Math.hypot(POS[a].x - POS[b].x, POS[a].y - POS[b].y);
  const travel = seq => { let t = 0; for (let i = 1; i < seq.length; i++) t += dist(seq[i - 1], seq[i]); return t; };
  // What a shuffled alphabet costs the fingers on average: every ordered pair is equally likely to be a step.
  const MEAN_TRAVEL = (() => { let s = 0, n = 0; for (const a of LETTERS) for (const b of LETTERS) if (a !== b) { s += dist(a, b); n++; } return s / n * (N - 1); })();
  const BAND = 0.07;                   // a daily board's travel stays within this share of the mean

  // Seeded randomness: the same day is the same board on every device.
  const hash = str => { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 13; return h >>> 0; };
  const prng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const shuffled = rnd => { const a = [...LETTERS]; for (let i = N - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const neighbours = seq => { for (let i = 1; i < seq.length; i++) if (Math.abs(seq[i].charCodeAt(0) - seq[i - 1].charCodeAt(0)) === 1) return true; return false; };

  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dayNumber = key => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || ''); return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5) : NaN; };

  // A daily board is a shuffle that is fair: no step runs on to the next letter of the alphabet (that would be a free
  // one), and the total finger travel sits near the mean, so no day is a lucky one.
  function daily(key) {
    const rnd = prng(hash('gptgames/az/' + key));
    let best = null, bestGap = Infinity;
    for (let tries = 0; tries < 400; tries++) {
      const s = shuffled(rnd);
      if (neighbours(s)) continue;
      const gap = Math.abs(travel(s) / MEAN_TRAVEL - 1);
      if (gap <= BAND) return s;
      if (gap < bestGap) { best = s; bestGap = gap; }
    }
    return best || [...LETTERS];
  }
  function sequence(mode, key) {
    if (mode === 'za') return [...LETTERS].reverse();
    if (mode === 'daily') return daily(key);
    return [...LETTERS];
  }

  // A run. The clock starts on the first right key and stops on the last; wrong keys cost the time spent finding the right one.
  function newRun(seq) { return {seq, i: 0, t0: null, marks: [], slips: 0, done: false}; }
  function press(run, ch, ts) {
    if (run.done || typeof ch !== 'string' || !/^[A-Za-z]$/.test(ch)) return {kind: 'ignored'};
    ch = ch.toUpperCase();
    const want = run.seq[run.i];
    if (ch !== want) {
      if (run.i === 0) return {kind: 'early', want, got: ch};
      run.slips++;
      return {kind: 'slip', want, got: ch, slips: run.slips, time: ts - run.t0};
    }
    if (run.i === 0) run.t0 = ts;
    const index = run.i;
    run.marks[index] = ts;
    run.i++;
    const time = ts - run.t0, split = index === 0 ? 0 : ts - run.marks[index - 1];
    if (run.i === run.seq.length) { run.done = true; return {kind: 'done', index, split, time, next: null}; }
    return {kind: index === 0 ? 'start' : 'ok', index, split, time, next: run.seq[run.i]};
  }
  function result(run, mode, key) {
    if (!run.done) return null;
    const cum = run.marks.map(m => (m - run.t0) / 1000);   // seconds from here on
    const splits = cum.map((c, i) => i === 0 ? 0 : c - cum[i - 1]);
    return {mode, key: key || null, seq: run.seq.join(''), time: cum[N - 1], cum, splits, slips: run.slips};
  }
  const slowest = (res, n = 2) => res.splits.map((s, i) => ({i, letter: res.seq[i], split: s})).filter(x => x.i > 0)
    .sort((a, b) => b.split - a.split || a.i - b.i).slice(0, n);

  // Racing your best: where the ghost stands at time t (index of the last letter it has struck), and the gap at a letter.
  function ghostIndex(cum, t) { let k = 0; while (k + 1 < cum.length && cum[k + 1] <= t) k++; return k; }
  // The same, smoothly: a position along the bar, 0 at A and 25 at Z, moving between letters at the pace the best run did.
  function ghostPos(cum, t) {
    const k = ghostIndex(cum, t);
    if (k >= cum.length - 1) return cum.length - 1;
    return k + (t - cum[k]) / (cum[k + 1] - cum[k]);
  }
  const gapAt = (cum, index, time) => time - cum[index];

  // The ladder. Thresholds are for A–Z; the other boards are harder to read, so their ladders are longer.
  const TIERS = [
    {name: 'Printer’s Devil', max: Infinity},
    {name: 'Journeyman', max: 14},
    {name: 'Compositor', max: 9},
    {name: 'Foreman', max: 6},
    {name: 'Master Printer', max: 4.2},
  ];
  const SCALE = {az: 1, za: 1.6, daily: 1.9};
  function tier(mode, time) {
    const k = SCALE[mode] || 1;
    let at = 0;
    for (let i = 1; i < TIERS.length; i++) if (time < TIERS[i].max * k) at = i;
    const up = TIERS[at + 1];
    return {index: at, name: TIERS[at].name, next: up ? up.name : null, target: up ? up.max * k : 0, gap: up ? time - up.max * k : 0};
  }

  const fmt = t => { if (!(t >= 0)) return '0.00'; if (t < 100) return t.toFixed(2); const m = Math.floor(t / 60); return m + ':' + (t - m * 60).toFixed(1).padStart(4, '0'); };
  const BARS = '▁▂▃▄▅▆▇█';
  function strip(res) {
    const s = res.splits.slice(1), med = [...s].sort((a, b) => a - b)[s.length >> 1] || 1, top = med * 3;
    return s.map(v => BARS[Math.min(7, Math.round(Math.min(v, top) / top * 7))]).join('');
  }
  function share(res, url) {
    const t = tier(res.mode, res.time);
    const head = res.mode === 'daily' ? `A–Z Daily ${res.key}` : `A–Z ${LABEL[res.mode] === 'A–Z' ? '' : LABEL[res.mode]}`.trim();
    return `${head} ${res.time.toFixed(2)}s${res.slips ? ` (${res.slips} slip${res.slips > 1 ? 's' : ''})` : ' clean'}\n${strip(res)}\n${t.name} · ${url}`;
  }

  // Records. A save is never trusted: numbers are clamped, ghosts must be real runs.
  const num = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d);
  function cleanBest(b) {
    if (!b || typeof b !== 'object') return null;
    const time = num(b.time, 0, 3600, NaN);
    if (!(time >= 1)) return null;
    let cum = Array.isArray(b.cum) && b.cum.length === N && b.cum.every((v, i) => typeof v === 'number' && isFinite(v) && v >= 0 && (i === 0 ? v === 0 : v > b.cum[i - 1])) ? b.cum.slice() : null;
    if (cum && Math.abs(cum[N - 1] - time) > 0.01) cum = null;
    return {time, cum, slips: Math.round(num(b.slips, 0, 999, 0)), at: typeof b.at === 'string' ? b.at.slice(0, 10) : ''};
  }
  // History: every finished run's overall time, oldest first, per board. It is what shows you improving.
  const MAX_HIST = 120;
  function cleanHist(h) {
    if (!Array.isArray(h)) return [];
    const out = [];
    for (const e of h) {
      if (!e || typeof e !== 'object') continue;
      const t = num(e.t, 0, 3600, NaN);
      if (!(t >= 1)) continue;
      out.push({t, at: typeof e.at === 'string' && !Number.isNaN(dayNumber(e.at)) ? e.at : '', s: Math.round(num(e.s, 0, 999, 0))});
    }
    return out.slice(-MAX_HIST);
  }
  function blank() { return {v: 2, sound: true, mode: 'az', runs: 0, best: {az: null, za: null}, hist: {az: [], za: [], daily: []}, daily: {key: '', best: null, streak: 0, top: 0, last: ''}}; }
  function clean(raw) {
    const s = blank();
    if (!raw || typeof raw !== 'object') return s;
    s.sound = raw.sound !== false;
    s.mode = MODES.includes(raw.mode) ? raw.mode : 'az';
    s.runs = Math.round(num(raw.runs, 0, 1e7, 0));
    if (raw.best) { s.best.az = cleanBest(raw.best.az); s.best.za = cleanBest(raw.best.za); }
    if (raw.hist && typeof raw.hist === 'object') for (const m of MODES) s.hist[m] = cleanHist(raw.hist[m]);
    const d = raw.daily;
    if (d && typeof d === 'object') {
      s.daily.key = Number.isNaN(dayNumber(d.key)) ? '' : d.key;
      s.daily.best = s.daily.key ? cleanBest(d.best) : null;
      s.daily.last = Number.isNaN(dayNumber(d.last)) ? '' : d.last;
      s.daily.streak = s.daily.last ? Math.round(num(d.streak, 0, 3650, 0)) : 0;
      s.daily.top = Math.max(s.daily.streak, Math.round(num(d.top, 0, 3650, 0)));
    }
    return s;
  }
  // The first version of the page kept its bests in milliseconds under loose keys; carry the two boards that still exist
  // (Forward, and Reverse as Reverse). Its shuffled and weakest-letter boards have no counterpart. get(key) reads a string or null.
  function fromOld(get) {
    const s = blank(); let any = false;
    const take = (hs, ghost, m) => {
      const t = parseInt(get(hs), 10) / 1000;

    <text class="ax up" x="${L}" y="12">faster ↑</text>
    <path class="avg" d="${line}"/><path class="bestline" d="${stepped}"/>${dots}
    <circle class="last" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="${r + 3}"/>${label}</svg>`;
}
function trendLine(h) {
  const s = AZ.stats(h);
  if (s.change !== null) return `Last 10 average ${s.avg10.toFixed(2)} s · ${Math.abs(s.change).toFixed(2)} s ${s.change < 0 ? 'faster' : 'slower'} than the 10 before`;
  if (s.runs >= 2) return `Run ${s.runs} on this board · best ${s.best.toFixed(2)} s`;
  return 'Your first run. The line starts here.';
}
const LEGEND = '<div class="legend"><span class="k run">run</span><span class="k bst">best so far</span><span class="k avg">last 5</span></div>';

function showSheet(r, out, tr) {
  const slow = AZ.slowest(r, 1)[0], tag = out.before ? (out.isBest ? 'New best' : '') : 'First run';
  const sp = r.splits.slice(1), med = [...sp].sort((x, y) => x - y)[12], max = Math.min(Math.max(...sp), med * 3);
  const bars = sp.map((v, k) => `<b${k + 1 === slow.i ? ' class="slow"' : ''} data-i="${k + 1}" style="height:${Math.max(6, Math.min(1, v / max) * 100)}%"></b>`).join('');
  const streak = mode === 'daily' ? AZ.streakNow(save, today) : 0;
  const h = save.hist[mode];
  sheet.className = 'sheet results';
  sheet.innerHTML = `
    <div class="stampwrap">${tag ? `<div class="tag">${tag}</div>` : ''}<div class="stamp" id="stamp">${esc(tr.name)}</div></div>
    <div class="line">${tr.next ? `Next: ${esc(tr.next)}, under ${tr.target.toFixed(tr.target % 1 ? 1 : 0)} s` : 'Top of the ladder'} · ${r.slips ? r.slips + (r.slips > 1 ? ' slips' : ' slip') : 'clean run'}${mode === 'daily' ? ` · ${streak} day${streak === 1 ? '' : 's'} in a row` : ''}</div>
    <div class="hchart" id="hchart" data-n="40">${chartSvg(h, 40)}</div>
    ${LEGEND}<div class="line mute" id="trend">${trendLine(h)}</div>
    <div class="strip mini" id="strip" role="img" aria-label="Time between keys, slowest letter ${esc(slow.letter)}">${bars}</div>
    <div class="line mute small" id="read">Slowest key: ${esc(slow.letter)}, ${slow.split.toFixed(2)} s · tap a bar</div>
    <div class="btns"><button type="button" class="btn main" id="again">Again</button><button type="button" class="btn" id="share">Share</button></div>`;
  openSheet();
  const strip = $('#strip');
  requestAnimationFrame(() => {
    if (!reduce()) {
      [...strip.querySelectorAll('b')].forEach((b, k) => b.animate([{transform: 'scaleY(0)'}, {transform: 'none'}], {duration: 300, delay: 30 + k * 10, easing: EASE_OUT, fill: 'backwards'}));
      const st = $('#stamp'); if (st) st.animate([{transform: 'rotate(-9deg) scale(1.5)', opacity: 0}, {transform: 'rotate(-3deg) scale(1)', opacity: 1}], {duration: 170, delay: 60, easing: 'cubic-bezier(.3,.9,.3,1)', fill: 'backwards'});
      const ch = $('#hchart svg'); if (ch) ch.animate([{opacity: 0, transform: 'translateY(8px)'}, {opacity: 1, transform: 'none'}], {duration: 320, delay: 120, easing: EASE_OUT, fill: 'backwards'});
    }
  });
  strip.addEventListener('pointerdown', e => {
    const bs = [...strip.querySelectorAll('b')]; let hit = null, d = 1e9;
    for (const b of bs) { const r2 = b.getBoundingClientRect(), dx = Math.abs(e.clientX - (r2.left + r2.width / 2)); if (dx < d) { d = dx; hit = b; } }
    if (!hit) return;
    bs.forEach(b => b.classList.remove('pick')); if (!hit.classList.contains('slow')) hit.classList.add('pick');
    const i = +hit.dataset.i; $('#read').textContent = `${r.seq[i]}: ${r.splits[i].toFixed(2)} s after ${r.seq[i - 1]}`;
  });
  setTimeout(() => { const a = $('#again'); if (a && state === 'done') a.focus({preventScroll: true}); }, 450);
  $('#again').addEventListener('click', () => { if (performance.now() - doneAt > 500) ready(); });
  $('#share').addEventListener('click', e => shareRun(e.currentTarget));
}
function drawChart() {
  const box = $('#hchart'); if (!box || !box.dataset.n) return;
  const w = Math.floor(box.clientWidth), h = Math.floor(box.clientHeight);
  if (w > 80 && h > 60) box.innerHTML = chartSvg(save.hist[mode], +box.dataset.n, w, Math.min(h, 380));
}
function openSheet() { sheet.inert = false; sheet.classList.add('show'); app.classList.add('covered'); drawChart(); }

// ---------- the history ----------
function showHistory() {
  if (state !== 'ready') return;
  histOpen = true; clearTimeout(hintTimer);
  const h = save.hist[mode], s = AZ.stats(h), f = v => v === null ? '—' : v.toFixed(2);
  sheet.className = 'sheet history';
  sheet.innerHTML = `
    <div class="htitle"><span class="big2">History</span><span class="mute">${NAME[mode]}</span></div>
    <div class="stats"><div><b>${f(s.best)}</b><span>best</span></div><div><b>${f(s.avg10)}</b><span>last 10</span></div><div><b>${s.runs}</b><span>runs</span></div></div>
    <div class="hchart" id="hchart" data-n="100">${chartSvg(h, 100)}</div>
    ${h.length ? LEGEND : ''}<div class="line mute" id="trend">${h.length ? trendLine(h) : 'Finish a run on this board and it shows up here.'}</div>
    <div class="btns"><button type="button" class="btn main" id="back">Back to the game</button></div>`;
  openSheet(); histBtn.setAttribute('aria-pressed', 'true');
  $('#back').addEventListener('click', hideHistory);
  setTimeout(() => { const b = $('#back'); if (b && histOpen) b.focus({preventScroll: true}); }, 360);
}
function hideHistory() {
  if (!histOpen) return;
  histOpen = false; histBtn.setAttribute('aria-pressed', 'false');
  sheet.classList.remove('show'); sheet.inert = true; app.classList.remove('covered'); armHint();
}

async function shareRun(btn) {
  if (!res) return;
  const text = AZ.share(res, SITE);
  const said = msg => { const old = btn.textContent; btn.textContent = msg; setTimeout(() => { btn.textContent = old; }, 1600); };
  try {
    if (coarse && navigator.share) { await navigator.share({text}); return; }
    await navigator.clipboard.writeText(text); said('Copied');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); said('Copied'); } catch { said('Copy failed'); }
  }
}

// ---------- input ----------
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') { if (histOpen) { e.preventDefault(); hideHistory(); } else if (state !== 'ready') { e.preventDefault(); ready(); } return; }
  let ch = null;
  if (e.key && e.key.length === 1 && /[a-z]/i.test(e.key)) ch = e.key;
  else if (/^Key[A-Z]$/.test(e.code || '')) ch = e.code[3];
  if (ch) { e.preventDefault(); if (!e.repeat) strike(ch, e.timeStamp); return; }
  if (state === 'run' && (e.key === ' ' || e.key === 'Enter')) e.preventDefault();
  if (state === 'done' && (e.key === 'Enter' || e.key === ' ') && !(document.activeElement && document.activeElement.tagName === 'BUTTON') && performance.now() - doneAt > 500 && sheet.classList.contains('show')) { e.preventDefault(); ready(); }
});
// A tap anywhere near a key counts for the nearest key, so there are no dead gaps between them.
kbd.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  let k = e.target.closest && e.target.closest('.key'), c = k && k.dataset.k;
  if (!c && geo) { let d = 1e9; for (const g of geo.keys) { const dd = Math.hypot(e.clientX - g.x, e.clientY - g.y); if (dd < d) { d = dd; c = g.c; } } if (d > 48) c = null; }
  if (c) strike(c, e.timeStamp);
});
modesEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled || state === 'run') return; const was = histOpen; mode = b.dataset.mode; save.mode = mode; write(); ready(); if (was) showHistory(); });
histBtn.addEventListener('click', () => { if (histOpen) hideHistory(); else showHistory(); });
restartBtn.addEventListener('click', () => { if (histOpen) hideHistory(); else if (state !== 'ready') ready(); });
soundBtn.addEventListener('click', () => { save.sound = !save.sound; write(); soundBtn.setAttribute('aria-pressed', String(save.sound)); if (save.sound) Sound.resume(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') cancelRun('Run stopped — you left the page'); });

// ---------- go ----------
soundBtn.setAttribute('aria-pressed', String(save.sound));
const wanted = new URLSearchParams(location.search).get('mode');
mode = AZ.MODES.includes(wanted) ? wanted : save.mode;
ready(mode);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => measure());
window.__alphabet = {get state() { return state; }, get seq() { return seq; }};
})();

</script>
</body>
</html>
