<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<meta name="keywords" content="2048, 2048 game, 2048 online, sliding tile puzzle, daily 2048, puzzle game">
<meta name="description" content="Play 2048: slide the board, merge equal tiles and build a 2048 without filling up. Smooth sliding, swipe and keyboard controls, a saved game and best score, and a daily board that is the same for everyone.">
<title>2048</title>
<style>
:root {
    --bg: #faf8ef; --ink: #776e65; --ink-strong: #5b5249; --board: #bbada0; --cell: #cdc1b4;
    --panel: #bbada0; --panel-ink: #fff; --panel-label: #eee4da; --btn: #8f7a66; --btn-ink: #f9f6f2;
    --muted: #9b8f84; --veil: rgba(238, 228, 218, .86); --veil-ink: #776e65;
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1d1a17; --ink: #d8cdc2; --ink-strong: #f2e9df; --board: #4a4038; --cell: #5c5147;
        --panel: #3a322b; --panel-ink: #f7f1ea; --panel-label: #b9aa9b; --btn: #8f7a66; --btn-ink: #f9f6f2;
        --muted: #9a8c7f; --veil: rgba(29, 26, 23, .86); --veil-ink: #f2e9df;
        color-scheme: dark;
    }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.4 "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    min-height: 100svh; overscroll-behavior: none;
    display: flex; flex-direction: column; justify-content: center;
    -webkit-tap-highlight-color: transparent;
}
main {
    /* the board is the page: as large as the screen allows, and never taller than it */
    --size: max(248px, min(500px, calc(100vw - 32px), calc(100svh - 210px)));
    --gap: calc(var(--size) * .03);
    --tile: calc((var(--size) - 5 * var(--gap)) / 4);
    width: var(--size); margin: 0 auto; padding: 14px 0 20px;
}
header { display: flex; align-items: center; gap: 8px; }
h1 {
    margin: 0 auto 0 0; font-size: clamp(44px, calc(var(--size) * .15), 76px); line-height: 1;
    font-weight: 800; color: var(--ink-strong); letter-spacing: -.02em;
}
.box {
    position: relative; min-width: 72px; padding: 5px 12px 6px; border-radius: 6px; text-align: center;
    background: var(--panel); color: var(--panel-ink);
}
.box small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--panel-label); }
.box b { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.box.flash b { animation: flash .6s; }
@keyframes flash { 30% { color: #f9d664; } }
.gain {
    position: absolute; left: 0; right: 0; top: 18px; font-size: 20px; font-weight: 800; color: var(--ink-strong);
    pointer-events: none; animation: gain .7s ease-in forwards;
}
@keyframes gain { to { transform: translateY(-38px); opacity: 0; } }
.bar { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
.bar .what { margin-right: auto; font-size: 14px; line-height: 1.25; min-width: 0; }
.bar .what b { color: var(--ink-strong); }
.chip {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; padding: 0; cursor: pointer;
    text-decoration: underline dotted; text-underline-offset: 2px;
}
button.act {
    border: 0; border-radius: 6px; background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: 700;
    font-size: 15px; height: 40px; padding: 0 14px; cursor: pointer; white-space: nowrap; touch-action: manipulation;
}
button.act:hover { filter: brightness(1.08); }
button.act:focus-visible, .chip:focus-visible { outline: 3px solid #f59563; outline-offset: 2px; }
button.act { flex-shrink: 0; }
button.icon { width: 40px; padding: 0; font-size: 18px; }
button.act.sure { background: #f65e3b; }

#board {
    position: relative; width: var(--size); height: var(--size); border-radius: 8px; background: var(--board);
    touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; outline: none;
}
#board.nudge-l { animation: nudge-l .16s; } #board.nudge-r { animation: nudge-r .16s; }
#board.nudge-u { animation: nudge-u .16s; } #board.nudge-d { animation: nudge-d .16s; }
@keyframes nudge-l { 40% { transform: translateX(-5px); } } @keyframes nudge-r { 40% { transform: translateX(5px); } }
@keyframes nudge-u { 40% { transform: translateY(-5px); } } @keyframes nudge-d { 40% { transform: translateY(5px); } }
.cell, .tile {
    position: absolute; left: var(--gap); top: var(--gap); width: var(--tile); height: var(--tile);
    transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
}
.cell { border-radius: 6px; background: var(--cell); }
.tile { transition: transform var(--slide, 100ms) ease-in-out; z-index: 2; }
.tile.dying { z-index: 1; }
.tile i {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 6px;
    font-style: normal; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    font-size: calc(var(--tile) * var(--fs, .46)); background: var(--tc); color: var(--ti, #776e65);
    box-shadow: 0 0 calc(var(--tile) * var(--glow, 0)) calc(var(--tile) * var(--glow, 0) * .3) rgba(243, 215, 116, .55);
}
.tile.new i { animation: appear .18s var(--slide, 100ms) ease-out backwards; }
.tile.merged i { animation: pop .2s var(--slide, 100ms) ease-out backwards; }
.tile.merged { z-index: 3; }
@keyframes appear { from { transform: scale(0); opacity: 0; } }
@keyframes pop { 0% { transform: scale(0); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
#board.instant .tile { transition: none !important; }
#board.instant .tile i { animation: none !important; }

.veil {
    position: absolute; inset: 0; z-index: 10; border-radius: 8px; background: var(--veil); color: var(--veil-ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
    padding: 16px; opacity: 0; pointer-events: none; transition: opacity .5s; cursor: default;
}
.veil.show { opacity: 1; pointer-events: auto; }
.veil.won { background: rgba(228, 184, 40, .86); color: #fff; text-shadow: 0 1px 2px rgba(120, 90, 0, .35); }
.veil h2 { margin: 0; font-size: calc(var(--size) * .11); line-height: 1.1; font-weight: 800; }
.veil p { margin: 0; font-size: 15px; }
.veil .stats { display: flex; gap: 18px; margin: 8px 0 12px; }
.veil .stats div { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.veil .stats b { display: block; font-size: 22px; letter-spacing: 0; }
.veil .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.help { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.help b { color: var(--ink); }
.toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 50;
    background: #3c3a32; color: #f9f6f2; padding: 8px 14px; border-radius: 6px; font-size: 14px;
    transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 420px) {
    .box { min-width: 64px; padding: 4px 8px 5px; }
    .box b { font-size: 19px; }
    .bar .what { font-size: 13px; }
    button.act { padding: 0 11px; font-size: 14px; }
    button.icon { padding: 0; }
}
/* a phone on its side: the board takes the height, everything else stands beside it */
@media (min-aspect-ratio: 5/4) and (max-height: 620px) {
    main {
        --size: max(220px, min(500px, calc(100svh - 28px), calc(100vw - 300px)));
        width: auto; display: grid; grid-template-columns: 260px var(--size); grid-template-rows: auto auto 1fr;
        column-gap: 24px; justify-content: center; align-content: center; padding: 14px 16px;
    }
    header, .bar, .help { grid-column: 1; }
    #board { grid-column: 2; grid-row: 1 / span 3; }
    h1 { font-size: 40px; }
    .box { min-width: 0; padding: 4px 8px 5px; }
    .box b { font-size: 18px; }
    .bar { flex-wrap: wrap; }
    .bar .what { flex-basis: 100%; }
    .help { font-size: 13px; margin: 0; }
}
@media (prefers-reduced-motion: reduce) {
    main { --slide: 0ms; }
    .tile.merged i, .tile.new i, #board[class*=nudge] { animation: none; }
}
</style>
</head>
<body>
<main>
    <header>
        <h1>2048</h1>
        <div class="box" id="scoreBox"><small>Score</small><b id="score">0</b></div>
        <div class="box" id="bestBox"><small id="bestLabel">Best</small><b id="best">0</b></div>
    </header>
    <div class="bar">
        <div class="what"><span id="goal">Join the tiles, get to <b>2048!</b></span><br>
            <button class="chip" id="seedChip" title="Copy a link to this board"></button></div>
        <button class="act" id="dailyBtn" title="Today's board: the same tiles for everyone">Daily</button>
        <button class="act" id="newBtn">New game</button>
        <button class="act icon" id="soundBtn" aria-label="Sound on" title="Sound">🔊</button>
    </div>
    <div id="board" role="application" aria-label="2048 board. Use the arrow keys or swipe to slide the tiles." tabindex="0">
        <div class="veil" id="veil" aria-live="polite"></div>
    </div>
    <p class="help"><b>How to play:</b> swipe on the board or use the <b>arrow keys</b> (or WASD). Every tile slides
        as far as it can; two equal tiles that touch merge into one. A new tile drops in after every move.
        Make a <b>2048</b> before the board fills up.</p>
</main>
<div class="toast" id="toast"></div>

<script id="core">
// The rules of 2048, with no DOM, so test/2048.mjs can run them in Node.
// A board is 16 numbers, row by row, 0 for empty. Spawns come from a seeded generator whose
// state lives in the game, so a seed plus a list of moves always gives the same game.
const G2048 = (() => {
    const N = 4, WIN = 2048;
    const DIRS = ['left', 'right', 'up', 'down'];

    // The four lines of the board for each direction, each listed from the edge the tiles slide toward.
    const LINES = {};
    for (const d of DIRS) {
        LINES[d] = [];
        for (let a = 0; a < N; a++) {
            const line = [];
            for (let b = 0; b < N; b++) {
                const k = d === 'left' || d === 'up' ? b : N - 1 - b;
                line.push(d === 'left' || d === 'right' ? a * N + k : k * N + a);
            }
            LINES[d].push(line);
        }
    }

    function hashSeed(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
        h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
        return h >>> 0;
    }
    // mulberry32, stepped on a state the game carries with it
    function next(game) {
        let a = game.rng = (game.rng + 0x6D2B79F5) >>> 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    // Slide every line toward its edge. Each tile merges at most once per move, and the pair
    // nearest the edge merges first: 2 2 2 2 -> 4 4, 2 2 4 -> 4 4, 4 2 2 -> 4 4.
    // plan lists where every tile went; a target reached by two tiles is a merge.
    function slide(cells, dir) {
        const out = new Array(N * N).fill(0), plan = [], merges = [];
        let gained = 0, moved = false;
        for (const line of LINES[dir]) {
            let at = -1, open = false;              // last filled slot, and whether it may still merge
            for (const i of line) {
                const v = cells[i];
                if (!v) continue;
                if (open && out[line[at]] === v) {
                    out[line[at]] = v * 2; gained += v * 2; open = false;
                    plan.push({from: i, to: line[at]});
                    merges.push({at: line[at], value: v * 2});
                    moved = true;
                } else {
                    at++; open = true;
                    out[line[at]] = v;
                    plan.push({from: i, to: line[at]});
                    if (line[at] !== i) moved = true;
                }
            }
        }
        return {cells: out, plan, merges, gained, moved};
    }

    function canMove(cells) {
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
            const v = cells[r * N + c];
            if (!v) return true;
            if (c < N - 1 && cells[r * N + c + 1] === v) return true;
            if (r < N - 1 && cells[(r + 1) * N + c] === v) return true;
        }
        return false;
    }

    // One new tile on a random empty cell: a 2, or a 4 one time in ten.
    function spawn(game) {
        const empty = [];
        game.cells.forEach((v, i) => { if (!v) empty.push(i); });
        if (!empty.length) return null;
        const at = empty[Math.floor(next(game) * empty.length)];
        const value = next(game) < 0.9 ? 2 : 4;
        game.cells[at] = value;
        return {at, value};
    }

    function newGame(seed) {
        const game = {v: 1, seed: String(seed), rng: hashSeed(String(seed)), cells: new Array(N * N).fill(0),
            score: 0, moves: 0, won: false, keepGoing: false, over: false};
        spawn(game); spawn(game);
        return game;
    }

    // Apply a move to a copy of the game. Returns null when the move changes nothing
    // (the classic rule: no tile appears, nothing is counted).
    function move(game, dir) {
        if (game.over || !LINES[dir]) return null;
        const s = slide(game.cells, dir);
        if (!s.moved) return null;
        const g = Object.assign({}, game, {cells: s.cells, score: game.score + s.gained, moves: game.moves + 1});
        const spawned = spawn(g);
        const justWon = !g.won && s.merges.some(m => m.value >= WIN);
        if (justWon) g.won = true;
        g.over = !canMove(g.cells);
        return {game: g, plan: s.plan, merges: s.merges, gained: s.gained, spawned, justWon};
    }

    const maxTile = cells => Math.max(...cells);

    // A saved game is only trusted if it could be one: 16 powers of two, sane counters.
    function valid(g) {
        return !!g && g.v === 1 && Array.isArray(g.cells) && g.cells.length === N * N &&
            g.cells.every(v => v === 0 || (Number.isInteger(v) && v >= 2 && (v & (v - 1)) === 0)) &&
            Number.isFinite(g.score) && Number.isFinite(g.moves) && Number.isFinite(g.rng) && typeof g.seed === 'string';
    }

    return {N, WIN, DIRS, LINES, hashSeed, slide, canMove, spawn, newGame, move, maxTile, valid};
})();
</script>

<script>
(() => {
    const $ = id => document.getElementById(id);
    const board = $('board'), veil = $('veil');
    const {N} = G2048;
    const SLIDE = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 100;

    // ---------- storage ----------
    const KEY = 'g2048';
    const store = {
        get() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } },
        set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { } }
    };
    const saved = store.get();
    let best = +saved.best || 0;
    let bestTile = +saved.bestTile || 0;
    let daily = saved.daily && typeof saved.daily === 'object' ? saved.daily : {};
    let muted = !!saved.muted;

    const today = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const dailySeed = () => 'daily-' + today();
    const isDaily = g => /^daily-\d{4}-\d{2}-\d{2}$/.test(g.seed);
    const randomSeed = () => Math.random().toString(36).slice(2, 7);

    function persist() {
        // keep a week of daily bests, no more
        const keys = Object.keys(daily).sort().slice(-7);
        daily = Object.fromEntries(keys.map(k => [k, daily[k]]));
        store.set({game, best, bestTile, daily, muted});
    }

    // ---------- sound ----------
    let ac = null;
    function audio() {
        if (muted) return null;
        if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
        if (ac.state === 'suspended') ac.resume();
        return ac;
    }
    function tone(freq, when, dur, vol, type = 'triangle') {
        const a = audio(); if (!a) return;
        const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    function whoosh(vol) {
        const a = audio(); if (!a) return;
        const len = Math.floor(a.sampleRate * 0.07), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
        f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.8; g.gain.value = vol;
        s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start();
    }
    // merges climb a pentatonic scale with the tile's size, so a big merge sounds like one
    const SCALE = [0, 2, 4, 7, 9];
    const noteOf = v => {
        const k = Math.log2(v) - 2;
        return 261.63 * Math.pow(2, (Math.floor(k / 5) * 12 + SCALE[((k % 5) + 5) % 5]) / 12);
    };
    const sfx = {
        move(merges) {
            whoosh(0.05);
            const top = [...new Set(merges.map(m => m.value))].sort((a, b) => b - a).slice(0, 3);
            top.forEach((v, i) => tone(noteOf(v), SLIDE / 1000 + i * 0.035, 0.22, 0.09 + Math.min(0.08, Math.log2(v) * 0.006)));
        },
        bump() { tone(110, 0, 0.09, 0.06, 'sine'); },
        win() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.15 + i * 0.09, 0.5, 0.1)); },
        over() { [392, 329.63, 261.63, 196].forEach((f, i) => tone(f, 0.1 + i * 0.14, 0.45, 0.08, 'sine')); }
    };

    // ---------- tiles ----------
    const COLORS = {
        2: ['#eee4da'], 4: ['#ede0c8'], 8: ['#f2b179', '#f9f6f2'], 16: ['#f59563', '#f9f6f2'],
        32: ['#f67c5f', '#f9f6f2'], 64: ['#f65e3b', '#f9f6f2'], 128: ['#edcf72', '#f9f6f2', .06],
        256: ['#edcc61', '#f9f6f2', .1], 512: ['#edc850', '#f9f6f2', .14], 1024: ['#edc53f', '#f9f6f2', .18],
        2048: ['#edc22e', '#f9f6f2', .24]
    };
    const FONT = [0, .5, .46, .4, .31, .25, .21, .18];
    function paint(el, v) {
        const c = COLORS[v] || ['#3c3a32', '#f9f6f2', 0];
        el.style.setProperty('--tc', c[0]);
        el.style.setProperty('--ti', c[1] || '#776e65');
        el.style.setProperty('--glow', c[2] || 0);
        el.style.setProperty('--fs', FONT[String(v).length] || .16);
        el.firstChild.textContent = v;
    }
    function place(el, i) {
        el.style.setProperty('--r', Math.floor(i / N));
        el.style.setProperty('--c', i % N);
    }
    function makeTile(i, v, cls) {
        const el = document.createElement('div');
        el.className = 'tile' + (cls ? ' ' + cls : '');
        el.appendChild(document.createElement('i'));
        paint(el, v); place(el, i);
        board.insertBefore(el, veil);
        return el;
    }
    for (let i = 0; i < N * N; i++) {
        const c = document.createElement('div');
        c.className = 'cell'; place(c, i); board.insertBefore(c, veil);
    }

    let tiles = new Array(N * N).fill(null);   // tile element on each cell
    let dying = [], dyingTimer = 0;

    // Bring every animation to its end at once, so a fast player is never slowed by one.
    function settle() {
        clearTimeout(dyingTimer);
        dying.forEach(el => el.remove()); dying = [];
        board.classList.add('instant');
        for (const el of tiles) if (el) el.classList.remove('new', 'merged');
        void board.offsetWidth;
        board.classList.remove('instant');
    }

    function drawAll() {
        settle();
        board.querySelectorAll('.tile').forEach(el => el.remove());
        tiles = game.cells.map((v, i) => v ? makeTile(i, v, 'new') : null);
    }

    function animate(r) {
        settle();
        const next = new Array(N * N).fill(null);
        const mergedAt = new Set(r.merges.map(m => m.at));
        for (const p of r.plan) {
            const el = tiles[p.from];
            place(el, p.to);
            if (mergedAt.has(p.to)) { el.classList.add('dying'); dying.push(el); } else next[p.to] = el;
        }
        for (const m of r.merges) next[m.at] = makeTile(m.at, m.value, 'merged');
        if (r.spawned) next[r.spawned.at] = makeTile(r.spawned.at, r.spawned.value, 'new');
        tiles = next;
        dyingTimer = setTimeout(() => { dying.forEach(el => el.remove()); dying = []; }, SLIDE + 20);
    }

    // ---------- game ----------
    let game = null;
    let overlay = null;          // 'won' | 'over' | null
    let overlayTimer = 0;

    function startGame(seed) {
        game = G2048.newGame(seed);
        hideVeil();
        drawAll(); hud(); persist();
        setUrl();
    }

    function setUrl() {
        try {
            const u = new URL(location.href);
            if (isDaily(game)) { u.searchParams.delete('seed'); u.searchParams.set('daily', ''); }
            else { u.searchParams.delete('daily'); u.searchParams.set('seed', game.seed); }
            history.replaceState(null, '', u.pathname + u.search.replace('daily=', 'daily') + u.hash);
        } catch (e) { }
    }

    function hud() {
        $('score').textContent = game.score;
        const dKey = isDaily(game) ? game.seed.slice(6) : null;
        if (dKey) {
            $('bestLabel').textContent = 'Today';
            $('best').textContent = Math.max(daily[dKey] || 0, game.score);
        } else {
            $('bestLabel').textContent = 'Best';
            $('best').textContent = Math.max(best, game.score);
        }
        const top = G2048.maxTile(game.cells);
        $('goal').innerHTML = game.won || top >= G2048.WIN
            ? `Past 2048: now <b>${top}</b>. How far?`
            : top >= 512 ? `Up to <b>${top}</b>. On to <b>2048!</b>`
            : 'Join the tiles, get to <b>2048!</b>';
        if (isDaily(game)) {
            const d = new Date(game.seed.slice(6) + 'T12:00:00');
            $('seedChip').textContent = 'Daily board · ' + d.toLocaleDateString(undefined, {day: 'numeric', month: 'short'});
        } else $('seedChip').textContent = 'Board ' + game.seed;
    }

    function record() {
        const newBest = game.score > best;
        best = Math.max(best, game.score);
        bestTile = Math.max(bestTile, G2048.maxTile(game.cells));
        if (isDaily(game)) {
            const k = game.seed.slice(6);
            daily[k] = Math.max(daily[k] || 0, game.score);
        }
        return newBest;
    }

    function tryMove(dir) {
        if (overlay) return;
        const r = G2048.move(game, dir);
        if (!r) {
            if (game.over) return;
            settle();
            board.className = ''; void board.offsetWidth; board.classList.add('nudge-' + dir[0]);
            sfx.bump();
            return;
        }
        game = r.game;
        animate(r);
        sfx.move(r.merges);
        if (r.gained) {
            $('scoreBox').querySelectorAll('.gain').forEach(x => x.remove());
            const g = document.createElement('div');
            g.className = 'gain'; g.textContent = '+' + r.gained;
            $('scoreBox').appendChild(g);
            setTimeout(() => g.remove(), 700);
            if (navigator.vibrate && r.merges.some(m => m.value >= 128)) navigator.vibrate(8);
        }
        const wasBest = best;
        record();
        if (game.score > wasBest && wasBest > 0 && !isDaily(game)) { const b = $('bestBox'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }
        hud(); persist();
        if (r.justWon && !game.keepGoing) showVeil('won', 350);
        else if (game.over) showVeil('over', 700);
    }

    function hideVeil() {
        clearTimeout(overlayTimer);
        overlay = null;
        veil.className = 'veil';
        veil.innerHTML = '';
    }

    function showVeil(kind, delay) {
        overlay = kind;
        clearTimeout(overlayTimer);
        overlayTimer = setTimeout(() => {
            const top = G2048.maxTile(game.cells);
            const dKey = isDaily(game) ? game.seed.slice(6) : null;
            if (kind === 'won') {
                sfx.win();
                veil.innerHTML = `<h2>2048!</h2><p>${game.moves} moves, ${game.score} points.</p>
                    <div class="row" style="margin-top:12px"><button class="act" data-do="keep">Keep going</button>
                    <button class="act" data-do="new">New game</button></div>`;
                veil.className = 'veil won show';
            } else {
                sfx.over();
                const bestLine = dKey
                    ? (game.score >= (daily[dKey] || 0) ? 'Your best on today\'s board.' : `Today's best: ${daily[dKey]}.`)
                    : (game.score >= best && game.score > 0 ? 'A new best score!' : `Best: ${best}.`);
                veil.innerHTML = `<h2>No moves left</h2>
                    <div class="stats"><div>Score<b>${game.score}</b></div><div>Top tile<b>${top}</b></div><div>Moves<b>${game.moves}</b></div></div>
                    <p>${bestLine}</p>
                    <div class="row" style="margin-top:12px"><button class="act" data-do="${dKey ? 'daily' : 'new'}">Try again</button>
                    ${dKey ? '<button class="act" data-do="new">New board</button>' : '<button class="act" data-do="same">Same board</button>'}</div>`;
                veil.className = 'veil show';
            }
            const b = veil.querySelector('button'); if (b) b.focus({preventScroll: true});
        }, delay);
    }

    veil.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        audio();
        const what = b.dataset.do;
        if (what === 'keep') {
            game.keepGoing = true; persist(); hideVeil(); board.focus({preventScroll: true});
            if (game.over) showVeil('over', 0);
        }
        else if (what === 'new') startGame(randomSeed());
        else if (what === 'daily') startGame(dailySeed());
        else if (what === 'same') startGame(game.seed);
    });
    veil.addEventListener('pointerdown', e => e.stopPropagation());

    // Starting over throws a game away, so it asks once if the game has got going.
    function confirmThen(btn, fn) {
        if (game.over || game.moves < 20 || btn.classList.contains('sure')) {
            document.querySelectorAll('.sure').forEach(b => { b.classList.remove('sure'); b.textContent = b.dataset.label; });
            fn(); return;
        }
        btn.dataset.label = btn.textContent;
        btn.classList.add('sure'); btn.textContent = 'Sure?';
        setTimeout(() => { btn.classList.remove('sure'); btn.textContent = btn.dataset.label; }, 2500);
    }
    $('newBtn').onclick = e => { audio(); confirmThen(e.currentTarget, () => startGame(randomSeed())); };
    $('dailyBtn').onclick = e => {
        audio();
        if (isDaily(game) && game.seed === dailySeed() && !game.over) { toast('This is today\'s board'); return; }
        confirmThen(e.currentTarget, () => startGame(dailySeed()));
    };
    function soundLabel() {
        $('soundBtn').textContent = muted ? '🔇' : '🔊';
        $('soundBtn').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
    }
    $('soundBtn').onclick = () => { muted = !muted; soundLabel(); persist(); if (!muted) tone(523.25, 0, 0.15, 0.08); };
    $('seedChip').onclick = () => {
        const u = new URL(location.href);
        u.search = isDaily(game) ? '?daily' : '?seed=' + encodeURIComponent(game.seed);
        const text = u.toString().replace('daily=', 'daily');
        const done = () => toast(isDaily(game) ? 'Link to today\'s board copied' : 'Link to this board copied');
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => toast(text));
        else toast(text);
    };
    let toastTimer = 0;
    function toast(msg) {
        const t = $('toast'); t.textContent = msg; t.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ---------- input ----------
    const KEYS = {
        ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
        a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down'
    };
    document.addEventListener('keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const dir = KEYS[e.key];
        if (!dir) return;
        if (e.target.closest && e.target.closest('button') && !e.key.startsWith('Arrow')) return;
        e.preventDefault();
        audio();
        tryMove(dir);
    });

    // A swipe counts as soon as it is long enough, not when the finger lifts: one swipe, one move.
    let swipe = null;
    board.addEventListener('pointerdown', e => {
        if (e.button > 0) return;
        swipe = {id: e.pointerId, x: e.clientX, y: e.clientY, done: false};
        try { board.setPointerCapture(e.pointerId); } catch (err) { }
        audio();
    });
    board.addEventListener('pointermove', e => {
        if (!swipe || swipe.id !== e.pointerId || swipe.done) return;
        const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
        const need = Math.max(16, board.clientWidth * 0.05);
        if (Math.max(Math.abs(dx), Math.abs(dy)) < need) return;
        swipe.done = true;
        tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });
    const endSwipe = e => { if (swipe && swipe.id === e.pointerId) swipe = null; };
    board.addEventListener('pointerup', endSwipe);
    board.addEventListener('pointercancel', endSwipe);
    board.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

    // ---------- start ----------
    soundLabel();
    const q = new URLSearchParams(location.search);
    const want = q.has('daily') ? dailySeed() : (q.get('seed') || '').slice(0, 24) || null;
    const savedGame = G2048.valid(saved.game) ? saved.game : null;
    if (savedGame && (!want || want === savedGame.seed)) {
        game = savedGame;
        drawAll(); hud(); setUrl();
        if (game.over) showVeil('over', 300);
        else if (game.won && !game.keepGoing) showVeil('won', 300);
    } else startGame(want || randomSeed());
    board.focus({preventScroll: true});

    window.__g2048 = {get game() { return game; }, tryMove, startGame};
})();
</script>
<script src="../logo.js"></script>
</body>
</html>
