<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Fathom — Deep-Sea Typing Dive</title>
<meta name="description" content="Type to dive. Lower an iron bathysphere into the abyss and type the word each glowing creature carries before it reaches the hull. Every word you finish sinks you deeper, from the twilight zone to the hadal trench.">
<meta name="theme-color" content="#03121b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--sand:#efe4cc;--lamp:#7cf3e0;--coral:#ff7a6b;--ink:#020a10}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--sand);overflow:hidden;
  font-family:'IBM Plex Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;width:100%;height:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#kb{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
.hud{text-shadow:0 1px 8px rgba(0,0,0,.7);position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));pointer-events:none}
.depth{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:clamp(28px,5vw,40px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.depth.tick{animation:dt .5s cubic-bezier(.3,1.5,.5,1)}@keyframes dt{30%{transform:scale(1.08);color:#fff}}.depth{transform-origin:left center}
.depth small{font-size:.42em;opacity:.6;margin-left:4px;letter-spacing:0}
.zone{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--lamp);opacity:.8;margin-top:7px}
.chain{margin-top:10px;font-size:15px;font-weight:600;color:var(--lamp);opacity:0;transition:opacity .3s;font-variant-numeric:tabular-nums}
.chain.on{opacity:1}.chain.pulse{animation:cp .35s cubic-bezier(.3,1.6,.5,1)}.chain.lost{color:var(--coral);opacity:1}
@keyframes cp{40%{transform:scale(1.18)}}.chain{transform-origin:left center}
.right{display:flex;gap:14px;align-items:center}
.hull{display:flex;gap:7px}
.hull svg{width:20px;height:20px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.hull .lost{transform:scale(.86)}
button{font:inherit;color:inherit}
#mute{pointer-events:auto;background:none;border:0;padding:6px;margin:-6px;opacity:.65;cursor:pointer}
#mute:hover,#mute:focus-visible{opacity:1}
#mute svg{width:20px;height:20px;display:block}
.hud.idle .stat{opacity:0}
.stat{transition:opacity .5s}
/* title + card */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:opacity .6s ease}
.layer.off{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
.title{padding-top:13vh;text-align:center}
.title h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:300;font-size:clamp(54px,12vw,112px);letter-spacing:-.03em;line-height:.9}
.title p{margin:14px 0 0;font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(15px,2.4vw,19px);opacity:.7}
.title .rec{margin-top:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--lamp);opacity:.75;min-height:1em}
.hint{position:absolute;left:0;right:0;text-align:center;font-size:14px;color:#fff3dc;letter-spacing:.18em;text-transform:uppercase;opacity:.8;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.card{margin:auto;width:min(420px,calc(100% - 32px));padding:28px 26px 22px;border-radius:22px;
  background:rgba(4,18,26,.86);border:1px solid rgba(239,228,204,.14);box-shadow:0 30px 80px rgba(0,0,0,.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto;text-align:center;
  transform:translateY(0);transition:transform .6s cubic-bezier(.2,.9,.25,1)}
.layer.off .card{transform:translateY(24px)}
.card .lbl{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--lamp);opacity:.8}
.card .big{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:64px;line-height:1;margin:10px 0 4px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.card .big small{font-size:24px;opacity:.6;margin-left:4px}
.card .sub{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:300;font-size:17px;opacity:.75;min-height:1.3em}
.card .sub.rec{color:#ffd18a;opacity:1}
.nums{display:flex;justify-content:center;gap:28px;margin:20px 0 6px}
.nums div{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.nums span{display:block;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-top:3px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:18px 0 2px;padding-top:14px;border-top:1px solid rgba(239,228,204,.12)}
.specs figure{margin:0;display:flex;flex-direction:column;align-items:center;font-size:10px;line-height:1.25;opacity:.9}
.specs canvas{width:52px;height:52px}
.specs figure.unseen{opacity:.28}
.specs figure.unseen canvas{filter:brightness(0) invert(.6)}
.specs figure.new figcaption b{color:#ffd18a}
.specs figcaption b{display:block;font-weight:600;font-size:11px;color:var(--lamp)}
.loghead{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.5;margin-top:14px}
.again{margin-top:18px;width:100%;padding:15px;border-radius:14px;border:1px solid var(--lamp);background:rgba(124,243,224,.1);
  color:var(--lamp);font-size:15px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s,transform .12s}
.again:hover,.again:focus-visible{background:rgba(124,243,224,.2);outline:none}
.again:active{transform:scale(.98)}
.again kbd{font:inherit;opacity:.6;text-transform:none;letter-spacing:0}
#over{overflow-y:auto;padding:12px 0}
.pause{justify-content:center;background:rgba(2,10,16,.55)}
.pause .t{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:44px}
.pause .s{margin-top:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
@media (min-width:900px) and (min-height:640px){.card{width:560px;padding:38px 38px 30px}.specs canvas{width:64px;height:64px}.specs figure{font-size:12px}.specs figcaption b{font-size:13px}.loghead{font-size:11px}.card .lbl{font-size:12px}.nums span{font-size:11px}.card .big{font-size:84px}.card .sub{font-size:20px}.nums div{font-size:28px}.specs i{font-size:12.5px}.again{font-size:16px}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.layer,.card{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <form id="kbf" autocomplete="off" onsubmit="return false"><input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" aria-label="Type here"></form>
  <div class="hud idle" id="hud">
    <div class="stat"><div class="depth" id="depth">200<small>m</small></div><div class="zone" id="zone">Twilight zone</div><div class="chain" id="chain"></div></div>
    <div class="right"><div class="hull stat" id="hull" aria-label="Hull"></div>
      <button id="mute" aria-label="Sound on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="mw" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></div>
  </div>
  <div class="layer" id="title">
    <div class="title"><h1>Fathom</h1><p>How deep can you type?</p><div class="rec" id="trec"></div></div>
    <div class="hint" id="thint"></div>
  </div>
  <div class="layer off" id="over">
    <div class="card" role="dialog" aria-labelledby="olbl">
      <div class="lbl" id="olbl">Hull breached</div>
      <div class="big" id="odepth">0<small>m</small></div>
      <div class="sub" id="osub"></div>
      <div class="nums"><div id="owpm">0<span>wpm</span></div><div id="oacc">0%<span>accuracy</span></div><div id="ospec">0<span>specimens</span></div></div>
      <div class="loghead" id="ohead">Specimen log</div>
      <div class="specs" id="olist"></div>
      <button class="again" id="again">Dive again <kbd>· Enter</kbd></button>
    </div>
  </div>
  <div class="layer off pause" id="pause"><div class="t">Holding depth</div><div class="s" id="pres">press any key</div></div>
</div>

<script id="core">
// Fathom core: DOM-free. Rules, spawning, typing and scoring live here; the page only draws and plays sound.
(function (root) {
  'use strict';
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const WORDS = ('abyss anchor angler aqua arch ballast barnacle beacon benthic bloom brine bubble buoy cable canyon current chasm ' +
    'chitin cobalt cold coral crab crevice crush dark deep depth diver drift echo eddy eel fathom fin flicker float foam gill glimmer ' +
    'glow gulper hadal haze hull ink isopod jelly jet keel kelp krill lamp lantern larva lure mantle marine murk nautilus nekton ocean ' +
    'octopus oxygen pearl pelagic plankton pressure prism pulse radiant ray reef ridge rivet salt salp sonar sound spine squid siphon ' +
    'silt shell shoal shrimp sink slope snow sponge spiral swell swim tide tendril trench tube twilight umbra urchin vent void wake water ' +
    'whale whisker wreck abyssal bathyal sediment sounding submerge descend specimen porthole catalogue expedition tentacle phosphor ' +
    'luminous shimmer gelatinous dragonfish viperfish hatchetfish snailfish siphonophore copepod amphipod cephalopod chimaera seamount ' +
    'thermocline upwelling undertow quiet hush still faint gleam spark ember flare beam lens glass iron bolt hatch dial gauge valve winch ' +
    'tether logbook sample record sketch notes quill journal vast unseen yaw yield zone quartz quiver venom vortex velvet jaw jellyfish ' +
    'kraken knot ripple oar oyster orbit opal hook hollow harbor gloom grotto fang fluke frond eerie estuary empty dusk drown delve ' +
    'cavern cusp clam blind black basalt barb azure ash ascend tow tusk torch trawl lull lobe lagoon marrow mist moon nadir nest night ' +
    'nimble ooze petrel plume polyp quay rift rudder rust scale scuttle seabed seal shadow sigh skate sleek slick sonde stingray ' +
    'urge velella wander warden weed whorl wisp yonder zenith zooplankton abalone ballad bell blue breath calm chill crown dive dream ' +
    'flow flux fume gust halo heron idle inlet isle jade kin lace linger lumen mote muse opaque orca pale pike pod quell rapture relic ' +
    'remora roam rook sable shelf siren slack slumber solace spume stern strand surge tangle thrum tremor tundra vapor vessel voyage submersible bathysphere photophore crustacean nudibranch barreleye ctenophore ' +
    'foraminifera mesopelagic bathypelagic lanternfish radiolarian hydrothermal oceanography invertebrate luminescence cartography ' +
    'echolocation pressurized diatomaceous').split(' ');
  // Kinds of specimen. len: word length range; spd: field-heights per second at depth 0; zone: depth it first appears at.
  const KINDS = [
    { id: 'lantern', name: 'Lanternfish', len: [3, 4], spd: 0.105, from: 0, w: 5 },
    { id: 'hatchet', name: 'Hatchetfish', len: [4, 5], spd: 0.085, from: 0, w: 4 },
    { id: 'jelly', name: 'Crown jelly', len: [5, 7], spd: 0.055, from: 0, w: 4 },
    { id: 'angler', name: 'Anglerfish', len: [5, 7], spd: 0.072, from: 900, w: 4 },
    { id: 'gulper', name: 'Gulper eel', len: [7, 9], spd: 0.05, from: 1600, w: 3 },
    { id: 'squid', name: 'Vampire squid', len: [6, 8], spd: 0.06, from: 2600, w: 3 },
    { id: 'siphon', name: 'Siphonophore', len: [9, 12], spd: 0.034, from: 3800, w: 2 },
    { id: 'snail', name: 'Hadal snailfish', len: [6, 8], spd: 0.095, from: 6000, w: 3 }
  ];
  const ZONES = [
    { name: 'Twilight zone', at: 200 }, { name: 'Midnight zone', at: 1000 },
    { name: 'Abyssal zone', at: 4000 }, { name: 'Hadal zone', at: 6000 }
  ];
  const START = 200, HULL = 3, FLARES = 1, FLARE_EVERY = 1500;
  function zoneAt(d) { let z = 0; for (let i = 0; i < ZONES.length; i++) if (d >= ZONES[i].at) z = i; return z; }
  // Difficulty is a function of depth alone, so a run's pressure follows how far the player has come.
  function tempo(d) {
    const k = Math.min(1, Math.max(0, (d - START) / 9000));
    return {
      gap: 2.2 - 1.3 * Math.pow(k, 0.8),     // seconds between spawns
      cap: Math.round(3 + 6 * k),              // creatures alive at once
      spd: 0.82 + 0.9 * k                      // speed multiplier
    };
  }
  function chainMul(c) { return 1 + Math.min(c, 20) * 0.05; }  // up to x2 after a 20-word chain
  function metresFor(word, chain) { return Math.round(word.length * 6 * chainMul(chain)); }

  function newRun(seed, w, h, opts) {
    opts = opts || {};
    const s = {
      seed: seed >>> 0, r: rng(seed), w: w, h: h, t: 0, depth: START, hull: HULL, flares: FLARES,
      nextFlareAt: START + FLARE_EVERY, chain: 0, bestChain: 0, nextId: 1, foes: [], target: 0,
      spawnIn: 0.3, keys: 0, hits: 0, misses: 0, words: 0, chars: 0, over: false, caught: {},
      speedMul: opts.speedMul || 1, ev: []
    };
    return s;
  }
  function bell(s) { return { x: s.w / 2, y: s.h - Math.max(58, Math.min(110, s.h * 0.13)) }; }
  function bellR(s) { return Math.max(26, Math.min(44, Math.min(s.w, s.h) * 0.06)); }
  function resize(s, w, h) {
    const fx = w / s.w, fy = h / s.h;
    for (const f of s.foes) { f.x *= fx; f.y *= fy; f.ox *= fx; }
    s.w = w; s.h = h;
  }
  function maxLen(s) { return s.w < 420 ? 10 : s.w < 640 ? 11 : 12; }
  function pickKind(s) {
    const opts = KINDS.filter(k => s.depth >= k.from);
    let tot = 0; for (const k of opts) tot += k.w;
    let x = s.r() * tot;
    for (const k of opts) { x -= k.w; if (x < 0) return k; }
    return opts[opts.length - 1];
  }
  function pickWord(s, lo, hi, used) {
    hi = Math.min(hi, maxLen(s)); lo = Math.min(lo, hi);
    for (let widen = 0; widen < 6; widen++) {
      const a = lo - widen, b = hi + widen;
      const pool = WORDS.filter(wd => wd.length >= a && wd.length <= Math.min(b, maxLen(s)) && !used.has(wd[0]));
      if (pool.length) return pool[Math.floor(s.r() * pool.length)];
    }
    return null;
  }
  function spawn(s, kind, x, y, word) {
    const used = new Set(s.foes.map(f => f.word[0]));
    kind = kind || pickKind(s);
    word = word || pickWord(s, kind.len[0], kind.len[1], used);
    if (!word || used.has(word[0])) return null;
    if (x == null) {
      // spread spawns: best of a few candidates by distance to the nearest living creature's start column
      let best = 0, bx = s.w / 2;
      const m = Math.min(90, s.w * 0.14);
      for (let i = 0; i < 6; i++) {
        const cx = m + s.r() * (s.w - 2 * m);
        let dmin = 1e9; for (const f of s.foes) dmin = Math.min(dmin, Math.abs(f.x - cx) + Math.max(0, f.y) * 0.3);
        if (dmin > best) { best = dmin; bx = cx; }
      }
      x = bx; y = -30;
    }
    const f = { id: s.nextId++, kind: kind.id, word: word, typed: 0, x: x, y: y, ox: x, age: 0,
      phase: s.r() * 6.283, spd: kind.spd * (0.9 + s.r() * 0.2) };
    s.foes.push(f);
    s.ev.push({ type: 'spawn', id: f.id });
    return f;
  }
  function find(s, id) { for (const f of s.foes) if (f.id === id) return f; return null; }
  function kill(s, f) {
    s.foes.splice(s.foes.indexOf(f), 1);
    if (s.target === f.id) s.target = 0;
  }
  function key(s, ch) {
    if (s.over) return [];
    ch = String(ch).toLowerCase();
    if (!/^[a-z]$/.test(ch)) return [];
    s.keys++;
    let f = find(s, s.target);
    if (!f) {
      f = s.foes.find(o => o.word[0] === ch && o.y > -20);
      if (!f) { miss(s, ch, 0); return flush(s); }
      s.target = f.id;
      s.ev.push({ type: 'lock', id: f.id });
    }
    if (f.word[f.typed] !== ch) { miss(s, ch, f.id); return flush(s); }
    f.typed++; s.hits++; s.chars++;
    s.ev.push({ type: 'hit', id: f.id, i: f.typed - 1, n: f.word.length, x: f.x, y: f.y });
    if (f.typed === f.word.length) {
      const m = metresFor(f.word, s.chain);
      s.chain++; s.bestChain = Math.max(s.bestChain, s.chain); s.words++;
      s.depth += m;
      s.caught[f.kind] = (s.caught[f.kind] || 0) + 1;
      kill(s, f);
      s.ev.push({ type: 'catch', id: f.id, kind: f.kind, word: f.word, x: f.x, y: f.y, metres: m, chain: s.chain });
      if (f.kind === 'squid') {
        // a vampire squid sheds two lanternfish on its way out
        for (const dx of [-1, 1]) {
          const nf = spawn(s, KINDS[0], f.x + dx * 40, f.y);
          if (nf) nf.ox = f.x + dx * 60;
        }
      }
      while (s.depth >= s.nextFlareAt) { s.nextFlareAt += FLARE_EVERY; if (s.flares < 3) { s.flares++; s.ev.push({ type: 'flareup', n: s.flares }); } }
      const z0 = zoneAt(s.depth - m), z1 = zoneAt(s.depth);
      if (z1 !== z0) s.ev.push({ type: 'zone', zone: z1 });
    }
    return flush(s);
  }
  function miss(s, ch, id) {
    s.misses++;
    const had = s.chain; s.chain = 0;
    s.ev.push({ type: 'miss', ch: ch, id: id, lost: had });
  }
  // Backspace abandons the current word without penalty: its letters clear and any word can be picked.
  function back(s) { if (s.target) { const f = find(s, s.target); s.target = 0; if (f) { f.typed = 0; s.ev.push({ type: 'release', id: f.id }); } } return flush(s); }
  function flare(s) {
    if (s.over || s.flares <= 0 || !s.foes.length) return flush(s);
    s.flares--;
    const gone = s.foes.slice();
    s.foes = []; s.target = 0;
    s.ev.push({ type: 'flare', foes: gone.map(f => ({ id: f.id, kind: f.kind, x: f.x, y: f.y, word: f.word })) });
    s.spawnIn = 1.6;
    return flush(s);
  }
  function step(s, dt) {
    if (s.over) return flush(s);
    dt = Math.min(dt, 0.1);
    s.t += dt;
    const tp = tempo(s.depth), b = bell(s), br = bellR(s);
    s.spawnIn -= dt;
    if (s.spawnIn <= 0) {
      if (s.foes.length < tp.cap) spawn(s);
      s.spawnIn += tp.gap * (0.85 + s.r() * 0.3);
    }
    for (let i = s.foes.length - 1; i >= 0; i--) {
      const f = s.foes[i];
      f.age += dt;
      const v = f.spd * tp.spd * s.speedMul * s.h;
      // creatures sink toward the bell's column while descending; each kind sways its own way
      let dx = b.x - f.ox, dy = b.y - f.y;
      const d = Math.hypot(dx, dy) || 1;
      f.ox += dx / d * v * dt; f.y += dy / d * v * dt;
      const sway = f.kind === 'gulper' || f.kind === 'snail' ? 26 : f.kind === 'jelly' || f.kind === 'siphon' ? 14 : 8;
      const fall = Math.min(1, Math.max(0, (b.y - f.y) / (s.h * 0.5)));
      f.x = f.ox + Math.sin(f.age * (f.kind === 'jelly' ? 1.1 : 1.7) + f.phase) * sway * fall;
      if (Math.hypot(b.x - f.x, b.y - f.y) < br + 10) {
        kill(s, f);
        s.hull--; const had = s.chain; s.chain = 0;
        s.ev.push({ type: 'breach', id: f.id, kind: f.kind, x: f.x, y: f.y, hull: s.hull, lost: had });
        if (s.hull <= 0) { s.over = true; s.ev.push({ type: 'over' }); break; }
      }
    }
    return flush(s);
  }
  function flush(s) { const e = s.ev; s.ev = []; return e; }
  function stats(s) {
    const mins = Math.max(s.t, 1) / 60;
    return { depth: s.depth, wpm: Math.round(s.chars / 5 / mins), acc: s.keys ? Math.round(100 * s.hits / s.keys) : 100,
      words: s.words, chain: s.bestChain, caught: Object.assign({}, s.caught), time: s.t };
  }
  root.FathomCore = { rng, WORDS, KINDS, ZONES, START, HULL, zoneAt, tempo, chainMul, metresFor, newRun, resize, bell, bellR,
    spawn, key, back, flare, step, stats, find };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
(function () {
'use strict';
const C = window.FathomCore;
const cv = document.getElementById('cv');
let x = cv.getContext('2d');
const kb = document.getElementById('kb'), stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
