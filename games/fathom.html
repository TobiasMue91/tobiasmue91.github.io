<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Fathom — A Catalogue of Abyssal Specimens</title>
<meta name="description" content="A deep-sea typing dive on an engraved naturalist's chart. Write the name each specimen carries before it reaches your bathysphere. Every name you strike sinks you deeper, from the twilight zone to the hadal trench, and fills your catalogue of abyssal specimens.">
<meta name="theme-color" content="#ece3cf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#ece3cf;--paper-hi:#f6efdd;--card:#f1e8d3;--ink:#2b2117;--ink-soft:rgba(43,33,23,.62);--rubric:#a32e22;--gilt:#8a6414;--prus:#1f4d6e;
  --fell:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --serif:"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--hud:var(--ink);--hud-soft:var(--ink-soft)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--serif);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;width:100%;height:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#kb{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
button{font:inherit;color:inherit}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  padding:max(28px,calc(env(safe-area-inset-top) + 14px)) max(30px,calc(env(safe-area-inset-right) + 18px)) 0 max(30px,calc(env(safe-area-inset-left) + 18px));
  color:var(--hud);transition:color 1.2s ease}
.hud.deep{--hud:#efe6d0;--hud-soft:rgba(239,230,208,.66)}
.cap{font-family:var(--sc);font-size:13px;letter-spacing:.2em;color:var(--hud-soft);line-height:1}
.depth{font-family:var(--serif);font-weight:500;font-variant-numeric:lining-nums;font-size:clamp(34px,5.4vw,50px);line-height:1;margin-top:6px;white-space:nowrap}
.depth i{font-family:var(--serif);font-style:italic;font-size:.36em;margin-left:6px;color:var(--hud-soft)}
.depth.tick #depth{display:inline-block;animation:dt .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes dt{30%{transform:translateY(3px);color:var(--rubric)}}
.zone{font-family:var(--sc);font-size:14px;letter-spacing:.12em;color:var(--rubric);margin-top:7px;transition:color 1.2s}
.hud.deep .zone{color:#e8a08f}
.chain{font-family:var(--serif);font-style:italic;font-size:17px;margin-top:5px;min-height:1.3em;color:var(--hud);opacity:0;transition:opacity .3s}
.chain.on{opacity:1}.chain b{font-family:var(--fell);font-style:normal;font-weight:400;color:var(--gilt)}
.hud.deep .chain b{color:#e2bd6a}
.chain.lost{opacity:1;color:var(--rubric)}.chain.lost.fade{opacity:0;transition:opacity .6s}
.hud.deep .chain.lost{color:#e8a08f}
.chain.pulse b{display:inline-block;animation:cp .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes cp{40%{transform:scale(1.25)}}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hull{display:flex;gap:6px;margin-top:2px}
.hull svg{width:30px;height:30px;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .35s}
.hull .lost{transform:scale(.88)}
#mute{pointer-events:auto;background:none;border:0;padding:6px 0;margin:2px 0 0;cursor:pointer;font-family:var(--sc);font-size:14px;letter-spacing:.14em;color:var(--hud-soft);display:flex;align-items:center;gap:6px}
#mute svg{width:18px;height:18px}#mute.off span{text-decoration:line-through;text-decoration-thickness:1px}#mute.off .w{display:none}
#mute:hover,#mute:focus-visible{color:var(--hud);outline:none}
.hud .stat{transition:opacity .6s}
.hud.idle .stat{opacity:0}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:opacity .7s ease}
.layer.off{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.title{margin-top:max(7vh,34px);padding:16px 48px 22px;text-align:center;background:radial-gradient(ellipse at center,rgba(236,227,207,.97) 52%,rgba(236,227,207,0) 72%)}
.kicker{font-family:var(--sc);font-size:clamp(11px,1.6vw,14px);letter-spacing:.32em;color:var(--ink-soft)}
.title h1{margin:10px 0 0;font-family:var(--sc);font-weight:400;font-size:clamp(58px,11vw,118px);letter-spacing:.12em;line-height:.95;margin-right:-.12em}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px auto 0;width:min(340px,70vw);color:var(--ink-soft)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor}
.rule span{width:7px;height:7px;transform:rotate(45deg);background:currentColor}
.title p{margin:12px 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(17px,2.4vw,21px);color:var(--ink-soft)}
.title .rec{margin-top:14px;font-family:var(--sc);font-size:14px;letter-spacing:.16em;color:var(--rubric);min-height:1em}
.hint{position:absolute;left:0;right:0;text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);opacity:.86;animation:breathe 3s ease-in-out infinite}
.hint b{font-family:var(--sc);font-style:normal;font-weight:400;letter-spacing:.08em;color:var(--rubric)}
@keyframes breathe{50%{opacity:.5}}
/* the specimen card */
#over{overflow-y:auto;padding:14px 0}
.card{clip-path:var(--torn,none);margin:auto;width:min(440px,calc(100% - 28px));padding:26px 24px 20px;background:var(--card);color:var(--ink);pointer-events:auto;text-align:center;position:relative;
  border:1px solid rgba(43,33,23,.7);outline:1px solid rgba(43,33,23,.45);outline-offset:-6px;box-shadow:0 2px 0 rgba(43,33,23,.12),0 26px 70px rgba(30,20,10,.38);
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,250,235,.55),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(160,120,60,.12),transparent 55%);
  transform:translateY(0) rotate(-1.1deg);transition:transform .7s cubic-bezier(.2,.9,.25,1)}
.layer.off .card{transform:translateY(26px) rotate(.6deg)}
.card .lbl{font-family:var(--sc);font-size:14px;letter-spacing:.24em;color:var(--ink-soft)}
.card .zn{font-family:var(--sc);font-size:15px;letter-spacing:.14em;color:var(--rubric);margin-top:6px}
.card .big{font-family:var(--serif);font-weight:500;font-variant-numeric:lining-nums;font-size:70px;line-height:1;margin:8px 0 0}
.card .big i{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink-soft);margin-left:6px}
.card .sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-soft);min-height:1.3em;margin-top:4px}
.card .sub.rec{color:var(--rubric)}
.nums{display:flex;justify-content:center;gap:clamp(16px,6vw,34px);margin:16px 0 4px;padding:12px 0 2px;border-top:1px solid rgba(43,33,23,.3)}
.nums div{font-family:var(--serif);font-weight:500;font-variant-numeric:lining-nums;font-size:26px}
.nums span{display:block;font-family:var(--sc);font-size:12px;letter-spacing:.14em;color:var(--ink-soft);margin-top:2px}
.loghead{font-family:var(--sc);font-size:13px;letter-spacing:.2em;color:var(--ink-soft);margin-top:14px;display:flex;align-items:center;gap:10px}
.loghead::before,.loghead::after{content:"";flex:1;height:1px;background:rgba(43,33,23,.3)}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 4px;margin:8px 0 2px}
.specs figure{margin:0;display:flex;flex-direction:column;align-items:center;position:relative}
.specs canvas{width:72px;height:54px}
.specs figure.unseen canvas{opacity:.3;filter:grayscale(1) contrast(.8)}
.specs figure.unseen::before{content:"";position:absolute;left:8%;right:8%;top:0;height:54px;border:1px dashed rgba(43,33,23,.35)}
.specs .q{position:absolute;top:13px;left:0;right:0;font-family:var(--fell);font-size:24px;color:rgba(43,33,23,.5);pointer-events:none}
.specs figcaption{font-family:var(--serif);font-size:13px;line-height:1.15;color:var(--ink)}
.specs figcaption small{display:block;font-style:italic;font-size:11.5px;color:var(--ink-soft)}
.specs figure.unseen figcaption small{margin-top:2px}
.specs figure.unseen figcaption{color:var(--ink-soft)}
.specs .stamp{position:absolute;top:2px;right:2px;font-family:var(--sc);font-size:11px;letter-spacing:.08em;color:var(--rubric);border:1px solid var(--rubric);padding:0 4px;transform:rotate(8deg);background:rgba(241,232,211,.8)}
.again{margin-top:16px;width:100%;padding:13px;background:var(--paper-hi);color:var(--ink);border:1.5px solid var(--ink);outline:1px solid rgba(43,33,23,.55);outline-offset:-6px;
  font-family:var(--sc);font-size:18px;letter-spacing:.18em;cursor:pointer;transition:background .2s,color .2s,transform .12s;box-shadow:0 2px 0 rgba(43,33,23,.25)}
.again:hover{background:var(--ink);color:var(--paper-hi);outline-color:rgba(246,239,221,.5)}
.again:focus-visible{border-color:var(--rubric);outline-color:var(--rubric)}
.again:active{transform:scale(.985)}
.again small{font-family:var(--serif);font-style:italic;letter-spacing:0;font-size:14px;opacity:.7;margin-left:6px}
.pause{justify-content:center;background:rgba(236,227,207,.72)}
.pause .t{font-family:var(--fell);font-size:46px}
.pause .s{margin-top:8px;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-soft)}
.hud.deep .depth,.hud.deep .cap,.hud.deep .zone,.hud.deep .chain{text-shadow:0 0 6px rgba(10,10,24,.9),0 0 14px rgba(10,10,24,.7)}
@media (min-width:900px) and (min-height:680px){.specs figure.unseen::before{height:66px}.specs .q{top:18px}.card{width:520px;padding:32px 34px 26px}.card .big{font-size:86px}.specs canvas{width:88px;height:66px}.specs figcaption{font-size:14px}}
@media (max-height:640px){.specs figure.unseen::before{height:38px}.specs .q{top:6px;font-size:20px}.card{padding:16px 16px 14px}.card .big{font-size:46px}.card .sub{font-size:15px}.nums{margin:8px 0 2px;padding-top:8px}.nums div{font-size:20px}.loghead{margin-top:8px}.specs canvas{width:52px;height:38px}.specs figcaption small{display:none}.specs figcaption{font-size:12px}.again{margin-top:10px;padding:10px}}
@media (max-height:520px){.title{padding-top:20px}.title h1{font-size:54px}.title p{margin-top:6px}.kicker{display:none}.depth{font-size:32px}.hud{padding-top:22px}.cap{display:none}}
@media (max-width:600px){.hud.idle #mute{display:none}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.layer,.card{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <form id="kbf" autocomplete="off" onsubmit="return false"><input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" aria-label="Write here"></form>
  <div class="hud idle" id="hud">
    <div class="stat"><div class="cap">Sounding</div><div class="depth" id="dbox"><span id="depth">100</span><i>fathoms</i></div><div class="zone" id="zone">The Twilight Zone</div><div class="chain" id="chain"></div></div>
    <div class="right"><div class="stat"><div class="cap" style="text-align:right">The Bell</div><div class="hull" id="hull" aria-label="Hull"></div></div>
      <button id="mute" aria-label="Sound on"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor" fill-opacity=".15"/><path class="w" d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5.5a6.5 6.5 0 0 1 0 9"/></svg><span>Sound</span></button></div>
  </div>
  <div class="layer" id="title">
    <div class="title"><div class="kicker">A Catalogue of Abyssal Specimens</div><h1>Fathom</h1><div class="rule"><span></span></div><p>or, how deep can you write?</p><div class="rec" id="trec"></div></div>
    <div class="hint" id="thint"></div>
  </div>
  <div class="layer off" id="over">
    <div class="card" role="dialog" aria-labelledby="olbl">
      <div class="lbl" id="olbl">Plate I</div>
      <div class="zn" id="ozone"></div>
      <div class="big" id="odepth">0<i>fathoms</i></div>
      <div class="sub" id="osub"></div>
      <div class="nums"><div id="owpm">0<span>words / min</span></div><div id="oacc">0%<span>accuracy</span></div><div id="ospec">0<span>specimens taken</span></div></div>
      <div class="loghead" id="ohead">The Catalogue</div>
      <div class="specs" id="olist"></div>
      <button class="again" id="again">Begin another descent<small>· Enter</small></button>
    </div>
  </div>
  <div class="layer off pause" id="pause"><div class="t">Holding depth</div><div class="s" id="pres">press any key</div></div>
</div>

<script id="core">
// Fathom core: DOM-free. Rules, spawning, typing and scoring live here; the page only draws and plays sound.
// Depth is counted in fathoms. Specimens close in on the bell from every bearing (or from above, when the
// window is short because a phone's keyboard is up); each one takes the same time to arrive wherever it starts.
(function (root) {
  'use strict';
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const WORDS = ('abyss anchor angler aqua arch ballast barnacle beacon benthic bloom brine bubble buoy cable canyon current chasm ' +
    'chitin cobalt cold coral crab crevice crush dark deep depth diver drift echo eddy eel fathom fin flicker float foam gill glimmer ' +
    'glow gulper hadal haze hull ink isopod jelly jet keel kelp krill lamp lantern larva lure mantle marine murk nautilus nekton ocean ' +
    'octopus oxygen pearl pelagic plankton pressure prism pulse radiant ray reef ridge rivet salt salp sonar sound spine squid siphon ' +
    'silt shell shoal shrimp sink slope snow sponge spiral swell swim tide tendril trench tube twilight umbra urchin vent void wake water ' +
    'whale whisker wreck abyssal bathyal sediment sounding submerge descend specimen porthole catalogue expedition tentacle phosphor ' +
    'luminous shimmer gelatinous dragonfish viperfish hatchetfish snailfish siphonophore copepod amphipod cephalopod chimaera seamount ' +
    'thermocline upwelling undertow quiet hush still faint gleam spark ember flare beam lens glass iron bolt hatch dial gauge valve winch ' +
    'tether logbook sample record sketch notes quill journal vast unseen yaw yield zone quartz quiver venom vortex velvet jaw jellyfish ' +
    'kraken knot ripple oar oyster orbit opal hook hollow harbor gloom grotto fang fluke frond eerie estuary empty dusk drown delve ' +
    'cavern cusp clam blind black basalt barb azure ash ascend tow tusk torch trawl lull lobe lagoon marrow mist moon nadir nest night ' +
    'nimble ooze petrel plume polyp quay rift rudder rust scale scuttle seabed seal shadow sigh skate sleek slick sonde stingray ' +
    'urge velella wander warden weed whorl wisp yonder zenith zooplankton abalone ballad bell blue breath calm chill crown dive dream ' +
    'flow flux fume gust halo heron idle inlet isle jade kin lace linger lumen mote muse opaque orca pale pike pod quell rapture relic ' +
    'remora roam rook sable shelf siren slack slumber solace spume stern strand surge tangle thrum tremor tundra vapor vessel voyage submersible bathysphere photophore crustacean nudibranch barreleye ctenophore ' +
    'foraminifera mesopelagic bathypelagic lanternfish radiolarian hydrothermal oceanography invertebrate luminescence cartography ' +
    'echolocation pressurized diatomaceous').split(' ');

  // Kinds of specimen. len: word length range; spd: share of the way to the bell per second at the surface;
  // from: the sounding (fathoms) below which it is met.
  const KINDS = [
    { id: 'lantern', name: 'Lanternfish', latin: 'Myctophum', len: [3, 4], spd: 0.12, from: 0, w: 5 },
    { id: 'hatchet', name: 'Hatchetfish', latin: 'Argyropelecus', len: [4, 5], spd: 0.097, from: 0, w: 4 },
    { id: 'jelly', name: 'Crown jelly', latin: 'Atolla', len: [5, 7], spd: 0.063, from: 0, w: 4 },
    { id: 'angler', name: 'Anglerfish', latin: 'Melanocetus', len: [5, 7], spd: 0.082, from: 450, w: 4 },
    { id: 'gulper', name: 'Gulper eel', latin: 'Eurypharynx', len: [7, 9], spd: 0.057, from: 900, w: 3 },
    { id: 'squid', name: 'Vampire squid', latin: 'Vampyroteuthis', len: [6, 8], spd: 0.068, from: 1400, w: 3 },
    { id: 'siphon', name: 'Siphonophore', latin: 'Apolemia', len: [9, 12], spd: 0.039, from: 2000, w: 2 },
    { id: 'snail', name: 'Hadal snailfish', latin: 'Pseudoliparis', len: [6, 8], spd: 0.108, from: 3300, w: 3 }
  ];
  const ZONES = [
    { name: 'The Twilight Zone', at: 100 }, { name: 'The Midnight Zone', at: 550 },
    { name: 'The Abyssal Zone', at: 2200 }, { name: 'The Hadal Zone', at: 3300 }
  ];
  const START = 100, HULL = 3, FLARES = 1, FLARE_EVERY = 700;
  function zoneAt(d) { let z = 0; for (let i = 0; i < ZONES.length; i++) if (d >= ZONES[i].at) z = i; return z; }
  // Difficulty is a function of depth alone, so a dive's pressure follows how far the player has come.
  function tempo(d) {
    const k = Math.min(1, Math.max(0, (d - START) / 5000));
    return {
      gap: 3.2 - 2.25 * Math.pow(k, 0.55),   // seconds between arrivals
      cap: Math.round(4 + 5 * k),              // specimens at large at once
      spd: 0.62 + 1.07 * k                     // speed multiplier
    };
  }
  function chainMul(c) { return 1 + Math.min(c, 20) * 0.05; }  // up to x2 after twenty clean names
  function fathomsFor(word, chain) { return Math.round(word.length * 3.3 * chainMul(chain)); }

  function newRun(seed, w, h, opts) {
    opts = opts || {};
    return {
      seed: seed >>> 0, r: rng(seed), w: w, h: h, t: 0, depth: START, hull: HULL, flares: FLARES,
      nextFlareAt: START + FLARE_EVERY, chain: 0, bestChain: 0, nextId: 1, foes: [], target: 0,
      spawnIn: 0.3, keys: 0, hits: 0, misses: 0, words: 0, chars: 0, over: false, caught: {},
      speedMul: opts.speedMul || 1, ev: []
    };
  }
  // A short window (a phone with its keyboard up, a landscape phone) hangs the bell low and lets specimens come
  // only from above and the sides; otherwise the bell sits mid-plate and they come from every bearing.
  function low(s) { return s.h < 520; }
  function bell(s) { return low(s) ? { x: s.w / 2, y: s.h - Math.max(72, Math.min(104, s.h * 0.2)) } : { x: s.w / 2, y: s.h * 0.54 }; }
  function bellR(s) { return Math.max(24, Math.min(44, Math.min(s.w, s.h) * 0.055)); }
  function arc(s) { return low(s) ? [-Math.PI + 0.22, -0.22] : [-Math.PI, Math.PI]; }
  // distance from the bell to just beyond the window's edge along a bearing
  function reach(s, ang) {
    const b = bell(s), dx = Math.cos(ang), dy = Math.sin(ang);
    const tx = dx > 1e-6 ? (s.w - b.x) / dx : dx < -1e-6 ? -b.x / dx : Infinity;
    // they surface inside the window, below the readout band at the top, so nothing starts hidden under the HUD
    const top = low(s) ? 118 : 40;
    const ty = dy > 1e-6 ? (s.h - b.y) / dy : dy < -1e-6 ? (b.y - top) / -dy : Infinity;
    const e = Math.min(tx, ty);
    return low(s) ? Math.max(e - 24, 110) : Math.max(120, Math.min(e - Math.min(s.w, s.h) * 0.08 - 24, Math.min(s.w, s.h) * 0.5 + 40));
  }
  const SWAY = { lantern: 10, hatchet: 8, jelly: 18, angler: 8, gulper: 22, squid: 14, siphon: 16, snail: 20 };
  function place(s, f) {
    // p runs 0..1 from the edge of the water to the hull, so every specimen takes the same time to arrive
    const b = bell(s), rin = bellR(s) + 10, r0 = reach(s, f.ang), r = rin + (r0 - rin) * (1 - f.p);
    const sw = Math.sin(f.age * (f.kind === 'jelly' || f.kind === 'siphon' ? 1.1 : 1.7) + f.phase) * SWAY[f.kind] * Math.min(1, (1 - f.p) * 2.2);
    const c = Math.cos(f.ang), n = Math.sin(f.ang);
    f.x = b.x + c * r - n * sw; f.y = b.y + n * r + c * sw;
  }
  function resize(s, w, h) { s.w = w; s.h = h; for (const f of s.foes) place(s, f); }
  function maxLen(s) { return s.w < 420 ? 10 : s.w < 640 ? 11 : 12; }
  function pickKind(s) {
    const opts = KINDS.filter(k => s.depth >= k.from);
    let tot = 0; for (const k of opts) tot += k.w;
    let x = s.r() * tot;
    for (const k of opts) { x -= k.w; if (x < 0) return k; }
    return opts[opts.length - 1];
  }
  function pickWord(s, lo, hi, used) {
    hi = Math.min(hi, maxLen(s)); lo = Math.min(lo, hi);
    for (let widen = 0; widen < 6; widen++) {
      const a = lo - widen, b = hi + widen;
      const pool = WORDS.filter(wd => wd.length >= a && wd.length <= Math.min(b, maxLen(s)) && !used.has(wd[0]));
      if (pool.length) return pool[Math.floor(s.r() * pool.length)];
    }

    x.strokeStyle = A > 0.42 ? `rgba(255,190,150,${fade})` : `rgba(163,46,34,${fade})`; x.lineWidth = s.big ? 2.2 : 1.3; x.lineCap = 'round';
    x.beginPath(); x.moveTo(s.x0, s.y0);
    const N = 14; for (let k = 1; k <= N * grow; k++) { const u = k / N; x.lineTo((1 - u) * (1 - u) * s.x0 + 2 * (1 - u) * u * mx + u * u * s.x1, (1 - u) * (1 - u) * s.y0 + 2 * (1 - u) * u * my + u * u * s.y1); }

    if (grow >= 1 && fade > 0) { x.fillStyle = A > 0.42 ? `rgba(255,200,160,${fade})` : `rgba(163,46,34,${fade})`; x.beginPath(); x.arc(s.x1, s.y1, (s.big ? 4 : 2.4) * (0.6 + fade * 0.4), 0, 6.283); x.fill(); }
    if (s.t >= 1) strokes.splice(i, 1);
  }
  // catalogue marks on pinned specimens
  for (const p of pinned) {
    if (p.burnt) continue;
    const e = ease(p.t * 1.6), fa = 1 - ease((p.t - 0.55) / 0.45), rr = 26 * CS + 6;
    x.strokeStyle = A > 0.42 ? `rgba(255,190,150,${fa})` : `rgba(163,46,34,${fa})`; x.lineWidth = 1.5;
    x.beginPath(); x.arc(p.f.x, p.f.y, rr, -Math.PI / 2, -Math.PI / 2 + e * 6.283); x.stroke();
    if (p.n > 0) { x.font = `italic ${Math.round(16 * clamp(CS / 1.4, 0.85, 1.2))}px "EB Garamond", Georgia, serif`; x.fillStyle = A > 0.42 ? `rgba(255,214,180,${fa})` : `rgba(163,46,34,${fa})`; x.textAlign = 'center';
      x.fillText('No. ' + p.n, p.f.x + rr * 0.72, p.f.y - rr * 0.72 - 4 - e * 6); x.textAlign = 'left'; }
  }
  // ink blots from slips of the pen and breaches
  for (let i = blots.length - 1; i >= 0; i--) {
    const bl = blots[i]; bl.t += dt / 1.1; const a = 1 - ease((bl.t - 0.4) / 0.6), e = ease(bl.t * 5);
    x.fillStyle = `rgba(${A > 0.42 ? '210,90,70' : '120,30,22'},${0.85 * a})`;
    for (const d of bl.drops) { x.beginPath(); x.arc(bl.x + d.x * e, bl.y + d.y * e, d.r, 0, 6.283); x.fill(); }
    if (bl.t >= 1) blots.splice(i, 1);
  }
  // gilt specks
  for (let i = specks.length - 1; i >= 0; i--) {
    const p = specks[i]; p.t += dt; const k = p.t / p.life; if (k >= 1) { specks.splice(i, 1); continue; }
    p.vx *= Math.pow(0.1, dt); p.vy = p.vy * Math.pow(0.1, dt) - 12 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    x.fillStyle = p.col === 'gilt' ? `rgba(196,150,52,${(1 - k) * 0.95})` : A > 0.42 ? `rgba(200,180,150,${(1 - k) * 0.6})` : `rgba(43,33,23,${(1 - k) * 0.6})`;
    x.beginPath(); x.arc(p.x, p.y, p.r * (1 - k * 0.4), 0, 6.283); x.fill();
  }
  drawBell(b, br, t);
  // slips over everything
  const tid = run ? run.target : 0;
  placeSlips(all, tid, b, dt);
  for (const f of all) if (f.id !== tid && f !== demo) slip(f, t, false, b);
  for (const f of all) if (f.id === tid || f === demo) slip(f, t, f === demo ? demo.typed > 0 || true : true, b);
  // the flare tip appears only when it would help
  if (run && mode === 'play' && run.flares > 0 && save.flareTips < 3 && flareTip(b)) {
    x.font = `italic ${Math.round(15 * clamp(CS, 0.9, 1.15))}px "EB Garamond", Georgia, serif`; x.textAlign = 'center';
    const tip = TOUCH ? 'tap the flare, or Go, to light the water' : 'Enter fires a flare and clears the water', tw = x.measureText(tip).width, ty = H - 40;
    x.globalAlpha = 0.8 + 0.2 * Math.sin(t * 5);
    x.fillStyle = 'rgba(241,232,211,.95)'; x.fillRect(b.x - tw / 2 - 10, ty - 15, tw + 20, 22); x.strokeStyle = ink(0.5); x.lineWidth = 0.7; x.strokeRect(b.x - tw / 2 - 10, ty - 15, tw + 20, 22);
    x.fillStyle = RUB; x.fillText(tip, b.x, ty); x.globalAlpha = 1; x.textAlign = 'left';
  }
  x.restore();

  // zone banner: an engraved cartouche
  if (zoneT > 0) {
    zoneT -= dt; const a = Math.min(1, (3.4 - zoneT) * 2, zoneT * 1.4);
    const cy = Math.max(H * 0.25, 140), fs = Math.round(clamp(W / 18, 22, 40));
    x.globalAlpha = clamp(a, 0, 1); x.textAlign = 'center';
    x.font = `${fs}px "IM Fell English SC", Georgia, serif`; const tw = Math.min(x.measureText(zoneName).width, W - 120);
    ribbon(W / 2, cy - fs * 0.32, tw + fs * 1.4, fs * 1.45, clamp((3.4 - zoneT) * 1.6, 0, 1));
    x.fillStyle = INK; x.fillText(zoneName, W / 2, cy, W - 120);
    x.font = 'italic 16px "EB Garamond", Georgia, serif'; x.fillStyle = A > 0.42 ? '#f3c9b8' : RUB;
    x.fillText('entered at ' + fmt(C.ZONES[C.zoneAt(run ? run.depth : 0)].at) + ' fathoms', W / 2, cy + fs * 0.9 + 12);
    x.globalAlpha = 1; x.textAlign = 'left';
  }
  if (recordT > 0 && zoneT <= 0) {
    recordT -= dt; const a = Math.min(1, (2.8 - recordT) * 3, recordT * 1.5);
    x.globalAlpha = clamp(a, 0, 1); x.textAlign = 'center'; x.font = `italic ${Math.round(clamp(W / 30, 18, 26))}px "IM Fell English", Georgia, serif`;
    x.fillStyle = A > 0.42 ? '#f0cf7e' : '#8a6414'; x.fillText('Past the deepest sounding', W / 2, Math.max(H * 0.27, 150));
    x.globalAlpha = 1; x.textAlign = 'left';
  }
  if (flareT > 0) { x.fillStyle = `rgba(255,246,222,${Math.max(0, flareT - 0.5) * 0.9})`; if (!RM.matches) x.fillRect(0, 0, W, H); flareT = Math.max(0, flareT - dt / 1.6); }
}
// an engraved ribbon that unfurls from the middle: band, folded tails, hatched shadows
function ribbon(cx, cy, w, h, open) {
  const ww = w * (0.3 + 0.7 * ease(open)), sag = h * 0.16, tail = h * 0.9;
  x.save(); x.lineJoin = 'round';
  for (const s of [-1, 1]) {
    const ex = cx + s * ww / 2, tx0 = ex - s * h * 0.15, tx1 = ex + s * tail;
    x.beginPath(); x.moveTo(tx0, cy - h * 0.25 + sag); x.lineTo(tx1, cy - h * 0.25 + sag + 4); x.lineTo(tx1 - s * h * 0.32, cy + h * 0.25 + sag * 0.6); x.lineTo(tx1, cy + h * 0.75 + sag + 4); x.lineTo(tx0, cy + h * 0.75 + sag); x.closePath();
    x.fillStyle = '#e6d9bb'; x.fill(); x.lineWidth = 1; x.strokeStyle = INK; x.stroke();
    x.save(); x.clip(); x.beginPath(); for (let k = -40; k < 60; k += 3) { x.moveTo(tx0 + k, cy - h); x.lineTo(tx0 + k - 18, cy + h * 1.5); } x.lineWidth = 0.5; x.strokeStyle = ink(0.45); x.stroke(); x.restore();
    x.beginPath(); x.moveTo(ex, cy + h * 0.5 + sag); x.lineTo(tx0, cy + h * 0.75 + sag); x.lineTo(tx0, cy + h * 0.5 + sag); x.closePath(); x.fillStyle = '#6b5a45'; x.fill(); x.stroke();
  }
  x.beginPath(); x.moveTo(cx - ww / 2, cy - h * 0.5 + sag); x.quadraticCurveTo(cx, cy - h * 0.5 - sag, cx + ww / 2, cy - h * 0.5 + sag);
  x.lineTo(cx + ww / 2, cy + h * 0.5 + sag); x.quadraticCurveTo(cx, cy + h * 0.5 - sag, cx - ww / 2, cy + h * 0.5 + sag); x.closePath();
  x.fillStyle = '#f3ead6'; x.fill(); x.lineWidth = 1.2; x.strokeStyle = INK; x.stroke();
  x.beginPath(); x.moveTo(cx - ww / 2 + 6, cy - h * 0.5 + sag + 4); x.quadraticCurveTo(cx, cy - h * 0.5 - sag + 4, cx + ww / 2 - 6, cy - h * 0.5 + sag + 4);
  x.moveTo(cx - ww / 2 + 6, cy + h * 0.5 + sag - 4); x.quadraticCurveTo(cx, cy + h * 0.5 - sag - 4, cx + ww / 2 - 6, cy + h * 0.5 + sag - 4); x.lineWidth = 0.5; x.stroke();
  x.restore();
}
function flareTip(b) {
  const R = dangerR(), n = run.foes.filter(f => Math.hypot(f.x - b.x, f.y - b.y) < R * 1.3).length;
  if (n >= 3 && !tipOn) { tipOn = true; save.flareTips++; persist(); }
  if (n < 2) tipOn = false;
  return tipOn;
}

// ---------- loop ----------
let last = performance.now();
function frame(ms) {
  const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
  const t = ms / 1000;
  lurch *= Math.pow(0.03, dt); zoneDim = Math.max(0, zoneDim - dt / 2.4);
  const k = slow > 0 && !RM.matches ? 0.35 + 0.65 * (1 - slow / 1.2) : 1; slow = Math.max(0, slow - dt);
  if (mode === 'play') handle(C.step(run, dt * k));
  if (mode === 'dying') dieT += dt;
  if (run) {
    shown += (run.depth - shown) * (RM.matches ? 1 : Math.min(1, dt * 3));
    if (Math.abs(run.depth - shown) < 0.4) shown = run.depth;
    $('depth').textContent = fmt(shown);
    const zn = C.ZONES[C.zoneAt(shown)].name; if ($('zone').textContent !== zn) $('zone').textContent = zn;
    const ce = $('chain');
    if (chainBreak && chainBreak.t === 0) { ce.innerHTML = 'the chain of ' + chainBreak.n + ' is broken'; ce.className = 'chain lost'; ce.dataset.v = 'lost'; chainBreak.t = 0.0001; }
    else if (chainBreak && chainBreak.t > 0.55 && ce.className.indexOf('fade') < 0) ce.className = 'chain lost fade';
    else if (chainBreak) { chainBreak.t += dt / 1.3; if (chainBreak.t >= 1) chainBreak = null; }
    else {
      const v = run.chain >= 2 ? run.chain : 0;
      if (ce.dataset.v !== String(v)) { ce.dataset.v = String(v);
        ce.innerHTML = v ? `unbroken chain of ${v} · <b>×${C.chainMul(v).toFixed(2)}</b>` : '';
        ce.className = 'chain' + (v ? ' on' : ''); if (v && !RM.matches) { void ce.offsetWidth; ce.classList.add('pulse'); } }
    }
  }
  shake *= Math.pow(0.002, dt);
  draw(t, mode === 'pause' ? 0 : dt);
  requestAnimationFrame(frame);
}
// the end card is a plate torn from the catalogue: ragged top and bottom edges
(function torn() {
  const R = C.rng(77), pts = [];
  for (let i = 0; i <= 40; i++) pts.push(`${(i / 40 * 100).toFixed(2)}% ${(R() * 6).toFixed(1)}px`);
  for (let i = 1; i < 30; i++) pts.push(`calc(100% - ${(R() * 3).toFixed(1)}px) ${(i / 30 * 100).toFixed(2)}%`);
  for (let i = 40; i >= 0; i--) pts.push(`${(i / 40 * 100).toFixed(2)}% calc(100% - ${(R() * 6).toFixed(1)}px)`);
  for (let i = 29; i > 0; i--) pts.push(`${(R() * 3).toFixed(1)}px ${(i / 30 * 100).toFixed(2)}%`);
  document.querySelector('.card').style.setProperty('--torn', `polygon(${pts.join(',')})`);
})();
function initTitle() {
  $('trec').textContent = save.best > C.START ? 'Deepest sounding · ' + fmt(save.best) + ' fathoms' : '';
  $('thint').innerHTML = TOUCH ? 'Tap the plate, then write <b>dive</b>' : 'Write <b>dive</b> to begin the descent';
  setMute(save.mute); drawHull(C.HULL);
}
layout(); initTitle();
if (/[?&]still\b/.test(location.search)) window.__fathom = { C, start: () => start(), get run() { return run; }, get mode() { return mode; }, letter, handle };
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { PLATE = null; layout(); });
requestAnimationFrame(frame);
})();
</script>
