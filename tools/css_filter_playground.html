<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Filter Generator – brightness, blur, hue-rotate with live preview</title>
<meta name="description" content="Build a CSS filter on your own image and copy the code: blur, brightness, contrast, grayscale, hue-rotate, invert, opacity, saturate and sepia, a before/after slider, presets, and paste any filter to edit it. Your image never leaves the browser.">
<style>
:root{
  --bg:#e6e6e6;--panel:#f6f6f6;--ink:#161616;--muted:#5a5a5a;--line:#c9c9c9;--track:#bdbdbd;
  --stage:#d4d4d4;--err:#b3261e;--errbg:#fbe9e7;--flash:rgba(0,0,0,.14);--chip:#ececec;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1c1c;--panel:#252525;--ink:#ececec;--muted:#a6a6a6;--line:#3a3a3a;--track:#4a4a4a;
  --stage:#2e2e2e;--err:#ff8a80;--errbg:#3a1f1d;--flash:rgba(255,255,255,.18);--chip:#2f2f2f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1c1c;--panel:#252525;--ink:#ececec;--muted:#a6a6a6;--line:#3a3a3a;--track:#4a4a4a;
  --stage:#2e2e2e;--err:#ff8a80;--errbg:#3a1f1d;--flash:rgba(255,255,255,.18);--chip:#2f2f2f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;max-width:1360px;margin:0 auto;padding:12px 16px 24px;min-height:100vh}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0;flex:1;min-width:200px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;min-height:32px}
.ghost:hover{border-color:var(--ink)}

/* stage: the image is the result */
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;aspect-ratio:var(--ar,3/2);max-height:calc(100vh - 300px);min-height:200px;width:100%;background:var(--stage);border-radius:10px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.stage.drop{outline:3px dashed var(--ink);outline-offset:-8px}
.tag{position:absolute;top:10px;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:5px 7px;border-radius:5px;pointer-events:none}
.tag.l{left:10px}.tag.r{right:10px}
.divider{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;display:flex;justify-content:center;cursor:ew-resize;touch-action:none}
.divider::before{content:"";width:2px;height:100%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.knob{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:grid;place-items:center;color:#222}
.divider:focus-visible{outline:none}.divider:focus-visible .knob{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px #000}
.status{position:absolute;inset:auto 10px 10px 10px;background:rgba(0,0,0,.72);color:#fff;font-size:13px;padding:8px 10px;border-radius:6px;display:none}
.status.on{display:block}
.src{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.src .note{color:var(--muted);font-size:12.5px;margin-left:auto}
.src label.ghost{display:inline-flex;align-items:center}
.src input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.src label.ghost:focus-within{outline:2px solid var(--ink);outline-offset:2px}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0;align-self:start}
.result{display:flex;flex-direction:column;gap:8px}
.out{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:start}
.out .outhead{grid-column:1/-1;grid-row:1}.out .err{grid-column:1/-1;grid-row:3}
.out .acts{flex-direction:column;flex-wrap:nowrap;grid-column:2;grid-row:2}
.out .code{grid-column:1;grid-row:2}
.out .acts button{min-height:32px;padding:4px 12px;white-space:nowrap}
.extras{display:flex;flex-wrap:wrap;gap:6px}.extras:empty{display:none}
.xchip{display:inline-flex;align-items:center;gap:4px;font:12.5px var(--mono);border:1px dashed var(--muted);border-radius:6px;padding:2px 2px 2px 8px;max-width:100%}
.xchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xchip .zero{visibility:visible}
.outhead{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.code{font:14px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:3.9em;max-height:9em;overflow:auto;white-space:pre-wrap;word-break:break-word;cursor:text}
.code:focus{outline:2px solid var(--ink);outline-offset:0}
.code.bad{border-color:var(--err)}
.code .k{color:var(--muted)}
.code .t{border-radius:3px;transition:background-color .7s ease-out}
.code .t.hot{background:var(--flash);transition:none}
.err{color:var(--err);font-size:12.5px;height:1.4em;line-height:1.4;white-space:nowrap;text-overflow:ellipsis;margin:0;overflow:hidden}
.stale-tag{display:none}.stage.stale .stale-tag{display:inline}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.primary{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:8px;padding:5px 14px;font-size:13px;font-weight:600;min-height:38px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.acts .ghost{min-height:38px}
.method{font-size:12px;color:var(--muted);margin:0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;min-height:32px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 72px 26px;align-items:center;gap:8px;min-height:40px;position:relative}
.row label{font:13px var(--mono);white-space:nowrap;display:flex;align-items:center;gap:5px}
.row label{color:var(--muted)}
.row.on label{color:var(--ink);font-weight:700}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);height:32px;padding-right:6px}
.num input{width:100%;min-width:0;border:0;background:none;padding:0 4px 0 7px;font:13px var(--mono);font-variant-numeric:tabular-nums;text-align:right;height:30px}
.num input:focus{outline:none}.num:focus-within{outline:2px solid var(--ink)}
.num span{font:12px var(--mono);color:var(--muted)}
.row.bad .num{border-color:var(--err)}
.row .bubble{position:absolute;right:30px;top:36px;z-index:3;background:var(--errbg);color:var(--err);border:1px solid var(--err);font-size:12px;padding:4px 7px;border-radius:6px;max-width:260px;display:none}
.row.bad .bubble{display:block}
.zero{width:26px;height:26px;border:0;background:none;border-radius:6px;color:var(--muted);visibility:hidden;font-size:16px;line-height:1}
.row.on .zero{visibility:visible}.zero:hover{color:var(--ink);background:var(--bg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);margin-top:-7px;border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid var(--panel)}
.foot{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;gap:10px;align-items:center;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding:10px 16px 20px;gap:10px}
  .left{display:contents}
  .result{position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0 6px;margin-top:-6px;gap:6px}
  .stage{max-height:34vh;min-height:140px}
  .out{grid-template-columns:minmax(0,1fr)}
  .out .acts{grid-column:1;grid-row:4;flex-direction:row}
  .out .acts .primary{flex:1}
  .code{min-height:0}
  .code{font-size:12.5px;padding:6px 8px;max-height:7.2em}
  .outhead{display:none}
  .out .acts button{min-height:30px;padding:3px 10px;font-size:12.5px}
  .presets{flex-wrap:nowrap;overflow-x:auto;margin:0 -10px;padding:0 10px;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 85%,transparent)}
  .chip{min-height:30px;padding:3px 10px}
  .src .ghost{min-height:30px;padding:3px 9px}
  .src .note{display:none}
  .src .ghost{padding:5px 9px;font-size:13px}
  .sub{display:none}
  .src .note{display:none}
  .panel{padding:10px}
  .row{grid-template-columns:92px minmax(0,1fr) 64px 24px;min-height:38px}
}
@media (prefers-reduced-motion:reduce){.code .t{transition:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CSS Filter Generator</h1>
    <p class="sub">Tune a <code>filter</code> on your own image, compare before/after, copy the CSS. <a href="/" style="color:inherit">gptgames.dev</a></p>
    <button class="ghost" id="theme" style="margin-left:auto" type="button" aria-label="Dark mode" title="Dark mode"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="display:block"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  </header>

  <section class="left" aria-label="Result">
    <div class="src">
      <label class="ghost">Your image…<input type="file" id="file" accept="image/*"></label>
      <button class="ghost" id="example" type="button">Example</button>
      <button class="ghost" id="photo" type="button">Random photo</button>
      <span class="note">or drop / paste an image · it stays in your browser</span>
    </div>
    <div class="result">
    <div class="stage" id="stage">
      <img id="orig" alt="">
      <img id="filt" alt="Preview of the image with the filter applied">
      <span class="tag l">Original</span><span class="tag r">Filtered<span class="stale-tag"> · last valid</span></span>
      <div class="divider" id="divider" role="slider" tabindex="0" aria-label="Before and after split" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50% filtered"><span class="knob" aria-hidden="true">⇆</span></div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="out">
      <div class="outhead"><span id="codeLabel">CSS · edit or paste a filter</span></div>
      <div class="code" id="code" contenteditable="plaintext-only" role="textbox" aria-multiline="true" aria-labelledby="codeLabel" aria-describedby="codeErr" spellcheck="false" autocapitalize="off" autocorrect="off"></div>
      <p class="err" id="codeErr" aria-live="polite"></p>
      <div class="acts">
        <button class="primary" id="copy" type="button">Copy CSS</button>
        <button class="ghost" id="dl" type="button">Save PNG</button>
        <button class="ghost" id="link" type="button">Copy link</button>
      </div>
    </div>
    </div>
  </section>

  <section class="panel" aria-label="Filter controls">
    <div class="extras" id="extras"></div>
    <div class="presets" role="group" aria-label="Presets" id="presets"></div>
    <div class="rows" id="rows"></div>
    <div class="foot">
      <button class="ghost" id="reset" type="button">Reset all</button>
      <button class="ghost" id="rand" type="button">Randomize</button>
      <button class="ghost" id="undo" type="button" disabled>Undo</button>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button" hidden>Undo</button></div>
<div class="sr" id="live" aria-live="polite"></div>

<script id="core">
// DOM-free core: the CSS filter model, its parser and printer. Grammar and defaults follow
// Filter Effects Module Level 1 §6 (filter functions): an omitted argument means 1 (or 0 for
// blur and hue-rotate), number and percentage are interchangeable (1 = 100%), negative values are
// invalid, and grayscale/invert/opacity/sepia above 100% are clamped to 100%.
const FX = (() => {
  const DEFS = [
    {fn: 'blur',       unit: 'px',  min: 0, max: 20,  step: 0.1, id: 0,   omit: 0,   cap: 1000},
    {fn: 'brightness', unit: '%',   min: 0, max: 200, step: 1,   id: 100, omit: 100, cap: 10000},
    {fn: 'contrast',   unit: '%',   min: 0, max: 200, step: 1,   id: 100, omit: 100, cap: 10000},
    {fn: 'grayscale',  unit: '%',   min: 0, max: 100, step: 1,   id: 0,   omit: 100, clamp: 100},
    {fn: 'hue-rotate', unit: 'deg', min: 0, max: 360, step: 1,   id: 0,   omit: 0,   cap: 1e6},
    {fn: 'invert',     unit: '%',   min: 0, max: 100, step: 1,   id: 0,   omit: 100, clamp: 100},
    {fn: 'opacity',    unit: '%',   min: 0, max: 100, step: 1,   id: 100, omit: 100, clamp: 100},
    {fn: 'saturate',   unit: '%',   min: 0, max: 200, step: 1,   id: 100, omit: 100, cap: 10000},
    {fn: 'sepia',      unit: '%',   min: 0, max: 100, step: 1,   id: 0,   omit: 100, clamp: 100},
  ];
  const BY = Object.fromEntries(DEFS.map(d => [d.fn, d]));
  const NAMES = DEFS.map(d => d.fn);
  const LIST = NAMES.join(', ');

  const fmt = v => { const r = Math.round(v * 100) / 100; return String(Object.is(r, -0) ? 0 : r); };
  const defaults = () => ({order: NAMES.slice(), v: Object.fromEntries(DEFS.map(d => [d.fn, d.id])), extra: {}});
  const clone = s => ({order: s.order.slice(), v: Object.assign({}, s.v), extra: Object.assign({}, s.extra)});
  const drop = (s, k) => { const c = clone(s); delete c.extra[k]; c.order = c.order.filter(x => x !== k); return c; };
  const isOn = (s, fn) => Math.round(s.v[fn] * 100) !== Math.round(BY[fn].id * 100);
  const part = (fn, v) => `${fn}(${fmt(v)}${BY[fn].unit})`;
  const parts = s => s.order.filter(fn => BY[fn] ? isOn(s, fn) : s.extra[fn]).map(fn => ({fn, text: BY[fn] ? part(fn, s.v[fn]) : s.extra[fn]}));
  const value = s => { const p = parts(s); return p.length ? p.map(x => x.text).join(' ') : 'none'; };
  const css = s => `filter: ${value(s)};`;
  const same = (a, b) => value(a) === value(b);

  const NUM = /^([+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?)\s*([a-z%]*)$/i;
  const decComma = t => t.replace(/^([+-]?\d+),(\d+)/, '$1.$2');
  const example = fn => fn === 'blur' ? 'blur(4px)' : fn === 'hue-rotate' ? 'hue-rotate(90deg)' : `${fn}(120%)`;

  // One argument, as typed inside fn( … ) or into the number box next to a slider. In the box a
  // bare number is in the box's own unit (% / px / deg); inside fn( ) a bare number is a ratio.
  function arg(fn, raw, inBox) {
    const d = BY[fn];
    const t = decComma(String(raw).trim().replace(/\s+/g, ' '));
    if (t === '') return inBox ? {ok: false, error: `Type a number, like ${fmt(d.id)}`} : {ok: true, v: fn === 'blur' || fn === 'hue-rotate' ? 0 : 100};
    const m = t.match(NUM);
    if (!m) return {ok: false, error: `${fn} takes a number${d.unit === '%' ? ' or a percentage' : ''}, like ${example(fn)}`};
    let v = parseFloat(m[1]); const u = m[2].toLowerCase();
    if (!isFinite(v)) return {ok: false, error: `${fn}: that number is too large`};
    if (d.unit === '%') {
      if (u === '%') {} else if (u === '') { if (!inBox) v *= 100; }
      else return {ok: false, error: `${fn} takes a number or a percentage, like ${example(fn)}, not “${u}”`};
    } else if (fn === 'blur') {
      if (u !== 'px' && u !== '') return {ok: false, error: `blur takes a length in px, like blur(4px), not “${u}”`};
    } else {
      const k = {'': 1, deg: 1, rad: 180 / Math.PI, grad: 0.9, turn: 360}[u];
      if (k === undefined) return {ok: false, error: `hue-rotate takes an angle in deg, rad, grad or turn, like hue-rotate(90deg)`};
      v *= k;
    }
    if (fn !== 'hue-rotate' && v < 0) return {ok: false, error: `${fn} can't be negative`};
    if (d.clamp !== undefined && v > d.clamp) v = d.clamp;
    if (d.cap !== undefined && Math.abs(v) > d.cap) return {ok: false, error: `${fn} goes up to ${d.cap}${d.unit}`};
    return {ok: true, v: Math.round(v * 100) / 100 || 0};
  }

  // A whole filter as people paste it: with or without "filter:", "-webkit-filter:", ";",
  // "!important", "none", in any case, commas between functions tolerated.
  // drop-shadow() and url() have no slider; they are kept verbatim, in place, and the page asks the
  // browser whether they are valid. Their keys in `order` are 'x0', 'x1', … into `extra`.
  function read(text) {
    let s = String(text == null ? '' : text).replace(/\/\*[\s\S]*?\*\//g, ' ').trim();
    s = s.replace(/^(?:-webkit-)?filter\s*:/i, '').replace(/;\s*$/, '').replace(/!\s*important\s*$/i, '').trim();
    if (s === '' || /^none$/i.test(s)) return {ok: true, state: defaults()};
    const seen = [], out = defaults(), short = t => t.length > 24 ? t.slice(0, 24) + '…' : t;
    let i = 0, n = 0;
    while (true) {
      while (i < s.length && /[\s,]/.test(s[i])) i++;
      if (i >= s.length) break;
      const m = /^[a-z-]+/i.exec(s.slice(i, i + 40));
      if (!m) return {ok: false, error: `Couldn't read “${short(s.slice(i))}”. Expected something like brightness(120%) blur(2px).`};
      const name = m[0].toLowerCase(); i += m[0].length;
      while (i < s.length && /\s/.test(s[i])) i++;
      if (s[i] !== '(') return {ok: false, error: `“${short(m[0])}” needs a value in brackets, like ${example(BY[name] ? name : 'brightness')}.`};
      let depth = 1, j = i + 1;
      while (j < s.length && depth) { if (s[j] === '(') depth++; else if (s[j] === ')') depth--; j++; }
      // the browser closes brackets left open at the very end, so do we
      const inner = depth ? s.slice(i + 1) : s.slice(i + 1, j - 1);
      i = depth ? s.length : j;
      if (name === 'drop-shadow' || name === 'url') {
        const k = 'x' + n++; out.extra[k] = `${name}(${inner.trim().replace(/\s+/g, ' ')})`; seen.push(k); continue;
      }
      if (!BY[name]) return {ok: false, error: `“${short(m[0])}” isn't a CSS filter function. Use one of: ${LIST}.`};
      if (seen.includes(name)) return {ok: false, error: `${name} appears twice. Use each function once.`};
      if (/[()]/.test(inner)) return {ok: false, error: `Couldn't read “${short(m[0] + '(' + inner + ')')}”. Expected something like ${example(name)}.`};
      const a = arg(name, inner, false);
      if (!a.ok) return a;
      seen.push(name); out.v[name] = a.v;
    }
    out.order = seen.concat(NAMES.filter(x => !seen.includes(x)));
    return {ok: true, state: out};
  }

  // Presets carried over unchanged from the earlier version of the page.
  const PRESETS = [
    ['vintage', 'Vintage', {brightness: 120, contrast: 90, saturate: 85, sepia: 30}],
    ['grayscale', 'Grayscale', {grayscale: 100}],
    ['sepia', 'Sepia', {sepia: 100}],
    ['high-contrast', 'High contrast', {brightness: 110, contrast: 150, saturate: 110}],
    ['cool', 'Cool', {hue: 180, saturate: 110}],
    ['warm', 'Warm', {brightness: 102, hue: 30, saturate: 110, sepia: 15}],
    ['faded', 'Faded', {brightness: 110, contrast: 80, saturate: 70}],
    ['negative', 'Negative', {invert: 100}],
    ['soft', 'Soft focus', {blur: 1.5, brightness: 105}],
  ];
  function preset(key) {
    const p = PRESETS.find(x => x[0] === key); if (!p) return null;
    const s = defaults();
    for (const [k, v] of Object.entries(p[2])) s.v[k === 'hue' ? 'hue-rotate' : k] = v;
    return s;
  }
  const matchPreset = s => { const p = PRESETS.find(x => same(preset(x[0]), s)); return p ? p[0] : null; };

  // Randomize: the same ranges the earlier page used.
  function random(rand) {

    for (const k of ['grayscale', 'invert', 'sepia']) s.v[k] = rand() < 0.3 ? Math.round(R(0, 100)) : 0;
    s.v['hue-rotate'] = Math.round(R(0, 360));

  // Link: #f=<the filter value>. Storage: {v:1, filter:"<the filter value>"}.
  const toHash = s => '#f=' + encodeURIComponent(value(s)).replace(/%20/g, '+');

})();
</script>

<script>
(() => {
const $ = id => document.getElementById(id);
const KEY = 'cssFilterPlayground';
const stage = $('stage'), orig = $('orig'), filt = $('filt'), divider = $('divider'), code = $('code');
let state, history = [], future = [], split = 50, srcUrl = null, exampleUrl = null, editing = false;

// ---------- storage ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ---------- theme (existing "theme" key: "light" | "dark") ----------
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; const b = $('theme'); if (b) { const l = isDark() ? 'Light mode' : 'Dark mode'; b.title = l; b.setAttribute('aria-label', l); } }
applyTheme(store.get('theme'));
$('theme').onclick = () => {
  const t = isDark() ? 'light' : 'dark'; applyTheme(t); store.set('theme', t);
};

// ---------- rows ----------
const rows = {};
function buildRows() {
  const box = $('rows'); box.textContent = '';
  for (const fn of FX.NAMES) {
    const d = FX.BY[fn];
    let r = rows[fn];
    if (!r) {
      const el = document.createElement('div'); el.className = 'row';
      el.innerHTML = `<label for="r-${fn}">${fn}</label>
        <input type="range" id="r-${fn}" min="${d.min}" max="${d.max}" step="${d.step}" aria-describedby="e-${fn}">
        <div class="num"><input type="text" inputmode="decimal" id="n-${fn}" aria-label="${fn} value in ${d.unit === '%' ? 'percent' : d.unit}" aria-describedby="e-${fn}" autocomplete="off"><span>${d.unit}</span></div>
        <button class="zero" type="button" aria-label="Reset ${fn}" title="Reset ${fn}">×</button>
        <div class="bubble" id="e-${fn}" role="alert"></div>`;
      r = rows[fn] = {el, range: el.querySelector('input[type=range]'), num: el.querySelector('input[type=text]'), bubble: el.querySelector('.bubble')};
      r.range.addEventListener('input', () => { setVal(fn, +r.range.value, 'range'); });
      r.range.addEventListener('change', commit);
      r.num.addEventListener('input', () => {
        const a = FX.arg(fn, r.num.value, true);
        if (a.ok) { r.el.classList.remove('bad'); setVal(fn, a.v, 'num'); }
        else { r.el.classList.add('bad'); r.bubble.textContent = a.error; }
      });
      r.num.addEventListener('change', () => { if (!r.el.classList.contains('bad')) { commit(); r.num.value = FX.fmt(state.v[fn]); } });
      r.num.addEventListener('blur', () => { r.el.classList.remove('bad'); r.num.value = FX.fmt(state.v[fn]); });
      r.num.addEventListener('keydown', e => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const step = (e.shiftKey ? 10 : 1) * (fn === 'blur' ? 0.1 : 1) * (e.key === 'ArrowUp' ? 1 : -1);
        const a = FX.arg(fn, String(state.v[fn] + step), true);
        if (a.ok) { setVal(fn, a.v); commit(); }
      });
      el.querySelector('.zero').onclick = () => { remember(); state.v[fn] = d.id; render(fn); persist(); };
    }
    box.appendChild(r.el);
  }
}

// ---------- state changes ----------
function remember() { history.push(FX.clone(state)); if (history.length > 200) history.shift(); future = []; $('undo').disabled = false; }
let pending = null;
function setVal(fn, v, from) {
  if (!pending) pending = FX.clone(state);
  state.v[fn] = v; render(fn, from);
}
function commit() {
  if (pending && !FX.same(pending, state)) { history.push(pending); future = []; $('undo').disabled = false; persist(); }
  pending = null;
}
function replace(next, msg) {
  commit();
  if (FX.same(next, state) && next.order.join() === state.order.join()) { if (msg) toast(msg); return; }
  remember(); state = FX.clone(next); buildRows(); render(null); persist(); if (msg) toast(msg, true);
}
function undo() {
  commit(); if (!history.length) return;
  future.push(FX.clone(state)); state = history.pop(); buildRows(); render(null); persist();
  $('undo').disabled = !history.length; toast('Undone');
}
function redo() {
  if (!future.length) return; history.push(FX.clone(state)); state = future.pop(); buildRows(); render(null); persist(); $('undo').disabled = false;
}
function persist() {
  store.set(KEY, FX.save(state));
  if (location.hash) history_clear();
}
function history_clear() { try { history_api.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
const history_api = window.history;

// ---------- render ----------
let lastParts = {}, announceT;
function render(changed, from) {
  const value = FX.value(state);
  filt.style.filter = value === 'none' ? '' : value;
  for (const fn of FX.NAMES) {
    const r = rows[fn], v = state.v[fn];
    r.el.classList.toggle('on', FX.isOn(state, fn));
    if (from !== 'range' || fn !== changed) r.range.value = v;
    if (from !== 'num' || fn !== changed) { if (document.activeElement !== r.num || fn !== changed) { r.num.value = FX.fmt(v); r.el.classList.remove('bad'); } }
    r.range.setAttribute('aria-valuetext', FX.fmt(v) + FX.BY[fn].unit);
  }
  const xs = $('extras'); xs.textContent = '';
  for (const k of state.order.filter(k => state.extra[k])) {
    const c = document.createElement('span'); c.className = 'xchip'; c.title = state.extra[k] + ' (no slider; kept as typed)';
    const t = document.createElement('span'); t.textContent = state.extra[k];
    const x = document.createElement('button'); x.type = 'button'; x.className = 'zero'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove ' + state.extra[k]);
    x.onclick = () => replace(FX.drop(state, k), 'Removed');
    c.append(t, x); xs.appendChild(c);
  }
  if (!editing) paintCode(changed);
  const p = FX.matchPreset(state);
  for (const b of $('presets').children) b.setAttribute('aria-pressed', String(b.dataset.key === p));
  clearTimeout(announceT);
  announceT = setTimeout(() => { $('live').textContent = 'filter: ' + value; }, 700);
}
function paintCode(changed) {
  const ps = FX.parts(state);
  code.textContent = '';
  const k = document.createElement('span'); k.className = 'k'; k.textContent = 'filter: ';
  code.appendChild(k);
  if (!ps.length) code.appendChild(document.createTextNode('none'));
  ps.forEach((p, i) => {
    if (i) code.appendChild(document.createTextNode(' '));
    const s = document.createElement('span'); s.className = 't'; s.textContent = p.text;
    if (changed === null ? lastParts[p.fn] !== p.text : p.fn === changed && lastParts[p.fn] !== p.text) {
      s.classList.add('hot'); requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove('hot')));
    }
    code.appendChild(s);
  });
  const end = document.createElement('span'); end.className = 'k'; end.textContent = ';'; code.appendChild(end);
  lastParts = Object.fromEntries(ps.map(p => [p.fn, p.text]));
  setStale(false);
}

// ---------- the CSS box: edit or paste ----------
if (code.contentEditable !== 'plaintext-only') code.contentEditable = 'true';
let codeBefore = null;
code.addEventListener('focus', () => { editing = true; codeBefore = FX.clone(state); });
code.addEventListener('input', () => {
  const r = FX.read(code.innerText);
  if (r.ok && window.CSS && !CSS.supports('filter', FX.value(r.state))) {
    const bad = r.state.order.filter(k => r.state.extra[k]).map(k => r.state.extra[k]).find(x => !CSS.supports('filter', x));
    setStale(true, null, (bad ? `The browser rejects ${bad.length > 40 ? bad.slice(0, 40) + '…' : bad}` : 'The browser rejects this filter') + '. Preview shows the last valid filter.');
  } else if (r.ok) {
    setStale(false);
    state = r.state; render(null);
  } else {
    const raw = code.innerText.replace(/^\s*(?:-webkit-)?filter\s*:/i, '').replace(/;\s*$/, '').trim();
    const browserOk = window.CSS && CSS.supports('filter', raw);
    if (browserOk) filt.style.filter = raw;
    setStale(true, browserOk ? raw : null, r.error.replace(/\.?$/, '.') + (browserOk ? '' : ' Preview shows the last valid filter.'));
  }
});
let rawValid = null;
function setStale(on, raw, msg) {
  rawValid = on ? raw : null;
  code.classList.toggle('bad', on); $('codeErr').textContent = on ? msg : '';
  stage.classList.toggle('stale', on && !raw);
  $('copy').disabled = on && !raw; $('dl').disabled = on;
}
code.addEventListener('paste', e => {
  const t = e.clipboardData && e.clipboardData.getData('text/plain');
  if (t == null) return;
  e.preventDefault(); document.execCommand('insertText', false, t);
});
code.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); code.blur(); } if (e.key === 'Escape') { e.preventDefault(); code.blur(); } });
code.addEventListener('blur', () => {
  editing = false;
  if (codeBefore && !FX.same(codeBefore, state)) { history.push(codeBefore); future = []; $('undo').disabled = false; persist(); }
  codeBefore = null;
  if (rawValid) return; // keep a browser-valid filter the sliders can't hold, as typed
  setStale(false); render(null);
});

// ---------- presets & actions ----------
for (const [key, label] of FX.PRESETS) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.key = key; b.textContent = label;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => replace(FX.preset(key), label + ' applied');
  $('presets').appendChild(b);
}
$('reset').onclick = () => replace(FX.defaults(), 'Filter reset');
$('rand').onclick = () => replace(FX.random(Math.random), 'Randomized');
$('undo').onclick = undo;
document.addEventListener('keydown', e => {
  const t = e.target, typing = t.isContentEditable || (t.tagName === 'INPUT' && t.type === 'text');
  if (typing || !(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
  e.preventDefault(); e.shiftKey ? redo() : undo();
});

async function copyText(text, ok) {
  try { await navigator.clipboard.writeText(text); toast(ok); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let done = false; try { done = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); toast(done ? ok : 'Copy blocked — select the CSS and copy it by hand');
  }
}
$('copy').onclick = () => { const t = rawValid ? 'filter: ' + rawValid + ';' : FX.css(state); copyText(t, 'Copied: ' + t); };
$('link').onclick = () => copyText(location.origin + location.pathname + FX.toHash(state), 'Link copied — it holds the filter, not your image');

// ---------- toast ----------
let toastT;
function toast(msg, withUndo) {
  $('toastMsg').textContent = msg.length > 90 ? msg.slice(0, 88) + '…' : msg;
  $('toastUndo').hidden = !withUndo;
  $('toast').classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => $('toast').classList.remove('on'), withUndo ? 5000 : 2600);
}
$('toastUndo').onclick = () => { $('toast').classList.remove('on'); undo(); };

// ---------- images ----------
function status(msg) { $('status').textContent = msg || ''; $('status').classList.toggle('on', !!msg); }
let loadToken = 0;
function show(url, label, revoke) {
  const token = ++loadToken;
  status('Loading ' + label + '…');
  const probe = new Image();
  if (/^https?:/.test(url)) probe.crossOrigin = 'anonymous';
  probe.onload = () => {
    if (token !== loadToken) return;
    if (srcUrl && srcUrl !== exampleUrl && srcUrl !== url && srcUrl.startsWith('blob:')) URL.revokeObjectURL(srcUrl);
    srcUrl = url;
    for (const im of [orig, filt]) { im.crossOrigin = probe.crossOrigin; im.src = url; }
    stage.dataset.label = label; status('');
    stage.style.setProperty('--ar', probe.naturalWidth + '/' + probe.naturalHeight);
  };
  probe.onerror = () => {
    if (token !== loadToken) return;
    if (revoke) URL.revokeObjectURL(url);
    status(label === 'random photo' ? 'Couldn’t reach picsum.photos — still showing the previous image.' : 'That file isn’t an image this browser can open (try JPG, PNG, WebP or GIF).');
    setTimeout(() => { if (token === loadToken) status(''); }, 4000);
  };
  probe.src = url;
}
function useFile(f) {
  if (!f) return;
  if (f.type && !f.type.startsWith('image/')) { status('“' + f.name + '” isn’t an image. Use JPG, PNG, WebP, GIF or SVG.'); setTimeout(() => status(''), 4000); return; }
  show(URL.createObjectURL(f), f.name || 'your image', true);
}
$('file').onchange = e => { useFile(e.target.files[0]); e.target.value = ''; };
$('example').onclick = () => show(exampleUrl, 'example');
$('photo').onclick = () => show('https://picsum.photos/1200/800?t=' + Date.now(), 'random photo');
['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); stage.classList.add('drop'); } }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { if (t === 'drop' || e.target === document.documentElement || !e.relatedTarget) stage.classList.remove('drop'); }));
document.addEventListener('drop', e => { if (e.dataTransfer?.files?.length) { e.preventDefault(); useFile(e.dataTransfer.files[0]); } });
document.addEventListener('paste', e => {
  if (e.target === code) return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); useFile(item.getAsFile()); return; }
  const t = e.clipboardData?.getData('text/plain');
  if (t && /\(/.test(t) && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) {
    const r = FX.read(t);
    if (r.ok) { e.preventDefault(); replace(r.state, 'Filter pasted'); }
  }
});

// Example scene: drawn here, so it loads instantly and offline. Sky, sun, hills, water, a red barn
// for hue, and a strip of colour patches with a grey ramp so every filter has something to act on.
function makeExample() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 800;
  const g = c.getContext('2d');
  let sky = g.createLinearGradient(0, 0, 0, 470); sky.addColorStop(0, '#5f9bd6'); sky.addColorStop(1, '#f3d6a6');
  g.fillStyle = sky; g.fillRect(0, 0, 1200, 480);
  const sun = g.createRadialGradient(600, 240, 10, 600, 240, 170); sun.addColorStop(0, 'rgba(255,236,170,1)'); sun.addColorStop(.35, 'rgba(255,214,120,.9)'); sun.addColorStop(1, 'rgba(255,214,120,0)');
  g.fillStyle = sun; g.fillRect(420, 70, 360, 360);
  g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(600, 240, 52, 0, 7); g.fill();
  const ridge = (y0, amp, seed, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, 520);
    for (let x = 0; x <= 1200; x += 20) g.lineTo(x, y0 - amp * (Math.sin(x / 140 + seed) * .6 + Math.sin(x / 57 + seed * 2) * .25 + Math.sin(x / 23 + seed) * .08));
    g.lineTo(1200, 520); g.fill(); };
  ridge(330, 70, 1.3, '#8a97b8'); ridge(400, 55, 4.1, '#4f7d55'); ridge(450, 30, 2.2, '#2f5a36');
  let w = g.createLinearGradient(0, 470, 0, 680); w.addColorStop(0, '#7fb0d8'); w.addColorStop(1, '#235a86');
  g.fillStyle = w; g.fillRect(0, 470, 1200, 210);
  g.fillStyle = 'rgba(255,240,190,.55)'; for (let i = 0; i < 9; i++) g.fillRect(550 - i * 6, 490 + i * 18, 100 + i * 12, 3);
  g.fillStyle = '#3d6b3a'; g.fillRect(0, 455, 1200, 22);
  g.fillStyle = '#b8322a'; g.fillRect(170, 360, 130, 100); g.fillStyle = '#6e1f19';
  g.beginPath(); g.moveTo(155, 365); g.lineTo(235, 300); g.lineTo(315, 365); g.fill();
  g.fillStyle = '#f2efe6'; g.fillRect(222, 405, 26, 55); g.fillRect(190, 378, 20, 18); g.fillRect(262, 378, 20, 18);
  g.fillStyle = 'rgba(184,50,42,.35)'; g.fillRect(170, 482, 130, 60);
  const sw = ['#d7263d', '#f46036', '#f9c80e', '#3bb273', '#1b998b', '#2e86de', '#7b4fd6', '#e05fb0', '#e8b896', '#8d5b3e'];
  g.fillStyle = '#f4f4f4'; g.fillRect(0, 680, 1200, 120);
  sw.forEach((col, i) => { g.fillStyle = col; g.fillRect(24 + i * 115.2, 694, 107, 44); });
  for (let i = 0; i < 12; i++) { const v = Math.round(i * 255 / 11); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(24 + i * 96, 746, 96, 40); }
  return new Promise(res => c.toBlob(b => res(URL.createObjectURL(b)), 'image/png'));
}

// ---------- download ----------
$('dl').onclick = () => {
  const im = orig; if (!im.naturalWidth) return toast('No image loaded yet');
  const k = Math.min(1, 8192 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  const g = c.getContext('2d'); const v = FX.value(state);
  g.filter = v;
  if (v !== 'none' && g.filter !== v && g.filter === 'none') return toast('This browser can’t bake filters into a file — copy the CSS instead');
  g.drawImage(im, 0, 0, c.width, c.height);
  try {
    c.toBlob(b => {
      if (!b) return toast('Couldn’t make the file');
      const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      const base = (stage.dataset.label || 'image').replace(/\.[a-z0-9]+$/i, '').replace(/[^\w.-]+/g, '_').slice(0, 60) || 'image';
      a.download = base + '-filtered.png'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, 'image/png');
  } catch (e) { toast('This image can’t be exported'); }
};

// ---------- compare divider ----------
function setSplit(p) {
  split = Math.max(0, Math.min(100, p));
  filt.style.clipPath = `inset(0 0 0 ${split}%)`;
  divider.style.left = split + '%';
  divider.setAttribute('aria-valuenow', String(Math.round(split)));
  divider.setAttribute('aria-valuetext', Math.round(100 - split) + '% filtered');
}
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.status')) return;
  drag = {x: e.clientX, y: e.clientY, id: e.pointerId, live: e.pointerType === 'mouse' || e.target.closest('.divider')};
  if (drag.live) { stage.setPointerCapture(e.pointerId); move(e); }
});
function move(e) { const r = stage.getBoundingClientRect(); setSplit((e.clientX - r.left) / r.width * 100); }
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.live) {
    const dx = Math.abs(e.clientX - drag.x), dy = Math.abs(e.clientY - drag.y);
    if (dy > 8 && dy > dx) { drag = null; return; }
    if (dx > 8) { drag.live = true; stage.setPointerCapture(e.pointerId); }
  }
  if (drag.live) move(e);
});
stage.addEventListener('pointerup', e => { if (drag && !drag.live) move(e); drag = null; });
stage.addEventListener('pointercancel', () => { drag = null; });
divider.addEventListener('keydown', e => {
  const d = {ArrowLeft: -1, ArrowRight: 1, ArrowDown: -1, ArrowUp: 1, PageDown: -10, PageUp: 10}[e.key];
  if (d) { e.preventDefault(); setSplit(split + d * (e.shiftKey ? 10 : 1)); }
  else if (e.key === 'Home') { e.preventDefault(); setSplit(0); } else if (e.key === 'End') { e.preventDefault(); setSplit(100); }
});

// ---------- start ----------
// Priority: a link's #f= filter, then the last filter used here, then a worked example (Vintage).
state = FX.fromHash(location.hash) || FX.load(store.get(KEY)) || FX.preset('vintage');
buildRows(); setSplit(50); render(null); lastParts = {};
paintCode(undefined);
makeExample().then(u => { exampleUrl = u; show(u, 'example'); });
addEventListener('hashchange', () => { const s = FX.fromHash(location.hash); if (s) replace(s, 'Filter from link'); });
})();
</script>
