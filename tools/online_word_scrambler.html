<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Scrambler – Scramble Letters in Words and Text Online</title>
<meta name="description" content="Scramble the letters of every word in a text, or turn a word list into an unscramble worksheet with answers. Keep first and last letters, punctuation and capitals. Free, instant, nothing leaves your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f8f7f3; --card:#ffffff; --ink:#1d1c1a; --muted:#5f5d57; --line:#dcd9d0; --soft:#efede6;
  --accent:#2b56c9; --accent-ink:#ffffff; --flash:#dbe5ff; --warn:#8a4b00; --warn-bg:#fff3e0; --focus:#2b56c9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151513; --card:#1e1e1b; --ink:#ecebe6; --muted:#a6a39b; --line:#3a3934; --soft:#2a2925;
    --accent:#93acff; --accent-ink:#10131c; --flash:#2c3a66; --warn:#ffc27a; --warn-bg:#3a2a12; --focus:#93acff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151513; --card:#1e1e1b; --ink:#ecebe6; --muted:#a6a39b; --line:#3a3934; --soft:#2a2925;
  --accent:#93acff; --accent-ink:#10131c; --flash:#2c3a66; --warn:#ffc27a; --warn-bg:#3a2a12; --focus:#93acff; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px 16px 72px}
header{display:flex;align-items:baseline;gap:12px;justify-content:space-between;margin:2px 0 10px}
h1{font-size:1.3rem;margin:0;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:.93rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.icon-btn{border:0;background:transparent;border-radius:8px;padding:4px 2px;cursor:pointer;color:var(--muted);font-size:.85rem;white-space:nowrap}
.icon-btn:hover{color:var(--ink)}
label.field{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:.9rem;margin:0 0 4px}
label.field small{font-weight:400;color:var(--muted);font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:.8rem}
.inwrap{position:relative}
textarea{width:100%;min-height:96px;height:96px;resize:vertical;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;line-height:1.45;display:block}
.chiprow{display:flex;gap:8px;align-items:center;min-height:30px;margin:6px 0 0;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.linkish{background:none;border:0;padding:2px 0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:.85rem}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.outhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;min-height:36px}
.outhead .seg button{padding:5px 10px;font-size:.88rem}
.check{display:flex;gap:9px;align-items:center;cursor:pointer;font-size:.95rem}
.check input{width:19px;height:19px;accent-color:var(--accent);margin:0}
.btn:disabled{background:var(--soft);border-color:var(--line);color:var(--muted);opacity:1}
progress{appearance:none;-webkit-appearance:none;border:0;border-radius:4px;background:var(--soft);overflow:hidden}
progress::-webkit-progress-bar{background:var(--soft)}
progress::-webkit-progress-value{background:var(--accent)}
progress::-moz-progress-bar{background:var(--accent)}
.busy{font:.95rem system-ui,sans-serif;font-variant-numeric:tabular-nums}
details.ans{margin-top:12px;border-top:1px dashed var(--line);padding-top:4px}
details.ans summary{font-size:.88rem}
.btn svg{vertical-align:-3px}
.btn .lbl{margin-left:6px}
.actions{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:.92rem;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{cursor:default}
#result{font-size:1.38rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;min-height:4.7em;max-height:60vh;overflow:auto;margin:0;letter-spacing:.01em}
#result.placeholder{color:var(--muted);font-size:1.05rem;min-height:3em}
#result .w{border-radius:4px}
#result .fl{animation:fl 900ms ease-out}
@keyframes fl{from{background:var(--flash)}to{background:transparent}}
ol.sheet{margin:0;padding:0;list-style:none;columns:2 230px;column-gap:32px;font-size:1.25rem}
ol.sheet li{display:flex;gap:10px;break-inside:avoid;padding:4px 0;align-items:baseline}
.n{color:var(--muted);font:.8rem system-ui,sans-serif;font-variant-numeric:tabular-nums;min-width:1.9em;text-align:right}
ol.sheet .p{min-width:7.5em}
ol.sheet .blank{width:110px;flex:none;border-bottom:1px solid var(--line);align-self:end;margin-bottom:6px}
.key{padding:4px 0 2px;font-size:.92rem;color:var(--muted)}
.key b{color:var(--ink);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.key span{white-space:nowrap;margin-right:12px}
.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--soft);margin-top:10px;padding-top:8px;font-size:.83rem;color:var(--muted);min-height:44px;flex-wrap:wrap}
details{margin-top:12px;font-size:.92rem}
summary{cursor:pointer;color:var(--muted);padding:6px 0}
.opts{display:grid;grid-template-columns:1fr;gap:6px;padding:6px 2px}
.opts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.opts input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.opts small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:.9rem;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
.busy{display:flex;gap:10px;align-items:center}
progress{width:140px;height:8px;accent-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main::after{content:"";display:block;height:40px}
@media (max-width:520px){
  .sub{font-size:.85rem}
  .btn{padding:7px 9px}
  textarea{height:88px;min-height:72px}
  #result{font-size:1.25rem;min-height:4.7em}
  .btn{padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){#result .fl{animation:none}.toast{transition:none}}
@media print{header,.inwrap,label.field,.chiprow,.controls,.actions,details,.foot,.toast{display:none!important}.out{border:0;box-shadow:none}#result{max-height:none;overflow:visible}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Word Scrambler</h1><p class="sub">Shuffles the letters inside each word. Spaces, punctuation and numbers stay put.</p></div>
    <button class="icon-btn" id="theme" type="button" aria-label="Colour theme: automatic" title="Colour theme"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </header>

  <label class="field" for="input">Your text or word list <small id="count" aria-live="off"></small></label>
  <div class="inwrap"><textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off" aria-describedby="inhint"></textarea></div>
  <div class="chiprow" id="inhint"><span id="exnote">This is an example. Type or paste your own text.</span> <button class="linkish" id="clear" type="button">Clear</button></div>

  <div class="controls">
    <label class="check"><input type="checkbox" id="o-keepEnds"><span>Keep the first and last letter of each word</span></label>
  </div>

  <section class="out" aria-labelledby="outh">
    <div class="outhead">
      <h2 id="outh" class="sr">Result</h2>
      <div class="seg" role="group" aria-label="Show result as">
        <button type="button" id="v-text" aria-pressed="true">Text</button>
        <button type="button" id="v-list" aria-pressed="false">Worksheet</button>
      </div>
      <div class="actions">
        <button class="btn" id="again" type="button" title="Shuffle again (Ctrl+Enter)" aria-label="Shuffle again"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 6.5A6.5 6.5 0 1 0 16.5 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 2.5v4.5H12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">Shuffle</span></button>
        <button class="btn primary" id="copy" type="button">Copy</button>
      </div>
    </div>
    <div id="result" tabindex="0" aria-label="Scrambled result"></div>
    <div class="foot" id="foot">
      <span id="trust"></span>
      <button class="linkish" id="download" type="button">Download .txt</button>
    </div>
  </section>
  <div class="sr" aria-live="polite" id="live"></div>

  <details id="more">
    <summary>More options</summary>
    <div class="opts">
      <label><input type="checkbox" id="o-keepCase" checked><span>Capitals stay where they were<small>“Hello” becomes “Lohel”, not “lOhel”.</small></span></label>
      <label><input type="checkbox" id="o-ensureChange" checked><span>Never leave a word unchanged<small>Off: pure chance, so a short word can come out as it went in.</small></span></label>
      <label><input type="checkbox" id="o-wholeToken"><span>Mix across hyphens and other marks<small>“stop-believing” is one word; the hyphen keeps its place.</small></span></label>
      <label><input type="checkbox" id="o-movePunct"><span>Punctuation and numbers move too</span></label>
      <label><input type="checkbox" id="o-moveSpaces"><span>Spaces move too<small>Letters mix across word boundaries.</small></span></label>
    </div>
  </details>
</main>
<div class="toast" id="toast" role="status"></div>

(function () {

    $('o-ensureChange').checked = S.opts.ensureChange;
    $('o-wholeToken').checked = S.opts.wholeToken;
    $('o-movePunct').checked = !S.opts.fixPunct;
    $('o-moveSpaces').checked = !S.opts.fixSpaces;
    $('exnote').hidden = !isExample;
  }
  function countText() {
    var t = input.value, n = t.length > BIG ? null : C.graphemes(t).length;
    var words = (t.match(/[\p{L}\p{N}]+/gu) || []).length;
    $('count').textContent = (n == null ? t.length.toLocaleString() : n.toLocaleString()) + ' characters · ' + words.toLocaleString() + ' words';
  }

  function setPlaceholder(msg) { result.className = 'placeholder'; result.textContent = msg; lastOut = ''; setReady(false); }
  function setReady(on) { $('copy').disabled = !on; $('download').disabled = !on; $('again').disabled = !on; $('foot').style.visibility = on ? '' : 'hidden'; }

  function render(parts, flash) {
    var o = coreOpts(), prev = lastParts; lastParts = parts;
    var words = parts.filter(function (p) { return p.word && !p.held; });
    var stuck = words.filter(function (p) { return p.from === p.to; }).length;
    if (!words.length || stuck === words.length) {
      var msg = !words.length ? 'Nothing to scramble: there are no words here, only numbers, spaces or punctuation, which stay as they are.' : 'Nothing can move: every word is a single letter or the same letter repeated' + (o.keepEnds ? ', or too short once its first and last letters stay.' : '.');
      setPlaceholder(msg); live.textContent = msg; return;
    }
    var stuckWords = []; words.forEach(function (p) { if (p.from === p.to && stuckWords.indexOf(p.from) < 0) stuckWords.push(p.from); });
    $('trust').textContent = !stuck ? 'Every word was changed. Nothing leaves your browser.' :
      'All other words changed. Can’t change: ' + stuckWords.slice(0, 6).join(', ') + (stuckWords.length > 6 ? ' and ' + (stuckWords.length - 6) + ' more' : '') + '.';
    result.className = '';
    var frag = document.createDocumentFragment();
    if (S.view === 'list') {
      var items = C.worksheetFromParts(parts);
      lastOut = C.worksheetText(items);
      var ol = document.createElement('ol'); ol.className = 'sheet';
      var det = document.createElement('details'); det.className = 'ans'; det.innerHTML = '<summary>Answers (included when you copy or download)</summary>';
      var key = document.createElement('div'); key.className = 'key'; det.appendChild(key);
      items.slice(0, 3000).forEach(function (x, i) {
        var li = document.createElement('li');
        li.innerHTML = '<span class="n"></span><span class="p"></span><span class="blank"></span>';
        li.children[0].textContent = (i + 1) + '.'; li.children[1].textContent = x.puzzle;
        ol.appendChild(li);
        var a = document.createElement('span'); a.textContent = (i + 1) + '. ' + x.answer; key.appendChild(a); key.appendChild(document.createTextNode(' '));
      });
      frag.appendChild(ol); frag.appendChild(det);
    } else {
      lastOut = parts.map(function (p) { return p.to; }).join('');
      if (parts.length > 4000) frag.appendChild(document.createTextNode(lastOut));
      else {
        var buf = '';
        parts.forEach(function (p, i) {
          if (!p.word) { buf += p.to; return; }
          if (buf) { frag.appendChild(document.createTextNode(buf)); buf = ''; }
          var s = document.createElement('span'); s.className = 'w'; s.textContent = p.to;
          if (flash && (!prev || !prev[i] || prev[i].to !== p.to)) s.classList.add('fl');
          frag.appendChild(s);
        });
        if (buf) frag.appendChild(document.createTextNode(buf));
      }
    }
    result.textContent = ''; result.appendChild(frag);
    setReady(true);
  }

  function run(flash, announce) {
    clearTimeout(timer);
    if (worker) { worker.terminate(); worker = null; }
    var t = input.value;
    countText();
    if (!t.trim()) { lastParts = null; setPlaceholder('Type or paste text above and the scrambled version appears here.'); return; }
    if (t.length <= BIG) {
      render(C.scrambleParts(t, coreOpts(), S.seed), flash);
      if (announce) live.textContent = S.view === 'list' ? 'Worksheet updated.' : 'Scrambled: ' + lastOut.slice(0, 200);
      return;
    }
    runBig(t);
  }

  // Large text: scramble in a worker, in chunks cut at whitespace, with progress and cancel.
  function runBig(t) {
    var src = document.getElementById('core').textContent;
    var body = src + '\nonmessage=function(e){var d=e.data,t=d.t,seen=Object.create(null),out=[],i=0,N=t.length,step=50000;' +
      'var split=d.o.fixSpaces||d.o.wholeToken;' +
      'while(i<N){var j=split?Math.min(N,i+step):N;if(j<N){while(j<N&&!/\\s/.test(t[j]))j++;}' +
      'out.push.apply(out,WordScrambler.scrambleParts(t.slice(i,j),d.o,d.seed,seen));i=j;postMessage({p:i/N});}' +
      'postMessage({done:out});};';
    var url = URL.createObjectURL(new Blob([body], { type: 'text/javascript' }));
    worker = new Worker(url); URL.revokeObjectURL(url);
    result.className = 'placeholder';
    result.innerHTML = '<div class="busy"><span>Scrambling ' + t.length.toLocaleString() + ' characters…</span><progress max="1" value="0"></progress><button class="btn" type="button" id="cancel">Cancel</button></div>';
    setReady(false);
    $('cancel').onclick = function () { if (worker) worker.terminate(); worker = null; setPlaceholder('Cancelled. Edit the text or press Shuffle again to start over.'); };
    worker.onmessage = function (e) {
      if (e.data.p != null) { var pr = result.querySelector('progress'); if (pr) pr.value = e.data.p; return; }
      worker.terminate(); worker = null; render(e.data.done, false); live.textContent = 'Done.';
    };
  }

  function schedule() {
    isExample = false; syncControls(); save();
    clearTimeout(timer);
    if (input.value.length > BIG) { countText(); timer = setTimeout(function () { run(false); }, 400); }
    else run(true, false), (timer = setTimeout(function () { live.textContent = lastOut ? (S.view === 'list' ? 'Worksheet updated.' : 'Scrambled: ' + lastOut.slice(0, 200)) : ''; }, 900));
  }
  input.addEventListener('input', schedule);
  input.addEventListener('focus', function () { if (isExample) input.select(); });
  input.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); again(); } });

  function again() { S.seed = C.newSeed(); save(); run(true, true); }
  $('again').onclick = again;
  $('clear').onclick = function () {
    input.focus(); input.select();
    if (!document.execCommand || !document.execCommand('delete')) input.value = '';
    isExample = false; syncControls(); save(); run(false);
  };
  function setOpt(k, v) { S.opts[k] = v; save(); syncControls(); run(true, true); }
  $('o-keepEnds').onchange = function () { setOpt('keepEnds', this.checked); };
  $('v-text').onclick = function () { S.view = 'text'; save(); syncControls(); run(false, true); };
  $('v-list').onclick = function () { S.view = 'list'; save(); syncControls(); run(false, true); };
  $('o-keepCase').onchange = function () { setOpt('keepCase', this.checked); };
  $('o-ensureChange').onchange = function () { setOpt('ensureChange', this.checked); };
  $('o-wholeToken').onchange = function () { setOpt('wholeToken', this.checked); };
  $('o-movePunct').onchange = function () { setOpt('fixPunct', !this.checked); };
  $('o-moveSpaces').onchange = function () { setOpt('fixSpaces', !this.checked); };
  $('theme').onclick = function () { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(); save(); };

  var tt = 0;
  function toast(m) { var el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 1800); }
  $('copy').onclick = function () {
    if (!lastOut) return;
    var done = function () { toast(S.view === 'list' ? 'Worksheet copied' : 'Copied'); };
    var fallback = function () {
      var ta = document.createElement('textarea'); ta.value = lastOut; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); ok ? done() : toast('Copy blocked: select the result and copy it by hand');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lastOut).then(done, fallback); else fallback();
  };
  $('download').onclick = function () {
    if (!lastOut) return;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lastOut], { type: 'text/plain;charset=utf-8' }));
    a.download = S.view === 'list' ? 'unscramble-worksheet.txt' : 'scrambled.txt';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };

  applyTheme(); syncControls(); run(false);
})();
</script>
<script src="../logo.js"></script>
</body>
</html>
