<script id="core">
// Zalgo core: DOM-free. Tested by test/zalgo_text_generator.mjs.
// Marks come from U+0300–036F grouped by canonical combining class (Unicode 15):
// above = ccc 230/232/216, through = ccc 1 (+ U+0489), below = ccc 220/202/240.
// Left out: U+034F (invisible), U+0340/0341/0343/0344 (NFC rewrites them),
// U+035C–0362 (double marks that reach into the next letter).
(function (root) {
  const range = (a, b) => { const o = []; for (let c = a; c <= b; c++) o.push(c); return o; };
  const UP = [...range(0x300, 0x314), 0x33D, 0x33E, 0x33F, 0x342, 0x346, 0x34A, 0x34B, 0x34C, 0x350, 0x351, 0x352,
    0x357, 0x35B, ...range(0x363, 0x36F), 0x315, 0x31A, 0x358, 0x31B].map(c => String.fromCharCode(c));
  const MID = [0x334, 0x335, 0x336, 0x337, 0x338, 0x489].map(c => String.fromCharCode(c));
  const DOWN = [...range(0x316, 0x319), ...range(0x31C, 0x320), ...range(0x323, 0x326), ...range(0x329, 0x333),
    ...range(0x339, 0x33C), 0x347, 0x348, 0x349, 0x34D, 0x34E, 0x353, 0x354, 0x355, 0x356, 0x359, 0x35A,
    0x321, 0x322, 0x327, 0x328, 0x345].map(c => String.fromCharCode(c));
  const SETS = [UP, MID, DOWN];

  // Every combining-mark block a zalgo generator draws from.
  const MARKS_RE = /[̀-ͯ҃-҉᪰-᫿᷀-᷿⃐-⃿︠-︯]/g;

  const PRESETS = {
    mild:    {up: 1,  mid: 0, down: 1},
    medium:  {up: 4,  mid: 0, down: 4},
    strong:  {up: 7,  mid: 2, down: 7},
    extreme: {up: 15, mid: 5, down: 15},
  };
  const DEFAULTS = {preset: 'medium', up: 4, mid: 0, down: 4, gradient: false, limit: 0, custom: 500};
  const MAX = 15;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const mix = (seed, k, d) => {
    let h = (seed >>> 0) ^ Math.imul(k + 1, 0x9E3779B1) ^ Math.imul(d + 7, 0x85EBCA77);
    h = Math.imul(h ^ h >>> 16, 0x7FEB352D); h = Math.imul(h ^ h >>> 15, 0x846CA68B);
    return (h ^ h >>> 16) >>> 0;
  };

  let seg = null;
  function graphemes(text) {
    if (seg === null) seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter(undefined, {granularity: 'grapheme'}) : false;
    if (seg) { const out = []; for (const s of seg.segment(text)) out.push(s.segment); return out; }
    // Fallback: code points, with marks, joiners and variation selectors glued to the one before.
    const out = [];
    for (const ch of text) {
      if (out.length && /^[\p{M}‍︎️]/u.test(ch) || (out.length && /‍$/.test(out[out.length - 1]))) out[out.length - 1] += ch;
      else out.push(ch);
    }
    return out;
  }

  const strip = text => String(text == null ? '' : text).replace(MARKS_RE, '');
  const countMarks = text => (String(text == null ? '' : text).match(MARKS_RE) || []).length;
  const markable = g => !/^\s*$/u.test(g) && !/^\p{Cc}+$/u.test(g);

  // Per letter and direction: a stream seeded by (seed, letter index, direction). The first draw sets
  // how many marks (0.5×–1.5× the setting, so the setting is the average), later draws pick them.
  // Same seed, same letters → same marks, so typing only adds marks to what is new, and the count
  // only ever grows with the setting (which `fit` relies on).
  function marksFor(seed, k, d, amount) {
    if (amount <= 0) return '';
    const r = mulberry32(mix(seed, k, d));
    const n = Math.floor(amount * (0.5 + r()) + 0.5);
    const set = SETS[d];
    let s = '';
    for (let i = 0; i < n; i++) s += set[Math.floor(r() * set.length)];
    return s;
  }

  function clampLevel(v) { v = Math.round(Number(v)); return Number.isFinite(v) ? Math.max(0, Math.min(MAX, v)) : 0; }

  // Returns {text, parts: [[grapheme, marks], ...]}.
  function build(input, opt, scale) {
    const o = opt || {};
    const lv = [clampLevel(o.up), clampLevel(o.mid), clampLevel(o.down)];
    const seed = (o.seed >>> 0) || 1;
    const sc = scale == null ? 1 : scale;
    const gs = graphemes(strip(input));
    let n = 0; for (const g of gs) if (markable(g)) n++;
    const parts = []; let k = 0, text = '';
    for (const g of gs) {
      let m = '';
      if (markable(g)) {
        const f = sc * (o.gradient ? (n > 1 ? k / (n - 1) : 1) : 1);
        for (let d = 0; d < 3; d++) m += marksFor(seed, k, d, lv[d] * f);
        k++;
      }
      parts.push([g, m]); text += g + m;
    }
    return {text, parts};
  }

  const zalgo = (input, opt) => build(input, opt, 1).text;

  // Fit under a limit (UTF-16 length, what most apps count) by thinning all marks evenly.
  function fit(input, opt, limit) {
    const full = build(input, opt, 1);
    const base = strip(input).length;
    if (!limit || full.text.length <= limit) return {ok: true, fitted: false, scale: 1, base, ...full};
    if (base > limit) return {ok: false, base, limit, scale: 0, ...build(input, opt, 0)};
    let lo = 0, hi = 1, best = build(input, opt, 0);
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) / 2, b = build(input, opt, mid);
      if (b.text.length <= limit) { lo = mid; best = b; } else hi = mid;
    }
    return {ok: true, fitted: true, scale: lo, base, ...best};
  }

  const remove = input => strip(input);

  function randomLevels(rand) {
    rand = rand || Math.random;
    return {up: Math.floor(rand() * 16), mid: Math.floor(rand() * 16), down: Math.floor(rand() * 16)};
  }

  function presetOf(s) {
    for (const k in PRESETS) { const p = PRESETS[k]; if (p.up === s.up && p.mid === s.mid && p.down === s.down) return k; }
    return null;
  }

  // Saved settings: tolerate anything, return a clean object.
  function readSettings(raw) {
    let o = {};
    try { o = typeof raw === 'string' ? JSON.parse(raw) : (raw || {}); } catch (e) { o = {}; }
    if (!o || typeof o !== 'object') o = {};
    const s = {...DEFAULTS};
    for (const k of ['up', 'mid', 'down']) if (o[k] != null) s[k] = clampLevel(o[k]);
    s.gradient = o.gradient === true;
    const lim = Number(o.limit);
    s.limit = o.limit === 'custom' ? 'custom' : (Number.isFinite(lim) && lim >= 0 ? Math.floor(lim) : 0);
    const c = Number(o.custom); s.custom = Number.isFinite(c) && c >= 1 ? Math.min(1e6, Math.floor(c)) : DEFAULTS.custom;
    s.preset = (o.preset === 'random' || PRESETS[o.preset]) ? o.preset : (presetOf(s) || 'custom');
    return s;
  }

  // "1 234", "1.234", "1,234", " 280 chars" → 1234 / 280; anything else → null.
  function parseLimit(v) {
    const t = String(v == null ? '' : v).trim().replace(/\s*(chars?|characters?|zeichen)$/i, '').replace(/[\s.,'_  ]/g, '');
    if (!/^\d+$/.test(t)) return null;
    const n = parseInt(t, 10);
    return n >= 1 && n <= 1e6 ? n : null;
  }

  const api = {UP, MID, DOWN, PRESETS, DEFAULTS, MAX, graphemes, strip, countMarks, zalgo, build, fit, remove,
    randomLevels, presetOf, readSettings, parseLimit, mulberry32};
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.Zalgo = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
(function () {
  const Z = window.Zalgo;
  const $ = id => document.getElementById(id);
  const out = $('out'), input = $('in'), meta = $('meta'), slot = $('slot'), ferr = $('ferr'), copyBtn = $('copy'), copyL = $('copy-l');
  const limitSel = $('limit'), customIn = $('custom');
  const EX_GEN = 'Do not look behind you';
  const EX_REM = Z.zalgo('You can read this again', {up: 6, mid: 2, down: 6, seed: 7});
  const PREVIEW_MAX = 4000;      // graphemes drawn as separate spans (for the change flash)
  const RENDER_MAX = 200000;     // characters of output put in the page at all

  const store = {
    get(area, k) { try { return window[area].getItem(k); } catch (e) { return null; } },
    set(area, k, v) { try { window[area].setItem(k, v); } catch (e) {} },
  };

  let S = Z.readSettings(store.get('localStorage', 'zalgo.settings'));
  let draft = {};
  try { draft = JSON.parse(store.get('sessionStorage', 'zalgo.draft') || '{}') || {}; } catch (e) { draft = {}; }
  let mode = location.hash === '#remove' ? 'rem' : (draft.mode === 'rem' ? 'rem' : 'gen');
  let texts = {gen: typeof draft.gen === 'string' ? draft.gen : null, rem: typeof draft.rem === 'string' ? draft.rem : null};
  let seed = (draft.seed >>> 0) || (Math.random() * 4294967296 >>> 0) || 1;
  let last = '', lastParts = [], lastResult = '';

  // ---- presets
  const SW = {mild: 'a', medium: 'a', strong: 'a', extreme: 'a', random: '?'};
  const presets = $('presets');
  ['mild', 'medium', 'strong', 'extreme', 'random'].forEach(k => {
    const id = 'p-' + k;
    const lv = Z.PRESETS[k] || {up: 4, mid: 3, down: 4};
    const sw = k === 'random' ? Z.zalgo('?', {up: 5, mid: 1, down: 5, seed: 11}) : Z.zalgo('Z', {...lv, seed: 5});
    presets.insertAdjacentHTML('beforeend',
      `<input type="radio" name="preset" id="${id}" value="${k}"><label for="${id}"><span class="sw" aria-hidden="true"></span>${k[0].toUpperCase() + k.slice(1)}</label>`);
    presets.querySelector(`label[for="${id}"] .sw`).textContent = sw;
  });
  presets.addEventListener('change', e => {
    const k = e.target.value;
    if (k === 'random') { Object.assign(S, Z.randomLevels()); seed = (Math.random() * 4294967296 >>> 0) || 1; }
    else Object.assign(S, Z.PRESETS[k]);
    S.preset = k; syncControls(); update(true);
  });
  // Choosing Random again re-rolls.
  presets.addEventListener('click', e => {
    const t = e.target.closest('label'); if (!t) return;
    if (t.htmlFor === 'p-random' && $('p-random').checked) { e.preventDefault(); Object.assign(S, Z.randomLevels()); seed = (Math.random() * 4294967296 >>> 0) || 1; syncControls(); update(true); }
  });

  // ---- sliders
  ['up', 'mid', 'down'].forEach(k => {
    $('s-' + k).addEventListener('input', e => { S[k] = +e.target.value; S.preset = Z.presetOf(S) || 'custom'; syncControls(); update(true); });
  });
  $('grad').addEventListener('change', e => { S.gradient = e.target.checked; syncControls(); update(true); });

  function syncControls() {
    ['up', 'mid', 'down'].forEach(k => { $('s-' + k).value = S[k]; $('o-' + k).textContent = S[k]; });
    $('grad').checked = S.gradient;
    presets.querySelectorAll('input').forEach(r => { r.checked = r.value === S.preset; });
    $('sv').textContent = `${S.up} above · ${S.mid} middle · ${S.down} below${S.gradient ? ', growing' : ''}`;
    if (S.limit === 'custom') { limitSel.value = 'custom'; customIn.hidden = false; customIn.value = S.custom; }
    else { limitSel.value = [...limitSel.options].some(o => o.value === String(S.limit)) ? String(S.limit) : '0'; customIn.hidden = true; }
    store.set('localStorage', 'zalgo.settings', JSON.stringify(S));
  }

  meta.addEventListener('click', e => {
    const b = e.target.closest('[data-fit]'); if (!b) return;
    S.limit = +b.dataset.fit; syncControls(); update(false); limitSel.focus();
  });
  limitSel.addEventListener('change', () => {
    S.limit = limitSel.value === 'custom' ? 'custom' : +limitSel.value; syncControls();
    if (S.limit === 'custom') customIn.focus();
    update(false);
  });
  customIn.addEventListener('input', () => { const n = Z.parseLimit(customIn.value); if (n) S.custom = n; store.set('localStorage', 'zalgo.settings', JSON.stringify({...S, custom: n || S.custom})); update(false); });

  // ---- mode
  function setMode(m, push) {
    mode = m;
    $('tab-gen').setAttribute('aria-selected', m === 'gen'); $('tab-rem').setAttribute('aria-selected', m === 'rem');
    $('main').setAttribute('aria-labelledby', m === 'gen' ? 'tab-gen' : 'tab-rem');
    $('chaos').hidden = m === 'rem'; $('reroll').hidden = m === 'rem'; 
    $('main').classList.toggle('rem', m === 'rem');
    $('in-label').textContent = m === 'gen' ? 'Your text' : 'Zalgo text to clean';
    const t = texts[m];
    input.value = t == null ? (m === 'gen' ? EX_GEN : EX_REM) : t;
    if (push) history.replaceState(null, '', m === 'rem' ? '#remove' : location.pathname + location.search);
    last = null; lastParts = [];
    update(false);
  }
  $('tab-gen').addEventListener('click', () => setMode('gen', true));
  $('tab-rem').addEventListener('click', () => setMode('rem', true));
  document.querySelector('.tabs').addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const m = mode === 'gen' ? 'rem' : 'gen'; setMode(m, true); $(m === 'gen' ? 'tab-gen' : 'tab-rem').focus(); }
  });
  window.addEventListener('hashchange', () => setMode(location.hash === '#remove' ? 'rem' : 'gen', false));

  // ---- input
  let timer = 0;
  input.addEventListener('input', () => {
    texts[mode] = input.value; saveDraft();
    clearTimeout(timer);
    if (input.value.length > 20000) timer = setTimeout(() => update(false), 180); else update(false);
  });
  $('clear').addEventListener('click', () => {
    input.focus(); input.select();
    // execCommand keeps the native undo stack, so Ctrl+Z brings the text back.
    if (!document.execCommand || !document.execCommand('delete')) { input.value = ''; }
    input.dispatchEvent(new Event('input'));
  });
  function saveDraft() { store.set('sessionStorage', 'zalgo.draft', JSON.stringify({gen: texts.gen, rem: texts.rem, seed, mode})); }

  $('reroll').addEventListener('click', reroll);
  function reroll() {
    seed = (Math.random() * 4294967296 >>> 0) || 1;
    if (S.preset === 'random') { Object.assign(S, Z.randomLevels()); syncControls(); }
    saveDraft(); update(true);
  }
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && mode === 'gen') { e.preventDefault(); reroll(); }
  });
  out.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
      const sel = String(window.getSelection());
      if (!sel) { e.preventDefault(); copy(); }
    }
  });

  // ---- copy
  let copyT = 0;
  copyBtn.addEventListener('click', copy);
  async function copy() {
    const t = lastResult;
    if (!t) return;
    let ok = false;
    try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    copyL.textContent = ok ? 'Copied ✓' : 'Select & copy';
    if (!ok) { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    $('live').textContent = ok ? `Copied ${fmt(t.length)} characters` : 'Copy was blocked; the result is selected, copy it with your device’s copy command.';
    clearTimeout(copyT); copyT = setTimeout(() => { if (lastResult) copyL.textContent = 'Copy'; }, 1800);
  }

  // ---- render
  const fmt = n => n.toLocaleString('en-US');
  function currentLimit() { return S.limit === 'custom' ? S.custom : S.limit; }

  let liveT = 0;
  function update(flashAll) {
    const v = input.value;
    $('hint').hidden = !(texts[mode] == null || v === (mode === 'gen' ? EX_GEN : EX_REM));
    let parts, text, msg = '', error = '', r0ok = true;
    if (mode === 'gen') {
      const lim = currentLimit();
      if (S.limit === 'custom' && Z.parseLimit(customIn.value) == null) error = 'Enter the character limit as a whole number, for example 500.';
      const r = Z.fit(v, {...S, seed}, error ? 0 : lim);
      parts = r.parts; text = r.text;
      const marks = text.length - r.base;
      if (!r.ok) {
        error = `Your text alone is ${fmt(r.base)} characters, over the ${fmt(lim)} limit before any marks. Shorten it or choose a larger limit under Fine-tune.`;
        msg = '';
      } else if (!v.trim()) {
        msg = '';
      } else {
        msg = `<b>${fmt(text.length)}</b> characters`;
        if (lim && !error) msg += r.fitted ? ` · <span class="fits">fitted to ${fmt(lim)}</span>` : ` · <span class="fits">fits ${fmt(lim)}</span>`;
        else {
          const n = text.length;
          if (n <= 280) msg += ' · fits a post on X';
          else if (r.base <= 280 && n <= 2000) msg += ` · <span class="over">over X’s 280</span> <button type="button" class="linkbtn" data-fit="280">Fit</button>`;
          else if (r.base <= 2000 && n > 2000) msg += ` · <span class="over">over Discord’s 2,000</span> <button type="button" class="linkbtn" data-fit="2000">Fit</button>`;
        }
      }
      lastResult = r.ok ? text : ''; r0ok = r.ok;
      const ic = $('incount');
      ic.textContent = v ? (lim && Z.parseLimit(lim) ? `${fmt(r.base)} / ${fmt(lim)}` : fmt(r.base)) : '';
      ic.classList.toggle('over', !r.ok);
      copyL.textContent = 'Copy';
      $('thin').textContent = r.fitted ? `· thinned to fit ${fmt(lim)}` : '';
      const sc = r.fitted ? r.scale : 1, rd = x => Math.round(x * sc);
      $('sv').textContent = (r.fitted ? '≈ ' : '') + `${rd(S.up)} above · ${rd(S.mid)} middle · ${rd(S.down)} below${S.gradient ? ', growing' : ''}`;
      out.style.setProperty('--padt', Math.min(4, 0.25 + 0.22 * S.up * sc).toFixed(2) + 'em');
      // Line height leaves room for the marks actually drawn: about a third of an em per stacked mark.
      const f = r.scale * (S.gradient ? 1 : 1);
      out.style.setProperty('--lh', Math.min(6, 1.5 + 0.3 * (S.up + S.down) * f).toFixed(2) + 'em');
      void marks;
    } else {
      text = Z.remove(v); parts = null; out.style.setProperty('--padt', '6px');
      $('incount').textContent = ''; $('thin').textContent = ''; copyL.textContent = 'Copy'; out.style.setProperty('--lh', '1.5em');
      const removed = Z.countMarks(v);
      msg = v ? `<b>${fmt(removed)}</b> marks removed · <b>${fmt(text.length)}</b> characters left` : '';
      lastResult = text;
    }
    if (error && error !== ferr.textContent) $('live').textContent = error;
    ferr.textContent = error;
    ferr.classList.toggle('on', mode === 'gen' && !!currentLimit());
    input.setAttribute('aria-invalid', error ? 'true' : 'false');
    if (error) input.setAttribute('aria-describedby', 'ferr'); else input.removeAttribute('aria-describedby');
    $('reroll').disabled = !lastResult;
    slot.textContent = mode === 'gen'
      ? 'Standard Unicode marks; letters and emoji stay intact. Nothing leaves your browser.'
      : 'Strips every combining mark; é, ñ, ü typed as one letter stay. Nothing leaves your browser.';
    meta.innerHTML = msg;
    copyBtn.disabled = !lastResult;
    render(r0ok ? parts : null, r0ok ? text : '', flashAll, error);
    moreFade();
    clearTimeout(liveT);
    liveT = setTimeout(() => { $('live').textContent = text ? (mode === 'gen' ? `Result updated, ${fmt(text.length)} characters.` : `Cleaned: ${fmt(text.length)} characters.`) : 'Result is empty.'; }, 700);
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  function render(parts, text, flashAll, error) {
    const note = $('clipnote');
    if (!text) {
      out.innerHTML = error ? '' : `<span class="ph">${mode === 'gen' ? 'Your glitched text appears here.' : 'Your clean text appears here.'}</span>`;
      note.hidden = true; lastParts = []; return;
    }
    if (text.length > RENDER_MAX) {
      out.textContent = text.slice(0, RENDER_MAX).replace(/[\uD800-\uDBFF]$/, '');
      note.hidden = false; note.textContent = `Showing the first ${fmt(RENDER_MAX)} of ${fmt(text.length)} characters. Copy takes all of it.`;
      lastParts = []; return;
    }
    note.hidden = true;
    if (!parts || parts.length > PREVIEW_MAX) { out.textContent = text; lastParts = []; return; }
    const frag = document.createDocumentFragment();
    const changed = [];
    parts.forEach((p, i) => {
      const s = p[0] + p[1];
      const sp = document.createElement('span'); sp.className = 'g'; sp.textContent = s;
      const prev = lastParts[i];
      if (lastParts.length && p[1] && (flashAll || prev !== s)) changed.push(sp);
      frag.appendChild(sp);
    });
    out.replaceChildren(frag);
    if (!reduced.matches && changed.length) {
      changed.forEach(sp => sp.classList.add('new'));
      requestAnimationFrame(() => requestAnimationFrame(() => changed.forEach(sp => sp.classList.remove('new'))));
    }
    lastParts = parts.map(p => p[0] + p[1]);
  }
  function moreFade() { const w = out.parentNode; w.classList.toggle('more', out.scrollHeight - out.scrollTop - out.clientHeight > 4); }
  out.addEventListener('scroll', moreFade, {passive: true});

  // ---- theme
  const themeBtn = $('theme');
  function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function paintThemeBtn() { themeBtn.setAttribute('aria-label', isDark() ? 'Switch to light theme' : 'Switch to dark theme'); }
  themeBtn.addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('localStorage', 'theme', t); paintThemeBtn(); });
  paintThemeBtn();

  syncControls();
  setMode(mode, false);
})();
</script>
