<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image to Sketch Converter – Photo to Pencil Drawing, Free, Full Size</title>
<meta name="description" content="Turn a photo into a pencil sketch, charcoal drawing, ink outline, cross-hatching or colour pencil drawing. Live preview, full-resolution download, no watermark, and the photo never leaves your device.">

<meta name="color-scheme" content="light dark">
<style>
:root{
  --desk:#e8e6e1; --panel:#f7f6f3; --line:#d3d0c8; --ink:#1d1d1f; --ink2:#55534e; --ink3:#7a776f;
  --graphite:#2e3238; --graphite-hi:#454b53; --on-graphite:#fff; --sel:#1d1d1f;
  --err:#a8261b; --err-bg:#fbeeec; --ok:#2f6b3a; --focus:#2563c9;
  --sheet-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.10);
}
@media (prefers-color-scheme:dark){
  :root{--desk:#1b1c1e; --panel:#242528; --line:#3a3b3f; --ink:#ececea; --ink2:#b4b2ab; --ink3:#8f8d86;
    --graphite:#e9e7e2; --graphite-hi:#fff; --on-graphite:#17181a; --sel:#ececea;
    --err:#ff8a7d; --err-bg:#3a2321; --ok:#8fd19a; --focus:#7fb0ff;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;padding:12px 20px 0;flex-wrap:wrap}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--ink2);font-size:13.5px}
.stage{position:relative;min-height:0;display:flex;flex-direction:column;padding:12px 20px 16px;gap:8px}
.sheetwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.sheet{position:relative;box-shadow:var(--sheet-shadow);background:#fff;max-width:100%;max-height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.sheet canvas{display:block;width:100%;height:100%}
.sheet .orig{position:absolute;inset:0;clip-path:inset(0 100% 0 0)}
.divider{position:absolute;top:0;bottom:0;left:0;width:0;pointer-events:none}
.divider.atedge::before{display:none}
.tag{position:absolute;top:8px;font-size:12px;font-weight:600;color:#fff;background:rgba(29,29,31,.72);padding:2px 8px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .15s}
.tag.on{opacity:1}
#tagPhoto{left:8px}
#tagSketch{right:8px}
.divider::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.grip{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);pointer-events:auto;cursor:ew-resize;
  height:40px;width:40px;padding:0;justify-content:center;border-radius:50%;border:0;background:#fff;color:#1d1d1f;box-shadow:0 1px 4px rgba(0,0,0,.35);
  display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;touch-action:none}
.grip.atedge{transform:translate(10px,-50%)}
.grip svg{width:20px;height:20px}
.badge{position:absolute;bottom:8px;right:8px;background:rgba(29,29,31,.78);color:#fff;font-size:12px;padding:3px 8px;border-radius:10px;opacity:0;transition:opacity .15s;pointer-events:none}
.badge.on{opacity:1}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--ink2);font-size:13px;min-height:18px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 0 8px}
.photo{display:flex;gap:10px;align-items:center}
.photo img,.photo .ph{width:52px;height:52px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
.photo .info{min-width:0;flex:1}
.photo .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo .sub{color:var(--ink2);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.btn.primary:hover{background:var(--graphite-hi)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:default}
.pick{width:100%;margin-top:10px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:6px}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;cursor:pointer;color:inherit;font-size:inherit;min-height:24px}
.err{display:none;margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--err-bg);color:var(--err);font-size:13.5px}
.err.on{display:block}
.errx{float:right;border:0;background:none;color:inherit;font-size:20px;line-height:1;padding:0 0 0 10px;margin:-2px -2px 0 0;cursor:pointer;min-width:32px;min-height:28px}
.styles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.style{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 4px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.15;text-align:center}
.style canvas{width:100%;aspect-ratio:1;border-radius:4px;background:#fff;display:block}
.style[aria-checked="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel);color:var(--ink)}
.slider{display:grid;grid-template-columns:1fr;align-items:center;row-gap:2px;margin-bottom:6px}
.slider label{font-weight:600;font-size:14px}
.slider output{color:var(--ink2);font-size:13px;min-width:3ch;text-align:right}
.slider input{grid-column:1/-1;width:100%;margin:0;height:28px;accent-color:var(--graphite)}
.paper{display:flex;gap:6px}
.chip{flex:1;min-height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;font-weight:600;font-size:13px}
.chipsub{font-weight:400;color:var(--ink3)}
.chip[aria-checked="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:6px;min-height:32px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.save{display:flex;flex-direction:column;gap:8px}
.savemain{display:flex;gap:0}
.savemain .btn{flex:1}
.fmt{appearance:none;-webkit-appearance:none;border:1px solid var(--graphite);border-left:1px solid rgba(255,255,255,.25);background:var(--graphite);color:var(--on-graphite);border-radius:0 8px 8px 0;padding:0 26px 0 10px;font-weight:600;cursor:pointer;min-height:44px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 19px,calc(100% - 9px) 19px;background-size:4px 4px;background-repeat:no-repeat}
.progress{position:relative;overflow:hidden}
.progress .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0}
.status{font-size:13px;color:var(--ink2);min-height:18px}
.status.ok{color:var(--ok)}
.status.bad{color:var(--err)}
.trust{display:inline-flex;align-items:center;gap:5px}
.trust svg{width:13px;height:13px}
.trust .short{display:none}
.merr{display:none !important}
.trust a{color:inherit}
.drop{position:fixed;inset:0;background:rgba(20,20,22,.55);display:none;align-items:center;justify-content:center;z-index:20;color:#fff;font-size:20px;font-weight:600}
.drop.on{display:flex}
.drop div{border:2px dashed rgba(255,255,255,.8);border-radius:14px;padding:40px 56px}
.zoom{position:fixed;inset:0;background:#111;z-index:30;display:none;flex-direction:column}
.zoom.on{display:flex}
.zoom .bar2{display:flex;gap:8px;align-items:center;padding:8px 10px;color:#eee;font-size:13px}
.zoom .bar2 .btn{color:#eee;border-color:#444;min-height:38px}
.zoom .bar2 span{flex:1}
.zoom .view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:grid;place-items:center}
.zoom .view canvas{display:block;background:#fff}
.zoom .view.fit canvas{max-width:100%;max-height:100%;width:auto;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:860px){
  .app{display:block;height:auto}
  header{padding:10px 16px 0}
  header p{display:none}
  .stage{padding:8px 16px 6px}
  .sheetwrap{height:40vh;height:40dvh}
  .slider{grid-template-columns:104px 1fr;column-gap:10px;margin-bottom:0}
  .slider input{grid-column:auto;height:40px}
  .slider label{font-size:14px}
  aside{border:0;background:transparent;padding:4px 16px 88px;gap:14px;overflow:visible}
  .styles{gap:5px}
  .style{font-size:11px;padding:3px 3px 4px}
  .photoblock{order:5}
  .save{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));margin:0;flex-direction:row;flex-wrap:wrap;gap:8px}
  .save .savemain{order:2;flex:1;min-width:0}
  .save .savemain .btn.primary{padding:0 8px}
  .save .mobile-actions{order:1;flex:none}
  .save .mobile-actions .btn{flex:none;padding:0 12px}
  #mZoom{padding:0 10px}
  .save .status{order:3;flex-basis:100%}
  .save .row,.save .status{display:none}
  .merr.on{display:block !important;margin:2px 0 0}
  .photoblock .err{display:none !important}
  .meta{font-size:12.5px;flex-wrap:nowrap;white-space:nowrap}
  .trust .long{display:none}
  .trust .short{display:inline}
  .grip{height:36px;width:36px}
  .save.showstatus .status{display:block}
  .mobile-actions{display:flex !important}
  .lbl{margin-bottom:6px}
}
.mobile-actions{display:none;gap:8px}
.mobile-actions .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

        <canvas id="orig" class="orig" width="4" height="3" aria-hidden="true"></canvas>
        <div class="divider" id="divider">
          <button class="grip atedge" id="grip" type="button" role="slider" aria-label="Compare with photo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Showing sketch">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5M2.5 8h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="gripTxt" class="sr">Drag to compare with the photo</span>

      </div>
      
    </div>

      <div class="slider"><label for="s-dark" id="l-dark">Darkness</label><input type="range" id="s-dark" min="0" max="100" step="1"></div>

        <button class="btn" id="zoomBtn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m12.5 12.5 4.5 4.5M6 8.5h5M8.5 6v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>View 100%</button>
      </div>
      <div class="mobile-actions">
        <button class="btn" id="mPick" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h2l1.2-1.6h4.6L13.5 5h2A1.5 1.5 0 0 1 17 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z M10 13.2a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span id="mPickTxt">Your photo</span></button>
        <button class="btn" id="mZoom" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m12.5 12.5 4.5 4.5M6 8.5h5M8.5 6v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Zoom</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </aside>
</div>

<div class="drop" id="drop" aria-hidden="true"><div>Drop the photo to sketch it</div></div>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Full-size sketch">
  <div class="bar2"><span id="zoomInfo" class="num"></span><button class="btn" id="zoomFit" type="button">Fit</button><button class="btn" id="zoomClose" type="button">Close</button></div>
  <div class="view" id="zoomView"></div>
</div>

  var shareOK = null;
  function canShareFiles() {
    if (shareOK !== null) return shareOK;
    try { shareOK = !!(navigator.canShare && navigator.canShare({files: [new File([new Blob(['x'], {type: 'image/png'})], 'x.png', {type: 'image/png'})]})); } catch (e) { shareOK = false; }
    return shareOK;
  }
  function errText(e) {
    if (e && e.message === 'memory') return 'This photo is too large for this browser to draw. Try a smaller copy.';
    return 'Something went wrong drawing the full-size sketch. Please try again.';
  }
  $('dl').addEventListener('click', function () {
    if (!img) return;
    if (saving) { if (job) job.cancel(); return; }
    var fmt = state.format, name = S.fileName(img.sample ? 'beagle' : img.name, state.style, fmt);
    busyButton(true, 'Drawing… (cancel)');
    status('Drawing the full-size sketch…');
    renderFull(function (f) { setProgress(f); $('dlTxt').textContent = Math.round(f * 100) + '% · Cancel'; })
      .then(function (c) { $('dlTxt').textContent = 'Saving…'; setProgress(1); return toBlob(c, fmt).then(function (b) { return {b: b, c: c}; }); })
      .then(function (r) {
        var file = new File([r.b], name, {type: r.b.type});
        if (PHONE() && canShareFiles()) {
          return navigator.share({files: [file]}).then(function () { return r; }, function (e) {
            if (e && e.name === 'AbortError') throw e; download(r.b, name); return r;
          });
        }
        download(r.b, name); return r;
      })
      .then(function (r) {
        busyButton(false);
        status('Saved ' + name + ' · ' + px(r.c.width, r.c.height) + ' · ' + (r.b.size < 1048576 ? Math.max(1, Math.round(r.b.size / 1024)) + ' KB' : (r.b.size / 1048576).toFixed(1) + ' MB'), 'ok');
        say('Saved ' + name);
      })
      .catch(function (e) {
        busyButton(false);
        if (e && (e.message === 'cancel' || e.name === 'AbortError')) status(''); else status(errText(e), 'bad');
      });
  });
  function download(blob, name) {
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
  }
  $('copy').addEventListener('click', function () {
    if (!img) return;
    if (!navigator.clipboard || !window.ClipboardItem) { status('This browser can’t copy images. Use Download instead.', 'bad'); return; }
    status('Drawing the full-size sketch…');
    var pb = renderFull(setProgress).then(function (c) { return toBlob(c, 'png'); });
    var item;
    try { item = new ClipboardItem({'image/png': pb}); } catch (e) { item = null; }
    var w = item ? navigator.clipboard.write([item]) : pb.then(function (b) { return navigator.clipboard.write([new ClipboardItem({'image/png': b})]); });
    w.then(function () { setProgress(0); status('Copied the full-size sketch. Paste it anywhere.', 'ok'); say('Sketch copied'); })
      .catch(function (e) { setProgress(0); status(e && e.message === 'cancel' ? '' : 'Couldn’t copy the image here. Use Download instead.', e && e.message === 'cancel' ? '' : 'bad'); });
  });

  var zoomCanvas = null;
  function openZoom() {
    if (!img) return;
    var z = $('zoom'), v = $('zoomView');
    z.classList.add('on'); v.innerHTML = ''; v.className = 'view';
    $('zoomInfo').textContent = 'Drawing full size…';
    renderFull(function (f) { $('zoomInfo').textContent = 'Drawing full size… ' + Math.round(f * 100) + '%'; }).then(function (c) {
      if (!z.classList.contains('on')) return;
      zoomCanvas = c; c.style.width = (c.width / (window.devicePixelRatio || 1)) + 'px';
      v.appendChild(c);
      $('zoomInfo').textContent = px(c.width, c.height) + ' · 100%';
      $('zoomFit').textContent = 'Fit';
      v.scrollLeft = (v.scrollWidth - v.clientWidth) / 2; v.scrollTop = (v.scrollHeight - v.clientHeight) / 2;
    }).catch(function (e) { if (!(e && e.message === 'cancel')) $('zoomInfo').textContent = errText(e); });
    $('zoomClose').focus();
  }
  function closeZoom() {
    $('zoom').classList.remove('on');
    if (zoomCanvas) { zoomCanvas.style.width = ''; zoomCanvas.remove(); zoomCanvas = null; }
    $('zoomBtn').focus();
  }
  $('zoomBtn').addEventListener('click', openZoom);
  $('mZoom').addEventListener('click', openZoom);
  $('zoomClose').addEventListener('click', closeZoom);
  $('zoomFit').addEventListener('click', function () {
    var v = $('zoomView'), fit = v.classList.toggle('fit');
    if (zoomCanvas) zoomCanvas.style.width = fit ? '' : (zoomCanvas.width / (window.devicePixelRatio || 1)) + 'px';
    $('zoomFit').textContent = fit ? '100%' : 'Fit';
    if (zoomCanvas) $('zoomInfo').textContent = px(zoomCanvas.width, zoomCanvas.height) + (fit ? ' · fit to screen' : ' · 100%');
  });

  /* ---------- start ---------- */
  syncControls();
  busyButton(false);
  function loadSample() {
    return fetch(SAMPLE.url).then(function (r) { if (!r.ok) throw 0; return r.blob(); })
      .then(function (b) { return loadBlob(b, SAMPLE.name, true, {restore: true}); })
      .catch(function () { $('psub').textContent = ''; $('metaL').textContent = 'Choose a photo to sketch.'; });
  }
  lastPhoto().then(function (rec) {
    if (rec && rec.blob && Date.now() - rec.t < DAY) {
      return loadBlob(rec.blob, rec.name, false, {restore: true}).then(function (ok) {
        if (!ok) return loadSample();
        keptHint();
      });
    }
    if (rec) forgetPhoto();
    return loadSample();
  });
  window.__sketch = {state: state, get img() { return img; }, renderFull: renderFull, setCompare: setCompare};
})();
</script>
</body>
</html>
