<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterglow - Music Video Maker: Turn Any Song into a Psychedelic Music Video</title>
<meta name="description" content="Drop a song and watch it become a psychedelic music video that hits on every beat and explodes on the drop. Export it as MP4 for TikTok, Reels or YouTube - free, no watermark, nothing uploaded.">
<style>
  :root { --bg:#07060b; --panel:#110f18; --line:#262236; --text:#ece8f6; --dim:#8c86a3; --hot:#ff3df2; --cool:#3dfcff; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 "Inter","Segoe UI",system-ui,sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 48px; display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:20px; }
  header { grid-column:1/-1; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { margin:0; font-size:32px; font-weight:900; letter-spacing:-1px;
       background:linear-gradient(90deg,var(--hot),#ffb03d,var(--cool)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { margin:0; color:var(--dim); }
  #stage { position:relative; background:#000; border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center;
           min-height:420px; height:min(78vh, 900px); border:1px solid var(--line); }
  #view { max-width:100%; max-height:100%; display:block; }
  #drop { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px;
          background:radial-gradient(ellipse at 30% 20%, #ff3df233, transparent 60%), radial-gradient(ellipse at 70% 80%, #3dfcff2a, transparent 60%), #07060bee; cursor:pointer; }
  #drop.over { outline:3px dashed var(--hot); outline-offset:-14px; }
  #drop .big { font-size:26px; font-weight:800; }
  #drop .small { color:var(--dim); max-width:420px; }
  #busy { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#000c; padding:14px 20px; border-radius:10px; display:none; }
  aside { display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h2 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--dim); font-weight:700; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg button, .btn { background:#1b1826; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 11px; cursor:pointer; font:inherit; font-size:14px; }
  .seg button.on { background:var(--text); color:#000; border-color:var(--text); }
  .btn.main { width:100%; padding:12px; font-weight:800; font-size:16px; border:0; color:#000; background:linear-gradient(90deg,var(--hot),#ffb03d,var(--cool)); }
  .btn:disabled { opacity:.4; cursor:default; }
  .swatch { width:34px; height:34px; border-radius:50%; padding:0 !important; border:2px solid transparent !important; }
  .swatch.on { border-color:#fff !important; }
  input[type=range] { width:100%; accent-color:var(--hot); }
  input[type=text] { width:100%; background:#1b1826; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font:inherit; margin-top:6px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  #transport { display:flex; gap:8px; align-items:center; margin-top:10px; }
  #transport .btn { flex:none; }
  #seek { flex:1; }
  #time { color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; flex:none; }
  #prog { height:8px; background:#1b1826; border-radius:4px; overflow:hidden; margin-top:10px; display:none; }
  #prog div { height:100%; width:0; background:linear-gradient(90deg,var(--hot),var(--cool)); }
  #msg { color:var(--dim); font-size:13px; margin-top:8px; min-height:18px; }
  #msg a { color:var(--cool); font-weight:700; }
  .info { color:var(--dim); font-size:13px; }
  .info b { color:var(--text); font-weight:600; }
  @media (max-width: 860px) { main { grid-template-columns:1fr; } #stage { height:62vh; min-height:300px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Afterglow</h1>
    <p>Your song, as a psychedelic music video. It hits on every beat and blows up on the drop.</p>
  </header>

  <section>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="drop" tabindex="0">
        <div class="big">Drop a song here</div>
        <div class="small">MP3, WAV, OGG, FLAC, M4A - it stays on your device. Nothing is uploaded.</div>
        <div class="row" style="gap:10px">
          <button class="btn" id="pickBtn">Choose a song</button>
          <button class="btn" id="demoBtn">No song at hand? Play the demo beat</button>
        </div>
        <input id="pick" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.aac,.opus" hidden>
      </div>
      <div id="busy"></div>
    </div>
    <div id="transport">
      <button class="btn" id="play" disabled>▶ Play</button>
      <input id="seek" type="range" min="0" max="1000" value="0" disabled>
      <span id="time">0:00 / 0:00</span>
    </div>
    <p class="info" id="songInfo"></p>
  </section>

  <aside>
    <div class="card">
      <h2>Format</h2>
      <div class="seg" id="fmt">
        <button data-v="9:16" class="on">9:16 Reels</button><button data-v="1:1">1:1</button><button data-v="16:9">16:9 YouTube</button>
      </div>
    </div>
    <div class="card">
      <h2>Look</h2>
      <div class="seg" id="look"></div>
      <div style="margin-top:12px" class="row">
        <label class="info" style="flex:none">Trip level</label>
        <input id="trip" type="range" min="0" max="100" value="60">
      </div>
      <div style="margin-top:10px" class="row">
        <button class="btn" id="reroll">🎲 New take</button>
        <span class="info" id="seedTxt" style="text-align:right"></span>
      </div>
    </div>
    <div class="card">
      <h2>Title</h2>
      <input id="artist" type="text" placeholder="Artist">
      <input id="title" type="text" placeholder="Song title">
    </div>
    <div class="card">
      <h2>Export</h2>
      <div class="seg" id="clip">
        <button data-v="15">Best 15 s</button><button data-v="30" class="on">Best 30 s</button><button data-v="60">Best 60 s</button><button data-v="0">Whole song</button>
      </div>
      <div class="seg" id="quality" style="margin-top:8px">
        <button data-v="720">720p</button><button data-v="1080" class="on">1080p</button>
      </div>
      <button class="btn main" id="export" style="margin-top:12px" disabled>Make the video</button>
      <div id="prog"><div></div></div>
      <div id="msg"></div>
    </div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js"></script>
<script>
(() => {
'use strict';
const el = id => document.getElementById(id);
const FPS = 60;

/* ---------- looks: cosine palettes a + b*cos(2pi(c*t + d)) ---------- */
const LOOKS = [
  { name:'Acid',     p:[[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.33,.67]] },
  { name:'Vapor',    p:[[.6,.4,.7],[.4,.4,.3],[1,1,.5],[.8,.9,.3]] },
  { name:'Chrome',   p:[[.55,.6,.7],[.45,.45,.45],[.8,.8,.8],[.6,.62,.66]] },
  { name:'Inferno',  p:[[.55,.25,.15],[.5,.3,.2],[.8,.8,.6],[0,.15,.25]] },
  { name:'Toxic',    p:[[.4,.55,.35],[.5,.5,.45],[.7,1,.9],[.65,.15,.55]] },
  { name:'Y2K',      p:[[.75,.7,.85],[.3,.3,.25],[1,1,1],[.9,.6,.35]] },
];
const palCss = (p, t) => 'rgb(' + [0,1,2].map(i => Math.round(255 * Math.min(1, Math.max(0, p[0][i] + p[1][i] * Math.cos(6.28318 * (p[2][i] * t + p[3][i])))))).join(',') + ')';

/* ---------- state ---------- */
const S = {
  song:null,        // { buffer, name, frames, bpm, ... }
  track:null,       // per-frame uniforms
  look:0, trip:.6, seed:(Math.random() * 1e6) | 0,
  fmt:'9:16', clip:30, quality:1080,
  playing:false, ctx:null, src:null, t0:0, off:0,
  exporting:false,
};
try {
  const q = new URLSearchParams(location.search);
  if (q.has('seed')) S.seed = parseInt(q.get('seed')) || S.seed;
  if (q.has('look')) S.look = Math.max(0, LOOKS.findIndex(l => l.name.toLowerCase() === q.get('look').toLowerCase()));
} catch (e) {}

/* ---------- tiny seeded rng ---------- */
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }

/* =====================================================================
   AUDIO ANALYSIS - everything the picture reacts to is computed once,
   offline, per video frame. Preview and export read the same table, so
   the exported video is exactly what the preview showed.
   ===================================================================== */
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i + k], ui = im[i + k];
        const vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
        const vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
}

const percentile = (arr, p) => { const a = Float32Array.from(arr).sort(); return a[Math.min(a.length - 1, Math.floor(p * a.length))] || 1e-9; };

async function analyse(buffer, progress) {
  const sr = buffer.sampleRate, N = 2048, hop = sr / FPS;
  const len = buffer.length, ch = buffer.numberOfChannels;
  const mono = new Float32Array(len);
  for (let c = 0; c < ch; c++) { const d = buffer.getChannelData(c); for (let i = 0; i < len; i++) mono[i] += d[i] / ch; }
  const frames = Math.floor(len / hop);
  const bands = [[30, 150], [150, 2000], [2000, 12000]].map(([a, b]) => [Math.max(1, Math.round(a * N / sr)), Math.min(N / 2 - 1, Math.round(b * N / sr))]);
  const E = bands.map(() => new Float32Array(frames));      // log band energy
  const flux = bands.map(() => new Float32Array(frames));   // positive change per band
  const rms = new Float32Array(frames);
  const win = new Float32Array(N).map((_, i) => .5 - .5 * Math.cos(2 * Math.PI * i / N));
  const re = new Float32Array(N), im = new Float32Array(N);
  let prevMag = new Float32Array(N / 2), mag = new Float32Array(N / 2);
  for (let f = 0; f < frames; f++) {
    const start = Math.floor(f * hop + hop / 2 - N / 2);
    let s2 = 0;
    for (let i = 0; i < N; i++) { const v = mono[start + i] || 0; re[i] = v * win[i]; im[i] = 0; s2 += v * v; }
    rms[f] = Math.sqrt(s2 / N);
    fft(re, im);
    for (let k = 0; k < N / 2; k++) mag[k] = Math.log1p(10 * Math.hypot(re[k], im[k]));
    bands.forEach(([a, b], bi) => {
      let e = 0, fl = 0;
      for (let k = a; k <= b; k++) { e += mag[k]; const d = mag[k] - prevMag[k]; if (d > 0) fl += d; }
      E[bi][f] = e / (b - a + 1); flux[bi][f] = fl / (b - a + 1);
    });
    [prevMag, mag] = [mag, prevMag];
    if ((f & 511) === 0) { progress(f / frames); await new Promise(r => setTimeout(r)); }
  }

  // onset strength: bass counts double, it is what people nod to
  const onset = new Float32Array(frames);
  // hi-hats barely count: alone, on the off-beats of an intro or a break, they would pull the grid half a beat over
  const BW = window.__bw ?? 2, MW = window.__mw ?? 1;
  for (let f = 0; f < frames; f++) onset[f] = BW * flux[0][f] + MW * flux[1][f] + .05 * flux[2][f];
  // remove the local mean so steady noise does not read as onsets
  const os = new Float32Array(frames);
  { let acc = 0; const w = 30, q = [];
    for (let f = 0; f < frames; f++) { q.push(onset[f]); acc += onset[f]; if (q.length > w) acc -= q.shift(); os[f] = Math.max(0, onset[f] - acc / q.length); } }
  const osn = percentile(os, .98); for (let f = 0; f < frames; f++) os[f] = Math.min(1.5, os[f] / osn);

  // tempo: autocorrelation of onset strength, weighted toward ~120 BPM
  let bestLag = 30, bestScore = -1, bestPhase = 0;
  const minLag = FPS * 60 / 180, maxLag = FPS * 60 / 72;
  const ac = lag => { let s = 0; const L = Math.floor(lag), fr = lag - L; for (let i = 0; i + L + 1 < frames; i++) s += os[i] * (os[i + L] * (1 - fr) + os[i + L + 1] * fr); return s; };
  {
    // comb: for each tempo, the phase whose grid collects the most onset over the whole song.
    // Coarse pass on the autocorrelation, then a fine pass where the grid has to line up end to end.
    const cands = [];
    for (let lag = minLag; lag <= maxLag; lag += .25) {
      const bpm = 60 * FPS / lag, w = Math.exp(-.5 * Math.pow(Math.log2(bpm / 120) / .9, 2));
      cands.push([ac(lag) * w, lag]);
    }
    cands.sort((x, y) => y[0] - x[0]);
    const grid = (lag, ph) => { let s = 0; for (let x = ph; x < frames - 1; x += lag) { const i = Math.floor(x), fr = x - i; s += os[i] * (1 - fr) + os[i + 1] * fr; } return s; };
    for (const [, c] of cands.slice(0, 4)) {
      for (let lag = c - .3; lag <= c + .3; lag += .01) {
        const bpm = 60 * FPS / lag, w = Math.exp(-.5 * Math.pow(Math.log2(bpm / 120) / .9, 2));
        let best = 0, bph = 0; for (let ph = 0; ph < lag; ph += .5) { const g = grid(lag, ph); if (g > best) { best = g; bph = ph; } }
        const sc = best / (frames / lag) * w;
        if (sc > bestScore) { bestScore = sc; bestLag = lag; bestPhase = bph; }
      }
    }
  }

  // beats: dynamic programming (Ellis 2007). Held close to the comb's tempo: measured on test songs with
  // known beats, 200 keeps quiet passages on the grid and still follows a live band drifting by 4 %.
  const TIGHT = 200;
  const track = P => {
    const score = new Float32Array(frames), back = new Int32Array(frames).fill(-1);
    for (let t = 0; t < frames; t++) {
      let best = 0, arg = -1;
      for (let p = Math.max(0, Math.floor(t - 2 * P)); p <= t - Math.round(P / 2); p++) {
        const v = score[p] - TIGHT * Math.pow(Math.log((t - p) / P), 2);
        if (v > best || arg < 0) { best = v; arg = p; }
      }
      score[t] = os[t] + (arg >= 0 ? Math.max(0, best) : 0);
      back[t] = arg >= 0 && best > 0 ? arg : -1;
    }
    let t = frames - 1, bestEnd = 0;
    for (let i = Math.max(0, frames - Math.ceil(P)); i < frames; i++) if (score[i] > bestEnd) { bestEnd = score[i]; t = i; }
    const bt = [];
    while (t >= 0) { bt.unshift(t); t = back[t]; }
    return bt;
  };
  const P = bestLag;
  // section changes: where the song gets suddenly louder (a drop, drums coming in). They land on a
  // downbeat in nearly all music, so they decide which of the grid's phases is the beat and which beat is one.
  const steps = [];
  { // measured on the bass: before a drop the build-up is often as loud as the drop, but the bass is what arrives
    const nov = new Float32Array(frames), A = 12, B = 30, lo = percentile(E[0], .05), hi = percentile(E[0], .98);
    const cs = new Float64Array(frames + 1); for (let f = 0; f < frames; f++) cs[f + 1] = cs[f] + Math.min(1, Math.max(0, (E[0][f] - lo) / (hi - lo + 1e-9)));
    for (let f = B; f < frames - A; f++) nov[f] = Math.max(0, (cs[f + A] - cs[f]) / A - (cs[f] - cs[f - B]) / B);
    const order = Array.from(nov.keys()).filter(f => nov[f] > .2 && nov[f] >= nov[f - 1] && nov[f] >= nov[f + 1]).sort((x, y) => nov[y] - nov[x]);
    // only the big ones: a syncopated kick after a gap is a step too, but a small one
    for (const f of order) { if (steps.length >= 8 || nov[f] < .5 * nov[order[0]]) break; if (steps.every(g => Math.abs(g - f) > FPS * 4)) steps.push(f); }
  }
  const stepFit = (ph, lag) => steps.reduce((s, f) => { const d = ((f - ph) % lag + lag) % lag, e = Math.min(d, lag - d); return s + Math.exp(-.5 * Math.pow(e / (lag / 12), 2)); }, 0);
  let beats;
  const followed = () => {
    // Anchored on the biggest section step - a drop lands on a one - and followed outwards both ways in
    // overlapping windows of 32 beats. Each window may bend the tempo by 2 % and move the phase by a sixteenth
    // of a beat: enough for a band that drifts, never enough to slide a quarter beat onto a bass line that
    // leads the kick. A section step inside a window pulls the grid onto itself.
    const at = x => { if (x < 0 || x >= frames - 1) return 0; const i = Math.floor(x), fr = x - i; return os[i] * (1 - fr) + os[i + 1] * fr; };
    const near = (x, lag) => steps.reduce((s, f) => s + Math.exp(-.5 * Math.pow((f - x) / (lag / 6), 2)), 0);
    const follow = (a0, dir) => {
      const out = []; let a = a0, lag = P;
      const W = 32, H = 16;
      while (dir > 0 ? a < frames + lag : a > -lag) {
        let bl = lag, ba = a, bs = -1e9;
        for (let dl = -.02; dl <= .0201; dl += .004) for (let dp = -lag / 16; dp <= lag / 16 + 1e-6; dp += lag / 64) {
          const l2 = lag * (1 + dl), a2 = a + dp;
          let sc = -Math.abs(dl) * 2 - Math.abs(dp) / lag * .5;
          for (let j = 0; j < W; j++) { const x = a2 + dir * j * l2; sc += at(x) + 3 * near(x, l2); }
          if (sc > bs) { bs = sc; bl = l2; ba = a2; }
        }
        lag = bl; a = ba;
        for (let j = 0; j < H; j++) out.push(Math.round(a + dir * j * lag));
        a += dir * H * lag;
      }
      return out;
    };
    let anchor = bestPhase % P;
    if (steps.length) anchor = steps[0];
    else { // no clear section change: the comb's phase, or a quarter of a beat off it, whichever carries more onset
      let bo = 0, bs = -1; for (let q = 0; q < 4; q++) { let sc = 0; for (let x = anchor + q * P / 4; x < frames; x += P) sc += at(x); if (sc > bs) { bs = sc; bo = q * P / 4; } }
      anchor += bo;
    }
    const fwd = follow(anchor, 1), bwd = follow(anchor - P, -1);
    return bwd.reverse().concat(fwd).filter(b => b >= 0 && b < frames + P);
  };
  // Two trackers, because each fails where the other holds: the DP slides onto a bass line that masks a soft
  // kick, the window follower loses a band that drifts hard. Whichever puts the song's section steps on its
  // beats wins - a grid a quarter beat off misses every drop - and the onsets it collects break a tie.
  const fit = bt => {
    let st = 0; for (const f of steps) { let m = 1e9; for (const b of bt) m = Math.min(m, Math.abs(b - f)); if (m < P / 8) st++; }
    let on = 0; for (const b of bt) on += os[b] || 0;
    return st * 1e6 + on;
  };
  const cands = [track(P), followed()];
  beats = window.__pick === 0 ? cands[0] : window.__pick === 1 ? cands[1] : fit(cands[1]) > fit(cands[0]) ? cands[1] : cands[0];
  // extend the grid over intro/outro silence so every frame has a beat phase
  while (beats[0] - P > 0) beats.unshift(Math.round(beats[0] - P));
  while (beats[beats.length - 1] + P < frames + P) beats.push(Math.round(beats[beats.length - 1] + P));

  // downbeat: the beat-of-four whose beats carry the most bass onset
  let down = 0, dBest = -1;
  const bassTot = [0, 1, 2, 3].map(o => { let s = 0; for (let i = o; i < beats.length; i += 4) s += flux[0][Math.min(frames - 1, beats[i])] || 0; return s; });
  const bassMax = Math.max(...bassTot) || 1;
  for (let o = 0; o < 4; o++) {
    // a section change on this beat-of-four counts for far more than the bass on it
    let st = 0; for (const f of steps) { let bi = 0; for (let i = 0; i < beats.length; i++) if (Math.abs(beats[i] - f) < Math.abs(beats[bi] - f)) bi = i; if (((bi - o) % 4 + 4) % 4 === 0 && Math.abs(beats[bi] - f) < P / 4) st++; }
    const s = bassTot[o] / bassMax + 2 * st;
    if (s > dBest) { dBest = s; down = o; }
  }
  const bars = [];
  for (let i = down; i < beats.length; i += 4) bars.push(beats[i]);
  if (bars[0] > 0) bars.unshift(Math.max(0, bars[0] - Math.round(4 * P)));

  // loudness per bar -> sections. Bass presence counts, a drop is mostly bass.
  const nb = bars.length - 1;
  const barE = new Float32Array(nb);
  for (let b = 0; b < nb; b++) {
    let r = 0, bs = 0, n = 0;
    for (let f = bars[b]; f < Math.min(frames, bars[b + 1]); f++) { r += rms[f]; bs += E[0][f]; n++; }
    barE[b] = n ? (.6 * r / n) / (percentile(rms, .9) + 1e-9) + .4 * (bs / n) / (percentile(E[0], .9) + 1e-9) : 0;
  }
  const lo = percentile(barE, .08), hi = percentile(barE, .92);
  const level = Array.from(barE, v => Math.min(1, Math.max(0, (v - lo) / (hi - lo + 1e-9))));
  // tiers with hysteresis: 0 calm, 1 groove, 2 peak
  const tier = []; let cur = level[0] > .7 ? 2 : level[0] > .35 ? 1 : 0;
  for (let b = 0; b < nb; b++) {
    const v = level[b];
    if (cur === 0 && v > .42) cur = v > .78 ? 2 : 1;
    else if (cur === 1 && (v > .78 || v < .28)) cur = v > .78 ? 2 : 0;
    else if (cur === 2 && v < .62) cur = v < .28 ? 0 : 1;
    tier.push(cur);
  }
  // drops: entering the peak tier after a quieter stretch, with a real jump in loudness
  const drops = [];
  for (let b = 1; b < nb; b++) {
    const before = Math.max(...level.slice(Math.max(0, b - 4), b));
    if (tier[b] === 2 && tier[b - 1] < 2 && level[b] - Math.min(before, level[b - 1]) > .2) drops.push(b);
  }
  if (!drops.length) { let mb = 0, mj = -1; for (let b = 1; b < nb; b++) { const j = level[b] - level[b - 1]; if (j > mj) { mj = j; mb = b; } } drops.push(mb); }

  // smoothed per-frame band levels for the picture
  const norm = E.map(e => { const l = percentile(e, .05), h = percentile(e, .98); return [l, h]; });
  const band = E.map((e, bi) => {
    const out = new Float32Array(frames); let v = 0; const [l, h] = norm[bi];
    for (let f = 0; f < frames; f++) {
      const x = Math.min(1.2, Math.max(0, (e[f] - l) / (h - l + 1e-9)));
      v += (x - v) * (x > v ? .5 : .08);
      out[f] = v;
    }
    return out;
  });
  const bassHit = new Float32Array(frames);
  { const thr = percentile(flux[0], .9); let v = 0;
    for (let f = 0; f < frames; f++) { const hit = flux[0][f] > thr && flux[0][f] >= (flux[0][f - 1] || 0) && flux[0][f] >= (flux[0][f + 1] || 0); if (hit) v = Math.max(v, Math.min(1, flux[0][f] / (thr * 2))); out(f); v *= Math.exp(-1 / (FPS * .11)); }
    function out(f) { bassHit[f] = v; } }

  progress(1);
  window.__dbg = { steps, P, bestPhase };
  return { frames, duration: frames / FPS, bpm: 60 * FPS / P, beats, bars, level, tier, drops, band, bassHit, os };
}

/* ---------- timeline: per-frame uniforms, from the analysis + seed ----------
   The song is cut into shots, the way an editor would: long takes while it is quiet,
   a cut every bar or two when it grooves, every beat or two at the peak, and a hard cut
   on every drop. Each shot has its own scene, framing and colour, so a cut back to the
   same scene still reads as a new shot. */
const SCENES = ['Aura', 'Tunnel', 'Chrome', 'Fractal', 'Op-Art', 'Gyroid', 'Sphere Grid', 'Synthwave', 'Warp', 'Crystal', 'Spiral', 'Morph'];
// which scenes suit which intensity; the chrome blobs belong everywhere
const POOLS = [[0, 2, 10, 9, 11, 7, 5], [1, 2, 4, 5, 6, 7, 11, 0, 9], [3, 2, 8, 6, 1, 5, 11, 9, 4]];
const SHOT_BEATS = [[16, 8, 8], [8, 4, 4, 8], [4, 2, 2, 4, 1]];
const NF = 16; // floats per frame
function buildTrack(A, seed) {
  const R = rng(seed * 7919 + 13);
  const { frames, beats, bars, level, tier, drops, band, bassHit } = A;
  const nb = bars.length - 1;
  // beat index of each bar start, and the bar each beat is in
  const barBeat = bars.map(f => { let k = 0; while (k < beats.length - 1 && beats[k] < f - 2) k++; return k; });
  const barOfBeat = new Int32Array(beats.length);
  for (let b = 0, k = 0; k < beats.length; k++) { while (b < nb - 1 && barBeat[b + 1] <= k) b++; barOfBeat[k] = b; }
  const tierAt = k => tier[barOfBeat[k]] || 0;
  // shots
  const shots = [], lastUsed = {};
  let k = 0, prev = -1;
  while (k < beats.length - 1) {
    const t = tierAt(k), b = barOfBeat[k];
    let len = SHOT_BEATS[t][(R() * SHOT_BEATS[t].length) | 0];
    // the bar before a new phrase: chop it up
    const inPhrase = (b + 1) % 8;
    if (t > 0 && inPhrase === 0 && R() < .6) len = Math.min(len, R() < .5 ? 1 : 2);
    // never run over a tier change or a drop: those get their own cut on the downbeat
    let end = k + len;
    // a shot that starts inside a bar ends on the next downbeat, so the long shots after a chop sit on the bar again
    if (barBeat[b] !== k && barBeat[b + 1] !== undefined) end = Math.min(end, barBeat[b + 1]);
    for (let bb = b + 1; bb < nb && barBeat[bb] < end; bb++) if (tier[bb] !== tier[b] || drops.includes(bb)) { end = barBeat[bb]; break; }
    if (end <= k) end = k + 1;
    // the scene of this pool that has been off screen longest, so a video shows as many as it can
    const pool = POOLS[t].filter(x => x !== prev);
    let sc = pool[0], oldest = Infinity;
    for (const x of pool) { const at = (lastUsed[x] ?? -1e9) + R() * 3; if (at < oldest) { oldest = at; sc = x; } }
    lastUsed[sc] = shots.length;
    const startBar = barBeat[b] === k ? b : -1;
    shots.push({ k0: k, k1: end, f0: beats[k], f1: beats[Math.min(beats.length - 1, end)], scene: sc, v: R(), hue: R(), tier: t,
                 // quiet shots dissolve into the next one, the rest cut hard
                 fade: t === 0 && len >= 8, drop: startBar >= 0 && drops.includes(startBar) });
    prev = sc; k = end;
  }
  // a drop or a change of intensity is always a hard cut, never the end of a dissolve
  shots.forEach((sh, i) => { const nx = shots[i + 1]; if (sh.fade && nx && (nx.drop || nx.tier !== sh.tier)) sh.fade = false; });
  const T = new Float32Array(frames * NF);
  let travel = 0, impact = 0, cut = 0, bi = 0, bar = 0, si = 0;
  for (let f = 0; f < frames; f++) {
    while (bi < beats.length - 2 && beats[bi + 1] <= f) bi++;
    while (bar < nb - 1 && bars[bar + 1] <= f) bar++;
    const prevSi = si;
    while (si < shots.length - 1 && shots[si + 1].f0 <= f) si++;
    const sh = shots[si], nx = shots[si + 1];
    const b0 = beats[bi], b1 = beats[bi + 1] || b0 + 30;
    const beatPh = Math.min(1, Math.max(0, (f - b0) / (b1 - b0)));
    const bar0 = bars[bar], bar1 = bars[bar + 1] || bar0 + 120;
    const barPh = Math.min(1, Math.max(0, (f - bar0) / (bar1 - bar0)));
    const lv = (level[bar] || 0) * (1 - barPh) + (level[Math.min(nb - 1, bar + 1)] || 0) * barPh;
    const en = Math.min(1, .55 * lv + .45 * (band[0][f] * .6 + band[1][f] * .4));
    const grid = Math.pow(1 - beatPh, 4) * (.25 + .5 * lv);
    const kick = Math.min(1, Math.max(bassHit[f], grid));
    if (si !== prevSi || f === 0) { if (sh.drop) impact = 1; if (!shots[si - 1] || !shots[si - 1].fade) cut = 1; }
    impact *= Math.exp(-1 / (FPS * .5));
    cut *= Math.exp(-1 / (FPS * .07));
    travel += (.35 + 1.4 * en + 1.6 * kick + 2 * impact) / FPS;
    // a fading shot dissolves over its last two beats into the next one; mix runs 0 -> 1
    let sb = sh.scene, vb = sh.v, mix = 0;
    if (sh.fade && nx) {
      const fs = beats[Math.max(sh.k0, sh.k1 - 2)], fe = sh.f1;
      if (f >= fs && fe > fs) { const x = (f - fs) / (fe - fs); mix = x * x * (3 - 2 * x); sb = nx.scene; vb = nx.v; }
    }
    // at the peak the colours step on every other beat
    const hue = sh.hue + (sh.tier === 2 ? .17 * (((bi - sh.k0) >> 1) % 3) : 0);
    const o = f * NF;
    T[o] = band[0][f]; T[o + 1] = band[1][f]; T[o + 2] = band[2][f];
    T[o + 3] = kick; T[o + 4] = en; T[o + 5] = impact; T[o + 6] = beatPh; T[o + 7] = barPh;
    T[o + 8] = travel; T[o + 9] = sh.scene; T[o + 10] = sb; T[o + 11] = mix;
    T[o + 12] = sh.v; T[o + 13] = vb; T[o + 14] = hue; T[o + 15] = cut;
  }
  return T;
}

/* =====================================================================
   RENDERING - WebGL2: scene pass -> feedback pass -> finish pass
   ===================================================================== */
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

const COMMON = `#version 300 es
precision highp float;
uniform vec2 R;
uniform float T, BASS, MID, HIGH, KICK, EN, IMP, BEAT, BAR, TRAV, MIXV, VA, VB, TRIP, FRAME, HUE, CUT;
uniform int SA, SB;
uniform vec3 PA, PB, PC, PD;
out vec4 o;
#define PI 3.14159265
vec3 pal(float t){ return PA + PB*cos(6.28318*(PC*(t + HUE) + PD)); }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx)*.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y)*q.z); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=rot(.5)*p*2.03+3.1; a*=.5; } return v; }
`;

const SCENE_FS = COMMON + `
// ---- 0 Aura: domain-warped liquid gradient, glossy
vec3 aura(vec2 p, float v){
  float t = TRAV*.08 + v*20.;
  p *= (1. - .08*KICK)*.55;
  vec2 q = vec2(fbm(p*1.1 + t), fbm(p*1.1 - t + 5.2));
  vec2 r = vec2(fbm(p*1.3 + 3.*q + vec2(1.7,9.2) + .4*BASS), fbm(p*1.3 + 3.*q + vec2(8.3,2.8) - t*.6));
  float f = fbm(p + (2.6 + 1.2*TRIP)*r);
  float g = fbm(p + (2.6 + 1.2*TRIP)*r + .015);
  float spec = pow(clamp((g - f)*40. + .5, 0., 1.), 6.);
  vec3 c = pal(f*1.1 + length(q)*.5 + v + T*.015);
  // deep shadows between the folds, light only on the crests
  c *= pow(smoothstep(.12, .8, f), 1.2)*(1.15 + .5*BASS) + .04;
  c += spec*smoothstep(.4, .7, f)*(.25 + .6*HIGH)*vec3(1.,.95,.9);
  return c;
}
// ---- 1 Tunnel: kaleidoscopic neon tunnel
vec3 tunnel(vec2 p, float v){
  p *= rot(T*.15*(v-.5) + .3*sin(TRAV*.2));
  float r = length(p) + 1e-3, a = atan(p.y,p.x);
  float k = 4. + floor(v*4.)*2.;
  float z = .6/r + TRAV*1.2;
  float seg = a*k/(2.*PI);
  float sa = abs(fract(seg) - .5);
  float ring = abs(fract(z) - .5);
  float web = abs(fract(z*.5 + sa*(1.+TRIP)) - .5);
  vec3 c = vec3(0.);
  c += pal(z*.08 + v) * (.02/(ring*ring*30. + .02)) * (.4 + 1.2*KICK);
  c += pal(z*.08 + .33 + v) * (.012/(web*web*20. + .012)) * (.3 + .9*MID);
  c += pal(.66 + v + z*.05) * smoothstep(.06, 0., sa*r) * (.5 + HIGH);
  c *= smoothstep(0., .5, r) * (1. + .5*EN);
  c += pal(T*.03 + v) * .08 / (r*r*20. + .1) * (1. + 2.*BASS);
  return c;
}
// ---- 2 Chrome: raymarched liquid chrome metaballs
float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b-a)/k, 0., 1.); return mix(b,a,h) - k*h*(1.-h); }
float chromeMap(vec3 p, float v){
  float t = TRAV*.45;
  float d = 1e9;
  int count = 3 + int(v*3.99);
  for (int i=0; i<6; i++){
    if (i >= count) break;
    float fi = float(i);
    vec3 c = vec3(sin(t*.7 + fi*2.1 + v*6.), cos(t*.6 + fi*1.7), sin(t*.5 + fi*2.9)) * (R.x < R.y ? vec3(.75,1.4,.6) : vec3(1.3,.85,.6)) * (.6 + .5*EN);
    d = smin(d, length(p - c) - (.55 + (i==0 ? .4*BASS : .15*MID)), .7);
  }
  return d + .05*sin(p.x*7. + T*2.)*sin(p.y*7. - T)*sin(p.z*7.)*(.3 + 1.4*HIGH*TRIP);
}
vec3 chromeShade(vec3 rd, vec3 n, float v){
  vec3 rf = reflect(rd, n);
  float fres = pow(1. - max(0., dot(-rd, n)), 3.);
  // studio: soft light strips + a coloured horizon reads as chrome
  float strips = smoothstep(.75, .95, sin(rf.y*6. + rf.x*2. + TRAV*.3)) + smoothstep(.9, .99, sin(rf.x*9. - 1.));
  vec3 env = pal(rf.y*.5 + rf.x*.2 + v + T*.02)*(.15 + .8*smoothstep(-.3, .7, rf.y)) + strips*vec3(.9);
  // thin-film shimmer across the whole surface, strongest at grazing angles
  vec3 iri = pal(dot(n, vec3(.6,.8,.3))*1.2 + fres + v + TRAV*.05);
  return env*(.3 + .3*fres) + iri*(.15 + .8*fres)*.7 + .2*KICK*pal(v);
}
vec3 chrome(vec2 p, float v){
  vec3 ro = vec3(0., 0., 3. - .35*KICK), rd = normalize(vec3(p, -1.3));
  rd.xz *= rot(.2*sin(TRAV*.1)); ro.xz *= rot(.2*sin(TRAV*.1));
  float d, t = 0., glow = 0.;
  for (int i=0; i<72; i++){ d = chromeMap(ro + rd*t, v); glow += .02/(.05 + d*d*8.); if (d < .002 || t > 8.) break; t += d*.9; }
  vec3 bg = pal(p.y*.3 + v + .5)*(.06 + .18*fbm(p*1.5 + TRAV*.1)) + pal(T*.02 + v)*glow*.025*(1. + 2.*BASS);
  if (t > 8.) return bg;
  vec3 pos = ro + rd*t;
  vec2 e = vec2(.002, 0.);
  vec3 n = normalize(vec3(chromeMap(pos+e.xyy,v)-chromeMap(pos-e.xyy,v), chromeMap(pos+e.yxy,v)-chromeMap(pos-e.yxy,v), chromeMap(pos+e.yyx,v)-chromeMap(pos-e.yyx,v)));
  return chromeShade(rd, n, v);
}
// ---- 3 Fractal: kaleidoscope over a Kali-set fold
vec3 fractal(vec2 p, float v){
  p *= rot(TRAV*.08 + v*6.);
  p *= 1. - .12*KICK;
  float n = 5. + floor(v*4.);
  float a = atan(p.y,p.x), r = length(p);
  a = mod(a, 2.*PI/n); a = abs(a - PI/n);
  p = vec2(cos(a), sin(a))*r;
  vec2 z = p*(1.35 - .35*EN);
  vec2 cst = vec2(.82 + .08*sin(TRAV*.13 + v*9.), .58 + .08*cos(TRAV*.11)) + .04*BASS;
  vec3 acc = vec3(0.); float m = 1e9;
  for (int i=0; i<9; i++){
    z = abs(z)/dot(z,z) - cst;
    m = min(m, abs(z.y));
    acc += pal(float(i)*.09 + length(z)*.15 + T*.02 + v) * exp(-length(z)*(2.4 - TRIP));
  }
  vec3 c = acc*.1*(1. + .5*EN) + pal(m*2. + v + .5)*smoothstep(.05, 0., m)*(.6 + 1.5*HIGH);
  return pow(c, vec3(1.35))*1.3;
}
// ---- 4 Op-Art: warped moire rings
vec3 opart(vec2 p, float v){
  vec2 q = p*rot(TRAV*.1);
  float w = fbm(q*1.5 + TRAV*.15)*(1.5 + 2.*TRIP)*(.6 + BASS);
  float a = sin(length(q - vec2(.25,0.))*38. - TRAV*4. + w*4.);
  float b = sin(length(q + vec2(.25,0.))*38. + TRAV*3. - w*3.);
  float m = a*b;
  float line = smoothstep(.0, .15, m) ;
  vec3 c = mix(pal(v + w*.2 + T*.02)*.08, pal(v + length(p)*.4 + .3)*(.8 + .6*MID), line);
  c += pal(v + .6)*pow(1. - abs(m), 18.)*(.6 + 1.2*HIGH);
  return c*(.75 + .5*KICK);
}
// ---- 5 Gyroid: flight through an endless glassy lattice
float gyr(vec3 p, float v){
  float sc = 2.5 + v*1.5;
  vec3 q = p*sc;
  return (abs(dot(sin(q), cos(q.yzx))) - .02 - .1*BASS*TRIP)/sc*.7;
}
vec3 gyroid(vec2 p, float v){
  // see-through: the ray never stops, it gathers light from every thin shell it crosses
  vec3 ro = vec3(.3*sin(TRAV*.2), .3*cos(TRAV*.17), TRAV*.6), rd = normalize(vec3(p, 1.));
  rd.xy *= rot(TRAV*.08 + v*6.);
  vec3 c = vec3(0.);
  float t = .05;
  for (int i=0; i<64; i++){
    vec3 q = ro + rd*t;
    float d = abs(gyr(q, v));
    float w = .0025 + .004*KICK;
    // shells right in front of the lens fade out instead of flashing across the frame as the camera passes them
    c += pal(q.z*.15 + t*.12 + v)*w/(d + w)*exp(-t*.45)*smoothstep(.15, .9, t)*(.08 + .06*MID);
    t += max(d*.8, .02);
    if (t > 7.) break;
  }
  return c*(.75 + .35*EN) + pal(v + .5)*.03;
}
// ---- 6 Sphere grid: a field of chrome balls bouncing to the bass
float sgMap(vec3 p, float v, out vec2 id){
  id = floor(p.xz);
  vec3 q = p; q.xz = fract(p.xz) - .5;
  float h = noise(id*.37 + TRAV*.25);
  q.y -= -.3 + h*h*(.4 + 1.6*EN) + .5*BASS*step(.5, fract(h*7.));
  return min(length(q) - (.18 + .14*h + .08*KICK), p.y + .55);
}
vec3 spheregrid(vec2 p, float v){
  vec3 ro = vec3(TRAV*.4, 1.4 + .3*sin(TRAV*.1), TRAV*.9), rd = normalize(vec3(p, 1.3));
  rd.yz *= rot(.45); rd.xz *= rot(.3*sin(TRAV*.07) + v);
  float t = 0., d; vec2 id;
  for (int i=0; i<80; i++){ d = sgMap(ro + rd*t, v, id); if (d < .002 || t > 16.) break; t += d*.7; }
  vec3 bg = pal(rd.y*.6 + v + .6)*.12;
  if (t > 16.) return bg;
  vec3 pos = ro + rd*t;
  vec2 e = vec2(.002, 0.), dummy;
  vec3 n = normalize(vec3(sgMap(pos+e.xyy,v,dummy)-sgMap(pos-e.xyy,v,dummy), sgMap(pos+e.yxy,v,dummy)-sgMap(pos-e.yxy,v,dummy), sgMap(pos+e.yyx,v,dummy)-sgMap(pos-e.yyx,v,dummy)));
  float fog = exp(-t*.16);
  if (pos.y < -.54){
    // floor: a dark mirror with a neon grid
    vec2 g = abs(fract(pos.xz) - .5);
    float line = smoothstep(.48, .5, max(g.x, g.y));
    return mix(bg, pal(v + pos.z*.02)*line*(.4 + KICK) + .03, fog);
  }
  vec3 c = chromeShade(rd, n, v + h21(id)*.4);
  return mix(bg, c, fog);
}
// ---- 7 Synthwave: grid floor, striped sun, mountains
vec3 synthwave(vec2 p, float v){
  float hz = -.05 + .1*(v - .5);
  vec3 c;
  if (p.y > hz){
    c = mix(pal(v + .55)*.35, pal(v + .85)*.06, smoothstep(hz, 1.2, p.y));
    vec2 sp = p - vec2(0., hz + .42);
    float sr = .48 + .04*BASS;
    float sun = smoothstep(sr, sr - .01, length(sp));
    float band = step(.0, sin((sp.y + TRAV*.05)*60.)) + step(.12, sp.y);
    sun *= min(1., band);
    c = mix(c, mix(pal(v + .1), pal(v + .3), smoothstep(-.4, .4, sp.y))*1.4, sun);
    c += pal(v + .2)*.12/(length(sp)*3. + .3)*(1. + BASS);
    float m = hz + .05 + .22*fbm(vec2(p.x*2.2 + v*9., 1.))*(1. - .4*abs(p.x));
    c = mix(c, pal(v + .7)*.04, smoothstep(m + .004, m - .004, p.y));
    c += pal(v + .4)*smoothstep(.006, .0, abs(p.y - m))*.6;
  } else {
    float z = .35/(hz - p.y + .001);
    vec2 g = vec2(p.x*z, z + TRAV*2.2);
    vec2 gl = abs(fract(g) - .5);
    float w = .03*z;
    float line = smoothstep(.5 - w - .02, .5, max(gl.x, gl.y));
    c = pal(v + .9)*.03 + pal(v + .35 + g.y*.01)*line*(.6 + 1.4*KICK)*exp(-z*.06);
  }
  return c;
}
// ---- 8 Warp: hyperspace streaks
vec3 warp(vec2 p, float v){
  float a = atan(p.y, p.x), r = length(p);
  vec3 c = pal(v + .6)*.03/(r + .05);
  for (int l=0; l<3; l++){
    float fl = float(l);
    float n = 60. + fl*40.;
    float cell = floor((a/(2.*PI) + .5)*n + fl*.37);
    float rnd = h21(vec2(cell, fl + floor(v*10.)));
    float ca = abs(fract((a/(2.*PI) + .5)*n + fl*.37) - .5);
    float z = fract(rnd*7. - TRAV*(.5 + rnd) *(.6 + .3*fl));
    float head = z*1.6, len = (.08 + .5*EN + .6*KICK)*z;
    float s = smoothstep(head, head - .02, r)*smoothstep(head - len - .01, head - len + .03, r);
    s *= smoothstep(.5, .1, ca)*step(.45, rnd);
    c += pal(rnd + v + fl*.2)*s*(1.2 + HIGH);
  }
  return c + pal(v)*.08*KICK/(r*r*30. + .2);
}
// ---- 9 Crystal: stained-glass shards that burst on the kick
vec3 crystal(vec2 p, float v){
  p *= 2.2 + v*1.5;
  p += vec2(TRAV*.15, TRAV*.05);
  vec2 ip = floor(p), fp = fract(p);
  float d1 = 9., d2 = 9.; vec2 cid = vec2(0.);
  for (int y=-1; y<=1; y++) for (int x=-1; x<=1; x++){
    vec2 g = vec2(x, y), o = vec2(h21(ip + g), h21(ip + g + 17.));
    o = .5 + .4*sin(TRAV*.4 + 6.28*o);
    float d = length(g + o - fp);
    if (d < d1){ d2 = d1; d1 = d; cid = ip + g; } else if (d < d2) d2 = d;
  }
  float edge = d2 - d1;
  float r = h21(cid);

  c *= .7 + .6*smoothstep(.0, .5, d1);
  float lead = smoothstep(.03 + .06*KICK, .0, edge);
  c = mix(c, pal(v + .5)*1.6*(.4 + KICK), lead);
  return c;
}
// ---- 10 Spiral: hypnotic logarithmic spiral
vec3 spiral(vec2 p, float v){
  float a = atan(p.y, p.x), r = length(p) + 1e-3;
  float arms = 2. + floor(v*4.);
  float s = a*arms/(2.*PI)*1. + log(r)*(2. + 2.*v) - TRAV*1.4;
  float band = sin(s*6.2832);
  float w = .2 + .3*(1. - EN);
  vec3 c = mix(pal(v + s*.05)*.08, pal(v + .3 + r*.3 + s*.03), smoothstep(-w, w, band));
  c *= smoothstep(.0, .25, r);
  c += pal(v + .6)*smoothstep(.06, .0, abs(band))*(.4 + HIGH);
  return c*(.8 + .5*KICK);
}
// ---- 11 Morph: one chrome shape melting from form to form
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
float shapeOf(int k, vec3 p){
  if (k == 0) return length(p) - .95;
  if (k == 1) return sdBox(p, vec3(.7)) - .08;
  if (k == 2) return length(vec2(length(p.xz) - .75, p.y)) - .3;
  return (abs(p.x) + abs(p.y) + abs(p.z) - 1.15)*.57;
}
float morphMap(vec3 p, float v){
  p.xz *= rot(TRAV*.3); p.xy *= rot(TRAV*.21 + v*3.);
  p.xz *= rot(p.y*(.6*BASS + .3*sin(TRAV*.2))*TRIP);
  float m = TRAV*.12 + v*4.;
  int k = int(floor(m)) % 4;
  float x = smoothstep(.55, 1., fract(m));
  float d = mix(shapeOf(k, p), shapeOf((k + 1) % 4, p), x);
  return d + .03*sin(p.x*9. + T*3.)*sin(p.y*9.)*sin(p.z*9.)*(.2 + HIGH*TRIP);
}
vec3 morph(vec2 p, float v){
  vec3 ro = vec3(0., 0., 2.6 - .3*KICK), rd = normalize(vec3(p, -1.3));
  float t = 0., d, glow = 0.;
  for (int i=0; i<72; i++){ d = morphMap(ro + rd*t, v); glow += .02/(.05 + d*d*8.); if (d < .002 || t > 7.) break; t += d*.8; }
  vec3 bg = pal(p.y*.4 + v + .5)*(.05 + .12*fbm(p*2. - TRAV*.1)) + pal(v + .3)*glow*.02*(1. + 2.*BASS);
  if (t > 7.) return bg;
  vec3 pos = ro + rd*t;
  vec2 e = vec2(.002, 0.);
  vec3 n = normalize(vec3(morphMap(pos+e.xyy,v)-morphMap(pos-e.xyy,v), morphMap(pos+e.yxy,v)-morphMap(pos-e.yxy,v), morphMap(pos+e.yyx,v)-morphMap(pos-e.yyx,v)));
  return chromeShade(rd, n, v);
}
vec3 scene(int s, vec2 p, float v){
  // every shot frames its scene differently: closer or wider, and turned
  p = rot((fract(v*3.7) - .5)*1.6)*p*mix(.7, 1.35, fract(v*7.3));
  if (s == 0) return aura(p, v);
  if (s == 1) return tunnel(p, v);
  if (s == 2) return chrome(p, v);
  if (s == 3) return fractal(p, v);
  if (s == 4) return opart(p, v);
  if (s == 5) return gyroid(p, v);
  if (s == 6) return spheregrid(p, v);
  if (s == 7) return synthwave(p, v);
  if (s == 8) return warp(p, v);
  if (s == 9) return crystal(p, v);
  if (s == 10) return spiral(p, v);
  return morph(p, v);
}
void main(){
  vec2 p = (gl_FragCoord.xy - .5*R)/min(R.x, R.y)*2.;
  vec3 c = scene(SA, p, VA);
  if (MIXV > 0.001 && SB != SA){
    vec3 d = scene(SB, p, VB);
    // noise dissolve with a hot edge
    // each pixel switches when MIXV passes its own threshold n, so MIXV 0 is all A and 1 is all B
    float n = clamp(fbm(p*2.2 + 7.)*1.1 - .05 + .08*length(p), 0., 1.);
    float x = MIXV*1.2 - .1;
    float m = smoothstep(n - .06, n + .06, x);
    float edge = smoothstep(.07, 0., abs(x - n))*step(.001, MIXV)*step(MIXV, .999);
    c = mix(c, d, m) + edge*pal(n + T*.1)*1.5;
  }
  // bright palettes would blow out the additive scenes; even them out
  o = vec4(c*.5/max(dot(PA, vec3(1./3.)), .3), 1.);
}`;

const FEED_FS = COMMON + `
uniform sampler2D SCN, FB;
void main(){
  vec2 uv = gl_FragCoord.xy/R;
  vec2 c = uv - .5;
  // previous frame, pulled inward and twisted: the trails breathe with the music
  float zoom = 1. - (.004 + .012*EN + .02*KICK)*TRIP;
  c = rot((.002 + .006*MID)*TRIP*sign(VA - .5))*c*zoom;
  c += .003*TRIP*vec2(fbm(uv*3. + T*.2) - .5, fbm(uv*3. - T*.2 + 4.) - .5);
  vec3 prev = texture(FB, c + .5).rgb;
  vec3 cur = texture(SCN, uv).rgb;
  // trails only where the new frame is darker, and they fade fast: a max() that held longer
  // dilated every bright speck over the dark gaps until the picture washed out
  float keep = (.45 + .3*TRIP)*(1. - .6*IMP)*(1. - .85*CUT);
  prev = max(prev*keep - .01, 0.);
  o = vec4(cur + max(prev*vec3(1., .96, 1.04) - cur, 0.)*.85, 1.);
}`;

const FINAL_FS = COMMON + `
uniform sampler2D SRC;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
void main(){
  vec2 uv = gl_FragCoord.xy/R;
  // a hard cut tears for a few frames: horizontal slices jump sideways
  float sl = floor(uv.y*28.);
  uv.x += CUT*step(.55, h21(vec2(sl, FRAME + 1.)))*(h21(vec2(sl, FRAME)) - .5)*.12*(.3 + TRIP);
  vec2 d = uv - .5;
  float ca = (.0015 + .006*KICK + .02*IMP + .004*HIGH + .03*CUT)*(.4 + TRIP);
  vec3 col;
  col.r = texture(SRC, uv + d*ca*2.).r;
  col.g = texture(SRC, uv).g;
  col.b = texture(SRC, uv - d*ca*2.).b;
  // cheap bloom: ring of taps, only the bright part
  vec3 bl = vec3(0.);
  for (int i=0; i<12; i++){
    float a = float(i)*PI/6. + FRAME*.1;
    for (int j=1; j<=2; j++){
      vec3 s = texture(SRC, uv + vec2(cos(a), sin(a))*float(j)*.012*vec2(R.y/R.x, 1.)).rgb;
      bl += max(s - .6, 0.);
    }
  }
  col += bl/24.*(1.2 + 1.5*EN);
  col = aces(col*(1.05 + .3*KICK)) + IMP*.5*pal(T*.3);
  col *= 1. - .55*pow(length(d*vec2(R.x/R.y, 1.)*.9), 2.5);
  col += (h21(gl_FragCoord.xy + FRAME*17.31) - .5)*(.05 + .04*HIGH);
  o = vec4(col, 1.);
}`;

class Renderer {
  constructor(canvas) {
    this.c = canvas;
    const gl = this.gl = canvas.getContext('webgl2', { antialias:false, preserveDrawingBuffer:true, premultipliedAlpha:false });
    if (!gl) throw new Error('This browser has no WebGL2.');
    this.half = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
    gl.getExtension('OES_texture_float_linear');
    this.progs = { scene: this.prog(SCENE_FS), feed: this.prog(FEED_FS), fin: this.prog(FINAL_FS) };
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    this.w = this.h = 0;
  }
  prog(fs) {
    const gl = this.gl, p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p, u };
  }
  target(w, h) {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, this.half ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, this.half ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    return { t, fb };
  }
  // the heavy scenes are drawn at a fraction of the output size; the feedback and finish passes run at full size
  resize(w, h, sceneScale) {
    if (w === this.w && h === this.h && sceneScale === this.ss) return;
    this.w = this.c.width = w; this.h = this.c.height = h; this.ss = sceneScale;
    this.sw = Math.round(w * sceneScale); this.sh = Math.round(h * sceneScale);
    this.scn = this.target(this.sw, this.sh);
    this.fb = [this.target(w, h), this.target(w, h)];

  }
  reset() { if (!this.fb) return; const gl = this.gl; for (const f of this.fb) { gl.bindFramebuffer(gl.FRAMEBUFFER, f.fb); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); } this.ping = 0; }
  uniforms(pr, U, w, h) {
    const gl = this.gl, u = pr.u;
    gl.useProgram(pr.p);
    gl.uniform2f(u.R, w, h);
    for (const k in U) if (u[k] !== undefined) (Array.isArray(U[k]) ? gl.uniform3fv(u[k], U[k]) : (k === 'SA' || k === 'SB') ? gl.uniform1i(u[k], U[k]) : gl.uniform1f(u[k], U[k]));

  draw(U) {
    const gl = this.gl;
    gl.bindVertexArray(null);

    // 2 feedback
    const src = this.fb[this.ping], dst = this.fb[1 - this.ping];

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.scn.t); gl.uniform1i(this.progs.feed.u.SCN, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src.t); gl.uniform1i(this.progs.feed.u.FB, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    this.ping = 1 - this.ping;
    // 3 finish to screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.w, this.h);
    this.uniforms(this.progs.fin, U, this.w, this.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dst.t); gl.uniform1i(this.progs.fin.u.SRC, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

function uniformsAt(f) {
  const T = S.track, A = S.song;
  f = Math.max(0, Math.min(A.frames - 1, f));
  const o = f * NF, P = LOOKS[S.look].p;
  return {
    T: f / FPS, FRAME: f % 1000, BASS: T[o], MID: T[o + 1], HIGH: T[o + 2], KICK: T[o + 3], EN: T[o + 4], IMP: T[o + 5],
    BEAT: T[o + 6], BAR: T[o + 7], TRAV: T[o + 8], SA: T[o + 9], SB: T[o + 10], MIXV: T[o + 11], VA: T[o + 12], VB: T[o + 13], HUE: T[o + 14], CUT: T[o + 15],
    TRIP: S.trip, PA: P[0], PB: P[1], PC: P[2], PD: P[3],
  };
}

/* ---------- compositing: WebGL picture + title card on one 2D canvas ---------- */
const view = el('view'), vctx = view.getContext('2d');
const glCanvas = document.createElement('canvas');
let R = null;

function dims(fmt, long) {
  const [a, b] = fmt.split(':').map(Number);
  let w, h;
  if (a >= b) { w = long; h = Math.round(long * b / a); } else { h = long; w = Math.round(long * a / b); }
  return [w & ~1, h & ~1];
}

function drawTitle(ctx, w, h, tClip) {
  const artist = el('artist').value.trim(), title = el('title').value.trim();
  if (!artist && !title) return;
  // in at 0.4 s, out at 4.5 s
  const a = Math.min(1, Math.max(0, (tClip - .4) / .6)) * Math.min(1, Math.max(0, (4.5 - tClip) / .8));
  if (a <= 0) return;
  const u = Math.min(w, h) / 1080, rise = (1 - a) * 30 * u;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.globalCompositeOperation = 'difference';
  ctx.fillStyle = '#fff';
  const x = 70 * u, y = h - 150 * u + rise;
  ctx.textBaseline = 'alphabetic';
  ctx.font = `600 ${30 * u}px "Inter","Helvetica Neue",Arial,sans-serif`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${8 * u}px`;
  ctx.fillText(artist.toUpperCase(), x, y - 96 * u);
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${-2 * u}px`;
  let size = 96 * u;
  ctx.font = `900 ${size}px "Inter","Helvetica Neue",Arial,sans-serif`;
  while (ctx.measureText(title).width > w - 2 * x && size > 30 * u) { size -= 4 * u; ctx.font = `900 ${size}px "Inter","Helvetica Neue",Arial,sans-serif`; }
  ctx.fillText(title, x, y);
  ctx.restore();
}

function frameTo(ctx, w, h, f, tClip) {
  R.draw(uniformsAt(f));
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(glCanvas, 0, 0, w, h);
  drawTitle(ctx, w, h, tClip);
}

/* ---------- preview ---------- */
function previewSize() {
  const st = el('stage'), [aw, ah] = [st.clientWidth, st.clientHeight];
  const [a, b] = S.fmt.split(':').map(Number);
  let w = aw, h = aw * b / a;
  if (h > ah) { h = ah; w = ah * a / b; }
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  const cap = 900 / Math.max(pw, ph);
  if (cap < 1) { pw = Math.round(pw * cap); ph = Math.round(ph * cap); }
  view.style.width = Math.round(w) + 'px'; view.style.height = Math.round(h) + 'px';
  return [pw & ~1, ph & ~1];
}

let previewFrame = 0;
function renderPreview() {
  if (!S.song || S.exporting) return;
  const [w, h] = previewSize();
  if (view.width !== w || view.height !== h) { view.width = w; view.height = h; }
  R.resize(w, h, .6);
  const t = currentTime();
  const f = Math.floor(t * FPS);
  frameTo(vctx, w, h, f, t - clipRange()[0]);
  previewFrame = f;
  el('seek').value = Math.round(1000 * t / S.song.duration);
  el('time').textContent = fmtTime(t) + ' / ' + fmtTime(S.song.duration);
}
// one loop at a time: every play() used to start another, so each seek doubled the work per frame
let loopId = 0;
function loop(id) { if (S.playing && id === loopId) { renderPreview(); requestAnimationFrame(() => loop(id)); } }
const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

function currentTime() { return S.playing ? S.off + (S.ctx.currentTime - S.t0) : S.off; }
function play() {
  if (!S.song) return;
  S.ctx = S.ctx || new AudioContext();
  S.ctx.resume();
  if (S.off >= S.song.duration - .1) S.off = 0;
  S.src = S.ctx.createBufferSource();
  S.src.buffer = S.song.buffer;
  S.src.connect(S.ctx.destination);
  S.src.start(0, S.off);
  S.t0 = S.ctx.currentTime;
  S.playing = true;
  S.src.onended = () => { if (S.playing && currentTime() >= S.song.duration - .05) { pause(); S.off = 0; } };
  el('play').textContent = '❚❚ Pause';
  const id = ++loopId;
  requestAnimationFrame(() => loop(id));
}
function pause() {
  if (!S.playing) return;
  S.off = currentTime();
  S.playing = false;
  try { S.src.onended = null; S.src.stop(); } catch (e) {}
  el('play').textContent = '▶ Play';
}
function seek(t) {
  const was = S.playing;
  if (was) pause();
  S.off = Math.max(0, Math.min(S.song.duration - .05, t));
  R.reset();
  if (was) play(); else renderPreview();
}

/* ---------- the "best part": a few bars of build, then the biggest drop ---------- */
function clipRange() {
  const A = S.song.an, dur = S.song.duration;
  if (!S.clip || S.clip >= dur) return [0, dur];
  const barLen = (A.bars[A.bars.length - 1] - A.bars[0]) / Math.max(1, A.bars.length - 1) / FPS;
  // biggest drop = largest level jump
  // the drop that rises furthest and then stays up: a kick entering in the intro jumps too, but falls back
  const avg = a => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
  const weight = d => (avg(A.level.slice(d, d + 8)) - Math.min(...A.level.slice(Math.max(0, d - 8), d).concat([1]))) * avg(A.level.slice(d, d + 8));
  const best = A.drops.reduce((a, b) => weight(b) > weight(a) ? b : a);
  const lead = Math.min(S.clip * .3, (S.clip <= 15 ? 2 : 4) * barLen);
  let start = A.bars[best] / FPS - lead;
  start = Math.max(0, Math.min(dur - S.clip, start));
  return [start, start + S.clip];
}

/* ---------- metadata ---------- */
function readId3(buf) {
  const b = new Uint8Array(buf), out = {};
  if (b[0] !== 73 || b[1] !== 68 || b[2] !== 51) return out;
  const ver = b[3], size = (b[6] << 21) | (b[7] << 14) | (b[8] << 7) | b[9];
  let p = 10;
  const dec = (enc, bytes) => {
    try {
      if (enc === 0) return new TextDecoder('latin1').decode(bytes);
      if (enc === 3) return new TextDecoder('utf-8').decode(bytes);
      if (enc === 2) return new TextDecoder('utf-16be').decode(bytes);
      return new TextDecoder(bytes[0] === 0xfe ? 'utf-16be' : 'utf-16le').decode(bytes.subarray(2));
    } catch (e) { return ''; }
  };
  while (p + 10 < size + 10 && p + 10 < b.length) {
    const id = String.fromCharCode(b[p], b[p + 1], b[p + 2], b[p + 3]);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const fs = ver === 4 ? (b[p + 4] << 21) | (b[p + 5] << 14) | (b[p + 6] << 7) | b[p + 7] : (b[p + 4] << 24) | (b[p + 5] << 16) | (b[p + 6] << 8) | b[p + 7];
    if (id === 'TIT2' || id === 'TPE1') out[id] = dec(b[p + 10], b.subarray(p + 11, p + 10 + fs)).replace(/\0/g, '').trim();
    p += 10 + fs;
  }
  return out;
}

/* ---------- loading ---------- */
function busy(msg) { el('busy').style.display = msg ? 'block' : 'none'; el('busy').textContent = msg || ''; }

async function loadBuffer(buffer, meta) {
  pause();
  busy('Listening to the song ... 0%');
  const an = await analyse(buffer, p => busy('Listening to the song ... ' + Math.round(p * 100) + '%'));
  S.song = { buffer, an, frames: an.frames, duration: an.duration };
  el('artist').value = meta.artist || '';
  el('title').value = meta.title || '';
  el('songInfo').innerHTML = `<b>${Math.round(an.bpm)} BPM</b> · ${an.bars.length - 1} bars · ${an.drops.length} drop${an.drops.length === 1 ? '' : 's'} found · ${fmtTime(an.duration)}`;
  rebuild();
  busy('');
  el('drop').style.display = 'none';
  ['play', 'seek', 'export'].forEach(id => el(id).disabled = false);
  S.off = clipRange()[0];
  R.reset();
  play();
}

async function loadFile(file) {
  try {
    busy('Decoding ...');
    const ab = await file.arrayBuffer();
    const id3 = readId3(ab);
    S.ctx = S.ctx || new AudioContext();
    const buffer = await S.ctx.decodeAudioData(ab.slice(0));
    let artist = id3.TPE1, title = id3.TIT2;
    if (!title) {
      const base = file.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ');
      const m = base.split(/\s+[-–]\s+/);
      if (m.length >= 2 && !artist) { artist = m[0]; title = m.slice(1).join(' - '); } else title = base;
    }
    S.fileName = file.name.replace(/\.[^.]+$/, '');
    await loadBuffer(buffer, { artist, title });
  } catch (e) {
    busy('');
    alert('Could not read this file as audio: ' + e.message);
  }
}

/* ---------- demo beat: 128 BPM, intro - build - drop - break - drop, synthesised here ---------- */
async function demoBuffer() {
  const sr = 44100, bpm = 128, beat = 60 / bpm, bars = 40, len = bars * 4 * beat + 1;
  const ctx = new OfflineAudioContext(2, Math.ceil(len * sr), sr);
  const master = ctx.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 4;
  master.connect(ctx.destination);
  const noise = ctx.createBuffer(1, sr, sr); { const d = noise.getChannelData(0); for (let i = 0; i < sr; i++) d[i] = Math.random() * 2 - 1; }
  const at = (bar, b) => (bar * 4 + b) * beat;
  const sec = bar => bar < 8 ? 'intro' : bar < 16 ? 'build' : bar < 28 ? 'drop' : bar < 32 ? 'break' : 'drop';
  const kick = t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
    g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(master); o.start(t); o.stop(t + .45); };
  const hat = (t, v, d = .05) => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; f.type = 'highpass'; f.frequency.value = 8000;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(f).connect(g).connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .01); };
  const snare = (t, v) => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = .7;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .18); s.connect(f).connect(g).connect(master); s.start(t, Math.random() * .5); s.stop(t + .2); };
  const notes = [0, 0, 3, 0, 7, 0, 5, 3];   // A minor-ish riff
  const synth = (t, semis, d, v, cut, type = 'sawtooth') => { const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = type; o.frequency.value = 55 * Math.pow(2, semis / 12); f.type = 'lowpass'; f.frequency.setValueAtTime(cut, t); f.frequency.exponentialRampToValueAtTime(Math.max(80, cut / 6), t + d); f.Q.value = 8;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + d + .02); };
  const chord = [12, 15, 19, 24];
  for (let bar = 0; bar < bars; bar++) {
    const s = sec(bar), prog = (bar % 8) / 8;
    // pad on every bar except the drops
    if (s !== 'drop') chord.forEach(n => synth(at(bar, 0), n + (bar % 4 === 3 ? -2 : 0), 4 * beat, .05, 900 + (s === 'build' ? prog * 3000 : 0), 'triangle'));
    for (let b = 0; b < 4; b++) {
      const t = at(bar, b);
      if (s === 'drop') { kick(t); snare(t + 0, 0); if (b % 2) snare(t, .5); }
      if (s === 'intro' && bar >= 4) kick(t);
      if (s !== 'break') { hat(t + beat / 2, .25); if (s === 'drop') { hat(t + beat / 4, .1); hat(t + 3 * beat / 4, .1); } }
      if (s === 'build') { const rolls = prog < .5 ? 1 : prog < .75 ? 2 : 4; for (let r = 0; r < rolls; r++) snare(t + r * beat / rolls, .15 + .5 * prog); }
      if (s === 'drop') for (let e = 0; e < 4; e++) synth(t + e * beat / 4, notes[(b * 4 + e) % 8] - 12, beat / 4 * .9, .35, 2400 + 1600 * Math.sin(bar + e));
      if (s === 'build') synth(t, notes[b * 2] , beat * .9, .12, 600 + prog * 4000);
    }
  }
  // riser into each drop
  for (const into of [16, 32]) { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; s.loop = true;
    f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(400, at(into - 4, 0)); f.frequency.exponentialRampToValueAtTime(9000, at(into, 0));
    g.gain.setValueAtTime(.001, at(into - 4, 0)); g.gain.exponentialRampToValueAtTime(.4, at(into, 0) - .01); g.gain.setValueAtTime(0, at(into, 0));
    s.connect(f).connect(g).connect(master); s.start(at(into - 4, 0)); s.stop(at(into, 0)); }
  return ctx.startRendering();
}

/* ---------- export: frame by frame, WebCodecs + mp4-muxer, faster than real time ---------- */
async function pickVideoCodec(w, h) {
  const tries = [['avc1.640033', 'avc'], ['avc1.64002A', 'avc'], ['avc1.4D002A', 'avc'], ['vp09.00.41.08', 'vp9'], ['av01.0.09M.08', 'av1']];
  for (const [codec, mux] of tries) {
    const cfg = { codec, width: w, height: h, bitrate: w * h * 9, framerate: FPS, ...(mux === 'avc' ? { avc: { format: 'avc' } } : {}) };
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return { cfg, mux }; } catch (e) {}
  }
  return null;
}
async function pickAudioCodec() {
  for (const [codec, mux] of [['mp4a.40.2', 'aac'], ['opus', 'opus']]) {
    const cfg = { codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 };
    try { if ((await AudioEncoder.isConfigSupported(cfg)).supported) return { cfg, mux }; } catch (e) {}
  }
  return null;
}

async function clipAudio(start, end) {
  const len = Math.ceil((end - start) * 48000);
  const oc = new OfflineAudioContext(2, len, 48000);
  const src = oc.createBufferSource(); src.buffer = S.song.buffer;
  const g = oc.createGain();
  // short fades so the clip does not click in and out
  g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(1, .03);
  g.gain.setValueAtTime(1, Math.max(.04, end - start - .6)); g.gain.linearRampToValueAtTime(0, end - start);
  src.connect(g).connect(oc.destination);
  src.start(0, start, end - start);
  return oc.startRendering();
}

function progress(p, text) {
  el('prog').style.display = p === null ? 'none' : 'block';
  el('prog').firstElementChild.style.width = (100 * (p || 0)) + '%';
  el('msg').innerHTML = text || '';
}

async function exportVideo() {
  if (S.exporting || !S.song) return;
  pause();
  const [start, end] = clipRange();
  const [w, h] = dims(S.fmt, S.quality === 1080 ? 1920 : 1280);
  if (!('VideoEncoder' in window) || !('AudioEncoder' in window)) return exportRealtime(start, end, w, h);
  const vc = await pickVideoCodec(w, h), acod = await pickAudioCodec();
  if (!vc || !acod) return exportRealtime(start, end, w, h);

  S.exporting = true; el('export').disabled = true;
  try {
    progress(0, 'Preparing the sound ...');
    const audio = await clipAudio(start, end);
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: vc.mux, width: w, height: h, frameRate: FPS },
      audio: { codec: acod.mux, sampleRate: 48000, numberOfChannels: 2 },
      fastStart: 'in-memory', firstTimestampBehavior: 'offset',
    });
    let err = null;
    const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => err = e });
    venc.configure(vc.cfg);
    const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => err = e });
    aenc.configure(acod.cfg);
    // audio first - it is quick
    const L = audio.getChannelData(0), Rr = audio.getChannelData(1), CH = 4800;
    for (let i = 0; i < audio.length; i += CH) {
      const n = Math.min(CH, audio.length - i), data = new Float32Array(n * 2);
      data.set(L.subarray(i, i + n), 0); data.set(Rr.subarray(i, i + n), n);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / 48000 * 1e6), data });
      aenc.encode(ad); ad.close();
    }
    // video: render every frame at full size into an offscreen compositor
    const out = document.createElement('canvas'); out.width = w; out.height = h;
    const octx = out.getContext('2d');
    R.resize(w, h, .75); R.reset();
    const f0 = Math.round(start * FPS), total = Math.round((end - start) * FPS);
    // warm the feedback trails with the second before the clip
    for (let f = Math.max(0, f0 - 30); f < f0; f++) R.draw(uniformsAt(f));
    const t0 = performance.now();
    for (let i = 0; i < total; i++) {
      if (err) throw err;
      frameTo(octx, w, h, f0 + i, i / FPS);
      const vf = new VideoFrame(out, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      venc.encode(vf, { keyFrame: i % (FPS * 2) === 0 });
      vf.close();
      while (venc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
      if (i % 10 === 0) {
        const el2 = (performance.now() - t0) / 1000, eta = el2 / (i + 1) * (total - i);
        progress(i / total, `Rendering frame ${i} of ${total} · about ${Math.ceil(eta)} s left`);
        // show the user what is being made
        vctx.drawImage(out, 0, 0, view.width, view.height);
        await new Promise(r => setTimeout(r));
      }
    }
    await venc.flush(); await aenc.flush();
    if (err) throw err;
    muxer.finalize();
    const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    deliver(blob, 'mp4');
  } catch (e) {
    console.error(e);
    progress(null, 'Export failed: ' + e.message);
  } finally {
    S.exporting = false; el('export').disabled = false;
    R.reset(); renderPreview();
  }
}

// fallback for browsers without WebCodecs: record the canvas while it plays
async function exportRealtime(start, end, w, h) {
  if (!window.MediaRecorder) { progress(null, 'This browser can not record video. Try a current Chrome, Edge or Firefox.'); return; }
  S.exporting = true; el('export').disabled = true;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const octx = out.getContext('2d');
  R.resize(w, h, .6); R.reset();
  S.ctx = S.ctx || new AudioContext();
  const dest = S.ctx.createMediaStreamDestination();
  const src = S.ctx.createBufferSource(); src.buffer = S.song.buffer; src.connect(dest); src.connect(S.ctx.destination);
  const stream = new MediaStream([...out.captureStream(FPS).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const type = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: w * h * 6 });
  const parts = []; rec.ondataavailable = e => parts.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start(); src.start(0, start, end - start);
  const t0 = S.ctx.currentTime;
  await new Promise(resolve => {
    const tick = () => {
      const t = S.ctx.currentTime - t0;
      if (t >= end - start) { resolve(); return; }
      frameTo(octx, w, h, Math.floor((start + t) * FPS), t);
      vctx.drawImage(out, 0, 0, view.width, view.height);
      progress(t / (end - start), 'Recording in real time - keep this tab in front ...');
      requestAnimationFrame(tick);
    };
    tick();
  });
  rec.stop(); await done;
  S.exporting = false; el('export').disabled = false;
  deliver(new Blob(parts, { type: type.split(';')[0] }), type.includes('mp4') ? 'mp4' : 'webm');
  R.reset(); renderPreview();
}

function deliver(blob, ext) {
  const url = URL.createObjectURL(blob);
  const name = (S.fileName || 'afterglow').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + `_${S.fmt.replace(':', 'x')}_afterglow.${ext}`;
  const a = document.createElement('a'); a.href = url; a.download = name; a.textContent = 'Download again';
  document.body.appendChild(a); a.click(); a.remove();
  progress(1, `Done - ${(blob.size / 1048576).toFixed(1)} MB. <a href="${url}" download="${name}">Download again</a>`);
}

/* ---------- UI ---------- */
function rebuild() {
  if (!S.song) return;
  S.track = buildTrack(S.song.an, S.seed);
  el('seedTxt').textContent = 'take #' + S.seed;
  try { const q = new URLSearchParams(location.search); q.set('seed', S.seed); q.set('look', LOOKS[S.look].name.toLowerCase()); history.replaceState(null, '', '?' + q); } catch (e) {}
}
function segment(id, key, conv) {
  el(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    el(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    S[key] = conv(b.dataset.v);
    if (key === 'fmt' && S.song) { R.reset(); renderPreview(); }
    if (key === 'clip' && S.song) seek(clipRange()[0]);
  });
}
segment('fmt', 'fmt', v => v);
segment('clip', 'clip', Number);
segment('quality', 'quality', Number);

LOOKS.forEach((l, i) => {
  const b = document.createElement('button');
  b.className = 'swatch' + (i === S.look ? ' on' : '');
  b.title = l.name;
  b.style.background = `conic-gradient(${[0, .2, .4, .6, .8, 1].map(t => palCss(l.p, t)).join(',')})`;
  b.onclick = () => { S.look = i; el('look').querySelectorAll('button').forEach((x, j) => x.classList.toggle('on', j === i)); rebuild(); if (!S.playing && S.song) renderPreview(); };
  el('look').appendChild(b);
});
el('trip').oninput = e => { S.trip = e.target.value / 100; if (!S.playing && S.song) renderPreview(); };
el('reroll').onclick = () => { S.seed = (Math.random() * 1e6) | 0; rebuild(); if (S.song) { R.reset(); if (!S.playing) renderPreview(); } };
['artist', 'title'].forEach(id => el(id).oninput = () => { if (!S.playing && S.song) renderPreview(); });

el('play').onclick = () => S.playing ? pause() : play();
el('seek').oninput = e => seek(e.target.value / 1000 * S.song.duration);
el('export').onclick = exportVideo;

const drop = el('drop');
el('pickBtn').onclick = e => { e.stopPropagation(); el('pick').click(); };
drop.onclick = () => el('pick').click();
el('pick').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };
el('demoBtn').onclick = async e => {
  e.stopPropagation();
  busy('Making a beat ...');
  S.fileName = 'afterglow_demo';
  await loadBuffer(await demoBuffer(), { artist: 'gptgames.dev', title: 'Afterglow Demo' });
};
const stage = el('stage');
stage.ondragover = e => { e.preventDefault(); drop.style.display = 'flex'; drop.classList.add('over'); };
stage.ondragleave = e => { if (e.target === drop) { drop.classList.remove('over'); if (S.song) drop.style.display = 'none'; } };
stage.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); else if (S.song) drop.style.display = 'none'; };
addEventListener('resize', () => { if (S.song && !S.playing) renderPreview(); });

try { R = new Renderer(glCanvas); }
catch (e) { drop.innerHTML = '<div class="big">Your browser can not run this</div><div class="small">' + e.message.replace(/</g, '&lt;') + '</div>'; console.error(e); }
el('seedTxt').textContent = 'take #' + S.seed;

// for tests: drive the page without a sound card
window.__afterglow = { S, analyse, buildTrack, demoBuffer, loadBuffer, uniformsAt, frameTo, clipRange, seek, R: () => R, exportVideo };
})();
</script>
