<body>
<div class="container">
    <header>
        <h1>🌍 Animal Size Comparison</h1>
        <p class="subtitle">Explore the true scale of Earth's creatures — <span id="speciesCount">100+</span> species</p>
    </header>
    <div class="controls">
        <div class="controls-row" id="filterBar">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="land">🌍 Land</button>
            <button class="filter-btn" data-category="sea">🌊 Sea</button>
            <button class="filter-btn" data-category="air">🦅 Air</button>
            <button class="filter-btn" data-category="small">🐭 Small</button>
            <button class="filter-btn" data-category="reptile">🦎 Reptile</button>
            <button class="filter-btn" data-category="extinct">🦴 Extinct</button>
            <button class="filter-btn" data-category="mythical">🦄 Mythical</button>
            <input type="text" class="search-box" id="searchBox" placeholder="Search animals..." aria-label="Search animals">
        </div>
        <div class="controls-row">
            <label class="toggle-label"><input type="checkbox" id="humanRef" checked>Human for scale</label>
            <div class="unit-toggle">
                <button class="unit-btn active" data-unit="metric">Metric</button>
                <button class="unit-btn" data-unit="imperial">Imperial</button>
            </div>
            <button class="action-btn" id="shareBtn" type="button">🔗 Copy link</button>
            <button class="action-btn" id="clearBtn" type="button" disabled>Clear</button>
            <select class="sort-select" id="dimSelect" aria-label="Dimension to compare">
                <option value="height">Compare: Height ↕</option>
                <option value="length">Compare: Length ↔</option>
                <option value="max">Compare: Longest side</option>
            </select>
            <select class="sort-select" id="sortSelect" aria-label="Sort animals">
                <option value="name">Sort: A–Z</option>
                <option value="name-desc">Sort: Z–A</option>
                <option value="size-desc">Sort: Largest</option>
                <option value="size-asc">Sort: Smallest</option>
                <option value="weight-desc">Sort: Heaviest</option>
                <option value="weight-asc">Sort: Lightest</option>
            </select>
        </div>
    </div>
    <div class="quick-picks">
        <div class="quick-picks-title">Popular Comparisons</div>
        <div class="quick-picks-row">
            <button class="quick-pick-btn" data-animals="Blue Whale,African Elephant,Human">🐋 Whale vs Elephant</button>
            <button class="quick-pick-btn" data-animals="Lion,Tiger,Wolf">🦁 Big Cats vs Wolf</button>
            <button class="quick-pick-btn" data-animals="Great White Shark,Dolphin,Human">🦈 Shark vs Dolphin</button>
            <button class="quick-pick-btn" data-animals="Giraffe,African Elephant,Human">🦒 Tallest Animals</button>
            <button class="quick-pick-btn" data-animals="Ant,Bee,Mouse,Cat">🐜 Tiny to Small</button>
            <button class="quick-pick-btn" data-animals="Crocodile,Komodo Dragon,Green Turtle">🐊 Reptiles</button>
        </div>
    </div>
    <div class="grid" id="animalGrid" role="group" aria-label="Animals — select up to 4 to compare"></div>
    <div class="comparison" id="comparison"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="info-overlay" id="infoOverlay">
    <div class="info-modal" role="dialog" aria-modal="true" aria-labelledby="modalName">

        <div class="info-modal-header">

            <div class="info-modal-category" id="modalCategory"></div>

        // Which dimension the ruler, bars and sorting use. Sizing every animal by
        // its longest side put a 12m-long T-Rex above a 5.5m-tall giraffe on a
        // vertical scale, so height is the honest default.
        var dimMode = 'height';

        var KG_TO_LB = 2.20462;

        function toast(msg){
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
        }

        // ---- shareable URL state ----
        function readStateFromUrl(){
            var params = new URLSearchParams(location.search);
            var a = params.get('a');
            if(a){
                selected = a.split(',').map(function(n){ return findAnimal(decodeURIComponent(n.trim())); }).filter(Boolean).slice(0, MAX_SELECTED);
            }
            var d = params.get('d');
            if(d === 'height' || d === 'length' || d === 'max') dimMode = d;
            dimSelect.value = dimMode;
            if(params.get('u') === 'imperial') useMetric = false;
            if(params.get('h') === '0') showHumanRef = false;
            document.querySelectorAll('.unit-btn').forEach(function(b){
                b.classList.toggle('active', (b.dataset.unit === 'metric') === useMetric);
            });
            humanRefToggle.checked = showHumanRef;
        }

        function writeStateToUrl(){
            var params = new URLSearchParams();
            if(selected.length) params.set('a', selected.map(function(a){ return a.name; }).join(','));
            if(dimMode !== 'height') params.set('d', dimMode);
            if(!useMetric) params.set('u', 'imperial');
            if(!showHumanRef) params.set('h', '0');
            var q = params.toString();
            history.replaceState(null, '', q ? location.pathname + '?' + q : location.pathname);
        }

        function fmtLen(val, short){
            if(short === undefined) short = true;
            if(useMetric){
                if(val >= 1) return short ? val.toFixed(1)+'m' : val.toFixed(1)+' meters';
                if(val >= 0.01) return short ? (val*100).toFixed(0)+'cm' : (val*100).toFixed(1)+' cm';
                if(val >= 0.0001) return short ? (val*1000).toFixed(1)+'mm' : (val*1000).toFixed(1)+' mm';
                if(val >= 1e-7) return short ? (val*1e6).toFixed(1)+'µm' : (val*1e6).toFixed(1)+' µm';
                return short ? (val*1e9).toFixed(1)+'nm' : (val*1e9).toFixed(1)+' nm';
            } else {
                var ft = val * M_TO_FT;
                if(ft >= 1){
                    var feet = Math.floor(ft);
                    var inches = Math.round((ft - feet)*12);
                    if(inches === 12){ feet += 1; inches = 0; }
                    return short ? (inches > 0 ? feet+"'"+inches+'"' : feet+"'") : (inches > 0 ? feet+'ft '+inches+'in' : feet+' feet');
                }
                var inch = ft * 12;
                if(inch < 0.001){
                    var saveMetric = useMetric;
                    useMetric = true;
                    var metric = fmtLen(val, short);   // sub-thousandth of an inch: metric is the only readable unit
                    useMetric = saveMetric;
                    return metric;
                }
                var dp = inch >= 1 ? 1 : (inch >= 0.1 ? 2 : 3);
                return short ? inch.toFixed(dp)+'"' : inch.toFixed(dp)+' inches';
            }
        }

        function fmtWt(w, short){
            if(short === undefined) short = true;
            if(useMetric){
                if(w >= 1000) return short ? (w/1000).toFixed(1)+'t' : (w/1000).toFixed(1)+' tonnes';
                if(w >= 1) return short ? Math.round(w)+'kg' : Math.round(w)+' kg';
                if(w >= 0.001) return short ? (w*1000).toFixed(w >= 0.01 ? 0 : 1)+'g' : (w*1000).toFixed(w >= 0.01 ? 0 : 1)+' grams';
                if(w >= 1e-6) return short ? (w*1e6).toFixed(w >= 1e-5 ? 0 : 1)+'mg' : (w*1e6).toFixed(w >= 1e-5 ? 0 : 1)+' mg';
                if(w >= 1e-9) return short ? (w*1e9).toFixed(0)+'µg' : (w*1e9).toFixed(0)+' µg';
                if(w >= 1e-12) return short ? (w*1e12).toFixed(0)+'ng' : (w*1e12).toFixed(0)+' ng';
                return short ? (w*1e15).toFixed(1)+'pg' : (w*1e15).toFixed(1)+' pg';
            } else {
                var lb = w * KG_TO_LB;
                if(lb >= 2000) return (lb/2000).toFixed(1)+' tons';
                if(lb >= 1) return short ? Math.round(lb)+' lb' : Math.round(lb).toLocaleString()+' lb';
                var oz = lb * 16;
                if(oz >= 0.01) return oz.toFixed(oz >= 1 ? 1 : 2)+' oz';
                var grains = oz * 437.5;   // 1 oz = 437.5 grains
                if(grains >= 0.01) return grains.toFixed(2)+(short ? ' gr' : ' grains');
                var saveMetric = useMetric;
                useMetric = true;
                var metric = fmtWt(w, short);   // below a hundredth of a grain, metric is the only readable unit
                useMetric = saveMetric;
                return metric;
            }
        }

        var catLabels = {land:'Land Animal',sea:'Marine Animal',air:'Bird or Flier',small:'Small Creature',reptile:'Reptile'};
        function categoryLabel(a){
            if(a.status === 'mythical') return 'Mythical Creature';
            if(a.status === 'extinct') return 'Extinct — ' + (catLabels[a.category] || a.category);
            return catLabels[a.category] || a.category;
        }
        function statusBadge(a, cls){
            if(!a.status) return '';
            return '<span class="status-badge ' + a.status + (cls ? ' ' + cls : '') + '">' + a.status + '</span>';
        }

        // Ratios here span 11 orders of magnitude (ant vs blue whale), so raw
        // toFixed(1) produces unreadable digit strings.
        function fmtRatio(r){
            if(!isFinite(r)) return '—';
            if(r < 10) return r.toFixed(1);
            if(r < 1000) return Math.round(r).toString();
            var units = [[1e12,'trillion'],[1e9,'billion'],[1e6,'million'],[1e3,'thousand']];
            for(var i = 0; i < units.length; i++){
                if(r >= units[i][0]){
                    var n = r / units[i][0];
                    return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + units[i][1];
                }
            }
            return Math.round(r).toString();
        }

        function metricOf(a){
            if(dimMode === 'height') return a.height;
            if(dimMode === 'length') return a.length;
            return a.size;
        }
        function metricIcon(a){
            if(dimMode === 'height') return '↕';
            if(dimMode === 'length') return '↔';
            return a.sizeType === 'height' ? '↕' : '↔';
        }
        var dimTitles = {height:'HEIGHT', length:'LENGTH', max:'SCALE'};

        function isSelected(name){ return selected.some(function(s){ return s.name === name; }); }
        function findAnimal(name){ return animals.find(function(a){ return a.name === name; }); }

        function toggleAnimal(name){
            var animal = findAnimal(name);
            if(!animal) return;
            var idx = selected.findIndex(function(s){ return s.name === name; });
            if(idx > -1) selected.splice(idx, 1);
            else if(selected.length < MAX_SELECTED) selected.push(animal);
            else { toast('You can compare up to ' + MAX_SELECTED + ' animals — remove one first.'); return; }
            render();
        }

        function removeAnimal(name){
            var idx = selected.findIndex(function(s){ return s.name === name; });
            if(idx > -1){ selected.splice(idx, 1); render(); }
        }

        function showInfo(name){
            var a = findAnimal(name);
            if(!a) return;
            document.getElementById('modalEmoji').textContent = a.emoji;
            document.getElementById('modalName').textContent = a.name;
            document.getElementById('modalCategory').textContent = categoryLabel(a);
            document.getElementById('modalBody').innerHTML =
                (a.status ? '<div class="info-row"><span class="info-label">Status</span><span class="info-value">' + (a.status === 'extinct' ? 'Extinct — sizes are scientific estimates' : 'Mythical — sizes are for fun only') + '</span></div>' : '') +
                '<div class="info-row"><span class="info-label">Height ↕</span><span class="info-value">' + fmtLen(a.height, false) + '</span></div>' +
                '<div class="info-row"><span class="info-label">Length ↔</span><span class="info-value">' + fmtLen(a.length, false) + '</span></div>' +
                '<div class="info-row"><span class="info-label">Weight</span><span class="info-value">' + fmtWt(a.weight, false) + '</span></div>' +
                '<div class="info-fact">' + a.facts + '</div>';
            infoOverlay.classList.add('active');
        }

        function hideInfo(){ infoOverlay.classList.remove('active'); }

        function sortAnimals(arr){
            var sorted = arr.slice();
            switch(sortBy){
                case 'name': return sorted.sort(function(a,b){ return a.name.localeCompare(b.name); });
                case 'name-desc': return sorted.sort(function(a,b){ return b.name.localeCompare(a.name); });
                case 'size-desc': return sorted.sort(function(a,b){ return metricOf(b) - metricOf(a); });
                case 'size-asc': return sorted.sort(function(a,b){ return metricOf(a) - metricOf(b); });
                case 'weight-desc': return sorted.sort(function(a,b){ return b.weight - a.weight; });
                case 'weight-asc': return sorted.sort(function(a,b){ return a.weight - b.weight; });
                default: return sorted;
            }
        }

        function renderGrid(){
            var filtered = animals.filter(function(a){
                var matchCat = currentFilter === 'all' ||
                    (currentFilter === 'extinct' || currentFilter === 'mythical' ? a.status === currentFilter : (a.category === currentFilter && !a.status));
                var matchSearch = a.name.toLowerCase().includes(searchTerm.toLowerCase());
                return matchCat && matchSearch;
            });
            filtered = sortAnimals(filtered);
            gridEl.innerHTML = filtered.map(function(a){
                var dimIcon = metricIcon(a);
                var sel = isSelected(a.name);
                return '<div class="animal-card' + (sel ? ' selected' : '') + '" data-name="' + a.name + '"' +
                    ' role="button" tabindex="0" aria-pressed="' + sel + '"' +
                    ' aria-label="' + a.name + ', ' + fmtLen(metricOf(a)) + ', ' + fmtWt(a.weight) + '">' +
                    '<button class="card-info-btn" data-info="' + a.name + '" title="View details" aria-label="Details about ' + a.name + '">i</button>' +
                    statusBadge(a, 'card-badge') +
                    '<span class="emoji">' + a.emoji + '</span>' +
                    '<div class="animal-name">' + a.name + '</div>' +
                    '<div class="animal-stats">' + dimIcon + ' ' + fmtLen(metricOf(a)) + ' · ' + fmtWt(a.weight) + '</div></div>';
            }).join('') || '<div class="empty-state" style="grid-column:1/-1"><div class="big-emoji">🔍</div><h3>No animals match</h3><p>Try a different search or filter</p></div>';
            clearBtn.disabled = selected.length === 0;
        }

        function getDisplayAnimals(){
            var display = selected.slice();
            if(showHumanRef && !isSelected('Human') && humanAnimal) display.push(Object.assign({}, humanAnimal, {isRef: true}));
            return display;
        }

        function renderComparison(){
            var display = getDisplayAnimals();
            if(display.length === 0){
                comparisonEl.innerHTML = '<div class="empty-state"><div class="big-emoji">📏</div><h3>Select animals to compare</h3><p>Click cards above or enable "Human for scale"</p></div>';
                return;
            }

            var html = '<div class="comparison-header"><div><h2 class="comparison-title">Size Comparison</h2>';
            if(selected.length > 1){
                var heights = selected.map(function(a){ return a.height; });
                var lengths = selected.map(function(a){ return a.length; });
                var weights = selected.map(function(a){ return a.weight; });
                var hRatio = fmtRatio(Math.max.apply(null, heights) / Math.min.apply(null, heights));
                var lRatio = fmtRatio(Math.max.apply(null, lengths) / Math.min.apply(null, lengths));
                var wRatio = fmtRatio(Math.max.apply(null, weights) / Math.min.apply(null, weights));
                html += '<p class="comparison-subtitle">Height: ' + hRatio + '× · Length: ' + lRatio + '× · Weight: ' + wRatio + '×</p>';
            }
            html += '</div><div class="selected-pills">';
            selected.forEach(function(a){
                html += '<span class="selected-pill"><span class="pill-emoji">' + a.emoji + '</span>' + a.name +
                    '<button class="remove-pill" data-name="' + a.name + '">×</button></span>';
            });
            html += '</div></div>';

            if(selected.length > 0){
                var totalWeight = selected.reduce(function(sum, a){ return sum + a.weight; }, 0);
                var avgSize = selected.reduce(function(sum, a){ return sum + metricOf(a); }, 0) / selected.length;
                html += '<div class="stats-row">' +
                    '<div class="stat-card"><div class="stat-value">' + selected.length + '</div><div class="stat-label">Animals</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + fmtWt(totalWeight) + '</div><div class="stat-label">Total Weight</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + fmtLen(avgSize) + '</div><div class="stat-label">Avg ' + (dimMode === 'length' ? 'Length' : dimMode === 'height' ? 'Height' : 'Size') + '</div></div></div>';
            }

            var maxS = Math.max.apply(null, display.map(metricOf));
            var minS = Math.min.apply(null, display.map(metricOf));
            var ratio = maxS / minS;
            var useLog = ratio > 100;
            var availablePx = 280;
            var minPx = 22;

            function scalePos(s){
                if(useLog){
                    var logMin = Math.log10(minS);
                    var logMax = Math.log10(maxS);
                    var norm = (Math.log10(s) - logMin) / (logMax - logMin);
                    return minPx + norm * norm * (availablePx - minPx);
                }
                return (s / maxS) * availablePx;
            }
            // Bars get a floor so the tiniest creature stays visible; the ruler must not.
            function getSize(s){ return Math.max(minPx, scalePos(s)); }

            html += '<div class="visual-wrapper"><div class="ruler"><span class="ruler-title">' + dimTitles[dimMode] + '</span>';

            var ticks = [];
            if(useLog){
                var p = Math.floor(Math.log10(minS));
                while(Math.pow(10, p) <= maxS * 1.1){
                    var v = Math.pow(10, p);
                    if(v >= minS * 0.9 && v <= maxS * 1.1){
                        ticks.push({v: v, pos: scalePos(v), major: true});
                    }
                    p++;
                }
            } else {
                var step = 0.5;
                if(maxS > 3) step = 1;
                if(maxS > 10) step = 2;
                if(maxS < 0.5) step = 0.1;
                if(maxS < 0.1) step = 0.02;
                for(var v = step; v <= maxS * 1.05; v += step){
                    ticks.push({v: v, pos: scalePos(v), major: Math.abs(v % 1) < 1e-9 || step >= 1});
                }
            }
            ticks.forEach(function(t){
                html += '<div class="ruler-tick' + (t.major ? ' major' : '') + '" style="bottom:' + t.pos + 'px">' + fmtLen(t.v) + '</div>';
            });

            html += '</div><div class="visual-area" style="min-height:' + (availablePx + 110) + 'px">';
            html += '<div class="grass"></div><div class="ground"></div>';
            html += '<div class="scale-info' + (useLog ? ' warning' : '') + '">' + (useLog ? '⚠️ Log scale' : '📏 Proportional') + '</div>';

            display.forEach(function(a){
                var sizePx = getSize(metricOf(a));
                var refClass = a.isRef ? ' reference' : '';
                var dimIcon = metricIcon(a);

                html += '<div class="animal-display' + refClass + '">' +
                    '<div class="bracket-container" style="height:' + sizePx + 'px">' +
                    '<div class="bracket-left"></div><div class="bracket-right"></div>' +
                    '<span class="bracket-label">' + fmtLen(metricOf(a)) + '<span class="dim-label"> ' + dimIcon + '</span></span>' +
                    '<span class="visual-emoji" style="font-size:' + sizePx + 'px">' + a.emoji + '</span>' +
                    '</div><span class="visual-name">' + a.name + '</span></div>';
            });

            html += '</div></div>';

            if(selected.length > 0){
                html += '<div class="details">';
                var minH = Math.min.apply(null, selected.map(function(a){ return a.height; }));
                var minL = Math.min.apply(null, selected.map(function(a){ return a.length; }));
                selected.forEach(function(a){
                    var relH = a.height / minH;
                    var relL = a.length / minL;
                    html += '<div class="detail-card"><div class="detail-title">' + a.emoji + ' ' + a.name + ' ' + statusBadge(a);
                    if(selected.length > 1){
                        if(relH > 1.01) html += ' <span class="ratio-badge">' + fmtRatio(relH) + '× taller</span>';
                        if(relL > 1.01) html += ' <span class="ratio-badge">' + fmtRatio(relL) + '× longer</span>';
                    }
                    html += '</div><div class="detail-content">' +
                        '<strong>Height ↕:</strong> ' + fmtLen(a.height, false) + '<br>' +
                        '<strong>Length ↔:</strong> ' + fmtLen(a.length, false) + '<br>' +
                        '<strong>Weight:</strong> ' + fmtWt(a.weight, false) + '<br>' +
                        '<strong>💡</strong> ' + a.facts + '</div></div>';
                });
                html += '</div>';
            }

            if(selected.some(function(a){ return a.status; })){
                html += '<p class="source-note">Extinct species use published scientific estimates; mythical creatures are included for fun and have no measurements.</p>';
            }
            html += '<p class="source-note">↕ = height, ↔ = length. Typical adult measurements — individuals vary widely. ↕ is shoulder height for most quadrupeds, and full standing height for bipeds, apes and long-necked animals such as the giraffe and camel. Compiled from ' +
                '<a href="https://www.wikipedia.org/" target="_blank">Wikipedia</a>, ' +
                '<a href="https://www.dimensions.com/" target="_blank">Dimensions.com</a>, ' +
                '<a href="https://sizegraf.com/tools/animal-size-comparison-tool/" target="_blank">SizeGraf</a> (way better than this tool), ' +
                '<a href="https://www.britannica.com/" target="_blank">Britannica</a>, ' +
                '<a href="https://www.noaa.gov/" target="_blank">NOAA</a> and ' +
                '<a href="https://ielc.libguides.com/sdzg/factsheets" target="_blank">San Diego Zoo</a>. ' +
                'Spotted an error? <a href="https://github.com/TobiasMue91/tobiasmue91.github.io/issues" target="_blank">Report it</a>.</p>';

            comparisonEl.innerHTML = html;
        }

        function render(){ renderGrid(); renderComparison(); writeStateToUrl(); }

        gridEl.addEventListener('click', function(e){
            if(e.target.classList.contains('card-info-btn')){
                e.stopPropagation();
                showInfo(e.target.dataset.info);
                return;
            }
            var card = e.target.closest('.animal-card');
            if(card && card.dataset.name) toggleAnimal(card.dataset.name);
        });

        gridEl.addEventListener('keydown', function(e){
            if(e.key !== 'Enter' && e.key !== ' ') return;
            var card = e.target.closest('.animal-card');
            if(!card || !card.dataset.name) return;
            e.preventDefault();
            toggleAnimal(card.dataset.name);
            var again = gridEl.querySelector('.animal-card[data-name="' + card.dataset.name.replace(/"/g, '\\"') + '"]');
            if(again) again.focus();
        });

        comparisonEl.addEventListener('click', function(e){
            if(e.target.classList.contains('remove-pill')){
                e.preventDefault();
                removeAnimal(e.target.dataset.name);
            }
        });

        filterBar.addEventListener('click', function(e){
            if(e.target.classList.contains('filter-btn')){
                filterBar.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
                e.target.classList.add('active');
                currentFilter = e.target.dataset.category;
                render();
            }
        });

        document.querySelectorAll('.unit-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
                document.querySelectorAll('.unit-btn').forEach(function(b){ b.classList.remove('active'); });
                btn.classList.add('active');
                useMetric = btn.dataset.unit === 'metric';
                render();
            });
        });

        searchBox.addEventListener('input', function(e){ searchTerm = e.target.value; render(); });
        humanRefToggle.addEventListener('change', function(e){ showHumanRef = e.target.checked; render(); });
        sortSelect.addEventListener('change', function(e){ sortBy = e.target.value; render(); });
        dimSelect.addEventListener('change', function(e){ dimMode = e.target.value; render(); });

        document.querySelectorAll('.quick-pick-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
                var names = btn.dataset.animals.split(',');
                selected = names.map(function(n){ return findAnimal(n.trim()); }).filter(Boolean);
                render();
            });
        });

        shareBtn.addEventListener('click', function(){
            var url = location.href;
            if(navigator.clipboard && navigator.clipboard.writeText){
                navigator.clipboard.writeText(url).then(function(){ toast('Link copied to clipboard'); },
                    function(){ toast('Copy failed — the link is in your address bar'); });
            } else {
                toast('The link is in your address bar');
            }
        });

        clearBtn.addEventListener('click', function(){ selected = []; render(); });

        infoOverlay.addEventListener('click', function(e){ if(e.target === infoOverlay) hideInfo(); });
        document.getElementById('infoClose').addEventListener('click', hideInfo);
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape') hideInfo(); });

        readStateFromUrl();
        render();
    })();
</script>
<script src="../logo.js"></script>
</body>
</html>
