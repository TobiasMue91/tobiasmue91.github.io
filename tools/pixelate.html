<script id="core">
(function (root) {
  'use strict';
  const C = {};

  // ---------- the mosaic ----------
  // The grid starts at the top-left pixel of the picture, so every area shares one grid and two areas side by side
  // join without a seam. A block that runs past the right or bottom edge averages only the pixels it covers.
  // Colours are averaged weighted by opacity (premultiplied), so a fully clear pixel lends no colour of its own and a
  // block's opacity is the mean opacity. Averages are taken in sRGB values, as Photoshop and GIMP's Mosaic/Pixelize do.
  C.blockAverages = function (src, W, H, b) {
    b = Math.max(1, Math.floor(b));
    const cols = Math.ceil(W / b), rows = Math.ceil(H / b);
    const out = new Uint8ClampedArray(cols * rows * 4);
    const sr = new Float64Array(cols), sg = new Float64Array(cols), sb = new Float64Array(cols),
      sa = new Float64Array(cols), n = new Float64Array(cols);
    for (let by = 0; by < rows; by++) {
      sr.fill(0); sg.fill(0); sb.fill(0); sa.fill(0); n.fill(0);
      const y1 = Math.min(H, (by + 1) * b);
      for (let y = by * b; y < y1; y++) {
        let i = y * W * 4;
        for (let x = 0, bx = 0, edge = b; x < W; x++, i += 4) {

    e.preventDefault();
    const f = it.getAsFile();
    if (!f) return;
    const ext = (f.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
    openFile(f.name && f.name !== 'image.png' ? f : new File([f], `pasted.${ext}`, {type: f.type}));
  });

  // ---------- saving ----------
  function fmtBytes(n) {
    if (!(n > 0)) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return Math.round(n / 1024) + ' KB';
    return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB';
  }
  function exportKey() { return [jobId, S.format, S.scale, S.mode].join('|'); }
  function exportCanvas(fmt) {
    let src = els.out;
    if (S.scale === 'blocks' && S.mode === 'whole') {
      const t = C.tiny(S.img.data, S.img.W, S.img.H, S.block, {colour: S.colour});
      src = document.createElement('canvas'); src.width = t.w; src.height = t.h;
      src.getContext('2d').putImageData(new ImageData(t.data, t.w, t.h), 0, 0);
    }
    if (fmt !== 'jpeg') return src;
    const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; // JPEG has no clear pixels: lay it on white
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0);
    return c;
  }
  function encode() {
    const key = exportKey(), fmt = C.formatFor(S.format, S.img.type);
    if (S.blob && S.blobKey === key) return Promise.resolve(S.blob);
    return new Promise(res => {
      const c = exportCanvas(fmt);
      c.toBlob(b => {
        if (key === exportKey()) { S.blob = b; S.blobKey = key; }
        res(b);
      }, C.FORMATS[fmt], fmt === 'png' ? undefined : 0.92);
    });
  }
  let encTimer = 0;
  function scheduleEncode() {
    updateMeta();
    clearTimeout(encTimer);
    if (!S.img || !S.result) return;
    const big = S.img.W * S.img.H > 8e6;
    encTimer = setTimeout(() => encode().then(updateMeta), big ? 900 : 350);
  }
  function blobName(b) {
    const fmt = b && b.type === 'image/png' ? 'png' : b && b.type === 'image/webp' ? 'webp' : b && b.type === 'image/jpeg' ? 'jpeg' : C.formatFor(S.format, S.img.type);
    return C.outputName(S.img.example ? 'example' : S.img.name, fmt);
  }
  function updateMeta() {
    if (!S.img) return;
    const fmt = C.formatFor(S.format, S.img.type).toUpperCase().replace('JPEG', 'JPG');
    const ready = S.blob && S.blobKey === exportKey();
    els.dlLabel.textContent = S.sizeBad ? 'Fix block size' : `Download ${fmt}`;
    els.dlSize.textContent = S.sizeBad ? '' : ready ? '· ' + fmtBytes(S.blob.size) : '· …';
    const tiny = S.scale === 'blocks' && S.mode === 'whole';
    const outW = tiny ? Math.ceil(S.img.W / S.block) : S.img.W, outH = tiny ? Math.ceil(S.img.H / S.block) : S.img.H;
    const parts = [S.img.example ? `<span class="ex">${matchMedia('(max-width: 860px)').matches ? 'Example picture' : 'Example picture · open or paste your own'}</span>` : `<b class="nm" title="${esc(S.img.name)}">${esc(S.img.name)}</b>`, `${S.img.W} × ${S.img.H} px`];
    if (S.img.bytes) parts.push(fmtBytes(S.img.bytes));
    if (tiny) parts.push(`saves at ${outW} × ${outH}`);
    if (S.img.scaled) parts.push(`shrunk from ${S.img.srcW} × ${S.img.srcH}: this browser can’t hold more`);
    els.meta.innerHTML = parts.map(p => p.startsWith('<') ? p : `<span>${p}</span>`).join('');
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  function blockedBySize() {
    if (!S.sizeBad) return false;
    sizeState(true, C.parseBlock(els.sizeNum.value, S.img ? S.img.W : 512, S.img ? S.img.H : 512).error);
    els.sizeNum.scrollIntoView({block: 'center'}); els.sizeNum.focus();
    return true;
  }
  els.download.addEventListener('click', async () => {
    if (blockedBySize() || !S.img || !S.result) return;
    const b = await encode();
    if (!b) { toast('Couldn’t make the file. Try PNG, or a smaller picture.'); return; }
    const a = document.createElement('a'), u = URL.createObjectURL(b);
    a.href = u; a.download = blobName(b); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
    toast(`Saved ${a.download}`);
  });
  if (navigator.clipboard && window.ClipboardItem) {
    els.copy.hidden = false;
    els.copy.addEventListener('click', async () => {
      if (blockedBySize() || !S.img || !S.result) return;
      const png = new Promise(res => (S.scale === 'blocks' && S.mode === 'whole' ? exportCanvas('png') : els.out).toBlob(res, 'image/png'));
      try { await navigator.clipboard.write([new ClipboardItem({'image/png': png})]); toast('Copied – paste it anywhere'); }
      catch (e) { toast('This browser didn’t allow copying. Use Download instead.'); }
    });
  }
  if (navigator.canShare && navigator.canShare({files: [new File([new Blob(['x'], {type: 'image/png'})], 'x.png', {type: 'image/png'})]}) && matchMedia('(pointer: coarse)').matches) {
    els.share.hidden = false; els.copy.hidden = true;
    els.share.addEventListener('click', async () => {
      if (blockedBySize() || !S.img || !S.result) return;
      const b = await encode();
      try { await navigator.share({files: [new File([b], blobName(b), {type: b.type})]}); }
      catch (e) { if (e && e.name !== 'AbortError') toast('Sharing didn’t work. Use Download instead.'); }
    });
  }

  // ---------- messages ----------
  let toastTimer = 0;
  function toast(t) { els.toast.textContent = t; els.toast.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => els.toast.classList.remove('on'), 2400); }
  function announce(t) { if (t) { els.announce.textContent = ''; setTimeout(() => { els.announce.textContent = t; }, 30); } }
  let annTimer = 0;
  function announceSoon() {
    clearTimeout(annTimer);
    annTimer = setTimeout(() => { if (S.img) announce(`Blocks of ${S.block} pixels, ${Math.ceil(S.img.W / S.block)} by ${Math.ceil(S.img.H / S.block)}`); }, 700);
  }

  // ---------- start ----------
  syncControls();
  restore().then(ok => { if (!ok) loadExample(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.img && S.img.example && !S.past.length) loadExample(); });
  window.__px = {S, C};
})();

</script>
</body>
</html>
