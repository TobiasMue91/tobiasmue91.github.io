<html lang="en">

<title>Word Explainer – What Does This Word Mean?</title>
<meta name="description" content="Type any English word or phrase and see what it means at once: every meaning with an example, synonyms and opposites, from the Princeton WordNet dictionary, looked up in your browser. Handles plurals, -ing and -ed forms and typos. Optional AI explains a word simply for a child, a teen or an expert, its origin or a picture of it, in 12 languages.">

<style>
:root {
  --paper: #f7f8f9; --card: #ffffff; --ink: #17191c; --soft: #555b63; --faint: #7a818a; --rule: #e1e4e8;
  --link: #1a5c8a; --link-wash: #e8f1f8; --chip: #f0f2f4; --err: #a12a1f; --err-wash: #fbeceb; --focus: #1a5c8a;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121417; --card: #1a1d21; --ink: #e9ebee; --soft: #a7adb5; --faint: #858c95; --rule: #2c3036;
    --link: #8cc4ec; --link-wash: #1d2c38; --chip: #23272c; --err: #f19a90; --err-wash: #33201e; --focus: #8cc4ec; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
main { max-width: 700px; margin: 0 auto; padding: 18px 16px 80px; }
h1 { font: 600 15px/1.3 var(--sans); margin: 0 0 10px; color: var(--soft); letter-spacing: .01em; }
h1 b { color: var(--ink); }
.search { position: relative; }
.search label { position: absolute; left: -9999px; }
#q { width: 100%; font: 400 26px/1.2 var(--serif); color: var(--ink); background: var(--card); border: 1.5px solid var(--rule);
  border-radius: 12px; padding: 12px 48px 12px 16px; outline: none; -webkit-appearance: none; appearance: none; }
#q::-webkit-search-cancel-button { display: none; }
#q:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
#clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 8px;
  background: none; color: var(--faint); font-size: 22px; cursor: pointer; }
#clear:hover { color: var(--ink); background: var(--chip); }
#status { min-height: 24px; margin: 8px 2px 6px; font-size: 14px; color: var(--soft); }
#status.err { color: var(--err); }
#status button { font: inherit; color: var(--link); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 20px; }
#result { min-height: 0; transition: opacity .15s; }
#result.dim { opacity: .55; }
.head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hw { font: 600 34px/1.15 var(--serif); margin: 0; overflow-wrap: anywhere; }
.via { color: var(--soft); font-size: 14px; }
.star { margin-left: auto; border: 1px solid var(--rule); background: var(--card); color: var(--soft); border-radius: 999px;
  padding: 5px 12px; font: 14px var(--sans); cursor: pointer; white-space: nowrap; }
.star[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.pos { font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: .09em; color: var(--soft); margin: 18px 0 6px; }
.pos span { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--faint); }
ol.senses { list-style: none; padding: 0; margin: 0; counter-reset: s; }
ol.senses > li { counter-increment: s; position: relative; padding: 7px 0 7px 28px; border-top: 1px solid var(--rule); }
ol.senses > li:first-child { border-top: 0; }
ol.senses > li::before { content: counter(s); position: absolute; left: 2px; top: 9px; font: 600 13px/1.6 var(--sans); color: var(--faint);
  font-variant-numeric: tabular-nums; }
.def { font: 400 18px/1.45 var(--serif); }

.ex { font: italic 400 16px/1.45 var(--serif); color: var(--soft); margin-top: 2px; }
.ex::before { content: '“'; } .ex::after { content: '”'; }
.rel { font-size: 14px; color: var(--soft); margin-top: 4px; line-height: 1.9; }
.rel a { color: var(--link); text-decoration: none; background: var(--link-wash); border-radius: 6px; padding: 2px 7px; margin-right: 2px; white-space: nowrap; }
.rel a:hover, .rel a:focus-visible { text-decoration: underline; }
.cp { position: absolute; right: 0; top: 7px; font: 13px var(--sans); color: var(--link); background: none; border: 0; padding: 4px 2px 4px 8px; cursor: pointer; }
ol.senses > li:has(.cp) .def { padding-right: 42px; }
.more { margin: 6px 0 0 28px; font: 14px var(--sans); color: var(--link); background: none; border: 0; padding: 6px 0; cursor: pointer; }
.entry + .entry { margin-top: 22px; padding-top: 16px; border-top: 2px solid var(--rule); }
.entry + .entry .hw { font-size: 26px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.btn { font: 500 15px var(--sans); border-radius: 10px; padding: 9px 14px; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  cursor: pointer; min-height: 42px; }
.btn:hover { border-color: var(--soft); }
.btn.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.src { font-size: 13px; color: var(--faint); margin: 14px 0 0; }
.fixnote { margin: 0 0 8px; font-size: 14px; color: var(--soft); }
.tag { display: inline-block; font: 600 12px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--link); background: var(--link-wash); border-radius: 5px; padding: 4px 7px; margin-bottom: 8px; }
#status.muted { color: var(--soft); }
.empty-msg { font: 400 19px/1.5 var(--serif); color: var(--soft); margin: 4px 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips a { color: var(--link); background: var(--link-wash); border-radius: 8px; padding: 6px 11px; text-decoration: none; font: 16px var(--serif); }
.chips a:hover, .chips a:focus-visible { text-decoration: underline; }
section.ai { margin-top: 18px; }
section.ai h2, section.lists h2 { font: 600 17px/1.3 var(--sans); margin: 0; }
section.ai .note { margin: 8px 0 8px; }
.note { font-size: 13px; color: var(--faint); margin: 0 0 12px; }
fieldset { border: 0; padding: 0; margin: 0 0 10px; min-width: 0; }
legend { font-size: 13px; color: var(--soft); margin-bottom: 4px; padding: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-block; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; font-size: 14px; background: var(--card); }
.seg input:checked + span { background: var(--ink); color: var(--card); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
details.opts > summary { font-size: 14px; color: var(--ink); cursor: pointer; margin: 0 0 10px; }
.aihead { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.aihead h2 { flex: 1 1 220px; }
details.langs summary { font-size: 14px; color: var(--soft); cursor: pointer; margin: 2px 0 8px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.row label { font-size: 13px; color: var(--soft); display: flex; flex-direction: column; gap: 3px; }
select { font: 15px var(--sans); padding: 7px 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); }
#aiOut { margin-top: 12px; }
#aiOut .txt { font: 400 18px/1.55 var(--serif); white-space: pre-wrap; }
#aiOut .meta { font-size: 13px; color: var(--faint); margin-top: 8px; }
#aiOut.err .txt { color: var(--err); font: 15px/1.5 var(--sans); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--rule); border-top-color: var(--ink); border-radius: 50%;
  animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
section.lists { margin-top: 18px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.tabs button { font: 14px var(--sans); border: 0; background: none; padding: 6px 10px; border-radius: 8px; color: var(--soft); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--chip); color: var(--ink); font-weight: 600; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--rule); }
.list li:first-child { border-top: 0; }
.list a { flex: 1; padding: 9px 2px; color: var(--ink); text-decoration: none; font: 17px var(--serif); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list a small { font: 13px var(--sans); color: var(--faint); margin-left: 6px; }
.list button { border: 0; background: none; color: var(--faint); font-size: 18px; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }
.list button:hover { color: var(--err); background: var(--chip); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 8px 14px;
  border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
.new { animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 520px) {
  h1 .sub { display: none; }
  .seg { gap: 5px; } .seg span { padding: 7px 10px; font-size: 13.5px; }
  main { padding-top: 12px; }
  #q { font-size: 23px; padding: 10px 44px 10px 13px; }
  .card { padding: 14px 14px; border-radius: 12px; }
  .hw { font-size: 29px; }
  .first .def { font-size: 19px; }
  .def { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .new, .spin { animation: none; } #result, .toast { transition: none; } }

<body>
<main>
  <h1><b>Word Explainer</b><span class="sub"> · what a word means, with examples</span></h1>
  <form class="search" role="search" onsubmit="return false">
    <label for="q">Word or phrase</label>
    <input id="q" type="search" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
      enterkeyhint="search" maxlength="4000" aria-describedby="status" placeholder="Type a word">
    <button id="clear" type="button" aria-label="Clear">×</button>
  </form>
  <div id="status" aria-live="polite"></div>

  <div id="result" class="card" aria-live="polite" aria-busy="false"></div>

  <section class="ai card" aria-labelledby="aiH">
    <h2 id="aiH">Explain <span id="aiWord">it</span> in plain words</h2>
    <fieldset style="margin-top:10px"><legend>Reader</legend><div class="seg" id="lvl"></div></fieldset>
    <details class="opts" id="opts"><summary><span class="sr">More options: </span><span id="optSum">Options</span></summary>
    <fieldset><legend>Focus</legend><div class="seg" id="typ"></div></fieldset>
    <fieldset><legend>Length</legend><div class="seg" id="len"></div></fieldset>
    <details class="langs"><summary id="langSum">Languages</summary>
      <div class="row">
        <label>Word is in <select id="lang"></select></label>
        <label>Answer in <select id="rlang"></select></label>
      </div>
    </details>
    </details>
    <button class="btn" id="aiGo" type="button">Explain with AI</button>
    <p class="note" id="aiNote">Only this panel goes online: pressing the button sends the word and your choices to OpenAI, through gptgames.dev.</p>
    <div id="aiOut" aria-live="polite"></div>
    <div class="bar" id="aiBar" hidden>
      <button class="btn" id="aiStop" type="button" hidden>Cancel</button>
      <button class="btn" id="aiCopy" type="button" hidden>Copy explanation</button>
      <button class="btn" id="aiSave" type="button" hidden>☆ Save</button>
    </div>
  </section>

  <section class="lists card" id="lists" hidden aria-labelledby="listH">
    <h2 id="listH" class="sr">Your words</h2>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabH" aria-selected="true" aria-controls="listBox">Recent</button>
      <button role="tab" id="tabF" aria-selected="false" aria-controls="listBox">Saved</button>
    </div>
    <ul class="list" id="listBox" role="tabpanel"></ul>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script id="core">
(function () {
  'use strict';
  // Dictionary: Princeton WordNet 3.0, sharded by the first two letters (util/word_explainer/build.py).
  // A synset record is [pos, definition, examples, synonyms, kind, opposites, tagged count].
  const POS = {n: 'noun', v: 'verb', a: 'adjective', r: 'adverb'};
  const LEVELS = {
    elementary: ['Elementary', 'For young children (ages 6-10)', 'Child'],
    middle: ['Middle School', 'For pre-teens (ages 11-13)', 'Pre-teen'],
    high: ['High School', 'For teenagers (ages 14-18)', 'Teen'],
    college: ['College', 'For college students', 'Adult'],
    academic: ['Academic', 'Scholarly level with technical details', 'Expert']
  };
  const TYPES = {
    definition: ['Definition', 'Focus on clear meaning and usage', 'Meaning'],
    example: ['Examples', 'Include real-world examples', 'Examples'],
    etymology: ['Etymology', 'Focus on word origins and historical development', 'Origin'],
    visual: ['Visual/Metaphor', 'Use imagery and comparisons to explain', 'Picture it']
  };
  const LENGTHS = {brief: ['Brief', '1-2 sentences'], standard: ['Standard', 'A paragraph'], detailed: ['Detailed', 'Multiple paragraphs']};
  const LANGS = {en: 'English', es: 'Spanish', fr: 'French', de: 'German', it: 'Italian', pt: 'Portuguese', ru: 'Russian',
    zh: 'Chinese', ja: 'Japanese', ko: 'Korean', ar: 'Arabic', hi: 'Hindi'};
  const DEFAULTS = {educationalLevel: 'college', explanationType: 'definition', explanationLength: 'standard', language: 'auto', responseLanguage: 'same'};
  const MAX_WORD = 60, MAX_HISTORY = 20, MAX_FAVORITES = 500;

  // What people paste: stray spaces, quotes and punctuation round it, curly apostrophes, capitals,
  // non-breaking and zero-width spaces, a trailing footnote mark. Inner hyphens and apostrophes stay.
  function normalize(raw) {
    let s = String(raw == null ? '' : raw).normalize('NFC')
      .replace(/[​-‍⁠﻿­]/g, '')
      .replace(/[  -   　\s]+/g, ' ')
      .replace(/[‘’ʼ`´]/g, "'")
      .replace(/[‐-—−]/g, '-')
      .trim();
    s = s.replace(/^[\s"'“”«»„‚‹›()\[\]{}<>*_.,;:!?¿¡\-–—…]+/, '').replace(/[\s"'“”«»„‚‹›()\[\]{}<>*_.,;:!?¿¡\-–—…¹²³⁰-⁹†‡]+$/, '');
    return s.trim();
  }
  const key = w => w.toLowerCase();
  function shardOf(w) {
    let k = '';
    for (const c of (key(w) + '__').slice(0, 2)) k += c >= 'a' && c <= 'z' ? c : '_';
    return k;
  }
  // English if every letter is a Latin one (stray markup or quotes inside are a miss, not another language)
  const latin = s => !/[^\P{L}\p{Script=Latin}]/u.test(s);
  const deaccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

  // WordNet's morphy: its detachment rules per part of speech, plus a doubled final consonant
  // (running -> run, bigger -> big) which morphy leaves to its exception lists.
  const RULES = {
    n: [['s', ''], ['ses', 's'], ['xes', 'x'], ['zes', 'z'], ['ches', 'ch'], ['shes', 'sh'], ['men', 'man'], ['ies', 'y']],
    v: [['s', ''], ['ies', 'y'], ['es', 'e'], ['es', ''], ['ed', 'e'], ['ed', ''], ['ing', 'e'], ['ing', '']],
    a: [['er', ''], ['est', ''], ['er', 'e'], ['est', 'e'], ['ier', 'y'], ['iest', 'y']],
    r: []
  };
  const PAST = {n: 'plural of', v: 'form of', a: 'form of', r: 'form of'};
  function baseForms(w) {
    // -> [{base, pos, how}] candidate dictionary forms, the word itself first
    const out = [], seen = new Set();
    const add = (base, pos, how) => { const k = base + '|' + (pos || ''); if (base && !seen.has(k)) { seen.add(k); out.push({base, pos, how}); } };
    add(w, null, '');
    if (w.includes(' ')) { add(w.replace(/ /g, '-'), null, ''); add(w.replace(/ /g, ''), null, ''); }
    if (w.includes('-')) { add(w.replace(/-/g, ' '), null, ''); add(w.replace(/-/g, ''), null, ''); }
    if (/'s$/.test(w)) add(w.slice(0, -2), null, 'possessive of');
    if (/s'$/.test(w)) add(w.slice(0, -1), null, 'possessive of');
    // a phrase inflects on its first word (kicked the bucket) or its last (sea lions)
    const parts = w.split(' ');
    for (const p of ['n', 'v', 'a']) {
      const one = (word, cb) => {
        for (const [suf, rep] of RULES[p]) {
          if (word.length > suf.length + 1 && word.endsWith(suf)) {
            const b = word.slice(0, -suf.length) + rep;
            cb(b);
            if (rep === '' && /([bcdfgklmnprstvz])\1$/.test(b) && (suf === 'ing' || suf === 'ed' || suf === 'er' || suf === 'est')) cb(b.slice(0, -1));
          }
        }
      };
      one(parts[parts.length - 1], b => add(parts.slice(0, -1).concat(b).join(' '), p, p === 'n' ? 'plural of' : 'form of'));
      if (parts.length > 1) one(parts[0], b => add([b].concat(parts.slice(1)).join(' '), p, 'form of'));
    }
    return out;
  }

  function create(getShard) {
    // getShard(key) -> shard object or undefined (not loaded yet)
    function need(words) {
      const ks = new Set();
      for (const w of words) ks.add(shardOf(w));
      return [...ks];
    }
    function exc(form) {
      const sh = getShard(shardOf(form));
      return sh && sh.x && Object.prototype.hasOwnProperty.call(sh.x, form) ? sh.x[form] : [];
    }
    function senses(lemma, posFilter) {
      const sh = getShard(shardOf(lemma));
      if (!sh || !Object.prototype.hasOwnProperty.call(sh.w, lemma)) return [];
      return sh.w[lemma].map(id => ({id, rec: sh.s[id]})).filter(x => x.rec && (!posFilter || x.rec[0] === posFilter));
    }
    function entry(lemma, list, how, from) {
      // group senses by part of speech; a group's rank is its tagged frequency, ties keep WordNet's order
      const groups = [];
      for (const {id, rec} of list) {
        let g = groups.find(x => x.pos === rec[0]);
        if (!g) groups.push(g = {pos: rec[0], name: POS[rec[0]], count: 0, senses: []});
        g.count += rec[6];
        g.senses.push({id, def: rec[1], examples: rec[2], synonyms: rec[3].filter(s => key(s) !== lemma), kind: rec[4], opposites: rec[5], tagged: rec[6]});
      }
      groups.sort((a, b) => b.count - a.count);
      const display = (list[0] && list[0].rec[3].find(s => key(s) === lemma)) || lemma;
      return {lemma, display, how, from, groups, total: list.length};
    }
    // look(q) -> {status:'need', shards} | {status:'empty'} | {status:'found', entries, query}
    //   | {status:'missing', query, suggestions, need?} | {status:'sentence', words} | {status:'number'|'foreign'|'long'}
    function look(raw) {
      const q = normalize(raw);
      const num = String(raw == null ? '' : raw).trim();
      if (/^[-+−]?[\d\s.,]*\d[\d\s.,%]*$/.test(num)) return {status: 'number', query: num};
      if (!q) return {status: 'empty'};
      const words = q.split(/[\s]+/);
      if (q.length > MAX_WORD || words.length > 5) {
        const pick = [], seen = new Set();
        for (const w of String(raw).slice(0, 4000).split(/[^\p{L}\p{M}'\-]+/u)) {
          const n = normalize(w), k = key(n);
          if (n.length > 2 && !seen.has(k) && !STOP.has(k)) { seen.add(k); pick.push(n); }
          if (pick.length >= 24) break;
        }
        return {status: 'sentence', query: q.slice(0, 80), words: pick};
      }
      if (!latin(q)) return {status: 'foreign', query: q};
      const w = key(deaccent(q) === q ? q : q);
      const plain = key(deaccent(q));
      const tryWords = [w];
      if (plain !== w) tryWords.push(plain);
      const cands = [];
      for (const t of tryWords) for (const c of baseForms(t)) cands.push(c);
      // irregular forms (went -> go, mice -> mouse) live in the shard of the form
      const want = need(tryWords);
      const missingFirst = want.filter(k => !getShard(k));
      if (missingFirst.length) return {status: 'need', shards: missingFirst};
      // the irregular form may sit under a possessive or a phrase variant (children's -> children -> child)
      const forms = [...new Set(cands.filter(c => !c.pos).map(c => c.base))];
      const want1 = need(forms).filter(k => !getShard(k));
      if (want1.length) return {status: 'need', shards: want1};
      for (const f of forms) for (const [b, p] of exc(f)) cands.push({base: b, pos: p, how: p === 'n' ? 'plural of' : 'form of'});
      const want2 = need(cands.map(c => c.base)).filter(k => !getShard(k));
      if (want2.length) return {status: 'need', shards: want2};
      // an inflection only counts for the part of speech it inflects (ran is the verb run, not the noun);
      // readings of one base merge, and a sense reached twice (e-mail, email) is shown once
      const byBase = new Map(), ids = new Set();
      for (const c of cands) {
        const list = senses(c.base, c.pos).filter(x => !ids.has(x.id));
        if (!list.length) continue;
        list.forEach(x => ids.add(x.id));
        const b = byBase.get(c.base);
        if (!b) byBase.set(c.base, {list, how: c.how});

    renderStar();
    setAiWord(aiTarget);
    if (current && !example) recordTimer = setTimeout(() => record(''), 1500);
  }
  function record(explanation) {
    const w = explanation ? aiWord : current && current.display;
    if (!w) return;
    hist = C.addHistory(hist, Object.assign({word: w}, S, {explanation, timestamp: new Date().toISOString()}));
    saveLists(); renderLists();
  }

  // a single-edit misspelling with a clearly common correction is shown straight away, the way search engines do
  const look0 = L.look;
  L.look = raw => {
    const r = look0(raw);
    if (r.status === 'missing' && r.best && r.best.d === 1 && r.best.freq > 0 && C.normalize(raw).length >= 4) {
      const r2 = look0(r.best.word);
      if (r2.status === 'found') { r2.fixed = r.query; r2.query = r.query; return r2; }
      if (r2.status === 'need') return r2;
    }
    return r;
  };

  result.addEventListener('click', e => {
    const a = e.target.closest('a[data-w]');
    if (a) { e.preventDefault(); setWord(a.dataset.w); return; }
    const c = e.target.closest('[data-copy]');
    if (c) { const r = result._r, ent = r.entries[+c.dataset.e], g = ent.groups[+c.dataset.g]; copy(C.plainText(ent, g.senses[+c.dataset.s], g.name), 'Meaning copied'); return; }
    const m = e.target.closest('.more');
    if (m) {
      const r = result._r, ent = r.entries[+m.dataset.e], g = ent.groups[+m.dataset.g];
      const ol = m.previousElementSibling, shown = ol.children.length;
      ol.insertAdjacentHTML('beforeend', g.senses.slice(shown).map((s, j) => senseHtml(s, false, g.pos, [+m.dataset.e, +m.dataset.g, shown + j])).join(''));
      ol.children[shown].classList.add('new');
      const first = ol.children[shown].querySelector('a'); if (first) first.focus({preventScroll: true});
      m.remove(); return;
    }
    if (e.target.id === 'star' && current) {
      favs = C.toggleFavorite(favs, Object.assign({word: current.display}, S, {explanation: aiWord === current.display ? aiText : '', timestamp: new Date().toISOString()}));
      saveLists(); renderLists(); renderStar(); toast(isFav(current.display) ? 'Saved' : 'Removed from saved'); return;
    }
    if (e.target.id === 'link' && current) copy(location.origin + location.pathname + '?w=' + encodeURIComponent(current.display), 'Link copied');
  });

  async function copy(text, ok) {
    try { await navigator.clipboard.writeText(text); toast(ok); }
    catch (e) {
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      const done = document.execCommand && document.execCommand('copy'); t.remove();
      toast(done ? ok : 'Couldn’t copy – select the text and copy it yourself');
    }
  }
  let tt = 0;
  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

  // ---- AI ----
  let aiText = '', aborter = null;
  function setAiWord(w) {
    if (w !== aiWord) {
      aiWord = w; aiText = '';
      if (aborter) aborter.abort();
      $('aiOut').innerHTML = ''; $('aiOut').className = ''; $('aiCopy').hidden = true;
    }
    $('aiWord').textContent = w ? '“' + w + '”' : 'a word';
    $('aiGo').disabled = !w;
    document.querySelector('section.ai').hidden = !w;
    $('aiNote').textContent = w ? 'Only this panel goes online: pressing the button sends the word and your choices to OpenAI, through gptgames.dev.' : 'Pick or type a word above first.';
    if (pendingAi && w && pendingAi.word.toLowerCase() === w.toLowerCase()) { showAi(pendingAi.explanation, false, true); }
    pendingAi = null;
  }
  function showAi(text, cut, fromHistory) {
    aiText = text;
    $('aiOut').className = 'new';
    $('aiOut').innerHTML = `<div class="txt" lang="${S.responseLanguage === 'same' ? '' : S.responseLanguage}">${esc(text)}</div><div class="meta">${cut ? 'Cut short – ask for a shorter length for the whole of it. ' : ''}` +
      `${fromHistory ? 'Saved AI explanation' : 'Written by AI'} for ${/^[AE]/.test(C.LEVELS[S.educationalLevel][2]) ? 'an' : 'a'} ${esc(C.LEVELS[S.educationalLevel][2].toLowerCase())} reader.</div>`;
    $('aiCopy').hidden = false; $('aiBar').hidden = false; $('aiSave').hidden = false; renderStar();
  }
  $('aiGo').onclick = async () => {
    if (!aiWord) return;
    if (aborter) aborter.abort();
    const a = aborter = new AbortController();
    const timer = setTimeout(() => a.abort('timeout'), 30000);
    const sense = current && current.display === aiWord ? current.groups[0].senses[0].def : '';
    $('aiGo').disabled = true; $('aiStop').hidden = false; $('aiCopy').hidden = true; $('aiBar').hidden = false;
    $('aiOut').className = ''; $('aiOut').innerHTML = '<span class="spin"></span><span class="note">Writing an explanation…</span>';
    try {
      const res = await fetch(C.AI_URL, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(C.aiRequest(aiWord, S, sense)), signal: a.signal});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const p = C.aiParse(await res.json());
      if (!p.ok) throw new Error(p.reason);
      showAi(p.text, p.cut, false);
      record(p.text);
    } catch (e) {
      if (a.signal.aborted && a.signal.reason !== 'timeout') { $('aiOut').innerHTML = '<p class="note">Cancelled.</p>'; }
      else {
        const why = e.message === 'notword' ? `The AI doesn’t recognise “${esc(aiWord)}” as a word in any language. Check the spelling.`
          : a.signal.reason === 'timeout' ? 'The AI took too long to answer. Try again in a moment.'
          : 'The AI couldn’t be reached. The dictionary above still works; try again in a moment.';
        $('aiOut').className = 'err'; $('aiOut').innerHTML = `<div class="txt">${why}</div>`;
      }
    } finally {
      clearTimeout(timer);
      if (aborter === a) aborter = null;
      $('aiGo').disabled = !aiWord; $('aiStop').hidden = true; if (!aiText) $('aiBar').hidden = true;
    }
  };
  $('aiStop').onclick = () => { if (aborter) aborter.abort(); };
  $('aiCopy').onclick = () => copy(aiText, 'Explanation copied');

  // ---- input ----
  let deb = 0;
  q.addEventListener('input', () => {
    example = false; store.sset('wordExplainerDraft', q.value);
    clearTimeout(deb); deb = setTimeout(run, shards.size ? 60 : 120);
  });
  q.addEventListener('focus', () => { if (example) q.select(); });
  q.addEventListener('blur', () => { q.scrollLeft = 0; });
  q.addEventListener('keydown', e => { if (e.key === 'Escape' && q.value) { q.select(); } if (e.key === 'Enter') { clearTimeout(deb); run(); q.blur(); } });
  $('clear').onclick = () => { q.value = ''; example = false; store.sset('wordExplainerDraft', ''); q.focus(); run(); };
  addEventListener('pageshow', () => {});

  // ---- start: ?w= link, then this tab's draft, then the worked example ----
  const fromLink = C.fromUrl(location.search);
  const draft = store.sget('wordExplainerDraft');
  if (fromLink) q.value = fromLink;
  else if (draft !== null) q.value = draft;
  else { q.value = 'ephemeral'; example = true; }
  renderLists();
  run();
})();
</script>
<script src="../logo.js" data-position="top-right"></script>
</body>
</html>
