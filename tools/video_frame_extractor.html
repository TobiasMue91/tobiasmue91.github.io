<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Frame Extractor</title>
    <style>* {
        margin: 0;
        padding: 0;
        box-sizing: border-box
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        color: #fff;
        line-height: 1.6
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px
    }

    .header {
        text-align: center;
        margin-bottom: 30px
    }

    .header h1 {
        font-size: 2.5rem;
        font-weight: 300;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text
    }

    .upload-zone {
        border: 2px dashed #555;
        border-radius: 12px;
        padding: 60px 20px;
        text-align: center;
        background: #2a2a2a;
        transition: all 0.3s ease;
        cursor: pointer
    }

    .upload-zone:hover {
        border-color: #667eea;
        background: #333
    }

    .upload-zone.dragover {
        border-color: #667eea;
        background: #333;
        transform: scale(1.02)
    }

    .upload-icon {
        font-size: 3rem;
        margin-bottom: 20px;
        opacity: 0.7
    }

    .video-container {
        display: none;
        background: #2a2a2a;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 20px
    }

    video {
        width: 100%;
        height: auto;
        max-height: 500px;
        object-fit: contain;
        background: #000
    }

    .controls {
        padding: 20px;
        background: #333
    }

    .controls-row {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px
    }

    .time-info {
        display: flex;
        gap: 10px;
        font-size: 0.9rem;
        color: #ccc
    }

    .progress-container {
        flex: 1;
        position: relative;
        height: 8px;
        background: #555;
        border-radius: 4px;
        cursor: pointer
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #667eea, #764ba2);
        border-radius: 4px;
        transition: width 0.1s
    }

    .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: transform 0.2s
    }

    .btn:hover {
        transform: translateY(-1px)
    }

    .btn:active {
        transform: translateY(0)
    }

    .btn-secondary {
        background: #555
    }

    .btn-small {
        padding: 6px 12px;
        font-size: 0.8rem
    }

    .extraction-panel {
        background: #2a2a2a;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px
    }

    .panel-title {
        font-size: 1.2rem;
        margin-bottom: 15px;
        color: #667eea
    }

    .form-group {
        margin-bottom: 15px
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #ccc
    }

    .form-group input, .form-group select {
        width: 100%;
        padding: 8px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #333;
        color: #fff
    }

    .form-row {
        display: flex;
        gap: 15px
    }

    .form-row .form-group {
        flex: 1
    }

    .preview-grid {
        display: grid;
        grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 20px
    }

    .frame-item {
        background: #2a2a2a;
        border-radius: 8px;
        overflow: hidden;
        position: relative
    }

    .frame-item img {
        width: 100%;
        height: auto;
        display: block
    }

    .frame-info {
        padding: 10px;
        font-size: 0.8rem;
        color: #ccc
    }

    .frame-actions {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 5px
    }

    .download-btn {
        background: rgba(0, 0, 0, 0.7);
        border: none;
        color: white;
        padding: 5px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.7rem
    }

    .hidden {
        display: none
    }

    @media (max-width: 768px) {
        .form-row {
            flex-direction: column
        }

        .controls-row {
            flex-wrap: wrap
        }

        .btn {
            padding: 10px 16px
        }
    }</style>
</head>
<body>
<div class="container">
    <div class="header"><h1>Video Frame Extractor</h1>
        <p>Extract high-quality frames from your videos</p></div>
    <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">🎬</div>
        <h3>Drop your video here or click to browse</h3>
        <p>Supports MP4, WebM, AVI, MOV and more</p><input type="file" id="videoInput" accept="video/*"
                                                           style="display:none"></div>
    <div class="video-container" id="videoContainer">
        <video id="videoPlayer" preload="metadata"></video>
        <div class="controls">
            <div class="controls-row">
                <button class="btn btn-small" id="playBtn">▶️</button>
                <button class="btn btn-small" id="prevFrameBtn">⏮️</button>
                <button class="btn btn-small" id="nextFrameBtn">⏭️</button>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="time-info"><span id="currentTime">0:00</span><span>/</span><span id="duration">0:00</span><span id="frameInfo"></span>
                </div>
            </div>
            <div class="controls-row"><input type="range" id="frameSlider" min="0" step="1" style="flex:1">
                <button class="btn btn-small" id="extractBtn">📷 Extract Frame</button>
            </div>
        </div>
    </div>
    <div class="extraction-panel hidden" id="extractionPanel"><h3 class="panel-title">Frame Extraction Settings</h3>
        <div class="form-row">
            <div class="form-group"><label>Output Format</label><select id="formatSelect">
                <option value="png">PNG (Lossless)</option>
                <option value="jpeg">JPEG (Compressed)</option>
            </select></div>
            <div class="form-group"><label>JPEG Quality</label><input type="range" id="qualitySlider" min="0.1" max="1"
                                                                      step="0.1" value="0.9"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Batch Extract Every (seconds)</label><input type="number" id="intervalInput"
                                                                                       min="0.1" step="0.1" value="1">
            </div>
            <div class="form-group" style="display:flex;align-items:end">
                <button class="btn" id="batchExtractBtn">Extract Multiple</button>
            </div>
        </div>
    </div>
    <div class="preview-grid" id="previewGrid"></div>
</div>
<canvas id="extractCanvas" style="display:none"></canvas>
<script>// Browsers report no frame rate, and a frame starts at a rounded timestamp (to the millisecond in
// WebM), so adding 1/30 s to currentTime lands on the same frame or skips one. The clock reads the
// start time of each frame the video presents (requestVideoFrameCallback), learns the frame
// duration from those, and seeks to the middle of the frame it wants - or, where frames are not
// on a regular grid, searches for the seek time where the picture changes.
function frameClock(video, onFrame) {
    const EPS = 0.0005, rvfc = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
    const c = {first: 0, dur: 1 / 30, count: 0, exact: false, measured: false, measuring: false, shown: 0};
    let queue = Promise.resolve();
    if (rvfc) video.requestVideoFrameCallback(function track(now, md) {
        c.shown = md.mediaTime;
        if (onFrame) onFrame();
        video.requestVideoFrameCallback(track)
    });
    const end = () => isFinite(video.duration) ? video.duration : 0;
    // Seek, and resolve with the start time of the frame then on screen, or null if the browser won't say.
    const show = t => new Promise(resolve => {
        const before = c.shown;
        let id = 0, timer = 0, done = false, ended = false, got;
        const finish = v => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            clearTimeout(limit);
            video.removeEventListener('seeked', seeked);
            video.removeEventListener('emptied', emptied);
            if (id) video.cancelVideoFrameCallback(id);
            if (v !== null) c.shown = v;
            resolve(v)
        };
        // A frame presented after the seek has ended is the seek's frame, and so is a different
        // one presented before it ends. The frame already on screen can be presented once more
        // as the seek begins, so that one counts only if nothing newer follows.
        const frame = (now, md) => {
            id = 0;
            got = md.mediaTime;
            if (ended) return finish(got);
            if (got === before) id = video.requestVideoFrameCallback(frame)
        };
        // a seek that presents no frame (a hidden tab) resolves unknown once it has plainly ended
        const seeked = () => {
            ended = true;
            if (got !== undefined && got !== before) return finish(got);
            timer = setTimeout(() => finish(got === undefined ? null : got), got === undefined ? 1000 : 200)
        };
        // a new video abandons the seek
        const emptied = () => finish(null);
        const limit = setTimeout(() => finish(got === undefined ? null : got), 5000);
        if (Math.abs(video.currentTime - t) < 1e-6) t += t >= end() ? -1e-5 : 1e-5;
        if (rvfc) id = video.requestVideoFrameCallback(frame);
        video.addEventListener('seeked', seeked);
        video.addEventListener('emptied', emptied);
        video.currentTime = Math.max(0, t)
    });
    c.run = fn => {
        const p = queue.then(fn);
        queue = p.catch(() => {});
        return p
    };
    c.index = t => Math.max(0, Math.min(c.count - 1, Math.round((t - c.first) / c.dur)));
    c.middle = n => Math.min(c.first + (n + 0.5) * c.dur, end());
    // start time of the frame on screen
    c.now = () => rvfc && c.measured ? c.shown : video.currentTime;
    // off a regular grid a frame's number cannot be told from its time, so it has none
    c.label = t => c.measured && c.exact ? String(c.index(t) + 1) : '';
    c.status = t => c.measuring ? 'counting frames…' : !c.measured ? '' :
        c.exact ? `frame ${c.label(t)} of ${c.count}` : 'variable frame rate';
    c.goto = n => c.run(() => show(c.middle(Math.max(0, Math.min(c.count - 1, n)))));
    c.seek = t => c.run(() => show(t));
    // Off a regular grid a frame does not always appear from its own start time when sought, so
    // search seek times for where the picture changes: walk out from a time that shows the
    // frame until another one shows, then halve the gap.
    const search = async (dir, from, near) => {
        let far = null, s = null;
        for (let step = c.dur; ; step *= 2) {
            const t = Math.max(0, Math.min(end(), near + dir * step));
            if (t === near) return;
            s = await show(t);
            if (s === null) return;
            if (s !== from) {
                far = t;
                break
            }
            near = t
        }
        while (Math.abs(far - near) > EPS) {
            const t = (near + far) / 2, m = await show(t);
            if (m === null) return;
            if (m === from) near = t; else {
                far = t;
                s = m
            }
        }
        if (c.shown !== s) await show(far)
    };
    c.step = dir => c.run(async () => {
        if (!c.measured) return show(c.middle(Math.max(0, Math.floor((video.currentTime - c.first) / c.dur + 1e-6) + dir)));
        const from = c.shown, at = video.currentTime;
        if (c.exact) {
            // on a regular grid, the middle of the neighbouring frame is one seek away
            const n = c.index(from) + dir;
            if (n < 0 || n >= c.count) return;
            const s = await show(c.middle(n));
            if (s === null || Math.abs(s - (c.first + n * c.dur)) < 0.0011) return;
            await show(at)
        }
        await search(dir, from, at)
    });
    c.measure = () => c.run(async () => {
        Object.assign(c, {first: 0, dur: 1 / 30, exact: false, measured: false, measuring: true});
        c.count = Math.max(1, Math.round(end() / c.dur));
        try {
            if (!rvfc) return;
            if (video.readyState < 2) await new Promise(r => {
                video.addEventListener('loadeddata', r, {once: true});
                setTimeout(r, 5000)
            });
            // recordings made with MediaRecorder carry no duration until the browser has read to the end
            if (!isFinite(video.duration)) await new Promise(r => {
                const t = setTimeout(r, 3000);
                video.addEventListener('durationchange', () => {
                    clearTimeout(t);
                    r()
                }, {once: true});
                video.currentTime = 1e101
            });
            const last = end(), first = await show(0);
            if (first === null) return;
            // bracket the second frame, then halve the bracket down to its start time
            let lo = first, hi = null;
            for (let span = 0.25; hi === null; span *= 2) {
                const t = Math.min(first + span, last), s = await show(t);
                if (s === null) return;
                if (s > first + EPS / 2) hi = s; else if (t >= last) break; else lo = t
            }
            if (hi === null) return Object.assign(c, {first, dur: last - first || 1 / 30, count: 1, exact: true, measured: true});
            while (hi - lo > EPS) {
                const t = (lo + hi) / 2, s = await show(t);
                if (s === null) return;
                if (s > first + EPS / 2) hi = s; else lo = t
            }
            // a browser that reports the time asked for, rather than the frame's own, gets no frame numbers
            if (await show(hi - EPS) !== first) return;
            // refine on frames 4, 16, 64, ... frames on and the last one, so rounding stops mattering
            let dur = Math.max(hi - first, 0.001);
            const seen = [[1, hi]];
            for (let k = 4; ; k *= 4) {
                const t = Math.min(first + (k + 0.5) * dur, last), s = await show(t);
                if (s === null) return;
                const n = Math.round((s - first) / dur);
                if (n > 0) {
                    dur = (s - first) / n;
                    seen.push([n, s])
                }
                if (t >= last) break
            }
            Object.assign(c, {
                first, dur, count: seen[seen.length - 1][0] + 1, measured: true,
                exact: seen.every(([n, s]) => Math.abs(first + n * dur - s) < 0.0011)
            });
            await show(c.middle(0))
        } finally {
            c.measuring = false
        }
    });
    return c
}

class VideoFrameExtractor {
    constructor() {
        this.video = document.getElementById('videoPlayer');
        this.canvas = document.getElementById('extractCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.uploadZone = document.getElementById('uploadZone');
        this.videoContainer = document.getElementById('videoContainer');
        this.extractionPanel = document.getElementById('extractionPanel');
        this.previewGrid = document.getElementById('previewGrid');
        this.clock = frameClock(this.video, () => this.updateProgress());
        this.wantedFrame = null;
        this.setupEventListeners()
    }

    setupEventListeners() {
        const videoInput = document.getElementById('videoInput');
        const uploadZone = this.uploadZone;
        uploadZone.addEventListener('click', () => videoInput.click());
        uploadZone.addEventListener('dragover', e => {
            e.preventDefault();
            uploadZone.classList.add('dragover')
        });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) this.loadVideo(files[0])
        });
        videoInput.addEventListener('change', e => {
            if (e.target.files.length > 0) this.loadVideo(e.target.files[0])
        });
        document.getElementById('playBtn').addEventListener('click', () => this.togglePlay());
        document.getElementById('prevFrameBtn').addEventListener('click', () => this.previousFrame());
        document.getElementById('nextFrameBtn').addEventListener('click', () => this.nextFrame());
        document.getElementById('extractBtn').addEventListener('click', () => this.extractCurrentFrame());
        document.getElementById('batchExtractBtn').addEventListener('click', () => this.batchExtract());
        const progressContainer = document.getElementById('progressContainer');
        progressContainer.addEventListener('click', e => this.seekToPosition(e));
        const frameSlider = document.getElementById('frameSlider');
        frameSlider.addEventListener('input', () => this.seekToFrame(frameSlider.value));
        this.video.addEventListener('loadedmetadata', () => this.onVideoLoaded());
        this.video.addEventListener('timeupdate', () => this.updateProgress())
    }

    loadVideo(file) {
        const url = URL.createObjectURL(file);
        this.video.src = url;
        this.uploadZone.style.display = 'none';
        this.videoContainer.style.display = 'block';
        this.extractionPanel.classList.remove('hidden')
    }

    onVideoLoaded() {
        document.getElementById('frameSlider').max = 0;
        document.getElementById('duration').textContent = this.formatTime(this.video.duration);
        this.canvas.width = this.video.videoWidth;
        this.canvas.height = this.video.videoHeight;
        this.clock.measure().then(() => {
            document.getElementById('frameSlider').max = this.clock.count - 1;
            document.getElementById('duration').textContent = this.formatTime(this.video.duration);
            this.updateProgress()
        })
    }

    togglePlay() {
        if (this.video.paused) this.video.play(); else this.video.pause();
        document.getElementById('playBtn').textContent = this.video.paused ? '▶️' : '⏸️'
    }

    previousFrame() {
        this.video.pause();
        this.clock.step(-1)
    }

    nextFrame() {
        this.video.pause();
        this.clock.step(1)
    }

    seekToPosition(e) {
        const rect = e.target.getBoundingClientRect();
        const percentage = (e.clientX - rect.left) / rect.width;
        this.video.currentTime = percentage * this.video.duration
    }

    // a drag fires faster than seeks finish, so only the latest frame asked for is visited
    seekToFrame(frame) {
        const busy = this.wantedFrame !== null;
        this.wantedFrame = +frame;
        if (busy) return;
        const go = n => this.clock.goto(n).then(() => {
            if (this.wantedFrame !== n) return go(this.wantedFrame);
            this.wantedFrame = null;
            this.updateProgress()
        });
        go(this.wantedFrame)
    }

    updateProgress() {
        const t = this.clock.now();
        const progress = (t / this.video.duration) * 100;
        document.getElementById('progressBar').style.width = progress + '%';
        document.getElementById('currentTime').textContent = this.formatTime(t, true);
        document.getElementById('frameInfo').textContent = this.clock.status(t);
        if (this.wantedFrame === null) document.getElementById('frameSlider').value = this.clock.index(t)
    }

    // queued behind any step still seeking, so the grab is the frame the step lands on
    extractCurrentFrame() {
        return this.clock.run(() => {
            this.ctx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
            const time = this.clock.now();
            const format = document.getElementById('formatSelect').value;
            const quality = parseFloat(document.getElementById('qualitySlider').value);
            const mimeType = format === 'png' ? 'image/png' : `image/jpeg`;
            this.canvas.toBlob(blob => {
                this.addFrameToPreview(blob, time, format)
            }, mimeType, quality)
        })
    }

    // the frame on screen at 0 s, interval, 2 × interval, ..., each frame once
    async batchExtract() {
        const interval = parseFloat(document.getElementById('intervalInput').value);
        if (!(interval > 0)) return;
        await this.clock.run(() => {});
        if (!isFinite(this.video.duration)) return;
        let last = null;
        for (let k = 0; k * interval <= this.video.duration; k++) {
            const shown = await this.clock.seek(k * interval + 1e-6);
            if (shown !== null && shown === last) continue;
            last = shown;
            this.extractCurrentFrame();
            await new Promise(r => setTimeout(r, 100))
        }
    }

    addFrameToPreview(blob, time, format) {
        const frame = this.clock.label(time);
        const frameItem = document.createElement('div');
        frameItem.className = 'frame-item';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(blob);
        const info = document.createElement('div');
        info.className = 'frame-info';
        info.textContent = frame ? `Frame ${frame} at ${this.formatTime(time, true)}` : `Frame at ${this.formatTime(time, true)}`;
        const actions = document.createElement('div');
        actions.className = 'frame-actions';
        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'download-btn';
        downloadBtn.textContent = '⬇️';
        const name = frame ? `frame_${frame}_` : 'frame_';
        downloadBtn.onclick = () => this.downloadFrame(blob, `${name}${this.formatTime(time, true).replace(':', 'm')}s.${format}`);
        actions.appendChild(downloadBtn);
        frameItem.appendChild(img);
        frameItem.appendChild(info);
        frameItem.appendChild(actions);
        this.previewGrid.appendChild(frameItem)
    }

    downloadFrame(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url)
    }

    formatTime(seconds, withMs = false) {
        if (!isFinite(seconds)) return '-:--';
        const ms = Math.round(seconds * 1000);
        const mins = Math.floor(ms / 60000);
        const secs = Math.floor(ms / 1000) % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}` + (withMs ? '.' + String(ms % 1000).padStart(3, '0') : '')
    }
}

new VideoFrameExtractor()</script>
<script src="../logo.js"></script>
</body>
</html>
