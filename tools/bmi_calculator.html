<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMI Calculator – adults and children, kg, lb or stone</title>
<meta name="description" content="Work out your BMI from height and weight in cm and kg, feet and pounds or stone. Shows your WHO weight category, the healthy weight range for your height, and CDC percentiles for children aged 2 to 19. Nothing leaves your browser.">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2124;--soft:#5b6268;--line:#d9d6cd;--focus:#1f5fbf;--err:#b3261e;
--sev:#6f7fa8;--under:#8aa8c8;--ok:#4f9a6a;--over:#d9a441;--ob1:#d9773a;--ob2:#c2502f;--ob3:#9b2f2a;--tick:#1d2124}
@media (prefers-color-scheme:dark){:root{--bg:#15181b;--card:#1e2226;--ink:#eceae4;--soft:#a3a9ae;--line:#383d42;--focus:#7fb0ff;--err:#ff8a80;--tick:#eceae4}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.15rem;margin:4px 0 12px;font-weight:650;letter-spacing:-.01em}
h1 span{font-weight:400;color:var(--soft)}
.grid{display:grid;gap:14px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1.15fr;grid-template-columns:1.15fr 1fr;grid-template-areas:'res form' 'extra form' '. form';align-items:start}.res{grid-area:res}.form{grid-area:form}.extra{grid-area:extra}}
.row2>*{min-width:0}
.res .scale{margin-bottom:0}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.num{font-variant-numeric:tabular-nums}
/* result */
.res .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-height:64px}
.big{font-size:3.4rem;line-height:1;font-weight:700;letter-spacing:-.02em}
.cat{font-size:1.2rem;font-weight:650}
.cat i{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.35em;vertical-align:.05em;background:var(--c,var(--line))}
.sub{color:var(--soft);font-size:.95rem;margin:6px 0 0;min-height:2.9em}
.wait .big,.wait .cat,.ex .big,.ex .cat{color:var(--soft)}
.wait .facts{display:none}
.stale .big,.stale .cat,.stale .scale{opacity:.35}
.wait .scale{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.78rem;color:var(--soft);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:2px;margin-right:4px;background:var(--c)}
.fix{font:inherit;color:var(--focus);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);border:1px solid var(--line);border-radius:4px;padding:1px 6px;align-self:center}
/* scale */
.scale{position:relative;margin:20px 0 4px;height:48px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden}
.bar span{height:100%}
.mark{position:absolute;top:-7px;width:0;transition:left .45s cubic-bezier(.3,.7,.2,1)}
.mark::before{content:"";position:absolute;left:-1.5px;top:0;width:3px;height:26px;background:var(--tick);border-radius:2px}
.ticks{position:relative;height:18px;font-size:.75rem;color:var(--soft);margin-top:4px}
.ticks span{position:absolute;transform:translateX(-50%)}
.wait .mark,.stale .mark{opacity:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.95rem}
.facts dt{color:var(--soft)}
.facts dd{margin:0;font-weight:550}
.how{font-size:.8rem;color:var(--soft);margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button,.seg label{font:inherit}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover{border-color:var(--soft)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* form */
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;margin-bottom:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;padding:7px 4px;border-radius:6px;cursor:pointer;font-size:.92rem;color:var(--soft)}
.seg input:checked+label{background:var(--ink);color:var(--card);font-weight:600}
.seg input:focus-visible+label{outline:2px solid var(--focus);outline-offset:1px}
.f{margin-bottom:12px}
.f>label{display:block;font-weight:600;font-size:.95rem;margin-bottom:4px}
.f>label small{font-weight:400;color:var(--soft)}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.in:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.in input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.3rem;padding:10px 12px;font-variant-numeric:tabular-nums;outline:none}
.in b{padding:0 12px;color:var(--soft);font-weight:500;white-space:nowrap}
.bad .in{border-color:var(--err)}
.note{font-size:.85rem;color:var(--soft);min-height:1.3em;margin-top:3px}
.bad .note{color:var(--err)}
.row2{display:grid;grid-template-columns:1fr;gap:0}
.sex .seg label{padding:7px 2px}
.sex{display:none}.child .sex{display:block}
.sex .seg{margin:0}
details{margin-top:4px;font-size:.92rem}
summary{cursor:pointer;color:var(--soft);padding:4px 0}
details label{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
details input{margin-top:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.mark{transition:none}}
</style>
</head>
<body>
<main>
<h1>BMI Calculator <span>· adults and children</span></h1>
<div class="grid">
<section class="card res wait" id="res" aria-labelledby="rlab">
  <h2 class="sr" id="rlab">Result</h2>
  <div class="top"><span class="big num" id="big">–</span><span class="cat" id="cat"><i></i><span id="catT">Enter height and weight</span></span></div>
  <p class="sub" id="sub">&nbsp;</p>
  <div class="scale" aria-hidden="true"><div class="bar" id="bar"></div><div class="mark" id="mark"></div><div class="ticks" id="ticks"></div></div>
  <div class="legend" id="legend" aria-hidden="true"></div>
  <div class="acts"><button class="btn" id="copy" type="button">Copy result</button><button class="btn" id="link" type="button">Copy link</button></div>
  <p class="sr" aria-live="polite" id="live"></p>
</section>
<form class="card form" id="form" autocomplete="off" onsubmit="return false">
  <div class="seg" role="radiogroup" aria-label="Units">
    <input type="radio" name="units" id="u-metric" value="metric"><label for="u-metric">cm · kg</label>
    <input type="radio" name="units" id="u-us" value="us"><label for="u-us">ft · lb</label>
    <input type="radio" name="units" id="u-uk" value="uk"><label for="u-uk">ft · stone</label>
  </div>
  <div class="f" id="fh"><label for="height">Height</label>
    <div class="in"><input id="height" inputmode="decimal" enterkeyhint="next" aria-describedby="nh"><b id="uh">cm</b></div>
    <div class="note num" id="nh"></div></div>
  <div class="f" id="fw"><label for="weight">Weight</label>
    <div class="in"><input id="weight" inputmode="decimal" enterkeyhint="next" aria-describedby="nw"><b id="uw">kg</b></div>
    <div class="note num" id="nw"></div></div>
  <div class="row2" id="agerow">
    <div class="f" id="fa"><label for="age">Age <small>under 20 only</small></label>
      <div class="in"><input id="age" inputmode="decimal" enterkeyhint="done" placeholder="adult" title="Years, or years and months: 9 6" aria-describedby="na"><b>years</b></div>
      <div class="note" id="na"></div></div>
    <div class="f sex" id="fs"><label id="sexl">Sex</label>
      <div class="seg" role="radiogroup" aria-labelledby="sexl">
        <input type="radio" name="sex" id="s-f" value="f"><label for="s-f">Girl</label>
        <input type="radio" name="sex" id="s-m" value="m"><label for="s-m">Boy</label>
      </div><div class="note" id="ns"></div></div>
  </div>
  <details id="more"><summary>Asian, Black or Middle Eastern background?</summary>
    <label><input type="checkbox" id="cut"> <span>Use the lower cut-offs (overweight from 23, obesity from 27.5) that WHO and NICE advise, since health risks start at a lower BMI.</span></label>
  </details>
</form>
<section class="card extra" aria-label="More about this result">
  <dl class="facts num" id="facts"></dl>
  <p class="how" id="how"></p>
</section>
</div>
</main>
<script id="core">
(function (root) {
'use strict';
// BMI core. Adults: WHO classification (WHO TRS 894, 2000), with the lower action points WHO's
// 2004 expert consultation and NICE (PH46/NG246) give for people of Asian, Black African, African-
// Caribbean and Middle Eastern family background. Ages 2-19: CDC 2000 BMI-for-age (LMS method,
// Kuczmarski et al. 2002) and the CDC 2022 extension above the 95th percentile (% of the 95th).

const LB = 0.45359237, IN = 0.0254, ST = 14 * LB;

// ---- reading what people type ----------------------------------------------------------------
// A number with either decimal mark; "1.234" with a thousands dot is not a height or weight anyone types.
function num(s) {
  s = s.replace(',', '.');
  if (!/^\d+(\.\d+)?$|^\.\d+$|^\d+\.$/.test(s)) return NaN;
  return parseFloat(s);
}
function clean(t) {
  return String(t == null ? '' : t).toLowerCase()
    .replace(/[’′´`]/g, "'").replace(/[”″]|''/g, '"')
    .replace(/\s+/g, ' ').trim();
}
const fmt = (x, d) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace(/\.?0+$/, m => d && m.includes('.') ? '' : m);

// Height. unit: 'cm' or 'ft' is what a bare number means.
// Returns {m, read} or {error} or {empty:true}.
function parseHeight(text, unit) {
  const t = clean(text);
  if (!t) return {empty: true};
  let m = null, read, mm;
  const N = '(\\d+(?:[.,]\\d+)?)';
  if ((mm = t.match(new RegExp('^' + N + " ?(?:'|ft|feet|foot) ?(?:" + N + ' ?(?:"|in|inch|inches)?)?$')))) {
    const ft = num(mm[1]), inch = mm[2] ? num(mm[2]) : 0;
    m = (ft * 12 + inch) * IN;
    read = ftin(m);
  } else if ((mm = t.match(new RegExp('^' + N + ' ?(?:"|in|inch|inches)$')))) {
    m = num(mm[1]) * IN; read = fmt(num(mm[1]), 1) + ' in = ' + ftin(m);
  } else if ((mm = t.match(new RegExp('^' + N + ' ?(cm|m|mm|metres?|meters?)$')))) {
    const v = num(mm[1]), u = mm[2];
    m = u === 'cm' ? v / 100 : u === 'mm' ? v / 1000 : v;
    read = fmt(m * 100, 1) + ' cm';
  } else if ((mm = t.match(/^(\d+) (\d+(?:[.,]\d+)?)$/)) && unit === 'ft') {
    m = (num(mm[1]) * 12 + num(mm[2])) * IN; read = ftin(m);
  } else if (/^\d*[.,]?\d+[.,]?$/.test(t)) {
    const v = num(t);
    if (unit === 'ft') {
      if (v >= 3 && v <= 8.99) { m = v * 12 * IN; read = fmt(v, 2) + ' ft = ' + ftin(m); }
      else if (v >= 20 && v <= 99) { m = v * IN; read = fmt(v, 1) + ' in = ' + ftin(m); }
      else if (v >= 100 && v <= 272) return {error: fmt(v, 1) + ' looks like centimetres.', cm: true};
    } else {
      if (v >= 0.5 && v <= 2.72) { m = v; read = 'read as ' + fmt(v * 100, 1) + ' cm'; }
      else { m = v / 100; read = fmt(v, 1) + ' cm'; }
    }
    if (m == null) return {error: unit === 'ft' ? 'Type feet and inches, like 5 11 or 5\'11", or inches, like 71.' : 'Type centimetres, like 175, or metres, like 1.75.'};
  } else {
    return {error: unit === 'ft' ? 'Type feet and inches, like 5 11 or 5\'11".' : 'Type a height, like 175 cm or 5\'11".'};
  }
  if (!isFinite(m)) return {error: 'That does not look like a height.'};
  if (m < 0.5 || m > 2.72) return {error: 'Heights from 50 cm to 272 cm (1\'8" to 8\'11") can be worked out.'};
  return {m, read};
}
function ftin(m) {
  let i = Math.round(m / IN * 2) / 2, f = Math.floor(i / 12); i -= f * 12;
  return f + '′' + fmt(i, 1) + '″';
}

// Weight. unit: 'kg', 'lb' or 'st' is what a bare number means.
function parseWeight(text, unit) {
  const t = clean(text).replace(/([a-z]) (?=[a-z])/g, '$1');
  if (!t) return {empty: true};
  const N = '(\\d+(?:[.,]\\d+)?)';
  let kg = null, mm;
  if ((mm = t.match(new RegExp('^' + N + ' ?(?:st|stone|stones)(?: ?' + N + ' ?(?:lb|lbs|pounds?)?)?$')))) {
    kg = num(mm[1]) * ST + (mm[2] ? num(mm[2]) * LB : 0);
  } else if ((mm = t.match(new RegExp('^' + N + ' ?(kg|kgs|kilos?|kilograms?|lb|lbs|pounds?|#)$')))) {
    kg = num(mm[1]) * (mm[2][0] === 'k' ? 1 : LB);
  } else if ((mm = t.match(/^(\d+) (\d+(?:[.,]\d+)?)$/)) && unit === 'st') {
    kg = num(mm[1]) * ST + num(mm[2]) * LB;
  } else if (/^\d*[.,]?\d+[.,]?$/.test(t)) {
    const v = num(t);
    kg = unit === 'lb' ? v * LB : unit === 'st' ? v * ST : v;
  } else {
    return {error: 'Type a weight, like ' + (unit === 'kg' ? '70 kg' : unit === 'lb' ? '154 lb' : '11 st 4') + '.'};
  }
  if (!isFinite(kg)) return {error: 'That does not look like a weight.'};
  if (kg < 2 || kg > 650) return {error: 'Weights from 2 kg to 650 kg (4 lb to 1,433 lb) can be worked out.'};
  return {kg, read: weightText(kg, null)};
}
function weightText(kg, unit) {
  const lb = kg / LB, st = Math.floor(Math.round(lb) / 14), r = Math.round(lb) - st * 14;
  const all = {kg: fmt(kg, 1) + ' kg', lb: Math.round(lb) + ' lb', st: st + ' st ' + r + ' lb'};
  return unit ? all[unit] : all;
}

// Age: blank = adult. "8", "8.5", "8 6" (years months), "8y 6m", "8 years 6 months", "30 months".
function parseAge(text) {
  const t = clean(text);
  if (!t) return {empty: true};
  let mo = null, mm;
  if ((mm = t.match(/^(\d+(?:[.,]\d+)?) ?(?:y|yr|yrs|years?)?(?:,? ?(\d+(?:[.,]\d+)?) ?(?:m|mo|mos|months?)?)?$/)) && !/^\d+ ?(m|mo|mos|months?)$/.test(t)) {
    mo = num(mm[1]) * 12 + (mm[2] ? num(mm[2]) : 0);
  } else if ((mm = t.match(/^(\d+) ?(?:m|mo|mos|months?)$/))) {
    mo = num(mm[1]);
  } else return {error: 'Type an age in years, like 9 or 9 6 for 9 years 6 months.'};
  if (!isFinite(mo)) return {error: 'Type an age in years, like 9.'};
  if (mo < 24) return {error: 'BMI is used from age 2. Under 2, weight-for-length charts are used instead.'};
  if (mo > 1500) return {error: 'Type an age in years.'};
  if (mo >= 240) return {adult: true, months: mo};
  return {months: mo};
}

// ---- the arithmetic ----------------------------------------------------------------------------
const bmiOf = (kg, m) => kg / (m * m);
// Displayed and classified at one decimal, the way WHO's table prints its cut-offs; half rounds up.
const round1 = x => Math.floor(x * 10 + 0.5 + 1e-9) / 10;

const BANDS = {
  standard: [[0, 'Severely underweight', 'sev'], [16, 'Underweight', 'under'], [18.5, 'Healthy weight', 'ok'], [25, 'Overweight', 'over'], [30, 'Obesity class I', 'ob1'], [35, 'Obesity class II', 'ob2'], [40, 'Obesity class III', 'ob3']],
  asian: [[0, 'Severely underweight', 'sev'], [16, 'Underweight', 'under'], [18.5, 'Healthy weight', 'ok'], [23, 'Overweight', 'over'], [27.5, 'Obesity', 'ob1']]
};
function band(b, cut) {
  const bands = BANDS[cut] || BANDS.standard;
  let i = 0; while (i + 1 < bands.length && b >= bands[i + 1][0]) i++;
  const lo = bands[i][0], hi = i + 1 < bands.length ? bands[i + 1][0] : null;
  return {name: bands[i][1], key: bands[i][2], lo, hi, index: i};
}

function adult(kg, m, cut) {
  const raw = bmiOf(kg, m), b = round1(raw);
  const top = cut === 'asian' ? 23 : 25;
  // the healthy range for this height: the weights whose BMI, rounded, falls in [18.5, top)
  const lo = 18.45 * m * m, hi = (top - 0.05) * m * m;
  const minKg = Math.ceil(lo * 10) / 10, maxKg = Math.floor(hi * 10 - 1e-9) / 10;
  let toGo = 0;
  if (b < 18.5) toGo = minKg - kg; else if (b >= top) toGo = maxKg - kg;
  return {kind: 'adult', raw, bmi: b, cat: band(b, cut), cut, range: [minKg, maxKg], toGo,
    prime: Math.round(raw / 25 * 100) / 100, ponderal: Math.round(kg / m ** 3 * 10) / 10};
}

  $('bar').innerHTML = segs.map(s => `<span style="width:${s[1] - s[0]}%;background:var(--${s[2]})"></span>`).join('');
  const names = kind === 'child' ? [['under', 'Underweight'], ['ok', 'Healthy'], ['over', 'Overweight'], ['ob1', 'Obesity']]
    : [['under', 'Underweight'], ['ok', 'Healthy'], ['over', 'Overweight'], ['ob2', 'Obesity']];
  $('legend').innerHTML = names.map(n => `<span style="--c:var(--${n[0]})">${n[1]}</span>`).join('');
  $('ticks').innerHTML = ticks.map(t => `<span style="left:${t[0]}%">${t[1]}</span>`).join('');
}

const f1 = x => x.toFixed(1), kgIn = (kg, u) => B.weightText(kg, u);
function note(id, fid, o, okText) {
  $(fid).classList.toggle('bad', !!o.error);
  $(id).textContent = o.error || okText || '';
}

let last = null, liveT = 0;
function render() {
  const typed = !!(state.height.trim() || state.weight.trim());
  example = !typed;
  const o = B.compute(example ? Object.assign({}, state, EX[state.units], {age: ''}) : state), res = $('res');
  const uw = state.units === 'metric' ? 'kg' : state.units === 'uk' ? 'st' : 'lb';
  note('nh', 'fh', o.h, o.h.m ? (state.units === 'metric' ? (o.h.read.startsWith('read') ? o.h.read + ' = ' : '= ') + B.ftin(o.h.m) : o.h.read + ' = ' + f1(o.h.m * 100) + ' cm') : '');
  if (o.h.cm) { const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'fix'; bt.textContent = 'Switch to cm · kg'; bt.onclick = () => { $('u-metric').click(); }; $('nh').append(' ', bt); }
  note('nw', 'fw', o.w, o.w.kg ? '= ' + (state.units === 'metric' ? o.w.read.lb : o.w.read.kg) : '');
  const am = o.a.months; note('na', 'fa', o.a, o.a.adult ? 'Adult cut-offs' : am != null ? `${Math.floor(am / 12)} years${am % 12 ? ' ' + Math.floor(am % 12) + ' months' : ''}: child charts` : 'Leave blank for adults. 9 6 = 9 years 6 months');
  const child = o.a.months != null && !o.a.adult;
  $('agerow').classList.toggle('child', child);
  $('fs').classList.toggle('bad', !!o.needSex);
  $('ns').textContent = o.needSex ? 'Choose one: the charts differ.' : '';
  const r = o.r;
  res.classList.toggle('ex', !!(r && example));
  const bad = !!(o.h.error || o.w.error || o.a.error || o.implausible || o.needSex);
  res.classList.toggle('wait', !r);
  $('copy').disabled = $('link').disabled = !r || example;
  if (!r) {
    clearTimeout(liveT); if (bad) liveT = setTimeout(() => { $('live').textContent = 'No result: ' + (o.h.error || o.w.error || o.a.error || $('sub').textContent); }, 900);
    $('big').textContent = '–'; $('how').textContent = ''; last = null;
    $('catT').textContent = o.implausible ? 'Check the numbers' : o.needSex ? 'Choose girl or boy' : (o.h.error || o.w.error || o.a.error) ? 'Check the highlighted field' : 'Enter height and weight';
    $('cat').style.removeProperty('--c');
    $('sub').textContent = o.implausible ? 'That height and weight give a BMI no person has. Is a unit or digit off?' : ' ';
    $('facts').innerHTML = '';
    return;
  }
  drawScale(r.kind, r.kind === 'child' ? '' : r.cut);
  $('big').textContent = f1(r.bmi);
  $('catT').textContent = example ? 'Example' : r.cat.name;
  $('cat').style.setProperty('--c', 'var(--' + r.cat.key + ')');
  const H = o.h.m, rng = r.range;
  const rngText = state.units === 'metric' ? `${f1(rng[0])}–${f1(rng[1])} kg` : `${kgIn(rng[0], uw)} – ${kgIn(rng[1], uw)}`;
  let sub, facts = [];
  if (r.kind === 'adult') {
    $('mark').style.left = pos(r.raw) + '%';
    const d = Math.abs(r.toGo), dt = state.units === 'metric' ? f1(d) + ' kg' : uw === 'st' && d >= 6.35 ? kgIn(d, 'st') : Math.max(1, Math.round(d / B.LB)) + ' lb';
    if (example) sub = `This is an example for ${state.units === 'metric' ? '175 cm, 70 kg' : state.units === 'us' ? '5 ft 9, 154 lb' : '5 ft 9, 11 st'}. Type your own height and weight below.`;
    else sub = r.toGo > 0 ? `Healthy for your height: ${rngText}. To reach it, gain ${dt}.`
      : r.toGo < 0 ? `Healthy for your height: ${rngText}. To reach it, lose ${dt}.`
      : `Healthy for your height: ${rngText}. You are in it.`;
    facts = [['Healthy range', rngText], ['Healthy BMI', '18.5 to ' + (r.cut === 'asian' ? '22.9' : '24.9')], ['Exact BMI', r.raw.toFixed(2)]];
    if (r.cut !== 'asian') facts.splice(2, 0, ['BMI Prime', r.prime.toFixed(2) + ' (BMI ÷ 25)']);
    $('how').textContent = (r.cut === 'asian' ? 'Lower cut-offs for Asian, Black and Middle Eastern backgrounds (WHO 2004, NICE).' : 'Adult cut-offs from the WHO.') + ' BMI = weight ÷ height², shown and classed at one decimal. It does not tell muscle from fat: an athlete can read high, and it is not used for pregnancy.';
  } else {
    $('mark').style.left = Math.max(0.5, Math.min(99.5, (r.z + 3) / 6 * 100)) + '%';
    const age = Math.floor(r.months / 12) + ' y ' + Math.floor(r.months % 12) + ' m';
    sub = `${B.percentileText(r.percentile).replace(/^the /, '')} percentile for ${r.sex === 'f' ? 'girls' : 'boys'} aged ${age}. Children are judged by percentile, not adult cut-offs.`.replace(/^./, c => c.toUpperCase());
    facts = [['Healthy range', rngText + ' (5th to 85th percentile)']];
    if (r.percentile >= 95) facts.push(['% of 95th', Math.round(r.pct95) + '% (severe from 120%)']);
    $('how').textContent = 'Ages 2 to 19 are compared with children of the same age and sex: CDC 2000 growth charts, and the CDC 2022 extension above the 95th percentile. Adult cut-offs do not apply.';
  }
  $('sub').textContent = sub;
  $('facts').innerHTML = facts.map(f => `<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('');
  last = {r, rngText, H, o};
  clearTimeout(liveT);
  if (!example) liveT = setTimeout(() => { $('live').textContent = `BMI ${f1(r.bmi)}, ${r.cat.name}. ${$('sub').textContent}`; }, 500);
}

function save() { if (!example) store.set(KEY, JSON.stringify(state)); }
function onInput(e) {
  const t = e.target;
  if (t.name === 'units') {
    const was = B.compute(state), nu = t.value;
    if (example) Object.assign(state, EX[nu]);
    else {
      if (was.h.m) state.height = nu === 'metric' ? String(Math.round(was.h.m * 1000) / 10) : B.ftin(was.h.m).replace('′', ' ').replace('″', '');
      if (was.w.kg) state.weight = nu === 'metric' ? (Math.round(was.w.kg * 10) / 10).toString() : nu === 'us' ? String(Math.round(was.w.kg / B.LB)) : B.weightText(was.w.kg, 'st').replace(' st ', ' ').replace(' lb', '');
    }
    state.units = nu; put();
    $('uh').textContent = UNITS[nu][0]; $('uw').textContent = UNITS[nu][1];
  } else if (t.name === 'sex') state.sex = t.value;
  else if (t.id === 'cut') state.cut = t.checked ? 'asian' : '';
  else { state[t.id] = t.value; if (example && (t.id === 'height' || t.id === 'weight')) example = false; }
  render(); save();
}
$('form').addEventListener('input', onInput);
$('form').addEventListener('change', e => { if (e.target.type === 'radio' || e.target.type === 'checkbox') { /* handled by input */ } });
// an example is there to be replaced: the first tap selects it
for (const id of ['height', 'weight']) $(id).addEventListener('focus', e => { if (example) e.target.select(); });
$('form').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
  const order = ['height', 'weight', 'age'], i = order.indexOf(e.target.id);
  if (i >= 0 && i < 2) { e.preventDefault(); $(order[i + 1]).focus(); } else if (i === 2) e.target.blur();
});

function flash(btn, text) { const o = btn.dataset.t || btn.textContent; btn.dataset.t = o; btn.textContent = text; setTimeout(() => btn.textContent = o, 1600); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); flash(btn, 'Copied'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); flash(btn, 'Copied'); } catch (_) { flash(btn, 'Copy failed'); } ta.remove(); }
}
$('copy').addEventListener('click', () => {
  if (!last) return flash($('copy'), 'Nothing yet');
  const {r, o, rngText} = last;
  const hw = state.units === 'metric' ? `${f1(o.h.m * 100)} cm, ${f1(o.w.kg)} kg` : `${B.ftin(o.h.m)}, ${B.weightText(o.w.kg, state.units === 'uk' ? 'st' : 'lb')}`;
  copy(r.kind === 'adult' ? `BMI ${f1(r.bmi)} – ${r.cat.name} (${hw}). ${$('sub').textContent} (WHO${r.cut === 'asian' ? ' lower' : ''} cut-offs)`
    : `BMI ${f1(r.bmi)} – ${B.percentileText(r.percentile)} percentile, ${r.cat.name} (${hw}, ${r.sex === 'f' ? 'girl' : 'boy'} ${Math.floor(r.months / 12)} y ${Math.floor(r.months % 12)} m; CDC charts)`, $('copy'));
});
$('link').addEventListener('click', () => copy(location.origin + location.pathname + '?' + B.toQuery(state), $('link')));
$('uh').textContent = UNITS[state.units][0]; $('uw').textContent = UNITS[state.units][1];
render();
})();
</script>
<script src="../logo.js" data-position="top-right"></script>
</body>
