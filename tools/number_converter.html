<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Base Converter — Binary, Hex, Decimal, Octal</title>
<meta name="description" content="Convert numbers between binary, hexadecimal, decimal, octal and any base from 2 to 36 as you type. Exact for any size, fractions included, two's complement for negatives. Tap a result to copy. Runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

:root[data-theme=dark]{--bg:#121316;--card:#1b1d22;--ink:#eceef2;--mute:#9aa0aa;--line:#30333a;--acc:#8aa6ff;--acc-soft:#232c48;--err:#ff8a80;--err-soft:#3a1f1d;--flash:#5c4a0b;color-scheme:dark}

<body>
<main>
<h1>Number Base Converter</h1>

<div class="in" id="inbox">
  <label class="lbl" for="num">Number to convert</label>
  <div class="field"><textarea id="num" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="note" placeholder="255 or 0xFF or 1010b">0xC0FFEE</textarea><button id="clear" aria-label="Clear the number">×</button></div>
  <div class="from"><span>Read as</span>
    <div class="seg" role="group" aria-label="The number is in">
    <button class="chip" data-from="auto" aria-pressed="true">Auto</button><button class="chip" data-from="10" aria-pressed="false" aria-label="decimal">10</button><button class="chip" data-from="16" aria-pressed="false" aria-label="hexadecimal">16</button><button class="chip" data-from="2" aria-pressed="false" aria-label="binary">2</button><button class="chip" data-from="8" aria-pressed="false" aria-label="octal">8</button><select id="fromOther" aria-label="Another base the number is in"><option value="">base…</option></select>
    </div></div>
</div>
<p id="note" aria-live="polite"></p>

<div class="rows" id="rows">
  <div class="row" data-base="10"><div class="k"><b>Decimal</b></div><button class="v" aria-label="Decimal, tap to copy"></button><button class="cp" aria-label="Copy decimal"></button><div class="sub" id="signed" hidden></div><div class="sub" hidden></div></div>
  <div class="row" data-base="16"><div class="k"><b>Hex</b></div><button class="v" aria-label="Hexadecimal, tap to copy"></button><button class="cp" aria-label="Copy hexadecimal"></button><div class="sub" hidden></div></div>
  <div class="row" data-base="2"><div class="k"><b>Binary</b></div><button class="v" aria-label="Binary, tap to copy"></button><button class="cp" aria-label="Copy binary"></button><div class="sub" hidden></div></div>
  <div class="row" data-base="8"><div class="k"><b>Octal</b></div><button class="v" aria-label="Octal, tap to copy"></button><button class="cp" aria-label="Copy octal"></button><div class="sub" hidden></div></div>
  <div class="row" data-base="other"><div class="k"><label class="sr" for="toOther">Another base</label><select id="toOther" aria-label="Another base to convert to"></select></div><button class="v" aria-label="Other base, tap to copy"></button><button class="cp" aria-label="Copy other base"></button><div class="sub" hidden></div></div>
</div>
<p class="trust" id="trust"><span id="repnote" hidden>Digits under a line repeat forever; copying writes them out. </span>Exact, any size · stays in your browser</p>

<div class="bar">
  <label class="btn" style="color:var(--ink);text-decoration:none;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="prefix"> Copy with 0x / 0b / 0o</label>
  <button class="btn" id="share">Copy link to this number</button>
</div>

<details id="work">
  <summary>Show the working</summary>
  <div class="stepsfor"><label>Converting to <select id="stepsTo"><option value="2">binary</option><option value="8">octal</option><option value="10">decimal</option><option value="16">hexadecimal</option><option value="other" id="stepsOther">base 3</option></select></label></div>
  <ol class="steps" id="steps"></ol>
</details>

<details id="opts">
  <summary>Options</summary>
  <div class="opt">
    <label><span class="h">Copied digits are separated by</span>
      <select id="sep"><option value="">nothing</option><option value=" ">spaces</option><option value="_">underscores</option><option value=",">commas</option></select></label>
    <label><input type="checkbox" id="lower"> Lowercase hex (ff, not FF)</label>
    <label><span class="h">Negative numbers in hex, binary and octal</span>
      <select id="width"><option value="0">with a minus sign</option><option value="8">as 8-bit two's complement</option><option value="16">as 16-bit two's complement</option><option value="32">as 32-bit two's complement</option><option value="64">as 64-bit two's complement</option></select></label>
    <label><span class="h">Theme</span>
      <select id="theme"><option value="auto">match the device</option><option value="light">light</option><option value="dark">dark</option></select></label>
  </div>
</details>
</main>
<div id="toast" role="status"></div>
<div class="sr" aria-live="polite" id="say"></div>
<script id="core">

<script>
(function () {

  var COPY_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  var st = {from: 'auto', other: 3, sep: '', prefix: false, lower: false, width: 0, theme: 'auto', input: '0xC0FFEE'};

  // Saved settings: the old page stored {darkMode, separator}; both still mean what they meant.
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');

  }
  load();
  // A link made by "Copy link" carries ?n= and &from=; it wins over what was saved.
  try {

  var num = $('num'), rows = [].slice.call(document.querySelectorAll('.row')), last = {}, good = null, sayT;
  for (var b = 2; b <= 36; b++) {
    $('toOther').add(new Option('base ' + b, b));

  }

  function esc(s) { return s.replace(/[&<>]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]; }); }

  // Draw a value with visual groups (not copied) and flash the digits that changed since last time,
  // compared place by place from the point, so typing one more digit lights only what moved.
  var expanded = {};
  function draw(el, p, base, key) {
    var t = base > 10 && st.lower ? p.text.toLowerCase() : p.text;
    if (t.length > 120 && !expanded[key]) { el.innerHTML = esc(t.slice(0, 48)) + '<i class="gap"> … </i>' + esc(t.slice(-24)); last[key] = null; return; }

  function copyText(p, base) {

  }

  function render() {
    var v = C.parse(num.value, st.from), note = $('note');
    $('inbox').classList.toggle('bad', !v.ok && !v.empty);
    note.classList.toggle('err', !v.ok && !v.empty);
    if (!v.ok) {
      note.textContent = v.empty ? 'Type or paste a number. 0x, 0b, 0o or a trailing h or b set the base.' : v.error;

      var mb = C.minBase(num.value); if (mb > 10 && mb <= 16) mb = 16; else if (mb > 16) mb = 0;
      if (!v.empty && mb && mb !== st.from && C.parse(num.value, mb).ok) {
        var fixb = document.createElement('button'); fixb.className = 'btn'; fixb.textContent = mb === 16 ? 'Read it as hex' : 'Read it as base ' + mb;
        fixb.style.minHeight = '0'; fixb.style.padding = '0 0 0 6px'; fixb.style.font = 'inherit';
        fixb.addEventListener('click', function () { setFrom(mb); });
        note.appendChild(fixb);
      }
      good = null; $('rows').classList.add('empty'); 
      { rows.forEach(function (r) { r.querySelector('.v').innerHTML = ''; r.querySelector('.sub:not(#signed)').hidden = true; }); last = {}; $('signed').hidden = true; $('repnote').hidden = true; }
      renderSteps(); return;
    }
    $('rows').classList.remove('empty');
    good = v;
    var desc = 'Read as ' + C.baseName(v.base).toLowerCase() + (v.detected ? ' (' + (v.detected.length === 1 && v.detected !== '#' ? 'the ' + v.detected + ' suffix' : 'the ' + v.detected + ' prefix') + ')' : '');
    if (v.num === 0n) desc += ' · ' + C.bitLength(v.int) + ' bit' + (C.bitLength(v.int) === 1 ? '' : 's');
    note.textContent = desc;
    var said = [], rep = false;
    rows.forEach(function (r) {
      var base = baseOf(r), p = C.format(v, base, {width: st.width});
      p.intRaw = p.int; // ungrouped, since no separator was asked for
      r._p = p; r._b = base; if (p.repeat) rep = true;
      var rs = r.querySelector('.sub:not(#signed)'), tw = Math.max(32, C.smallestWidth(v) || 0);
      rs.hidden = true;
      var dk = r.getAttribute('data-base');
      if (p.text.length > 120) { rs.hidden = false; rs.innerHTML = p.text.replace(/[^0-9A-Z]/gi, '').length.toLocaleString('en') + ' digits · copying takes all of them · <button class="btn more" style="min-height:0;padding:0;font:inherit">' + (expanded[dk] ? 'Show less' : 'Show all') + '</button>'; rs.querySelector('.more').onclick = function (e) { e.stopPropagation(); expanded[dk] = !expanded[dk]; render(); }; }
      else if (p.cut) { rs.hidden = false; rs.textContent = 'Does not end in base ' + base + '; first ' + p.frac.length + ' digits shown.'; }

      draw(r.querySelector('.v'), p, base, r.getAttribute('data-base'));

    });

    var sw = st.width || C.typedWidth(v, num.value), sv = C.signedValue(v, sw), sg = $('signed');

  }

    if (!good) { ol.innerHTML = '<li>Enter a number to see the working.</li>'; return; }

  var toastT;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 1400); }

  rows.forEach(function (r) {
    var go = function () { if (good && r._p) copy(copyText(r._p, r._b), C.baseName(r._b).toLowerCase() + ': ' + copyText(r._p, r._b).slice(0, 24) + (copyText(r._p, r._b).length > 24 ? '…' : '')); };
    r.addEventListener('click', function (e) { if (!e.target.closest('select')) go(); });
  });

    [].forEach.call(document.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', String(c.getAttribute('data-from') === String(f))); });
    $('fromOther').classList.toggle('on', typeof f === 'number' && [2, 8, 10, 16].indexOf(f) < 0); $('fromOther').value = typeof f === 'number' && [2, 8, 10, 16].indexOf(f) < 0 ? String(f) : '';
    num.setAttribute('inputmode', f === 10 || f === 8 || f === 2 ? 'decimal' : 'text');

  }

    c.addEventListener('click', function () { var f = c.getAttribute('data-from'); setFrom(f === 'auto' ? 'auto' : +f); });
  });

  $('stepsTo').addEventListener('change', renderSteps);

    var u = location.origin + location.pathname + '?n=' + encodeURIComponent(num.value.trim()) + (st.from === 'auto' ? '' : '&from=' + st.from);
