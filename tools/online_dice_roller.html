<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Professional dice roller with customizable dice and roll history tracking.">
    <meta name="keywords" content="dice, dice roller, RPG, D&D, tabletop games, random">
    <title>Dice Roller</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
    <style>
        :root {
            --bg: #f4f1ea;
            --bg-glow: rgba(193, 138, 47, 0.16);
            --panel: #fffdf9;
            --panel-sunk: #f0ece2;
            --line: #ddd5c6;
            --line-soft: #e8e2d6;
            --text: #1f1b16;
            --muted: #7a7266;
            --accent: #b5751d;
            --accent-soft: rgba(181, 117, 29, 0.12);
            --die: #2f3540;
            --die-text: #f7f4ee;
            --danger: #a3372f;
            --danger-soft: rgba(163, 55, 47, 0.09);
            --radius: 14px;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }
        .dark {
            --bg: #0f1216;
            --bg-glow: rgba(226, 170, 74, 0.13);
            --panel: #171c22;
            --panel-sunk: #11151a;
            --line: #2b333d;
            --line-soft: #232a32;
            --text: #eceef1;
            --muted: #8d97a3;
            --accent: #e2aa4a;
            --accent-soft: rgba(226, 170, 74, 0.14);
            --die: #e9edf2;
            --die-text: #151a20;
            --danger: #e3796d;
            --danger-soft: rgba(227, 121, 109, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(1100px 520px at 50% -8%, var(--bg-glow), transparent 70%),
                var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            padding: 28px 18px 60px;
            transition: background-color .25s, color .25s;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* ---------- Header ---------- */
        .masthead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 650;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 .pip {
            width: 30px; height: 30px;
            display: grid; place-items: center;
            border-radius: 9px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 1rem;
        }
        .theme-toggle {
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--muted);
            width: 38px; height: 38px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: border-color .2s, transform .2s, color .2s;
        }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

        /* ---------- Layout ---------- */
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
            gap: 18px;
            align-items: start;
        }
        .column { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

        /* Stacked, the roll must land next to the box that produced it —
           not underneath the controls you scrolled past. */
        @media (max-width: 720px) {
            .layout { grid-template-columns: minmax(0, 1fr); }
            .column { display: contents; }
            .panel--expression { order: 1; }
            .result-area      { order: 2; }
            .panel--build     { order: 3; }
            .panel--history   { order: 4; }
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 18px;
        }


        .panel-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            font-weight: 650;
            color: var(--muted);
            margin-bottom: 12px;
        }

        /* ---------- Expression input: the source of truth, so it leads ---------- */
        .notation-field { position: relative; }
        .notation-input {
            width: 100%;
            padding: 15px 16px;
            border-radius: 11px;
            border: 1.5px solid var(--line);
            background: var(--panel-sunk);
            color: var(--text);
            outline: none;
            font-family: var(--mono);
            font-size: 1.22rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            transition: border-color .18s, background-color .18s;
        }
        .notation-input::placeholder { color: var(--muted); font-weight: 400; font-size: 0.92rem; }
        .notation-input:focus { border-color: var(--accent); background: var(--panel); }
        .notation-help {
            margin-top: 9px;
            font-size: 0.76rem;
            color: var(--muted);
            line-height: 1.9;
        }
        .notation-help code {
            font-family: var(--mono);
            background: var(--panel-sunk);
            border: 1px solid var(--line-soft);
            border-radius: 5px;
            padding: 1px 5px;
        }

        /* ---------- Presets ---------- */
        .preset-container {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .preset-btn {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: var(--mono);
            cursor: pointer;
            transition: color .16s, border-color .16s, background-color .16s;
        }
        .preset-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
        .preset-btn.named { font-family: inherit; }

        /* ---------- Sliders ---------- */
        .controls-hint {
            font-size: 0.78rem;
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 14px;
        }
        .control-group + .control-group { margin-top: 14px; }
        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 7px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .control-value {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--text);
        }
        .range-input {
            width: 100%;
            height: 4px;
            background: var(--line);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .range-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 17px; height: 17px;
            background: var(--accent);
            border: 3px solid var(--panel);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 1px var(--line);
        }
        .range-input::-moz-range-thumb {
            width: 17px; height: 17px;
            background: var(--accent);
            border: 3px solid var(--panel);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 1px var(--line);
        }

        .modifier-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
        }
        .modifier-label { font-size: 0.85rem; color: var(--muted); margin-right: auto; }
        .modifier-select, .modifier-input {
            padding: 7px 9px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--panel-sunk);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.9rem;
            outline: none;
        }
        .modifier-input { width: 62px; text-align: center; }
        .modifier-select:focus, .modifier-input:focus { border-color: var(--accent); }

        /* ---------- Actions ---------- */
        .action-buttons { display: flex; gap: 9px; margin-top: 18px; }
        .roll-btn, .reset-btn {
            padding: 13px 18px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-weight: 650;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform .12s, filter .16s, border-color .16s, color .16s;
        }
        .roll-btn {
            background: var(--accent);
            color: #fff;
            flex-grow: 1;
            letter-spacing: 0.01em;
        }
        .dark .roll-btn { color: #1a1408; }
        .roll-btn:hover { filter: brightness(1.07); }
        .roll-btn:active { transform: translateY(1px); }
        .reset-btn { background: transparent; border-color: var(--line); color: var(--muted); }
        .reset-btn:hover { color: var(--text); border-color: var(--muted); }

        /* ---------- Result ---------- */
        .result-area {
            background: var(--panel-sunk);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius);
            padding: 22px 18px;
            text-align: center;
            min-height: 208px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            transition: background-color .25s, border-color .25s;
        }
        .dice-result {
            font-family: var(--mono);
            font-size: 0.95rem;
            color: var(--muted);
            letter-spacing: 0.01em;
        }
        .dice-visuals {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
        }

        /* Dice render as the silhouette of the die they came from. */
        .dice-visual {
            width: 46px; height: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.05rem;
            font-family: var(--mono);
            background: var(--die);
            color: var(--die-text);
            border-radius: 9px;
            animation: rollDice .45s cubic-bezier(.2,.9,.3,1.2);
        }
        .dice-visual[data-shape="d4"]   { clip-path: polygon(50% 4%, 96% 94%, 4% 94%); border-radius: 0; align-items: flex-end; padding-bottom: 3px; font-size: 0.92rem; }
        .dice-visual[data-shape="d8"]   { clip-path: polygon(50% 1%, 99% 50%, 50% 99%, 1% 50%); border-radius: 0; font-size: 0.95rem; }
        .dice-visual[data-shape="d10"]  { clip-path: polygon(50% 0%, 95% 34%, 78% 99%, 22% 99%, 5% 34%); border-radius: 0; }
        .dice-visual[data-shape="d12"]  { clip-path: polygon(50% 0%, 97% 35%, 79% 96%, 21% 96%, 3% 35%); border-radius: 0; }
        .dice-visual[data-shape="d20"]  { clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); border-radius: 0; }
        .dice-visual.dropped {
            background: transparent;
            color: var(--muted);
            box-shadow: inset 0 0 0 1.5px var(--line);
            text-decoration: line-through;
            opacity: .8;
        }
        .dice-visual.dropped[data-shape]:not([data-shape="d6"]) { box-shadow: none; opacity: .42; background: var(--line); color: var(--muted); }

        @keyframes rollDice {
            0% { transform: translateY(-14px) rotate(-70deg) scale(.85); opacity: 0; }
            100% { transform: none; opacity: 1; }
        }

        .dice-sum {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .dice-sum:empty { display: none; }
        .sum-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-weight: 650;
            color: var(--muted);
        }
        .sum-value {
            font-size: 2.6rem;
            font-weight: 700;
            font-family: var(--mono);
            color: var(--accent);
            letter-spacing: -0.03em;
            line-height: 1.05;
            font-variant-numeric: tabular-nums;
        }

        .result-area.has-error {
            background: var(--danger-soft);
            border-color: var(--danger);
        }
        .result-area.has-error .dice-result { color: var(--danger); font-size: 1rem; }

        /* ---------- History ---------- */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .history-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            font-weight: 650;
            color: var(--muted);
        }
        .clear-history-btn {
            background: none; border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 4px;
            transition: color .16s;
        }
        .clear-history-btn:hover { color: var(--accent); }
        .history-list { max-height: 232px; overflow-y: auto; }
        .history-list:empty::after {
            content: 'No rolls yet.';
            display: block;
            padding: 14px 2px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .history-item {
            padding: 9px 2px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            border-bottom: 1px solid var(--line-soft);
        }
        .history-item:last-child { border-bottom: none; }
        .history-item-time {
            color: var(--muted);
            font-size: 0.72rem;
            font-variant-numeric: tabular-nums;
            margin-right: 9px;
        }
        .history-item-expr { font-family: var(--mono); font-size: 0.88rem; }
        .history-item-total {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent);
            padding-left: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="masthead">
        <h1><span class="pip">🎲</span> Dice Roller</h1>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="layout">
        <div class="column">
            <div class="panel panel--expression">
                <div class="panel-label">Expression</div>
                <div class="notation-field">
                    <input type="text" class="notation-input" id="dice-notation" spellcheck="false" autocomplete="off"
                           placeholder="e.g. 2d20kh1, 4d6kh3, 3d6+1d8-2" value="1d6">
                </div>
                <div class="notation-help">
                    <code>kh1</code> keep highest &middot; <code>kl1</code> keep lowest &middot; <code>dl1</code> drop lowest &middot; <code>d%</code> percentile
                </div>

                <div class="preset-container">
                    <button class="preset-btn" data-notation="1d4">d4</button>
                    <button class="preset-btn" data-notation="1d6">d6</button>
                    <button class="preset-btn" data-notation="1d8">d8</button>
                    <button class="preset-btn" data-notation="1d10">d10</button>
                    <button class="preset-btn" data-notation="1d12">d12</button>
                    <button class="preset-btn" data-notation="1d20">d20</button>
                    <button class="preset-btn" data-notation="1d100">d100</button>
                    <button class="preset-btn" data-notation="2d6">2d6</button>
                    <button class="preset-btn" data-notation="4d6">4d6</button>
                    <button class="preset-btn named" data-notation="2d20kh1">Advantage</button>
                    <button class="preset-btn named" data-notation="2d20kl1">Disadvantage</button>
                    <button class="preset-btn named" data-notation="4d6kh3">Stat roll</button>
                </div>
            </div>

            <div class="panel panel--build">
                <div class="panel-label">Quick build</div>
                <div class="controls-hint" id="controls-hint" hidden>These can't describe your expression — moving them will replace it.</div>

                <div class="control-group">
                    <div class="control-label">Number of dice <span class="control-value" id="dice-value">1</span></div>
                    <input type="range" class="range-input" id="dice-count" min="1" max="20" value="1">
                </div>

                <div class="control-group">
                    <div class="control-label">Number of sides <span class="control-value" id="sides-value">6</span></div>
                    <input type="range" class="range-input" id="sides-count" min="2" max="100" value="6">
                </div>

                <div class="modifier-group">
                    <span class="modifier-label">Modifier</span>
                    <select class="modifier-select" id="modifier-type">
                        <option value="+">+</option>
                        <option value="-">−</option>
                        <option value="*">×</option>
                        <option value="/">/</option>
                    </select>
                    <input type="number" class="modifier-input" id="modifier-value" value="0" min="0">
                </div>

                <div class="action-buttons">
                    <button class="roll-btn" id="roll-btn">Roll Dice</button>
                    <button class="reset-btn" id="reset-btn">Reset</button>
                </div>
            </div>
        </div>

        <div class="column">
            <div class="result-area">
                <div class="dice-result">Roll the dice to see results</div>
                <div class="dice-visuals"></div>
                <div class="dice-sum"></div>
            </div>

            <div class="panel panel--history">
                <div class="history-header">
                    <span class="history-title">Roll History</span>
                    <button class="clear-history-btn" id="clear-history-btn">Clear</button>
                </div>
                <div class="history-list" id="history-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // DOM elements
        const themeToggle = document.getElementById('theme-toggle');
        const diceNotation = document.getElementById('dice-notation');
        const diceCount = document.getElementById('dice-count');
        const sidesCount = document.getElementById('sides-count');
        const diceValue = document.getElementById('dice-value');
        const sidesValue = document.getElementById('sides-value');
        const modifierType = document.getElementById('modifier-type');
        const modifierValue = document.getElementById('modifier-value');
        const rollBtn = document.getElementById('roll-btn');
        const resetBtn = document.getElementById('reset-btn');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const resultArea = document.querySelector('.result-area');
        const diceResult = document.querySelector('.dice-result');
        const diceVisuals = document.querySelector('.dice-visuals');
        const diceSum = document.querySelector('.dice-sum');
        const historyList = document.getElementById('history-list');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const controlsHint = document.getElementById('controls-hint');

        // Side counts we have a distinct silhouette for; everything else reads as a cube.
        const SHAPES = new Set([4, 6, 8, 10, 12, 20]);

        const MAX_DICE = 1000;
        const MAX_SIDES = 1000;

        // Dark/Light theme: follow the system to start with.
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        });

        // Update range displays
        diceCount.addEventListener('input', function() {
            diceValue.textContent = this.value;
            updateDiceNotation();
        });

        sidesCount.addEventListener('input', function() {
            sidesValue.textContent = this.value;
            updateDiceNotation();
        });

        // Update modifiers
        modifierType.addEventListener('change', updateDiceNotation);
        modifierValue.addEventListener('input', updateDiceNotation);

        // Dice notation input
        diceNotation.addEventListener('input', function() {
            const expr = parseExpression(this.value);
            if (!expr.error) syncControlsToExpression(expr);
        });

        // Enter rolls, so the expression box is usable on its own.
        diceNotation.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') rollDice();
        });

        // Preset buttons
        presetBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                diceNotation.value = this.dataset.notation;
                const expr = parseExpression(this.dataset.notation);
                if (!expr.error) syncControlsToExpression(expr);
                rollDice();
            });
        });

        // Roll dice button
        rollBtn.addEventListener('click', rollDice);

        // Reset button
        resetBtn.addEventListener('click', resetDiceRoller);

        // Clear history button
        clearHistoryBtn.addEventListener('click', clearHistory);

        // Functions
        function updateDiceNotation() {
            const dice = diceCount.value;
            const sides = sidesCount.value;
            const operator = modifierType.value;
            const modifier = parseInt(modifierValue.value) || 0;

            let notation = `${dice}d${sides}`;
            if (modifier > 0) notation += `${operator}${modifier}`;

            diceNotation.value = notation;
            controlsHint.hidden = true;
        }

        // Parses a dice expression into terms. The expression is the source of
        // truth for a roll; the sliders only ever write into it.
        //   term := [count]d(sides|%)[(kh|kl|dh|dl)[n]]  |  integer
        //   terms are joined by + / -, with an optional trailing *n or /n
        function parseExpression(notation) {
            const text = String(notation || '').trim();
            if (!text) return {error: 'Enter a dice expression, e.g. 2d6+3'};

            const terms = [];
            let scaleOp = null, scaleBy = null;
            let i = 0, sign = 1, expectTerm = true;

            const skipSpace = () => { while (i < text.length && /\s/.test(text[i])) i++; };

            skipSpace();
            if (text[i] === '+' || text[i] === '-') { sign = text[i] === '-' ? -1 : 1; i++; }

            while (i < text.length) {
                skipSpace();
                if (!expectTerm) {
                    const op = text[i];
                    if (op === '+' || op === '-') { sign = op === '-' ? -1 : 1; i++; expectTerm = true; continue; }
                    if (op === '*' || op === 'x' || op === 'X' || op === '/') {
                        i++; skipSpace();
                        const num = /^\d+/.exec(text.slice(i));
                        if (!num) return {error: `Expected a number after "${op}"`};
                        i += num[0].length;
                        scaleOp = (op === '/') ? '/' : '*';
                        scaleBy = parseInt(num[0], 10);
                        if (scaleOp === '/' && scaleBy === 0) return {error: 'Cannot divide by zero'};
                        skipSpace();
                        if (i < text.length) return {error: `Unexpected "${text.slice(i).trim()}" after the multiplier`};
                        break;
                    }
                    return {error: `Expected + or - before "${text.slice(i).trim()}"`};
                }

                const m = /^(\d*)d(\d+|%)(?:\s*(kh|kl|dh|dl)\s*(\d*))?/i.exec(text.slice(i));
                if (m) {
                    const count = m[1] === '' ? 1 : parseInt(m[1], 10);
                    const sides = m[2] === '%' ? 100 : parseInt(m[2], 10);
                    if (count < 1) return {error: 'Roll at least one die'};
                    if (count > MAX_DICE) return {error: `That is ${count} dice — the limit is ${MAX_DICE}`};
                    if (sides < 2) return {error: 'A die needs at least 2 sides'};
                    if (sides > MAX_SIDES) return {error: `d${sides} is bigger than the d${MAX_SIDES} limit`};

                    let keep = null;
                    if (m[3]) {
                        const mode = m[3].toLowerCase();
                        const n = m[4] === '' ? 1 : parseInt(m[4], 10);
                        if (n < 1) return {error: `${mode}${m[4]} needs a count of at least 1`};
                        // Keeping more dice than were rolled is harmless — keep them all
                        // rather than refuse a roll over a typo.
                        if (n >= count && (mode === 'kh' || mode === 'kl')) {
                            keep = null;
                            terms.push({kind: 'dice', sign, count, sides, keep});
                            i += m[0].length;
                            expectTerm = false;
                            continue;
                        }
                        if (n >= count) {
                            return {error: `${mode}${n} drops all ${count} dice`};
                        }
                        keep = {mode, n};
                    }
                    terms.push({kind: 'dice', sign, count, sides, keep});
                    i += m[0].length;
                } else {
                    const num = /^\d+/.exec(text.slice(i));
                    if (!num) {
                        const bad = text.slice(i).split(/[\s+\-*/]/)[0] || text.slice(i);
                        return {error: `Cannot read "${bad}"`};
                    }
                    terms.push({kind: 'flat', sign, value: parseInt(num[0], 10)});
                    i += num[0].length;
                }
                expectTerm = false;
            }

            if (expectTerm) return {error: 'The expression ends with an operator'};
            if (!terms.some(t => t.kind === 'dice')) return {error: 'No dice in that expression'};
            const totalDice = terms.reduce((n, t) => n + (t.kind === 'dice' ? t.count : 0), 0);
            if (totalDice > MAX_DICE) return {error: `That is ${totalDice} dice — the limit is ${MAX_DICE}`};

            return {terms, scaleOp, scaleBy};
        }

        // Canonical text for a parsed expression, so history records what was rolled.
        function formatExpression(expr) {
            let out = expr.terms.map((t, idx) => {
                const op = idx === 0 ? (t.sign < 0 ? '-' : '') : (t.sign < 0 ? ' - ' : ' + ');
                const body = t.kind === 'dice'
                    ? `${t.count}d${t.sides}${t.keep ? t.keep.mode + t.keep.n : ''}`
                    : `${t.value}`;
                return op + body;
            }).join('');
            if (expr.scaleOp) out += ` ${expr.scaleOp === '*' ? '×' : '÷'} ${expr.scaleBy}`;
            return out;
        }

        // Rolls a parsed expression. Returns the dice actually rolled, which of
        // them counted, and the total.
        function evaluateExpression(expr) {
            const dice = [];
            let total = 0;

            expr.terms.forEach(term => {
                if (term.kind === 'flat') { total += term.sign * term.value; return; }

                const values = [];
                for (let n = 0; n < term.count; n++) {
                    values.push(Math.floor(Math.random() * term.sides) + 1);
                }

                let kept = values.map((_, idx) => idx);
                if (term.keep) {
                    const order = kept.slice().sort((a, b) => values[a] - values[b]);
                    const {mode, n} = term.keep;
                    if (mode === 'kh') kept = order.slice(-n);
                    else if (mode === 'kl') kept = order.slice(0, n);
                    else if (mode === 'dl') kept = order.slice(n);
                    else if (mode === 'dh') kept = order.slice(0, order.length - n);
                }
                const keptSet = new Set(kept);

                values.forEach((value, idx) => {
                    const counted = keptSet.has(idx);
                    dice.push({value, sides: term.sides, sign: term.sign, counted});
                    if (counted) total += term.sign * value;
                });
            });

            if (expr.scaleOp === '*') total *= expr.scaleBy;
            else if (expr.scaleOp === '/') total = Math.floor(total / expr.scaleBy);

            return {dice, total};
        }

        // Keeps the sliders in step with the expression when it is simple enough
        // for them to represent. They are a shortcut, never the source of truth.
        function syncControlsToExpression(expr) {
            const simple = expr.terms.length <= 2
                && expr.terms[0].kind === 'dice'
                && expr.terms[0].sign > 0
                && !expr.terms[0].keep
                && (expr.terms.length === 1 || expr.terms[1].kind === 'flat')
                && !expr.scaleOp;

            controlsHint.hidden = simple;
            if (!simple) return;

            const die = expr.terms[0];
            if (die.count <= parseInt(diceCount.max, 10)) {
                diceCount.value = die.count;
                diceValue.textContent = die.count;
            }
            if (die.sides <= parseInt(sidesCount.max, 10)) {
                sidesCount.value = die.sides;
                sidesValue.textContent = die.sides;
            }
            const flat = expr.terms[1];
            modifierType.value = flat ? (flat.sign < 0 ? '-' : '+') : '+';
            modifierValue.value = flat ? flat.value : 0;
        }

        function showError(message) {
            resultArea.classList.add('has-error');
            diceResult.textContent = message;
            diceVisuals.innerHTML = '';
            diceSum.textContent = '';
        }

        function rollDice() {
            const expr = parseExpression(diceNotation.value);

            if (expr.error) { showError(expr.error); return; }

            const canonical = formatExpression(expr);
            const {dice, total} = evaluateExpression(expr);

            resultArea.classList.remove('has-error');
            diceResult.textContent = canonical;

            diceVisuals.innerHTML = '';
            dice.forEach(die => {
                const el = document.createElement('div');
                el.className = 'dice-visual' + (die.counted ? '' : ' dropped');
                el.dataset.shape = SHAPES.has(die.sides) ? `d${die.sides}` : 'd6';
                el.textContent = die.value;
                el.title = `d${die.sides}` + (die.counted ? '' : ' — dropped');
                diceVisuals.appendChild(el);
            });

            diceSum.innerHTML = '<span class="sum-label">Total</span><span class="sum-value"></span>';
            diceSum.querySelector('.sum-value').textContent = total;

            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.title = dice.map(d => d.counted ? d.value : `(${d.value})`).join(', ');
            const label = document.createElement('div');
            label.innerHTML = `<span class="history-item-time"></span><span class="history-item-expr"></span>`;
            label.querySelector('.history-item-time').textContent = time;
            label.querySelector('.history-item-expr').textContent = canonical;
            const sum = document.createElement('div');
            sum.className = 'history-item-total';
            sum.textContent = total;
            historyItem.append(label, sum);
            historyList.prepend(historyItem);
        }

        function resetDiceRoller() {
            diceCount.value = 1;
            sidesCount.value = 6;
            diceValue.textContent = '1';
            sidesValue.textContent = '6';
            modifierType.value = '+';
            modifierValue.value = '0';
            diceNotation.value = '1d6';

            controlsHint.hidden = true;
            resultArea.classList.remove('has-error');
            diceResult.textContent = 'Roll the dice to see results';
            diceVisuals.innerHTML = '';
            diceSum.textContent = '';
        }

        function clearHistory() {
            historyList.innerHTML = '';
        }
    });
</script>
<script src="../logo.js"></script>
</body>
</html>
