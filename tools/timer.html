<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online Timer – countdown timer with alarm</title>
<meta name="description" content="Free online countdown timer with alarm. Type 5, 1:30 or 1h 20m, or tap a preset, and it rings when time is up – keeps time correctly in background tabs and after sleep. Pause, add a minute, share a link.">
<meta name="theme-color" content="#f5f3ee">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1c1d1f;--soft:#5d6166;--line:#dcd8cf;--track:#e8e4db;--run:#b85c00;--done:#c0262d;--pause:#7a7f86;--focus:#1f5fbf;--err:#b3261e;--chip:#efece5;--edge:#bdb7aa;--btn:#1c1d1f;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141517;--card:#1d1f22;--ink:#ecebe7;--soft:#a2a6ab;--line:#34373b;--track:#2b2e32;--run:#ffa64d;--done:#ff6b6b;--pause:#8d9298;--focus:#8ab4ff;--err:#ff8a80;--chip:#26292d;--edge:#4a4e53;--btn:#ecebe7;--btnink:#141517}}
:root[data-theme="dark"]{--bg:#141517;--card:#1d1f22;--ink:#ecebe7;--soft:#a2a6ab;--line:#34373b;--track:#2b2e32;--run:#ffa64d;--done:#ff6b6b;--pause:#8d9298;--focus:#8ab4ff;--err:#ff8a80;--chip:#26292d;--edge:#4a4e53;--btn:#ecebe7;--btnink:#141517}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 72px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
h1{font-size:1.05rem;margin:0;font-weight:650}
h1 span{font-weight:400;color:var(--soft)}
.icon{display:grid;place-items:center;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* dial */
.dial{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:8px auto 4px}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .tr{fill:none;stroke:var(--track);stroke-width:3}
.dial .ar{fill:none;stroke:var(--run);stroke-width:5;stroke-linecap:round}
.dial[data-s="paused"] .ar{stroke:var(--pause)}
.dial[data-s="done"] .ar{stroke:var(--done)}
.dial[data-s="idle"] .ar{stroke-width:3;stroke:color-mix(in srgb,var(--run) 45%,var(--track))}
.dial[data-s="invalid"] .ar{stroke-width:3;stroke:var(--track)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#time{font-weight:600;letter-spacing:-.02em;line-height:1;font-size:clamp(52px,17vw,88px)}
#time.long{font-size:clamp(38px,11vw,62px)}
.dial[data-s="invalid"] #time{color:var(--line)}
#state{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);height:1.4em;margin-bottom:4px}
.dial[data-s="done"] #state{color:var(--done);font-weight:650}
#ends{color:var(--soft);height:1.5em;margin-top:8px;font-size:.98rem}
@media (prefers-reduced-motion:no-preference){
  .dial.sweep .ar{transition:stroke-dashoffset .45s cubic-bezier(.3,.7,.2,1)}
  .dial[data-s="done"].ring #time{animation:blink 1s steps(2,jump-none) infinite}
}
@keyframes blink{50%{opacity:.35}}
/* controls */
.panel{min-height:132px}
.row{display:flex;gap:8px;align-items:stretch}
.field{flex:1;min-width:0;position:relative}
.field label{position:absolute;left:14px;top:7px;font-size:.72rem;color:var(--soft);pointer-events:none}
#len{width:100%;height:58px;padding:22px 14px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1.15rem}
#len[aria-invalid="true"]{border-color:var(--err)}
#len[aria-invalid="true"]:focus-visible{outline-color:var(--err)}
.go{height:58px;padding:0 22px;border:0;border-radius:12px;background:var(--btn);color:var(--btnink);font-weight:650;font-size:1.05rem;cursor:pointer;min-width:96px}
.go:disabled{background:transparent;color:var(--soft);border:1.5px solid var(--line);cursor:default}
.sec{height:58px;padding:0 14px;border:1.5px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;flex:1}
.go.wide{flex:1.4}
#msg{white-space:pre-wrap;min-height:2.9em;margin:6px 2px 0;font-size:.9rem;color:var(--soft)}
#msg.err{color:var(--err)}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
@media (max-width:480px){.chips{grid-template-columns:repeat(3,1fr)}}
.chipcap{margin:12px 2px 0;font-size:.82rem;color:var(--soft)}
.chips button{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer;font-weight:550}
.chips button:hover{filter:brightness(.96)}
[hidden]{display:none!important}
/* settings */
details{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;padding:10px 0;color:var(--soft);list-style-position:inside}
summary b{color:var(--ink);font-weight:600}
.set{display:grid;gap:14px;padding:6px 0 4px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set input[type=range]{width:55%;accent-color:var(--run)}
.set input[type=checkbox]{width:20px;height:20px;accent-color:var(--run)}
.small{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.trust{margin-top:18px;color:var(--soft);font-size:.82rem}
.keys{color:var(--soft);font-size:.82rem}
@media (hover:none){.keys{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main>
<header>
  <h1>Timer <span>· countdown with alarm</span></h1>
  <button class="icon" id="theme" type="button" aria-label="Switch dark or light theme" title="Dark / light"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
</header>

<div class="dial sweep" id="dial" data-s="idle">
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="46"/><circle class="ar" id="arc" cx="50" cy="50" r="46" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0"/></svg>
  <div class="face">
    <div id="state">Ready</div>
    <div id="time" class="num" role="timer" aria-label="Time left">5:00</div>
    <div id="ends" class="num"></div>
  </div>
</div>

<div class="panel">
  <div class="row" id="idleRow">
    <div class="field">
      <label for="len">Length</label>
      <input id="len" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-describedby="msg" value="5">
    </div>
    <button class="go" id="start" type="button">Start</button>
  </div>
  <div class="row" id="runRow" hidden>
    <button class="go wide" id="pause" type="button">Pause</button>
    <button class="sec" id="plus" type="button">+1 min</button>
    <button class="sec" id="reset" type="button">Reset</button>
  </div>
  <p id="msg">= 5 minutes  ·  a plain number means minutes</p>
  <p class="chipcap" id="chipl">Quick start</p>
  <div class="chips" role="group" aria-labelledby="chipl">
    <button type="button" data-t="1">1 min</button><button type="button" data-t="5">5 min</button><button type="button" data-t="10">10 min</button><button type="button" data-t="15">15 min</button><button type="button" data-t="25">25 min</button><button type="button" data-t="30">30 min</button>
  </div>
</div>

<details id="adv">
  <summary>Alarm · <b id="sum">sound on, 5 s</b></summary>
  <div class="set">
    <label>Sound <input type="checkbox" id="sound" checked></label>
    <label for="vol">Volume <span class="num" id="volv">80%</span></label>
    <input type="range" id="vol" min="0" max="100" value="80" aria-label="Alarm volume" style="width:100%">
    <label for="dur">Ring for <span class="num" id="durv">5 s</span></label>
    <input type="range" id="dur" min="1" max="30" value="5" aria-label="Alarm length in seconds" style="width:100%">
    <label>Ring until I stop it <input type="checkbox" id="loop"></label>
    <label>Desktop notification when time is up <input type="checkbox" id="notif"></label>
    <label>Keep the screen on while it runs <input type="checkbox" id="wake" checked></label>
    <div class="row" style="gap:8px"><button type="button" class="small" id="test">Test alarm</button><button type="button" class="small" id="link">Copy link to this length</button></div>
  </div>
</details>
<p class="trust">Keeps time by your device clock, so it stays right in background tabs and after sleep. Nothing leaves your browser.</p>
<p class="keys">Space start / pause · Esc reset · Enter starts from the box</p>
<div class="sr" aria-live="polite" id="say"></div>
<audio id="alarm" src="alarm.mp3" preload="auto"></audio>
</main>

<script id="core">

var T = (function () {

    [1, /^(s|sec|secs|second|seconds|sek|sekunde|sekunden)$/]
  ];

  function unit(w) { for (var i = 0; i < UNITS.length; i++) if (UNITS[i][1].test(w)) return UNITS[i][0]; return 0; }

    s = Math.round(s);
    if (s <= 0) return { state: 'zero', secs: 0, msg: 'That is zero. ' + HINT };
    if (s > MAX) return { state: 'error', msg: 'The longest timer is 99 hours 59 minutes 59 seconds.' };
    return { state: 'ok', secs: s };

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'timerSettings', RUN = 'timerRun';
  var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var put = function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  var S = T.settings(get(KEY));
  var len = $('len'), dial = $('dial'), arc = $('arc'), timeEl = $('time'), stateEl = $('state'), ends = $('ends'), msg = $('msg'), audio = $('alarm');
  // run: {total, end} running, {total, rest} paused, {total, end, done:true} finished
  var lastOk = 300, run = null, raf = 0, iv = 0, ringing = 0, ringStop = 0, wakeLock = null, testing = false, actx = null, baseTitle = document.title;

  function save(secs) { put(KEY, T.store(S, secs || 0)); }
  function saveRun() { put(RUN, run ? JSON.stringify(run) : null); }
  function say(t) { $('say').textContent = ''; setTimeout(function () { $('say').textContent = t; }, 30); }
  function setArc(f) { f = Math.max(0, Math.min(1, f)); arc.style.strokeDashoffset = String(1000 * (1 - f)); arc.style.opacity = f > 0.002 ? 1 : 0; }
  function showTime(secs) { var s = T.format(secs); timeEl.textContent = s; timeEl.classList.toggle('long', s.replace('−', '').length > 5); }
  function applyTheme() {
    if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme');
    var dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.querySelector('meta[name=theme-color]').content = dark ? '#141517' : '#f5f3ee';
  }

  // ---- idle: the box drives the dial
  function preview() {
    var p = T.parse(len.value);
    if (p.state === 'ok') lastOk = p.secs;
    S.last = len.value; save();
    if (p.state === 'ok') {
      dial.dataset.s = 'idle'; stateEl.textContent = 'Ready'; showTime(p.secs); setArc(1);
      ends.textContent = ''; msg.className = ''; len.removeAttribute('aria-invalid');
      msg.textContent = '= ' + T.words(p.secs) + (/^\s*\d+([.,]\d+)?\s*$/.test(len.value) ? '  \u00b7  a plain number means minutes' : '');
      $('start').disabled = false;

      showTime(Math.ceil(run.rest / 1000)); setArc(run.rest / (run.total * 1000));

      return;

    $('idleRow').hidden = running; $('runRow').hidden = !running;

    dial.dataset.s = run.done ? 'done' : run.rest != null ? 'paused' : 'running';
    stateEl.textContent = run.done ? 'Time’s up' : run.rest != null ? 'Paused' : 'Running';
    $('pause').textContent = run.done ? 'Restart ' + T.format(run.total) : run.rest != null ? 'Resume' : 'Pause';
    $('plus').hidden = !!run.done;
    $('reset').textContent = run.done ? 'Done' : 'Reset';

  function unlockAudio() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    try { audio.muted = true; var p = audio.play(); if (p) p.then(function () { if (!ringing && !testing) { audio.pause(); audio.currentTime = 0; } audio.muted = false; }, function () { audio.muted = false; }); } catch (e) {}
  }
  function begin(secs, quiet) {
    stopAlarm();
    unlockAudio();
    run = { total: secs, end: now() + secs * 1000 };
    if (T.parse(len.value).secs !== secs) len.value = T.short(secs);
    S.last = len.value;
    save(secs); saveRun(); dial.classList.remove('sweep');
    setArc(1); void arc.getBoundingClientRect(); dial.classList.add('sweep');
    startTicking(); paint(); keepAwake();
    if (!quiet) say('Timer started, ' + T.words(secs) + '. Ends ' + T.clock(run.end, now()) + '.');
    $('pause').focus({ preventScroll: true });
  }
  function start() { var p = preview(); if (p.state === 'ok') begin(p.secs); else len.focus(); }
  function pause() {
    if (!run) return;
    if (run.done) { begin(run.total); return; }
    if (run.rest == null) { run.rest = Math.max(0, run.end - now()); delete run.end; clearInterval(iv); say('Paused, ' + T.words(Math.ceil(run.rest / 1000)) + ' left.'); release(); }
    else { run.end = now() + run.rest; delete run.rest; startTicking(); say('Resumed. Ends ' + T.clock(run.end, now()) + '.'); keepAwake(); }
    saveRun(); paint();
  }
  function plus() {
    if (!run) return;
    if (run.done) return;
    run.total += 60;
    if (run.total > T.MAX) run.total = T.MAX;
    if (run.rest != null) run.rest = Math.min(run.rest + 60000, run.total * 1000); else run.end = Math.min(run.end + 60000, now() + run.total * 1000);
    saveRun(); paint(); say('One minute added. Ends ' + T.clock(run.end || now() + run.rest, now()) + '.');
  }
  function reset() {
    stopAlarm(); clearInterval(iv); release();
    var had = run; run = null; saveRun(); paint();
    if (had) { setArc(1); say('Reset to ' + T.words(had.total) + '.'); }
    len.focus({ preventScroll: true });
  }
  function finish(alarm) {
    if (!run) return;
    run.done = true; delete run.rest; saveRun(); release();
    dial.classList.add('ring'); paint();
    if (alarm) {
      say('Time’s up. The ' + T.words(run.total) + ' timer has finished.');
      ring(false);
      if (S.notif && 'Notification' in window && Notification.permission === 'granted') {
        try { new Notification('Time’s up', { body: 'Your ' + T.words(run.total) + ' timer has finished.', tag: 'gptgames-timer' }); } catch (e) {}
      }
      if (S.sound && navigator.vibrate) try { navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
    }
    setTimeout(function () { dial.classList.remove('ring'); }, Math.max(4000, S.alarmDuration * 1000));
  }

  // ---- alarm
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime;
      for (var i = 0; i < 4; i++) { var o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0, t + i * .25); g.gain.linearRampToValueAtTime(S.alarmVolume / 100 * .4, t + i * .25 + .01); g.gain.linearRampToValueAtTime(0, t + i * .25 + .18); o.start(t + i * .25); o.stop(t + i * .25 + .2); }
    } catch (e) {}
  }
  function ring(test) {
    if (!S.sound && !test) return;
    stopAlarm();
    testing = test; ringing = 1; audio.volume = S.alarmVolume / 100; audio.loop = true; audio.currentTime = 0;
    var p = audio.play(); if (p && p.catch) p.catch(function () { beep(); ringing = setInterval(beep, 1000); });
    if (!S.loopAlarm) ringStop = setTimeout(stopAlarm, S.alarmDuration * 1000);
    $('test').textContent = 'Stop alarm';
  }
  function stopAlarm() {
    clearTimeout(ringStop); if (typeof ringing === 'number' && ringing > 1) clearInterval(ringing);
    ringing = 0; testing = false; try { audio.pause(); audio.currentTime = 0; } catch (e) {}
    $('test').textContent = 'Test alarm';
  }

  // ---- screen wake lock
  function keepAwake() { if (!S.wake || !('wakeLock' in navigator) || wakeLock) return; navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }, function () {}); }
  function release() { if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; } }

  // ---- settings
  function sumText() { $('sum').textContent = !S.sound ? 'sound off' : 'sound on, ' + (S.loopAlarm ? 'until stopped' : S.alarmDuration + ' s') + (S.alarmVolume === 0 ? ', volume 0' : ''); }
  function loadSettings() {
    $('sound').checked = S.sound; $('loop').checked = S.loopAlarm; $('notif').checked = S.notif && 'Notification' in window && Notification.permission === 'granted'; $('wake').checked = S.wake;
    $('vol').value = S.alarmVolume; $('volv').textContent = S.alarmVolume + '%'; $('dur').value = S.alarmDuration; $('durv').textContent = S.alarmDuration + ' s';
    $('adv').open = S.advancedShown; applyTheme(); sumText();
    if (!('wakeLock' in navigator)) $('wake').closest('label').hidden = true;
    if (!('Notification' in window)) $('notif').closest('label').hidden = true;
  }
  $('sound').onchange = function () { S.sound = this.checked; save(); sumText(); if (!S.sound) stopAlarm(); };
  $('loop').onchange = function () { S.loopAlarm = this.checked; save(); sumText(); };
  $('wake').onchange = function () { S.wake = this.checked; save(); if (S.wake && run && !run.done && run.rest == null) keepAwake(); else release(); };
  $('vol').oninput = function () { S.alarmVolume = +this.value; audio.volume = S.alarmVolume / 100; $('volv').textContent = S.alarmVolume + '%'; save(); sumText(); };
  $('dur').oninput = function () { S.alarmDuration = +this.value; $('durv').textContent = S.alarmDuration + ' s'; save(); sumText(); };
  $('notif').onchange = function () {
    var box = this;
    if (box.checked && Notification.permission !== 'granted') {
      Notification.requestPermission().then(function (p) { box.checked = p === 'granted'; S.notif = box.checked; save(); if (p === 'denied') { msg.className = 'err'; msg.textContent = 'Notifications are blocked for this site in your browser settings.'; } });
    } else { S.notif = box.checked; save(); }
  };
  $('adv').ontoggle = function () { S.advancedShown = this.open; save(); };
  $('test').onclick = function () { if (ringing) stopAlarm(); else { unlockAudio(); ring(true); } };
  $('link').onclick = function () {
    var secs = run ? run.total : T.parse(len.value).secs, b = this;
    if (!secs) { b.textContent = 'Enter a length first'; setTimeout(function () { b.textContent = 'Copy link to this length'; }, 1800); return; }
    var url = location.origin + location.pathname + '?t=' + encodeURIComponent(T.short(secs));
    var ok = function () { b.textContent = 'Link copied'; say('Link copied.'); setTimeout(function () { b.textContent = 'Copy link to this length'; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, function () { prompt('Copy this link', url); }); else prompt('Copy this link', url);
  };
  $('theme').onclick = function () {
    var dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
  };

  // ---- wiring
  len.addEventListener('input', preview);
  len.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); start(); } });
  $('start').onclick = start; $('pause').onclick = pause; $('plus').onclick = plus; $('reset').onclick = reset;
  document.querySelectorAll('.chips button').forEach(function (b) { b.onclick = function () { len.value = b.dataset.t; begin(+b.dataset.t * 60); }; });
  document.addEventListener('keydown', function (e) {
    var tgt = e.target, typing = tgt && (tgt.tagName === 'INPUT' && tgt.type === 'text' || tgt.isContentEditable);
    if (e.key === 'Escape') { if (testing) stopAlarm(); else if (run) reset(); else stopAlarm(); return; }
    if (e.key === ' ' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && !(tgt && /BUTTON|SUMMARY|SELECT/.test(tgt.tagName)) && !(tgt && tgt.tagName === 'INPUT' && tgt.type !== 'range')) {
      e.preventDefault();
      if (run) pause(); else start();
    }
  });
  document.addEventListener('visibilitychange', function () { if (run) { frame(); ends.textContent = endsText(); if (!document.hidden && run.rest == null && !run.done) keepAwake(); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  window.addEventListener('pagehide', function () { if (testing) stopAlarm(); });

  // ---- arrival: a link's length wins, then a run in progress, then the last length
  loadSettings();
  var q = T.fromQuery(location.search);
  len.value = S.last;
  try { var r = JSON.parse(get(RUN)); if (r && r.total > 0 && r.total <= T.MAX && (r.end > 0 || r.rest >= 0)) run = r; } catch (e) {}
  if (run && run.end && !run.done && run.end <= now()) run.done = true;  // finished while the page was closed: show it, no alarm
  if (run && run.done && now() - run.end > 3600e3) run = null;
  if (q && !(run && !run.done)) { run = null; saveRun(); len.value = T.short(q); }
  if (run && run.rest == null && !run.done) startTicking();
  paint();
  if (run && run.done) dial.classList.remove('ring');
})();
