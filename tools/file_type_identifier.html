<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Identify file types using magic numbers and signatures">
	<title>File Type Identifier</title>
	<style>
		:root {--primary: #4361ee; --primary-light: #4895ef; --dark: #212529; --dark-medium: #343a40; --dark-light: #495057; --light: #f8f9fa; --light-medium: #e9ecef; --light-dark: #dee2e6; --accent: #ff5c8d; --success: #38b000; --error: #e63946; --radius: 8px; --shadow: 0 4px 6px rgba(0,0,0,0.1); --trans: 0.2s ease-in-out; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;}
		[data-theme="dark"] {--primary: #4895ef; --primary-light: #4cc9f0; --dark: #f8f9fa; --dark-medium: #e9ecef; --dark-light: #dee2e6; --light: #212529; --light-medium: #343a40; --light-dark: #495057;}
		* {box-sizing: border-box; margin: 0; padding: 0;}
		body {font-family: var(--font); background: var(--light); color: var(--dark); line-height: 1.5; transition: background var(--trans), color var(--trans);}
		.container {max-width: 800px; margin: 0 auto; padding: 2rem 1rem;}
		header {display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;}
		h1 {font-size: 1.75rem; color: var(--primary); font-weight: 700;}
		.theme-toggle {background: none; border: none; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--light-medium); color: var(--dark); transition: all var(--trans);}
		.theme-toggle:hover {background: var(--light-dark);}
		.theme-icon {width: 24px; height: 24px; transition: all var(--trans);}
		.dropzone {display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed var(--light-dark); border-radius: var(--radius); padding: 3rem 2rem; background: var(--light-medium); transition: all var(--trans); cursor: pointer; margin-bottom: 1.5rem; text-align: center; min-height: 200px; position: relative; overflow: hidden;}
		.dropzone:hover, .dropzone:focus {border-color: var(--primary); background-color: rgba(67, 97, 238, 0.05);}
		.dropzone.active {border-color: var(--primary); background-color: rgba(67, 97, 238, 0.1); transform: scale(1.01);}
		.dropzone-icon {width: 64px; height: 64px; margin-bottom: 1rem; color: var(--primary); transition: all var(--trans);}
		.dropzone p {font-size: 1.1rem; color: var(--dark-light);}
		.highlight {color: var(--primary); font-weight: 500;}
		.panel {background: var(--light-medium); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem; margin-bottom: 1.5rem; transition: all var(--trans); animation: fadeIn 0.3s ease-out;}
		@keyframes fadeIn {from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);}}
		@keyframes spin {to {transform: rotate(360deg);}}
		.panel-header {display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--light-dark);}
		.panel-title {font-size: 1.2rem; font-weight: 600; color: var(--dark);}
		.btn-group {display: flex; gap: 0.5rem;}
		.btn {display: inline-flex; align-items: center; gap: 0.5rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); padding: 0.5rem 1rem; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all var(--trans);}
		.btn:hover {background: var(--primary-light);}
		.btn-sm {padding: 0.25rem 0.75rem; font-size: 0.8rem;}
		.verdict {grid-column: 1 / -1; padding: 0.75rem 1rem; border-radius: var(--radius); font-weight: 500; border-left: 4px solid;}
		.verdict.match {background: rgba(56, 176, 0, 0.1); border-color: var(--success);}
		.verdict.mismatch {background: rgba(230, 57, 70, 0.12); border-color: var(--error);}
		.verdict.info {background: rgba(67, 97, 238, 0.08); border-color: var(--primary);}
		.results {display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;}
		.info-card {background: var(--light); border-radius: var(--radius); padding: 1rem; border: 1px solid var(--light-dark); transition: all var(--trans);}
		.info-card h3 {font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dark-light); margin-bottom: 0.25rem; font-weight: 500;}
		.info-card p {font-size: 1rem; font-weight: 500; word-break: break-all;}
		.loader {display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 0;}
		.loader-spinner {width: 40px; height: 40px; border: 3px solid rgba(67, 97, 238, 0.3); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s linear infinite; margin-bottom: 1rem;}
		.loader-text {color: var(--dark-light);}
		.error {color: var(--error); text-align: center; padding: 1rem;}
		.history-list {margin-top: 1rem;}
		.history-item {display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border-bottom: 1px solid var(--light-dark); transition: all var(--trans); cursor: pointer;}
		.history-item:hover {background: rgba(67, 97, 238, 0.05);}
		.history-item:last-child {border-bottom: none;}
		.history-info {display: flex; align-items: center; gap: 1rem;}
		.history-icon {width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--primary); color: white; border-radius: var(--radius); font-weight: 600; font-size: 0.8rem; text-transform: uppercase;}
		.history-details h4 {font-size: 0.95rem; margin-bottom: 0.25rem;}
		.history-details p {font-size: 0.8rem; color: var(--dark-light);}
		.history-time {font-size: 0.8rem; color: var(--dark-light);}
		.toast {position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 0.75rem 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); transform: translateY(100px); opacity: 0; transition: all 0.3s ease-out; z-index: 1000;}
		.toast.show {transform: translateY(0); opacity: 1;}
		footer {text-align: center; margin-top: 2rem; color: var(--dark-light); font-size: 0.9rem;}
		@media (max-width: 600px) {
			.panel-header {flex-direction: column; align-items: flex-start; gap: 1rem;}
			.results {grid-template-columns: 1fr;}
			.history-item {flex-direction: column; align-items: flex-start; gap: 0.5rem;}
			.history-time {align-self: flex-end;}
		}
	</style>
</head>
<body>
<div class="container">
	<header>
		<h1>File Type Identifier</h1>
		<button class="theme-toggle" aria-label="Toggle dark mode">
			<svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
				<path d="M12 18c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6zm0-10c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z"/>
				<path d="M12 4V2M12 22v-2M6.34 6.34L4.93 4.93M19.07 19.07l-1.41-1.41M4 12H2M22 12h-2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
			</svg>
		</button>
	</header>

	<div class="dropzone" id="dropzone" tabindex="0" aria-label="Drop zone for file upload">
		<svg class="dropzone-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
			<path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
		</svg>
		<p>Drag & drop a file here<br>or <span class="highlight">click to select</span></p>
	</div>

	<div id="results-panel" class="panel" style="display: none;">
		<div id="loader" style="display: none;">
			<div class="loader">
				<div class="loader-spinner"></div>
				<div class="loader-text">Identifying file...</div>
			</div>
		</div>

		<div id="result-content" style="display: none;">
			<div class="panel-header">
				<h2 class="panel-title">File Information</h2>
				<div class="btn-group">
					<button id="copy-btn" class="btn">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
							<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
						</svg>
						Copy
					</button>
					<button id="download-btn" class="btn">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
							<polyline points="7 10 12 15 17 10"></polyline>
							<line x1="12" y1="15" x2="12" y2="3"></line>
						</svg>
						Download
					</button>
				</div>
			</div>
			<div class="results" id="results"></div>
		</div>

		<div id="error" class="error" style="display: none;"></div>
	</div>

	<div id="history-panel" class="panel" style="display: none;">
		<div class="panel-header">
			<h2 class="panel-title">Recent Files</h2>
			<button id="clear-history" class="btn btn-sm">Clear History</button>
		</div>
		<div class="history-list" id="history-list"></div>
	</div>

	<footer>
		<p>A powerful tool for identifying file types based on content signatures</p>
	</footer>
</div>

<div id="toast" class="toast"></div>

<script type="module">
	import {fileTypeFromBuffer} from 'https://cdn.jsdelivr.net/npm/file-type@18.4.0/+esm';

	document.addEventListener('DOMContentLoaded', () => {
		// DOM Elements
		const dropzone = document.getElementById('dropzone');
		const resultsPanel = document.getElementById('results-panel');
		const loader = document.getElementById('loader');
		const resultContent = document.getElementById('result-content');
		const results = document.getElementById('results');
		const errorEl = document.getElementById('error');
		const copyBtn = document.getElementById('copy-btn');
		const downloadBtn = document.getElementById('download-btn');
		const historyPanel = document.getElementById('history-panel');
		const historyList = document.getElementById('history-list');
		const clearHistoryBtn = document.getElementById('clear-history');
		const themeToggle = document.querySelector('.theme-toggle');
		const toast = document.getElementById('toast');

		// State variables
		let currentFile = null;
		let fileData = null;
		let fileHistory = loadFromStorage('fileHistory') || [];

		// Initialize
		initTheme();
		updateHistoryUI();

		// Event listeners
		dropzone.addEventListener('dragover', e => {
			e.preventDefault();
			dropzone.classList.add('active');
		});

		dropzone.addEventListener('dragleave', e => {
			e.preventDefault();
			dropzone.classList.remove('active');
		});

		dropzone.addEventListener('drop', e => {
			e.preventDefault();
			dropzone.classList.remove('active');
			const file = e.dataTransfer.files[0];
			if (file) processFile(file);
		});

		dropzone.addEventListener('click', () => {
			const input = document.createElement('input');
			input.type = 'file';
			input.onchange = e => {
				if (e.target.files[0]) processFile(e.target.files[0]);
			};
			input.click();
		});

		dropzone.addEventListener('keydown', e => {
			if (e.key === 'Enter' || e.key === ' ') {
				e.preventDefault();
				dropzone.click();
			}
		});

		copyBtn.addEventListener('click', copyToClipboard);
		downloadBtn.addEventListener('click', downloadFile);
		clearHistoryBtn.addEventListener('click', clearHistory);
		themeToggle.addEventListener('click', toggleTheme);

		// Functions
		async function processFile(file) {
			currentFile = file;
			showLoader();
			clearError();

			try {
				const buffer = await readFileAsBuffer(file);
				const id = await identify(buffer, file.size);

				fileData = {
					name: file.name,
					type: id.mime,
					ext: id.ext,
					desc: id.desc,
					extra: id.extra || [],
					verdict: verdictFor(file.name, id),
					size: formatFileSize(file.size),
					lastModified: new Date(file.lastModified).toLocaleString()
				};

				showResults();
				addToHistory(fileData);
			} catch (err) {
				showError(`Error processing file: ${err.message}`);
			}
		}

		// Short human names for the binary types file-type reports.
		const BINARY_NAMES = {
			png: 'PNG image', jpg: 'JPEG image', gif: 'GIF image', webp: 'WebP image',
			avif: 'AVIF image', tif: 'TIFF image', bmp: 'BMP image', ico: 'Windows icon',
			pdf: 'PDF document', zip: 'ZIP archive', gz: 'gzip archive', '7z': '7-Zip archive',
			rar: 'RAR archive', tar: 'tar archive', mp3: 'MP3 audio', wav: 'WAV audio',
			flac: 'FLAC audio', ogg: 'Ogg media', mp4: 'MP4 video', webm: 'WebM video',
			mov: 'QuickTime video', woff: 'WOFF font', woff2: 'WOFF2 font', ttf: 'TrueType font',
			otf: 'OpenType font', sqlite: 'SQLite database', wasm: 'WebAssembly module',
			exe: 'Windows executable', elf: 'ELF binary', vcf: 'vCard contact', ics: 'iCalendar'
		};

		async function identify(buffer, size) {
			if (size === 0) {
				return {desc: 'Empty file', mime: 'inode/x-empty', ext: '—', sure: false};
			}

			const sample = new Uint8Array(buffer, 0, Math.min(buffer.byteLength, SAMPLE_BYTES));
			const truncated = buffer.byteLength > SAMPLE_BYTES;
			const binary = await fileTypeFromBuffer(buffer);

			// A binary signature is the strongest evidence there is — except for the
			// generic application/xml, where the markup itself says more.
			if (binary && binary.mime !== 'application/xml') {
				return {
					desc: BINARY_NAMES[binary.ext] || binary.ext.toUpperCase(),
					mime: binary.mime, ext: binary.ext, sure: true
				};
			}

			const decoded = decodeText(sample);
			if (!decoded) {
				if (binary) return {desc: 'XML', mime: binary.mime, ext: binary.ext, sure: true};
				const hex = Array.from(sample.subarray(0, 16))
					.map(b => b.toString(16).padStart(2, '0')).join(' ');
				return {
					desc: 'Unrecognised binary data', mime: 'application/octet-stream', ext: '—', sure: false,
					extra: [{label: 'First bytes', value: hex}]
				};
			}

			const {text, encoding} = decoded;
			const hit = sniffText(text);
			const crlf = (text.match(/\r\n/g) || []).length;
			const lf = (text.match(/\n/g) || []).length - crlf;
			const extra = [
				{label: 'Encoding', value: encoding},
				{label: truncated ? 'Lines (first 8 MB)' : 'Lines', value: String(text.split(/\r?\n/).length)}
			];
			if (crlf || lf) {
				extra.push({label: 'Line endings', value: crlf && lf ? 'Mixed CRLF/LF' : crlf ? 'CRLF (Windows)' : 'LF (Unix)'});
			}

			if (hit) return {...hit, extra};
			if (binary) return {desc: 'XML', mime: binary.mime, ext: binary.ext, sure: true, extra};
			return {desc: 'Plain text', mime: 'text/plain', ext: 'txt', sure: false, extra};
		}

		// Extensions that mean the same thing, so a .jpeg holding a JPEG is a match.
		const EXT_ALIASES = [['jpg', 'jpeg', 'jpe'], ['tif', 'tiff'], ['html', 'htm', 'xhtml'],
			['yaml', 'yml'], ['sh', 'bash', 'zsh', 'py', 'rb', 'pl', 'js', 'mjs', 'command'],
			['txt', 'text', 'log', 'md', 'markdown'], ['xml', 'rss', 'atom', 'svg', 'plist'],
			['env', 'ini', 'cfg', 'conf', 'properties'], ['mp3', 'mpga'], ['sqlite', 'sqlite3', 'db']];

		function extMatches(actual, claimed) {
			if (!claimed) return false;
			if (actual === claimed) return true;
			return EXT_ALIASES.some(g => g.includes(actual) && g.includes(claimed));
		}

		// The question the tool exists to answer: does the name match the bytes?
		function verdictFor(name, id) {
			const claimed = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
			if (!claimed) return {kind: 'info', text: `No extension on the filename — content reads as ${id.desc}.`};
			if (extMatches(id.ext, claimed)) return {kind: 'match', text: `Content matches the .${claimed} extension — ${id.desc}.`};
			if (id.sure) return {kind: 'mismatch', text: `Extension says .${claimed}, but the content is ${id.desc}.`};
			if (id.ext === '—') return {kind: 'info', text: `${id.desc}. Nothing in the content to check the .${claimed} extension against.`};
			return {kind: 'info', text: `Identified from content as ${id.desc}. The .${claimed} extension can't confirm it.`};
		}

		// ---- Text identification -------------------------------------------------
		// file-type only knows binary magic numbers, so every text format lands here.
		// Everything below judges content, never the filename.

		const SAMPLE_BYTES = 8 * 1024 * 1024;

		function readBOM(u8) {
			if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return {enc: 'UTF-8 (BOM)', label: 'utf-8', skip: 3};
			if (u8[0] === 0xFF && u8[1] === 0xFE) return {enc: 'UTF-16 LE (BOM)', label: 'utf-16le', skip: 2};
			if (u8[0] === 0xFE && u8[1] === 0xFF) return {enc: 'UTF-16 BE (BOM)', label: 'utf-16be', skip: 2};
			return null;
		}

		// Returns the decoded text, or null if the bytes are not plausibly text.
		function decodeText(u8) {
			const bom = readBOM(u8);
			let text, encoding;
			try {
				if (bom) {
					text = new TextDecoder(bom.label, {fatal: true}).decode(u8.subarray(bom.skip));
					encoding = bom.enc;
				} else {
					text = new TextDecoder('utf-8', {fatal: true}).decode(u8);
					encoding = /[^\x00-\x7F]/.test(text) ? 'UTF-8' : 'ASCII';
				}
			} catch {
				// Not UTF-8. Legacy single-byte text is still text, so try
				// Windows-1252 before giving up and calling it binary.
				try {
					text = new TextDecoder('windows-1252').decode(u8);
					encoding = 'Windows-1252 / Latin-1 (assumed)';
				} catch {
					return null;
				}
			}
			// Control characters other than tab/newline/return mean binary.
			const control = (text.match(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g) || []).length;
			if (control / Math.max(text.length, 1) > 0.01) return null;
			return {text, encoding};
		}

		// Split on newlines that fall outside double quotes, so a quoted field
		// containing a line break doesn't look like a ragged table.
		function splitLinesRespectingQuotes(text) {
			const out = [];
			let start = 0, quoted = false;
			for (let i = 0; i < text.length; i++) {
				const c = text[i];
				if (c === '"') quoted = !quoted;
				else if (c === '\n' && !quoted) {
					out.push(text.slice(start, text[i - 1] === '\r' ? i - 1 : i));
					start = i + 1;
				}
			}
			if (start < text.length) out.push(text.slice(start));
			return out.filter(l => l.trim());
		}

		function delimiterFit(lines, delim) {
			// Split on the delimiter, honouring double quotes, and require every line
			// to yield the same field count (> 1).
			const counts = lines.map(line => {
				let fields = 1, quoted = false;
				for (let i = 0; i < line.length; i++) {
					const c = line[i];
					if (c === '"') quoted = !quoted;
					else if (c === delim && !quoted) fields++;
				}
				return fields;
			});
			return counts[0] > 1 && counts.every(c => c === counts[0]) ? counts[0] : 0;
		}

		// Structural sniffers, most specific first. `sure` marks a signature strong
		// enough that a disagreeing extension is worth calling out.
		function sniffText(text) {
			const head = text.slice(0, 4096);
			const trimmed = head.replace(/^\s+/, '');
			const lines = text.split(/\r?\n/).filter(l => l.trim());

			if (/^#!/.test(text)) {
				const interp = (text.slice(0, 200).match(/^#!\s*\S*?([\w.-]+)(?:\s|$)/) || [])[1] || '';
				const known = {python: 'Python', python3: 'Python', node: 'JavaScript', bash: 'Bash',
					sh: 'Shell', zsh: 'Zsh', perl: 'Perl', ruby: 'Ruby', env: ''};
				const lang = known[interp] !== undefined ? known[interp] : interp;
				const viaEnv = interp === 'env' ? (text.slice(0, 200).match(/env\s+([\w.-]+)/) || [])[1] : null;
				const name = viaEnv ? (known[viaEnv] || viaEnv) : lang;
				return {desc: (name ? name + ' ' : '') + 'script (shebang)', mime: 'text/x-script', ext: 'sh', sure: true};
			}
			if (/^[{[]/.test(trimmed)) {
				try {
					JSON.parse(text);
					return {desc: 'JSON', mime: 'application/json', ext: 'json', sure: true};
				} catch { /* not valid JSON, keep looking */ }
			}
			if (/^<\?xml|^</.test(trimmed)) {
				if (/<svg[\s>]/i.test(head)) return {desc: 'SVG image', mime: 'image/svg+xml', ext: 'svg', sure: true};
				if (/^<!doctype\s+html|<html[\s>]/i.test(trimmed)) return {desc: 'HTML document', mime: 'text/html', ext: 'html', sure: true};
				if (/<rss[\s>]/i.test(head)) return {desc: 'RSS feed (XML)', mime: 'application/rss+xml', ext: 'xml', sure: true};
				if (/<feed[\s>]/i.test(head)) return {desc: 'Atom feed (XML)', mime: 'application/atom+xml', ext: 'xml', sure: true};
				if (/^<\?xml/.test(trimmed)) return {desc: 'XML', mime: 'application/xml', ext: 'xml', sure: true};
			}
			if (/^<!doctype\s+html|^<html[\s>]/i.test(trimmed)) return {desc: 'HTML document', mime: 'text/html', ext: 'html', sure: true};
			if (/^diff --git |^Index: |^--- .*\n\+\+\+ /m.test(head)) return {desc: 'Unified diff / patch', mime: 'text/x-diff', ext: 'diff', sure: true};
			if (/^\d+\s*\r?\n\d{2}:\d{2}:\d{2},\d{3}\s*-->/.test(text)) return {desc: 'SubRip subtitles', mime: 'application/x-subrip', ext: 'srt', sure: true};
			if (/^WEBVTT/.test(trimmed)) return {desc: 'WebVTT subtitles', mime: 'text/vtt', ext: 'vtt', sure: true};
			if (/^%YAML|^---\s*$/m.test(head.split('\n')[0] + '\n')) return {desc: 'YAML', mime: 'application/yaml', ext: 'yaml', sure: true};
			if (/^\s*(CREATE|ALTER|DROP|INSERT INTO|SELECT)\s+/i.test(trimmed)) return {desc: 'SQL', mime: 'application/sql', ext: 'sql', sure: false};

			const rows = splitLinesRespectingQuotes(text);
			if (rows.length >= 2) {
				const tsv = delimiterFit(rows, '\t');
				if (tsv) return {desc: `Tab-separated values (${tsv} columns)`, mime: 'text/tab-separated-values', ext: 'tsv', sure: false};
				const csv = delimiterFit(rows, ',');
				if (csv) return {desc: `CSV, comma-separated (${csv} columns)`, mime: 'text/csv', ext: 'csv', sure: false};
				const scsv = delimiterFit(rows, ';');
				if (scsv) return {desc: `CSV, semicolon-separated (${scsv} columns)`, mime: 'text/csv', ext: 'csv', sure: false};
			}
			// Config: every meaningful line is KEY=value.
			const body = lines.filter(l => !/^\s*[#;]/.test(l));
			if (body.length && body.every(l => /^\s*\[.+\]\s*$/.test(l) || /^\s*[A-Za-z_][\w.-]*\s*=/.test(l))) {
				return {desc: 'Key=value config (.env / INI style)', mime: 'text/plain', ext: 'env', sure: false};
			}
			// YAML without a document marker: keys, list items and comments only.
			if (body.length >= 2 && /:/.test(head) &&
				body.every(l => /^\s*-\s|^\s*[\w.$/-]+\s*:(\s|$)/.test(l)) && body.some(l => /:(\s|$)/.test(l))) {
				return {desc: 'YAML', mime: 'application/yaml', ext: 'yaml', sure: false};
			}
			if (/^#{1,6}\s+\S/m.test(head) || /^\s*[-*]\s+\S/m.test(head) && /^#{1,6}\s|\[.+\]\(.+\)/m.test(head)) {
				return {desc: 'Markdown', mime: 'text/markdown', ext: 'md', sure: false};
			}
			return null;
		}

		function readFileAsBuffer(file) {
			return new Promise((resolve, reject) => {
				const reader = new FileReader();
				reader.onload = () => resolve(reader.result);
				reader.onerror = () => reject(new Error('Failed to read file'));
				reader.readAsArrayBuffer(file);
			});
		}

		function showLoader() {
			resultsPanel.style.display = 'block';
			loader.style.display = 'block';
			resultContent.style.display = 'none';
			errorEl.style.display = 'none';
		}

		function showResults() {
			loader.style.display = 'none';
			resultContent.style.display = 'block';

			const cards = [
				{label: 'File Name', value: fileData.name},
				{label: 'Identified As', value: fileData.desc || fileData.type},
				{label: 'MIME Type', value: fileData.type},
				{label: 'Extension', value: fileData.ext},
				{label: 'Size', value: fileData.size},
				{label: 'Last Modified', value: fileData.lastModified},
				...(fileData.extra || [])
			];

			const v = fileData.verdict;
			results.innerHTML = (v ? `<div class="verdict ${v.kind}">${escapeHTML(v.text)}</div>` : '') +
				cards.map(c => `
      <div class="info-card">
        <h3>${escapeHTML(c.label)}</h3>
        <p>${escapeHTML(c.value)}</p>
      </div>`).join('');
		}

		function showError(message) {
			loader.style.display = 'none';
			resultContent.style.display = 'none';
			errorEl.style.display = 'block';
			errorEl.textContent = message;
		}

		function clearError() {
			errorEl.style.display = 'none';
			errorEl.textContent = '';
		}

		function addToHistory(data) {
			const historyItem = {
				...data,
				id: Date.now(),
				timestamp: Date.now()
			};

			fileHistory.unshift(historyItem);
			if (fileHistory.length > 10) fileHistory.pop();
			saveToStorage('fileHistory', fileHistory);
			updateHistoryUI();
		}

		function updateHistoryUI() {
			if (fileHistory.length === 0) {
				historyPanel.style.display = 'none';
				return;
			}

			historyPanel.style.display = 'block';
			historyList.innerHTML = '';

			fileHistory.forEach(item => {
				const element = document.createElement('div');
				element.className = 'history-item';
				element.innerHTML = `
        <div class="history-info">
          <div class="history-icon">${item.ext}</div>
          <div class="history-details">
            <h4>${escapeHTML(item.name)}</h4>
            <p>${escapeHTML(item.type)}</p>
          </div>
        </div>
        <div class="history-time">${formatTimeAgo(item.timestamp)}</div>
      `;

				element.addEventListener('click', () => {
					fileData = item;
					showHistoryItem();
				});

				historyList.appendChild(element);
			});
		}

		function showHistoryItem() {
			resultsPanel.style.display = 'block';
			loader.style.display = 'none';
			resultContent.style.display = 'block';
			errorEl.style.display = 'none';

			// Can't download from history since we don't store the binary data
			downloadBtn.style.display = 'none';
			showResults();
		}

		function copyToClipboard() {
			if (!fileData) return;

			const text = [
				fileData.verdict ? fileData.verdict.text : '',
				`File Name: ${fileData.name}`,
				`Identified As: ${fileData.desc || fileData.type}`,
				`MIME Type: ${fileData.type}`,
				`Extension: ${fileData.ext}`,
				`Size: ${fileData.size}`,
				`Last Modified: ${fileData.lastModified}`,
				...(fileData.extra || []).map(c => `${c.label}: ${c.value}`)
			].filter(Boolean).join('\n');

			navigator.clipboard.writeText(text)
					.then(() => showToast('Copied to clipboard!'))
					.catch(() => showToast('Failed to copy', true));
		}

		function downloadFile() {
			if (!currentFile) return;
			const url = URL.createObjectURL(currentFile);
			const a = document.createElement('a');
			a.href = url;
			a.download = currentFile.name;
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
		}

		function clearHistory() {
			fileHistory = [];
			saveToStorage('fileHistory', []);
			updateHistoryUI();
			showToast('History cleared');
		}

		function toggleTheme() {
			const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
			const newTheme = currentTheme === 'light' ? 'dark' : 'light';
			document.documentElement.setAttribute('data-theme', newTheme);
			saveToStorage('theme', newTheme);

			// Update theme icon
			updateThemeIcon(newTheme);
		}

		function initTheme() {
			const savedTheme = loadFromStorage('theme') ||
					(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', savedTheme);
			updateThemeIcon(savedTheme);
		}

		function updateThemeIcon(theme) {
			const icon = themeToggle.querySelector('.theme-icon');
			if (theme === 'dark') {
				icon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>';
			} else {
				icon.innerHTML = '<path d="M12 18c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6zm0-10c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z"/><path d="M12 4V2M12 22v-2M6.34 6.34L4.93 4.93M19.07 19.07l-1.41-1.41M4 12H2M22 12h-2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
			}
		}

		function showToast(message, isError = false) {
			toast.textContent = message;
			toast.style.background = isError ? 'var(--error)' : 'var(--success)';
			toast.classList.add('show');

			setTimeout(() => {
				toast.classList.remove('show');
			}, 3000);
		}

		// Helper functions
		function formatFileSize(bytes) {
			if (bytes === 0) return '0 Bytes';
			const units = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
			const i = Math.floor(Math.log(bytes) / Math.log(1024));
			return `${(bytes / Math.pow(1024, i)).toFixed(2)} ${units[i]}`;
		}

		function formatTimeAgo(timestamp) {
			const seconds = Math.floor((Date.now() - timestamp) / 1000);

			if (seconds < 60) return 'Just now';

			const intervals = {
				year: 31536000,
				month: 2592000,
				week: 604800,
				day: 86400,
				hour: 3600,
				minute: 60
			};

			for (const [unit, secondsInUnit] of Object.entries(intervals)) {
				const interval = Math.floor(seconds / secondsInUnit);
				if (interval >= 1) {
					return `${interval} ${unit}${interval !== 1 ? 's' : ''} ago`;
				}
			}
		}

		function saveToStorage(key, data) {
			try {
				localStorage.setItem(key, JSON.stringify(data));
			} catch (e) {
				console.error('Storage error:', e);
			}
		}

		function loadFromStorage(key) {
			try {
				const data = localStorage.getItem(key);
				return data ? JSON.parse(data) : null;
			} catch (e) {
				console.error('Storage error:', e);
				return null;
			}
		}

		function escapeHTML(str) {
			return str
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;')
					.replace(/"/g, '&quot;')
					.replace(/'/g, '&#039;');
		}
	});
</script>
