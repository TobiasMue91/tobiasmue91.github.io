<script>
    // Theme management - Fixed implementation
    function setTheme(mode) {
        if (mode === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('hljs-light').disabled = true;
            document.getElementById('hljs-dark').disabled = false;
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('hljs-light').disabled = false;
            document.getElementById('hljs-dark').disabled = true;
        }

        // Update highlight.js theme if output has content
        if (document.getElementById('output').textContent) {
            hljs.highlightElement(document.getElementById('output'));
        }
    }

    // Initialize theme
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            setTheme('dark');
        } else {
            setTheme('light');
        }
    }

    // --- PHP lexing -------------------------------------------------------
    // Minifying PHP with plain regexes corrupts real files: quotes inside
    // comments swallow the code after them, heredoc bodies get rewritten,
    // #[Attributes] look like # comments, and inline HTML is program output
    // rather than source. So split the file into typed spans first and only
    // ever rewrite the spans that are actually code.

    const OPERATOR_CHARS = ';,{}()[].=<>:?!+-*/%&|^';
    // Character pairs that must not be welded together by removing the space
    // between them, because the pair means something else entirely.
    const GLUE_HAZARDS = ['++', '--', '//', '/*', '?>'];
        const HEREDOC_START = /^<<<[ \t]*(['"]?)([A-Za-z_\x80-\uffff][A-Za-z0-9_\x80-\uffff]*)\1\r?\n/;

    // Skip a {$...} interpolation block, which may contain quotes of its own.
    const skipBraces = (src, start) => {
        let i = start, depth = 0;
        while (i < src.length) {
            const c = src[i];
            if (c === '\\') { i += 2; continue; }
            if (c === '{') { depth++; }
            else if (c === '}') { depth--; if (depth === 0) return i + 1; }
            else if (c === "'" || c === '"') { i = readQuoted(src, i); continue; }
            i++;
        }
        return src.length;
    };

    // Read a '...', "..." or `...` literal, escapes and interpolation included.
    const readQuoted = (src, start) => {
        const quote = src[start];
        let i = start + 1;
        while (i < src.length) {
            const c = src[i];
            if (c === '\\') { i += 2; continue; }
            if (c === quote) return i + 1;
            if (quote !== "'" && c === '{' && src[i + 1] === '$') { i = skipBraces(src, i); continue; }
            i++;
        }
        return src.length;
    };

    // Read a heredoc or nowdoc up to and including its closing label. The body
    // is significant whitespace, so it is never touched.
    const readHeredoc = (src, start) => {
        const opener = HEREDOC_START.exec(src.slice(start));
        if (!opener) return start;
        const bodyStart = start + opener[0].length;
        const closer = new RegExp('^[ \\t]*' + opener[2] + '(?![A-Za-z0-9_])', 'm').exec(src.slice(bodyStart));
        if (!closer) return src.length;
        return bodyStart + closer.index + closer[0].length;
    };

    // Split PHP source into {type, text} spans: 'html', 'open', 'close',
    // 'code', 'string' and 'comment'.
    const lexPHP = (src) => {
        // Short open tags are off by default in PHP, so only <?php and <?=
        // start a block; anything else stays inline HTML.
        const openTag = /<\?(php(?![A-Za-z0-9_])|=)/g;
        const tokens = [];
        const push = (type, text) => { if (text) tokens.push({ type, text }); };
        // A pasted fragment with no open tag at all is still PHP code.
        const tagless = !openTag.test(src);
        openTag.lastIndex = 0;
        let i = 0, inPhp = tagless, code = '';
        const flushCode = () => { push('code', code); code = ''; };

        while (i < src.length) {
            if (!inPhp) {
                openTag.lastIndex = i;
                const tag = openTag.exec(src);
                if (!tag) { push('html', src.slice(i)); break; }
                push('html', src.slice(i, tag.index));
                push('open', tag[0]);
                i = tag.index + tag[0].length;
                inPhp = true;
                continue;
            }
            const c = src[i], next = src[i + 1];
            if (c === '?' && next === '>') {
                flushCode();
                push('close', '?>');
                i += 2;
                inPhp = false;
                continue;
            }
            if (c === '/' && next === '*') {
                flushCode();
                const close = src.indexOf('*/', i + 2);
                const end = close === -1 ? src.length : close + 2;
                push('comment', src.slice(i, end));
                i = end;
                continue;
            }
            // '#[' opens a PHP 8 attribute, not a comment.
            if ((c === '/' && next === '/') || (c === '#' && next !== '[')) {
                flushCode();
                let j = i;
                while (j < src.length && src[j] !== '\n' && !(src[j] === '?' && src[j + 1] === '>')) j++;
                push('comment', src.slice(i, j));
                i = j;
                continue;
            }
            if (c === "'" || c === '"' || c === '`') {
                flushCode();
                const end = readQuoted(src, i);
                push('string', src.slice(i, end));
                i = end;
                continue;
            }
            if (c === '<' && next === '<' && src[i + 2] === '<') {
                const end = readHeredoc(src, i);
                if (end > i) {
                    flushCode();
                    push('string', src.slice(i, end));
                    i = end;
                    continue;
                }
            }
            code += c;
            i++;
        }
        flushCode();
        return tokens;
    };

    // Collapse whitespace inside a run of code, dropping it entirely next to
    // an operator unless that would weld two characters into a new token.
    // prev/next are the characters on either side of this run of code, so the
    // rule holds at a span boundary too.
    const collapseCode = (text, prev, next) => text.replace(/\s+/g, (run, offset, whole) => {
        const before = offset === 0 ? prev : whole[offset - 1];
        const after = offset + run.length === whole.length ? next : whole[offset + run.length];
        if (before === undefined || after === undefined) return '';
        if (!OPERATOR_CHARS.includes(before) && !OPERATOR_CHARS.includes(after)) return ' ';
        return GLUE_HAZARDS.includes(before + after) ? ' ' : '';
    });

    // Enhanced minification function
    const minifyPHP = (code) => {
        if (!code.trim()) return '';
        const options = {
            removeComments: document.getElementById('remove-comments').checked,
            removeWhitespace: document.getElementById('remove-whitespace').checked
        };
        try {
            const spans = lexPHP(code).map(token => {
                if (token.type !== 'comment') return token;
                // A dropped comment still separates the code around it.
                if (options.removeComments) return { type: 'code', text: ' ' };
                // A kept line comment needs the newline that terminates it.
                if (!token.text.startsWith('/*')) return { type: 'comment', text: token.text + '\n' };
                return token;
            });
            // Merge neighbouring code spans so collapsing sees one continuous run.
            const merged = [];
            spans.forEach(span => {
                const last = merged[merged.length - 1];
                if (last && last.type === 'code' && span.type === 'code') last.text += span.text;
                else merged.push({ type: span.type, text: span.text });
            });
            if (options.removeWhitespace) {
                merged.forEach((span, n) => {
                    if (span.type !== 'code') return;
                    const before = merged[n - 1], after = merged[n + 1];
                    span.text = collapseCode(span.text, before && before.text.slice(-1), after && after.text[0]);
                });
                // PHP requires a whitespace character after '<?php'.
                merged.forEach((span, n) => {
                    const before = merged[n - 1];
                    if (before && before.type === 'open' && /php$/i.test(before.text) && !/^\s/.test(span.text)) {
                        span.text = ' ' + span.text;
                    }
                });
            }
            return merged.map(span => span.text).join('');
        } catch (error) {
            showToast('Error during minification: ' + error.message, 'error');
            console.error('Minification error:', error);
            return code;
        }
    };

    // Update output with minified code
    const updateOutput = () => {
        const input = document.getElementById('input').value;

        if (!input.trim()) {
            document.getElementById('output').textContent = '';
            document.getElementById('stats').textContent = '';
            document.getElementById('copy-btn').classList.add('hidden');
            document.getElementById('download-btn').classList.add('hidden');
            return;
        }

        try {
            const minified = minifyPHP(input);
            document.getElementById('output').textContent = minified;
            hljs.highlightElement(document.getElementById('output'));

            const originalSize = new Blob([input]).size;
            const minifiedSize = new Blob([minified]).size;
            const savings = ((originalSize - minifiedSize) / originalSize * 100).toFixed(2);

            document.getElementById('stats').innerHTML = `
            <span class="mr-2">Original: ${formatBytes(originalSize)}</span>
            <span class="mr-2">Minified: ${formatBytes(minifiedSize)}</span>
            <span class="font-medium ${originalSize > minifiedSize ? 'text-green-600 dark:text-green-400' : ''}">
                Saved: ${savings}% (${formatBytes(originalSize - minifiedSize)})
            </span>
        `;

            document.getElementById('copy-btn').classList.remove('hidden');
            document.getElementById('download-btn').classList.remove('hidden');
        } catch (error) {
            showToast('Error: ' + error.message, 'error');
        }
    };

    // Format bytes to human-readable format
    const formatBytes = (bytes, decimals = 1) => {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    };

    // Toast notification system
    const showToast = (message, type = 'info') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');

        toast.className = 'flex items-center p-3 mb-3 rounded-lg shadow-lg transition transform duration-300 translate-x-full';

        switch (type) {
            case 'success':
                toast.classList.add('bg-green-100', 'text-green-800', 'dark:bg-green-800', 'dark:text-green-100');
                break;
            case 'error':
                toast.classList.add('bg-red-100', 'text-red-800', 'dark:bg-red-800', 'dark:text-red-100');
                break;
            default: // info
                toast.classList.add('bg-blue-100', 'text-blue-800', 'dark:bg-blue-800', 'dark:text-blue-100');
        }

        toast.innerHTML = `
        <div class="text-sm font-medium">${message}</div>
        <button class="ml-3 p-1 hover:bg-opacity-20 hover:bg-black rounded">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    `;

        container.appendChild(toast);

        setTimeout(() => toast.classList.remove('translate-x-full'), 10);

        toast.querySelector('button').addEventListener('click', () => {
            toast.classList.add('translate-x-full');
            setTimeout(() => container.removeChild(toast), 300);
        });

        setTimeout(() => {
            if (container.contains(toast)) {
                toast.classList.add('translate-x-full');
                setTimeout(() => {
                    if (container.contains(toast)) container.removeChild(toast);
                }, 300);
            }
        }, 3000);
    };

    // Update line numbers in the editor
    const updateLineNumbers = () => {
        if (!document.getElementById('show-line-numbers').checked) {
            document.getElementById('input-line-numbers').classList.add('hidden');
            document.getElementById('input').classList.remove('pl-10');
            return;
        }

        const input = document.getElementById('input');
        const lineNumbersDiv = document.getElementById('input-line-numbers');

        input.classList.add('pl-10');
        lineNumbersDiv.classList.remove('hidden');

        const linesCount = (input.value.match(/\n/g) || []).length + 1;
        let html = '';

        for (let i = 1; i <= linesCount; i++) {
            html += i + '<br>';
        }

        lineNumbersDiv.innerHTML = html;
    };

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize theme
        initTheme();

        // Load saved code if available
        if (localStorage.getItem('phpMinifierCode')) {
            document.getElementById('input').value = localStorage.getItem('phpMinifierCode');
            if (document.getElementById('live-preview').checked) {
                updateOutput();
            }
            updateLineNumbers();
        }

        // Show a welcome toast
        setTimeout(() => {
            showToast('Welcome to PHP Code Minifier! Paste your code and press Minify.', 'info');
        }, 500);
    });

    // Theme toggle - Fixed implementation
    document.getElementById('theme-toggle').addEventListener('click', () => {
        if (document.documentElement.classList.contains('dark')) {
            localStorage.setItem('theme', 'light');
            setTheme('light');
            showToast('Light mode activated', 'info');
        } else {
            localStorage.setItem('theme', 'dark');
            setTheme('dark');
            showToast('Dark mode activated', 'info');
        }
    });

    // Settings panel toggle
    document.getElementById('settings-toggle').addEventListener('click', () => {
        document.getElementById('settings-panel').classList.toggle('hidden');
    });

    // Minify button
    document.getElementById('minify-btn').addEventListener('click', updateOutput);

    // Copy button
    document.getElementById('copy-btn').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(document.getElementById('output').textContent);
            showToast('Copied to clipboard!', 'success');
        } catch (err) {
            showToast('Failed to copy: ' + err.message, 'error');
        }
    });

    // Download button
    document.getElementById('download-btn').addEventListener('click', () => {
        const output = document.getElementById('output').textContent;
        if (!output) return;

        const blob = new Blob([output], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'minified-code.php';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('File downloaded!', 'success');
    });

    // Clear button
    document.getElementById('clear-btn').addEventListener('click', () => {
        document.getElementById('input').value = '';
        document.getElementById('output').textContent = '';
        document.getElementById('stats').textContent = '';
        document.getElementById('copy-btn').classList.add('hidden');
        document.getElementById('download-btn').classList.add('hidden');

        if (document.getElementById('auto-save').checked) {
            localStorage.removeItem('phpMinifierCode');
        }

        showToast('Code cleared!', 'info');
        updateLineNumbers();
    });

    // File upload
    document.getElementById('upload-btn').addEventListener('click', () => {
        document.getElementById('file-upload').click();
    });

    document.getElementById('file-upload').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('input').value = e.target.result;
            if (document.getElementById('live-preview').checked) {
                updateOutput();
            }
            updateLineNumbers();
            showToast(`File "${file.name}" loaded!`, 'success');
        };
        reader.onerror = () => {
            showToast('Error reading file!', 'error');
        };
        reader.readAsText(file);
    });

    // Input event handling
    document.getElementById('input').addEventListener('input', () => {
        if (document.getElementById('live-preview').checked) {
            updateOutput();
        }

        if (document.getElementById('auto-save').checked) {
            localStorage.setItem('phpMinifierCode', document.getElementById('input').value);
        }

        updateLineNumbers();
    });

    // Line numbers toggle
    document.getElementById('show-line-numbers').addEventListener('change', updateLineNumbers);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        // Ctrl+Enter to minify
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            updateOutput();
        }

        // Ctrl+S to save
        if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
            if (document.getElementById('output').textContent) {
                document.getElementById('download-btn').click();
            }
        }
    });
</script>
<script src="../logo.js"></script>
</body>
</html>
