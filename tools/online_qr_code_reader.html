<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Reader – Scan from Camera, Image or Screenshot, Online</title>
<link rel="canonical" href="https://www.gptgames.dev/tools/online_qr_code_reader.html">
<meta name="description" content="Read QR codes and barcodes from your camera, an uploaded image or a pasted screenshot. Shows where a link really goes, Wi-Fi passwords, contacts and payments. Nothing is uploaded.">
<meta name="theme-color" content="#f4f3ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f3ef; --card:#fff; --ink:#121212; --ink2:#3a3a37; --muted:#63635d; --line:#dcdad3; --line2:#c4c2ba;
  --found:#0a7f44; --found-bg:#e5f3ea; --caution:#7d5200; --caution-bg:#fbf0d9; --danger:#b3261e; --danger-bg:#fbe8e6;
  --info-bg:#efeee9; --focus:#1f5fd6;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#111211; --card:#1b1c1a; --ink:#ecebe6; --ink2:#cfcec8; --muted:#a3a29b; --line:#30312e; --line2:#474843;
  --found:#46d18c; --found-bg:#142a1e; --caution:#ecb54e; --caution-bg:#2c2313; --danger:#ff8f85; --danger-bg:#361b19;
  --info-bg:#252623; --focus:#7aa7ff; color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
code,pre,.mono,.pw,.real,.path,.textbody,.spellout b,.h-text{font-variant-numeric:slashed-zero}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--sans)}
button{font:inherit;color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em}
.priv{font-size:13px;color:var(--muted);margin:0;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* sources */
.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.src{appearance:none;border:1.5px solid var(--ink);background:var(--card);font-weight:500;font-size:15px;
  min-height:48px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 8px}
@media (hover:hover){.src:hover{background:var(--info-bg)}.mini:hover{background:var(--info-bg)}.btn:hover{filter:brightness(.94)}}
.src svg{flex:none}
.src[aria-pressed=true]{background:var(--ink);color:var(--card)}

/* stage: the picture that was read */
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;aspect-ratio:4/3;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.stage.none{aspect-ratio:auto;height:72px}
.stage.drag{outline:3px dashed var(--focus);outline-offset:-8px}
.shot{position:relative;line-height:0}
.shot canvas{display:block;image-rendering:auto}
.shot video{display:block}
.stage.live .shot{max-width:100%;max-height:100%;width:100%;height:100%}
.stage.live video{width:100%;height:100%;object-fit:cover;max-height:none}
.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.overlay polygon{fill:none;stroke:var(--found);stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:trace .45s ease-out forwards}
.overlay polygon.danger{stroke:var(--danger)} .overlay polygon.caution{stroke:var(--caution)}
.overlay polygon.dim{opacity:.45}
.overlay text{font:600 13px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central}
.overlay circle{fill:var(--found)} .overlay circle.danger{fill:var(--danger)} .overlay circle.caution{fill:var(--caution)}
@keyframes trace{to{stroke-dashoffset:0}}
.reticle{position:absolute;inset:14%;pointer-events:none}
.reticle i{position:absolute;width:28px;height:28px;border:3px solid #fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}.reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}.reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.camctl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.camctl button{appearance:none;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:13px;font-weight:500;min-height:36px;padding:0 10px;border-radius:4px;cursor:pointer}
.busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--card) 60%,transparent)}
.stage.working .busy{display:flex}
.busy span{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:4px;font-size:14px;line-height:1}
.busy span::before{content:'';width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blank{color:var(--muted);font-size:14px;text-align:center;padding:20px;line-height:1.5}
.caption{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:7px 2px 0;min-height:19px}
.caption .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caption .keys{white-space:nowrap}
kbd{font:500 12px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--card);color:var(--ink2)}

/* result */
.result{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 18px 14px}
.result:focus{outline:none}
.flash{animation:flash .6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--found)}to{box-shadow:0 0 0 3px transparent}}
.result.v-danger.flash{animation-name:flashd}
@keyframes flashd{from{box-shadow:0 0 0 3px var(--danger)}to{box-shadow:0 0 0 3px transparent}}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.chip i{width:10px;height:10px;background:var(--found);border-radius:1px}
.chip.danger{color:var(--danger)} .chip.danger i{background:var(--danger)}
.chip.caution{color:var(--caution)} .chip.caution i{background:var(--caution)}
.chip.none i{background:var(--line2)}
.picker{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
.picker button{appearance:none;border:1px solid var(--line2);background:transparent;font-weight:600;font-size:13px;min-height:34px;padding:0 10px;border-radius:3px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.lede{margin:0;font-size:15px;color:var(--muted)}
.big{font:600 26px/1.22 var(--sans);margin:2px 0 6px;overflow-wrap:anywhere;letter-spacing:-.01em}
.big .sub{color:var(--muted);font-weight:400}
.big.danger{color:var(--danger)}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.titlerow .big{flex:1}
.real b{font-weight:700;font-size:17px}
.real{font:500 15px/1.5 var(--mono);overflow-wrap:anywhere;margin:0 0 6px}
.path{font:400 14px/1.45 var(--mono);color:var(--ink2);overflow-wrap:anywhere;margin:0 0 10px}
.textbody{font:400 18px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:break-word;margin:2px 0 10px;max-height:16.5em;overflow:auto}
.warn{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}
.warn li{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:3px;font-size:14.5px;line-height:1.4;background:var(--info-bg);color:var(--ink2)}
.warn li svg{flex:none;margin-top:2px}
.warn .danger{background:var(--danger-bg);color:var(--danger)} .warn .caution{background:var(--caution-bg);color:var(--caution)}
.warn .ok{background:var(--found-bg);color:var(--found)}
dl.fields{margin:6px 0 4px;display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:14px}
dl.fields>div{display:contents}
dl.fields dt,dl.fields dd{padding:10px 0;border-top:1px solid var(--line);margin:0}
dl.fields dt{color:var(--muted);font-size:14px;line-height:1.6}
dl.fields dd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0}
dl.fields dd .v{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
dl.fields dd .v.mono{font:500 17px/1.45 var(--mono);letter-spacing:.02em;overflow-wrap:break-word}
dl.fields a{color:inherit}
.grp{white-space:nowrap}
.pw{display:block;font:500 19px/1.45 var(--mono);letter-spacing:.04em;overflow-wrap:anywhere}
.pw b{font-weight:500;background:var(--info-bg);box-shadow:inset 0 -2px 0 var(--line2);border-radius:2px;padding:0 1px}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.spellout summary{font-size:13px;min-height:32px;margin-top:4px}
.spellout ol{list-style:none;margin:4px 0 2px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;counter-reset:c}
.spellout li{counter-increment:c;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:3px;padding:4px 2px 5px;position:relative}
.spellout li::before{content:counter(c);position:absolute;left:4px;top:2px;font-size:9.5px;color:var(--muted)}
.spellout li b{font:500 20px/1.3 var(--mono)}
.spellout li small{font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.legend code{font:500 14px var(--mono);color:var(--ink)}
.mini{appearance:none;flex:none;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:500;min-height:32px;padding:0 10px;border-radius:3px;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--card);font-size:15px;font-weight:500;min-height:46px;padding:0 18px;border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--card)}
.textlink{appearance:none;border:0;background:none;padding:6px 4px;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.textlink.armed{color:var(--danger);font-weight:600}
details.raw{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
details summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:7px;min-height:28px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'';width:0;height:0;border:5px solid transparent;border-left-color:currentColor;border-right-width:0;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
pre.rawtext{font:400 13px/1.5 var(--mono);background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:10px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
.rawbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tips{margin:4px 0 14px;padding-left:20px;color:var(--ink2)} .tips li{margin:5px 0}
.example-note{font-size:13px;color:var(--muted);margin:12px 0 0}
.status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* history */
.history{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 16px}
.history summary{color:var(--ink);font-weight:500;font-size:15px;min-height:44px}
.history ol{list-style:none;margin:0 0 8px;padding:0}
.history li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border-top:1px solid var(--line);padding:8px 0;align-items:center}
.history .h-text{font:500 15px/1.4 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;min-width:0}
.history .h-text:hover{text-decoration:underline}
.history .h-meta{grid-column:1;font-size:12px;color:var(--muted)}
.history .h-del{grid-row:1/3;grid-column:2}
.history .h-meta.bad{color:var(--danger);font-weight:600}
.x{appearance:none;border:0;background:none;width:40px;height:40px;border-radius:3px;font-size:22px;line-height:1;color:var(--muted);cursor:pointer}
@media (hover:hover){.x:hover{background:var(--info-bg);color:var(--ink)}}
.history .h-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.history .empty{font-size:14px;color:var(--muted);padding:4px 0 12px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:4px;font-size:14px;pointer-events:none;transition:opacity .15s,transform .15s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dropcover{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 80%,transparent);display:none;align-items:center;justify-content:center;z-index:30;font-size:20px;font-weight:600;border:4px dashed var(--focus)}
body.dragging .dropcover{display:flex}
input[type=file]{display:none}

@media (max-width:760px){
  .wrap{padding:12px 16px 56px}
  header{margin-bottom:10px}
  h1{font-size:20px}
  .grid{grid-template-columns:1fr;gap:10px}
  .stage{aspect-ratio:auto;height:min(36vh,280px)}
  .stage.live{height:min(62vh,460px)}
  .stage.compact{height:132px}
  .stage.example{height:172px}
  .caption .keys{display:none}
  .result{min-height:0;padding:15px 14px 12px}
  .big{font-size:22px}
  .btn{flex:1 1 auto}
  dl.fields{grid-template-columns:1fr}
  dl.fields dt{padding:9px 0 0;line-height:1.3;font-size:13px}
  dl.fields dd{border-top:0;padding:2px 0 9px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
  .overlay polygon{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QR Code Reader</h1>
    <p class="priv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Read on your device. Images never leave it.</p>
  </header>
  <main class="grid">
    <section aria-label="Code to read">
      <div class="sources">
        <button class="src" id="btnCam" type="button" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8V5h3M21 8V5h-3M3 16v3h3M21 16v3h-3"/><circle cx="12" cy="12" r="3.2"/></svg><span>Camera</span></button>
        <button class="src" id="btnFile" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9" r="1.6"/></svg>Image</button>
        <button class="src" id="btnPaste" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="1"/><path d="M9 4V2.8h6V4"/></svg>Paste</button>
        <input type="file" id="file" accept="image/*" aria-label="Choose an image with a QR code">
      </div>
      <div class="stage" id="stage">
        <div class="shot" id="shot"></div>
        <div class="busy" aria-hidden="true"><span>Reading…</span></div>
      </div>
      <p class="caption"><span class="name" id="caption"></span><span class="keys">Drop an image or <kbd>Ctrl</kbd>+<kbd>V</kbd></span></p>
    </section>
    <section class="result" id="result" tabindex="-1" aria-label="What the code contains"></section>
  </main>
  <details class="history" id="history">
    <summary>Recent scans <span id="histCount"></span></summary>
    <div id="histBody"></div>
  </details>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dropcover" aria-hidden="true">Drop the image to read it</div>

<script id="core">
/* QR payload core: what a decoded string means, and whether it is safe to act on. DOM-free.
   Formats follow their published definitions: WIFI: (Wi-Fi Alliance WPA3 spec, URI format; ZXing
   wiki "Barcode Contents"), vCard (RFC 6350, plus 2.1 QUOTED-PRINTABLE), MECARD / MATMSG (NTT
   docomo), mailto (RFC 6068), tel (RFC 3966), geo (RFC 5870), iCalendar VEVENT (RFC 5545),
   otpauth (Google Authenticator key URI format), EPC QR / "Girocode" (EPC069-12), Swiss QR-bill
   (SIX Implementation Guidelines 2.x), BIP 21 bitcoin URIs, IBAN check (ISO 13616 / ISO 7064
   MOD 97-10), Punycode (RFC 3492). Exposes module.exports when loaded as a classic script. */
(function (root) {
  'use strict';

  // ---------- small helpers ----------
  const trimEnd = s => s.replace(/[\r\n]+$/, '');
  function pctDecode(s) {
    try { return decodeURIComponent(s.replace(/\+/g, '%20')); }
    catch (e) { return s; }
  }
  function pctDecodeStrict(s) { // for mailto: '+' is literal per RFC 6068
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }
  function queryPairs(q) {
    const out = [];
    if (!q) return out;
    for (const part of q.split('&')) {
      if (!part) continue;
      const i = part.indexOf('=');
      const k = i < 0 ? part : part.slice(0, i);
      const v = i < 0 ? '' : part.slice(i + 1);
      out.push([pctDecodeStrict(k).toLowerCase(), v]);
    }
    return out;
  }

  // Split "K:v;K:v;;" with backslash escapes (WIFI:, MECARD:, MATMSG:).
  function splitEscapedFields(body) {
    const fields = [];
    let key = null, buf = '', i = 0;
    while (i < body.length) {
      const c = body[i];
      if (c === '\\' && i + 1 < body.length) { buf += body[i + 1]; i += 2; continue; }
      if (key === null && c === ':') { key = buf; buf = ''; i++; continue; }
      if (c === ';') {
        if (key !== null) fields.push([key.trim().toUpperCase(), buf]);
        else if (buf.trim()) fields.push(['', buf]);
        key = null; buf = ''; i++; continue;
      }
      buf += c; i++;
    }
    if (key !== null) fields.push([key.trim().toUpperCase(), buf]);
    return fields;
  }
  const unquote = s => (s.length >= 2 && s[0] === '"' && s[s.length - 1] === '"') ? s.slice(1, -1) : s;

  // ---------- Punycode (RFC 3492) ----------
  function punyDecode(input) {
    const base = 36, tMin = 1, tMax = 26, skew = 38, damp = 700;
    let n = 128, i = 0, bias = 72;
    const out = [];
    let b = input.lastIndexOf('-');
    if (b < 0) b = 0;
    for (let j = 0; j < b; j++) {
      if (input.charCodeAt(j) >= 0x80) throw new Error('bad input');
      out.push(input.charCodeAt(j));
    }
    const adapt = (delta, numPoints, first) => {
      let k = 0;
      delta = first ? Math.floor(delta / damp) : delta >> 1;
      delta += Math.floor(delta / numPoints);
      for (; delta > ((base - tMin) * tMax) >> 1; k += base) delta = Math.floor(delta / (base - tMin));
      return Math.floor(k + (base - tMin + 1) * delta / (delta + skew));
    };
    const digit = cp => cp - 48 < 10 ? cp - 22 : cp - 65 < 26 ? cp - 65 : cp - 97 < 26 ? cp - 97 : base;
    for (let idx = b > 0 ? b + 1 : 0; idx < input.length;) {
      const oldi = i;
      for (let w = 1, k = base; ; k += base) {
        if (idx >= input.length) throw new Error('bad input');
        const d = digit(input.charCodeAt(idx++));
        if (d >= base) throw new Error('bad input');
        i += d * w;
        const t = k <= bias ? tMin : (k >= bias + tMax ? tMax : k - bias);
        if (d < t) break;
        w *= base - t;
      }
      const len = out.length + 1;
      bias = adapt(i - oldi, len, oldi === 0);
      n += Math.floor(i / len);
      i %= len;
      out.splice(i++, 0, n);
    }
    return String.fromCodePoint(...out);
  }
  function hostToUnicode(host) {
    return host.split('.').map(l => {
      if (/^xn--/i.test(l)) { try { return punyDecode(l.slice(4).toLowerCase()); } catch (e) { return l; } }
      return l;
    }).join('.');
  }

  // Which writing systems a label uses (enough to spot Latin mixed with look-alikes).
  function scripts(s) {
    const set = new Set();
    for (const ch of s) {
      const cp = ch.codePointAt(0);

  // ---------- main entry ----------
  // parse(text, {format}) -> { kind, label, title, fields, actions, warnings }

  function parse(text, opt) {

    const t = raw.trim();
    const r = { kind: 'text', label: 'Text', title: '', fields: [], actions: [], warnings: [] };
    if (!t) {
      r.kind = 'empty'; r.label = raw.length ? 'Blank' : 'Empty';
      r.warnings.push({ level: 'info', text: raw.length ? `The code holds only ${raw.length} blank character${raw.length > 1 ? 's' : ''}.` : 'The code was read but holds no data.' });

    }
    const copyAll = { kind: 'copy', label: 'Copy text', value: raw };

      const isbn = /^97[89]/.test(t) && t.length === 13;

    }

    const w = parseWifi(t);
    if (w) {
      r.kind = 'wifi'; r.label = 'Wi-Fi network'; r.title = w.ssid || '(no name)';
      r.fields.push(F('Network', w.ssid, { mono: true }));
      if (w.password) r.fields.push(F('Password', w.password, { mono: true }));
      r.fields.push(F('Security', w.security));
      if (w.hidden) r.fields.push(F('Hidden', 'Yes. Add it by name in Wi-Fi settings.'));
      if (w.eap) r.fields.push(F('EAP method', w.eap));
      if (w.identity) r.fields.push(F('Identity', w.identity, { mono: true }));
      if (w.anonymous) r.fields.push(F('Anonymous identity', w.anonymous, { mono: true }));
      if (w.phase2) r.fields.push(F('Phase 2', w.phase2));

      if (contact.name) r.fields.push(F('Name', contact.name));

      for (const a of contact.addresses) r.fields.push(F('Address' + (a.label ? ` (${a.label})` : ''), a.value));

      if (contact.note) r.fields.push(F('Note', contact.note));
      const fname = (contact.name || 'contact').replace(/[^\p{L}\p{N} ._-]+/gu, '').replace(/^[ .]+/, '').trim().replace(/\s+/g, '_') || 'contact';

    const ev = parseEvent(t);

      r.kind = 'event'; r.label = 'Calendar event'; r.title = ev.summary || '(untitled event)';

      if (ev.description) r.fields.push(F('Details', ev.description));

      r.actions.push({ kind: 'copy', label: 'Copy link', value: raw, primary: true });
      r.actions.push({ kind: 'open', label: 'Try to open', href: t });
      return r;
    }

    r.actions.push(Object.assign({}, copyAll, { primary: true }));

  }

        source: ['camera', 'image', 'paste'].includes(e.source) ? e.source : 'image' });

    else if (p.kind === 'payment') { const to = (p.fields.find(f => f.label === 'Pay to') || {}).value; line = [to, p.title].filter(Boolean).join(' · '); }

const $ = id => document.getElementById(id);
const stage = $('stage'), shot = $('shot'), result = $('result'), caption = $('caption');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);

// ---------- decoder: zxing-wasm in a worker; the browser's BarcodeDetector as a fallback ----------
let worker = null, workerFailed = false, seq = 0;
const pending = new Map();
function startWorker() {
  if (worker || workerFailed) return;

    let ready = null;
    function load() {
      if (!ready) ready = new Promise((ok, bad) => {
        try {
          importScripts('${ZXING}iife/reader/index.js');
          ZXingWASM.prepareZXingModule({ overrides: { locateFile: (p, pre) => p.endsWith('.wasm') ? '${ZXING}reader/' + p : pre + p }, fireImmediately: true }).then(ok, bad);
        } catch (e) { bad(e); }
      });
      return ready;
    }
    onmessage = async ev => {
      const { id, image, warm } = ev.data;
      try {
        await load();
        if (warm) { postMessage({ id, ok: true, results: [] }); return; }
        const rs = await ZXingWASM.readBarcodes(image, ${JSON.stringify(READER_OPTIONS)});
        postMessage({ id, ok: true, results: rs.filter(r => r.isValid).map(r => ({ text: r.text, bytes: r.bytes, format: r.format,
          position: r.position, version: r.version, ecLevel: r.ecLevel, isInverted: r.isInverted, isMirrored: r.isMirrored,
          sequenceSize: r.sequenceSize, sequenceIndex: r.sequenceIndex, contentType: r.contentType })) });
      } catch (e) { postMessage({ id, ok: false, error: String(e && e.message || e) }); }
    };`;
  try {
    worker = new Worker(URL.createObjectURL(new Blob([code], {type: 'text/javascript'})));
    worker.onmessage = ev => { const p = pending.get(ev.data.id); if (p) { pending.delete(ev.data.id); p(ev.data); } };
    worker.onerror = () => { workerFailed = true; for (const p of pending.values()) p({ok: false, error: 'worker'}); pending.clear(); };
  } catch (e) { workerFailed = true; }
}
function askWorker(msg, transfer) {

}
async function nativeDetect(imageData) {
  if (!('BarcodeDetector' in window)) return null;

    const det = new BarcodeDetector();
    const bmp = await createImageBitmap(imageData);
    const found = await det.detect(bmp);

}
async function decode(imageData) {
  const copy = new ImageData(new Uint8ClampedArray(imageData.data), imageData.width, imageData.height);
  const r = await askWorker({image: copy}, [copy.data.buffer]);
  if (r.ok) return {results: r.results};
  const nat = await nativeDetect(imageData);
  if (nat) return {results: nat, fallback: true};
  return {error: 'The decoder could not load. Check your connection and try again; once loaded it works offline.'};
}

// ---------- state ----------
let current = null;      // {canvas, label, source, results, sel, example}
let camera = null;       // {stream, video, timer, devices, deviceIndex, track}
let job = 0;
const say = t => { $('status').textContent = ''; setTimeout(() => { $('status').textContent = t; }, 30); };
let toastTimer;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800); }

// ---------- images in ----------
const MAX_SIDE = 2400;
async function imageFromBlob(blob) {
  let bmp;
  try { bmp = await createImageBitmap(blob); }
  catch (e) {
    const url = URL.createObjectURL(blob);
    try {
      bmp = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = url; });
    } catch (e2) { bmp = null; } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  }
  if (!bmp) return null;
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  if (!w || !h) return null;
  const k = Math.min(1, MAX_SIDE / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  const g = cv.getContext('2d', {willReadFrequently: true});
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); // transparent PNGs: codes drawn on nothing read as dark-on-white
  g.imageSmoothingQuality = 'high';
  g.drawImage(bmp, 0, 0, cv.width, cv.height);
  if (bmp.close) bmp.close();
  return {canvas: cv, origW: w, origH: h};
}
function isHeic(f) { return /hei[cf]$/i.test(f.type || '') || /\.(heic|heif)$/i.test(f.name || ''); }

async function readBlob(blob, label, source) {
  stopCamera();
  const my = ++job;
  setWorking(true);
  if (blob.type && !/^image\//.test(blob.type)) { setWorking(false); return showFailure({title: 'That file is not an image', tips: ['Choose a photo or screenshot (PNG, JPEG, WebP, GIF, BMP or SVG).'], label}); }
  const img = await imageFromBlob(blob);
  if (my !== job) return;
  if (!img) {
    setWorking(false);
    return showFailure(isHeic(blob)
      ? {title: 'This browser cannot open HEIC photos', tips: ['Take a screenshot of the photo and paste or choose that instead.', 'Or export it as JPEG first (Share → Save as JPEG / Options → Most compatible).'], label}
      : {title: 'That image could not be opened', tips: ['The file may be damaged or in a format this browser does not support.', 'Take a screenshot of it and paste that instead.'], label});
  }
  const g = img.canvas.getContext('2d', {willReadFrequently: true});
  const out = await decode(g.getImageData(0, 0, img.canvas.width, img.canvas.height));
  if (my !== job) return;

}
function setWorking(on) { stage.classList.toggle('working', on); result.setAttribute('aria-busy', on ? 'true' : 'false'); }

// ---------- camera ----------
async function startCamera(deviceId) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return showFailure({title: 'This browser cannot use the camera here', tips: ['Use Image to take a photo with your camera app instead.', 'The camera only works on https pages.'], label: 'Camera'});
  }
  stopCamera(true);
  ++job;
  const btn = $('btnCam');
  btn.setAttribute('aria-pressed', 'true'); btn.querySelector('span').textContent = 'Stop';
  stage.classList.remove('compact', 'none', 'example'); stage.classList.add('live');
  shot.innerHTML = '<div class="blank">Starting camera…</div>';
  caption.textContent = 'Camera';
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: false, video: deviceId ? {deviceId: {exact: deviceId}} : {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}});
  } catch (e) {
    resetCamButton(); stage.classList.remove('live');
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    const none = e && (e.name === 'NotFoundError' || e.name === 'OverconstrainedError');
    return showFailure({title: denied ? 'Camera access was blocked' : none ? 'No camera found' : 'The camera could not start',
      tips: denied ? ['Allow the camera in your browser’s site settings (the icon left of the address), then press Camera again.', 'Or use Image to take a photo with your camera app.']
        : ['Use Image to choose a photo or screenshot instead.'], label: 'Camera'});
  }
  const video = document.createElement('video');
  video.setAttribute('playsinline', ''); video.muted = true; video.srcObject = stream;
  video.setAttribute('aria-label', 'Camera view');
  shot.innerHTML = ''; shot.appendChild(video);
  const ret = document.createElement('div'); ret.className = 'reticle'; ret.innerHTML = '<i></i><i></i><i></i><i></i>'; shot.appendChild(ret);
  const track = stream.getVideoTracks()[0];
  camera = {stream, video, track, busy: false, timer: 0, cv: document.createElement('canvas')};
  try { await video.play(); } catch (e) { /* autoplay */ }
  // controls: switch camera, torch
  const ctl = document.createElement('div'); ctl.className = 'camctl';
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    if (devs.length > 1) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Switch camera';
      b.onclick = () => { const cur = track.getSettings().deviceId; const i = devs.findIndex(d => d.deviceId === cur); startCamera(devs[(i + 1) % devs.length].deviceId); };
      ctl.appendChild(b);
    }
  } catch (e) { /* no list */ }
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.torch) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Light'; b.setAttribute('aria-pressed', 'false');
    b.onclick = async () => { const on = b.getAttribute('aria-pressed') !== 'true'; try { await track.applyConstraints({advanced: [{torch: on}]}); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Light off' : 'Light'; } catch (e) { /* unsupported */ } };
    ctl.appendChild(b);
  }
  if (ctl.children.length) stage.appendChild(ctl);
  camera.ctl = ctl;
  if (!current || current.example) renderWaiting();
  say('Camera on. Point it at a QR code.');
  scanLoop();
}
function scanLoop() {
  if (!camera) return;
  const cam = camera;
  cam.timer = setTimeout(async () => {
    if (camera !== cam) return;
    const v = cam.video;
    if (v.readyState >= 2 && v.videoWidth) {
      const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
      const cv = cam.cv; cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
      const g = cv.getContext('2d', {willReadFrequently: true});
      g.drawImage(v, 0, 0, cv.width, cv.height);
      const out = await decode(g.getImageData(0, 0, cv.width, cv.height));
      if (camera !== cam) return;
      if (out.results && out.results.length) {
        const keep = document.createElement('canvas'); keep.width = cv.width; keep.height = cv.height;
        keep.getContext('2d').drawImage(cv, 0, 0);
        if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) { /* ignore */ }

        showImage(keep, 'Camera', 'camera', out);

}
function resetCamButton() { const btn = $('btnCam'); btn.setAttribute('aria-pressed', 'false'); btn.querySelector('span').textContent = 'Camera'; }
function stopCamera(keepView) {
  if (!camera) return;
  clearTimeout(camera.timer);
  camera.stream.getTracks().forEach(t => t.stop());
  if (camera.ctl) camera.ctl.remove();
  camera = null;
  resetCamButton();
  stage.classList.remove('live');
  if (!keepView && current) drawStage(); else if (!keepView) { shot.innerHTML = ''; }
}

// ---------- show ----------
function showImage(canvas, label, source, out) {
  if (out.error) { current = {canvas, label, source, results: [], example: false}; drawStage(); return showFailure({title: 'The decoder could not load', tips: [out.error], label, keepImage: true}); }
  const rs = out.results.map(r => Object.assign(r, {parsed: C.parse(r.text, {format: r.format})}));
  // reading order: top to bottom, left to right
  const top = r => Math.min(r.position.topLeft.y, r.position.topRight.y), left = r => Math.min(r.position.topLeft.x, r.position.bottomLeft.x);
  const hgt = r => Math.abs(r.position.bottomLeft.y - r.position.topLeft.y) || 1;
  rs.sort((a, b) => Math.abs(top(a) - top(b)) < Math.min(hgt(a), hgt(b)) / 2 ? left(a) - left(b) : top(a) - top(b));
  current = {canvas, label, source, results: rs, sel: 0, example: false};
  drawStage();
  if (!rs.length) {
    return showFailure({title: 'No QR code or barcode found', tips: ['Crop or zoom so the code fills more of the picture.', 'Use a sharper photo: hold steady, avoid glare and reflections.', 'The whole code, with its quiet white border, must be in the picture.'], label, keepImage: true,
      note: 'Looked for QR, Micro QR, Data Matrix, Aztec, PDF417 and product barcodes, upright, rotated and in inverted colours.'});
  }
  for (const r of rs) saveHistory(r.text, r.format, source);
  renderResult(true);
}
function verdictOf(p) { return p.verdict || (p.warnings.some(w => w.level === 'danger') ? 'danger' : p.warnings.some(w => w.level === 'caution') ? 'caution' : 'ok'); }
function isPhone() { return matchMedia('(max-width:760px)').matches; }
function drawStage() {
  shot.innerHTML = '';
  stage.classList.remove('none');
  if (!current || !current.canvas) return;
  const src = current.canvas;
  const compact = !current.example && current.results.length > 0 && isPhone();
  stage.classList.toggle('compact', compact);
  stage.classList.toggle('example', !!current.example);
  caption.textContent = current.example ? 'Example' : current.label;
  // On a phone, once read, show only the part of the picture around the codes.
  let vx = 0, vy = 0, vw = src.width, vh = src.height;
  if (current.results.length && !current.example) {
    const xs = [], ys = [];
    for (const r of current.results) for (const k of ['topLeft', 'topRight', 'bottomRight', 'bottomLeft']) { xs.push(r.position[k].x); ys.push(r.position[k].y); }
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const pad = Math.max(x1 - x0, y1 - y0) * (compact ? 0.12 : 0.45) + 6;
    vx = Math.max(0, x0 - pad); vy = Math.max(0, y0 - pad);

  }
  const cv = document.createElement('canvas');
  cv.width = Math.round(vw); cv.height = Math.round(vh);
  cv.getContext('2d').drawImage(src, vx, vy, vw, vh, 0, 0, cv.width, cv.height);
  cv.setAttribute('role', 'img');
  cv.setAttribute('aria-label', current.example ? 'Example QR code' : 'The image that was read');
  shot.appendChild(cv);
  const k = fitStage();
  if (!current.results.length) return;
  const W = cv.width, H = cv.height;
  let svg = `<svg class="overlay" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  current.results.forEach((r, i) => {
    const p = r.position, pts = [p.topLeft, p.topRight, p.bottomRight, p.bottomLeft].map(q => ({x: q.x - vx, y: q.y - vy}));
    const v = verdictOf(r.parsed);
    const cls = (v === 'ok' ? '' : v) + (current.results.length > 1 && i !== current.sel ? ' dim' : '');
    svg += `<polygon class="${cls}" pathLength="100" stroke-width="${(3.5 / k).toFixed(2)}" points="${pts.map(q => q.x.toFixed(1) + ',' + q.y.toFixed(1)).join(' ')}"/>`;
    if (current.results.length > 1) {
      const rad = 11 / k; // the same size on screen at any zoom
      svg += `<circle class="${v === 'ok' ? '' : v}" cx="${pts[0].x}" cy="${pts[0].y}" r="${rad}"/><text x="${pts[0].x}" y="${pts[0].y}" style="font-size:${rad * 1.1}px">${i + 1}</text>`;
    }
  });

}
// Canvas sizes itself to the stage, keeping its aspect ratio.
function fitStage() {
  const cv = shot.querySelector('canvas'); if (!cv) return;
  const pad = stage.classList.contains('compact') ? 20 : 36;
  const k = Math.min((stage.clientWidth - pad) / cv.width, (stage.clientHeight - pad) / cv.height, stage.classList.contains('compact') ? 4 : 3);
  cv.style.width = Math.floor(cv.width * k) + 'px'; cv.style.height = Math.floor(cv.height * k) + 'px';

const ICON = {

  caution: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  ext: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>'
};

}
function fieldHtml(f, primaryCopy) {
  let v;
  if (f.label === 'Password' || f.secret) {
    v = `<span class="v">${spellBlock(f.value, true, current && current.example)}</span>`;
    if (f.secret) v = `<span class="v"><button class="mini" type="button" data-reveal>Show secret</button><span class="pw mono" hidden>${esc(f.value)}</span></span>`;
  } else if (f.url && f.url.openable) {
    v = `<span class="v">${esc(f.value)}<br><small class="lede">opens ${esc(f.url.registrable)}</small></span>`;
  } else if (f.href) {
    v = `<span class="v${f.mono ? ' mono' : ''}"><a href="${esc(f.href)}">${esc(f.value)}</a></span>`;
  } else if (f.label === 'IBAN') {
    v = `<span class="v mono">${f.value.split(' ').map(g => `<span class="grp">${esc(g)}</span>`).join(' ')}</span>`;
  } else v = `<span class="v${f.mono ? ' mono' : ''}">${esc(f.value)}</span>`;

  const showCopy = (f.mono || /^(Password|Pay to|Payment note|Message|Email|Address)/.test(f.label)) && !f.secret;
  return `<div><dt>${esc(f.label)}</dt><dd>${v}${showCopy ? copyBtn(cp, 'Copy ' + f.label) : ''}</dd></div>`;

function renderResult(fresh) {

    } else {

      h += `<p class="lede">This link opens</p><p class="big"><span class="sub">${esc(u.sub)}</span>${esc(u.registrable)}</p>`;
      if (u.path) h += `<p class="path">${esc(u.path.length > 300 ? u.path.slice(0, 300) + '…' : u.path)}</p>`;
    }
  } else if (p.kind === 'text' || p.kind === 'uri') {
    h += `<p class="chip ${v === 'ok' ? '' : v}"><i></i>${esc(p.label)}${cur.example ? ' · example' : ''}</p>`;
    h += `<div class="textbody">${esc(C.revealInvisible(r.text))}</div>`;
    if ([...r.text].length <= 64 && C.spellOut(r.text).some(c => c.name && c.ch !== ' ')) h += spellBlock(r.text, false);
  } else if (p.kind === 'empty') {
    h += `<p class="chip none"><i></i>${esc(p.label)}</p><p class="big">Nothing in it</p>`;
  } else {
    h += `<p class="chip ${v === 'ok' ? '' : v}"><i></i>${esc(p.label)}${cur.example ? ' · example' : ''}</p>`;
    const titleCopy = p.kind === 'wifi' && primaryCopy !== p.title ? copyBtn(p.title, 'Copy network name') : '';
    h += `<div class="titlerow"><p class="big">${esc(p.title)}</p>${titleCopy}</div>`;
  }
  if (C.hasInvisible(r.text)) ws = ws.concat([{level: 'caution', text: 'Contains invisible characters (shown as ⟨U+…⟩). They can hide a different address or text.'}]);
  h += warnList(ws);
  const fields = p.fields.filter(f => !(p.kind === 'wifi' && f.label === 'Network') && !(p.kind === 'contact' && f.label === 'Name' && f.value === p.title));
  if (fields.length) h += `<dl class="fields">${fields.map(f => fieldHtml(f, primaryCopy)).join('')}</dl>`;
  // actions
  const acts = p.actions.map((a, i) => {
    if (p.kind === 'wifi' && !a.primary) return '';
    if (a.kind === 'open' && v === 'danger') return `<button class="textlink" type="button" data-arm="${esc(a.href)}">Open anyway…</button>`;
    const cls = 'btn' + (a.primary ? ' primary' : '');
    if (a.kind === 'open') return `<a class="${cls}" href="${esc(a.href)}"${a.external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${esc(a.label)}${a.external ? ICON.ext : ''}</a>`;
    if (a.kind === 'copy') return `<button class="${cls}" type="button" data-copy="${esc(a.value)}">${esc(a.label)}</button>`;
    if (a.kind === 'download') return `<button class="${cls}" type="button" data-dl="${i}">${esc(a.label)}</button>`;
    return '';
  });
  if (v === 'danger' && p.kind === 'url') { // the way out is the main action; nothing that helps open the link stands out
    const copy = p.actions.find(a => a.kind === 'copy');
    acts.length = 0;
    acts.push(cur.source === 'camera' ? `<button class="btn primary" type="button" data-act="cam">Scan another code</button>` : `<button class="btn primary" type="button" data-act="file">Choose another image</button>`);
    if (copy) acts.push(`<button class="textlink" type="button" data-copy="${esc(copy.value)}">Copy link</button>`);
    const open = p.actions.find(a => a.kind === 'open');
    if (open) acts.push(`<button class="textlink" type="button" data-arm="${esc(open.href)}">Open anyway…</button>`);
  } else if (cur.source === 'camera') acts.push(`<button class="btn" type="button" data-act="cam">Scan another</button>`);
  h += `<div class="actions">${acts.join('')}</div>`;
  // exact content
  const chars = [...r.text].length;
  const bad = r.text.includes('�') && r.bytes && r.bytes.length;
  h += `<details class="raw"${p.kind === 'text' || p.kind === 'empty' ? '' : ''}><summary>Exact content · ${chars.toLocaleString('en')} character${chars === 1 ? '' : 's'}</summary>
    <pre class="rawtext">${esc(C.revealInvisible(r.text)) || '<span class="lede">(empty)</span>'}</pre>
    ${bad ? `<pre class="rawtext" aria-label="Raw bytes">${esc(C.hexDump(new Uint8Array(r.bytes)))}</pre>` : ''}
    <div class="rawbar"><span>${esc(C.describeSymbol(r))}${cur.label && !cur.example ? ' · ' + esc(cur.label) : ''}</span>${copyBtn(r.text, 'Copy exact content')}</div></details>`;
  if (cur.example) h += `<p class="example-note">This is an example. Scan with the camera, choose an image, or paste a screenshot.</p>`;
  result.className = 'result v-' + v;
  result.innerHTML = h;
  if (fresh) {
    void result.offsetWidth; result.classList.add('flash');
    say((n > 1 ? `${n} codes found. ` : 'Found: ') + p.label + (p.kind === 'url' && p.url.openable ? (v === 'danger' ? ', likely fake, really goes to ' + p.url.hostUnicode : ', opens ' + p.url.hostUnicode) : p.title ? ', ' + p.title.slice(0, 120) : ''));
    if (!cur.example && matchMedia('(max-width:760px)').matches) result.scrollIntoView({block: 'nearest', behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
  }
}
function renderWaiting() {
  result.className = 'result';
  result.innerHTML = `<p class="chip none"><i></i>Waiting for a code</p><p class="big">Point the camera at a QR code</p>
    <ul class="tips"><li>Hold it 10–30 cm away so the whole code is in the frame.</li><li>It is read the moment it is sharp; nothing to press.</li></ul>`;
}
function showFailure(f) {
  if (!f.keepImage) { current = null; shot.innerHTML = `<div class="blank">No picture to show</div>`; caption.textContent = f.label || ''; stage.classList.remove('compact', 'example'); stage.classList.add('none'); }
  result.className = 'result v-danger';
  result.innerHTML = `<p class="chip danger"><i></i>Nothing read</p><p class="big">${esc(f.title)}</p>
    <ul class="tips">${f.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    <div class="actions"><button class="btn primary" type="button" data-act="file">Choose another image</button><button class="btn" type="button" data-act="cam">Use camera</button></div>
    ${f.note ? `<p class="example-note">${esc(f.note)}</p>` : ''}`;
  say(f.title);
}

// ---------- result interactions ----------
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { /* none */ }
    ta.remove(); toast(ok ? 'Copied' : 'Copy failed: select the text and copy it');
  }
}
function download(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([file.data], {type: file.mime}));
  a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
result.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.copy !== undefined) return copyText(t.dataset.copy);
  if (t.dataset.dl !== undefined) return download(current.results[current.sel].parsed.actions[+t.dataset.dl].file);
  if (t.dataset.pick !== undefined) { current.sel = +t.dataset.pick; drawStage(); renderResult(false); result.querySelector(`[data-pick="${current.sel}"]`).focus(); return; }
  if (t.dataset.reveal !== undefined) { t.nextElementSibling.hidden = false; t.remove(); return; }
  if (t.dataset.arm !== undefined) {
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Press again to open ' + current.results[current.sel].parsed.url.hostUnicode; return; }
    window.open(t.dataset.arm, '_blank', 'noopener,noreferrer'); return;
  }
  if (t.dataset.act === 'file') return $('file').click();
  if (t.dataset.act === 'cam') return startCamera();
});
result.addEventListener('keydown', e => {
  const t = e.target; if (!t.dataset || t.dataset.pick === undefined) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    const n = current.results.length; current.sel = (current.sel + (e.key === 'ArrowRight' ? 1 : n - 1)) % n;
    drawStage(); renderResult(false); result.querySelector(`[data-pick="${current.sel}"]`).focus();
  }
});

// ---------- inputs ----------
$('btnCam').onclick = () => { startWorker(); camera ? stopCamera() : startCamera(); };
$('btnFile').onclick = () => { startWorker(); $('file').click(); };
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) readBlob(f, f.name, 'image'); };
$('btnPaste').onclick = async () => {
  startWorker();
  if (!navigator.clipboard || !navigator.clipboard.read) { toast('Press Ctrl+V (or ⌘V) to paste a screenshot'); return; }
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) {
      const type = it.types.find(t => t.startsWith('image/'));
      if (type) return readBlob(await it.getType(type), 'Pasted image', 'paste');
    }
    toast('The clipboard has no image. Copy a screenshot or image first.');
  } catch (e) { toast('Paste was blocked. Press Ctrl+V (or ⌘V) instead.'); }
};
document.addEventListener('paste', e => {
  const items = e.clipboardData ? Array.from(e.clipboardData.items) : [];
  const it = items.find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (it) { e.preventDefault(); readBlob(it.getAsFile(), 'Pasted image', 'paste'); }
  else if (!/INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) toast('The clipboard has no image. Copy a screenshot or image first.');
});
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const f = Array.from(e.dataTransfer.files).find(x => !x.type || x.type.startsWith('image/')) || e.dataTransfer.files[0];
  if (f) readBlob(f, f.name, 'image');
});
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!camera && current && current.canvas) drawStage(); }, 120); });

// ---------- history ----------
const HKEY = 'scanHistory';
let hist = [];
try { hist = C.historyLoad(localStorage.getItem(HKEY)); } catch (e) { hist = []; }
function persist() { try { if (hist.length) localStorage.setItem(HKEY, JSON.stringify(hist)); else localStorage.removeItem(HKEY); } catch (e) { /* private mode */ } }
function saveHistory(text, format, source) { hist = C.historyAdd(hist, {text, format, source, timestamp: new Date().toISOString()}); persist(); renderHistory(); }
function when(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : d.toLocaleDateString([], {day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric'});
}
function renderHistory() {
  $('histCount').textContent = hist.length ? `(${hist.length})` : '';
  const body = $('histBody');
  if (!hist.length) { body.innerHTML = '<p class="empty">Codes you read appear here, on this device only.</p>'; return; }
  body.innerHTML = `<ol>${hist.map((e, i) => { const sm = C.summary(e.text, e.format);
    return `<li><button class="h-text" type="button" data-load="${i}">${esc(sm.line) || '(blank)'}</button>
    <span class="h-meta${sm.danger ? ' bad' : ''}">${esc(sm.label)}${e.timestamp ? ' · ' + esc(when(e.timestamp)) : ''}${e.source === 'camera' ? ' · camera' : e.source === 'paste' ? ' · pasted' : ''}</span>
    <button class="x h-del" type="button" data-del="${i}" aria-label="Remove ${esc(sm.line.slice(0, 60))} from recent scans">×</button></li>`; }).join('')}</ol>
    <div class="h-foot"><span>Kept in this browser only.</span><button class="mini" type="button" data-clear>Clear all</button></div>`;
}
$('histBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.load !== undefined) {
    const en = hist[+t.dataset.load]; stopCamera(true);
    current = {canvas: null, label: 'Recent scan', source: en.source, results: [{text: en.text, format: en.format, position: null, version: '', ecLevel: '', parsed: C.parse(en.text, {format: en.format})}], sel: 0, example: false};
    shot.innerHTML = `<div class="blank">From recent scans${en.timestamp ? ', ' + esc(when(en.timestamp)) : ''}</div>`; caption.textContent = 'Recent scan'; stage.classList.remove('compact', 'example');
    renderResult(true); result.focus({preventScroll: true}); if (matchMedia('(max-width:760px)').matches) result.scrollIntoView({block: 'start'});
  } else if (t.dataset.del !== undefined) {
    hist.splice(+t.dataset.del, 1); persist(); renderHistory(); toast('Removed');
    const next = $('histBody').querySelector('.h-del') || $('history').querySelector('summary'); next.focus();
  } else if (t.dataset.clear !== undefined) {
    if (t.dataset.sure) { hist = []; persist(); renderHistory(); toast('Recent scans cleared'); $('history').querySelector('summary').focus(); }
    else { t.dataset.sure = '1'; t.textContent = 'Press again to clear all'; }
  }
});
renderHistory();

// ---------- example ----------
// A real QR code (version 2-M, a café's guest Wi-Fi) drawn from its module rows, so the example on
// arrival is the exact output of the reader for this picture.
const EXAMPLE_TEXT = 'WIFI:T:WPA;S:Café Guest;P:espresso2go;;';
const EXAMPLE_ROWS = ["11111110001110101010101111111","10000010010011000110101000001","10111010101011101101101011101","10111010110011011110101011101","10111010101000101001001011101","10000010101011010000101000001","11111110101010101010101111111","00000000110111101001100000000","10111110010011010010101111100","11101001010010100010101011001","10100111000100011110000010101","11000100110010000101111111001","10000111000100011110110001111","00101001001001001010100001111","10011110001111100100100100100","01011000111111001011111011100","01000111010010111000100100100","11001101101100000001111011011","10010010110010011100001110010","10010101011100101000110111001","10001010010010011110111110111","00000000100001100000100011100","11111110010101111100101011100","10000010101101001000100011000","10111010110000111010111110000","10111010100101011010110100010","10111010100010010100001001010","10000010001110101001011101111","11111110111000110110111010110"];
(function example() {
  const n = EXAMPLE_ROWS.length, q = 3, s = 8, W = (n + 2 * q) * s;
  const cv = document.createElement('canvas'); cv.width = cv.height = W;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, W); g.fillStyle = '#000';
  EXAMPLE_ROWS.forEach((row, y) => { for (let x = 0; x < n; x++) if (row[x] === '1') g.fillRect((x + q) * s, (y + q) * s, s, s); });
  const a = q * s, b = (q + n) * s;
  current = {canvas: cv, label: 'Example', source: 'example', example: true, sel: 0,
    results: [{text: EXAMPLE_TEXT, format: 'QRCode', version: String((n - 17) / 4), ecLevel: 'M', position: {topLeft: {x: a, y: a}, topRight: {x: b, y: a}, bottomRight: {x: b, y: b}, bottomLeft: {x: a, y: b}}}]};
  current.results[0].parsed = C.parse(EXAMPLE_TEXT);
  drawStage(); renderResult(false);
})();
// Warm the decoder once the page is idle, so the first real scan is instant.
(window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => askWorker({warm: true}));
})();
</script>
<script src="../logo.js" data-position="top-right"></script>
</body>
