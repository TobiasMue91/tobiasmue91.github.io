<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base64 Decode and Encode – Text and Files, Online</title>
<meta name="description" content="Decode or encode Base64 as you type: UTF-8 text, URL-safe Base64, data URIs and files of any size. Shows images and binary as a preview or hex dump. Nothing leaves your browser.">
<style>
:root{
  --bg:#f6f5f1;--panel:#fff;--ink:#1d1f22;--muted:#5d636b;--line:#d9d6cd;--soft:#efede6;
  --accent:#0d6b5e;--accent-ink:#fff;--err:#b3261e;--err-bg:#fdecea;--note:#7a5a00;--note-bg:#fff6dc;--flash:#cfeee6;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141619;--panel:#1c1f23;--ink:#e8e6e1;--muted:#a1a6ad;--line:#33373d;--soft:#24282d;
  --accent:#5fc9b4;--accent-ink:#0b1714;--err:#ff8a80;--err-bg:#3a1d1b;--note:#f0c96a;--note-bg:#33290f;--flash:#1f4a42;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);font:600 14px var(--sans);padding:8px 16px;cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.card.result{order:2}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);min-height:46px;flex-wrap:wrap}
.bar label.t,.bar .t{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bar .sp{flex:1}
.count{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
textarea{width:100%;border:0;resize:vertical;background:transparent;color:var(--ink);font:14px/1.5 var(--mono);padding:12px;min-height:190px;outline:none;word-break:break-all;overflow-wrap:anywhere}
.card:focus-within{border-color:var(--accent)}
.out{font:14px/1.5 var(--mono);padding:12px;min-height:190px;max-height:60vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;transition:background-color .5s ease}
.out.text{word-break:normal;overflow-wrap:anywhere}
.out.flash{background:var(--flash);transition:none}
.out .ph{color:var(--muted);font-family:var(--sans);word-break:normal}
.out details.hex summary{cursor:pointer;color:var(--muted);font:13px var(--sans);margin-bottom:6px}
.out pre{margin:0;font:11.5px/1.5 var(--mono);white-space:pre;overflow-x:auto}
.out img{display:block;max-width:100%;min-width:64px;image-rendering:pixelated;max-height:260px;margin:0 0 10px;border:1px solid var(--line);background:repeating-conic-gradient(var(--soft) 0 25%,transparent 0 50%) 0 0/16px 16px}
.kind{display:inline-block;font:600 12px var(--sans);padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--sans);padding:7px 12px;border-radius:7px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled,.btn.primary:disabled{opacity:1;background:var(--soft);border-color:var(--line);color:var(--muted);cursor:default}
.ex{font:600 11px var(--sans);padding:2px 7px;border-radius:99px;background:var(--note-bg);color:var(--note);text-transform:uppercase;letter-spacing:.05em}
button:focus-visible,.btn:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13.5px}.msg:not(:empty){padding:10px 12px 0}
textarea[aria-invalid=true]{box-shadow:inset 3px 0 0 var(--err)}
.msg .e{color:var(--err);background:var(--err-bg);display:block;padding:7px 10px;border-radius:6px}
.msg .n{color:var(--note);background:var(--note-bg);display:block;padding:7px 10px;border-radius:6px}
.msg .n button,.msg .e button{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
mark.bad{background:var(--err);color:#fff;border-radius:2px}
.foot{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);align-items:center}
details.opts{padding:0 12px 10px}
details.opts summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0;list-style-position:inside}
.optrow{display:flex;flex-wrap:wrap;gap:10px 18px;padding-top:6px;font-size:14px}
.optrow label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.optrow select{font:14px var(--sans);padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font:600 20px var(--sans);color:var(--ink);z-index:9}
.drop.on{display:flex}
.prog{display:none;align-items:center;gap:10px;padding:12px}
.prog.on{display:flex}
progress{flex:1;height:8px;accent-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .wrap{padding:10px 12px 30px}header{margin-bottom:8px}h1{font-size:17px}
  textarea{min-height:112px;height:112px;padding:10px}.out{min-height:110px;max-height:52vh;padding:10px}
  .bar{padding:6px 8px;min-height:40px;gap:6px}.btn{padding:6px 10px;min-height:34px}
  .bar .t{font-size:12px}.bar .count{display:none}.trust .more{display:none}
}
.trust{font-size:13.5px;color:var(--muted);margin:-2px 2px 12px}
@media (prefers-reduced-motion:reduce){.out,.out.flash{transition:none}.out.flash{background:inherit}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Base64 <span id="h-mode">Decode</span> <small>and <span id="h-other">encode</span></small></h1>
    <div class="seg" role="group" aria-label="Direction">
      <button type="button" id="m-dec" aria-pressed="true">Decode</button>
      <button type="button" id="m-enc" aria-pressed="false">Encode</button>
    </div>
  </header>

  <p class="trust">Runs entirely in this page – nothing you enter is sent anywhere. <span class="more">Standard Base64 (RFC 4648); decoding also takes URL-safe text, missing padding, line breaks and data: URIs.</span></p>
  <div class="grid">
    <section class="card" aria-labelledby="in-label">
      <div class="bar">
        <label class="t" id="in-label" for="input">Base64 to decode</label> <span class="ex" id="ex-chip">Example</span>
        <span class="sp"></span>
        <span class="count" id="in-count"></span>
        <label class="btn" id="file-btn" tabindex="0">File…<input type="file" id="file" class="sr" tabindex="-1"></label>
        <button type="button" class="btn" id="clear">Clear</button>
      </div>
      <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="in-msg"></textarea>
      <details class="opts" id="opts">
        <summary>Options</summary>
        <div class="optrow">
          <label title="Text is turned into bytes with this encoding before Base64, and decoded bytes are read with it">Text encoding
            <select id="charset"><option value="utf-8">UTF-8</option><option value="latin1">ISO-8859-1 (Latin-1)</option><option value="utf-16le">UTF-16LE</option></select></label>
          <label class="enc-only"><input type="checkbox" id="urlsafe"> URL-safe (- and _)</label>
          <label class="enc-only"><input type="checkbox" id="pad" checked> Padding (=)</label>
          <label class="enc-only"><input type="checkbox" id="wrap"> Wrap at 76 (MIME)</label>
          <label class="enc-only"><input type="checkbox" id="datauri"> Files as data: URI</label>
        </div>
      </details>
    </section>

    <section class="card result" aria-labelledby="out-label">
      <div class="bar">
        <span class="t" id="out-label">Decoded text</span>
        <span class="sp"></span>
        <span class="count" id="out-count"></span>
        <button type="button" class="btn primary" id="copy">Copy</button>
        <button type="button" class="btn" id="dl">Download</button>
        <button type="button" class="btn" id="swap" title="Swap: use the result as input and flip the direction" aria-label="Swap: use the result as input">⇄ Swap</button>
      </div>
      <div class="msg" id="in-msg" aria-live="polite"></div>
      <div class="prog" id="prog"><progress id="pbar" max="1" value="0"></progress><span class="count" id="ptext"></span><button type="button" class="btn" id="cancel">Cancel</button></div>
      <div class="out" id="out" tabindex="0" aria-labelledby="out-label"></div>
      <div class="foot" id="foot"></div>
    </section>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>
<div class="drop" id="drop">Drop a file to encode it</div>

  var $ = function (id) { return document.getElementById(id); };
  var input = $('input'), out = $('out'), inMsg = $('in-msg'), foot = $('foot'), live = $('live');
  var EXAMPLE = {dec: 'eyJ1c2VyIjoiSsO2cmciLCJyb2xlIjoiZWRpdG9yIiwiZXhwIjoxNzY3MjI1NjAwfQ==', enc: '{"user":"Jörg","role":"editor","exp":1767225600}'};
  var SETTINGS_KEY = 'b64tool.settings', DRAFT_KEY = 'b64tool.draft';
  var BIG = 200000; // characters/bytes beyond which work moves to a Worker

  var st = {mode: 'dec', charset: 'utf-8', urlSafe: false, pad: true, wrap: false, dataUri: false};
  var result = null;       // {kind:'text'|'binary'|'b64', text?, bytes?, mime?, ext?}
  var file = null;         // {name, type, bytes} when the input is a file being encoded
  var isExample = true, worker = null, jobId = 0, autoSwitched = false, objUrl = null;

  try { Object.assign(st, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) {}
  function save() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(st)); } catch (e) {} }
  function saveDraft() { try { if (isExample || file) sessionStorage.removeItem(DRAFT_KEY); else sessionStorage.setItem(DRAFT_KEY, input.value.length < 2e5 ? input.value : ''); } catch (e) {} }

  // Replace the textarea's text while keeping the browser's undo history where possible.
  function setInput(v) {
    input.focus();
    input.select();
    var ok = false;
    try { ok = document.execCommand('insertText', false, v); } catch (e) {}
    if (!ok || input.value !== v) input.value = v;
  }

  function renderMode() {
    var dec = st.mode === 'dec';
    $('m-dec').setAttribute('aria-pressed', dec); $('m-enc').setAttribute('aria-pressed', !dec);
    $('h-mode').textContent = dec ? 'Decode' : 'Encode'; $('h-other').textContent = dec ? 'encode' : 'decode';
    $('in-label').textContent = file ? 'File to encode' : dec ? 'Base64 to decode' : 'Text to encode';
    document.querySelectorAll('.enc-only').forEach(function (el) { el.style.display = dec ? 'none' : ''; });
    $('drop').textContent = dec ? 'Drop a file to read it as Base64 text' : 'Drop a file to encode it';
    $('charset').value = st.charset; $('urlsafe').checked = st.urlSafe; $('pad').checked = st.pad; $('wrap').checked = st.wrap; $('datauri').checked = st.dataUri;
  }

  function escapeHtml(s) { return s.replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }

  // The page shows at most SHOW characters; Copy and Download always take the whole result.
  var SHOW = 200000;
  function showText(t) {
    out.textContent = t.length > SHOW ? t.slice(0, SHOW) : t;
    if (t.length > SHOW) { var m = document.createElement('p'); m.className = 'ph'; m.textContent = '… ' + C.plural(t.length - SHOW, 'more character') + ' not shown. Copy and Download take all of it.'; out.appendChild(m); }
  }

  function flash() {
    out.classList.remove('flash'); void out.offsetWidth; out.classList.add('flash');
    setTimeout(function () { out.classList.remove('flash'); }, 60);
  }

  function setButtons(on, binary) {
    $('copy').disabled = !on; $('dl').disabled = !on; $('swap').disabled = !on;
    $('swap').hidden = !!binary;
    $('copy').textContent = binary ? 'Copy hex' : 'Copy';
    $('copy').classList.toggle('primary', !binary); $('dl').classList.toggle('primary', !!binary);
    $('dl').textContent = binary && result && result.ext ? 'Download .' + result.ext : 'Download';
    $('swap').textContent = st.mode === 'dec' ? '⇄ Encode this' : '⇄ Decode this';
  }

  function showError(msg, index) {
    var v = input.value, html = '<span class="e" role="alert">' + escapeHtml(msg);
    if (index != null && index >= 0 && v.length > 1) {
      var a = Math.max(0, index - 18), b = Math.min(v.length, index + 18);
      html += '<br><code style="word-break:break-all">' + (a ? '…' : '') + escapeHtml(v.slice(a, index)) + '<mark class="bad">' + escapeHtml(String.fromCodePoint(v.codePointAt(index)) || ' ') + '</mark>' + escapeHtml(v.slice(index + (v.codePointAt(index) > 0xffff ? 2 : 1), b)) + (b < v.length ? '…' : '') + '</code>';
    }
    inMsg.innerHTML = html + '</span>';
    input.setAttribute('aria-invalid', 'true');
    // No stale result on screen: a stranger skimming must never copy an answer to a different input.
    result = null; if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
    out.className = 'out'; out.innerHTML = '<span class="ph">No result yet – fix the marked spot in the input and it appears here.</span>';
    $('out-count').textContent = ''; foot.textContent = 'Nothing to copy until the input is valid.'; setButtons(false);
    live.textContent = msg;
  }
  function clearError() { input.removeAttribute('aria-invalid'); }

  function note(html) { inMsg.innerHTML = html ? '<span class="n">' + html + '</span>' : ''; }

  function render(r, notes) {
    clearError();
    result = r;
    if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
    var label = $('out-label'), parts = [];
    if (r.kind === 'empty') {
      out.className = 'out'; out.innerHTML = '<span class="ph">' + (st.mode === 'dec' ? 'Paste Base64 on the left – the decoded text appears here.' : 'Type or paste text, or drop a file – the Base64 appears here.') + '</span>';
      label.textContent = st.mode === 'dec' ? 'Decoded text' : 'Base64';
      $('out-count').textContent = ''; foot.textContent = ''; setButtons(false); live.textContent = '';
      return;
    }
    if (r.kind === 'b64') {
      out.className = 'out'; showText(r.text);
      label.textContent = 'Base64';
      $('out-count').textContent = C.plural(r.text.length, 'char');
      parts.push(C.plural(r.inBytes, 'byte') + ' → ' + C.plural(r.text.length, 'character'));
      parts.push((st.urlSafe ? 'URL-safe' : 'standard') + ' alphabet' + (st.pad ? '' : ', no padding') + (st.wrap ? ', 76-char lines' : ''));
      if (!file) parts.push('text as ' + $('charset').selectedOptions[0].textContent);
      if (!file && /^\s|\s$/.test(input.value)) parts.push('includes leading/trailing spaces or line breaks – they are encoded too');
      setButtons(true, false);
      live.textContent = 'Encoded ' + C.plural(r.inBytes, 'byte') + '.';
    } else if (r.kind === 'text') {
      out.className = 'out text'; showText(r.text || '');
      if (!r.text) out.innerHTML = '<span class="ph">Decodes to nothing (0 bytes).</span>';
      label.textContent = 'Decoded text';
      $('out-count').textContent = C.plural(r.bytes.length, 'byte');
      parts.push(C.plural(r.bytes.length, 'byte') + ' read as ' + $('charset').selectedOptions[0].textContent);
      setButtons(r.bytes.length > 0, false);
      live.textContent = 'Decoded ' + C.plural(r.bytes.length, 'byte') + ' of text.';
    } else {
      var sn = C.sniff(r.bytes);
      var mime = sn ? sn.mime : r.mime || 'application/octet-stream';
      r.ext = sn ? sn.ext : r.mime ? C.extFor(r.mime) : 'bin';
      r.mime = mime;
      out.className = 'out';
      var head = '<p style="margin:0 0 10px;font-family:var(--sans)"><span class="kind">' + escapeHtml(sn ? sn.label : r.mime && r.mime !== 'application/octet-stream' ? r.mime : 'Binary data') + '</span> ' +
        C.plural(r.bytes.length, 'byte') + (sn ? '' : ' – not readable as ' + $('charset').selectedOptions[0].textContent + ' text') + '. Download saves the exact bytes.</p>';
      var img = '';
      if (/^image\//.test(mime)) {
        objUrl = URL.createObjectURL(new Blob([r.bytes], {type: mime}));
        img = '<img alt="Preview of the decoded image" src="' + objUrl + '">';
      }
      var narrow = innerWidth < 600;
      out.innerHTML = head + img + '<details class="hex"' + '' + '><summary>Hex dump</summary><pre>' + escapeHtml(C.hexdump(r.bytes, 512, narrow ? 8 : 16)) + '</pre></details>';
      label.textContent = 'Decoded';
      $('out-count').textContent = C.plural(r.bytes.length, 'byte');
      parts.push(sn ? 'Detected as ' + sn.label + ' from its first bytes' : r.mime ? 'Type taken from the data: URI' : 'Type unknown');
      setButtons(true, true);
      live.textContent = 'Decoded ' + C.plural(r.bytes.length, 'byte') + ' of ' + (sn ? sn.label : 'binary data') + '.';
    }
    if (notes && notes.length) parts.push(notes.join(' · '));
    foot.textContent = parts.join(' · ');
    flash();
  }

  // ---- processing ----------------------------------------------------------------------------
  function process() {
    jobId++;
    if (worker) { worker.terminate(); worker = null; showProgress(false); }
    var v = input.value;
    $('ex-chip').hidden = !isExample;
    $('in-count').textContent = file ? C.plural(file.bytes.length, 'byte') + ' · ' + file.name : v ? C.plural(v.length, 'char') : '';
    if (st.mode === 'enc') {
      if (file) return runEncode(file.bytes, file.type);
      if (!v) { inMsg.innerHTML = ''; return render({kind: 'empty'}); }
      var tb = C.textToBytes(v, st.charset);
      if (tb.error) return showError(tb.error, tb.index);
      if (!autoSwitched) inMsg.innerHTML = '';
      return runEncode(tb.bytes, null);
    }
    if (!v.trim()) { inMsg.innerHTML = ''; return render({kind: 'empty'}); }
    if (v.length > BIG) return inWorker({op: 'decode', text: v});
    finishDecode(C.decode(v));
  }

  function runEncode(bytes, mime) {
    var opts = {urlSafe: st.urlSafe, pad: st.pad, wrap: st.wrap ? 76 : 0};
    var prefix = file && st.dataUri ? 'data:' + (mime || 'application/octet-stream') + ';base64,' : '';
    if (bytes.length > BIG) return inWorker({op: 'encode', bytes: bytes, opts: opts, prefix: prefix});
    render({kind: 'b64', text: prefix + C.encode(bytes, opts), inBytes: bytes.length});
  }

  function finishDecode(r) {
    if (r.error) return showError(r.error, r.index);
    if (!autoSwitched) note('');
    var txt = C.sniff(r.bytes) ? null : C.bytesToText(r.bytes, st.charset);
    if (txt != null && C.isReadable(txt)) render({kind: 'text', text: txt, bytes: r.bytes}, r.notes);
    else render({kind: 'binary', bytes: r.bytes, mime: r.mime}, r.notes);
  }

  var WORKER_SRC = $('core').textContent + '\n;onmessage=function(e){var d=e.data;' +
    'if(d.op==="encode"){var n=d.bytes.length,CH=3*1048576,parts=[];for(var s=0;s<n;s+=CH){parts.push(B64.encode(d.bytes.subarray(s,Math.min(n,s+CH)),{urlSafe:d.opts.urlSafe,pad:s+CH>=n?d.opts.pad:true}));postMessage({progress:Math.min(1,(s+CH)/n)});}' +
    'var t=parts.join("");if(d.opts.wrap){var L=[];for(var k=0;k<t.length;k+=d.opts.wrap)L.push(t.slice(k,k+d.opts.wrap));t=L.join("\\r\\n");}postMessage({done:{text:d.prefix+t,inBytes:n}});}' +
    'else{postMessage({progress:.5});var r=B64.decode(d.text);postMessage({done:r},r.bytes?[r.bytes.buffer]:[]);}};';
  var workerUrl = null;
  function inWorker(msg) {
    var id = jobId;
    if (!workerUrl) workerUrl = URL.createObjectURL(new Blob([WORKER_SRC], {type: 'text/javascript'}));
    worker = new Worker(workerUrl);
    showProgress(true, 0);
    worker.onmessage = function (e) {
      if (id !== jobId) return;
      if (e.data.progress != null) return showProgress(true, e.data.progress);
      showProgress(false); worker.terminate(); worker = null;
      if (msg.op === 'encode') render({kind: 'b64', text: e.data.done.text, inBytes: e.data.done.inBytes});
      else finishDecode(e.data.done);
    };
    worker.onerror = function () { showProgress(false); showError('Ran out of memory on this input. Try a smaller part.'); };
    worker.postMessage(msg);
  }
  function showProgress(on, p) {
    $('prog').classList.toggle('on', on);
    if (on) { $('pbar').value = p; $('ptext').textContent = Math.round(p * 100) + '%'; out.style.opacity = .35; }
    else out.style.opacity = 1;
  }
  $('cancel').onclick = function () {
    jobId++; if (worker) worker.terminate(); worker = null; showProgress(false);
    note('Cancelled. <button type="button" id="retry">Run it again</button>');
    $('retry').onclick = process;
  };

  var timer = null, draftTimer = null;
  function schedule() {
    clearTimeout(timer);
    var n = input.value.length;
    if (n < 50000) process(); else timer = setTimeout(process, 350);
  }

  // ---- input events --------------------------------------------------------------------------
  input.addEventListener('input', function () {
    isExample = false; autoSwitched = false;
    if (file) { file = null; renderMode(); }
    clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 500); schedule();
  });
  input.addEventListener('focus', function () { if (isExample) input.select(); });
  input.addEventListener('paste', function (e) {
    var t = e.clipboardData && e.clipboardData.getData('text');
    if (!t) return;
    var whole = isExample || input.selectionStart === 0 && input.selectionEnd === input.value.length || !input.value;
    if (whole && st.mode === 'enc' && C.looksLikeBase64(t)) {
      setTimeout(function () {
        setMode('dec', true); autoSwitched = true;
        note('This looks like Base64, so it is decoded. <button type="button" id="undo-switch">Encode it instead</button>');
        $('undo-switch').onclick = function () { autoSwitched = false; setMode('enc'); input.focus(); };
      }, 0);
    }
  });

  function setMode(m, keepNote) {
    if (st.mode === m) return;
    st.mode = m; save(); renderMode();
    if (!keepNote) { autoSwitched = false; note(''); }
    if (isExample) { input.value = EXAMPLE[m]; }
    process();
  }
  $('m-dec').onclick = function () { setMode('dec'); };
  $('m-enc').onclick = function () { setMode('enc'); };

  $('clear').onclick = function () {
    file = null; isExample = false; autoSwitched = false; renderMode(); setInput(''); note(''); saveDraft(); process(); input.focus();
  };

  ['charset', 'urlsafe', 'pad', 'wrap', 'datauri'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      st.charset = $('charset').value; st.urlSafe = $('urlsafe').checked; st.pad = $('pad').checked; st.wrap = $('wrap').checked; st.dataUri = $('datauri').checked;
      save(); process();
    });
  });

  $('swap').onclick = function () {
    if (!result || result.kind === 'binary' || result.kind === 'empty') return;
    var t = result.text, m = st.mode === 'dec' ? 'enc' : 'dec';
    file = null; isExample = false; autoSwitched = false;
    st.mode = m; save(); renderMode(); note('');
    setInput(t); saveDraft(); process();
  };

  // ---- copy & download ----------------------------------------------------------------------
  function outputText() { return result.kind === 'binary' ? C.hexdump(result.bytes, Infinity) : result.text; }
  $('copy').onclick = function () {
    if (!result || result.kind === 'empty') return;
    var t = outputText(), b = $('copy'), label = b.textContent;
    var done = function (ok) { b.textContent = ok ? 'Copied ✓' : 'Select and copy'; live.textContent = ok ? 'Copied to clipboard.' : 'Copy failed – select the result and copy it.'; setTimeout(function () { b.textContent = label; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { done(true); }, function () { done(fallbackCopy(t)); });
    else done(fallbackCopy(t));
  };
  function fallbackCopy(t) {
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = 0; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok;
  }
  $('dl').onclick = function () {
    if (!result || result.kind === 'empty') return;
    var blob, name;
    if (result.kind === 'b64') { blob = new Blob([result.text], {type: 'text/plain'}); name = (file ? file.name : 'encoded') + '.b64.txt'; }
    else if (result.kind === 'text') { blob = new Blob([result.bytes], {type: 'text/plain'}); name = 'decoded.txt'; }
    else { blob = new Blob([result.bytes], {type: result.mime}); name = 'decoded.' + result.ext; }
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  };

  // ---- files ---------------------------------------------------------------------------------
  function takeFile(f) {
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var bytes = new Uint8Array(rd.result);
      isExample = false; autoSwitched = false; note('');
      if (st.mode === 'dec') {
        // Decoding: the file holds Base64 text (a .txt or .b64 someone saved).
        var t = new TextDecoder().decode(bytes);
        file = null; renderMode(); setInput(t); saveDraft(); process();
        return;
      }
      file = {name: f.name, type: f.type || 'application/octet-stream', bytes: bytes};
      renderMode();
      input.value = ''; input.placeholder = f.name + ' (' + C.plural(bytes.length, 'byte') + ') – type here to encode text instead';
      saveDraft(); process();
    };
    rd.onerror = function () { showError('Could not read that file.'); };
    rd.readAsArrayBuffer(f);
  }
  $('file').addEventListener('change', function () { takeFile(this.files[0]); this.value = ''; });
  $('file-btn').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types, 'Files') >= 0) { dragDepth++; $('drop').classList.add('on'); } });
  window.addEventListener('dragleave', function () { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.remove('on'); } });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; $('drop').classList.remove('on');
    if (e.dataTransfer.files.length) takeFile(e.dataTransfer.files[0]);
  });

  // ---- start ---------------------------------------------------------------------------------
  if (st.mode !== 'enc') st.mode = 'dec';
  if (['utf-8', 'latin1', 'utf-16le'].indexOf(st.charset) < 0) st.charset = 'utf-8';
  var draft = null;
  try { draft = sessionStorage.getItem(DRAFT_KEY); } catch (e) {}
  renderMode();
  if (draft) { input.value = draft; isExample = false; } else input.value = EXAMPLE[st.mode];
  process();
})();
</script>
<script src="../logo.js" data-position="top-right"></script>
</body>
</html>
